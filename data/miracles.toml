# Signs and wonders: the record. Hand-written; every case names its sources and its strongest objection.
# grade: "strong" (a careful record exists and the facts recorded are not in doubt, though their meaning may be),
#        "disputed" (a real record, with serious unresolved objections),
#        "testimony" (eyewitness or secondhand report, not independently checked),
#        "negative" (studied with care and no effect was found).
# kind: "good" (a reported work of God), "evil" (reported activity of evil spirits), "study" (research on prayer or death).
# site/test/miracles.test.mjs checks every case has a grade, a kind, an objection and at least one https source.

intro = "Christians have always reported that God still heals and still answers, and that evil spirits are real. This page gathers the reported signs with the best records we could find, says how strong each record is, and gives the strongest objection to each. None of them is beyond dispute. Scripture itself warns that signs can deceive, so read them by its tests, below."

[[test]]
ref = "Deuteronomy 13:1 to 3"
href = "/bible/deuteronomy/13/#v1"
text = "If a prophet or dreamer of dreams arises among you and proclaims a sign or wonder to you, and if the sign or wonder he has spoken to you comes about, but he says, “Let us follow other gods (which you have not known) and let us worship them,” you must not listen to the words of that prophet or dreamer. For the LORD your God is testing you to find out whether you love Him with all your heart and with all your soul."

[[test]]
ref = "Matthew 24:24"
href = "/bible/matthew/24/#v24"
text = "For false Christs and false prophets will appear and perform great signs and wonders to deceive even the elect, if that were possible."

[[test]]
ref = "2 Thessalonians 2:9"
href = "/bible/2-thessalonians/2/#v9"
text = "The coming of the lawless one will be accompanied by the working of Satan, with every kind of power, sign, and false wonder,"

[[test]]
ref = "1 John 4:1"
href = "/bible/1-john/4/#v1"
text = "Beloved, do not believe every spirit, but test the spirits to see whether they are from God. For many false prophets have gone out into the world."

[[test]]
ref = "1 Thessalonians 5:21"
href = "/bible/1-thessalonians/5/#v21"
text = "but test all things. Hold fast to what is good."


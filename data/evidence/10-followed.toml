id = "what-followed"
title = "What followed"
short = "A crucified man with a few frightened friends outlived the empire that killed Him."
image = "gerome-martyrs-prayer"
intro = "Growth does not prove that a faith is true. But something set this going, and the lives it made are part of the evidence."

[verse]
ref = "Matthew 16:18"
href = "/bible/matthew/16/#v18"
text = "And I tell you that you are Peter, and on this rock I will build My church, and the gates of Hades will not prevail against it."

[[exhibit]]
id = "growth"
title = "From a room to an empire"
when = "AD 30 to 313"
grade = "strong"
summary = "Keith Hopkins worked out what a steady rate of growth would look like: about 7,000 Christians in the year 100, a little over 200,000 in 200, and six million, a tenth of the empire, in 300. He stressed that these are rough projections and not counts. They had no army and no power to compel anyone, and were at times punished with death. By 313 an emperor had taken their side."
shows = "Whatever the numbers, it grew for almost three centuries without the power to compel anyone."
objection = "Other faiths have spread quickly too. Hopkins explains the growth through networks, numbers and social change."
sources = [["Keith Hopkins, Christian number and its implications", "https://doi.org/10.1353/earl.1998.0035"]]

[[exhibit]]
id = "polycarp"
title = "Polycarp of Smyrna"
when = "About AD 155"
grade = "argued"
summary = "Polycarp, by early report a hearer of John, was an old man when the governor told him to curse Christ and go free. He was condemned to the fire, and the account says a dagger finished him."
quote = { text = "Eighty and six years have I served Him, and He never did me any injury: how then can I blaspheme my King and my Saviour?", by = "The Martyrdom of Polycarp 9", work = "martyrdom-of-polycarp", sec = "chapter-9" }
shows = "It presents itself as a letter from his own church, and is usually counted the oldest account of a martyr outside the New Testament."
objection = "Candida Moss and others argue that the account was shaped to echo the Passion, and perhaps written later."
sources = [["The Martyrdom of Polycarp", "/read/martyrdom-of-polycarp/"], ["Irenaeus, Against Heresies 3.3", "/read/irenaeus-against-heresies/"], ["Candida Moss, On the Dating of Polycarp", "https://doi.org/10.1628/186870310793597051"]]

[[exhibit]]
id = "lyons"
title = "Blandina of Lyons"
when = "About AD 177"
grade = "strong"
summary = "A letter from the churches of Lyons and Vienne tells how a crowd turned on the Christians there. Blandina, a slave, was tortured from morning until evening and would say only one thing."
quote = { text = "I am a Christian, and there is nothing vile done by us.", by = "Letter of the churches of Lyons and Vienne, in Eusebius, Church History 5.1", work = "eusebius-of-caesarea-church-history", sec = "book-5-chapter-1" }
shows = "Within a century and a half a slave in Gaul counted Christ worth more than her life."
objection = "Eusebius chose what to copy from the letter, and persecution in those years was local and on and off."
sources = [["Eusebius, Church History, book 5", "https://www.newadvent.org/fathers/250105.htm"]]

[[exhibit]]
id = "julian"
title = "Julian, the emperor who tried to end it"
when = "AD 362"
grade = "argued"
summary = "Julian was raised a Christian, left the faith and set out to restore the old gods. A letter under his name complains to one of his priests that Christians, whom it calls Galilaeans, were shaming them."
quote = { text = "when no Jew ever has to beg, and the impious Galilaeans support not only their own poor but ours as well, all men see that our people lack aid from us.", by = "Julian, Letter 22, translated by Wright", href = "https://archive.org/details/worksofemperorj03juli" }
shows = "If the letter is his, their most powerful enemy bore witness to how they loved."
objection = "Peter Van Nuffelen argued in 2002 that a Christian forged this letter, and Jean Bouffartigue answered in 2005 that it is prudent to keep it as genuine. If it is Julian's, he was urging his own side on and had reason to paint the contrast strongly."
sources = [["The Works of the Emperor Julian, volume 3", "https://archive.org/details/worksofemperorj03juli"], ["Van Nuffelen, Deux fausses lettres de Julien l'Apostat, 2002", "https://doi.org/10.1163/15700720260190776"], ["Bouffartigue, on the authenticity of the letter, 2005", "https://doi.org/10.3917/phil.792.0231"]]

[[exhibit]]
id = "children"
title = "They did not throw away children"
when = "First and second century"
grade = "strong"
summary = "Leaving unwanted babies to die was common and legal in the Roman world. Christian teaching forbade it."
quote = { text = "They marry, as do all [others]; they beget children; but they do not destroy their offspring.", by = "The Epistle to Diognetus 5", work = "epistle-to-diognetus", sec = "chapter-5" }
shows = "They believed their Maker had become a child, and from an early date their rule was to keep children."
objection = "These texts give the rule and cannot show how well it was kept. Jews refused as well, and before them, and a few pagans such as Musonius Rufus spoke against it."
sources = [["The Didache, chapter 2", "/read/didache/"], ["Infant exposure, Wikipedia", "https://en.wikipedia.org/wiki/Infant_exposure"], ["Josephus, Against Apion 2", "/read/josephus-against-apion/"], ["Musonius Rufus, Internet Encyclopedia of Philosophy", "https://iep.utm.edu/musonius/"]]

[[exhibit]]
id = "today"
title = "And still"
when = "2026"
grade = "settled"
summary = "More than two billion people are counted as Christians, and most of them now live in Africa, Asia and Latin America."
shows = "Psalm 22 ends with all the ends of the earth turning to the Lord. Christians read this as that promise being kept."
objection = "Numbers do not decide truth. Counts depend on the method: one puts the total at about 2.67 billion in 2026, and Pew puts it at 2.3 billion in 2020."
sources = [["Status of Global Christianity 2026, CSGC", "https://www.worldchristiandatabase.org/static/downloads/Status-of-Global-Christianity-2026.2b54be19fc0c.pdf"], ["Pew Research Center, 2010 to 2020", "https://www.pewresearch.org/religion/2025/06/09/how-the-global-religious-landscape-changed-from-2010-to-2020/"], ["Psalm 22:27", "/bible/psalms/22/#v27"]]

id = "the-prophets"
title = "The prophets"
short = "The Scriptures He said spoke of Him were old before He was born."
image = "isaiah-scroll-53"
intro = "The books quoted here are Jewish Scripture, kept by people who did not become Christians. The question is never whether they came first. It is whether they speak of Him."

[verse]
ref = "Isaiah 53:5"
href = "/bible/isaiah/53/#v5"
text = "But He was pierced for our transgressions, He was crushed for our iniquities; the punishment that brought us peace was upon Him, and by His stripes we are healed."

[[exhibit]]
id = "isaiah-scroll"
title = "The Great Isaiah Scroll"
when = "About 180 to 100 BC"
grade = "settled"
summary = "Found in a cave by the Dead Sea in 1947, this scroll holds the whole book of Isaiah, chapter 53 included. It was copied about a century or more before Jesus was born."
shows = "No Christian wrote the chapter about the suffering Servant after the fact."
objection = "An old copy proves the date of the words. It does not settle whom they mean."
sources = [["Isaiah Scroll, Wikipedia", "https://en.wikipedia.org/wiki/Isaiah_Scroll"], ["Times of Israel on the scroll", "https://www.timesofisrael.com/the-oldest-complete-biblical-scroll-ever-found-was-originally-split-in-2-scholar-finds/"]]

[[exhibit]]
id = "isaiah-53"
title = "The suffering Servant"
when = "Before the second century BC"
grade = "argued"
summary = "Isaiah 53 tells of a Servant who is despised, silent like a sheep before its shearers, pierced for the sins of others, killed, and assigned a grave with the wicked and with a rich man in His death, though He did no violence. Afterward He sees the light of life and makes many righteous."
shows = "Read it through and ask who it describes. Christians know of no one else who fits the whole portrait."
objection = "Isaiah 49:3 calls the Servant Israel, and many scholars, Jewish and Christian, hold that the chapter first spoke of Israel in exile or of the prophet himself. The reading of Israel is old: Origen met it in debate with Jewish scholars before AD 250. The ancient Targum calls the Servant the Messiah, but gives the sufferings to others. Critics also say the Gospels were written with the chapter in mind."
quote = { text = "He was assigned a grave with the wicked, and with a rich man in His death, although He had done no violence, nor was any deceit in His mouth.", by = "Isaiah 53:9", work = "bsb-isaiah", sec = "53" }
sources = [["Isaiah 53", "/bible/isaiah/53/"], ["Origen, Against Celsus 1.55", "/read/origen-against-celsus/"], ["Driver and Neubauer, Isaiah 53 according to the Jewish interpreters", "https://archive.org/details/fiftythirdchapte02neub"], ["Isaiah 53, history of interpretation, Wikipedia", "https://en.wikipedia.org/wiki/Isaiah_53"]]

[[exhibit]]
id = "psalm-22"
title = "The psalm of the cross"
when = "Centuries before Christ"
grade = "argued"
summary = "Psalm 22 opens with the cry Jesus gave on the cross. The sufferer is mocked, his bones are out of joint, his clothing is divided and lots are cast for it, and at the end the nations turn to the Lord."
shows = "Jesus took its first line on His lips at the cross, and the Gospels found the mocking and the divided clothing there too."
objection = "It is a lament and is not worded as a prediction. The line often translated “they have pierced my hands and feet” is disputed. Where that has “pierced,” the later Hebrew text has “like a lion,” the Greek has “they dug,” and a Dead Sea fragment is hard to make out. Some also say the Gospel writers shaped their telling to the psalm."
sources = [["Psalm 22", "/bible/psalms/22/"], ["They have pierced my hands and my feet, Wikipedia", "https://en.wikipedia.org/wiki/They_have_pierced_my_hands_and_my_feet"]]

[[exhibit]]
id = "daniel-9"
title = "The anointed one cut off"
when = "By the second century BC"
grade = "argued"
summary = "Daniel 9:26 says an anointed one will be cut off, and that afterward the city and the sanctuary will be destroyed. Jesus died around AD 30. Rome destroyed Jerusalem and the Temple in AD 70, and the Temple has not been rebuilt."
shows = "If this is the Messiah, and the destruction is that of AD 70, he had to come and die before AD 70."
objection = "Most critical scholars date the book to about 165 BC and read the anointed one as the high priest Onias III, killed about 171 BC, in the time of Antiochus. Schemes that work out the very day are overclaimed, and we do not use them."
sources = [["Daniel 9:26", "/bible/daniel/9/#v26"], ["Prophecy of Seventy Weeks, Wikipedia", "https://en.wikipedia.org/wiki/Prophecy_of_Seventy_Weeks"]]

[[exhibit]]
id = "zechariah"
title = "The king on a donkey, and the pierced one"
when = "By the second century BC"
grade = "argued"
summary = "Zechariah 9:9 sees a humble king come to Jerusalem riding a donkey. Zechariah 12:10 sees the people look on one they have pierced, and mourn. The Talmud connects 9:9 with the Messiah, and one opinion in it connects 12:10 with a second figure, the Messiah son of Joseph."
shows = "Jewish teachers who did not accept Jesus heard the Messiah in 9:9, and one of them heard a Messiah son of Joseph in 12:10."
objection = "A man who knew Zechariah could choose to ride a donkey. In 12:10 the Hebrew text is difficult, and the Talmud gives another view beside it."
sources = [["Zechariah 9:9", "/bible/zechariah/9/#v9"], ["Zechariah 12:10", "/bible/zechariah/12/#v10"], ["Sukkah 52a, Sefaria", "https://www.sefaria.org/Sukkah.52a"], ["Sanhedrin 98a, Sefaria", "https://www.sefaria.org/Sanhedrin.98a"]]

[[exhibit]]
id = "bethlehem"
title = "Out of Bethlehem"
when = "Micah, eighth century BC by tradition"
grade = "argued"
summary = "Micah 5:2 names Bethlehem as the place from which Israel's ruler will come. In John 7:42 the crowd expects the Christ to come from there."
shows = "Micah named the ruler's town centuries earlier, and John shows a crowd expecting the Christ from it. Matthew and Luke, who differ so much in their telling, both place the birth there."
objection = "Some hold that the Gospels placed the birth in Bethlehem because of Micah. In John the crowd raises Bethlehem against Jesus, because He came from Galilee, and John does not say He was born there. Luke's census is hard to fit with Josephus."
sources = [["Micah 5:2", "/bible/micah/5/#v2"], ["Micah 5:2, history of interpretation, Wikipedia", "https://en.wikipedia.org/wiki/Micah_5"], ["John 7:42", "/bible/john/7/#v42"]]

[[exhibit]]
id = "tel-dan"
title = "The house of David"
when = "Ninth century BC, found in 1993"
grade = "strong"
image = "tel-dan-stele"
summary = "An enemy king of Aram boasts on this stone of victories over Israel and over the house of David. Until it turned up, some held that David was a legend."
shows = "The royal line the prophets pointed to, and from which Jesus is said to come, was real."
objection = "A few scholars read the words another way. The stone says nothing about David himself."
sources = [["Miller, review of Athas, The Tel Dan Inscription, Journal of Hebrew Scriptures", "https://doi.org/10.5508/jhs.2007.v7.r7"], ["Tel Dan stele, Wikipedia", "https://en.wikipedia.org/wiki/Tel_Dan_stele"]]

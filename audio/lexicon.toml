# Pronunciation lexicon for the He Lives audiobooks.
#
# Each [[name]] lists a biblical or patristic name. Two uses:
#   respell   text the TTS model reads instead of `word`. Leave it empty unless a listening test
#             or the ASR check shows the model mispronounces the name; respellings change the
#             reading voice for every occurrence, so add them only with evidence (note it below).
#   variants  spellings Whisper may write for a correct reading; the WER check maps them to `word`
#             so a correctly spoken name is not counted as an error.
#
# Changing a respelling changes chunk text, so affected chunks re-render on the next batch.

[[name]]
word = "Melchizedek"
respell = ""
variants = ["Melchisedek", "Melchisedec", "Melchizedec", "Melkizedek"]

[[name]]
word = "Habakkuk"
respell = ""
variants = ["Habbakuk", "Habacuc", "Habakuk"]


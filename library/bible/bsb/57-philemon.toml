[[section]]
id = "1"
title = "Philemon 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "Greetings from Paul and Timothy" },
  { t = "ref", text = "(Philippians 1:1–2; Colossians 1:1–2)" },
  { t = "v", n = 1, p = true, text = "Paul, a prisoner of Christ Jesus, and Timothy our brother, To Philemon our beloved fellow worker," },
  { t = "v", n = 2, text = "to Apphia our sister, to Archippus our fellow soldier, and to the church that meets at your[^a] house:" },
  { t = "v", n = 3, p = true, text = "Grace and peace to you from God our Father and the Lord Jesus Christ." },
  { t = "h", level = 2, text = "Philemon’s Faith and Love" },
  { t = "v", n = 4, p = true, text = "I always thank my God, remembering you in my prayers," },
  { t = "v", n = 5, text = "because I hear about your faith in the Lord Jesus and your love for all the saints." },
  { t = "v", n = 6, text = "I pray that your partnership in the faith may become effective as you fully acknowledge every good thing that is ours in Christ." },
  { t = "v", n = 7, text = "I take great joy and encouragement in your love, because you, brother, have refreshed the hearts of the saints." },
  { t = "h", level = 2, text = "Paul’s Appeal for Onesimus" },
  { t = "v", n = 8, p = true, text = "So although in Christ I am bold enough to order you to do what is proper," },
  { t = "v", n = 9, text = "I prefer to appeal on the basis of love. For I, Paul, am now aged, and a prisoner of Christ Jesus as well." },
  { t = "v", n = 10, p = true, text = "I appeal to you for my child Onesimus,[^b] whose father I became while I was in chains." },
  { t = "v", n = 11, text = "Formerly he was useless to you, but now he has become useful both to you and to me." },
  { t = "v", n = 12, text = "I am sending back to you him who is my very heart." },
  { t = "v", n = 13, p = true, text = "I would have liked to keep him with me, so that on your behalf he could minister to me in my chains for the gospel." },
  { t = "v", n = 14, text = "But I did not want to do anything without your consent, so that your goodness will not be out of compulsion, but by your own free will." },
  { t = "v", n = 15, text = "For perhaps this is why he was separated from you for a while, so that you might have him back for good—" },
  { t = "v", n = 16, text = "no longer as a slave, but better than a slave, as a beloved brother. He is especially beloved to me, but even more so to you, both in person and in the Lord." },
  { t = "v", n = 17, p = true, text = "So if you consider me a partner, receive him as you would receive me." },
  { t = "v", n = 18, text = "But if he has wronged you in any way or owes you anything, charge it to my account." },
  { t = "v", n = 19, text = "I, Paul, write this with my own hand. I will repay it—not to mention that you owe me your very self." },
  { t = "v", n = 20, p = true, text = "Yes, brother, let me have some benefit[^c] from you in the Lord. Refresh my heart in Christ." },
  { t = "v", n = 21, p = true, text = "Confident of your obedience, I write to you, knowing that you will do even more than I ask." },
  { t = "v", n = 22, p = true, text = "In the meantime, prepare a guest room for me, because I hope that through your prayers I will be restored to you." },
  { t = "h", level = 2, text = "Additional Greetings" },
  { t = "v", n = 23, p = true, text = "Epaphras, my fellow prisoner in Christ Jesus, sends you greetings," },
  { t = "v", n = 24, text = "as do Mark, Aristarchus, Demas, and Luke, my fellow workers." },
  { t = "v", n = 25, p = true, text = "The grace of the Lord Jesus Christ be with your spirit.[^d]" },
  { t = "note", id = "a", text = "*You* and *Your* are singular throughout this letter, except in verses 3, 22, and 25." },
  { t = "note", id = "b", text = "*Onesimus* means *useful* (see verse 11) or *beneficial* (see verse 20)." },
  { t = "note", id = "c", text = "Greek *onaimēn*, a play on the name *Onesimus*" },
  { t = "note", id = "d", text = "BYZ and TR include *Amen.*" },
]

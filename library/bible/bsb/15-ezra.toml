[[section]]
id = "1"
title = "Ezra 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Proclamation of Cyrus" },
  { t = "ref", text = "(2 Chronicles 36:22–23; Isaiah 45:1–25)" },
  { t = "v", n = 1, p = true, text = "In the first year of Cyrus king of Persia, to fulfill the word of the LORD spoken through Jeremiah, the LORD stirred the spirit of Cyrus king of Persia to send a proclamation throughout his kingdom and to put it in writing as follows:" },
  { t = "v", n = 2, p = true, text = "“This is what Cyrus king of Persia says: ‘The LORD, the God of heaven, who has given me all the kingdoms of the earth, has appointed me to build a house for Him at Jerusalem in Judah." },
  { t = "v", n = 3, p = true, text = "Whoever among you belongs to His people, may his God be with him, and may he go to Jerusalem in Judah and build the house of the LORD, the God of Israel; He is the God who is in Jerusalem." },
  { t = "v", n = 4, text = "And let every survivor, wherever he lives, be assisted by the men of that region with silver, gold, goods, and livestock, along with a freewill offering for the house of God in Jerusalem.’”" },
  { t = "v", n = 5, p = true, text = "So the family heads of Judah and Benjamin, along with the priests and Levites—everyone whose spirit God had stirred—prepared to go up and rebuild the house of the LORD in Jerusalem." },
  { t = "v", n = 6, p = true, text = "And all their neighbors supported them with articles of silver and gold, with goods and livestock, and with valuables, in addition to all their freewill offerings." },
  { t = "h", level = 2, text = "Cyrus Restores the Holy Vessels" },
  { t = "v", n = 7, p = true, text = "King Cyrus also brought out the articles belonging to the house of the LORD that Nebuchadnezzar had carried away from Jerusalem and placed in the temple of his gods." },
  { t = "v", n = 8, text = "Cyrus king of Persia had them brought out by the hand of Mithredath the treasurer, who counted them out to Sheshbazzar the prince of Judah.[^a]" },
  { t = "v", n = 9, text = "This was the inventory: 30 gold dishes,[^b] 1,000 silver dishes, 29 silver utensils," },
  { t = "v", n = 10, indent = 1, p = true, text = "30 gold bowls, 410 matching silver bowls, and 1,000 other articles." },
  { t = "v", n = 11, p = true, text = "In all, there were 5,400 gold and silver articles. Sheshbazzar brought all these along when the exiles went up from Babylon to Jerusalem." },
  { t = "note", id = "a", text = "That is, the leader of the exiles returning to Judah" },
  { t = "note", id = "b", text = "Or *basins*; twice in this verse" },
]

[[section]]
id = "2"
title = "Ezra 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "The List of Returning Exiles" },
  { t = "ref", text = "(Nehemiah 7:4–69)" },
  { t = "v", n = 1, p = true, text = "Now these are the people of the province who came up from the captivity of the exiles carried away to Babylon by Nebuchadnezzar its king. They returned to Jerusalem and Judah, each to his own town," },
  { t = "v", n = 2, text = "accompanied by Zerubbabel, Jeshua, Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, and Baanah.[^a] This is the count of the men of Israel:" },
  { t = "v", n = 3, indent = 1, p = true, text = "the descendants of Parosh, 2,172;" },
  { t = "v", n = 4, indent = 1, p = true, text = "the descendants of Shephatiah, 372;" },
  { t = "v", n = 5, indent = 1, p = true, text = "the descendants of Arah, 775;" },
  { t = "v", n = 6, indent = 1, p = true, text = "the descendants of Pahath-moab (through the line of Jeshua and Joab), 2,812;" },
  { t = "v", n = 7, indent = 1, p = true, text = "the descendants of Elam, 1,254;" },
  { t = "v", n = 8, indent = 1, p = true, text = "the descendants of Zattu, 945;" },
  { t = "v", n = 9, indent = 1, p = true, text = "the descendants of Zaccai, 760;" },
  { t = "v", n = 10, indent = 1, p = true, text = "the descendants of Bani,[^b] 642;" },
  { t = "v", n = 11, indent = 1, p = true, text = "the descendants of Bebai, 623;" },
  { t = "v", n = 12, indent = 1, p = true, text = "the descendants of Azgad, 1,222;" },
  { t = "v", n = 13, indent = 1, p = true, text = "the descendants of Adonikam, 666;" },
  { t = "v", n = 14, indent = 1, p = true, text = "the descendants of Bigvai, 2,056;" },
  { t = "v", n = 15, indent = 1, p = true, text = "the descendants of Adin, 454;" },
  { t = "v", n = 16, indent = 1, p = true, text = "the descendants of Ater (through Hezekiah), 98;" },
  { t = "v", n = 17, indent = 1, p = true, text = "the descendants of Bezai, 323;" },
  { t = "v", n = 18, indent = 1, p = true, text = "the descendants of Jorah,[^c] 112;" },
  { t = "v", n = 19, indent = 1, p = true, text = "the descendants of Hashum, 223;" },
  { t = "v", n = 20, indent = 1, p = true, text = "the descendants of Gibbar,[^d] 95;" },
  { t = "v", n = 21, indent = 1, p = true, text = "the men[^e] of Bethlehem, 123;" },
  { t = "v", n = 22, indent = 1, p = true, text = "the men of Netophah, 56;" },
  { t = "v", n = 23, indent = 1, p = true, text = "the men of Anathoth, 128;" },
  { t = "v", n = 24, indent = 1, p = true, text = "the descendants of Azmaveth,[^f] 42;" },
  { t = "v", n = 25, indent = 1, p = true, text = "the men of Kiriath-jearim,[^g] Chephirah, and Beeroth, 743;" },
  { t = "v", n = 26, indent = 1, p = true, text = "the men of Ramah and Geba, 621;" },
  { t = "v", n = 27, indent = 1, p = true, text = "the men of Michmash, 122;" },
  { t = "v", n = 28, indent = 1, p = true, text = "the men of Bethel and Ai, 223;" },
  { t = "v", n = 29, indent = 1, p = true, text = "the descendants of Nebo, 52;" },
  { t = "v", n = 30, indent = 1, p = true, text = "the descendants of Magbish, 156;" },
  { t = "v", n = 31, indent = 1, p = true, text = "the descendants of the other Elam,[^h] 1,254;" },
  { t = "v", n = 32, indent = 1, p = true, text = "the descendants of Harim, 320;" },
  { t = "v", n = 33, indent = 1, p = true, text = "the men of Lod, Hadid, and Ono, 725;" },
  { t = "v", n = 34, indent = 1, p = true, text = "the men of Jericho, 345;" },
  { t = "v", n = 35, indent = 1, p = true, text = "and the descendants of Senaah, 3,630." },
  { t = "v", n = 36, p = true, text = "The priests: The descendants of Jedaiah (through the house of Jeshua), 973;" },
  { t = "v", n = 37, indent = 1, p = true, text = "the descendants of Immer, 1,052;" },
  { t = "v", n = 38, indent = 1, p = true, text = "the descendants of Pashhur, 1,247;" },
  { t = "v", n = 39, indent = 1, p = true, text = "and the descendants of Harim, 1,017." },
  { t = "v", n = 40, p = true, text = "The Levites: the descendants of Jeshua and Kadmiel (through the line of Hodaviah[^i]), 74." },
  { t = "v", n = 41, p = true, text = "The singers: the descendants of Asaph, 128." },
  { t = "v", n = 42, p = true, text = "The gatekeepers: the descendants of Shallum, the descendants of Ater, the descendants of Talmon, the descendants of Akkub, the descendants of Hatita, and the descendants of Shobai, 139 in all." },
  { t = "v", n = 43, p = true, text = "The temple servants:[^j] the descendants of Ziha, the descendants of Hasupha, the descendants of Tabbaoth," },
  { t = "v", n = 44, indent = 1, p = true, text = "the descendants of Keros, the descendants of Siaha,[^k] the descendants of Padon," },
  { t = "v", n = 45, indent = 1, p = true, text = "the descendants of Lebanah, the descendants of Hagabah, the descendants of Akkub," },
  { t = "v", n = 46, indent = 1, p = true, text = "the descendants of Hagab, the descendants of Shalmai,[^l] the descendants of Hanan," },
  { t = "v", n = 47, indent = 1, p = true, text = "the descendants of Giddel, the descendants of Gahar, the descendants of Reaiah," },
  { t = "v", n = 48, indent = 1, p = true, text = "the descendants of Rezin, the descendants of Nekoda, the descendants of Gazzam," },
  { t = "v", n = 49, indent = 1, p = true, text = "the descendants of Uzza, the descendants of Paseah, the descendants of Besai," },
  { t = "v", n = 50, indent = 1, p = true, text = "the descendants of Asnah, the descendants of Meunim, the descendants of Nephusim,[^m]" },
  { t = "v", n = 51, indent = 1, p = true, text = "the descendants of Bakbuk, the descendants of Hakupha, the descendants of Harhur," },
  { t = "v", n = 52, indent = 1, p = true, text = "the descendants of Bazluth,[^n] the descendants of Mehida, the descendants of Harsha," },
  { t = "v", n = 53, indent = 1, p = true, text = "the descendants of Barkos, the descendants of Sisera, the descendants of Temah," },
  { t = "v", n = 54, indent = 1, p = true, text = "the descendants of Neziah, and the descendants of Hatipha." },
  { t = "v", n = 55, p = true, text = "The descendants of the servants of Solomon: the descendants of Sotai, the descendants of Hassophereth, the descendants of Peruda,[^o]" },
  { t = "v", n = 56, indent = 1, p = true, text = "the descendants of Jaala, the descendants of Darkon, the descendants of Giddel," },
  { t = "v", n = 57, indent = 1, p = true, text = "the descendants of Shephatiah, the descendants of Hattil, the descendants of Pochereth-hazzebaim, and the descendants of Ami.[^p]" },
  { t = "v", n = 58, indent = 1, p = true, text = "The temple servants and descendants of the servants of Solomon numbered 392 in all." },
  { t = "v", n = 59, p = true, text = "The following came up from Tel-melah, Tel-harsha, Cherub, Addan,[^q] and Immer, but they could not prove that their families were descended from Israel:" },
  { t = "v", n = 60, indent = 1, p = true, text = "the descendants of Delaiah, the descendants of Tobiah, and the descendants of Nekoda, 652 in all." },
  { t = "v", n = 61, indent = 1, p = true, text = "And from among the priests: the descendants of Hobaiah, the descendants of Hakkoz, and the descendants of Barzillai (who had married a daughter of Barzillai the Gileadite and was called by their name)." },
  { t = "v", n = 62, indent = 1, p = true, text = "These men searched for their family records, but they could not find them and so were excluded from the priesthood as unclean." },
  { t = "v", n = 63, text = "The governor ordered them not to eat the most holy things until there was a priest to consult the Urim and Thummim.[^r]" },
  { t = "v", n = 64, p = true, text = "The whole assembly numbered 42,360," },
  { t = "v", n = 65, text = "in addition to their 7,337 menservants and maidservants, as well as their 200 male and female singers." },
  { t = "v", n = 66, text = "They had 736 horses, 245 mules," },
  { t = "v", n = 67, text = "435 camels, and 6,720 donkeys." },
  { t = "h", level = 2, text = "Offerings by the Exiles" },
  { t = "ref", text = "(Exodus 38:21–31; Nehemiah 7:70–73)" },
  { t = "v", n = 68, p = true, text = "When they arrived at the house of the LORD in Jerusalem, some of the heads of the families gave freewill offerings to rebuild the house of God on its original site." },
  { t = "v", n = 69, text = "According to their ability, they gave to the treasury for this work 61,000 darics of gold,[^s] 5,000 minas of silver,[^t] and 100 priestly garments." },
  { t = "v", n = 70, p = true, text = "So the priests, the Levites, the singers, the gatekeepers, and the temple servants, along with some of the people, settled in their own towns; and the rest of the Israelites[^u] settled in their towns." },
  { t = "note", id = "a", text = "Parallel text at Nehemiah 7:7 *accompanied by Zerubbabel, Jeshua, Nehemiah, Azariah, Raamiah, Nahamani, Mordecai, Bilshan, Mispereth, Bigvai, Nehum, and Baanah*" },
  { t = "note", id = "b", text = "*Bani* is a variant of *Binnui*; see Nehemiah 7:15." },
  { t = "note", id = "c", text = "*Jorah* is a variant of *Hariph*; see Nehemiah 7:24." },
  { t = "note", id = "d", text = "*Gibbar* is a variant of *Gibeon*; see Nehemiah 7:25." },
  { t = "note", id = "e", text = "Literally *the sons*; here and in verses 25, 26, 33, and 34" },
  { t = "note", id = "f", text = "*Azmaveth* is a variant of *Beth-azmaveth*; see Nehemiah 7:28." },
  { t = "note", id = "g", text = "LXX (see also Nehemiah 7:29); Hebrew *Kiriath-arim*" },
  { t = "note", id = "h", text = "Or *of West Elam*" },
  { t = "note", id = "i", text = "*Hodaviah* is a variant of *Hodevah*; see Nehemiah 7:43." },
  { t = "note", id = "j", text = "Hebrew *The Nethinim*; also in verses 58 and 70" },
  { t = "note", id = "k", text = "*Siaha* is a variant of *Sia*; see Nehemiah 7:47." },
  { t = "note", id = "l", text = "Alternate MT reading (see also Nehemiah 7:48); the other alternate reads *Shamlai*" },
  { t = "note", id = "m", text = "*Nephusim* is a variant of *Nephushesim*; see Nehemiah 7:52." },
  { t = "note", id = "n", text = "*Bazluth* is a variant of *Bazlith*; see Nehemiah 7:54." },
  { t = "note", id = "o", text = "*Peruda* is a variant of *Perida*; see Nehemiah 7:57." },
  { t = "note", id = "p", text = "*Ami* is a variant of *Amon*; see Nehemiah 7:59." },
  { t = "note", id = "q", text = "*Addan* is a variant of *Addon*; see Nehemiah 7:61." },
  { t = "note", id = "r", text = "Literally *Lights and Perfections*" },
  { t = "note", id = "s", text = "Or *61,000 gold drachmas*; that is, approximately 1,129.7 pounds or 512.4 kilograms of gold coins" },
  { t = "note", id = "t", text = "*5,000 minas* is approximately 3.14 tons or 2.85 metric tons of silver." },
  { t = "note", id = "u", text = "Or *all Israel*" },
]

[[section]]
id = "3"
title = "Ezra 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "Sacrifices Restored" },
  { t = "v", n = 1, p = true, text = "By the seventh month, the Israelites had settled in their towns, and the people assembled as one man in Jerusalem." },
  { t = "v", n = 2, p = true, text = "Then Jeshua son of Jozadak[^a] and his fellow priests, along with Zerubbabel son of Shealtiel and his associates, began to build the altar of the God of Israel to sacrifice burnt offerings on it, as it is written in the Law of Moses the man of God." },
  { t = "v", n = 3, text = "They set up the altar on its foundation and sacrificed burnt offerings on it to the LORD—both the morning and evening burnt offerings—even though they feared the people of the land." },
  { t = "v", n = 4, p = true, text = "They also celebrated the Feast of Tabernacles[^b] in accordance with what is written, and they offered burnt offerings daily based on the number prescribed for each day." },
  { t = "v", n = 5, p = true, text = "After that, they presented the regular burnt offerings and those for New Moons and for all the appointed sacred feasts of the LORD, as well as all the freewill offerings brought to the LORD." },
  { t = "v", n = 6, p = true, text = "On the first day of the seventh month, the Israelites began to offer burnt offerings to the LORD, although the foundation of the temple of the LORD had not been laid." },
  { t = "v", n = 7, text = "They gave money to the masons and carpenters, and food and drink and oil to the people of Sidon and Tyre to bring cedar logs from Lebanon to Joppa by sea, as authorized by Cyrus king of Persia." },
  { t = "h", level = 2, text = "Temple Restoration Begins" },
  { t = "v", n = 8, p = true, text = "In the second month of the second year after they had arrived at the house of God in Jerusalem, Zerubbabel son of Shealtiel, Jeshua son of Jozadak, and the rest of their associates including the priests, the Levites, and all who had returned to Jerusalem from the captivity, began the work. They appointed Levites twenty years of age or older to supervise the construction of the house of the LORD." },
  { t = "v", n = 9, text = "So Jeshua and his sons and brothers, Kadmiel and his sons (descendants of Yehudah),[^c] and the sons of Henadad and their sons and brothers—all Levites—joined together to supervise those working on the house of God." },
  { t = "v", n = 10, p = true, text = "When the builders had laid the foundation of the temple of the LORD, the priests in their apparel with trumpets, and the Levites (the sons of Asaph) with cymbals, took their positions to praise the LORD, as David king of Israel had prescribed." },
  { t = "v", n = 11, text = "And they sang responsively with praise and thanksgiving to the LORD: “For He is good; for His loving devotion[^d] to Israel endures forever.” Then all the people gave a great shout of praise to the LORD, because the foundation of the house of the LORD had been laid." },
  { t = "v", n = 12, p = true, text = "But many of the older priests, Levites, and family heads who had seen the first temple wept loudly when they saw the foundation of this temple. Still, many others shouted joyfully." },
  { t = "v", n = 13, text = "The people could not distinguish the shouts of joy from the sound of weeping, because the people were making so much noise. And the sound was heard from afar." },
  { t = "note", id = "a", text = "*Jozadak* is a variant of *Jehozadak*; also in verse 8; see 1 Chronicles 6:14." },
  { t = "note", id = "b", text = "That is, Sukkot, the autumn feast of pilgrimage to Jerusalem; also translated as *the Feast of Booths* or *the Feast of Shelters* and originally called *the Feast of Ingathering*(see Exodus 23:16 and Exodus 34:22)." },
  { t = "note", id = "c", text = "Hebrew *sons of Judah*; that is, most likely, *sons of Yehudah*, another name for *Hodevah* or *Hodaviah*; see Ezra 2:40 and Nehemiah 7:43." },
  { t = "note", id = "d", text = "Forms of the Hebrew *chesed* are translated here and in most cases throughout the Scriptures as *loving devotion*; the range of meaning includes *love*, *goodness*, *kindness*, *faithfulness*, and *mercy*, as well as *loyalty to a covenant*." },
]

[[section]]
id = "4"
title = "Ezra 4"
level = 1
blocks = [
  { t = "h", level = 2, text = "Adversaries Hinder the Work" },
  { t = "v", n = 1, p = true, text = "When the enemies of Judah and Benjamin heard that the exiles were building a temple for the LORD, the God of Israel," },
  { t = "v", n = 2, text = "they approached Zerubbabel and the heads of the families, saying, “Let us build with you because, like you, we seek your God and have been sacrificing to Him since the time of King Esar-haddon of Assyria, who brought us here.”" },
  { t = "v", n = 3, p = true, text = "But Zerubbabel, Jeshua, and the other heads of the families of Israel replied, “You have no part with us in building a house for our God, since we alone must build it for the LORD, the God of Israel, as Cyrus king of Persia has commanded us.”" },
  { t = "v", n = 4, p = true, text = "Then the people of the land set out to discourage the people of Judah and make them afraid to build." },
  { t = "v", n = 5, text = "They hired counselors against them to frustrate their plans throughout the reign of Cyrus king of Persia and down to the reign of Darius king of Persia." },
  { t = "h", level = 2, text = "Opposition under Xerxes and Artaxerxes" },
  { t = "v", n = 6, p = true, text = "At the beginning of the reign of Xerxes,[^a] an accusation was lodged against the people of Judah and Jerusalem." },
  { t = "v", n = 7, p = true, text = "And in the days of Artaxerxes king of Persia, Bishlam, Mithredath, Tabeel, and the rest of his associates wrote a letter to Artaxerxes. It was written in Aramaic and then translated.[^b]" },
  { t = "v", n = 8, p = true, text = "Rehum the commander and Shimshai the scribe wrote the letter against Jerusalem to King Artaxerxes as follows:" },
  { t = "v", n = 9, p = true, text = "From Rehum the commander, Shimshai the scribe, and the rest of their associates—the judges and officials over Tripolis, Persia, Erech and Babylon, the Elamites of Susa," },
  { t = "v", n = 10, text = "and the rest of the peoples whom the great and honorable Ashurbanipal[^c] deported and settled in the cities of Samaria and elsewhere west of the Euphrates.[^d]" },
  { t = "v", n = 11, p = true, text = "(This is the text of the letter they sent to him.) To King Artaxerxes, From your servants, the men west of the Euphrates:" },
  { t = "v", n = 12, p = true, text = "Let it be known to the king that the Jews who came from you to us have returned to Jerusalem and are rebuilding that rebellious and wicked city. They are restoring its walls and repairing its foundations." },
  { t = "v", n = 13, p = true, text = "Let it now be known to the king that if that city is rebuilt and its walls are restored, they will not pay tribute, duty, or toll, and the royal treasury will suffer." },
  { t = "v", n = 14, p = true, text = "Now because we are in the service of the palace[^e] and it is not fitting for us to allow the king to be dishonored, we have sent to inform the king" },
  { t = "v", n = 15, text = "that a search should be made of the record books of your fathers. In these books you will discover and verify that the city is a rebellious city, harmful to kings and provinces, inciting sedition from ancient times. That is why this city was destroyed." },
  { t = "v", n = 16, p = true, text = "We advise the king that if this city is rebuilt and its walls are restored, you will have no dominion west of the Euphrates." },
  { t = "h", level = 2, text = "The Decree of Artaxerxes" },
  { t = "v", n = 17, p = true, text = "Then the king sent this reply: To Rehum the commander, Shimshai the scribe, and the rest of your associates living in Samaria and elsewhere in the region west of the Euphrates: Greetings." },
  { t = "v", n = 18, p = true, text = "The letter you sent us has been translated and read in my presence." },
  { t = "v", n = 19, text = "I issued a decree, and a search was conducted. It was discovered that this city has revolted against kings from ancient times, engaging in rebellion and sedition." },
  { t = "v", n = 20, text = "And mighty kings have ruled over Jerusalem and exercised authority over the whole region west of the Euphrates; and tribute, duty, and toll were paid to them." },
  { t = "v", n = 21, p = true, text = "Now, therefore, issue an order for these men to stop, so that this city will not be rebuilt until I so order." },
  { t = "v", n = 22, text = "See that you do not neglect this matter. Why allow this threat to increase and the royal interests to suffer?" },
  { t = "v", n = 23, p = true, text = "When the text of the letter from King Artaxerxes was read to Rehum, Shimshai the scribe, and their associates, they went immediately to the Jews in Jerusalem and forcibly stopped them." },
  { t = "v", n = 24, p = true, text = "Thus the construction of the house of God in Jerusalem ceased, and it remained at a standstill until the second year of the reign of Darius king of Persia." },
  { t = "note", id = "a", text = "Hebrew *Ahasuerus*" },
  { t = "note", id = "b", text = "The original text of Ezra 4:8 through Ezra 6:18 is in Aramaic." },
  { t = "note", id = "c", text = "Aramaic *Osnappar*, another name for *Ashurbanipal*" },
  { t = "note", id = "d", text = "Aramaic *beyond the River*; also in verses 11, 16, 17, and 20" },
  { t = "note", id = "e", text = "Literally *because the salt of the palace is our salt*" },
]

[[section]]
id = "5"
title = "Ezra 5"
level = 1
blocks = [
  { t = "h", level = 2, text = "Temple Rebuilding Resumes" },
  { t = "ref", text = "(Haggai 1:1–11)" },
  { t = "v", n = 1, p = true, text = "Later, the prophets Haggai and Zechariah son of Iddo prophesied to the Jews in Judah and Jerusalem in the name of the God of Israel, who was over them." },
  { t = "v", n = 2, text = "Then Zerubbabel son of Shealtiel and Jeshua son of Jozadak[^a] rose up and began to rebuild the house of God in Jerusalem. And the prophets of God were with them, helping them." },
  { t = "v", n = 3, p = true, text = "At that time Tattenai the governor of the region west of the Euphrates,[^b] Shethar-bozenai, and their associates went to the Jews and asked, “Who authorized you to rebuild this temple and restore this structure?”" },
  { t = "v", n = 4, p = true, text = "They also asked,[^c] “What are the names of the men who are constructing this building?”" },
  { t = "v", n = 5, p = true, text = "But the eye of their God was on the elders of the Jews, so that they were not stopped until a report was sent to Darius and written instructions about this matter were returned." },
  { t = "h", level = 2, text = "Tattenai’s Letter to Darius" },
  { t = "v", n = 6, p = true, text = "This is the text of the letter that Tattenai the governor of the region west of the Euphrates, Shethar-bozenai, and their associates, the officials in the region, sent to King Darius." },
  { t = "v", n = 7, text = "The report they sent him read as follows: To King Darius: All peace." },
  { t = "v", n = 8, p = true, text = "Let it be known to the king that we went into the province of Judah, to the house of the great God. The people are rebuilding it with large stones and placing timbers in the walls. This work is being carried out diligently and is prospering in their hands." },
  { t = "v", n = 9, p = true, text = "So we questioned the elders and asked, “Who authorized you to rebuild this temple and restore this structure?”" },
  { t = "v", n = 10, p = true, text = "We also asked for their names, so that we could write down the names of their leaders[^d] for your information." },
  { t = "v", n = 11, p = true, text = "And this is the answer they returned: “We are servants of the God of heaven and earth, and we are rebuilding the temple that was built many years ago, which a great king of Israel built and completed." },
  { t = "v", n = 12, text = "But since our fathers angered the God of heaven, He delivered them into the hand of Nebuchadnezzar king of Babylon, the Chaldean who destroyed this temple and carried away the people to Babylon." },
  { t = "v", n = 13, p = true, text = "In the first year of his reign, however, Cyrus king of Babylon issued a decree to rebuild this house of God." },
  { t = "v", n = 14, text = "He also removed from the temple[^e] of Babylon the gold and silver articles belonging to the house of God, which Nebuchadnezzar had taken and carried there from the temple in Jerusalem. King Cyrus gave these articles to a man named Sheshbazzar, whom he appointed governor" },
  { t = "v", n = 15, text = "and instructed, ‘Take these articles, put them in the temple in Jerusalem, and let the house of God be rebuilt on its original site.’" },
  { t = "v", n = 16, p = true, text = "So this Sheshbazzar came and laid the foundation of the house of God in Jerusalem, and from that time until now it has been under construction, but it has not yet been completed.”" },
  { t = "v", n = 17, p = true, text = "Now, therefore, if it pleases the king, let a search be made of the royal archives in Babylon to see if King Cyrus did indeed issue a decree to rebuild the house of God in Jerusalem. Then let the king send us his decision in this matter." },
  { t = "note", id = "a", text = "*Jozadak* is a variant of *Jehozadak*; see 1 Chronicles 6:14." },
  { t = "note", id = "b", text = "Aramaic *the governor beyond the River*; also in verse 6" },
  { t = "note", id = "c", text = "LXX and Syriac; Aramaic *Then we told them,*" },
  { t = "note", id = "d", text = "Aramaic *the names of the men at their heads*" },
  { t = "note", id = "e", text = "Or *palace*" },
]

[[section]]
id = "6"
title = "Ezra 6"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Decree of Darius" },
  { t = "v", n = 1, p = true, text = "Thus King Darius ordered a search of the archives stored in the treasury of Babylon." },
  { t = "v", n = 2, text = "And a scroll was found in the fortress of Ecbatana, in the province of Media, with the following written on it: Memorandum:" },
  { t = "v", n = 3, p = true, text = "In the first year of King Cyrus, he issued a decree concerning the house of God in Jerusalem: Let the house be rebuilt as a place for offering sacrifices, and let its foundations be firmly laid. It is to be sixty cubits high and sixty cubits wide,[^a]" },
  { t = "v", n = 4, text = "with three layers of cut stones and one of timbers. The costs are to be paid from the royal treasury." },
  { t = "v", n = 5, p = true, text = "Furthermore, the gold and silver articles of the house of God, which Nebuchadnezzar took from the temple in Jerusalem and carried to Babylon, must also be returned to the temple in Jerusalem and deposited in the house of God." },
  { t = "v", n = 6, p = true, text = "Therefore Darius decreed: To Tattenai governor of the region west of the Euphrates,[^b] Shethar-bozenai, and your associates and officials in the region: You must stay away from that place!" },
  { t = "v", n = 7, text = "Leave this work on the house of God alone. Let the governor and elders of the Jews rebuild this house of God on its original site." },
  { t = "v", n = 8, p = true, text = "I hereby decree what you must do for these elders of the Jews who are rebuilding this house of God: The cost is to be paid in full to these men from the royal treasury out of the taxes of the provinces west of the Euphrates, so that the work will not be hindered." },
  { t = "v", n = 9, text = "Whatever is needed—young bulls, rams, and lambs for burnt offerings to the God of heaven, as well as wheat, salt, wine, and oil, as requested by the priests in Jerusalem—must be given to them daily without fail." },
  { t = "v", n = 10, text = "Then they will be able to offer sacrifices of a sweet aroma to the God of heaven and to pray for the lives of the king and his sons." },
  { t = "v", n = 11, p = true, text = "I also decree that if any man interferes with this directive, a beam is to be torn from his house and raised up, and he is to be impaled on it. And his own house shall be made a pile of rubble for this offense.[^c]" },
  { t = "v", n = 12, text = "May God, who has caused His Name to dwell there, overthrow any king or people who lifts a hand to alter this decree or to destroy this house of God in Jerusalem. I, Darius, have issued the decree. Let it be carried out with diligence." },
  { t = "h", level = 2, text = "The Temple Completed" },
  { t = "v", n = 13, p = true, text = "In response, Tattenai the governor of the region west of the Euphrates, Shethar-bozenai, and their associates diligently carried out what King Darius had decreed." },
  { t = "v", n = 14, text = "So the Jewish elders built and prospered through the prophesying of Haggai the prophet and Zechariah son of Iddo. They finished building according to the command of the God of Israel and the decrees of Cyrus, Darius, and Artaxerxes, kings of Persia." },
  { t = "v", n = 15, text = "And this temple was completed on the third day of the month of Adar,[^d] in the sixth year of the reign of King Darius." },
  { t = "h", level = 2, text = "Dedication of the Temple" },
  { t = "v", n = 16, p = true, text = "Then the people of Israel—the priests, the Levites, and the rest of the exiles—celebrated the dedication of the house of God with joy." },
  { t = "v", n = 17, p = true, text = "For the dedication of the house of God they offered a hundred bulls, two hundred rams, four hundred lambs, and a sin offering for all Israel of twelve male goats, one for each tribe of Israel." },
  { t = "v", n = 18, p = true, text = "They also appointed the priests by their divisions and the Levites by their groups to the service of God in Jerusalem, according to what is written in the Book of Moses." },
  { t = "h", level = 2, text = "The Returned Exiles Keep the Passover" },
  { t = "v", n = 19, p = true, text = "On the fourteenth day of the first month, the exiles kept the Passover." },
  { t = "v", n = 20, text = "All the priests and Levites had purified themselves and were ceremonially clean. And the Levites slaughtered the Passover lamb for all the exiles, for their priestly brothers, and for themselves." },
  { t = "v", n = 21, text = "The Israelites who had returned from exile ate it, together with all who had separated themselves from the uncleanness of the peoples[^e] of the land to seek the LORD, the God of Israel." },
  { t = "v", n = 22, p = true, text = "For seven days they kept the Feast of Unleavened Bread[^f] with joy, because the LORD had made them joyful and turned the heart of the king of Assyria toward them to strengthen their hands in the work on the house of the God of Israel." },
  { t = "note", id = "a", text = "The house was to be approximately 90 feet or 27.4 meters in height and width; Syriac (see also 1 Kings 6:2) *It is to be sixty cubits long, twenty cubits wide, and thirty cubits high*." },
  { t = "note", id = "b", text = "Aramaic *governor beyond the River*; similarly in verses 8 and 13" },
  { t = "note", id = "c", text = "Literally *shall be made a dunghill because of this*" },
  { t = "note", id = "d", text = "*Adar* is the twelfth month of the Hebrew lunar calendar, usually occurring within the months of February and March." },
  { t = "note", id = "e", text = "Or *nations*" },
  { t = "note", id = "f", text = "That is, the seven-day period after the Passover during which no leaven may be eaten; see Exodus 12:14–20." },
]

[[section]]
id = "7"
title = "Ezra 7"
level = 1
blocks = [
  { t = "h", level = 2, text = "Ezra Arrives in Jerusalem" },
  { t = "v", n = 1, p = true, text = "Many years later,[^a] during the reign of Artaxerxes king of Persia, Ezra son of Seraiah, the son of Azariah, the son of Hilkiah," },
  { t = "v", n = 2, text = "the son of Shallum, the son of Zadok, the son of Ahitub," },
  { t = "v", n = 3, text = "the son of Amariah, the son of Azariah, the son of Meraioth," },
  { t = "v", n = 4, text = "the son of Zerahiah, the son of Uzzi, the son of Bukki," },
  { t = "v", n = 5, text = "the son of Abishua, the son of Phinehas, the son of Eleazar, the son of Aaron the chief priest—" },
  { t = "v", n = 6, text = "this Ezra came up from Babylon. He was a scribe skilled in the Law of Moses, which the LORD, the God of Israel, had given. The king had granted Ezra all his requests, for the hand of the LORD his God was upon him." },
  { t = "v", n = 7, text = "So in the seventh year of King Artaxerxes, he went up to Jerusalem with some of the Israelites, including priests, Levites, singers, gatekeepers, and temple servants.[^b]" },
  { t = "v", n = 8, p = true, text = "Ezra arrived in Jerusalem in the fifth month of the seventh year of the king." },
  { t = "v", n = 9, text = "He had begun the journey from Babylon on the first day of the first month, and he arrived in Jerusalem on the first day of the fifth month, for the gracious hand of his God was upon him." },
  { t = "v", n = 10, text = "For Ezra had set his heart to study the Law of the LORD, to practice it, and to teach its statutes and ordinances in Israel." },
  { t = "h", level = 2, text = "Artaxerxes’ Letter for Ezra" },
  { t = "v", n = 11, p = true, text = "This is the text of the letter King Artaxerxes had given to Ezra the priest and scribe, an expert in the commandments and statutes of the LORD to Israel:[^c]" },
  { t = "v", n = 12, p = true, text = "Artaxerxes, king of kings. To Ezra the priest, the scribe of the Law of the God of heaven: Greetings.[^d]" },
  { t = "v", n = 13, p = true, text = "I hereby decree that any volunteers among the Israelites in my kingdom, including the priests and Levites, may go up with you to Jerusalem." },
  { t = "v", n = 14, text = "You are sent by the king and his seven counselors to evaluate Judah and Jerusalem according to the Law of your God, which is in your hand." },
  { t = "v", n = 15, p = true, text = "Moreover, you are to take with you the silver and gold that the king and his counselors have freely offered to the God of Israel, whose dwelling is in Jerusalem," },
  { t = "v", n = 16, text = "together with all the silver and gold you may find in all the province of Babylon, as well as the freewill offerings of the people and priests to the house of their God in Jerusalem." },
  { t = "v", n = 17, text = "With this money, therefore, you are to buy as many bulls, rams, and lambs as needed, together with their grain offerings and drink offerings, and offer them on the altar at the house of your God in Jerusalem." },
  { t = "v", n = 18, text = "You and your brothers may do whatever seems best with the rest of the silver and gold, according to the will of your God." },
  { t = "v", n = 19, p = true, text = "You must deliver to the God of Jerusalem all the articles given to you for the service of the house of your God." },
  { t = "v", n = 20, text = "And if anything else is needed for the house of your God that you may have occasion to supply, you may pay for it from the royal treasury." },
  { t = "v", n = 21, p = true, text = "I, King Artaxerxes, decree to all the treasurers west of the Euphrates:[^e] Whatever Ezra the priest, the scribe of the Law of the God of heaven, may require of you, it must be provided promptly," },
  { t = "v", n = 22, text = "up to a hundred talents of silver,[^f] a hundred cors of wheat,[^g] a hundred baths of wine,[^h] a hundred baths of olive oil,[^i] and salt without limit." },
  { t = "v", n = 23, text = "Whatever is commanded by the God of heaven must be done diligently for His house. For why should wrath fall on the realm of the king and his sons?" },
  { t = "v", n = 24, text = "And be advised that you have no authority to impose tribute, duty, or toll on any of the priests, Levites, singers, doorkeepers, temple servants, or other servants of this house of God." },
  { t = "v", n = 25, p = true, text = "And you, Ezra, according to the wisdom of your God, which you possess, are to appoint magistrates and judges to judge all the people west of the Euphrates—all who know the laws of your God. And you are to teach these laws to anyone who does not know them." },
  { t = "v", n = 26, text = "If anyone does not keep the law of your God and the law of the king, let a strict judgment be executed against him, whether death, banishment, confiscation of property, or imprisonment." },
  { t = "h", level = 2, text = "Ezra Blesses God" },
  { t = "v", n = 27, p = true, text = "Blessed be the LORD, the God of our fathers, who has put into the heart of the king to so honor the house of the LORD in Jerusalem," },
  { t = "v", n = 28, text = "and who has shown me favor before the king, his counselors, and all his powerful officials. And because the hand of the LORD my God was upon me, I took courage and gathered the leaders of Israel to return with me." },
  { t = "note", id = "a", text = "Literally *After these things*" },
  { t = "note", id = "b", text = "Hebrew *Nethinim*; also in verse 24" },
  { t = "note", id = "c", text = "The original text of Ezra 7:12–26 is in Aramaic." },
  { t = "note", id = "d", text = "Aramaic *Perfect now* (probably a greeting)" },
  { t = "note", id = "e", text = "Aramaic *beyond the River*; also in verse 25" },
  { t = "note", id = "f", text = "*100 talents* is approximately 3.77 tons or 3.42 metric tons of silver." },
  { t = "note", id = "g", text = "*100 cors* is approximately 624 bushels or 22,000 liters (probably about 19.2 tons or 17.4 metric tons of wheat)." },
  { t = "note", id = "h", text = "*100 baths* is approximately 580 gallons or 2,200 liters of wine." },
  { t = "note", id = "i", text = "Or *100 baths of oil*; that is, approximately 580 gallons or 2,200 liters" },
]

[[section]]
id = "8"
title = "Ezra 8"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Exiles Who Returned with Ezra" },
  { t = "v", n = 1, p = true, text = "These are the family heads and genealogical records of those who returned with me from Babylon during the reign of King Artaxerxes:" },
  { t = "v", n = 2, indent = 1, p = true, text = "from the descendants of Phinehas, Gershom; from the descendants of Ithamar, Daniel; from the descendants of David, Hattush" },
  { t = "v", n = 3, text = "of the descendants of Shecaniah; from the descendants of Parosh, Zechariah, and with him were registered 150 men;" },
  { t = "v", n = 4, indent = 1, p = true, text = "from the descendants of Pahath-Moab, Eliehoenai son of Zerahiah, and with him 200 men;" },
  { t = "v", n = 5, indent = 1, p = true, text = "from the descendants of Zattu, Shecaniah son of Jahaziel,[^a] and with him 300 men;" },
  { t = "v", n = 6, indent = 1, p = true, text = "from the descendants of Adin, Ebed son of Jonathan, and with him 50 men;" },
  { t = "v", n = 7, indent = 1, p = true, text = "from the descendants of Elam, Jeshaiah son of Athaliah, and with him 70 men;" },
  { t = "v", n = 8, indent = 1, p = true, text = "from the descendants of Shephatiah, Zebadiah son of Michael, and with him 80 men;" },
  { t = "v", n = 9, indent = 1, p = true, text = "from the descendants of Joab, Obadiah son of Jehiel, and with him 218 men;" },
  { t = "v", n = 10, indent = 1, p = true, text = "from the descendants of Bani, Shelomith son of Josiphiah,[^b] and with him 160 men;" },
  { t = "v", n = 11, indent = 1, p = true, text = "from the descendants of Bebai, Zechariah son of Bebai, and with him 28 men;" },
  { t = "v", n = 12, indent = 1, p = true, text = "from the descendants of Azgad, Johanan son of Hakkatan, and with him 110 men;" },
  { t = "v", n = 13, indent = 1, p = true, text = "from the later[^c] descendants of Adonikam, these were their names: Eliphelet, Jeiel, and Shemaiah, and with them 60 men;" },
  { t = "v", n = 14, indent = 1, p = true, text = "and from the descendants of Bigvai, both Uthai and Zaccur,[^d] and with them 70 men." },
  { t = "h", level = 2, text = "Ezra Sends for the Levites" },
  { t = "v", n = 15, p = true, text = "Now I assembled these exiles at the canal that flows to Ahava, and we camped there three days. And when I searched among the people and priests, I found no Levites there." },
  { t = "v", n = 16, p = true, text = "Then I summoned the leaders: Eliezer, Ariel, Shemaiah, Elnathan,[^e] Jarib, Elnathan, Nathan, Zechariah, and Meshullam, as well as the teachers Joiarib and Elnathan." },
  { t = "v", n = 17, text = "And I sent them to Iddo, the leader at Casiphia, with a message for him and his kinsmen, the temple servants[^f] at Casiphia, that they should bring to us ministers for the house of our God." },
  { t = "v", n = 18, p = true, text = "And since the gracious hand of our God was upon us, they brought us Sherebiah—a man of insight from the descendants of Mahli son of Levi, the son of Israel—along with his sons and brothers, 18 men;" },
  { t = "v", n = 19, text = "also Hashabiah, together with Jeshaiah, from the descendants of Merari, and his brothers and their sons, 20 men." },
  { t = "v", n = 20, text = "They also brought 220 of the temple servants, all designated by name. David and the officials had appointed them to assist the Levites." },
  { t = "h", level = 2, text = "Fasting for Protection" },
  { t = "v", n = 21, p = true, text = "And there by the Ahava Canal I proclaimed a fast, so that we might humble ourselves before our God and ask Him for a safe journey for us and our children, with all our possessions." },
  { t = "v", n = 22, text = "For I was ashamed to ask the king for an escort of soldiers and horsemen to protect us from our enemies on the road, since we had told him, “The hand of our God is gracious to all who seek Him, but His great anger is against all who forsake Him.”" },
  { t = "v", n = 23, p = true, text = "So we fasted and petitioned our God about this, and He granted our request." },
  { t = "h", level = 2, text = "Priests to Guard the Offerings" },
  { t = "v", n = 24, p = true, text = "Then I set apart twelve of the leading priests, together with Sherebiah, Hashabiah, and ten of their brothers," },
  { t = "v", n = 25, text = "and I weighed out to them the contribution of silver and gold and the articles that the king, his counselors, his leaders, and all the Israelites there had offered for the house of our God." },
  { t = "v", n = 26, p = true, text = "I weighed out into their hands 650 talents of silver,[^g] articles of silver weighing 100 talents,[^h] 100 talents of gold,[^i]" },
  { t = "v", n = 27, text = "20 gold bowls valued at 1,000 darics,[^j] and two articles of fine polished bronze, as precious as gold." },
  { t = "v", n = 28, p = true, text = "Then I told them, “You are holy to the LORD, and these articles are holy. The silver and gold are a freewill offering to the LORD, the God of your fathers." },
  { t = "v", n = 29, text = "Guard them carefully until you weigh them out in the chambers of the house of the LORD in Jerusalem before the leading priests, Levites, and heads of the Israelite families.”" },
  { t = "v", n = 30, p = true, text = "So the priests and Levites took charge of the silver and gold and sacred articles that had been weighed out to be taken to the house of our God in Jerusalem." },
  { t = "v", n = 31, p = true, text = "On the twelfth day of the first month we set out from the Ahava Canal to go to Jerusalem, and the hand of our God was upon us to protect us from the hands of the enemies and bandits along the way." },
  { t = "h", level = 2, text = "Arrival in Jerusalem" },
  { t = "v", n = 32, p = true, text = "So we arrived at Jerusalem and rested there for three days." },
  { t = "v", n = 33, p = true, text = "On the fourth day, in the house of our God, we weighed out the silver and gold and sacred articles into the hand of Meremoth son of Uriah, the priest. Eleazar son of Phinehas was with him, along with the Levites Jozabad son of Jeshua and Noadiah son of Binnui." },
  { t = "v", n = 34, text = "Everything was verified by number and weight, and the total weight was recorded at that time." },
  { t = "v", n = 35, p = true, text = "Then the exiles who had returned from captivity sacrificed burnt offerings to the God of Israel: 12 bulls for all Israel, 96 rams, 77 lambs, and a sin offering of 12 male goats. All this was a burnt offering to the LORD." },
  { t = "v", n = 36, p = true, text = "They also delivered the king’s edicts to the royal satraps[^k] and governors of the region west of the Euphrates,[^l] who proceeded to assist the people and the house of God." },
  { t = "note", id = "a", text = "Some LXX manuscripts (see also 1 Esdras 8:32); Hebrew *from the descendants of Shecaniah, the son of Jahaziel*" },
  { t = "note", id = "b", text = "Some LXX manuscripts (see also 1 Esdras 8:36); Hebrew *from the descendants of Shelomith, the son of Josiphiah*" },
  { t = "note", id = "c", text = "Or *the last*" },
  { t = "note", id = "d", text = "LXX, Syriac, and an alternate MT reading; the other alternate reads *Zabbud*." },
  { t = "note", id = "e", text = "*Elnathan* appears three times in verse, either as a repetition for emphasis or as a record of multiple men with this name." },
  { t = "note", id = "f", text = "Hebrew *the Nethinim*; also in verse 20" },
  { t = "note", id = "g", text = "*650 talents* is approximately 24.5 tons or 22.2 metric tons of silver." },
  { t = "note", id = "h", text = "*100 talents* is approximately 3.77 tons or 3.42 metric tons of silver articles." },
  { t = "note", id = "i", text = "*100 talents* is approximately 3.77 tons or 3.42 metric tons of gold." },
  { t = "note", id = "j", text = "Or *worth 1,000 drachmas*; that is, approximately 18.5 pounds or 8.4 kilograms of gold" },
  { t = "note", id = "k", text = "A *satrap* was a Persian official." },
  { t = "note", id = "l", text = "Hebrew *governors beyond the River*" },
]

[[section]]
id = "9"
title = "Ezra 9"
level = 1
blocks = [
  { t = "h", level = 2, text = "Intermarriage with Neighboring Peoples" },
  { t = "ref", text = "(Nehemiah 13:23–31)" },
  { t = "v", n = 1, p = true, text = "After these things had been accomplished, the leaders approached me and said, “The people of Israel, including the priests and Levites, have not kept themselves separate from the surrounding peoples whose abominations are like those of the Canaanites, Hittites, Perizzites, Jebusites, Ammonites, Moabites, Egyptians, and Amorites." },
  { t = "v", n = 2, text = "Indeed, the Israelites have taken some of their daughters as wives for themselves and their sons, so that the holy seed has been mixed with the people of the land. And the leaders and officials have taken the lead in this unfaithfulness!”" },
  { t = "v", n = 3, p = true, text = "When I heard this report, I tore my tunic and cloak, pulled out some hair from my head and beard, and sat down in horror." },
  { t = "v", n = 4, p = true, text = "Then everyone who trembled at the words of the God of Israel gathered around me because of the unfaithfulness of the exiles, while I sat there in horror until the evening offering." },
  { t = "h", level = 2, text = "Ezra’s Prayer of Confession" },
  { t = "v", n = 5, p = true, text = "At the evening offering, I got up from my humiliation with my tunic and cloak torn, and I fell on my knees, spread out my hands to the LORD my God," },
  { t = "v", n = 6, text = "and said: “O my God, I am ashamed and embarrassed to lift up my face to You, my God, because our iniquities are higher than our heads, and our guilt has reached the heavens." },
  { t = "v", n = 7, text = "From the days of our fathers to this day, our guilt has been great. Because of our iniquities, we and our kings and priests have been delivered into the hands of the kings of the earth and subjected to the sword and to captivity, to pillage and humiliation, as we are this day." },
  { t = "v", n = 8, p = true, text = "But now, for a brief moment, grace has come from the LORD our God to preserve for us a remnant and to give us a stake[^a] in His holy place. Even in our bondage, our God has given us new life and light to our eyes." },
  { t = "v", n = 9, text = "Though we are slaves, our God has not forsaken us in our bondage, but He has extended to us grace in the sight of the kings of Persia, giving us new life to rebuild the house of our God and repair its ruins, and giving us a wall of protection in Judah and Jerusalem." },
  { t = "v", n = 10, p = true, text = "And now, our God, what can we say after this? For we have forsaken the commandments" },
  { t = "v", n = 11, text = "that You gave through Your servants the prophets, saying: ‘The land that you are entering to possess is a land polluted by the impurity of its peoples and the abominations with which they have filled it from end to end." },
  { t = "v", n = 12, text = "Now, therefore, do not give your daughters in marriage to their sons or take their daughters for your sons. Never seek their peace or prosperity, so that you may be strong and may eat the good things of the land, leaving it as an inheritance to your sons forever.’" },
  { t = "v", n = 13, p = true, text = "After all that has come upon us because of our evil deeds and our great guilt (though You, our God, have punished us less than our iniquities deserve and have given us such a remnant as this)," },
  { t = "v", n = 14, text = "shall we again break Your commandments and intermarry with the peoples who commit these abominations? Would You not become so angry with us as to wipe us out, leaving no remnant or survivor?" },
  { t = "v", n = 15, p = true, text = "O LORD, God of Israel, You are righteous! For we remain this day as a remnant. Here we are before You in our guilt, though because of it no one can stand before You.”" },
  { t = "note", id = "a", text = "Or *nail* or *foothold*" },
]

[[section]]
id = "10"
title = "Ezra 10"
level = 1
blocks = [
  { t = "h", level = 2, text = "Shecaniah’s Encouragement" },
  { t = "v", n = 1, p = true, text = "While Ezra prayed and made this confession, weeping and falling facedown before the house of God, a very large assembly of Israelites—men, women, and children—gathered around him, and the people wept bitterly as well." },
  { t = "v", n = 2, p = true, text = "Then Shecaniah son of Jehiel, an Elamite, said to Ezra: “We have been unfaithful to our God by marrying foreign women from the people of the land, yet in spite of this, there is hope for Israel." },
  { t = "v", n = 3, text = "So now let us make a covenant before our God to send away all the foreign wives and their children, according to the counsel of my lord and of those who tremble at the command of our God. Let it be done according to the Law." },
  { t = "v", n = 4, text = "Get up, for this matter is your responsibility, and we will support you. Be strong and take action!”" },
  { t = "v", n = 5, p = true, text = "So Ezra got up and made the leading priests, Levites, and all Israel take an oath to do what had been said. And they took the oath." },
  { t = "h", level = 2, text = "The People’s Confession of Sin" },
  { t = "v", n = 6, p = true, text = "Then Ezra withdrew from before the house of God and walked to the chamber of Jehohanan son of Eliashib. And while he stayed[^a] there, he ate no food and drank no water, because he was mourning over the unfaithfulness of the exiles." },
  { t = "v", n = 7, p = true, text = "And a proclamation was issued throughout Judah and Jerusalem that all the exiles should gather at Jerusalem." },
  { t = "v", n = 8, text = "Whoever failed to appear within three days would forfeit all his property, according to the counsel of the leaders and elders, and would himself be expelled from the assembly of the exiles." },
  { t = "v", n = 9, p = true, text = "So within the three days, all the men of Judah and Benjamin assembled in Jerusalem, and on the twentieth day of the ninth month, all the people sat in the square at the house of God, trembling regarding this matter and because of the heavy rain." },
  { t = "v", n = 10, p = true, text = "Then Ezra the priest stood up and said to them, “You have been unfaithful by marrying foreign women, adding to the guilt of Israel." },
  { t = "v", n = 11, text = "Now, therefore, make a confession to the LORD, the God of your fathers, and do His will. Separate yourselves from the people of the land and from your foreign wives.”" },
  { t = "v", n = 12, p = true, text = "And the whole assembly responded in a loud voice: “Truly we must do as you say!" },
  { t = "v", n = 13, text = "But there are many people here, and it is the rainy season. We are not able to stay out in the open. Nor is this the work of one or two days, for we have transgressed greatly in this matter." },
  { t = "v", n = 14, text = "Let our leaders represent the whole assembly. Then let everyone in our towns who has married a foreign woman come at an appointed time, together with the elders and judges of each town, until the fierce anger of our God in this matter is turned away from us.”" },
  { t = "v", n = 15, p = true, text = "(Only Jonathan son of Asahel and Jahzeiah son of Tikvah, supported by Meshullam and Shabbethai the Levite, opposed this plan.)" },
  { t = "v", n = 16, p = true, text = "So the exiles did as proposed. Ezra the priest selected men who were family heads, each of them identified by name, to represent their families. On the first day of the tenth month they launched the investigation," },
  { t = "v", n = 17, text = "and by the first day of the first month they had dealt with all the men who had married foreign women." },
  { t = "h", level = 2, text = "Those Guilty of Intermarriage" },
  { t = "v", n = 18, p = true, text = "Among the descendants of the priests who had married foreign women were found these descendants of Jeshua son of Jozadak[^b] and his brothers: Maaseiah, Eliezer, Jarib, and Gedaliah." },
  { t = "v", n = 19, text = "They pledged to send their wives away, and for their guilt they presented a ram from the flock as a guilt offering." },
  { t = "v", n = 20, p = true, text = "From the descendants of Immer: Hanani and Zebadiah." },
  { t = "v", n = 21, p = true, text = "From the descendants of Harim: Maaseiah, Elijah, Shemaiah, Jehiel, and Uzziah." },
  { t = "v", n = 22, p = true, text = "From the descendants of Pashhur: Elioenai, Maaseiah, Ishmael, Nethanel, Jozabad, and Elasah." },
  { t = "v", n = 23, p = true, text = "Among the Levites: Jozabad, Shimei, Kelaiah (that is, Kelita), Pethahiah, Judah, and Eliezer." },
  { t = "v", n = 24, p = true, text = "From the singers: Eliashib. From the gatekeepers: Shallum, Telem, and Uri." },
  { t = "v", n = 25, p = true, text = "And among the other Israelites, from the descendants of Parosh: Ramiah, Izziah, Malchijah, Mijamin, Eleazar, Malchijah,[^c] and Benaiah." },
  { t = "v", n = 26, p = true, text = "From the descendants of Elam: Mattaniah, Zechariah, Jehiel, Abdi, Jeremoth, and Elijah." },
  { t = "v", n = 27, p = true, text = "From the descendants of Zattu: Elioenai, Eliashib, Mattaniah, Jeremoth, Zabad, and Aziza." },
  { t = "v", n = 28, p = true, text = "From the descendants of Bebai: Jehohanan, Hananiah, Zabbai, and Athlai." },
  { t = "v", n = 29, p = true, text = "From the descendants of Bani: Meshullam, Malluch, Adaiah, Jashub, Sheal, and Jeremoth." },
  { t = "v", n = 30, p = true, text = "From the descendants of Pahath-moab: Adna, Chelal, Benaiah, Maaseiah, Mattaniah, Bezalel, Binnui, and Manasseh." },
  { t = "v", n = 31, p = true, text = "From the descendants of Harim: Eliezer, Isshijah, Malchijah, Shemaiah, Shimeon," },
  { t = "v", n = 32, text = "Benjamin, Malluch, and Shemariah." },
  { t = "v", n = 33, p = true, text = "From the descendants of Hashum: Mattenai, Mattattah, Zabad, Eliphelet, Jeremai, Manasseh, and Shimei." },
  { t = "v", n = 34, p = true, text = "From the descendants of Bani: Maadai, Amram, Uel," },
  { t = "v", n = 35, text = "Benaiah, Bedeiah, Cheluhi," },
  { t = "v", n = 36, text = "Vaniah, Meremoth, Eliashib," },
  { t = "v", n = 37, text = "Mattaniah, Mattenai, and Jaasu." },
  { t = "v", n = 38, p = true, text = "From the descendants of Binnui: Shimei,[^d]" },
  { t = "v", n = 39, text = "Shelemiah, Nathan, Adaiah," },
  { t = "v", n = 40, text = "Machnadebai, Shashai, Sharai," },
  { t = "v", n = 41, text = "Azarel, Shelemiah, Shemariah," },
  { t = "v", n = 42, text = "Shallum, Amariah, and Joseph." },
  { t = "v", n = 43, p = true, text = "And from the descendants of Nebo: Jeiel, Mattithiah, Zabad, Zebina, Jaddai, Joel, and Benaiah." },
  { t = "v", n = 44, p = true, text = "All these men had married foreign women, and some of them had children by these wives.[^e]" },
  { t = "note", id = "a", text = "Or *went*" },
  { t = "note", id = "b", text = "*Jozadak* is a variant of *Jehozadak*; see 1 Chronicles 6:14." },
  { t = "note", id = "c", text = "Hebrew; LXX *Hashabiah*" },
  { t = "note", id = "d", text = "See LXX; Hebrew *And Bani, and Binnui, (and) Shimei,*" },
  { t = "note", id = "e", text = "Or *and they sent them away with their children*" },
]

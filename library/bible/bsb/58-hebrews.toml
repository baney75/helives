[[section]]
id = "1"
title = "Hebrews 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Supremacy of the Son" },
  { t = "ref", text = "(Colossians 1:15–23)" },
  { t = "v", n = 1, p = true, text = "On many past occasions and in many different ways, God spoke to our fathers through the prophets." },
  { t = "v", n = 2, text = "But in these last days He has spoken to us by His Son,[^a] whom He appointed heir of all things, and through whom He made the universe.[^b]" },
  { t = "v", n = 3, p = true, text = "The Son is the radiance of God’s glory and the exact representation of His nature, upholding all things by His powerful word. After He had provided purification for sins, He sat down at the right hand of the Majesty on high." },
  { t = "v", n = 4, text = "So He became as far superior to the angels as the name He has inherited is excellent beyond theirs." },
  { t = "v", n = 5, text = "For to which of the angels did God ever say: “You are My Son; today I have become Your Father”[^c]? Or again: “I will be His Father, and He will be My Son”[^d]?" },
  { t = "v", n = 6, p = true, text = "And again, when God brings His firstborn into the world, He says: “Let all God’s angels worship Him.”[^e]" },
  { t = "v", n = 7, p = true, text = "Now about the angels He says: “He makes His angels winds, His servants flames of fire.”[^f]" },
  { t = "v", n = 8, p = true, text = "But about the Son He says: “Your throne, O God, endures forever and ever, and justice is the scepter of Your kingdom." },
  { t = "v", n = 9, indent = 1, text = "You have loved righteousness and hated wickedness; therefore God, Your God, has anointed You above Your companions with the oil of joy.”[^g]" },
  { t = "v", n = 10, p = true, text = "And: “In the beginning, O Lord, You laid the foundations of the earth, and the heavens are the work of Your hands." },
  { t = "v", n = 11, indent = 1, text = "They will perish, but You remain; they will all wear out like a garment." },
  { t = "v", n = 12, indent = 1, text = "You will roll them up like a robe; like a garment[^h] they will be changed; but You remain the same, and Your years will never end.”[^i]" },
  { t = "v", n = 13, p = true, text = "Yet to which of the angels did God ever say: “Sit at My right hand until I make Your enemies a footstool for Your feet”[^j]?" },
  { t = "v", n = 14, p = true, text = "Are not the angels[^k] ministering spirits sent to serve those who will inherit salvation?" },
  { t = "note", id = "a", text = "Or *in His Son*" },
  { t = "note", id = "b", text = "Or *the world*; literally *the ages*" },
  { t = "note", id = "c", text = "Psalm 2:7; literally *today I have begotten You*" },
  { t = "note", id = "d", text = "2 Samuel 7:14; 1 Chronicles 17:13" },
  { t = "note", id = "e", text = "Deuteronomy 32:43 (see DSS and LXX)" },
  { t = "note", id = "f", text = "Psalm 104:4 (see also LXX)" },
  { t = "note", id = "g", text = "Psalm 45:6–7" },
  { t = "note", id = "h", text = "BYZ and TR do not include *like a garment*." },
  { t = "note", id = "i", text = "Psalm 102:25–27" },
  { t = "note", id = "j", text = "Psalm 110:1" },
  { t = "note", id = "k", text = "Literally *Are they not all*" },
]

[[section]]
id = "2"
title = "Hebrews 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "Salvation Confirmed" },
  { t = "v", n = 1, p = true, text = "We must pay closer attention, therefore, to what we have heard, so that we do not drift away." },
  { t = "v", n = 2, text = "For if the message spoken by angels was binding, and every transgression and disobedience received its just punishment," },
  { t = "v", n = 3, text = "how shall we escape if we neglect such a great salvation? This salvation was first announced by the Lord, was confirmed to us by those who heard Him," },
  { t = "v", n = 4, text = "and was affirmed by God through signs, wonders, various miracles, and gifts of the Holy Spirit distributed according to His will." },
  { t = "h", level = 2, text = "Jesus like His Brothers" },
  { t = "v", n = 5, p = true, text = "For it is not to angels that He has subjected the world to come, about which we are speaking." },
  { t = "v", n = 6, text = "But somewhere it is testified in these words: “What is man that You are mindful of him, or the son of man that You care for him?" },
  { t = "v", n = 7, indent = 1, text = "You made him a little lower[^a] than the angels; You crowned him with glory and honor[^b]" },
  { t = "v", n = 8, indent = 2, text = "and placed everything under his feet.”[^c] When God subjected all things to him, He left nothing outside of his control. Yet at present we do not see everything subject to him." },
  { t = "v", n = 9, text = "But we see Jesus, who was made a little lower than the angels, now crowned with glory and honor because He suffered death, so that by the grace of God He might taste death for everyone." },
  { t = "v", n = 10, p = true, text = "In bringing many sons to glory, it was fitting for God, for whom and through whom all things exist, to make the author[^d] of their salvation perfect through suffering." },
  { t = "v", n = 11, text = "For both the One who sanctifies and those who are sanctified are of the same family. So Jesus is not ashamed to call them brothers." },
  { t = "v", n = 12, text = "He says: “I will proclaim Your name to My brothers; I will sing Your praises in the assembly.”[^e]" },
  { t = "v", n = 13, p = true, text = "And again: “I will put My trust in Him.”[^f] And once again: “Here am I, and the children God has given Me.”[^g]" },
  { t = "v", n = 14, p = true, text = "Now since the children have flesh and blood, He too shared in their humanity, so that by His death He might destroy him who holds the power of death, that is, the devil," },
  { t = "v", n = 15, text = "and free those who all their lives were held in slavery by their fear of death." },
  { t = "v", n = 16, p = true, text = "For surely it is not the angels He helps, but the descendants of Abraham." },
  { t = "v", n = 17, text = "For this reason He had to be made like His brothers in every way, so that He might become a merciful and faithful high priest in service to God, in order to make atonement[^h] for the sins of the people." },
  { t = "v", n = 18, text = "Because He Himself suffered when He was tempted, He is able to help those who are being tempted." },
  { t = "note", id = "a", text = "Or *a little while lower*; also in verse 9" },
  { t = "note", id = "b", text = "WH and TR include *and set him over the works of Your hands*." },
  { t = "note", id = "c", text = "Psalm 8:4–6 (see also LXX)" },
  { t = "note", id = "d", text = "Or *pioneer* or *founder*" },
  { t = "note", id = "e", text = "Psalm 22:22 (see also LXX)" },
  { t = "note", id = "f", text = "Isaiah 8:17" },
  { t = "note", id = "g", text = "Isaiah 8:18" },
  { t = "note", id = "h", text = "Or *to make propitiation*" },
]

[[section]]
id = "3"
title = "Hebrews 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "Jesus Our Apostle and High Priest" },
  { t = "v", n = 1, p = true, text = "Therefore, holy brothers, who share in the heavenly calling, set your focus on Jesus, the apostle and high priest whom we confess." },
  { t = "v", n = 2, text = "He was faithful to the One who appointed Him, just as Moses was faithful in all God’s house.[^a]" },
  { t = "v", n = 3, p = true, text = "For Jesus has been counted worthy of greater glory than Moses, just as the builder of a house has greater honor than the house itself." },
  { t = "v", n = 4, text = "And every house is built by someone, but God is the builder of everything." },
  { t = "v", n = 5, p = true, text = "Now Moses was faithful as a servant in all God’s house,[^b] testifying to what would be spoken later." },
  { t = "v", n = 6, text = "But Christ is faithful as the Son over God’s house. And we are His house, if we hold firmly[^c] to our confidence and the hope of which we boast." },
  { t = "h", level = 2, text = "Do Not Harden Your Hearts" },
  { t = "ref", text = "(Psalm 95:1–11)" },
  { t = "v", n = 7, p = true, text = "Therefore, as the Holy Spirit says: “Today, if you hear His voice," },
  { t = "v", n = 8, indent = 2, text = "do not harden your hearts, as you did in the rebellion, in the day of testing in the wilderness," },
  { t = "v", n = 9, indent = 1, text = "where your fathers tested and tried Me, and for forty years saw My works." },
  { t = "v", n = 10, indent = 1, text = "Therefore I was angry with that generation, and I said, ‘Their hearts are always going astray, and they have not known My ways.’" },
  { t = "v", n = 11, indent = 1, text = "So I swore on oath in My anger, ‘They shall never enter My rest.’”[^d]" },
  { t = "h", level = 2, text = "The Peril of Unbelief" },
  { t = "v", n = 12, p = true, text = "See to it, brothers, that none of you has a wicked heart of unbelief that turns away from the living God." },
  { t = "v", n = 13, text = "But exhort one another daily, as long as it is called today, so that none of you may be hardened by sin’s deceitfulness." },
  { t = "v", n = 14, p = true, text = "We have come to share in Christ if we hold firmly to the end the assurance we had at first." },
  { t = "v", n = 15, text = "As it has been said: “Today, if you hear His voice, do not harden your hearts, as you did in the rebellion.”[^e]" },
  { t = "v", n = 16, p = true, text = "For who were the ones who heard and rebelled? Were they not all those Moses led out of Egypt?" },
  { t = "v", n = 17, text = "And with whom was God angry for forty years? Was it not with those who sinned, whose bodies fell in the wilderness?" },
  { t = "v", n = 18, text = "And to whom did He swear that they would never enter His rest? Was it not to those who disobeyed?" },
  { t = "v", n = 19, text = "So we see that it was because of their unbelief that they were unable to enter." },
  { t = "note", id = "a", text = "Literally *just as Moses in all His house*; SBL *just as Moses in His house*" },
  { t = "note", id = "b", text = "Numbers 12:7" },
  { t = "note", id = "c", text = "NE, WH, BYZ, and TR include *to the end*." },
  { t = "note", id = "d", text = "Psalm 95:7–11 (see also LXX)" },
  { t = "note", id = "e", text = "Psalm 95:7–8" },
]

[[section]]
id = "4"
title = "Hebrews 4"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Sabbath Rest" },
  { t = "ref", text = "(Genesis 2:1–3; Exodus 16:22–30)" },
  { t = "v", n = 1, p = true, text = "Therefore, while the promise of entering His rest still stands, let us be careful that none of you be deemed to have fallen short of it." },
  { t = "v", n = 2, text = "For we also received the good news just as they did; but the message they heard was of no value to them, since they did not share the faith of those who comprehended it.[^a]" },
  { t = "v", n = 3, p = true, text = "Now we who have believed enter that rest. As for the others, it is just as God has said: “So I swore on oath in My anger, ‘They shall never enter My rest.’”[^b] And yet His works have been finished since the foundation of the world." },
  { t = "v", n = 4, text = "For somewhere He has spoken about the seventh day in this manner: “And on the seventh day God rested from all His works.”[^c]" },
  { t = "v", n = 5, text = "And again, as He says in the passage above: “They shall never enter My rest.”" },
  { t = "v", n = 6, p = true, text = "Since, then, it remains for some to enter His rest, and since those who formerly heard the good news did not enter because of their disobedience," },
  { t = "v", n = 7, text = "God again designated a certain day as “Today,” when a long time later He spoke through David as was just stated: “Today, if you hear His voice, do not harden your hearts.”[^d]" },
  { t = "v", n = 8, p = true, text = "For if Joshua had given them rest, God would not have spoken later about another day." },
  { t = "v", n = 9, text = "There remains, then, a Sabbath rest for the people of God." },
  { t = "v", n = 10, text = "For whoever enters God’s rest also rests from his own work, just as God did from His." },
  { t = "v", n = 11, text = "Let us, therefore, make every effort to enter that rest, so that no one will fall by following the same pattern of disobedience." },
  { t = "h", level = 2, text = "The Living Word" },
  { t = "ref", text = "(2 Timothy 3:10–17)" },
  { t = "v", n = 12, p = true, text = "For the word of God is living and active. Sharper than any double-edged sword, it pierces even to dividing soul and spirit, joints and marrow. It judges the thoughts and intentions of the heart." },
  { t = "v", n = 13, text = "Nothing in all creation is hidden from God’s sight; everything is uncovered and exposed before the eyes of Him to whom we must give account." },
  { t = "v", n = 14, p = true, text = "Therefore, since we have a great high priest who has passed through the heavens, Jesus the Son of God, let us hold firmly to what we profess." },
  { t = "v", n = 15, text = "For we do not have a high priest who is unable to sympathize with our weaknesses, but we have one who was tempted in every way that we are, yet was without sin." },
  { t = "v", n = 16, text = "Let us then approach the throne of grace with confidence, so that we may receive mercy and find grace to help us in our time of need." },
  { t = "note", id = "a", text = "Literally *not having been united in the faith of those who heard*" },
  { t = "note", id = "b", text = "Psalm 95:11; also in verse 5" },
  { t = "note", id = "c", text = "Genesis 2:2" },
  { t = "note", id = "d", text = "Psalm 95:7–8" },
]

[[section]]
id = "5"
title = "Hebrews 5"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Perfect High Priest" },
  { t = "ref", text = "(Psalm 110:1–7)" },
  { t = "v", n = 1, p = true, text = "Every high priest is appointed from among men to represent them in matters relating to God, to offer gifts and sacrifices for sins." },
  { t = "v", n = 2, text = "He is able to deal gently with those who are ignorant and misguided, since he himself is subject to weakness." },
  { t = "v", n = 3, text = "That is why he is obligated to offer sacrifices for his own sins, as well as for the sins of the people." },
  { t = "v", n = 4, p = true, text = "No one takes this honor upon himself; he must be called by God, just as Aaron was." },
  { t = "v", n = 5, text = "So also Christ did not take upon Himself the glory of becoming a high priest, but He was called by the One who said to Him: “You are My Son; today I have become Your Father.”[^a]" },
  { t = "v", n = 6, p = true, text = "And in another passage God says: “You are a priest forever in the order of Melchizedek.”[^b]" },
  { t = "v", n = 7, p = true, text = "During the days of Jesus’ earthly life, He offered up prayers and petitions with loud cries and tears to the One who could save Him from death, and He was heard because of His reverence." },
  { t = "v", n = 8, text = "Although He was a Son, He learned obedience from what He suffered." },
  { t = "v", n = 9, text = "And having been made perfect, He became the source of eternal salvation to all who obey Him" },
  { t = "v", n = 10, text = "and was designated by God as high priest in the order of Melchizedek." },
  { t = "h", level = 2, text = "Milk and Solid Food" },
  { t = "ref", text = "(1 Corinthians 3:1–9)" },
  { t = "v", n = 11, p = true, text = "We have much to say about this, but it is hard to explain, because you are dull of hearing." },
  { t = "v", n = 12, text = "Although by this time you ought to be teachers, you need someone to reteach you the basic principles of God’s word.[^c] You need milk, not solid food!" },
  { t = "v", n = 13, p = true, text = "For everyone who lives on milk is still an infant, inexperienced in the message of righteousness." },
  { t = "v", n = 14, text = "But solid food is for the mature, who by constant use have trained their senses to distinguish good from evil." },
  { t = "note", id = "a", text = "Psalm 2:7; literally *today I have begotten You*" },
  { t = "note", id = "b", text = "Psalm 110:4" },
  { t = "note", id = "c", text = "Or *of the oracles of God*" },
]

[[section]]
id = "6"
title = "Hebrews 6"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Call to Maturity" },
  { t = "v", n = 1, p = true, text = "Therefore let us leave the elementary teachings about Christ and go on to maturity, not laying again the foundation of repentance from dead works,[^a] and of faith in God," },
  { t = "v", n = 2, text = "instruction about baptisms,[^b] the laying on of hands, the resurrection of the dead, and eternal judgment." },
  { t = "v", n = 3, text = "And this we will do, if God permits." },
  { t = "v", n = 4, p = true, text = "It is impossible for those who have once been enlightened, who have tasted the heavenly gift, who have shared in the Holy Spirit," },
  { t = "v", n = 5, text = "who have tasted the goodness of the word of God and the powers of the coming age—" },
  { t = "v", n = 6, text = "and then have fallen away—to be restored to repentance, because they themselves are crucifying the Son of God all over again and subjecting Him to open shame." },
  { t = "v", n = 7, p = true, text = "For land that drinks in the rain often falling on it and that produces a crop useful to those for whom it is tended receives the blessing of God." },
  { t = "v", n = 8, text = "But land that produces thorns and thistles is worthless, and its curse is imminent. In the end it will be burned." },
  { t = "v", n = 9, p = true, text = "Even though we speak like this, beloved, we are convinced of better things in your case—things that accompany salvation." },
  { t = "v", n = 10, text = "For God is not unjust. He will not forget your work and the love you have shown for His name as you have ministered to the saints and continue to do so." },
  { t = "v", n = 11, p = true, text = "We want each of you to show this same diligence to the very end, in order to make your hope sure." },
  { t = "v", n = 12, text = "Then you will not be sluggish, but will imitate those who through faith and patience inherit what has been promised." },
  { t = "h", level = 2, text = "God’s Unchangeable Promise" },
  { t = "v", n = 13, p = true, text = "When God made His promise to Abraham, since He had no one greater to swear by, He swore by Himself," },
  { t = "v", n = 14, text = "saying, “I will surely bless you and multiply your descendants.”[^c]" },
  { t = "v", n = 15, text = "And so Abraham, after waiting patiently, obtained the promise." },
  { t = "v", n = 16, p = true, text = "Men swear by someone greater than themselves, and their oath serves as a confirmation to end all argument." },
  { t = "v", n = 17, text = "So when God wanted to make the unchanging nature of His purpose very clear to the heirs of the promise, He guaranteed it with an oath." },
  { t = "v", n = 18, text = "Thus by two unchangeable things in which it is impossible for God to lie, we who have fled to take hold of the hope set before us may be strongly encouraged." },
  { t = "v", n = 19, p = true, text = "We have this hope as an anchor for the soul, firm and secure. It enters the inner sanctuary behind the curtain," },
  { t = "v", n = 20, text = "where Jesus our forerunner has entered on our behalf. He has become a high priest forever in the order of Melchizedek." },
  { t = "note", id = "a", text = "Or *from acts that lead to death*" },
  { t = "note", id = "b", text = "Or *cleansing rites*" },
  { t = "note", id = "c", text = "Genesis 22:17" },
]

[[section]]
id = "7"
title = "Hebrews 7"
level = 1
blocks = [
  { t = "h", level = 2, text = "Melchizedek and Abraham" },
  { t = "ref", text = "(Genesis 14:17–24)" },
  { t = "v", n = 1, p = true, text = "This Melchizedek was king of Salem and priest of God Most High.[^a] He met Abraham returning from the slaughter of the kings and blessed him," },
  { t = "v", n = 2, text = "and Abraham apportioned to him a tenth of everything. First, his name means “king of righteousness.” Then also, “king of Salem” means “king of peace.”" },
  { t = "v", n = 3, text = "Without father or mother or genealogy, without beginning of days or end of life, like the Son of God, he remains a priest for all time." },
  { t = "v", n = 4, p = true, text = "Consider how great Melchizedek was: Even the patriarch Abraham gave him a tenth of the plunder." },
  { t = "v", n = 5, text = "Now the law commands the sons of Levi who become priests to collect a tenth from the people—that is, from their brothers—though they too are descended from Abraham." },
  { t = "v", n = 6, text = "But Melchizedek, who did not trace his descent from Levi, collected a tenth from Abraham and blessed him who had the promises." },
  { t = "v", n = 7, text = "And indisputably, the lesser is blessed by the greater." },
  { t = "v", n = 8, p = true, text = "In the case of the Levites, mortal men collect the tenth; but in the case of Melchizedek, it is affirmed that he lives on." },
  { t = "v", n = 9, text = "And so to speak, Levi, who collects the tenth, paid the tenth through Abraham." },
  { t = "v", n = 10, text = "For when Melchizedek met Abraham, Levi was still in the loin of his ancestor." },
  { t = "h", level = 2, text = "A Superior Priesthood" },
  { t = "v", n = 11, p = true, text = "Now if perfection could have been attained through the Levitical priesthood (for on this basis the people received the law), why was there still need for another priest to appear—one in the order of Melchizedek and not in the order of Aaron?" },
  { t = "v", n = 12, text = "For when the priesthood is changed, the law must be changed as well." },
  { t = "v", n = 13, p = true, text = "He of whom these things are said belonged to a different tribe, from which no one has ever served at the altar." },
  { t = "v", n = 14, text = "For it is clear that our Lord descended from Judah, a tribe as to which Moses said nothing about priests." },
  { t = "v", n = 15, p = true, text = "And this point is even more clear if another priest like Melchizedek appears," },
  { t = "v", n = 16, text = "one who has become a priest not by a law of succession, but by the power of an indestructible life." },
  { t = "v", n = 17, text = "For it is testified: “You are a priest forever in the order of Melchizedek.”[^b]" },
  { t = "v", n = 18, p = true, text = "So the former commandment is set aside because it was weak and useless" },
  { t = "v", n = 19, text = "(for the law made nothing perfect), and a better hope is introduced, by which we draw near to God." },
  { t = "v", n = 20, p = true, text = "And none of this happened without an oath. For others became priests without an oath," },
  { t = "v", n = 21, text = "but Jesus became a priest with an oath by the One who said to Him: “The Lord has sworn and will not change His mind: ‘You are a priest forever.’”[^c]" },
  { t = "v", n = 22, p = true, text = "Because of this oath, Jesus has become the guarantee of a better covenant." },
  { t = "v", n = 23, p = true, text = "Now there have been many other priests, since death prevented them from continuing in office." },
  { t = "v", n = 24, text = "But because Jesus lives forever, He has a permanent priesthood." },
  { t = "v", n = 25, text = "Therefore He is able to save completely[^d] those who draw near to God through Him, since He always lives to intercede for them." },
  { t = "v", n = 26, p = true, text = "Such a high priest truly befits us—One who is holy, innocent, undefiled, set apart from sinners, and exalted above the heavens." },
  { t = "v", n = 27, text = "Unlike the other high priests, He does not need to offer daily sacrifices, first for His own sins and then for the sins of the people; He sacrificed for sin once for all when He offered up Himself." },
  { t = "v", n = 28, text = "For the law appoints as high priests men who are weak; but the oath, which came after the law, appointed the Son, who has been made perfect forever." },
  { t = "note", id = "a", text = "Genesis 14:18" },
  { t = "note", id = "b", text = "Psalm 110:4" },
  { t = "note", id = "c", text = "Psalm 110:4" },
  { t = "note", id = "d", text = "Or *forever*" },
]

[[section]]
id = "8"
title = "Hebrews 8"
level = 1
blocks = [
  { t = "h", level = 2, text = "Christ’s Eternal Priesthood" },
  { t = "v", n = 1, p = true, text = "The point of what we are saying is this: We do have such a high priest, who sat down at the right hand of the throne of the Majesty in heaven," },
  { t = "v", n = 2, text = "and who ministers in the sanctuary and true tabernacle set up by the Lord, not by man." },
  { t = "v", n = 3, text = "And since every high priest is appointed to offer both gifts and sacrifices, it was necessary for this One also to have something to offer." },
  { t = "v", n = 4, p = true, text = "Now if He were on earth, He would not be a priest, since there are already priests who offer gifts according to the law." },
  { t = "v", n = 5, text = "The place where they serve is a copy and shadow of what is in heaven. This is why Moses was warned when he was about to build the tabernacle: “See to it that you make everything according to the pattern shown you on the mountain.”[^a]" },
  { t = "h", level = 2, text = "The New Covenant" },
  { t = "ref", text = "(Jeremiah 31:26–40)" },
  { t = "v", n = 6, p = true, text = "Now, however, Jesus has received a much more excellent ministry, just as the covenant He mediates is better and is founded on better promises." },
  { t = "v", n = 7, text = "For if that first covenant had been without fault, no place would have been sought for a second." },
  { t = "v", n = 8, text = "But God found fault with the people and said: “Behold, the days are coming, declares the Lord, when I will make a new covenant with the house of Israel and with the house of Judah." },
  { t = "v", n = 9, indent = 1, text = "It will not be like the covenant I made with their fathers when I took them by the hand to lead them out of the land of Egypt, because they did not abide by My covenant, and I disregarded them, declares the Lord." },
  { t = "v", n = 10, indent = 1, text = "For this is the covenant I will make with the house of Israel after those days, declares the Lord. I will put My laws in their minds and inscribe them on their hearts. And I will be their God, and they will be My people." },
  { t = "v", n = 11, indent = 1, text = "No longer will each one teach his neighbor or his brother, saying, ‘Know the Lord,’ because they will all know Me, from the least of them to the greatest." },
  { t = "v", n = 12, indent = 1, text = "For I will forgive their iniquities and will remember their sins no more.”[^b]" },
  { t = "v", n = 13, p = true, text = "By speaking of a new covenant,[^c] He has made the first one obsolete; and what is obsolete and aging will soon disappear." },
  { t = "note", id = "a", text = "Exodus 25:40; see also Exodus 26:30." },
  { t = "note", id = "b", text = "Jeremiah 31:31–34 (see also LXX)" },
  { t = "note", id = "c", text = "Literally *In saying new*; here and in Hebrews 9:1 and 18, *covenant* is included for clarity but is not contained in the Greek. A broader interpretation could also include *priesthood* or *tabernacle*." },
]

[[section]]
id = "9"
title = "Hebrews 9"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Earthly Tabernacle" },
  { t = "ref", text = "(Exodus 40:1–33; Acts 7:44–47)" },
  { t = "v", n = 1, p = true, text = "Now the first covenant[^a] had regulations for worship and also an earthly sanctuary." },
  { t = "v", n = 2, text = "A tabernacle was prepared. In its first room were the lampstand, the table, and the consecrated bread.[^b] This was called the Holy Place." },
  { t = "v", n = 3, text = "Behind the second curtain was a room called the Most Holy Place,[^c]" },
  { t = "v", n = 4, text = "containing the golden altar of incense and the gold-covered ark of the covenant. Inside the ark were the gold jar of manna, Aaron’s staff that had budded, and the stone tablets of the covenant." },
  { t = "v", n = 5, text = "Above the ark were the cherubim of glory, overshadowing the mercy seat.[^d] But we cannot discuss these things in detail now." },
  { t = "v", n = 6, p = true, text = "When everything had been prepared in this way, the priests entered regularly into the first room to perform their sacred duties." },
  { t = "v", n = 7, text = "But only the high priest entered the second room, and then only once a year, and never without blood, which he offered for himself and for the sins the people had committed in ignorance." },
  { t = "v", n = 8, p = true, text = "By this arrangement the Holy Spirit was showing that the way into the Most Holy Place[^e] had not yet been disclosed as long as the first tabernacle was still standing." },
  { t = "v", n = 9, text = "It is an illustration for the present time, because the gifts and sacrifices being offered were unable to cleanse the conscience of the worshiper." },
  { t = "v", n = 10, text = "They consist only in food and drink and special washings—external regulations imposed until the time of reform." },
  { t = "h", level = 2, text = "Redemption through His Blood" },
  { t = "v", n = 11, p = true, text = "But when Christ came as high priest of the good things that have come,[^f] He went through the greater and more perfect tabernacle that is not made by hands and is not a part of this creation." },
  { t = "v", n = 12, text = "He did not enter by the blood of goats and calves, but He entered the Most Holy Place once for all by His own blood, thus securing eternal redemption." },
  { t = "v", n = 13, p = true, text = "For if the blood of goats and bulls and the ashes of a heifer sprinkled on those who are ceremonially unclean sanctify them so that their bodies are clean," },
  { t = "v", n = 14, text = "how much more will the blood of Christ, who through the eternal Spirit offered Himself unblemished to God, purify our[^g] consciences from works of death, so that we may serve the living God!" },
  { t = "v", n = 15, p = true, text = "Therefore Christ is the mediator of a new covenant, so that those who are called may receive the promised eternal inheritance, now that He has died to redeem them from the transgressions committed under the first covenant." },
  { t = "v", n = 16, p = true, text = "In the case of a will,[^h] it is necessary to establish the death of the one who made it," },
  { t = "v", n = 17, text = "because a will does not take effect until the one who made it has died; it cannot be executed while he is still alive." },
  { t = "v", n = 18, p = true, text = "That is why even the first covenant was not put into effect without blood." },
  { t = "v", n = 19, text = "For when Moses had proclaimed every commandment of the law to all the people, he took the blood of calves and goats,[^i] along with water, scarlet wool, and hyssop, and sprinkled the scroll and all the people," },
  { t = "v", n = 20, text = "saying, “This is the blood of the covenant, which God has commanded you to keep.”[^j]" },
  { t = "v", n = 21, p = true, text = "In the same way, he sprinkled with blood the tabernacle and all the vessels used in worship." },
  { t = "v", n = 22, text = "According to the law, in fact, nearly everything must be purified with blood, and without the shedding of blood there is no forgiveness." },
  { t = "v", n = 23, p = true, text = "So it was necessary for the copies of the heavenly things to be purified with these sacrifices, but the heavenly things themselves with better sacrifices than these." },
  { t = "v", n = 24, text = "For Christ did not enter a man-made copy of the true sanctuary, but He entered heaven itself, now to appear on our behalf in the presence of God." },
  { t = "v", n = 25, p = true, text = "Nor did He enter heaven to offer Himself again and again, as the high priest enters the Most Holy Place every year with blood that is not his own." },
  { t = "v", n = 26, text = "Otherwise, Christ would have had to suffer repeatedly since the foundation of the world. But now He has appeared once for all at the end of the ages to do away with sin by the sacrifice of Himself." },
  { t = "v", n = 27, p = true, text = "Just as man is appointed to die once, and after that to face judgment," },
  { t = "v", n = 28, text = "so also Christ was offered once to bear the sins of many; and He will appear a second time, not to bear sin, but to bring salvation to those who eagerly await Him." },
  { t = "note", id = "a", text = "Literally *the first*; also in verse 18; see the footnote for Hebrews 8:13." },
  { t = "note", id = "b", text = "Or *the Bread of the Presence*" },
  { t = "note", id = "c", text = "Or *the Holy of Holies*" },
  { t = "note", id = "d", text = "Or *atonement cover*" },
  { t = "note", id = "e", text = "Or *the Holy Place*; also in verses 12 and 25" },
  { t = "note", id = "f", text = "BYZ and TR *that are to come*" },
  { t = "note", id = "g", text = "BYZ and TR *your*" },
  { t = "note", id = "h", text = "Greek *diathēkē* is also translated as *covenant* throughout this chapter." },
  { t = "note", id = "i", text = "SBL does not include *and goats*." },
  { t = "note", id = "j", text = "Exodus 24:8" },
]

[[section]]
id = "10"
title = "Hebrews 10"
level = 1
blocks = [
  { t = "h", level = 2, text = "Christ’s Perfect Sacrifice" },
  { t = "ref", text = "(Psalm 40:1–17)" },
  { t = "v", n = 1, p = true, text = "For the law is only a shadow of the good things to come, not the realities themselves. It can never, by the same sacrifices offered year after year, make perfect those who draw near to worship." },
  { t = "v", n = 2, text = "If it could, would not the offerings have ceased? For the worshipers would have been cleansed once for all, and would no longer have felt the guilt of their sins." },
  { t = "v", n = 3, p = true, text = "Instead, those sacrifices are an annual reminder of sins," },
  { t = "v", n = 4, text = "because it is impossible for the blood of bulls and goats to take away sins." },
  { t = "v", n = 5, text = "Therefore, when Christ came into the world, He said: “Sacrifice and offering You did not desire, but a body You prepared for Me." },
  { t = "v", n = 6, indent = 1, text = "In burnt offerings and sin offerings You took no delight." },
  { t = "v", n = 7, indent = 1, text = "Then I said, ‘Here I am, it is written about Me in the scroll: I have come to do Your will, O God.’”[^a]" },
  { t = "v", n = 8, p = true, text = "In the passage above He says, “Sacrifices and offerings, burnt offerings and sin offerings You did not desire, nor did You delight in them” (although they are offered according to the law)." },
  { t = "v", n = 9, text = "Then He adds, “Here I am, I have come to do Your will.” He takes away the first to establish the second." },
  { t = "v", n = 10, text = "And by that will, we have been sanctified through the sacrifice of the body of Jesus Christ once for all." },
  { t = "v", n = 11, p = true, text = "Day after day every priest stands to minister and to offer again and again the same sacrifices, which can never take away sins." },
  { t = "v", n = 12, text = "But when this Priest had offered for all time one sacrifice for sins, He sat down at the right hand of God." },
  { t = "v", n = 13, text = "Since that time, He waits for His enemies to be made a footstool for His feet," },
  { t = "v", n = 14, text = "because by a single offering He has made perfect for all time those who are being sanctified." },
  { t = "v", n = 15, p = true, text = "The Holy Spirit also testifies to us about this. First He says:" },
  { t = "v", n = 16, indent = 1, p = true, text = "“This is the covenant I will make with them after those days, declares the Lord. I will put My laws in their hearts and inscribe them on their minds.”[^b]" },
  { t = "v", n = 17, p = true, text = "Then He adds: “Their sins and lawless acts I will remember no more.”[^c]" },
  { t = "v", n = 18, p = true, text = "And where these have been forgiven, an offering for sin is no longer needed." },
  { t = "h", level = 2, text = "A Call to Persevere" },
  { t = "ref", text = "(Jude 1:17–23)" },
  { t = "v", n = 19, p = true, text = "Therefore, brothers, since we have confidence to enter the Most Holy Place[^d] by the blood of Jesus," },
  { t = "v", n = 20, text = "by the new and living way opened for us through the curtain of His body,[^e]" },
  { t = "v", n = 21, text = "and since we have a great priest over the house of God," },
  { t = "v", n = 22, text = "let us draw near with a sincere heart in full assurance of faith, having our hearts sprinkled to cleanse us from a guilty conscience and our bodies washed with pure water." },
  { t = "v", n = 23, p = true, text = "Let us hold resolutely to the hope we profess, for He who promised is faithful." },
  { t = "v", n = 24, text = "And let us consider how to spur one another on to love and good deeds." },
  { t = "v", n = 25, text = "Let us not neglect meeting together, as some have made a habit, but let us encourage one another, and all the more as you see the Day approaching." },
  { t = "v", n = 26, p = true, text = "If we deliberately go on sinning after we have received the knowledge of the truth, no further sacrifice for sins remains," },
  { t = "v", n = 27, text = "but only a fearful expectation of judgment and of raging fire that will consume all adversaries." },
  { t = "v", n = 28, text = "Anyone who rejected the law of Moses died without mercy on the testimony of two or three witnesses." },
  { t = "v", n = 29, text = "How much more severely do you think one deserves to be punished who has trampled on the Son of God, profaned the blood of the covenant that sanctified him, and insulted the Spirit of grace?" },
  { t = "v", n = 30, p = true, text = "For we know Him who said, “Vengeance is Mine; I will repay,”[^f] and again, “The Lord will judge His people.”[^g]" },
  { t = "v", n = 31, text = "It is a fearful thing to fall into the hands of the living God." },
  { t = "v", n = 32, p = true, text = "Remember the early days that you were in the light.[^h] In those days, you endured a great conflict in the face of suffering." },
  { t = "v", n = 33, text = "Sometimes you were publicly exposed to ridicule and persecution; at other times you were partners with those who were so treated." },
  { t = "v", n = 34, text = "You sympathized with those in prison and joyfully accepted the confiscation of your property, knowing that you yourselves had a better and permanent possession." },
  { t = "v", n = 35, p = true, text = "So do not throw away your confidence; it holds a great reward." },
  { t = "v", n = 36, text = "You need to persevere, so that after you have done the will of God, you will receive what He has promised." },
  { t = "v", n = 37, text = "For, “In just a little while, He who is coming will come and will not delay." },
  { t = "v", n = 38, indent = 1, text = "But My righteous one will live by faith;[^i] and if he shrinks back, I will take no pleasure in him.”[^j]" },
  { t = "v", n = 39, p = true, text = "But we are not of those who shrink back and are destroyed, but of those who have faith and preserve their souls." },
  { t = "note", id = "a", text = "Psalm 40:6–8 (see also LXX)" },
  { t = "note", id = "b", text = "Jeremiah 31:33" },
  { t = "note", id = "c", text = "Jeremiah 31:34" },
  { t = "note", id = "d", text = "Or *the Holy Place*" },
  { t = "note", id = "e", text = "Literally *through the veil that is His flesh*" },
  { t = "note", id = "f", text = "Deuteronomy 32:35 (see also LXX)" },
  { t = "note", id = "g", text = "Deuteronomy 32:36; Psalm 135:14" },
  { t = "note", id = "h", text = "Or *Remember when you were first enlightened.*" },
  { t = "note", id = "i", text = "BYZ and TR *But the righteous will live by faith*" },
  { t = "note", id = "j", text = "Habakkuk 2:3–4 (see also LXX)" },
]

[[section]]
id = "11"
title = "Hebrews 11"
level = 1
blocks = [
  { t = "h", level = 2, text = "Faith and Assurance" },
  { t = "ref", text = "(Genesis 1:1–2; John 1:1–5)" },
  { t = "v", n = 1, p = true, text = "Now faith is the assurance of what we hope for and the certainty of what we do not see." },
  { t = "v", n = 2, text = "This is why the ancients were commended." },
  { t = "v", n = 3, p = true, text = "By faith we understand that the universe was formed at God’s command, so that what is seen was not made out of what was visible." },
  { t = "h", level = 2, text = "The Faith of Abel, Enoch, Noah" },
  { t = "ref", text = "(Genesis 4–9)" },
  { t = "v", n = 4, p = true, text = "By faith Abel offered God a better sacrifice than Cain did. By faith he was commended as righteous when God gave approval to his gifts. And by faith he still speaks, even though he is dead." },
  { t = "v", n = 5, p = true, text = "By faith Enoch was taken up[^a] so that he did not see death: “He could not be found, because God had taken him away.”[^b] For before he was taken, he was commended as one who pleased God." },
  { t = "v", n = 6, p = true, text = "And without faith it is impossible to please God. For anyone who approaches Him must believe that He exists and that He rewards those who earnestly seek Him." },
  { t = "v", n = 7, p = true, text = "By faith Noah, when warned about things not yet seen, in godly fear built an ark to save his family. By faith he condemned the world and became heir of the righteousness that comes by faith." },
  { t = "h", level = 2, text = "The Faith of Abraham and Sarah" },
  { t = "ref", text = "(Genesis 15–22; Romans 4:1–12)" },
  { t = "v", n = 8, p = true, text = "By faith Abraham, when called to go to a place he would later receive as his inheritance, obeyed and went, without knowing where he was going." },
  { t = "v", n = 9, text = "By faith he dwelt in the promised land as a stranger in a foreign country. He lived in tents, as did Isaac and Jacob, who were heirs with him of the same promise." },
  { t = "v", n = 10, text = "For he was looking forward to the city with foundations, whose architect and builder is God." },
  { t = "v", n = 11, p = true, text = "By faith Sarah, even though she was barren and beyond the proper age, was enabled to conceive a child, because she considered Him faithful who had promised." },
  { t = "v", n = 12, text = "And so from one man, and he as good as dead, came descendants as numerous as the stars in the sky and as countless as the sand on the seashore." },
  { t = "v", n = 13, p = true, text = "All these people died in faith, without having received the things they were promised. However, they saw them and welcomed them from afar. And they acknowledged that they were strangers and exiles on the earth." },
  { t = "v", n = 14, p = true, text = "Now those who say such things show that they are seeking a country of their own." },
  { t = "v", n = 15, text = "If they had been thinking of the country they had left, they would have had opportunity to return." },
  { t = "v", n = 16, text = "Instead, they were longing for a better country, a heavenly one. Therefore God is not ashamed to be called their God, for He has prepared a city for them." },
  { t = "v", n = 17, p = true, text = "By faith Abraham, when he was tested, offered up Isaac on the altar. He who had received the promises was ready to offer his one and only son,[^c]" },
  { t = "v", n = 18, text = "even though God had said to him, “Through Isaac your offspring will be reckoned.”[^d]" },
  { t = "v", n = 19, text = "Abraham reasoned that God could raise the dead, and in a sense, he did receive Isaac back from death." },
  { t = "h", level = 2, text = "The Faith of Isaac, Jacob, and Joseph" },
  { t = "ref", text = "(Genesis 27–50)" },
  { t = "v", n = 20, p = true, text = "By faith Isaac blessed Jacob and Esau concerning the future." },
  { t = "v", n = 21, p = true, text = "By faith Jacob, when he was dying, blessed each of Joseph’s sons and worshiped as he leaned on the top of his staff." },
  { t = "v", n = 22, p = true, text = "By faith Joseph, when his end was near, spoke about the exodus of the Israelites and gave instructions about his bones." },
  { t = "h", level = 2, text = "The Faith of Moses" },
  { t = "ref", text = "(Exodus 2–15; Acts 7:20–22)" },
  { t = "v", n = 23, p = true, text = "By faith Moses’ parents hid him for three months after his birth, because they saw that he was a beautiful child, and they were unafraid of the king’s edict." },
  { t = "v", n = 24, p = true, text = "By faith Moses, when he was grown, refused to be called the son of Pharaoh’s daughter." },
  { t = "v", n = 25, text = "He chose to suffer oppression with God’s people rather than to experience the fleeting enjoyment of sin." },
  { t = "v", n = 26, text = "He valued disgrace for Christ above the treasures of Egypt, for he was looking ahead to his reward." },
  { t = "v", n = 27, p = true, text = "By faith Moses left Egypt, not fearing the king’s anger; he persevered because he saw Him who is invisible." },
  { t = "v", n = 28, text = "By faith he kept the Passover and the sprinkling of blood, so that the destroyer of the firstborn would not touch Israel’s own firstborn." },
  { t = "v", n = 29, p = true, text = "By faith the people passed through the Red Sea as on dry land; but when the Egyptians tried to follow,[^e] they were drowned." },
  { t = "h", level = 2, text = "The Faith of Many" },
  { t = "ref", text = "(Joshua–Malachi)" },
  { t = "v", n = 30, p = true, text = "By faith the walls of Jericho fell, after the people had marched around them for seven days." },
  { t = "v", n = 31, p = true, text = "By faith the prostitute Rahab, because she welcomed the spies in peace, did not perish with those who were disobedient." },
  { t = "v", n = 32, p = true, text = "And what more shall I say? Time will not allow me to tell of Gideon, Barak, Samson, Jephthah, David, Samuel, and the prophets," },
  { t = "v", n = 33, text = "who through faith conquered kingdoms, administered justice, and gained what was promised; who shut the mouths of lions," },
  { t = "v", n = 34, text = "quenched the raging fire, and escaped the edge of the sword; who gained strength from weakness, became mighty in battle, and put foreign armies to flight." },
  { t = "v", n = 35, p = true, text = "Women received back their dead, raised to life again. Others were tortured and refused their release, so that they might gain a better resurrection." },
  { t = "v", n = 36, text = "Still others endured mocking and flogging, and even chains and imprisonment." },
  { t = "v", n = 37, p = true, text = "They were stoned, they were sawed in two,[^f] they were put to death by the sword. They went around in sheepskins and goatskins, destitute, oppressed, and mistreated." },
  { t = "v", n = 38, text = "The world was not worthy of them. They wandered in deserts and mountains, and hid in caves and holes in the ground." },
  { t = "v", n = 39, p = true, text = "These were all commended for their faith, yet they did not receive what was promised." },
  { t = "v", n = 40, text = "God had planned something better for us, so that together with us they would be made perfect." },
  { t = "note", id = "a", text = "Literally *transferred* or *translated*" },
  { t = "note", id = "b", text = "Genesis 5:24 (see also LXX)" },
  { t = "note", id = "c", text = "Or *only begotten son* or *unique son*" },
  { t = "note", id = "d", text = "Genesis 21:12" },
  { t = "note", id = "e", text = "Literally *made an attempt*" },
  { t = "note", id = "f", text = "NE, WH, BYZ, and TR include *they were put to the test,*" },
]

[[section]]
id = "12"
title = "Hebrews 12"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Call to Endurance" },
  { t = "ref", text = "(2 Timothy 2:1–13)" },
  { t = "v", n = 1, p = true, text = "Therefore, since we are surrounded by such a great cloud of witnesses, let us throw off every encumbrance and the sin that so easily entangles, and let us run with endurance the race set out for us." },
  { t = "v", n = 2, text = "Let us fix our eyes on Jesus, the author[^a] and perfecter of our faith, who for the joy set before Him endured the cross, scorning its shame, and sat down at the right hand of the throne of God." },
  { t = "v", n = 3, text = "Consider Him who endured such hostility from sinners, so that you will not grow weary and lose heart." },
  { t = "h", level = 2, text = "God Disciplines His Sons" },
  { t = "v", n = 4, p = true, text = "In your struggle against sin, you have not yet resisted to the point of shedding your blood." },
  { t = "v", n = 5, text = "And you have forgotten the exhortation that addresses you as sons: “My son, do not take lightly the discipline of the Lord, and do not lose heart when He rebukes you." },
  { t = "v", n = 6, indent = 1, text = "For the Lord disciplines the one He loves, and He chastises every son He receives.”[^b]" },
  { t = "v", n = 7, p = true, text = "Endure suffering as discipline; God is treating you as sons. For what son is not disciplined by his father?" },
  { t = "v", n = 8, text = "If you do not experience discipline like everyone else, then you are illegitimate children and not true sons." },
  { t = "v", n = 9, text = "Furthermore, we have all had earthly fathers who disciplined us, and we respected them. Should we not much more submit to the Father of our spirits and live?" },
  { t = "v", n = 10, p = true, text = "Our fathers disciplined us for a short time as they thought best, but God disciplines us for our good, so that we may share in His holiness." },
  { t = "v", n = 11, text = "No discipline seems enjoyable at the time, but painful. Later on, however, it yields a harvest of righteousness and peace[^c] to those who have been trained by it." },
  { t = "v", n = 12, p = true, text = "Therefore strengthen your limp hands and weak knees.[^d]" },
  { t = "v", n = 13, text = "Make straight paths for your feet,[^e] so that the lame may not be disabled, but rather healed." },
  { t = "h", level = 2, text = "A Call to Holiness" },
  { t = "ref", text = "(1 Peter 1:13–21)" },
  { t = "v", n = 14, p = true, text = "Pursue peace with everyone, as well as holiness, without which no one will see the Lord." },
  { t = "v", n = 15, text = "See to it that no one falls short of the grace of God, and that no root of bitterness[^f] springs up to cause trouble and defile many." },
  { t = "v", n = 16, text = "See to it that no one is sexually immoral, or is godless like Esau, who for a single meal sold his birthright." },
  { t = "v", n = 17, text = "For you know that afterward, when he wanted to inherit the blessing, he was rejected. He could find no ground for repentance, though he sought the blessing with tears." },
  { t = "h", level = 2, text = "An Unshakable Kingdom" },
  { t = "ref", text = "(Exodus 20:18–21; Deuteronomy 5:22–33)" },
  { t = "v", n = 18, p = true, text = "For you have not come to a mountain that can be touched and that[^g] is burning with fire; to darkness, gloom, and storm;" },
  { t = "v", n = 19, text = "to a trumpet blast or to a voice that made its hearers beg that no further word be spoken." },
  { t = "v", n = 20, text = "For they could not bear what was commanded: “If even an animal touches the mountain, it must be stoned.”[^h]" },
  { t = "v", n = 21, text = "The sight was so terrifying that even Moses said, “I am trembling with fear.”[^i]" },
  { t = "v", n = 22, p = true, text = "Instead, you have come to Mount Zion, to the city of the living God, the heavenly Jerusalem. You have come to myriads of angels" },
  { t = "v", n = 23, text = "in joyful assembly, to the congregation of the firstborn, enrolled in heaven. You have come to God the Judge of all, to the spirits of the righteous made perfect," },
  { t = "v", n = 24, text = "to Jesus the mediator of a new covenant, and to the sprinkled blood that speaks a better word than the blood of Abel." },
  { t = "v", n = 25, p = true, text = "See to it that you do not refuse Him who speaks. For if the people did not escape when they refused Him who warned them on earth, how much less will we escape if we reject Him who warns us from heaven?" },
  { t = "v", n = 26, text = "At that time His voice shook the earth, but now He has promised, “Once more I will shake not only the earth, but heaven as well.”[^j]" },
  { t = "v", n = 27, text = "The words “Once more” signify the removal of what can be shaken—that is, created things—so that the unshakable may remain." },
  { t = "v", n = 28, p = true, text = "Therefore, since we are receiving an unshakable kingdom, let us be filled with gratitude, and so worship God acceptably with reverence and awe." },
  { t = "v", n = 29, text = "“For our God is a consuming fire.”[^k]" },
  { t = "note", id = "a", text = "Or *pioneer* or *founder*" },
  { t = "note", id = "b", text = "Literally *and He flogs every son He receives*; Proverbs 3:11–12 (see also LXX)" },
  { t = "note", id = "c", text = "Or *it yields the peaceful fruit of righteousness*" },
  { t = "note", id = "d", text = "Isaiah 35:3" },
  { t = "note", id = "e", text = "Proverbs 4:26 (see also LXX)" },
  { t = "note", id = "f", text = "See Deuteronomy 29:18" },
  { t = "note", id = "g", text = "Literally *to what can be touched and*" },
  { t = "note", id = "h", text = "Exodus 19:12–13" },
  { t = "note", id = "i", text = "Deuteronomy 9:19" },
  { t = "note", id = "j", text = "Haggai 2:6" },
  { t = "note", id = "k", text = "Deuteronomy 4:24" },
]

[[section]]
id = "13"
title = "Hebrews 13"
level = 1
blocks = [
  { t = "h", level = 2, text = "Brotherly Love" },
  { t = "v", n = 1, p = true, text = "Continue in brotherly love." },
  { t = "v", n = 2, text = "Do not neglect to show hospitality to strangers, for by so doing some people have entertained angels without knowing it." },
  { t = "v", n = 3, text = "Remember those in prison as if you were bound with them, and those who are mistreated as if you were suffering with them." },
  { t = "v", n = 4, p = true, text = "Marriage should be honored by all and the marriage bed kept undefiled, for God will judge the sexually immoral and adulterers." },
  { t = "h", level = 2, text = "Christ’s Unchanging Nature" },
  { t = "v", n = 5, p = true, text = "Keep your lives free from the love of money and be content with what you have, for God has said: “Never will I leave you, never will I forsake you.”[^a]" },
  { t = "v", n = 6, p = true, text = "So we say with confidence: “The Lord is my helper; I will not be afraid. What can man do to me?”[^b]" },
  { t = "v", n = 7, p = true, text = "Remember your leaders who spoke the word of God to you. Consider the outcome of their way of life and imitate their faith." },
  { t = "v", n = 8, text = "Jesus Christ is the same yesterday and today and forever." },
  { t = "v", n = 9, p = true, text = "Do not be carried away by all kinds of strange teachings, for it is good for the heart to be strengthened by grace and not by foods of no value to those devoted to them." },
  { t = "v", n = 10, text = "We have an altar from which those who serve at the tabernacle have no right to eat." },
  { t = "v", n = 11, p = true, text = "Although the high priest brings the blood of animals into the Holy Place as a sacrifice for sin, the bodies are burned outside the camp." },
  { t = "v", n = 12, text = "And so Jesus also suffered outside the city gate, to sanctify the people by His own blood." },
  { t = "v", n = 13, text = "Therefore let us go to Him outside the camp, bearing the disgrace He bore." },
  { t = "v", n = 14, text = "For here we do not have a permanent city, but we are looking for the city that is to come." },
  { t = "h", level = 2, text = "Sacrifice, Obedience, and Prayer" },
  { t = "v", n = 15, p = true, text = "Through Jesus, therefore, let us continually offer to God a sacrifice of praise, the fruit of lips that confess His name." },
  { t = "v", n = 16, text = "And do not neglect to do good and to share with others, for with such sacrifices God is pleased." },
  { t = "v", n = 17, p = true, text = "Obey your leaders and submit to them, for they watch over your souls as those who must give an account. To this end, allow them to lead with joy and not with grief, for that would be of no advantage to you." },
  { t = "v", n = 18, p = true, text = "Pray for us; we are convinced that we have a clear conscience and desire to live honorably in every way." },
  { t = "v", n = 19, text = "And I especially urge you to pray that I may be restored to you soon." },
  { t = "h", level = 2, text = "Benediction and Farewell" },
  { t = "v", n = 20, p = true, text = "Now may the God of peace, who through the blood of the eternal covenant brought back from the dead our Lord Jesus, that great Shepherd of the sheep," },
  { t = "v", n = 21, text = "equip you with every good thing[^c] to do His will. And may He accomplish in us[^d] what is pleasing in His sight through Jesus Christ, to whom be glory forever and ever. Amen." },
  { t = "v", n = 22, p = true, text = "I urge you, brothers, to bear with my word of exhortation, for I have only written to you briefly." },
  { t = "v", n = 23, p = true, text = "Be aware that our brother Timothy has been released. If he arrives soon, I will come with him to see you." },
  { t = "v", n = 24, p = true, text = "Greet all your leaders and all the saints. Those from Italy send you greetings." },
  { t = "v", n = 25, p = true, text = "Grace be with all of you.[^e]" },
  { t = "note", id = "a", text = "Deuteronomy 31:6, 8; Joshua 1:5" },
  { t = "note", id = "b", text = "Psalm 118:6 (see also LXX)" },
  { t = "note", id = "c", text = "BYZ and TR *every good work*" },
  { t = "note", id = "d", text = "BYZ and TR *you*" },
  { t = "note", id = "e", text = "BYZ and TR include *Amen.*" },
]

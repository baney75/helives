[[section]]
id = "1"
title = "2 Corinthians 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "Paul Greets the Corinthians" },
  { t = "ref", text = "(Acts 18:1–11; 1 Corinthians 1:1–3)" },
  { t = "v", n = 1, p = true, text = "Paul, an apostle of Christ Jesus by the will of God, and Timothy our brother, To the church of God in Corinth, together with all the saints throughout Achaia:" },
  { t = "v", n = 2, p = true, text = "Grace and peace to you from God our Father and the Lord Jesus Christ." },
  { t = "h", level = 2, text = "The God of All Comfort" },
  { t = "v", n = 3, p = true, text = "Blessed be the God and Father of our Lord Jesus Christ, the Father of compassion and the God of all comfort," },
  { t = "v", n = 4, text = "who comforts us in all our troubles, so that we can comfort those in any trouble with the comfort we ourselves have received from God." },
  { t = "v", n = 5, text = "For just as the sufferings of Christ overflow to us, so also through Christ our comfort overflows." },
  { t = "v", n = 6, p = true, text = "If we are afflicted, it is for your comfort and salvation; if we are comforted, it is for your comfort, which accomplishes in you patient endurance of the same sufferings we experience." },
  { t = "v", n = 7, text = "And our hope for you is sure, because we know that just as you share in our sufferings, so also you will share in our comfort." },
  { t = "v", n = 8, p = true, text = "We do not want you to be unaware, brothers, of the hardships we encountered in the province of Asia.[^a] We were under a burden far beyond our ability to endure, so that we despaired even of life." },
  { t = "v", n = 9, text = "Indeed, we felt we were under the sentence of death, in order that we would not trust in ourselves, but in God, who raises the dead." },
  { t = "v", n = 10, p = true, text = "He has delivered us from such a deadly peril, and He will deliver us. In Him we have placed our hope that He will yet again deliver us," },
  { t = "v", n = 11, text = "as you help us by your prayers. Then many will give thanks on our behalf for the favor shown us in answer to their prayers." },
  { t = "h", level = 2, text = "Paul’s Change of Plans" },
  { t = "v", n = 12, p = true, text = "For this is our boast: Our conscience testifies that we have conducted ourselves in the world, and especially in relation to you, in the holiness and sincerity that are from God—not in worldly[^b] wisdom, but in the grace of God." },
  { t = "v", n = 13, text = "For we do not write you anything that is beyond your ability to read and understand. And I hope that you will understand us completely," },
  { t = "v", n = 14, text = "as you have already understood us in part, that you may boast of us just as we will boast of you in the day of our Lord Jesus.[^c]" },
  { t = "v", n = 15, p = true, text = "Confident of this, I planned to visit you first, so that you might receive a double blessing." },
  { t = "v", n = 16, text = "I wanted to visit you on my way to Macedonia, and to return to you from Macedonia, and then to have you help me on my way to Judea." },
  { t = "v", n = 17, p = true, text = "When I planned this, did I do it carelessly? Or do I make my plans by human standards, so as to say “Yes, yes” and also “No, no”?" },
  { t = "v", n = 18, text = "But as surely as God is faithful, our message to you is not “Yes” and “No.”" },
  { t = "v", n = 19, text = "For the Son of God, Jesus Christ, who was proclaimed among you by me and Silvanus[^d] and Timothy, was not “Yes” and “No,” but in Him it has always been “Yes.”" },
  { t = "v", n = 20, text = "For all the promises of God are “Yes” in Christ. And so through Him, our “Amen” is spoken to the glory of God." },
  { t = "v", n = 21, p = true, text = "Now it is God who establishes both us and you in Christ. He anointed us," },
  { t = "v", n = 22, text = "placed His seal on us, and put His Spirit in our hearts as a pledge of what is to come." },
  { t = "v", n = 23, text = "I call God as my witness that it was in order to spare you that I did not return to Corinth." },
  { t = "v", n = 24, text = "Not that we lord it over your faith, but we are fellow workers with you for your joy, because it is by faith that you stand firm." },
  { t = "note", id = "a", text = "Literally *in Asia*; Asia was a Roman province in what is now western Turkey." },
  { t = "note", id = "b", text = "Literally *fleshly*" },
  { t = "note", id = "c", text = "BYZ and TR *the Lord Jesus*" },
  { t = "note", id = "d", text = "That is, Silas" },
]

[[section]]
id = "2"
title = "2 Corinthians 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "Reaffirm Your Love" },
  { t = "v", n = 1, p = true, text = "So I made up my mind not to make another painful visit to you." },
  { t = "v", n = 2, text = "For if I grieve you, who is left to cheer me but those whom I have grieved?" },
  { t = "v", n = 3, text = "I wrote as I did so that on my arrival I would not be grieved by those who ought to make me rejoice. I had confidence in all of you, that you would share my joy." },
  { t = "v", n = 4, text = "For through many tears I wrote you out of great distress and anguish of heart, not to grieve you but to let you know how much I love you." },
  { t = "v", n = 5, p = true, text = "Now if anyone has caused grief, he has not grieved me but all of you—to some degree, not to overstate it." },
  { t = "v", n = 6, text = "The punishment imposed on him by the majority is sufficient for him." },
  { t = "v", n = 7, text = "So instead, you ought to forgive and comfort him, so that he will not be overwhelmed by excessive sorrow." },
  { t = "v", n = 8, text = "Therefore I urge you to reaffirm your love for him." },
  { t = "v", n = 9, p = true, text = "My purpose in writing you was to see if you would stand the test and be obedient in everything." },
  { t = "v", n = 10, text = "If you forgive anyone, I also forgive him. And if I have forgiven anything, I have forgiven it in the presence of Christ for your sake," },
  { t = "v", n = 11, text = "in order that Satan should not outwit us. For we are not unaware of his schemes." },
  { t = "h", level = 2, text = "Triumph in Christ" },
  { t = "v", n = 12, p = true, text = "Now when I went to Troas to preach the gospel of Christ and a door stood open for me in the Lord," },
  { t = "v", n = 13, text = "I had no peace in my spirit, because I did not find my brother Titus there. So I said goodbye to them and went on to Macedonia." },
  { t = "v", n = 14, p = true, text = "But thanks be to God, who always leads us triumphantly as captives in Christ and through us spreads everywhere the fragrance of the knowledge of Him." },
  { t = "v", n = 15, text = "For we are to God the sweet aroma of Christ among those who are being saved and those who are perishing." },
  { t = "v", n = 16, text = "To the one we are an odor that brings death, to the other a fragrance that brings life.[^a] And who is qualified for such a task?" },
  { t = "v", n = 17, p = true, text = "For we are not like so many others, who peddle the word of God for profit. On the contrary, in Christ we speak before God with sincerity, as men sent from God." },
  { t = "note", id = "a", text = "Literally *To the one, indeed, an aroma from death to death; but to the other, an aroma from life to life.*" },
]

[[section]]
id = "3"
title = "2 Corinthians 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "Ministers of a New Covenant" },
  { t = "v", n = 1, p = true, text = "Are we beginning to commend ourselves again? Or do we need, like some people, letters of recommendation to you or from you?" },
  { t = "v", n = 2, text = "You yourselves are our letter, inscribed on our hearts, known and read by everyone." },
  { t = "v", n = 3, text = "It is clear that you are a letter from Christ, the result of our ministry, written not with ink but with the Spirit of the living God, not on tablets of stone but on tablets of human hearts." },
  { t = "v", n = 4, p = true, text = "Such confidence before God is ours through Christ." },
  { t = "v", n = 5, text = "Not that we are competent in ourselves to claim that anything comes from us, but our competence comes from God." },
  { t = "v", n = 6, text = "And He has qualified us as ministers of a new covenant, not of the letter but of the Spirit; for the letter kills, but the Spirit gives life." },
  { t = "h", level = 2, text = "The Glory of the New Covenant" },
  { t = "ref", text = "(Exodus 34:10–35)" },
  { t = "v", n = 7, p = true, text = "Now if the ministry of death, which was engraved in letters on stone, came with such glory that the Israelites could not gaze at the face of Moses because of its fleeting glory," },
  { t = "v", n = 8, text = "will not the ministry of the Spirit be even more glorious?" },
  { t = "v", n = 9, text = "For if the ministry of condemnation was glorious, how much more glorious is the ministry of righteousness!" },
  { t = "v", n = 10, text = "Indeed, what was once glorious has no glory now in comparison to the glory that surpasses it." },
  { t = "v", n = 11, text = "For if what was fading away came with glory, how much greater is the glory of that which endures!" },
  { t = "v", n = 12, p = true, text = "Therefore, since we have such a hope, we are very bold." },
  { t = "v", n = 13, text = "We are not like Moses, who would put a veil over his face to keep the Israelites from gazing at the end of what was fading away." },
  { t = "v", n = 14, p = true, text = "But their minds were closed. For to this day the same veil remains at the reading of the old covenant. It has not been lifted, because only in Christ can it be removed." },
  { t = "v", n = 15, text = "And even to this day when Moses is read, a veil covers their hearts." },
  { t = "v", n = 16, text = "But whenever anyone turns to the Lord, the veil is taken away." },
  { t = "v", n = 17, p = true, text = "Now the Lord is the Spirit, and where the Spirit of the Lord is, there is freedom." },
  { t = "v", n = 18, text = "And we, who with unveiled faces all reflect the glory of the Lord, are being transformed into His image with intensifying glory, which comes from the Lord, who is the Spirit." },
]

[[section]]
id = "4"
title = "2 Corinthians 4"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Light of the Gospel" },
  { t = "v", n = 1, p = true, text = "Therefore, since God in His mercy has given us this ministry,[^a] we do not lose heart." },
  { t = "v", n = 2, text = "Instead, we have renounced secret and shameful ways. We do not practice deceit, nor do we distort the word of God. On the contrary, by open proclamation of the truth, we commend ourselves to every man’s conscience in the sight of God." },
  { t = "v", n = 3, text = "And even if our gospel is veiled, it is veiled to those who are perishing." },
  { t = "v", n = 4, p = true, text = "The god of this age has blinded the minds of unbelievers, so they cannot see the light of the gospel of the glory of Christ, who is the image of God." },
  { t = "v", n = 5, text = "For we do not proclaim ourselves, but Jesus Christ as Lord, and ourselves as your servants for Jesus’ sake." },
  { t = "v", n = 6, text = "For God, who said, “Let light shine out of darkness,”[^b] made His light shine in our hearts to give us the light of the knowledge of the glory of God in the face of Jesus Christ.[^c]" },
  { t = "h", level = 2, text = "Treasure in Jars of Clay" },
  { t = "ref", text = "(Romans 6:1–14)" },
  { t = "v", n = 7, p = true, text = "Now we have this treasure in jars of clay to show that this surpassingly great power is from God and not from us." },
  { t = "v", n = 8, text = "We are hard pressed on all sides, but not crushed; perplexed, but not in despair;" },
  { t = "v", n = 9, text = "persecuted, but not forsaken; struck down, but not destroyed." },
  { t = "v", n = 10, p = true, text = "We always carry around in our body the death of Jesus, so that the life of Jesus may also be revealed in our body." },
  { t = "v", n = 11, text = "For we who are alive are always consigned to death for Jesus’ sake, so that the life of Jesus may also be revealed in our mortal body." },
  { t = "v", n = 12, text = "So then, death is at work in us, but life is at work in you." },
  { t = "v", n = 13, p = true, text = "And in keeping with what is written, “I believed, therefore I have spoken,”[^d] we who have the same spirit of faith also believe and therefore speak," },
  { t = "v", n = 14, text = "knowing that the One who raised the Lord Jesus[^e] will also raise us with Jesus and present us with you in His presence." },
  { t = "v", n = 15, text = "All this is for your benefit, so that the grace that is extending to more and more people may cause thanksgiving to overflow, to the glory of God." },
  { t = "v", n = 16, p = true, text = "Therefore we do not lose heart. Though our outer self is wasting away, yet our inner self is being renewed day by day." },
  { t = "v", n = 17, text = "For our light and momentary affliction is producing for us an eternal weight of glory that is far beyond comparison." },
  { t = "v", n = 18, text = "So we fix our eyes not on what is seen, but on what is unseen. For what is seen is temporary, but what is unseen is eternal." },
  { t = "note", id = "a", text = "Literally *Therefore, having this ministry, as we have received mercy,*" },
  { t = "note", id = "b", text = "Genesis 1:3" },
  { t = "note", id = "c", text = "SBL, NE, and WH *in the face of Christ*" },
  { t = "note", id = "d", text = "Psalm 116:10 (see also LXX)" },
  { t = "note", id = "e", text = "SBL *who raised Jesus*" },
]

[[section]]
id = "5"
title = "2 Corinthians 5"
level = 1
blocks = [
  { t = "h", level = 2, text = "Our Eternal Dwelling" },
  { t = "ref", text = "(Romans 8:18–27)" },
  { t = "v", n = 1, p = true, text = "For we know that if the earthly tent we live in is dismantled, we have a building from God, an eternal house in heaven, not built by human hands." },
  { t = "v", n = 2, text = "For in this tent we groan, longing to be clothed with our heavenly dwelling," },
  { t = "v", n = 3, text = "because when we are clothed, we will not be found naked." },
  { t = "v", n = 4, text = "For while we are in this tent, we groan under our burdens, because we do not wish to be unclothed but clothed, so that our mortality may be swallowed up by life." },
  { t = "v", n = 5, text = "And it is God who has prepared us for this very purpose and has given us the Spirit as a pledge of what is to come." },
  { t = "v", n = 6, p = true, text = "Therefore we are always confident, although we know that while we are at home in the body, we are away from the Lord." },
  { t = "v", n = 7, text = "For we walk by faith, not by sight." },
  { t = "v", n = 8, text = "We are confident, then, and would prefer to be away from the body and at home with the Lord." },
  { t = "v", n = 9, text = "So we aspire to please Him, whether we are at home in this body or away from it." },
  { t = "v", n = 10, text = "For we must all appear before the judgment seat of Christ, that each one may receive his due for the things done in the body, whether good or bad." },
  { t = "h", level = 2, text = "Ambassadors for Christ" },
  { t = "v", n = 11, p = true, text = "Therefore, since we know what it means to fear the Lord, we try to persuade men. What we are is clear to God, and I hope it is clear to your conscience as well." },
  { t = "v", n = 12, text = "We are not commending ourselves to you again. Instead, we are giving you an occasion to be proud of us, so that you can answer those who take pride in appearances rather than in the heart." },
  { t = "v", n = 13, p = true, text = "If we are out of our mind, it is for God; if we are of sound mind, it is for you." },
  { t = "v", n = 14, text = "For Christ’s love compels us, because we are convinced that One died for all, therefore all died." },
  { t = "v", n = 15, text = "And He died for all, that those who live should no longer live for themselves, but for Him who died for them and was raised again." },
  { t = "v", n = 16, p = true, text = "So from now on we regard no one according to the flesh. Although we once regarded Christ in this way, we do so no longer." },
  { t = "v", n = 17, text = "Therefore if anyone is in Christ, he is a new creation.[^a] The old has passed away. Behold, the new has come!" },
  { t = "v", n = 18, p = true, text = "All this is from God, who reconciled us to Himself through Christ and gave us the ministry of reconciliation:" },
  { t = "v", n = 19, text = "that God was reconciling the world to Himself in Christ, not counting men’s trespasses against them. And He has committed to us the message of reconciliation." },
  { t = "v", n = 20, p = true, text = "Therefore we are ambassadors for Christ, as though God were making His appeal through us. We implore you on behalf of Christ: Be reconciled to God." },
  { t = "v", n = 21, text = "God made Him who knew no sin to be sin[^b] on our behalf, so that in Him we might become the righteousness of God." },
  { t = "note", id = "a", text = "Or *a new creature*" },
  { t = "note", id = "b", text = "Or *a sin offering*" },
]

[[section]]
id = "6"
title = "2 Corinthians 6"
level = 1
blocks = [
  { t = "h", level = 2, text = "Paul’s Hardships and God’s Grace" },
  { t = "v", n = 1, p = true, text = "As God’s fellow workers,[^a] then, we urge you not to receive God’s grace in vain." },
  { t = "v", n = 2, text = "For He says: “In the time of favor I heard you, and in the day of salvation I helped you.”[^b] Behold, now is the time of favor; now is the day of salvation!" },
  { t = "v", n = 3, p = true, text = "We put no obstacle in anyone’s way, so that no one can discredit our ministry." },
  { t = "v", n = 4, p = true, text = "Rather, as servants of God we commend ourselves in every way: in great endurance; in troubles, hardships, and calamities;" },
  { t = "v", n = 5, text = "in beatings, imprisonments, and riots; in labor, sleepless nights, and hunger;" },
  { t = "v", n = 6, text = "in purity, knowledge, patience, and kindness; in the Holy Spirit and in sincere love;" },
  { t = "v", n = 7, text = "in truthful speech and in the power of God; with the weapons of righteousness in the right hand and in the left;" },
  { t = "v", n = 8, text = "through glory and dishonor, slander and praise; viewed as imposters, yet genuine;" },
  { t = "v", n = 9, text = "unknown, yet well-known; dying, and yet we live on; punished, yet not killed;" },
  { t = "v", n = 10, text = "sorrowful, yet always rejoicing; poor, yet making many rich; having nothing, and yet possessing everything." },
  { t = "v", n = 11, p = true, text = "We have spoken freely to you, Corinthians. Our hearts are open wide." },
  { t = "v", n = 12, text = "It is not our affection, but yours, that is restrained." },
  { t = "v", n = 13, text = "As a fair exchange—I speak as to my children—open wide your hearts also." },
  { t = "h", level = 2, text = "Do Not Be Unequally Yoked" },
  { t = "v", n = 14, p = true, text = "Do not be unequally yoked with unbelievers. For what partnership can righteousness have with wickedness? Or what fellowship does light have with darkness?" },
  { t = "v", n = 15, text = "What harmony is there between Christ and Belial?[^c] Or what does a believer have in common with an unbeliever?" },
  { t = "v", n = 16, text = "What agreement can exist between the temple of God and idols? For we are the temple of the living God. As God has said: “I will dwell with them and walk among them, and I will be their God, and they will be My people.”[^d]" },
  { t = "v", n = 17, indent = 1, p = true, text = "“Therefore come out from among them and be separate, says the Lord. Touch no unclean thing, and I will receive you.”[^e]" },
  { t = "v", n = 18, p = true, text = "And: “I will be a Father to you, and you will be My sons and daughters, says the Lord Almighty.”[^f]" },
  { t = "note", id = "a", text = "Literally *Now working together*" },
  { t = "note", id = "b", text = "Isaiah 49:8 (see also LXX)" },
  { t = "note", id = "c", text = "Scrivener’s TR and PT; many Greek sources *Beliar*" },
  { t = "note", id = "d", text = "Leviticus 26:12; Jeremiah 32:38; Ezekiel 37:27" },
  { t = "note", id = "e", text = "Isaiah 52:11; see also Ezekiel 20:34, including LXX." },
  { t = "note", id = "f", text = "See 2 Samuel 7:14." },
]

[[section]]
id = "7"
title = "2 Corinthians 7"
level = 1
blocks = [
  { t = "h", level = 2, text = "Paul’s Joy in the Corinthians" },
  { t = "v", n = 1, p = true, text = "Therefore, beloved, since we have these promises, let us cleanse ourselves from everything that defiles body and spirit, perfecting holiness in the fear of God." },
  { t = "v", n = 2, p = true, text = "Make room for us in your hearts. We have wronged no one, we have corrupted no one, we have exploited no one." },
  { t = "v", n = 3, text = "I do not say this to condemn you. I have said before that you so occupy our hearts that we live and die together with you." },
  { t = "v", n = 4, text = "Great is my confidence in you; great is my pride in you; I am filled with encouragement; in all our troubles my joy overflows." },
  { t = "v", n = 5, p = true, text = "For when we arrived in Macedonia, our bodies had no rest, but we were pressed from every direction—conflicts on the outside, fears within." },
  { t = "v", n = 6, text = "But God, who comforts the downcast, comforted us by the arrival of Titus," },
  { t = "v", n = 7, text = "and not only by his arrival, but also by the comfort he had received from you. He told us about your longing, your mourning, and your zeal for me, so that I rejoiced all the more." },
  { t = "v", n = 8, p = true, text = "Even if I caused you sorrow by my letter, I do not regret it. Although I did regret it—for I see that my letter caused you sorrow, but only for a short time—" },
  { t = "v", n = 9, text = "yet now I rejoice, not because you were made sorrowful, but because your sorrow led you to repentance. For you felt the sorrow that God had intended, and so were not harmed in any way by us." },
  { t = "v", n = 10, text = "Godly sorrow brings repentance that leads to salvation without regret, but worldly sorrow brings death." },
  { t = "v", n = 11, p = true, text = "Consider what this godly sorrow has produced in you: what earnestness, what eagerness to clear yourselves, what indignation, what alarm, what longing, what zeal, what vindication! In every way you have proved yourselves to be innocent in this matter." },
  { t = "v", n = 12, text = "So even though I wrote to you, it was not on account of the one who did wrong or the one who was harmed, but rather that your earnestness on our behalf would be made clear to you in the sight of God." },
  { t = "v", n = 13, text = "On account of this, we are encouraged. In addition to our own encouragement, we were even more delighted by the joy of Titus. For his spirit has been refreshed by all of you." },
  { t = "v", n = 14, text = "Indeed, I was not embarrassed by anything I had boasted to him about you. But just as everything we said to you was true, so our boasting to Titus has proved to be true as well." },
  { t = "v", n = 15, text = "And his affection for you is even greater when he remembers that you were all obedient as you welcomed him with fear and trembling." },
  { t = "v", n = 16, text = "I rejoice that I can have complete confidence in you." },
]

[[section]]
id = "8"
title = "2 Corinthians 8"
level = 1
blocks = [
  { t = "h", level = 2, text = "Generosity Commended" },
  { t = "ref", text = "(Philippians 4:10–20)" },
  { t = "v", n = 1, p = true, text = "Now, brothers, we want you to know about the grace that God has given the churches of Macedonia." },
  { t = "v", n = 2, text = "In the terrible ordeal they suffered, their abundant joy and deep poverty overflowed into rich generosity." },
  { t = "v", n = 3, text = "For I testify that they gave according to their ability and even beyond it. Of their own accord," },
  { t = "v", n = 4, text = "they earnestly pleaded with us for the privilege of sharing in this service to the saints." },
  { t = "v", n = 5, text = "And not only did they do as we expected, but they gave themselves first to the Lord and then to us, through the will of God." },
  { t = "v", n = 6, p = true, text = "So we urged Titus to help complete your act of grace, just as he had started it." },
  { t = "v", n = 7, text = "But just as you excel in everything—in faith, in speech, in knowledge, in complete earnestness, and in the love we inspired in you[^a]—see that you also excel in this grace of giving." },
  { t = "v", n = 8, text = "I am not giving a command, but I am testing the sincerity of your love through the earnestness of others." },
  { t = "v", n = 9, p = true, text = "For you know the grace of our Lord Jesus Christ, that though He was rich, yet for your sake He became poor, so that you through His poverty might become rich." },
  { t = "v", n = 10, text = "And this is my opinion about what is helpful for you in this matter: Last year you were the first not only to give, but even to have such a desire." },
  { t = "v", n = 11, text = "Now finish the work, so that you may complete it with the same eager desire, according to your means." },
  { t = "v", n = 12, text = "For if the eagerness is there, the gift is acceptable according to what one has, not according to what he does not have." },
  { t = "v", n = 13, p = true, text = "It is not our intention that others may be relieved while you are burdened, but that there may be equality." },
  { t = "v", n = 14, text = "At the present time, your surplus will meet their need, so that in turn their surplus will meet your need. This way there will be equality." },
  { t = "v", n = 15, text = "As it is written: “He who gathered much had no excess, and he who gathered little had no shortfall.”[^b]" },
  { t = "h", level = 2, text = "Titus Commended" },
  { t = "ref", text = "(Titus 1:1–4)" },
  { t = "v", n = 16, p = true, text = "But thanks be to God, who put into the heart of Titus the same devotion I have for you." },
  { t = "v", n = 17, text = "For not only did he welcome our appeal, but he is eagerly coming to you of his own volition." },
  { t = "v", n = 18, p = true, text = "Along with Titus we are sending the brother who is praised by all the churches for his work in the gospel." },
  { t = "v", n = 19, text = "More than that, this brother was chosen by the churches to accompany us with the gracious offering we administer[^c] to honor the Lord Himself and to show our eagerness to help." },
  { t = "v", n = 20, p = true, text = "We want to avoid any criticism of the way we administer this generous gift." },
  { t = "v", n = 21, text = "For we are taking great care to do what is right, not only in the eyes of the Lord, but also in the eyes of men." },
  { t = "v", n = 22, p = true, text = "And we are sending along with them our brother who has proven his earnestness to us many times and in many ways, and now even more so by his great confidence in you." },
  { t = "v", n = 23, text = "As for Titus, he is my partner and fellow worker among you. As for our brothers, they are messengers[^d] of the churches, the glory of Christ." },
  { t = "v", n = 24, text = "In full view of the churches, then, show these men the proof of your love and the reason for our boasting about you." },
  { t = "note", id = "a", text = "Or *in your love for us*" },
  { t = "note", id = "b", text = "Exodus 16:18" },
  { t = "note", id = "c", text = "See 1 Corinthians 16:3–4." },
  { t = "note", id = "d", text = "Or *apostles*" },
]

[[section]]
id = "9"
title = "2 Corinthians 9"
level = 1
blocks = [
  { t = "h", level = 2, text = "God Loves a Cheerful Giver" },
  { t = "ref", text = "(1 Corinthians 16:1–4)" },
  { t = "v", n = 1, p = true, text = "Now about the service to the saints, there is no need for me to write to you." },
  { t = "v", n = 2, text = "For I know your eagerness to help, and I have been boasting to the Macedonians that since last year you in Achaia were prepared to give. And your zeal has stirred most of them to do likewise." },
  { t = "v", n = 3, p = true, text = "But I am sending the brothers in order that our boasting about you in this matter should not prove empty, but that you will be prepared, just as I said." },
  { t = "v", n = 4, text = "Otherwise, if any Macedonians come with me and find you unprepared, we—to say nothing of you—would be ashamed of having been so confident." },
  { t = "v", n = 5, text = "So I thought it necessary to urge the brothers to visit you beforehand and make arrangements for the generous gift you had promised. This way, your gift will be prepared generously and not begrudgingly." },
  { t = "v", n = 6, p = true, text = "Remember this: Whoever sows sparingly will also reap sparingly, and whoever sows generously will also reap generously." },
  { t = "v", n = 7, text = "Each one should give what he has decided in his heart to give, not out of regret or compulsion. For God loves a cheerful giver.[^a]" },
  { t = "v", n = 8, text = "And God is able to make all grace abound to you, so that in all things, at all times, having all that you need, you will abound in every good work." },
  { t = "v", n = 9, text = "As it is written: “He has scattered abroad His gifts to the poor; His righteousness endures forever.”[^b]" },
  { t = "v", n = 10, p = true, text = "Now He who supplies seed to the sower and bread for food will supply and multiply your store of seed and will increase the harvest of your righteousness." },
  { t = "v", n = 11, text = "You will be enriched in every way to be generous on every occasion, and through us your generosity will produce thanksgiving to God." },
  { t = "v", n = 12, text = "For this ministry of service is not only supplying the needs of the saints but is also overflowing in many expressions of thanksgiving to God." },
  { t = "v", n = 13, p = true, text = "Because of the proof this ministry provides, the saints will glorify God for your obedient confession of the gospel of Christ, and for the generosity of your contribution to them and to all the others." },
  { t = "v", n = 14, text = "And their prayers for you will express their affection for you, because of the surpassing grace God has given you." },
  { t = "v", n = 15, text = "Thanks be to God for His indescribable gift!" },
  { t = "note", id = "a", text = "See Proverbs 22:8, LXX addition." },
  { t = "note", id = "b", text = "Psalm 112:9" },
]

[[section]]
id = "10"
title = "2 Corinthians 10"
level = 1
blocks = [
  { t = "h", level = 2, text = "Paul’s Apostolic Authority" },
  { t = "v", n = 1, p = true, text = "Now by the mildness and gentleness of Christ, I appeal to you—I, Paul, who am humble when face to face with you, but bold when away." },
  { t = "v", n = 2, text = "I beg you that when I come I may not need to be as bold as I expect toward those who presume that we live according to the flesh." },
  { t = "v", n = 3, p = true, text = "For though we live in the flesh, we do not wage war according to the flesh." },
  { t = "v", n = 4, text = "The weapons of our warfare are not the weapons of the flesh. Instead, they have divine power to demolish strongholds." },
  { t = "v", n = 5, text = "We demolish arguments and every presumption set up against the knowledge of God; and we take captive every thought to make it obedient to Christ." },
  { t = "v", n = 6, text = "And we will be ready to punish every act of disobedience, as soon as your obedience is complete." },
  { t = "v", n = 7, p = true, text = "You are looking at outward appearances. If anyone is confident that he belongs to Christ, he should remind himself that we belong to Christ just as much as he does." },
  { t = "v", n = 8, text = "For even if I boast somewhat excessively about the authority the Lord gave us for building you up rather than tearing you down, I will not be ashamed." },
  { t = "v", n = 9, p = true, text = "I do not want to seem to be trying to frighten you by my letters." },
  { t = "v", n = 10, text = "For some say, “His letters are weighty and forceful, but his physical presence is unimpressive, and his speaking is of no account.”" },
  { t = "v", n = 11, text = "Such people should consider that what we are in our letters when absent, we will be in our actions when present." },
  { t = "v", n = 12, p = true, text = "We do not dare to classify or compare ourselves with some who commend themselves. When they measure themselves by themselves and compare themselves with themselves, they show their ignorance." },
  { t = "v", n = 13, text = "We, however, will not boast beyond our limits, but only within the field of influence that God has assigned to us—a field that reaches even to you." },
  { t = "v", n = 14, text = "We are not overstepping our bounds, as if we had not come to you. Indeed, we were the first to reach you with the gospel of Christ." },
  { t = "v", n = 15, p = true, text = "Neither do we boast beyond our limits in the labors of others. But we hope that as your faith increases, our area of influence among you will greatly increase as well," },
  { t = "v", n = 16, text = "so that we can preach the gospel in the regions beyond you. Then we will not be boasting in the work already done in another man’s territory." },
  { t = "v", n = 17, p = true, text = "Rather, “Let him who boasts boast in the Lord.”[^a]" },
  { t = "v", n = 18, text = "For it is not the one who commends himself who is approved, but the one whom the Lord commends." },
  { t = "note", id = "a", text = "Jeremiah 9:24" },
]

[[section]]
id = "11"
title = "2 Corinthians 11"
level = 1
blocks = [
  { t = "h", level = 2, text = "Paul and the False Apostles" },
  { t = "v", n = 1, p = true, text = "I hope you will put up with a little of my foolishness, but you are already doing that." },
  { t = "v", n = 2, text = "I am jealous for you with a godly jealousy. For I promised you to one husband, to present you as a pure virgin to Christ." },
  { t = "v", n = 3, p = true, text = "I am afraid, however, that just as Eve was deceived by the serpent’s cunning, your minds may be led astray from your simple and pure devotion to Christ." },
  { t = "v", n = 4, text = "For if someone comes and proclaims a Jesus other than the One we proclaimed, or if you receive a different spirit than the One you received, or a different gospel than the one you accepted, you put up with it very easily." },
  { t = "v", n = 5, p = true, text = "I consider myself in no way inferior to those “super-apostles.”" },
  { t = "v", n = 6, text = "Although I am not a polished speaker, I am certainly not lacking in knowledge. We have made this clear to you in every way possible." },
  { t = "v", n = 7, p = true, text = "Was it a sin for me to humble myself in order to exalt you, because I preached the gospel of God to you free of charge?" },
  { t = "v", n = 8, text = "I robbed other churches by accepting their support in order to serve you." },
  { t = "v", n = 9, text = "And when I was with you and in need, I was not a burden to anyone; for the brothers who came from Macedonia supplied my needs. I have refrained from being a burden to you in any way, and I will continue to do so." },
  { t = "v", n = 10, text = "As surely as the truth of Christ is in me, this boasting of mine will not be silenced in the regions of Achaia." },
  { t = "v", n = 11, text = "Why? Because I do not love you? God knows I do!" },
  { t = "v", n = 12, p = true, text = "But I will keep on doing what I am doing, in order to undercut those who want an opportunity to be regarded as our equals in the things of which they boast." },
  { t = "v", n = 13, text = "For such men are false apostles, deceitful workers, masquerading as apostles of Christ." },
  { t = "v", n = 14, text = "And no wonder, for Satan himself masquerades as an angel of light." },
  { t = "v", n = 15, text = "It is not surprising, then, if his servants masquerade as servants of righteousness. Their end will correspond to their actions." },
  { t = "h", level = 2, text = "Paul’s Suffering and Service" },
  { t = "ref", text = "(Colossians 1:24–29)" },
  { t = "v", n = 16, p = true, text = "I repeat: Let no one take me for a fool. But if you do, then receive me as a fool, so that I too may boast a little." },
  { t = "v", n = 17, text = "In this confident boasting of mine, I am not speaking as the Lord would, but as a fool." },
  { t = "v", n = 18, text = "Since many are boasting according to the flesh, I too will boast." },
  { t = "v", n = 19, text = "For you gladly put up with fools, since you are so wise." },
  { t = "v", n = 20, text = "In fact, you even put up with anyone who enslaves you or exploits you or takes advantage of you or exalts himself or strikes you in the face." },
  { t = "v", n = 21, text = "To my shame I concede that we were too weak for that! Speaking as a fool, however, I can match what anyone else dares to boast about." },
  { t = "v", n = 22, text = "Are they Hebrews? So am I. Are they Israelites? So am I. Are they descendants of Abraham? So am I." },
  { t = "v", n = 23, text = "Are they servants of Christ? (I am speaking as if I were out of my mind.) I am so much more: in harder labor, in more imprisonments, in worse beatings, in frequent danger of death." },
  { t = "v", n = 24, text = "Five times I received from the Jews the forty lashes minus one." },
  { t = "v", n = 25, text = "Three times I was beaten with rods, once I was stoned, three times I was shipwrecked. I spent a night and a day in the open sea." },
  { t = "v", n = 26, p = true, text = "In my frequent journeys, I have been in danger from rivers and from bandits, in danger from my countrymen and from the Gentiles, in danger in the city and in the country, in danger on the sea and among false brothers," },
  { t = "v", n = 27, text = "in labor and toil and often without sleep, in hunger and thirst and often without food, in cold and exposure." },
  { t = "v", n = 28, p = true, text = "Apart from these external trials, I face daily the pressure of my concern for all the churches." },
  { t = "v", n = 29, text = "Who is weak, and I am not weak? Who is led into sin, and I do not burn with grief?" },
  { t = "v", n = 30, p = true, text = "If I must boast, I will boast of the things that show my weakness." },
  { t = "v", n = 31, text = "The God and Father of the Lord Jesus, who is forever worthy of praise,[^a] knows that I am not lying." },
  { t = "v", n = 32, text = "In Damascus, the governor under King Aretas secured the city of the Damascenes in order to arrest me." },
  { t = "v", n = 33, text = "But I was lowered in a basket through a window in the wall and escaped his grasp." },
  { t = "note", id = "a", text = "Or *forever blessed*" },
]

[[section]]
id = "12"
title = "2 Corinthians 12"
level = 1
blocks = [
  { t = "h", level = 2, text = "Paul’s Revelation" },
  { t = "v", n = 1, p = true, text = "I must go on boasting. Although there is nothing to gain, I will go on to visions and revelations from the Lord." },
  { t = "v", n = 2, text = "I know a man in Christ who fourteen years ago was caught up to the third heaven. Whether it was in the body or out of it I do not know, but God knows." },
  { t = "v", n = 3, text = "And I know that this man—whether in the body or out of it I do not know, but God knows—" },
  { t = "v", n = 4, text = "was caught up to Paradise. The things he heard were inexpressible, things that man is not permitted to tell." },
  { t = "h", level = 2, text = "Paul’s Thorn and God’s Grace" },
  { t = "v", n = 5, p = true, text = "I will boast about such a man, but I will not boast about myself, except in my weaknesses." },
  { t = "v", n = 6, text = "Even if I wanted to boast, I would not be a fool, because I would be speaking the truth. But I refrain, so no one will credit me with more than he sees in me or hears from me," },
  { t = "v", n = 7, text = "or because of these surpassingly great revelations. So to keep me from becoming conceited,[^a] I was given a thorn in my flesh, a messenger of Satan, to torment me." },
  { t = "v", n = 8, text = "Three times I pleaded with the Lord to take it away from me." },
  { t = "v", n = 9, text = "But He said to me, “My grace is sufficient for you, for My power is perfected in weakness.” Therefore I will boast all the more gladly in my weaknesses, so that the power of Christ may rest on me." },
  { t = "v", n = 10, text = "That is why, for the sake of Christ, I delight in weaknesses, in insults, in hardships, in persecutions, in difficulties. For when I am weak, then I am strong." },
  { t = "h", level = 2, text = "Paul’s Concern for the Corinthians" },
  { t = "v", n = 11, p = true, text = "I have become a fool, but you drove me to it. In fact, you should have commended me, since I am in no way inferior to those “super-apostles,” even though I am nothing." },
  { t = "v", n = 12, text = "The marks of a true apostle—signs, wonders, and miracles—were performed among you with great perseverance." },
  { t = "v", n = 13, text = "In what way were you inferior to the other churches, except that I was not a burden to you? Forgive me this wrong!" },
  { t = "v", n = 14, p = true, text = "See, I am ready to come to you a third time, and I will not be a burden, because I am not seeking your possessions, but you. For children should not have to save up for their parents, but parents for their children." },
  { t = "v", n = 15, text = "And for the sake of your souls, I will most gladly spend my money and myself. If I love you more, will you love me less?" },
  { t = "v", n = 16, p = true, text = "Be that as it may, I was not a burden to you; but crafty as I am, I caught you by trickery." },
  { t = "v", n = 17, text = "Did I exploit you by anyone I sent you?" },
  { t = "v", n = 18, text = "I urged Titus to visit you, and I sent our brother with him. Did Titus exploit you in any way? Did we not walk in the same Spirit and follow in the same footsteps?[^b]" },
  { t = "v", n = 19, p = true, text = "Have you been thinking all along that we were making a defense to you? We speak before God in Christ, and all of this, beloved, is to build you up." },
  { t = "v", n = 20, text = "For I am afraid that when I come, I may not find you as I wish, and you may not find me as you wish. I fear that there may be quarreling, jealousy, rage, rivalry, slander, gossip, arrogance, and disorder." },
  { t = "v", n = 21, text = "I am afraid that when I come again, my God will humble me before you, and I will be grieved over many who have sinned earlier and have not repented of their acts of impurity, sexual immorality, and debauchery." },
  { t = "note", id = "a", text = "Some translators end the previous paragraph after verse 6, and begin verse 7 with *So to keep me from becoming conceited because of these surpassingly great revelations,*" },
  { t = "note", id = "b", text = "Literally *Did we not walk in the same Spirit? Not in the same footsteps?*" },
]

[[section]]
id = "13"
title = "2 Corinthians 13"
level = 1
blocks = [
  { t = "h", level = 2, text = "Examine Yourselves" },
  { t = "v", n = 1, p = true, text = "This is the third time I am coming to you. “Every matter must be established by the testimony of two or three witnesses.”[^a]" },
  { t = "v", n = 2, p = true, text = "I already warned you the second time I was with you. So now in my absence I warn those who sinned earlier and everyone else: If I return, I will not spare anyone," },
  { t = "v", n = 3, text = "since you are demanding proof that Christ is speaking through me. He is not weak in dealing with you but is powerful among you." },
  { t = "v", n = 4, text = "For He was indeed crucified in weakness, yet He lives by God’s power. For we are also weak in Him, yet by God’s power we will live with Him concerning you." },
  { t = "v", n = 5, p = true, text = "Examine yourselves to see whether you are in the faith; test yourselves. Do you not realize that Jesus Christ is in you—unless you fail the test?" },
  { t = "v", n = 6, text = "And I hope you will realize that we have not failed the test." },
  { t = "v", n = 7, p = true, text = "Now we pray to God that you will not do anything wrong—not that we will appear to have stood the test, but that you will do what is right, even if we appear to have failed." },
  { t = "v", n = 8, text = "For we cannot do anything against the truth, but only for the truth." },
  { t = "v", n = 9, text = "In fact, we rejoice when we are weak but you are strong, and our prayer is for your perfection." },
  { t = "v", n = 10, p = true, text = "This is why I write these things while absent, so that when I am present I will not need to be severe in my use of the authority that the Lord gave me for building you up, not for tearing you down." },
  { t = "h", level = 2, text = "Benediction and Farewell" },
  { t = "v", n = 11, p = true, text = "Finally, brothers, rejoice! Aim for perfect harmony, encourage one another,[^b] be of one mind, live in peace. And the God of love and peace will be with you." },
  { t = "v", n = 12, p = true, text = "Greet one another with a holy kiss." },
  { t = "v", n = 13, p = true, text = "All the saints send you greetings." },
  { t = "v", n = 14, p = true, text = "The grace of the Lord Jesus Christ, and the love of God, and the fellowship of the Holy Spirit be with all of you.[^c]" },
  { t = "note", id = "a", text = "Deuteronomy 19:15" },
  { t = "note", id = "b", text = "Or *listen to my appeal*" },
  { t = "note", id = "c", text = "Texts vary in verse numbering for the last three verses of this chapter. BYZ ends with *Amen*." },
]

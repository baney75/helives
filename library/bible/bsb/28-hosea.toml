[[section]]
id = "1"
title = "Hosea 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "Hosea’s Wife and Children" },
  { t = "v", n = 1, p = true, text = "This is the word of the LORD that came to Hosea son of Beeri in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah, and of Jeroboam son of Jehoash,[^a] king of Israel." },
  { t = "v", n = 2, p = true, text = "When the LORD first spoke through Hosea, He told him, “Go, take a prostitute as your wife and have children of adultery, because this land is flagrantly prostituting itself by departing from the LORD.”" },
  { t = "v", n = 3, p = true, text = "So Hosea went and married Gomer daughter of Diblaim, and she conceived and bore him a son." },
  { t = "v", n = 4, p = true, text = "Then the LORD said to Hosea, “Name him Jezreel,[^b] for soon I will bring the bloodshed of Jezreel upon the house of Jehu, and I will put an end to the kingdom of Israel." },
  { t = "v", n = 5, text = "And on that day I will break the bow of Israel in the Valley of Jezreel.”" },
  { t = "v", n = 6, p = true, text = "Gomer again conceived and gave birth to a daughter, and the LORD said to Hosea, “Name her Lo-ruhamah,[^c] for I will no longer have compassion on the house of Israel, that I should ever forgive them." },
  { t = "v", n = 7, text = "Yet I will have compassion on the house of Judah, and I will save them—not by bow or sword or war, not by horses and cavalry, but by the LORD their God.”" },
  { t = "v", n = 8, p = true, text = "After she had weaned Lo-ruhamah, Gomer conceived and gave birth to a son." },
  { t = "v", n = 9, text = "And the LORD said, “Name him Lo-ammi,[^d] for you are not My people, and I am not your God.[^e]" },
  { t = "v", n = 10, p = true, text = "Yet the number of the Israelites will be like the sand of the sea, which cannot be measured or counted. And it will happen that in the very place where it was said to them, ‘You are not My people,’ they will be called ‘sons of the living God.’[^f]" },
  { t = "v", n = 11, text = "Then the people of Judah and of Israel will be gathered together, and they will appoint for themselves one leader, and will go up out of the land. For great will be the day of Jezreel." },
  { t = "note", id = "a", text = "Hebrew *Joash*, a variant of *Jehoash*" },
  { t = "note", id = "b", text = "*Jezreel* means *God sows*; also in verse 11." },
  { t = "note", id = "c", text = "*Lo-ruhamah* means *she has not received mercy*." },
  { t = "note", id = "d", text = "*Lo-ammi* means *not My people*." },
  { t = "note", id = "e", text = "Hebrew *I am not yours*" },
  { t = "note", id = "f", text = "Cited in Romans 9:26" },
]

[[section]]
id = "2"
title = "Hosea 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "Israel’s Adultery Rebuked" },
  { t = "v", n = 1, indent = 1, p = true, text = "“Say of your brothers, ‘My people,’[^a] and of your sisters, ‘My loved one.’[^b]" },
  { t = "v", n = 2, indent = 1, p = true, text = "Rebuke your mother, rebuke her, for she is not My wife, and I am not her husband. Let her remove the adultery from her face and the unfaithfulness from between her breasts." },
  { t = "v", n = 3, indent = 1, text = "Otherwise, I will strip her naked and expose her like the day of her birth. I will make her like a desert and turn her into a parched land, and I will let her die of thirst." },
  { t = "v", n = 4, indent = 1, text = "I will have no compassion on her children, because they are the children of adultery." },
  { t = "v", n = 5, indent = 1, text = "For their mother has played the harlot and has conceived them in disgrace. For she thought, ‘I will go after my lovers, who give me bread and water, wool and linen, oil and drink.’" },
  { t = "v", n = 6, indent = 1, p = true, text = "Therefore, behold, I will hedge up her path[^c] with thorns; I will enclose her with a wall, so she cannot find her way." },
  { t = "v", n = 7, indent = 1, text = "She will pursue her lovers but not catch them; she will seek them but not find them. Then she will say, ‘I will return to my first husband, for then I was better off than now.’" },
  { t = "v", n = 8, indent = 1, text = "For she does not acknowledge that it was I who gave her grain, new wine, and oil, who lavished on her silver and gold—which they crafted for Baal." },
  { t = "v", n = 9, indent = 1, p = true, text = "Therefore I will take back My grain in its time and My new wine in its season; I will take away My wool and linen, which were given to cover her nakedness." },
  { t = "v", n = 10, indent = 1, text = "And then I will expose her lewdness in the sight of her lovers, and no one will deliver her out of My hands." },
  { t = "v", n = 11, indent = 1, text = "I will put an end to all her exultation: her feasts, New Moons, and Sabbaths—all her appointed feasts." },
  { t = "v", n = 12, indent = 1, text = "I will destroy her vines and fig trees, which she thinks are the wages paid by her lovers. So I will make them into a thicket, and the beasts of the field will devour them." },
  { t = "v", n = 13, indent = 1, text = "I will punish her for the days of the Baals when she burned incense to them, when she adorned herself with rings and jewelry, and went after her lovers. But Me she forgot,” declares the LORD." },
  { t = "h", level = 2, text = "God’s Mercy to Israel" },
  { t = "v", n = 14, indent = 1, p = true, text = "“Therefore, behold, I will allure her and lead her to the wilderness, and speak to her tenderly." },
  { t = "v", n = 15, indent = 1, text = "There I will give back her vineyards and make the Valley of Achor[^d] into a gateway of hope. There she will respond as she did in the days of her youth, as in the day she came up out of Egypt." },
  { t = "v", n = 16, indent = 1, text = "In that day,” declares the LORD, “you will call Me ‘my Husband,’[^e] and no longer call Me ‘my Master.’[^f]" },
  { t = "v", n = 17, indent = 1, text = "For I will remove from her lips the names of the Baals; no longer will their names be invoked." },
  { t = "v", n = 18, indent = 1, p = true, text = "On that day I will make a covenant for them with the beasts of the field and the birds of the air and the creatures that crawl on the ground. And I will abolish bow and sword and battle in the land, and will make them lie down in safety." },
  { t = "v", n = 19, indent = 1, text = "So I will betroth you to Me forever; I will betroth you in righteousness and justice, in loving devotion[^g] and compassion." },
  { t = "v", n = 20, indent = 1, text = "And I will betroth you in faithfulness, and you will know the LORD.”" },
  { t = "v", n = 21, indent = 1, p = true, text = "“On that day I will respond—” declares the LORD—“I will respond to the heavens, and they will respond to the earth." },
  { t = "v", n = 22, indent = 1, text = "And the earth will respond to the grain, to the new wine and oil, and they will respond to Jezreel.[^h]" },
  { t = "v", n = 23, indent = 1, text = "And I will sow her as My own in the land, and I will have compassion on ‘No Compassion.’[^i] I will say to those called ‘Not My People,’[^j] ‘You are My people,’[^k] and they will say, ‘You are my God.’”" },
  { t = "note", id = "a", text = "Hebrew *Ammi*" },
  { t = "note", id = "b", text = "Or *Mercy is shown*; Hebrew *Ruhamah*, which means *she has received mercy*" },
  { t = "note", id = "c", text = "Hebrew *your path*" },
  { t = "note", id = "d", text = "*Achor* means *trouble*." },
  { t = "note", id = "e", text = "Hebrew *my Ishi*" },
  { t = "note", id = "f", text = "Hebrew *my Baal*" },
  { t = "note", id = "g", text = "Forms of the Hebrew *chesed* are translated here and in most cases throughout the Scriptures as *loving devotion*; the range of meaning includes *love*, *goodness*, *kindness*, *faithfulness*, and *mercy*, as well as *loyalty to a covenant*." },
  { t = "note", id = "h", text = "*Jezreel* means *God sows*." },
  { t = "note", id = "i", text = "Hebrew *Lo-ruhamah*; LXX *I will love her who was not loved*" },
  { t = "note", id = "j", text = "Hebrew *Lo-ammi*" },
  { t = "note", id = "k", text = "Cited in Romans 9:25 and 1 Peter 2:10" },
]

[[section]]
id = "3"
title = "Hosea 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "Hosea Redeems His Wife" },
  { t = "ref", text = "(Zechariah 2:6–13)" },
  { t = "v", n = 1, p = true, text = "Then the LORD said to me, “Go show love to your wife again, though she is loved by another[^a] and is an adulteress. Love her as the LORD loves the Israelites, though they turn to other gods and love to offer raisin cakes to idols.[^b]”" },
  { t = "v", n = 2, p = true, text = "So I bought her for fifteen shekels of silver[^c] and a homer and a lethech of barley.[^d]" },
  { t = "v", n = 3, text = "Then I said to her, “You must live with me for many days; you must not be promiscuous or belong to another, and I will do the same for you.”" },
  { t = "v", n = 4, p = true, text = "For the Israelites must live many days without king or prince, without sacrifice or sacred pillar, and without ephod or idol." },
  { t = "v", n = 5, text = "Afterward, the people of Israel will return and seek the LORD their God and David their king. They will come trembling to the LORD and to His goodness in the last days." },
  { t = "note", id = "a", text = "Or *Go show love to a woman who is loved by another*" },
  { t = "note", id = "b", text = "Literally *and love raisin cakes*" },
  { t = "note", id = "c", text = "*15 shekels* is approximately 6 ounces or 171 grams of silver." },
  { t = "note", id = "d", text = "Or *a homer and a half of barley*; that is, a total of approximately 9.36 bushels or 330 liters (probably about 436 pounds or 198 kilograms of barley); LXX *a homer of barley and a wineskin full of wine*" },
]

[[section]]
id = "4"
title = "Hosea 4"
level = 1
blocks = [
  { t = "h", level = 2, text = "God’s Case against His People" },
  { t = "v", n = 1, indent = 1, p = true, text = "Hear the word of the LORD, O children of Israel, for the LORD has a case against the people of the land: “There is no truth, no loving devotion, and no knowledge of God in the land!" },
  { t = "v", n = 2, indent = 1, text = "Cursing and lying, murder and stealing, and adultery are rampant; one act of bloodshed follows another." },
  { t = "v", n = 3, indent = 1, text = "Therefore the land mourns, and all who dwell in it will waste away with the beasts of the field and the birds of the air; even the fish of the sea disappear." },
  { t = "v", n = 4, indent = 1, p = true, text = "But let no man contend; let no man offer reproof; for your people are like those who contend with a priest.[^a]" },
  { t = "v", n = 5, indent = 1, text = "You will stumble by day, and the prophet will stumble with you by night; so I will destroy your mother—" },
  { t = "v", n = 6, indent = 1, text = "My people are destroyed for lack of knowledge. Because you have rejected knowledge, I will also reject you as My priests. Since you have forgotten the law of your God, I will also forget your children." },
  { t = "v", n = 7, indent = 1, p = true, text = "The more they multiplied, the more they sinned against Me; they exchanged their Glory[^b] for a thing of disgrace." },
  { t = "v", n = 8, indent = 1, text = "They feed on the sins[^c] of My people and set their hearts on iniquity." },
  { t = "v", n = 9, indent = 1, text = "And it shall be like people, like priest. I will punish both of them for their ways and repay them for their deeds." },
  { t = "v", n = 10, indent = 1, text = "They will eat but not be satisfied; they will be promiscuous but not multiply. For they have abandoned the LORD to give themselves" },
  { t = "v", n = 11, indent = 2, text = "to promiscuity, wine, and new wine, which take away understanding." },
  { t = "v", n = 12, indent = 1, p = true, text = "My people consult their wooden idols, and their divining rods inform them. For a spirit of prostitution leads them astray and they have played the harlot against their God." },
  { t = "v", n = 13, indent = 1, text = "They sacrifice on the mountaintops and burn offerings on the hills, under oak, poplar, and terebinth, because their shade is pleasant. And so your daughters turn to prostitution and your daughters-in-law to adultery." },
  { t = "v", n = 14, indent = 1, text = "I will not punish your daughters when they prostitute themselves, nor your daughters-in-law when they commit adultery. For the men themselves go off with prostitutes and offer sacrifices with shrine prostitutes. So a people without understanding will come to ruin." },
  { t = "v", n = 15, indent = 1, p = true, text = "Though you prostitute yourself, O Israel, may Judah avoid such guilt! Do not journey to Gilgal, do not go up to Beth-aven,[^d] and do not swear on oath, ‘As surely as the LORD lives!’" },
  { t = "v", n = 16, indent = 1, text = "For Israel is as obstinate as a stubborn heifer. Can the LORD now shepherd them like lambs in an open meadow?" },
  { t = "v", n = 17, indent = 1, text = "Ephraim[^e] is joined to idols; leave him alone!" },
  { t = "v", n = 18, indent = 1, text = "When their liquor is gone, they turn to prostitution; their rulers[^f] dearly love disgrace." },
  { t = "v", n = 19, indent = 1, text = "The whirlwind has wrapped them[^g] in its wings, and their sacrifices will bring them shame." },
  { t = "note", id = "a", text = "Or *for My case is against you, O priests*" },
  { t = "note", id = "b", text = "Or *they exchanged their glorious God* (Syriac); MT *I will exchange their glory*" },
  { t = "note", id = "c", text = "Or *the sin offerings*" },
  { t = "note", id = "d", text = "*Beth-aven* means *house of wickedness*. This is a derogatory term for Bethel, which means *house of God*; see 1 Kings 12:28–29." },
  { t = "note", id = "e", text = "That is, the northern kingdom of Israel" },
  { t = "note", id = "f", text = "Hebrew *her shields*" },
  { t = "note", id = "g", text = "Hebrew *has wrapped her*" },
]

[[section]]
id = "5"
title = "Hosea 5"
level = 1
blocks = [
  { t = "h", level = 2, text = "Judgment on Israel and Judah" },
  { t = "v", n = 1, indent = 1, p = true, text = "“Hear this, O priests! Take heed, O house of Israel! Give ear, O royal house! For this judgment is against you because you have been a snare at Mizpah, a net spread out on Tabor." },
  { t = "v", n = 2, indent = 1, text = "The rebels are deep in slaughter; but I will chastise them all." },
  { t = "v", n = 3, indent = 1, text = "I know all about Ephraim,[^a] and Israel is not hidden from Me. For now, O Ephraim, you have turned to prostitution; Israel is defiled." },
  { t = "v", n = 4, indent = 1, p = true, text = "Their deeds do not permit them to return to their God, for a spirit of prostitution is within them, and they do not know the LORD." },
  { t = "v", n = 5, indent = 1, text = "Israel’s arrogance testifies against them; Israel and Ephraim stumble in their iniquity; even Judah stumbles with them." },
  { t = "v", n = 6, indent = 1, text = "They go with their flocks and herds to seek the LORD, but they do not find Him; He has withdrawn Himself from them." },
  { t = "v", n = 7, indent = 1, text = "They have been unfaithful to the LORD; for they have borne illegitimate children. Now the New Moon[^b] will devour them along with their land." },
  { t = "v", n = 8, indent = 1, p = true, text = "Blow the ram’s horn in Gibeah, the trumpet in Ramah; raise the battle cry in Beth-aven:[^c] Lead on, O Benjamin!" },
  { t = "v", n = 9, indent = 1, text = "Ephraim will be laid waste on the day of rebuke. Among the tribes of Israel I proclaim what is certain." },
  { t = "v", n = 10, indent = 1, text = "The princes of Judah are like those who move boundary stones;[^d] I will pour out My fury upon them like water." },
  { t = "v", n = 11, indent = 1, text = "Ephraim is oppressed, crushed in judgment, for he is determined to follow worthless idols.[^e]" },
  { t = "v", n = 12, indent = 1, text = "So I am like a moth to Ephraim, and like decay to the house of Judah." },
  { t = "v", n = 13, indent = 1, p = true, text = "When Ephraim saw his sickness and Judah his wound, then Ephraim turned to Assyria and sent to the great king.[^f] But he cannot cure you or heal your wound." },
  { t = "v", n = 14, indent = 1, text = "For I am like a lion to Ephraim and like a young lion to the house of Judah. I, even I, will tear them to pieces and then go away. I will carry them off where no one can rescue them." },
  { t = "v", n = 15, indent = 1, text = "Then I will return to My place until they admit their guilt and seek My face; in their affliction they will earnestly seek Me.”" },
  { t = "note", id = "a", text = "That is, the northern kingdom of Israel; also in verses 5, 9, 11, 12, 13, and 14" },
  { t = "note", id = "b", text = "Or *their New Moon feast* or *the coming month*" },
  { t = "note", id = "c", text = "*Beth-aven* means *house of wickedness*. This is a derogatory term for Bethel, which means *house of God*; see 1 Kings 12:28–29." },
  { t = "note", id = "d", text = "See Proverbs 22:28 and Proverbs 23:10." },
  { t = "note", id = "e", text = "Or *to follow human precepts*" },
  { t = "note", id = "f", text = "Or *to King Jareb*" },
]

[[section]]
id = "6"
title = "Hosea 6"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Unrepentance of Israel and Judah" },
  { t = "v", n = 1, indent = 1, p = true, text = "Come, let us return to the LORD. For He has torn us to pieces, but He will heal us; He has wounded us, but He will bind up our wounds." },
  { t = "v", n = 2, indent = 1, text = "After two days He will revive us; on the third day He will raise us up, that we may live in His presence." },
  { t = "v", n = 3, indent = 1, text = "So let us know—let us press on to know the LORD. As surely as the sun rises, He will appear; He will come to us like the rain, like the spring showers that water the earth." },
  { t = "v", n = 4, indent = 1, p = true, text = "What shall I do with you, O Ephraim[^a]? What shall I do with you, O Judah? For your loyalty is like a morning mist, like the early dew that vanishes." },
  { t = "v", n = 5, indent = 1, text = "Therefore I have hewn them by the prophets; I have slain them by the words of My mouth, and My judgments go forth like lightning." },
  { t = "v", n = 6, indent = 1, text = "For I desire mercy, not sacrifice,[^b] and the knowledge of God rather than burnt offerings." },
  { t = "v", n = 7, indent = 1, p = true, text = "But they, like Adam, have transgressed[^c] the covenant; there they were unfaithful to Me." },
  { t = "v", n = 8, indent = 1, text = "Gilead is a city of evildoers, tracked with footprints of blood." },
  { t = "v", n = 9, indent = 1, text = "Like raiders who lie in ambush, so does a band of priests; they murder on the way to Shechem; surely they have committed atrocities." },
  { t = "v", n = 10, indent = 1, text = "In the house of Israel I have seen a horrible thing: Ephraim practices prostitution there, and Israel is defiled." },
  { t = "v", n = 11, indent = 1, p = true, text = "Also for you, O Judah, a harvest is appointed, when I restore My people from captivity.[^d]" },
  { t = "note", id = "a", text = "That is, the northern kingdom of Israel; also in verse 10" },
  { t = "note", id = "b", text = "Cited in Matthew 9:13 and Matthew 12:7" },
  { t = "note", id = "c", text = "Or *As at Adam, they have transgressed*" },
  { t = "note", id = "d", text = "Or *restore the fortunes of My people*" },
]

[[section]]
id = "7"
title = "Hosea 7"
level = 1
blocks = [
  { t = "h", level = 2, text = "Ephraim’s Iniquity" },
  { t = "v", n = 1, indent = 1, p = true, text = "When I heal Israel, the iniquity of Ephraim[^a] will be exposed, as well as the crimes of Samaria. For they practice deceit and thieves break in; bandits raid in the streets." },
  { t = "v", n = 2, indent = 1, text = "But they fail to consider in their hearts that I remember all their evil. Now their deeds are all around them; they are before My face." },
  { t = "v", n = 3, indent = 1, p = true, text = "They delight the king with their evil, and the princes with their lies." },
  { t = "v", n = 4, indent = 1, text = "They are all adulterers, like an oven heated by a baker who needs not stoke the fire from the kneading to the rising of the dough." },
  { t = "v", n = 5, indent = 1, text = "The princes are inflamed with wine on the day of our king; so he joins hands with those who mock him." },
  { t = "v", n = 6, indent = 1, text = "For they prepare their heart like an oven while they lie in wait; all night their anger smolders;[^b] in the morning it blazes like a flaming fire." },
  { t = "v", n = 7, indent = 1, text = "All of them are hot as an oven, and they devour their rulers. All their kings fall; not one of them calls upon Me." },
  { t = "v", n = 8, indent = 1, p = true, text = "Ephraim mixes with the nations; Ephraim is an unturned cake." },
  { t = "v", n = 9, indent = 1, text = "Foreigners consume his strength, but he does not notice. Even his hair is streaked with gray, but he does not know." },
  { t = "v", n = 10, indent = 1, text = "Israel’s arrogance testifies against them, yet they do not return to the LORD their God; despite all this, they do not seek Him." },
  { t = "v", n = 11, indent = 1, p = true, text = "So Ephraim has become like a silly, senseless dove—calling out to Egypt, then turning to Assyria." },
  { t = "v", n = 12, indent = 1, text = "As they go, I will spread My net over them; I will bring them down like birds of the air. I will chastise them when I hear them flocking together.[^c]" },
  { t = "v", n = 13, indent = 1, p = true, text = "Woe to them, for they have strayed from Me! Destruction to them, for they have rebelled against Me! Though I would redeem them, they speak lies against Me." },
  { t = "v", n = 14, indent = 1, text = "They do not cry out to Me from their hearts when they wail upon their beds. They slash themselves[^d] for grain and new wine, but turn away from Me." },
  { t = "v", n = 15, indent = 1, text = "Although I trained and strengthened their arms, they plot evil against Me." },
  { t = "v", n = 16, indent = 1, text = "They turn, but not to the Most High; they are like a faulty bow. Their leaders will fall by the sword for the cursing of their tongue; for this they will be ridiculed in the land of Egypt." },
  { t = "note", id = "a", text = "That is, the northern kingdom of Israel; also in verses 8 and 11" },
  { t = "note", id = "b", text = "Literally *their baker sleeps*" },
  { t = "note", id = "c", text = "Or *I will chastise them according to what was reported against them in the assembly.*" },
  { t = "note", id = "d", text = "Some Hebrew manuscripts and LXX; see 1 Kings 18:28. Most Hebrew manuscripts *They gather together*" },
]

[[section]]
id = "8"
title = "Hosea 8"
level = 1
blocks = [
  { t = "h", level = 2, text = "Israel Will Reap the Whirlwind" },
  { t = "v", n = 1, indent = 1, p = true, text = "Put the ram’s horn to your lips! An eagle looms over the house of the LORD, because the people have transgressed My covenant and rebelled against My law." },
  { t = "v", n = 2, indent = 1, text = "Israel cries out to Me, “O our God, we know You!”" },
  { t = "v", n = 3, indent = 1, text = "But Israel has rejected good; an enemy will pursue him." },
  { t = "v", n = 4, indent = 1, p = true, text = "They set up kings, but not by Me. They make princes, but without My approval. With their silver and gold they make themselves idols, to their own destruction." },
  { t = "v", n = 5, indent = 1, text = "He has rejected your calf,[^a] O Samaria. My anger burns against them. How long will they be incapable of innocence?" },
  { t = "v", n = 6, indent = 1, text = "For this thing is from Israel—a craftsman made it, and it is not God. It will be broken to pieces, that calf of Samaria." },
  { t = "v", n = 7, indent = 1, p = true, text = "For they sow the wind, and they shall reap the whirlwind. There is no standing grain; what sprouts fails to yield flour. Even if it should produce, the foreigners would swallow it up." },
  { t = "v", n = 8, indent = 1, text = "Israel is swallowed up! Now they are among the nations like a worthless vessel." },
  { t = "v", n = 9, indent = 1, text = "For they have gone up to Assyria like a wild donkey on its own. Ephraim[^b] has hired lovers." },
  { t = "v", n = 10, indent = 1, text = "Though they hire allies among the nations, I will now round them up, and they will begin to diminish under the oppression of the king of princes." },
  { t = "v", n = 11, indent = 1, p = true, text = "Though Ephraim multiplied the altars for sin, they became his altars for sinning." },
  { t = "v", n = 12, indent = 1, text = "Though I wrote for them the great things of My law, they regarded them as something strange." },
  { t = "v", n = 13, indent = 1, text = "Though they offer sacrifices as gifts to Me, and though they eat the meat, the LORD does not accept them. Now He will remember their iniquity and punish their sins: They will return to Egypt." },
  { t = "v", n = 14, indent = 1, text = "Israel has forgotten his Maker and built palaces; Judah has multiplied its fortified cities. But I will send fire upon their cities, and it will consume their citadels." },
  { t = "note", id = "a", text = "Or *calf idol*; see 1 Kings 12:29." },
  { t = "note", id = "b", text = "That is, the northern kingdom of Israel; also in verse 11" },
]

[[section]]
id = "9"
title = "Hosea 9"
level = 1
blocks = [
  { t = "h", level = 2, text = "Israel’s Punishment" },
  { t = "v", n = 1, indent = 1, p = true, text = "Do not rejoice, O Israel, with exultation like the nations, for you have played the harlot against your God; you have made love for hire on every threshing floor." },
  { t = "v", n = 2, indent = 1, text = "The threshing floor and winepress will not feed them, and the new wine will fail them." },
  { t = "v", n = 3, indent = 1, text = "They will not remain in the land of the LORD; Ephraim[^a] will return to Egypt and eat unclean food in Assyria." },
  { t = "v", n = 4, indent = 1, p = true, text = "They will not pour out wine offerings to the LORD, and their sacrifices will not please Him, but will be to them like the bread of mourners; all who eat will be defiled. For their bread will be for themselves; it will not enter the house of the LORD." },
  { t = "v", n = 5, indent = 1, text = "What will you do on the appointed day, on the day of the LORD’s feast?" },
  { t = "v", n = 6, indent = 1, text = "For even if they flee destruction, Egypt will gather them and Memphis will bury them. Their precious silver will be taken over by thistles, and thorns will overrun their tents." },
  { t = "v", n = 7, indent = 1, p = true, text = "The days of punishment have come; the days of retribution have arrived—let Israel know it. The prophet is called a fool, and the inspired man insane, because of the greatness of your iniquity and hostility." },
  { t = "v", n = 8, indent = 1, text = "The prophet is Ephraim’s watchman, along with my God,[^b] yet the snare of the fowler lies on all his paths. Hostility is in the house of his God!" },
  { t = "v", n = 9, indent = 1, text = "They have deeply corrupted themselves as in the days of Gibeah; He will remember their guilt; He will punish their sins." },
  { t = "v", n = 10, indent = 1, p = true, text = "I found Israel like grapes in the wilderness. I saw your fathers as the firstfruits of the fig tree in its first season. But they went to Baal-peor, and consecrated themselves to Shame; so they became as detestable as the thing they loved." },
  { t = "v", n = 11, indent = 1, text = "Ephraim’s glory will fly away like a bird, with no birth, no pregnancy, and no conception." },
  { t = "v", n = 12, indent = 1, text = "Even if they raise their children, I will bereave them of each one. Yes, woe be to them when I turn away from them!" },
  { t = "v", n = 13, indent = 1, text = "I have seen Ephraim, like Tyre, planted in a meadow. But Ephraim will bring out his children for slaughter." },
  { t = "v", n = 14, indent = 1, text = "Give them, O LORD—what will You give? Give them wombs that miscarry and breasts that dry up!" },
  { t = "v", n = 15, indent = 1, p = true, text = "All their evil appears at Gilgal, for there I hated them. I will drive them from My house for the wickedness of their deeds. I will no longer love them; all their leaders are rebellious." },
  { t = "v", n = 16, indent = 1, text = "Ephraim is struck down; their root is withered; they cannot bear fruit. Even if they bear children, I will slay the darlings of their wombs." },
  { t = "v", n = 17, indent = 1, text = "My God will reject them because they have not obeyed Him; and they shall be wanderers among the nations." },
  { t = "note", id = "a", text = "That is, the northern kingdom of Israel; similarly in verses 8, 11, 13, and 16" },
  { t = "note", id = "b", text = "Or *The prophet is the watchman over Ephraim, the people of my God*" },
]

[[section]]
id = "10"
title = "Hosea 10"
level = 1
blocks = [
  { t = "h", level = 2, text = "Retribution for Israel’s Sin" },
  { t = "v", n = 1, indent = 1, p = true, text = "Israel was a luxuriant vine, yielding fruit for himself. The more his fruit increased, the more he increased the altars. The better his land produced, the better he made the sacred pillars." },
  { t = "v", n = 2, indent = 1, text = "Their hearts are devious; now they must bear their guilt. The LORD will break down their altars and demolish their sacred pillars." },
  { t = "v", n = 3, indent = 1, p = true, text = "Surely now they will say, “We have no king, for we do not revere the LORD. What can a king do for us?”" },
  { t = "v", n = 4, indent = 1, text = "They speak mere words; with false oaths they make covenants. So judgment springs up like poisonous weeds in the furrows of a field." },
  { t = "v", n = 5, indent = 1, p = true, text = "The people of Samaria will fear for the calf of Beth-aven.[^a] Indeed, its people will mourn over it with its idolatrous priests—those who rejoiced in its glory—for it has been taken from them into exile." },
  { t = "v", n = 6, indent = 1, text = "Yes, it will be carried to Assyria as tribute to the great king.[^b] Ephraim[^c] will be seized with shame; Israel will be ashamed of its wooden idols.[^d]" },
  { t = "v", n = 7, indent = 1, text = "Samaria will be carried off with her king like a twig on the surface of the water." },
  { t = "v", n = 8, indent = 1, text = "The high places of Aven[^e] will be destroyed—it is the sin of Israel; thorns and thistles will overgrow their altars. Then they will say to the mountains, “Cover us!” and to the hills, “Fall on us!”[^f]" },
  { t = "v", n = 9, indent = 1, p = true, text = "Since the days of Gibeah you have sinned, O Israel, and there you have remained. Did not the battle in Gibeah overtake the sons of iniquity?[^g]" },
  { t = "v", n = 10, indent = 1, text = "I will chasten them when I please; nations will be gathered against them to put them in bondage for their double transgression." },
  { t = "v", n = 11, indent = 1, p = true, text = "Ephraim is a well-trained heifer that loves to thresh; but I will place a yoke on her fair neck. I will harness Ephraim, Judah will plow, and Jacob will break the hard ground." },
  { t = "v", n = 12, indent = 1, text = "Sow for yourselves righteousness and reap the fruit of loving devotion; break up your unplowed ground. For it is time to seek the LORD until He comes and sends righteousness upon you like rain." },
  { t = "v", n = 13, indent = 1, p = true, text = "You have plowed wickedness and reaped injustice; you have eaten the fruit of lies. Because you have trusted in your own way and in the multitude of your mighty men," },
  { t = "v", n = 14, indent = 1, text = "the roar of battle will rise against your people, so that all your fortresses will be demolished as Shalman devastated Beth-arbel in the day of battle, when mothers were dashed to pieces along with their children." },
  { t = "v", n = 15, indent = 1, text = "Thus it will be done to you, O Bethel, because of your great wickedness. When the day dawns, the king of Israel will be utterly cut off." },
  { t = "note", id = "a", text = "*Beth-aven* means *house of wickedness*. This is a derogatory term for Bethel, which means *house of God*; see 1 Kings 12:28–29." },
  { t = "note", id = "b", text = "Or *to King Jareb*" },
  { t = "note", id = "c", text = "That is, the northern kingdom of Israel; also in verse 11" },
  { t = "note", id = "d", text = "Or *of its own counsel*" },
  { t = "note", id = "e", text = "Or *of wickedness*; *Aven* is a reference to Beth-aven (a derogatory term for Bethel); see verse 5." },
  { t = "note", id = "f", text = "Cited in Luke 23:30; see also Revelation 6:16." },
  { t = "note", id = "g", text = "Or *Did not the battle overtake the sons of iniquity in Gibeah?*" },
]

[[section]]
id = "11"
title = "Hosea 11"
level = 1
blocks = [
  { t = "h", level = 2, text = "Out of Egypt I Called My Son" },
  { t = "ref", text = "(Matthew 2:13–15)" },
  { t = "v", n = 1, indent = 1, p = true, text = "When Israel was a child, I loved him, and out of Egypt I called My son.[^a]" },
  { t = "v", n = 2, indent = 1, text = "But the more I called Israel, the farther they departed from Me.[^b] They sacrificed to the Baals and burned incense to carved images." },
  { t = "v", n = 3, indent = 1, text = "It was I who taught Ephraim[^c] to walk, taking them by the arms, but they never realized that it was I who healed them." },
  { t = "v", n = 4, indent = 1, text = "I led them with cords of kindness, with ropes of love; I lifted the yoke from their necks and bent down to feed them." },
  { t = "v", n = 5, indent = 1, text = "Will they not return to the land of Egypt and be ruled by Assyria because they refused to repent?" },
  { t = "v", n = 6, indent = 1, text = "A sword will flash through their cities; it will destroy the bars of their gates and consume them in their own plans." },
  { t = "v", n = 7, indent = 1, text = "My people are bent on turning from Me. Though they call to the Most High, He will by no means exalt them." },
  { t = "h", level = 2, text = "God’s Love for Israel" },
  { t = "v", n = 8, indent = 1, p = true, text = "How could I give you up, O Ephraim? How could I surrender you, O Israel? How could I make you like Admah? How could I treat you like Zeboiim? My heart is turned within Me; My compassion is stirred!" },
  { t = "v", n = 9, indent = 1, text = "I will not execute the full fury of My anger; I will not destroy Ephraim again. For I am God and not man—the Holy One among you—and I will not come in wrath." },
  { t = "v", n = 10, indent = 1, text = "They will walk after the LORD; He will roar like a lion. When He roars, His children will come trembling from the west." },
  { t = "v", n = 11, indent = 1, text = "They will come trembling like birds from Egypt and like doves from the land of Assyria. Then I will settle them in their homes, declares the LORD." },
  { t = "v", n = 12, indent = 1, p = true, text = "Ephraim surrounds Me with lies, the house of Israel with deceit; but Judah still walks with God and is faithful to the Holy One.[^d]" },
  { t = "note", id = "a", text = "Cited in Matthew 2:15" },
  { t = "note", id = "b", text = "LXX; Hebrew *The more they called them, the more they went from them.*" },
  { t = "note", id = "c", text = "That is, the northern kingdom of Israel; also in verses 8, 9, and 12" },
  { t = "note", id = "d", text = "Or *and Judah is unruly against God, the faithful Holy One*" },
]

[[section]]
id = "12"
title = "Hosea 12"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Reproof of Ephraim, Judah, and Jacob" },
  { t = "v", n = 1, indent = 1, p = true, text = "Ephraim[^a] feeds on the wind and pursues the east wind all day long; he multiplies lies and violence; he makes a covenant with Assyria and sends olive oil to Egypt." },
  { t = "v", n = 2, indent = 1, p = true, text = "The LORD has a charge to bring against Judah. He will punish Jacob[^b] according to his ways and repay him according to his deeds." },
  { t = "v", n = 3, indent = 1, text = "In the womb he grasped his brother’s heel, and in his vigor he wrestled with God." },
  { t = "v", n = 4, indent = 1, text = "Yes, he struggled with the angel[^c] and prevailed; he wept and sought His favor; he found Him at Bethel and spoke with Him there[^d]—" },
  { t = "v", n = 5, indent = 1, text = "the LORD God of Hosts, the LORD is His name of renown." },
  { t = "v", n = 6, indent = 1, text = "But you must return to your God; maintain love and justice, and always wait on your God." },
  { t = "v", n = 7, indent = 1, p = true, text = "A merchant loves to defraud with dishonest scales in his hands." },
  { t = "v", n = 8, indent = 1, text = "And Ephraim boasts: “How rich I have become! I have found wealth for myself. In all my labors, they can find in me no iniquity that is sinful.”" },
  { t = "v", n = 9, indent = 1, p = true, text = "But I am the LORD your God ever since the land of Egypt. I will again make you dwell in tents, as in the days of the appointed feast." },
  { t = "v", n = 10, indent = 1, text = "I spoke through the prophets and multiplied their visions; I gave parables through the prophets." },
  { t = "v", n = 11, indent = 1, text = "Is there iniquity in Gilead? They will surely come to nothing. Do they sacrifice bulls in Gilgal? Indeed, their altars will be heaps of stones in the furrows of the field." },
  { t = "v", n = 12, indent = 1, p = true, text = "Jacob fled to the land of Aram[^e] and Israel worked for a wife—for a wife he tended sheep." },
  { t = "v", n = 13, indent = 1, text = "But by a prophet the LORD brought Israel out of Egypt, and by a prophet he was preserved." },
  { t = "v", n = 14, indent = 1, p = true, text = "Ephraim has provoked bitter anger, so his Lord will leave his bloodguilt upon him and repay him for his contempt." },
  { t = "note", id = "a", text = "That is, the northern kingdom of Israel; also in verses 8 and 14" },
  { t = "note", id = "b", text = "*Jacob* means *he grasps the heel* or *he deceives*." },
  { t = "note", id = "c", text = "Or *Angel*" },
  { t = "note", id = "d", text = "LXX and Syriac; MT *and there He spoke with us*" },
  { t = "note", id = "e", text = "That is, northwest Mesopotamia" },
]

[[section]]
id = "13"
title = "Hosea 13"
level = 1
blocks = [
  { t = "h", level = 2, text = "God’s Anger against Israel" },
  { t = "v", n = 1, indent = 1, p = true, text = "When Ephraim[^a] spoke, there was trembling; he was exalted in Israel. But he incurred guilt through Baal, and he died." },
  { t = "v", n = 2, indent = 1, p = true, text = "Now they sin more and more and make for themselves cast images, idols skillfully made from their silver, all of them the work of craftsmen. People say of them, “They offer human sacrifice and kiss the calves!”[^b]" },
  { t = "v", n = 3, indent = 1, text = "Therefore they will be like the morning mist, like the early dew that vanishes, like chaff blown from a threshing floor, like smoke through an open window." },
  { t = "v", n = 4, indent = 1, p = true, text = "Yet I am the LORD your God ever since the land of Egypt; you know no God but Me, for there is no Savior besides Me." },
  { t = "v", n = 5, indent = 1, text = "I knew you in the wilderness, in the land of drought." },
  { t = "v", n = 6, indent = 1, text = "When they had pasture, they became satisfied; when they were satisfied, their hearts became proud, and as a result they forgot Me." },
  { t = "v", n = 7, indent = 1, text = "So like a lion I will pounce on them; like a leopard I will lurk by the path." },
  { t = "v", n = 8, indent = 1, text = "Like a bear robbed of her cubs I will attack them, and I will tear open their chests. There I will devour them like a lion, like a wild beast tearing them apart." },
  { t = "h", level = 2, text = "Death and Resurrection" },
  { t = "ref", text = "(1 Corinthians 15:50–58)" },
  { t = "v", n = 9, indent = 1, p = true, text = "You are destroyed, O Israel, because you are against Me—against your helper." },
  { t = "v", n = 10, indent = 1, p = true, text = "Where is your king now[^c] to save you in all your cities, and the rulers to whom you said, “Give me a king and princes”?" },
  { t = "v", n = 11, indent = 1, text = "So in My anger I gave you a king, and in My wrath I took him away." },
  { t = "v", n = 12, indent = 1, p = true, text = "The iniquity of Ephraim is bound up; his sin is stored up." },
  { t = "v", n = 13, indent = 1, text = "Labor pains come upon him, but he is an unwise son. When the time arrives, he fails to present himself at the opening of the womb." },
  { t = "v", n = 14, indent = 1, p = true, text = "I will ransom them from the power of Sheol; I will redeem them from Death.[^d] Where, O Death, are your plagues? Where, O Sheol, is your sting?[^e] Compassion is hidden from My eyes." },
  { t = "h", level = 2, text = "Judgment on Samaria" },
  { t = "v", n = 15, indent = 1, p = true, text = "Although he flourishes among his brothers, an east wind will come—a wind from the LORD rising up from the desert. His fountain will fail, and his spring will run dry. The wind will plunder his treasury of every precious article." },
  { t = "v", n = 16, indent = 1, p = true, text = "Samaria will bear her guilt because she has rebelled against her God. They will fall by the sword; their little ones will be dashed to pieces, and their pregnant women ripped open." },
  { t = "note", id = "a", text = "That is, the northern kingdom of Israel; also in verse 12" },
  { t = "note", id = "b", text = "Or *“The men who sacrifice kiss the calves!”*See 1 Kings 19:18." },
  { t = "note", id = "c", text = "Or *Shall I be your King now*" },
  { t = "note", id = "d", text = "Or *Shall I ransom them from the power of Sheol? Shall I redeem them from Death?*" },
  { t = "note", id = "e", text = "LXX *Where, O Death, is your penalty? Where, O Hades, is your sting?*Cited in 1 Corinthians 15:55" },
]

[[section]]
id = "14"
title = "Hosea 14"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Call to Repentance" },
  { t = "ref", text = "(Jeremiah 3:11–25; Zechariah 1:1–6)" },
  { t = "v", n = 1, indent = 1, p = true, text = "Return, O Israel, to the LORD your God, for you have stumbled by your iniquity." },
  { t = "v", n = 2, indent = 1, text = "Bring your confessions and return to the LORD. Say to Him: “Take away all our iniquity and receive us graciously, that we may present the fruit of our lips.[^a]" },
  { t = "v", n = 3, indent = 1, text = "Assyria will not save us, nor will we ride on horses. We will never again say, ‘Our gods!’ to the work of our own hands. For in You the fatherless find compassion.”" },
  { t = "h", level = 2, text = "A Promise of God’s Blessing" },
  { t = "v", n = 4, indent = 1, p = true, text = "I will heal their apostasy; I will freely love them, for My anger has turned away from them." },
  { t = "v", n = 5, indent = 1, text = "I will be like the dew to Israel; he will blossom like the lily and take root like the cedars of Lebanon." },
  { t = "v", n = 6, indent = 1, text = "His shoots will sprout, and his splendor will be like the olive tree, his fragrance like the cedars of Lebanon." },
  { t = "v", n = 7, indent = 1, text = "They will return and dwell in his shade; they will grow grain and blossom like the vine. His renown will be like the wine of Lebanon." },
  { t = "v", n = 8, indent = 1, p = true, text = "O Ephraim,[^b] what have I to do anymore with idols? It is I who answer and watch over him. I am like a flourishing cypress;[^c] your fruit comes from Me." },
  { t = "v", n = 9, indent = 1, p = true, text = "Whoever is wise, let him understand these things; whoever is discerning, let him know them. For the ways of the LORD are right, and the righteous walk in them but the rebellious stumble in them." },
  { t = "note", id = "a", text = "LXX and Syriac; Hebrew *that we may present our lips as sacrificial bulls*" },
  { t = "note", id = "b", text = "That is, the northern kingdom of Israel" },
  { t = "note", id = "c", text = "Or *pine* or *juniper* or *fir*" },
]

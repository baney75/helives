[[section]]
id = "1"
title = "Joel 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Invasion of Locusts" },
  { t = "v", n = 1, p = true, text = "This is the word of the LORD that came to Joel son of Pethuel:" },
  { t = "v", n = 2, indent = 1, p = true, text = "Hear this, O elders; and give ear, all who dwell in the land. Has anything like this ever happened in your days or in the days of your fathers?" },
  { t = "v", n = 3, indent = 1, text = "Tell it to your children; let your children tell it to their children, and their children to the next generation." },
  { t = "v", n = 4, indent = 1, text = "What the devouring locust has left, the swarming locust has eaten; what the swarming locust has left, the young locust has eaten; and what the young locust has left, the destroying locust has eaten.[^a]" },
  { t = "v", n = 5, indent = 1, p = true, text = "Wake up, you drunkards, and weep; wail, all you drinkers of wine, because of the sweet wine, for it has been cut off from your mouth." },
  { t = "v", n = 6, indent = 1, text = "For a nation has invaded My land, powerful and without number; its teeth are the teeth of a lion, and its fangs are the fangs of a lioness." },
  { t = "v", n = 7, indent = 1, text = "It has laid waste My grapevine and splintered My fig tree. It has stripped off the bark and thrown it away; the branches have turned white." },
  { t = "h", level = 2, text = "A Call to Mourning" },
  { t = "v", n = 8, indent = 1, p = true, text = "Wail like a virgin dressed in sackcloth, grieving for the husband of her youth." },
  { t = "v", n = 9, indent = 1, text = "Grain and drink offerings have been cut off from the house of the LORD; the priests are in mourning, those who minister before the LORD." },
  { t = "v", n = 10, indent = 1, text = "The field is ruined; the land mourns. For the grain is destroyed, the new wine is dried up, and the oil fails." },
  { t = "v", n = 11, indent = 1, text = "Be dismayed, O farmers, wail, O vinedressers, over the wheat and barley, because the harvest of the field has perished." },
  { t = "v", n = 12, indent = 1, text = "The grapevine is dried up, and the fig tree is withered; the pomegranate, palm, and apple—all the trees of the orchard—are withered. Surely the joy of mankind has dried up." },
  { t = "h", level = 2, text = "A Call to Repentance" },
  { t = "ref", text = "(Amos 5:4–15; Zephaniah 2:1–3; Luke 13:1–5)" },
  { t = "v", n = 13, indent = 1, p = true, text = "Put on sackcloth and lament, O priests; wail, O ministers of the altar. Come, spend the night in sackcloth, O ministers of my God, because the grain and drink offerings are withheld from the house of your God." },
  { t = "v", n = 14, indent = 1, text = "Consecrate a fast; proclaim a solemn assembly! Gather the elders and all the residents of the land to the house of the LORD your God, and cry out to the LORD." },
  { t = "v", n = 15, indent = 1, p = true, text = "Alas for the day! For the Day of the LORD is near, and it will come as destruction from the Almighty.[^b]" },
  { t = "v", n = 16, indent = 1, text = "Has not the food been cut off before our very eyes—joy and gladness from the house of our God?" },
  { t = "v", n = 17, indent = 1, text = "The seeds lie shriveled beneath the clods; the storehouses are in ruins; the granaries are broken down, for the grain has withered away." },
  { t = "v", n = 18, indent = 1, text = "How the cattle groan! The herds wander in confusion because they have no pasture. Even the flocks of sheep are suffering." },
  { t = "v", n = 19, indent = 1, p = true, text = "To You, O LORD, I call, for fire has consumed the open pastures and flames have scorched all the trees of the field." },
  { t = "v", n = 20, indent = 1, text = "Even the beasts of the field pant for You, for the streams of water have dried up, and fire has consumed the open pastures." },
  { t = "note", id = "a", text = "The precise identification of the four kinds of locusts mentioned here is uncertain." },
  { t = "note", id = "b", text = "Hebrew *Shaddai*" },
]

[[section]]
id = "2"
title = "Joel 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Army of Locusts" },
  { t = "ref", text = "(Amos 7:1–9)" },
  { t = "v", n = 1, indent = 1, p = true, text = "Blow the ram’s horn in Zion; sound the alarm on My holy mountain! Let all who dwell in the land tremble, for the Day of the LORD is coming; indeed, it is near—" },
  { t = "v", n = 2, indent = 1, text = "a day of darkness and gloom, a day of clouds and blackness. Like the dawn overspreading the mountains a great and strong army appears, such as never was of old, nor will ever be in ages to come." },
  { t = "v", n = 3, indent = 1, p = true, text = "Before them a fire devours, and behind them a flame scorches. The land before them is like the Garden of Eden, but behind them, it is like a desert wasteland—surely nothing will escape them." },
  { t = "v", n = 4, indent = 1, text = "Their appearance is like that of horses, and they gallop like swift steeds.[^a]" },
  { t = "v", n = 5, indent = 1, text = "With a sound like that of chariots they bound over the mountaintops, like the crackling of fire consuming stubble, like a mighty army deployed for battle." },
  { t = "v", n = 6, indent = 1, p = true, text = "Nations writhe in horror before them; every face turns pale." },
  { t = "v", n = 7, indent = 1, text = "They charge like mighty men; they scale the walls like men of war. Each one marches in formation, not swerving from the course." },
  { t = "v", n = 8, indent = 1, text = "They do not jostle one another; each proceeds in his path. They burst through the defenses, never breaking ranks." },
  { t = "v", n = 9, indent = 1, text = "They storm the city; they run along the wall; they climb into houses, entering through windows like thieves." },
  { t = "v", n = 10, indent = 1, p = true, text = "Before them the earth quakes; the heavens tremble. The sun and moon grow dark, and the stars lose their brightness." },
  { t = "v", n = 11, indent = 1, text = "The LORD raises His voice in the presence of His army. Indeed, His camp is very large, for mighty are those who obey His command. For the Day of the LORD is great and very dreadful. Who can endure it?" },
  { t = "h", level = 2, text = "Return with All Your Heart" },
  { t = "v", n = 12, indent = 1, p = true, text = "“Yet even now,” declares the LORD, “return to Me with all your heart, with fasting, weeping, and mourning.”" },
  { t = "v", n = 13, indent = 1, p = true, text = "So rend your hearts and not your garments, and return to the LORD your God. For He is gracious and compassionate, slow to anger, abounding in loving devotion.[^b] And He relents from sending disaster." },
  { t = "v", n = 14, indent = 1, text = "Who knows? He may turn and relent and leave a blessing behind Him—grain and drink offerings for the LORD your God." },
  { t = "v", n = 15, indent = 1, p = true, text = "Blow the ram’s horn in Zion, consecrate a fast, proclaim a sacred assembly." },
  { t = "v", n = 16, indent = 1, text = "Gather the people, sanctify the congregation, assemble the aged, gather the children, even those nursing at the breast. Let the bridegroom leave his room, and the bride her chamber." },
  { t = "v", n = 17, indent = 1, text = "Let the priests who minister before the LORD weep between the portico and the altar, saying, “Spare Your people, O LORD, and do not make Your heritage a reproach, an object of scorn among the nations. Why should they say among the peoples, ‘Where is their God?’”" },
  { t = "h", level = 2, text = "Restoration Promised" },
  { t = "v", n = 18, indent = 1, p = true, text = "Then the LORD became jealous for His land, and He spared His people." },
  { t = "v", n = 19, indent = 1, p = true, text = "And the LORD answered His people: “Behold, I will send you grain, new wine, and oil, and by them you will be satisfied. I will never again make you a reproach among the nations." },
  { t = "v", n = 20, indent = 1, p = true, text = "The northern army I will drive away from you, banishing it to a barren and desolate land, its front ranks into the Eastern Sea,[^c] and its rear guard into the Western Sea.[^d] And its stench will rise; its foul odor will ascend. For He has done great things." },
  { t = "v", n = 21, indent = 1, p = true, text = "Do not be afraid, O land; rejoice and be glad, for the LORD has done great things." },
  { t = "v", n = 22, indent = 1, text = "Do not be afraid, O beasts of the field, for the open pastures have turned green, the trees bear their fruit, and the fig tree and vine yield their best.[^e]" },
  { t = "v", n = 23, indent = 1, text = "Be glad, O children of Zion, and rejoice in the LORD your God, for He has given you the autumn rains for your vindication. He sends you showers, both autumn and spring rains, as before." },
  { t = "v", n = 24, indent = 1, text = "The threshing floors will be full of grain, and the vats will overflow with new wine and oil." },
  { t = "v", n = 25, indent = 1, p = true, text = "I will repay you for the years eaten by locusts—the swarming locust, the young locust, the destroying locust, and the devouring locust[^f]—My great army that I sent against you." },
  { t = "v", n = 26, indent = 1, text = "You will have plenty to eat, until you are satisfied. You will praise the name of the LORD your God, who has worked wonders for you. My people will never again be put to shame." },
  { t = "v", n = 27, indent = 1, text = "Then you will know that I am present in Israel and that I am the LORD your God, and there is no other. My people will never again be put to shame." },
  { t = "h", level = 2, text = "I Will Pour Out My Spirit" },
  { t = "ref", text = "(Acts 2:14–36)" },
  { t = "v", n = 28, indent = 1, p = true, text = "And afterward, I will pour out My Spirit on all people. Your sons and daughters will prophesy, your old men will dream dreams, your young men will see visions." },
  { t = "v", n = 29, indent = 1, text = "Even on My menservants and maidservants, I will pour out My Spirit in those days." },
  { t = "v", n = 30, indent = 1, text = "I will show wonders in the heavens and on the earth, blood and fire and columns[^g] of smoke." },
  { t = "v", n = 31, indent = 1, text = "The sun will be turned to darkness and the moon to blood before the coming of the great and awesome[^h] Day of the LORD." },
  { t = "v", n = 32, indent = 1, text = "And everyone who calls on the name of the LORD will be saved;[^i] for on Mount Zion and in Jerusalem there will be deliverance, as the LORD has promised, among the remnant called by the LORD." },
  { t = "note", id = "a", text = "Or *like charioteers* or *like cavalry*" },
  { t = "note", id = "b", text = "Forms of the Hebrew *chesed* are translated here and in most cases throughout the Scriptures as *loving devotion*; the range of meaning includes *love*, *goodness*, *kindness*, *faithfulness*, and *mercy*, as well as *loyalty to a covenant*." },
  { t = "note", id = "c", text = "That is, the Dead Sea" },
  { t = "note", id = "d", text = "That is, the Mediterranean Sea, also called the Great Sea" },
  { t = "note", id = "e", text = "Literally *their strength*" },
  { t = "note", id = "f", text = "The precise identification of the four kinds of insects mentioned here is uncertain." },
  { t = "note", id = "g", text = "LXX *clouds* or *billows*" },
  { t = "note", id = "h", text = "Or *dreadful*; LXX *glorious*" },
  { t = "note", id = "i", text = "Cited in Acts 2:17–21 and Romans 10:13" },
]

[[section]]
id = "3"
title = "Joel 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "The LORD Judges the Nations" },
  { t = "v", n = 1, indent = 1, p = true, text = "“Yes, in those days and at that time, when I restore Judah and Jerusalem from captivity,[^a]" },
  { t = "v", n = 2, indent = 1, text = "I will gather all the nations and bring them down to the Valley of Jehoshaphat.[^b] There I will enter into judgment against them concerning My people, My inheritance, Israel, whom they have scattered among the nations as they divided up My land." },
  { t = "v", n = 3, indent = 1, text = "They cast lots for My people; they bartered a boy for a prostitute and sold a girl for wine to drink." },
  { t = "v", n = 4, p = true, text = "Now what do you have against Me, O Tyre, Sidon, and all the regions of Philistia? Are you rendering against Me a recompense? If you retaliate against Me, I will swiftly and speedily return your recompense upon your heads." },
  { t = "v", n = 5, text = "For you took My silver and gold and carried off My finest treasures to your temples.[^c]" },
  { t = "v", n = 6, text = "You sold the people of Judah and Jerusalem to the Greeks,[^d] to send them far from their homeland." },
  { t = "v", n = 7, p = true, text = "Behold, I will rouse them from the places to which you sold them; I will return your recompense upon your heads." },
  { t = "v", n = 8, text = "I will sell your sons and daughters into the hands of the people of Judah, and they will sell them to the Sabeans—to a distant nation.” Indeed, the LORD has spoken." },
  { t = "v", n = 9, p = true, text = "Proclaim this among the nations: “Prepare for war; rouse the mighty men; let all the men of war advance and attack!" },
  { t = "v", n = 10, indent = 1, text = "Beat your plowshares into swords and your pruning hooks into spears. Let the weak say, ‘I am strong!’" },
  { t = "v", n = 11, indent = 1, text = "Come quickly, all you surrounding nations, and gather yourselves. Bring down Your mighty ones, O LORD." },
  { t = "v", n = 12, indent = 1, p = true, text = "Let the nations be roused and advance to the Valley of Jehoshaphat, for there I will sit down to judge all the nations on every side." },
  { t = "v", n = 13, indent = 1, text = "Swing the sickle, for the harvest is ripe.[^e] Come, trample the grapes, for the winepress is full; the wine vats overflow because their wickedness is great." },
  { t = "v", n = 14, indent = 1, p = true, text = "Multitudes, multitudes in the valley of decision! For the Day of the LORD is near in the valley of decision." },
  { t = "v", n = 15, indent = 1, text = "The sun and moon will grow dark, and the stars will no longer shine." },
  { t = "v", n = 16, indent = 1, text = "The LORD will roar from Zion and raise His voice from Jerusalem; heaven and earth will tremble. But the LORD will be a refuge for His people, a stronghold for the people of Israel." },
  { t = "h", level = 2, text = "Blessings for God’s People" },
  { t = "v", n = 17, indent = 1, p = true, text = "Then you will know that I am the LORD your God, who dwells in Zion, My holy mountain. Jerusalem will be holy, never again to be overrun by foreigners." },
  { t = "v", n = 18, indent = 1, p = true, text = "And in that day the mountains will drip with sweet wine, and the hills will flow with milk. All the streams of Judah will run with water, and a spring will flow from the house of the LORD to water the Valley of Acacias.[^f]" },
  { t = "v", n = 19, indent = 1, text = "Egypt will become desolate, and Edom a desert wasteland, because of the violence done to the people of Judah, in whose land they shed innocent blood." },
  { t = "v", n = 20, indent = 1, text = "But Judah will be inhabited forever, and Jerusalem from generation to generation." },
  { t = "v", n = 21, indent = 1, text = "For I will avenge their blood, which I have not yet avenged.[^g]” For the LORD dwells in Zion." },
  { t = "note", id = "a", text = "Or *restore the fortunes of Judah and Jerusalem*" },
  { t = "note", id = "b", text = "*Jehoshaphat* means *the LORD judges*; also in verse 12." },
  { t = "note", id = "c", text = "Or *palaces*" },
  { t = "note", id = "d", text = "Or *to the peoples of Javan*" },
  { t = "note", id = "e", text = "LXX *the harvest has come*; see also Mark 4:29." },
  { t = "note", id = "f", text = "Or *Valley of Shittim*" },
  { t = "note", id = "g", text = "Or *For I will pardon their bloodguilt, which I have not yet pardoned.*" },
]

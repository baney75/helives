[[section]]
id = "1"
title = "Ephesians 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "Paul’s Greeting to the Ephesians" },
  { t = "ref", text = "(Acts 19:8–12; Revelation 2:1–7)" },
  { t = "v", n = 1, p = true, text = "Paul, an apostle of Christ Jesus by the will of God, To the saints in Ephesus,[^a] the faithful in Christ Jesus:" },
  { t = "v", n = 2, p = true, text = "Grace and peace to you from God our Father and the Lord Jesus Christ." },
  { t = "h", level = 2, text = "Spiritual Blessings" },
  { t = "ref", text = "(Romans 8:28–34)" },
  { t = "v", n = 3, p = true, text = "Blessed be the God and Father of our Lord Jesus Christ, who has blessed us in Christ with every spiritual blessing in the heavenly realms." },
  { t = "v", n = 4, text = "For He chose us in Him before the foundation of the world to be holy and blameless in His presence. In love" },
  { t = "v", n = 5, text = "He predestined us for adoption as His sons through Jesus Christ, according to the good pleasure of His will," },
  { t = "v", n = 6, text = "to the praise of His glorious grace, which He has freely given us in the Beloved One." },
  { t = "v", n = 7, p = true, text = "In Him we have redemption through His blood, the forgiveness of our trespasses, according to the riches of His grace" },
  { t = "v", n = 8, text = "that He lavished on us with all wisdom and understanding." },
  { t = "v", n = 9, text = "And He has made known to us the mystery of His will according to His good pleasure, which He purposed in Christ" },
  { t = "v", n = 10, text = "as a plan for the fullness of time, to bring all things in heaven and on earth together in Christ." },
  { t = "v", n = 11, p = true, text = "In Him we were also chosen as God’s own, having been predestined according to the plan of Him who works out everything by the counsel of His will," },
  { t = "v", n = 12, text = "in order that we, who were the first to hope in Christ, would be for the praise of His glory." },
  { t = "v", n = 13, p = true, text = "And in Him, having heard and believed the word of truth—the gospel of your salvation—you were sealed with the promised Holy Spirit," },
  { t = "v", n = 14, text = "who is the pledge of our inheritance until the redemption of those who are God’s possession, to the praise of His glory." },
  { t = "h", level = 2, text = "Spiritual Wisdom" },
  { t = "ref", text = "(1 Corinthians 2:6–16)" },
  { t = "v", n = 15, p = true, text = "For this reason, ever since I heard about your faith in the Lord Jesus and your love for all the saints," },
  { t = "v", n = 16, text = "I have not stopped giving thanks for you, remembering you in my prayers," },
  { t = "v", n = 17, text = "that the God of our Lord Jesus Christ, the glorious Father, may give you a spirit of wisdom and revelation in your knowledge of Him." },
  { t = "v", n = 18, p = true, text = "I ask that the eyes of your heart[^b] may be enlightened, so that you may know the hope of His calling, the riches of His glorious inheritance in the saints," },
  { t = "v", n = 19, text = "and the surpassing greatness of His power to us who believe. These are in accordance with the working of His mighty strength," },
  { t = "v", n = 20, text = "which He exerted in Christ when He raised Him from the dead and seated Him at His right hand in the heavenly realms," },
  { t = "v", n = 21, text = "far above all rule and authority, power and dominion, and every name that is named, not only in the present age but also in the one to come." },
  { t = "v", n = 22, p = true, text = "And God put everything under His feet and made Him head over everything for the church," },
  { t = "v", n = 23, text = "which is His body, the fullness of Him who fills all in all." },
  { t = "note", id = "a", text = "Some manuscripts do not include *in Ephesus*." },
  { t = "note", id = "b", text = "TR *the eyes of your understanding*" },
]

[[section]]
id = "2"
title = "Ephesians 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "Alive with Christ" },
  { t = "ref", text = "(Colossians 2:6–23)" },
  { t = "v", n = 1, p = true, text = "And you were dead in your trespasses and sins," },
  { t = "v", n = 2, text = "in which you used to walk when you conformed to the ways of this world and of the ruler of the power of the air, the spirit who is now at work in the sons of disobedience." },
  { t = "v", n = 3, text = "All of us also lived among them at one time, fulfilling the cravings of our flesh and indulging its desires and thoughts. Like the rest, we were by nature children of wrath." },
  { t = "v", n = 4, p = true, text = "But because of His great love for us, God, who is rich in mercy," },
  { t = "v", n = 5, text = "made us alive with Christ even when we were dead in our trespasses. It is by grace you have been saved!" },
  { t = "v", n = 6, text = "And God raised us up with Christ and seated us with Him in the heavenly realms in Christ Jesus," },
  { t = "v", n = 7, text = "in order that in the coming ages He might display the surpassing riches of His grace, demonstrated by His kindness to us in Christ Jesus." },
  { t = "v", n = 8, p = true, text = "For it is by grace you have been saved through faith, and this not from yourselves; it is the gift of God," },
  { t = "v", n = 9, text = "not by works, so that no one can boast." },
  { t = "v", n = 10, text = "For we are God’s workmanship, created in Christ Jesus to do good works, which God prepared in advance as our way of life.[^a]" },
  { t = "h", level = 2, text = "One in Christ" },
  { t = "ref", text = "(Philippians 2:1–4)" },
  { t = "v", n = 11, p = true, text = "Therefore remember that formerly you who are Gentiles in the flesh and called uncircumcised by the so-called circumcision (that done in the body by human hands)—" },
  { t = "v", n = 12, text = "remember that at that time you were separate from Christ, alienated from the commonwealth of Israel, and strangers to the covenants of the promise, without hope and without God in the world." },
  { t = "v", n = 13, text = "But now in Christ Jesus you who once were far away have been brought near through the blood of Christ." },
  { t = "v", n = 14, p = true, text = "For He Himself is our peace, who has made the two one and has torn down the dividing wall of hostility" },
  { t = "v", n = 15, text = "by abolishing in His flesh the law of commandments and decrees. He did this to create in Himself one new man out of the two, thus making peace" },
  { t = "v", n = 16, text = "and reconciling both of them to God in one body through the cross, by which He put to death their hostility." },
  { t = "v", n = 17, p = true, text = "He came and preached peace to you who were far away and peace to those who were near." },
  { t = "v", n = 18, text = "For through Him we both have access to the Father by one Spirit." },
  { t = "h", level = 2, text = "Christ Our Cornerstone" },
  { t = "ref", text = "(Isaiah 28:14–22; 1 Corinthians 3:10–15; 1 Peter 2:1–8)" },
  { t = "v", n = 19, p = true, text = "Therefore you are no longer strangers and foreigners, but fellow citizens with the saints and members of God’s household," },
  { t = "v", n = 20, text = "built on the foundation of the apostles and prophets, with Christ Jesus Himself as the cornerstone." },
  { t = "v", n = 21, text = "In Him the whole building is fitted together and grows into a holy temple in the Lord." },
  { t = "v", n = 22, text = "And in Him you too are being built together into a dwelling place for God in His Spirit." },
  { t = "note", id = "a", text = "Literally *which God prepared beforehand, that we should walk in them.*" },
]

[[section]]
id = "3"
title = "Ephesians 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Mystery of the Gospel" },
  { t = "v", n = 1, p = true, text = "For this reason I, Paul, the prisoner of Christ Jesus for the sake of you Gentiles...[^a]" },
  { t = "v", n = 2, p = true, text = "Surely you have heard about the stewardship of God’s grace that was given to me for you," },
  { t = "v", n = 3, text = "that is, the mystery made known to me by revelation, as I have already written briefly." },
  { t = "v", n = 4, text = "In reading this, then, you will be able to understand my insight into the mystery of Christ," },
  { t = "v", n = 5, text = "which was not made known to men in other generations as it has now been revealed by the Spirit to God’s holy apostles and prophets." },
  { t = "v", n = 6, text = "This mystery is that through the gospel the Gentiles are fellow heirs, fellow members of the body, and fellow partakers of the promise in Christ Jesus." },
  { t = "v", n = 7, p = true, text = "I became a servant of this gospel by the gift of God’s grace, given me through the working of His power." },
  { t = "v", n = 8, text = "Though I am less than the least of all the saints, this grace was given me: to preach to the Gentiles the unsearchable riches of Christ," },
  { t = "v", n = 9, text = "and to illuminate for everyone the stewardship[^b] of this mystery, which for ages past was kept hidden in God, who created all things." },
  { t = "v", n = 10, text = "His purpose was that now, through the church, the manifold wisdom of God should be made known to the rulers and authorities in the heavenly realms," },
  { t = "v", n = 11, text = "according to the eternal purpose that He accomplished in Christ Jesus our Lord." },
  { t = "v", n = 12, p = true, text = "In Him and through faith in Him[^c] we may enter God’s presence with boldness and confidence." },
  { t = "v", n = 13, text = "So I ask you not to be discouraged because of my sufferings for you, which are your glory." },
  { t = "h", level = 2, text = "Paul’s Prayer for the Ephesians" },
  { t = "v", n = 14, p = true, text = "... for this reason I bow my knees before the Father,[^d]" },
  { t = "v", n = 15, text = "from whom every family in heaven and on earth derives its name." },
  { t = "v", n = 16, text = "I ask that out of the riches of His glory He may strengthen you with power through His Spirit in your inner being," },
  { t = "v", n = 17, text = "so that Christ may dwell in your hearts through faith. Then you, being rooted and grounded in love," },
  { t = "v", n = 18, text = "will have power, together with all the saints, to comprehend the length and width and height and depth" },
  { t = "v", n = 19, text = "of the love of Christ, and to know this love that surpasses knowledge, that you may be filled with all the fullness of God." },
  { t = "v", n = 20, p = true, text = "Now to Him who is able to do immeasurably more than all we ask or imagine, according to His power that is at work within us," },
  { t = "v", n = 21, text = "to Him be the glory in the church and in Christ Jesus throughout all generations, forever and ever. Amen." },
  { t = "note", id = "a", text = "This train of thought is continued in verse 14." },
  { t = "note", id = "b", text = "NE and WH *and to illuminate the stewardship*; TR *and to illuminate for everyone the fellowship*" },
  { t = "note", id = "c", text = "Or *through His faithfulness*" },
  { t = "note", id = "d", text = "BYZ and TR *before the Father of our Lord Jesus Christ,*" },
]

[[section]]
id = "4"
title = "Ephesians 4"
level = 1
blocks = [
  { t = "h", level = 2, text = "Unity in the Body" },
  { t = "ref", text = "(Psalm 133:1–3; 1 Corinthians 1:10–17)" },
  { t = "v", n = 1, p = true, text = "As a prisoner in the Lord, then, I urge you to walk in a manner worthy of the calling you have received:" },
  { t = "v", n = 2, text = "with all humility and gentleness, with patience, bearing with one another in love," },
  { t = "v", n = 3, text = "and with diligence to preserve the unity of the Spirit through the bond of peace." },
  { t = "v", n = 4, p = true, text = "There is one body and one Spirit, just as you were called to one hope when you were called;" },
  { t = "v", n = 5, text = "one Lord, one faith, one baptism;" },
  { t = "v", n = 6, text = "one God and Father of all, who is over all and through all and in all." },
  { t = "v", n = 7, p = true, text = "Now to each one of us grace has been given according to the measure of the gift of Christ." },
  { t = "v", n = 8, text = "This is why it says:[^a] “When He ascended on high, He led captives away, and gave gifts to men.”[^b]" },
  { t = "v", n = 9, p = true, text = "What does “He ascended” mean, except that He also descended[^c] to the lower parts of the earth?" },
  { t = "v", n = 10, text = "He who descended is the very One who ascended above all the heavens, in order to fill all things." },
  { t = "v", n = 11, p = true, text = "And it was He who gave some to be apostles, some to be prophets, some to be evangelists, and some to be pastors and teachers," },
  { t = "v", n = 12, text = "to equip the saints for works of ministry and to build up the body of Christ," },
  { t = "v", n = 13, text = "until we all reach unity in the faith and in the knowledge of the Son of God, as we mature to the full measure of the stature of Christ." },
  { t = "v", n = 14, p = true, text = "Then we will no longer be infants, tossed about by the waves and carried around by every wind of teaching and by the clever cunning of men in their deceitful scheming." },
  { t = "v", n = 15, text = "Instead, speaking the truth in love, we will in all things grow up into Christ Himself, who is the head." },
  { t = "v", n = 16, text = "From Him the whole body, fitted and held together by every supporting ligament, grows and builds itself up in love through the work of each individual part." },
  { t = "h", level = 2, text = "New Life in Christ" },
  { t = "ref", text = "(Colossians 3:1–17)" },
  { t = "v", n = 17, p = true, text = "So I tell you this, and insist on it in the Lord, that you must no longer walk as the Gentiles do, in the futility of their thinking." },
  { t = "v", n = 18, text = "They are darkened in their understanding and alienated from the life of God because of the ignorance that is in them due to the hardness of their hearts." },
  { t = "v", n = 19, text = "Having lost all sense of shame, they have given themselves over to sensuality for the practice of every kind of impurity, with a craving for more." },
  { t = "v", n = 20, p = true, text = "But this is not the way you came to know Christ." },
  { t = "v", n = 21, text = "Surely you heard of Him and were taught in Him—in keeping with the truth that is in Jesus—" },
  { t = "v", n = 22, text = "to put off your former way of life, your old self, which is being corrupted by its deceitful desires;" },
  { t = "v", n = 23, text = "to be renewed in the spirit of your minds;" },
  { t = "v", n = 24, text = "and to put on the new self, created to be like God in true righteousness and holiness." },
  { t = "v", n = 25, p = true, text = "Therefore each of you must put off falsehood and speak truthfully to his neighbor, for we are all members of one another." },
  { t = "v", n = 26, text = "“Be angry, yet do not sin.”[^d] Do not let the sun set upon your anger," },
  { t = "v", n = 27, text = "and do not give the devil a foothold." },
  { t = "v", n = 28, p = true, text = "He who has been stealing must steal no longer, but must work, doing good with his own hands, that he may have something to share with the one in need." },
  { t = "v", n = 29, p = true, text = "Let no unwholesome talk come out of your mouths, but only what is helpful for building up the one in need and bringing grace to those who listen." },
  { t = "v", n = 30, p = true, text = "And do not grieve the Holy Spirit of God, in whom you were sealed for the day of redemption." },
  { t = "v", n = 31, p = true, text = "Get rid of all bitterness, rage and anger, outcry and slander, along with every form of malice." },
  { t = "v", n = 32, text = "Be kind and tenderhearted to one another, forgiving each other just as in Christ God forgave you." },
  { t = "note", id = "a", text = "Or *He says*" },
  { t = "note", id = "b", text = "Psalm 68:18" },
  { t = "note", id = "c", text = "BYZ and TR *except that He also descended first*" },
  { t = "note", id = "d", text = "Or *“In your anger do not sin.”*Psalm 4:4" },
]

[[section]]
id = "5"
title = "Ephesians 5"
level = 1
blocks = [
  { t = "h", level = 2, text = "Imitators of God" },
  { t = "v", n = 1, p = true, text = "Be imitators of God, therefore, as beloved children," },
  { t = "v", n = 2, text = "and walk in love, just as Christ loved us[^a] and gave Himself up for us as a fragrant sacrificial offering to God." },
  { t = "v", n = 3, p = true, text = "But among you, as is proper among the saints, there must not be even a hint of sexual immorality, or of any kind of impurity, or of greed." },
  { t = "v", n = 4, text = "Nor should there be obscenity, foolish talk, or crude joking, which are out of character, but rather thanksgiving." },
  { t = "v", n = 5, text = "For of this you can be sure: No immoral, impure, or greedy person (that is, an idolater) has any inheritance in the kingdom of Christ and of God." },
  { t = "v", n = 6, p = true, text = "Let no one deceive you with empty words, for because of such things the wrath of God is coming on the sons of disobedience." },
  { t = "v", n = 7, text = "Therefore do not be partakers with them." },
  { t = "h", level = 2, text = "Children of Light" },
  { t = "v", n = 8, p = true, text = "For you were once darkness, but now you are light in the Lord. Walk as children of light," },
  { t = "v", n = 9, text = "for the fruit of the light consists in all goodness, righteousness, and truth." },
  { t = "v", n = 10, text = "Test and prove what pleases the Lord." },
  { t = "v", n = 11, p = true, text = "Have no fellowship with the fruitless deeds of darkness, but rather expose them." },
  { t = "v", n = 12, text = "For it is shameful even to mention what the disobedient do in secret." },
  { t = "v", n = 13, text = "But everything exposed by the light becomes visible,[^b] for everything that is illuminated becomes a light itself." },
  { t = "v", n = 14, text = "So it is said: “Wake up, O sleeper, rise up from the dead, and Christ will shine on you.”" },
  { t = "v", n = 15, p = true, text = "Pay careful attention, then, to how you walk, not as unwise but as wise," },
  { t = "v", n = 16, text = "redeeming the time, because the days are evil." },
  { t = "v", n = 17, text = "Therefore do not be foolish, but understand what the Lord’s will is." },
  { t = "v", n = 18, text = "Do not get drunk on wine, which leads to reckless indiscretion. Instead, be filled with the Spirit." },
  { t = "v", n = 19, p = true, text = "Speak to one another with psalms, hymns, and spiritual songs. Sing and make music in your hearts to the Lord," },
  { t = "v", n = 20, text = "always giving thanks to God the Father for everything in the name of our Lord Jesus Christ." },
  { t = "h", level = 2, text = "Wives and Husbands" },
  { t = "ref", text = "(Song of Solomon 1:1–17; 1 Peter 3:1–7)" },
  { t = "v", n = 21, p = true, text = "Submit to one another out of reverence for Christ.[^c]" },
  { t = "v", n = 22, p = true, text = "Wives, submit to your husbands as to the Lord." },
  { t = "v", n = 23, text = "For the husband is the head of the wife as Christ is the head of the church, His body, of which He is the Savior." },
  { t = "v", n = 24, text = "Now as the church submits to Christ, so also wives should submit to their husbands in everything." },
  { t = "v", n = 25, p = true, text = "Husbands, love your wives, just as Christ loved the church and gave Himself up for her" },
  { t = "v", n = 26, text = "to sanctify her, cleansing her by the washing with water through the word," },
  { t = "v", n = 27, text = "and to present her to Himself as a glorious church, without stain or wrinkle or any such blemish, but holy and blameless." },
  { t = "v", n = 28, p = true, text = "In the same way, husbands ought to love their wives as their own bodies. He who loves his wife loves himself." },
  { t = "v", n = 29, text = "Indeed, no one ever hated his own body, but he nourishes and cherishes it, just as Christ does the church." },
  { t = "v", n = 30, text = "For we are members of His body.[^d]" },
  { t = "v", n = 31, p = true, text = "“For this reason a man will leave his father and mother and be united to his wife, and the two will become one flesh.”[^e]" },
  { t = "v", n = 32, text = "This mystery is profound, but I am speaking about Christ and the church." },
  { t = "v", n = 33, text = "Nevertheless, each one of you also must love his wife as he loves himself, and the wife must respect her husband." },
  { t = "note", id = "a", text = "NE and WH *Christ loved you*" },
  { t = "note", id = "b", text = "SBL begins verse 14 after *visible,*" },
  { t = "note", id = "c", text = "Or *in the fear of Christ.*" },
  { t = "note", id = "d", text = "BYZ and TR include *—of His flesh and of His bones*." },
  { t = "note", id = "e", text = "Genesis 2:24 (see also LXX)" },
]

[[section]]
id = "6"
title = "Ephesians 6"
level = 1
blocks = [
  { t = "h", level = 2, text = "Children and Parents" },
  { t = "ref", text = "(Colossians 3:18–21)" },
  { t = "v", n = 1, p = true, text = "Children, obey your parents in the Lord, for this is right." },
  { t = "v", n = 2, text = "“Honor your father and mother” (which is the first commandment with a promise)," },
  { t = "v", n = 3, text = "“that it may go well with you and that you may have a long life on the earth.”[^a]" },
  { t = "v", n = 4, p = true, text = "Fathers, do not provoke your children to wrath; instead, bring them up in the discipline and instruction of the Lord." },
  { t = "h", level = 2, text = "Serving with Honor" },
  { t = "ref", text = "(Colossians 3:22–25; 1 Timothy 6:1–2)" },
  { t = "v", n = 5, p = true, text = "Slaves, obey your earthly masters with respect and fear and sincerity of heart, just as you would obey Christ." },
  { t = "v", n = 6, text = "And do this not only to please them while they are watching, but as servants of Christ, doing the will of God from your heart." },
  { t = "v", n = 7, text = "Serve with good will, as to the Lord and not to men," },
  { t = "v", n = 8, text = "because you know that the Lord will reward each one for whatever good he does, whether he is slave or free." },
  { t = "v", n = 9, p = true, text = "And masters, do the same for your slaves. Give up your use of threats, because you know that He who is both their Master and yours is in heaven, and there is no favoritism with Him." },
  { t = "h", level = 2, text = "The Full Armor of God" },
  { t = "v", n = 10, p = true, text = "Finally, be strong in the Lord and in His mighty power." },
  { t = "v", n = 11, text = "Put on the full armor of God, so that you can make your stand against the devil’s schemes." },
  { t = "v", n = 12, text = "For our struggle is not against flesh and blood, but against the rulers, against the authorities, against the powers of this world’s darkness, and against the spiritual forces of evil in the heavenly realms." },
  { t = "v", n = 13, p = true, text = "Therefore take up the full armor of God, so that when the day of evil comes, you will be able to stand your ground, and having done everything, to stand." },
  { t = "v", n = 14, text = "Stand firm then, with the belt of truth buckled around your waist, with the breastplate of righteousness arrayed," },
  { t = "v", n = 15, text = "and with your feet fitted with the readiness of the gospel of peace." },
  { t = "v", n = 16, text = "In addition to all this, take up the shield of faith, with which you can extinguish all the flaming arrows of the evil one." },
  { t = "v", n = 17, text = "And take the helmet of salvation and the sword of the Spirit, which is the word of God." },
  { t = "v", n = 18, p = true, text = "Pray in the Spirit at all times, with every kind of prayer and petition. To this end, stay alert with all perseverance in your prayers for all the saints." },
  { t = "v", n = 19, text = "Pray also for me, that whenever I open my mouth, words may be given me so that I will boldly make known the mystery of the gospel," },
  { t = "v", n = 20, text = "for which I am an ambassador in chains. Pray that I may proclaim it fearlessly, as I should." },
  { t = "h", level = 2, text = "Final Greetings" },
  { t = "ref", text = "(Philippians 4:21–23; 2 Timothy 4:19–22)" },
  { t = "v", n = 21, p = true, text = "Tychicus, the beloved brother and faithful servant in the Lord, will tell you everything, so that you also may know about me and what I am doing." },
  { t = "v", n = 22, text = "I have sent him to you for this very purpose, that you may know about us, and that he may encourage your hearts." },
  { t = "v", n = 23, p = true, text = "Peace to the brothers and love with faith from God the Father and the Lord Jesus Christ." },
  { t = "v", n = 24, p = true, text = "Grace to all who love our Lord Jesus Christ with an undying love." },
  { t = "note", id = "a", text = "Exodus 20:12; Deuteronomy 5:16" },
]

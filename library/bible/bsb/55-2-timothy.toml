[[section]]
id = "1"
title = "2 Timothy 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "Paul’s Greeting to Timothy" },
  { t = "ref", text = "(1 Timothy 1:1–2)" },
  { t = "v", n = 1, p = true, text = "Paul, an apostle of Christ Jesus by the will of God, according to the promise of life in Christ Jesus," },
  { t = "v", n = 2, p = true, text = "To Timothy, my beloved child: Grace, mercy, and peace from God the Father and Christ Jesus our Lord." },
  { t = "h", level = 2, text = "Faithfulness under Persecution" },
  { t = "ref", text = "(Matthew 10:16–25)" },
  { t = "v", n = 3, p = true, text = "I thank God, whom I serve with a clear conscience as did my forefathers, as I constantly remember you night and day in my prayers." },
  { t = "v", n = 4, text = "Recalling your tears, I long to see you so that I may be filled with joy." },
  { t = "v", n = 5, p = true, text = "I am reminded of your sincere faith, which first dwelt in your grandmother Lois and your mother Eunice, and I am convinced is in you as well." },
  { t = "v", n = 6, p = true, text = "For this reason I remind you to fan into flame the gift of God, which is in you through the laying on of my hands." },
  { t = "v", n = 7, text = "For God has not given us a spirit of fear,[^a] but of power, love, and self-control." },
  { t = "v", n = 8, p = true, text = "So do not be ashamed of the testimony of our Lord, or of me, His prisoner. Instead, join me in suffering for the gospel by the power of God." },
  { t = "v", n = 9, text = "He has saved us and called us to a holy calling, not because of our works, but by His own purpose and by the grace He granted us in Christ Jesus before time began.[^b]" },
  { t = "v", n = 10, text = "And now He has revealed this grace through the appearing of our Savior, Christ Jesus, who has abolished death and illuminated the way to life and immortality through the gospel," },
  { t = "v", n = 11, text = "to which I was appointed as a preacher, an apostle, and a teacher." },
  { t = "v", n = 12, p = true, text = "For this reason, even though I suffer as I do, I am not ashamed; for I know whom I have believed, and I am convinced that He is able to guard what I have entrusted to Him[^c] for that day." },
  { t = "h", level = 2, text = "Holding to Sound Teaching" },
  { t = "v", n = 13, p = true, text = "Hold on to the pattern of sound teaching[^d] you have heard from me, with the faith and love that are in Christ Jesus." },
  { t = "v", n = 14, text = "Guard the treasure entrusted to you,[^e] with the help of the Holy Spirit who dwells in us." },
  { t = "v", n = 15, p = true, text = "You know that everyone in the province of Asia[^f] has deserted me, including Phygelus and Hermogenes." },
  { t = "v", n = 16, p = true, text = "May the Lord grant mercy to the household of Onesiphorus, because he has often refreshed me and was unashamed of my chains." },
  { t = "v", n = 17, text = "Indeed, when he arrived in Rome, he searched diligently until he found me." },
  { t = "v", n = 18, p = true, text = "May the Lord grant Onesiphorus His mercy on that day. You know very well how much he ministered to me in Ephesus." },
  { t = "note", id = "a", text = "Or *timidity* or *cowardice*" },
  { t = "note", id = "b", text = "Literally *before times eternal*" },
  { t = "note", id = "c", text = "Or *what He has entrusted to me*" },
  { t = "note", id = "d", text = "Literally *sound words*" },
  { t = "note", id = "e", text = "Or *the good deposit entrusted to you*" },
  { t = "note", id = "f", text = "Literally *in Asia*; Asia was a Roman province in what is now western Turkey." },
]

[[section]]
id = "2"
title = "2 Timothy 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "Grace and Perseverance" },
  { t = "ref", text = "(Hebrews 12:1–3)" },
  { t = "v", n = 1, p = true, text = "You therefore, my child, be strong in the grace that is in Christ Jesus." },
  { t = "v", n = 2, text = "And the things that you have heard me say among many witnesses, entrust these to faithful men who will be qualified to teach others as well." },
  { t = "v", n = 3, p = true, text = "Join me in suffering, like a good soldier of Christ Jesus." },
  { t = "v", n = 4, text = "A soldier refrains from entangling himself in civilian affairs, in order to please the one who enlisted him." },
  { t = "v", n = 5, text = "Likewise, a competitor does not receive the crown unless he competes according to the rules." },
  { t = "v", n = 6, text = "The hardworking farmer should be the first to partake of the crops." },
  { t = "v", n = 7, text = "Consider what I am saying, for the Lord will give you insight into all things." },
  { t = "v", n = 8, p = true, text = "Remember Jesus Christ, raised from the dead, descended from David, as proclaimed by my gospel," },
  { t = "v", n = 9, text = "for which I suffer to the extent of being chained like a criminal. But the word of God cannot be chained!" },
  { t = "v", n = 10, text = "For this reason I endure all things for the sake of the elect, so that they too may obtain the salvation that is in Christ Jesus, with eternal glory." },
  { t = "v", n = 11, p = true, text = "This is a trustworthy saying: If we died with Him, we will also live with Him;" },
  { t = "v", n = 12, indent = 1, text = "if we endure, we will also reign with Him; if we deny Him, He will also deny us;" },
  { t = "v", n = 13, indent = 1, text = "if we are faithless, He remains faithful, for He cannot deny Himself." },
  { t = "h", level = 2, text = "The Lord’s Approved Workman" },
  { t = "v", n = 14, p = true, text = "Remind the believers of these things, charging them before God[^a] to avoid quarreling over words, which succeeds only in leading the listeners to ruin." },
  { t = "v", n = 15, p = true, text = "Make every effort to present yourself approved to God, an unashamed workman who accurately handles the word of truth." },
  { t = "v", n = 16, p = true, text = "But avoid irreverent, empty chatter, which will only lead to more ungodliness," },
  { t = "v", n = 17, text = "and the talk of such men will spread like gangrene. Among them are Hymenaeus and Philetus," },
  { t = "v", n = 18, text = "who have deviated from the truth. They say that the resurrection has already occurred, and they undermine the faith of some." },
  { t = "v", n = 19, p = true, text = "Nevertheless, God’s firm foundation stands, bearing this seal: “The Lord knows those who are His,”[^b] and, “Everyone who calls on the name of the Lord must turn away from iniquity.”" },
  { t = "v", n = 20, p = true, text = "A large house contains not only vessels of gold and silver, but also of wood and clay. Some indeed are for honorable use, but others are for common use." },
  { t = "v", n = 21, text = "So if anyone cleanses himself of what is unfit,[^c] he will be a vessel for honor: sanctified, useful to the Master, and prepared for every good work." },
  { t = "v", n = 22, p = true, text = "Flee from youthful passions and pursue righteousness, faith, love, and peace, together with those who call on the Lord out of a pure heart." },
  { t = "v", n = 23, p = true, text = "But reject foolish and ignorant speculation, for you know that it breeds quarreling." },
  { t = "v", n = 24, text = "And a servant of the Lord must not be quarrelsome, but must be kind to everyone, able to teach, and forbearing." },
  { t = "v", n = 25, text = "He must gently reprove those who oppose him, in the hope that God may grant them repentance leading to a knowledge of the truth." },
  { t = "v", n = 26, text = "Then they will come to their senses and escape the snare of the devil, who has taken them captive to his will." },
  { t = "note", id = "a", text = "SBL, BYZ, and TR *the Lord*" },
  { t = "note", id = "b", text = "Numbers 16:5 (see also LXX)" },
  { t = "note", id = "c", text = "Literally *cleanses himself of these*" },
]

[[section]]
id = "3"
title = "2 Timothy 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "Evil in the Last Days" },
  { t = "v", n = 1, p = true, text = "But understand this: In the last days terrible times will come." },
  { t = "v", n = 2, text = "For men will be lovers of themselves, lovers of money, boastful, arrogant, abusive, disobedient to their parents, ungrateful, unholy," },
  { t = "v", n = 3, text = "unloving, unforgiving, slanderous, without self-control, brutal, without love of good," },
  { t = "v", n = 4, text = "traitorous, reckless, conceited, lovers of pleasure rather than lovers of God," },
  { t = "v", n = 5, text = "having a form of godliness but denying its power. Turn away from such as these!" },
  { t = "v", n = 6, p = true, text = "They are the kind who worm their way into households and captivate vulnerable women who are weighed down with sins and led astray by various passions," },
  { t = "v", n = 7, text = "who are always learning but never able to come to a knowledge of the truth." },
  { t = "v", n = 8, p = true, text = "Just as Jannes and Jambres opposed Moses,[^a] so also these men oppose the truth. They are depraved in mind and disqualified from the faith." },
  { t = "v", n = 9, text = "But they will not advance much further. For just like Jannes and Jambres, their folly will be plain to everyone." },
  { t = "h", level = 2, text = "All Scripture Is God-Breathed" },
  { t = "ref", text = "(Hebrews 4:12–16)" },
  { t = "v", n = 10, p = true, text = "You, however, have observed my teaching, my conduct, my purpose, my faith, my patience, my love, my perseverance," },
  { t = "v", n = 11, text = "my persecutions, and the sufferings that came upon me in Antioch, Iconium, and Lystra. What persecutions I endured! Yet the Lord rescued me from all of them." },
  { t = "v", n = 12, text = "Indeed, all who desire to live godly lives in Christ Jesus will be persecuted," },
  { t = "v", n = 13, text = "while evil men and imposters go from bad to worse, deceiving and being deceived." },
  { t = "v", n = 14, p = true, text = "But as for you, continue in the things you have learned and firmly believed, since you know from whom you have learned them." },
  { t = "v", n = 15, text = "From infancy you have known the Holy Scriptures, which are able to make you wise for salvation through faith in Christ Jesus." },
  { t = "v", n = 16, text = "All Scripture is God-breathed and is useful for instruction, for conviction, for correction, and for training in righteousness," },
  { t = "v", n = 17, text = "so that the man of God may be complete, fully equipped for every good work." },
  { t = "note", id = "a", text = "See Jasher 79:27. *The Book of Jashar* or *the Book of the Upright One* is often cited as *Jasher*." },
]

[[section]]
id = "4"
title = "2 Timothy 4"
level = 1
blocks = [
  { t = "h", level = 2, text = "Preach the Word" },
  { t = "v", n = 1, p = true, text = "I charge you in the presence of God and of Christ Jesus, who will judge the living and the dead, and in view of His appearing and His kingdom:" },
  { t = "v", n = 2, text = "Preach the word; be prepared in season and out of season; reprove, rebuke, and encourage with every form of patient instruction." },
  { t = "v", n = 3, p = true, text = "For the time will come when men will not tolerate sound doctrine, but with itching ears they will gather around themselves teachers to suit their own desires." },
  { t = "v", n = 4, text = "So they will turn their ears away from the truth and turn aside to myths." },
  { t = "v", n = 5, p = true, text = "But you, be sober in all things, endure hardship, do the work of an evangelist, fulfill your ministry." },
  { t = "v", n = 6, text = "For I am already being poured out like a drink offering, and the time of my departure is at hand." },
  { t = "v", n = 7, text = "I have fought the good fight, I have finished the race, I have kept the faith." },
  { t = "v", n = 8, text = "From now on there is laid up for me the crown of righteousness, which the Lord, the righteous Judge, will award to me on that day—and not only to me, but to all who crave His appearing." },
  { t = "h", level = 2, text = "Personal Concerns" },
  { t = "v", n = 9, p = true, text = "Make every effort to come to me quickly," },
  { t = "v", n = 10, text = "because Demas, in his love of this world, has deserted me and gone to Thessalonica. Crescens has gone to Galatia, and Titus to Dalmatia." },
  { t = "v", n = 11, text = "Only Luke is with me. Get Mark and bring him with you, because he is useful to me in the ministry." },
  { t = "v", n = 12, text = "Tychicus, however, I have sent to Ephesus." },
  { t = "v", n = 13, text = "When you come, bring the cloak that I left with Carpus at Troas, and my scrolls, especially the parchments." },
  { t = "v", n = 14, p = true, text = "Alexander the coppersmith did great harm to me. The Lord will repay him according to his deeds." },
  { t = "v", n = 15, text = "You too should beware of him, for he has vigorously opposed our message." },
  { t = "h", level = 2, text = "The Lord Remains Faithful" },
  { t = "v", n = 16, p = true, text = "At my first defense, no one stood with me, but everyone deserted me. May it not be charged against them." },
  { t = "v", n = 17, text = "But the Lord stood by me and strengthened me, so that through me the message would be fully proclaimed, and all the Gentiles would hear it. So I was delivered from the mouth of the lion." },
  { t = "v", n = 18, text = "And the Lord will rescue me from every evil action and bring me safely into His heavenly kingdom. To Him be the glory forever and ever. Amen." },
  { t = "h", level = 2, text = "Final Greetings" },
  { t = "ref", text = "(Ephesians 6:21–24; Philippians 4:21–23)" },
  { t = "v", n = 19, p = true, text = "Greet Prisca[^a] and Aquila, as well as the household of Onesiphorus." },
  { t = "v", n = 20, p = true, text = "Erastus has remained at Corinth, and Trophimus I left sick in Miletus." },
  { t = "v", n = 21, p = true, text = "Make every effort to come to me before winter. Eubulus sends you greetings, as do Pudens, Linus, Claudia, and all the brothers." },
  { t = "v", n = 22, p = true, text = "The Lord be with your spirit. Grace be with you all.[^b]" },
  { t = "note", id = "a", text = "*Prisca* is a variant of *Priscilla*; see Acts 18:2." },
  { t = "note", id = "b", text = "BYZ and TR include *Amen.*" },
]

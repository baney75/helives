[[section]]
id = "1"
title = "3 John 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Greeting from the Elder" },
  { t = "ref", text = "(2 John 1:1–3)" },
  { t = "v", n = 1, p = true, text = "The elder, To the beloved Gaius, whom I love in the truth:" },
  { t = "v", n = 2, p = true, text = "Beloved, I pray that in every way you may prosper and enjoy good health, as your soul also prospers." },
  { t = "v", n = 3, text = "For I was overjoyed when the brothers came and testified about your devotion to the truth, in which you continue to walk." },
  { t = "v", n = 4, text = "I have no greater joy than to hear that my children are walking in the truth." },
  { t = "h", level = 2, text = "Gaius Commended for Hospitality" },
  { t = "v", n = 5, p = true, text = "Beloved, you are faithful in what you are doing for the brothers, and especially since they are strangers to you." },
  { t = "v", n = 6, text = "They have testified to the church about your love. You will do well to send them on their way in a manner worthy of God." },
  { t = "v", n = 7, text = "For they went out on behalf of the Name, accepting nothing from the Gentiles." },
  { t = "v", n = 8, text = "Therefore we ought to support such men, so that we may be fellow workers for the truth." },
  { t = "h", level = 2, text = "Diotrephes and Demetrius" },
  { t = "v", n = 9, p = true, text = "I have written to the church about this,[^a] but Diotrephes, who loves to be first, will not accept our instruction." },
  { t = "v", n = 10, text = "So if I come, I will call attention to his malicious slander against us. And unsatisfied with that, he refuses to welcome the brothers and forbids those who want to do so, even putting them out of the church." },
  { t = "v", n = 11, p = true, text = "Beloved, do not imitate what is evil, but what is good. The one who does good is of God; the one who does evil has not seen God." },
  { t = "v", n = 12, p = true, text = "Demetrius has received a good testimony from everyone, and from the truth itself. We also testify for him, and you know that our testimony is true." },
  { t = "h", level = 2, text = "Conclusion" },
  { t = "ref", text = "(2 John 1:12–13)" },
  { t = "v", n = 13, p = true, text = "I have many things to write to you, but I would prefer not to do so with pen and ink." },
  { t = "v", n = 14, text = "Instead, I hope to see you soon and speak with you face to face.[^b] Peace to you. The friends here send you greetings. Greet each of our friends there by name." },
  { t = "note", id = "a", text = "Literally *I have written something to the church*" },
  { t = "note", id = "b", text = "Literally *and we will speak mouth to mouth*; some translators begin a new verse (15) after *face to face.*" },
]

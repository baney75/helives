[[section]]
id = "1"
title = "Proverbs 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Beginning of Knowledge" },
  { t = "ref", text = "(Proverbs 9:1–12)" },
  { t = "v", n = 1, indent = 1, p = true, text = "These are the proverbs of Solomon son of David, king of Israel," },
  { t = "v", n = 2, indent = 1, text = "for gaining wisdom and discipline, for comprehending words of insight," },
  { t = "v", n = 3, indent = 1, text = "and for receiving instruction in wise living and in righteousness, justice, and equity." },
  { t = "v", n = 4, indent = 1, text = "To impart prudence to the simple[^a] and knowledge and discretion to the young," },
  { t = "v", n = 5, indent = 1, text = "let the wise listen and gain instruction, and the discerning acquire wise counsel" },
  { t = "v", n = 6, indent = 1, text = "by understanding the proverbs and parables, the sayings and riddles of the wise." },
  { t = "v", n = 7, indent = 1, p = true, text = "The fear of the LORD is the beginning of knowledge, but fools[^b] despise wisdom and discipline." },
  { t = "h", level = 2, text = "The Enticement of Sin" },
  { t = "v", n = 8, indent = 1, p = true, text = "Listen, my son, to your father’s instruction, and do not forsake the teaching of your mother." },
  { t = "v", n = 9, indent = 1, text = "For they are a garland of grace on your head and a pendant around your neck." },
  { t = "v", n = 10, indent = 1, p = true, text = "My son, if sinners entice you, do not yield to them." },
  { t = "v", n = 11, indent = 1, text = "If they say, “Come along, let us lie in wait for blood, let us ambush the innocent without cause," },
  { t = "v", n = 12, indent = 1, text = "let us swallow them alive like Sheol, and whole like those descending into the Pit." },
  { t = "v", n = 13, indent = 1, text = "We will find all manner of precious goods; we will fill our houses with plunder." },
  { t = "v", n = 14, indent = 1, text = "Throw in your lot with us; let us all share one purse”—" },
  { t = "v", n = 15, indent = 1, text = "my son, do not walk the road with them or set foot upon their path." },
  { t = "v", n = 16, indent = 1, text = "For their feet run to evil, and they are swift to shed blood." },
  { t = "v", n = 17, indent = 1, text = "How futile it is to spread the net where any bird can see it!" },
  { t = "v", n = 18, indent = 1, text = "But they lie in wait for their own blood; they ambush their own lives." },
  { t = "v", n = 19, indent = 1, text = "Such is the fate of all who are greedy, whose unjust gain takes the lives of its possessors." },
  { t = "h", level = 2, text = "Wisdom Calls Aloud" },
  { t = "v", n = 20, indent = 1, p = true, text = "Wisdom calls out in the street, she lifts her voice in the square;" },
  { t = "v", n = 21, indent = 1, text = "in the main concourse[^c] she cries aloud, at the city gates she makes her speech:" },
  { t = "v", n = 22, indent = 1, p = true, text = "“How long, O simple ones, will you love your simple ways? How long will scoffers delight in their scorn and fools hate knowledge?" },
  { t = "v", n = 23, indent = 1, text = "If you had repented at my rebuke, then surely I would have poured out my spirit on you; I would have made my words known to you." },
  { t = "v", n = 24, indent = 1, text = "Because you refused my call, and no one took my outstretched hand," },
  { t = "v", n = 25, indent = 1, text = "because you neglected all my counsel, and wanted none of my correction," },
  { t = "v", n = 26, indent = 1, text = "in turn I will mock your calamity; I will sneer when terror strikes you," },
  { t = "v", n = 27, indent = 1, text = "when your dread comes like a storm, and your destruction like a whirlwind, when distress and anguish overwhelm you." },
  { t = "v", n = 28, indent = 1, p = true, text = "Then they will call on me, but I will not answer; they will earnestly seek me, but will not find me." },
  { t = "v", n = 29, indent = 1, text = "For they hated knowledge and chose not to fear the LORD." },
  { t = "v", n = 30, indent = 1, text = "They accepted none of my counsel; they despised all my reproof." },
  { t = "v", n = 31, indent = 1, text = "So they will eat the fruit of their own way, and be filled with their own devices." },
  { t = "v", n = 32, indent = 1, text = "For the waywardness of the simple will slay them, and the complacency of fools will destroy them." },
  { t = "v", n = 33, indent = 1, text = "But whoever listens to me will dwell in safety, secure from the fear of evil.”" },
  { t = "note", id = "a", text = "The Hebrew word rendered *simple* in Proverbs refers to one who is naive, without moral direction, or inclined to evil." },
  { t = "note", id = "b", text = "The Hebrew words rendered as *fool* in Proverbs denote one who is morally deficient." },
  { t = "note", id = "c", text = "Or *from the top of the wall*" },
]

[[section]]
id = "2"
title = "Proverbs 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Benefits of Wisdom" },
  { t = "v", n = 1, indent = 1, p = true, text = "My son, if you accept my words and hide my commandments within you," },
  { t = "v", n = 2, indent = 1, text = "if you incline your ear to wisdom and direct your heart to understanding," },
  { t = "v", n = 3, indent = 1, text = "if you truly call out to insight and lift your voice to understanding," },
  { t = "v", n = 4, indent = 1, text = "if you seek it like silver and search it out like hidden treasure," },
  { t = "v", n = 5, indent = 1, text = "then you will discern the fear of the LORD and discover the knowledge of God." },
  { t = "v", n = 6, indent = 1, p = true, text = "For the LORD gives wisdom; from His mouth come knowledge and understanding." },
  { t = "v", n = 7, indent = 1, text = "He stores up sound wisdom for the upright; He is a shield to those who walk with integrity," },
  { t = "v", n = 8, indent = 1, text = "to guard the paths of justice and protect the way of His saints." },
  { t = "v", n = 9, indent = 1, p = true, text = "Then you will discern righteousness and justice and equity—every good path." },
  { t = "v", n = 10, indent = 1, text = "For wisdom will enter your heart, and knowledge will delight your soul." },
  { t = "v", n = 11, indent = 1, text = "Discretion will watch over you, and understanding will guard you," },
  { t = "v", n = 12, indent = 1, text = "to deliver you from the way of evil, from the man who speaks perversity," },
  { t = "v", n = 13, indent = 1, text = "from those who leave the straight paths to walk in the ways of darkness," },
  { t = "v", n = 14, indent = 1, text = "from those who enjoy doing evil and rejoice in the twistedness of evil," },
  { t = "v", n = 15, indent = 1, text = "whose paths are crooked and whose ways are devious." },
  { t = "v", n = 16, indent = 1, p = true, text = "It will rescue you from the forbidden woman,[^a] from the stranger[^b] with seductive words" },
  { t = "v", n = 17, indent = 1, text = "who abandons the partner of her youth and forgets the covenant of her God." },
  { t = "v", n = 18, indent = 1, text = "For her house sinks down to death, and her tracks to the departed spirits.[^c]" },
  { t = "v", n = 19, indent = 1, text = "None who go to her return or negotiate the paths of life." },
  { t = "v", n = 20, indent = 1, p = true, text = "So you will follow in the ways of the good, and keep to the paths of the righteous." },
  { t = "v", n = 21, indent = 1, text = "For the upright will inhabit the land, and the blameless will remain in it;" },
  { t = "v", n = 22, indent = 1, text = "but the wicked will be cut off from the land, and the unfaithful will be uprooted." },
  { t = "note", id = "a", text = "Or *wayward wife*" },
  { t = "note", id = "b", text = "Or *adulteress*" },
  { t = "note", id = "c", text = "Hebrew *to the Rephaim*" },
]

[[section]]
id = "3"
title = "Proverbs 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "Trust in the LORD with All Your Heart" },
  { t = "v", n = 1, indent = 1, p = true, text = "My son, do not forget my teaching, but let your heart keep my commandments;" },
  { t = "v", n = 2, indent = 1, text = "for they will add length to your days, years and peace to your life." },
  { t = "v", n = 3, indent = 1, text = "Never let loving devotion[^a] or faithfulness leave you; bind them around your neck, write them on the tablet of your heart." },
  { t = "v", n = 4, indent = 1, text = "Then you will find favor and high regard in the sight of God and man." },
  { t = "v", n = 5, indent = 1, p = true, text = "Trust in the LORD with all your heart, and lean not on your own understanding;" },
  { t = "v", n = 6, indent = 1, text = "in all your ways acknowledge Him, and He will make your paths straight." },
  { t = "v", n = 7, indent = 1, text = "Be not wise in your own eyes; fear the LORD and turn away from evil." },
  { t = "v", n = 8, indent = 1, text = "This will bring healing to your body[^b] and refreshment[^c] to your bones." },
  { t = "v", n = 9, indent = 1, p = true, text = "Honor the LORD with your wealth and with the firstfruits of all your crops;" },
  { t = "v", n = 10, indent = 1, text = "then your barns will be filled with plenty, and your vats will overflow with new wine." },
  { t = "v", n = 11, indent = 1, p = true, text = "My son, do not reject the discipline of the LORD, and do not loathe His rebuke;[^d]" },
  { t = "v", n = 12, indent = 1, text = "for the LORD disciplines the one He loves, as does a father the son in whom he delights.[^e]" },
  { t = "h", level = 2, text = "The Blessings of Wisdom" },
  { t = "v", n = 13, indent = 1, p = true, text = "Blessed is the man who finds wisdom, the man who acquires understanding," },
  { t = "v", n = 14, indent = 1, text = "for she is more profitable than silver, and her gain is better than fine gold." },
  { t = "v", n = 15, indent = 1, text = "She is more precious than rubies; nothing you desire compares with her." },
  { t = "v", n = 16, indent = 1, text = "Long life is in her right hand; in her left hand are riches and honor." },
  { t = "v", n = 17, indent = 1, text = "All her ways are pleasant, and all her paths are peaceful." },
  { t = "v", n = 18, indent = 1, text = "She is a tree of life to those who embrace her, and those who lay hold of her are blessed." },
  { t = "v", n = 19, indent = 1, p = true, text = "The LORD founded the earth by wisdom and established the heavens by understanding." },
  { t = "v", n = 20, indent = 1, text = "By His knowledge the watery depths were broken open, and the clouds dripped with dew." },
  { t = "v", n = 21, indent = 1, p = true, text = "My son, do not lose sight of this: Preserve sound judgment and discernment." },
  { t = "v", n = 22, indent = 1, text = "They will be life to your soul and adornment to your neck." },
  { t = "v", n = 23, indent = 1, text = "Then you will go on your way in safety, and your foot will not stumble." },
  { t = "v", n = 24, indent = 1, text = "When you lie down, you will not be afraid; when you rest, your sleep will be sweet." },
  { t = "v", n = 25, indent = 1, text = "Do not fear sudden danger or the ruin that overtakes the wicked," },
  { t = "v", n = 26, indent = 1, text = "for the LORD will be your confidence and will keep your foot from the snare." },
  { t = "v", n = 27, indent = 1, p = true, text = "Do not withhold good from the deserving[^f] when it is within your power to act." },
  { t = "v", n = 28, indent = 1, text = "Do not tell your neighbor, “Come back tomorrow and I will provide”—when you already have the means." },
  { t = "v", n = 29, indent = 1, text = "Do not devise evil against your neighbor, for he trustfully dwells beside you." },
  { t = "v", n = 30, indent = 1, text = "Do not accuse a man without cause, when he has done you no harm." },
  { t = "v", n = 31, indent = 1, p = true, text = "Do not envy a violent man or choose any of his ways;" },
  { t = "v", n = 32, indent = 1, text = "for the LORD detests the perverse, but He is a friend to the upright." },
  { t = "v", n = 33, indent = 1, text = "The curse of the LORD is on the house of the wicked, but He blesses the home of the righteous." },
  { t = "v", n = 34, indent = 1, text = "He mocks the mockers, but gives grace to the humble.[^g]" },
  { t = "v", n = 35, indent = 1, text = "The wise will inherit honor, but fools are held up to shame." },
  { t = "note", id = "a", text = "Forms of the Hebrew *chesed* are translated here and in most cases throughout the Scriptures as *loving devotion*; the range of meaning includes *love*, *goodness*, *kindness*, *faithfulness*, and *mercy*, as well as *loyalty to a covenant*." },
  { t = "note", id = "b", text = "Hebrew *navel*" },
  { t = "note", id = "c", text = "Or *medicine*" },
  { t = "note", id = "d", text = "LXX *and do not lose heart when He rebukes*; cited in Hebrews 12:5" },
  { t = "note", id = "e", text = "LXX *and He flogs every son He receives*; cited in Hebrews 12:6" },
  { t = "note", id = "f", text = "Or *from its owners*" },
  { t = "note", id = "g", text = "LXX *The Lord opposes the proud, but gives grace to the humble*; cited in James 4:6 and 1 Peter 5:5" },
]

[[section]]
id = "4"
title = "Proverbs 4"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Father’s Instruction" },
  { t = "v", n = 1, indent = 1, p = true, text = "Listen, my sons, to a father’s instruction; pay attention and gain understanding." },
  { t = "v", n = 2, indent = 1, text = "For I give you sound teaching; do not abandon my directive." },
  { t = "v", n = 3, indent = 1, text = "When I was a son to my father, tender and the only child of my mother," },
  { t = "v", n = 4, indent = 1, text = "he taught me and said, “Let your heart lay hold of my words; keep my commands and you will live." },
  { t = "v", n = 5, indent = 1, text = "Get wisdom, get understanding; do not forget my words or turn from them." },
  { t = "v", n = 6, indent = 1, text = "Do not forsake wisdom, and she will preserve you; love her, and she will guard you." },
  { t = "v", n = 7, indent = 1, text = "Wisdom is supreme; so acquire wisdom. And whatever you may acquire,[^a] gain understanding." },
  { t = "v", n = 8, indent = 1, text = "Prize her, and she will exalt you; if you embrace her, she will honor you." },
  { t = "v", n = 9, indent = 1, text = "She will set a garland of grace on your head; she will present you with a crown of beauty.”" },
  { t = "v", n = 10, indent = 1, p = true, text = "Listen, my son, and receive my words, and the years of your life will be many." },
  { t = "v", n = 11, indent = 1, text = "I will guide you in the way of wisdom; I will lead you on straight paths." },
  { t = "v", n = 12, indent = 1, text = "When you walk, your steps will not be impeded; when you run, you will not stumble." },
  { t = "v", n = 13, indent = 1, text = "Hold on to instruction; do not let go. Guard it, for it is your life." },
  { t = "v", n = 14, indent = 1, text = "Do not set foot on the path of the wicked or walk in the way of evildoers." },
  { t = "v", n = 15, indent = 1, text = "Avoid it; do not travel on it. Turn from it and pass on by." },
  { t = "v", n = 16, indent = 1, text = "For they cannot sleep unless they do evil; they are deprived of slumber until they make someone fall." },
  { t = "v", n = 17, indent = 1, text = "For they eat the bread of wickedness and drink the wine of violence." },
  { t = "v", n = 18, indent = 1, text = "The path of the righteous is like the first gleam of dawn, shining brighter and brighter until midday." },
  { t = "v", n = 19, indent = 1, text = "But the way of the wicked is like the darkest gloom; they do not know what makes them stumble." },
  { t = "v", n = 20, indent = 1, p = true, text = "My son, pay attention to my words; incline your ear to my sayings." },
  { t = "v", n = 21, indent = 1, text = "Do not lose sight of them; keep them within your heart." },
  { t = "v", n = 22, indent = 1, text = "For they are life to those who find them, and health to the whole body." },
  { t = "v", n = 23, indent = 1, text = "Guard your heart with all diligence, for from it flow springs of life." },
  { t = "v", n = 24, indent = 1, text = "Put away deception from your mouth; keep your lips from perverse speech." },
  { t = "v", n = 25, indent = 1, text = "Let your eyes look forward; fix your gaze straight ahead." },
  { t = "v", n = 26, indent = 1, text = "Make a level path for your feet,[^b] and all your ways will be sure." },
  { t = "v", n = 27, indent = 1, text = "Do not swerve to the right or to the left; turn your feet away from evil." },
  { t = "note", id = "a", text = "Or *And whatever else you acquire*" },
  { t = "note", id = "b", text = "Or *Ponder the path for your feet*; LXX *Make straight paths for your feet*; cited in Hebrews 12:13" },
]

[[section]]
id = "5"
title = "Proverbs 5"
level = 1
blocks = [
  { t = "h", level = 2, text = "Avoiding Immorality" },
  { t = "ref", text = "(Leviticus 20:10–21; 1 Corinthians 5:1–8)" },
  { t = "v", n = 1, indent = 1, p = true, text = "My son, pay attention to my wisdom; incline your ear to my insight," },
  { t = "v", n = 2, indent = 1, text = "that you may maintain discretion and your lips may preserve knowledge." },
  { t = "v", n = 3, indent = 1, text = "Though the lips of the forbidden woman[^a] drip honey and her speech[^b] is smoother than oil," },
  { t = "v", n = 4, indent = 1, text = "in the end she is bitter as wormwood, sharp as a double-edged sword." },
  { t = "v", n = 5, indent = 1, text = "Her feet go down to death; her steps lead straight to Sheol.[^c]" },
  { t = "v", n = 6, indent = 1, text = "She does not consider the path of life; she does not know that her ways are unstable." },
  { t = "v", n = 7, indent = 1, p = true, text = "So now, my sons, listen to me, and do not turn aside from the words of my mouth." },
  { t = "v", n = 8, indent = 1, text = "Keep your path far from her; do not go near the door of her house," },
  { t = "v", n = 9, indent = 1, text = "lest you concede your vigor to others, and your years to one who is cruel;" },
  { t = "v", n = 10, indent = 1, text = "lest strangers feast on your wealth, and your labors enrich the house of a foreigner." },
  { t = "v", n = 11, indent = 1, text = "At the end of your life you will groan when your flesh and your body are spent," },
  { t = "v", n = 12, indent = 1, text = "and you will say, “How I hated discipline, and my heart despised reproof!" },
  { t = "v", n = 13, indent = 1, text = "I did not listen to the voice of my teachers or incline my ear to my mentors." },
  { t = "v", n = 14, indent = 1, text = "I am on the brink of utter ruin in the midst of the whole assembly.”" },
  { t = "v", n = 15, indent = 1, p = true, text = "Drink water from your own cistern, and running water from your own well." },
  { t = "v", n = 16, indent = 1, text = "Why should your springs flow in the streets, your streams of water in the public squares?" },
  { t = "v", n = 17, indent = 1, text = "Let them be yours alone, never to be shared with strangers." },
  { t = "v", n = 18, indent = 1, text = "May your fountain be blessed, and may you rejoice in the wife of your youth:" },
  { t = "v", n = 19, indent = 1, text = "A loving doe, a graceful fawn—may her breasts satisfy you always; may you be captivated[^d] by her love forever." },
  { t = "v", n = 20, indent = 1, text = "Why be captivated, my son, by an adulteress, or embrace the bosom of a stranger?[^e]" },
  { t = "v", n = 21, indent = 1, text = "For a man’s ways are before the eyes of the LORD, and the LORD examines[^f] all his paths." },
  { t = "v", n = 22, indent = 1, text = "The iniquities of a wicked man entrap him; the cords of his sin entangle him." },
  { t = "v", n = 23, indent = 1, text = "He dies for lack of discipline, led astray by his own great folly." },
  { t = "note", id = "a", text = "Or *the adulteress*" },
  { t = "note", id = "b", text = "Or *her palate*" },
  { t = "note", id = "c", text = "Or *lay hold of Sheol*" },
  { t = "note", id = "d", text = "Or *be led astray*; also in verse 20" },
  { t = "note", id = "e", text = "Or *a foreign woman* or *another man’s wife*" },
  { t = "note", id = "f", text = "Or *ponders* or *makes level*" },
]

[[section]]
id = "6"
title = "Proverbs 6"
level = 1
blocks = [
  { t = "h", level = 2, text = "Warnings against Foolishness" },
  { t = "v", n = 1, indent = 1, p = true, text = "My son, if you have put up security for your neighbor, if you have struck hands in pledge with a stranger," },
  { t = "v", n = 2, indent = 1, text = "if you have been trapped by the words of your lips, ensnared by the words of your mouth," },
  { t = "v", n = 3, indent = 1, text = "then do this, my son, to free yourself, for you have fallen into your neighbor’s hands: Go, humble yourself,[^a] and press your plea with your neighbor." },
  { t = "v", n = 4, indent = 1, text = "Allow no sleep to your eyes or slumber to your eyelids." },
  { t = "v", n = 5, indent = 1, text = "Free yourself, like a gazelle from the hand of the hunter,[^b] like a bird from the snare of the fowler." },
  { t = "v", n = 6, indent = 1, p = true, text = "Walk in the manner of the ant, O slacker; observe its ways and become wise." },
  { t = "v", n = 7, indent = 1, text = "Without a commander, without an overseer or ruler," },
  { t = "v", n = 8, indent = 1, text = "it prepares its provisions in summer; it gathers its food at harvest." },
  { t = "v", n = 9, indent = 1, text = "How long will you lie there, O slacker? When will you get up from your sleep?" },
  { t = "v", n = 10, indent = 1, text = "A little sleep, a little slumber, a little folding of the hands to rest," },
  { t = "v", n = 11, indent = 1, text = "and poverty will come upon you like a robber, and need like a bandit." },
  { t = "v", n = 12, indent = 1, p = true, text = "A worthless person, a wicked man, walks with a perverse mouth," },
  { t = "v", n = 13, indent = 1, text = "winking his eyes, speaking with his feet, and pointing with his fingers." },
  { t = "v", n = 14, indent = 1, text = "With deceit in his heart he devises evil; he continually sows discord." },
  { t = "v", n = 15, indent = 1, text = "Therefore calamity will come upon him suddenly; in an instant he will be shattered beyond recovery." },
  { t = "v", n = 16, p = true, text = "There are six things that the LORD hates, seven that are detestable to Him:" },
  { t = "v", n = 17, indent = 1, p = true, text = "haughty eyes, a lying tongue, hands that shed innocent blood," },
  { t = "v", n = 18, indent = 1, p = true, text = "a heart that devises wicked schemes, feet that run swiftly to evil," },
  { t = "v", n = 19, indent = 1, p = true, text = "a false witness who gives false testimony, and one who stirs up discord among brothers." },
  { t = "h", level = 2, text = "Warnings against Adultery" },
  { t = "v", n = 20, indent = 1, p = true, text = "My son, keep your father’s commandment, and do not forsake your mother’s teaching." },
  { t = "v", n = 21, indent = 1, text = "Bind them always upon your heart; tie them around your neck." },
  { t = "v", n = 22, indent = 1, text = "When you walk, they will guide you; when you lie down, they will watch over you; when you awake, they will speak to you." },
  { t = "v", n = 23, indent = 1, text = "For this commandment is a lamp, this teaching is a light, and the reproofs of discipline are the way to life," },
  { t = "v", n = 24, indent = 1, text = "to keep you from the evil woman, from the smooth tongue of the adulteress.[^c]" },
  { t = "v", n = 25, indent = 1, p = true, text = "Do not lust in your heart for her beauty or let her captivate you with her eyes.[^d]" },
  { t = "v", n = 26, indent = 1, text = "For the levy of the prostitute is poverty,[^e] and the adulteress preys upon your very life." },
  { t = "v", n = 27, indent = 1, text = "Can a man embrace fire and his clothes not be burned?" },
  { t = "v", n = 28, indent = 1, text = "Can a man walk on hot coals without scorching his feet?" },
  { t = "v", n = 29, indent = 1, text = "So is he who sleeps with another man’s wife; no one who touches her will go unpunished." },
  { t = "v", n = 30, indent = 1, p = true, text = "Men do not despise the thief if he steals to satisfy his hunger." },
  { t = "v", n = 31, indent = 1, text = "Yet if caught, he must pay sevenfold; he must give up all the wealth of his house." },
  { t = "v", n = 32, indent = 1, text = "He who commits adultery lacks judgment; whoever does so destroys himself." },
  { t = "v", n = 33, indent = 1, text = "Wounds and dishonor will befall him, and his reproach will never be wiped away." },
  { t = "v", n = 34, indent = 1, text = "For jealousy enrages a husband, and he will show no mercy in the day of vengeance." },
  { t = "v", n = 35, indent = 1, text = "He will not be appeased by any ransom, or persuaded by lavish gifts." },
  { t = "note", id = "a", text = "Or *hasten*" },
  { t = "note", id = "b", text = "Hebrew does not include *of the hunter*." },
  { t = "note", id = "c", text = "Or *the stranger*" },
  { t = "note", id = "d", text = "Or *eyelids* or *eyelashes*" },
  { t = "note", id = "e", text = "Literally *a crust of bread*" },
]

[[section]]
id = "7"
title = "Proverbs 7"
level = 1
blocks = [
  { t = "h", level = 2, text = "Warnings about the Adulteress" },
  { t = "v", n = 1, indent = 1, p = true, text = "My son, keep my words and treasure my commandments within you." },
  { t = "v", n = 2, indent = 1, text = "Keep my commandments and live; guard my teachings as the apple[^a] of your eye." },
  { t = "v", n = 3, indent = 1, text = "Tie them to your fingers; write them on the tablet of your heart." },
  { t = "v", n = 4, indent = 1, text = "Say to wisdom, “You are my sister,” and call understanding your kinsman," },
  { t = "v", n = 5, indent = 1, text = "that they may keep you from the adulteress, from the stranger with seductive words." },
  { t = "v", n = 6, indent = 1, p = true, text = "For at the window of my house I looked through the lattice." },
  { t = "v", n = 7, indent = 1, text = "I saw among the simple, I noticed among the youths, a young man lacking judgment," },
  { t = "v", n = 8, indent = 1, text = "crossing the street near her corner, strolling down the road to her house," },
  { t = "v", n = 9, indent = 1, text = "at twilight, as the day was fading into the dark of the night." },
  { t = "v", n = 10, indent = 1, p = true, text = "Then a woman came out to meet him, with the attire of a harlot and cunning of heart." },
  { t = "v", n = 11, indent = 1, text = "She is loud and defiant; her feet do not remain at home." },
  { t = "v", n = 12, indent = 1, text = "Now in the street, now in the squares, she lurks at every corner." },
  { t = "v", n = 13, indent = 1, text = "She seizes him and kisses him; she brazenly says to him:" },
  { t = "v", n = 14, indent = 1, p = true, text = "“I have made my peace offerings; today I have paid my vows." },
  { t = "v", n = 15, indent = 1, text = "So I came out to meet you; I sought you, and I have found you." },
  { t = "v", n = 16, indent = 1, text = "I have decked my bed with coverings, with colored linen from Egypt." },
  { t = "v", n = 17, indent = 1, text = "I have perfumed my bed with myrrh, with aloes, and with cinnamon." },
  { t = "v", n = 18, indent = 1, text = "Come, let us take our fill of love till morning. Let us delight in loving caresses!" },
  { t = "v", n = 19, indent = 1, text = "For my husband is not at home; he has gone on a long journey." },
  { t = "v", n = 20, indent = 1, text = "He took with him a bag of money and will not return till the moon is full.”" },
  { t = "v", n = 21, indent = 1, p = true, text = "With her great persuasion she entices him; with her flattering lips she lures him." },
  { t = "v", n = 22, indent = 1, text = "He follows her on impulse, like an ox going to the slaughter, like a deer bounding into a trap,[^b]" },
  { t = "v", n = 23, indent = 1, text = "until an arrow pierces his liver, like a bird darting into a snare—not knowing it will cost him his life." },
  { t = "v", n = 24, indent = 1, p = true, text = "Now, my sons, listen to me, and attend to the words of my mouth." },
  { t = "v", n = 25, indent = 1, text = "Do not let your heart turn aside to her ways; do not stray into her paths." },
  { t = "v", n = 26, indent = 1, text = "For she has brought many down to death; her slain are many in number." },
  { t = "v", n = 27, indent = 1, text = "Her house is the road to Sheol, descending to the chambers of death." },
  { t = "note", id = "a", text = "Literally *the pupil*" },
  { t = "note", id = "b", text = "Probable reading (see LXX, Vulgate, Syriac); Hebrew *like fetters to discipline a fool*" },
]

[[section]]
id = "8"
title = "Proverbs 8"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Excellence of Wisdom" },
  { t = "v", n = 1, indent = 1, p = true, text = "Does not wisdom call out, and understanding raise her voice?" },
  { t = "v", n = 2, indent = 1, text = "On the heights overlooking the road, at the crossroads she takes her stand." },
  { t = "v", n = 3, indent = 1, text = "Beside the gates to the city, at the entrances she cries out:" },
  { t = "v", n = 4, indent = 1, p = true, text = "“To you, O men, I call out, and my cry is to the sons of men." },
  { t = "v", n = 5, indent = 1, text = "O simple ones, learn to be shrewd; O fools, gain understanding.[^a]" },
  { t = "v", n = 6, indent = 1, text = "Listen, for I speak of noble things, and the opening of my lips will reveal right." },
  { t = "v", n = 7, indent = 1, p = true, text = "For my mouth will speak the truth, and wickedness is detestable to my lips." },
  { t = "v", n = 8, indent = 1, text = "All the words of my mouth are righteous; none are crooked or perverse." },
  { t = "v", n = 9, indent = 1, text = "They are all plain to the discerning, and upright to those who find knowledge." },
  { t = "v", n = 10, indent = 1, text = "Receive my instruction instead of silver, and knowledge rather than pure gold." },
  { t = "v", n = 11, indent = 1, text = "For wisdom is more precious than rubies, and nothing you desire compares with her." },
  { t = "v", n = 12, indent = 1, p = true, text = "I, wisdom, dwell together with prudence, and I find knowledge and discretion." },
  { t = "v", n = 13, indent = 1, text = "To fear the LORD is to hate evil; I hate arrogant pride, evil conduct, and perverse speech." },
  { t = "v", n = 14, indent = 1, text = "Counsel and sound judgment are mine; I have insight and strength." },
  { t = "v", n = 15, indent = 1, text = "By me kings reign, and rulers enact just laws;" },
  { t = "v", n = 16, indent = 1, text = "By me princes rule, and all nobles who govern justly.[^b]" },
  { t = "v", n = 17, indent = 1, p = true, text = "I love those who love me, and those who seek me early shall find me." },
  { t = "v", n = 18, indent = 1, text = "With me are riches and honor, enduring wealth and righteousness." },
  { t = "v", n = 19, indent = 1, text = "My fruit is better than gold, pure gold, and my harvest surpasses choice silver." },
  { t = "v", n = 20, indent = 1, text = "I walk in the way of righteousness, along the paths of justice," },
  { t = "v", n = 21, indent = 1, text = "bestowing wealth on those who love me and making their treasuries full." },
  { t = "v", n = 22, indent = 1, p = true, text = "The LORD created me as His first course,[^c] before His works of old." },
  { t = "v", n = 23, indent = 1, text = "From everlasting I was established, from the beginning, before the earth began." },
  { t = "v", n = 24, indent = 1, text = "When there were no watery depths, I was brought forth, when no springs were overflowing with water." },
  { t = "v", n = 25, indent = 1, text = "Before the mountains were settled, before the hills, I was brought forth," },
  { t = "v", n = 26, indent = 1, text = "before He made the land or fields, or any of the dust of the earth." },
  { t = "v", n = 27, indent = 1, p = true, text = "I was there when He established the heavens, when He inscribed a circle on the face of the deep," },
  { t = "v", n = 28, indent = 1, text = "when He established the clouds above, when the fountains of the deep gushed forth," },
  { t = "v", n = 29, indent = 1, text = "when He set a boundary for the sea, so that the waters would not surpass His command, when He marked out the foundations of the earth." },
  { t = "v", n = 30, indent = 1, text = "Then I was a skilled craftsman at His side, and His delight[^d] day by day, rejoicing always in His presence." },
  { t = "v", n = 31, indent = 1, text = "I was rejoicing in His whole world, delighting together in the sons of men." },
  { t = "v", n = 32, indent = 1, p = true, text = "Now therefore, my sons, listen to me, for blessed are those who keep my ways." },
  { t = "v", n = 33, indent = 1, text = "Listen to instruction and be wise; do not ignore it." },
  { t = "v", n = 34, indent = 1, text = "Blessed is the man who listens to me, watching daily at my doors, waiting at the posts of my doorway." },
  { t = "v", n = 35, indent = 1, text = "For whoever finds me finds life and obtains the favor of the LORD." },
  { t = "v", n = 36, indent = 1, text = "But he who fails to find me harms himself; all who hate me love death.”" },
  { t = "note", id = "a", text = "Or *instruct your minds*" },
  { t = "note", id = "b", text = "Some Hebrew manuscripts and LXX *who govern the earth*" },
  { t = "note", id = "c", text = "Or *The LORD possessed me at the beginning of His way*" },
  { t = "note", id = "d", text = "Or *filled with His delight*" },
]

[[section]]
id = "9"
title = "Proverbs 9"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Way of Wisdom" },
  { t = "ref", text = "(Proverbs 1:1–7)" },
  { t = "v", n = 1, indent = 1, p = true, text = "Wisdom has built her house; she has carved out[^a] her seven pillars." },
  { t = "v", n = 2, indent = 1, text = "She has prepared her meat and mixed her wine; she has also set her table." },
  { t = "v", n = 3, indent = 1, text = "She has sent out her maidservants; she calls out from the heights of the city." },
  { t = "v", n = 4, indent = 1, text = "“Whoever is simple, let him turn in here!” she says to him who lacks judgment." },
  { t = "v", n = 5, indent = 1, text = "“Come, eat my bread and drink the wine I have mixed." },
  { t = "v", n = 6, indent = 1, text = "Leave your folly behind, and you will live; walk in the way of understanding.”" },
  { t = "v", n = 7, indent = 1, p = true, text = "He who corrects a mocker brings shame on himself; he who rebukes a wicked man taints himself." },
  { t = "v", n = 8, indent = 1, text = "Do not rebuke a mocker, or he will hate you; rebuke a wise man, and he will love you." },
  { t = "v", n = 9, indent = 1, text = "Instruct a wise man, and he will be wiser still; teach a righteous man, and he will increase his learning." },
  { t = "v", n = 10, indent = 1, p = true, text = "The fear of the LORD is the beginning of wisdom, and knowledge of the Holy One is understanding." },
  { t = "v", n = 11, indent = 1, text = "For through wisdom[^b] your days will be multiplied, and years will be added to your life." },
  { t = "v", n = 12, indent = 1, text = "If you are wise, you are wise to your own advantage; but if you scoff, you alone will bear the consequences." },
  { t = "h", level = 2, text = "The Way of Folly" },
  { t = "v", n = 13, indent = 1, p = true, text = "The woman named Folly is loud; she is naive and knows nothing." },
  { t = "v", n = 14, indent = 1, text = "She sits at the door of her house, on a seat in the heights of the city," },
  { t = "v", n = 15, indent = 1, text = "calling out to those who pass by, who make their paths straight." },
  { t = "v", n = 16, indent = 1, text = "“Whoever is simple, let him turn in here!” she says to him who lacks judgment." },
  { t = "v", n = 17, indent = 1, text = "“Stolen water is sweet, and bread eaten in secret is tasty!”" },
  { t = "v", n = 18, indent = 1, text = "But they do not know that the dead[^c] are there, that her guests are in the depths of Sheol." },
  { t = "note", id = "a", text = "Hebrew; LXX, Syriac, and Aramaic Targum *has set up*" },
  { t = "note", id = "b", text = "LXX, Syriac, and Aramaic Targum; Hebrew *through me*" },
  { t = "note", id = "c", text = "Hebrew *the Rephaim*" },
]

[[section]]
id = "10"
title = "Proverbs 10"
level = 1
blocks = [
  { t = "h", level = 2, text = "Solomon’s Proverbs: The Wise Son" },
  { t = "v", n = 1, p = true, text = "The proverbs of Solomon: A wise son brings joy to his father, but a foolish son grief to his mother." },
  { t = "v", n = 2, indent = 1, p = true, text = "Ill-gotten treasures profit nothing, but righteousness brings deliverance from death." },
  { t = "v", n = 3, indent = 1, p = true, text = "The LORD does not let the righteous go hungry, but He denies the craving of the wicked." },
  { t = "v", n = 4, indent = 1, p = true, text = "Idle hands make one poor, but diligent hands bring wealth." },
  { t = "v", n = 5, indent = 1, p = true, text = "He who gathers in summer is a wise son, but he who sleeps during harvest is a disgraceful son." },
  { t = "v", n = 6, indent = 1, p = true, text = "Blessings are on the head of the righteous, but the mouth of the wicked conceals violence.[^a]" },
  { t = "v", n = 7, indent = 1, p = true, text = "The memory of the righteous is a blessing, but the name of the wicked will rot." },
  { t = "v", n = 8, indent = 1, p = true, text = "A wise heart will receive commandments, but foolish lips will come to ruin." },
  { t = "v", n = 9, indent = 1, p = true, text = "He who walks in integrity walks securely, but he who perverts his ways will be found out." },
  { t = "v", n = 10, indent = 1, p = true, text = "He who winks the eye causes grief, and foolish lips will come to ruin.[^b]" },
  { t = "v", n = 11, indent = 1, p = true, text = "The mouth of the righteous is a fountain of life, but the mouth of the wicked conceals violence." },
  { t = "v", n = 12, indent = 1, p = true, text = "Hatred stirs up dissension, but love covers all transgressions.[^c]" },
  { t = "v", n = 13, indent = 1, p = true, text = "Wisdom is found on the lips of the discerning, but a rod is for the back of him who lacks judgment." },
  { t = "v", n = 14, indent = 1, p = true, text = "The wise store up knowledge, but the mouth of the fool invites destruction." },
  { t = "v", n = 15, indent = 1, p = true, text = "The wealth of the rich man is his fortified city, but poverty is the ruin of the poor." },
  { t = "v", n = 16, indent = 1, p = true, text = "The labor of the righteous leads to life, but the gain of the wicked brings punishment." },
  { t = "v", n = 17, indent = 1, p = true, text = "Whoever heeds instruction is on the path to life, but he who ignores reproof goes astray." },
  { t = "v", n = 18, indent = 1, p = true, text = "The one who conceals hatred has lying lips, and whoever spreads slander is a fool." },
  { t = "v", n = 19, indent = 1, p = true, text = "When words are many, sin is unavoidable, but he who restrains his lips is wise." },
  { t = "v", n = 20, indent = 1, p = true, text = "The tongue of the righteous is choice silver, but the heart of the wicked has little worth." },
  { t = "v", n = 21, indent = 1, p = true, text = "The lips of the righteous feed many, but fools die for lack of judgment." },
  { t = "v", n = 22, indent = 1, p = true, text = "The blessing of the LORD enriches, and He adds no sorrow to it." },
  { t = "v", n = 23, indent = 1, p = true, text = "The fool delights in shameful conduct, but a man of understanding has wisdom." },
  { t = "v", n = 24, indent = 1, p = true, text = "What the wicked man dreads will overtake him, but the desire of the righteous will be granted." },
  { t = "v", n = 25, indent = 1, p = true, text = "When the whirlwind passes, the wicked are no more, but the righteous are secure forever." },
  { t = "v", n = 26, indent = 1, p = true, text = "Like vinegar to the teeth and smoke to the eyes, so is the slacker to those who send him." },
  { t = "v", n = 27, indent = 1, p = true, text = "The fear of the LORD prolongs life, but the years of the wicked will be cut short." },
  { t = "v", n = 28, indent = 1, p = true, text = "The hope of the righteous is joy, but the expectations of the wicked will perish." },
  { t = "v", n = 29, indent = 1, p = true, text = "The way of the LORD is a refuge to the upright, but destruction awaits those who do evil." },
  { t = "v", n = 30, indent = 1, p = true, text = "The righteous will never be shaken, but the wicked will not inhabit the land." },
  { t = "v", n = 31, indent = 1, p = true, text = "The mouth of the righteous brings forth wisdom, but a perverse tongue will be cut out." },
  { t = "v", n = 32, indent = 1, p = true, text = "The lips of the righteous know what is fitting, but the mouth of the wicked is perverse." },
  { t = "note", id = "a", text = "Or *but violence covers the mouth of the wicked*; also in verse 11" },
  { t = "note", id = "b", text = "Or *babbling fools will fall*" },
  { t = "note", id = "c", text = "See 1 Peter 4:8" },
]

[[section]]
id = "11"
title = "Proverbs 11"
level = 1
blocks = [
  { t = "h", level = 2, text = "Dishonest Scales" },
  { t = "ref", text = "(Deuteronomy 25:13–16; Ezekiel 45:10–12)" },
  { t = "v", n = 1, indent = 1, p = true, text = "Dishonest scales are an abomination to the LORD, but an accurate weight is His delight." },
  { t = "v", n = 2, indent = 1, p = true, text = "When pride comes, disgrace follows, but with humility comes wisdom." },
  { t = "v", n = 3, indent = 1, p = true, text = "The integrity of the upright guides them, but the perversity of the faithless destroys them." },
  { t = "v", n = 4, indent = 1, p = true, text = "Riches are worthless in the day of wrath, but righteousness brings deliverance from death." },
  { t = "v", n = 5, indent = 1, p = true, text = "The righteousness of the blameless directs their path, but the wicked fall by their own wickedness." },
  { t = "v", n = 6, indent = 1, p = true, text = "The righteousness of the upright delivers them, but the faithless are trapped by their own desires." },
  { t = "v", n = 7, indent = 1, p = true, text = "When the wicked man dies, his hope perishes, and the hope of his strength vanishes." },
  { t = "v", n = 8, indent = 1, p = true, text = "The righteous man is delivered from trouble; in his place the wicked man goes in." },
  { t = "v", n = 9, indent = 1, p = true, text = "With his mouth the ungodly man destroys his neighbor, but through knowledge the righteous are rescued." },
  { t = "v", n = 10, indent = 1, p = true, text = "When the righteous thrive, the city rejoices, and when the wicked perish, there are shouts of joy." },
  { t = "v", n = 11, indent = 1, p = true, text = "By the blessing of the upright a city is built up, but by the mouth of the wicked it is torn down." },
  { t = "v", n = 12, indent = 1, p = true, text = "Whoever shows contempt for his neighbor lacks judgment, but a man of understanding remains silent." },
  { t = "v", n = 13, indent = 1, p = true, text = "A gossip reveals a secret, but a trustworthy person keeps a confidence." },
  { t = "v", n = 14, indent = 1, p = true, text = "For lack of guidance, a nation falls, but with many counselors comes deliverance." },
  { t = "v", n = 15, indent = 1, p = true, text = "He who puts up security for a stranger will surely suffer, but the one who hates indebtedness is secure." },
  { t = "v", n = 16, indent = 1, p = true, text = "A gracious woman attains honor, but ruthless men gain only wealth." },
  { t = "v", n = 17, indent = 1, p = true, text = "A kind man benefits himself, but a cruel man brings trouble on himself." },
  { t = "v", n = 18, indent = 1, p = true, text = "The wicked man earns an empty wage, but he who sows righteousness reaps a true reward." },
  { t = "v", n = 19, indent = 1, p = true, text = "Genuine righteousness leads to life, but the pursuit of evil brings death." },
  { t = "v", n = 20, indent = 1, p = true, text = "The perverse in heart are an abomination to the LORD, but the blameless in their walk are His delight." },
  { t = "v", n = 21, indent = 1, p = true, text = "Be assured that the wicked will not go unpunished, but the offspring of the righteous will escape." },
  { t = "v", n = 22, indent = 1, p = true, text = "Like a gold ring in a pig’s snout is a beautiful woman who lacks discretion." },
  { t = "v", n = 23, indent = 1, p = true, text = "The desire of the righteous leads only to good, but the hope of the wicked brings wrath." },
  { t = "v", n = 24, indent = 1, p = true, text = "One gives freely, yet gains even more; another withholds what is right, only to become poor." },
  { t = "v", n = 25, indent = 1, p = true, text = "A generous soul will prosper, and he who refreshes others will himself be refreshed." },
  { t = "v", n = 26, indent = 1, p = true, text = "The people will curse the hoarder of grain, but blessing will crown the one who sells it." },
  { t = "v", n = 27, indent = 1, p = true, text = "He who searches out good finds favor, but evil will come to him who seeks it." },
  { t = "v", n = 28, indent = 1, p = true, text = "He who trusts in his riches will fall, but the righteous will thrive like foliage." },
  { t = "v", n = 29, indent = 1, p = true, text = "He who brings trouble on his house will inherit the wind, and the fool will be servant to the wise of heart." },
  { t = "v", n = 30, indent = 1, p = true, text = "The fruit of the righteous is a tree of life, and he who wins souls is wise." },
  { t = "v", n = 31, indent = 1, p = true, text = "If the righteous receive their due on earth, how much more the ungodly and the sinner![^a]" },
  { t = "note", id = "a", text = "LXX *If it is hard for the righteous to be saved, what will become of the ungodly and the sinner?*Cited in 1 Peter 4:18" },
]

[[section]]
id = "12"
title = "Proverbs 12"
level = 1
blocks = [
  { t = "h", level = 2, text = "Loving Discipline and Knowledge" },
  { t = "v", n = 1, indent = 1, p = true, text = "Whoever loves discipline loves knowledge, but he who hates correction is stupid." },
  { t = "v", n = 2, indent = 1, p = true, text = "The good man obtains favor from the LORD, but the LORD condemns a man who devises evil." },
  { t = "v", n = 3, indent = 1, p = true, text = "A man cannot be established through wickedness, but the righteous cannot be uprooted." },
  { t = "v", n = 4, indent = 1, p = true, text = "A wife of noble character is her husband’s crown, but she who causes shame is like decay in his bones." },
  { t = "v", n = 5, indent = 1, p = true, text = "The plans of the righteous are just, but the counsel of the wicked leads to deceit." },
  { t = "v", n = 6, indent = 1, p = true, text = "The words of the wicked lie in wait for blood, but the speech of the upright rescues them." },
  { t = "v", n = 7, indent = 1, p = true, text = "The wicked are overthrown and perish, but the house of the righteous will stand." },
  { t = "v", n = 8, indent = 1, p = true, text = "A man is praised according to his wisdom, but a twisted mind is despised." },
  { t = "v", n = 9, indent = 1, p = true, text = "Better to be lightly esteemed yet have a servant, than to be self-important but lack food." },
  { t = "v", n = 10, indent = 1, p = true, text = "A righteous man regards the life of his animal, but the tender mercies of the wicked are only cruelty." },
  { t = "v", n = 11, indent = 1, p = true, text = "The one who works his land will have plenty of food, but whoever chases fantasies lacks judgment." },
  { t = "v", n = 12, indent = 1, p = true, text = "The wicked desire the plunder of evil men, but the root of the righteous flourishes." },
  { t = "v", n = 13, indent = 1, p = true, text = "An evil man is trapped by his rebellious speech, but a righteous man escapes from trouble." },
  { t = "v", n = 14, indent = 1, p = true, text = "By fruitful speech a man is filled with good things, and the work of his hands returns to him." },
  { t = "v", n = 15, indent = 1, p = true, text = "The way of a fool is right in his own eyes, but a wise man listens to counsel." },
  { t = "v", n = 16, indent = 1, p = true, text = "A fool’s anger is known at once, but a prudent man overlooks an insult." },
  { t = "v", n = 17, indent = 1, p = true, text = "He who speaks the truth declares what is right, but a false witness speaks deceit." },
  { t = "v", n = 18, indent = 1, p = true, text = "Speaking rashly is like a piercing sword, but the tongue of the wise brings healing." },
  { t = "v", n = 19, indent = 1, p = true, text = "Truthful lips endure forever, but a lying tongue lasts only a moment." },
  { t = "v", n = 20, indent = 1, p = true, text = "Deceit is in the hearts of those who devise evil, but the counselors of peace have joy." },
  { t = "v", n = 21, indent = 1, p = true, text = "No harm befalls the righteous, but the wicked are filled with trouble." },
  { t = "v", n = 22, indent = 1, p = true, text = "Lying lips are detestable to the LORD, but those who deal faithfully are His delight." },
  { t = "v", n = 23, indent = 1, p = true, text = "A shrewd man keeps his knowledge to himself, but a foolish heart proclaims its folly." },
  { t = "v", n = 24, indent = 1, p = true, text = "The hand of the diligent will rule, but laziness ends in forced labor." },
  { t = "v", n = 25, indent = 1, p = true, text = "Anxiety weighs down the heart of a man, but a good word cheers it up." },
  { t = "v", n = 26, indent = 1, p = true, text = "A righteous man is cautious in friendship, but the ways of the wicked lead them astray." },
  { t = "v", n = 27, indent = 1, p = true, text = "A lazy man does not roast his game, but a diligent man prizes his possession." },
  { t = "v", n = 28, indent = 1, p = true, text = "There is life in the path of righteousness, but another path leads to death." },
]

[[section]]
id = "13"
title = "Proverbs 13"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Father’s Discipline" },
  { t = "v", n = 1, indent = 1, p = true, text = "A wise son heeds his father’s discipline, but a mocker does not listen to rebuke." },
  { t = "v", n = 2, indent = 1, p = true, text = "From the fruit of his lips a man enjoys good things, but the desire of the faithless is violence." },
  { t = "v", n = 3, indent = 1, p = true, text = "He who guards his mouth protects his life, but the one who opens his lips invites his own ruin." },
  { t = "v", n = 4, indent = 1, p = true, text = "The slacker craves yet has nothing, but the soul of the diligent is fully satisfied." },
  { t = "v", n = 5, indent = 1, p = true, text = "The righteous hate falsehood, but the wicked bring shame and disgrace." },
  { t = "v", n = 6, indent = 1, p = true, text = "Righteousness guards the man of integrity, but wickedness undermines the sinner." },
  { t = "v", n = 7, indent = 1, p = true, text = "One pretends to be rich, but has nothing; another pretends to be poor, yet has great wealth." },
  { t = "v", n = 8, indent = 1, p = true, text = "Riches may ransom a man’s life, but a poor man hears no threat." },
  { t = "v", n = 9, indent = 1, p = true, text = "The light of the righteous shines brightly, but the lamp of the wicked is extinguished." },
  { t = "v", n = 10, indent = 1, p = true, text = "Arrogance leads only to strife, but wisdom is with the well-advised." },
  { t = "v", n = 11, indent = 1, p = true, text = "Dishonest wealth will dwindle, but what is earned through hard work will be multiplied." },
  { t = "v", n = 12, indent = 1, p = true, text = "Hope deferred makes the heart sick, but desire fulfilled is a tree of life." },
  { t = "v", n = 13, indent = 1, p = true, text = "He who despises instruction will pay the penalty, but the one who respects a command will be rewarded." },
  { t = "v", n = 14, indent = 1, p = true, text = "The teaching[^a] of the wise is a fountain of life, turning one from the snares of death." },
  { t = "v", n = 15, indent = 1, p = true, text = "Good understanding wins favor, but the way of the faithless is difficult." },
  { t = "v", n = 16, indent = 1, p = true, text = "Every prudent man acts with knowledge, but a fool displays his folly." },
  { t = "v", n = 17, indent = 1, p = true, text = "A wicked messenger falls into trouble, but a faithful envoy brings healing." },
  { t = "v", n = 18, indent = 1, p = true, text = "Poverty and shame come to him who ignores discipline, but whoever heeds correction is honored." },
  { t = "v", n = 19, indent = 1, p = true, text = "Desire fulfilled is sweet to the soul, but turning from evil is detestable to fools." },
  { t = "v", n = 20, indent = 1, p = true, text = "He who walks with the wise will become wise, but the companion of fools will be destroyed." },
  { t = "v", n = 21, indent = 1, p = true, text = "Disaster pursues sinners, but prosperity is the reward of the righteous." },
  { t = "v", n = 22, indent = 1, p = true, text = "A good man leaves an inheritance to his children’s children, but the sinner’s wealth is passed to the righteous." },
  { t = "v", n = 23, indent = 1, p = true, text = "Abundant food is in the fallow ground of the poor, but without justice it is swept away." },
  { t = "v", n = 24, indent = 1, p = true, text = "He who spares the rod hates his son, but he who loves him disciplines him diligently." },
  { t = "v", n = 25, indent = 1, p = true, text = "A righteous man eats to his heart’s content, but the stomach of the wicked is empty." },
  { t = "note", id = "a", text = "Or *law*" },
]

[[section]]
id = "14"
title = "Proverbs 14"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Wise Woman" },
  { t = "v", n = 1, indent = 1, p = true, text = "Every wise woman builds her house, but a foolish one tears it down with her own hands." },
  { t = "v", n = 2, indent = 1, p = true, text = "He who walks in uprightness fears the LORD, but the one who is devious in his ways despises Him." },
  { t = "v", n = 3, indent = 1, p = true, text = "The proud speech of a fool brings a rod to his back, but the lips of the wise protect them." },
  { t = "v", n = 4, indent = 1, p = true, text = "Where there are no oxen, the manger is empty, but an abundant harvest comes through the strength of the ox." },
  { t = "v", n = 5, indent = 1, p = true, text = "An honest witness does not deceive, but a dishonest witness pours forth lies." },
  { t = "v", n = 6, indent = 1, p = true, text = "A mocker seeks wisdom and finds none, but knowledge comes easily to the discerning." },
  { t = "v", n = 7, indent = 1, p = true, text = "Stay away from a foolish man; you will gain no knowledge from his speech." },
  { t = "v", n = 8, indent = 1, p = true, text = "The wisdom of the prudent is to discern his way, but the folly of fools deceives them." },
  { t = "v", n = 9, indent = 1, p = true, text = "Fools mock the making of amends, but goodwill is found among the upright." },
  { t = "v", n = 10, indent = 1, p = true, text = "The heart knows its own bitterness, and no stranger shares in its joy." },
  { t = "v", n = 11, indent = 1, p = true, text = "The house of the wicked will be destroyed, but the tent of the upright will flourish." },
  { t = "v", n = 12, indent = 1, p = true, text = "There is a way that seems right to a man, but its end is the way of death." },
  { t = "v", n = 13, indent = 1, p = true, text = "Even in laughter the heart may ache, and joy may end in sorrow." },
  { t = "v", n = 14, indent = 1, p = true, text = "The backslider in heart receives the fill of his own ways, but a good man is rewarded for his ways." },
  { t = "v", n = 15, indent = 1, p = true, text = "The simple man believes every word, but the prudent man watches his steps." },
  { t = "v", n = 16, indent = 1, p = true, text = "A wise man fears[^a] and turns from evil, but a fool is careless and reckless." },
  { t = "v", n = 17, indent = 1, p = true, text = "A quick-tempered man acts foolishly, and a devious man is hated." },
  { t = "v", n = 18, indent = 1, p = true, text = "The simple inherit folly, but the prudent are crowned with knowledge." },
  { t = "v", n = 19, indent = 1, p = true, text = "The evil bow before the good, and the wicked at the gates of the righteous." },
  { t = "v", n = 20, indent = 1, p = true, text = "The poor man is hated even by his neighbor, but many are those who love the rich." },
  { t = "v", n = 21, indent = 1, p = true, text = "He who despises his neighbor sins, but blessed is he who shows kindness to the poor." },
  { t = "v", n = 22, indent = 1, p = true, text = "Do not those who contrive evil go astray? But those who plan goodness find[^b] loving devotion and faithfulness." },
  { t = "v", n = 23, indent = 1, p = true, text = "There is profit in all labor, but mere talk leads only to poverty." },
  { t = "v", n = 24, indent = 1, p = true, text = "The crown of the wise is their wealth, but the effort of fools is folly." },
  { t = "v", n = 25, indent = 1, p = true, text = "A truthful witness saves lives, but one who utters lies is deceitful." },
  { t = "v", n = 26, indent = 1, p = true, text = "He who fears the LORD is secure in confidence, and his children shall have a place of refuge." },
  { t = "v", n = 27, indent = 1, p = true, text = "The fear of the LORD is a fountain of life, turning a man from the snares of death." },
  { t = "v", n = 28, indent = 1, p = true, text = "A large population is a king’s splendor, but a lack of subjects is a prince’s ruin." },
  { t = "v", n = 29, indent = 1, p = true, text = "A patient man has great understanding, but a quick-tempered man promotes folly." },
  { t = "v", n = 30, indent = 1, p = true, text = "A tranquil heart is life to the body, but envy rots the bones." },
  { t = "v", n = 31, indent = 1, p = true, text = "Whoever oppresses the poor taunts their Maker, but whoever is kind to the needy honors Him." },
  { t = "v", n = 32, indent = 1, p = true, text = "The wicked man is thrown down by his own sin, but the righteous man has a refuge even in death." },
  { t = "v", n = 33, indent = 1, p = true, text = "Wisdom rests in the heart of the discerning; even among fools she is known.[^c]" },
  { t = "v", n = 34, indent = 1, p = true, text = "Righteousness exalts a nation, but sin is a disgrace to any people." },
  { t = "v", n = 35, indent = 1, p = true, text = "A king delights in a wise servant, but his anger falls on the shameful." },
  { t = "note", id = "a", text = "Or *fears the LORD*" },
  { t = "note", id = "b", text = "Or *show*" },
  { t = "note", id = "c", text = "Hebrew; LXX and Syriac *but among fools she is not known*" },
]

[[section]]
id = "15"
title = "Proverbs 15"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Gentle Answer Turns Away Wrath" },
  { t = "v", n = 1, indent = 1, p = true, text = "A gentle answer turns away wrath, but a harsh word stirs up anger." },
  { t = "v", n = 2, indent = 1, p = true, text = "The tongue of the wise commends knowledge, but the mouth of the fool spouts folly." },
  { t = "v", n = 3, indent = 1, p = true, text = "The eyes of the LORD are in every place, observing the evil and the good." },
  { t = "v", n = 4, indent = 1, p = true, text = "A soothing tongue is a tree of life, but a perverse tongue crushes the spirit." },
  { t = "v", n = 5, indent = 1, p = true, text = "A fool rejects his father’s discipline, but whoever heeds correction is prudent." },
  { t = "v", n = 6, indent = 1, p = true, text = "The house of the righteous has great treasure, but the income of the wicked is trouble." },
  { t = "v", n = 7, indent = 1, p = true, text = "The lips of the wise spread knowledge, but not so the hearts of fools." },
  { t = "v", n = 8, indent = 1, p = true, text = "The sacrifice of the wicked is detestable to the LORD, but the prayer of the upright is His delight." },
  { t = "v", n = 9, indent = 1, p = true, text = "The LORD detests the way of the wicked, but He loves those who pursue righteousness." },
  { t = "v", n = 10, indent = 1, p = true, text = "Discipline is harsh for him who leaves the path; he who hates correction will die." },
  { t = "v", n = 11, indent = 1, p = true, text = "Sheol and Abaddon[^a] lie open before the LORD—how much more the hearts of men!" },
  { t = "v", n = 12, indent = 1, p = true, text = "A mocker does not love to be reproved, nor will he consult the wise." },
  { t = "v", n = 13, indent = 1, p = true, text = "A joyful heart makes a cheerful countenance, but sorrow of the heart crushes the spirit." },
  { t = "v", n = 14, indent = 1, p = true, text = "A discerning heart seeks knowledge, but the mouth of a fool feeds on folly." },
  { t = "v", n = 15, indent = 1, p = true, text = "All the days of the oppressed are bad, but a cheerful heart has a continual feast." },
  { t = "v", n = 16, indent = 1, p = true, text = "Better a little with the fear of the LORD than great treasure with turmoil." },
  { t = "v", n = 17, indent = 1, p = true, text = "Better a dish of vegetables where there is love than a fattened ox with hatred." },
  { t = "v", n = 18, indent = 1, p = true, text = "A hot-tempered man stirs up strife, but he who is slow to anger calms dispute." },
  { t = "v", n = 19, indent = 1, p = true, text = "The way of the slacker is like a hedge of thorns, but the path of the upright is a highway." },
  { t = "v", n = 20, indent = 1, p = true, text = "A wise son brings joy to his father, but a foolish man despises his mother." },
  { t = "v", n = 21, indent = 1, p = true, text = "Folly is joy to one who lacks judgment, but a man of understanding walks a straight path." },
  { t = "v", n = 22, indent = 1, p = true, text = "Plans fail for lack of counsel, but with many advisers they succeed." },
  { t = "v", n = 23, indent = 1, p = true, text = "A man takes joy in a fitting reply—and how good is a timely word!" },
  { t = "v", n = 24, indent = 1, p = true, text = "The path of life leads upward for the wise, that he may avoid going down to Sheol." },
  { t = "v", n = 25, indent = 1, p = true, text = "The LORD tears down the house of the proud, but He protects the boundaries of the widow." },
  { t = "v", n = 26, indent = 1, p = true, text = "The LORD detests the thoughts of the wicked, but the words of the pure are pleasant to Him." },
  { t = "v", n = 27, indent = 1, p = true, text = "He who is greedy for unjust gain brings trouble on his household, but he who hates bribes will live." },
  { t = "v", n = 28, indent = 1, p = true, text = "The heart of the righteous ponders how to answer, but the mouth of the wicked blurts out evil." },
  { t = "v", n = 29, indent = 1, p = true, text = "The LORD is far from the wicked, but He hears the prayer of the righteous." },
  { t = "v", n = 30, indent = 1, p = true, text = "The light of the eyes cheers the heart, and good news nourishes the bones." },
  { t = "v", n = 31, indent = 1, p = true, text = "He who listens to life-giving reproof will dwell among the wise." },
  { t = "v", n = 32, indent = 1, p = true, text = "He who ignores discipline despises himself, but whoever heeds correction gains understanding." },
  { t = "v", n = 33, indent = 1, p = true, text = "The fear of the LORD is the instruction of wisdom, and humility comes before honor." },
  { t = "note", id = "a", text = "Or *Death and Destruction*" },
]

[[section]]
id = "16"
title = "Proverbs 16"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Reply of the Tongue Is from the LORD" },
  { t = "v", n = 1, indent = 1, p = true, text = "The plans of the heart belong to man, but the reply of the tongue is from the LORD." },
  { t = "v", n = 2, indent = 1, p = true, text = "All a man’s ways are pure in his own eyes, but his motives are weighed out by the LORD." },
  { t = "v", n = 3, indent = 1, p = true, text = "Commit your works to the LORD and your plans will be achieved." },
  { t = "v", n = 4, indent = 1, p = true, text = "The LORD has made everything for His purpose—even the wicked for the day of disaster." },
  { t = "v", n = 5, indent = 1, p = true, text = "Everyone who is proud in heart is detestable to the LORD; be assured that he will not go unpunished." },
  { t = "v", n = 6, indent = 1, p = true, text = "By loving devotion and faithfulness iniquity is atoned for, and by the fear of the LORD one turns aside from evil." },
  { t = "v", n = 7, indent = 1, p = true, text = "When a man’s ways please the LORD, He makes even the man’s enemies live at peace with him." },
  { t = "v", n = 8, indent = 1, p = true, text = "Better a little with righteousness than great gain with injustice." },
  { t = "v", n = 9, indent = 1, p = true, text = "A man’s heart plans his course, but the LORD determines his steps." },
  { t = "v", n = 10, indent = 1, p = true, text = "A divine verdict is on the lips of a king; his mouth must not betray justice." },
  { t = "v", n = 11, indent = 1, p = true, text = "Honest scales and balances are from the LORD; all the weights in the bag are His concern." },
  { t = "v", n = 12, indent = 1, p = true, text = "Wicked behavior is detestable for kings, for a throne is established through righteousness." },
  { t = "v", n = 13, indent = 1, p = true, text = "Righteous lips are a king’s delight, and he who speaks honestly is beloved." },
  { t = "v", n = 14, indent = 1, p = true, text = "The wrath of a king is a messenger of death, but a wise man will pacify it." },
  { t = "v", n = 15, indent = 1, p = true, text = "When a king’s face brightens, there is life; his favor is like a rain cloud in spring." },
  { t = "v", n = 16, indent = 1, p = true, text = "How much better to acquire wisdom than gold! To gain understanding is more desirable than silver." },
  { t = "v", n = 17, indent = 1, p = true, text = "The highway of the upright leads away from evil; he who guards his way protects his life." },
  { t = "v", n = 18, indent = 1, p = true, text = "Pride goes before destruction, and a haughty spirit before a fall." },
  { t = "v", n = 19, indent = 1, p = true, text = "It is better to be lowly in spirit among the humble than to divide the spoil with the proud." },
  { t = "v", n = 20, indent = 1, p = true, text = "Whoever heeds instruction will find success,[^a] and blessed is he who trusts in the LORD." },
  { t = "v", n = 21, indent = 1, p = true, text = "The wise in heart are called discerning, and pleasant speech promotes instruction." },
  { t = "v", n = 22, indent = 1, p = true, text = "Understanding is a fountain of life to its possessor, but the discipline of fools is folly." },
  { t = "v", n = 23, indent = 1, p = true, text = "The heart of the wise man instructs his mouth and adds persuasiveness to his lips." },
  { t = "v", n = 24, indent = 1, p = true, text = "Pleasant words are a honeycomb, sweet to the soul and healing to the bones." },
  { t = "v", n = 25, indent = 1, p = true, text = "There is a way that seems right to a man, but its end is the way of death." },
  { t = "v", n = 26, indent = 1, p = true, text = "A worker’s appetite works for him because his hunger drives him onward." },
  { t = "v", n = 27, indent = 1, p = true, text = "A worthless man digs up evil, and his speech[^b] is like a scorching fire." },
  { t = "v", n = 28, indent = 1, p = true, text = "A perverse man spreads dissension, and a gossip divides close friends." },
  { t = "v", n = 29, indent = 1, p = true, text = "A violent man entices his neighbor and leads him down a path that is not good." },
  { t = "v", n = 30, indent = 1, p = true, text = "He who winks his eye devises perversity; he who purses his lips is bent on evil." },
  { t = "v", n = 31, indent = 1, p = true, text = "Gray hair is a crown of glory; it is attained along the path of righteousness." },
  { t = "v", n = 32, indent = 1, p = true, text = "He who is slow to anger is better than a warrior, and he who controls his temper is greater than one who captures a city." },
  { t = "v", n = 33, indent = 1, p = true, text = "The lot is cast into the lap, but its every decision is from the LORD." },
  { t = "note", id = "a", text = "Or *Whoever speaks prudently will find what is good*" },
  { t = "note", id = "b", text = "Or *and what is on his lips*" },
]

[[section]]
id = "17"
title = "Proverbs 17"
level = 1
blocks = [
  { t = "h", level = 2, text = "Better a Dry Morsel in Quietness" },
  { t = "v", n = 1, indent = 1, p = true, text = "Better a dry morsel in quietness than a house full of feasting[^a] with strife." },
  { t = "v", n = 2, indent = 1, p = true, text = "A wise servant will rule over a disgraceful son and share his inheritance as one of the brothers." },
  { t = "v", n = 3, indent = 1, p = true, text = "A crucible for silver and a furnace for gold, but the LORD is the tester of hearts." },
  { t = "v", n = 4, indent = 1, p = true, text = "A wicked man listens to evil lips; a liar gives ear to a destructive tongue." },
  { t = "v", n = 5, indent = 1, p = true, text = "He who mocks the poor insults their Maker; whoever gloats over calamity will not go unpunished." },
  { t = "v", n = 6, indent = 1, p = true, text = "Grandchildren are the crown of the aged, and the glory of a son is his father." },
  { t = "v", n = 7, indent = 1, p = true, text = "Eloquent words are unfit for a fool; how much worse are lying lips to a ruler!" },
  { t = "v", n = 8, indent = 1, p = true, text = "A bribe is a charm to its giver; wherever he turns, he succeeds." },
  { t = "v", n = 9, indent = 1, p = true, text = "Whoever conceals an offense promotes love, but he who brings it up separates friends." },
  { t = "v", n = 10, indent = 1, p = true, text = "A rebuke cuts into a man of discernment deeper than a hundred lashes cut into a fool." },
  { t = "v", n = 11, indent = 1, p = true, text = "An evil man seeks only rebellion; a cruel messenger will be sent against him." },
  { t = "v", n = 12, indent = 1, p = true, text = "It is better to meet a bear robbed of her cubs than a fool in his folly." },
  { t = "v", n = 13, indent = 1, p = true, text = "If anyone returns evil for good, evil will never leave his house." },
  { t = "v", n = 14, indent = 1, p = true, text = "To start a quarrel is to release a flood; so abandon the dispute before it breaks out." },
  { t = "v", n = 15, indent = 1, p = true, text = "Acquitting the guilty and condemning the righteous—both are detestable to the LORD." },
  { t = "v", n = 16, indent = 1, p = true, text = "Why should the fool have money in his hand with no intention of buying wisdom?" },
  { t = "v", n = 17, indent = 1, p = true, text = "A friend loves at all times, and a brother is born for adversity." },
  { t = "v", n = 18, indent = 1, p = true, text = "A man lacking judgment strikes hands in pledge and puts up security for his neighbor." },
  { t = "v", n = 19, indent = 1, p = true, text = "He who loves transgression loves strife; he who builds his gate high invites destruction." },
  { t = "v", n = 20, indent = 1, p = true, text = "The one with a perverse heart finds no good, and he whose tongue is deceitful falls into trouble." },
  { t = "v", n = 21, indent = 1, p = true, text = "A man fathers a fool to his own grief; the father of a fool has no joy." },
  { t = "v", n = 22, indent = 1, p = true, text = "A joyful heart is good medicine, but a broken spirit dries up the bones." },
  { t = "v", n = 23, indent = 1, p = true, text = "A wicked man takes a covert bribe[^b] to subvert the course of justice." },
  { t = "v", n = 24, indent = 1, p = true, text = "Wisdom is the focus of the discerning, but the eyes of a fool wander to the ends of the earth." },
  { t = "v", n = 25, indent = 1, p = true, text = "A foolish son brings grief to his father and bitterness to her who bore him." },
  { t = "v", n = 26, indent = 1, p = true, text = "It is surely not good to punish the innocent or to flog a noble for his honesty." },
  { t = "v", n = 27, indent = 1, p = true, text = "A man of knowledge restrains his words, and a man of understanding maintains a calm spirit." },
  { t = "v", n = 28, indent = 1, p = true, text = "Even a fool is considered wise if he keeps silent, and discerning when he holds his tongue." },
  { t = "note", id = "a", text = "Or *sacrifices*" },
  { t = "note", id = "b", text = "Hebrew *a bribe from the bosom*" },
]

[[section]]
id = "18"
title = "Proverbs 18"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Selfishness of the Unfriendly" },
  { t = "v", n = 1, indent = 1, p = true, text = "He who isolates himself pursues selfish desires; he rebels against all sound judgment." },
  { t = "v", n = 2, indent = 1, p = true, text = "A fool does not delight in understanding, but only in airing his opinions." },
  { t = "v", n = 3, indent = 1, p = true, text = "With a wicked man comes contempt as well, and shame is accompanied by disgrace." },
  { t = "v", n = 4, indent = 1, p = true, text = "The words of a man’s mouth are deep waters; the fountain of wisdom is a bubbling brook." },
  { t = "v", n = 5, indent = 1, p = true, text = "Showing partiality[^a] to the wicked is not good, nor is depriving the innocent of justice." },
  { t = "v", n = 6, indent = 1, p = true, text = "A fool’s lips bring him strife, and his mouth invites a beating." },
  { t = "v", n = 7, indent = 1, p = true, text = "A fool’s mouth is his ruin, and his lips are a snare to his soul." },
  { t = "v", n = 8, indent = 1, p = true, text = "The words of a gossip are like choice morsels that go down into the inmost being." },
  { t = "v", n = 9, indent = 1, p = true, text = "Whoever is slothful in his work is brother to him who destroys." },
  { t = "v", n = 10, indent = 1, p = true, text = "The name of the LORD is a strong tower; the righteous run to it[^b] and are safe." },
  { t = "v", n = 11, indent = 1, p = true, text = "A rich man’s wealth is his fortified city; it is like a high wall in his imagination." },
  { t = "v", n = 12, indent = 1, p = true, text = "Before his downfall a man’s heart is proud, but humility comes before honor." },
  { t = "v", n = 13, indent = 1, p = true, text = "He who answers a matter before he hears it—this is folly and disgrace to him." },
  { t = "v", n = 14, indent = 1, p = true, text = "The spirit of a man can endure his sickness, but who can survive a broken spirit?" },
  { t = "v", n = 15, indent = 1, p = true, text = "The heart of the discerning acquires knowledge, and the ear of the wise seeks it out." },
  { t = "v", n = 16, indent = 1, p = true, text = "A man’s gift opens doors for him, and brings him before great men." },
  { t = "v", n = 17, indent = 1, p = true, text = "The first to state his case seems right until another comes and cross-examines him." },
  { t = "v", n = 18, indent = 1, p = true, text = "Casting the lot ends quarrels and separates strong opponents." },
  { t = "v", n = 19, indent = 1, p = true, text = "An offended brother is harder to win than a fortified city, and disputes are like the bars of a castle." },
  { t = "v", n = 20, indent = 1, p = true, text = "From the fruit of his mouth a man’s belly is filled; with the harvest from his lips he is satisfied." },
  { t = "v", n = 21, indent = 1, p = true, text = "Life and death are in the power of the tongue, and those who love it will eat its fruit." },
  { t = "v", n = 22, indent = 1, p = true, text = "He who finds a wife finds a good thing and obtains favor from the LORD." },
  { t = "v", n = 23, indent = 1, p = true, text = "The poor man pleads for mercy, but the rich man answers harshly." },
  { t = "v", n = 24, indent = 1, p = true, text = "A man of many companions may come to ruin, but there is a friend who stays closer than a brother." },
  { t = "note", id = "a", text = "Hebrew *Lifting the face*" },
  { t = "note", id = "b", text = "Or *to Him*" },
]

[[section]]
id = "19"
title = "Proverbs 19"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Man of Integrity" },
  { t = "v", n = 1, indent = 1, p = true, text = "Better a poor man who walks with integrity than a fool whose lips are perverse." },
  { t = "v", n = 2, indent = 1, p = true, text = "Even zeal is no good without knowledge, and he who hurries his footsteps misses the mark." },
  { t = "v", n = 3, indent = 1, p = true, text = "A man’s own folly subverts his way, yet his heart rages against the LORD." },
  { t = "v", n = 4, indent = 1, p = true, text = "Wealth attracts many friends, but a poor man is deserted by his friend." },
  { t = "v", n = 5, indent = 1, p = true, text = "A false witness will not go unpunished, and one who utters lies will not escape." },
  { t = "v", n = 6, indent = 1, p = true, text = "Many seek the favor of the prince, and everyone is a friend of the gift giver." },
  { t = "v", n = 7, indent = 1, p = true, text = "All the brothers of a poor man hate him—how much more do his friends avoid him! He may pursue them with pleading, but they are nowhere to be found." },
  { t = "v", n = 8, indent = 1, p = true, text = "He who acquires wisdom loves himself; one who safeguards understanding will find success." },
  { t = "v", n = 9, indent = 1, p = true, text = "A false witness will not go unpunished, and one who pours out lies will perish." },
  { t = "v", n = 10, indent = 1, p = true, text = "Luxury is unseemly for a fool—how much worse for a slave to rule over princes!" },
  { t = "v", n = 11, indent = 1, p = true, text = "A man’s insight gives him patience, and his virtue is to overlook an offense." },
  { t = "v", n = 12, indent = 1, p = true, text = "A king’s rage is like the roar of a lion, but his favor is like dew on the grass." },
  { t = "v", n = 13, indent = 1, p = true, text = "A foolish son is his father’s ruin, and a quarrelsome wife is like a constant dripping." },
  { t = "v", n = 14, indent = 1, p = true, text = "Houses and wealth are inherited from fathers, but a prudent wife is from the LORD." },
  { t = "v", n = 15, indent = 1, p = true, text = "Laziness brings on deep sleep, and an idle soul will suffer hunger." },
  { t = "v", n = 16, indent = 1, p = true, text = "He who keeps a commandment preserves his soul, but he who is careless in his ways will die." },
  { t = "v", n = 17, indent = 1, p = true, text = "Kindness to the poor is a loan to the LORD, and He will repay the lender." },
  { t = "v", n = 18, indent = 1, p = true, text = "Discipline your son, for in that there is hope; do not be party to his death." },
  { t = "v", n = 19, indent = 1, p = true, text = "A man of great anger must pay the penalty; if you rescue him, you will have to do so again." },
  { t = "v", n = 20, indent = 1, p = true, text = "Listen to counsel and accept discipline, that you may be wise the rest of your days." },
  { t = "v", n = 21, indent = 1, p = true, text = "Many plans are in a man’s heart, but the purpose of the LORD will prevail." },
  { t = "v", n = 22, indent = 1, p = true, text = "The desire of a man is loving devotion; better to be poor than a liar." },
  { t = "v", n = 23, indent = 1, p = true, text = "The fear of the LORD leads to life, that one may rest content, without visitation from harm." },
  { t = "v", n = 24, indent = 1, p = true, text = "The slacker buries his hand in the dish; he will not even bring it back to his mouth." },
  { t = "v", n = 25, indent = 1, p = true, text = "Strike a mocker, and the simple will beware; rebuke the discerning man, and he will gain knowledge." },
  { t = "v", n = 26, indent = 1, p = true, text = "He who assaults his father or evicts his mother is a son who brings shame and disgrace." },
  { t = "v", n = 27, indent = 1, p = true, text = "If you cease to hear instruction, my son, you will stray from the words of knowledge." },
  { t = "v", n = 28, indent = 1, p = true, text = "A corrupt witness mocks justice, and a wicked mouth swallows iniquity." },
  { t = "v", n = 29, indent = 1, p = true, text = "Judgments are prepared for mockers, and beatings for the backs of fools." },
]

[[section]]
id = "20"
title = "Proverbs 20"
level = 1
blocks = [
  { t = "h", level = 2, text = "Wine Is a Mocker" },
  { t = "v", n = 1, indent = 1, p = true, text = "Wine is a mocker, strong drink is a brawler, and whoever is led astray by them is not wise." },
  { t = "v", n = 2, indent = 1, p = true, text = "The terror of a king is like the roar of a lion; whoever provokes him forfeits his own life.[^a]" },
  { t = "v", n = 3, indent = 1, p = true, text = "It is honorable for a man to resolve a dispute, but any fool will quarrel." },
  { t = "v", n = 4, indent = 1, p = true, text = "The slacker does not plow in season; at harvest time he looks, but nothing is there." },
  { t = "v", n = 5, indent = 1, p = true, text = "The intentions of a man’s heart are deep waters, but a man of understanding draws them out." },
  { t = "v", n = 6, indent = 1, p = true, text = "Many a man proclaims his loving devotion, but who can find a trustworthy man?" },
  { t = "v", n = 7, indent = 1, p = true, text = "The righteous man walks with integrity; blessed are his children after him." },
  { t = "v", n = 8, indent = 1, p = true, text = "A king who sits on a throne to judge sifts out all evil with his eyes." },
  { t = "v", n = 9, indent = 1, p = true, text = "Who can say, “I have kept my heart pure; I am cleansed from my sin”?" },
  { t = "v", n = 10, indent = 1, p = true, text = "Differing weights and unequal measures[^b]—both are detestable to the LORD." },
  { t = "v", n = 11, indent = 1, p = true, text = "Even a young man is known by his actions—whether his conduct is pure and upright." },
  { t = "v", n = 12, indent = 1, p = true, text = "Ears that hear and eyes that see—the LORD has made them both." },
  { t = "v", n = 13, indent = 1, p = true, text = "Do not love sleep, or you will grow poor; open your eyes, and you will have plenty of food." },
  { t = "v", n = 14, indent = 1, p = true, text = "“Worthless, worthless!” says the buyer, but on the way out, he gloats." },
  { t = "v", n = 15, indent = 1, p = true, text = "There is an abundance of gold and rubies, but lips of knowledge are a rare treasure." },
  { t = "v", n = 16, indent = 1, p = true, text = "Take the garment of the one who posts security for a stranger; get collateral if it is for a foreigner.[^c]" },
  { t = "v", n = 17, indent = 1, p = true, text = "Food gained by fraud is sweet to a man, but later his mouth is full of gravel." },
  { t = "v", n = 18, indent = 1, p = true, text = "Set plans by consultation, and wage war under sound guidance." },
  { t = "v", n = 19, indent = 1, p = true, text = "He who reveals secrets is a constant gossip; avoid the one who babbles[^d] with his lips." },
  { t = "v", n = 20, indent = 1, p = true, text = "Whoever curses his father or mother, his lamp will be extinguished in deepest darkness." },
  { t = "v", n = 21, indent = 1, p = true, text = "An inheritance gained quickly will not be blessed in the end." },
  { t = "v", n = 22, indent = 1, p = true, text = "Do not say, “I will avenge this evil!” Wait on the LORD, and He will save you." },
  { t = "v", n = 23, indent = 1, p = true, text = "Unequal weights are detestable to the LORD, and dishonest scales are no good." },
  { t = "v", n = 24, indent = 1, p = true, text = "A man’s steps are from the LORD, so how can anyone understand his own way?" },
  { t = "v", n = 25, indent = 1, p = true, text = "It is a trap for a man to dedicate something rashly, only later to reconsider his vows." },
  { t = "v", n = 26, indent = 1, p = true, text = "A wise king separates out the wicked and drives the threshing wheel over them." },
  { t = "v", n = 27, indent = 1, p = true, text = "The spirit[^e] of a man is the lamp of the LORD, searching out his inmost being." },
  { t = "v", n = 28, indent = 1, p = true, text = "Loving devotion and faithfulness preserve a king; by these he maintains his throne." },
  { t = "v", n = 29, indent = 1, p = true, text = "The glory of young men is their strength, and gray hair is the splendor of the old." },
  { t = "v", n = 30, indent = 1, p = true, text = "Lashes and wounds scour evil, and beatings cleanse the inmost parts." },
  { t = "note", id = "a", text = "Literally *sins against his own soul*" },
  { t = "note", id = "b", text = "Hebrew *A stone and a stone, an ephah and an ephah*" },
  { t = "note", id = "c", text = "Or *a wayward woman*" },
  { t = "note", id = "d", text = "Or *the one who is simple*" },
  { t = "note", id = "e", text = "Or *breath* or *speech*" },
]

[[section]]
id = "21"
title = "Proverbs 21"
level = 1
blocks = [
  { t = "h", level = 2, text = "The King’s Heart" },
  { t = "ref", text = "(Psalm 21:1–13)" },
  { t = "v", n = 1, indent = 1, p = true, text = "The king’s heart is a waterway in the hand of the LORD; He directs it where He pleases." },
  { t = "v", n = 2, indent = 1, p = true, text = "All a man’s ways seem right to him, but the LORD weighs the heart." },
  { t = "v", n = 3, indent = 1, p = true, text = "To do righteousness and justice is more desirable to the LORD than sacrifice." },
  { t = "v", n = 4, indent = 1, p = true, text = "Haughty eyes and a proud heart—the guides of the wicked—are sin." },
  { t = "v", n = 5, indent = 1, p = true, text = "The plans of the diligent bring plenty, as surely as haste leads to poverty." },
  { t = "v", n = 6, indent = 1, p = true, text = "Making a fortune by a lying tongue is a vanishing mist, a deadly pursuit." },
  { t = "v", n = 7, indent = 1, p = true, text = "The violence of the wicked will sweep them away because they refuse to do what is just." },
  { t = "v", n = 8, indent = 1, p = true, text = "The way of a guilty man is crooked, but the conduct of the innocent is upright." },
  { t = "v", n = 9, indent = 1, p = true, text = "Better to live on a corner of the roof than to share a house with a quarrelsome wife." },
  { t = "v", n = 10, indent = 1, p = true, text = "The soul of the wicked man craves evil; his neighbor finds no favor in his eyes." },
  { t = "v", n = 11, indent = 1, p = true, text = "When a mocker is punished, the simple gain wisdom; and when a wise man is instructed, he acquires knowledge." },
  { t = "v", n = 12, indent = 1, p = true, text = "The Righteous One[^a] considers the house of the wicked and brings the wicked to ruin." },
  { t = "v", n = 13, indent = 1, p = true, text = "Whoever shuts his ears to the cry of the poor, he too shall cry out and receive no answer." },
  { t = "v", n = 14, indent = 1, p = true, text = "A gift in secret soothes anger, and a covert bribe[^b] pacifies great wrath." },
  { t = "v", n = 15, indent = 1, p = true, text = "Justice executed is a joy to the righteous, but a terror to the workers of iniquity." },
  { t = "v", n = 16, indent = 1, p = true, text = "The man who strays from the path of understanding will rest in the assembly of the dead." },
  { t = "v", n = 17, indent = 1, p = true, text = "He who loves pleasure will become poor; the one who loves wine and oil will never be rich." },
  { t = "v", n = 18, indent = 1, p = true, text = "The wicked become a ransom for the righteous, and the faithless for the upright." },
  { t = "v", n = 19, indent = 1, p = true, text = "Better to live in the desert than with a contentious and ill-tempered wife." },
  { t = "v", n = 20, indent = 1, p = true, text = "Precious treasures and oil are in the dwelling of the wise, but a foolish man consumes them." },
  { t = "v", n = 21, indent = 1, p = true, text = "He who pursues righteousness and loving devotion finds life, righteousness, and honor." },
  { t = "v", n = 22, indent = 1, p = true, text = "A wise man scales the city of the mighty and pulls down the stronghold in which they trust." },
  { t = "v", n = 23, indent = 1, p = true, text = "He who guards his mouth and tongue keeps his soul from distress." },
  { t = "v", n = 24, indent = 1, p = true, text = "Mocker is the name of the proud and arrogant man—of him who acts with excessive pride." },
  { t = "v", n = 25, indent = 1, p = true, text = "The craving of the slacker kills him because his hands refuse to work." },
  { t = "v", n = 26, indent = 1, text = "All day long he covets more, but the righteous give without restraint." },
  { t = "v", n = 27, indent = 1, p = true, text = "The sacrifice of the wicked is detestable—how much more so when brought with ill intent!" },
  { t = "v", n = 28, indent = 1, p = true, text = "A lying witness will perish, but the man who listens to truth will speak forever." },
  { t = "v", n = 29, indent = 1, p = true, text = "A wicked man hardens his face,[^c] but the upright man makes his way sure." },
  { t = "v", n = 30, indent = 1, p = true, text = "There is no wisdom, no understanding, no counsel that can prevail against the LORD." },
  { t = "v", n = 31, indent = 1, p = true, text = "A horse is prepared for the day of battle, but victory is of the LORD." },
  { t = "note", id = "a", text = "Or *The righteous one*" },
  { t = "note", id = "b", text = "Hebrew *a bribe in the bosom*" },
  { t = "note", id = "c", text = "Or *puts up a bold front*" },
]

[[section]]
id = "22"
title = "Proverbs 22"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Good Name" },
  { t = "v", n = 1, indent = 1, p = true, text = "A good name is more desirable than great riches; favor is better than silver and gold." },
  { t = "v", n = 2, indent = 1, p = true, text = "The rich and the poor have this in common: The LORD is Maker of them all." },
  { t = "v", n = 3, indent = 1, p = true, text = "The prudent see danger and take cover, but the simple keep going and suffer the consequences." },
  { t = "v", n = 4, indent = 1, p = true, text = "The rewards of humility and the fear of the LORD are wealth and honor and life." },
  { t = "v", n = 5, indent = 1, p = true, text = "Thorns and snares lie on the path of the perverse; he who guards his soul stays far from them." },
  { t = "v", n = 6, indent = 1, p = true, text = "Train up a child in the way he should go, and when he is old he will not depart from it." },
  { t = "v", n = 7, indent = 1, p = true, text = "The rich rule over the poor, and the borrower is slave to the lender." },
  { t = "v", n = 8, indent = 1, p = true, text = "He who sows injustice will reap disaster, and the rod of his fury will be destroyed.[^a]" },
  { t = "v", n = 9, indent = 1, p = true, text = "A generous man[^b] will be blessed, for he shares his bread with the poor." },
  { t = "v", n = 10, indent = 1, p = true, text = "Drive out the mocker, and conflict will depart; even quarreling and insults will cease." },
  { t = "v", n = 11, indent = 1, p = true, text = "He who loves a pure heart and gracious lips will have the king for a friend." },
  { t = "v", n = 12, indent = 1, p = true, text = "The LORD’s eyes keep watch over knowledge, but He frustrates the words of the faithless." },
  { t = "v", n = 13, indent = 1, p = true, text = "The slacker says, “There is a lion outside! I will be slain in the streets!”" },
  { t = "v", n = 14, indent = 1, p = true, text = "The mouth of an adulteress is a deep pit; he who is under the wrath of the LORD will fall into it." },
  { t = "v", n = 15, indent = 1, p = true, text = "Foolishness is bound up in the heart of a child, but the rod of discipline drives it far from him." },
  { t = "v", n = 16, indent = 1, p = true, text = "Oppressing the poor to enrich oneself or giving gifts to the rich will surely lead to poverty." },
  { t = "h", level = 2, text = "Thirty Sayings of the Wise" },
  { t = "h", level = 3, text = "Saying 1" },
  { t = "v", n = 17, indent = 1, p = true, text = "Incline your ear and hear the words of the wise—apply your mind to my knowledge—" },
  { t = "v", n = 18, indent = 1, text = "for it is pleasing when you keep them within you and they are constantly on your lips." },
  { t = "v", n = 19, indent = 1, text = "So that your trust may be in the LORD, I instruct you today—yes, you." },
  { t = "v", n = 20, indent = 1, text = "Have I not written for you thirty sayings[^c] about counsel and knowledge," },
  { t = "v", n = 21, indent = 1, text = "to show you true and reliable words, that you may soundly answer those who sent you?" },
  { t = "h", level = 3, text = "Saying 2" },
  { t = "v", n = 22, indent = 1, p = true, text = "Do not rob a poor man because he is poor, and do not crush the afflicted at the gate," },
  { t = "v", n = 23, indent = 1, text = "for the LORD will take up their case and will plunder those who rob them." },
  { t = "h", level = 3, text = "Saying 3" },
  { t = "v", n = 24, indent = 1, p = true, text = "Do not make friends with an angry man, and do not associate with a hot-tempered man," },
  { t = "v", n = 25, indent = 1, text = "or you may learn his ways and entangle yourself in a snare." },
  { t = "h", level = 3, text = "Saying 4" },
  { t = "v", n = 26, indent = 1, p = true, text = "Do not be one who gives pledges, who puts up security for debts." },
  { t = "v", n = 27, indent = 1, text = "If you have nothing with which to pay, why should your bed be taken from under you?" },
  { t = "h", level = 3, text = "Saying 5" },
  { t = "v", n = 28, indent = 1, p = true, text = "Do not move an ancient boundary stone which your fathers have placed." },
  { t = "h", level = 3, text = "Saying 6" },
  { t = "v", n = 29, indent = 1, p = true, text = "Do you see a man skilled in his work? He will be stationed in the presence of kings; he will not stand before obscure men." },
  { t = "note", id = "a", text = "LXX includes *God blesses a cheerful and generous man, but foolish works will come to an end*; see also 2 Corinthians 9:7." },
  { t = "note", id = "b", text = "Literally *He whose eye is good*" },
  { t = "note", id = "c", text = "Or *written for you excellent sayings* or *written for you three times*" },
]

[[section]]
id = "23"
title = "Proverbs 23"
level = 1
blocks = [
  { t = "h", level = 2, text = "True Riches" },
  { t = "ref", text = "(1 Timothy 6:17–19; James 5:1–6)" },
  { t = "h", level = 3, text = "Saying 7" },
  { t = "v", n = 1, indent = 1, p = true, text = "When you sit down to dine with a ruler, consider carefully what is set before you,[^a]" },
  { t = "v", n = 2, indent = 1, text = "and put a knife to your throat if you possess a great appetite." },
  { t = "v", n = 3, indent = 1, text = "Do not crave his delicacies, for that food is deceptive." },
  { t = "h", level = 3, text = "Saying 8" },
  { t = "v", n = 4, indent = 1, p = true, text = "Do not wear yourself out to get rich; be wise enough to restrain yourself." },
  { t = "v", n = 5, indent = 1, text = "When you glance at wealth, it disappears, for it makes wings for itself and flies like an eagle to the sky." },
  { t = "h", level = 3, text = "Saying 9" },
  { t = "v", n = 6, indent = 1, p = true, text = "Do not eat the bread of a stingy man,[^b] and do not crave his delicacies;" },
  { t = "v", n = 7, indent = 1, text = "for he is keeping track, inwardly counting the cost.[^c] “Eat and drink,” he says to you, but his heart is not with you." },
  { t = "v", n = 8, indent = 1, text = "You will vomit up what little you have eaten and waste your pleasant words." },
  { t = "h", level = 3, text = "Saying 10" },
  { t = "v", n = 9, indent = 1, p = true, text = "Do not speak to a fool, for he will despise the wisdom of your words." },
  { t = "h", level = 3, text = "Saying 11" },
  { t = "v", n = 10, indent = 1, p = true, text = "Do not move an ancient boundary stone or encroach on the fields of the fatherless," },
  { t = "v", n = 11, indent = 1, text = "for their Redeemer is strong; He will take up their case against you." },
  { t = "h", level = 3, text = "Saying 12" },
  { t = "v", n = 12, indent = 1, p = true, text = "Apply your heart to instruction and your ears to words of knowledge." },
  { t = "h", level = 3, text = "Saying 13" },
  { t = "v", n = 13, indent = 1, p = true, text = "Do not withhold discipline from a child; although you strike him with a rod, he will not die." },
  { t = "v", n = 14, indent = 1, text = "Strike him with a rod, and you will deliver his soul from Sheol." },
  { t = "h", level = 3, text = "Saying 14" },
  { t = "v", n = 15, indent = 1, p = true, text = "My son, if your heart is wise, my own heart will indeed rejoice." },
  { t = "v", n = 16, indent = 1, text = "My inmost being[^d] will rejoice when your lips speak what is right." },
  { t = "h", level = 3, text = "Saying 15" },
  { t = "v", n = 17, indent = 1, p = true, text = "Do not let your heart envy sinners, but always continue in the fear of the LORD." },
  { t = "v", n = 18, indent = 1, text = "For surely there is a future, and your hope will not be cut off." },
  { t = "h", level = 3, text = "Saying 16" },
  { t = "v", n = 19, indent = 1, p = true, text = "Listen, my son, and be wise, and guide your heart on the right course." },
  { t = "v", n = 20, indent = 1, text = "Do not join those who drink too much wine or gorge themselves on meat." },
  { t = "v", n = 21, indent = 1, text = "For the drunkard and the glutton will come to poverty, and drowsiness will clothe them in rags." },
  { t = "h", level = 3, text = "Saying 17" },
  { t = "v", n = 22, indent = 1, p = true, text = "Listen to your father who gave you life, and do not despise your mother when she is old." },
  { t = "v", n = 23, indent = 1, text = "Invest in truth and never sell it—in wisdom and instruction and understanding." },
  { t = "v", n = 24, indent = 1, text = "The father of a righteous man will greatly rejoice, and he who fathers a wise son will delight in him." },
  { t = "v", n = 25, indent = 1, text = "May your father and mother be glad, and may she who gave you birth rejoice!" },
  { t = "h", level = 3, text = "Saying 18" },
  { t = "v", n = 26, indent = 1, p = true, text = "My son, give me your heart, and let your eyes delight in my ways." },
  { t = "v", n = 27, indent = 1, text = "For a prostitute is a deep pit, and an adulteress[^e] is a narrow well." },
  { t = "v", n = 28, indent = 1, text = "Like a robber she lies in wait and multiplies the faithless among men." },
  { t = "h", level = 3, text = "Saying 19" },
  { t = "v", n = 29, indent = 1, p = true, text = "Who has woe? Who has sorrow? Who has contentions? Who has complaints? Who has needless wounds? Who has bloodshot eyes?" },
  { t = "v", n = 30, indent = 1, text = "Those who linger over wine, who go to taste mixed drinks." },
  { t = "v", n = 31, indent = 1, text = "Do not gaze at wine while it is red, when it sparkles in the cup and goes down smoothly." },
  { t = "v", n = 32, indent = 1, text = "In the end it bites like a snake and stings like a viper." },
  { t = "v", n = 33, indent = 1, text = "Your eyes will see strange things, and your mind will utter perversities." },
  { t = "v", n = 34, indent = 1, text = "You will be like one sleeping on the high seas or lying on the top of a mast:" },
  { t = "v", n = 35, indent = 1, text = "“They struck me, but I feel no pain! They beat me, but I did not know it! When can I wake up to search for another drink?”" },
  { t = "note", id = "a", text = "Or *who is before you*" },
  { t = "note", id = "b", text = "Literally *of him whose eye is evil*" },
  { t = "note", id = "c", text = "Or *for as he calculates in his soul, so is he*" },
  { t = "note", id = "d", text = "Hebrew *My kidneys*" },
  { t = "note", id = "e", text = "Or *a foreign woman* or *a wayward wife*" },
]

[[section]]
id = "24"
title = "Proverbs 24"
level = 1
blocks = [
  { t = "h", level = 2, text = "Do Not Envy" },
  { t = "h", level = 3, text = "Saying 20" },
  { t = "v", n = 1, indent = 1, p = true, text = "Do not envy wicked men or desire their company;" },
  { t = "v", n = 2, indent = 1, text = "for their hearts devise violence, and their lips declare trouble." },
  { t = "h", level = 3, text = "Saying 21" },
  { t = "v", n = 3, indent = 1, p = true, text = "By wisdom a house is built and by understanding it is established;" },
  { t = "v", n = 4, indent = 1, text = "through knowledge its rooms are filled with every precious and beautiful treasure." },
  { t = "h", level = 3, text = "Saying 22" },
  { t = "v", n = 5, indent = 1, p = true, text = "A wise man is strong,[^a] and a man of knowledge enhances his strength." },
  { t = "v", n = 6, indent = 1, text = "Only with sound guidance should you wage war, and victory lies in a multitude of counselors." },
  { t = "h", level = 3, text = "Saying 23" },
  { t = "v", n = 7, indent = 1, p = true, text = "Wisdom is too high for a fool; he does not open his mouth in the meeting place." },
  { t = "h", level = 3, text = "Saying 24" },
  { t = "v", n = 8, indent = 1, p = true, text = "He who plots evil will be called a schemer." },
  { t = "v", n = 9, indent = 1, text = "A foolish scheme is sin, and a mocker is detestable to men." },
  { t = "h", level = 3, text = "Saying 25" },
  { t = "v", n = 10, indent = 1, p = true, text = "If you faint in the day of distress, how small is your strength!" },
  { t = "v", n = 11, indent = 1, text = "Rescue those being led away to death, and restrain those stumbling toward the slaughter." },
  { t = "v", n = 12, indent = 1, text = "If you say, “Behold, we did not know about this,” does not He who weighs hearts consider it? Does not the One who guards your life know? Will He not repay a man according to his deeds?" },
  { t = "h", level = 3, text = "Saying 26" },
  { t = "v", n = 13, indent = 1, p = true, text = "Eat honey, my son, for it is good, and the honeycomb is sweet to your taste." },
  { t = "v", n = 14, indent = 1, text = "Know therefore that wisdom is sweet to your soul. If you find it, there is a future for you, and your hope will never be cut off." },
  { t = "h", level = 3, text = "Saying 27" },
  { t = "v", n = 15, indent = 1, p = true, text = "Do not lie in wait, O wicked man, near the dwelling of the righteous; do not destroy his resting place." },
  { t = "v", n = 16, indent = 1, text = "For though a righteous man may fall seven times, he still gets up; but the wicked stumble in bad times." },
  { t = "h", level = 3, text = "Saying 28" },
  { t = "v", n = 17, indent = 1, p = true, text = "Do not gloat when your enemy falls, and do not let your heart rejoice when he stumbles," },
  { t = "v", n = 18, indent = 1, text = "or the LORD will see and disapprove, and turn His wrath away from him." },
  { t = "h", level = 3, text = "Saying 29" },
  { t = "v", n = 19, indent = 1, p = true, text = "Do not fret over evildoers, and do not be envious of the wicked." },
  { t = "v", n = 20, indent = 1, text = "For the evil man has no future; the lamp of the wicked will be extinguished." },
  { t = "h", level = 3, text = "Saying 30" },
  { t = "v", n = 21, indent = 1, p = true, text = "My son, fear the LORD and the king, and do not associate with the rebellious." },
  { t = "v", n = 22, indent = 1, text = "For they will bring sudden destruction. Who knows what ruin they can bring?" },
  { t = "h", level = 2, text = "Further Sayings of the Wise" },
  { t = "v", n = 23, p = true, text = "These also are sayings of the wise: To show partiality in judgment is not good." },
  { t = "v", n = 24, indent = 1, text = "Whoever tells the guilty, “You are innocent”—peoples will curse him, and nations will denounce him;" },
  { t = "v", n = 25, indent = 1, text = "but it will go well with those who convict the guilty, and rich blessing will come upon them." },
  { t = "v", n = 26, indent = 1, p = true, text = "An honest answer given is like a kiss on the lips." },
  { t = "v", n = 27, indent = 1, p = true, text = "Complete your outdoor work and prepare your field; after that, you may build your house." },
  { t = "v", n = 28, indent = 1, p = true, text = "Do not testify against your neighbor without cause, and do not deceive with your lips." },
  { t = "v", n = 29, indent = 1, text = "Do not say, “I will do to him as he has done to me; I will repay the man according to his work.”" },
  { t = "v", n = 30, indent = 1, p = true, text = "I went past the field of a slacker and by the vineyard of a man lacking judgment." },
  { t = "v", n = 31, indent = 1, text = "Thorns had grown up everywhere, thistles had covered the ground, and the stone wall was broken down." },
  { t = "v", n = 32, indent = 1, text = "I observed and took it to heart; I looked and received instruction:" },
  { t = "v", n = 33, indent = 1, text = "A little sleep, a little slumber, a little folding of the hands to rest," },
  { t = "v", n = 34, indent = 1, text = "and poverty will come upon you like a robber, and need like a bandit." },
  { t = "note", id = "a", text = "LXX *The wise are mightier than the strong*" },
]

[[section]]
id = "25"
title = "Proverbs 25"
level = 1
blocks = [
  { t = "h", level = 2, text = "More Proverbs of Solomon" },
  { t = "v", n = 1, p = true, text = "These are additional proverbs of Solomon, which were copied by the men of Hezekiah king of Judah:" },
  { t = "v", n = 2, indent = 1, p = true, text = "It is the glory of God to conceal a matter and the glory of kings to search it out." },
  { t = "v", n = 3, indent = 1, text = "As the heavens are high and the earth is deep, so the hearts of kings cannot be searched." },
  { t = "v", n = 4, indent = 1, p = true, text = "Remove the dross from the silver, and a vessel for a silversmith will come forth." },
  { t = "v", n = 5, indent = 1, text = "Remove the wicked from the king’s presence, and his throne will be established in righteousness." },
  { t = "v", n = 6, indent = 1, p = true, text = "Do not exalt yourself in the presence of the king, and do not stand in the place of great men;" },
  { t = "v", n = 7, indent = 1, text = "for it is better to be told, “Come up here!” than to be demoted in the presence of the prince. Even what[^a] you have seen with your own eyes," },
  { t = "v", n = 8, indent = 2, text = "do not bring hastily to court. Otherwise, what will you do in the end when your neighbor puts you to shame?" },
  { t = "v", n = 9, indent = 1, p = true, text = "Argue your case with your neighbor without betraying another’s confidence," },
  { t = "v", n = 10, indent = 1, text = "lest he who hears you bring shame upon you, and your infamy never go away." },
  { t = "v", n = 11, indent = 1, p = true, text = "A word fitly spoken is like apples of gold in settings of silver." },
  { t = "v", n = 12, indent = 1, text = "Like an earring of gold or an ornament of fine gold is a wise man’s rebuke to a listening ear." },
  { t = "v", n = 13, indent = 1, p = true, text = "Like the cold of snow in the time of harvest is a trustworthy messenger to those who send him; he refreshes the soul of his masters." },
  { t = "v", n = 14, indent = 1, p = true, text = "Like clouds and wind without rain is the man who boasts of gifts never given." },
  { t = "v", n = 15, indent = 1, p = true, text = "Through patience a ruler can be persuaded, and a gentle tongue can break a bone." },
  { t = "v", n = 16, indent = 1, p = true, text = "If you find honey, eat just what you need, lest you have too much and vomit it up." },
  { t = "v", n = 17, indent = 1, p = true, text = "Seldom set foot in your neighbor’s house, lest he grow weary and hate you." },
  { t = "v", n = 18, indent = 1, p = true, text = "Like a club or sword or sharp arrow is a man who bears false witness against his neighbor." },
  { t = "v", n = 19, indent = 1, p = true, text = "Like a broken tooth or a foot out of joint is confidence in a faithless man in time of trouble." },
  { t = "v", n = 20, indent = 1, p = true, text = "Like one who removes a garment on a cold day or vinegar poured on a wound[^b] is one who sings songs to a heavy heart." },
  { t = "v", n = 21, indent = 1, p = true, text = "If your enemy is hungry, give him food to eat, and if he is thirsty, give him water to drink." },
  { t = "v", n = 22, indent = 1, text = "For in so doing, you will heap burning coals on his head,[^c] and the LORD will reward you." },
  { t = "v", n = 23, indent = 1, p = true, text = "As the north wind brings forth rain, so a backbiting tongue brings angry looks." },
  { t = "v", n = 24, indent = 1, p = true, text = "Better to live on a corner of the roof than to share a house with a quarrelsome wife." },
  { t = "v", n = 25, indent = 1, p = true, text = "Like cold water to a weary soul is good news from a distant land." },
  { t = "v", n = 26, indent = 1, p = true, text = "Like a muddied spring or a polluted well is a righteous man who gives way to the wicked." },
  { t = "v", n = 27, indent = 1, p = true, text = "It is not good to eat too much honey or to search out one’s own glory." },
  { t = "v", n = 28, indent = 1, p = true, text = "Like a city whose walls are broken down is a man who does not control his temper." },
  { t = "note", id = "a", text = "Or *Even the one*" },
  { t = "note", id = "b", text = "Or *on soda*" },
  { t = "note", id = "c", text = "LXX; Hebrew *For you will heap burning coals on his head*; cited in Romans 12:20" },
]

[[section]]
id = "26"
title = "Proverbs 26"
level = 1
blocks = [
  { t = "h", level = 2, text = "Similitudes and Instructions" },
  { t = "v", n = 1, indent = 1, p = true, text = "Like snow in summer and rain at harvest, honor does not befit a fool." },
  { t = "v", n = 2, indent = 1, text = "Like a fluttering sparrow or darting swallow, an undeserved curse does not come to rest." },
  { t = "v", n = 3, indent = 1, text = "A whip for the horse, a bridle for the donkey, and a rod for the backs of fools!" },
  { t = "v", n = 4, indent = 1, text = "Do not answer a fool according to his folly, or you yourself will be like him." },
  { t = "v", n = 5, indent = 1, text = "Answer a fool according to his folly, lest he become wise in his own eyes." },
  { t = "v", n = 6, indent = 1, text = "Like cutting off one’s own feet or drinking violence is the sending of a message by the hand of a fool." },
  { t = "v", n = 7, indent = 1, text = "Like lame legs hanging limp is a proverb in the mouth of a fool." },
  { t = "v", n = 8, indent = 1, text = "Like binding a stone into a sling is the giving of honor to a fool." },
  { t = "v", n = 9, indent = 1, text = "Like a thorn that goes into the hand of a drunkard is a proverb in the mouth of a fool." },
  { t = "v", n = 10, indent = 1, text = "Like an archer who wounds at random is he who hires a fool or passerby." },
  { t = "v", n = 11, indent = 1, text = "As a dog returns to its vomit,[^a] so a fool repeats his folly." },
  { t = "v", n = 12, indent = 1, text = "Do you see a man who is wise in his own eyes? There is more hope for a fool than for him." },
  { t = "v", n = 13, indent = 1, p = true, text = "The slacker says, “A lion is in the road! A fierce lion roams the public square!”" },
  { t = "v", n = 14, indent = 1, text = "As a door turns on its hinges, so the slacker turns on his bed." },
  { t = "v", n = 15, indent = 1, text = "The slacker buries his hand in the dish; it wearies him to bring it back to his mouth." },
  { t = "v", n = 16, indent = 1, text = "The slacker is wiser in his own eyes than seven men who answer discreetly." },
  { t = "v", n = 17, indent = 1, p = true, text = "Like one who grabs a dog by the ears is a passerby who meddles in a quarrel not his own." },
  { t = "v", n = 18, indent = 1, text = "Like a madman shooting firebrands and deadly arrows," },
  { t = "v", n = 19, indent = 1, text = "so is the man who deceives his neighbor and says, “I was only joking!”" },
  { t = "v", n = 20, indent = 1, p = true, text = "Without wood, a fire goes out; without gossip, a conflict ceases." },
  { t = "v", n = 21, indent = 1, text = "Like charcoal for embers and wood for fire, so is a quarrelsome man for kindling strife." },
  { t = "v", n = 22, indent = 1, text = "The words of a gossip are like choice morsels that go down into the inmost being." },
  { t = "v", n = 23, indent = 1, p = true, text = "Like glaze covering an earthen vessel are burning[^b] lips and a wicked heart." },
  { t = "v", n = 24, indent = 1, text = "A hateful man disguises himself with his speech, but he lays up deceit in his heart." },
  { t = "v", n = 25, indent = 1, text = "When he speaks graciously, do not believe him, for seven abominations fill his heart." },
  { t = "v", n = 26, indent = 1, text = "Though his hatred is concealed by deception, his wickedness will be exposed in the assembly." },
  { t = "v", n = 27, indent = 1, text = "He who digs a pit will fall into it, and he who rolls a stone will have it roll back on him." },
  { t = "v", n = 28, indent = 1, text = "A lying tongue hates those it crushes, and a flattering mouth causes ruin." },
  { t = "note", id = "a", text = "Cited in 2 Peter 2:22" },
  { t = "note", id = "b", text = "Hebrew; LXX *smooth*" },
]

[[section]]
id = "27"
title = "Proverbs 27"
level = 1
blocks = [
  { t = "h", level = 2, text = "Do Not Boast about Tomorrow" },
  { t = "ref", text = "(James 4:13–17)" },
  { t = "v", n = 1, indent = 1, p = true, text = "Do not boast about tomorrow, for you do not know what a day may bring." },
  { t = "v", n = 2, indent = 1, p = true, text = "Let another praise you, and not your own mouth—a stranger, and not your own lips." },
  { t = "v", n = 3, indent = 1, p = true, text = "A stone is heavy and sand is a burden, but aggravation from a fool outweighs them both." },
  { t = "v", n = 4, indent = 1, p = true, text = "Wrath is cruel and anger is like a flood, but who can withstand jealousy?" },
  { t = "v", n = 5, indent = 1, p = true, text = "Better an open rebuke than love that is concealed." },
  { t = "v", n = 6, indent = 1, p = true, text = "The wounds of a friend are faithful, but the kisses of an enemy are deceitful." },
  { t = "v", n = 7, indent = 1, p = true, text = "The soul that is full loathes honey, but to a hungry soul, any bitter thing is sweet." },
  { t = "v", n = 8, indent = 1, p = true, text = "Like a bird that strays from its nest is a man who wanders from his home." },
  { t = "v", n = 9, indent = 1, p = true, text = "Oil and incense bring joy to the heart, and the counsel of a friend is sweetness to the soul." },
  { t = "v", n = 10, indent = 1, p = true, text = "Do not forsake your friend or your father’s friend, and do not go to your brother’s house in the day of your calamity; better a neighbor nearby than a brother far away." },
  { t = "v", n = 11, indent = 1, p = true, text = "Be wise, my son, and bring joy to my heart, so that I can answer him who taunts me." },
  { t = "v", n = 12, indent = 1, p = true, text = "The prudent see danger and take cover, but the simple keep going and pay the penalty." },
  { t = "v", n = 13, indent = 1, p = true, text = "Take the garment of him who posts security for a stranger; get collateral if it is for a foreigner.[^a]" },
  { t = "v", n = 14, indent = 1, p = true, text = "If one blesses his neighbor with a loud voice early in the morning, it will be counted to him as a curse." },
  { t = "v", n = 15, indent = 1, p = true, text = "A constant dripping on a rainy day and a contentious woman are alike—" },
  { t = "v", n = 16, indent = 1, text = "restraining her is like holding back the wind or grasping oil with one’s right hand." },
  { t = "v", n = 17, indent = 1, p = true, text = "As iron sharpens iron, so one man sharpens another.[^b]" },
  { t = "v", n = 18, indent = 1, p = true, text = "Whoever tends a fig tree will eat its fruit, and he who looks after his master will be honored." },
  { t = "v", n = 19, indent = 1, p = true, text = "As water reflects the face, so the heart reflects the true man." },
  { t = "v", n = 20, indent = 1, p = true, text = "Sheol and Abaddon[^c] are never satisfied; so the eyes of man are never satisfied." },
  { t = "v", n = 21, indent = 1, p = true, text = "A crucible for silver and a furnace for gold, but a man is tested by the praise accorded him." },
  { t = "v", n = 22, indent = 1, p = true, text = "Though you grind a fool like grain with mortar and a pestle, yet his folly will not depart from him." },
  { t = "v", n = 23, indent = 1, p = true, text = "Be sure to know the state of your flocks, and pay close attention to your herds;" },
  { t = "v", n = 24, indent = 1, text = "for riches are not forever, nor does a crown endure to every generation." },
  { t = "v", n = 25, indent = 1, text = "When hay is removed and new growth appears and the grass from the hills is gathered," },
  { t = "v", n = 26, indent = 1, text = "the lambs will provide you with clothing, and the goats with the price of a field." },
  { t = "v", n = 27, indent = 1, text = "You will have plenty of goats’ milk to feed you—food for your household and nourishment for your maidservants." },
  { t = "note", id = "a", text = "Or *a wayward woman*" },
  { t = "note", id = "b", text = "Hebrew *sharpens the face of another* or *sharpens the countenance of a friend*" },
  { t = "note", id = "c", text = "Or *Death and Destruction*" },
]

[[section]]
id = "28"
title = "Proverbs 28"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Boldness of the Righteous" },
  { t = "v", n = 1, indent = 1, p = true, text = "The wicked flee when no one pursues, but the righteous are as bold as a lion." },
  { t = "v", n = 2, indent = 1, p = true, text = "A land in rebellion has many rulers, but a man of understanding and knowledge maintains order." },
  { t = "v", n = 3, indent = 1, p = true, text = "A destitute leader who oppresses the poor is like a driving rain that leaves no food." },
  { t = "v", n = 4, indent = 1, p = true, text = "Those who forsake the law praise the wicked, but those who keep the law resist them." },
  { t = "v", n = 5, indent = 1, p = true, text = "Evil men do not understand justice, but those who seek the LORD comprehend fully." },
  { t = "v", n = 6, indent = 1, p = true, text = "Better a poor man who walks with integrity than a rich man whose ways are perverse." },
  { t = "v", n = 7, indent = 1, p = true, text = "A discerning son keeps the law, but a companion of gluttons disgraces his father." },
  { t = "v", n = 8, indent = 1, p = true, text = "He who increases his wealth by interest and usury lays it up for one who is kind to the poor." },
  { t = "v", n = 9, indent = 1, p = true, text = "Whoever turns his ear away from hearing the law, even his prayer is detestable." },
  { t = "v", n = 10, indent = 1, p = true, text = "He who leads the upright along the path of evil will fall into his own pit, but the blameless will inherit what is good." },
  { t = "v", n = 11, indent = 1, p = true, text = "A rich man is wise in his own eyes, but a poor man with discernment sees through him." },
  { t = "v", n = 12, indent = 1, p = true, text = "When the righteous triumph, there is great glory, but when the wicked rise, men hide themselves." },
  { t = "v", n = 13, indent = 1, p = true, text = "He who conceals his sins will not prosper, but whoever confesses and renounces them will find mercy." },
  { t = "v", n = 14, indent = 1, p = true, text = "Blessed is the man who is always reverent,[^a] but he who hardens his heart falls into trouble." },
  { t = "v", n = 15, indent = 1, p = true, text = "Like a roaring lion or a charging bear is a wicked ruler over a helpless people." },
  { t = "v", n = 16, indent = 1, p = true, text = "A leader who lacks judgment is also a great oppressor, but he who hates dishonest profit will prolong his days." },
  { t = "v", n = 17, indent = 1, p = true, text = "A man burdened by bloodguilt will flee into the Pit;[^b] let no one support him." },
  { t = "v", n = 18, indent = 1, p = true, text = "He who walks with integrity will be kept safe, but whoever is perverse in his ways will suddenly fall." },
  { t = "v", n = 19, indent = 1, p = true, text = "The one who works his land will have plenty of food, but whoever chases fantasies will have his fill of poverty." },
  { t = "v", n = 20, indent = 1, p = true, text = "A faithful man will abound with blessings, but one eager to be rich will not go unpunished." },
  { t = "v", n = 21, indent = 1, p = true, text = "To show partiality is not good, yet a man will do wrong for a piece of bread." },
  { t = "v", n = 22, indent = 1, p = true, text = "A stingy man[^c] hastens after wealth and does not know that poverty awaits him." },
  { t = "v", n = 23, indent = 1, p = true, text = "He who rebukes a man will later find more favor than one who flatters with his tongue." },
  { t = "v", n = 24, indent = 1, p = true, text = "He who robs his father or mother, saying, “It is not wrong,” is a companion to the man who destroys." },
  { t = "v", n = 25, indent = 1, p = true, text = "A greedy man stirs up strife, but he who trusts in the LORD will prosper." },
  { t = "v", n = 26, indent = 1, p = true, text = "He who trusts in himself is a fool, but one who walks in wisdom will be safe." },
  { t = "v", n = 27, indent = 1, p = true, text = "Whoever gives to the poor will not be in need, but he who hides his eyes will receive many curses." },
  { t = "v", n = 28, indent = 1, p = true, text = "When the wicked come to power, people hide themselves; but when they perish, the righteous flourish." },
  { t = "note", id = "a", text = "Or *always fears the LORD*; Hebrew does not include *the LORD*." },
  { t = "note", id = "b", text = "Or *will be a fugitive until death*" },
  { t = "note", id = "c", text = "Hebrew *A man whose eye is evil*" },
]

[[section]]
id = "29"
title = "Proverbs 29"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Flourishing of the Righteous" },
  { t = "v", n = 1, indent = 1, p = true, text = "A man who remains stiff-necked after much reproof will suddenly be shattered beyond recovery." },
  { t = "v", n = 2, indent = 1, p = true, text = "When the righteous flourish, the people rejoice, but when the wicked rule, the people groan." },
  { t = "v", n = 3, indent = 1, p = true, text = "A man who loves wisdom brings joy to his father, but a companion of prostitutes squanders his wealth." },
  { t = "v", n = 4, indent = 1, p = true, text = "By justice a king brings stability to the land, but a man who exacts tribute[^a] demolishes it." },
  { t = "v", n = 5, indent = 1, p = true, text = "A man who flatters his neighbor spreads a net for his feet." },
  { t = "v", n = 6, indent = 1, p = true, text = "An evil man is caught by his own sin, but a righteous one sings and rejoices." },
  { t = "v", n = 7, indent = 1, p = true, text = "The righteous consider the cause of the poor, but the wicked have no regard for such concerns." },
  { t = "v", n = 8, indent = 1, p = true, text = "Mockers inflame a city, but the wise turn away anger." },
  { t = "v", n = 9, indent = 1, p = true, text = "If a wise man goes to court with a fool, there will be raving and laughing with no resolution." },
  { t = "v", n = 10, indent = 1, p = true, text = "Men of bloodshed hate a blameless man, but the upright care for his life.[^b]" },
  { t = "v", n = 11, indent = 1, p = true, text = "A fool vents all his anger, but a wise man holds it back." },
  { t = "v", n = 12, indent = 1, p = true, text = "If a ruler listens to lies, all his officials will be wicked." },
  { t = "v", n = 13, indent = 1, p = true, text = "The poor man and the oppressor have this in common: The LORD gives light to the eyes of both." },
  { t = "v", n = 14, indent = 1, p = true, text = "A king who judges the poor with fairness—his throne will be established forever." },
  { t = "v", n = 15, indent = 1, p = true, text = "A rod of correction imparts wisdom, but a child left to himself disgraces his mother." },
  { t = "v", n = 16, indent = 1, p = true, text = "When the wicked thrive, rebellion increases; but the righteous will see their downfall." },
  { t = "v", n = 17, indent = 1, p = true, text = "Discipline your son, and he will give you rest; he will bring delight to your soul." },
  { t = "v", n = 18, indent = 1, p = true, text = "Where there is no vision, the people cast off restraint; but blessed is he who keeps the Law." },
  { t = "v", n = 19, indent = 1, p = true, text = "A servant cannot be corrected by words alone; though he understands, he will not respond." },
  { t = "v", n = 20, indent = 1, p = true, text = "Do you see a man who speaks in haste? There is more hope for a fool than for him." },
  { t = "v", n = 21, indent = 1, p = true, text = "A servant pampered from his youth will bring grief in the end." },
  { t = "v", n = 22, indent = 1, p = true, text = "An angry man stirs up dissension, and a hot-tempered man abounds in transgression." },
  { t = "v", n = 23, indent = 1, p = true, text = "A man’s pride will bring him low, but a humble spirit will obtain honor." },
  { t = "v", n = 24, indent = 1, p = true, text = "A partner to a thief hates his own soul; he receives the oath but does not testify." },
  { t = "v", n = 25, indent = 1, p = true, text = "The fear of man is a snare, but whoever trusts in the LORD is set securely on high." },
  { t = "v", n = 26, indent = 1, p = true, text = "Many seek the ruler’s favor, but a man receives justice from the LORD." },
  { t = "v", n = 27, indent = 1, p = true, text = "An unjust man is detestable to the righteous, and one whose way is upright is detestable to the wicked." },
  { t = "note", id = "a", text = "Or *who taxes heavily* or *who takes bribes*" },
  { t = "note", id = "b", text = "Or *but the upright seek his soul*" },
]

[[section]]
id = "30"
title = "Proverbs 30"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Words of Agur" },
  { t = "v", n = 1, p = true, text = "These are the words of Agur son of Jakeh—the burden that this man declared to Ithiel: “I am weary, O God, and worn out.[^a]" },
  { t = "v", n = 2, indent = 1, text = "Surely I am the most ignorant of men, and I lack the understanding of a man." },
  { t = "v", n = 3, indent = 1, text = "I have not learned wisdom, and I have no knowledge of the Holy One." },
  { t = "v", n = 4, indent = 1, text = "Who has ascended to heaven and come down? Who has gathered the wind in His hands? Who has bound up the waters in His cloak? Who has established all the ends of the earth? What is His name, and what is the name of His Son—surely you know!" },
  { t = "v", n = 5, indent = 1, text = "Every word of God is flawless; He is a shield to those who take refuge in Him." },
  { t = "v", n = 6, indent = 1, text = "Do not add to His words, lest He rebuke you and prove you a liar." },
  { t = "v", n = 7, indent = 1, p = true, text = "Two things I ask of You—do not refuse me before I die:" },
  { t = "v", n = 8, indent = 1, text = "Keep falsehood and deceitful words far from me. Give me neither poverty nor riches; feed me with the bread that is my portion." },
  { t = "v", n = 9, indent = 1, text = "Otherwise, I may have too much and deny You, saying, ‘Who is the LORD?’ Or I may become poor and steal, profaning the name of my God." },
  { t = "v", n = 10, indent = 1, p = true, text = "Do not slander a servant to his master, or he will curse you, and you will bear the guilt." },
  { t = "v", n = 11, indent = 1, p = true, text = "There is a generation of those who curse their fathers and do not bless their mothers." },
  { t = "v", n = 12, indent = 1, text = "There is a generation of those who are pure in their own eyes and yet unwashed of their filth." },
  { t = "v", n = 13, indent = 1, text = "There is a generation—how haughty are their eyes and pretentious are their glances—" },
  { t = "v", n = 14, indent = 1, text = "there is a generation whose teeth are swords and whose jaws are knives, devouring the oppressed from the earth and the needy from among men." },
  { t = "v", n = 15, indent = 1, p = true, text = "The leech has two daughters: Give and Give. There are three things that are never satisfied, four that never say, ‘Enough!’:" },
  { t = "v", n = 16, indent = 1, p = true, text = "Sheol, the barren womb, land never satisfied with water, and fire that never says, ‘Enough!’" },
  { t = "v", n = 17, indent = 1, p = true, text = "As for the eye that mocks a father and scorns obedience to a mother, may the ravens of the valley pluck it out and young vultures devour it." },
  { t = "v", n = 18, p = true, text = "There are three things too wonderful for me, four that I cannot understand:" },
  { t = "v", n = 19, indent = 1, p = true, text = "the way of an eagle in the sky, the way of a snake on a rock, the way of a ship at sea, and the way of a man with a maiden." },
  { t = "v", n = 20, indent = 1, p = true, text = "This is the way of an adulteress: She eats and wipes her mouth and says, ‘I have done nothing wrong.’" },
  { t = "v", n = 21, p = true, text = "Under three things the earth trembles, under four it cannot bear up:" },
  { t = "v", n = 22, indent = 1, p = true, text = "a servant who becomes king, a fool who is filled with food," },
  { t = "v", n = 23, indent = 1, p = true, text = "an unloved woman who marries, and a maidservant who supplants her mistress." },
  { t = "v", n = 24, p = true, text = "Four things on earth are small, yet they are exceedingly wise:" },
  { t = "v", n = 25, indent = 1, p = true, text = "The ants are creatures of little strength, yet they store up their food in the summer;" },
  { t = "v", n = 26, indent = 1, p = true, text = "the rock badgers[^b] are creatures of little power, yet they make their homes in the rocks;" },
  { t = "v", n = 27, indent = 1, p = true, text = "the locusts have no king, yet they all advance in formation;" },
  { t = "v", n = 28, indent = 1, p = true, text = "and the lizard can be caught in one’s hands, yet it is found in the palaces of kings." },
  { t = "v", n = 29, p = true, text = "There are three things that are stately in their stride, and four that are impressive in their walk:" },
  { t = "v", n = 30, indent = 1, p = true, text = "a lion, mighty among beasts, refusing to retreat before anything;" },
  { t = "v", n = 31, indent = 1, p = true, text = "a strutting rooster; a he-goat; and a king with his army around him.[^c]" },
  { t = "v", n = 32, indent = 1, p = true, text = "If you have foolishly exalted yourself or if you have plotted evil, put your hand over your mouth." },
  { t = "v", n = 33, indent = 1, text = "For as the churning of milk yields butter, and the twisting of the nose draws blood, so the stirring of anger brings forth strife.”" },
  { t = "note", id = "a", text = "Or *declared to Ithiel: “I am weary, O God, but I can prevail.* (revocalizations); Hebrew *declared to Ithiel—to Ithiel and Ucal:*" },
  { t = "note", id = "b", text = "Or *the coneys* or *the hyraxes*" },
  { t = "note", id = "c", text = "Or *a king against whom there is no rising up*" },
]

[[section]]
id = "31"
title = "Proverbs 31"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Sayings for King Lemuel" },
  { t = "v", n = 1, p = true, text = "These are the words of King Lemuel—the burden that his mother taught him:" },
  { t = "v", n = 2, indent = 1, p = true, text = "What shall I say,[^a] O my son? What, O son of my womb? What, O son of my vows?" },
  { t = "v", n = 3, indent = 1, text = "Do not spend your strength on women or your vigor on those who ruin kings." },
  { t = "v", n = 4, indent = 1, text = "It is not for kings, O Lemuel, it is not for kings to drink wine, or for rulers to crave strong drink," },
  { t = "v", n = 5, indent = 1, text = "lest they drink and forget what is decreed, depriving all the oppressed of justice." },
  { t = "v", n = 6, indent = 1, p = true, text = "Give strong drink to one who is perishing, and wine to the bitter in soul." },
  { t = "v", n = 7, indent = 1, text = "Let him drink and forget his poverty, and remember his misery no more." },
  { t = "v", n = 8, indent = 1, p = true, text = "Open your mouth for those with no voice, for the cause of all the dispossessed." },
  { t = "v", n = 9, indent = 1, text = "Open your mouth, judge righteously, and defend the cause of the poor and needy." },
  { t = "h", level = 2, text = "The Virtues of a Noble Woman" },
  { t = "v", n = 10, indent = 1, p = true, text = "A wife[^b] of noble character, who can find? She is far more precious than rubies." },
  { t = "v", n = 11, indent = 1, p = true, text = "The heart of her husband trusts in her, and he lacks nothing of value." },
  { t = "v", n = 12, indent = 1, text = "She brings him good and not harm all the days of her life." },
  { t = "v", n = 13, indent = 1, text = "She selects wool and flax and works with eager hands." },
  { t = "v", n = 14, indent = 1, text = "She is like the merchant ships, bringing her food from afar." },
  { t = "v", n = 15, indent = 1, p = true, text = "She rises while it is still night to provide food for her household and portions for her maidservants." },
  { t = "v", n = 16, indent = 1, text = "She appraises a field and buys it; from her earnings she plants a vineyard." },
  { t = "v", n = 17, indent = 1, text = "She girds herself[^c] with strength and shows that her arms are strong." },
  { t = "v", n = 18, indent = 1, text = "She sees that her gain is good, and her lamp is not extinguished at night." },
  { t = "v", n = 19, indent = 1, text = "She stretches out her hands to the distaff and grasps the spindle with her fingers." },
  { t = "v", n = 20, indent = 1, p = true, text = "She opens her arms to the poor and reaches out her hands to the needy." },
  { t = "v", n = 21, indent = 1, text = "When it snows, she has no fear for her household, for they are all clothed in scarlet.[^d]" },
  { t = "v", n = 22, indent = 1, text = "She makes coverings for her bed; her clothing is fine linen and purple." },
  { t = "v", n = 23, indent = 1, text = "Her husband is known at the city gates, where he sits among the elders of the land." },
  { t = "v", n = 24, indent = 1, text = "She makes linen garments and sells them; she delivers sashes to the merchants." },
  { t = "v", n = 25, indent = 1, p = true, text = "Strength and honor are her clothing, and she can laugh at the days to come." },
  { t = "v", n = 26, indent = 1, text = "She opens her mouth with wisdom, and faithful instruction is on her tongue." },
  { t = "v", n = 27, indent = 1, text = "She watches over the affairs of her household and does not eat the bread of idleness." },
  { t = "v", n = 28, indent = 1, text = "Her children rise up and call her blessed; her husband praises her as well:" },
  { t = "v", n = 29, indent = 1, text = "“Many daughters have done noble things, but you surpass them all!”" },
  { t = "v", n = 30, indent = 1, p = true, text = "Charm is deceptive and beauty is fleeting, but a woman who fears the LORD is to be praised." },
  { t = "v", n = 31, indent = 1, text = "Give her the fruit of her hands, and let her works praise her at the gates." },
  { t = "note", id = "a", text = "Or *What* or *What are you doing*" },
  { t = "note", id = "b", text = "Verses 10–31 are an acrostic poem, each verse beginning with the successive letters of the Hebrew alphabet." },
  { t = "note", id = "c", text = "Hebrew *She girds her loins*" },
  { t = "note", id = "d", text = "Or *doubly clothed*" },
]

[[section]]
id = "1"
title = "Song of Solomon 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Bride Confesses Her Love" },
  { t = "ref", text = "(Ephesians 5:22–33; 1 Peter 3:1–7)" },
  { t = "v", n = 1, p = true, text = "This is Solomon’s Song of Songs.[^a]" },
  { t = "h", level = 3, text = "The Bride" },
  { t = "v", n = 2, indent = 1, p = true, text = "Let him kiss me with the kisses of his mouth! For your love is more delightful than wine." },
  { t = "v", n = 3, indent = 1, text = "The fragrance of your perfume is pleasing; your name is like perfume poured out. No wonder the maidens adore you." },
  { t = "v", n = 4, indent = 1, p = true, text = "Take me away with you—let us hurry! May the king bring me to his chambers." },
  { t = "h", level = 3, text = "The Friends" },
  { t = "v", n = 4, indent = 1, p = true, cont = true, text = "We will rejoice and delight in you; we will praise your love more than wine." },
  { t = "h", level = 3, text = "The Bride" },
  { t = "v", n = 4, indent = 1, p = true, cont = true, text = "It is only right that they adore you." },
  { t = "v", n = 5, indent = 1, p = true, text = "I am dark, yet lovely, O daughters of Jerusalem, like the tents of Kedar, like the curtains of Solomon." },
  { t = "v", n = 6, indent = 1, text = "Do not stare because I am dark, for the sun has gazed upon me. My mother’s sons were angry with me; they made me a keeper of the vineyards, but my own vineyard I have neglected." },
  { t = "v", n = 7, indent = 1, p = true, text = "Tell me, O one I love, where do you pasture your sheep? Where do you rest them at midday? Why should I be like a veiled woman beside the flocks of your companions?" },
  { t = "h", level = 3, text = "The Friends" },
  { t = "v", n = 8, indent = 1, p = true, text = "If you do not know, O fairest of women, follow the tracks of the flock, and graze your young goats near the tents of the shepherds." },
  { t = "h", level = 3, text = "The Bridegroom" },
  { t = "v", n = 9, indent = 1, p = true, text = "I compare you, my darling, to a mare among Pharaoh’s chariots." },
  { t = "v", n = 10, indent = 1, text = "Your cheeks are beautiful with ornaments, your neck with strings of jewels." },
  { t = "h", level = 3, text = "The Friends" },
  { t = "v", n = 11, indent = 1, p = true, text = "We will make you ornaments of gold, studded with beads of silver." },
  { t = "h", level = 3, text = "The Bride" },
  { t = "v", n = 12, indent = 1, p = true, text = "While the king was at his table, my perfume spread its fragrance." },
  { t = "v", n = 13, indent = 1, text = "My beloved is to me a sachet of myrrh resting between my breasts." },
  { t = "v", n = 14, indent = 1, text = "My beloved is to me a cluster of henna blossoms in the vineyards of En-gedi." },
  { t = "h", level = 3, text = "The Bridegroom" },
  { t = "v", n = 15, indent = 1, p = true, text = "How beautiful you are, my darling! Oh, how very beautiful! Your eyes are like doves." },
  { t = "h", level = 3, text = "The Bride" },
  { t = "v", n = 16, indent = 1, p = true, text = "How handsome you are, my beloved! Oh, how delightful! The soft grass is our bed." },
  { t = "h", level = 3, text = "The Bridegroom" },
  { t = "v", n = 17, indent = 1, p = true, text = "The beams of our house are cedars; our rafters are fragrant firs." },
  { t = "note", id = "a", text = "Most translators add subheadings for speaker identifications such as *The Bride*, *The Groom*, and *The Friends* based on the gender and number of the Hebrew words." },
]

[[section]]
id = "2"
title = "Song of Solomon 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Bride’s Admiration" },
  { t = "h", level = 3, text = "The Bride" },
  { t = "v", n = 1, indent = 1, p = true, text = "I am a rose of Sharon,[^a] a lily of the valley." },
  { t = "h", level = 3, text = "The Bridegroom" },
  { t = "v", n = 2, indent = 1, p = true, text = "Like a lily among the thorns is my darling among the maidens." },
  { t = "h", level = 3, text = "The Bride" },
  { t = "v", n = 3, indent = 1, p = true, text = "Like an apple tree among the trees of the forest is my beloved among the young men. I delight to sit in his shade, and his fruit is sweet to my taste." },
  { t = "v", n = 4, indent = 1, text = "He has brought me to the house of wine,[^b] and his banner over me is love." },
  { t = "v", n = 5, indent = 1, p = true, text = "Sustain me with raisins; refresh me with apples, for I am faint with love." },
  { t = "v", n = 6, indent = 1, p = true, text = "His left hand is under my head, and his right arm embraces me." },
  { t = "v", n = 7, indent = 1, text = "O daughters of Jerusalem, I adjure you by the gazelles and does of the field: Do not arouse or awaken love until the time is right." },
  { t = "v", n = 8, indent = 1, p = true, text = "Listen! My beloved approaches. Look! Here he comes, leaping across the mountains, bounding over the hills." },
  { t = "v", n = 9, indent = 1, text = "My beloved is like a gazelle or a young stag. Look, he stands behind our wall, gazing through the windows, peering through the lattice." },
  { t = "v", n = 10, indent = 1, p = true, text = "My beloved calls to me, “Arise, my darling. Come away with me, my beautiful one." },
  { t = "v", n = 11, indent = 1, text = "For now the winter is past; the rain is over and gone." },
  { t = "v", n = 12, indent = 1, text = "The flowers have appeared in the countryside; the season of singing[^c] has come, and the cooing of turtledoves is heard in our land." },
  { t = "v", n = 13, indent = 1, text = "The fig tree ripens its figs; the blossoming vines spread their fragrance. Arise, come away, my darling; come away with me, my beautiful one.”" },
  { t = "h", level = 3, text = "The Bridegroom" },
  { t = "v", n = 14, indent = 1, p = true, text = "O my dove in the clefts of the rock, in the crevices of the cliff, let me see your face, let me hear your voice; for your voice is sweet, and your countenance is lovely." },
  { t = "h", level = 3, text = "The Friends" },
  { t = "v", n = 15, indent = 1, p = true, text = "Catch for us the foxes—the little foxes that ruin the vineyards—for our vineyards are in bloom." },
  { t = "h", level = 3, text = "The Bride" },
  { t = "v", n = 16, indent = 1, p = true, text = "My beloved is mine and I am his; he pastures his flock among the lilies." },
  { t = "v", n = 17, indent = 1, text = "Before the day breaks and shadows flee, turn, my beloved, and be like a gazelle or a young stag on the mountains of Bether.[^d]" },
  { t = "note", id = "a", text = "Sharon Plain is a region in the coastal plain of Israel" },
  { t = "note", id = "b", text = "That is, the banquet hall" },
  { t = "note", id = "c", text = "Or *pruning*" },
  { t = "note", id = "d", text = "Or *the rugged mountains*" },
]

[[section]]
id = "3"
title = "Song of Solomon 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Bride’s Dream" },
  { t = "v", n = 1, indent = 1, p = true, text = "On my bed at night I sought the one I love; I sought him, but did not find him." },
  { t = "v", n = 2, indent = 1, text = "I will arise now and go about the city, through the streets and squares. I will seek the one I love. So I sought him but did not find him." },
  { t = "v", n = 3, indent = 1, p = true, text = "I encountered the watchmen on their rounds of the city: “Have you seen the one I love?”" },
  { t = "v", n = 4, indent = 1, text = "I had just passed them when I found the one I love. I held him and would not let go until I had brought him to my mother’s house, to the chamber of the one who conceived me." },
  { t = "v", n = 5, indent = 1, p = true, text = "O daughters of Jerusalem, I adjure you by the gazelles and does of the field: Do not arouse or awaken love until the time is right." },
  { t = "h", level = 2, text = "Solomon Arrives on His Wedding Day" },
  { t = "v", n = 6, indent = 1, p = true, text = "Who is this coming up from the wilderness like a column of smoke, scented with myrrh and frankincense from all the spices of the merchant?" },
  { t = "v", n = 7, indent = 1, text = "Behold, it is Solomon’s carriage,[^a] escorted by sixty of the mightiest men of Israel." },
  { t = "v", n = 8, indent = 1, text = "All are skilled with the sword, experienced in warfare. Each has his sword at his side prepared for the terror of the night." },
  { t = "v", n = 9, indent = 1, p = true, text = "King Solomon has made his carriage out of the timber of Lebanon." },
  { t = "v", n = 10, indent = 1, text = "He has made its posts of silver, its base of gold, its seat of purple fabric. Its interior is inlaid with love by the daughters of Jerusalem." },
  { t = "v", n = 11, indent = 1, p = true, text = "Come out, O daughters of Zion, and gaze at King Solomon, wearing the crown with which his mother crowned him on the day of his wedding—the day of his heart’s rejoicing." },
  { t = "note", id = "a", text = "That is, the couch on which servants carry a king" },
]

[[section]]
id = "4"
title = "Song of Solomon 4"
level = 1
blocks = [
  { t = "h", level = 2, text = "Solomon Admires His Bride" },
  { t = "h", level = 3, text = "The Bridegroom" },
  { t = "v", n = 1, indent = 1, p = true, text = "How beautiful you are, my darling—how very beautiful! Your eyes are like doves behind your veil. Your hair is like a flock of goats streaming down Mount Gilead." },
  { t = "v", n = 2, indent = 1, text = "Your teeth are like a flock of newly shorn sheep coming up from the washing; each has its twin, and not one of them is lost." },
  { t = "v", n = 3, indent = 1, text = "Your lips are like a scarlet ribbon, and your mouth is lovely. Your brow behind your veil is like a slice of pomegranate." },
  { t = "v", n = 4, indent = 1, text = "Your neck is like the tower of David, built with rows of stones; on it hang a thousand shields, all of them shields of warriors." },
  { t = "v", n = 5, indent = 1, text = "Your breasts are like two fawns, twins of a gazelle grazing among the lilies." },
  { t = "v", n = 6, indent = 1, p = true, text = "Before the day breaks and the shadows flee, I will make my way to the mountain of myrrh and to the hill of frankincense." },
  { t = "v", n = 7, indent = 1, text = "You are altogether beautiful, my darling; in you there is no flaw." },
  { t = "v", n = 8, indent = 1, p = true, text = "Come with me from Lebanon, my bride, come with me from Lebanon! Descend[^a] from the peak of Amana, from the summits of Senir and Hermon, from the dens of the lions, from the mountains of the leopards." },
  { t = "v", n = 9, indent = 1, text = "You have captured my heart, my sister, my bride; you have stolen my heart with one glance of your eyes, with one jewel of your neck." },
  { t = "v", n = 10, indent = 1, text = "How delightful is your love, my sister, my bride! Your love is much better than wine, and the fragrance of your perfume than all spices." },
  { t = "v", n = 11, indent = 1, text = "Your lips, my bride, drip sweetness like the honeycomb; honey and milk are under your tongue, and the fragrance of your garments is like the aroma of Lebanon." },
  { t = "v", n = 12, indent = 1, p = true, text = "My sister, my bride, you are a garden locked up, a spring enclosed, a fountain sealed." },
  { t = "v", n = 13, indent = 1, text = "Your branches are an orchard of pomegranates with the choicest of fruits, with henna and nard," },
  { t = "v", n = 14, indent = 1, text = "with nard and saffron, with calamus and cinnamon, with every kind of frankincense tree, with myrrh and aloes, with all the finest spices." },
  { t = "v", n = 15, indent = 1, text = "You are a garden spring, a well of fresh water[^b] flowing down from Lebanon." },
  { t = "h", level = 3, text = "The Bride" },
  { t = "v", n = 16, indent = 1, p = true, text = "Awake, O north wind, and come, O south wind. Breathe on my garden and spread the fragrance of its spices. Let my beloved come into his garden and taste its choicest fruits." },
  { t = "note", id = "a", text = "Or *Look down*" },
  { t = "note", id = "b", text = "Or *flowing water* or *living water*" },
]

[[section]]
id = "5"
title = "Song of Solomon 5"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Bride and Her Beloved" },
  { t = "h", level = 3, text = "The Bridegroom" },
  { t = "v", n = 1, indent = 1, p = true, text = "I have come to my garden, my sister, my bride; I have gathered my myrrh with my spice. I have eaten my honeycomb with my honey; I have drunk my wine with my milk." },
  { t = "h", level = 3, text = "The Friends" },
  { t = "v", n = 1, indent = 1, p = true, cont = true, text = "Eat, O friends, and drink; drink freely, O beloved." },
  { t = "h", level = 3, text = "The Bride" },
  { t = "v", n = 2, indent = 1, p = true, text = "I sleep, but my heart is awake. A sound! My beloved is knocking: “Open to me, my sister, my darling, my dove, my flawless one. My head is drenched with dew, my hair with the dampness of the night.”" },
  { t = "v", n = 3, indent = 1, p = true, text = "I have taken off my robe—must I put it back on? I have washed my feet—must I soil them again?" },
  { t = "v", n = 4, indent = 1, text = "My beloved put his hand to the latch; my heart pounded for him." },
  { t = "v", n = 5, indent = 1, text = "I rose up to open for my beloved. My hands dripped with myrrh, my fingers with flowing myrrh on the handles of the bolt." },
  { t = "v", n = 6, indent = 1, text = "I opened for my beloved, but he had turned and gone. My heart sank at his departure. I sought him but did not find him. I called, but he did not answer." },
  { t = "v", n = 7, indent = 1, p = true, text = "I encountered the watchmen on their rounds of the city. They beat me and bruised me; they took away my cloak, those guardians of the walls." },
  { t = "v", n = 8, indent = 1, text = "O daughters of Jerusalem, I adjure you, if you find my beloved, tell him I am sick with love." },
  { t = "h", level = 3, text = "The Friends" },
  { t = "v", n = 9, indent = 1, p = true, text = "How is your beloved better than others, O most beautiful among women? How is your beloved better than another, that you charge us so?" },
  { t = "h", level = 3, text = "The Bride" },
  { t = "v", n = 10, indent = 1, p = true, text = "My beloved is dazzling and ruddy, outstanding among ten thousand." },
  { t = "v", n = 11, indent = 1, text = "His head is purest gold; his hair is wavy and black as a raven." },
  { t = "v", n = 12, indent = 1, text = "His eyes are like doves beside the streams of water, bathed in milk and mounted like jewels." },
  { t = "v", n = 13, indent = 1, text = "His cheeks are like beds of spice, towers of perfume. His lips are like lilies, dripping with flowing myrrh." },
  { t = "v", n = 14, indent = 1, text = "His arms are rods of gold set with beryl. His body is polished ivory bedecked with sapphires." },
  { t = "v", n = 15, indent = 1, text = "His legs are pillars of marble set on bases of pure gold. His appearance is like Lebanon, as majestic as the cedars." },
  { t = "v", n = 16, indent = 1, text = "His mouth[^a] is most sweet; he is altogether lovely. This is my beloved, and this is my friend, O daughters of Jerusalem." },
  { t = "note", id = "a", text = "Hebrew *palate*" },
]

[[section]]
id = "6"
title = "Song of Solomon 6"
level = 1
blocks = [
  { t = "h", level = 2, text = "Together in the Garden" },
  { t = "h", level = 3, text = "The Friends" },
  { t = "v", n = 1, indent = 1, p = true, text = "Where has your beloved gone, O most beautiful among women? Which way has he turned? We will seek him with you." },
  { t = "h", level = 3, text = "The Bride" },
  { t = "v", n = 2, indent = 1, p = true, text = "My beloved has gone down to his garden, to the beds of spices, to pasture his flock in the gardens and to gather lilies." },
  { t = "v", n = 3, indent = 1, text = "I belong to my beloved and he belongs to me; he pastures his flock among the lilies." },
  { t = "h", level = 3, text = "The Bridegroom" },
  { t = "v", n = 4, indent = 1, p = true, text = "You are as beautiful, my darling, as Tirzah, as lovely as Jerusalem, as majestic as troops with banners." },
  { t = "v", n = 5, indent = 1, text = "Turn your eyes away from me, for they have overcome me. Your hair is like a flock of goats streaming down from Gilead." },
  { t = "v", n = 6, indent = 1, text = "Your teeth are like a flock of sheep coming up from the washing; each has its twin, and not one of them is lost." },
  { t = "v", n = 7, indent = 1, text = "Your brow behind your veil is like a slice of pomegranate." },
  { t = "v", n = 8, indent = 1, p = true, text = "There are sixty queens and eighty concubines, and maidens without number," },
  { t = "v", n = 9, indent = 1, text = "but my dove, my perfect one, is unique, the favorite of the mother who bore her. The maidens see her and call her blessed; the queens and concubines sing her praises." },
  { t = "h", level = 3, text = "The Friends" },
  { t = "v", n = 10, indent = 1, p = true, text = "Who is this who shines like the dawn, as fair as the moon, as bright as the sun, as majestic as the stars in procession?" },
  { t = "h", level = 3, text = "The Bridegroom" },
  { t = "v", n = 11, indent = 1, p = true, text = "I went down to the walnut grove to see the blossoms of the valley, to see if the vines were budding or the pomegranates were in bloom." },
  { t = "v", n = 12, indent = 1, text = "Before I realized it, my desire had set me among the royal chariots of my people.[^a]" },
  { t = "h", level = 3, text = "The Friends" },
  { t = "v", n = 13, indent = 1, p = true, text = "Come back, come back, O Shulammite! Come back, come back, that we may gaze upon you." },
  { t = "h", level = 3, text = "The Bridegroom" },
  { t = "v", n = 13, indent = 1, p = true, cont = true, text = "Why do you look at the Shulammite, as on the dance of Mahanaim[^b]?" },
  { t = "note", id = "a", text = "Or *among the chariots of Amminadab*" },
  { t = "note", id = "b", text = "Or *the dance of the two camps*" },
]

[[section]]
id = "7"
title = "Song of Solomon 7"
level = 1
blocks = [
  { t = "h", level = 2, text = "Admiration by the Bridegroom" },
  { t = "v", n = 1, indent = 1, p = true, text = "How beautiful are your sandaled feet, O daughter of the prince! The curves of your thighs are like jewels, the handiwork of a master." },
  { t = "v", n = 2, indent = 1, text = "Your navel is a rounded goblet; it never lacks blended wine. Your waist is a mound of wheat encircled by the lilies." },
  { t = "v", n = 3, indent = 1, text = "Your breasts are like two fawns, twins of a gazelle." },
  { t = "v", n = 4, indent = 1, text = "Your neck is like a tower made of ivory; your eyes are like the pools of Heshbon by the gate of Bath-rabbim; your nose is like the tower of Lebanon, facing toward Damascus." },
  { t = "v", n = 5, indent = 1, text = "Your head crowns you like Mount Carmel, the hair of your head like purple threads; the king is captured in your tresses." },
  { t = "v", n = 6, indent = 1, p = true, text = "How fair and pleasant you are, O love, with your delights!" },
  { t = "v", n = 7, indent = 1, text = "Your stature is like a palm tree; your breasts are clusters of fruit." },
  { t = "v", n = 8, indent = 1, text = "I said, “I will climb the palm tree; I will take hold of its fruit.” May your breasts be like clusters of the vine, the fragrance of your breath like apples," },
  { t = "v", n = 9, indent = 2, text = "and your mouth[^a] like the finest wine." },
  { t = "h", level = 3, text = "The Bride" },
  { t = "v", n = 9, indent = 1, p = true, cont = true, text = "May it flow smoothly to my beloved, gliding gently over lips and teeth.[^b]" },
  { t = "v", n = 10, indent = 1, p = true, text = "I belong to my beloved, and his desire is for me." },
  { t = "v", n = 11, indent = 1, text = "Come, my beloved, let us go to the countryside; let us spend the night among the wildflowers.[^c]" },
  { t = "v", n = 12, indent = 1, p = true, text = "Let us go early to the vineyards to see if the vine has budded, if the blossom has opened, if the pomegranates are in bloom—there I will give you my love." },
  { t = "v", n = 13, indent = 1, p = true, text = "The mandrakes send forth a fragrance, and at our door is every delicacy, new as well as old, that I have treasured up for you, my beloved." },
  { t = "note", id = "a", text = "Hebrew *palate*" },
  { t = "note", id = "b", text = "LXX, Syriac, and Vulgate; Hebrew *gliding gently over lips as we sleep*" },
  { t = "note", id = "c", text = "Or *among the henna blossoms* or *in the villages*" },
]

[[section]]
id = "8"
title = "Song of Solomon 8"
level = 1
blocks = [
  { t = "h", level = 2, text = "Longing for Her Beloved" },
  { t = "v", n = 1, indent = 1, p = true, text = "O that you were to me like a brother who nursed at my mother’s breasts! If I found you outdoors, I would kiss you, and no one would despise me." },
  { t = "v", n = 2, indent = 1, text = "I would lead you and bring you to the house of my mother who taught me. I would give you spiced wine to drink, the nectar of my pomegranates." },
  { t = "v", n = 3, indent = 1, p = true, text = "His left hand is under my head, and his right arm embraces me." },
  { t = "v", n = 4, indent = 1, text = "O daughters of Jerusalem, I adjure you: Do not arouse or awaken love until the time is right." },
  { t = "h", level = 3, text = "The Friends" },
  { t = "v", n = 5, indent = 1, p = true, text = "Who is this coming up from the wilderness, leaning on her beloved?" },
  { t = "h", level = 3, text = "The Bride" },
  { t = "v", n = 5, indent = 1, p = true, cont = true, text = "I roused you under the apple tree; there your mother conceived you; there she travailed and brought you forth." },
  { t = "v", n = 6, indent = 1, p = true, text = "Set me as a seal over your heart, as a seal upon your arm. For love is as strong as death, its jealousy[^a] as unrelenting as Sheol. Its sparks are fiery flames, the fiercest blaze of all." },
  { t = "v", n = 7, indent = 1, text = "Mighty waters cannot quench love; rivers cannot sweep it away. If a man were to give all the wealth of his house for love, his offer would be utterly scorned." },
  { t = "h", level = 3, text = "The Friends" },
  { t = "v", n = 8, indent = 1, p = true, text = "We have a little sister, and her breasts are not yet grown. What shall we do for our sister on the day she is spoken for?" },
  { t = "v", n = 9, indent = 1, text = "If she is a wall, we will build a tower of silver upon her. If she is a door, we will enclose her with panels of cedar." },
  { t = "h", level = 3, text = "The Bride" },
  { t = "v", n = 10, indent = 1, p = true, text = "I am a wall, and my breasts are like towers. So I have become in his eyes like one who brings peace." },
  { t = "v", n = 11, indent = 1, text = "Solomon had a vineyard in Baal-hamon. He leased it to the tenants. For its fruit, each was to bring a thousand shekels of silver.[^b]" },
  { t = "v", n = 12, indent = 1, text = "But my own vineyard is mine to give; the thousand shekels are for you, O Solomon, and two hundred are for those who tend its fruit." },
  { t = "h", level = 3, text = "The Bridegroom" },
  { t = "v", n = 13, indent = 1, p = true, text = "You who dwell in the gardens, my companions are listening for your voice. Let me hear it!" },
  { t = "h", level = 3, text = "The Bride" },
  { t = "v", n = 14, indent = 1, p = true, text = "Come away, my beloved, and be like a gazelle or a young stag on the mountains of spices." },
  { t = "note", id = "a", text = "Or *passion*" },

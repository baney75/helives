[[section]]
id = "1"
title = "Malachi 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "The LORD’s Love for Israel" },
  { t = "ref", text = "(Genesis 25:19–28; Romans 9:6–29)" },
  { t = "v", n = 1, p = true, text = "This is the burden of the word of the LORD to Israel through Malachi:[^a]" },
  { t = "v", n = 2, p = true, text = "“I have loved you,” says the LORD. But you ask, “How have You loved us?” “Was not Esau Jacob’s brother?” declares the LORD. “Yet Jacob I have loved," },
  { t = "v", n = 3, text = "but Esau I have hated,[^b] and I have made his mountains a wasteland and left his inheritance to the desert jackals.[^c]”" },
  { t = "v", n = 4, p = true, text = "Though Edom may say, “We have been devastated, but we will rebuild the ruins,” this is what the LORD of Hosts says: “They may build, but I will demolish. They will be called the Land of Wickedness, and a people with whom the LORD is indignant forever." },
  { t = "v", n = 5, text = "You will see this with your own eyes, and you yourselves will say, ‘The LORD is great—even beyond the borders of Israel.’”" },
  { t = "h", level = 2, text = "The Polluted Offerings" },
  { t = "v", n = 6, p = true, text = "“A son honors his father, and a servant his master. But if I am a father, where is My honor? And if I am a master, where is your fear of Me?” says the LORD of Hosts to you priests who despise My name. “But you ask, ‘How have we despised Your name?’" },
  { t = "v", n = 7, p = true, text = "By presenting defiled food on My altar. But you ask, ‘How have we defiled You[^d]?’ By saying that the table of the LORD is contemptible." },
  { t = "v", n = 8, p = true, text = "When you offer blind animals for sacrifice, is it not wrong? And when you present the lame and sick ones, is it not wrong? Try offering them to your governor! Would he be pleased with you or show you favor?” asks the LORD of Hosts." },
  { t = "v", n = 9, p = true, text = "“But ask now for God’s favor. Will He be gracious? Since this has come from your hands, will He show you favor?” asks the LORD of Hosts." },
  { t = "v", n = 10, p = true, text = "“Oh, that one of you would shut the temple doors, so that you would no longer kindle useless fires on My altar! I take no pleasure in you,” says the LORD of Hosts, “and I will accept no offering from your hands." },
  { t = "v", n = 11, p = true, text = "For My name will be great among the nations, from where the sun rises to where it sets. In every place, incense and pure offerings will be presented in My name, because My name will be great among the nations,” says the LORD of Hosts." },
  { t = "v", n = 12, text = "“But you profane it when you say, ‘The table of the Lord is defiled, and as for its fruit, its food is contemptible.’" },
  { t = "v", n = 13, p = true, text = "You also say: ‘Oh, what a nuisance!’ And you turn up your nose at it,” says the LORD of Hosts. “You bring offerings that are stolen, lame, or sick! Should I accept these from your hands?” asks the LORD." },
  { t = "v", n = 14, p = true, text = "“But cursed is the deceiver who has an acceptable male in his flock and vows to give it, but sacrifices a defective animal to the Lord. For I am a great King,” says the LORD of Hosts, “and My name is to be feared among the nations." },
  { t = "note", id = "a", text = "*Malachi* means *My messenger*." },
  { t = "note", id = "b", text = "Cited in Romans 9:13" },
  { t = "note", id = "c", text = "Or *to the serpents of the wilderness* or *to the dragons of the wilderness*" },
  { t = "note", id = "d", text = "LXX *defiled it*" },
]

[[section]]
id = "2"
title = "Malachi 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Warning to the Priests" },
  { t = "v", n = 1, p = true, text = "“And now this decree is for you, O priests:" },
  { t = "v", n = 2, p = true, text = "If you do not listen, and if you do not take it to heart to honor My name,” says the LORD of Hosts, “I will send a curse among you, and I will curse your blessings. Yes, I have already begun to curse them, because you are not taking it to heart." },
  { t = "v", n = 3, p = true, text = "Behold, I will rebuke your descendants,[^a] and I will spread dung on your faces, the waste from your feasts, and you will be carried off with it." },
  { t = "v", n = 4, p = true, text = "Then you will know that I have sent you this commandment so that My covenant with Levi may continue,” says the LORD of Hosts." },
  { t = "v", n = 5, text = "“My covenant with him was one of life and peace, which I gave to him; it called for reverence, and he revered Me and stood in awe of My name." },
  { t = "v", n = 6, p = true, text = "True instruction was in his mouth, and nothing false was found on his lips. He walked with Me in peace and uprightness, and he turned many from iniquity." },
  { t = "v", n = 7, text = "For the lips of a priest should preserve knowledge, and people should seek instruction from his mouth, because he is the messenger of the LORD of Hosts." },
  { t = "v", n = 8, p = true, text = "But you have departed from the way, and your instruction has caused many to stumble. You have violated the covenant of Levi,” says the LORD of Hosts." },
  { t = "v", n = 9, text = "“So I in turn have made you despised and humiliated before all the people, because you have not kept My ways, but have shown partiality in matters of the law.”" },
  { t = "h", level = 2, text = "Judah’s Unfaithfulness" },
  { t = "v", n = 10, p = true, text = "Do we not all have one Father? Did not one God create us? Why then do we break faith with one another so as to profane the covenant of our fathers?" },
  { t = "v", n = 11, p = true, text = "Judah has broken faith; an abomination has been committed in Israel and in Jerusalem. For Judah has profaned the LORD’s beloved sanctuary by marrying the daughter of a foreign god." },
  { t = "v", n = 12, text = "As for the man who does this, may the LORD cut off from the tents of Jacob everyone who is awake and aware—even if he brings an offering to the LORD of Hosts." },
  { t = "v", n = 13, p = true, text = "And this is another thing you do: You cover the altar of the LORD with tears, with weeping and groaning, because He no longer regards your offerings or receives them gladly from your hands." },
  { t = "v", n = 14, p = true, text = "Yet you ask, “Why?” It is because the LORD has been a witness between you and the wife of your youth, against whom you have broken faith, though she is your companion and your wife by covenant." },
  { t = "v", n = 15, p = true, text = "Has not the LORD made them one, having a portion of the Spirit? And why one? Because He seeks godly offspring. So guard yourselves in your spirit and do not break faith with the wife of your youth." },
  { t = "v", n = 16, p = true, text = "“For I hate divorce,” says the LORD, the God of Israel. “He who divorces his wife covers his garment with violence,”[^b] says the LORD of Hosts. So guard yourselves in your spirit and do not break faith." },
  { t = "v", n = 17, p = true, text = "You have wearied the LORD with your words; yet you ask, “How have we wearied Him?” By saying, “All who do evil are good in the sight of the LORD, and in them He delights,” or, “Where is the God of justice?”" },
  { t = "note", id = "a", text = "Or *I will blight your grain*" },
  { t = "note", id = "b", text = "Or *“For the man who hates his wife and divorces her,” says the LORD, the God of Israel, “covers his garment with violence,”*" },
]

[[section]]
id = "3"
title = "Malachi 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "I Will Send My Messenger" },
  { t = "ref", text = "( Matthew 11:7–19; Luke 7:24–35)" },
  { t = "v", n = 1, p = true, text = "“Behold, I will send My messenger, who will prepare the way before Me.[^a] Then the Lord whom you seek will suddenly come to His temple—the Messenger of the covenant, in whom you delight—see, He is coming,” says the LORD of Hosts." },
  { t = "v", n = 2, p = true, text = "But who can endure the day of His coming? And who can stand when He appears? For He will be like a refiner’s fire, like a launderer’s soap." },
  { t = "v", n = 3, p = true, text = "And He will sit as a refiner and purifier of silver; He will purify the sons of Levi and refine them like gold and silver. Then they will present offerings to the LORD in righteousness." },
  { t = "v", n = 4, p = true, text = "Then the offerings of Judah and Jerusalem will please the LORD, as in days of old and years gone by." },
  { t = "v", n = 5, p = true, text = "“Then I will draw near to you for judgment. And I will be a swift witness against sorcerers and adulterers and perjurers, against oppressors of the widowed and fatherless, and against those who defraud laborers of their wages and deny justice to the foreigner but do not fear Me,” says the LORD of Hosts." },
  { t = "h", level = 2, text = "Robbing God" },
  { t = "v", n = 6, p = true, text = "“Because I, the LORD, do not change, you descendants of Jacob have not been destroyed." },
  { t = "v", n = 7, text = "Yet from the days of your fathers, you have turned away from My statutes and have not kept them. Return to Me, and I will return to you,” says the LORD of Hosts. “But you ask, ‘How can we return?’" },
  { t = "v", n = 8, p = true, text = "Will a man rob God? Yet you are robbing Me! But you ask, ‘How do we rob You?’ In tithes and offerings." },
  { t = "v", n = 9, text = "You are cursed with a curse, yet you—the whole nation—are still robbing Me." },
  { t = "v", n = 10, text = "Bring the full tithe into the storehouse, so that there may be food in My house. Test Me in this,” says the LORD of Hosts. “See if I will not open the windows of heaven and pour out for you blessing without measure.[^b]" },
  { t = "v", n = 11, text = "I will rebuke the devourer[^c] for you, so that it will not destroy the fruits of your land, and the vine in your field will not fail to produce fruit,” says the LORD of Hosts." },
  { t = "v", n = 12, p = true, text = "“Then all the nations will call you blessed, for you will be a land of delight,” says the LORD of Hosts." },
  { t = "h", level = 2, text = "The Book of Remembrance" },
  { t = "v", n = 13, p = true, text = "“Your words against Me have been harsh,” says the LORD. “Yet you ask, ‘What have we spoken against You?’" },
  { t = "v", n = 14, p = true, text = "You have said, ‘It is futile to serve God. What have we gained by keeping His requirements and walking mournfully before the LORD of Hosts?" },
  { t = "v", n = 15, text = "So now we call the arrogant blessed. Not only do evildoers prosper, they even test God and escape.’”" },
  { t = "v", n = 16, p = true, text = "At that time those who feared the LORD spoke with one another, and the LORD listened and heard them. So a scroll of remembrance was written before Him regarding those who feared the LORD and honored His name." },
  { t = "v", n = 17, p = true, text = "“They will be Mine,” says the LORD of Hosts, “on the day when I prepare My treasured possession. And I will spare them as a man spares his own son who serves him." },
  { t = "v", n = 18, text = "So you will again distinguish between the righteous and the wicked, between those who serve God and those who do not.”" },
  { t = "note", id = "a", text = "Cited in Matthew 11:10, Mark 1:2, and Luke 7:27" },
  { t = "note", id = "b", text = "Literally *blessing for which there will be no room*" },
  { t = "note", id = "c", text = "*The devourer* is probably a name for a crop-destroying pest." },
]

[[section]]
id = "4"
title = "Malachi 4"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Day of the LORD" },
  { t = "ref", text = "(Zephaniah 1:7–18; 1 Thessalonians 5:1–11; 2 Peter 3:8–13)" },
  { t = "v", n = 1, p = true, text = "“For behold, the day is coming, burning like a furnace, when all the arrogant and every evildoer will be stubble; the day is coming when I will set them ablaze,” says the LORD of Hosts. “Not a root or branch will be left to them.”" },
  { t = "v", n = 2, p = true, text = "“But for you who fear My name, the sun of righteousness will rise with healing in its wings,[^a] and you will go out and leap like calves from the stall." },
  { t = "v", n = 3, text = "Then you will trample the wicked, for they will be ashes under the soles of your feet on the day I am preparing,” says the LORD of Hosts." },
  { t = "v", n = 4, p = true, text = "“Remember the law of My servant Moses, the statutes and ordinances I commanded him for all Israel at Horeb.[^b]" },
  { t = "v", n = 5, p = true, text = "Behold, I will send you Elijah the prophet before the coming of the great and awesome[^c] Day of the LORD." },
  { t = "v", n = 6, text = "And he will turn the hearts of the fathers to their children, and the hearts of the children to their fathers.[^d] Otherwise, I will come and strike the land with a curse.”" },
  { t = "note", id = "a", text = "Or *the Sun of Righteousness will rise with healing in His wings*" },
  { t = "note", id = "b", text = "That is, Mount Sinai, or possibly a mountain in the range containing Mount Sinai" },
  { t = "note", id = "c", text = "Or *dreadful*; LXX *glorious*" },
  { t = "note", id = "d", text = "Cited in Luke 1:17" },
]

[[section]]
id = "1"
title = "Philippians 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "Greetings from Paul and Timothy" },
  { t = "ref", text = "(Colossians 1:1–2; Philemon 1:1–3)" },
  { t = "v", n = 1, p = true, text = "Paul and Timothy, servants of Christ Jesus, To all the saints in Christ Jesus at Philippi, together with the overseers and deacons:" },
  { t = "v", n = 2, p = true, text = "Grace and peace to you from God our Father and the Lord Jesus Christ." },
  { t = "h", level = 2, text = "Thanksgiving and Prayer" },
  { t = "ref", text = "(1 Corinthians 1:4–9; Colossians 1:3–14)" },
  { t = "v", n = 3, p = true, text = "I thank my God every time I remember you." },
  { t = "v", n = 4, text = "In every prayer for all of you, I always pray with joy," },
  { t = "v", n = 5, text = "because of your partnership in the gospel from the first day until now," },
  { t = "v", n = 6, text = "being confident of this, that He who began a good work in you will carry it on to completion until the day of Christ Jesus." },
  { t = "v", n = 7, p = true, text = "It is right for me to feel this way about all of you, since I have you in my heart. For in my chains and in my defense and confirmation of the gospel, you are all partners in grace with me." },
  { t = "v", n = 8, text = "God is my witness how I long for all of you with the affection of Christ Jesus." },
  { t = "v", n = 9, p = true, text = "And this is my prayer: that your love may abound more and more in knowledge and depth of insight," },
  { t = "v", n = 10, text = "so that you may be able to test and prove what is best and may be pure and blameless for the day of Christ," },
  { t = "v", n = 11, text = "filled with the fruit of righteousness that comes through Jesus Christ, to the glory and praise of God." },
  { t = "h", level = 2, text = "Paul’s Trials Advance the Gospel" },
  { t = "ref", text = "(James 1:2–12)" },
  { t = "v", n = 12, p = true, text = "Now I want you to know, brothers, that my circumstances have actually served to advance the gospel." },
  { t = "v", n = 13, text = "As a result, it has become clear throughout the whole palace guard[^a] and to everyone else that I am in chains for Christ." },
  { t = "v", n = 14, text = "And most of the brothers, confident in the Lord by my chains, now dare more greatly to speak the word[^b] without fear." },
  { t = "v", n = 15, p = true, text = "It is true that some preach Christ out of envy and rivalry, but others out of goodwill." },
  { t = "v", n = 16, text = "The latter do so in love, knowing that I am appointed for the defense of the gospel.[^c]" },
  { t = "v", n = 17, text = "The former, however, preach Christ out of selfish ambition, not sincerely, supposing that they can add to the distress of my chains." },
  { t = "v", n = 18, p = true, text = "What then is the issue?[^d] Just this: that in every way, whether by false motives or true, Christ is preached. And in this I rejoice. Yes, and I will continue to rejoice," },
  { t = "v", n = 19, text = "because I know that through your prayers and the provision of the Spirit of Jesus Christ, my distress will turn out for my deliverance." },
  { t = "v", n = 20, text = "I eagerly expect and hope that I will in no way be ashamed, but will have complete boldness so that now as always Christ will be exalted in my body, whether by life or by death." },
  { t = "h", level = 2, text = "To Live Is Christ" },
  { t = "v", n = 21, p = true, text = "For to me, to live is Christ, and to die is gain." },
  { t = "v", n = 22, text = "But if I go on living in the body, this will mean fruitful labor for me. So what shall I choose? I do not know." },
  { t = "v", n = 23, text = "I am torn between the two. I desire to depart and be with Christ, which is far better indeed." },
  { t = "v", n = 24, text = "But it is more necessary for you that I remain in the body." },
  { t = "v", n = 25, p = true, text = "Convinced of this, I know that I will remain and will continue with all of you for your progress and joy in the faith," },
  { t = "v", n = 26, text = "so that through my coming to you again your exultation in Christ Jesus will resound on account of me." },
  { t = "h", level = 2, text = "Worthy of the Gospel" },
  { t = "v", n = 27, p = true, text = "Nevertheless, conduct yourselves in a manner worthy of the gospel of Christ. Then, whether I come and see you or only hear about you in my absence, I will know that you stand firm in one spirit, contending together as one[^e] for the faith of the gospel," },
  { t = "v", n = 28, text = "without being frightened in any way by those who oppose you. This is a clear sign of their destruction but of your salvation, and it is from God." },
  { t = "v", n = 29, text = "For it has been granted to you on behalf of Christ not only to believe in Him, but also to suffer for Him," },
  { t = "v", n = 30, text = "since you are encountering the same struggle you saw I had, and now hear that I still have." },
  { t = "note", id = "a", text = "Or *all the Praetorium*" },
  { t = "note", id = "b", text = "NE and WH *the word of God*" },
  { t = "note", id = "c", text = "BYZ and TR reverse the order of verses 16 and 17." },
  { t = "note", id = "d", text = "Literally *What then?*" },
  { t = "note", id = "e", text = "Or *striving together with one mind*" },
]

[[section]]
id = "2"
title = "Philippians 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "One in Christ" },
  { t = "ref", text = "(Ephesians 2:11–18)" },
  { t = "v", n = 1, p = true, text = "Therefore if you have any encouragement in Christ, if any comfort from His love, if any fellowship with the Spirit, if any affection and compassion," },
  { t = "v", n = 2, text = "then make my joy complete by being like-minded, having the same love, being united in spirit and purpose." },
  { t = "v", n = 3, p = true, text = "Do nothing out of selfish ambition or empty pride, but in humility consider others more important than yourselves." },
  { t = "v", n = 4, text = "Each of you should look not only to your own interests, but also to the interests of others." },
  { t = "h", level = 2, text = "The Mind of Christ" },
  { t = "ref", text = "(Isaiah 52:13–15)" },
  { t = "v", n = 5, p = true, text = "Let this mind be in you which was also in Christ Jesus:" },
  { t = "v", n = 6, indent = 1, p = true, text = "Who, existing in the form of God, did not consider equality with God something to be grasped,[^a]" },
  { t = "v", n = 7, indent = 1, text = "but emptied Himself, taking the form of a servant, being made in human likeness." },
  { t = "v", n = 8, indent = 1, text = "And being found in appearance as a man, He humbled Himself and became obedient to death—even death on a cross." },
  { t = "v", n = 9, indent = 1, p = true, text = "Therefore God exalted Him to the highest place and gave Him the name above all names," },
  { t = "v", n = 10, indent = 1, text = "that at the name of Jesus every knee should bow, in heaven and on earth and under the earth," },
  { t = "v", n = 11, indent = 1, text = "and every tongue confess that Jesus Christ is Lord, to the glory of God the Father." },
  { t = "h", level = 2, text = "Lights in the World" },
  { t = "ref", text = "(Matthew 5:13–16)" },
  { t = "v", n = 12, p = true, text = "Therefore, my beloved, just as you have always obeyed, not only in my presence, but now even more in my absence, continue to work out your salvation with fear and trembling." },
  { t = "v", n = 13, text = "For it is God who works in you to will and to act on behalf of His good purpose." },
  { t = "v", n = 14, p = true, text = "Do everything without complaining or arguing," },
  { t = "v", n = 15, text = "so that you may be blameless and pure, children of God without fault in a crooked and perverse generation,[^b] in which you shine as lights in the world" },
  { t = "v", n = 16, text = "as you hold forth the word of life, in order that I may boast on the day of Christ that I did not run or labor in vain." },
  { t = "v", n = 17, p = true, text = "But even if I am being poured out like a drink offering on the sacrifice and service of your faith, I am glad and rejoice with all of you." },
  { t = "v", n = 18, text = "So you too should be glad and rejoice with me." },
  { t = "h", level = 2, text = "Timothy and Epaphroditus" },
  { t = "ref", text = "(1 Corinthians 16:10–12)" },
  { t = "v", n = 19, p = true, text = "Now I hope in the Lord Jesus to send Timothy to you soon, that I also may be cheered when I learn how you are doing." },
  { t = "v", n = 20, text = "I have nobody else like him who will genuinely care for your needs." },
  { t = "v", n = 21, text = "For all the others look after their own interests, not those of Jesus Christ." },
  { t = "v", n = 22, text = "But you know Timothy’s proven worth, that as a child with his father he has served with me to advance the gospel." },
  { t = "v", n = 23, text = "So I hope to send him as soon as I see what happens with me." },
  { t = "v", n = 24, text = "And I trust in the Lord that I myself will come soon." },
  { t = "v", n = 25, p = true, text = "But I thought it necessary to send back to you Epaphroditus, my brother, fellow worker, and fellow soldier, who is also your messenger and minister to my needs." },
  { t = "v", n = 26, text = "For he has been longing for all of you and is distressed because you heard he was ill." },
  { t = "v", n = 27, text = "He was sick indeed, nearly unto death. But God had mercy on him, and not only on him but also on me, to spare me sorrow upon sorrow." },
  { t = "v", n = 28, p = true, text = "Therefore I am all the more eager to send him, so that when you see him again you may rejoice, and I may be less anxious." },
  { t = "v", n = 29, text = "Welcome him in the Lord with great joy, and honor men like him," },
  { t = "v", n = 30, text = "because he nearly died for the work of Christ, risking his life to make up for your deficit of service to me." },
  { t = "note", id = "a", text = "Or *something to be exploited*" },
  { t = "note", id = "b", text = "Deuteronomy 32:5" },
]

[[section]]
id = "3"
title = "Philippians 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "Righteousness through Faith in Christ" },
  { t = "ref", text = "(Romans 3:21–31)" },
  { t = "v", n = 1, p = true, text = "Finally, my brothers, rejoice in the Lord. It is no trouble for me to write the same things to you again, and it is a safeguard for you." },
  { t = "v", n = 2, p = true, text = "Watch out for those dogs, those workers of evil, those mutilators of the flesh!" },
  { t = "v", n = 3, text = "For it is we who are the circumcision, we who worship by the Spirit of God, who glory in Christ Jesus, and who put no confidence in the flesh—" },
  { t = "v", n = 4, text = "though I myself could have such confidence. If anyone else thinks he has grounds for confidence in the flesh, I have more:" },
  { t = "v", n = 5, text = "circumcised on the eighth day, of the people of Israel, of the tribe of Benjamin; a Hebrew of Hebrews; as to the law, a Pharisee;" },
  { t = "v", n = 6, text = "as to zeal, persecuting the church; as to righteousness in the law, faultless." },
  { t = "v", n = 7, p = true, text = "But whatever was gain to me I count as loss for the sake of Christ." },
  { t = "v", n = 8, text = "More than that, I count all things as loss compared to the surpassing excellence of knowing Christ Jesus my Lord, for whom I have lost all things. I consider them rubbish, that I may gain Christ" },
  { t = "v", n = 9, text = "and be found in Him, not having my own righteousness from the law, but that which is through faith in Christ,[^a] the righteousness from God on the basis of faith." },
  { t = "v", n = 10, p = true, text = "I want to know Christ and the power of His resurrection and the fellowship of His sufferings, being conformed to Him in His death," },
  { t = "v", n = 11, text = "and so, somehow, to attain to the resurrection from the dead." },
  { t = "h", level = 2, text = "Pressing on toward the Goal" },
  { t = "v", n = 12, p = true, text = "Not that I have already obtained all this, or have already been made perfect, but I press on to take hold of that for which Christ Jesus took hold of me." },
  { t = "v", n = 13, text = "Brothers, I do not consider myself yet to have taken hold of it. But one thing I do: Forgetting what is behind and straining toward what is ahead," },
  { t = "v", n = 14, text = "I press on toward the goal to win the prize of God’s heavenly calling in Christ Jesus." },
  { t = "v", n = 15, p = true, text = "All of us who are mature should embrace this point of view. And if you think differently about some issue, God will reveal this to you as well." },
  { t = "v", n = 16, text = "Nevertheless, we must live up to what we have already attained." },
  { t = "h", level = 2, text = "Citizenship in Heaven" },
  { t = "v", n = 17, p = true, text = "Join one another in following my example, brothers, and carefully observe those who walk according to the pattern we set for you." },
  { t = "v", n = 18, text = "For as I have often told you before, and now say again even with tears: Many live as enemies of the cross of Christ." },
  { t = "v", n = 19, text = "Their end is destruction, their god is their belly, and their glory is in their shame. Their minds are set on earthly things." },
  { t = "v", n = 20, p = true, text = "But our citizenship is in heaven, and we eagerly await a Savior from there, the Lord Jesus Christ," },
  { t = "v", n = 21, text = "who, by the power that enables Him to subject all things to Himself, will transform our lowly bodies to be like His glorious body." },
  { t = "note", id = "a", text = "Or *through the faithfulness of Christ*" },
]

[[section]]
id = "4"
title = "Philippians 4"
level = 1
blocks = [
  { t = "h", level = 2, text = "Rejoice in the Lord" },
  { t = "v", n = 1, p = true, text = "Therefore, my brothers, whom I love and long for, my joy and crown, that is how you must stand firm in the Lord, my beloved." },
  { t = "v", n = 2, p = true, text = "I urge Euodia and Syntyche to agree with each other in the Lord." },
  { t = "v", n = 3, text = "Yes, and I ask you, my true yokefellow,[^a] to help these women who have contended at my side for the gospel, along with Clement and the rest of my fellow workers, whose names are in the Book of Life." },
  { t = "v", n = 4, p = true, text = "Rejoice in the Lord always. I will say it again: Rejoice!" },
  { t = "v", n = 5, text = "Let your gentleness be apparent to all. The Lord is near." },
  { t = "v", n = 6, p = true, text = "Be anxious for nothing, but in everything, by prayer and petition, with thanksgiving, present your requests to God." },
  { t = "v", n = 7, text = "And the peace of God, which surpasses all understanding, will guard your hearts and your minds in Christ Jesus." },
  { t = "v", n = 8, p = true, text = "Finally, brothers, whatever is true, whatever is honorable, whatever is right, whatever is pure, whatever is lovely, whatever is admirable—if anything is excellent or praiseworthy—think on these things." },
  { t = "v", n = 9, text = "Whatever you have learned or received or heard from me, or seen in me, put it into practice. And the God of peace will be with you." },
  { t = "h", level = 2, text = "The Generosity of the Philippians" },
  { t = "ref", text = "(2 Corinthians 8:1–15)" },
  { t = "v", n = 10, p = true, text = "Now I rejoice greatly in the Lord that at last you have revived your concern for me. You were indeed concerned, but you had no opportunity to show it." },
  { t = "v", n = 11, text = "I am not saying this out of need, for I have learned to be content regardless of my circumstances." },
  { t = "v", n = 12, text = "I know how to live humbly, and I know how to abound. In any and every situation I have learned the secret of being filled and being hungry, of having plenty and having need." },
  { t = "v", n = 13, text = "I can do all things through Christ who gives me strength.[^b]" },
  { t = "v", n = 14, p = true, text = "Nevertheless, you have done well to share in my affliction." },
  { t = "v", n = 15, text = "And as you Philippians know, in the early days of the gospel, when I left Macedonia, no church but you partnered with me in the matter of giving and receiving." },
  { t = "v", n = 16, text = "For even while I was in Thessalonica, you provided for my needs again and again." },
  { t = "v", n = 17, p = true, text = "Not that I am seeking a gift, but I am looking for the fruit that may be credited to your account." },
  { t = "v", n = 18, text = "I have all I need and more, now that I have received your gifts from Epaphroditus. They are a fragrant offering, an acceptable sacrifice, well-pleasing to God." },
  { t = "v", n = 19, p = true, text = "And my God will supply all your needs according to His glorious riches in Christ Jesus." },
  { t = "v", n = 20, text = "To our God and Father be glory forever and ever. Amen." },
  { t = "h", level = 2, text = "Final Greetings" },
  { t = "ref", text = "(Ephesians 6:21–24; 2 Timothy 4:19–22)" },
  { t = "v", n = 21, p = true, text = "Greet all the saints in Christ Jesus. The brothers who are with me send you greetings." },
  { t = "v", n = 22, p = true, text = "All the saints send you greetings, especially those from the household of Caesar." },
  { t = "v", n = 23, p = true, text = "The grace of the Lord Jesus Christ be with your spirit.[^c]" },
  { t = "note", id = "a", text = "Or *I ask you, loyal Syzygus*" },
  { t = "note", id = "b", text = "NA, SBL, NE, and WH *in the One who gives me strength.* BYZ and TR *in Christ who gives me strength.*" },
  { t = "note", id = "c", text = "BYZ and TR include *Amen.*" },
]

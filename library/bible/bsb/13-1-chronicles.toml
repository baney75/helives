[[section]]
id = "1"
title = "1 Chronicles 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "From Adam to Abraham" },
  { t = "ref", text = "(Genesis 5:1–32; Genesis 10:1–32; Genesis 11:10–26)" },
  { t = "v", n = 1, p = true, text = "Adam, Seth, Enosh," },
  { t = "v", n = 2, p = true, text = "Kenan, Mahalalel, Jared," },
  { t = "v", n = 3, p = true, text = "Enoch, Methuselah, Lamech, Noah." },
  { t = "v", n = 4, p = true, text = "The sons of Noah:[^a] Shem, Ham, and Japheth." },
  { t = "v", n = 5, indent = 1, p = true, text = "The sons of Japheth: Gomer, Magog, Madai, Javan, Tubal, Meshech, and Tiras." },
  { t = "v", n = 6, indent = 2, p = true, text = "The sons of Gomer: Ashkenaz, Riphath,[^b] and Togarmah." },
  { t = "v", n = 7, indent = 2, p = true, text = "And the sons of Javan: Elishah, Tarshish, the Kittites, and the Rodanites." },
  { t = "v", n = 8, indent = 1, p = true, text = "The sons of Ham: Cush, Mizraim, Put, and Canaan." },
  { t = "v", n = 9, indent = 2, p = true, text = "The sons of Cush: Seba, Havilah, Sabta,[^c] Raamah, and Sabteca. The sons of Raamah: Sheba and Dedan." },
  { t = "v", n = 10, indent = 2, p = true, text = "Cush was the father of Nimrod, who began to be a mighty one[^d] on the earth." },
  { t = "v", n = 11, indent = 2, p = true, text = "Mizraim was the father of the Ludites, the Anamites, the Lehabites, the Naphtuhites," },
  { t = "v", n = 12, text = "the Pathrusites, the Casluhites (from whom the Philistines came), and the Caphtorites.[^e]" },
  { t = "v", n = 13, indent = 2, p = true, text = "And Canaan was the father of Sidon his firstborn,[^f] and of the Hittites,[^g]" },
  { t = "v", n = 14, text = "the Jebusites, the Amorites, the Girgashites," },
  { t = "v", n = 15, text = "the Hivites, the Arkites, the Sinites," },
  { t = "v", n = 16, text = "the Arvadites, the Zemarites, and the Hamathites." },
  { t = "v", n = 17, indent = 1, p = true, text = "The sons of Shem: Elam, Asshur, Arphaxad, Lud, and Aram. The sons of Aram:[^h] Uz, Hul, Gether, and Meshech.[^i]" },
  { t = "v", n = 18, indent = 2, p = true, text = "Arphaxad was the father of Shelah, and Shelah was the father of Eber." },
  { t = "v", n = 19, indent = 2, p = true, text = "Two sons were born to Eber: One was named Peleg,[^j] because in his days the earth was divided, and his brother was named Joktan." },
  { t = "v", n = 20, indent = 2, p = true, text = "And Joktan was the father of Almodad, Sheleph, Hazarmaveth, Jerah," },
  { t = "v", n = 21, text = "Hadoram, Uzal, Diklah," },
  { t = "v", n = 22, text = "Obal,[^k] Abimael, Sheba," },
  { t = "v", n = 23, text = "Ophir, Havilah, and Jobab. All these were sons of Joktan." },
  { t = "v", n = 24, indent = 2, p = true, text = "So from Shem came Arphaxad, Shelah,[^l]" },
  { t = "v", n = 25, text = "Eber, Peleg, Reu," },
  { t = "v", n = 26, text = "Serug, Nahor, Terah," },
  { t = "v", n = 27, text = "and Abram (that is, Abraham)." },
  { t = "h", level = 2, text = "The Descendants of Abraham" },
  { t = "ref", text = "(Genesis 25:12–18)" },
  { t = "v", n = 28, p = true, text = "The sons of Abraham were Isaac and Ishmael." },
  { t = "v", n = 29, text = "These are their genealogies: Nebaioth the firstborn of Ishmael, then Kedar, Adbeel, Mibsam," },
  { t = "v", n = 30, text = "Mishma, Dumah, Massa, Hadad, Tema," },
  { t = "v", n = 31, text = "Jetur, Naphish, and Kedemah. These were the sons of Ishmael." },
  { t = "v", n = 32, indent = 1, p = true, text = "The sons born to Keturah, Abraham’s concubine: Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. The sons of Jokshan: Sheba and Dedan." },
  { t = "v", n = 33, indent = 1, p = true, text = "The sons of Midian: Ephah, Epher, Hanoch, Abida, and Eldaah. All of these were Keturah’s sons." },
  { t = "v", n = 34, indent = 1, p = true, text = "Abraham was the father of Isaac. The sons of Isaac: Esau and Israel." },
  { t = "h", level = 2, text = "The Descendants of Esau" },
  { t = "ref", text = "(Genesis 36:1–19)" },
  { t = "v", n = 35, indent = 1, p = true, text = "The sons of Esau: Eliphaz, Reuel, Jeush, Jalam, and Korah." },
  { t = "v", n = 36, indent = 2, p = true, text = "The sons of Eliphaz: Teman, Omar, Zepho,[^m] Gatam, and Kenaz; and by Timna, Amalek." },
  { t = "v", n = 37, indent = 2, p = true, text = "The sons of Reuel: Nahath, Zerah, Shammah, and Mizzah." },
  { t = "h", level = 2, text = "The Descendants of Seir" },
  { t = "ref", text = "(Genesis 36:20–30)" },
  { t = "v", n = 38, indent = 1, p = true, text = "The sons of Seir: Lotan, Shobal, Zibeon, Anah, Dishon, Ezer, and Dishan." },
  { t = "v", n = 39, indent = 2, p = true, text = "The sons of Lotan: Hori and Homam.[^n] Timna was Lotan’s sister." },
  { t = "v", n = 40, indent = 2, p = true, text = "The sons of Shobal: Alvan,[^o] Manahath, Ebal, Shepho,[^p] and Onam. The sons of Zibeon: Aiah and Anah." },
  { t = "v", n = 41, indent = 2, p = true, text = "The son[^q] of Anah: Dishon. The sons of Dishon: Hemdan,[^r] Eshban, Ithran, and Cheran." },
  { t = "v", n = 42, indent = 2, p = true, text = "The sons of Ezer: Bilhan, Zaavan, and Akan.[^s] The sons of Dishan: Uz and Aran." },
  { t = "h", level = 2, text = "The Kings of Edom" },
  { t = "ref", text = "(Genesis 36:31–43)" },
  { t = "v", n = 43, p = true, text = "These are the kings who reigned in the land of Edom before any king reigned over the Israelites:[^t] Bela son of Beor. His city was named Dinhabah." },
  { t = "v", n = 44, indent = 1, p = true, text = "When Bela died, Jobab son of Zerah from Bozrah reigned in his place." },
  { t = "v", n = 45, indent = 1, p = true, text = "When Jobab died, Husham from the land of the Temanites reigned in his place." },
  { t = "v", n = 46, indent = 1, p = true, text = "When Husham died, Hadad son of Bedad, who defeated Midian in the country of Moab, reigned in his place. And the name of his city was Avith." },
  { t = "v", n = 47, indent = 1, p = true, text = "When Hadad died, Samlah from Masrekah reigned in his place." },
  { t = "v", n = 48, indent = 1, p = true, text = "When Samlah died, Shaul from Rehoboth on the Euphrates[^u] reigned in his place." },
  { t = "v", n = 49, indent = 1, p = true, text = "When Shaul died, Baal-hanan son of Achbor reigned in his place." },
  { t = "v", n = 50, indent = 1, p = true, text = "When Baal-hanan died, Hadad reigned in his place. His city was named Pau,[^v] and his wife’s name was Mehetabel daughter of Matred, the daughter of Me-zahab." },
  { t = "v", n = 51, indent = 1, p = true, text = "Then Hadad died. Now the chiefs of Edom were Timna, Alvah, Jetheth," },
  { t = "v", n = 52, text = "Oholibamah, Elah, Pinon," },
  { t = "v", n = 53, text = "Kenaz, Teman, Mibzar," },
  { t = "v", n = 54, text = "Magdiel, and Iram. These were the chiefs of Edom." },
  { t = "note", id = "a", text = "LXX; Hebrew does not include *The sons of Noah:*; see Genesis 5:32." },
  { t = "note", id = "b", text = "Many Hebrew manuscripts and Vulgate (see also LXX and Genesis 10:3); most Hebrew manuscripts *Diphath*" },
  { t = "note", id = "c", text = "*Sabta* is a variant of *Sabtah*; see Genesis 10:7." },
  { t = "note", id = "d", text = "Or *who established himself as a mighty warrior*" },
  { t = "note", id = "e", text = "Some translators adjust the Hebrew word order to *the Casluhites, and the Caphtorites (from whom the Philistines came)*; see also Jeremiah 47:4 and Amos 9:7." },
  { t = "note", id = "f", text = "Or *of the Sidonians, the foremost*" },
  { t = "note", id = "g", text = "Hebrew *and of Heth*" },
  { t = "note", id = "h", text = "One Hebrew manuscript and some LXX manuscripts (see also Genesis 10:23); most Hebrew manuscripts do not include *The sons of Aram*." },
  { t = "note", id = "i", text = "*Meshech* is a variant of *Mash*; see Genesis 10:23." },
  { t = "note", id = "j", text = "*Peleg* means *division*." },
  { t = "note", id = "k", text = "LXX and Syriac (see also Genesis 10:28); Hebrew *Ebal*" },
  { t = "note", id = "l", text = "Literally *Shem, Arphaxad, Shelah*; some LXX manuscripts *Shem, Arphaxad, Cainan, Shelah*; see also Genesis 10:24 LXX and Luke 3:35–36." },
  { t = "note", id = "m", text = "Many Hebrew manuscripts, some LXX manuscripts, and Syriac (see also Genesis 36:11); most Hebrew manuscripts *Zephi*" },
  { t = "note", id = "n", text = "*Homam* is a variant of *Hemam*; see Genesis 36:22." },
  { t = "note", id = "o", text = "LXX (see also Genesis 36:23); Hebrew *Alian*" },
  { t = "note", id = "p", text = "LXX (see also Genesis 36:23); Hebrew *Shephi*" },
  { t = "note", id = "q", text = "Hebrew *sons*" },
  { t = "note", id = "r", text = "LXX (see also Genesis 36:26); Hebrew *Hamran*" },
  { t = "note", id = "s", text = "LXX (see also Genesis 36:27); Hebrew *Jaakan*" },
  { t = "note", id = "t", text = "Or *before an Israelite king ruled over them*" },
  { t = "note", id = "u", text = "Hebrew *the River*" },
  { t = "note", id = "v", text = "Many MT manuscripts, some LXX manuscripts, Vulgate, and Syriac (see also Genesis 36:39); most MT manuscripts *Pai*" },
]

[[section]]
id = "2"
title = "1 Chronicles 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Sons of Israel" },
  { t = "ref", text = "(Genesis 35:21–26; Genesis 38:1–30)" },
  { t = "v", n = 1, p = true, text = "These were the sons of Israel: Reuben, Simeon, Levi, Judah, Issachar, Zebulun," },
  { t = "v", n = 2, text = "Dan, Joseph, Benjamin, Naphtali, Gad, and Asher." },
  { t = "v", n = 3, indent = 1, p = true, text = "The sons of Judah: Er, Onan, and Shelah. These three were born to him by Bath-shua the Canaanite. Er, Judah’s firstborn, was wicked in the sight of the LORD. So the LORD put him to death." },
  { t = "v", n = 4, indent = 2, p = true, text = "Tamar, Judah’s daughter-in-law, bore to him Perez and Zerah. Judah had five sons in all." },
  { t = "v", n = 5, indent = 1, p = true, text = "The sons of Perez: Hezron and Hamul." },
  { t = "v", n = 6, indent = 1, p = true, text = "The sons of Zerah: Zimri,[^a] Ethan, Heman, Calcol, and Dara[^b]—five in all." },
  { t = "v", n = 7, indent = 1, p = true, text = "The son[^c] of Carmi: Achar,[^d] who brought trouble upon Israel by violating the ban on devoted things." },
  { t = "v", n = 8, indent = 1, p = true, text = "The son of Ethan: Azariah." },
  { t = "v", n = 9, indent = 1, p = true, text = "The sons who were born to Hezron: Jerahmeel, Ram, and Caleb.[^e]" },
  { t = "v", n = 10, indent = 1, p = true, text = "Ram was the father of Amminadab, and Amminadab was the father of Nahshon, a leader of the descendants of Judah." },
  { t = "v", n = 11, indent = 1, p = true, text = "Nahshon was the father of Salmon,[^f] and Salmon was the father of Boaz." },
  { t = "v", n = 12, indent = 1, p = true, text = "Boaz was the father of Obed, and Obed was the father of Jesse." },
  { t = "v", n = 13, indent = 1, p = true, text = "Jesse was the father of Eliab his firstborn; Abinadab was born second, Shimea[^g] third," },
  { t = "v", n = 14, text = "Nethanel fourth, Raddai fifth," },
  { t = "v", n = 15, text = "Ozem sixth, and David seventh." },
  { t = "v", n = 16, text = "Their sisters were Zeruiah and Abigail. And the three sons of Zeruiah were Abishai, Joab, and Asahel." },
  { t = "v", n = 17, text = "Abigail was the mother of Amasa, whose father was Jether[^h] the Ishmaelite." },
  { t = "v", n = 18, indent = 1, p = true, text = "Caleb son of Hezron had children by his wife Azubah and by Jerioth. These were the sons of Azubah: Jesher, Shobab, and Ardon." },
  { t = "v", n = 19, text = "When Azubah died, Caleb married Ephrath,[^i] who bore to him Hur." },
  { t = "v", n = 20, text = "Hur was the father of Uri, and Uri was the father of Bezalel." },
  { t = "v", n = 21, indent = 1, p = true, text = "Later, Hezron slept with the daughter of Machir the father of Gilead. He had married her when he was sixty years old, and she bore to him Segub." },
  { t = "v", n = 22, text = "Segub was the father of Jair, who had twenty-three cities in the land of Gilead." },
  { t = "v", n = 23, text = "But Geshur and Aram captured Havvoth-jair,[^j] along with Kenath and its sixty surrounding villages. All these were descendants of Machir the father of Gilead." },
  { t = "v", n = 24, indent = 1, p = true, text = "After Hezron died in Caleb-ephrathah, his wife Abijah bore[^k] to him Ashhur the father[^l] of Tekoa." },
  { t = "v", n = 25, indent = 1, p = true, text = "The sons of Jerahmeel the firstborn of Hezron: Ram his firstborn, Bunah, Oren, Ozem, and Ahijah." },
  { t = "v", n = 26, text = "Jerahmeel had another wife named Atarah, who was the mother of Onam." },
  { t = "v", n = 27, indent = 1, p = true, text = "The sons of Ram the firstborn of Jerahmeel: Maaz, Jamin, and Eker." },
  { t = "v", n = 28, indent = 1, p = true, text = "The sons of Onam: Shammai and Jada. The sons of Shammai: Nadab and Abishur." },
  { t = "v", n = 29, text = "Abishur’s wife was named Abihail, and she bore to him Ahban and Molid." },
  { t = "v", n = 30, indent = 1, p = true, text = "The sons of Nadab: Seled and Appaim. Seled died without children." },
  { t = "v", n = 31, indent = 1, p = true, text = "The son[^m] of Appaim: Ishi. The son of Ishi: Sheshan. The son of Sheshan: Ahlai." },
  { t = "v", n = 32, indent = 1, p = true, text = "The sons of Jada the brother of Shammai: Jether and Jonathan. Jether died without children." },
  { t = "v", n = 33, indent = 1, p = true, text = "The sons of Jonathan: Peleth and Zaza. These were the descendants of Jerahmeel." },
  { t = "v", n = 34, indent = 1, p = true, text = "Sheshan had no sons, but only daughters. He also had an Egyptian servant named Jarha." },
  { t = "v", n = 35, text = "Sheshan gave his daughter in marriage to his servant Jarha, and she bore to him Attai." },
  { t = "v", n = 36, indent = 1, p = true, text = "Attai was the father of Nathan, Nathan was the father of Zabad," },
  { t = "v", n = 37, text = "Zabad was the father of Ephlal, Ephlal was the father of Obed," },
  { t = "v", n = 38, text = "Obed was the father of Jehu, Jehu was the father of Azariah," },
  { t = "v", n = 39, text = "Azariah was the father of Helez, Helez was the father of Elasah," },
  { t = "v", n = 40, text = "Elasah was the father of Sismai, Sismai was the father of Shallum," },
  { t = "v", n = 41, text = "Shallum was the father of Jekamiah, and Jekamiah was the father of Elishama." },
  { t = "v", n = 42, indent = 1, p = true, text = "The sons of Caleb the brother of Jerahmeel: Mesha[^n] his firstborn, who was the father of Ziph, and Mareshah his second son, who was the father of Hebron." },
  { t = "v", n = 43, indent = 1, p = true, text = "The sons of Hebron: Korah, Tappuah, Rekem, and Shema." },
  { t = "v", n = 44, text = "Shema was the father of Raham the father of Jorkeam, and Rekem was the father of Shammai." },
  { t = "v", n = 45, text = "The son of Shammai was Maon, and Maon was the father of Beth-zur." },
  { t = "v", n = 46, indent = 1, p = true, text = "Caleb’s concubine Ephah was the mother of Haran, Moza, and Gazez. Haran was the father of Gazez." },
  { t = "v", n = 47, indent = 1, p = true, text = "The sons of Jahdai: Regem, Jotham, Geshan, Pelet, Ephah, and Shaaph." },
  { t = "v", n = 48, indent = 1, p = true, text = "Caleb’s concubine Maacah was the mother of Sheber and Tirhanah." },
  { t = "v", n = 49, text = "She was also the mother of Shaaph father of Madmannah, and of Sheva father of Machbenah and Gibea. Caleb’s daughter was Acsah." },
  { t = "v", n = 50, text = "These were the descendants of Caleb. The sons[^o] of Hur the firstborn of Ephrathah:[^p] Shobal the father of Kiriath-jearim," },
  { t = "v", n = 51, text = "Salma the father of Bethlehem, and Hareph the father of Beth-gader." },
  { t = "v", n = 52, indent = 1, p = true, text = "These were the descendants of Shobal the father of Kiriath-jearim: Haroeh, half the Manahathites," },
  { t = "v", n = 53, text = "and the clans of Kiriath-jearim—the Ithrites, Puthites, Shumathites, and Mishraites. From these descended the Zorathites and Eshtaolites." },
  { t = "v", n = 54, indent = 1, p = true, text = "The descendants of Salma: Bethlehem, the Netophathites, Atroth-beth-joab, half the Manahathites, the Zorites," },
  { t = "v", n = 55, text = "and the clans of the scribes[^q] who lived at Jabez—the Tirathites, Shimeathites, and Sucathites. These are the Kenites who came from Hammath, the father of the house of Rechab.[^r]" },
  { t = "note", id = "a", text = "*Zimri* is a variant of *Zabdi*; see Joshua 7:1." },
  { t = "note", id = "b", text = "Most Hebrew manuscripts; many Hebrew manuscripts, some LXX manuscripts, and Syriac (see also 1 Kings 4:31) *Darda*" },
  { t = "note", id = "c", text = "Hebrew *sons*" },
  { t = "note", id = "d", text = "*Achar* means *troubler*; also called *Achan* in Joshua 7 and Joshua 22." },
  { t = "note", id = "e", text = "Hebrew *Chelubai*, a variant of *Caleb*; see verse 18." },
  { t = "note", id = "f", text = "LXX (see also Ruth 4:20–21); Hebrew *Salma*; twice in this verse" },
  { t = "note", id = "g", text = "*Shimea* is a variant of *Shammah*, *Shimeah*, and *Shimei*; see 1 Samuel 16:9, 2 Samuel 13:3, and 2 Samuel 21:21." },
  { t = "note", id = "h", text = "*Jether* is a variant of *Ithra*; see 2 Samuel 17:25." },
  { t = "note", id = "i", text = "*Ephrath* is a variant of *Ephrathah*; see verse 50." },
  { t = "note", id = "j", text = "Or *the villages of Jair*" },
  { t = "note", id = "k", text = "Or *After Hezron died, Caleb had relations with Ephrathah, the wife of Hezron his father, and she bore*; see also LXX." },
  { t = "note", id = "l", text = "Or *the founder*; also in verses 42, 45, 49, and possibly elsewhere" },
  { t = "note", id = "m", text = "Hebrew *sons*; three times in this verse" },
  { t = "note", id = "n", text = "Hebrew; LXX *Mareshah*" },
  { t = "note", id = "o", text = "LXX and Vulgate; Hebrew *son*" },
  { t = "note", id = "p", text = "*Ephrathah* is a variant of *Ephrath*; see verse 19." },
  { t = "note", id = "q", text = "Or *of the Sopherites*" },
  { t = "note", id = "r", text = "Or *the father of Beth-rekab* or *the founder of the house of Rechab*" },
]

[[section]]
id = "3"
title = "1 Chronicles 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Descendants of David" },
  { t = "ref", text = "(2 Samuel 3:1–5)" },
  { t = "v", n = 1, p = true, text = "These were the sons of David who were born to him in Hebron: The firstborn was Amnon by Ahinoam of Jezreel; the second was Daniel by Abigail of Carmel;" },
  { t = "v", n = 2, indent = 1, p = true, text = "the third was Absalom the son of Maacah daughter of King Talmai of Geshur; the fourth was Adonijah the son of Haggith;" },
  { t = "v", n = 3, indent = 1, p = true, text = "the fifth was Shephatiah by Abital; and the sixth was Ithream by his wife Eglah." },
  { t = "v", n = 4, indent = 1, p = true, text = "These six sons were born to David in Hebron, where he reigned seven years and six months. And David reigned in Jerusalem thirty-three years," },
  { t = "v", n = 5, text = "and these sons were born to him in Jerusalem: Shimea,[^a] Shobab, Nathan, and Solomon. These four were born to him by Bathsheba[^b] daughter of Ammiel.[^c]" },
  { t = "v", n = 6, indent = 1, p = true, text = "David’s other sons were Ibhar,[^d] Elishua,[^e] Eliphelet," },
  { t = "v", n = 7, text = "Nogah, Nepheg, Japhia," },
  { t = "v", n = 8, text = "Elishama, Eliada, and Eliphelet—nine in all." },
  { t = "v", n = 9, indent = 1, p = true, text = "These were all the sons of David, besides the sons by his concubines. And Tamar was their sister." },
  { t = "h", level = 2, text = "The Descendants of Solomon" },
  { t = "v", n = 10, indent = 1, p = true, text = "Solomon’s son was Rehoboam: Abijah was his son, Asa his son, Jehoshaphat his son," },
  { t = "v", n = 11, text = "Joram[^f] his son, Ahaziah his son, Joash his son," },
  { t = "v", n = 12, text = "Amaziah his son, Azariah[^g] his son, Jotham his son," },
  { t = "v", n = 13, text = "Ahaz his son, Hezekiah his son, Manasseh his son," },
  { t = "v", n = 14, text = "Amon his son, and Josiah his son." },
  { t = "v", n = 15, indent = 1, p = true, text = "The sons of Josiah: Johanan was the firstborn, Jehoiakim the second, Zedekiah the third, and Shallum[^h] the fourth." },
  { t = "v", n = 16, indent = 1, p = true, text = "The successors of Jehoiakim: Jeconiah[^i] his son, and Zedekiah." },
  { t = "h", level = 2, text = "The Royal Line After the Exile" },
  { t = "v", n = 17, indent = 1, p = true, text = "The descendants of Jeconiah the captive: Shealtiel his son," },
  { t = "v", n = 18, text = "Malchiram, Pedaiah, Shenazzar, Jekamiah, Hoshama, and Nedabiah." },
  { t = "v", n = 19, indent = 1, p = true, text = "The sons of Pedaiah: Zerubbabel and Shimei. The children of Zerubbabel: Meshullam and Hananiah, their sister Shelomith," },
  { t = "v", n = 20, text = "and five others: Hashubah, Ohel, Berechiah, Hasadiah, and Jushab-hesed." },
  { t = "v", n = 21, indent = 1, p = true, text = "The descendants of Hananiah: Pelatiah, Jeshaiah, and the sons of Rephaiah, of Arnan, of Obadiah, and of Shecaniah." },
  { t = "v", n = 22, indent = 1, p = true, text = "The six descendants of Shecaniah were Shemaiah and his sons: Hattush, Igal, Bariah, Neariah, and Shaphat." },
  { t = "v", n = 23, indent = 1, p = true, text = "The sons of Neariah: Elioenai, Hizkiah, and Azrikam—three in all." },
  { t = "v", n = 24, indent = 1, p = true, text = "The sons of Elioenai: Hodaviah, Eliashib, Pelaiah, Akkub, Johanan, Delaiah, and Anani—seven in all." },
  { t = "note", id = "a", text = "*Shimea* is a variant of *Shammua*; see 2 Samuel 5:14 and 1 Chronicles 14:4." },
  { t = "note", id = "b", text = "One Hebrew manuscript and Vulgate (see also LXX and 2 Samuel 11:3); most Hebrew manuscripts *Bath-shua*" },
  { t = "note", id = "c", text = "*Ammiel* is a variant of *Eliam*; see 2 Samuel 11:3." },
  { t = "note", id = "d", text = "Hebrew does not include *David’s other sons were*." },
  { t = "note", id = "e", text = "Two Hebrew manuscripts (see also 2 Samuel 5:15 and 1 Chronicles 14:5); most Hebrew manuscripts *Elishama*" },
  { t = "note", id = "f", text = "*Joram* is a variant spelling of *Jehoram*." },
  { t = "note", id = "g", text = "*Azariah* is also called *Uzziah*; see 2 Chronicles 26:1." },
  { t = "note", id = "h", text = "*Shallum* is another name for *Jehoahaz*." },
  { t = "note", id = "i", text = "*Jeconiah* is a variant of *Jehoiachin*; also in verse 17; see 2 Kings 24:6." },
]

[[section]]
id = "4"
title = "1 Chronicles 4"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Descendants of Judah" },
  { t = "v", n = 1, p = true, text = "The descendants of Judah: Perez, Hezron, Carmi, Hur, and Shobal." },
  { t = "v", n = 2, indent = 1, p = true, text = "Reaiah son of Shobal was the father of Jahath, and Jahath was the father of Ahumai and Lahad. These were the clans of the Zorathites." },
  { t = "v", n = 3, indent = 1, p = true, text = "These were the sons[^a] of Etam: Jezreel, Ishma, and Idbash. And their sister was named Hazzelelponi." },
  { t = "v", n = 4, text = "Penuel was the father[^b] of Gedor, and Ezer was the father of Hushah. These were the descendants of Hur, the firstborn of Ephrathah and the father of Bethlehem." },
  { t = "v", n = 5, indent = 1, p = true, text = "Ashhur the father of Tekoa had two wives, Helah and Naarah." },
  { t = "v", n = 6, indent = 2, p = true, text = "Naarah bore to him Ahuzzam, Hepher, Temeni, and Haahashtari. These were the descendants of Naarah." },
  { t = "v", n = 7, indent = 2, p = true, text = "The sons of Helah were Zereth, Zohar,[^c] Ethnan," },
  { t = "v", n = 8, text = "and Koz, who was the father of Anub and Zobebah and of the clans of Aharhel son of Harum." },
  { t = "h", level = 2, text = "The Prayer of Jabez" },
  { t = "v", n = 9, indent = 1, p = true, text = "Now Jabez was more honorable than his brothers. His mother had named him Jabez,[^d] saying, “Because I bore him in pain.”" },
  { t = "v", n = 10, indent = 1, p = true, text = "And Jabez called out to the God of Israel, “If only You would bless me and enlarge my territory! May Your hand be with me and keep me from harm, so that I will be free from pain.” And God granted the request of Jabez." },
  { t = "h", level = 2, text = "More Descendants of Judah" },
  { t = "v", n = 11, indent = 1, p = true, text = "Chelub the brother of Shuhah was the father of Mehir, who was the father of Eshton." },
  { t = "v", n = 12, text = "Eshton was the father of Beth-rapha, of Paseah, and of Tehinnah the father of Ir-nahash. These were the men of Recah." },
  { t = "v", n = 13, indent = 1, p = true, text = "The sons of Kenaz: Othniel and Seraiah. The sons of Othniel: Hathath and Meonothai.[^e]" },
  { t = "v", n = 14, indent = 1, p = true, text = "Meonothai was the father of Ophrah, and Seraiah was the father of Joab, the father of those living in Ge-harashim, which was given this name because its people were craftsmen.[^f]" },
  { t = "v", n = 15, indent = 1, p = true, text = "The sons of Caleb son of Jephunneh: Iru, Elah, and Naam. The son[^g] of Elah: Kenaz." },
  { t = "v", n = 16, indent = 1, p = true, text = "The sons of Jehallelel: Ziph, Ziphah, Tiria, and Asarel." },
  { t = "v", n = 17, indent = 1, p = true, text = "The sons of Ezrah: Jether, Mered, Epher, and Jalon. And Mered’s wife Bithiah gave birth[^h] to Miriam, Shammai, and Ishbah the father of Eshtemoa." },
  { t = "v", n = 18, text = "These were the children of Pharaoh’s daughter Bithiah.[^i] Mered also took a Judean[^j] wife, who gave birth to Jered the father of Gedor, Heber the father of Soco, and Jekuthiel the father of Zanoah." },
  { t = "v", n = 19, indent = 1, p = true, text = "The sons of Hodiah’s wife, the sister of Naham, were the fathers of Keilah the Garmite and of Eshtemoa the Maacathite.[^k]" },
  { t = "v", n = 20, indent = 1, p = true, text = "The sons of Shimon: Amnon, Rinnah, Ben-hanan, and Tilon. The descendants of Ishi: Zoheth and Ben-zoheth." },
  { t = "v", n = 21, indent = 1, p = true, text = "The sons of Shelah son of Judah: Er the father of Lecah, Laadah the father of Mareshah and the clans of the linen workers at Beth-ashbea," },
  { t = "v", n = 22, text = "Jokim, the men of Cozeba, and Joash and Saraph, who ruled in Moab and Jashubi-lehem. (These names are from ancient records.)" },
  { t = "v", n = 23, text = "These were the potters who lived at Netaim and Gederah. They lived there in the service of the king." },
  { t = "h", level = 2, text = "The Descendants of Simeon" },
  { t = "v", n = 24, p = true, text = "The descendants of Simeon: Nemuel, Jamin, Jarib, Zerah,[^l] and Shaul." },
  { t = "v", n = 25, indent = 1, p = true, text = "The sons of Shaul: Shallum, Mibsam, and Mishma." },
  { t = "v", n = 26, indent = 1, p = true, text = "The sons of Mishma: Hammuel, Zaccur, and Shimei." },
  { t = "v", n = 27, indent = 1, p = true, text = "Shimei had sixteen sons and six daughters, but his brothers did not have many children, so their whole clan did not become as numerous as the sons of Judah." },
  { t = "v", n = 28, text = "They lived in Beersheba, Moladah, Hazar-shual," },
  { t = "v", n = 29, text = "Bilhah, Ezem, Tolad," },
  { t = "v", n = 30, text = "Bethuel, Hormah, Ziklag," },
  { t = "v", n = 31, text = "Beth-marcaboth, Hazar-susim, Beth-biri, and Shaaraim. These were their cities until the reign of David." },
  { t = "v", n = 32, text = "And their villages were Etam, Ain, Rimmon, Tochen, and Ashan—five towns—" },
  { t = "v", n = 33, text = "and all their surrounding villages as far as Baal.[^m] These were their settlements, and they kept a genealogical record:" },
  { t = "v", n = 34, indent = 2, p = true, text = "Meshobab, Jamlech, Joshah son of Amaziah," },
  { t = "v", n = 35, text = "Joel, Jehu son of Joshibiah (son of Seraiah, son of Asiel)," },
  { t = "v", n = 36, text = "Elioenai, Jaakobah, Jeshohaiah, Asaiah, Adiel, Jesimiel, Benaiah," },
  { t = "v", n = 37, text = "and Ziza son of Shiphi (son of Allon, son of Jedaiah, son of Shimri, son of Shemaiah)." },
  { t = "v", n = 38, indent = 1, p = true, text = "These men listed by name were the leaders of their clans. Their families increased greatly," },
  { t = "v", n = 39, text = "and they journeyed to the entrance of Gedor, to the east side of the valley, in search of pasture for their flocks." },
  { t = "v", n = 40, text = "There they found rich, good pasture, and the land was spacious, peaceful, and quiet; for some Hamites had lived there formerly." },
  { t = "v", n = 41, indent = 1, p = true, text = "These who were noted by name came in the days of Hezekiah king of Judah. They attacked the Hamites in their dwellings as well as the Meunites who were there, devoting them to destruction[^n] even to this day. Then they settled in their place, because there was pasture for their flocks." },
  { t = "v", n = 42, text = "And five hundred of these Simeonites led by Pelatiah, Neariah, Rephaiah, and Uzziel, the sons of Ishi, went to Mount Seir" },
  { t = "v", n = 43, text = "and struck down the remnant of the Amalekites who had escaped. And they have lived there to this day." },
  { t = "note", id = "a", text = "LXX (see also Vulgate); Hebrew *These were of the father*" },
  { t = "note", id = "b", text = "Or *the founder*; also in verses 5, 12, 14, 17, 18, and possibly elsewhere" },
  { t = "note", id = "c", text = "Alternate MT reading; the other alternate (see also Vulgate) reads *Izhar*." },
  { t = "note", id = "d", text = "*Jabez* sounds like the Hebrew for *pain* or *distress*." },
  { t = "note", id = "e", text = "Vulgate and some LXX; Hebrew does not include *and Meonothai*." },
  { t = "note", id = "f", text = "Literally *Ge-harashim, for they were craftsmen*. The Hebrew *Ge-harashim* means *valley of craftsmen*." },
  { t = "note", id = "g", text = "Hebrew *sons*" },
  { t = "note", id = "h", text = "Literally *she gave birth*" },
  { t = "note", id = "i", text = "This statement is at the end of verse 18 in the Hebrew." },
  { t = "note", id = "j", text = "Or *Judahite*" },
  { t = "note", id = "k", text = "Or *were the father of Keilah the Garmite, and Eshtemoa the Maacathite*" },
  { t = "note", id = "l", text = "*Zerah* is a variant of *Zohar*; see Genesis 46:10 and Exodus 6:15." },
  { t = "note", id = "m", text = "Hebrew; some LXX manuscripts (see also Joshua 19:8) *Baalath*" },
  { t = "note", id = "n", text = "Forms of the Hebrew *cherem* refer to the giving over of things or persons to the LORD, either by destroying them or by giving them as an offering." },
]

[[section]]
id = "5"
title = "1 Chronicles 5"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Descendants of Reuben" },
  { t = "v", n = 1, p = true, text = "These were the sons of Reuben the firstborn of Israel. Though he was the firstborn, his birthright was given to the sons of Joseph son of Israel, because Reuben defiled his father’s bed. So he is not reckoned according to birthright." },
  { t = "v", n = 2, text = "And though Judah prevailed over his brothers and a ruler came from him, the birthright belonged to Joseph." },
  { t = "v", n = 3, text = "The sons of Reuben, the firstborn of Israel: Hanoch, Pallu, Hezron, and Carmi." },
  { t = "v", n = 4, indent = 1, p = true, text = "The descendants of Joel: Shemaiah his son, Gog his son, Shimei his son," },
  { t = "v", n = 5, text = "Micah his son, Reaiah his son, Baal his son," },
  { t = "v", n = 6, text = "and Beerah his son, whom Tiglath-pileser[^a] king of Assyria carried into exile. Beerah was a leader of the Reubenites." },
  { t = "v", n = 7, text = "His relatives by their clans are recorded in their genealogy: Jeiel the chief, Zechariah," },
  { t = "v", n = 8, text = "and Bela son of Azaz, the son of Shema, the son of Joel. They settled in Aroer and as far as Nebo and Baal-meon." },
  { t = "v", n = 9, text = "They also settled in the east as far as the edge of the desert that extends to the Euphrates River, because their livestock had increased in the land of Gilead." },
  { t = "v", n = 10, indent = 2, p = true, text = "During the days of Saul they waged war against the Hagrites, who were defeated at their hands, and they occupied the dwellings of the Hagrites throughout the region east of Gilead." },
  { t = "h", level = 2, text = "The Descendants of Gad" },
  { t = "v", n = 11, p = true, text = "The descendants of Gad lived next to the Reubenites in the land of Bashan, as far as Salecah:" },
  { t = "v", n = 12, indent = 1, p = true, text = "Joel was the chief, Shapham the second, then Jaanai and Shaphat, who lived in Bashan." },
  { t = "v", n = 13, indent = 1, p = true, text = "Their kinsmen by families were Michael, Meshullam, Sheba, Jorai, Jacan, Zia, and Eber—seven in all." },
  { t = "v", n = 14, text = "These were the sons of Abihail son of Huri, the son of Jaroah, the son of Gilead, the son of Michael, the son of Jeshishai, the son of Jahdo, the son of Buz." },
  { t = "v", n = 15, text = "Ahi son of Abdiel, the son of Guni, was head of their family." },
  { t = "v", n = 16, indent = 1, p = true, text = "They lived in Gilead, in Bashan and its towns, and throughout the pasturelands of Sharon." },
  { t = "v", n = 17, text = "All of them were recorded in the genealogies during the reigns of Jotham king of Judah and Jeroboam king of Israel." },
  { t = "v", n = 18, indent = 1, p = true, text = "The Reubenites, the Gadites, and the half-tribe of Manasseh had 44,760 warriors—valiant men who carried the shield and sword, drew the bow, and were trained for battle." },
  { t = "v", n = 19, text = "They waged war against the Hagrites, as well as Jetur, Naphish, and Nodab." },
  { t = "v", n = 20, indent = 1, p = true, text = "And because they cried out to God in battle, they were helped against their enemies, and the Hagrites and all their allies were delivered into their hands. Because they put their trust in God, He answered their prayers." },
  { t = "v", n = 21, text = "They seized the livestock of the Hagrites—50,000 camels, 250,000 sheep, and 2,000 donkeys. They also took 100,000 captives," },
  { t = "v", n = 22, text = "and many others fell slain, because the battle belonged to God. And they occupied the land until the exile." },
  { t = "h", level = 2, text = "The Half-Tribe of Manasseh" },
  { t = "v", n = 23, p = true, text = "Now the people of the half-tribe of Manasseh were numerous. They settled in the land from Bashan to Baal-hermon (that is, Senir, also known as Mount Hermon).[^b]" },
  { t = "v", n = 24, text = "These were the heads of their families: Epher, Ishi, Eliel, Azriel, Jeremiah, Hodaviah, and Jahdiel. They were mighty men of valor, famous men, and heads of their families." },
  { t = "v", n = 25, text = "But they were unfaithful to the God of their fathers, and they prostituted themselves with the gods of the peoples of the land, whom God had destroyed before them." },
  { t = "v", n = 26, indent = 1, p = true, text = "So the God of Israel stirred up the spirit of Pul king of Assyria (that is, Tiglath-pileser king of Assyria) to take the Reubenites, the Gadites, and the half-tribe of Manasseh into exile. And he brought them to Halah, Habor, Hara, and the river of Gozan, where they remain to this day." },
  { t = "note", id = "a", text = "Hebrew *Tilgath-pilneser*, a variant spelling of *Tiglath-pileser*; also in verse 26" },
  { t = "note", id = "b", text = "Literally *from Bashan to Baal-hermon and Senir and Mount Hermon.*" },
]

[[section]]
id = "6"
title = "1 Chronicles 6"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Descendants of Levi" },
  { t = "v", n = 1, p = true, text = "The sons of Levi: Gershon, Kohath, and Merari." },
  { t = "v", n = 2, indent = 1, p = true, text = "The sons of Kohath: Amram, Izhar, Hebron, and Uzziel." },
  { t = "v", n = 3, indent = 1, p = true, text = "The children of Amram: Aaron, Moses, and Miriam. The sons of Aaron: Nadab, Abihu, Eleazar, and Ithamar." },
  { t = "v", n = 4, indent = 2, p = true, text = "Eleazar was the father of Phinehas, Phinehas was the father of Abishua," },
  { t = "v", n = 5, indent = 2, p = true, text = "Abishua was the father of Bukki, Bukki was the father of Uzzi," },
  { t = "v", n = 6, indent = 2, p = true, text = "Uzzi was the father of Zerahiah, Zerahiah was the father of Meraioth," },
  { t = "v", n = 7, indent = 2, p = true, text = "Meraioth was the father of Amariah, Amariah was the father of Ahitub," },
  { t = "v", n = 8, indent = 2, p = true, text = "Ahitub was the father of Zadok, Zadok was the father of Ahimaaz," },
  { t = "v", n = 9, indent = 2, p = true, text = "Ahimaaz was the father of Azariah, Azariah was the father of Johanan," },
  { t = "v", n = 10, indent = 2, p = true, text = "Johanan was the father of Azariah, who served as priest in the temple that Solomon built in Jerusalem," },
  { t = "v", n = 11, indent = 2, p = true, text = "Azariah was the father of Amariah, Amariah was the father of Ahitub," },
  { t = "v", n = 12, indent = 2, p = true, text = "Ahitub was the father of Zadok, Zadok was the father of Shallum," },
  { t = "v", n = 13, indent = 2, p = true, text = "Shallum was the father of Hilkiah, Hilkiah was the father of Azariah," },
  { t = "v", n = 14, indent = 2, p = true, text = "Azariah was the father of Seraiah, and Seraiah was the father of Jehozadak.[^a]" },
  { t = "v", n = 15, indent = 1, p = true, text = "Jehozadak went into captivity when the LORD sent Judah and Jerusalem into exile by the hand of Nebuchadnezzar." },
  { t = "v", n = 16, p = true, text = "The sons of Levi: Gershom,[^b] Kohath, and Merari." },
  { t = "v", n = 17, indent = 1, p = true, text = "These are the names of the sons of Gershom: Libni and Shimei." },
  { t = "v", n = 18, indent = 1, p = true, text = "The sons of Kohath: Amram, Izhar, Hebron, and Uzziel." },
  { t = "v", n = 19, indent = 1, p = true, text = "The sons of Merari: Mahli and Mushi. These are the clans of the Levites listed according to their fathers:" },
  { t = "v", n = 20, indent = 1, p = true, text = "Of Gershom: Libni his son, Jahath his son, Zimmah his son," },
  { t = "v", n = 21, text = "Joah his son, Iddo his son, Zerah his son, and Jeatherai his son." },
  { t = "v", n = 22, indent = 1, p = true, text = "The descendants of Kohath: Amminadab his son, Korah his son, Assir his son," },
  { t = "v", n = 23, text = "Elkanah his son, Ebiasaph[^c] his son, Assir his son," },
  { t = "v", n = 24, text = "Tahath his son, Uriel his son, Uzziah his son, and Shaul his son." },
  { t = "v", n = 25, indent = 1, p = true, text = "The descendants of Elkanah: Amasai, Ahimoth," },
  { t = "v", n = 26, text = "Elkanah his son,[^d] Zophai his son, Nahath his son," },
  { t = "v", n = 27, text = "Eliab[^e] his son, Jeroham his son, and Elkanah his son.[^f]" },
  { t = "v", n = 28, indent = 1, p = true, text = "The sons of Samuel: Joel his firstborn and Abijah his second son.[^g]" },
  { t = "v", n = 29, indent = 1, p = true, text = "The descendants of Merari: Mahli, Libni his son, Shimei his son, Uzzah his son," },
  { t = "v", n = 30, text = "Shimea his son, Haggiah his son, and Asaiah his son." },
  { t = "h", level = 2, text = "The Temple Musicians" },
  { t = "v", n = 31, p = true, text = "These are the men David put in charge of the music in the house of the LORD after the ark rested there." },
  { t = "v", n = 32, text = "They ministered with song before the tabernacle, the Tent of Meeting, until Solomon built the house of the LORD in Jerusalem. And they performed their duties according to the regulations given them." },
  { t = "v", n = 33, text = "These are the men who served, together with their sons. From the Kohathites: Heman the singer, the son of Joel, the son of Samuel," },
  { t = "v", n = 34, text = "the son of Elkanah, the son of Jeroham, the son of Eliel,[^h] the son of Toah," },
  { t = "v", n = 35, text = "the son of Zuph, the son of Elkanah, the son of Mahath, the son of Amasai," },
  { t = "v", n = 36, text = "the son of Elkanah, the son of Joel, the son of Azariah, the son of Zephaniah," },
  { t = "v", n = 37, text = "the son of Tahath, the son of Assir, the son of Ebiasaph, the son of Korah," },
  { t = "v", n = 38, text = "the son of Izhar, the son of Kohath, the son of Levi, the son of Israel." },
  { t = "v", n = 39, indent = 1, p = true, text = "Heman’s kinsman was Asaph, who served at his right hand: Asaph the son of Berechiah, the son of Shimea," },
  { t = "v", n = 40, text = "the son of Michael, the son of Baaseiah,[^i] the son of Malchijah," },
  { t = "v", n = 41, text = "the son of Ethni, the son of Zerah, the son of Adaiah," },
  { t = "v", n = 42, text = "the son of Ethan, the son of Zimmah, the son of Shimei," },
  { t = "v", n = 43, text = "the son of Jahath, the son of Gershom, the son of Levi." },
  { t = "v", n = 44, indent = 1, p = true, text = "On the left were their kinsmen, the sons of Merari: Ethan the son of Kishi, the son of Abdi, the son of Malluch," },
  { t = "v", n = 45, text = "the son of Hashabiah, the son of Amaziah, the son of Hilkiah," },
  { t = "v", n = 46, text = "the son of Amzi, the son of Bani, the son of Shemer," },
  { t = "v", n = 47, text = "the son of Mahli, the son of Mushi, the son of Merari, the son of Levi." },
  { t = "h", level = 2, text = "The Descendants of Aaron" },
  { t = "v", n = 48, p = true, text = "Their fellow Levites were assigned to every kind of service of the tabernacle, the house of God." },
  { t = "v", n = 49, text = "But Aaron and his sons did all the work of the Most Holy Place.[^j] They presented the offerings on the altar of burnt offering and on the altar of incense to make atonement for Israel, according to all that Moses the servant of God had commanded." },
  { t = "v", n = 50, indent = 1, p = true, text = "These were the descendants of Aaron: Eleazar his son, Phinehas his son, Abishua his son," },
  { t = "v", n = 51, text = "Bukki his son, Uzzi his son, Zerahiah his son," },
  { t = "v", n = 52, text = "Meraioth his son, Amariah his son, Ahitub his son," },
  { t = "v", n = 53, text = "Zadok his son, and Ahimaaz his son." },
  { t = "h", level = 2, text = "Territories for the Levites" },
  { t = "ref", text = "(Numbers 35:1–8; Joshua 21:1–45)" },
  { t = "v", n = 54, p = true, text = "Now these were the territories assigned to the descendants of Aaron from the Kohathite clan for their settlements, because the first lot fell to them:" },
  { t = "v", n = 55, indent = 1, p = true, text = "They were given Hebron in the land of Judah and its surrounding pasturelands." },
  { t = "v", n = 56, text = "But the fields and villages around the city were given to Caleb son of Jephunneh." },
  { t = "v", n = 57, text = "So the descendants of Aaron were given Hebron (a city of refuge), Libnah,[^k] Jattir, Eshtemoa," },
  { t = "v", n = 58, text = "Hilen,[^l] Debir," },
  { t = "v", n = 59, text = "Ashan,[^m] Juttah,[^n] and Beth-shemesh, together with their pasturelands." },
  { t = "v", n = 60, indent = 1, p = true, text = "And from the tribe of Benjamin they were given Gibeon,[^o] Geba, Alemeth, and Anathoth, together with their pasturelands. So they had thirteen cities in all among their families." },
  { t = "v", n = 61, indent = 1, p = true, text = "To the rest of the Kohathites, ten cities were allotted from the half-tribe of Manasseh." },
  { t = "v", n = 62, p = true, text = "The Gershomites[^p], according to their clans, were allotted thirteen cities from the tribes of Issachar, Asher, Naphtali, and Manasseh in Bashan." },
  { t = "v", n = 63, p = true, text = "The Merarites, according to their clans, were allotted twelve cities from the tribes of Reuben, Gad, and Zebulun." },
  { t = "v", n = 64, p = true, text = "So the Israelites gave to the Levites these cities and their pasturelands." },
  { t = "v", n = 65, text = "They assigned by lot the cities named above from the tribes of Judah, Simeon, and Benjamin." },
  { t = "v", n = 66, p = true, text = "And some of the clans of the Kohathites were given cities from the tribe of Ephraim for their territory:" },
  { t = "v", n = 67, indent = 1, p = true, text = "They were given Shechem (a city of refuge)[^q] with its pasturelands in the hill country of Ephraim, and Gezer," },
  { t = "v", n = 68, text = "Jokmeam, Beth-horon," },
  { t = "v", n = 69, text = "Aijalon, and Gath-rimmon, together with their pasturelands." },
  { t = "v", n = 70, indent = 1, p = true, text = "And from the half-tribe of Manasseh the rest of the clans of the Kohathites were given Aner and Bileam, together with their pasturelands." },
  { t = "v", n = 71, p = true, text = "The Gershomites received the following: From the clan of the half-tribe of Manasseh they were given Golan in Bashan and also Ashtaroth, together with their pasturelands." },
  { t = "v", n = 72, indent = 1, p = true, text = "From the tribe of Issachar they were given Kedesh, Daberath," },
  { t = "v", n = 73, text = "Ramoth, and Anem, together with their pasturelands." },
  { t = "v", n = 74, indent = 1, p = true, text = "From the tribe of Asher they were given Mashal, Abdon," },
  { t = "v", n = 75, text = "Hukok, and Rehob, together with their pasturelands." },
  { t = "v", n = 76, indent = 1, p = true, text = "And from the tribe of Naphtali they were given Kedesh in Galilee, Hammon, and Kiriathaim, together with their pasturelands." },
  { t = "v", n = 77, p = true, text = "The Merarites (the rest of the Levites) received the following: From the tribe of Zebulun they were given Rimmono and Tabor,[^r] together with their pasturelands." },
  { t = "v", n = 78, indent = 1, p = true, text = "From the tribe of Reuben east of the Jordan opposite Jericho they were given Bezer in the wilderness, Jahzah,[^s]" },
  { t = "v", n = 79, text = "Kedemoth, and Mephaath, together with their pasturelands." },
  { t = "v", n = 80, indent = 1, p = true, text = "And from the tribe of Gad they were given Ramoth in Gilead, Mahanaim," },
  { t = "v", n = 81, text = "Heshbon, and Jazer, together with their pasturelands." },
  { t = "note", id = "a", text = "*Jehozadak* is a variant of *Jozadak*; also in verse 15; see Ezra 3:2." },
  { t = "note", id = "b", text = "*Gershom* is a variant of *Gershon*; similarly in verses 17, 20, 43, 62, and 71; see verse 1." },
  { t = "note", id = "c", text = "*Ebiasaph* is a variant of *Abiasaph*; also in verse 37; see Exodus 6:24." },
  { t = "note", id = "d", text = "Some Hebrew manuscripts, LXX, and Syriac; most Hebrew manuscripts *Elkanah. The sons of Elkanah:*" },
  { t = "note", id = "e", text = "*Eliab* is also called *Eliel*; see verse 34. Both of these are other names for Elihu*; see 1 Samuel 1:1.*" },
  { t = "note", id = "f", text = "Hebrew; some LXX manuscripts include *and Samuel his son*; see verses 33–34 and 1 Samuel 1:19–20." },
  { t = "note", id = "g", text = "See Syriac and some LXX manuscripts (also verse 33 and 1 Samuel 8:2); Hebrew *The sons of Samuel: the firstborn Vashni, then Abiah*." },
  { t = "note", id = "h", text = "*Eliel* is also called *Eliab*; see verse 27. Both of these are other names for Elihu*; see 1 Samuel 1:1.*" },
  { t = "note", id = "i", text = "Most Hebrew manuscripts; some Hebrew manuscripts, one LXX manuscript, and Syriac *Maaseiah*" },
  { t = "note", id = "j", text = "Or *the Holy of Holies*" },
  { t = "note", id = "k", text = "As in the parallel text at Joshua 21:13; Hebrew *were given the cities of refuge: Hebron, Libnah*" },
  { t = "note", id = "l", text = "Some Hebrew manuscripts; MT *Hilez*; parallel text at Joshua 21:15 *Holon*" },
  { t = "note", id = "m", text = "*Ashan* is a variant of *Ain*; see Joshua 21:16." },
  { t = "note", id = "n", text = "Syriac and the parallel text at Joshua 21:16; MT does not include *Juttah,*" },
  { t = "note", id = "o", text = "LXX, Syriac, and parallel text at Joshua 21:17; MT does not include *Gibeon,*" },
  { t = "note", id = "p", text = "*Gershomites* is a variant of *Gershonites*; also in verse 71; see 1 Chronicles 23:7." },
  { t = "note", id = "q", text = "As in the parallel text at Joshua 21:21; Hebrew *They were given the cities of refuge: Shechem*" },
  { t = "note", id = "r", text = "LXX *(they were given) Jokneam, Kartah, Rimmono, and Tabor*; see Joshua 21:34." },
  { t = "note", id = "s", text = "*Jahzah* is a variant of *Jahaz*; see Numbers 21:23." },
]

[[section]]
id = "7"
title = "1 Chronicles 7"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Descendants of Issachar" },
  { t = "v", n = 1, p = true, text = "The sons of Issachar: Tola, Puah,[^a] Jashub, and Shimron—four in all." },
  { t = "v", n = 2, indent = 1, p = true, text = "The sons of Tola: Uzzi, Rephaiah, Jeriel, Jahmai, Ibsam, and Shemuel, the heads of their families. In the days of David, 22,600 descendants of Tola were numbered in their genealogies as mighty men of valor." },
  { t = "v", n = 3, indent = 1, p = true, text = "The son[^b] of Uzzi: Izrahiah. The sons of Izrahiah: Michael, Obadiah, Joel, and Isshiah. All five of them were chiefs." },
  { t = "v", n = 4, text = "In addition to them, according to their genealogy, they had 36,000 troops for battle, for they had many wives and children." },
  { t = "v", n = 5, indent = 1, p = true, text = "Their kinsmen belonging to all the families of Issachar who were mighty men of valor totaled 87,000, as listed in their genealogies." },
  { t = "h", level = 2, text = "The Descendants of Benjamin" },
  { t = "v", n = 6, p = true, text = "The three sons of Benjamin: Bela, Becher, and Jediael." },
  { t = "v", n = 7, indent = 1, p = true, text = "The sons of Bela: Ezbon, Uzzi, Uzziel, Jerimoth, and Iri, heads of their families—five in all. There were 22,034 mighty men of valor listed in their genealogies." },
  { t = "v", n = 8, indent = 1, p = true, text = "The sons of Becher: Zemirah, Joash, Eliezer, Elioenai, Omri, Jeremoth, Abijah, Anathoth, and Alemeth; all these were Becher’s sons." },
  { t = "v", n = 9, text = "Their genealogies were recorded according to the heads of their families—20,200 mighty men of valor." },
  { t = "v", n = 10, indent = 1, p = true, text = "The son of Jediael: Bilhan. The sons of Bilhan: Jeush, Benjamin, Ehud, Chenaanah, Zethan, Tarshish, and Ahishahar." },
  { t = "v", n = 11, text = "All these sons of Jediael were heads of their families, mighty men of valor; there were 17,200 fit for battle." },
  { t = "v", n = 12, text = "The Shuppites and Huppites were descendants of Ir, and the Hushites were descendants of Aher." },
  { t = "h", level = 2, text = "The Descendants of Naphtali" },
  { t = "v", n = 13, p = true, text = "The sons of Naphtali: Jahziel,[^c] Guni, Jezer, and Shallum[^d]—the descendants of Bilhah." },
  { t = "h", level = 2, text = "The Descendants of Manasseh" },
  { t = "v", n = 14, p = true, text = "The descendants of Manasseh: Asriel through his Aramean concubine. She also gave birth to Machir the father of Gilead." },
  { t = "v", n = 15, indent = 1, p = true, text = "Machir took a wife from among the Huppites and Shuppites. The name of his sister was Maacah. Another descendant was named Zelophehad, who had only daughters." },
  { t = "v", n = 16, indent = 1, p = true, text = "Machir’s wife Maacah gave birth to a son, and she named him Peresh. His brother was named Sheresh, and his sons were Ulam and Rekem." },
  { t = "v", n = 17, indent = 1, p = true, text = "The son of Ulam: Bedan. These were the sons of Gilead son of Machir, the son of Manasseh." },
  { t = "v", n = 18, text = "His sister Hammolecheth gave birth to Ishhod, Abiezer, and Mahlah." },
  { t = "v", n = 19, indent = 1, p = true, text = "And these were the sons of Shemida: Ahian, Shechem, Likhi, and Aniam." },
  { t = "h", level = 2, text = "The Descendants of Ephraim" },
  { t = "v", n = 20, p = true, text = "The descendants of Ephraim: Shuthelah, Bered his son, Tahath his son, Eleadah his son, Tahath his son," },
  { t = "v", n = 21, text = "Zabad his son, and Shuthelah his son. Ezer and Elead were killed by the natives of Gath, because they went down to steal their livestock." },
  { t = "v", n = 22, indent = 1, p = true, text = "Their father Ephraim mourned for many days, and his relatives came to comfort him." },
  { t = "v", n = 23, text = "And again he slept with his wife, and she conceived and gave birth to a son. So he named him Beriah,[^e] because tragedy had come upon his house." },
  { t = "v", n = 24, text = "His daughter was Sheerah, who built Lower and Upper Beth-horon, as well as Uzzen-sheerah." },
  { t = "v", n = 25, indent = 1, p = true, text = "Additionally, Rephah was his son, Resheph his son,[^f] Telah his son, Tahan his son," },
  { t = "v", n = 26, text = "Ladan his son, Ammihud his son, Elishama his son," },
  { t = "v", n = 27, text = "Nun[^g] his son, and Joshua his son." },
  { t = "v", n = 28, indent = 1, p = true, text = "Their holdings and settlements included Bethel and its villages, Naaran to the east, Gezer and its villages to the west, and Shechem and its villages as far as Ayyah[^h] and its villages." },
  { t = "v", n = 29, text = "And along the borders of Manasseh were Beth-shean,[^i] Taanach, Megiddo, and Dor, together with their villages. The descendants of Joseph son of Israel lived in these towns." },
  { t = "h", level = 2, text = "The Descendants of Asher" },
  { t = "v", n = 30, p = true, text = "The children of Asher: Imnah, Ishvah, Ishvi, Beriah, and their sister Serah." },
  { t = "v", n = 31, indent = 1, p = true, text = "The sons of Beriah: Heber, as well as Malchiel, who was the father of Birzaith." },
  { t = "v", n = 32, indent = 1, p = true, text = "Heber was the father of Japhlet, Shomer, and Hotham, and of their sister Shua." },
  { t = "v", n = 33, indent = 1, p = true, text = "The sons of Japhlet: Pasach, Bimhal, and Ashvath. These were Japhlet’s sons." },
  { t = "v", n = 34, indent = 1, p = true, text = "The sons of Shemer: Ahi, Rohgah,[^j] Hubbah, and Aram." },
  { t = "v", n = 35, indent = 1, p = true, text = "The sons of his brother Helem:[^k] Zophah, Imna, Shelesh, and Amal." },
  { t = "v", n = 36, indent = 1, p = true, text = "The sons of Zophah: Suah, Harnepher, Shual, Beri, Imrah," },
  { t = "v", n = 37, text = "Bezer, Hod, Shamma, Shilshah, Ithran,[^l] and Beera." },
  { t = "v", n = 38, indent = 1, p = true, text = "The sons of Jether: Jephunneh, Pispa, and Ara." },
  { t = "v", n = 39, indent = 1, p = true, text = "The sons of Ulla: Arah, Hanniel, and Rizia." },
  { t = "v", n = 40, indent = 1, p = true, text = "All these were the descendants of Asher—heads of their families, choice and mighty men of valor, and chiefs among the leaders. The number of men fit for battle, recorded in their genealogies, was 26,000." },
  { t = "note", id = "a", text = "*Puah* is a variant of *Puvah*; see Genesis 46:13 and Numbers 26:23." },
  { t = "note", id = "b", text = "Hebrew *sons*; also in verses 10 and 17" },
  { t = "note", id = "c", text = "*Jahziel* is a variant of *Jahzeel*; see Genesis 46:24." },
  { t = "note", id = "d", text = "Most Hebrew manuscripts; some Hebrew and LXX manuscripts *Shillem*; see Genesis 46:24 and Numbers 26:49." },
  { t = "note", id = "e", text = "*Beriah* sounds like the Hebrew for *tragedy* or *disaster*." },
  { t = "note", id = "f", text = "Some LXX manuscripts; Hebrew does not include *his son*." },
  { t = "note", id = "g", text = "Or *Non*" },
  { t = "note", id = "h", text = "*Ayyah* is another name for *Gaza*; see also LXX." },
  { t = "note", id = "i", text = "*Beth-shean* is a variant of *Beth-shan*; see 1 Samuel 31:10 and 2 Samuel 21:12." },
  { t = "note", id = "j", text = "Or *The sons of his brother Shemer: Rohgah*; note that *Shemer* is a variant of *Shomer*; see verse 32." },
  { t = "note", id = "k", text = "*Helem* is possibly another name for *Hotham*; see verse 32." },
  { t = "note", id = "l", text = "*Ithran* is possibly a variant of *Jether*; see verse 38." },
]

[[section]]
id = "8"
title = "1 Chronicles 8"
level = 1
blocks = [
  { t = "h", level = 2, text = "Genealogy from Benjamin to Saul" },
  { t = "v", n = 1, p = true, text = "Benjamin was the father of Bela his firstborn, Ashbel the second, Aharah the third," },
  { t = "v", n = 2, text = "Nohah the fourth, and Rapha the fifth." },
  { t = "v", n = 3, indent = 1, p = true, text = "The sons of Bela: Addar, Gera, Abihud,[^a]" },
  { t = "v", n = 4, text = "Abishua, Naaman, Ahoah," },
  { t = "v", n = 5, text = "Gera, Shephuphan, and Huram." },
  { t = "v", n = 6, indent = 1, p = true, text = "These were the descendants of Ehud who were the heads of the families living in Geba and were exiled to Manahath:" },
  { t = "v", n = 7, indent = 2, p = true, text = "Naaman, Ahijah, and Gera, who carried them into exile and who was the father of Uzza and Ahihud.[^b]" },
  { t = "v", n = 8, indent = 1, p = true, text = "Shaharaim had sons in the country of Moab after he had divorced his wives Hushim and Baara." },
  { t = "v", n = 9, text = "His sons by his wife Hodesh: Jobab, Zibia, Mesha, Malcam," },
  { t = "v", n = 10, text = "Jeuz, Sachia, and Mirmah. These were his sons, heads of families." },
  { t = "v", n = 11, indent = 1, p = true, text = "He also had sons by Hushim: Abitub and Elpaal." },
  { t = "v", n = 12, indent = 1, p = true, text = "The sons of Elpaal: Eber, Misham, Shemed (who built Ono and Lod with its villages)," },
  { t = "v", n = 13, text = "and Beriah and Shema (who were the heads of families living in Aijalon and who drove out the inhabitants of Gath)." },
  { t = "v", n = 14, indent = 1, p = true, text = "Ahio, Shashak, Jeremoth," },
  { t = "v", n = 15, text = "Zebadiah, Arad, Eder," },
  { t = "v", n = 16, text = "Michael, Ishpah, and Joha were the sons of Beriah." },
  { t = "v", n = 17, indent = 1, p = true, text = "Zebadiah, Meshullam, Hizki, Heber," },
  { t = "v", n = 18, text = "Ishmerai, Izliah, and Jobab were the sons of Elpaal." },
  { t = "v", n = 19, indent = 1, p = true, text = "Jakim, Zichri, Zabdi," },
  { t = "v", n = 20, text = "Elienai, Zillethai, Eliel," },
  { t = "v", n = 21, text = "Adaiah, Beraiah, and Shimrath were the sons of Shimei." },
  { t = "v", n = 22, indent = 1, p = true, text = "Ishpan, Eber, Eliel," },
  { t = "v", n = 23, text = "Abdon, Zichri, Hanan," },
  { t = "v", n = 24, text = "Hananiah, Elam, Anthothijah," },
  { t = "v", n = 25, text = "Iphdeiah, and Penuel were the sons of Shashak." },
  { t = "v", n = 26, indent = 1, p = true, text = "Shamsherai, Shehariah, Athaliah," },
  { t = "v", n = 27, text = "Jaareshiah, Elijah, and Zichri were the sons of Jeroham." },
  { t = "v", n = 28, indent = 1, p = true, text = "All these were heads of families, the chiefs according to their genealogies, and they lived in Jerusalem." },
  { t = "v", n = 29, indent = 1, p = true, text = "Jeiel the father of Gibeon lived[^c] in Gibeon. His wife’s name was Maacah," },
  { t = "v", n = 30, text = "and Abdon was his firstborn son, then Zur, Kish, Baal,[^d] Nadab," },
  { t = "v", n = 31, text = "Gedor, Ahio, Zecher,[^e]" },
  { t = "v", n = 32, text = "and Mikloth, who was the father of Shimeah.[^f] They too lived alongside their relatives in Jerusalem." },
  { t = "h", level = 2, text = "The Family of Saul" },
  { t = "v", n = 33, p = true, text = "Ner was the father of Kish, Kish was the father of Saul, and Saul was the father of Jonathan, Malchishua, Abinadab, and Esh-baal.[^g]" },
  { t = "v", n = 34, indent = 1, p = true, text = "The son of Jonathan: Merib-baal,[^h] and Merib-baal was the father of Micah.[^i]" },
  { t = "v", n = 35, indent = 1, p = true, text = "The sons of Micah: Pithon, Melech, Tarea,[^j] and Ahaz." },
  { t = "v", n = 36, indent = 1, p = true, text = "Ahaz was the father of Jehoaddah, Jehoaddah[^k] was the father of Alemeth, Azmaveth, and Zimri, and Zimri was the father of Moza." },
  { t = "v", n = 37, indent = 1, p = true, text = "Moza was the father of Binea. Raphah[^l] was his son, Eleasah his son, and Azel his son." },
  { t = "v", n = 38, indent = 1, p = true, text = "Azel had six sons, and these were their names: Azrikam, Bocheru, Ishmael, Sheariah, Obadiah, and Hanan. All these were the sons of Azel." },
  { t = "v", n = 39, indent = 1, p = true, text = "The sons of his brother Eshek: Ulam was his firstborn, Jeush second, and Eliphelet third." },
  { t = "v", n = 40, text = "The sons of Ulam were mighty men of valor, archers, and they had many sons and grandsons—150 in all. All these were the descendants of Benjamin." },
  { t = "note", id = "a", text = "Possibly *Gera the father of Ehud*; see verse 7." },
  { t = "note", id = "b", text = "Or *and Gera, that is Heglam, who was the father of Uzza and Ahihud.*" },
  { t = "note", id = "c", text = "Some LXX manuscripts (see also 1 Chronicles 9:35); Hebrew *The father of Gibeon lived*" },
  { t = "note", id = "d", text = "Some LXX manuscripts include *Ner*; see 1 Chronicles 9:36." },
  { t = "note", id = "e", text = "*Zecher* is likely a variant of *Zechariah*; see 1 Chronicles 9:37." },
  { t = "note", id = "f", text = "*Shimeah* is a variant of *Shimeam*; see 1 Chronicles 9:38." },
  { t = "note", id = "g", text = "*Esh-baal* is also called *Ish-bosheth*; see 2 Samuel 2:8." },
  { t = "note", id = "h", text = "*Merib-baal* is also called *Mephibosheth*; see 2 Samuel 4:4." },
  { t = "note", id = "i", text = "*Micah* is a variant of *Mica*; see 2 Samuel 9:12." },
  { t = "note", id = "j", text = "*Tarea* is a variant of *Tahrea*; see 1 Chronicles 9:41." },
  { t = "note", id = "k", text = "*Jehoaddah* is a variant of *Jarah* or *Jadah*; see 1 Chronicles 9:42." },
  { t = "note", id = "l", text = "*Raphah* is a variant of *Rephaiah*; see 1 Chronicles 9:43." },
]

[[section]]
id = "9"
title = "1 Chronicles 9"
level = 1
blocks = [
  { t = "h", level = 2, text = "The People of Jerusalem" },
  { t = "v", n = 1, p = true, text = "So all Israel was recorded in the genealogies written in the Book of the Kings of Israel. But Judah was exiled to Babylon because of their unfaithfulness." },
  { t = "v", n = 2, p = true, text = "Now the first to resettle their own property in their cities were Israelites, priests, Levites, and temple servants.[^a]" },
  { t = "v", n = 3, p = true, text = "Some of the descendants of Judah, Benjamin, Ephraim, and Manasseh lived in Jerusalem:" },
  { t = "v", n = 4, indent = 1, p = true, text = "Uthai son of Ammihud, the son of Omri, the son of Imri, the son of Bani, a descendant of Perez son of Judah." },
  { t = "v", n = 5, indent = 1, p = true, text = "From the Shilonites: Asaiah the firstborn and his sons." },
  { t = "v", n = 6, indent = 1, p = true, text = "From the Zerahites: Jeuel and 690 relatives." },
  { t = "v", n = 7, indent = 1, p = true, text = "From the Benjamites: Sallu son of Meshullam, the son of Hodaviah, the son of Hassenuah;" },
  { t = "v", n = 8, indent = 2, p = true, text = "Ibneiah son of Jeroham; Elah son of Uzzi, the son of Michri; Meshullam son of Shephatiah, the son of Reuel, the son of Ibnijah;" },
  { t = "v", n = 9, indent = 2, p = true, text = "and 956 of their relatives according to their genealogy. All these men were heads of their families." },
  { t = "v", n = 10, indent = 1, p = true, text = "From the priests: Jedaiah, Jehoiarib, and Jachin;" },
  { t = "v", n = 11, indent = 2, p = true, text = "Azariah son of Hilkiah, the son of Meshullam, the son of Zadok, the son of Meraioth, the son of Ahitub, the chief official of God’s temple;" },
  { t = "v", n = 12, indent = 2, p = true, text = "Adaiah son of Jeroham, the son of Pashhur, the son of Malchijah; Maasai son of Adiel, the son of Jahzerah, the son of Meshullam, the son of Meshillemith,[^b] the son of Immer;" },
  { t = "v", n = 13, indent = 2, p = true, text = "and 1,760 of their relatives, the heads of their families, able men for the work of the service of the house of God." },
  { t = "v", n = 14, indent = 1, p = true, text = "From the Levites: Shemaiah son of Hasshub, the son of Azrikam, the son of Hashabiah, a descendant of Merari;" },
  { t = "v", n = 15, indent = 2, p = true, text = "Bakbakkar, Heresh, Galal, and Mattaniah son of Mica, the son of Zichri, the son of Asaph;" },
  { t = "v", n = 16, indent = 2, p = true, text = "Obadiah son of Shemaiah, the son of Galal, the son of Jeduthun; and Berechiah son of Asa, the son of Elkanah, who lived in the villages of the Netophathites." },
  { t = "v", n = 17, indent = 1, p = true, text = "These were the gatekeepers: Shallum, Akkub, Talmon, Ahiman, and their relatives. Shallum was their chief;" },
  { t = "v", n = 18, text = "he was previously stationed at the King’s Gate on the east side. These were the gatekeepers from the camp of the Levites." },
  { t = "v", n = 19, text = "Shallum son of Kore, the son of Ebiasaph,[^c] the son of Korah, and his relatives from the Korahites were assigned to guard the thresholds of the Tent, just as their fathers had been assigned to guard the entrance to the dwelling of the LORD." },
  { t = "v", n = 20, indent = 2, p = true, text = "In earlier times Phinehas son of Eleazar had been in charge of the gatekeepers, and the LORD was with him." },
  { t = "v", n = 21, indent = 2, p = true, text = "Zechariah son of Meshelemiah was the gatekeeper at the entrance to the Tent of Meeting." },
  { t = "v", n = 22, indent = 2, p = true, text = "The number of those chosen to be gatekeepers at the thresholds was 212. They were registered by genealogy in their villages. David and Samuel the seer had appointed them to their positions of trust." },
  { t = "v", n = 23, p = true, text = "So they and their descendants were assigned to guard the gates of the house of the LORD—the house called the Tent." },
  { t = "v", n = 24, text = "The gatekeepers were stationed on the four sides: east, west, north, and south." },
  { t = "v", n = 25, text = "Their relatives came from their villages at fixed times to serve with them for seven-day periods." },
  { t = "v", n = 26, text = "But the four chief gatekeepers, who were Levites, were entrusted with the rooms and the treasuries of the house of God." },
  { t = "v", n = 27, text = "They would spend the night stationed around the house of God, because they were responsible for guarding it and opening it every morning." },
  { t = "v", n = 28, p = true, text = "Some of them were in charge of the articles used in worship, to count them whenever they were brought in or taken out." },
  { t = "v", n = 29, text = "Others were put in charge of the furnishings and other articles of the sanctuary, as well as the fine flour, wine, oil, frankincense, and spices." },
  { t = "v", n = 30, text = "And some of the sons of the priests mixed the spices." },
  { t = "v", n = 31, p = true, text = "A Levite named Mattithiah, the firstborn son of Shallum the Korahite, was entrusted with baking the bread." },
  { t = "v", n = 32, text = "Some of their Kohathite relatives were responsible for preparing the rows of the showbread every Sabbath." },
  { t = "v", n = 33, p = true, text = "Those who were musicians, the heads of Levite families, stayed in the temple chambers and were exempt from other duties because they were on duty day and night." },
  { t = "v", n = 34, text = "All these were heads of Levite families, chiefs according to their genealogies, and they lived in Jerusalem." },
  { t = "h", level = 2, text = "The Descendants of Saul" },
  { t = "v", n = 35, indent = 1, p = true, text = "Jeiel the father[^d] of Gibeon lived in Gibeon. His wife’s name was Maacah." },
  { t = "v", n = 36, indent = 1, p = true, text = "Abdon was his firstborn son, then Zur, Kish, Baal, Ner, Nadab," },
  { t = "v", n = 37, text = "Gedor, Ahio, Zechariah, and Mikloth." },
  { t = "v", n = 38, indent = 1, p = true, text = "Mikloth was the father of Shimeam.[^e] They too lived alongside their relatives in Jerusalem." },
  { t = "v", n = 39, indent = 1, p = true, text = "Ner was the father of Kish, Kish was the father of Saul, and Saul was the father of Jonathan, Malchishua, Abinadab, and Esh-baal." },
  { t = "v", n = 40, indent = 1, p = true, text = "The son of Jonathan: Merib-baal, who was the father of Micah." },
  { t = "v", n = 41, indent = 1, p = true, text = "The sons of Micah: Pithon, Melech, Tahrea, and Ahaz.[^f]" },
  { t = "v", n = 42, indent = 2, p = true, text = "Ahaz was the father of Jarah; Jarah[^g] was the father of Alemeth, Azmaveth, and Zimri; and Zimri was the father of Moza." },
  { t = "v", n = 43, text = "Moza was the father of Binea. Rephaiah[^h] was his son, Elasah his son, and Azel his son." },
  { t = "v", n = 44, indent = 1, p = true, text = "And Azel had six sons, and these were their names: Azrikam, Bocheru, Ishmael, Sheariah, Obadiah, and Hanan. These were the sons of Azel." },
  { t = "note", id = "a", text = "Hebrew *Nethinim*" },
  { t = "note", id = "b", text = "*Meshillemith* is a variant of *Meshillemoth*; see Nehemiah 11:13." },
  { t = "note", id = "c", text = "*Ebiasaph* is a variant of *Abiasaph*; see Exodus 6:24." },
  { t = "note", id = "d", text = "Or *the founder*" },
  { t = "note", id = "e", text = "*Shimeam* is a variant of *Shimeah*; see 1 Chronicles 8:32." },
  { t = "note", id = "f", text = "Vulgate and Syriac (see also LXX and 1 Chronicles 8:35); Hebrew *Pithon, Melech, and Tahrea*; note that *Tahrea* is a variant of *Tarea*." },
  { t = "note", id = "g", text = "Most Hebrew manuscripts; some Hebrew manuscripts and LXX *Jadah; Jadah*; note that *Jarah* and *Jadah* are variants of *Jehoaddah*; see 1 Chronicles 8:36." },
  { t = "note", id = "h", text = "*Rephaiah* is a variant of *Raphah*; see 1 Chronicles 8:37." },
]

[[section]]
id = "10"
title = "1 Chronicles 10"
level = 1
blocks = [
  { t = "h", level = 2, text = "Saul’s Overthrow and Death" },
  { t = "ref", text = "(1 Samuel 31:1–6; 2 Samuel 1:1–16)" },
  { t = "v", n = 1, p = true, text = "Now the Philistines fought against Israel, and the men of Israel fled before them, and many fell slain on Mount Gilboa." },
  { t = "v", n = 2, p = true, text = "The Philistines followed hard after Saul and his sons, and they killed Saul’s sons Jonathan, Abinadab, and Malchishua." },
  { t = "v", n = 3, text = "When the battle intensified against Saul, the archers overtook him and wounded him." },
  { t = "v", n = 4, p = true, text = "Then Saul said to his armor-bearer, “Draw your sword and run me through with it, or these uncircumcised men will come and torture me!” But his armor-bearer was terrified and refused to do it. So Saul took his own sword and fell on it." },
  { t = "v", n = 5, p = true, text = "When his armor-bearer saw that Saul was dead, he too fell on his own sword and died." },
  { t = "v", n = 6, text = "So Saul died together with his three sons and all his house." },
  { t = "h", level = 2, text = "The Philistines Possess the Towns" },
  { t = "ref", text = "(1 Samuel 31:7–10)" },
  { t = "v", n = 7, p = true, text = "When all the Israelites in the valley saw that the army had fled and that Saul and his sons had died, they abandoned their cities and ran away. So the Philistines came and occupied their cities." },
  { t = "v", n = 8, p = true, text = "The next day, when the Philistines came to strip the dead, they found Saul and his sons fallen on Mount Gilboa." },
  { t = "v", n = 9, text = "They stripped Saul, cut off his head, took his armor, and sent messengers throughout the land of the Philistines to proclaim the news in the temple of their idols and among their people." },
  { t = "v", n = 10, text = "They put his armor in the temple of their gods and hung his head in the temple of Dagon." },
  { t = "h", level = 2, text = "Jabesh-gilead’s Tribute to Saul" },
  { t = "ref", text = "(1 Samuel 31:11–13)" },
  { t = "v", n = 11, p = true, text = "When all the people of Jabesh-gilead heard about everything the Philistines had done to Saul," },
  { t = "v", n = 12, text = "all their men of valor set out and retrieved the bodies of Saul and his sons and brought them to Jabesh. And they buried their bones under the oak[^a] in Jabesh and fasted seven days." },
  { t = "v", n = 13, p = true, text = "So Saul died for his unfaithfulness to the LORD, because he did not keep the word of the LORD and even consulted a medium for guidance," },
  { t = "v", n = 14, text = "and he failed to inquire of the LORD. So the LORD put him to death and turned the kingdom over to David son of Jesse." },
  { t = "note", id = "a", text = "Or *terebinth* or *great tree*" },
]

[[section]]
id = "11"
title = "1 Chronicles 11"
level = 1
blocks = [
  { t = "h", level = 2, text = "David Anointed King of All Israel" },
  { t = "ref", text = "(2 Samuel 5:1–5)" },
  { t = "v", n = 1, p = true, text = "Then all Israel came together to David at Hebron and said, “Here we are, your own flesh and blood." },
  { t = "v", n = 2, text = "Even in times past,[^a] while Saul was king, you were the one who led Israel out and brought them back. And the LORD your God said, ‘You will shepherd My people Israel, and you will be ruler over them.’”" },
  { t = "v", n = 3, p = true, text = "So all the elders of Israel came to the king at Hebron, where David made a covenant with them before the LORD. And they anointed him king over Israel, according to the word of the LORD through Samuel." },
  { t = "h", level = 2, text = "David Conquers Jerusalem" },
  { t = "ref", text = "(2 Samuel 5:6–11)" },
  { t = "v", n = 4, p = true, text = "Then David and all the Israelites marched to Jerusalem (that is, Jebus), where the Jebusites inhabited the land." },
  { t = "v", n = 5, p = true, text = "The people of Jebus said to David, “You will never get in here.” Nevertheless, David captured the fortress of Zion (that is, the City of David)." },
  { t = "v", n = 6, p = true, text = "Now David had said, “Whoever is the first to strike down a Jebusite will become chief commander.” And Joab son of Zeruiah went up first, and he became the chief." },
  { t = "v", n = 7, p = true, text = "So David took up residence in the fortress; that is why it was called the City of David." },
  { t = "v", n = 8, text = "He built up the city around it, from the supporting terraces[^b] to the surrounding wall, while Joab restored the rest of the city." },
  { t = "v", n = 9, p = true, text = "And David became greater and greater, for the LORD of Hosts was with him." },
  { t = "h", level = 2, text = "David’s Mighty Men" },
  { t = "ref", text = "(2 Samuel 23:8–39)" },
  { t = "v", n = 10, p = true, text = "Now these were the chiefs of David’s mighty men, who, together with all Israel, bolstered and strengthened his kingdom, according to the word of the LORD concerning Israel." },
  { t = "v", n = 11, text = "This is the list of David’s mighty men: Jashobeam son of Hachmoni was chief of the officers;[^c] he wielded his spear against three hundred men, whom he killed at one time." },
  { t = "v", n = 12, p = true, text = "Next in command was Eleazar son of Dodo[^d] the Ahohite, one of the three mighty men." },
  { t = "v", n = 13, text = "He was with David at Pas-dammim when the Philistines gathered there for battle. At a place with a field full of barley, the troops fled from the Philistines." },
  { t = "v", n = 14, text = "But Eleazar and David stationed themselves[^e] in the middle of the field and defended it. They struck down the Philistines, and the LORD brought about a great victory." },
  { t = "v", n = 15, p = true, text = "Three of the thirty chief men went down to David, to the rock at the cave of Adullam, while a company of Philistines was encamped in the Valley of Rephaim." },
  { t = "v", n = 16, text = "At that time David was in the stronghold, and the garrison of the Philistines was at Bethlehem." },
  { t = "v", n = 17, text = "David longed for water and said, “Oh, that someone would get me a drink of water from the well near the gate of Bethlehem!”" },
  { t = "v", n = 18, p = true, text = "So the Three broke through the Philistine camp, drew water from the well at the gate of Bethlehem, and brought it back to David. But he refused to drink it; instead, he poured it out to the LORD," },
  { t = "v", n = 19, text = "saying, “Far be it from me, my God, to do this! How can I drink the blood of these men who risked their lives?” Because they had brought it at the risk of their lives, David refused to drink it. Such were the exploits of the three mighty men." },
  { t = "v", n = 20, p = true, text = "Now Abishai, the brother of Joab, was chief of the Three,[^f] and he wielded his spear against three hundred men, killed them, and won a name along with the Three." },
  { t = "v", n = 21, text = "He was doubly honored above the Three, and he became their commander, even though he was not included among the Three." },
  { t = "v", n = 22, p = true, text = "And Benaiah son of Jehoiada was a man of valor from Kabzeel, a man of many exploits. He struck down two champions of Moab,[^g] and on a snowy day he went down into a pit and killed a lion." },
  { t = "v", n = 23, text = "He also struck down an Egyptian, a huge man five cubits tall.[^h] Although the Egyptian had a spear like a weaver’s beam in his hand, Benaiah went against him with a club, snatched the spear from his hand, and killed the Egyptian with his own spear." },
  { t = "v", n = 24, text = "These were the exploits of Benaiah son of Jehoiada, who won a name along with the three mighty men." },
  { t = "v", n = 25, text = "He was most honored among the Thirty, but he did not become one of the Three. And David appointed him over his guard." },
  { t = "v", n = 26, p = true, text = "Now these were the mighty men: Asahel the brother of Joab, Elhanan son of Dodo of Bethlehem," },
  { t = "v", n = 27, indent = 1, p = true, text = "Shammoth the Harorite,[^i] Helez the Pelonite," },
  { t = "v", n = 28, indent = 1, p = true, text = "Ira son of Ikkesh the Tekoite, Abiezer the Anathothite," },
  { t = "v", n = 29, indent = 1, p = true, text = "Sibbecai the Hushathite, Ilai the Ahohite," },
  { t = "v", n = 30, indent = 1, p = true, text = "Maharai the Netophathite, Heled son of Baanah the Netophathite," },
  { t = "v", n = 31, indent = 1, p = true, text = "Ithai[^j] son of Ribai from Gibeah of the Benjamites, Benaiah the Pirathonite," },
  { t = "v", n = 32, indent = 1, p = true, text = "Hurai[^k] from the brooks[^l] of Gaash, Abiel[^m] the Arbathite," },
  { t = "v", n = 33, indent = 1, p = true, text = "Azmaveth the Baharumite,[^n] Eliahba the Shaalbonite," },
  { t = "v", n = 34, indent = 1, p = true, text = "the sons of Hashem[^o] the Gizonite, Jonathan son of Shagee the Hararite," },
  { t = "v", n = 35, indent = 1, p = true, text = "Ahiam son of Sachar[^p] the Hararite, Eliphal son of Ur," },
  { t = "v", n = 36, indent = 1, p = true, text = "Hepher the Mecherathite, Ahijah the Pelonite," },
  { t = "v", n = 37, indent = 1, p = true, text = "Hezro the Carmelite, Naarai son of Ezbai," },
  { t = "v", n = 38, indent = 1, p = true, text = "Joel the brother of Nathan, Mibhar son of Hagri," },
  { t = "v", n = 39, indent = 1, p = true, text = "Zelek the Ammonite, Naharai the Beerothite, the armor-bearer of Joab son of Zeruiah," },
  { t = "v", n = 40, indent = 1, p = true, text = "Ira the Ithrite, Gareb the Ithrite," },
  { t = "v", n = 41, indent = 1, p = true, text = "Uriah the Hittite, Zabad son of Ahlai," },
  { t = "v", n = 42, indent = 1, p = true, text = "Adina son of Shiza the Reubenite, chief of the Reubenites, and the thirty with him," },
  { t = "v", n = 43, indent = 1, p = true, text = "Hanan son of Maacah, Joshaphat the Mithnite," },
  { t = "v", n = 44, indent = 1, p = true, text = "Uzzia the Ashterathite, Shama and Jeiel the sons of Hotham the Aroerite," },
  { t = "v", n = 45, indent = 1, p = true, text = "Jediael son of Shimri and his brother Joha the Tizite," },
  { t = "v", n = 46, indent = 1, p = true, text = "Eliel the Mahavite, Jeribai and Joshaviah, the sons of Elnaam, Ithmah the Moabite," },
  { t = "v", n = 47, indent = 1, p = true, text = "Eliel, Obed, and Jaasiel the Mezobaite." },
  { t = "note", id = "a", text = "Or *For some time*" },
  { t = "note", id = "b", text = "Hebrew *the Millo*" },
  { t = "note", id = "c", text = "Or *of the Thirty*; some LXX manuscripts *of the Three*; see 2 Samuel 23:8." },
  { t = "note", id = "d", text = "*Dodo* is a variant of *Dodai*; see 1 Chronicles 27:4." },
  { t = "note", id = "e", text = "Literally *But they stationed themselves*" },
  { t = "note", id = "f", text = "Hebrew; Syriac *the Thirty*; also in verse 21" },
  { t = "note", id = "g", text = "Or *two sons of Ariel of Moab*" },
  { t = "note", id = "h", text = "*5 cubits* is approximately 7 feet 6 inches or 229 centimeters tall." },
  { t = "note", id = "i", text = "*Shammoth the Harorite* is a variant of *Shammah the Harodite*; see 2 Samuel 23:25." },
  { t = "note", id = "j", text = "*Ithai* is a variant of *Ittai*; see 2 Samuel 23:29." },
  { t = "note", id = "k", text = "*Hurai* is a variant of *Hiddai*; see 2 Samuel 23:30." },
  { t = "note", id = "l", text = "Or *from the ravines*" },
  { t = "note", id = "m", text = "*Abiel* is a variant of *Abi-albon*; see 2 Samuel 23:31." },
  { t = "note", id = "n", text = "*Baharumite* is a variant of *Barhumite*; see 2 Samuel 23:31." },
  { t = "note", id = "o", text = "*Hashem* is a variant of *Jashen*; see LXX and 2 Samuel 23:32." },
  { t = "note", id = "p", text = "*Sachar* is a variant of *Sharar*; see 2 Samuel 23:33." },
]

[[section]]
id = "12"
title = "1 Chronicles 12"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Mighty Men Join David at Ziklag" },
  { t = "v", n = 1, p = true, text = "Now these were the men who came to David at Ziklag, while he was still banished from the presence of Saul son of Kish (they were among the mighty men who helped him in battle;" },
  { t = "v", n = 2, text = "they were archers using both the right and left hands to sling stones and shoot arrows; and they were Saul’s kinsmen from Benjamin):" },
  { t = "v", n = 3, indent = 1, p = true, text = "Ahiezer their chief and Joash, who were the sons of Shemaah the Gibeathite; Jeziel and Pelet, the sons of Azmaveth; Beracah; Jehu the Anathothite;" },
  { t = "v", n = 4, indent = 1, p = true, text = "Ishmaiah the Gibeonite, a mighty man among the Thirty and a leader over the Thirty; Jeremiah, Jahaziel, Johanan, and Jozabad the Gederathite;" },
  { t = "v", n = 5, indent = 1, p = true, text = "Eluzai, Jerimoth, Bealiah, Shemariah, and Shephatiah the Haruphite;" },
  { t = "v", n = 6, indent = 1, p = true, text = "Elkanah, Isshiah, Azarel, Joezer, and Jashobeam, who were Korahites;" },
  { t = "v", n = 7, indent = 1, p = true, text = "and Joelah and Zebadiah, the sons of Jeroham from Gedor." },
  { t = "v", n = 8, p = true, text = "Some Gadites defected to David at his stronghold in the wilderness. They were mighty men of valor, trained for battle, experts with the shield and spear, whose faces were like the faces of lions and who were as swift as gazelles on the mountains:" },
  { t = "v", n = 9, indent = 1, p = true, text = "Ezer the chief, Obadiah the second in command, Eliab the third," },
  { t = "v", n = 10, text = "Mishmannah the fourth, Jeremiah the fifth," },
  { t = "v", n = 11, text = "Attai the sixth, Eliel the seventh," },
  { t = "v", n = 12, text = "Johanan the eighth, Elzabad the ninth," },
  { t = "v", n = 13, text = "Jeremiah the tenth, and Machbanai the eleventh." },
  { t = "v", n = 14, p = true, text = "These Gadites were army commanders, the least of whom was a match for a hundred, and the greatest for a thousand." },
  { t = "v", n = 15, p = true, text = "These are the ones who crossed the Jordan in the first month when it was overflowing all its banks, and they put to flight all those in the valleys, both to the east and to the west." },
  { t = "v", n = 16, p = true, text = "Other Benjamites and some men from Judah also came to David in his stronghold." },
  { t = "v", n = 17, text = "And David went out to meet them, saying, “If you have come to me in peace to help me, my heart will be united with you; but if you have come to betray me to my enemies when my hands are free of violence, may the God of our fathers see it and judge you.”" },
  { t = "v", n = 18, p = true, text = "Then the Spirit came upon Amasai, the chief of the Thirty, and he said: “We are yours, O David! We are with you, O son of Jesse! Peace, peace to you, and peace to your helpers, for your God helps you.” So David received them and made them leaders of his troops." },
  { t = "v", n = 19, p = true, text = "Some from Manasseh defected to David when he went with the Philistines to fight against Saul. (They did not help the Philistines because the Philistine rulers consulted and sent David away, saying, “It will cost us our heads if he defects to his master Saul.”)" },
  { t = "v", n = 20, text = "When David went to Ziklag, these men of Manasseh defected to him: Adnah, Jozabad, Jediael, Michael, Jozabad, Elihu, and Zillethai, chiefs of thousands in Manasseh." },
  { t = "v", n = 21, p = true, text = "They helped David against the raiders, for they were all mighty men of valor and commanders in the army." },
  { t = "v", n = 22, p = true, text = "For at that time men came to David day after day to help him, until he had a great army, like the army of God." },
  { t = "h", level = 2, text = "David’s Army Grows at Hebron" },
  { t = "v", n = 23, p = true, text = "Now these are the numbers of men armed for battle who came to David at Hebron to turn Saul’s kingdom over to him, in accordance with the word of the LORD:" },
  { t = "v", n = 24, p = true, text = "From Judah: 6,800 armed troops bearing shields and spears." },
  { t = "v", n = 25, p = true, text = "From Simeon: 7,100 mighty men of valor, ready for battle." },
  { t = "v", n = 26, p = true, text = "From Levi: 4,600," },
  { t = "v", n = 27, text = "including Jehoiada, leader of the house of Aaron, with 3,700 men," },
  { t = "v", n = 28, text = "and Zadok, a mighty young man of valor, with 22 commanders from his own family." },
  { t = "v", n = 29, p = true, text = "From Benjamin, the kinsmen of Saul: 3,000, most of whom had remained loyal to the house of Saul up to that time." },
  { t = "v", n = 30, p = true, text = "From Ephraim: 20,800 mighty men of valor, famous among their own clans." },
  { t = "v", n = 31, p = true, text = "From the half-tribe of Manasseh:[^a] 18,000 designated by name to come and make David king." },
  { t = "v", n = 32, p = true, text = "From Issachar, men who understood the times and knew what Israel should do: 200 chiefs with all their kinsmen at their command." },
  { t = "v", n = 33, p = true, text = "From Zebulun: 50,000 fit for service, trained for battle with all kinds of weapons of war, who with one purpose were devoted to David.[^b]" },
  { t = "v", n = 34, p = true, text = "From Naphtali: 1,000 commanders, accompanied by 37,000 men with shield and spear." },
  { t = "v", n = 35, p = true, text = "From Dan: 28,600 prepared for battle." },
  { t = "v", n = 36, p = true, text = "From Asher: 40,000 fit for service, prepared for battle." },
  { t = "v", n = 37, p = true, text = "And from east of the Jordan, from Reuben, Gad, and the half-tribe of Manasseh there: 120,000 armed with every kind of weapon of war." },
  { t = "v", n = 38, p = true, text = "All these men of war, arrayed for battle, came to Hebron fully determined to make David king over all Israel. And all the rest of the Israelites were of one mind to make David king." },
  { t = "v", n = 39, p = true, text = "They spent three days there eating and drinking with David, for their relatives had provided for them." },
  { t = "v", n = 40, text = "And their neighbors from as far away as Issachar, Zebulun, and Naphtali came bringing food on donkeys, camels, mules, and oxen—abundant supplies of flour, fig cakes and raisin cakes, wine and oil, oxen and sheep. Indeed, there was joy in Israel." },
  { t = "note", id = "a", text = "That is, the half-tribe of Manasseh west of the Jordan" },
  { t = "note", id = "b", text = "LXX; Hebrew does not include *to David*." },
]

[[section]]
id = "13"
title = "1 Chronicles 13"
level = 1
blocks = [
  { t = "h", level = 2, text = "David Fetches the Ark" },
  { t = "ref", text = "(2 Samuel 6:1–4)" },
  { t = "v", n = 1, p = true, text = "Then David conferred with all his leaders, the commanders of thousands and of hundreds." },
  { t = "v", n = 2, text = "And he said to the whole assembly of Israel, “If it seems good to you, and if this is of the LORD our God, let us send word far and wide to the rest of our brothers in all the land of Israel, and also to the priests and Levites in their cities and pasturelands, so that they may join us." },
  { t = "v", n = 3, text = "Then let us bring back the ark of our God, for we did not inquire of Him[^a] in the days of Saul.”" },
  { t = "v", n = 4, p = true, text = "And because this proposal seemed right to all the people, the whole assembly agreed to it." },
  { t = "v", n = 5, text = "So David assembled all Israel, from the River Shihor[^b] in Egypt to Lebo-hamath, to bring the ark of God from Kiriath-jearim." },
  { t = "v", n = 6, p = true, text = "David and all Israel went up to Baalah of Judah (that is, Kiriath-jearim) to bring up from there the ark of God the LORD, who is enthroned between the cherubim—the ark that is called by the Name.[^c]" },
  { t = "v", n = 7, text = "So they carried the ark of God from the house of Abinadab on a new cart, with Uzzah and Ahio guiding the cart." },
  { t = "h", level = 2, text = "Uzzah Touches the Ark" },
  { t = "ref", text = "(2 Samuel 6:5–11)" },
  { t = "v", n = 8, p = true, text = "David and all the Israelites were celebrating before God with all their might, with songs and on harps and lyres, with tambourines, cymbals, and trumpets." },
  { t = "v", n = 9, p = true, text = "When they came to the threshing floor of Chidon,[^d] Uzzah reached out and took hold of the ark, because the oxen had stumbled." },
  { t = "v", n = 10, text = "And the anger of the LORD burned against Uzzah, and He struck him down because he had put his hand on the ark. So he died there before God." },
  { t = "v", n = 11, p = true, text = "Then David became angry because the LORD had burst forth against Uzzah. So he named that place Perez-uzzah,[^e] as it is called to this day." },
  { t = "v", n = 12, p = true, text = "That day David feared God and asked, “How can I ever bring the ark of God to me?”" },
  { t = "v", n = 13, text = "So he did not move the ark with him to the City of David; instead, he took it aside to the house of Obed-edom the Gittite." },
  { t = "v", n = 14, text = "Thus the ark of God remained with the family of Obed-edom in his house for three months, and the LORD blessed his household and everything he owned." },
  { t = "note", id = "a", text = "Or *of it*" },
  { t = "note", id = "b", text = "Hebrew *from the Shihor*" },
  { t = "note", id = "c", text = "Or *the ark of God, which is called by the Name of the LORD who is enthroned between the cherubim*; or *the ark of God, the LORD, who is enthroned between the cherubim, where His Name is called*" },
  { t = "note", id = "d", text = "*Chidon* is a variant of *Nacon*; see 2 Samuel 6:6." },
  { t = "note", id = "e", text = "*Perez-uzzah* means *outbreak against Uzzah*." },
]

[[section]]
id = "14"
title = "1 Chronicles 14"
level = 1
blocks = [
  { t = "h", level = 2, text = "David’s Family Grows" },
  { t = "ref", text = "(2 Samuel 5:12–16)" },
  { t = "v", n = 1, p = true, text = "Now Hiram king of Tyre sent envoys to David, along with cedar logs, stonemasons, and carpenters, to build a palace for him." },
  { t = "v", n = 2, text = "And David realized that the LORD had established him as king over Israel and had highly exalted his kingdom for the sake of His people Israel." },
  { t = "v", n = 3, p = true, text = "And David took more wives in Jerusalem and became the father of more sons and daughters." },
  { t = "v", n = 4, text = "These are the names of the children born to him in Jerusalem: Shammua,[^a] Shobab, Nathan, Solomon," },
  { t = "v", n = 5, text = "Ibhar, Elishua, Elpelet," },
  { t = "v", n = 6, text = "Nogah, Nepheg, Japhia," },
  { t = "v", n = 7, text = "Elishama, Beeliada,[^b] and Eliphelet." },
  { t = "h", level = 2, text = "Two Victories over the Philistines" },
  { t = "ref", text = "(2 Samuel 5:17–25)" },
  { t = "v", n = 8, p = true, text = "When the Philistines heard that David had been anointed king over all Israel, they all went in search of him; but David learned of this and went out to face them." },
  { t = "v", n = 9, p = true, text = "Now the Philistines had come and raided the Valley of Rephaim." },
  { t = "v", n = 10, text = "So David inquired of God, “Should I go up against the Philistines? Will You deliver them into my hand?” “Go,” replied the LORD, “for I will deliver them into your hand.”" },
  { t = "v", n = 11, p = true, text = "So David and his men went up to Baal-perazim, where he defeated the Philistines and said, “Like a bursting flood, God has burst out against my enemies by my hand.” So they called that place Baal-perazim.[^c]" },
  { t = "v", n = 12, text = "There the Philistines abandoned their gods, and David ordered that they be burned in the fire." },
  { t = "v", n = 13, p = true, text = "Once again the Philistines raided the valley." },
  { t = "v", n = 14, text = "So David again inquired of God, who answered him, “Do not march up after them, but circle around them and attack them in front of the balsam trees.[^d]" },
  { t = "v", n = 15, text = "As soon as you hear the sound of marching in the tops of the balsam trees, move out to battle, because this will mean that God has gone out before you to strike the camp of the Philistines.”" },
  { t = "v", n = 16, p = true, text = "So David did as God had commanded him, and they struck down the army of the Philistines all the way from Gibeon to Gezer." },
  { t = "v", n = 17, text = "And David’s fame went out into every land, and the LORD caused all nations to fear him." },
  { t = "note", id = "a", text = "*Shammua* is a variant of *Shimea*; see 1 Chronicles 3:5." },
  { t = "note", id = "b", text = "*Beeliada* is a variant of *Eliada*; see 2 Samuel 5:16." },
  { t = "note", id = "c", text = "*Baal-perazim* means *The Lord Bursts Out*." },
  { t = "note", id = "d", text = "Or *aspen trees* or *poplar trees*; also in verse 15" },
]

[[section]]
id = "15"
title = "1 Chronicles 15"
level = 1
blocks = [
  { t = "h", level = 2, text = "Preparing to Move the Ark" },
  { t = "ref", text = "(2 Samuel 6:12–15)" },
  { t = "v", n = 1, p = true, text = "David constructed buildings for himself in the City of David, and he prepared a place for the ark of God and pitched a tent for it." },
  { t = "v", n = 2, text = "Then David said, “No one but the Levites may carry the ark of God, because the LORD has chosen them to carry the ark of the LORD and to minister before Him forever.”" },
  { t = "v", n = 3, p = true, text = "And David assembled all Israel in Jerusalem to bring up the ark of the LORD to the place he had prepared for it." },
  { t = "v", n = 4, text = "Then he gathered together the descendants of Aaron and the Levites:" },
  { t = "v", n = 5, indent = 1, p = true, text = "From the Kohathites, Uriel the chief and 120 of his relatives;" },
  { t = "v", n = 6, indent = 1, p = true, text = "from the Merarites, Asaiah the chief and 220 of his relatives;" },
  { t = "v", n = 7, indent = 1, p = true, text = "from the Gershomites,[^a] Joel the chief and 130 of his relatives;" },
  { t = "v", n = 8, indent = 1, p = true, text = "from the Elizaphanites, Shemaiah the chief and 200 of his relatives;" },
  { t = "v", n = 9, indent = 1, p = true, text = "from the Hebronites, Eliel the chief and 80 of his relatives;" },
  { t = "v", n = 10, indent = 1, p = true, text = "and from the Uzzielites, Amminadab the chief and 112 of his relatives." },
  { t = "v", n = 11, p = true, text = "David summoned the priests Zadok and Abiathar and the Levites Uriel, Asaiah, Joel, Shemaiah, Eliel, and Amminadab." },
  { t = "v", n = 12, text = "And he said to them, “You are the heads of the Levitical families. You and your relatives must consecrate yourselves so that you may bring the ark of the LORD, the God of Israel, to the place I have prepared for it." },
  { t = "v", n = 13, text = "It was because you Levites were not with us the first time that the LORD our God burst forth in anger against us. For we did not consult Him about the proper order.”" },
  { t = "h", level = 2, text = "The Priests and Levites Carry the Ark" },
  { t = "v", n = 14, p = true, text = "So the priests and Levites consecrated themselves to bring up the ark of the LORD, the God of Israel." },
  { t = "v", n = 15, text = "And the Levites carried the ark of God on their shoulders with the poles, as Moses had commanded in accordance with the word of the LORD." },
  { t = "v", n = 16, p = true, text = "David also told the leaders of the Levites to appoint their relatives as singers to lift up their voices with joy, accompanied by musical instruments—harps, lyres, and cymbals." },
  { t = "v", n = 17, text = "So the Levites appointed Heman son of Joel; from his brothers, Asaph son of Berechiah; from their brothers the Merarites, Ethan son of Kushaiah;" },
  { t = "v", n = 18, text = "and with them their brothers next in rank: Zechariah,[^b] Jaaziel, Shemiramoth, Jehiel, Unni, Eliab, Benaiah, Maaseiah, Mattithiah, Eliphelehu, Mikneiah, and the gatekeepers Obed-edom and Jeiel.[^c]" },
  { t = "v", n = 19, p = true, text = "The musicians Heman, Asaph, and Ethan were to sound the bronze cymbals." },
  { t = "v", n = 20, text = "Zechariah, Aziel,[^d] Shemiramoth, Jehiel, Unni, Eliab, Maaseiah, and Benaiah were to play the harps according to Alamoth.[^e]" },
  { t = "v", n = 21, text = "And Mattithiah, Eliphelehu, Mikneiah, Obed-edom, Jeiel, and Azaziah were to lead the music with lyres according to Sheminith.[^f]" },
  { t = "v", n = 22, text = "Chenaniah the head Levite was the director of the music because he was highly skilled." },
  { t = "v", n = 23, p = true, text = "Berechiah and Elkanah were to be guardians[^g] of the ark." },
  { t = "v", n = 24, text = "Shebaniah, Joshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer—the priests—were to blow the trumpets before the ark of God. Obed-edom and Jehiah were also to be guardians of the ark." },
  { t = "h", level = 2, text = "Moving the Ark to Jerusalem" },
  { t = "v", n = 25, p = true, text = "So David, the elders of Israel, and the commanders of thousands went with rejoicing to bring the ark of the covenant of the LORD from the house of Obed-edom." },
  { t = "v", n = 26, text = "And because God helped the Levites who were carrying the ark of the covenant of the LORD, they sacrificed seven bulls and seven rams." },
  { t = "v", n = 27, p = true, text = "Now David was dressed in a robe of fine linen, as were all the Levites who were carrying the ark, as well as the singers and Chenaniah, the director of music for the singers. David also wore a linen ephod." },
  { t = "v", n = 28, text = "So all Israel brought up the ark of the covenant of the LORD with shouting, with the sounding of rams’ horns and trumpets, and with cymbals and the music of harps and lyres." },
  { t = "h", level = 2, text = "Michal’s Contempt for David" },
  { t = "ref", text = "(2 Samuel 6:16)" },
  { t = "v", n = 29, p = true, text = "As the ark of the covenant of the LORD was entering the City of David, Saul’s daughter Michal looked down from a window and saw King David dancing and celebrating, and she despised him in her heart." },
  { t = "note", id = "a", text = "*Gershomites* is a variant of *Gershonites*; see 1 Chronicles 23:7." },
  { t = "note", id = "b", text = "Several Hebrew manuscripts and most LXX manuscripts (see also verse 20 and 1 Chronicles 16:5); most Hebrew manuscripts *Zechariah son of* or *Zechariah, Ben,*" },
  { t = "note", id = "c", text = "Hebrew; some LXX manuscripts *Obed-edom, Jeiel, and Azaziah* or *Obed-edom, Jeiel, and Ozias*" },
  { t = "note", id = "d", text = "*Aziel* is a variant of *Jaaziel*; see verse 18." },
  { t = "note", id = "e", text = "*Alamoth*is probably a musical or liturgical term; here and in Psalm 46:1." },
  { t = "note", id = "f", text = "*Sheminith*is probably a musical term; here and in Psalm 6:1 and Psalm 12:1." },
  { t = "note", id = "g", text = "Literally *gatekeepers*; also in verse 24" },
]

[[section]]
id = "16"
title = "1 Chronicles 16"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Tent for the Ark" },
  { t = "ref", text = "(2 Samuel 6:17–19)" },
  { t = "v", n = 1, p = true, text = "So they brought the ark of God and placed it inside the tent that David had pitched for it. And they presented burnt offerings and peace offerings before God." },
  { t = "v", n = 2, text = "When David had finished sacrificing the burnt offerings and peace offerings, he blessed the people in the name of the LORD." },
  { t = "v", n = 3, text = "Then he distributed to every man and woman of Israel a loaf of bread, a date cake,[^a] and a raisin cake." },
  { t = "v", n = 4, p = true, text = "David appointed some of the Levites to minister before the ark of the LORD, to celebrate, to give thanks, and to praise the LORD, the God of Israel." },
  { t = "v", n = 5, text = "Asaph was the chief, Zechariah was second, then Jeiel, Shemiramoth, Jehiel, Mattithiah, Eliab, Benaiah, Obed-edom, and Jeiel. They were to play the harps and lyres, while Asaph sounded the cymbals" },
  { t = "v", n = 6, text = "and the priests Benaiah and Jahaziel blew the trumpets regularly before the ark of the covenant of God." },
  { t = "h", level = 2, text = "David’s Psalm of Thanksgiving" },
  { t = "ref", text = "(Psalm 105:1–15)" },
  { t = "v", n = 7, p = true, text = "On that day David first committed to Asaph and his associates this song of thanksgiving to the LORD:" },
  { t = "v", n = 8, indent = 1, p = true, text = "“Give thanks to the LORD; call upon His name; make known His deeds among the nations." },
  { t = "v", n = 9, indent = 1, text = "Sing to Him, sing praises to Him; tell of all His wonders." },
  { t = "v", n = 10, indent = 1, text = "Glory in His holy name; let the hearts of those who seek the LORD rejoice." },
  { t = "v", n = 11, indent = 1, text = "Seek out the LORD and His strength; seek His face always." },
  { t = "v", n = 12, indent = 1, text = "Remember the wonders He has done, His marvels, and the judgments He has pronounced," },
  { t = "v", n = 13, indent = 1, text = "O offspring of His servant Israel, O sons of Jacob, His chosen ones." },
  { t = "v", n = 14, indent = 1, p = true, text = "He is the LORD our God; His judgments carry throughout the earth." },
  { t = "v", n = 15, indent = 1, text = "Remember[^b] His covenant forever, the word He ordained for a thousand generations—" },
  { t = "v", n = 16, indent = 1, text = "the covenant He made with Abraham, and the oath He swore to Isaac." },
  { t = "v", n = 17, indent = 1, text = "He confirmed it to Jacob as a decree, to Israel as an everlasting covenant:" },
  { t = "v", n = 18, indent = 1, text = "‘I will give you the land of Canaan as the portion of your inheritance.’" },
  { t = "v", n = 19, indent = 1, p = true, text = "When they were few in number, few indeed, and strangers in the land," },
  { t = "v", n = 20, indent = 1, text = "they wandered from nation to nation, from one kingdom to another." },
  { t = "v", n = 21, indent = 1, text = "He let no man oppress them; He rebuked kings on their behalf:" },
  { t = "v", n = 22, indent = 1, text = "‘Do not touch My anointed ones! Do no harm to My prophets!’" },
  { t = "h", level = 2, text = "Sing to the LORD, All the Earth" },
  { t = "ref", text = "(Psalm 96:1–13)" },
  { t = "v", n = 23, indent = 1, p = true, text = "Sing to the LORD, all the earth. Proclaim His salvation day after day." },
  { t = "v", n = 24, indent = 1, text = "Declare His glory among the nations, His wonders among all peoples." },
  { t = "v", n = 25, indent = 1, p = true, text = "For great is the LORD, and greatly to be praised; He is to be feared above all gods." },
  { t = "v", n = 26, indent = 1, text = "For all the gods of the nations are idols, but it is the LORD who made the heavens." },
  { t = "v", n = 27, indent = 1, text = "Splendor and majesty are before Him; strength and joy fill His dwelling." },
  { t = "v", n = 28, indent = 1, p = true, text = "Ascribe to the LORD, O families of the nations, ascribe to the LORD glory and strength." },
  { t = "v", n = 29, indent = 1, text = "Ascribe to the LORD the glory due His name; bring an offering and come before Him. Worship the LORD in the splendor of His holiness;" },
  { t = "v", n = 30, indent = 2, text = "tremble before Him, all the earth. The world is firmly established; it cannot be moved." },
  { t = "v", n = 31, indent = 1, p = true, text = "Let the heavens be glad, and the earth rejoice. Let them say among the nations, ‘The LORD reigns!’" },
  { t = "v", n = 32, indent = 1, text = "Let the sea resound, and all that fills it; let the fields exult, and all that is in them." },
  { t = "v", n = 33, indent = 1, text = "Then the trees of the forest will sing for joy before the LORD, for He is coming to judge the earth." },
  { t = "v", n = 34, indent = 1, p = true, text = "Give thanks to the LORD, for He is good; His loving devotion[^c] endures forever." },
  { t = "v", n = 35, indent = 1, text = "Then cry out: ‘Save us, O God of our salvation; gather and deliver us from the nations, that we may give thanks to Your holy name, that we may glory in Your praise.’" },
  { t = "v", n = 36, indent = 1, p = true, text = "Blessed be the LORD, the God of Israel, from everlasting to everlasting.” Then all the people said, “Amen!” and “Praise the LORD!”" },
  { t = "h", level = 2, text = "Worship before the Ark" },
  { t = "v", n = 37, p = true, text = "So David left Asaph and his associates there before the ark of the covenant of the LORD, to minister there regularly according to the daily requirements," },
  { t = "v", n = 38, text = "along with Obed-edom and his sixty-eight relatives. Obed-edom son of Jeduthun, and also Hosah, were to be gatekeepers." },
  { t = "v", n = 39, p = true, text = "And David left Zadok the priest and his fellow priests before the tabernacle of the LORD at the high place in Gibeon" },
  { t = "v", n = 40, text = "to regularly present burnt offerings to the LORD on the altar of burnt offerings, morning and evening, according to all that was written in the Law of the LORD, which He had commanded Israel to keep." },
  { t = "v", n = 41, text = "With them were Heman, Jeduthun, and the rest of those chosen and designated by name to give thanks to the LORD, for “His loving devotion endures forever.”" },
  { t = "v", n = 42, p = true, text = "Heman and Jeduthun had with them trumpets and cymbals for the music and instruments for the songs of God.[^d] And the sons of Jeduthun were stationed at the gate." },
  { t = "v", n = 43, p = true, text = "Then all the people departed for their homes, and David returned home to bless his household." },
  { t = "note", id = "a", text = "Or *a portion of meat*" },
  { t = "note", id = "b", text = "Hebrew; some LXX manuscripts *He remembers*; see Psalm 105:8." },
  { t = "note", id = "c", text = "Forms of the Hebrew *chesed* are translated here and in most cases throughout the Scriptures as *loving devotion*; the range of meaning includes *love*, *goodness*, *kindness*, *faithfulness*, and *mercy*, as well as *loyalty to a covenant*." },
  { t = "note", id = "d", text = "Or *instruments for the sacred music*" },
]

[[section]]
id = "17"
title = "1 Chronicles 17"
level = 1
blocks = [
  { t = "h", level = 2, text = "God’s Covenant with David" },
  { t = "ref", text = "(2 Samuel 7:1–17)" },
  { t = "v", n = 1, p = true, text = "After David had settled into his palace, he said to Nathan the prophet, “Here I am, living in a house of cedar, while the ark of the covenant of the LORD is under a tent.”" },
  { t = "v", n = 2, p = true, text = "And Nathan replied to David, “Do all that is in your heart, for God is with you.”" },
  { t = "v", n = 3, p = true, text = "But that night the word of God came to Nathan, saying," },
  { t = "v", n = 4, text = "“Go and tell My servant David that this is what the LORD says: You are not the one to build Me a house in which to dwell." },
  { t = "v", n = 5, text = "For I have not dwelt in a house from the day I brought Israel up out of Egypt[^a] until this day, but I have moved from tent to tent and dwelling to dwelling." },
  { t = "v", n = 6, text = "In all My journeys with all the Israelites, have I ever asked any of the leaders[^b] I appointed to shepherd My people, ‘Why haven’t you built Me a house of cedar?’" },
  { t = "v", n = 7, p = true, text = "Now then, you are to tell My servant David that this is what the LORD of Hosts says: I took you from the pasture, from following the flock, to be the ruler over My people Israel." },
  { t = "v", n = 8, text = "I have been with you wherever you have gone, and I have cut off all your enemies from before you. Now I will make for you a name like that of the greatest in the land." },
  { t = "v", n = 9, p = true, text = "And I will provide a place for My people Israel and will plant them so that they may dwell in a place of their own and be disturbed no more. No longer will the sons of wickedness oppress them as they did at the beginning" },
  { t = "v", n = 10, text = "and have done since the day I appointed judges over My people Israel. And I will subdue all your enemies. Moreover, I declare to you that the LORD will build a house for you." },
  { t = "v", n = 11, text = "And when your days are fulfilled and you go to be with your fathers, I will raise up your descendant after you, one of your own sons, and I will establish his kingdom." },
  { t = "v", n = 12, text = "He will build a house for Me, and I will establish his throne forever." },
  { t = "v", n = 13, text = "I will be his Father, and he will be My son. And I will never remove My loving devotion from him as I removed it from your predecessor." },
  { t = "v", n = 14, text = "But I will set him over My house and My kingdom forever, and his throne will be established forever.”" },
  { t = "v", n = 15, p = true, text = "So Nathan relayed to David all the words of this entire revelation." },
  { t = "h", level = 2, text = "David’s Prayer of Thanksgiving" },
  { t = "ref", text = "(2 Samuel 7:18–29)" },
  { t = "v", n = 16, p = true, text = "Then King David went in, sat before the LORD, and said, “Who am I, O LORD God, and what is my house, that You have brought me this far?" },
  { t = "v", n = 17, text = "And as if this was a small thing in Your eyes, O God, You have spoken about the future of the house of Your servant and have regarded me as a man of great distinction,[^c] O LORD God." },
  { t = "v", n = 18, text = "What more can David say to You for honoring Your servant? For You know Your servant," },
  { t = "v", n = 19, text = "O LORD.[^d] For the sake of Your servant and according to Your own heart, You have accomplished this great thing and made known all these great promises." },
  { t = "v", n = 20, p = true, text = "O LORD, there is none like You, and there is no God but You, according to everything we have heard with our own ears." },
  { t = "v", n = 21, text = "And who is like Your people Israel—the one nation on earth whom God went out to redeem as a people for Himself? You made a name for Yourself through great and awesome wonders by driving out nations from before Your people, whom You redeemed from Egypt." },
  { t = "v", n = 22, text = "For You have made Your people Israel Your very own forever, and You, O LORD, have become their God." },
  { t = "v", n = 23, p = true, text = "And now, O LORD, let the word You have spoken concerning Your servant and his house be established forever. Do as You have promised," },
  { t = "v", n = 24, text = "so that Your name will be established and magnified forever when it is said, ‘The LORD of Hosts, the God of Israel, is God over Israel.’ And may the house of Your servant David be established before You." },
  { t = "v", n = 25, text = "For You, my God, have revealed to Your servant that You will build a house for him. Therefore Your servant has found the courage to pray before You." },
  { t = "v", n = 26, p = true, text = "And now, O LORD, You are God! And You have promised this goodness to Your servant." },
  { t = "v", n = 27, text = "So now You have been pleased to bless the house of Your servant, that it may continue forever before You. For You, O LORD, have blessed it, and it will be blessed forever.”" },
  { t = "note", id = "a", text = "*Out of Egypt*is implied, but not included in the Hebrew; see 2 Samuel 7:6." },
  { t = "note", id = "b", text = "Or *judges*; see verse 10." },
  { t = "note", id = "c", text = "Or *and have shown me future generations*" },
  { t = "note", id = "d", text = "See 2 Samuel 7:20; many translators *(18) ...For You know Your servant. (19) O LORD,*" },
]

[[section]]
id = "18"
title = "1 Chronicles 18"
level = 1
blocks = [
  { t = "h", level = 2, text = "David’s Triumphs" },
  { t = "ref", text = "(2 Samuel 8:1–14; Psalm 60:1–12)" },
  { t = "v", n = 1, p = true, text = "Some time later, David defeated the Philistines, subdued them, and took Gath and its villages from the hand of the Philistines." },
  { t = "v", n = 2, p = true, text = "David also defeated the Moabites, and they became subject to David and brought him tribute." },
  { t = "v", n = 3, p = true, text = "As far as Hamath, David also defeated King Hadadezer of Zobah, who had marched out to establish his dominion[^a] along the Euphrates River." },
  { t = "v", n = 4, text = "David captured from him a thousand chariots, seven thousand charioteers, and twenty thousand foot soldiers, and he hamstrung all the horses except a hundred he kept for the chariots." },
  { t = "v", n = 5, p = true, text = "When the Arameans of Damascus came to help King Hadadezer of Zobah, David struck down twenty-two thousand of their men." },
  { t = "v", n = 6, text = "Then he placed garrisons[^b] in Aram of Damascus, and the Arameans became subject to David and brought him tribute. So the LORD made David victorious[^c] wherever he went." },
  { t = "v", n = 7, p = true, text = "And David took the gold shields that belonged to the officers of Hadadezer and brought them to Jerusalem." },
  { t = "v", n = 8, text = "And from Tibhath[^d] and Cun, cities of Hadadezer, David took a large amount of bronze, with which Solomon made the bronze Sea, the pillars, and various bronze articles." },
  { t = "v", n = 9, p = true, text = "When King Tou[^e] of Hamath heard that David had defeated the entire army of Hadadezer king of Zobah," },
  { t = "v", n = 10, text = "he sent his son Hadoram[^f] to greet King David and bless him for fighting and defeating Hadadezer, who had been at war with Tou. Hadoram brought all kinds of articles of gold and silver and bronze," },
  { t = "v", n = 11, text = "and King David dedicated these to the LORD, along with the silver and gold he had carried off from all these nations—from Edom and Moab, and from the Ammonites, Philistines, and Amalekites." },
  { t = "v", n = 12, p = true, text = "Moreover, Abishai son of Zeruiah struck down eighteen thousand Edomites in the Valley of Salt." },
  { t = "v", n = 13, text = "He placed garrisons in Edom, and all the Edomites were subject to David. So the LORD made David victorious wherever he went." },
  { t = "h", level = 2, text = "David’s Officers" },
  { t = "ref", text = "(2 Samuel 8:15–18)" },
  { t = "v", n = 14, p = true, text = "Thus David reigned over all Israel and administered justice and righteousness for all his people:" },
  { t = "v", n = 15, indent = 1, p = true, text = "Joab son of Zeruiah was over the army; Jehoshaphat son of Ahilud was the recorder;" },
  { t = "v", n = 16, indent = 1, p = true, text = "Zadok son of Ahitub and Ahimelech[^g] son of Abiathar were priests; Shavsha[^h] was the scribe;" },
  { t = "v", n = 17, indent = 1, p = true, text = "Benaiah son of Jehoiada was over the Cherethites and Pelethites; and David’s sons were chief officials at the king’s side." },
  { t = "note", id = "a", text = "Hebrew *his hand*" },
  { t = "note", id = "b", text = "LXX and Vulgate (see also 2 Samuel 8:6 and Syriac); Hebrew does not include *garrisons*." },
  { t = "note", id = "c", text = "Or *the LORD saved David*; also in verse 13" },
  { t = "note", id = "d", text = "*Tibhath* is a variant of *Tebah*; see 2 Samuel 8:8 LXX." },
  { t = "note", id = "e", text = "*Tou* is a variant of *Toi*; also in verse 10; see 2 Samuel 8:9." },
  { t = "note", id = "f", text = "*Hadoram* is a variant of *Joram*; see 2 Samuel 8:10." },
  { t = "note", id = "g", text = "Some Hebrew manuscripts, Vulgate, and Syriac (see also 2 Samuel 8:17); most Hebrew manuscripts *Abimelech*" },
  { t = "note", id = "h", text = "*Shavsha* is also called *Seraiah*, *Sheva*, and *Shisha*; see 2 Samuel 8:17, 2 Samuel 20:25, and 1 Kings 4:3." },
]

[[section]]
id = "19"
title = "1 Chronicles 19"
level = 1
blocks = [
  { t = "h", level = 2, text = "David’s Messengers Disgraced" },
  { t = "ref", text = "(2 Samuel 10:1–8)" },
  { t = "v", n = 1, p = true, text = "Some time later, Nahash king of the Ammonites died and was succeeded by his son." },
  { t = "v", n = 2, text = "And David said, “I will show kindness to Hanun son of Nahash, because his father showed kindness to me.” So David sent messengers to console Hanun concerning his father. But when David’s servants arrived in the land of the Ammonites to console him," },
  { t = "v", n = 3, text = "the princes of the Ammonites said to Hanun, “Just because David has sent you comforters, do you really believe he is showing respect for your father? Have not his servants come to you to explore the land, spy it out, and overthrow it?”" },
  { t = "v", n = 4, p = true, text = "So Hanun took David’s servants, shaved their beards, cut off their garments at the hips, and sent them away." },
  { t = "v", n = 5, p = true, text = "When someone came and told David about his men, he sent messengers to meet them, since the men had been thoroughly humiliated. The king told them, “Stay in Jericho until your beards have grown back, and then return.”" },
  { t = "v", n = 6, p = true, text = "When the Ammonites realized that they had become a stench to David, Hanun and the Ammonites sent a thousand talents of silver[^a] to hire for themselves chariots and horsemen from Aram-naharaim,[^b] Aram-maacah, and Zobah." },
  { t = "v", n = 7, text = "So they hired for themselves thirty-two thousand chariots, as well as the king of Maacah with his troops, who came and camped near Medeba while the Ammonites were mustered from their cities and marched out for battle." },
  { t = "v", n = 8, p = true, text = "On hearing this, David sent Joab and the entire army of mighty men." },
  { t = "v", n = 9, text = "The Ammonites marched out and arrayed themselves for battle at the entrance to the city, while the kings who had come stayed by themselves in the open country." },
  { t = "h", level = 2, text = "David Defeats Ammon and Aram" },
  { t = "ref", text = "(2 Samuel 10:9–19)" },
  { t = "v", n = 10, p = true, text = "When Joab saw the battle lines before him and behind him, he selected some of the best men of Israel and arrayed them against the Arameans." },
  { t = "v", n = 11, text = "And he placed the rest of the troops under the command of his brother Abishai, who arrayed them against the Ammonites." },
  { t = "v", n = 12, p = true, text = "“If the Arameans are too strong for me,” said Joab, “then you will come to my rescue. And if the Ammonites are too strong for you, then I will come to your rescue." },
  { t = "v", n = 13, text = "Be strong and let us fight bravely for our people and for the cities of our God. May the LORD do what is good in His sight.”" },
  { t = "v", n = 14, p = true, text = "So Joab and his troops advanced to fight the Arameans, who fled before him." },
  { t = "v", n = 15, text = "When the Ammonites saw that the Arameans had fled, they too fled before Joab’s brother Abishai, and they entered the city. So Joab went back to Jerusalem." },
  { t = "v", n = 16, p = true, text = "When the Arameans saw that they had been defeated by Israel, they sent messengers to bring more Arameans from beyond the Euphrates,[^c] with Shophach[^d] the commander of Hadadezer’s army leading them." },
  { t = "v", n = 17, p = true, text = "When this was reported to David, he gathered all Israel, crossed the Jordan, advanced toward the Arameans, and arrayed for battle against them. When David lined up to engage them in battle, they fought against him." },
  { t = "v", n = 18, text = "But the Arameans fled before Israel, and David killed seven thousand of their charioteers and forty thousand foot soldiers. He also killed Shophach the commander of their army." },
  { t = "v", n = 19, p = true, text = "When Hadadezer’s subjects saw that they had been defeated by Israel, they made peace with David and became subject to him. So the Arameans were unwilling to help the Ammonites anymore." },
  { t = "note", id = "a", text = "*1,000 talents* is approximately 37.7 tons or 34.2 metric tons of silver." },
  { t = "note", id = "b", text = "That is, Mesopotamia; *Aram-naharaim* means *Aram of the two rivers*, likely the region between the Euphrates and Balih Rivers in northwestern Mesopotamia." },
  { t = "note", id = "c", text = "Hebrew *the River*" },
  { t = "note", id = "d", text = "*Shophach* is a variant of *Shobach*; also in verse 18; see 2 Samuel 10:16." },
]

[[section]]
id = "20"
title = "1 Chronicles 20"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Capture of Rabbah" },
  { t = "ref", text = "(2 Samuel 12:26–31)" },
  { t = "v", n = 1, p = true, text = "In the spring,[^a] at the time when kings march out to war, Joab led out the army and ravaged the land of the Ammonites. He came to Rabbah and besieged it, but David remained in Jerusalem. And Joab attacked Rabbah and demolished it." },
  { t = "v", n = 2, p = true, text = "Then David took the crown from the head of their king.[^b] It was found to weigh a talent of gold[^c] and was set with precious stones, and it was placed on David’s head. And David took a great amount of plunder from the city." },
  { t = "v", n = 3, p = true, text = "David brought out the people who were there and put them to work[^d] with saws, iron picks, and axes. And he did the same to all the Ammonite cities. Then David and all his troops returned to Jerusalem." },
  { t = "h", level = 2, text = "Battles against the Philistines" },
  { t = "ref", text = "(2 Samuel 21:15–22)" },
  { t = "v", n = 4, p = true, text = "Some time later, war broke out with the Philistines at Gezer. At that time Sibbecai the Hushathite killed Sippai,[^e] a descendant of the Rephaim,[^f] and the Philistines were subdued." },
  { t = "v", n = 5, p = true, text = "Once again there was a battle with the Philistines, and Elhanan son of Jair killed Lahmi the brother[^g] of Goliath the Gittite, the shaft of whose spear was like a weaver’s beam." },
  { t = "v", n = 6, p = true, text = "And there was also a battle at Gath, where there was a man of great stature with six fingers on each hand and six toes on each foot—twenty-four in all. He too was descended from Rapha," },
  { t = "v", n = 7, text = "and when he taunted Israel, Jonathan the son of David’s brother Shimei killed him." },
  { t = "v", n = 8, p = true, text = "So these descendants of Rapha in Gath fell at the hands of David and his servants." },
  { t = "note", id = "a", text = "Literally *At the turn of the year*" },
  { t = "note", id = "b", text = "Or *from the head of Milcom*. Milcom, also called Molech, was god of the Ammonites; see Leviticus 18:21 and 1 Kings 11:7." },
  { t = "note", id = "c", text = "*A talent* is approximately 75.4 pounds or 34.2 kilograms of gold." },
  { t = "note", id = "d", text = "Or *cut them*" },
  { t = "note", id = "e", text = "*Sippai* is a variant of *Saph*; see 2 Samuel 21:18." },
  { t = "note", id = "f", text = "Or *the giants*; see also *descendants of Rapha* in verses 6 and 8." },
  { t = "note", id = "g", text = "Or *Elhanan son of Jair the Bethlehemite killed the brother*; see 2 Samuel 21:19." },
]

[[section]]
id = "21"
title = "1 Chronicles 21"
level = 1
blocks = [
  { t = "h", level = 2, text = "David’s Military Census" },
  { t = "ref", text = "(Exodus 30:11–16; 2 Samuel 24:1–9)" },
  { t = "v", n = 1, p = true, text = "Then Satan[^a] rose up against Israel and incited David to take a census of Israel." },
  { t = "v", n = 2, text = "So David said to Joab and the commanders of the troops, “Go and count the Israelites from Beersheba to Dan and bring me a report, so that I may know their number.”" },
  { t = "v", n = 3, p = true, text = "But Joab replied, “May the LORD multiply His troops a hundred times over. My lord the king, are they not all servants of my lord? Why does my lord want to do this? Why should he bring guilt on Israel?”" },
  { t = "v", n = 4, p = true, text = "Nevertheless, the king’s word prevailed against Joab. So Joab departed and traveled throughout Israel, and then he returned to Jerusalem." },
  { t = "v", n = 5, text = "And Joab reported to David the total number of the troops. In all Israel there were 1,100,000 men who drew the sword, including 470,000 in Judah." },
  { t = "v", n = 6, text = "But Joab did not include Levi and Benjamin in the count, because the king’s command was detestable to him." },
  { t = "h", level = 2, text = "Judgment for David’s Sin" },
  { t = "ref", text = "(2 Samuel 24:10–14)" },
  { t = "v", n = 7, p = true, text = "This command was also evil in the sight of God; so He struck Israel." },
  { t = "v", n = 8, p = true, text = "Then David said to God, “I have sinned greatly because I have done this thing. Now I beg You to take away the iniquity of Your servant, for I have acted very foolishly.”" },
  { t = "v", n = 9, p = true, text = "And the LORD instructed Gad, David’s seer," },
  { t = "v", n = 10, text = "“Go and tell David that this is what the LORD says: ‘I am offering you three options. Choose one of them, and I will carry it out against you.’”" },
  { t = "v", n = 11, p = true, text = "So Gad went and said to David, “This is what the LORD says: ‘You must choose" },
  { t = "v", n = 12, text = "between three years of famine, three months of being swept away[^b] before your enemies and overtaken by their swords, or three days of the sword of the LORD—days of plague upon the land, with the angel of the LORD ravaging every part of Israel.’ Now then, decide how I should reply to Him who sent me.”" },
  { t = "v", n = 13, p = true, text = "David answered Gad, “I am deeply distressed. Please, let me fall into the hand of the LORD, for His mercies are very great; but do not let me fall into the hands of men.”" },
  { t = "h", level = 2, text = "A Plague on Israel" },
  { t = "ref", text = "(2 Samuel 24:15–17)" },
  { t = "v", n = 14, p = true, text = "So the LORD sent a plague upon Israel, and seventy thousand men of Israel fell dead." },
  { t = "v", n = 15, p = true, text = "Then God sent an angel to destroy Jerusalem, but as the angel was doing so, the LORD saw it and relented from the calamity, and He said to the angel who was destroying the people, “Enough! Withdraw your hand now!” At that time the angel of the LORD was standing by the threshing floor of Ornan[^c] the Jebusite." },
  { t = "v", n = 16, p = true, text = "When David lifted up his eyes and saw the angel of the LORD standing between heaven and earth, with a drawn sword in his hand stretched out over Jerusalem, David and the elders, clothed in sackcloth, fell facedown." },
  { t = "v", n = 17, text = "And David said to God, “Was it not I who gave the order to count the people? I[^d] am the one who has sinned and acted wickedly. But these sheep, what have they done? O LORD my God, please let Your hand fall upon me and my father’s house, but do not let this plague remain upon Your people.”" },
  { t = "h", level = 2, text = "David Builds an Altar" },
  { t = "ref", text = "(2 Samuel 24:18–25)" },
  { t = "v", n = 18, p = true, text = "Then the angel of the LORD ordered Gad to tell David to go up and build an altar to the LORD on the threshing floor of Ornan the Jebusite." },
  { t = "v", n = 19, text = "So David went up at the word that Gad had spoken in the name of the LORD." },
  { t = "v", n = 20, p = true, text = "Now Ornan was threshing wheat when he turned and saw the angel; and his four sons who were with him hid themselves." },
  { t = "v", n = 21, text = "David came to Ornan, and when Ornan looked out and saw David, he left the threshing floor and bowed facedown before David." },
  { t = "v", n = 22, p = true, text = "Then David said to Ornan, “Grant me the site of this threshing floor, that I may build an altar to the LORD. Sell it to me for the full price, so that the plague upon the people may be halted.”" },
  { t = "v", n = 23, p = true, text = "Ornan said to David, “Take it! May my lord the king do whatever seems good to him. Look, I will give the oxen for the burnt offerings, the threshing sledges for the wood, and the wheat for the grain offering—I will give it all.”" },
  { t = "v", n = 24, p = true, text = "“No,” replied King David, “I insist on paying the full price, for I will not take for the LORD what belongs to you, nor will I offer burnt offerings that cost me nothing.”" },
  { t = "v", n = 25, p = true, text = "So David paid Ornan six hundred shekels of gold[^e] for the site." },
  { t = "v", n = 26, text = "And there he built an altar to the LORD and offered burnt offerings and peace offerings. He called upon the LORD, who answered him with fire from heaven on the altar of burnt offering." },
  { t = "v", n = 27, p = true, text = "Then the LORD spoke to the angel, who put his sword back into its sheath." },
  { t = "v", n = 28, p = true, text = "At that time, when David saw that the LORD had answered him at the threshing floor of Ornan the Jebusite, he offered sacrifices there." },
  { t = "v", n = 29, text = "For the tabernacle of the LORD that Moses had made in the wilderness and the altar of burnt offering were presently at the high place in Gibeon," },
  { t = "v", n = 30, text = "but David could not go before it to inquire of God, because he was afraid of the sword of the angel of the LORD." },
  { t = "note", id = "a", text = "That is, *the Accuser* or *the Adversary*" },
  { t = "note", id = "b", text = "Hebrew; LXX and Vulgate *of fleeing*; see 2 Samuel 24:13." },
  { t = "note", id = "c", text = "*Ornan* is a variant of *Araunah*; also in verses 18–28; see 2 Samuel 24:16." },
  { t = "note", id = "d", text = "Or *I, the shepherd,*see 2 Samuel 24:17 DSS and LXX." },
  { t = "note", id = "e", text = "*600 shekels* is approximately 15.1 pounds or 6.8 kilograms of gold." },
]

[[section]]
id = "22"
title = "1 Chronicles 22"
level = 1
blocks = [
  { t = "h", level = 2, text = "Preparations for the Temple" },
  { t = "v", n = 1, p = true, text = "Then David said, “Here shall be the house of the LORD God, as well as the altar of burnt offering for Israel.”" },
  { t = "v", n = 2, p = true, text = "So David gave orders to gather the foreigners in the land of Israel, from whom he appointed stonecutters to prepare finished stones for building the house of God." },
  { t = "v", n = 3, p = true, text = "David provided a large quantity of iron to make the nails for the doors of the gateways and for the fittings, together with more bronze than could be weighed" },
  { t = "v", n = 4, text = "and more cedar logs than could be counted; for the Sidonians and Tyrians had brought a large quantity of cedar logs to David." },
  { t = "v", n = 5, p = true, text = "And David said, “My son Solomon is young and inexperienced, and the house to be built for the LORD must be exceedingly magnificent—famous and glorious throughout all lands. Therefore I must make preparations for it.” So David made lavish preparations before his death." },
  { t = "h", level = 2, text = "Solomon Anointed to Build the Temple" },
  { t = "v", n = 6, p = true, text = "Then David called for his son Solomon and instructed him to build a house for the LORD, the God of Israel." },
  { t = "v", n = 7, p = true, text = "“My son,” said David to Solomon, “it was in my heart to build a house for the Name of the LORD my God," },
  { t = "v", n = 8, text = "but this word of the LORD came to me: ‘You have shed much blood and waged great wars. You are not to build a house for My Name because you have shed so much blood on the ground before Me." },
  { t = "v", n = 9, text = "But a son will be born to you who will be a man of rest. I will give him rest from all his enemies on every side; for his name will be Solomon,[^a] and I will grant to Israel peace and quiet during his reign." },
  { t = "v", n = 10, text = "He is the one who will build a house for My Name. He will be My son, and I will be his Father. And I will establish the throne of his kingdom over Israel forever.’" },
  { t = "v", n = 11, p = true, text = "Now, my son, may the LORD be with you, and may you succeed in building the house of the LORD your God, as He said you would." },
  { t = "v", n = 12, text = "Above all, may the LORD give you insight and understanding when He puts you in command over Israel, so that you may keep the Law of the LORD your God." },
  { t = "v", n = 13, text = "Then you will succeed, if you carefully follow the statutes and ordinances that the LORD commanded Moses for Israel. Be strong and courageous. Do not be afraid or discouraged." },
  { t = "v", n = 14, p = true, text = "Now behold, I have taken great pains to provide for the house of the LORD—100,000 talents of gold,[^b] 1,000,000 talents of silver,[^c] and bronze and iron too great to be weighed. I have also provided timber and stone, and you may add to them." },
  { t = "v", n = 15, p = true, text = "You also have many workers: stonecutters, masons, carpenters, and men skilled in every kind of work—" },
  { t = "v", n = 16, text = "in gold and silver, bronze and iron—craftsmen beyond number. Now begin the work, and may the LORD be with you.”" },
  { t = "v", n = 17, p = true, text = "Then David ordered all the leaders of Israel to help his son Solomon:" },
  { t = "v", n = 18, text = "“Is not the LORD your God with you, and has He not granted you rest on every side? For He has given the inhabitants of the land into my hand, and the land has been subdued before the LORD and His people." },
  { t = "v", n = 19, text = "Now set your heart and soul to seek the LORD your God. Begin building the sanctuary of the LORD God, so that you may bring the ark of the covenant of the LORD and the holy articles of God into the temple that will be built for the Name of the LORD.”" },
  { t = "note", id = "a", text = "*Solomon* sounds like and is probably derived from the Hebrew word for *peace*." },
  { t = "note", id = "b", text = "*100,000 talents* is approximately 3,770 tons or 3,420 metric tons of gold." },
  { t = "note", id = "c", text = "*1,000,000 talents* is approximately 37,700 tons or 34,200 metric tons of silver." },
]

[[section]]
id = "23"
title = "1 Chronicles 23"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Divisions of the Levites" },
  { t = "v", n = 1, p = true, text = "When David was old and full of years, he installed his son Solomon as king over Israel." },
  { t = "v", n = 2, text = "Then he gathered all the leaders of Israel, as well as the priests and Levites." },
  { t = "v", n = 3, p = true, text = "The Levites thirty years of age or older were counted, and the total number of men was 38,000." },
  { t = "v", n = 4, text = "“Of these,” said David,[^a] “24,000 are to oversee the work of the house of the LORD, 6,000 are to be officers and judges," },
  { t = "v", n = 5, text = "4,000 are to be gatekeepers, and 4,000 are to praise the LORD with the instruments I have made for giving praise.”" },
  { t = "v", n = 6, p = true, text = "Then David divided the Levites into divisions according to the sons of Levi: Gershon, Kohath, and Merari." },
  { t = "h", level = 2, text = "The Gershonites" },
  { t = "ref", text = "(Numbers 3:21–26; Numbers 4:21–28)" },
  { t = "v", n = 7, indent = 1, p = true, text = "The Gershonites: Ladan[^b] and Shimei." },
  { t = "v", n = 8, indent = 1, p = true, text = "The sons of Ladan: Jehiel[^c] the first, Zetham, and Joel—three in all." },
  { t = "v", n = 9, indent = 1, p = true, text = "The sons of Shimei: Shelomoth, Haziel, and Haran—three in all. These were the heads of the families of Ladan." },
  { t = "v", n = 10, indent = 1, p = true, text = "And the sons of Shimei:[^d] Jahath, Zina,[^e] Jeush, and Beriah. These were the sons of Shimei—four in all." },
  { t = "v", n = 11, text = "Jahath was the first and Zizah was the second; but Jeush and Beriah did not have many sons, so they were counted as one family and received a single assignment." },
  { t = "h", level = 2, text = "The Kohathites" },
  { t = "ref", text = "(Numbers 3:27–32; Numbers 4:1–20)" },
  { t = "v", n = 12, indent = 1, p = true, text = "The sons of Kohath: Amram, Izhar, Hebron, and Uzziel—four in all." },
  { t = "v", n = 13, indent = 1, p = true, text = "The sons of Amram: Aaron and Moses. Aaron and his descendants were set apart forever to consecrate the most holy things, to burn incense before the LORD, to minister before Him, and to pronounce blessings in His name forever." },
  { t = "v", n = 14, text = "As for Moses the man of God, his sons were named among the tribe of Levi." },
  { t = "v", n = 15, indent = 1, p = true, text = "The sons of Moses: Gershom and Eliezer." },
  { t = "v", n = 16, indent = 1, p = true, text = "The descendants of Gershom: Shebuel was the first." },
  { t = "v", n = 17, indent = 1, p = true, text = "The descendants of Eliezer: Rehabiah was the first. Eliezer did not have any other sons, but the sons of Rehabiah were very numerous." },
  { t = "v", n = 18, indent = 1, p = true, text = "The sons of Izhar: Shelomith was the first." },
  { t = "v", n = 19, indent = 1, p = true, text = "The sons of Hebron: Jeriah was the first, Amariah the second, Jahaziel the third, and Jekameam the fourth." },
  { t = "v", n = 20, indent = 1, p = true, text = "The sons of Uzziel: Micah was the first and Isshiah the second." },
  { t = "h", level = 2, text = "The Merarites" },
  { t = "ref", text = "(Numbers 3:33–37; Numbers 4:29–33)" },
  { t = "v", n = 21, indent = 1, p = true, text = "The sons of Merari: Mahli and Mushi. The sons of Mahli: Eleazar and Kish." },
  { t = "v", n = 22, text = "Eleazar died without having any sons; he had only daughters. Their cousins, the sons of Kish, married them." },
  { t = "v", n = 23, indent = 1, p = true, text = "The sons of Mushi: Mahli, Eder, and Jeremoth[^f]—three in all." },
  { t = "h", level = 2, text = "Levite Duties Revised" },
  { t = "v", n = 24, p = true, text = "These were the descendants of Levi by their families—the heads of families, registered individually by name—those twenty years of age or older who worked in the service of the house of the LORD." },
  { t = "v", n = 25, p = true, text = "For David had said, “The LORD, the God of Israel, has given rest to His people and has come to dwell in Jerusalem forever." },
  { t = "v", n = 26, text = "So now the Levites no longer need to carry the tabernacle or any of the articles for its service.”" },
  { t = "v", n = 27, p = true, text = "For according to the final instructions of David, the Levites twenty years of age or older were counted," },
  { t = "v", n = 28, text = "but their duty was to assist the descendants of Aaron with the service of the house of the LORD, being responsible for the courts and chambers, the purification of all the holy things, and the work of the service of the house of God," },
  { t = "v", n = 29, text = "as well as for the rows of the showbread, the fine flour for the grain offering, the wafers of unleavened bread, the baking, the mixing, and all measurements of quantity and size." },
  { t = "v", n = 30, p = true, text = "They were also to stand every morning to give thanks and praise to the LORD, and likewise in the evening." },
  { t = "v", n = 31, text = "Whenever burnt offerings were presented to the LORD on the Sabbaths, New Moons, and appointed feasts, they were to serve regularly before the LORD in the numbers prescribed for them." },
  { t = "v", n = 32, text = "So the Levites were to carry out the responsibilities for the Tent of Meeting and the Holy Place, and, under their brothers the descendants of Aaron, the service of the house of the LORD." },
  { t = "note", id = "a", text = "Hebrew does not include *said David,*" },
  { t = "note", id = "b", text = "*Ladan* is a variant of *Libni*; also in verses 8 and 9; see 1 Chronicles 6:17." },
  { t = "note", id = "c", text = "*Jehiel* is a variant of *Jehieli*; see 1 Chronicles 26:21." },
  { t = "note", id = "d", text = "*Shimei* was possibly a son or grandson of the *Shimei* listed in verse 9." },
  { t = "note", id = "e", text = "Most Hebrew manuscripts; one Hebrew manuscript, LXX, and Vulgate (see also verse 11) *Zizah*" },
  { t = "note", id = "f", text = "*Jeremoth* is a variant of *Jerimoth*; see 1 Chronicles 24:30." },
]

[[section]]
id = "24"
title = "1 Chronicles 24"
level = 1
blocks = [
  { t = "h", level = 2, text = "Twenty-Four Divisions of Priests" },
  { t = "v", n = 1, p = true, text = "These were the divisions of the descendants of Aaron. The sons of Aaron were Nadab, Abihu, Eleazar, and Ithamar." },
  { t = "v", n = 2, text = "But Nadab and Abihu died before their father did, and they had no sons; so Eleazar and Ithamar served as priests." },
  { t = "v", n = 3, p = true, text = "With the help of Eleazar’s descendant Zadok and Ithamar’s descendant Ahimelech, David divided them according to the offices of their service." },
  { t = "v", n = 4, text = "Since more leaders were found among Eleazar’s descendants than those of Ithamar, they were divided accordingly. There were sixteen heads of families from the descendants of Eleazar and eight from the descendants of Ithamar." },
  { t = "v", n = 5, p = true, text = "Thus they were divided by lot, for there were officers of the sanctuary and officers of God among both Eleazar’s and Ithamar’s descendants." },
  { t = "v", n = 6, p = true, text = "The scribe, Shemaiah son of Nethanel, a Levite, recorded their names in the presence of the king and of the officers: Zadok the priest, Ahimelech son of Abiathar, and the heads of families of the priests and the Levites—one family being taken from Eleazar, and then one from Ithamar." },
  { t = "v", n = 7, indent = 1, p = true, text = "The first lot fell to Jehoiarib, the second to Jedaiah," },
  { t = "v", n = 8, indent = 1, p = true, text = "the third to Harim, the fourth to Seorim," },
  { t = "v", n = 9, indent = 1, p = true, text = "the fifth to Malchijah, the sixth to Mijamin," },
  { t = "v", n = 10, indent = 1, p = true, text = "the seventh to Hakkoz, the eighth to Abijah," },
  { t = "v", n = 11, indent = 1, p = true, text = "the ninth to Jeshua, the tenth to Shecaniah," },
  { t = "v", n = 12, indent = 1, p = true, text = "the eleventh to Eliashib, the twelfth to Jakim," },
  { t = "v", n = 13, indent = 1, p = true, text = "the thirteenth to Huppah, the fourteenth to Jeshebeab," },
  { t = "v", n = 14, indent = 1, p = true, text = "the fifteenth to Bilgah, the sixteenth to Immer," },
  { t = "v", n = 15, indent = 1, p = true, text = "the seventeenth to Hezir, the eighteenth to Happizzez," },
  { t = "v", n = 16, indent = 1, p = true, text = "the nineteenth to Pethahiah, the twentieth to Jehezkel," },
  { t = "v", n = 17, indent = 1, p = true, text = "the twenty-first to Jachin, the twenty-second to Gamul," },
  { t = "v", n = 18, indent = 1, p = true, text = "the twenty-third to Delaiah, and the twenty-fourth to Maaziah." },
  { t = "v", n = 19, p = true, text = "This was their appointed order for service when they entered the house of the LORD, according to the regulations prescribed for them by their forefather Aaron, as the LORD, the God of Israel, had commanded him." },
  { t = "h", level = 2, text = "The Rest of the Levites" },
  { t = "v", n = 20, p = true, text = "Now these were the rest of the descendants of Levi: From the sons of Amram: Shubael;[^a] from the sons of Shubael: Jehdeiah." },
  { t = "v", n = 21, indent = 1, p = true, text = "As for Rehabiah, from his sons: The first was Isshiah.[^b]" },
  { t = "v", n = 22, indent = 1, p = true, text = "From the Izharites: Shelomoth;[^c] from the sons of Shelomoth: Jahath." },
  { t = "v", n = 23, indent = 1, p = true, text = "From the sons of Hebron: Jeriah was the first,[^d] Amariah the second, Jahaziel the third, and Jekameam the fourth." },
  { t = "v", n = 24, indent = 1, p = true, text = "From the sons of Uzziel: Micah; from the sons of Micah: Shamir." },
  { t = "v", n = 25, indent = 1, p = true, text = "The brother of Micah: Isshiah; from the sons of Isshiah: Zechariah." },
  { t = "v", n = 26, indent = 1, p = true, text = "The sons of Merari: Mahli and Mushi. The son of Jaaziah: Beno." },
  { t = "v", n = 27, indent = 1, p = true, text = "The descendants of Merari from Jaaziah: Beno, Shoham, Zaccur, and Ibri." },
  { t = "v", n = 28, indent = 1, p = true, text = "From Mahli: Eleazar, who had no sons." },
  { t = "v", n = 29, indent = 1, p = true, text = "From Kish: Jerahmeel the son of Kish." },
  { t = "v", n = 30, indent = 1, p = true, text = "And the sons of Mushi: Mahli, Eder, and Jerimoth.[^e] These were the sons of the Levites, according to their families." },
  { t = "v", n = 31, text = "As their brothers the descendants of Aaron did, they also cast lots in the presence of King David and of Zadok, Ahimelech, and the heads of the families of the priests and Levites—the family heads and their younger brothers alike." },
  { t = "note", id = "a", text = "*Shubael* (twice in this verse) is a variant of *Shebuel*; see 1 Chronicles 23:16 and 1 Chronicles 26:24." },
  { t = "note", id = "b", text = "*Isshiah* is a variant of *Jeshaiah*; see 1 Chronicles 26:25." },
  { t = "note", id = "c", text = "*Shelomoth* (twice in this verse) is a variant of *Shelomith*; see 1 Chronicles 23:18." },
  { t = "note", id = "d", text = "Hebrew *From the sons: Jeriah*; see 1 Chronicles 23:19." },
  { t = "note", id = "e", text = "*Jerimoth* is a variant of *Jeremoth*; see 1 Chronicles 23:23." },
]

[[section]]
id = "25"
title = "1 Chronicles 25"
level = 1
blocks = [
  { t = "h", level = 2, text = "Twenty-Four Divisions of Musicians" },
  { t = "v", n = 1, p = true, text = "Additionally, David and the commanders of the army set apart some of the sons of Asaph, Heman, and Jeduthun to prophesy with the accompaniment of lyres, harps, and cymbals. The following is the list of the men who performed this service:" },
  { t = "v", n = 2, indent = 1, p = true, text = "From the sons of Asaph: Zaccur, Joseph, Nethaniah, and Asarelah. These sons of Asaph were under the direction of Asaph, who prophesied under the direction of the king." },
  { t = "v", n = 3, indent = 1, p = true, text = "From the sons of Jeduthun: Gedaliah, Zeri, Jeshaiah, Shimei,[^a] Hashabiah, and Mattithiah—six in all—under the direction of their father Jeduthun, who prophesied with the harp, giving thanks and praise to the LORD." },
  { t = "v", n = 4, indent = 1, p = true, text = "From the sons of Heman: Bukkiah, Mattaniah, Uzziel, Shebuel,[^b] Jerimoth,[^c] Hananiah, Hanani, Eliathah, Giddalti, Romamti-ezer, Joshbekashah, Mallothi, Hothir, and Mahazioth." },
  { t = "v", n = 5, text = "All these sons of Heman the king’s seer were given him through the promises of God to exalt him, for God had given Heman fourteen sons and three daughters." },
  { t = "v", n = 6, p = true, text = "All these were under the direction of their fathers for the music of the house of the LORD with cymbals, harps, and lyres, for the service of the house of God. Asaph, Jeduthun, and Heman were under the direction of the king." },
  { t = "v", n = 7, text = "Together with their relatives, who were all trained and skillful in the songs of the LORD, they numbered 288." },
  { t = "v", n = 8, text = "They cast lots for their duties, young and old alike, teacher as well as pupil." },
  { t = "v", n = 9, indent = 1, p = true, text = "The first lot, which was for Asaph, fell to Joseph, his sons, and his brothers—12 in all;[^d] the second to Gedaliah, his sons, and his brothers—12 in all;" },
  { t = "v", n = 10, indent = 1, p = true, text = "the third to Zaccur, his sons, and his brothers—12 in all;" },
  { t = "v", n = 11, indent = 1, p = true, text = "the fourth to Izri,[^e] his sons, and his brothers—12 in all;" },
  { t = "v", n = 12, indent = 1, p = true, text = "the fifth to Nethaniah, his sons, and his brothers—12 in all;" },
  { t = "v", n = 13, indent = 1, p = true, text = "the sixth to Bukkiah, his sons, and his brothers—12 in all;" },
  { t = "v", n = 14, indent = 1, p = true, text = "the seventh to Jesarelah,[^f] his sons, and his brothers—12 in all;" },
  { t = "v", n = 15, indent = 1, p = true, text = "the eighth to Jeshaiah, his sons, and his brothers—12 in all;" },
  { t = "v", n = 16, indent = 1, p = true, text = "the ninth to Mattaniah, his sons, and his brothers—12 in all;" },
  { t = "v", n = 17, indent = 1, p = true, text = "the tenth to Shimei, his sons, and his brothers—12 in all;" },
  { t = "v", n = 18, indent = 1, p = true, text = "the eleventh to Azarel,[^g] his sons, and his brothers—12 in all;" },
  { t = "v", n = 19, indent = 1, p = true, text = "the twelfth to Hashabiah, his sons, and his brothers—12 in all;" },
  { t = "v", n = 20, indent = 1, p = true, text = "the thirteenth to Shubael, his sons, and his brothers—12 in all;" },
  { t = "v", n = 21, indent = 1, p = true, text = "the fourteenth to Mattithiah, his sons, and his brothers—12 in all;" },
  { t = "v", n = 22, indent = 1, p = true, text = "the fifteenth to Jeremoth,[^h] his sons, and his brothers—12 in all;" },
  { t = "v", n = 23, indent = 1, p = true, text = "the sixteenth to Hananiah, his sons, and his brothers—12 in all;" },
  { t = "v", n = 24, indent = 1, p = true, text = "the seventeenth to Joshbekashah, his sons, and his brothers—12 in all;" },
  { t = "v", n = 25, indent = 1, p = true, text = "the eighteenth to Hanani, his sons, and his brothers—12 in all;" },
  { t = "v", n = 26, indent = 1, p = true, text = "the nineteenth to Mallothi, his sons, and his brothers—12 in all;" },
  { t = "v", n = 27, indent = 1, p = true, text = "the twentieth to Eliathah, his sons, and his brothers—12 in all;" },
  { t = "v", n = 28, indent = 1, p = true, text = "the twenty-first to Hothir, his sons, and his brothers—12 in all;" },
  { t = "v", n = 29, indent = 1, p = true, text = "the twenty-second to Giddalti, his sons, and his brothers—12 in all;" },
  { t = "v", n = 30, indent = 1, p = true, text = "the twenty-third to Mahazioth, his sons, and his brothers—12 in all;" },
  { t = "v", n = 31, indent = 1, p = true, text = "and the twenty-fourth to Romamti-ezer, his sons, and his brothers—12 in all." },
  { t = "note", id = "a", text = "One Hebrew manuscript and some LXX manuscripts (see also verse 17); most Hebrew manuscripts do not include *Shimei*." },
  { t = "note", id = "b", text = "*Shebuel* is a variant of *Shubael*; see verse 20." },
  { t = "note", id = "c", text = "*Jerimoth* is a variant of *Jeremoth*; see verse 22." },
  { t = "note", id = "d", text = "See LXX and the total in verse 7; Hebrew does not include *his sons, and his brothers—12 in all;*" },
  { t = "note", id = "e", text = "*Izri* is a variant of *Zeri*; see verse 3." },
  { t = "note", id = "f", text = "*Jesarelah* is a variant of *Asarelah*; see verse 2." },
  { t = "note", id = "g", text = "*Azarel* is a variant of *Uzziel*; see verse 4." },
  { t = "note", id = "h", text = "*Jeremoth* is a variant of *Jerimoth*; see verse 4." },
]

[[section]]
id = "26"
title = "1 Chronicles 26"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Divisions of the Gatekeepers" },
  { t = "v", n = 1, p = true, text = "These were the divisions of the gatekeepers: From the Korahites: Meshelemiah son of Kore, one of the sons of Asaph." },
  { t = "v", n = 2, indent = 1, p = true, text = "Meshelemiah had sons: Zechariah the firstborn, Jediael the second, Zebadiah the third, Jathniel the fourth," },
  { t = "v", n = 3, text = "Elam the fifth, Jehohanan the sixth, and Eliehoenai the seventh." },
  { t = "v", n = 4, indent = 1, p = true, text = "And Obed-edom also had sons: Shemaiah the firstborn, Jehozabad the second, Joah the third, Sachar the fourth, Nethanel the fifth," },
  { t = "v", n = 5, text = "Ammiel the sixth, Issachar the seventh, and Peullethai the eighth. For God had blessed Obed-edom." },
  { t = "v", n = 6, indent = 1, p = true, text = "Also to his son Shemaiah were born sons who ruled over their families because they were strong, capable men." },
  { t = "v", n = 7, text = "Shemaiah’s sons were Othni, Rephael, Obed, and Elzabad; his brothers were Elihu and Semachiah, also capable men." },
  { t = "v", n = 8, text = "All these were descendants of Obed-edom; they and their sons and brothers were capable men with strength to do the work—62 in all from Obed-edom." },
  { t = "v", n = 9, indent = 1, p = true, text = "Meshelemiah also had sons and brothers who were capable men—18 in all." },
  { t = "v", n = 10, indent = 1, p = true, text = "Hosah the Merarite also had sons: Shimri the first (although he was not the firstborn, his father had appointed him as the first)," },
  { t = "v", n = 11, text = "Hilkiah the second, Tebaliah the third, and Zechariah the fourth. The sons and brothers of Hosah numbered 13 in all." },
  { t = "v", n = 12, p = true, text = "These divisions of the gatekeepers, through their chief men, had duties for ministering in the house of the LORD, just as their relatives did." },
  { t = "v", n = 13, text = "They cast lots for each gate, according to their families, young and old alike." },
  { t = "v", n = 14, indent = 1, p = true, text = "The lot for the East Gate fell to Shelemiah.[^a] Then lots were cast for his son Zechariah, a wise counselor, and the lot for the North Gate fell to him." },
  { t = "v", n = 15, indent = 1, p = true, text = "The lot for the South Gate fell to Obed-edom, and the lot for the storehouses to his sons." },
  { t = "v", n = 16, indent = 1, p = true, text = "The lots for the West Gate and the Shallecheth Gate on the ascending highway[^b] fell to Shuppim and Hosah. There were guards stationed at every watch." },
  { t = "v", n = 17, text = "Each day there were six Levites on the east, four on the north, four on the south, and two pairs at the storehouse." },
  { t = "v", n = 18, text = "As for the court[^c] on the west, there were four at the highway and two at the court." },
  { t = "v", n = 19, p = true, text = "These were the divisions of the gatekeepers who were descendants of Korah and Merari." },
  { t = "h", level = 2, text = "The Treasurers, Officers, and Judges" },
  { t = "v", n = 20, p = true, text = "Now their fellow Levites were[^d] in charge of the treasuries of the house of God and the treasuries of the dedicated things." },
  { t = "v", n = 21, text = "From the descendants of Ladan, who were Gershonites through Ladan[^e] and heads of the families of Ladan the Gershonite, were Jehieli,[^f]" },
  { t = "v", n = 22, text = "the sons of Jehieli, Zetham, and his brother Joel. They were in charge of the treasuries of the house of the LORD." },
  { t = "v", n = 23, p = true, text = "From the Amramites, the Izharites, the Hebronites, and the Uzzielites:" },
  { t = "v", n = 24, indent = 1, p = true, text = "Shebuel, a descendant of Gershom son of Moses, was the officer in charge of the treasuries." },
  { t = "v", n = 25, text = "His relatives through Eliezer included Rehabiah his son, Jeshaiah[^g] his son, Joram his son, Zichri his son, and Shelomith his son." },
  { t = "v", n = 26, text = "This Shelomith and his brothers were in charge of all the treasuries for the things dedicated by King David, by the heads of families who were the commanders of thousands and of hundreds, and by the army commanders." },
  { t = "v", n = 27, text = "They had dedicated some of the plunder from their battles to the repair of the house of the LORD." },
  { t = "v", n = 28, text = "Everything that had been dedicated by Samuel the seer, Saul son of Kish, Abner son of Ner, and Joab son of Zeruiah, along with everything else that was dedicated, was under the care of Shelomith and his brothers." },
  { t = "v", n = 29, indent = 1, p = true, text = "From the Izharites, Chenaniah and his sons had the outside duties[^h] as officers and judges over Israel." },
  { t = "v", n = 30, indent = 1, p = true, text = "From the Hebronites, Hashabiah and his relatives, 1,700 capable men, had charge of the affairs of Israel west of the Jordan for all the work of the LORD and for the service of the king." },
  { t = "v", n = 31, text = "As for the Hebronites, Jerijah[^i] was the chief of the Hebronites, according to the genealogies of his ancestors. In the fortieth year of David’s reign the records were searched, and strong, capable men were found among the Hebronites at Jazer in Gilead." },
  { t = "v", n = 32, text = "Among Jerijah’s relatives there were 2,700 capable men who were heads of families. King David appointed them over the Reubenites, the Gadites, and the half-tribe of Manasseh for every matter pertaining to God and for the affairs of the king." },
  { t = "note", id = "a", text = "*Shelemiah* is a variant of *Meshelemiah*; see verse 2." },
  { t = "note", id = "b", text = "Or *on the upper road*" },
  { t = "note", id = "c", text = "Hebrew *parbar*; twice in this verse" },
  { t = "note", id = "d", text = "LXX; Hebrew *As for the Levites, Ahijah was*" },
  { t = "note", id = "e", text = "*Ladan* is a variant of *Libni*; see 1 Chronicles 6:17." },
  { t = "note", id = "f", text = "*Jehieli* is a variant of *Jehiel*; also in verse 22; see 1 Chronicles 23:8." },
  { t = "note", id = "g", text = "*Jeshaiah* is a variant of *Isshiah*; see 1 Chronicles 24:21." },
  { t = "note", id = "h", text = "Or *the duties outside (the temple)* or *the duties outside (Jerusalem)*" },
  { t = "note", id = "i", text = "*Jerijah* is a variant of *Jeriah*; see 1 Chronicles 23:19." },
]

[[section]]
id = "27"
title = "1 Chronicles 27"
level = 1
blocks = [
  { t = "h", level = 2, text = "Twelve Captains for Twelve Months" },
  { t = "v", n = 1, p = true, text = "This is the list of the Israelites—the heads of families, the commanders of thousands and of hundreds, and their officers who served the king in every matter concerning the divisions on rotating military duty each month throughout the year. There were 24,000 men in each division:" },
  { t = "v", n = 2, indent = 1, p = true, text = "Jashobeam son of Zabdiel was in charge of the first division, which was assigned the first month. There were 24,000 men in his division." },
  { t = "v", n = 3, text = "He was a descendant of Perez and chief of all the army commanders for the first month." },
  { t = "v", n = 4, indent = 1, p = true, text = "Dodai[^a] the Ahohite was in charge of the division for the second month, and Mikloth was the leader. There were 24,000 men in his division." },
  { t = "v", n = 5, indent = 1, p = true, text = "The third army commander, as chief for the third month, was Benaiah son of Jehoiada the priest. There were 24,000 men in his division." },
  { t = "v", n = 6, text = "This Benaiah was mighty among the Thirty and was over the Thirty, and his son Ammizabad was in charge of his division." },
  { t = "v", n = 7, indent = 1, p = true, text = "The fourth, for the fourth month, was Joab’s brother Asahel, and his son Zebadiah was commander after him. There were 24,000 men in his division." },
  { t = "v", n = 8, indent = 1, p = true, text = "The fifth, for the fifth month, was the commander Shamhuth[^b] the Izrahite. There were 24,000 men in his division." },
  { t = "v", n = 9, indent = 1, p = true, text = "The sixth, for the sixth month, was Ira son of Ikkesh the Tekoite. There were 24,000 men in his division." },
  { t = "v", n = 10, indent = 1, p = true, text = "The seventh, for the seventh month, was Helez the Pelonite, an Ephraimite. There were 24,000 men in his division." },
  { t = "v", n = 11, indent = 1, p = true, text = "The eighth, for the eighth month, was Sibbecai the Hushathite, a Zerahite. There were 24,000 men in his division." },
  { t = "v", n = 12, indent = 1, p = true, text = "The ninth, for the ninth month, was Abiezer the Anathothite, a Benjamite. There were 24,000 men in his division." },
  { t = "v", n = 13, indent = 1, p = true, text = "The tenth, for the tenth month, was Maharai the Netophathite, a Zerahite. There were 24,000 men in his division." },
  { t = "v", n = 14, indent = 1, p = true, text = "The eleventh, for the eleventh month, was Benaiah the Pirathonite, an Ephraimite. There were 24,000 men in his division." },
  { t = "v", n = 15, indent = 1, p = true, text = "The twelfth, for the twelfth month, was Heldai[^c] the Netophathite, from the family of Othniel. There were 24,000 men in his division." },
  { t = "h", level = 2, text = "The Leaders of the Twelve Tribes" },
  { t = "v", n = 16, p = true, text = "These officers were in charge of the tribes of Israel: Over the Reubenites was Eliezer son of Zichri; over the Simeonites was Shephatiah son of Maacah;" },
  { t = "v", n = 17, indent = 1, p = true, text = "over Levi was Hashabiah son of Kemuel; over Aaron was Zadok;" },
  { t = "v", n = 18, indent = 1, p = true, text = "over Judah was Elihu, one of David’s brothers; over Issachar was Omri son of Michael;" },
  { t = "v", n = 19, indent = 1, p = true, text = "over Zebulun was Ishmaiah son of Obadiah; over Naphtali was Jerimoth son of Azriel;" },
  { t = "v", n = 20, indent = 1, p = true, text = "over the Ephraimites was Hoshea son of Azaziah; over one of the half-tribes of Manasseh was Joel son of Pedaiah;" },
  { t = "v", n = 21, indent = 1, p = true, text = "over the half-tribe of Manasseh in Gilead was Iddo son of Zechariah; over Benjamin was Jaasiel son of Abner;" },
  { t = "v", n = 22, indent = 1, text = "and over Dan was Azarel son of Jeroham. These were the leaders of the tribes of Israel." },
  { t = "v", n = 23, p = true, text = "David did not count the men aged twenty or under, because the LORD had said that He would make Israel as numerous as the stars of the sky." },
  { t = "v", n = 24, text = "Joab son of Zeruiah began to count the men but did not finish. For because of this census wrath came upon Israel, and the number was not entered in the Book of the Chronicles of King David." },
  { t = "h", level = 2, text = "David’s Various Overseers" },
  { t = "v", n = 25, indent = 1, p = true, text = "Azmaveth son of Adiel was in charge of the royal storehouses. Jonathan son of Uzziah was in charge of the storehouses in the country, in the cities, in the villages, and in the fortresses." },
  { t = "v", n = 26, indent = 1, p = true, text = "Ezri son of Chelub was in charge of the workers in the fields who tilled the soil." },
  { t = "v", n = 27, indent = 1, p = true, text = "Shimei the Ramathite was in charge of the vineyards. Zabdi the Shiphmite was in charge of the produce of the vineyards for the wine vats." },
  { t = "v", n = 28, indent = 1, p = true, text = "Baal-hanan the Gederite was in charge of the olive and sycamore trees in the foothills.[^d] Joash was in charge of the stores of olive oil." },
  { t = "v", n = 29, indent = 1, p = true, text = "Shitrai the Sharonite was in charge of the herds grazing in Sharon. Shaphat son of Adlai was in charge of the herds in the valleys." },
  { t = "v", n = 30, indent = 1, p = true, text = "Obil the Ishmaelite was in charge of the camels. Jehdeiah the Meronothite was in charge of the donkeys." },
  { t = "v", n = 31, indent = 1, p = true, text = "Jaziz the Hagrite was in charge of the flocks. All these officials were in charge of King David’s property." },
  { t = "h", level = 2, text = "The Counselors" },
  { t = "v", n = 32, indent = 1, p = true, text = "David’s uncle Jonathan was a counselor; he was a man of insight and a scribe. Jehiel son of Hachmoni attended to the sons of the king." },
  { t = "v", n = 33, indent = 1, p = true, text = "Ahithophel was the king’s counselor. Hushai the Archite was the king’s friend." },
  { t = "v", n = 34, indent = 1, p = true, text = "Ahithophel was succeeded by Jehoiada son of Benaiah, then by Abiathar. Joab was the commander of the king’s army." },
  { t = "note", id = "a", text = "*Dodai* is a variant of *Dodo*; see 2 Samuel 23:9." },
  { t = "note", id = "b", text = "*Shamhuth* is a variant of *Shammoth* or *Shammah*; see 1 Chronicles 11:27 and 2 Samuel 23:25." },
  { t = "note", id = "c", text = "*Heldai* is a variant of *Heled*; see 1 Chronicles 11:30 and 2 Samuel 23:29." },
  { t = "note", id = "d", text = "Hebrew *Shephelah* or *lowlands*; that is, the western foothills of Judea" },
]

[[section]]
id = "28"
title = "1 Chronicles 28"
level = 1
blocks = [
  { t = "h", level = 2, text = "David Commissions Solomon" },
  { t = "v", n = 1, p = true, text = "Now David summoned all the leaders of Israel to Jerusalem: the leaders of the tribes, the leaders of the divisions in the king’s service, the commanders of thousands and of hundreds, and the officials in charge of all the property and cattle of the king and his sons, along with the court officials and mighty men—every mighty man of valor." },
  { t = "v", n = 2, p = true, text = "Then King David rose to his feet and said, “Listen to me, my brothers and my people. It was in my heart to build a house as a resting place for the ark of the covenant of the LORD and as a footstool for our God. I had made preparations to build it," },
  { t = "v", n = 3, text = "but God said to me, ‘You are not to build a house for My Name, because you are a man of war who has shed blood.’" },
  { t = "v", n = 4, p = true, text = "Yet the LORD, the God of Israel, chose me out of all my father’s house to be king over Israel forever. For He chose Judah as leader, and from the house of Judah He chose my father’s household, and from my father’s sons He was pleased to make me king over all Israel." },
  { t = "v", n = 5, text = "And of all my sons—for the LORD has given me many sons—He has chosen Solomon my son to sit on the throne of the kingdom of the LORD over Israel." },
  { t = "v", n = 6, text = "And He said to me, ‘Solomon your son is the one who will build My house and My courts, for I have chosen him as My son, and I will be his Father." },
  { t = "v", n = 7, text = "I will establish his kingdom forever, if he resolutely carries out My commandments and ordinances, as is being done this day.’" },
  { t = "v", n = 8, p = true, text = "So now in the sight of all Israel, the assembly of the LORD, and in the hearing of our God, keep and seek out all the commandments of the LORD your God, so that you may possess this good land and leave it as an inheritance to your descendants forever." },
  { t = "v", n = 9, text = "As for you, Solomon my son, know the God of your father and serve Him wholeheartedly and with a willing mind, for the LORD searches every heart and understands the intent of every thought. If you seek Him, He will be found by you; but if you forsake Him, He will reject you forever." },
  { t = "v", n = 10, text = "Consider now that the LORD has chosen you to build a house for the sanctuary. Be strong and do it.”" },
  { t = "h", level = 2, text = "The Plans for the Temple" },
  { t = "v", n = 11, p = true, text = "Then David gave his son Solomon the plans for the portico of the temple,[^a] its buildings, storehouses, upper rooms, inner rooms, and the room for the mercy seat.[^b]" },
  { t = "v", n = 12, text = "The plans contained everything David had in mind[^c] for the courts of the house of the LORD, for all the surrounding rooms, for the treasuries of the house of God and of the dedicated things," },
  { t = "v", n = 13, text = "for the divisions of the priests and Levites, for all the work of service in the house of the LORD, and for all the articles of service in the house of the LORD:" },
  { t = "v", n = 14, indent = 1, p = true, text = "the weight of all the gold articles for every kind of service; the weight of all the silver articles for every kind of service;" },
  { t = "v", n = 15, indent = 1, p = true, text = "the weight of the gold lampstands and their lamps, including the weight of each lampstand and its lamps; the weight of each silver lampstand and its lamps, according to the use of each lampstand;" },
  { t = "v", n = 16, indent = 1, p = true, text = "the weight of gold for each table of showbread, and of silver for the silver tables;" },
  { t = "v", n = 17, indent = 1, p = true, text = "the weight of the pure gold for the forks, sprinkling bowls, and pitchers; the weight of each gold dish; the weight of each silver bowl;" },
  { t = "v", n = 18, indent = 1, p = true, text = "the weight of the refined gold for the altar of incense; and the plans for the chariot of the gold cherubim that spread their wings and overshadowed the ark of the covenant of the LORD." },
  { t = "v", n = 19, p = true, text = "“All this,” said David, “all the details of this plan, the LORD has made clear to me in writing by His hand upon me.”" },
  { t = "v", n = 20, p = true, text = "David also said to Solomon his son, “Be strong and courageous, and do it. Do not be afraid or discouraged, for the LORD God, my God, is with you. He will neither fail you nor forsake you before all the work for the service of the house of the LORD is finished." },
  { t = "v", n = 21, text = "The divisions of the priests and Levites are ready for all the service of the house of God, and every willing man of every skill will be at your disposal for the work. The officials and all the people are fully at your command.”" },
  { t = "note", id = "a", text = "LXX; Hebrew does not include *of the temple*." },
  { t = "note", id = "b", text = "Or *atonement cover*" },
  { t = "note", id = "c", text = "Or *had with him by the Spirit*" },
]

[[section]]
id = "29"
title = "1 Chronicles 29"
level = 1
blocks = [
  { t = "h", level = 2, text = "Offerings for the Temple" },
  { t = "v", n = 1, p = true, text = "Then King David said to the whole assembly, “My son Solomon, the one whom God has chosen, is young and inexperienced. The task is great because this palace is not for man, but for the LORD God." },
  { t = "v", n = 2, text = "Now with all my ability I have made provision for the house of my God—gold for the gold articles, silver for the silver, bronze for the bronze, iron for the iron, and wood for the wood, as well as onyx for the settings, turquoise, stones of various colors, all kinds of precious stones, and slabs of marble—all in abundance." },
  { t = "v", n = 3, p = true, text = "Moreover, because of my delight in the house of my God, I now give for it my personal treasures of gold and silver, over and above all that I have provided for this holy temple:" },
  { t = "v", n = 4, text = "three thousand talents of gold[^a] (the gold of Ophir) and seven thousand talents of refined silver,[^b] to overlay the walls of the buildings," },
  { t = "v", n = 5, text = "for the gold work and the silver work, and for all the work to be done by the craftsmen. Now who is willing to consecrate himself to the LORD today?”" },
  { t = "v", n = 6, p = true, text = "Then the leaders of the families, the officers of the tribes of Israel, the commanders of thousands and of hundreds, and the officials in charge of the king’s work gave willingly." },
  { t = "v", n = 7, text = "Toward the service of God’s house they gave 5,000 talents[^c] and 10,000 darics of gold,[^d] 10,000 talents of silver,[^e] 18,000 talents of bronze,[^f] and 100,000 talents of iron.[^g]" },
  { t = "v", n = 8, text = "Whoever had precious stones gave them to the treasury of the house of the LORD, under the care of Jehiel[^h] the Gershonite." },
  { t = "v", n = 9, text = "And the people rejoiced at the willing response of their leaders, for they had given to the LORD freely and wholeheartedly. And King David also rejoiced greatly." },
  { t = "h", level = 2, text = "David’s Prayer of Blessing" },
  { t = "v", n = 10, p = true, text = "Then David blessed the LORD in the sight of all the assembly and said: “May You be blessed, O LORD, God of our father Israel, from everlasting to everlasting." },
  { t = "v", n = 11, p = true, text = "Yours, O LORD, is the greatness and the power and the glory and the splendor and the majesty, for everything in heaven and on earth belongs to You. Yours, O LORD, is the kingdom, and You are exalted as head over all." },
  { t = "v", n = 12, text = "Both riches and honor come from You, and You are the ruler over all. In Your hands are power and might to exalt and give strength to all." },
  { t = "v", n = 13, p = true, text = "Now therefore, our God, we give You thanks, and we praise Your glorious name." },
  { t = "v", n = 14, text = "But who am I, and who are my people, that we should be able to give as generously as this? For everything comes from You, and from Your own hand we have given to You." },
  { t = "v", n = 15, text = "For we are foreigners and strangers in Your presence, as were all our forefathers. Our days on earth are like a shadow, without hope." },
  { t = "v", n = 16, p = true, text = "O LORD our God, from Your hand comes all this abundance that we have provided to build You a house for Your holy Name, and all of it belongs to You." },
  { t = "v", n = 17, text = "I know, my God, that You test the heart and delight in uprightness. All these things I have given willingly and with an upright heart, and now I have seen Your people who are present here giving joyfully and willingly to You." },
  { t = "v", n = 18, p = true, text = "O LORD, God of our fathers Abraham, Isaac, and Israel, keep this desire forever in the intentions of the hearts of Your people, and direct their hearts toward You." },
  { t = "v", n = 19, text = "And give my son Solomon a whole heart to keep and carry out all Your commandments, decrees, and statutes, and to build Your palace for which I have made provision.”" },
  { t = "v", n = 20, p = true, text = "Then David said to the whole assembly, “Bless the LORD your God.” So the whole assembly blessed the LORD, the God of their fathers. They bowed down and paid homage to the LORD and to the king." },
  { t = "h", level = 2, text = "Solomon Anointed King" },
  { t = "ref", text = "(1 Kings 1:32–40)" },
  { t = "v", n = 21, p = true, text = "The next day they offered sacrifices and presented burnt offerings to the LORD: a thousand bulls, a thousand rams, and a thousand lambs, along with their drink offerings, and other sacrifices in abundance for all Israel." },
  { t = "v", n = 22, text = "That day they ate and drank with great joy in the presence of the LORD. Then, for a second time, they designated David’s son Solomon as king, anointing him before the LORD as ruler, and Zadok as the priest." },
  { t = "v", n = 23, p = true, text = "So Solomon sat on the throne of the LORD as king in place of his father David. He prospered, and all Israel obeyed him." },
  { t = "v", n = 24, text = "All the officials and mighty men, as well as all of King David’s sons, pledged their allegiance to King Solomon." },
  { t = "v", n = 25, p = true, text = "The LORD highly exalted Solomon in the sight of all Israel and bestowed on him royal majesty such as had not been bestowed on any king in Israel before him." },
  { t = "h", level = 2, text = "David’s Reign and Death" },
  { t = "ref", text = "(1 Kings 2:10–12)" },
  { t = "v", n = 26, p = true, text = "David son of Jesse was king over all Israel." },
  { t = "v", n = 27, text = "The length of David’s reign over Israel was forty years—seven years in Hebron and thirty-three years in Jerusalem." },
  { t = "v", n = 28, text = "He died at a ripe old age, full of years, riches, and honor, and his son Solomon reigned in his place." },
  { t = "v", n = 29, p = true, text = "Now the acts of King David, from first to last, are indeed written in the Chronicles of Samuel the Seer, the Chronicles of Nathan the Prophet, and the Chronicles of Gad the Seer," },
  { t = "v", n = 30, text = "together with all the details of his reign, his might, and the circumstances that came upon him and Israel and all the kingdoms of the lands." },
  { t = "note", id = "a", text = "*3,000 talents* is approximately 113 tons or 103 metric tons of gold." },
  { t = "note", id = "b", text = "*7,000 talents* is approximately 264 tons or 239.5 metric tons of silver." },
  { t = "note", id = "c", text = "*5,000 talents* is approximately 188.5 tons or 171 metric tons of gold." },
  { t = "note", id = "d", text = "Or *10,000 gold drachmas*; that is, approximately 185.2 pounds or 84 kilograms of gold coins" },
  { t = "note", id = "e", text = "*10,000 talents* is approximately 377 tons or 342 metric tons of silver." },
  { t = "note", id = "f", text = "*18,000 talents* is approximately 678.6 tons or 615.6 metric tons of bronze." },
  { t = "note", id = "g", text = "*100,000 talents* is approximately 3,770 tons or 3,420 metric tons of iron." },
  { t = "note", id = "h", text = "*Jehiel* is a variant of *Jehieli*; see 1 Chronicles 26:21." },
]

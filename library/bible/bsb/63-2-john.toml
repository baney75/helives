[[section]]
id = "1"
title = "2 John 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Greeting from the Elder" },
  { t = "ref", text = "(3 John 1:1–4)" },
  { t = "v", n = 1, p = true, text = "The elder, To the chosen lady and her children, whom I love in the truth—and not I alone, but also all who know the truth—" },
  { t = "v", n = 2, text = "because of the truth that abides in us and will be with us forever:" },
  { t = "v", n = 3, p = true, text = "Grace, mercy, and peace from God the Father and from Jesus Christ, the Son of the Father, will be with us in truth and love." },
  { t = "h", level = 2, text = "Walking in the Truth" },
  { t = "ref", text = "(John 8:30–47)" },
  { t = "v", n = 4, p = true, text = "I was overjoyed to find some of your children walking in the truth, just as the Father has commanded us." },
  { t = "v", n = 5, text = "And now I urge you, dear lady—not as a new commandment to you, but one we have had from the beginning—that we love one another." },
  { t = "v", n = 6, text = "And this is love, that we walk according to His commandments. This is the very commandment you have heard from the beginning, that you must walk in love." },
  { t = "h", level = 2, text = "Beware of Deceivers" },
  { t = "v", n = 7, p = true, text = "For many deceivers have gone out into the world, refusing to confess the coming of Jesus Christ in the flesh. Any such person is the deceiver and the antichrist." },
  { t = "v", n = 8, text = "Watch yourselves, so that you do not lose what we have worked for,[^a] but that you may be fully rewarded." },
  { t = "v", n = 9, text = "Anyone who runs ahead without remaining in the teaching of Christ does not have God. Whoever remains in His teaching has both the Father and the Son." },
  { t = "v", n = 10, p = true, text = "If anyone comes to you but does not bring this teaching, do not receive him into your home or even greet him." },
  { t = "v", n = 11, text = "Whoever greets such a person shares in his evil deeds." },
  { t = "h", level = 2, text = "Conclusion" },
  { t = "ref", text = "(3 John 1:13–14)" },
  { t = "v", n = 12, p = true, text = "I have many things to write to you, but I would prefer not to do so with paper and ink. Instead, I hope to come and speak with you face to face,[^b] so that our joy may be complete." },
  { t = "v", n = 13, p = true, text = "The children of your elect sister send you greetings.[^c]" },
  { t = "note", id = "a", text = "NE and WH *what you have worked for*" },
  { t = "note", id = "b", text = "Literally *mouth to mouth*" },
  { t = "note", id = "c", text = "BYZ and TR include *Amen.*" },
]

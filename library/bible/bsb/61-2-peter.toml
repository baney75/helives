[[section]]
id = "1"
title = "2 Peter 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Greeting from Peter" },
  { t = "ref", text = "(1 Peter 1:1–2)" },
  { t = "v", n = 1, p = true, text = "Simon Peter, a servant and apostle of Jesus Christ, To those who through the righteousness of our God and Savior Jesus Christ have received a faith as precious as ours:" },
  { t = "v", n = 2, p = true, text = "Grace and peace be multiplied to you through the knowledge of God and of Jesus our Lord." },
  { t = "h", level = 2, text = "Partakers of the Divine Nature" },
  { t = "v", n = 3, p = true, text = "His divine power has given us everything we need for life and godliness through the knowledge of Him who called us by His own[^a] glory and excellence." },
  { t = "v", n = 4, text = "Through these He has given us His precious and magnificent promises, so that through them you may become partakers of the divine nature, now that you have escaped the corruption in the world caused by evil desires." },
  { t = "v", n = 5, p = true, text = "For this very reason, make every effort to add to your faith virtue; and to virtue, knowledge;" },
  { t = "v", n = 6, text = "and to knowledge, self-control; and to self-control, perseverance; and to perseverance, godliness;" },
  { t = "v", n = 7, text = "and to godliness, brotherly kindness; and to brotherly kindness, love." },
  { t = "v", n = 8, text = "For if you possess these qualities and continue to grow in them, they will keep you from being ineffective and unproductive in your knowledge of our Lord Jesus Christ." },
  { t = "v", n = 9, text = "But whoever lacks these traits is nearsighted to the point of blindness, having forgotten that he has been cleansed from his past sins." },
  { t = "v", n = 10, p = true, text = "Therefore, brothers, strive to make your calling and election sure. For if you practice these things you will never stumble," },
  { t = "v", n = 11, text = "and you will receive a lavish reception into the eternal kingdom of our Lord and Savior Jesus Christ." },
  { t = "v", n = 12, p = true, text = "Therefore I will always remind you of these things, even though you know them and are established in the truth you now have." },
  { t = "v", n = 13, text = "I think it is right to refresh your memory as long as I live in the tent of my body,[^b]" },
  { t = "v", n = 14, text = "because I know that this tent will soon be laid aside, as our Lord Jesus Christ has made clear to me." },
  { t = "v", n = 15, text = "And I will make every effort to ensure that after my departure, you will be able to recall these things at all times." },
  { t = "h", level = 2, text = "Eyewitnesses of His Majesty" },
  { t = "ref", text = "(Matthew 17:1–13; Mark 9:1–13; Luke 9:28–36)" },
  { t = "v", n = 16, p = true, text = "For we did not follow cleverly devised fables when we made known to you the power and coming of our Lord Jesus Christ, but we were eyewitnesses of His majesty." },
  { t = "v", n = 17, text = "For He received honor and glory from God the Father when the voice came to Him from the Majestic Glory, saying, “This is My beloved Son, in whom I am well pleased.”[^c]" },
  { t = "v", n = 18, text = "And we ourselves heard this voice from heaven when we were with Him on the holy mountain." },
  { t = "v", n = 19, p = true, text = "We also have the word of the prophets as confirmed beyond doubt. And you will do well to pay attention to it, as to a lamp shining in a dark place, until the day dawns and the morning star rises in your hearts." },
  { t = "v", n = 20, text = "Above all, you must understand that no prophecy of Scripture comes from one’s own interpretation." },
  { t = "v", n = 21, text = "For no such prophecy was ever brought forth by the will of man, but men spoke from God as they were carried along by the Holy Spirit." },
  { t = "note", id = "a", text = "Or *to His own*" },
  { t = "note", id = "b", text = "Literally *as long as I am in this tent*" },
  { t = "note", id = "c", text = "Matthew 17:5; see also Mark 9:7 and Luke 9:35." },
]

[[section]]
id = "2"
title = "2 Peter 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "Deliverance from False Prophets" },
  { t = "ref", text = "(Jude 1:3–16)" },
  { t = "v", n = 1, p = true, text = "Now there were also false prophets among the people, just as there will be false teachers among you. They will secretly introduce destructive heresies, even denying the Master who bought them—bringing swift destruction on themselves." },
  { t = "v", n = 2, text = "Many will follow in their depravity, and because of them the way of truth will be defamed." },
  { t = "v", n = 3, text = "In their greed, these false teachers will exploit you with deceptive words. The longstanding verdict against them remains in force, and their destruction does not sleep." },
  { t = "v", n = 4, p = true, text = "For if God did not spare the angels when they sinned, but cast them deep into hell,[^a] placing them in chains of darkness to be held for judgment;" },
  { t = "v", n = 5, text = "if He did not spare the ancient world when He brought the flood on its ungodly people, but preserved Noah, a preacher of righteousness, among the eight;" },
  { t = "v", n = 6, text = "if He condemned the cities of Sodom and Gomorrah to destruction,[^b] reducing them to ashes as an example of what is coming on the ungodly;[^c]" },
  { t = "v", n = 7, text = "and if He rescued Lot, a righteous man distressed by the depraved conduct of the lawless" },
  { t = "v", n = 8, text = "(for that righteous man, living among them day after day, was tormented in his righteous soul by the lawless deeds he saw and heard)—" },
  { t = "v", n = 9, text = "if all this is so, then the Lord knows how to rescue the godly from trials and to hold the unrighteous for punishment on the day of judgment." },
  { t = "v", n = 10, p = true, text = "Such punishment is specially reserved for those who indulge the corrupt desires of the flesh and despise authority. Bold and self-willed, they are unafraid to slander glorious beings.[^d]" },
  { t = "v", n = 11, text = "Yet not even angels, though greater in strength and power, dare to bring such slanderous charges against them before the Lord." },
  { t = "v", n = 12, p = true, text = "These men are like irrational animals, creatures of instinct, born to be captured and destroyed. They blaspheme in matters they do not understand, and like such creatures, they too will be destroyed." },
  { t = "v", n = 13, text = "The harm they will suffer is the wages of their wickedness. They consider it a pleasure to carouse in broad daylight. They are blots and blemishes, reveling in their deception as they feast with you." },
  { t = "v", n = 14, text = "Their eyes are full of adultery; their desire for sin is never satisfied; they seduce the unstable. They are accursed children with hearts trained in greed." },
  { t = "v", n = 15, p = true, text = "They have left the straight way and wandered off to follow the way of Balaam son of Beor,[^e] who loved the wages of wickedness." },
  { t = "v", n = 16, text = "But he was rebuked for his transgression by a donkey, otherwise without speech, that spoke with a man’s voice and restrained the prophet’s madness." },
  { t = "v", n = 17, p = true, text = "These men are springs without water and mists driven by a storm. Blackest darkness is reserved for them." },
  { t = "v", n = 18, text = "With lofty but empty words, they appeal to the sensual passions of the flesh and entice those who are just escaping from others who live in error." },
  { t = "v", n = 19, text = "They promise them freedom, while they themselves are slaves to depravity. For a man is a slave to whatever has mastered him." },
  { t = "v", n = 20, p = true, text = "If indeed they have escaped the corruption of the world through the knowledge of our Lord and Savior Jesus Christ,[^f] only to be entangled and overcome by it again, their final condition is worse than it was at first." },
  { t = "v", n = 21, text = "It would have been better for them not to have known the way of righteousness than to have known it and then to turn away from the holy commandment passed on to them." },
  { t = "v", n = 22, text = "Of them the proverbs are true: “A dog returns to its vomit,”[^g] and, “A sow that is washed goes back to her wallowing in the mud.”" },
  { t = "note", id = "a", text = "Greek *cast them into Tartarus*; see the First Book of Enoch (1 Enoch 13:1–11 and 1 Enoch 20:1–4)." },
  { t = "note", id = "b", text = "WH does not include *to destruction*." },
  { t = "note", id = "c", text = "Or *on future generations of the ungodly*" },
  { t = "note", id = "d", text = "Or *to blaspheme angelic majesties*" },
  { t = "note", id = "e", text = "NA, SBL, BYZ, and TR *Bosor*" },
  { t = "note", id = "f", text = "SBL and WH *the Lord and Savior Jesus Christ*" },
  { t = "note", id = "g", text = "Proverbs 26:11" },
]

[[section]]
id = "3"
title = "2 Peter 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Coming Judgment" },
  { t = "ref", text = "(Genesis 7:1–24; Jude 1:17–23)" },
  { t = "v", n = 1, p = true, text = "Beloved, this is now my second letter to you. Both of them are reminders to stir you to wholesome thinking" },
  { t = "v", n = 2, text = "by recalling what was foretold by the holy prophets and commanded by our Lord and Savior through your apostles." },
  { t = "v", n = 3, p = true, text = "Most importantly, you must understand that in the last days scoffers will come, scoffing and following their own evil desires.[^a]" },
  { t = "v", n = 4, text = "“Where is the promise of His coming?” they will ask. “Ever since our fathers fell asleep, everything continues as it has from the beginning of creation.”" },
  { t = "v", n = 5, p = true, text = "But they deliberately overlook the fact that long ago by God’s word the heavens existed and the earth was formed out of water and by water," },
  { t = "v", n = 6, text = "through which[^b] the world of that time perished in the flood." },
  { t = "v", n = 7, text = "And by that same word, the present heavens and earth are reserved for fire, being kept for the day of judgment and destruction of ungodly men." },
  { t = "h", level = 2, text = "The Day of the Lord" },
  { t = "ref", text = "(Zephaniah 1:7–18; Malachi 4:1–6; 1 Thessalonians 5:1–11)" },
  { t = "v", n = 8, p = true, text = "Beloved, do not let this one thing escape your notice: With the Lord a day is like a thousand years, and a thousand years are like a day.[^c]" },
  { t = "v", n = 9, text = "The Lord is not slow in keeping His promise as some understand slowness, but is patient with you, not wanting anyone to perish but everyone to come to repentance." },
  { t = "v", n = 10, p = true, text = "But the Day of the Lord will come like a thief. The heavens will disappear with a roar, the elements will be destroyed[^d] by fire, and the earth and its works will be laid bare.[^e]" },
  { t = "v", n = 11, p = true, text = "Since everything will be destroyed in this way, what kind of people ought you to be? You ought to conduct yourselves in holiness and godliness" },
  { t = "v", n = 12, text = "as you anticipate and hasten the coming of the day of God, when the heavens will be destroyed by fire and the elements will melt in the heat." },
  { t = "v", n = 13, text = "But in keeping with God’s promise, we are looking forward to a new heaven and a new earth, where righteousness dwells." },
  { t = "h", level = 2, text = "Final Exhortations" },
  { t = "v", n = 14, p = true, text = "Therefore, beloved, as you anticipate these things, make every effort to be found at peace—spotless and blameless in His sight.[^f]" },
  { t = "v", n = 15, p = true, text = "Consider also that our Lord’s patience brings salvation, just as our beloved brother Paul also wrote you with the wisdom God gave him." },
  { t = "v", n = 16, text = "He writes this way in all his letters,[^g] speaking in them about such matters. Some parts of his letters are hard to understand, which ignorant and unstable people distort,[^h] as they do the rest of the Scriptures, to their own destruction." },
  { t = "v", n = 17, p = true, text = "Therefore, beloved, since you already know these things, be on your guard so that you will not be carried away by the error of the lawless and fall from your secure standing." },
  { t = "v", n = 18, text = "But grow in the grace and knowledge of our Lord and Savior Jesus Christ. To Him be the glory both now and to the day of eternity. Amen.[^i]" },
  { t = "note", id = "a", text = "See Jude 1:18." },
  { t = "note", id = "b", text = "NA *through whom*" },
  { t = "note", id = "c", text = "See Psalm 90:4." },
  { t = "note", id = "d", text = "Or *dissolved*; also in verses 11 and 12." },
  { t = "note", id = "e", text = "Or *will not be found*. BYZ and TR *will be burned up*; SBL, NE, and WH *will be found*, i.e., *will be unable to hide*." },
  { t = "note", id = "f", text = "Or *to be found by Him in peace, without spot and without blemish.*" },
  { t = "note", id = "g", text = "Or *in all the letters*" },
  { t = "note", id = "h", text = "NA *will distort*" },
  { t = "note", id = "i", text = "NE, WH, and NA do not include *Amen.*" },
]

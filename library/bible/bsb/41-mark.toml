[[section]]
id = "1"
title = "Mark 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Mission of John the Baptist" },
  { t = "ref", text = "(Isaiah 40:1–5; Matthew 3:1–17; Luke 3:1–22; John 1:19–34)" },
  { t = "v", n = 1, p = true, text = "This is the beginning of the gospel of Jesus Christ, the Son of God.[^a]" },
  { t = "v", n = 2, text = "As it is written in Isaiah the prophet:[^b] “Behold, I will send My messenger ahead of You, who will prepare Your way.”[^c]" },
  { t = "v", n = 3, indent = 1, text = "“A voice of one calling in the wilderness, ‘Prepare the way for the Lord, make straight paths for Him.’”[^d]" },
  { t = "v", n = 4, p = true, text = "John the Baptist appeared in the wilderness, preaching a baptism of repentance for the forgiveness of sins." },
  { t = "v", n = 5, text = "People went out to him from all of Jerusalem and the countryside of Judea. Confessing their sins, they were baptized by him in the Jordan River." },
  { t = "v", n = 6, p = true, text = "John was clothed in camel’s hair, with a leather belt around his waist. His food was locusts and wild honey." },
  { t = "v", n = 7, text = "And he proclaimed: “After me will come One more powerful than I, the straps of whose sandals I am not worthy to stoop down and untie." },
  { t = "v", n = 8, text = "I baptize you with water,[^e] but He will baptize you with the Holy Spirit.[^f]”" },
  { t = "v", n = 9, p = true, text = "In those days Jesus came from Nazareth in Galilee and was baptized by John in the Jordan." },
  { t = "v", n = 10, text = "As soon as Jesus came up out of the water, He saw[^g] the heavens breaking open and the Spirit descending on Him like a dove." },
  { t = "v", n = 11, text = "And a voice came from heaven: “You are My beloved Son; in You I am well pleased.”" },
  { t = "h", level = 2, text = "The Temptation and Preaching of Jesus" },
  { t = "ref", text = "(Matthew 4:1–17; Luke 4:1–15)" },
  { t = "v", n = 12, p = true, text = "At once the Spirit drove Jesus into the wilderness," },
  { t = "v", n = 13, text = "and He was there for forty days, being tempted by Satan. He was with the wild animals, and the angels ministered to Him." },
  { t = "v", n = 14, p = true, text = "After the arrest of John, Jesus went into Galilee and proclaimed the gospel of God.[^h]" },
  { t = "v", n = 15, text = "“The time is fulfilled,” He said, “and the kingdom of God is near. Repent and believe in the gospel!”" },
  { t = "h", level = 2, text = "The First Disciples" },
  { t = "ref", text = "(Matthew 4:18–22; Luke 5:1–11; John 1:35–42)" },
  { t = "v", n = 16, p = true, text = "As Jesus was walking beside the Sea of Galilee, He saw Simon and his brother Andrew. They were casting a net into the sea, for they were fishermen." },
  { t = "v", n = 17, text = "“Come, follow Me,” Jesus said, “and I will make you fishers of men.”" },
  { t = "v", n = 18, text = "And at once they left their nets and followed Him." },
  { t = "v", n = 19, p = true, text = "Going on a little farther, He saw James son of Zebedee and his brother John. They were in a boat, mending their nets." },
  { t = "v", n = 20, text = "Immediately Jesus called them, and they left their father Zebedee in the boat with the hired men and followed Him." },
  { t = "h", level = 2, text = "Jesus Expels an Unclean Spirit" },
  { t = "ref", text = "(Luke 4:31–37)" },
  { t = "v", n = 21, p = true, text = "Then Jesus and His companions went to Capernaum, and right away Jesus entered the synagogue on the Sabbath and began to teach." },
  { t = "v", n = 22, text = "The people were astonished at His teaching, because He taught as one who had authority, and not as the scribes." },
  { t = "v", n = 23, p = true, text = "Suddenly a man with an unclean spirit cried out in the synagogue:" },
  { t = "v", n = 24, text = "“What do You want with us, Jesus of Nazareth? Have You come to destroy us? I know who You are—the Holy One of God!”" },
  { t = "v", n = 25, p = true, text = "But Jesus rebuked the spirit. “Be silent!” He said. “Come out of him!”" },
  { t = "v", n = 26, text = "At this, the unclean spirit threw the man into convulsions and came out with a loud shriek." },
  { t = "v", n = 27, p = true, text = "All the people were amazed and began to ask one another, “What is this? A new teaching with authority! He commands even the unclean spirits, and they obey Him!”" },
  { t = "v", n = 28, text = "And the news about Jesus spread quickly through the whole region of Galilee." },
  { t = "h", level = 2, text = "Jesus Heals at Peter’s House" },
  { t = "ref", text = "(Matthew 8:14–17; Luke 4:38–41)" },
  { t = "v", n = 29, p = true, text = "As soon as Jesus and His companions had left the synagogue, they went with James and John to the home of Simon and Andrew." },
  { t = "v", n = 30, text = "Simon’s mother-in-law was sick in bed with a fever, and they promptly told Jesus about her." },
  { t = "v", n = 31, text = "So He went to her, took her by the hand, and helped her up. The fever left her, and she began to serve them." },
  { t = "v", n = 32, p = true, text = "That evening, after sunset, people brought to Jesus all the sick and demon-possessed," },
  { t = "v", n = 33, text = "and the whole town gathered at the door." },
  { t = "v", n = 34, text = "And He healed many who were ill with various diseases and drove out many demons. But He would not allow the demons to speak, because they knew who He was." },
  { t = "h", level = 2, text = "Jesus Prays and Preaches" },
  { t = "ref", text = "(Luke 4:42–44)" },
  { t = "v", n = 35, p = true, text = "Early in the morning, while it was still dark, Jesus got up and went out to a solitary place to pray." },
  { t = "v", n = 36, text = "Simon and his companions went to look for Him," },
  { t = "v", n = 37, text = "and when they found Him, they said, “Everyone is looking for You!”" },
  { t = "v", n = 38, p = true, text = "But Jesus answered, “Let us go on to the neighboring towns so I can preach there as well, for that is why I have come.”" },
  { t = "v", n = 39, text = "So He went throughout Galilee, preaching in their synagogues and driving out demons." },
  { t = "h", level = 2, text = "The Leper’s Prayer" },
  { t = "ref", text = "(Leviticus 14:1–32; Matthew 8:1–4; Luke 5:12–16)" },
  { t = "v", n = 40, p = true, text = "Then a leper[^i] came to Jesus, begging on his knees: “If You are willing, You can make me clean.”" },
  { t = "v", n = 41, p = true, text = "Moved with compassion,[^j] Jesus reached out His hand and touched the man. “I am willing,” He said. “Be clean!”" },
  { t = "v", n = 42, text = "And immediately the leprosy left him, and the man was cleansed." },
  { t = "v", n = 43, p = true, text = "Jesus promptly sent him away with a stern warning:" },
  { t = "v", n = 44, text = "“See that you don’t tell anyone. But go, show yourself to the priest and present the offering Moses prescribed for your cleansing, as a testimony to them.”[^k]" },
  { t = "v", n = 45, p = true, text = "But the man went out and openly began to proclaim and spread the news. Consequently, Jesus could no longer enter a town in plain view, but He stayed out in solitary places. Yet people came to Him from every quarter." },
  { t = "note", id = "a", text = "ECM, NE, BYZ, and TR; SBL and WH *the beginning of the gospel of Jesus Christ.*" },
  { t = "note", id = "b", text = "BYZ and TR *in the prophets:*" },
  { t = "note", id = "c", text = "Malachi 3:1" },
  { t = "note", id = "d", text = "Isaiah 40:3 (see also LXX)" },
  { t = "note", id = "e", text = "Or *in water*" },
  { t = "note", id = "f", text = "Or *in the Holy Spirit*" },
  { t = "note", id = "g", text = "Or *he saw*; see John 1:32–33" },
  { t = "note", id = "h", text = "BYZ and TR *the gospel of the kingdom of God*" },
  { t = "note", id = "i", text = "A *leper* was one afflicted with a skin disease. See Leviticus 13." },
  { t = "note", id = "j", text = "SBL *Moved with indignation*" },
  { t = "note", id = "k", text = "See Leviticus 14:1–32." },
]

[[section]]
id = "2"
title = "Mark 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "Jesus Heals a Paralytic" },
  { t = "ref", text = "(Matthew 9:1–8; Luke 5:17–26)" },
  { t = "v", n = 1, p = true, text = "A few days later Jesus went back to Capernaum. And when the people heard that He was home," },
  { t = "v", n = 2, text = "they gathered in such large numbers that there was no more room, not even outside the door, as Jesus spoke the word to them." },
  { t = "v", n = 3, p = true, text = "Then a paralytic was brought to Him, carried by four men." },
  { t = "v", n = 4, text = "Since they were unable to get to Jesus through the crowd, they uncovered the roof above Him, made an opening, and lowered the paralytic on his mat." },
  { t = "v", n = 5, p = true, text = "When Jesus saw their faith, He said to the paralytic, “Son, your sins are forgiven.”" },
  { t = "v", n = 6, p = true, text = "But some of the scribes were sitting there and thinking in their hearts," },
  { t = "v", n = 7, text = "“Why does this man speak like this? He is blaspheming! Who can forgive sins but God alone?”" },
  { t = "v", n = 8, p = true, text = "At once Jesus knew in His spirit that they were thinking this way within themselves. “Why are you thinking these things in your hearts?” He asked." },
  { t = "v", n = 9, text = "“Which is easier: to say to a paralytic, ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?" },
  { t = "v", n = 10, text = "But so that you may know that the Son of Man has authority on earth to forgive sins...” He said to the paralytic," },
  { t = "v", n = 11, text = "“I tell you, get up, pick up your mat, and go home.”" },
  { t = "v", n = 12, p = true, text = "And immediately the man got up, picked up his mat, and walked out in front of them all. As a result, they were all astounded and glorified God, saying, “We have never seen anything like this!”" },
  { t = "h", level = 2, text = "Jesus Calls Levi" },
  { t = "ref", text = "(Matthew 9:9–13; Luke 5:27–32)" },
  { t = "v", n = 13, p = true, text = "Once again Jesus went out beside the sea. All the people came to Him, and He taught them there." },
  { t = "v", n = 14, p = true, text = "As He was walking along, He saw Levi son of Alphaeus sitting at the tax booth. “Follow Me,” He told him, and Levi got up and followed Him." },
  { t = "v", n = 15, p = true, text = "While Jesus was dining at Levi’s house, many tax collectors and sinners were eating with Him and His disciples—for there were many who followed Him." },
  { t = "v", n = 16, text = "When the scribes who were Pharisees saw Jesus eating with these people, they asked His disciples, “Why does He eat[^a] with tax collectors and sinners?”" },
  { t = "v", n = 17, p = true, text = "On hearing this, Jesus told them, “It is not the healthy who need a doctor, but the sick. I have not come to call the righteous, but sinners.”" },
  { t = "h", level = 2, text = "Questions about Fasting" },
  { t = "ref", text = "(Matthew 9:14–15; Luke 5:33–35)" },
  { t = "v", n = 18, p = true, text = "Now John’s disciples and the Pharisees were often fasting. So people came to Jesus and asked, “Why don’t Your disciples fast like John’s disciples and those of the Pharisees?”" },
  { t = "v", n = 19, p = true, text = "Jesus replied, “How can the guests of the bridegroom fast while He is with them? As long as He is with them, they cannot fast." },
  { t = "v", n = 20, text = "But the time will come when the bridegroom will be taken from them; then they will fast." },
  { t = "h", level = 2, text = "The Patches and the Wineskins" },
  { t = "ref", text = "(Matthew 9:16–17; Luke 5:36–39)" },
  { t = "v", n = 21, p = true, text = "No one sews a patch of unshrunk cloth on an old garment. If he does, the new piece will pull away from the old, and a worse tear will result." },
  { t = "v", n = 22, p = true, text = "And no one pours new wine into old wineskins. If he does, the wine will burst the skins, and both the wine and the wineskins will be ruined. Instead, new wine is poured into new wineskins.”[^b]" },
  { t = "h", level = 2, text = "The Lord of the Sabbath" },
  { t = "ref", text = "(1 Samuel 21:1–7; Matthew 12:1–8; Luke 6:1–5)" },
  { t = "v", n = 23, p = true, text = "One Sabbath Jesus was passing through the grainfields, and His disciples began to pick the heads of grain as they walked along." },
  { t = "v", n = 24, text = "So the Pharisees said to Him, “Look, why are they doing what is unlawful on the Sabbath?”" },
  { t = "v", n = 25, p = true, text = "Jesus replied, “Have you never read what David did when he and his companions were hungry and in need?" },
  { t = "v", n = 26, text = "During the high priesthood of Abiathar, he entered the house of God and ate the consecrated bread,[^c] which was lawful only for the priests. And he gave some to his companions as well.”" },
  { t = "v", n = 27, p = true, text = "Then Jesus declared, “The Sabbath was made for man, not man for the Sabbath." },
  { t = "v", n = 28, text = "Therefore, the Son of Man is Lord even of the Sabbath.”" },
  { t = "note", id = "a", text = "BYZ and TR include *and drink*; see Luke 5:30." },
  { t = "note", id = "b", text = "Tischendorf does not include *Instead, new wine is poured into new wineskins*." },
  { t = "note", id = "c", text = "Or *the Bread of the Presence*" },
]

[[section]]
id = "3"
title = "Mark 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "Jesus Heals on the Sabbath" },
  { t = "ref", text = "(Matthew 12:9–14; Luke 6:6–11)" },
  { t = "v", n = 1, p = true, text = "Once again Jesus entered the synagogue, and a man with a withered hand was there." },
  { t = "v", n = 2, text = "In order to accuse Jesus, they were watching to see if He would heal on the Sabbath." },
  { t = "v", n = 3, p = true, text = "Then Jesus said to the man with the withered hand, “Stand up among us.”" },
  { t = "v", n = 4, text = "And He asked them, “Which is lawful on the Sabbath: to do good or to do evil, to save life or to destroy it?” But they were silent." },
  { t = "v", n = 5, p = true, text = "Jesus looked around at them with anger and sorrow at their hardness of heart. Then He said to the man, “Stretch out your hand.” So he stretched it out, and it was restored." },
  { t = "v", n = 6, p = true, text = "At this, the Pharisees went out and began plotting with the Herodians how they might kill Jesus." },
  { t = "h", level = 2, text = "Jesus Heals the Multitudes" },
  { t = "ref", text = "(Matthew 4:23–25; Luke 6:17–19)" },
  { t = "v", n = 7, p = true, text = "So Jesus withdrew with His disciples to the sea, accompanied by a large crowd from Galilee, Judea," },
  { t = "v", n = 8, text = "Jerusalem, Idumea, the region beyond the Jordan, and the vicinity of Tyre and Sidon. The large crowd came to Him when they heard what great things He was doing." },
  { t = "v", n = 9, p = true, text = "Jesus asked His disciples to have a boat ready for Him so that the crowd would not crush Him." },
  { t = "v", n = 10, text = "For He had healed so many that all who had diseases were pressing forward to touch Him." },
  { t = "v", n = 11, text = "And when the unclean spirits saw Him, they fell down before Him and cried out, “You are the Son of God!”" },
  { t = "v", n = 12, text = "But He warned them sternly not to make Him known." },
  { t = "h", level = 2, text = "The Twelve Apostles" },
  { t = "ref", text = "(Matthew 10:1–4; Luke 6:12–16)" },
  { t = "v", n = 13, p = true, text = "Then Jesus went up on the mountain and called for those He wanted, and they came to Him." },
  { t = "v", n = 14, text = "He appointed twelve of them, whom He designated as apostles,[^a] to accompany Him, to be sent out to preach," },
  { t = "v", n = 15, text = "and to have authority[^b] to drive out demons." },
  { t = "v", n = 16, p = true, text = "These are the twelve He appointed:[^c] Simon (whom He named Peter)," },
  { t = "v", n = 17, text = "James son of Zebedee and his brother John (whom He named Boanerges, meaning “Sons of Thunder”)," },
  { t = "v", n = 18, text = "Andrew, Philip, Bartholomew, Matthew, Thomas, James son of Alphaeus, Thaddaeus, Simon the Zealot,[^d]" },
  { t = "v", n = 19, text = "and Judas Iscariot, who betrayed Jesus.[^e]" },
  { t = "h", level = 2, text = "A House Divided" },
  { t = "ref", text = "(Matthew 12:22–30; Luke 11:14–23)" },
  { t = "v", n = 20, p = true, text = "Then Jesus went home,[^f] and once again a crowd gathered, so that He and His disciples could not even eat." },
  { t = "v", n = 21, text = "When His family heard about this, they went out to take custody of Him, saying, “He is out of His mind.”" },
  { t = "v", n = 22, p = true, text = "And the scribes who had come down from Jerusalem were saying, “He is possessed by Beelzebul,[^g]” and, “By the prince of the demons He drives out demons.”" },
  { t = "v", n = 23, p = true, text = "So Jesus called them together and began to speak to them in parables: “How can Satan drive out Satan?" },
  { t = "v", n = 24, text = "If a kingdom is divided against itself, it cannot stand." },
  { t = "v", n = 25, text = "If a house is divided against itself, it cannot stand." },
  { t = "v", n = 26, text = "And if Satan is divided and rises against himself, he cannot stand; his end has come." },
  { t = "v", n = 27, text = "Indeed, no one can enter a strong man’s house to steal his possessions unless he first ties up the strong man. Then he can plunder his house." },
  { t = "h", level = 2, text = "The Unpardonable Sin" },
  { t = "ref", text = "(Matthew 12:31–32)" },
  { t = "v", n = 28, p = true, text = "Truly I tell you, the sons of men will be forgiven all sins and blasphemies, as many as they utter." },
  { t = "v", n = 29, text = "But whoever blasphemes against the Holy Spirit will never be forgiven; he is guilty of eternal sin.”" },
  { t = "v", n = 30, p = true, text = "Jesus made this statement because they were saying, “He has an unclean spirit.”" },
  { t = "h", level = 2, text = "Jesus’ Mother and Brothers" },
  { t = "ref", text = "(Matthew 12:46–50; Luke 8:19–21)" },
  { t = "v", n = 31, p = true, text = "Then Jesus’ mother and brothers came and stood outside. They sent someone in to summon Him," },
  { t = "v", n = 32, text = "and a crowd was sitting around Him. “Look,” He was told, “Your mother and brothers[^h] are outside, asking for You.”" },
  { t = "v", n = 33, p = true, text = "But Jesus replied, “Who are My mother and My brothers?”" },
  { t = "v", n = 34, text = "Looking at those seated in a circle around Him, He said, “Here are My mother and My brothers!" },
  { t = "v", n = 35, text = "For whoever does the will of God is My brother and sister and mother.”" },
  { t = "note", id = "a", text = "SBL and WH; ECM, SBL, NE, BYZ, and TR do not include *whom He designated as apostles*" },
  { t = "note", id = "b", text = "BYZ and TR include *to heal sicknesses, and*" },
  { t = "note", id = "c", text = "SBL, NE, and WH; ECM, BYZ, and TR do not include *These are the twelve He appointed*" },
  { t = "note", id = "d", text = "Greek *Simon the Cananean*" },
  { t = "note", id = "e", text = "Literally *who also betrayed Him*" },
  { t = "note", id = "f", text = "Literally *Then He comes to a house*" },
  { t = "note", id = "g", text = "WH *Beezeboul*; Vulgate *Beelzebub*" },
  { t = "note", id = "h", text = "ECM, SBL, WH, and TR; NE and BYZ include *and Your sisters*." },
]

[[section]]
id = "4"
title = "Mark 4"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Parable of the Sower" },
  { t = "ref", text = "(Matthew 13:1–9; Luke 8:4–8)" },
  { t = "v", n = 1, p = true, text = "Once again Jesus began to teach beside the sea, and such a large crowd gathered around Him that He got into a boat and sat in it, while all the people crowded along the shore." },
  { t = "v", n = 2, p = true, text = "And He taught them many things in parables, and in His teaching He said," },
  { t = "v", n = 3, text = "“Listen! A farmer went out to sow his seed." },
  { t = "v", n = 4, text = "And as he was sowing, some seed fell along the path, and the birds came and devoured it." },
  { t = "v", n = 5, p = true, text = "Some fell on rocky ground, where it did not have much soil. It sprang up quickly because the soil was shallow." },
  { t = "v", n = 6, text = "But when the sun rose, the seedlings were scorched, and they withered because they had no root." },
  { t = "v", n = 7, p = true, text = "Other seed fell among thorns, which grew up and choked the seedlings, and they yielded no crop." },
  { t = "v", n = 8, p = true, text = "Still other seed fell on good soil, where it sprouted, grew up, and produced a crop—one bearing thirtyfold, another sixtyfold, and another a hundredfold.”" },
  { t = "v", n = 9, p = true, text = "Then Jesus said, “He who has ears to hear, let him hear.”" },
  { t = "h", level = 2, text = "The Purpose of Jesus’ Parables" },
  { t = "ref", text = "(Isaiah 6:1–13; Matthew 13:10–17; Luke 8:9–10)" },
  { t = "v", n = 10, p = true, text = "As soon as Jesus was alone with the Twelve and those around Him, they asked Him about the parable." },
  { t = "v", n = 11, p = true, text = "He replied, “The mystery of the kingdom of God has been given to you, but to those on the outside everything is expressed in parables," },
  { t = "v", n = 12, text = "so that, ‘they may be ever seeing but never perceiving, and ever hearing but never understanding; otherwise they might turn and be forgiven.’[^a]”" },
  { t = "h", level = 2, text = "The Parable of the Sower Explained" },
  { t = "ref", text = "(Matthew 13:18–23; Luke 8:11–15)" },
  { t = "v", n = 13, p = true, text = "Then Jesus said to them, “Do you not understand this parable? Then how will you understand any of the parables?" },
  { t = "v", n = 14, p = true, text = "The farmer sows the word." },
  { t = "v", n = 15, text = "Some are like the seeds[^b] along the path, where the word is sown. As soon as they hear it, Satan comes and takes away the word that was sown in them." },
  { t = "v", n = 16, p = true, text = "Some are like the seeds sown on rocky ground. They hear the word and at once receive it with joy." },
  { t = "v", n = 17, text = "But they themselves have no root, and they remain for only a season. When trouble or persecution comes because of the word, they quickly fall away." },
  { t = "v", n = 18, p = true, text = "Others are like the seeds sown among the thorns. They hear the word," },
  { t = "v", n = 19, text = "but the worries of this life, the deceitfulness of wealth, and the desire for other things come in and choke the word, and it becomes unfruitful." },
  { t = "v", n = 20, p = true, text = "Still others are like the seeds sown on good soil. They hear the word, receive it, and produce a crop—thirtyfold, sixtyfold, or a hundredfold.”" },
  { t = "h", level = 2, text = "The Lesson of the Lamp" },
  { t = "ref", text = "(Luke 8:16–18)" },
  { t = "v", n = 21, p = true, text = "Jesus also said to them, “Does anyone bring in a lamp to put it under a basket or under a bed? Doesn’t he set it on a stand?" },
  { t = "v", n = 22, text = "For there is nothing hidden that will not be disclosed, and nothing concealed that will not be brought to light." },
  { t = "v", n = 23, p = true, text = "If anyone has ears to hear, let him hear.”" },
  { t = "v", n = 24, p = true, text = "He went on to say, “Pay attention to what you hear. With the measure you use, it will be measured to you, and even more will be added to you." },
  { t = "v", n = 25, text = "For whoever has will be given more. But whoever does not have, even what he has will be taken away from him.”" },
  { t = "h", level = 2, text = "The Seed Growing Secretly" },
  { t = "v", n = 26, p = true, text = "Jesus also said, “The kingdom of God is like a man who scatters seed on the ground." },
  { t = "v", n = 27, text = "Night and day he sleeps and wakes, and the seed sprouts and grows, though he knows not how." },
  { t = "v", n = 28, text = "All by itself the earth produces a crop—first the stalk, then the head, then grain that ripens within." },
  { t = "v", n = 29, text = "And as soon as the grain is ripe, he swings the sickle, because the harvest has come.[^c]”" },
  { t = "h", level = 2, text = "The Parable of the Mustard Seed" },
  { t = "ref", text = "(Matthew 13:31–32; Luke 13:18–19)" },
  { t = "v", n = 30, p = true, text = "Then He asked, “To what can we compare the kingdom of God? With what parable shall we present it?" },
  { t = "v", n = 31, text = "It is like a mustard seed, which is the smallest of all seeds sown upon the earth." },
  { t = "v", n = 32, text = "But after it is planted, it grows to be the largest of all garden plants and puts forth great branches, so that the birds of the air nest in its shade.”" },
  { t = "v", n = 33, p = true, text = "With many such parables Jesus spoke the word to them, to the extent that they could understand." },
  { t = "v", n = 34, text = "He did not tell them anything without using a parable. But privately He explained everything to His own disciples." },
  { t = "h", level = 2, text = "Jesus Calms the Storm" },
  { t = "ref", text = "(Psalm 107:1–43; Matthew 8:23–27; Luke 8:22–25)" },
  { t = "v", n = 35, p = true, text = "When that evening came, He said to His disciples, “Let us cross to the other side.”" },
  { t = "v", n = 36, text = "After they had dismissed the crowd, they took Jesus with them, since He was already in the boat. And there were other boats with Him." },
  { t = "v", n = 37, p = true, text = "Soon a violent windstorm came up, and the waves were breaking over the boat, so that it was being swamped." },
  { t = "v", n = 38, text = "But Jesus was in the stern, sleeping on the cushion. So they woke Him and said, “Teacher, don’t You care that we are perishing?”" },
  { t = "v", n = 39, p = true, text = "Then Jesus got up and rebuked the wind and the sea. “Silence!” He commanded. “Be still!” And the wind died down, and it was perfectly calm." },
  { t = "v", n = 40, p = true, text = "“Why are you so afraid?” He asked. “Do you still have no faith?”" },
  { t = "v", n = 41, p = true, text = "Overwhelmed with fear, they asked one another, “Who is this, that even the wind and the sea obey Him?”" },
  { t = "note", id = "a", text = "Isaiah 6:9–10 (see also LXX)" },
  { t = "note", id = "b", text = "Or *the word*; similarly in verses 16, 18, and 20; literally *Now these are the ones*" },
  { t = "note", id = "c", text = "See Joel 3:13, including LXX." },
]

[[section]]
id = "5"
title = "Mark 5"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Demons and the Pigs" },
  { t = "ref", text = "(Matthew 8:28–34; Luke 8:26–39)" },
  { t = "v", n = 1, p = true, text = "On the other side of the sea, they arrived in the region of the Gerasenes.[^a]" },
  { t = "v", n = 2, text = "As soon as Jesus got out of the boat, He was met by a man with an unclean spirit, who was coming from the tombs." },
  { t = "v", n = 3, text = "This man had been living in the tombs and could no longer be restrained, even with chains." },
  { t = "v", n = 4, text = "Though he was often bound with chains and shackles, he had broken the chains and shattered the shackles. Now there was no one with the strength to subdue him." },
  { t = "v", n = 5, text = "Night and day in the tombs and in the mountains he kept crying out and cutting himself with stones." },
  { t = "v", n = 6, p = true, text = "When the man saw Jesus from a distance, he ran and fell on his knees before Him." },
  { t = "v", n = 7, text = "And he shouted in a loud voice, “What do You want with me, Jesus, Son of the Most High God? I beg You before God not to torture me!”" },
  { t = "v", n = 8, text = "For Jesus had already declared, “Come out of this man, you unclean spirit!”" },
  { t = "v", n = 9, p = true, text = "“What is your name?” Jesus asked. “My name is Legion,” he replied, “for we are many.”" },
  { t = "v", n = 10, text = "And he begged Jesus repeatedly not to send them out of that region." },
  { t = "v", n = 11, p = true, text = "There on the nearby hillside a large herd of pigs was feeding." },
  { t = "v", n = 12, text = "So the demons begged Jesus, “Send us to the pigs, so that we may enter them.”" },
  { t = "v", n = 13, p = true, text = "He gave them permission, and the unclean spirits came out and went into the pigs, and the herd of about two thousand rushed down the steep bank into the sea and drowned in the water.[^b]" },
  { t = "v", n = 14, p = true, text = "Those tending the pigs ran off and reported this in the town and countryside, and the people went out to see what had happened." },
  { t = "v", n = 15, text = "When they came to Jesus, they saw the man who had been possessed by the legion of demons sitting there, clothed and in his right mind; and they were afraid." },
  { t = "v", n = 16, p = true, text = "Those who had seen it described what had happened to the demon-possessed man and also to the pigs." },
  { t = "v", n = 17, text = "And the people began to beg Jesus to leave their region." },
  { t = "v", n = 18, p = true, text = "As He was getting into the boat, the man who had been possessed by the demons begged to go with Him." },
  { t = "v", n = 19, text = "But Jesus would not allow him. “Go home to your own people,” He said, “and tell them how much the Lord has done for you, and what mercy He has shown you.”" },
  { t = "v", n = 20, p = true, text = "So the man went away and began to proclaim throughout the Decapolis[^c] how much Jesus had done for him. And everyone was amazed." },
  { t = "h", level = 2, text = "The Healing Touch of Jesus" },
  { t = "ref", text = "(Matthew 9:18–26; Luke 8:40–56)" },
  { t = "v", n = 21, p = true, text = "When Jesus had again crossed by boat to the other side, a large crowd gathered around Him beside the sea." },
  { t = "v", n = 22, text = "A synagogue leader named Jairus arrived, and seeing Jesus, he fell at His feet" },
  { t = "v", n = 23, text = "and pleaded with Him urgently, “My little daughter is near death. Please come and place Your hands on her, so that she will be healed and live.”" },
  { t = "v", n = 24, p = true, text = "So Jesus went with him, and a large crowd followed and pressed around Him." },
  { t = "v", n = 25, text = "And a woman was there who had suffered from bleeding for twelve years." },
  { t = "v", n = 26, text = "She had borne much agony under the care of many physicians and had spent all she had, but to no avail. Instead, her condition had only grown worse." },
  { t = "v", n = 27, p = true, text = "When the woman heard about Jesus, she came up through the crowd behind Him and touched His cloak." },
  { t = "v", n = 28, text = "For she kept saying, “If only I touch His garments, I will be healed.”" },
  { t = "v", n = 29, text = "Immediately her bleeding stopped, and she sensed in her body that she was healed of her affliction." },
  { t = "v", n = 30, p = true, text = "At once Jesus was aware that power had gone out from Him. Turning to the crowd, He asked, “Who touched My garments?”" },
  { t = "v", n = 31, p = true, text = "His disciples answered, “You can see the crowd pressing in on You, and yet You ask, ‘Who touched Me?’”" },
  { t = "v", n = 32, p = true, text = "But He kept looking around to see who had done this." },
  { t = "v", n = 33, text = "Then the woman, knowing what had happened to her, came and fell down before Him trembling in fear, and she told Him the whole truth." },
  { t = "v", n = 34, p = true, text = "“Daughter,” said Jesus, “your faith has healed you. Go in peace and be free of your affliction.”" },
  { t = "v", n = 35, p = true, text = "While He was still speaking, messengers from the house of Jairus arrived and said, “Your daughter is dead; why bother the Teacher anymore?”" },
  { t = "v", n = 36, p = true, text = "But Jesus overheard[^d] their conversation and said to Jairus, “Do not be afraid; just believe.”" },
  { t = "v", n = 37, text = "And He did not allow anyone to accompany Him except Peter, James, and John the brother of James." },
  { t = "v", n = 38, p = true, text = "When they arrived at the house of the synagogue leader, Jesus saw the commotion and the people weeping and wailing loudly." },
  { t = "v", n = 39, text = "He went inside and asked, “Why all this commotion and weeping? The child is not dead, but asleep.”" },
  { t = "v", n = 40, text = "And they laughed at Him. After He had put them all outside, He took the child’s father and mother and His own companions, and went in to see the child." },
  { t = "v", n = 41, text = "Taking her by the hand, Jesus said, “Talitha koum!” which means, “Little girl, I say to you, get up!”" },
  { t = "v", n = 42, text = "Immediately the girl got up and began to walk around (she was twelve years old). And at once they were utterly astounded." },
  { t = "v", n = 43, text = "Then Jesus gave strict orders that no one should know about this, and He told them to give her something to eat." },
  { t = "note", id = "a", text = "BYZ and TR *Gadarenes*; PT *Gergesenes*" },
  { t = "note", id = "b", text = "Literally *and were drowned in the sea*" },
  { t = "note", id = "c", text = "That is, the Ten Cities" },
  { t = "note", id = "d", text = "Or *ignored*" },
]

[[section]]
id = "6"
title = "Mark 6"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Rejection at Nazareth" },
  { t = "ref", text = "(Matthew 13:53–58; Luke 4:16–30)" },
  { t = "v", n = 1, p = true, text = "Jesus went on from there and came to His hometown, accompanied by His disciples." },
  { t = "v", n = 2, text = "When the Sabbath came, He began to teach in the synagogue, and many who heard Him were astonished. “Where did this man get these ideas?” they asked. “What is this wisdom He has been given? And how can He perform such miracles?" },
  { t = "v", n = 3, text = "Isn’t this the carpenter, the son of Mary and the brother of James, Joses,[^a] Judas, and Simon? Aren’t His sisters here with us as well?” And they took offense at Him." },
  { t = "v", n = 4, p = true, text = "Then Jesus said to them, “Only in his hometown, among his relatives, and in his own household is a prophet without honor.”" },
  { t = "v", n = 5, text = "So He could not perform any miracles there, except to lay His hands on a few of the sick and heal them." },
  { t = "v", n = 6, text = "And He was amazed at their unbelief. And He went around from village to village, teaching the people." },
  { t = "h", level = 2, text = "The Ministry of the Twelve" },
  { t = "ref", text = "(Matthew 10:5–15; Luke 9:1–6)" },
  { t = "v", n = 7, p = true, text = "Then Jesus called the Twelve to Him and began to send them out two by two, giving them authority over unclean spirits." },
  { t = "v", n = 8, text = "He instructed them to take nothing but a staff for the journey—no bread, no bag, no money[^b] in their belts—" },
  { t = "v", n = 9, text = "and to wear sandals, but not a second tunic." },
  { t = "v", n = 10, p = true, text = "And He told them, “When you enter a house, stay there until you leave that area." },
  { t = "v", n = 11, text = "If anyone will not welcome you or listen to you, shake the dust off your feet when you leave that place, as a testimony against them.”[^c]" },
  { t = "v", n = 12, p = true, text = "So they set out and preached that the people should repent." },
  { t = "v", n = 13, text = "They also drove out many demons and healed many of the sick, anointing them with oil." },
  { t = "h", level = 2, text = "The Beheading of John" },
  { t = "ref", text = "(Matthew 14:1–12; Luke 9:7–9)" },
  { t = "v", n = 14, p = true, text = "Now King Herod heard about this, for Jesus’ name had become well known, and people were saying,[^d] “John the Baptist has risen from the dead! That is why miraculous powers are at work in him.”" },
  { t = "v", n = 15, text = "Others were saying, “He is Elijah,” and still others, “He is a prophet, like one of the prophets of old.”" },
  { t = "v", n = 16, p = true, text = "But when Herod heard this, he said, “John, whom I beheaded, has risen from the dead!”" },
  { t = "v", n = 17, text = "For Herod himself had ordered that John be arrested and bound and imprisoned, on account of his brother Philip’s wife Herodias, whom Herod had married." },
  { t = "v", n = 18, text = "For John had been telling Herod, “It is not lawful for you to have your brother’s wife!”" },
  { t = "v", n = 19, p = true, text = "So Herodias held a grudge against John and wanted to kill him. But she had been unable," },
  { t = "v", n = 20, text = "because Herod feared John and protected him, knowing that he was a righteous and holy man. When he heard John’s words, he was greatly perplexed; yet he listened to him gladly." },
  { t = "v", n = 21, p = true, text = "On Herod’s birthday, her opportunity arose. Herod held a banquet for his nobles and military commanders and the leading men of Galilee." },
  { t = "v", n = 22, text = "When the daughter of Herodias[^e] came and danced, she pleased Herod and his guests, and the king said to the girl, “Ask me for whatever you wish, and I will give it to you.”" },
  { t = "v", n = 23, text = "And he swore to her, “Whatever you ask of me, I will give you, up to half my kingdom!”" },
  { t = "v", n = 24, p = true, text = "Then she went out and asked her mother, “What should I request?” And her mother answered, “The head of John the Baptist.”" },
  { t = "v", n = 25, p = true, text = "At once the girl hurried back to the king with her request: “I want you to give me the head of John the Baptist on a platter immediately.”" },
  { t = "v", n = 26, p = true, text = "The king was consumed with sorrow, but because of his oaths and his guests, he did not want to refuse her." },
  { t = "v", n = 27, text = "So without delay, the king commanded that John’s head be brought in. He sent an executioner, who went and beheaded him in the prison." },
  { t = "v", n = 28, text = "The man brought John’s head on a platter and presented it to the girl, who gave it to her mother." },
  { t = "v", n = 29, p = true, text = "When John’s disciples heard about this, they came and took his body and placed it in a tomb." },
  { t = "h", level = 2, text = "The Feeding of the Five Thousand" },
  { t = "ref", text = "(Matthew 14:13–21; Luke 9:10–17; John 6:1–15)" },
  { t = "v", n = 30, p = true, text = "Meanwhile, the apostles gathered around Jesus and brought Him news of all they had done and taught." },
  { t = "v", n = 31, text = "And He said to them, “Come with Me privately to a solitary place, and let us rest for a while.” For many people were coming and going, and they did not even have time to eat." },
  { t = "v", n = 32, p = true, text = "So they went away in a boat by themselves to a solitary place." },
  { t = "v", n = 33, text = "But many people saw them leaving and recognized them. They ran together on foot from all the towns and arrived before them." },
  { t = "v", n = 34, text = "When Jesus stepped ashore and saw a large crowd, He had compassion on them, because they were like sheep without a shepherd. And He began to teach them many things." },
  { t = "v", n = 35, p = true, text = "By now the hour was already late. So the disciples came to Jesus and said, “This is a desolate place, and the hour is already late." },
  { t = "v", n = 36, text = "Dismiss the crowd so they can go to the surrounding countryside and villages and buy themselves something to eat.”" },
  { t = "v", n = 37, p = true, text = "But Jesus told them, “You give them something to eat.” They asked Him, “Should we go out and spend two hundred denarii[^f] to give all of them bread to eat?”" },
  { t = "v", n = 38, p = true, text = "“Go and see how many loaves you have,” He told them. And after checking, they said, “Five—and two fish.”" },
  { t = "v", n = 39, p = true, text = "Then Jesus directed them to have the people sit in groups on the green grass." },
  { t = "v", n = 40, text = "So they sat down in groups of hundreds and fifties." },
  { t = "v", n = 41, p = true, text = "Taking the five loaves and the two fish and looking up to heaven, Jesus spoke a blessing and broke the loaves. Then He gave them to His disciples to set before the people. And He divided the two fish among them all." },
  { t = "v", n = 42, p = true, text = "They all ate and were satisfied," },
  { t = "v", n = 43, text = "and the disciples picked up twelve basketfuls of broken pieces of bread and fish." },
  { t = "v", n = 44, text = "And there were five thousand men who had eaten the loaves." },
  { t = "h", level = 2, text = "Jesus Walks on Water" },
  { t = "ref", text = "(Matthew 14:22–33; John 6:16–21)" },
  { t = "v", n = 45, p = true, text = "Immediately Jesus made His disciples get into the boat and go on ahead of Him to Bethsaida, while He dismissed the crowd." },
  { t = "v", n = 46, text = "After bidding them farewell, He went up on the mountain to pray." },
  { t = "v", n = 47, p = true, text = "When evening came, the boat was in the middle of the sea, and Jesus was alone on land." },
  { t = "v", n = 48, text = "He could see that the disciples were straining to row, because the wind was against them. About the fourth watch of the night,[^g] Jesus went out to them, walking on the sea. He intended to pass by them," },
  { t = "v", n = 49, text = "but when they saw Him walking on the sea, they cried out, thinking He was a ghost—" },
  { t = "v", n = 50, text = "for they all saw Him and were terrified. But Jesus spoke up at once: “Take courage! It is I. Do not be afraid.”" },
  { t = "v", n = 51, text = "Then He climbed into the boat with them, and the wind died down. And the disciples were utterly astounded," },
  { t = "v", n = 52, text = "for they had not understood about the loaves, but their hearts had been hardened." },
  { t = "h", level = 2, text = "Jesus Heals at Gennesaret" },
  { t = "ref", text = "(Matthew 14:34–36)" },
  { t = "v", n = 53, p = true, text = "When they had crossed over, they landed at Gennesaret and moored the boat." },
  { t = "v", n = 54, text = "As soon as they got out of the boat, the people recognized Jesus" },
  { t = "v", n = 55, text = "and ran through that whole region, carrying the sick on mats to wherever they heard He was." },
  { t = "v", n = 56, text = "And wherever He went—villages and towns and countrysides—they laid the sick in the marketplaces and begged Him just to let them touch the fringe of His cloak. And all who touched Him were healed." },
  { t = "note", id = "a", text = "*Joses* is a variant of *Joseph*; see Matthew 13:55." },
  { t = "note", id = "b", text = "Or *copper coins*" },
  { t = "note", id = "c", text = "BYZ and TR include *Truly I tell you, it will be more tolerable for Sodom and Gomorrah on the day of judgment than for that town*; see Matthew 10:15." },
  { t = "note", id = "d", text = "Literally *they were saying*; some manuscripts *he was saying*" },
  { t = "note", id = "e", text = "Some early manuscripts *When his daughter Herodias*" },
  { t = "note", id = "f", text = "A denarius was customarily a day’s wage for a laborer; see Matthew 20:2." },
  { t = "note", id = "g", text = "That is, between three and six in the morning" },
]

[[section]]
id = "7"
title = "Mark 7"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Tradition of the Elders" },
  { t = "ref", text = "(Matthew 15:1–9)" },
  { t = "v", n = 1, p = true, text = "Then the Pharisees and some of the scribes who had come from Jerusalem gathered around Jesus," },
  { t = "v", n = 2, text = "and they saw some of His disciples eating with hands that were defiled—that is, unwashed." },
  { t = "v", n = 3, p = true, text = "Now in holding to the tradition of the elders, the Pharisees and all the Jews do not eat until they wash their hands ceremonially.[^a]" },
  { t = "v", n = 4, text = "And on returning from the market, they do not eat unless they wash. And there are many other traditions for them to observe, including the washing of cups, pitchers, kettles, and couches for dining.[^b]" },
  { t = "v", n = 5, p = true, text = "So the Pharisees and scribes questioned Jesus: “Why do Your disciples not walk according to the tradition of the elders? Instead, they eat with defiled hands.”" },
  { t = "v", n = 6, p = true, text = "Jesus answered them, “Isaiah prophesied correctly about you hypocrites, as it is written: ‘These people honor Me with their lips, but their hearts are far from Me." },
  { t = "v", n = 7, indent = 1, text = "They worship Me in vain; they teach as doctrine the precepts of men.’[^c]" },
  { t = "v", n = 8, p = true, text = "You have disregarded the commandment of God to keep the tradition of men.[^d]”" },
  { t = "v", n = 9, p = true, text = "He went on to say, “You neatly set aside the command of God to maintain[^e] your own tradition." },
  { t = "v", n = 10, text = "For Moses said, ‘Honor your father and your mother’[^f] and ‘Anyone who curses his father or mother must be put to death.’[^g]" },
  { t = "v", n = 11, text = "But you say that if a man says to his father or mother, ‘Whatever you would have received from me is Corban’ (that is, a gift devoted to God)," },
  { t = "v", n = 12, text = "he is no longer permitted to do anything for his father or mother." },
  { t = "v", n = 13, text = "Thus you nullify the word of God by the tradition you have handed down. And you do so in many such matters.”" },
  { t = "h", level = 2, text = "What Defiles a Man" },
  { t = "ref", text = "(Matthew 15:10–20)" },
  { t = "v", n = 14, p = true, text = "Once again Jesus called the crowd to Him and said, “All of you, listen to Me and understand:" },
  { t = "v", n = 15, text = "Nothing that enters a man from the outside can defile him; but the things that come out of a man, these are what defile him.”[^h]" },
  { t = "v", n = 17, p = true, text = "After Jesus had left the crowd and gone into the house, His disciples inquired about the parable." },
  { t = "v", n = 18, p = true, text = "“Are you still so dull?” He asked. “Do you not understand? Nothing that enters a man from the outside can defile him," },
  { t = "v", n = 19, text = "because it does not enter his heart, but it goes into the stomach and then is eliminated.” (Thus all foods are clean.)[^i]" },
  { t = "v", n = 20, p = true, text = "He continued: “What comes out of a man, that is what defiles him." },
  { t = "v", n = 21, text = "For from within the hearts of men come evil thoughts, sexual immorality, theft, murder, adultery,[^j]" },
  { t = "v", n = 22, text = "greed, wickedness, deceit, debauchery, envy, slander, arrogance, and foolishness." },
  { t = "v", n = 23, text = "All these evils come from within, and these are what defile a man.”" },
  { t = "h", level = 2, text = "The Faith of the Gentile Woman" },
  { t = "ref", text = "(Matthew 15:21–28)" },
  { t = "v", n = 24, p = true, text = "Jesus left that place and went to the region of Tyre.[^k] Not wanting anyone to know He was there, He entered a house, but was unable to escape their notice." },
  { t = "v", n = 25, text = "Instead, a woman whose little daughter had an unclean spirit soon heard about Jesus, and she came and fell at His feet." },
  { t = "v", n = 26, text = "Now she was a Greek woman of Syrophoenician origin, and she kept asking Jesus to drive the demon out of her daughter." },
  { t = "v", n = 27, p = true, text = "“First let the children have their fill,” He said. “For it is not right to take the children’s bread and toss it to the dogs.”" },
  { t = "v", n = 28, p = true, text = "“Yes, Lord,” she replied, “even the dogs[^l] under the table eat the children’s crumbs.”" },
  { t = "v", n = 29, p = true, text = "Then Jesus told her, “Because of this answer, you may go. The demon has left your daughter.”" },
  { t = "v", n = 30, text = "And she went home and found her child lying on the bed, and the demon was gone." },
  { t = "h", level = 2, text = "The Deaf and Mute Man" },
  { t = "ref", text = "(Matthew 9:27–34)" },
  { t = "v", n = 31, p = true, text = "Then Jesus left the region of Tyre and went through Sidon to the Sea of Galilee and into the region of the Decapolis.[^m]" },
  { t = "v", n = 32, text = "Some people brought to Him a man who was deaf and hardly able to speak, and they begged Jesus to place His hand on him." },
  { t = "v", n = 33, p = true, text = "So Jesus took him aside privately, away from the crowd, and put His fingers into the man’s ears. Then He spit and touched the man’s tongue." },
  { t = "v", n = 34, text = "And looking up to heaven, He sighed deeply and said to him, “Ephphatha!” (which means, “Be opened!”)." },
  { t = "v", n = 35, text = "Immediately[^n] the man’s ears were opened and his tongue was released, and he began to speak plainly." },
  { t = "v", n = 36, p = true, text = "Jesus ordered them not to tell anyone. But the more He ordered them, the more widely they proclaimed it." },
  { t = "v", n = 37, text = "The people were utterly astonished and said, “He has done all things well! He makes even the deaf hear and the mute speak!”" },
  { t = "note", id = "a", text = "Literally *until they have washed their hands to the fist*" },
  { t = "note", id = "b", text = "NE and WH *cups, pitchers, and kettles.*" },
  { t = "note", id = "c", text = "Isaiah 29:13 (see also LXX)" },
  { t = "note", id = "d", text = "BYZ and TR include *—washings of pots and cups and many such things like these.*" },
  { t = "note", id = "e", text = "NA *establish*" },
  { t = "note", id = "f", text = "Exodus 20:12; Deuteronomy 5:16" },
  { t = "note", id = "g", text = "Exodus 21:17; Leviticus 20:9" },
  { t = "note", id = "h", text = "BYZ and TR include *(16) If anyone has ears to hear, let him hear.*" },
  { t = "note", id = "i", text = "Or *and then is eliminated, thereby expelling all foods.”*" },
  { t = "note", id = "j", text = "Many texts move *adultery* to verse 22." },
  { t = "note", id = "k", text = "WH, BYZ, and TR include *and Sidon*; see Matthew 15:21." },
  { t = "note", id = "l", text = "Or *puppies*" },
  { t = "note", id = "m", text = "That is, the Ten Cities" },
  { t = "note", id = "n", text = "ECM, WH, and SBL do not include *Immediately*." },
]

[[section]]
id = "8"
title = "Mark 8"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Feeding of the Four Thousand" },
  { t = "ref", text = "(2 Kings 4:42–44; Matthew 15:29–39)" },
  { t = "v", n = 1, p = true, text = "In those days the crowd once again became very large, and they had nothing to eat. Jesus called the disciples to Him and said," },
  { t = "v", n = 2, text = "“I have compassion for this crowd, because they have already been with Me three days and have nothing to eat." },
  { t = "v", n = 3, text = "If I send them home hungry, they will faint along the way. For some of them have come a great distance.”" },
  { t = "v", n = 4, p = true, text = "His disciples replied, “Where in this desolate place could anyone find enough bread to feed all these people?”" },
  { t = "v", n = 5, p = true, text = "“How many loaves do you have?” Jesus asked. “Seven,” they replied." },
  { t = "v", n = 6, p = true, text = "And He instructed the crowd to sit down on the ground. Then He took the seven loaves, gave thanks and broke them, and gave them to His disciples to set before the people. And they distributed them to the crowd." },
  { t = "v", n = 7, text = "They also had a few small fish, and Jesus blessed them and ordered that these be set before them as well." },
  { t = "v", n = 8, p = true, text = "The people ate and were satisfied, and the disciples picked up seven basketfuls of broken pieces that were left over." },
  { t = "v", n = 9, text = "And about four thousand men[^a] were present. And when Jesus had dismissed the crowd," },
  { t = "v", n = 10, text = "He immediately got into the boat with His disciples and went to the district of Dalmanutha." },
  { t = "h", level = 2, text = "The Demand for a Sign" },
  { t = "ref", text = "(Matthew 16:1–4; Luke 12:54–56)" },
  { t = "v", n = 11, p = true, text = "Then the Pharisees came and began to argue with Jesus, testing Him by demanding from Him a sign from heaven." },
  { t = "v", n = 12, p = true, text = "Jesus sighed deeply in His spirit and said, “Why does this generation demand a sign? Truly I tell you, no sign will be given to this generation.”" },
  { t = "v", n = 13, text = "And He left them, got back into the boat, and crossed to the other side." },
  { t = "h", level = 2, text = "The Leaven of the Pharisees and of Herod" },
  { t = "ref", text = "(Matthew 16:5–12; Luke 12:1–3)" },
  { t = "v", n = 14, p = true, text = "Now the disciples had forgotten to take bread, except for one loaf they had with them in the boat." },
  { t = "v", n = 15, text = "“Watch out!” He cautioned them. “Beware of the leaven of the Pharisees and of Herod.”" },
  { t = "v", n = 16, p = true, text = "So they began to discuss with one another the fact that they had no bread." },
  { t = "v", n = 17, p = true, text = "Aware of their conversation, Jesus asked them, “Why are you debating about having no bread? Do you still not see or understand? Do you have such hard hearts?" },
  { t = "v", n = 18, text = "‘Having eyes, do you not see? And having ears, do you not hear?’[^b] And do you not remember?" },
  { t = "v", n = 19, text = "When I broke the five loaves for the five thousand, how many basketfuls of broken pieces did you collect?” “Twelve,” they answered." },
  { t = "v", n = 20, p = true, text = "“And when I broke the seven loaves for the four thousand, how many basketfuls of broken pieces did you collect?” “Seven,” they said." },
  { t = "v", n = 21, p = true, text = "Then He asked them, “Do you still not understand?”" },
  { t = "h", level = 2, text = "The Blind Man at Bethsaida" },
  { t = "v", n = 22, p = true, text = "When they arrived at Bethsaida, some people brought a blind man and begged Jesus to touch him." },
  { t = "v", n = 23, text = "So He took the blind man by the hand and led him out of the village. Then He spit on the man’s eyes and placed His hands on him. “Can you see anything?” He asked." },
  { t = "v", n = 24, p = true, text = "The man looked up and said, “I can see the people, but they look like trees walking around.”" },
  { t = "v", n = 25, p = true, text = "Once again Jesus placed His hands on the man’s eyes, and when he opened them his sight was restored, and he could see everything clearly." },
  { t = "v", n = 26, text = "Jesus sent him home and said, “Do not go back into the village.”[^c]" },
  { t = "h", level = 2, text = "Peter’s Confession of Christ" },
  { t = "ref", text = "(Matthew 16:13–20; Luke 9:18–20; John 6:67–71)" },
  { t = "v", n = 27, p = true, text = "Then Jesus and His disciples went on to the villages around Caesarea Philippi. On the way, He questioned His disciples: “Who do people say I am?”" },
  { t = "v", n = 28, p = true, text = "They replied, “Some say John the Baptist; others say Elijah; and still others, one of the prophets.”" },
  { t = "v", n = 29, p = true, text = "“But what about you?” Jesus asked. “Who do you say I am?” Peter answered, “You are the Christ.”" },
  { t = "v", n = 30, p = true, text = "And Jesus warned them not to tell anyone about Him." },
  { t = "h", level = 2, text = "Christ’s Passion Foretold" },
  { t = "ref", text = "(Matthew 16:21–23; Luke 9:21–22)" },
  { t = "v", n = 31, p = true, text = "Then He began to teach them that the Son of Man must suffer many things and be rejected by the elders, chief priests, and scribes, and that He must be killed and after three days rise again." },
  { t = "v", n = 32, text = "He spoke this message quite frankly, and Peter took Him aside and began to rebuke Him." },
  { t = "v", n = 33, p = true, text = "But Jesus, turning and looking at His disciples, rebuked Peter and said, “Get behind Me, Satan! For you do not have in mind the things of God, but the things of men.”" },
  { t = "h", level = 2, text = "Take Up Your Cross" },
  { t = "ref", text = "(Matthew 16:24–28; Luke 9:23–27)" },
  { t = "v", n = 34, p = true, text = "Then Jesus called the crowd to Him along with His disciples, and He told them, “If anyone wants to come after Me, he must deny himself and take up his cross and follow Me." },
  { t = "v", n = 35, text = "For whoever wants to save his life will lose it, but whoever loses his life for My sake and for the gospel will save it." },
  { t = "v", n = 36, p = true, text = "What does it profit a man to gain the whole world, yet forfeit his soul?" },
  { t = "v", n = 37, text = "Or what can a man give in exchange for his soul?" },
  { t = "v", n = 38, text = "If anyone is ashamed of Me and My words in this adulterous and sinful generation, the Son of Man will also be ashamed of him when He comes in His Father’s glory with the holy angels.”" },
  { t = "note", id = "a", text = "*Men*is implied here, that is, in addition to women and children; see Matthew 15:38." },
  { t = "note", id = "b", text = "See Deuteronomy 29:4, Isaiah 42:20, Jeremiah 5:21, and Ezekiel 12:2." },
  { t = "note", id = "c", text = "BYZ and TR *“Do not go and tell anyone in the village.”*" },
]

[[section]]
id = "9"
title = "Mark 9"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Transfiguration" },
  { t = "ref", text = "(Matthew 17:1–13; Luke 9:28–36; 2 Peter 1:16–21)" },
  { t = "v", n = 1, p = true, text = "Then Jesus said to them, “Truly I tell you, there are some standing here who will not taste death before they see the kingdom of God arrive with power.”" },
  { t = "v", n = 2, p = true, text = "After six days Jesus took with Him Peter, James, and John, and led them up a high mountain by themselves. There He was transfigured before them." },
  { t = "v", n = 3, text = "His clothes became radiantly white, brighter than any launderer on earth could bleach them." },
  { t = "v", n = 4, text = "And Elijah and Moses appeared before them, talking with Jesus." },
  { t = "v", n = 5, p = true, text = "Peter said to Jesus, “Rabbi, it is good for us to be here. Let us put up three shelters[^a]—one for You, one for Moses, and one for Elijah.”" },
  { t = "v", n = 6, text = "For they were all so terrified that Peter did not know what else to say." },
  { t = "v", n = 7, p = true, text = "Then a cloud appeared and enveloped them, and a voice came from the cloud: “This is My beloved Son. Listen to Him!”" },
  { t = "v", n = 8, text = "Suddenly, when they looked around, they saw no one with them except Jesus." },
  { t = "v", n = 9, p = true, text = "As they were coming down the mountain, Jesus admonished them not to tell anyone what they had seen until the Son of Man had risen from the dead." },
  { t = "v", n = 10, text = "So they kept this matter to themselves, discussing what it meant to rise from the dead." },
  { t = "v", n = 11, text = "And they asked Jesus, “Why do the scribes say that Elijah must come first?”" },
  { t = "v", n = 12, p = true, text = "He replied, “Elijah does indeed come first, and he restores all things. Why then is it written that the Son of Man must suffer many things and be rejected?" },
  { t = "v", n = 13, text = "But I tell you that Elijah has indeed come, and they have done to him whatever they wished, just as it is written about him.”" },
  { t = "h", level = 2, text = "The Boy with an Evil Spirit" },
  { t = "ref", text = "(Matthew 17:14–18; Luke 9:37–42)" },
  { t = "v", n = 14, p = true, text = "When they returned to the other disciples, they saw a large crowd around them, and scribes arguing with them." },
  { t = "v", n = 15, text = "As soon as all the people saw Jesus, they were filled with awe and ran to greet Him." },
  { t = "v", n = 16, p = true, text = "“What are you disputing with them?” He asked." },
  { t = "v", n = 17, p = true, text = "Someone in the crowd replied, “Teacher, I brought You my son, who has a spirit that makes him mute." },
  { t = "v", n = 18, text = "Whenever it seizes him, it throws him to the ground. He foams at the mouth, gnashes his teeth, and becomes rigid.[^b] I asked Your disciples to drive it out, but they were unable.”" },
  { t = "v", n = 19, p = true, text = "“O unbelieving generation!” Jesus replied. “How long must I remain with you? How long must I put up with you? Bring the boy to Me.”" },
  { t = "v", n = 20, p = true, text = "So they brought him, and seeing Jesus, the spirit immediately threw the boy into a convulsion. He fell to the ground and rolled around, foaming at the mouth." },
  { t = "v", n = 21, p = true, text = "Jesus asked the boy’s father, “How long has this been with him?” “From childhood,” he said." },
  { t = "v", n = 22, text = "“It often throws him into the fire or into the water, trying to kill him. But if You can do anything, have compassion on us and help us.”" },
  { t = "v", n = 23, p = true, text = "“If You can?” echoed Jesus. “All things are possible to him who believes!”" },
  { t = "v", n = 24, p = true, text = "Immediately the boy’s father cried out,[^c] “I do believe; help my unbelief!”" },
  { t = "v", n = 25, p = true, text = "When Jesus saw that a crowd had come running, He rebuked the unclean spirit. “You deaf and mute spirit,” He said, “I command you to come out and never enter him again.”" },
  { t = "v", n = 26, p = true, text = "After shrieking and convulsing him violently, the spirit came out. The boy became like a corpse, so that many said, “He is dead.”" },
  { t = "v", n = 27, text = "But Jesus took him by the hand and helped him to his feet, and he stood up." },
  { t = "v", n = 28, p = true, text = "After Jesus had gone into the house, His disciples asked Him privately, “Why couldn’t we drive it out?”" },
  { t = "v", n = 29, p = true, text = "Jesus answered, “This kind cannot come out, except by prayer.”[^d]" },
  { t = "h", level = 2, text = "The Second Prediction of the Passion" },
  { t = "ref", text = "(Matthew 17:22–23; Luke 9:43–45)" },
  { t = "v", n = 30, p = true, text = "Going on from there, they passed through Galilee. But Jesus did not want anyone to know," },
  { t = "v", n = 31, text = "because He was teaching His disciples. He told them, “The Son of Man will be delivered into the hands of men. They will kill Him, and after three days He will rise.”" },
  { t = "v", n = 32, text = "But they did not understand this statement, and they were afraid to ask Him about it." },
  { t = "h", level = 2, text = "The Greatest in the Kingdom" },
  { t = "ref", text = "(Matthew 18:1–5; Luke 9:46–50)" },
  { t = "v", n = 33, p = true, text = "Then they came to Capernaum. While Jesus was in the house, He asked them, “What were you discussing on the way?”" },
  { t = "v", n = 34, text = "But they were silent, for on the way they had been arguing about which of them was the greatest." },
  { t = "v", n = 35, p = true, text = "Sitting down, Jesus called the Twelve and said, “If anyone wants to be first, he must be the last of all and the servant of all.”" },
  { t = "v", n = 36, p = true, text = "Then He had a little child stand among them. Taking the child in His arms, He said to them," },
  { t = "v", n = 37, text = "“Whoever welcomes one of these little children in My name welcomes Me, and whoever welcomes Me welcomes not only Me, but the One who sent Me.”" },
  { t = "v", n = 38, p = true, text = "John said to Him, “Teacher, we saw someone else driving out demons in Your name, and we tried to stop him, because he does not accompany us.”" },
  { t = "v", n = 39, p = true, text = "“Do not stop him,” Jesus replied. “For no one who performs a miracle in My name can turn around and speak evil of Me." },
  { t = "v", n = 40, text = "For whoever is not against us is for us." },
  { t = "v", n = 41, text = "Indeed, if anyone gives you even a cup of water because you bear the name of Christ, truly I tell you, he will never lose his reward." },
  { t = "h", level = 2, text = "Temptations and Trespasses" },
  { t = "ref", text = "(Matthew 18:6–9; Luke 17:1–4)" },
  { t = "v", n = 42, p = true, text = "But if anyone causes one of these little ones who believe in Me to stumble, it would be better for him to have a large millstone hung around his neck and to be thrown into the sea." },
  { t = "v", n = 43, p = true, text = "If your hand causes you to sin, cut it off. It is better for you to enter life crippled than to have two hands and go into hell,[^e] into the unquenchable fire.[^f]" },
  { t = "v", n = 45, text = "If your foot causes you to sin, cut it off. It is better for you to enter life lame than to have two feet and be thrown into hell.[^g]" },
  { t = "v", n = 47, text = "And if your eye causes you to sin, pluck it out. It is better for you to enter the kingdom of God with one eye than to have two eyes and be thrown into hell," },
  { t = "v", n = 48, text = "where ‘their worm never dies, and the fire is never quenched.’[^h]" },
  { t = "h", level = 2, text = "Good Salt" },
  { t = "ref", text = "(Matthew 5:13–16; Luke 14:34–35)" },
  { t = "v", n = 49, p = true, text = "For everyone will be salted with fire.[^i]" },
  { t = "v", n = 50, p = true, text = "Salt is good, but if the salt loses its saltiness, with what will you season it? Have salt among yourselves, and be at peace with one another.”" },
  { t = "note", id = "a", text = "Or *three tabernacles*" },
  { t = "note", id = "b", text = "Or *and is withering away*" },
  { t = "note", id = "c", text = "BYZ and TR *cried out with tears*" },
  { t = "note", id = "d", text = "BYZ and TR *prayer and fasting*" },
  { t = "note", id = "e", text = "Greek *Gehenna*; also in verses 45 and 47" },
  { t = "note", id = "f", text = "BYZ and TR include *(44) where their worm never dies, and the fire is never quenched*; see verse 48 and Isaiah 66:24." },
  { t = "note", id = "g", text = "BYZ and TR include *(46) where their worm never dies, and the fire is never quenched*; see verse 48 and Isaiah 66:24." },
  { t = "note", id = "h", text = "Isaiah 66:24" },
  { t = "note", id = "i", text = "BYZ and TR include *and every sacrifice will be salted with salt*." },
]

[[section]]
id = "10"
title = "Mark 10"
level = 1
blocks = [
  { t = "h", level = 2, text = "Teachings about Divorce" },
  { t = "ref", text = "(Matthew 19:1–12)" },
  { t = "v", n = 1, p = true, text = "Then Jesus left that place and went into the region of Judea, beyond the Jordan. Again the crowds came to Him and He taught them, as was His custom." },
  { t = "v", n = 2, p = true, text = "Some Pharisees came to test Him. “Is it lawful for a man to divorce his wife?” they inquired." },
  { t = "v", n = 3, p = true, text = "“What did Moses command you?” He replied." },
  { t = "v", n = 4, p = true, text = "They answered, “Moses permitted a man to write his wife a certificate of divorce and send her away.”[^a]" },
  { t = "v", n = 5, p = true, text = "But Jesus told them, “Moses wrote this commandment for you because of your hardness of heart." },
  { t = "v", n = 6, text = "However, from the beginning of creation, ‘God made them male and female.’[^b]" },
  { t = "v", n = 7, text = "‘For this reason a man will leave his father and mother and be united to his wife,[^c]" },
  { t = "v", n = 8, text = "and the two will become one flesh.’[^d] So they are no longer two, but one flesh." },
  { t = "v", n = 9, text = "Therefore what God has joined together, let man not separate.”" },
  { t = "v", n = 10, p = true, text = "When they were back inside the house, the disciples asked Jesus about this matter." },
  { t = "v", n = 11, text = "So He told them, “Whoever divorces his wife and marries another woman commits adultery against her." },
  { t = "v", n = 12, text = "And if a woman divorces her husband and marries another man, she commits adultery.”" },
  { t = "h", level = 2, text = "Jesus Blesses the Children" },
  { t = "ref", text = "(Matthew 19:13–15; Luke 18:15–17)" },
  { t = "v", n = 13, p = true, text = "Now people were bringing the little children to Jesus for Him to place His hands on them, and the disciples rebuked those who brought them." },
  { t = "v", n = 14, p = true, text = "But when Jesus saw this, He was indignant and told them, “Let the little children come to Me, and do not hinder them! For the kingdom of God belongs to such as these." },
  { t = "v", n = 15, text = "Truly I tell you, anyone who does not receive the kingdom of God like a little child will never enter it.”" },
  { t = "v", n = 16, text = "And He took the children in His arms, placed His hands on them, and blessed them." },
  { t = "h", level = 2, text = "The Rich Young Man" },
  { t = "ref", text = "(Matthew 19:16–30; Luke 18:18–30)" },
  { t = "v", n = 17, p = true, text = "As Jesus started on His way, a man ran up and knelt before Him. “Good Teacher,” he asked, “what must I do to inherit eternal life?”" },
  { t = "v", n = 18, p = true, text = "“Why do you call Me good?” Jesus replied. “No one is good except God alone." },
  { t = "v", n = 19, text = "You know the commandments: ‘Do not murder, do not commit adultery, do not steal, do not bear false witness, do not cheat others, honor your father and mother.’[^e]”" },
  { t = "v", n = 20, p = true, text = "“Teacher,” he replied, “all these I have kept from my youth.”" },
  { t = "v", n = 21, p = true, text = "Jesus looked at him, loved him, and said to him, “There is one thing you lack: Go, sell everything you own and give to the poor, and you will have treasure in heaven. Then come, follow Me.[^f]”" },
  { t = "v", n = 22, p = true, text = "But the man was saddened by these words and went away in sorrow, because he had great wealth." },
  { t = "v", n = 23, p = true, text = "Then Jesus looked around and said to His disciples, “How hard it is for the rich to enter the kingdom of God!”" },
  { t = "v", n = 24, p = true, text = "And the disciples were amazed at His words. But Jesus said to them again, “Children, how hard it is to enter[^g] the kingdom of God!" },
  { t = "v", n = 25, text = "It is easier for a camel to pass through the eye of a needle than for a rich man to enter the kingdom of God.”" },
  { t = "v", n = 26, p = true, text = "They were even more astonished and said to one another, “Who then can be saved?”" },
  { t = "v", n = 27, p = true, text = "Jesus looked at them and said, “With man this is impossible, but not with God. For all things are possible with God.”" },
  { t = "v", n = 28, p = true, text = "Peter began to say to Him, “Look, we have left everything and followed You.”" },
  { t = "v", n = 29, p = true, text = "“Truly I tell you,” Jesus replied, “no one who has left home or brothers or sisters or mother or father or children or fields for My sake and for the gospel" },
  { t = "v", n = 30, text = "will fail to receive a hundredfold in the present age—houses and brothers and sisters and mothers and children and fields, along with persecutions—and in the age to come, eternal life." },
  { t = "v", n = 31, text = "But many who are first will be last, and the last will be first.”" },
  { t = "h", level = 2, text = "The Third Prediction of the Passion" },
  { t = "ref", text = "(Matthew 20:17–19; Luke 18:31–34)" },
  { t = "v", n = 32, p = true, text = "As they were going up the road to Jerusalem, Jesus was walking ahead of them. The disciples were amazed, but those who followed were afraid. Again Jesus took the Twelve aside and began to tell them what was going to happen to Him:" },
  { t = "v", n = 33, text = "“Look, we are going up to Jerusalem, and the Son of Man will be delivered over to the chief priests and scribes. They will condemn Him to death and will deliver Him over to the Gentiles," },
  { t = "v", n = 34, text = "who will mock Him and spit on Him and flog Him and kill Him. And after three days He will rise again.”" },
  { t = "h", level = 2, text = "The Request of James and John" },
  { t = "ref", text = "(Matthew 20:20–28)" },
  { t = "v", n = 35, p = true, text = "Then James and John, the sons of Zebedee, came to Jesus and declared, “Teacher, we want You to do for us whatever we ask.”" },
  { t = "v", n = 36, p = true, text = "“What do you want Me to do for you?” He inquired." },
  { t = "v", n = 37, p = true, text = "They answered, “Grant that one of us may sit at Your right hand and the other at Your left in Your glory.”" },
  { t = "v", n = 38, p = true, text = "“You do not know what you are asking,” Jesus replied. “Can you drink the cup I will drink, or be baptized with the baptism I will undergo?”" },
  { t = "v", n = 39, p = true, text = "“We can,” the brothers answered. “You will drink the cup that I drink,” Jesus said, “and you will be baptized with the baptism that I undergo." },
  { t = "v", n = 40, text = "But to sit at My right or left is not Mine to grant. These seats belong to those for whom[^h] they have been prepared.”" },
  { t = "v", n = 41, p = true, text = "When the ten heard about this, they became indignant with James and John." },
  { t = "v", n = 42, text = "So Jesus called them together and said, “You know that those regarded as rulers of the Gentiles lord it over them, and their superiors exercise authority over them." },
  { t = "v", n = 43, text = "But it shall not be this way among you. Instead, whoever wants to become great among you must be your servant," },
  { t = "v", n = 44, text = "and whoever wants to be first must be the slave of all." },
  { t = "v", n = 45, text = "For even the Son of Man did not come to be served, but to serve, and to give His life as a ransom for many.”" },
  { t = "h", level = 2, text = "Jesus Heals Bartimaeus" },
  { t = "ref", text = "(Matthew 20:29–34; Luke 18:35–43)" },
  { t = "v", n = 46, p = true, text = "Next, they came to Jericho. And as Jesus and His disciples were leaving Jericho with a large crowd, a blind beggar named Bartimaeus, the son of Timaeus, was sitting beside the road." },
  { t = "v", n = 47, text = "When he heard that it was Jesus of Nazareth, he began to cry out, “Jesus, Son of David, have mercy on me!”" },
  { t = "v", n = 48, p = true, text = "Many people admonished him to be silent, but he cried out all the louder, “Son of David, have mercy on me!”" },
  { t = "v", n = 49, p = true, text = "Jesus stopped and said, “Call him.” So they called the blind man. “Take courage!” they said. “Get up! He is calling for you.”" },
  { t = "v", n = 50, p = true, text = "Throwing off his cloak, Bartimaeus jumped up and came to Jesus." },
  { t = "v", n = 51, p = true, text = "“What do you want Me to do for you?” Jesus asked. “Rabboni,” said the blind man, “let me see again.”" },
  { t = "v", n = 52, p = true, text = "“Go,” said Jesus, “your faith has healed you.” And immediately he received his sight and followed Jesus along the road." },
  { t = "note", id = "a", text = "See Deuteronomy 24:1." },
  { t = "note", id = "b", text = "Genesis 1:27; Genesis 5:2" },
  { t = "note", id = "c", text = "NE and WH do not include *and be united to his wife.*" },
  { t = "note", id = "d", text = "Genesis 2:24 (see also LXX)" },
  { t = "note", id = "e", text = "Exodus 20:12–16; Deuteronomy 5:16–20" },
  { t = "note", id = "f", text = "BYZ and TR *Then come, take up the cross, and follow Me.*" },
  { t = "note", id = "g", text = "BYZ and TR *how hard it is for those who trust in riches to enter*" },
  { t = "note", id = "h", text = "Literally *Mine to grant, but for whom*" },
]

[[section]]
id = "11"
title = "Mark 11"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Triumphal Entry" },
  { t = "ref", text = "(Zechariah 9:9–13; Matthew 21:1–11; Luke 19:28–40; John 12:12–19)" },
  { t = "v", n = 1, p = true, text = "As they approached Jerusalem and came to Bethphage and Bethany at the Mount of Olives, Jesus sent out two of His disciples" },
  { t = "v", n = 2, text = "and said to them, “Go into the village ahead of you, and as soon as you enter it, you will find a colt tied there, on which no one has ever sat. Untie it and bring it here." },
  { t = "v", n = 3, text = "If anyone asks, ‘Why are you doing this?’ tell him, ‘The Lord needs it and will return it shortly.’”" },
  { t = "v", n = 4, p = true, text = "So they went and found the colt outside in the street, tied at a doorway. They untied it," },
  { t = "v", n = 5, text = "and some who were standing there asked, “Why are you untying the colt?”" },
  { t = "v", n = 6, p = true, text = "The disciples answered as Jesus had instructed them, and the people gave them permission." },
  { t = "v", n = 7, text = "Then they led the colt to Jesus and threw their cloaks over it, and He sat on it." },
  { t = "v", n = 8, p = true, text = "Many in the crowd spread their cloaks on the road, while others spread branches they had cut from the fields." },
  { t = "v", n = 9, text = "The ones who went ahead and those who followed were shouting: “Hosanna!”[^a] “Blessed is He who comes in the name of the Lord!”[^b]" },
  { t = "v", n = 10, indent = 1, p = true, text = "“Blessed is the coming kingdom of our father David!” “Hosanna in the highest!”[^c]" },
  { t = "v", n = 11, p = true, text = "Then Jesus entered Jerusalem and went into the temple courts.[^d] He looked around at everything, but since it was already late, He went out to Bethany with the Twelve." },
  { t = "h", level = 2, text = "Jesus Curses the Fig Tree" },
  { t = "ref", text = "(Matthew 21:18–22; Mark 11:20–25)" },
  { t = "v", n = 12, p = true, text = "The next day, when they had left Bethany, Jesus was hungry." },
  { t = "v", n = 13, text = "Seeing in the distance a fig tree in leaf, He went to see if there was any fruit on it. But when He reached it, He found nothing on it except leaves, since it was not the season for figs." },
  { t = "v", n = 14, text = "Then He said to the tree, “May no one ever eat of your fruit again.” And His disciples heard this statement." },
  { t = "h", level = 2, text = "Jesus Cleanses the Temple" },
  { t = "ref", text = "(Matthew 21:12–17; Luke 19:45–48; John 2:12–25)" },
  { t = "v", n = 15, p = true, text = "When they arrived in Jerusalem, Jesus entered the temple courts and began to drive out those who were buying and selling there. He overturned the tables of the money changers and the seats of those selling doves." },
  { t = "v", n = 16, text = "And He would not allow anyone to carry merchandise through the temple courts." },
  { t = "v", n = 17, text = "Then Jesus began to teach them, and He declared, “Is it not written: ‘My house will be called a house of prayer for all the nations’[^e]? But you have made it ‘a den of robbers.’[^f]”" },
  { t = "v", n = 18, p = true, text = "When the chief priests and scribes heard this, they looked for a way to kill Him. For they were afraid of Him, because the whole crowd was astonished at His teaching." },
  { t = "v", n = 19, p = true, text = "And when evening came, Jesus and His disciples went[^g] out of the city." },
  { t = "h", level = 2, text = "The Withered Fig Tree" },
  { t = "ref", text = "(Matthew 21:18–22; Mark 11:12–14)" },
  { t = "v", n = 20, p = true, text = "As they were walking back in the morning, they saw the fig tree withered from its roots." },
  { t = "v", n = 21, text = "Peter remembered it and said, “Look, Rabbi! The fig tree You cursed has withered.”" },
  { t = "v", n = 22, p = true, text = "“Have faith in God,” Jesus said to them." },
  { t = "v", n = 23, text = "“Truly I tell you that if anyone says to this mountain, ‘Be lifted up and thrown into the sea,’ and has no doubt in his heart but believes that it will happen, it will be done for him." },
  { t = "v", n = 24, text = "Therefore I tell you, whatever you ask for in prayer, believe that you have received it, and it will be yours." },
  { t = "v", n = 25, p = true, text = "And when you stand to pray, if you hold anything against another, forgive it, so that your Father in heaven will forgive your trespasses as well.[^h]”" },
  { t = "h", level = 2, text = "Jesus’ Authority Challenged" },
  { t = "ref", text = "(Matthew 21:23–27; Luke 20:1–8)" },
  { t = "v", n = 27, p = true, text = "After their return to Jerusalem, Jesus was walking in the temple courts, and the chief priests, scribes, and elders came up to Him." },
  { t = "v", n = 28, text = "“By what authority are You doing these things?” they asked. “And who gave You the authority to do them?”" },
  { t = "v", n = 29, p = true, text = "“I will ask you one question,” Jesus replied, “and if you answer Me, I will tell you by what authority I am doing these things." },
  { t = "v", n = 30, text = "John’s baptism—was it from heaven or from men? Answer Me!”" },
  { t = "v", n = 31, p = true, text = "They deliberated among themselves what they should answer: “If we say, ‘From heaven,’ He will ask, ‘Why then did you not believe him?’" },
  { t = "v", n = 32, text = "But if we say, ‘From men’...” they were afraid of the people, for they all held that John truly was a prophet." },
  { t = "v", n = 33, text = "So they answered, “We do not know.” And Jesus replied, “Neither will I tell you by what authority I am doing these things.”" },
  { t = "note", id = "a", text = "*Hosanna* is a transliteration of the Hebrew *Hosia-na*, meaning *Save, we pray* or *Save now*, which became a shout of praise; see Psalm 118:25." },
  { t = "note", id = "b", text = "Psalm 118:26" },
  { t = "note", id = "c", text = "Or *“Hosanna in the highest heaven!”*See Psalm 118:25 and Psalm 148:1." },
  { t = "note", id = "d", text = "Literally *the temple*; also in verses 15, 16, and 27" },
  { t = "note", id = "e", text = "Isaiah 56:7" },
  { t = "note", id = "f", text = "Jeremiah 7:11" },
  { t = "note", id = "g", text = "Literally *they went*; BYZ and TR *He went*" },
  { t = "note", id = "h", text = "BYZ and TR include *(26) But if you do not forgive, neither will your Father in heaven forgive your trespasses*; see Matthew 6:15." },
]

[[section]]
id = "12"
title = "Mark 12"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Parable of the Wicked Tenants" },
  { t = "ref", text = "(Matthew 21:33–46; Luke 20:9–18)" },
  { t = "v", n = 1, p = true, text = "Then Jesus began to speak to them in parables: “A man planted a vineyard. He put a wall around it, dug a wine vat, and built a watchtower. Then he rented it out to some tenants and went away on a journey." },
  { t = "v", n = 2, p = true, text = "At harvest time, he sent a servant to the tenants to collect his share of the fruit of the vineyard." },
  { t = "v", n = 3, text = "But they seized the servant, beat him, and sent him away empty-handed." },
  { t = "v", n = 4, p = true, text = "Then he sent them another servant, and they struck him over the head and treated him shamefully." },
  { t = "v", n = 5, p = true, text = "He sent still another, and this one they killed. He sent many others; some they beat and others they killed." },
  { t = "v", n = 6, p = true, text = "Finally, having one beloved son, he sent him to them. ‘They will respect my son,’ he said." },
  { t = "v", n = 7, p = true, text = "But the tenants said to one another, ‘This is the heir. Come, let us kill him, and the inheritance will be ours.’" },
  { t = "v", n = 8, text = "So they seized the son, killed him, and threw him out of the vineyard." },
  { t = "v", n = 9, p = true, text = "What then will the owner of the vineyard do? He will come and kill those tenants and give the vineyard to others." },
  { t = "v", n = 10, text = "Have you never read this Scripture: ‘The stone the builders rejected has become the cornerstone." },
  { t = "v", n = 11, indent = 1, text = "This is from the Lord, and it is marvelous in our eyes’[^a]?”" },
  { t = "v", n = 12, p = true, text = "At this, the leaders sought[^b] to arrest Jesus, for they knew that He had spoken this parable against them. But fearing the crowd, they left Him and went away." },
  { t = "h", level = 2, text = "Paying Taxes to Caesar" },
  { t = "ref", text = "(Matthew 22:15–22; Luke 20:19–26)" },
  { t = "v", n = 13, p = true, text = "Later, they sent some of the Pharisees and Herodians to catch Jesus in His words." },
  { t = "v", n = 14, text = "“Teacher,” they said, “we know that You are honest and seek favor from no one. Indeed, You are impartial and teach the way of God in accordance with the truth. Is it lawful to pay taxes to Caesar or not? Should we pay them or not?”" },
  { t = "v", n = 15, p = true, text = "But Jesus saw through their hypocrisy and said, “Why are you testing Me? Bring Me a denarius[^c] to inspect.”" },
  { t = "v", n = 16, text = "So they brought it, and He asked them, “Whose image is this? And whose inscription?” “Caesar’s,” they answered." },
  { t = "v", n = 17, p = true, text = "Then Jesus told them, “Give to Caesar what is Caesar’s, and to God what is God’s.” And they marveled at Him." },
  { t = "h", level = 2, text = "The Sadducees and the Resurrection" },
  { t = "ref", text = "(Matthew 22:23–33; Luke 20:27–40)" },
  { t = "v", n = 18, p = true, text = "Then the Sadducees, who say there is no resurrection, came to Jesus and questioned Him:" },
  { t = "v", n = 19, text = "“Teacher, Moses wrote for us that if a man’s brother dies and leaves a wife but no children, the man is to marry his brother’s widow and raise up offspring for him.[^d]" },
  { t = "v", n = 20, text = "Now there were seven brothers. The first one married and died, leaving no children." },
  { t = "v", n = 21, text = "Then the second one married the widow, but he also died and left no children. And the third did likewise." },
  { t = "v", n = 22, text = "In this way, none of the seven left any children. And last of all, the woman died." },
  { t = "v", n = 23, text = "In the resurrection, then,[^e] whose wife will she be? For all seven were married to her.”" },
  { t = "v", n = 24, p = true, text = "Jesus said to them, “Aren’t you mistaken, because you do not know the Scriptures or the power of God?" },
  { t = "v", n = 25, text = "When the dead rise, they will neither marry nor be given in marriage. Instead, they will be like the angels in heaven." },
  { t = "v", n = 26, p = true, text = "But concerning the dead rising, have you not read about the burning bush in the Book of Moses, how God told him, ‘I am the God of Abraham, the God of Isaac, and the God of Jacob’[^f]?" },
  { t = "v", n = 27, text = "He is not the God of the dead, but of the living. You are badly mistaken!”" },
  { t = "h", level = 2, text = "The Greatest Commandment" },
  { t = "ref", text = "(Deuteronomy 6:1–19; Matthew 22:34–40)" },
  { t = "v", n = 28, p = true, text = "Now one of the scribes had come up and heard their debate. Noticing how well Jesus had answered them, he asked Him, “Which commandment is the most important of all?”" },
  { t = "v", n = 29, p = true, text = "Jesus replied, “This is the most important: ‘Hear, O Israel, the Lord our God, the Lord is One." },
  { t = "v", n = 30, text = "Love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength.’[^g]" },
  { t = "v", n = 31, text = "The second is this: ‘Love your neighbor as yourself.’[^h] No other commandment is greater than these.”" },
  { t = "v", n = 32, p = true, text = "“Right, Teacher,” the scribe replied. “You have stated correctly that God is One and there is no other but Him," },
  { t = "v", n = 33, text = "and to love Him with all your heart and with all your understanding and with all your strength, and to love your neighbor as yourself. This is more important than all burnt offerings and sacrifices.”" },
  { t = "v", n = 34, p = true, text = "When Jesus saw that the man had answered wisely, He said, “You are not far from the kingdom of God.” And no one dared to question Him any further." },
  { t = "h", level = 2, text = "Whose Son Is the Christ?" },
  { t = "ref", text = "(Matthew 22:41–46; Luke 20:41–44)" },
  { t = "v", n = 35, p = true, text = "While Jesus was teaching in the temple courts,[^i] He asked, “How can the scribes say that the Christ is the Son of David?" },
  { t = "v", n = 36, text = "Speaking by the Holy Spirit, David himself declared: ‘The Lord said to my Lord, “Sit at My right hand until I put Your enemies under Your feet.”’[^j]" },
  { t = "v", n = 37, p = true, text = "David himself calls Him ‘Lord.’ So how can He be David’s son?” And the large crowd listened to Him with delight." },
  { t = "h", level = 2, text = "Beware of the Scribes" },
  { t = "ref", text = "(Luke 20:45–47)" },
  { t = "v", n = 38, p = true, text = "In His teaching Jesus also said, “Watch out for the scribes. They like to walk around in long robes, to receive greetings in the marketplaces," },
  { t = "v", n = 39, text = "and to have the chief seats in the synagogues and the places of honor at banquets." },
  { t = "v", n = 40, text = "They defraud widows of their houses,[^k] and for a show make lengthy prayers. These men will receive greater condemnation.”" },
  { t = "h", level = 2, text = "The Widow’s Offering" },
  { t = "ref", text = "(Luke 21:1–4)" },
  { t = "v", n = 41, p = true, text = "As Jesus was sitting opposite the treasury, He watched the crowd putting money into it. And many rich people put in large amounts." },
  { t = "v", n = 42, text = "Then one poor widow came and put in two small copper coins, which amounted to a small fraction of a denarius.[^l]" },
  { t = "v", n = 43, p = true, text = "Jesus called His disciples to Him and said, “Truly I tell you, this poor widow has put more than all the others into the treasury." },
  { t = "v", n = 44, text = "For they all contributed out of their surplus, but she out of her poverty has put in all she had to live on.”" },
  { t = "note", id = "a", text = "Psalm 118:22–23" },
  { t = "note", id = "b", text = "Literally *they sought*" },
  { t = "note", id = "c", text = "A denarius was customarily a day’s wage for a laborer; see Matthew 20:2." },
  { t = "note", id = "d", text = "Deuteronomy 25:5" },
  { t = "note", id = "e", text = "Literally *In the resurrection, when they rise,*" },
  { t = "note", id = "f", text = "Exodus 3:6" },
  { t = "note", id = "g", text = "Deuteronomy 6:4–5" },
  { t = "note", id = "h", text = "Leviticus 19:18" },
  { t = "note", id = "i", text = "Literally *the temple*" },
  { t = "note", id = "j", text = "Psalm 110:1" },
  { t = "note", id = "k", text = "Literally *They devour widows’ houses*" },
  { t = "note", id = "l", text = "Greek *put in two lepta, which is a kodrantēs*; a lepton was a Jewish coin of bronze or copper worth about 1/128 of a denarius." },
]

[[section]]
id = "13"
title = "Mark 13"
level = 1
blocks = [
  { t = "h", level = 2, text = "Temple Destruction and Other Signs" },
  { t = "ref", text = "(Matthew 24:1–8; Luke 21:5–9)" },
  { t = "v", n = 1, p = true, text = "As Jesus was leaving the temple, one of His disciples said to Him, “Teacher, look at the magnificent stones and buildings!”" },
  { t = "v", n = 2, p = true, text = "“Do you see all these great buildings?” Jesus replied. “Not one stone here will be left on another; every one will be thrown down.”" },
  { t = "v", n = 3, p = true, text = "While Jesus was sitting on the Mount of Olives opposite the temple, Peter, James, John, and Andrew asked Him privately," },
  { t = "v", n = 4, text = "“Tell us, when will these things happen? And what will be the sign that they are about to be fulfilled?”" },
  { t = "v", n = 5, p = true, text = "Jesus began by telling them, “See to it that no one deceives you." },
  { t = "v", n = 6, text = "Many will come in My name, claiming, ‘I am He,’ and will deceive many." },
  { t = "v", n = 7, text = "When you hear of wars and rumors of wars, do not be alarmed. These things must happen, but the end is still to come." },
  { t = "v", n = 8, text = "Nation will rise against nation, and kingdom against kingdom. There will be earthquakes in various places, as well as famines. These are the beginning of birth pains." },
  { t = "h", level = 2, text = "Witnessing to All Nations" },
  { t = "ref", text = "(Matthew 24:9–14; Luke 21:10–19)" },
  { t = "v", n = 9, p = true, text = "So be on your guard. You will be delivered over to the councils and beaten in the synagogues. On My account you will stand before governors and kings as witnesses to them." },
  { t = "v", n = 10, text = "And the gospel must first be proclaimed to all the nations." },
  { t = "v", n = 11, text = "But when they arrest you and hand you over, do not worry beforehand what to say. Instead, speak whatever you are given at that time, for it will not be you speaking, but the Holy Spirit." },
  { t = "v", n = 12, p = true, text = "Brother will betray brother to death, and a father his child. Children will rise against their parents and have them put to death." },
  { t = "v", n = 13, text = "You will be hated by everyone because of My name, but the one who perseveres to the end will be saved." },
  { t = "h", level = 2, text = "The Abomination of Desolation" },
  { t = "ref", text = "(Matthew 24:15–25; Luke 21:20–24)" },
  { t = "v", n = 14, p = true, text = "So when you see the abomination of desolation[^a] standing where it should not be[^b] (let the reader understand), then let those who are in Judea flee to the mountains." },
  { t = "v", n = 15, text = "Let no one on the housetop go back inside to retrieve anything from his house." },
  { t = "v", n = 16, text = "And let no one in the field return for his cloak." },
  { t = "v", n = 17, p = true, text = "How miserable those days will be for pregnant and nursing mothers!" },
  { t = "v", n = 18, text = "Pray that this will not occur in the winter." },
  { t = "v", n = 19, text = "For those will be days of tribulation unseen from the beginning of God’s creation until now, and never to be seen again." },
  { t = "v", n = 20, text = "If the Lord had not cut short those days, nobody would be saved. But for the sake of the elect, whom He has chosen, He has cut them short." },
  { t = "v", n = 21, p = true, text = "At that time if anyone says to you, ‘Look, here is the Christ!’ or ‘There He is!’ do not believe it." },
  { t = "v", n = 22, text = "For false Christs and false prophets will appear and perform signs and wonders to deceive even the elect, if that were possible." },
  { t = "v", n = 23, text = "So be on your guard; I have told you everything in advance." },
  { t = "h", level = 2, text = "The Return of the Son of Man" },
  { t = "ref", text = "(Matthew 24:26–31; Luke 21:25–28)" },
  { t = "v", n = 24, p = true, text = "But in those days, after that tribulation: ‘The sun will be darkened, and the moon will not give its light;" },
  { t = "v", n = 25, indent = 1, text = "the stars will fall from the sky, and the powers of the heavens will be shaken.’[^c]" },
  { t = "v", n = 26, p = true, text = "At that time they will see the Son of Man coming in the clouds with great power and glory.[^d]" },
  { t = "v", n = 27, text = "And He will send out the angels to gather His elect from the four winds, from the ends of the earth to the ends of heaven." },
  { t = "h", level = 2, text = "The Lesson of the Fig Tree" },
  { t = "ref", text = "(Matthew 24:32–35; Luke 21:29–33)" },
  { t = "v", n = 28, p = true, text = "Now learn this lesson[^e] from the fig tree: As soon as its branches become tender and sprout leaves, you know that summer is near." },
  { t = "v", n = 29, text = "So also, when you see these things happening, know that He is near,[^f] right at the door." },
  { t = "v", n = 30, text = "Truly I tell you, this generation will not pass away until all these things have happened." },
  { t = "v", n = 31, text = "Heaven and earth will pass away, but My words will never pass away." },
  { t = "h", level = 2, text = "Readiness at Any Hour" },
  { t = "ref", text = "(Matthew 24:36–51; Luke 12:35–48)" },
  { t = "v", n = 32, p = true, text = "No one knows about that day or hour, not even the angels in heaven, nor the Son, but only the Father." },
  { t = "v", n = 33, text = "Be on your guard and stay alert![^g] For you do not know when the appointed time will come." },
  { t = "v", n = 34, p = true, text = "It is like a man going on a journey who left his house, put each servant in charge of his own task, and instructed the doorkeeper to keep watch." },
  { t = "v", n = 35, text = "Therefore keep watch, because you do not know when the master of the house will return—whether in the evening, at midnight, when the rooster crows, or in the morning." },
  { t = "v", n = 36, text = "Otherwise, he may arrive without notice and find you sleeping." },
  { t = "v", n = 37, text = "And what I say to you, I say to everyone: Keep watch!”" },
  { t = "note", id = "a", text = "See Daniel 9:27, Daniel 11:31, and Daniel 12:11; BYZ and TR include *spoken of by Daniel the prophet*." },
  { t = "note", id = "b", text = "Or *where he should not be*" },
  { t = "note", id = "c", text = "Or *and the celestial bodies will be shaken*; see Isaiah 13:10, Isaiah 34:4, and Joel 2:10." },
  { t = "note", id = "d", text = "See Daniel 7:13–14." },
  { t = "note", id = "e", text = "Or *this parable*" },
  { t = "note", id = "f", text = "Or *it is near*" },
  { t = "note", id = "g", text = "BYZ and TR *Be on your guard, stay alert, and pray!*" },
]

[[section]]
id = "14"
title = "Mark 14"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Plot to Kill Jesus" },
  { t = "ref", text = "(Matthew 26:1–5; Luke 22:1–2; John 11:45–57)" },
  { t = "v", n = 1, p = true, text = "Now the Passover and the Feast of Unleavened Bread[^a] were two days away, and the chief priests and scribes were looking for a covert way to arrest Jesus and kill Him." },
  { t = "v", n = 2, text = "“But not during the feast,” they said, “or there may be a riot among the people.”" },
  { t = "h", level = 2, text = "Jesus Anointed at Bethany" },
  { t = "ref", text = "(Matthew 26:6–13; Luke 7:36–50; John 12:1–8)" },
  { t = "v", n = 3, p = true, text = "While Jesus was in Bethany reclining at the table in the home of Simon the Leper,[^b] a woman came with an alabaster jar of expensive perfume, made of pure nard. She broke open the jar and poured it on Jesus’ head." },
  { t = "v", n = 4, p = true, text = "Some of those present, however, expressed their indignation to one another: “Why this waste of perfume?" },
  { t = "v", n = 5, text = "It could have been sold for over three hundred denarii[^c] and the money given to the poor.” And they scolded her." },
  { t = "v", n = 6, p = true, text = "But Jesus said, “Leave her alone; why are you bothering her? She has done a beautiful deed to Me." },
  { t = "v", n = 7, text = "The poor you will always have with you,[^d] and you can help them whenever you want. But you will not always have Me." },
  { t = "v", n = 8, text = "She has done what she could to anoint My body in advance of My burial." },
  { t = "v", n = 9, text = "And truly I tell you, wherever the gospel is preached in all the world, what she has done will also be told in memory of her.”" },
  { t = "h", level = 2, text = "Judas Agrees to Betray Jesus" },
  { t = "ref", text = "(Matthew 26:14–16; Luke 22:3–6)" },
  { t = "v", n = 10, p = true, text = "Then Judas Iscariot, one of the Twelve, went to the chief priests to betray Jesus to them." },
  { t = "v", n = 11, text = "They were delighted to hear this, and they promised to give him money. So Judas began to look for an opportunity to betray Jesus." },
  { t = "h", level = 2, text = "Preparing the Passover" },
  { t = "ref", text = "(Matthew 26:17–19; Luke 22:7–13)" },
  { t = "v", n = 12, p = true, text = "On the first day of the Feast of Unleavened Bread,[^e] when the Passover lamb was to be sacrificed, Jesus’ disciples asked Him, “Where do You want us to prepare for You to eat the Passover?”" },
  { t = "v", n = 13, p = true, text = "So He sent two of His disciples and told them, “Go into the city, and a man carrying a jug of water will meet you. Follow him," },
  { t = "v", n = 14, text = "and whichever house he enters, say to the owner, ‘The Teacher asks: Where is My guest room, where I may eat the Passover with My disciples?’" },
  { t = "v", n = 15, text = "And he will show you a large upper room, furnished and ready. Make preparations for us there.”" },
  { t = "v", n = 16, p = true, text = "So the disciples left and went into the city, where they found everything as Jesus had described. And they prepared the Passover." },
  { t = "h", level = 2, text = "The Last Supper" },
  { t = "ref", text = "(Matthew 26:20–30; Luke 22:14–23; 1 Corinthians 11:17–34)" },
  { t = "v", n = 17, p = true, text = "When evening came, Jesus arrived with the Twelve." },
  { t = "v", n = 18, text = "And while they were reclining and eating, Jesus said, “Truly I tell you, one of you who is eating with Me will betray Me.”" },
  { t = "v", n = 19, p = true, text = "They began to be grieved and to ask Him one after another, “Surely not I?”" },
  { t = "v", n = 20, p = true, text = "He answered, “It is one of the Twelve—the one who is dipping his hand[^f] into the bowl with Me." },
  { t = "v", n = 21, text = "The Son of Man will go just as it is written about Him, but woe to that man by whom He is betrayed! It would be better for him if he had not been born.”" },
  { t = "v", n = 22, p = true, text = "While they were eating, Jesus took bread, spoke a blessing and broke it, and gave it to the disciples, saying, “Take it; this is My body.”" },
  { t = "v", n = 23, p = true, text = "Then He took the cup, gave thanks, and gave it to them, and they all drank from it." },
  { t = "v", n = 24, text = "He said to them, “This is My blood of the covenant,[^g] which is poured out for many." },
  { t = "v", n = 25, text = "Truly I tell you, I will no longer drink of the fruit of the vine until that day when I drink it anew in the kingdom of God.”" },
  { t = "v", n = 26, p = true, text = "And when they had sung a hymn, they went out to the Mount of Olives." },
  { t = "h", level = 2, text = "Jesus Predicts Peter’s Denial" },
  { t = "ref", text = "(Zechariah 13:7–9; Matthew 26:31–35; Luke 22:31–38; John 13:36–38)" },
  { t = "v", n = 27, p = true, text = "Then Jesus said to them, “You will all fall away,[^h] for it is written: ‘I will strike the Shepherd, and the sheep will be scattered.’[^i]" },
  { t = "v", n = 28, p = true, text = "But after I have risen, I will go ahead of you into Galilee.”" },
  { t = "v", n = 29, p = true, text = "Peter declared, “Even if all fall away, I never will.”" },
  { t = "v", n = 30, p = true, text = "“Truly I tell you,” Jesus replied, “this very night, before the rooster crows twice, you will deny Me three times.”" },
  { t = "v", n = 31, p = true, text = "But Peter kept insisting, “Even if I have to die with You, I will never deny You.” And all the others said the same thing." },
  { t = "h", level = 2, text = "Jesus Prays at Gethsemane" },
  { t = "ref", text = "(Matthew 26:36–46; Luke 22:39–46)" },
  { t = "v", n = 32, p = true, text = "Then they came to a place called Gethsemane, and Jesus told His disciples, “Sit here while I pray.”" },
  { t = "v", n = 33, p = true, text = "He took with Him Peter, James, and John, and began to be deeply troubled and distressed." },
  { t = "v", n = 34, text = "Then He said to them, “My soul is consumed with sorrow to the point of death. Stay here and keep watch.”" },
  { t = "v", n = 35, p = true, text = "Going a little farther, He fell to the ground and prayed that, if it were possible, the hour would pass from Him." },
  { t = "v", n = 36, text = "“Abba, Father,” He said, “all things are possible for You. Take this cup from Me. Yet not what I will, but what You will.”" },
  { t = "v", n = 37, p = true, text = "Then Jesus returned and found them sleeping. “Simon, are you asleep?” He asked. “Were you not able to keep watch for one hour?" },
  { t = "v", n = 38, text = "Watch and pray so that you will not enter into temptation. For the spirit is willing, but the body is weak.”" },
  { t = "v", n = 39, p = true, text = "Again He went away and prayed, saying the same thing." },
  { t = "v", n = 40, text = "And again Jesus returned and found them sleeping, for their eyes were heavy. And they did not know what to answer Him." },
  { t = "v", n = 41, p = true, text = "When Jesus returned the third time, He said, “Are you still sleeping and resting? That is enough! The hour has come. Look, the Son of Man is betrayed into the hands of sinners." },
  { t = "v", n = 42, text = "Rise, let us go. See, My betrayer is approaching!”" },
  { t = "h", level = 2, text = "The Betrayal of Jesus" },
  { t = "ref", text = "(Matthew 26:47–56; Luke 22:47–53; John 18:1–14)" },
  { t = "v", n = 43, p = true, text = "While Jesus was still speaking, Judas, one of the Twelve, arrived, accompanied by a crowd armed with swords and clubs, sent from the chief priests, scribes, and elders." },
  { t = "v", n = 44, p = true, text = "Now the betrayer had arranged a signal with them: “The One I kiss is the man; arrest Him and lead Him away securely.”" },
  { t = "v", n = 45, text = "Going directly to Jesus, he said, “Rabbi!” and kissed Him." },
  { t = "v", n = 46, p = true, text = "Then the men seized Jesus and arrested Him." },
  { t = "v", n = 47, text = "And one of the bystanders drew his sword and struck the servant of the high priest, cutting off his ear." },
  { t = "v", n = 48, p = true, text = "Jesus asked the crowd, “Have you come out with swords and clubs to arrest Me as you would an outlaw?" },
  { t = "v", n = 49, text = "Every day I was with you, teaching in the temple courts,[^j] and you did not arrest Me. But this has happened that the Scriptures would be fulfilled.”" },
  { t = "v", n = 50, p = true, text = "Then everyone deserted Him and fled." },
  { t = "v", n = 51, text = "One young man who had been following Jesus was wearing a linen cloth around his body. They caught hold of him," },
  { t = "v", n = 52, text = "but he pulled free of the linen cloth and ran away naked." },
  { t = "h", level = 2, text = "Jesus before the Sanhedrin" },
  { t = "ref", text = "(Matthew 26:57–68; Luke 22:66–71; John 18:19–24)" },
  { t = "v", n = 53, p = true, text = "They led Jesus away to the high priest, and all the chief priests, elders, and scribes assembled." },
  { t = "v", n = 54, text = "Peter followed Him at a distance, right into the courtyard of the high priest. And he sat with the officers and warmed himself by the fire." },
  { t = "v", n = 55, p = true, text = "Now the chief priests and the whole Sanhedrin[^k] were seeking testimony against Jesus to put Him to death, but they did not find any." },
  { t = "v", n = 56, text = "For many bore false witness against Jesus, but their testimony was inconsistent." },
  { t = "v", n = 57, p = true, text = "Then some men stood up and testified falsely against Him:" },
  { t = "v", n = 58, text = "“We heard Him say, ‘I will destroy this man-made temple, and in three days I will build another that is made without hands.’”" },
  { t = "v", n = 59, text = "But even their testimony was inconsistent." },
  { t = "v", n = 60, p = true, text = "So the high priest stood up before them and questioned Jesus, “Have You no answer? What are these men testifying against You?”" },
  { t = "v", n = 61, p = true, text = "But Jesus remained silent and made no reply. Again the high priest questioned Him, “Are You the Christ, the Son of the Blessed One?”" },
  { t = "v", n = 62, p = true, text = "“I am,” said Jesus, “and you will see the Son of Man sitting at the right hand of Power[^l] and coming with the clouds of heaven.”[^m]" },
  { t = "v", n = 63, p = true, text = "At this, the high priest tore his clothes and declared, “Why do we need any more witnesses?" },
  { t = "v", n = 64, text = "You have heard the blasphemy. What is your verdict?” And they all condemned Him as deserving of death." },
  { t = "v", n = 65, p = true, text = "Then some of them began to spit on Him. They blindfolded Him, struck Him with their fists, and said to Him, “Prophesy!” And the officers received Him with slaps in His face." },
  { t = "h", level = 2, text = "Peter Denies Jesus" },
  { t = "ref", text = "(Matthew 26:69–75; Luke 22:54–62; John 18:15–18)" },
  { t = "v", n = 66, p = true, text = "While Peter was in the courtyard below, one of the servant girls of the high priest came down" },
  { t = "v", n = 67, text = "and saw him warming himself there. She looked at Peter and said, “You also were with Jesus the Nazarene.”" },
  { t = "v", n = 68, p = true, text = "But he denied it. “I do not know or even understand what you are talking about,” he said. Then he went out to the gateway, and the rooster crowed.[^n]" },
  { t = "v", n = 69, p = true, text = "There the servant girl saw him and again said to those standing nearby, “This man is one of them.”" },
  { t = "v", n = 70, p = true, text = "But he denied it again. After a little while, those standing nearby said once more to Peter, “Surely you are one of them, for you too are a Galilean.”[^o]" },
  { t = "v", n = 71, p = true, text = "But he began to curse and swear, “I do not know this man of whom you speak!”" },
  { t = "v", n = 72, text = "And immediately the rooster crowed a second time. Then Peter remembered the word that Jesus had spoken to him: “Before the rooster crows twice, you will deny Me three times.” And he broke down and wept." },
  { t = "note", id = "a", text = "Literally *and the Unleavened*; see Exodus 12:14–20." },
  { t = "note", id = "b", text = "Aramaic *Simon the Potter* or *Simon the Jar Maker*" },
  { t = "note", id = "c", text = "A denarius was customarily a day’s wage for a laborer; see Matthew 20:2." },
  { t = "note", id = "d", text = "See Deuteronomy 15:11." },
  { t = "note", id = "e", text = "Literally *On the first day of the Unleavened*; see Exodus 12:14–20." },
  { t = "note", id = "f", text = "Literally *the one who is dipping*" },
  { t = "note", id = "g", text = "BYZ and TR *the new covenant*" },
  { t = "note", id = "h", text = "BYZ and TR include *on account of Me this night*; see Matthew 26:31." },
  { t = "note", id = "i", text = "Zechariah 13:7" },
  { t = "note", id = "j", text = "Literally *the temple*" },
  { t = "note", id = "k", text = "Or *the whole Council*" },
  { t = "note", id = "l", text = "Or *the right hand of the Mighty One*" },
  { t = "note", id = "m", text = "See Psalm 110:1 and Daniel 7:13." },
  { t = "note", id = "n", text = "NE and WH do not include *and the rooster crowed*." },
  { t = "note", id = "o", text = "BYZ and TR include *and your speech is similar*." },
]

[[section]]
id = "15"
title = "Mark 15"
level = 1
blocks = [
  { t = "h", level = 2, text = "Jesus Delivered to Pilate" },
  { t = "ref", text = "(Matthew 27:1–2)" },
  { t = "v", n = 1, p = true, text = "Early in the morning, the chief priests, elders, scribes, and the whole Sanhedrin[^a] devised a plan. They bound Jesus, led Him away, and handed Him over to Pilate." },
  { t = "v", n = 2, p = true, text = "So Pilate questioned Him, “Are You the King of the Jews?” “You have said so,” Jesus replied." },
  { t = "v", n = 3, p = true, text = "And the chief priests began to accuse Him of many things." },
  { t = "v", n = 4, p = true, text = "Then Pilate questioned Him again, “Have You no answer? Look how many charges they are bringing against You!”" },
  { t = "v", n = 5, p = true, text = "But to Pilate’s amazement, Jesus made no further reply." },
  { t = "h", level = 2, text = "The Crowd Chooses Barabbas" },
  { t = "ref", text = "(Matthew 27:15–23; Luke 23:13–25)" },
  { t = "v", n = 6, p = true, text = "Now it was Pilate’s custom at the feast to release to the people[^b] a prisoner of their choosing." },
  { t = "v", n = 7, text = "And a man named Barabbas was imprisoned with the rebels who had committed murder during the insurrection." },
  { t = "v", n = 8, text = "So the crowd went up and began asking Pilate to keep his custom." },
  { t = "v", n = 9, p = true, text = "“Do you want me to release to you the King of the Jews?” Pilate asked." },
  { t = "v", n = 10, text = "For he knew it was out of envy that the chief priests had handed Jesus over." },
  { t = "v", n = 11, p = true, text = "But the chief priests stirred up the crowd to have him release Barabbas to them instead." },
  { t = "h", level = 2, text = "Pilate Delivers Up Jesus" },
  { t = "ref", text = "(Matthew 27:24–26)" },
  { t = "v", n = 12, p = true, text = "So Pilate asked them again, “What then do you want me to do with the One you call the King of the Jews?”" },
  { t = "v", n = 13, p = true, text = "And they shouted back, “Crucify Him!”" },
  { t = "v", n = 14, p = true, text = "“Why?” asked Pilate. “What evil has He done?” But they shouted all the louder, “Crucify Him!”" },
  { t = "v", n = 15, p = true, text = "And wishing to satisfy the crowd, Pilate released Barabbas to them. But he had Jesus flogged, and handed Him over to be crucified." },
  { t = "h", level = 2, text = "The Soldiers Mock Jesus" },
  { t = "ref", text = "(Isaiah 50:4–11; Matthew 27:27–31; Luke 22:63–65; John 19:1–15)" },
  { t = "v", n = 16, p = true, text = "Then the soldiers led Jesus away into the palace (that is, the Praetorium) and called the whole company together." },
  { t = "v", n = 17, text = "They dressed Him in a purple robe, twisted together a crown of thorns, and set it on His head." },
  { t = "v", n = 18, text = "And they began to salute Him: “Hail, King of the Jews!”" },
  { t = "v", n = 19, p = true, text = "They kept striking His head with a staff and spitting on Him. And they knelt down and bowed before Him." },
  { t = "v", n = 20, text = "After they had mocked Him, they removed the purple robe and put His own clothes back on Him. Then they led Him out to crucify Him." },
  { t = "h", level = 2, text = "The Crucifixion" },
  { t = "ref", text = "(Psalm 22:1–31; Matthew 27:32–44; Luke 23:26–43; John 19:16–27)" },
  { t = "v", n = 21, p = true, text = "Now Simon of Cyrene, the father of Alexander and Rufus, was passing by on his way in from the country, and the soldiers forced him to carry the cross of Jesus." },
  { t = "v", n = 22, p = true, text = "They brought Jesus to a place called Golgotha, which means The Place of the Skull." },
  { t = "v", n = 23, text = "There they offered Him wine mixed with myrrh, but He did not take it." },
  { t = "v", n = 24, p = true, text = "And they crucified Him. They also divided His garments by casting lots to decide what each of them would take.[^c]" },
  { t = "v", n = 25, p = true, text = "It was the third hour[^d] when they crucified Him." },
  { t = "v", n = 26, text = "And the charge inscribed against Him read: THE KING OF THE JEWS." },
  { t = "v", n = 27, p = true, text = "Along with Jesus, they crucified two robbers,[^e] one on His right and one on His left.[^f]" },
  { t = "v", n = 29, p = true, text = "And those who passed by heaped abuse on Him, shaking their heads and saying, “Aha! You who are going to destroy the temple and rebuild it in three days," },
  { t = "v", n = 30, text = "come down from the cross and save Yourself!”" },
  { t = "v", n = 31, p = true, text = "In the same way, the chief priests and scribes mocked Him among themselves, saying, “He saved others, but He cannot save Himself!" },
  { t = "v", n = 32, text = "Let the Christ, the King of Israel, come down now from the cross, so that we may see and believe!” And even those who were crucified with Him berated Him." },
  { t = "h", level = 2, text = "The Death of Jesus" },
  { t = "ref", text = "(Psalm 22:1–31; Matthew 27:45–56; Luke 23:44–49; John 19:28–30)" },
  { t = "v", n = 33, p = true, text = "From the sixth hour until the ninth hour[^g] darkness came over all the land." },
  { t = "v", n = 34, text = "At the ninth hour, Jesus cried out in a loud voice, “Eloi, Eloi, lema sabachthani?” which means, “My God, My God, why have You forsaken Me?”[^h]" },
  { t = "v", n = 35, p = true, text = "When some of those standing nearby heard this, they said, “Behold, He is calling Elijah.”" },
  { t = "v", n = 36, p = true, text = "And someone ran and filled a sponge with sour wine.[^i] He put it on a reed and held it up for Jesus to drink,[^j] saying, “Leave Him alone. Let us see if Elijah comes to take Him down.”" },
  { t = "v", n = 37, p = true, text = "But Jesus let out a loud cry and breathed His last." },
  { t = "v", n = 38, text = "And the veil of the temple was torn in two from top to bottom." },
  { t = "v", n = 39, p = true, text = "When the centurion standing there in front of Jesus saw how He had breathed His last,[^k] he said, “Truly this man was the Son of God!”" },
  { t = "v", n = 40, p = true, text = "And there were also women watching from a distance. Among them were Mary Magdalene, Mary the mother of James the younger and of Joses,[^l] and Salome." },
  { t = "v", n = 41, text = "These women had followed Jesus and ministered to Him while He was in Galilee, and there were many other women who had come up to Jerusalem with Him." },
  { t = "h", level = 2, text = "The Burial of Jesus" },
  { t = "ref", text = "(Isaiah 53:9–12; Matthew 27:57–61; Luke 23:50–56; John 19:38–42)" },
  { t = "v", n = 42, p = true, text = "Now it was already evening. Since it was Preparation Day (that is, the day before the Sabbath)," },
  { t = "v", n = 43, text = "Joseph of Arimathea, a prominent Council member who himself was waiting for the kingdom of God, boldly went to Pilate to ask for the body of Jesus." },
  { t = "v", n = 44, p = true, text = "Pilate was surprised to hear that Jesus was already dead, so he summoned the centurion to ask if this was so." },
  { t = "v", n = 45, text = "When Pilate had confirmed it with the centurion, he granted the body to Joseph." },
  { t = "v", n = 46, p = true, text = "So Joseph bought a linen cloth, took down the body of Jesus, wrapped it in the cloth, and placed it in a tomb that had been cut out of the rock. Then he rolled a stone against the entrance to the tomb." },
  { t = "v", n = 47, text = "Mary Magdalene and Mary the mother of Joseph[^m] saw where His body was placed." },
  { t = "note", id = "a", text = "Or *the whole Council*" },
  { t = "note", id = "b", text = "Literally *Now at the feast he would release to them*" },
  { t = "note", id = "c", text = "See Psalm 22:18." },
  { t = "note", id = "d", text = "That is, nine in the morning" },
  { t = "note", id = "e", text = "Or *insurrectionists*" },
  { t = "note", id = "f", text = "BYZ and TR include *(28) So the Scripture was fulfilled that says, “And He was numbered with the transgressors.”*See Isaiah 53:12 and Luke 22:37." },
  { t = "note", id = "g", text = "That is, from noon until three in the afternoon" },
  { t = "note", id = "h", text = "Psalm 22:1" },
  { t = "note", id = "i", text = "Or *a sponge with wine vinegar*" },
  { t = "note", id = "j", text = "See Psalm 69:21." },
  { t = "note", id = "k", text = "BYZ and TR *saw how, having cried out, He had breathed His last*" },
  { t = "note", id = "l", text = "*Joses* is a variant of *Joseph*; see Matthew 27:56." },
  { t = "note", id = "m", text = "Or *Joses*" },
]

[[section]]
id = "16"
title = "Mark 16"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Resurrection" },
  { t = "ref", text = "(Matthew 28:1–10; Luke 24:1–12; John 20:1–9)" },
  { t = "v", n = 1, p = true, text = "When the Sabbath was over, Mary Magdalene, Mary the mother of James, and Salome bought spices so they could go and anoint the body of Jesus." },
  { t = "v", n = 2, text = "Very early on the first day of the week,[^a] just after sunrise, they went to the tomb." },
  { t = "v", n = 3, text = "They were asking one another, “Who will roll away the stone from the entrance of the tomb?”" },
  { t = "v", n = 4, text = "But when they looked up, they saw that the stone had been rolled away, even though it was extremely large." },
  { t = "v", n = 5, p = true, text = "When they entered the tomb, they saw a young man dressed in a white robe sitting on the right side, and they were alarmed." },
  { t = "v", n = 6, text = "But he said to them, “Do not be alarmed. You are looking for Jesus the Nazarene, who was crucified. He has risen! He is not here! See the place where they put Him." },
  { t = "v", n = 7, text = "But go, tell His disciples and Peter, ‘He is going ahead of you into Galilee. There you will see Him, just as He told you.’”" },
  { t = "v", n = 8, p = true, text = "So the women left the tomb and ran away, trembling and bewildered. And in their fear they did not say a word to anyone.[^b]" },
  { t = "h", level = 2, text = "Jesus Appears to Mary Magdalene" },
  { t = "ref", text = "(John 20:10–18)" },
  { t = "v", n = 9, p = true, text = "Early on the first day of the week, after Jesus had risen,[^c] He appeared first to Mary Magdalene, from whom He had driven out seven demons." },
  { t = "v", n = 10, text = "She went and told those who had been with Him, who were mourning and weeping." },
  { t = "v", n = 11, text = "And when they heard that Jesus was alive and she had seen Him, they did not believe it." },
  { t = "h", level = 2, text = "Jesus Appears to Two Disciples" },
  { t = "ref", text = "(Luke 24:13–35)" },
  { t = "v", n = 12, p = true, text = "After this, Jesus appeared in a different form to two of them as they walked along in the country." },
  { t = "v", n = 13, p = true, text = "And they went back and reported it to the rest, but they did not believe them either." },
  { t = "h", level = 2, text = "The Great Commission" },
  { t = "ref", text = "(Matthew 28:16–20)" },
  { t = "v", n = 14, p = true, text = "Later, as they were eating, Jesus appeared to the Eleven and rebuked them for their unbelief and hardness of heart, because they did not believe those who had seen Him after He had risen." },
  { t = "v", n = 15, p = true, text = "And He said to them, “Go into all the world and preach the gospel to every creature." },
  { t = "v", n = 16, text = "Whoever believes and is baptized will be saved, but whoever does not believe will be condemned." },
  { t = "v", n = 17, text = "And these signs will accompany those who believe: In My name they will drive out demons; they will speak in new tongues;[^d]" },
  { t = "v", n = 18, text = "they will pick up snakes with their hands, and if they drink any deadly poison, it will not harm them; they will lay their hands on the sick, and they will be made well.”" },
  { t = "h", level = 2, text = "The Ascension" },
  { t = "ref", text = "(Luke 24:50–53; Acts 1:6–11)" },
  { t = "v", n = 19, p = true, text = "After the Lord Jesus[^e] had spoken to them, He was taken up into heaven and sat down at the right hand of God." },
  { t = "v", n = 20, p = true, text = "And they went out and preached everywhere, and the Lord worked through them, confirming His word by the signs that accompanied it." },
  { t = "note", id = "a", text = "Literally *And very early on the first of the Sabbaths,*" },

[[section]]
id = "1"
title = "Titus 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "Paul’s Greeting to Titus" },
  { t = "ref", text = "(2 Corinthians 8:16–24)" },
  { t = "v", n = 1, p = true, text = "Paul, a servant of God and an apostle of Jesus Christ for the faith of God’s elect and their knowledge of the truth that leads to godliness," },
  { t = "v", n = 2, text = "in the hope of eternal life, which God, who cannot lie, promised before time began.[^a]" },
  { t = "v", n = 3, text = "In His own time He has made His word evident in the proclamation entrusted to me by the command of God our Savior." },
  { t = "v", n = 4, p = true, text = "To Titus, my true child in our common faith: Grace and peace from God the Father and Christ Jesus our Savior." },
  { t = "h", level = 2, text = "Appointing Elders on Crete" },
  { t = "ref", text = "(1 Timothy 3:1–7; 1 Peter 5:1–4)" },
  { t = "v", n = 5, p = true, text = "The reason I left you in Crete was that you would set in order what was unfinished and appoint elders in every town, as I directed you." },
  { t = "v", n = 6, text = "An elder must be blameless, the husband of but one wife,[^b] having children who are believers and who are not open to accusation of indiscretion or insubordination." },
  { t = "v", n = 7, p = true, text = "As God’s steward, an overseer must be above reproach—not self-willed, not quick-tempered, not given to drunkenness, not violent, not greedy for money." },
  { t = "v", n = 8, text = "Instead, he must be hospitable, a lover of good, self-controlled, upright, holy, and disciplined." },
  { t = "v", n = 9, text = "He must hold firmly to the faithful word as it was taught, so that he can encourage others by sound teaching and refute those who contradict it." },
  { t = "h", level = 2, text = "Correcting False Teachers" },
  { t = "ref", text = "(1 Timothy 1:3–11)" },
  { t = "v", n = 10, p = true, text = "For many are rebellious and full of empty talk and deception, especially those of the circumcision," },
  { t = "v", n = 11, text = "who must be silenced. For the sake of dishonorable gain, they undermine entire households and teach things they should not." },
  { t = "v", n = 12, text = "As one of their own prophets has said, “Cretans are always liars, evil beasts, lazy gluttons.”[^c]" },
  { t = "v", n = 13, p = true, text = "This testimony is true. Therefore rebuke them sternly, so that they will be sound in the faith" },
  { t = "v", n = 14, text = "and will pay no attention to Jewish myths or to the commands of men who have rejected the truth." },
  { t = "v", n = 15, p = true, text = "To the pure, all things are pure; but to the defiled and unbelieving, nothing is pure. Indeed, both their minds and their consciences are defiled." },
  { t = "v", n = 16, text = "They profess to know God, but by their actions they deny Him. They are detestable, disobedient, and unfit for any good deed." },
  { t = "note", id = "a", text = "Literally *before times eternal*" },
  { t = "note", id = "b", text = "Or *faithful to his wife*" },
  { t = "note", id = "c", text = "This quote, also known as the Epimenides paradox, has been attributed to the Cretan philosopher Epimenides of Knossos." },
]

[[section]]
id = "2"
title = "Titus 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "Teaching Sound Doctrine" },
  { t = "v", n = 1, p = true, text = "But as for you, speak the things that are consistent with sound doctrine." },
  { t = "v", n = 2, p = true, text = "Older men are to be temperate, dignified, self-controlled, and sound in faith, love, and perseverance." },
  { t = "v", n = 3, p = true, text = "Older women, likewise, are to be reverent in their behavior, not slanderers or addicted to much wine, but teachers of good." },
  { t = "v", n = 4, text = "In this way they can train the young women to love their husbands and children," },
  { t = "v", n = 5, text = "to be self-controlled, pure, managers of their households, kind, and submissive to their own husbands, so that the word of God will not be discredited." },
  { t = "v", n = 6, p = true, text = "In the same way, urge the younger men to be self-controlled." },
  { t = "v", n = 7, p = true, text = "In everything, show yourself to be an example by doing good works. In your teaching show integrity, dignity," },
  { t = "v", n = 8, text = "and wholesome speech that is above reproach, so that anyone who opposes us will be ashamed, having nothing bad to say about us." },
  { t = "v", n = 9, p = true, text = "Slaves are to submit to their own masters in everything, to be well-pleasing, not argumentative," },
  { t = "v", n = 10, text = "not stealing from them, but showing all good faith, so that in every respect they will adorn the teaching about God our Savior." },
  { t = "h", level = 2, text = "God’s Grace Brings Salvation" },
  { t = "v", n = 11, p = true, text = "For the grace of God has appeared, bringing salvation to everyone." },
  { t = "v", n = 12, text = "It instructs us to renounce ungodliness and worldly passions, and to live sensible, upright, and godly lives in the present age," },
  { t = "v", n = 13, text = "as we await the blessed hope and glorious appearance of our great God and Savior Jesus Christ." },
  { t = "v", n = 14, text = "He gave Himself for us to redeem us from all lawlessness and to purify for Himself a people for His own possession, zealous for good deeds." },
  { t = "v", n = 15, p = true, text = "Speak these things as you encourage and rebuke with all authority. Let no one despise you." },
]

[[section]]
id = "3"
title = "Titus 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "Heirs of Grace" },
  { t = "v", n = 1, p = true, text = "Remind the believers to submit to rulers and authorities, to be obedient and ready for every good work," },
  { t = "v", n = 2, text = "to malign no one, and to be peaceable and gentle, showing full consideration to everyone." },
  { t = "v", n = 3, p = true, text = "For at one time we too were foolish, disobedient, misled, and enslaved to all sorts of desires and pleasures—living in malice and envy, being hated and hating one another." },
  { t = "v", n = 4, p = true, text = "But when the kindness of God our Savior and His love for mankind appeared," },
  { t = "v", n = 5, text = "He saved us, not by the righteous deeds we had done, but according to His mercy, through the washing of new birth[^a] and renewal by the Holy Spirit." },
  { t = "v", n = 6, text = "This is the Spirit He poured out on us abundantly through Jesus Christ our Savior," },
  { t = "v", n = 7, text = "so that, having been justified by His grace, we would become heirs with the hope of eternal life." },
  { t = "v", n = 8, text = "This saying is trustworthy. And I want you to emphasize these things, so that those who have believed God will take care to devote themselves to good deeds. These things are excellent and profitable for the people." },
  { t = "h", level = 2, text = "Avoid Divisions" },
  { t = "ref", text = "(Romans 16:17–20)" },
  { t = "v", n = 9, p = true, text = "But avoid foolish controversies, genealogies, arguments, and quarrels about the law, because these things are pointless and worthless." },
  { t = "v", n = 10, p = true, text = "Reject a divisive man after a first and second admonition," },
  { t = "v", n = 11, text = "knowing that such a man is corrupt and sinful; he is self-condemned." },
  { t = "h", level = 2, text = "Final Remarks and Greetings" },
  { t = "v", n = 12, p = true, text = "As soon as I send Artemas or Tychicus to you, make every effort to come to me at Nicopolis, because I have decided to winter there." },
  { t = "v", n = 13, text = "Do your best to equip Zenas the lawyer and Apollos, so that they will have everything they need." },
  { t = "v", n = 14, text = "And our people must also learn to devote themselves to good works in order to meet the pressing needs of others, so that they will not be unfruitful." },
  { t = "v", n = 15, p = true, text = "All who are with me send you greetings. Greet those who love us in the faith. Grace be with all of you.[^b]" },
  { t = "note", id = "a", text = "Or *of regeneration*" },
  { t = "note", id = "b", text = "BYZ and TR include *Amen.*" },
]

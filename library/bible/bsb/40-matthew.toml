[[section]]
id = "1"
title = "Matthew 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Genealogy of Jesus" },
  { t = "ref", text = "(Ruth 4:18–22; Luke 3:23–38)" },
  { t = "v", n = 1, p = true, text = "This is the record of the genealogy of Jesus Christ, the son of David, the son of Abraham:" },
  { t = "v", n = 2, indent = 1, p = true, text = "Abraham was the father of Isaac, Isaac the father of Jacob, and Jacob the father of Judah and his brothers." },
  { t = "v", n = 3, indent = 1, p = true, text = "Judah was the father of Perez and Zerah by Tamar, Perez the father of Hezron, and Hezron the father of Ram.[^a]" },
  { t = "v", n = 4, indent = 1, p = true, text = "Ram was the father of Amminadab, Amminadab the father of Nahshon, and Nahshon the father of Salmon." },
  { t = "v", n = 5, indent = 1, p = true, text = "Salmon was the father of Boaz by Rahab, Boaz the father of Obed by Ruth, Obed the father of Jesse," },
  { t = "v", n = 6, indent = 1, text = "and Jesse the father of David the king. Next: David was the father of Solomon by Uriah’s wife," },
  { t = "v", n = 7, indent = 1, text = "Solomon the father of Rehoboam, Rehoboam the father of Abijah, and Abijah the father of Asa.[^b]" },
  { t = "v", n = 8, indent = 1, p = true, text = "Asa was the father of Jehoshaphat, Jehoshaphat the father of Joram, and Joram the father of Uzziah." },
  { t = "v", n = 9, indent = 1, p = true, text = "Uzziah was the father of Jotham, Jotham the father of Ahaz, and Ahaz the father of Hezekiah." },
  { t = "v", n = 10, indent = 1, p = true, text = "Hezekiah was the father of Manasseh, Manasseh the father of Amon,[^c] Amon the father of Josiah," },
  { t = "v", n = 11, indent = 1, text = "and Josiah the father of Jeconiah and his brothers at the time of the exile to Babylon." },
  { t = "v", n = 12, p = true, text = "After the exile to Babylon: Jeconiah was the father of Shealtiel, Shealtiel the father of Zerubbabel," },
  { t = "v", n = 13, indent = 1, text = "Zerubbabel the father of Abiud, Abiud the father of Eliakim, and Eliakim the father of Azor." },
  { t = "v", n = 14, indent = 1, p = true, text = "Azor was the father of Zadok, Zadok the father of Achim, and Achim the father of Eliud." },
  { t = "v", n = 15, indent = 1, p = true, text = "Eliud was the father of Eleazar, Eleazar the father of Matthan, Matthan the father of Jacob," },
  { t = "v", n = 16, indent = 1, text = "and Jacob the father of Joseph, the husband of Mary, of whom was born Jesus, who is called Christ." },
  { t = "v", n = 17, p = true, text = "In all, then, there were fourteen generations from Abraham to David, fourteen from David to the exile to Babylon, and fourteen from the exile to the Christ." },
  { t = "h", level = 2, text = "The Birth of Jesus" },
  { t = "ref", text = "(Isaiah 7:10–16; Luke 2:1–7)" },
  { t = "v", n = 18, p = true, text = "This is how the birth of Jesus Christ came about: His mother Mary was pledged in marriage to Joseph, but before they came together, she was found to be with child through the Holy Spirit." },
  { t = "v", n = 19, text = "Because Joseph her husband was a righteous man and was unwilling to disgrace her publicly, he resolved to divorce her quietly." },
  { t = "v", n = 20, p = true, text = "But after he had pondered these things, an angel of the Lord appeared to him in a dream and said, “Joseph, son of David, do not be afraid to embrace Mary as your wife, for the One conceived in her is from the Holy Spirit." },
  { t = "v", n = 21, text = "She will give birth to a Son, and you are to give Him the name Jesus,[^d] because He will save His people from their sins.”" },
  { t = "v", n = 22, p = true, text = "All this took place to fulfill what the Lord had said through the prophet:" },
  { t = "v", n = 23, indent = 1, p = true, text = "“Behold, the virgin will be with child and will give birth to a son, and they will call Him Immanuel”[^e] (which means, “God with us”[^f])." },
  { t = "v", n = 24, p = true, text = "When Joseph woke up, he did as the angel of the Lord had commanded him and embraced Mary as his wife." },
  { t = "v", n = 25, text = "But he had no union with her[^g] until she gave birth to a Son. And he gave Him the name Jesus." },
  { t = "note", id = "a", text = "Greek *Aram*, a variant of *Ram*; also in verse 4; see 1 Chronicles 2:9–10." },
  { t = "note", id = "b", text = "Greek *Asaph*, a variant of *Asa*; also in verse 8; see 1 Chronicles 3:10." },
  { t = "note", id = "c", text = "Greek *Amōs*, a variant spelling of Amon; twice in this verse; see 1 Chronicles 3:14." },
  { t = "note", id = "d", text = "*Jesus* means *The LORD saves*." },
  { t = "note", id = "e", text = "Literally *they will call His name Immanuel*; Isaiah 7:14 (see also DSS)" },
  { t = "note", id = "f", text = "See Isaiah 7:14, Isaiah 8:8, and Isaiah 8:10." },
  { t = "note", id = "g", text = "Literally *he did not know her*" },
]

[[section]]
id = "2"
title = "Matthew 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Pilgrimage of the Magi" },
  { t = "ref", text = "(Micah 5:1–6)" },
  { t = "v", n = 1, p = true, text = "After Jesus was born in Bethlehem in Judea, during the time of King Herod, Magi from the east arrived in Jerusalem," },
  { t = "v", n = 2, text = "asking, “Where is the One who has been born King of the Jews? We saw His star in the east[^a] and have come to worship Him.”" },
  { t = "v", n = 3, p = true, text = "When King Herod heard this, he was disturbed, and all Jerusalem with him." },
  { t = "v", n = 4, text = "And when he had assembled all the chief priests and scribes of the people, he asked them where the Christ was to be born." },
  { t = "v", n = 5, p = true, text = "“In Bethlehem in Judea,” they replied, “for this is what the prophet has written:" },
  { t = "v", n = 6, indent = 1, p = true, text = "‘But you, Bethlehem, in the land of Judah, are by no means least among the rulers of Judah, for out of you will come a ruler who will be the shepherd of My people Israel.’[^b]”" },
  { t = "v", n = 7, p = true, text = "Then Herod called the Magi secretly and learned from them the exact time the star had appeared." },
  { t = "v", n = 8, text = "And sending them to Bethlehem, he said: “Go and search carefully for the Child, and when you find Him, report to me, so that I too may go and worship Him.”" },
  { t = "v", n = 9, p = true, text = "After they had heard the king, they went on their way, and the star they had seen in the east went ahead of them until it stood over the place where the Child was." },
  { t = "v", n = 10, text = "When they saw the star, they rejoiced with great delight." },
  { t = "v", n = 11, text = "On coming to the house, they saw the Child with His mother Mary, and they fell down and worshiped Him. Then they opened their treasures and presented Him with gifts of gold and frankincense and myrrh." },
  { t = "v", n = 12, p = true, text = "And having been warned in a dream not to return to Herod, they withdrew to their country by another route." },
  { t = "h", level = 2, text = "The Flight to Egypt" },
  { t = "ref", text = "(Hosea 11:1–7)" },
  { t = "v", n = 13, p = true, text = "When the Magi had gone, an angel of the Lord appeared to Joseph in a dream. “Get up!” he said. “Take the Child and His mother and flee to Egypt. Stay there until I tell you, for Herod is going to search for the Child to kill Him.”" },
  { t = "v", n = 14, p = true, text = "So he got up, took the Child and His mother by night, and withdrew to Egypt," },
  { t = "v", n = 15, text = "where he stayed until the death of Herod. This fulfilled what the Lord had spoken through the prophet: “Out of Egypt I called My Son.”[^c]" },
  { t = "h", level = 2, text = "Weeping and Great Mourning" },
  { t = "ref", text = "(Jeremiah 31:1–25)" },
  { t = "v", n = 16, p = true, text = "When Herod saw that he had been outwitted by the Magi, he was filled with rage. Sending orders, he put to death all the boys in Bethlehem and its vicinity who were two years old and under, according to the time he had learned from the Magi." },
  { t = "v", n = 17, text = "Then what was spoken through the prophet Jeremiah was fulfilled:" },
  { t = "v", n = 18, indent = 1, p = true, text = "“A voice is heard in Ramah, weeping and great mourning, Rachel weeping for her children and refusing to be comforted, because they are no more.”[^d]" },
  { t = "h", level = 2, text = "The Return to Nazareth" },
  { t = "ref", text = "(Luke 2:39–40)" },
  { t = "v", n = 19, p = true, text = "After Herod died, an angel of the Lord appeared in a dream to Joseph in Egypt." },
  { t = "v", n = 20, text = "“Get up!” he said. “Take the Child and His mother and go to the land of Israel, for those seeking the Child’s life are now dead.”" },
  { t = "v", n = 21, p = true, text = "So Joseph got up, took the Child and His mother, and went to the land of Israel." },
  { t = "v", n = 22, text = "But when he learned that Archelaus was reigning in Judea in place of his father Herod, he was afraid to go there. And having been warned in a dream, he withdrew to the district of Galilee," },
  { t = "v", n = 23, text = "and he went and lived in a town called Nazareth. So was fulfilled what was spoken through the prophets: “He will be called a Nazarene.”" },
  { t = "note", id = "a", text = "Or *as it rose*" },
  { t = "note", id = "b", text = "Micah 5:2; see also 2 Samuel 5:2." },
  { t = "note", id = "c", text = "Hosea 11:1" },
  { t = "note", id = "d", text = "Jeremiah 31:15" },
]

[[section]]
id = "3"
title = "Matthew 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Mission of John the Baptist" },
  { t = "ref", text = "(Isaiah 40:1–5; Mark 1:1–8; Luke 3:1–20; John 1:19–28)" },
  { t = "v", n = 1, p = true, text = "In those days John the Baptist came, preaching in the wilderness of Judea" },
  { t = "v", n = 2, text = "and saying, “Repent, for the kingdom of heaven is near.”" },
  { t = "v", n = 3, text = "This is he who was spoken of through the prophet Isaiah: “A voice of one calling in the wilderness, ‘Prepare the way for the Lord, make straight paths for Him.’”[^a]" },
  { t = "v", n = 4, p = true, text = "John wore a garment of camel’s hair, with a leather belt around his waist. His food was locusts and wild honey." },
  { t = "v", n = 5, text = "People went out to him from Jerusalem and all Judea and the whole region around the Jordan." },
  { t = "v", n = 6, text = "Confessing their sins, they were baptized by him in the Jordan River." },
  { t = "v", n = 7, p = true, text = "But when John saw many of the Pharisees and Sadducees coming to his place of baptism, he said to them, “You brood of vipers, who warned you to flee from the coming wrath?" },
  { t = "v", n = 8, text = "Produce fruit, then, in keeping with repentance." },
  { t = "v", n = 9, text = "And do not presume to say to yourselves, ‘We have Abraham as our father.’ For I tell you that out of these stones God can raise up children for Abraham." },
  { t = "v", n = 10, text = "The axe lies ready at the root of the trees, and every tree that does not produce good fruit will be cut down and thrown into the fire." },
  { t = "v", n = 11, p = true, text = "I baptize you with water[^b] for repentance, but after me will come One more powerful than I, whose sandals I am not worthy to carry. He will baptize you with the Holy Spirit and with fire.[^c]" },
  { t = "v", n = 12, text = "His winnowing fork is in His hand to clear His threshing floor and to gather His wheat into the barn; but He will burn up the chaff with unquenchable fire.”" },
  { t = "h", level = 2, text = "The Baptism of Jesus" },
  { t = "ref", text = "(Mark 1:9–11; Luke 3:21–22; John 1:29–34)" },
  { t = "v", n = 13, p = true, text = "At that time Jesus came from Galilee to the Jordan to be baptized by John." },
  { t = "v", n = 14, text = "But John tried to prevent Him, saying, “I need to be baptized by You, and do You come to me?”" },
  { t = "v", n = 15, p = true, text = "“Let it be so now,” Jesus replied. “It is fitting for us to fulfill all righteousness in this way.” Then John permitted Him." },
  { t = "v", n = 16, p = true, text = "As soon as Jesus was baptized, He went up out of the water. Suddenly the heavens were opened,[^d] and He saw[^e] the Spirit of God descending like a dove and resting on Him." },
  { t = "v", n = 17, text = "And a voice from heaven said, “This is My beloved Son, in whom I am well pleased!”" },
  { t = "note", id = "a", text = "Isaiah 40:3 (see also LXX)" },
  { t = "note", id = "b", text = "Or *in water*" },
  { t = "note", id = "c", text = "Or *in the Holy Spirit and in fire*" },
  { t = "note", id = "d", text = "NA, BYZ, and TR *the heavens were opened to Him*" },
  { t = "note", id = "e", text = "Or *and he saw*; see John 1:32–33." },
]

[[section]]
id = "4"
title = "Matthew 4"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Temptation of Jesus" },
  { t = "ref", text = "(Mark 1:12–13; Luke 4:1–13)" },
  { t = "v", n = 1, p = true, text = "Then Jesus was led by the Spirit into the wilderness to be tempted by the devil." },
  { t = "v", n = 2, text = "After fasting forty days and forty nights, He was hungry." },
  { t = "v", n = 3, p = true, text = "The tempter came to Him and said, “If You are the Son of God, tell these stones to become bread.”" },
  { t = "v", n = 4, p = true, text = "But Jesus answered, “It is written: ‘Man shall not live on bread alone, but on every word that comes from the mouth of God.’[^a]”" },
  { t = "v", n = 5, p = true, text = "Then the devil took Him to the holy city and set Him on the pinnacle of the temple." },
  { t = "v", n = 6, text = "“If You are the Son of God,” he said, “throw Yourself down. For it is written: ‘He will command His angels concerning You, and they will lift You up in their hands, so that You will not strike Your foot against a stone.’[^b]”" },
  { t = "v", n = 7, p = true, text = "Jesus replied, “It is also written: ‘Do not put the Lord your God to the test.’[^c]”" },
  { t = "v", n = 8, p = true, text = "Again, the devil took Him to a very high mountain and showed Him all the kingdoms of the world and their glory." },
  { t = "v", n = 9, text = "“All this I will give You,” he said, “if You will fall down and worship me.”" },
  { t = "v", n = 10, p = true, text = "“Away from Me, Satan!” Jesus told him. “For it is written: ‘Worship the Lord your God and serve Him only.’[^d]”" },
  { t = "v", n = 11, p = true, text = "Then the devil left Him, and angels came and ministered to Him." },
  { t = "h", level = 2, text = "Jesus Begins His Ministry" },
  { t = "ref", text = "(Isaiah 9:1–7; Mark 1:14–15; Luke 4:14–15)" },
  { t = "v", n = 12, p = true, text = "When Jesus heard that John had been imprisoned, He withdrew to Galilee." },
  { t = "v", n = 13, text = "Leaving Nazareth, He went and lived in Capernaum, which is by the sea in the region of Zebulun and Naphtali," },
  { t = "v", n = 14, text = "to fulfill what was spoken through the prophet Isaiah:" },
  { t = "v", n = 15, indent = 1, p = true, text = "“Land of Zebulun and land of Naphtali, the Way of the Sea, beyond the Jordan, Galilee of the Gentiles—" },
  { t = "v", n = 16, indent = 1, text = "the people living in darkness have seen a great light; on those living in the land of the shadow of death, a light has dawned.”[^e]" },
  { t = "v", n = 17, p = true, text = "From that time on Jesus began to preach, “Repent, for the kingdom of heaven is near.”" },
  { t = "h", level = 2, text = "The First Disciples" },
  { t = "ref", text = "(Mark 1:16–20; Luke 5:1–11; John 1:35–42)" },
  { t = "v", n = 18, p = true, text = "As Jesus was walking beside the Sea of Galilee, He saw two brothers, Simon called Peter and his brother Andrew. They were casting a net into the sea, for they were fishermen." },
  { t = "v", n = 19, text = "“Come, follow Me,” Jesus said, “and I will make you fishers of men.”" },
  { t = "v", n = 20, text = "And at once they left their nets and followed Him." },
  { t = "v", n = 21, p = true, text = "Going on from there, He saw two other brothers, James son of Zebedee and his brother John. They were in a boat with their father Zebedee, mending their nets. Jesus called them," },
  { t = "v", n = 22, text = "and immediately they left the boat and their father and followed Him." },
  { t = "h", level = 2, text = "Jesus Heals the Multitudes" },
  { t = "ref", text = "(Mark 3:7–12; Luke 6:17–19)" },
  { t = "v", n = 23, p = true, text = "Jesus went throughout Galilee, teaching in their synagogues, preaching the gospel of the kingdom, and healing every disease and sickness among the people." },
  { t = "v", n = 24, text = "News about Him spread all over Syria, and people brought to Him all who were ill with various diseases, those suffering acute pain, the demon-possessed, those having seizures, and the paralyzed, and He healed them." },
  { t = "v", n = 25, p = true, text = "Large crowds followed Him, having come from Galilee, the Decapolis,[^f] Jerusalem, Judea, and beyond the Jordan." },
  { t = "note", id = "a", text = "Deuteronomy 8:3" },
  { t = "note", id = "b", text = "Psalm 91:11–12" },
  { t = "note", id = "c", text = "Deuteronomy 6:16" },
  { t = "note", id = "d", text = "Deuteronomy 6:13" },
  { t = "note", id = "e", text = "Isaiah 9:1–2" },
  { t = "note", id = "f", text = "That is, the Ten Cities" },
]

[[section]]
id = "5"
title = "Matthew 5"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Sermon on the Mount" },
  { t = "v", n = 1, p = true, text = "When Jesus saw the crowds, He went up on the mountain and sat down. His disciples came to Him," },
  { t = "v", n = 2, text = "and He began to teach them, saying:" },
  { t = "h", level = 2, text = "The Beatitudes" },
  { t = "ref", text = "(Psalm 1:1–6; Luke 6:20–23)" },
  { t = "v", n = 3, indent = 1, p = true, text = "“Blessed are the poor in spirit, for theirs is the kingdom of heaven." },
  { t = "v", n = 4, indent = 1, text = "Blessed are those who mourn, for they will be comforted." },
  { t = "v", n = 5, indent = 1, text = "Blessed are the meek, for they will inherit the earth.[^a]" },
  { t = "v", n = 6, indent = 1, text = "Blessed are those who hunger and thirst for righteousness, for they will be filled." },
  { t = "v", n = 7, indent = 1, text = "Blessed are the merciful, for they will be shown mercy." },
  { t = "v", n = 8, indent = 1, text = "Blessed are the pure in heart, for they will see God." },
  { t = "v", n = 9, indent = 1, text = "Blessed are the peacemakers, for they will be called sons of God." },
  { t = "v", n = 10, indent = 1, text = "Blessed are those who are persecuted because of righteousness, for theirs is the kingdom of heaven." },
  { t = "v", n = 11, p = true, text = "Blessed are you when people insult you, persecute you, and falsely say all kinds of evil against you because of Me." },
  { t = "v", n = 12, text = "Rejoice and be glad, because great is your reward in heaven, for in the same way they persecuted the prophets before you." },
  { t = "h", level = 2, text = "Salt and Light" },
  { t = "ref", text = "(Mark 9:49–50; Luke 14:34–35; Philippians 2:12–18)" },
  { t = "v", n = 13, p = true, text = "You are the salt of the earth. But if the salt loses its savor, how can it be made salty again? It is no longer good for anything, except to be thrown out and trampled by men." },
  { t = "v", n = 14, p = true, text = "You are the light of the world. A city on a hill[^b] cannot be hidden." },
  { t = "v", n = 15, text = "Neither do people light a lamp and put it under a basket. Instead, they set it on a stand, and it gives light to everyone in the house." },
  { t = "v", n = 16, text = "In the same way, let your light shine before men, that they may see your good deeds and glorify your Father in heaven." },
  { t = "h", level = 2, text = "The Fulfillment of the Law" },
  { t = "v", n = 17, p = true, text = "Do not think that I have come to abolish the Law or the Prophets. I have not come to abolish them, but to fulfill them." },
  { t = "v", n = 18, text = "For I tell you truly, until heaven and earth pass away, not a single jot, not a stroke of a pen, will disappear from the Law until everything is accomplished." },
  { t = "v", n = 19, p = true, text = "So then, whoever breaks one of the least of these commandments and teaches others to do likewise will be called least in the kingdom of heaven; but whoever practices and teaches them will be called great in the kingdom of heaven." },
  { t = "v", n = 20, text = "For I tell you that unless your righteousness exceeds that of the scribes and Pharisees, you will never enter the kingdom of heaven." },
  { t = "h", level = 2, text = "Anger and Reconciliation" },
  { t = "ref", text = "(Luke 12:57–59)" },
  { t = "v", n = 21, p = true, text = "You have heard that it was said to the ancients, ‘Do not murder’[^c] and ‘Anyone who murders will be subject to judgment.’" },
  { t = "v", n = 22, text = "But I tell you that anyone who is angry with his brother[^d] will be subject to judgment. Again, anyone who says to his brother, ‘Raca,’[^e] will be subject to the Sanhedrin.[^f] But anyone who says, ‘You fool!’ will be subject to the fire of hell.[^g]" },
  { t = "v", n = 23, p = true, text = "So if you are offering your gift at the altar and there remember that your brother has something against you," },
  { t = "v", n = 24, text = "leave your gift there before the altar. First go and be reconciled to your brother; then come and offer your gift." },
  { t = "v", n = 25, p = true, text = "Reconcile quickly with your adversary, while you are still on the way to court. Otherwise, he may hand you over to the judge, and the judge may hand you over to the officer, and you may be thrown into prison." },
  { t = "v", n = 26, text = "Truly I tell you, you will not get out until you have paid the last penny.[^h]" },
  { t = "h", level = 2, text = "Adultery" },
  { t = "ref", text = "(Leviticus 18:1–30)" },
  { t = "v", n = 27, p = true, text = "You have heard that it was said, ‘Do not commit adultery.’[^i]" },
  { t = "v", n = 28, text = "But I tell you that anyone who looks at a woman to lust after her has already committed adultery with her in his heart." },
  { t = "v", n = 29, text = "If your right eye causes you to sin, gouge it out and throw it away. It is better for you to lose one part of your body than for your whole body to be thrown into hell.[^j]" },
  { t = "v", n = 30, text = "And if your right hand causes you to sin, cut it off and throw it away. It is better for you to lose one part of your body than for your whole body to depart into hell." },
  { t = "h", level = 2, text = "Divorce" },
  { t = "ref", text = "(Deuteronomy 24:1–5; Luke 16:18)" },
  { t = "v", n = 31, p = true, text = "It has also been said, ‘Whoever divorces his wife must give her a certificate of divorce.’[^k]" },
  { t = "v", n = 32, text = "But I tell you that anyone who divorces his wife, except for sexual immorality, brings adultery upon her.[^l] And he who marries a divorced woman commits adultery." },
  { t = "h", level = 2, text = "Oaths and Vows" },
  { t = "ref", text = "(Numbers 30:1–16)" },
  { t = "v", n = 33, p = true, text = "Again, you have heard that it was said to the ancients, ‘Do not break your oath, but fulfill your vows to the Lord.’[^m]" },
  { t = "v", n = 34, text = "But I tell you not to swear at all: either by heaven, for it is God’s throne;" },
  { t = "v", n = 35, text = "or by the earth, for it is His footstool; or by Jerusalem, for it is the city of the great King." },
  { t = "v", n = 36, text = "Nor should you swear by your head, for you cannot make a single hair white or black." },
  { t = "v", n = 37, text = "Simply let your ‘Yes’ be ‘Yes,’ and your ‘No,’ ‘No.’ Anything more comes from the evil one.[^n]" },
  { t = "h", level = 2, text = "Love Your Enemies" },
  { t = "ref", text = "(Leviticus 24:17–23; Luke 6:27–36)" },
  { t = "v", n = 38, p = true, text = "You have heard that it was said, ‘Eye for eye and tooth for tooth.’[^o]" },
  { t = "v", n = 39, text = "But I tell you not to resist an evil person. If someone slaps you on your right cheek, turn to him the other also;" },
  { t = "v", n = 40, text = "if someone wants to sue you and take your tunic, let him have your cloak as well;" },
  { t = "v", n = 41, text = "and if someone forces you to go one mile,[^p] go with him two miles.[^q]" },
  { t = "v", n = 42, text = "Give to the one who asks you, and do not turn away from the one who wants to borrow from you." },
  { t = "v", n = 43, p = true, text = "You have heard that it was said, ‘Love your neighbor’[^r] and ‘Hate your enemy.’" },
  { t = "v", n = 44, text = "But I tell you, love your enemies and pray for those who persecute you,[^s]" },
  { t = "v", n = 45, text = "that you may be sons of your Father in heaven. He causes His sun to rise on the evil and the good, and sends rain on the righteous and the unrighteous." },
  { t = "v", n = 46, text = "If you love those who love you, what reward will you get? Do not even tax collectors do the same?" },
  { t = "v", n = 47, text = "And if you greet only your brothers, what are you doing more than others? Do not even Gentiles do the same?" },
  { t = "v", n = 48, p = true, text = "Be perfect, therefore, as your heavenly Father is perfect." },
  { t = "note", id = "a", text = "Or *Blessed are those who exercise strength under control, for they will inherit the land*; see Psalm 37:11." },
  { t = "note", id = "b", text = "Literally *A city lying on a hill*" },
  { t = "note", id = "c", text = "Exodus 20:13; Deuteronomy 5:17" },
  { t = "note", id = "d", text = "BYZ and TR include *without cause*." },
  { t = "note", id = "e", text = "*Raca* is an Aramaic expression of contempt." },
  { t = "note", id = "f", text = "Or *the Council*" },
  { t = "note", id = "g", text = "Or *the hell of fire*; Greek *the Gehenna of fire*" },
  { t = "note", id = "h", text = "Greek *kodrantēn*; that is, a Roman copper coin worth about 1/64 of a denarius" },
  { t = "note", id = "i", text = "Exodus 20:14; Deuteronomy 5:18" },
  { t = "note", id = "j", text = "Greek *Gehenna*; also in verse 30" },
  { t = "note", id = "k", text = "Deuteronomy 24:1" },
  { t = "note", id = "l", text = "Or *causes her to commit adultery*" },
  { t = "note", id = "m", text = "Numbers 30:2" },
  { t = "note", id = "n", text = "Or *from evil*" },
  { t = "note", id = "o", text = "Exodus 21:24; Leviticus 24:20; Deuteronomy 19:21" },
  { t = "note", id = "p", text = "Greek *one milion*; that is, a Roman mile, approximately 4,855 feet or 1,480 meters" },
  { t = "note", id = "q", text = "Literally *go with him two.*" },
  { t = "note", id = "r", text = "Leviticus 19:18" },
  { t = "note", id = "s", text = "BYZ and TR *love your enemies, bless those who curse you, do good to those who hate you, and pray for those who spitefully accuse you and persecute you*; see Luke 6:27–28." },
]

[[section]]
id = "6"
title = "Matthew 6"
level = 1
blocks = [
  { t = "h", level = 2, text = "Giving to the Needy" },
  { t = "ref", text = "(Deuteronomy 15:7–11)" },
  { t = "v", n = 1, p = true, text = "“Be careful not to perform your righteous acts[^a] before men to be seen by them. If you do, you will have no reward from your Father in heaven." },
  { t = "v", n = 2, p = true, text = "So when you give to the needy, do not sound a trumpet before you, as the hypocrites do in the synagogues and on the streets, to be honored by men. Truly I tell you, they already have their full reward." },
  { t = "v", n = 3, text = "But when you give to the needy, do not let your left hand know what your right hand is doing," },
  { t = "v", n = 4, text = "so that your giving may be in secret. And your Father, who sees what is done in secret, will reward you." },
  { t = "h", level = 2, text = "The Lord’s Prayer" },
  { t = "ref", text = "(Luke 11:1–4)" },
  { t = "v", n = 5, p = true, text = "And when you pray, do not be like the hypocrites. For they love to pray standing in the synagogues and on the street corners to be seen by men. Truly I tell you, they already have their full reward." },
  { t = "v", n = 6, text = "But when you pray, go into your inner room, shut your door, and pray to your Father, who is unseen. And your Father, who sees what is done in secret, will reward you." },
  { t = "v", n = 7, p = true, text = "And when you pray, do not babble on like pagans, for they think that by their many words they will be heard." },
  { t = "v", n = 8, text = "Do not be like them, for your Father knows what you need before you ask Him." },
  { t = "v", n = 9, p = true, text = "So then, this is how you should pray: ‘Our Father in heaven, hallowed be Your name." },
  { t = "v", n = 10, indent = 1, text = "Your kingdom come, Your will be done, on earth as it is in heaven." },
  { t = "v", n = 11, indent = 1, text = "Give us this day our daily bread." },
  { t = "v", n = 12, indent = 1, text = "And forgive us our debts, as we also have forgiven our debtors." },
  { t = "v", n = 13, indent = 1, text = "And lead us not into temptation, but deliver us from the evil one.[^b]’" },
  { t = "v", n = 14, p = true, text = "For if you forgive men their trespasses, your heavenly Father will also forgive you." },
  { t = "v", n = 15, text = "But if you do not forgive men their trespasses, neither will your Father forgive yours." },
  { t = "h", level = 2, text = "Proper Fasting" },
  { t = "v", n = 16, p = true, text = "When you fast, do not be somber like the hypocrites, for they disfigure their faces to show men they are fasting. Truly I tell you, they already have their full reward." },
  { t = "v", n = 17, text = "But when you fast, anoint your head and wash your face," },
  { t = "v", n = 18, text = "so that your fasting will not be obvious to men, but only to your Father, who is unseen. And your Father, who sees what is done in secret, will reward you." },
  { t = "h", level = 2, text = "Treasures in Heaven" },
  { t = "ref", text = "(Luke 12:32–34)" },
  { t = "v", n = 19, p = true, text = "Do not store up for yourselves treasures on earth, where moth and rust[^c] destroy, and where thieves break in and steal." },
  { t = "v", n = 20, text = "But store up for yourselves treasures in heaven, where moth and rust do not destroy, and where thieves do not break in and steal." },
  { t = "v", n = 21, text = "For where your treasure is, there your heart will be also." },
  { t = "h", level = 2, text = "The Lamp of the Body" },
  { t = "ref", text = "(Luke 11:33–36)" },
  { t = "v", n = 22, p = true, text = "The eye is the lamp of the body. If your eyes are good,[^d] your whole body will be full of light." },
  { t = "v", n = 23, text = "But if your eyes are bad,[^e] your whole body will be full of darkness. If then the light within you is darkness, how great is that darkness!" },
  { t = "v", n = 24, p = true, text = "No one can serve two masters: Either he will hate the one and love the other, or he will be devoted to the one and despise the other. You cannot serve both God and money." },
  { t = "h", level = 2, text = "Do Not Worry" },
  { t = "ref", text = "(Luke 12:22–31)" },
  { t = "v", n = 25, p = true, text = "Therefore I tell you, do not worry about your life, what you will eat or drink; or about your body, what you will wear. Is not life more than food, and the body more than clothes?" },
  { t = "v", n = 26, text = "Look at the birds of the air: They do not sow or reap or gather into barns, and yet your heavenly Father feeds them. Are you not much more valuable than they?" },
  { t = "v", n = 27, text = "Who of you by worrying can add a single hour to his life?[^f]" },
  { t = "v", n = 28, p = true, text = "And why do you worry about clothes? Consider how the lilies of the field grow: They do not labor or spin." },
  { t = "v", n = 29, text = "Yet I tell you that not even Solomon in all his glory was adorned like one of these." },
  { t = "v", n = 30, text = "If that is how God clothes the grass of the field, which is here today and tomorrow is thrown into the furnace, will He not much more clothe you, O you of little faith?" },
  { t = "v", n = 31, p = true, text = "Therefore do not worry, saying, ‘What shall we eat?’ or ‘What shall we drink?’ or ‘What shall we wear?’" },
  { t = "v", n = 32, text = "For the Gentiles strive after all these things, and your heavenly Father knows that you need them." },
  { t = "v", n = 33, text = "But seek first the kingdom of God[^g] and His righteousness, and all these things will be added unto you." },
  { t = "v", n = 34, p = true, text = "Therefore do not worry about tomorrow, for tomorrow will worry about itself. Today has enough trouble of its own." },
  { t = "note", id = "a", text = "BYZ and TR *charitable acts* or *alms*" },
  { t = "note", id = "b", text = "Or *from evil*; BYZ and TR include *For Yours is the kingdom and the power and the glory, forever. Amen.*" },
  { t = "note", id = "c", text = "Or *worm*; also in verse 20" },
  { t = "note", id = "d", text = "Literally *If your eye is sound*; see Proverbs 22:9" },
  { t = "note", id = "e", text = "Literally *if your eye is evil*; see Proverbs 23:6 and Proverbs 28:22" },
  { t = "note", id = "f", text = "Or *a single cubit to his height*; a cubit was approximately 18 inches or 45 centimeters." },
  { t = "note", id = "g", text = "SBL, WH, and NE *seek first His kingdom*; see also Luke 12:31." },
]

[[section]]
id = "7"
title = "Matthew 7"
level = 1
blocks = [
  { t = "h", level = 2, text = "Judging Others" },
  { t = "ref", text = "(Luke 6:37–42; Romans 14:1–12)" },
  { t = "v", n = 1, p = true, text = "“Do not judge, or you will be judged." },
  { t = "v", n = 2, text = "For with the same judgment you pronounce, you will be judged, and with the measure you use, it will be measured to you." },
  { t = "v", n = 3, p = true, text = "Why do you look at the speck in your brother’s eye but fail to notice the beam in your own eye?" },
  { t = "v", n = 4, text = "How can you say to your brother, ‘Let me take the speck out of your eye,’ while there is still a beam in your own eye?" },
  { t = "v", n = 5, text = "You hypocrite! First take the beam out of your own eye, and then you will see clearly to remove the speck from your brother’s eye." },
  { t = "v", n = 6, p = true, text = "Do not give dogs what is holy; do not throw your pearls before swine. If you do, they may trample them under their feet, and then turn and tear you to pieces." },
  { t = "h", level = 2, text = "Ask, Seek, Knock" },
  { t = "ref", text = "(Luke 11:5–13)" },
  { t = "v", n = 7, p = true, text = "Ask, and it will be given to you; seek, and you will find; knock, and the door will be opened to you." },
  { t = "v", n = 8, text = "For everyone who asks receives; he who seeks finds; and to him who knocks, the door will be opened." },
  { t = "v", n = 9, p = true, text = "Which of you, if his son asks for bread, will give him a stone?" },
  { t = "v", n = 10, text = "Or if he asks for a fish, will give him a snake?" },
  { t = "v", n = 11, text = "So if you who are evil know how to give good gifts to your children, how much more will your Father in heaven give good things to those who ask Him!" },
  { t = "v", n = 12, p = true, text = "In everything, then, do to others as you would have them do to you. For this is the essence of the Law and the Prophets." },
  { t = "h", level = 2, text = "The Narrow Gate" },
  { t = "ref", text = "(Luke 13:22–30)" },
  { t = "v", n = 13, p = true, text = "Enter through the narrow gate. For wide is the gate and broad is the way that leads to destruction, and many enter through it." },
  { t = "v", n = 14, text = "But small is the gate and narrow the way that leads to life, and only a few find it." },
  { t = "h", level = 2, text = "A Tree and Its Fruit" },
  { t = "ref", text = "(Luke 6:43–45)" },
  { t = "v", n = 15, p = true, text = "Beware of false prophets. They come to you in sheep’s clothing, but inwardly they are ravenous wolves." },
  { t = "v", n = 16, text = "By their fruit you will recognize them. Are grapes gathered from thornbushes, or figs from thistles?" },
  { t = "v", n = 17, text = "Likewise, every good tree bears good fruit, but a bad tree bears bad fruit." },
  { t = "v", n = 18, text = "A good tree cannot bear bad fruit, and a bad tree cannot bear good fruit." },
  { t = "v", n = 19, text = "Every tree that does not bear good fruit is cut down and thrown into the fire." },
  { t = "v", n = 20, text = "So then, by their fruit you will recognize them." },
  { t = "v", n = 21, p = true, text = "Not everyone who says to Me, ‘Lord, Lord,’ will enter the kingdom of heaven, but only he who does the will of My Father in heaven." },
  { t = "v", n = 22, text = "Many will say to Me on that day, ‘Lord, Lord, did we not prophesy in Your name, and in Your name drive out demons and perform many miracles?’" },
  { t = "v", n = 23, p = true, text = "Then I will tell them plainly, ‘I never knew you; depart from Me, you workers of lawlessness!’" },
  { t = "h", level = 2, text = "The House on the Rock" },
  { t = "ref", text = "(Luke 6:46–49)" },
  { t = "v", n = 24, p = true, text = "Therefore everyone who hears these words of Mine and acts on them is like a wise man who built his house on the rock." },
  { t = "v", n = 25, text = "The rain fell, the torrents raged, and the winds blew and beat against that house; yet it did not fall, because its foundation was on the rock." },
  { t = "v", n = 26, p = true, text = "But everyone who hears these words of Mine and does not act on them is like a foolish man who built his house on sand." },
  { t = "v", n = 27, text = "The rain fell, the torrents raged, and the winds blew and beat against that house, and it fell—and great was its collapse!”" },
  { t = "h", level = 2, text = "The Authority of Jesus" },
  { t = "v", n = 28, p = true, text = "When Jesus had finished saying these things, the crowds were astonished at His teaching," },
  { t = "v", n = 29, text = "because He taught as one who had authority, and not as their scribes." },
]

[[section]]
id = "8"
title = "Matthew 8"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Leper’s Prayer" },
  { t = "ref", text = "(Leviticus 14:1–32; Mark 1:40–45; Luke 5:12–16)" },
  { t = "v", n = 1, p = true, text = "When Jesus came down from the mountain, large crowds followed Him." },
  { t = "v", n = 2, text = "Suddenly a leper[^a] came and knelt before Him, saying, “Lord, if You are willing, You can make me clean.”" },
  { t = "v", n = 3, p = true, text = "Jesus reached out His hand and touched the man. “I am willing,” He said. “Be clean!” And immediately his leprosy was cleansed." },
  { t = "v", n = 4, p = true, text = "Then Jesus instructed him, “See that you don’t tell anyone. But go, show yourself to the priest and offer the gift prescribed by Moses, as a testimony to them.”[^b]" },
  { t = "h", level = 2, text = "The Faith of the Centurion" },
  { t = "ref", text = "(Luke 7:1–10; John 4:43–54)" },
  { t = "v", n = 5, p = true, text = "When Jesus had entered Capernaum, a centurion came and pleaded with Him," },
  { t = "v", n = 6, text = "“Lord, my servant[^c] lies at home, paralyzed and in terrible agony.”" },
  { t = "v", n = 7, p = true, text = "“I will go and heal him,” Jesus replied." },
  { t = "v", n = 8, p = true, text = "The centurion answered, “Lord, I am not worthy to have You come under my roof. But just say the word, and my servant will be healed." },
  { t = "v", n = 9, text = "For I myself am a man under authority, with soldiers under me. I tell one to go, and he goes, and another to come, and he comes. I tell my servant to do something, and he does it.”" },
  { t = "v", n = 10, p = true, text = "When Jesus heard this, He marveled and said to those following Him, “Truly I tell you, I have not found anyone in Israel with such great faith." },
  { t = "v", n = 11, text = "I say to you that many will come from the east and the west to share the banquet with Abraham, Isaac, and Jacob in the kingdom of heaven." },
  { t = "v", n = 12, text = "But the sons of the kingdom will be thrown into the outer darkness, where there will be weeping and gnashing of teeth.”" },
  { t = "v", n = 13, p = true, text = "Then Jesus said to the centurion, “Go! As you have believed, so will it be done for you.” And his servant was healed at that very hour." },
  { t = "h", level = 2, text = "Jesus Heals at Peter’s House" },
  { t = "ref", text = "(Mark 1:29–34; Luke 4:38–41)" },
  { t = "v", n = 14, p = true, text = "When Jesus arrived at Peter’s house, He saw Peter’s mother-in-law sick in bed with a fever." },
  { t = "v", n = 15, text = "So He touched her hand, and the fever left her, and she got up and began to serve Him." },
  { t = "v", n = 16, p = true, text = "When evening came, many who were demon-possessed were brought to Jesus, and He drove out the spirits with a word and healed all the sick." },
  { t = "v", n = 17, text = "This was to fulfill what was spoken through the prophet Isaiah: “He took up our infirmities and carried our diseases.”[^d]" },
  { t = "h", level = 2, text = "The Cost of Discipleship" },
  { t = "ref", text = "(Luke 9:57–62; Luke 14:25–33; John 6:59–66)" },
  { t = "v", n = 18, p = true, text = "When Jesus saw a large crowd around Him, He gave orders to cross to the other side of the sea.[^e]" },
  { t = "v", n = 19, text = "And one of the scribes came to Him and said, “Teacher, I will follow You wherever You go.”" },
  { t = "v", n = 20, p = true, text = "Jesus replied, “Foxes have dens and birds of the air have nests, but the Son of Man has no place to lay His head.”" },
  { t = "v", n = 21, p = true, text = "Another of His disciples requested, “Lord, first let me go and bury my father.”" },
  { t = "v", n = 22, p = true, text = "But Jesus told him, “Follow Me, and let the dead bury their own dead.”" },
  { t = "h", level = 2, text = "Jesus Calms the Storm" },
  { t = "ref", text = "(Psalm 107:1–43; Mark 4:35–41; Luke 8:22–25)" },
  { t = "v", n = 23, p = true, text = "When He got into the boat, His disciples followed Him." },
  { t = "v", n = 24, text = "Suddenly a violent storm came up on the sea, so that the boat was engulfed by the waves. But Jesus was sleeping." },
  { t = "v", n = 25, text = "The disciples went and woke Him, saying, “Lord, save us! We are perishing!”" },
  { t = "v", n = 26, p = true, text = "“You of little faith,” Jesus replied, “why are you so afraid?” Then He got up and rebuked the winds and the sea, and it was perfectly calm." },
  { t = "v", n = 27, p = true, text = "The men were amazed and asked, “What kind of man is this? Even the winds and the sea obey Him!”" },
  { t = "h", level = 2, text = "The Demons and the Pigs" },
  { t = "ref", text = "(Mark 5:1–20; Luke 8:26–39)" },
  { t = "v", n = 28, p = true, text = "When Jesus arrived on the other side in the region of the Gadarenes,[^f] He was met by two demon-possessed men coming from the tombs. They were so violent that no one could pass that way." },
  { t = "v", n = 29, p = true, text = "“What do You want with us, Son of God?” they shouted. “Have You come here to torture us before the appointed time?”" },
  { t = "v", n = 30, p = true, text = "In the distance a large herd of pigs was feeding." },
  { t = "v", n = 31, text = "So the demons begged Jesus, “If You drive us out, send us into the herd of pigs.”" },
  { t = "v", n = 32, p = true, text = "“Go!” He told them. So they came out and went into the pigs, and the whole herd rushed down the steep bank into the sea and died in the waters." },
  { t = "v", n = 33, p = true, text = "Those tending the pigs ran off into the town and reported all this, including the account of the demon-possessed men." },
  { t = "v", n = 34, text = "Then the whole town went out to meet Jesus. And when they saw Him, they begged Him to leave their region." },
  { t = "note", id = "a", text = "A *leper* was one afflicted with a skin disease. See Leviticus 13." },
  { t = "note", id = "b", text = "See Leviticus 14:1–32." },
  { t = "note", id = "c", text = "Or *child*; also in verses 8 and 13" },
  { t = "note", id = "d", text = "Isaiah 53:4" },
  { t = "note", id = "e", text = "That is, the Sea of Galilee; Greek *to the other side*" },
  { t = "note", id = "f", text = "BYZ, TR, and PT *Gergesenes*; other manuscripts *Gerasenes*" },
]

[[section]]
id = "9"
title = "Matthew 9"
level = 1
blocks = [
  { t = "h", level = 2, text = "Jesus Heals a Paralytic" },
  { t = "ref", text = "(Mark 2:1–12; Luke 5:17–26)" },
  { t = "v", n = 1, p = true, text = "Jesus got into a boat, crossed over, and came to His own town." },
  { t = "v", n = 2, text = "Just then some men brought[^a] to Him a paralytic lying on a mat. When Jesus saw their faith, He said to the paralytic, “Take courage, son; your sins are forgiven.”" },
  { t = "v", n = 3, p = true, text = "On seeing this, some of the scribes said to themselves, “This man is blaspheming!”" },
  { t = "v", n = 4, p = true, text = "But Jesus knew[^b] what they were thinking and said, “Why do you harbor evil in your hearts?" },
  { t = "v", n = 5, text = "Which is easier: to say, ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?" },
  { t = "v", n = 6, text = "But so that you may know that the Son of Man has authority on earth to forgive sins...” Then He said to the paralytic, “Get up, pick up your mat, and go home.”" },
  { t = "v", n = 7, text = "And the man got up and went home." },
  { t = "v", n = 8, p = true, text = "When the crowds saw this, they were filled with awe and glorified God, who had given such authority to men." },
  { t = "h", level = 2, text = "Jesus Calls Matthew" },
  { t = "ref", text = "(Mark 2:13–17; Luke 5:27–32)" },
  { t = "v", n = 9, p = true, text = "As Jesus went on from there, He saw a man named Matthew sitting at the tax booth. “Follow Me,” He told him, and Matthew got up and followed Him." },
  { t = "v", n = 10, p = true, text = "Later, as Jesus was dining at Matthew’s house, many tax collectors and sinners came and ate with Him and His disciples." },
  { t = "v", n = 11, text = "When the Pharisees saw this, they asked His disciples, “Why does your Teacher eat with tax collectors and sinners?”" },
  { t = "v", n = 12, p = true, text = "On hearing this, Jesus said, “It is not the healthy who need a doctor, but the sick." },
  { t = "v", n = 13, text = "But go and learn what this means: ‘I desire mercy, not sacrifice.’[^c] For I have not come to call the righteous, but sinners.[^d]”" },
  { t = "h", level = 2, text = "Questions about Fasting" },
  { t = "ref", text = "(Mark 2:18–20; Luke 5:33–35)" },
  { t = "v", n = 14, p = true, text = "Then John’s disciples came to Jesus and asked, “Why is it that we and the Pharisees fast so often,[^e] but Your disciples do not fast?”" },
  { t = "v", n = 15, p = true, text = "Jesus replied, “How can the guests of the bridegroom mourn while He is with them? But the time will come when the bridegroom will be taken from them; then they will fast." },
  { t = "h", level = 2, text = "The Patches and the Wineskins" },
  { t = "ref", text = "(Mark 2:21–22; Luke 5:36–39)" },
  { t = "v", n = 16, p = true, text = "No one sews a patch of unshrunk cloth on an old garment. For the patch will pull away from the garment, and a worse tear will result." },
  { t = "v", n = 17, p = true, text = "Neither do men pour new wine into old wineskins. If they do, the skins will burst, the wine will spill, and the wineskins will be ruined. Instead, they pour new wine into new wineskins, and both are preserved.”" },
  { t = "h", level = 2, text = "The Healing Touch of Jesus" },
  { t = "ref", text = "(Mark 5:21–43; Luke 8:40–56)" },
  { t = "v", n = 18, p = true, text = "While Jesus was saying these things, a synagogue leader came and knelt before Him. “My daughter has just died,” he said. “But come and place Your hand on her, and she will live.”" },
  { t = "v", n = 19, p = true, text = "So Jesus got up and went with him, along with His disciples." },
  { t = "v", n = 20, text = "Suddenly a woman who had suffered from bleeding for twelve years came up behind Him and touched the fringe of His cloak." },
  { t = "v", n = 21, text = "She said to herself, “If only I touch His cloak, I will be healed.”" },
  { t = "v", n = 22, p = true, text = "Jesus turned and saw her. “Take courage, daughter,” He said, “your faith has healed you.” And the woman was healed from that very hour." },
  { t = "v", n = 23, p = true, text = "When Jesus entered the house of the synagogue leader, He saw the flute players and the noisy crowd." },
  { t = "v", n = 24, text = "“Go away,” He told them. “The girl is not dead, but asleep.” And they laughed at Him." },
  { t = "v", n = 25, p = true, text = "After the crowd had been put outside, Jesus went in and took the girl by the hand, and she got up." },
  { t = "v", n = 26, text = "And the news about this spread throughout that region." },
  { t = "h", level = 2, text = "Jesus Heals the Blind and Mute" },
  { t = "ref", text = "(Mark 7:31–37)" },
  { t = "v", n = 27, p = true, text = "As Jesus went on from there, two blind men followed Him, crying out, “Have mercy on us, Son of David!”" },
  { t = "v", n = 28, p = true, text = "After Jesus had entered the house, the blind men came to Him. “Do you believe that I am able to do this?” He asked. “Yes, Lord,” they answered." },
  { t = "v", n = 29, p = true, text = "Then He touched their eyes and said, “According to your faith will it be done to you.”" },
  { t = "v", n = 30, text = "And their eyes were opened. Jesus warned them sternly, “See that no one finds out about this!”" },
  { t = "v", n = 31, text = "But they went out and spread the news about Him throughout the land." },
  { t = "v", n = 32, p = true, text = "As they were leaving, a demon-possessed man who was mute was brought to Jesus." },
  { t = "v", n = 33, text = "And when the demon had been driven out, the man began to speak. The crowds were amazed and said, “Nothing like this has ever been seen in Israel!”" },
  { t = "v", n = 34, p = true, text = "But the Pharisees said, “It is by the prince of demons that He drives out demons.”" },
  { t = "h", level = 2, text = "The Lord of the Harvest" },
  { t = "ref", text = "(Luke 10:1–12)" },
  { t = "v", n = 35, p = true, text = "Jesus went through all the towns and villages, teaching in their synagogues, preaching the gospel of the kingdom, and healing every disease and sickness." },
  { t = "v", n = 36, text = "When He saw the crowds, He was moved with compassion for them, because they were harassed and helpless, like sheep without a shepherd." },
  { t = "v", n = 37, p = true, text = "Then He said to His disciples, “The harvest is plentiful, but the workers are few." },
  { t = "v", n = 38, text = "Ask the Lord of the harvest, therefore, to send out workers into His harvest.”" },
  { t = "note", id = "a", text = "Literally *And behold, they brought*" },
  { t = "note", id = "b", text = "NA, BYZ, and TR *saw*" },
  { t = "note", id = "c", text = "Hosea 6:6" },
  { t = "note", id = "d", text = "BYZ and TR *but sinners, to repentance*; see Luke 5:32." },
  { t = "note", id = "e", text = "NE and WH do not include *so often*." },
]

[[section]]
id = "10"
title = "Matthew 10"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Twelve Apostles" },
  { t = "ref", text = "(Mark 3:13–19; Luke 6:12–16)" },
  { t = "v", n = 1, p = true, text = "And calling His twelve disciples to Him, Jesus gave them authority over unclean spirits, so that they could drive them out and heal every disease and sickness." },
  { t = "v", n = 2, p = true, text = "These are the names of the twelve apostles: first Simon, called Peter, and his brother Andrew; James son of Zebedee, and his brother John;" },
  { t = "v", n = 3, text = "Philip and Bartholomew; Thomas and Matthew the tax collector; James son of Alphaeus, and Thaddaeus;" },
  { t = "v", n = 4, text = "Simon the Zealot,[^a] and Judas Iscariot, who betrayed Jesus.[^b]" },
  { t = "h", level = 2, text = "The Ministry of the Twelve" },
  { t = "ref", text = "(Mark 6:7–13; Luke 9:1–6)" },
  { t = "v", n = 5, p = true, text = "These twelve Jesus sent out with the following instructions: “Do not go onto the road of the Gentiles or enter any town of the Samaritans." },
  { t = "v", n = 6, text = "Go rather to the lost sheep of Israel." },
  { t = "v", n = 7, text = "As you go, preach this message: ‘The kingdom of heaven is near.’" },
  { t = "v", n = 8, text = "Heal the sick, raise the dead, cleanse the lepers,[^c] drive out demons. Freely you have received; freely give." },
  { t = "v", n = 9, p = true, text = "Do not take along any gold or silver or copper in your belts." },
  { t = "v", n = 10, text = "Take no bag for the road, or second tunic, or sandals, or staff; for the worker is worthy of his provisions." },
  { t = "v", n = 11, p = true, text = "Whatever town or village you enter, find out who is worthy there and stay at his house[^d] until you move on." },
  { t = "v", n = 12, text = "As you enter the home, greet its occupants.[^e]" },
  { t = "v", n = 13, text = "If the home is worthy, let your peace rest on it, but if it is not, let your peace return to you." },
  { t = "v", n = 14, text = "And if anyone will not welcome you or heed your words, shake the dust off your feet when you leave that home or town." },
  { t = "v", n = 15, text = "Truly I tell you, it will be more bearable for Sodom and Gomorrah on the day of judgment than for that town." },
  { t = "h", level = 2, text = "Sheep among Wolves" },
  { t = "ref", text = "(2 Timothy 1:3–12)" },
  { t = "v", n = 16, p = true, text = "Behold, I am sending you out like sheep among wolves; therefore be as shrewd as snakes and as innocent as doves." },
  { t = "v", n = 17, text = "But beware of men, for they will hand you over to their councils and flog you in their synagogues." },
  { t = "v", n = 18, text = "On My account you will be brought before governors and kings as witnesses to them and to the Gentiles." },
  { t = "v", n = 19, text = "But when they hand you over, do not worry about how to respond or what to say. In that hour you will be given what to say." },
  { t = "v", n = 20, text = "For it will not be you speaking, but the Spirit of your Father speaking through you." },
  { t = "v", n = 21, p = true, text = "Brother will betray brother to death, and a father his child; children will rise against their parents and have them put to death." },
  { t = "v", n = 22, text = "You will be hated by everyone because of My name, but the one who perseveres to the end will be saved." },
  { t = "v", n = 23, p = true, text = "When they persecute you in one town, flee to the next. Truly I tell you, you will not reach all the towns of Israel before the Son of Man comes." },
  { t = "v", n = 24, p = true, text = "A disciple is not above his teacher, nor a servant above his master." },
  { t = "v", n = 25, text = "It is enough for a disciple to be like his teacher, and a servant like his master. If the head of the house has been called Beelzebul,[^f] how much more the members of his household!" },
  { t = "h", level = 2, text = "Fear God Alone" },
  { t = "ref", text = "(Luke 12:4–7)" },
  { t = "v", n = 26, p = true, text = "So do not be afraid of them. For there is nothing concealed that will not be disclosed, and nothing hidden that will not be made known." },
  { t = "v", n = 27, text = "What I tell you in the dark, speak in the daylight; what is whispered in your ear, proclaim from the housetops." },
  { t = "v", n = 28, p = true, text = "Do not be afraid of those who kill the body but cannot kill the soul. Instead, fear the One who can destroy both soul and body in hell.[^g]" },
  { t = "v", n = 29, p = true, text = "Are not two sparrows sold for a penny?[^h] Yet not one of them will fall to the ground apart from the will of your Father." },
  { t = "v", n = 30, text = "And even the very hairs of your head are all numbered." },
  { t = "v", n = 31, text = "So do not be afraid; you are worth more than many sparrows." },
  { t = "h", level = 2, text = "Confessing Christ" },
  { t = "ref", text = "(Luke 12:8–12)" },
  { t = "v", n = 32, p = true, text = "Therefore everyone who confesses Me before men, I will also confess him before My Father in heaven." },
  { t = "v", n = 33, text = "But whoever denies Me before men, I will also deny him before My Father in heaven." },
  { t = "h", level = 2, text = "Not Peace but a Sword" },
  { t = "ref", text = "(Micah 7:1–6; Luke 12:49–53)" },
  { t = "v", n = 34, p = true, text = "Do not assume that I have come to bring peace to the earth; I have not come to bring peace, but a sword." },
  { t = "v", n = 35, text = "For I have come to turn ‘a man against his father, a daughter against her mother, a daughter-in-law against her mother-in-law." },
  { t = "v", n = 36, indent = 1, text = "A man’s enemies will be the members of his own household.’[^i]" },
  { t = "v", n = 37, p = true, text = "Anyone who loves his father or mother more than Me is not worthy of Me; anyone who loves his son or daughter more than Me is not worthy of Me;" },
  { t = "v", n = 38, text = "and anyone who does not take up his cross and follow Me is not worthy of Me." },
  { t = "v", n = 39, text = "Whoever finds his life will lose it, and whoever loses his life for My sake will find it." },
  { t = "h", level = 2, text = "The Reward of Service" },
  { t = "ref", text = "(2 Kings 4:8–17)" },
  { t = "v", n = 40, p = true, text = "He who receives you receives Me, and he who receives Me receives the One who sent Me." },
  { t = "v", n = 41, text = "Whoever receives a prophet because he is a prophet will receive a prophet’s reward, and whoever receives a righteous man because he is a righteous man will receive a righteous man’s reward." },
  { t = "v", n = 42, text = "And if anyone gives even a cup of cold water to one of these little ones because he is My disciple, truly I tell you, he will never lose his reward.”" },
  { t = "note", id = "a", text = "Greek *Simon the Cananean*" },
  { t = "note", id = "b", text = "Literally *the one also having betrayed Him*" },
  { t = "note", id = "c", text = "A *leper* was one afflicted with a skin disease. See Leviticus 13." },
  { t = "note", id = "d", text = "Literally *stay there*" },
  { t = "note", id = "e", text = "Literally *greet it*" },
  { t = "note", id = "f", text = "WH *Beezeboul*; Vulgate *Beelzebub*" },
  { t = "note", id = "g", text = "Greek *Gehenna*" },
  { t = "note", id = "h", text = "Greek *an assarion*; that is, a Roman copper coin worth about 1/16 of a denarius" },
  { t = "note", id = "i", text = "Micah 7:6" },
]

[[section]]
id = "11"
title = "Matthew 11"
level = 1
blocks = [
  { t = "h", level = 2, text = "John’s Inquiry" },
  { t = "ref", text = "(Luke 7:18–23)" },
  { t = "v", n = 1, p = true, text = "After Jesus had finished instructing His twelve disciples, He went on from there to teach and preach in their cities.[^a]" },
  { t = "v", n = 2, p = true, text = "Meanwhile John heard in prison about the works of Christ, and he sent his disciples[^b]" },
  { t = "v", n = 3, text = "to ask Him, “Are You the One who was to come, or should we look for someone else?”" },
  { t = "v", n = 4, p = true, text = "Jesus replied, “Go back and report to John what you hear and see:" },
  { t = "v", n = 5, text = "The blind receive sight, the lame walk, the lepers[^c] are cleansed, the deaf hear, the dead are raised, and the good news is preached to the poor." },
  { t = "v", n = 6, text = "Blessed is the one who does not fall away on account of Me.[^d]”" },
  { t = "h", level = 2, text = "Jesus Testifies about John" },
  { t = "ref", text = "(Malachi 3:1–5; Luke 7:24–35)" },
  { t = "v", n = 7, p = true, text = "As John’s disciples were leaving, Jesus began to speak to the crowds about John: “What did you go out into the wilderness to see? A reed swaying in the wind?" },
  { t = "v", n = 8, text = "Otherwise, what did you go out to see? A man dressed in fine clothes? Look, those who wear fine clothing are found in kings’ palaces." },
  { t = "v", n = 9, text = "What then did you go out to see? A prophet? Yes, I tell you, and more than a prophet." },
  { t = "v", n = 10, text = "This is the one about whom it is written: ‘Behold, I will send My messenger ahead of You, who will prepare Your way before You.’[^e]" },
  { t = "v", n = 11, p = true, text = "Truly I tell you, among those born of women there has risen no one greater than John the Baptist. Yet even the least in the kingdom of heaven is greater than he." },
  { t = "v", n = 12, text = "From the days of John the Baptist until now, the kingdom of heaven has been subject to violence,[^f] and the violent lay claim to it." },
  { t = "v", n = 13, text = "For all the Prophets and the Law prophesied until John." },
  { t = "v", n = 14, text = "And if you are willing to accept it, he is the Elijah who was to come.[^g]" },
  { t = "v", n = 15, p = true, text = "He who has ears,[^h] let him hear." },
  { t = "v", n = 16, p = true, text = "To what can I compare this generation? They are like children sitting in the marketplaces and calling out to others:" },
  { t = "v", n = 17, indent = 1, text = "‘We played the flute for you, and you did not dance; we sang a dirge, and you did not mourn.’" },
  { t = "v", n = 18, p = true, text = "For John came neither eating nor drinking, and they say, ‘He has a demon!’" },
  { t = "v", n = 19, text = "The Son of Man came eating and drinking, and they say, ‘Look at this glutton and drunkard, a friend of tax collectors and sinners!’ But wisdom is vindicated by her actions.”" },
  { t = "h", level = 2, text = "Woe to the Unrepentant" },
  { t = "ref", text = "(Luke 10:13–16)" },
  { t = "v", n = 20, p = true, text = "Then Jesus began to denounce the cities in which most of His miracles had been performed, because they did not repent." },
  { t = "v", n = 21, text = "“Woe to you, Chorazin! Woe to you, Bethsaida! For if the miracles that were performed in you had been performed in Tyre and Sidon, they would have repented long ago in sackcloth and ashes." },
  { t = "v", n = 22, text = "But I tell you, it will be more bearable for Tyre and Sidon on the day of judgment than for you." },
  { t = "v", n = 23, p = true, text = "And you, Capernaum, will you be lifted up to heaven? No, you will be brought down to Hades! For if the miracles that were performed in you had been performed in Sodom, it would have remained to this day." },
  { t = "v", n = 24, text = "But I tell you that it will be more bearable for Sodom on the day of judgment than for you.”" },
  { t = "h", level = 2, text = "Rest for the Weary" },
  { t = "ref", text = "(Luke 10:21–24)" },
  { t = "v", n = 25, p = true, text = "At that time Jesus declared, “I praise You, Father, Lord of heaven and earth, because You have hidden these things from the wise and learned, and revealed them to little children." },
  { t = "v", n = 26, text = "Yes, Father, for this was well-pleasing in Your sight." },
  { t = "v", n = 27, p = true, text = "All things have been entrusted to Me by My Father. No one knows the Son except the Father, and no one knows the Father except the Son and those to whom the Son chooses to reveal Him." },
  { t = "v", n = 28, p = true, text = "Come to Me, all you who are weary and burdened, and I will give you rest." },
  { t = "v", n = 29, text = "Take My yoke upon you and learn from Me, for I am gentle and humble in heart, and you will find rest for your souls." },
  { t = "v", n = 30, text = "For My yoke is easy and My burden is light.”" },
  { t = "note", id = "a", text = "That is, in the towns of Galilee" },
  { t = "note", id = "b", text = "BYZ and TR *he sent two of his disciples*" },
  { t = "note", id = "c", text = "A *leper* was one afflicted with a skin disease. See Leviticus 13." },
  { t = "note", id = "d", text = "Or *who is not offended by Me*" },
  { t = "note", id = "e", text = "Malachi 3:1" },
  { t = "note", id = "f", text = "Or *has been forcefully advancing*" },
  { t = "note", id = "g", text = "See Malachi 4:5." },
  { t = "note", id = "h", text = "BYZ and TR *ears to hear*" },
]

[[section]]
id = "12"
title = "Matthew 12"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Lord of the Sabbath" },
  { t = "ref", text = "(1 Samuel 21:1–7; Mark 2:23–28; Luke 6:1–5)" },
  { t = "v", n = 1, p = true, text = "At that time Jesus went through the grainfields on the Sabbath. His disciples were hungry and began to pick the heads of grain and eat them." },
  { t = "v", n = 2, text = "When the Pharisees saw this, they said to Him, “Look, Your disciples are doing what is unlawful on the Sabbath.”" },
  { t = "v", n = 3, p = true, text = "Jesus replied, “Have you not read what David did when he and his companions were hungry?" },
  { t = "v", n = 4, text = "He entered the house of God, and he and his companions ate the consecrated bread,[^a] which was not lawful for them to eat, but only for the priests." },
  { t = "v", n = 5, p = true, text = "Or haven’t you read in the Law that on the Sabbath the priests in the temple break the Sabbath and yet are innocent?" },
  { t = "v", n = 6, text = "But I tell you that One greater than the temple is here." },
  { t = "v", n = 7, p = true, text = "If only you had known the meaning of ‘I desire mercy, not sacrifice,’[^b] you would not have condemned the innocent." },
  { t = "v", n = 8, text = "For the Son of Man is Lord of the Sabbath.”" },
  { t = "h", level = 2, text = "Jesus Heals on the Sabbath" },
  { t = "ref", text = "(Mark 3:1–6; Luke 6:6–11)" },
  { t = "v", n = 9, p = true, text = "Moving on from there, Jesus entered their synagogue," },
  { t = "v", n = 10, text = "and a man with a withered hand was there. In order to accuse Jesus, they asked Him, “Is it lawful to heal on the Sabbath?”" },
  { t = "v", n = 11, p = true, text = "He replied, “If one of you has a sheep and it falls into a pit on the Sabbath, will he not take hold of it and lift it out?" },
  { t = "v", n = 12, text = "How much more valuable is a man than a sheep! Therefore it is lawful to do good on the Sabbath.”" },
  { t = "v", n = 13, p = true, text = "Then Jesus said to the man, “Stretch out your hand.” So he stretched it out, and it was restored to full use, just like the other." },
  { t = "v", n = 14, text = "But the Pharisees went out and plotted how they might kill Jesus." },
  { t = "h", level = 2, text = "God’s Chosen Servant" },
  { t = "ref", text = "(Isaiah 42:1–9)" },
  { t = "v", n = 15, p = true, text = "Aware of this, Jesus withdrew from that place. Large crowds followed Him, and He healed them all," },
  { t = "v", n = 16, text = "warning them not to make Him known." },
  { t = "v", n = 17, text = "This was to fulfill what was spoken through the prophet Isaiah:" },
  { t = "v", n = 18, indent = 1, p = true, text = "“Here is My Servant, whom I have chosen, My beloved, in whom My soul delights. I will put My Spirit on Him, and He will proclaim justice to the nations." },
  { t = "v", n = 19, indent = 1, text = "He will not quarrel or cry out; no one will hear His voice in the streets." },
  { t = "v", n = 20, indent = 1, text = "A bruised reed He will not break, and a smoldering wick He will not extinguish, till He leads justice to victory." },
  { t = "v", n = 21, indent = 2, text = "In His name the nations will put their hope.”[^c]" },
  { t = "h", level = 2, text = "A House Divided" },
  { t = "ref", text = "(Mark 3:20–27; Luke 11:14–23)" },
  { t = "v", n = 22, p = true, text = "Then a demon-possessed man who was blind and mute was brought to Jesus, and He healed the man so that he could speak and see." },
  { t = "v", n = 23, text = "The crowds were astounded and asked, “Could this be the Son of David?”" },
  { t = "v", n = 24, p = true, text = "But when the Pharisees heard this, they said, “Only by Beelzebul,[^d] the prince of demons, does this man drive out demons.”" },
  { t = "v", n = 25, p = true, text = "Knowing their thoughts, Jesus said to them, “Every kingdom divided against itself will be laid waste, and every city or household divided against itself will not stand." },
  { t = "v", n = 26, text = "If Satan drives out Satan, he is divided against himself. How then can his kingdom stand?" },
  { t = "v", n = 27, text = "And if I drive out demons by Beelzebul, by whom do your sons drive them out? So then, they will be your judges." },
  { t = "v", n = 28, text = "But if I drive out demons by the Spirit of God, then the kingdom of God has come upon you." },
  { t = "v", n = 29, p = true, text = "Or again, how can anyone enter a strong man’s house and steal his possessions, unless he first ties up the strong man? Then he can plunder his house." },
  { t = "v", n = 30, p = true, text = "He who is not with Me is against Me, and he who does not gather with Me scatters." },
  { t = "h", level = 2, text = "The Unpardonable Sin" },
  { t = "ref", text = "(Mark 3:28–30)" },
  { t = "v", n = 31, p = true, text = "Therefore I tell you, every sin and blasphemy will be forgiven men, but the blasphemy against the Spirit will not be forgiven." },
  { t = "v", n = 32, text = "Whoever speaks a word against the Son of Man will be forgiven, but whoever speaks against the Holy Spirit will not be forgiven, either in this age or in the one to come." },
  { t = "h", level = 2, text = "Good and Bad Fruit" },
  { t = "ref", text = "(Luke 6:43–45)" },
  { t = "v", n = 33, p = true, text = "Make a tree good and its fruit will be good, or make a tree bad and its fruit will be bad, for a tree is known by its fruit." },
  { t = "v", n = 34, text = "You brood of vipers, how can you who are evil say anything good? For out of the overflow of the heart the mouth speaks." },
  { t = "v", n = 35, text = "The good man brings good things out of his good store of treasure, and the evil man brings evil things out of his evil store of treasure." },
  { t = "v", n = 36, text = "But I tell you that men will give an account on the day of judgment for every careless word they have spoken." },
  { t = "v", n = 37, text = "For by your words you will be acquitted, and by your words you will be condemned.”" },
  { t = "h", level = 2, text = "The Sign of Jonah" },
  { t = "ref", text = "(Jonah 3:1–10; Luke 11:29–32)" },
  { t = "v", n = 38, p = true, text = "Then some of the scribes and Pharisees said to Him, “Teacher, we want to see a sign from You.”" },
  { t = "v", n = 39, p = true, text = "Jesus replied, “A wicked and adulterous generation demands a sign, but none will be given it except the sign of the prophet Jonah." },
  { t = "v", n = 40, text = "For as Jonah was three days and three nights in the belly of the great fish, so the Son of Man will be three days and three nights in the heart of the earth." },
  { t = "v", n = 41, p = true, text = "The men of Nineveh will stand at the judgment with this generation and condemn it; for they repented at the preaching of Jonah, and now One greater than Jonah is here." },
  { t = "v", n = 42, text = "The Queen of the South will rise at the judgment with this generation and condemn it; for she came from the ends of the earth to hear the wisdom of Solomon, and now One greater than Solomon is here." },
  { t = "h", level = 2, text = "An Unclean Spirit Returns" },
  { t = "ref", text = "(Luke 11:24–26)" },
  { t = "v", n = 43, p = true, text = "When an unclean spirit comes out of a man, it passes through arid places seeking rest and does not find it." },
  { t = "v", n = 44, text = "Then it says, ‘I will return to the house I left.’ On its return, it finds the house vacant, swept clean, and put in order." },
  { t = "v", n = 45, text = "Then it goes and brings with it seven other spirits more wicked than itself, and they go in and dwell there. And the final plight of that man is worse than the first. So will it be with this wicked generation.”" },
  { t = "h", level = 2, text = "Jesus’ Mother and Brothers" },
  { t = "ref", text = "(Mark 3:31–35; Luke 8:19–21)" },
  { t = "v", n = 46, p = true, text = "While Jesus was still speaking to the crowds, His mother and brothers stood outside, wanting to speak to Him." },
  { t = "v", n = 47, text = "Someone told Him, “Look, Your mother and brothers are standing outside, wanting to speak to You.”[^e]" },
  { t = "v", n = 48, p = true, text = "But Jesus replied, “Who is My mother, and who are My brothers?”" },
  { t = "v", n = 49, text = "Pointing to His disciples, He said, “Here are My mother and My brothers." },
  { t = "v", n = 50, text = "For whoever does the will of My Father in heaven is My brother and sister and mother.”" },
  { t = "note", id = "a", text = "Or *the Bread of the Presence*" },
  { t = "note", id = "b", text = "Hosea 6:6" },
  { t = "note", id = "c", text = "Isaiah 42:1–4 (see also LXX)" },
  { t = "note", id = "d", text = "WH *Beezeboul*; Vulgate *Beelzebub*; also in verse 27" },
  { t = "note", id = "e", text = "WH does not include verse 47." },
]

[[section]]
id = "13"
title = "Matthew 13"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Parable of the Sower" },
  { t = "ref", text = "(Mark 4:1–9; Luke 8:4–8)" },
  { t = "v", n = 1, p = true, text = "That same day Jesus went out of the house and sat by the sea." },
  { t = "v", n = 2, text = "Such large crowds gathered around Him that He got into a boat and sat down, while all the people stood on the shore." },
  { t = "v", n = 3, p = true, text = "And He told them many things in parables, saying, “A farmer went out to sow his seed." },
  { t = "v", n = 4, text = "And as he was sowing, some seed fell along the path, and the birds came and devoured it." },
  { t = "v", n = 5, p = true, text = "Some fell on rocky ground, where it did not have much soil. It sprang up quickly because the soil was shallow." },
  { t = "v", n = 6, text = "But when the sun rose, the seedlings were scorched, and they withered because they had no root." },
  { t = "v", n = 7, p = true, text = "Other seed fell among thorns, which grew up and choked the seedlings." },
  { t = "v", n = 8, p = true, text = "Still other seed fell on good soil and produced a crop—a hundredfold, sixtyfold, or thirtyfold." },
  { t = "v", n = 9, p = true, text = "He who has ears,[^a] let him hear.”" },
  { t = "h", level = 2, text = "The Purpose of Jesus’ Parables" },
  { t = "ref", text = "(Isaiah 6:1–13; Mark 4:10–12; Luke 8:9–10)" },
  { t = "v", n = 10, p = true, text = "Then the disciples came to Jesus and asked, “Why do You speak to the people in parables?”" },
  { t = "v", n = 11, p = true, text = "He replied, “The knowledge of the mysteries of the kingdom of heaven has been given to you, but not to them." },
  { t = "v", n = 12, text = "Whoever has will be given more, and he will have an abundance. Whoever does not have, even what he has will be taken away from him." },
  { t = "v", n = 13, text = "This is why I speak to them in parables: ‘Though seeing, they do not see; though hearing, they do not hear or understand.’[^b]" },
  { t = "v", n = 14, p = true, text = "In them the prophecy of Isaiah is fulfilled: ‘You will be ever hearing but never understanding; you will be ever seeing but never perceiving." },
  { t = "v", n = 15, indent = 1, text = "For this people’s heart has grown callous; they hardly hear with their ears, and they have closed their eyes. Otherwise they might see with their eyes, hear with their ears, understand with their hearts, and turn, and I would heal them.’[^c]" },
  { t = "v", n = 16, p = true, text = "But blessed are your eyes because they see, and your ears because they hear." },
  { t = "v", n = 17, text = "For truly I tell you, many prophets and righteous men longed to see what you see but did not see it, and to hear what you hear but did not hear it." },
  { t = "h", level = 2, text = "The Parable of the Sower Explained" },
  { t = "ref", text = "(Mark 4:13–20; Luke 8:11–15)" },
  { t = "v", n = 18, p = true, text = "Consider, then, the parable of the sower:" },
  { t = "v", n = 19, text = "When anyone hears the message of the kingdom but does not understand it, the evil one comes and snatches away what was sown in his heart. This is the seed sown[^d] along the path." },
  { t = "v", n = 20, p = true, text = "The seed sown on rocky ground is the one who hears the word and at once receives it with joy." },
  { t = "v", n = 21, text = "But since he has no root, he remains for only a season. When trouble or persecution comes because of the word, he quickly falls away." },
  { t = "v", n = 22, p = true, text = "The seed sown among the thorns is the one who hears the word, but the worries of this life and the deceitfulness of wealth choke the word, and it becomes unfruitful." },
  { t = "v", n = 23, p = true, text = "But the seed sown on good soil is the one who hears the word and understands it. He indeed bears fruit and produces a crop—a hundredfold, sixtyfold, or thirtyfold.”" },
  { t = "h", level = 2, text = "The Parable of the Weeds" },
  { t = "ref", text = "(Ezekiel 17:1–10)" },
  { t = "v", n = 24, p = true, text = "Jesus put before them another parable: “The kingdom of heaven is like a man who sowed good seed in his field." },
  { t = "v", n = 25, text = "But while everyone was asleep, his enemy came and sowed weeds among the wheat, and slipped away." },
  { t = "v", n = 26, text = "When the wheat sprouted and bore grain, then the weeds also appeared." },
  { t = "v", n = 27, p = true, text = "The owner’s servants came to him and said, ‘Sir, didn’t you sow good seed in your field? Where then did the weeds come from?’" },
  { t = "v", n = 28, p = true, text = "‘An enemy did this,’ he replied. So the servants asked him, ‘Do you want us to go and pull them up?’" },
  { t = "v", n = 29, p = true, text = "‘No,’ he said, ‘if you pull the weeds now, you might uproot the wheat with them." },
  { t = "v", n = 30, text = "Let both grow together until the harvest. At that time I will tell the harvesters: First collect the weeds and tie them in bundles to be burned; then gather the wheat into my barn.’”" },
  { t = "h", level = 2, text = "The Parable of the Mustard Seed" },
  { t = "ref", text = "(Mark 4:30–34; Luke 13:18–19)" },
  { t = "v", n = 31, p = true, text = "He put before them another parable: “The kingdom of heaven is like a mustard seed that a man took and planted in his field." },
  { t = "v", n = 32, text = "Although it is the smallest of all seeds, yet it grows into the largest of garden plants and becomes a tree, so that the birds of the air come and nest in its branches.”" },
  { t = "h", level = 2, text = "The Parable of the Leaven" },
  { t = "ref", text = "(Luke 13:20–21)" },
  { t = "v", n = 33, p = true, text = "He told them still another parable: “The kingdom of heaven is like leaven that a woman took and mixed into three measures of flour, until all of it was leavened.”" },
  { t = "h", level = 2, text = "I Will Open My Mouth in Parables" },
  { t = "ref", text = "(Psalm 78:1–72)" },
  { t = "v", n = 34, p = true, text = "Jesus spoke all these things to the crowds in parables. He did not tell them anything without using a parable." },
  { t = "v", n = 35, text = "So was fulfilled what was spoken through the prophet: “I will open My mouth in parables; I will utter things hidden since the foundation of the world.”[^e]" },
  { t = "h", level = 2, text = "The Parable of the Weeds Explained" },
  { t = "ref", text = "(Zephaniah 1:1–6)" },
  { t = "v", n = 36, p = true, text = "Then Jesus dismissed the crowds and went into the house. His disciples came to Him and said, “Explain to us the parable of the weeds in the field.”" },
  { t = "v", n = 37, p = true, text = "He replied, “The One who sows the good seed is the Son of Man." },
  { t = "v", n = 38, text = "The field is the world, and the good seed represents the sons of the kingdom. The weeds are the sons of the evil one," },
  { t = "v", n = 39, text = "and the enemy who sows them is the devil. The harvest is the end of the age, and the harvesters are angels." },
  { t = "v", n = 40, p = true, text = "As the weeds are collected and burned in the fire, so will it be at the end of the age." },
  { t = "v", n = 41, text = "The Son of Man will send out His angels, and they will weed out of His kingdom every cause of sin and all who practice lawlessness." },
  { t = "v", n = 42, text = "And they will throw them into the fiery furnace, where there will be weeping and gnashing of teeth." },
  { t = "v", n = 43, text = "Then the righteous will shine like the sun in the kingdom of their Father.[^f] He who has ears, let him hear." },
  { t = "h", level = 2, text = "The Parables of the Treasure and the Pearl" },
  { t = "v", n = 44, p = true, text = "The kingdom of heaven is like treasure hidden in a field. When a man found it, he hid it again, and in his joy he went and sold all he had and bought that field." },
  { t = "v", n = 45, p = true, text = "Again, the kingdom of heaven is like a merchant in search of fine pearls." },
  { t = "v", n = 46, text = "When he found one very precious pearl, he went away and sold all he had and bought it." },
  { t = "h", level = 2, text = "The Parable of the Net" },
  { t = "v", n = 47, p = true, text = "Once again, the kingdom of heaven is like a net that was cast into the sea and caught all kinds of fish." },
  { t = "v", n = 48, text = "When it was full, the men pulled it ashore. Then they sat down and sorted the good fish into containers, but threw the bad away." },
  { t = "v", n = 49, p = true, text = "So will it be at the end of the age: The angels will come and separate the wicked from the righteous" },
  { t = "v", n = 50, text = "and throw them into the fiery furnace, where there will be weeping and gnashing of teeth." },
  { t = "v", n = 51, p = true, text = "Have you understood all these things?” “Yes,” they answered." },
  { t = "v", n = 52, p = true, text = "Then He told them, “For this reason, every scribe who has been discipled in the kingdom of heaven is like a homeowner who brings out of his storeroom new treasures as well as old.”" },
  { t = "h", level = 2, text = "The Rejection at Nazareth" },
  { t = "ref", text = "(Mark 6:1–6; Luke 4:16–30)" },
  { t = "v", n = 53, p = true, text = "When Jesus had finished these parables, He withdrew from that place." },
  { t = "v", n = 54, text = "Coming to His hometown, He taught the people in their synagogue, and they were astonished. “Where did this man get such wisdom and miraculous powers?” they asked." },
  { t = "v", n = 55, text = "“Isn’t this the carpenter’s son? Isn’t His mother’s name Mary, and aren’t His brothers James, Joseph,[^g] Simon, and Judas?" },
  { t = "v", n = 56, text = "Aren’t all His sisters with us as well? Where then did this man get all these things?”" },
  { t = "v", n = 57, text = "And they took offense at Him. But Jesus said to them, “Only in his hometown and in his own household is a prophet without honor.”" },
  { t = "v", n = 58, text = "And He did not do many miracles there, because of their unbelief." },
  { t = "note", id = "a", text = "BYZ and TR *ears to hear*; also in verse 43" },
  { t = "note", id = "b", text = "See Deuteronomy 29:4, Isaiah 42:20, Jeremiah 5:21, and Ezekiel 12:2." },
  { t = "note", id = "c", text = "Isaiah 6:9–10 (see also LXX)" },
  { t = "note", id = "d", text = "Literally *the one sown*; also in verses 20, 22, and 23" },
  { t = "note", id = "e", text = "Psalm 78:2 (see also LXX); SBL, NE, and WH do not include *of the world*." },
  { t = "note", id = "f", text = "See Daniel 12:3." },
  { t = "note", id = "g", text = "BYZ and TR *Joses*; see Mark 6:3." },
]

[[section]]
id = "14"
title = "Matthew 14"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Beheading of John" },
  { t = "ref", text = "(Mark 6:14–29; Luke 9:7–9)" },
  { t = "v", n = 1, p = true, text = "At that time Herod the tetrarch heard the reports about Jesus" },
  { t = "v", n = 2, text = "and said to his servants, “This is John the Baptist; he has risen from the dead! That is why miraculous powers are at work in him.”" },
  { t = "v", n = 3, p = true, text = "Now Herod had arrested John and bound him and put him in prison on account of Herodias, his brother Philip’s wife," },
  { t = "v", n = 4, text = "because John had been telling him, “It is not lawful for you to have her.”" },
  { t = "v", n = 5, text = "Although Herod wanted to kill John, he was afraid of the people, because they regarded John as a prophet." },
  { t = "v", n = 6, p = true, text = "On Herod’s birthday, however, the daughter of Herodias danced before them and pleased Herod" },
  { t = "v", n = 7, text = "so much that he promised with an oath to give to her whatever she asked." },
  { t = "v", n = 8, p = true, text = "Prompted by her mother, she said, “Give me here on a platter the head of John the Baptist.”" },
  { t = "v", n = 9, p = true, text = "The king was grieved, but because of his oaths and his guests, he ordered that her wish be granted" },
  { t = "v", n = 10, text = "and sent to have John beheaded in the prison." },
  { t = "v", n = 11, p = true, text = "John’s head was brought in on a platter and presented to the girl, who carried it to her mother." },
  { t = "v", n = 12, p = true, text = "Then John’s disciples came and took his body and buried it. And they went and informed Jesus." },
  { t = "h", level = 2, text = "The Feeding of the Five Thousand" },
  { t = "ref", text = "(Mark 6:30–44; Luke 9:10–17; John 6:1–15)" },
  { t = "v", n = 13, p = true, text = "When Jesus heard about John, He withdrew by boat privately to a solitary place. But the crowds found out about it and followed Him on foot from the towns." },
  { t = "v", n = 14, text = "When He stepped ashore and saw a large crowd, He had compassion on them and healed their sick." },
  { t = "v", n = 15, p = true, text = "When evening came, the disciples came to Him and said, “This is a desolate place, and the hour is already late. Dismiss the crowds so they can go to the villages and buy themselves some food.”" },
  { t = "v", n = 16, p = true, text = "“They do not need to go away,” Jesus replied. “You give them something to eat.”" },
  { t = "v", n = 17, p = true, text = "“We have here only five loaves of bread and two fish,” they answered." },
  { t = "v", n = 18, p = true, text = "“Bring them here to Me,” Jesus said." },
  { t = "v", n = 19, text = "And He directed the crowds to sit down on the grass. Taking the five loaves and the two fish and looking up to heaven, He spoke a blessing. Then He broke the loaves and gave them to the disciples, and the disciples gave them to the people." },
  { t = "v", n = 20, p = true, text = "They all ate and were satisfied, and the disciples picked up twelve basketfuls of broken pieces that were left over." },
  { t = "v", n = 21, text = "About five thousand men were fed, besides women and children." },
  { t = "h", level = 2, text = "Jesus Walks on Water" },
  { t = "ref", text = "(Mark 6:45–52; John 6:16–21)" },
  { t = "v", n = 22, p = true, text = "Immediately Jesus made the disciples get into the boat and go on ahead of Him to the other side, while He dismissed the crowds." },
  { t = "v", n = 23, text = "After He had dismissed them, He went up on the mountain by Himself to pray. When evening came, He was there alone," },
  { t = "v", n = 24, text = "but the boat was already far[^a] from land, buffeted by the waves because the wind was against it." },
  { t = "v", n = 25, p = true, text = "During the fourth watch of the night,[^b] Jesus went out to them, walking on the sea." },
  { t = "v", n = 26, text = "When the disciples saw Him walking on the sea, they were terrified. “It’s a ghost!” they said, and cried out in fear." },
  { t = "v", n = 27, p = true, text = "But Jesus spoke up at once: “Take courage! It is I. Do not be afraid.”" },
  { t = "v", n = 28, p = true, text = "“Lord, if it is You,” Peter replied, “command me to come to You on the water.”" },
  { t = "v", n = 29, p = true, text = "“Come,” said Jesus. Then Peter got down out of the boat, walked on the water, and came toward Jesus." },
  { t = "v", n = 30, text = "But when he saw the strength of the wind,[^c] he was afraid and, beginning to sink, cried out, “Lord, save me!”" },
  { t = "v", n = 31, p = true, text = "Immediately Jesus reached out His hand and took hold of Peter. “You of little faith,” He said, “why did you doubt?”" },
  { t = "v", n = 32, p = true, text = "And when they had climbed back into the boat, the wind died down." },
  { t = "v", n = 33, text = "Then those who were in the boat worshiped Him, saying, “Truly You are the Son of God!”" },
  { t = "h", level = 2, text = "Jesus Heals at Gennesaret" },
  { t = "ref", text = "(Mark 6:53–56)" },
  { t = "v", n = 34, p = true, text = "When they had crossed over, they landed at Gennesaret." },
  { t = "v", n = 35, text = "And when the men of that place recognized Jesus, they sent word to all the surrounding region. People brought all the sick to Him" },
  { t = "v", n = 36, text = "and begged Him just to let them touch the fringe of His cloak. And all who touched Him were healed." },
  { t = "note", id = "a", text = "Greek *many stadia*; a stadion was about 607 feet or 185 meters" },
  { t = "note", id = "b", text = "That is, between three and six in the morning" },
  { t = "note", id = "c", text = "Literally *when he saw the strong wind*; NE and WH do not include *strong*." },
]

[[section]]
id = "15"
title = "Matthew 15"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Tradition of the Elders" },
  { t = "ref", text = "(Mark 7:1–13)" },
  { t = "v", n = 1, p = true, text = "Then some Pharisees and scribes came to Jesus from Jerusalem and asked," },
  { t = "v", n = 2, text = "“Why do Your disciples break the tradition of the elders? They do not wash their hands before they eat.”" },
  { t = "v", n = 3, p = true, text = "Jesus replied, “And why do you break the command of God for the sake of your tradition?" },
  { t = "v", n = 4, text = "For God said, ‘Honor your father and mother’[^a] and ‘Anyone who curses his father or mother must be put to death.’[^b]" },
  { t = "v", n = 5, text = "But you say that if anyone says to his father or mother, ‘Whatever you would have received from me is a gift devoted to God,’" },
  { t = "v", n = 6, text = "he need not honor his father or mother with it.[^c] Thus you nullify the word of God for the sake of your tradition." },
  { t = "v", n = 7, text = "You hypocrites! Isaiah prophesied correctly about you:" },
  { t = "v", n = 8, indent = 1, text = "‘These people honor Me with their lips, but their hearts are far from Me." },
  { t = "v", n = 9, indent = 1, text = "They worship Me in vain; they teach as doctrine the precepts of men.’[^d]”" },
  { t = "h", level = 2, text = "What Defiles a Man" },
  { t = "ref", text = "(Mark 7:14–23)" },
  { t = "v", n = 10, p = true, text = "Jesus called the crowd to Him and said, “Listen and understand." },
  { t = "v", n = 11, text = "A man is not defiled by what enters his mouth, but by what comes out of it.”" },
  { t = "v", n = 12, p = true, text = "Then the disciples came to Him and said, “Are You aware that the Pharisees were offended when they heard this?”" },
  { t = "v", n = 13, p = true, text = "But Jesus replied, “Every plant that My heavenly Father has not planted will be pulled up by its roots." },
  { t = "v", n = 14, text = "Disregard them! They are blind guides.[^e] If a blind man leads a blind man, both will fall into a pit.”" },
  { t = "v", n = 15, p = true, text = "Peter said to Him, “Explain this parable to us.”" },
  { t = "v", n = 16, p = true, text = "“Do you still not understand?” Jesus asked." },
  { t = "v", n = 17, text = "“Do you not yet realize that whatever enters the mouth goes into the stomach and then is eliminated?" },
  { t = "v", n = 18, text = "But the things that come out of the mouth come from the heart, and these things defile a man." },
  { t = "v", n = 19, text = "For out of the heart come evil thoughts, murder, adultery, sexual immorality, theft, false testimony, and slander." },
  { t = "v", n = 20, text = "These are what defile a man, but eating with unwashed hands does not defile him.”" },
  { t = "h", level = 2, text = "The Faith of the Canaanite Woman" },
  { t = "ref", text = "(Mark 7:24–30)" },
  { t = "v", n = 21, p = true, text = "Leaving that place, Jesus withdrew to the district of Tyre and Sidon." },
  { t = "v", n = 22, text = "And a Canaanite woman from that region came to Him, crying out, “Lord, Son of David, have mercy on me! My daughter is miserably possessed by a demon.”" },
  { t = "v", n = 23, p = true, text = "But Jesus did not answer a word. So His disciples came and urged Him, “Send her away, for she keeps crying out after us.”" },
  { t = "v", n = 24, p = true, text = "He answered, “I was sent only to the lost sheep of the house of Israel.”" },
  { t = "v", n = 25, p = true, text = "The woman came and knelt before Him. “Lord, help me!” she said." },
  { t = "v", n = 26, p = true, text = "But Jesus replied, “It is not right to take the children’s bread and toss it to the dogs.”" },
  { t = "v", n = 27, p = true, text = "“Yes, Lord,” she said, “even the dogs[^f] eat the crumbs that fall from their master’s table.”" },
  { t = "v", n = 28, p = true, text = "“O woman,” Jesus answered, “your faith is great! Let it be done for you as you desire.” And her daughter was healed from that very hour." },
  { t = "h", level = 2, text = "The Feeding of the Four Thousand" },
  { t = "ref", text = "(2 Kings 4:42–44; Mark 8:1–10)" },
  { t = "v", n = 29, p = true, text = "Moving on from there, Jesus went along the Sea of Galilee. Then He went up on a mountain and sat down." },
  { t = "v", n = 30, text = "Large crowds came to Him, bringing the lame, the blind, the crippled, the mute, and many others, and laid them at His feet, and He healed them." },
  { t = "v", n = 31, text = "The crowd was amazed when they saw the mute speaking, the crippled restored, the lame walking, and the blind seeing. And they glorified the God of Israel." },
  { t = "v", n = 32, p = true, text = "Then Jesus called His disciples to Him and said, “I have compassion for this crowd, because they have already been with Me three days and have nothing to eat. I do not want to send them away hungry, or they may faint along the way.”" },
  { t = "v", n = 33, p = true, text = "The disciples replied, “Where in this desolate place could we find enough bread to feed such a large crowd?”" },
  { t = "v", n = 34, p = true, text = "“How many loaves do you have?” Jesus asked. “Seven,” they replied, “and a few small fish.”" },
  { t = "v", n = 35, p = true, text = "And He instructed the crowd to sit down on the ground." },
  { t = "v", n = 36, text = "Taking the seven loaves and the fish, He gave thanks and broke them. Then He gave them to the disciples, and the disciples gave them to the people." },
  { t = "v", n = 37, p = true, text = "They all ate and were satisfied, and the disciples picked up seven basketfuls of broken pieces that were left over." },
  { t = "v", n = 38, text = "A total of four thousand men were fed, besides women and children." },
  { t = "v", n = 39, p = true, text = "After Jesus had dismissed the crowds, He got into the boat and went to the region of Magadan." },
  { t = "note", id = "a", text = "Exodus 20:12; Deuteronomy 5:16" },
  { t = "note", id = "b", text = "Exodus 21:17; Leviticus 20:9" },
  { t = "note", id = "c", text = "NE and TR (see also Mark 7:12); literally *he need not honor his father or mother*; SBL, NA, WH, and BYZ do not include *or mother*." },
  { t = "note", id = "d", text = "Isaiah 29:13 (see also LXX)" },
  { t = "note", id = "e", text = "Or *blind guides of the blind*" },
  { t = "note", id = "f", text = "Or *puppies*" },
]

[[section]]
id = "16"
title = "Matthew 16"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Demand for a Sign" },
  { t = "ref", text = "(Mark 8:11–13; Luke 12:54–56)" },
  { t = "v", n = 1, p = true, text = "Then the Pharisees and Sadducees came and tested Jesus by asking Him to show them a sign from heaven." },
  { t = "v", n = 2, p = true, text = "But He replied, “When evening comes, you say, ‘The weather will be fair, for the sky is red,’" },
  { t = "v", n = 3, text = "and in the morning, ‘Today it will be stormy, for the sky is red and overcast.’ You know how to interpret the appearance of the sky, but not the signs of the times.[^a]" },
  { t = "v", n = 4, text = "A wicked and adulterous generation demands a sign, but none will be given it except the sign of Jonah.” Then He left them and went away." },
  { t = "h", level = 2, text = "The Leaven of the Pharisees and Sadducees" },
  { t = "ref", text = "(Mark 8:14–21; Luke 12:1–3)" },
  { t = "v", n = 5, p = true, text = "When they crossed to the other side, the disciples forgot to take bread." },
  { t = "v", n = 6, text = "“Watch out!” Jesus told them. “Beware of the leaven of the Pharisees and Sadducees.”" },
  { t = "v", n = 7, p = true, text = "They discussed this among themselves and concluded, “It is because we did not bring any bread.”" },
  { t = "v", n = 8, p = true, text = "Aware of their conversation, Jesus said, “You of little faith, why are you debating among yourselves about having no bread?" },
  { t = "v", n = 9, text = "Do you still not understand? Do you not remember the five loaves for the five thousand, and how many basketfuls you gathered?" },
  { t = "v", n = 10, text = "Or the seven loaves for the four thousand, and how many basketfuls you gathered?" },
  { t = "v", n = 11, text = "How do you not understand that I was not telling you about bread? But beware of the leaven of the Pharisees and Sadducees.”" },
  { t = "v", n = 12, p = true, text = "Then they understood that He was not telling them to beware of the leaven used in bread, but of the teaching of the Pharisees and Sadducees." },
  { t = "h", level = 2, text = "Peter’s Confession of Christ" },
  { t = "ref", text = "(Mark 8:27–30; Luke 9:18–20; John 6:67–71)" },
  { t = "v", n = 13, p = true, text = "When Jesus came to the region of Caesarea Philippi, He questioned His disciples: “Who do people say the Son of Man is?”" },
  { t = "v", n = 14, p = true, text = "They replied, “Some say John the Baptist; others say Elijah; and still others, Jeremiah or one of the prophets.”" },
  { t = "v", n = 15, p = true, text = "“But what about you?” Jesus asked. “Who do you say I am?”" },
  { t = "v", n = 16, p = true, text = "Simon Peter answered, “You are the Christ, the Son of the living God.”" },
  { t = "v", n = 17, p = true, text = "Jesus replied, “Blessed are you, Simon son of Jonah![^b] For this was not revealed to you by flesh and blood, but by My Father in heaven." },
  { t = "v", n = 18, text = "And I tell you that you are Peter, and on this rock I will build My church, and the gates of Hades will not prevail against it." },
  { t = "v", n = 19, text = "I will give you the keys of the kingdom of heaven. Whatever you bind on earth will be bound in heaven, and whatever you loose on earth will be loosed in heaven.”" },
  { t = "v", n = 20, p = true, text = "Then He admonished the disciples not to tell anyone that He was the Christ." },
  { t = "h", level = 2, text = "Christ’s Passion Foretold" },
  { t = "ref", text = "(Mark 8:31–33; Luke 9:21–22)" },
  { t = "v", n = 21, p = true, text = "From that time on Jesus[^c] began to show His disciples that He must go to Jerusalem and suffer many things at the hands of the elders, chief priests, and scribes, and that He must be killed and on the third day be raised to life." },
  { t = "v", n = 22, p = true, text = "Peter took Him aside and began to rebuke Him. “Far be it from You, Lord!” he said. “This shall never happen to You!”" },
  { t = "v", n = 23, p = true, text = "But Jesus turned and said to Peter, “Get behind Me, Satan! You are a stumbling block to Me. For you do not have in mind the things of God, but the things of men.”" },
  { t = "h", level = 2, text = "Take Up Your Cross" },
  { t = "ref", text = "(Mark 8:34–38; Luke 9:23–27)" },
  { t = "v", n = 24, p = true, text = "Then Jesus told His disciples, “If anyone wants to come after Me, he must deny himself and take up his cross and follow Me." },
  { t = "v", n = 25, text = "For whoever wants to save his life will lose it, but whoever loses his life for My sake will find it." },
  { t = "v", n = 26, text = "What will it profit a man if he gains the whole world, yet forfeits his soul? Or what can a man give in exchange for his soul?" },
  { t = "v", n = 27, text = "For the Son of Man will come in His Father’s glory with His angels, and then He will repay each one according to what he has done." },
  { t = "v", n = 28, p = true, text = "Truly I tell you, some who are standing here will not taste death before they see the Son of Man coming in His kingdom.”" },
  { t = "note", id = "a", text = "Several manuscripts do not include *When evening comes... of the times.* from verses 2 and 3." },
  { t = "note", id = "b", text = "Greek *Simon Bar-Jonah*" },
  { t = "note", id = "c", text = "NE and WH *Jesus Christ*" },
]

[[section]]
id = "17"
title = "Matthew 17"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Transfiguration" },
  { t = "ref", text = "(Mark 9:1–13; Luke 9:28–36; 2 Peter 1:16–21)" },
  { t = "v", n = 1, p = true, text = "After six days Jesus took with Him Peter, James, and John the brother of James, and led them up a high mountain by themselves." },
  { t = "v", n = 2, text = "There He was transfigured before them. His face shone like the sun, and His clothes became as white as the light." },
  { t = "v", n = 3, p = true, text = "Suddenly Moses and Elijah appeared before them, talking with Jesus." },
  { t = "v", n = 4, text = "Peter said to Jesus, “Lord, it is good for us to be here. If You wish, I will put up three shelters[^a]—one for You, one for Moses, and one for Elijah.”" },
  { t = "v", n = 5, p = true, text = "While Peter was still speaking, a bright cloud enveloped them, and a voice from the cloud said, “This is My beloved Son, in whom I am well pleased.[^b] Listen to Him!”" },
  { t = "v", n = 6, text = "When the disciples heard this, they fell facedown in terror." },
  { t = "v", n = 7, p = true, text = "Then Jesus came over and touched them. “Get up,” He said. “Do not be afraid.”" },
  { t = "v", n = 8, text = "And when they looked up, they saw no one except Jesus." },
  { t = "v", n = 9, p = true, text = "As they were coming down the mountain, Jesus commanded them, “Do not tell anyone about this vision until the Son of Man has been raised from the dead.”" },
  { t = "v", n = 10, p = true, text = "The disciples asked Him, “Why then do the scribes say that Elijah must come first?”" },
  { t = "v", n = 11, p = true, text = "Jesus replied, “Elijah does indeed come, and he will restore all things." },
  { t = "v", n = 12, text = "But I tell you that Elijah has already come, and they did not recognize him, but have done to him whatever they wished. In the same way, the Son of Man will suffer at their hands.”" },
  { t = "v", n = 13, p = true, text = "Then the disciples understood that He was speaking to them about John the Baptist." },
  { t = "h", level = 2, text = "The Boy with a Demon" },
  { t = "ref", text = "(Mark 9:14–29; Luke 9:37–42)" },
  { t = "v", n = 14, p = true, text = "When they came to the crowd, a man came up to Jesus and knelt before Him." },
  { t = "v", n = 15, text = "“Lord, have mercy on my son,” he said. “He has seizures and is suffering terribly. He often falls into the fire or into the water." },
  { t = "v", n = 16, text = "I brought him to Your disciples, but they could not heal him.”" },
  { t = "v", n = 17, p = true, text = "“O unbelieving and perverse generation!” Jesus replied. “How long must I remain with you? How long must I put up with you? Bring the boy here to Me.”" },
  { t = "v", n = 18, text = "Then Jesus rebuked the demon, and it came out of the boy, and he was healed from that moment." },
  { t = "h", level = 2, text = "The Power of Faith" },
  { t = "ref", text = "(Luke 17:5–10)" },
  { t = "v", n = 19, p = true, text = "Afterward the disciples came to Jesus privately and asked, “Why couldn’t we drive it out?”" },
  { t = "v", n = 20, p = true, text = "“Because you have so little faith,” He answered. “For truly I tell you, if you have faith the size of a mustard seed, you can say to this mountain, ‘Move from here to there,’ and it will move. Nothing will be impossible for you.”[^c]" },
  { t = "h", level = 2, text = "The Second Prediction of the Passion" },
  { t = "ref", text = "(Mark 9:30–32; Luke 9:43–45)" },
  { t = "v", n = 22, p = true, text = "When they gathered together in Galilee, Jesus told them, “The Son of Man is about to be delivered into the hands of men." },
  { t = "v", n = 23, text = "They will kill Him, and on the third day He will be raised to life.” And the disciples were deeply grieved." },
  { t = "h", level = 2, text = "The Temple Tax" },
  { t = "v", n = 24, p = true, text = "After they had arrived in Capernaum, the collectors of the two-drachma tax[^d] came to Peter and asked, “Does your Teacher pay the two drachmas?”" },
  { t = "v", n = 25, p = true, text = "“Yes,” he answered. When Peter entered the house, Jesus preempted him. “What do you think, Simon?” He asked. “From whom do the kings of the earth collect customs and taxes: from their own sons, or from others?”" },
  { t = "v", n = 26, p = true, text = "“From others,” Peter answered. “Then the sons are exempt,” Jesus said to him." },
  { t = "v", n = 27, text = "“But so that we may not offend them, go to the sea, cast a hook, and take the first fish you catch. When you open its mouth, you will find a four-drachma coin.[^e] Take it and give it to them for My tax and yours.”" },
  { t = "note", id = "a", text = "Or *three tabernacles*" },
  { t = "note", id = "b", text = "Cited in 2 Peter 1:17" },
  { t = "note", id = "c", text = "BYZ and TR include *(21) But this kind does not come out except by prayer and fasting*; see Mark 9:29." },
  { t = "note", id = "d", text = "Greek *the didrachma*; twice in this verse" },
  { t = "note", id = "e", text = "Greek *a stater*; that is, a silver coin worth approximately one shekel" },
]

[[section]]
id = "18"
title = "Matthew 18"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Greatest in the Kingdom" },
  { t = "ref", text = "(Mark 9:33–41; Luke 9:46–50)" },
  { t = "v", n = 1, p = true, text = "At that time the disciples came to Jesus and asked, “Who then is the greatest in the kingdom of heaven?”" },
  { t = "v", n = 2, p = true, text = "Jesus invited a little child to stand among them." },
  { t = "v", n = 3, text = "“Truly I tell you,” He said, “unless you change and become like little children, you will never enter the kingdom of heaven." },
  { t = "v", n = 4, text = "Therefore, whoever humbles himself like this little child is the greatest in the kingdom of heaven." },
  { t = "v", n = 5, text = "And whoever welcomes a little child like this in My name welcomes Me." },
  { t = "h", level = 2, text = "Temptations and Trespasses" },
  { t = "ref", text = "(Mark 9:42–48; Luke 17:1–4)" },
  { t = "v", n = 6, p = true, text = "But if anyone causes one of these little ones who believe in Me to stumble, it would be better for him to have a large millstone hung around his neck and to be drowned in the depths of the sea." },
  { t = "v", n = 7, p = true, text = "Woe to the world for the causes of sin. These stumbling blocks must come, but woe to the man through whom they come!" },
  { t = "v", n = 8, p = true, text = "If your hand or your foot causes you to sin, cut it off and throw it away. It is better for you to enter life crippled or lame than to have two hands and two feet and be thrown into the eternal fire." },
  { t = "v", n = 9, text = "And if your eye causes you to sin, gouge it out and throw it away. It is better for you to enter life with one eye than to have two eyes and be thrown into the fire of hell.[^a]" },
  { t = "h", level = 2, text = "The Parable of the Lost Sheep" },
  { t = "ref", text = "(Luke 15:1–7)" },
  { t = "v", n = 10, p = true, text = "See that you do not look down on any of these little ones. For I tell you that their angels in heaven always see the face of My Father in heaven.[^b]" },
  { t = "v", n = 12, p = true, text = "What do you think? If a man has a hundred sheep and one of them goes astray, will he not leave the ninety-nine on the hills and go out to search for the one that is lost?" },
  { t = "v", n = 13, text = "And if he finds it, truly I tell you, he rejoices more over that one sheep than over the ninety-nine that did not go astray." },
  { t = "v", n = 14, text = "In the same way, your Father in heaven is not willing that any of these little ones should perish." },
  { t = "h", level = 2, text = "A Brother Who Sins" },
  { t = "ref", text = "(Deuteronomy 19:15–21)" },
  { t = "v", n = 15, p = true, text = "If your brother sins against you,[^c] go and confront him privately. If he listens to you, you have won your brother over." },
  { t = "v", n = 16, text = "But if he will not listen, take one or two others along, so that ‘every matter may be established by the testimony of two or three witnesses.’[^d]" },
  { t = "v", n = 17, text = "If he refuses to listen to them, tell it to the church. And if he refuses to listen even to the church, regard him as you would a pagan or a tax collector." },
  { t = "v", n = 18, p = true, text = "Truly I tell you, whatever you bind on earth will be bound in heaven, and whatever you loose on earth will be loosed in heaven." },
  { t = "h", level = 2, text = "Ask in My Name" },
  { t = "ref", text = "(John 16:23–33)" },
  { t = "v", n = 19, p = true, text = "Again, I tell you truly that if two of you on the earth agree about anything you ask for, it will be done for you by My Father in heaven." },
  { t = "v", n = 20, text = "For where two or three gather together in My name, there am I with them.”" },
  { t = "h", level = 2, text = "The Unforgiving Servant" },
  { t = "ref", text = "(Romans 12:14–21)" },
  { t = "v", n = 21, p = true, text = "Then Peter came to Jesus and asked, “Lord, how many times shall I forgive my brother who sins against me? Up to seven times?”" },
  { t = "v", n = 22, p = true, text = "Jesus answered, “I tell you, not just seven times, but seventy-seven times![^e]" },
  { t = "v", n = 23, p = true, text = "Because of this, the kingdom of heaven is like a king who wanted to settle accounts with his servants." },
  { t = "v", n = 24, text = "As he began the settlements, a debtor owing ten thousand talents[^f] was brought to him." },
  { t = "v", n = 25, text = "Since the man was unable to pay, the master ordered that he be sold to pay his debt, along with his wife and children and everything he owned." },
  { t = "v", n = 26, p = true, text = "Then the servant fell on his knees before him. ‘Have patience with me,’ he begged, ‘and I will pay back everything.’" },
  { t = "v", n = 27, p = true, text = "His master had compassion on him, forgave his debt, and released him." },
  { t = "v", n = 28, p = true, text = "But when that servant went out, he found one of his fellow servants who owed him a hundred denarii.[^g] He grabbed him and began to choke him, saying, ‘Pay back what you owe me!’" },
  { t = "v", n = 29, p = true, text = "So his fellow servant fell down and begged him, ‘Have patience with me, and I will pay you back.’" },
  { t = "v", n = 30, p = true, text = "But he refused. Instead, he went and had the man thrown into prison until he could pay his debt." },
  { t = "v", n = 31, p = true, text = "When his fellow servants saw what had happened, they were greatly distressed, and they went and recounted all of this to their master." },
  { t = "v", n = 32, p = true, text = "Then the master summoned him and said, ‘You wicked servant! I forgave all your debt because you begged me." },
  { t = "v", n = 33, text = "Shouldn’t you have had mercy on your fellow servant, just as I had on you?’" },
  { t = "v", n = 34, text = "In anger his master turned him over to the jailers to be tortured, until he should repay all that he owed." },
  { t = "v", n = 35, p = true, text = "That is how My heavenly Father will treat each of you unless you forgive your brother from your heart.”" },
  { t = "note", id = "a", text = "Or *the hell of fire*; Greek *the Gehenna of fire*" },
  { t = "note", id = "b", text = "BYZ and TR include *(11) For the Son of Man came to save the lost*; see Luke 19:10." },
  { t = "note", id = "c", text = "NE and WH do not include *against you*." },
  { t = "note", id = "d", text = "Deuteronomy 19:15" },
  { t = "note", id = "e", text = "Or *seventy times seven*; see Genesis 4:24 LXX" },
  { t = "note", id = "f", text = "A talent was worth about twenty years’ wages for a laborer." },
  { t = "note", id = "g", text = "A denarius was customarily a day’s wage for a laborer; see Matthew 20:2." },
]

[[section]]
id = "19"
title = "Matthew 19"
level = 1
blocks = [
  { t = "h", level = 2, text = "Teachings about Divorce" },
  { t = "ref", text = "(Mark 10:1–12)" },
  { t = "v", n = 1, p = true, text = "When Jesus had finished saying these things, He left Galilee and went into the region of Judea beyond the Jordan." },
  { t = "v", n = 2, text = "Large crowds followed Him, and He healed them there." },
  { t = "v", n = 3, p = true, text = "Then some Pharisees came and tested Him by asking, “Is it lawful for a man to divorce his wife for any reason?”" },
  { t = "v", n = 4, p = true, text = "Jesus answered, “Have you not read that from the beginning the Creator ‘made them male and female,’[^a]" },
  { t = "v", n = 5, text = "and said, ‘For this reason a man will leave his father and mother and be united to his wife, and the two will become one flesh’[^b]?" },
  { t = "v", n = 6, text = "So they are no longer two, but one flesh. Therefore what God has joined together, let man not separate.”" },
  { t = "v", n = 7, p = true, text = "“Why then,” they asked, “did Moses order a man to give his wife a certificate of divorce and send her away?[^c]”" },
  { t = "v", n = 8, p = true, text = "Jesus replied, “Moses permitted you to divorce your wives because of your hardness of heart. But it was not this way from the beginning." },
  { t = "v", n = 9, text = "Now I tell you that whoever divorces his wife, except for sexual immorality, and marries another woman commits adultery.[^d]”" },
  { t = "v", n = 10, p = true, text = "His disciples said to Him, “If this is the case between a man and his wife, it is better not to marry.”" },
  { t = "v", n = 11, p = true, text = "“Not everyone can accept this word,” He replied, “but only those to whom it has been given." },
  { t = "v", n = 12, text = "For there are eunuchs who were born that way; others were made that way by men; and still others live like eunuchs for the sake of the kingdom of heaven. The one who can accept this should accept it.”" },
  { t = "h", level = 2, text = "Jesus Blesses the Children" },
  { t = "ref", text = "(Mark 10:13–16; Luke 18:15–17)" },
  { t = "v", n = 13, p = true, text = "Then little children were brought to Jesus for Him to place His hands on them and pray for them. And the disciples rebuked those who brought them." },
  { t = "v", n = 14, text = "But Jesus said, “Let the little children come to Me, and do not hinder them! For the kingdom of heaven belongs to such as these.”" },
  { t = "v", n = 15, text = "And after He had placed His hands on them, He went on from there." },
  { t = "h", level = 2, text = "The Rich Young Man" },
  { t = "ref", text = "(Mark 10:17–31; Luke 18:18–30)" },
  { t = "v", n = 16, p = true, text = "Just then a man came up to Jesus and inquired, “Teacher, what good thing must I do to obtain eternal life?”" },
  { t = "v", n = 17, p = true, text = "“Why do you ask Me about what is good?”[^e] Jesus replied. “There is only One who is good. If you want to enter life, keep the commandments.”" },
  { t = "v", n = 18, p = true, text = "“Which ones?” the man asked. Jesus answered, “‘Do not murder, do not commit adultery, do not steal, do not bear false witness," },
  { t = "v", n = 19, text = "honor your father and mother, and love your neighbor as yourself.’[^f]”" },
  { t = "v", n = 20, p = true, text = "“All these I have kept,” said the young man. “What do I still lack?”" },
  { t = "v", n = 21, p = true, text = "Jesus told him, “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven. Then come, follow Me.”" },
  { t = "v", n = 22, p = true, text = "When the young man heard this, he went away in sorrow, because he had great wealth." },
  { t = "v", n = 23, p = true, text = "Then Jesus said to His disciples, “Truly I tell you, it is hard for a rich man to enter the kingdom of heaven." },
  { t = "v", n = 24, text = "Again I tell you, it is easier for a camel to pass through the eye of a needle than for a rich man to enter the kingdom of God.”" },
  { t = "v", n = 25, p = true, text = "When the disciples heard this, they were greatly astonished and asked, “Who then can be saved?”" },
  { t = "v", n = 26, p = true, text = "Jesus looked at them and said, “With man this is impossible, but with God all things are possible.”" },
  { t = "v", n = 27, p = true, text = "“Look,” Peter replied, “we have left everything to follow You. What then will there be for us?”" },
  { t = "v", n = 28, p = true, text = "Jesus said to them, “Truly I tell you, in the renewal of all things,[^g] when the Son of Man sits on His glorious throne, you who have followed Me will also sit on twelve thrones, judging the twelve tribes of Israel." },
  { t = "v", n = 29, text = "And everyone who has left houses or brothers or sisters or father or mother or wife[^h] or children or fields for the sake of My name will receive a hundredfold and will inherit eternal life." },
  { t = "v", n = 30, text = "But many who are first will be last, and the last will be first." },
  { t = "note", id = "a", text = "Genesis 1:27; Genesis 5:2" },
  { t = "note", id = "b", text = "Genesis 2:24 (see also LXX)" },
  { t = "note", id = "c", text = "See Deuteronomy 24:1." },
  { t = "note", id = "d", text = "SBL and BYZ include *And he who marries a divorced woman commits adultery*; see Matthew 5:32." },
  { t = "note", id = "e", text = "BYZ and TR *(16) ...“Good Teacher, what good thing must I do to obtain eternal life?” (17) “Why do you call Me good?”*See Mark 10:17–18 and Luke 18:18–19." },
  { t = "note", id = "f", text = "Exodus 20:12–16; Leviticus 19:18; Deuteronomy 5:16–20" },
  { t = "note", id = "g", text = "Or *in the regeneration*" },
  { t = "note", id = "h", text = "NE, WH, and NA do not include *or wife*." },
]

[[section]]
id = "20"
title = "Matthew 20"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Parable of the Workers" },
  { t = "v", n = 1, p = true, text = "“For the kingdom of heaven is like a landowner who went out early in the morning to hire workers for his vineyard." },
  { t = "v", n = 2, text = "He agreed to pay them a denarius[^a] for the day and sent them into his vineyard." },
  { t = "v", n = 3, p = true, text = "About the third hour[^b] he went out and saw others standing in the marketplace doing nothing." },
  { t = "v", n = 4, text = "‘You also go into my vineyard,’ he said, ‘and I will pay you whatever is right.’" },
  { t = "v", n = 5, text = "So they went. He went out again about the sixth hour and the ninth hour[^c] and did the same thing." },
  { t = "v", n = 6, p = true, text = "About the eleventh hour[^d] he went out and found still others standing around. ‘Why have you been standing here all day long doing nothing?’ he asked." },
  { t = "v", n = 7, p = true, text = "‘Because no one has hired us,’ they answered. So he told them, ‘You also go into my vineyard.’[^e]" },
  { t = "v", n = 8, p = true, text = "When evening came, the owner of the vineyard said to his foreman, ‘Call the workers and pay them their wages, starting with the last ones hired and moving on to the first.’" },
  { t = "v", n = 9, p = true, text = "The workers who were hired about the eleventh hour came and each received a denarius." },
  { t = "v", n = 10, text = "So when the original workers came, they assumed they would receive more. But each of them also received a denarius." },
  { t = "v", n = 11, p = true, text = "On receiving their pay, they began to grumble against the landowner." },
  { t = "v", n = 12, text = "‘These men who were hired last worked only one hour,’ they said, ‘and you have made them equal to us who have borne the burden and the scorching heat of the day.’" },
  { t = "v", n = 13, p = true, text = "But he answered one of them, ‘Friend, I am not being unfair to you. Did you not agree with me on one denarius?" },
  { t = "v", n = 14, text = "Take your pay and go. I want to give this last man the same as I gave you." },
  { t = "v", n = 15, text = "Do I not have the right to do as I please with what is mine? Or are you envious because I am generous?’" },
  { t = "v", n = 16, p = true, text = "So the last will be first, and the first will be last.”[^f]" },
  { t = "h", level = 2, text = "The Third Prediction of the Passion" },
  { t = "ref", text = "(Mark 10:32–34; Luke 18:31–34)" },
  { t = "v", n = 17, p = true, text = "As Jesus was going up to Jerusalem, He took the twelve disciples aside and said," },
  { t = "v", n = 18, text = "“Look, we are going up to Jerusalem, and the Son of Man will be delivered over to the chief priests and scribes. They will condemn Him to death" },
  { t = "v", n = 19, text = "and will deliver Him over to the Gentiles to be mocked and flogged and crucified. And on the third day He will be raised to life.”" },
  { t = "h", level = 2, text = "A Mother’s Request" },
  { t = "ref", text = "(Mark 10:35–45)" },
  { t = "v", n = 20, p = true, text = "Then the mother of Zebedee’s sons came to Jesus with her sons and knelt down to make a request of Him." },
  { t = "v", n = 21, p = true, text = "“What do you want?” He inquired. She answered, “Declare that in Your kingdom one of these two sons of mine may sit at Your right hand, and the other at Your left.”" },
  { t = "v", n = 22, p = true, text = "“You do not know what you are asking,” Jesus replied. “Can you drink the cup I am going to drink?”[^g] “We can,” the brothers answered." },
  { t = "v", n = 23, p = true, text = "“You will indeed drink My cup,”[^h] Jesus said. “But to sit at My right or left is not Mine to grant. These seats belong to those for whom My Father has prepared them.”" },
  { t = "v", n = 24, p = true, text = "When the ten heard about this, they were indignant with the two brothers." },
  { t = "v", n = 25, text = "But Jesus called them aside and said, “You know that the rulers of the Gentiles lord it over them, and their superiors exercise authority over them." },
  { t = "v", n = 26, text = "It shall not be this way among you. Instead, whoever wants to become great among you must be your servant," },
  { t = "v", n = 27, text = "and whoever wants to be first among you must be your slave—" },
  { t = "v", n = 28, text = "just as the Son of Man did not come to be served, but to serve, and to give His life as a ransom for many.”" },
  { t = "h", level = 2, text = "The Blind Men by the Road" },
  { t = "ref", text = "(Mark 10:46–52; Luke 18:35–43)" },
  { t = "v", n = 29, p = true, text = "As they were leaving Jericho, a large crowd followed Him." },
  { t = "v", n = 30, text = "And there were two blind men sitting beside the road. When they heard that Jesus was passing by, they cried out, “Lord, Son of David, have mercy on us!”" },
  { t = "v", n = 31, p = true, text = "The crowd admonished them to be silent, but they cried out all the louder, “Lord, Son of David, have mercy on us!”" },
  { t = "v", n = 32, p = true, text = "Jesus stopped and called them. “What do you want Me to do for you?” He asked." },
  { t = "v", n = 33, p = true, text = "“Lord,” they answered, “let our eyes be opened.”" },
  { t = "v", n = 34, p = true, text = "Moved with compassion, Jesus touched their eyes, and at once they received their sight and followed Him." },
  { t = "note", id = "a", text = "A denarius was customarily a day’s wage for a laborer; similarly in verses 9, 10, and 13." },
  { t = "note", id = "b", text = "That is, about nine in the morning" },
  { t = "note", id = "c", text = "That is, about noon and again about three in the afternoon" },
  { t = "note", id = "d", text = "That is, about five in the afternoon; also in verse 9" },
  { t = "note", id = "e", text = "BYZ and TR include *and whatever is right, you shall receive.*" },
  { t = "note", id = "f", text = "BYZ and TR include *For many are called, but few are chosen.*" },
  { t = "note", id = "g", text = "BYZ includes *or be baptized with the baptism with which I am baptized.* TR is similar." },
  { t = "note", id = "h", text = "BYZ and TR include *and be baptized with the baptism with which I am baptized*." },
]

[[section]]
id = "21"
title = "Matthew 21"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Triumphal Entry" },
  { t = "ref", text = "(Zechariah 9:9–13; Mark 11:1–11; Luke 19:28–40; John 12:12–19)" },
  { t = "v", n = 1, p = true, text = "As they approached Jerusalem and came to Bethphage on the Mount of Olives, Jesus sent out two disciples," },
  { t = "v", n = 2, text = "saying to them, “Go into the village ahead of you, and at once you will find a donkey tied there, with her colt beside her. Untie them and bring them to Me." },
  { t = "v", n = 3, text = "If anyone questions you, tell him that the Lord needs them, and he will send them right away.”" },
  { t = "v", n = 4, p = true, text = "This took place to fulfill what was spoken through the prophet:" },
  { t = "v", n = 5, indent = 1, p = true, text = "“Say to the Daughter of Zion, ‘See, your King comes to you, gentle and riding on a donkey, on a colt, the foal of a donkey.’”[^a]" },
  { t = "v", n = 6, p = true, text = "So the disciples went and did as Jesus had directed them." },
  { t = "v", n = 7, text = "They brought the donkey and the colt and laid their cloaks on them, and Jesus sat on them." },
  { t = "v", n = 8, p = true, text = "A massive crowd spread their cloaks on the road, while others cut branches from the trees and spread them on the road." },
  { t = "v", n = 9, p = true, text = "The crowds that went ahead of Him and those that followed were shouting: “Hosanna to the Son of David!”[^b] “Blessed is He who comes in the name of the Lord!”[^c] “Hosanna in the highest!”[^d]" },
  { t = "v", n = 10, p = true, text = "When Jesus had entered Jerusalem, the whole city was stirred and asked, “Who is this?”" },
  { t = "v", n = 11, p = true, text = "The crowds replied, “This is Jesus, the prophet from Nazareth in Galilee.”" },
  { t = "h", level = 2, text = "Jesus Cleanses the Temple" },
  { t = "ref", text = "(Mark 11:15–19; Luke 19:45–48; John 2:12–25)" },
  { t = "v", n = 12, p = true, text = "Then Jesus entered the temple courts[^e] and drove out all who were buying and selling there. He overturned the tables of the money changers and the seats of those selling doves." },
  { t = "v", n = 13, text = "And He declared to them, “It is written: ‘My house will be called a house of prayer.’[^f] But you are making it ‘a den of robbers.’[^g]”" },
  { t = "v", n = 14, p = true, text = "The blind and the lame came to Him at the temple, and He healed them." },
  { t = "v", n = 15, text = "But the chief priests and scribes were indignant when they saw the wonders He performed and the children shouting in the temple courts, “Hosanna to the Son of David!”" },
  { t = "v", n = 16, p = true, text = "“Do You hear what these children are saying?” they asked. “Yes,” Jesus answered. “Have you never read: ‘From the mouths of children and infants You have ordained praise’[^h]?”" },
  { t = "v", n = 17, p = true, text = "Then He left them and went out of the city to Bethany, where He spent the night." },
  { t = "h", level = 2, text = "The Barren Fig Tree" },
  { t = "ref", text = "(Mark 11:12–14; Mark 11:20–25)" },
  { t = "v", n = 18, p = true, text = "In the morning, as Jesus was returning to the city, He was hungry." },
  { t = "v", n = 19, text = "Seeing a fig tree by the road, He went up to it but found nothing on it except leaves. “May you never bear fruit again!” He said. And immediately the tree withered." },
  { t = "v", n = 20, p = true, text = "When the disciples saw this, they marveled and asked, “How did the fig tree wither so quickly?”" },
  { t = "v", n = 21, p = true, text = "“Truly I tell you,” Jesus replied, “if you have faith and do not doubt, not only will you do what was done to the fig tree, but even if you say to this mountain, ‘Be lifted up and thrown into the sea,’ it will happen." },
  { t = "v", n = 22, text = "If you believe, you will receive whatever you ask for in prayer.”" },
  { t = "h", level = 2, text = "Jesus’ Authority Challenged" },
  { t = "ref", text = "(Mark 11:27–33; Luke 20:1–8)" },
  { t = "v", n = 23, p = true, text = "When Jesus returned to the temple courts and began to teach, the chief priests and elders of the people came up to Him. “By what authority are You doing these things?” they asked. “And who gave You this authority?”" },
  { t = "v", n = 24, p = true, text = "“I will also ask you one question,” Jesus replied, “and if you answer Me, I will tell you by what authority I am doing these things." },
  { t = "v", n = 25, text = "What was the source of John’s baptism? Was it from heaven or from men?” They deliberated among themselves and said, “If we say, ‘From heaven,’ He will ask, ‘Why then did you not believe him?’" },
  { t = "v", n = 26, text = "But if we say, ‘From men,’ we are afraid of the people, for they all regard John as a prophet.”" },
  { t = "v", n = 27, text = "So they answered, “We do not know.” And Jesus replied, “Neither will I tell you by what authority I am doing these things." },
  { t = "h", level = 2, text = "The Parable of the Two Sons" },
  { t = "v", n = 28, p = true, text = "But what do you think? There was a man who had two sons. He went to the first one and said, ‘Son, go and work today in the vineyard.’" },
  { t = "v", n = 29, p = true, text = "‘I will not,’ he replied. But later he changed his mind and went.[^i]" },
  { t = "v", n = 30, p = true, text = "Then the man went to the second son and told him the same thing. ‘I will, sir,’ he said. But he did not go." },
  { t = "v", n = 31, p = true, text = "Which of the two did the will of his father?” “The first,[^j]” they answered. Jesus said to them, “Truly I tell you, the tax collectors and prostitutes are entering the kingdom of God before you." },
  { t = "v", n = 32, text = "For John came to you in the way of righteousness, and you did not believe him, but the tax collectors and prostitutes did. And even after you saw this, you did not repent and believe him." },
  { t = "h", level = 2, text = "The Parable of the Wicked Tenants" },
  { t = "ref", text = "(Mark 12:1–12; Luke 20:9–18)" },
  { t = "v", n = 33, p = true, text = "Listen to another parable: There was a landowner who planted a vineyard. He put a wall around it, dug a winepress in it, and built a tower. Then he rented it out to some tenants and went away on a journey." },
  { t = "v", n = 34, p = true, text = "When the harvest time drew near, he sent his servants to the tenants to collect his share of the fruit." },
  { t = "v", n = 35, text = "But the tenants seized his servants. They beat one, killed another, and stoned a third." },
  { t = "v", n = 36, p = true, text = "Again, he sent other servants, more than the first group. But the tenants did the same to them." },
  { t = "v", n = 37, p = true, text = "Finally, he sent his son to them. ‘They will respect my son,’ he said." },
  { t = "v", n = 38, p = true, text = "But when the tenants saw the son, they said to one another, ‘This is the heir. Come, let us kill him and take his inheritance.’" },
  { t = "v", n = 39, text = "So they seized him and threw him out of the vineyard and killed him." },
  { t = "v", n = 40, p = true, text = "Therefore, when the owner of the vineyard returns, what will he do to those tenants?”" },
  { t = "v", n = 41, p = true, text = "“He will bring those wretches to a wretched end,” they replied, “and will rent out the vineyard to other tenants who will give him his share of the fruit at harvest time.”" },
  { t = "v", n = 42, p = true, text = "Jesus said to them, “Have you never read in the Scriptures: ‘The stone the builders rejected has become the cornerstone. This is from the Lord, and it is marvelous in our eyes’[^k]?" },
  { t = "v", n = 43, p = true, text = "Therefore I tell you that the kingdom of God will be taken away from you and given to a people who will produce its fruit." },
  { t = "v", n = 44, text = "He who falls on this stone will be broken to pieces, but he on whom it falls will be crushed.[^l]”" },
  { t = "v", n = 45, p = true, text = "When the chief priests and Pharisees heard His parables, they knew that Jesus was speaking about them." },
  { t = "v", n = 46, text = "Although they wanted to arrest Him, they were afraid of the crowds, because the people regarded Him as a prophet." },
  { t = "note", id = "a", text = "Zechariah 9:9" },
  { t = "note", id = "b", text = "*Hosanna* is a transliteration of the Hebrew *Hosia-na*, meaning *Save, we pray* or *Save now*, which became a shout of praise; see Psalm 118:25; also in verse 15." },
  { t = "note", id = "c", text = "Psalm 118:26" },
  { t = "note", id = "d", text = "Or *“Hosanna in the highest heaven!”*See Psalm 118:25 and Psalm 148:1." },
  { t = "note", id = "e", text = "Literally *the temple*; also in verses 15 and 23; BYZ and TR *the temple of God*" },
  { t = "note", id = "f", text = "Isaiah 56:7" },
  { t = "note", id = "g", text = "Jeremiah 7:11" },
  { t = "note", id = "h", text = "Psalm 8:2 (see also LXX)" },
  { t = "note", id = "i", text = "NE and WH *But he went.*" },
  { t = "note", id = "j", text = "NE and WH *The latter*" },
  { t = "note", id = "k", text = "Psalm 118:22–23" },
  { t = "note", id = "l", text = "Tischendorf and some early manuscripts do not include verse 44; see also Luke 20:18." },
]

[[section]]
id = "22"
title = "Matthew 22"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Parable of the Banquet" },
  { t = "ref", text = "(Luke 14:15–24)" },
  { t = "v", n = 1, p = true, text = "Once again, Jesus spoke to them in parables:" },
  { t = "v", n = 2, text = "“The kingdom of heaven is like a king who prepared a wedding banquet for his son." },
  { t = "v", n = 3, text = "He sent his servants to call those he had invited to the banquet, but they refused to come." },
  { t = "v", n = 4, p = true, text = "Again, he sent other servants and said, ‘Tell those who have been invited that I have prepared my dinner. My oxen and fattened cattle have been killed, and everything is ready. Come to the wedding banquet.’" },
  { t = "v", n = 5, p = true, text = "But they paid no attention and went away, one to his field, another to his business." },
  { t = "v", n = 6, text = "The rest seized his servants, mistreated them, and killed them." },
  { t = "v", n = 7, p = true, text = "The king was enraged, and he sent his troops to destroy those murderers and burn their city." },
  { t = "v", n = 8, text = "Then he said to his servants, ‘The wedding banquet is ready, but those I invited were not worthy." },
  { t = "v", n = 9, text = "Go therefore to the crossroads and invite to the banquet as many as you can find.’" },
  { t = "v", n = 10, p = true, text = "So the servants went out into the streets and gathered everyone they could find, both evil and good, and the wedding hall was filled with guests." },
  { t = "v", n = 11, p = true, text = "But when the king came in to see the guests, he spotted a man who was not dressed in wedding clothes." },
  { t = "v", n = 12, text = "‘Friend,’ he asked, ‘how did you get in here without wedding clothes?’ But the man was speechless." },
  { t = "v", n = 13, p = true, text = "Then the king told the servants, ‘Tie him hand and foot, and throw him into the outer darkness, where there will be weeping and gnashing of teeth.’" },
  { t = "v", n = 14, p = true, text = "For many are called, but few are chosen.”" },
  { t = "h", level = 2, text = "Paying Taxes to Caesar" },
  { t = "ref", text = "(Mark 12:13–17; Luke 20:19–26)" },
  { t = "v", n = 15, p = true, text = "Then the Pharisees went out and conspired to trap Jesus in His words." },
  { t = "v", n = 16, text = "They sent their disciples to Him along with the Herodians. “Teacher,” they said, “we know that You are honest and that You teach the way of God in accordance with the truth. You seek favor from no one, because You pay no attention to external appearance." },
  { t = "v", n = 17, text = "So tell us what You think: Is it lawful to pay taxes to Caesar or not?”" },
  { t = "v", n = 18, p = true, text = "But Jesus knew their evil intent and said, “You hypocrites, why are you testing Me?" },
  { t = "v", n = 19, text = "Show Me the coin used for the tax.” And they brought Him a denarius.[^a]" },
  { t = "v", n = 20, p = true, text = "“Whose image is this,” He asked, “and whose inscription?”" },
  { t = "v", n = 21, p = true, text = "“Caesar’s,” they answered. So Jesus told them, “Give to Caesar what is Caesar’s, and to God what is God’s.”" },
  { t = "v", n = 22, p = true, text = "And when they heard this, they were amazed. So they left Him and went away." },
  { t = "h", level = 2, text = "The Sadducees and the Resurrection" },
  { t = "ref", text = "(Mark 12:18–27; Luke 20:27–40)" },
  { t = "v", n = 23, p = true, text = "That same day the Sadducees, who say there is no resurrection, came to Jesus and questioned Him." },
  { t = "v", n = 24, text = "“Teacher,” they said, “Moses declared that if a man dies without having children, his brother is to marry the widow and raise up offspring for him.[^b]" },
  { t = "v", n = 25, text = "Now there were seven brothers among us. The first one married and died without having children. So he left his wife to his brother." },
  { t = "v", n = 26, text = "The same thing happened to the second and third brothers, down to the seventh." },
  { t = "v", n = 27, text = "And last of all, the woman died." },
  { t = "v", n = 28, text = "In the resurrection, then, whose wife will she be of the seven? For all of them were married to her.”" },
  { t = "v", n = 29, p = true, text = "Jesus answered, “You are mistaken because you do not know the Scriptures or the power of God." },
  { t = "v", n = 30, text = "In the resurrection, people will neither marry nor be given in marriage. Instead, they will be like the angels[^c] in heaven." },
  { t = "v", n = 31, text = "But concerning the resurrection of the dead, have you not read what God said to you:" },
  { t = "v", n = 32, text = "‘I am the God of Abraham, the God of Isaac, and the God of Jacob’[^d]? He is not the God of the dead, but of the living.”" },
  { t = "v", n = 33, p = true, text = "When the crowds heard this, they were astonished at His teaching." },
  { t = "h", level = 2, text = "The Greatest Commandment" },
  { t = "ref", text = "(Deuteronomy 6:1–19; Mark 12:28–34)" },
  { t = "v", n = 34, p = true, text = "And when the Pharisees heard that Jesus had silenced the Sadducees, they themselves gathered together." },
  { t = "v", n = 35, text = "One of them, an expert in the law, tested Him with a question:" },
  { t = "v", n = 36, text = "“Teacher, which commandment is the greatest in the Law?”" },
  { t = "v", n = 37, p = true, text = "Jesus declared, “‘Love the Lord your God with all your heart and with all your soul and with all your mind.’[^e]" },
  { t = "v", n = 38, text = "This is the first and greatest commandment." },
  { t = "v", n = 39, text = "And the second is like it: ‘Love your neighbor as yourself.’[^f]" },
  { t = "v", n = 40, text = "All the Law and the Prophets hang on these two commandments.”" },
  { t = "h", level = 2, text = "Whose Son Is the Christ?" },
  { t = "ref", text = "(Mark 12:35–37; Luke 20:41–44)" },
  { t = "v", n = 41, p = true, text = "While the Pharisees were assembled, Jesus questioned them:" },
  { t = "v", n = 42, text = "“What do you think about the Christ? Whose son is He?” “David’s,” they answered." },
  { t = "v", n = 43, p = true, text = "Jesus said to them, “How then does David in the Spirit call Him ‘Lord’? For he says:" },
  { t = "v", n = 44, indent = 1, text = "‘The Lord said to my Lord, “Sit at My right hand until I put Your enemies under Your feet.”’[^g]" },
  { t = "v", n = 45, p = true, text = "So if David calls Him ‘Lord,’ how can He be David’s son?”" },
  { t = "v", n = 46, p = true, text = "No one was able to answer a word, and from that day on no one dared to question Him any further." },
  { t = "note", id = "a", text = "A denarius was customarily a day’s wage for a laborer; see Matthew 20:2." },
  { t = "note", id = "b", text = "Deuteronomy 25:5" },
  { t = "note", id = "c", text = "SBL, BYZ, and TR *the angels of God*" },
  { t = "note", id = "d", text = "Exodus 3:6" },
  { t = "note", id = "e", text = "Deuteronomy 6:5" },
  { t = "note", id = "f", text = "Leviticus 19:18" },
  { t = "note", id = "g", text = "Psalm 110:1" },
]

[[section]]
id = "23"
title = "Matthew 23"
level = 1
blocks = [
  { t = "h", level = 2, text = "Woes to Scribes and Pharisees" },
  { t = "ref", text = "(Luke 11:37–54)" },
  { t = "v", n = 1, p = true, text = "Then Jesus spoke to the crowds and to His disciples:" },
  { t = "v", n = 2, text = "“The scribes and Pharisees sit in Moses’ seat." },
  { t = "v", n = 3, text = "So practice and observe everything they tell you. But do not do what they do, for they do not practice what they preach." },
  { t = "v", n = 4, text = "They tie up heavy, burdensome loads[^a] and lay them on men’s shoulders, but they themselves are not willing to lift a finger to move them." },
  { t = "v", n = 5, p = true, text = "All their deeds are done for men to see. They broaden their phylacteries and lengthen their tassels." },
  { t = "v", n = 6, text = "They love the places of honor at banquets, the chief seats in the synagogues," },
  { t = "v", n = 7, text = "the greetings in the marketplaces, and the title of ‘Rabbi’ by which they are addressed.[^b]" },
  { t = "v", n = 8, p = true, text = "But you are not to be called ‘Rabbi,’ for you have one Teacher, and you are all brothers." },
  { t = "v", n = 9, text = "And do not call anyone on earth your father, for you have one Father, who is in heaven." },
  { t = "v", n = 10, text = "Nor are you to be called instructors, for you have one Instructor, the Christ." },
  { t = "v", n = 11, text = "The greatest among you shall be your servant." },
  { t = "v", n = 12, text = "For whoever exalts himself will be humbled, and whoever humbles himself will be exalted." },
  { t = "v", n = 13, p = true, text = "Woe to you, scribes and Pharisees, you hypocrites! You shut the kingdom of heaven in men’s faces. You yourselves do not enter, nor will you let in those who wish to enter.[^c]" },
  { t = "v", n = 15, p = true, text = "Woe to you, scribes and Pharisees, you hypocrites! You traverse land and sea to win a single convert, and when he becomes one, you make him twice as much a son of hell[^d] as you are." },
  { t = "v", n = 16, p = true, text = "Woe to you, blind guides! You say, ‘If anyone swears by the temple, it means nothing; but if anyone swears by the gold of the temple, he is bound by his oath.’" },
  { t = "v", n = 17, text = "You blind fools! Which is greater: the gold, or the temple that makes it sacred?" },
  { t = "v", n = 18, text = "And you say, ‘If anyone swears by the altar, it means nothing; but if anyone swears by the gift on it, he is bound by his oath.’" },
  { t = "v", n = 19, text = "You blind men! Which is greater: the gift, or the altar that makes it sacred?" },
  { t = "v", n = 20, text = "So then, he who swears by the altar swears by it and by everything on it." },
  { t = "v", n = 21, text = "And he who swears by the temple swears by it and by the One who dwells in it." },
  { t = "v", n = 22, text = "And he who swears by heaven swears by God’s throne and by the One who sits on it." },
  { t = "v", n = 23, p = true, text = "Woe to you, scribes and Pharisees, you hypocrites! You pay tithes of mint, dill, and cumin. But you have disregarded the weightier matters of the law: justice, mercy, and faithfulness. You should have practiced the latter, without neglecting the former." },
  { t = "v", n = 24, text = "You blind guides! You strain out a gnat but swallow a camel.[^e]" },
  { t = "v", n = 25, p = true, text = "Woe to you, scribes and Pharisees, you hypocrites! You clean the outside of the cup and dish, but inside they are full of greed and self-indulgence." },
  { t = "v", n = 26, text = "Blind Pharisee! First clean the inside of the cup and dish,[^f] so that the outside may become clean as well." },
  { t = "v", n = 27, p = true, text = "Woe to you, scribes and Pharisees, you hypocrites! You are like whitewashed tombs, which look beautiful on the outside but on the inside are full of dead men’s bones and every kind of impurity." },
  { t = "v", n = 28, text = "In the same way, on the outside you appear to be righteous, but on the inside you are full of hypocrisy and wickedness." },
  { t = "v", n = 29, p = true, text = "Woe to you, scribes and Pharisees, you hypocrites! You build tombs for the prophets and decorate the monuments of the righteous." },
  { t = "v", n = 30, text = "And you say, ‘If we had lived in the days of our fathers, we would not have been partners with them in shedding the blood of the prophets.’" },
  { t = "v", n = 31, text = "So you testify against yourselves that you are the sons of those who murdered the prophets." },
  { t = "v", n = 32, text = "Fill up, then,[^g] the measure of the sin of your fathers." },
  { t = "v", n = 33, text = "You snakes! You brood of vipers! How will you escape the sentence of hell?" },
  { t = "v", n = 34, p = true, text = "Because of this, I am sending you prophets and wise men and teachers. Some of them you will kill and crucify, and others you will flog in your synagogues and persecute from town to town." },
  { t = "v", n = 35, text = "And so upon you will come all the righteous blood shed on earth, from the blood of righteous Abel to the blood of Zechariah son of Berechiah, whom you murdered between the temple and the altar." },
  { t = "v", n = 36, text = "Truly I tell you, all these things will come upon this generation." },
  { t = "h", level = 2, text = "Lament over Jerusalem" },
  { t = "ref", text = "(Luke 13:31–35)" },
  { t = "v", n = 37, p = true, text = "O Jerusalem, Jerusalem, who kills the prophets and stones those sent to her, how often I have longed to gather your children together, as a hen gathers her chicks under her wings, but you were unwilling!" },
  { t = "v", n = 38, text = "Look, your house is left to you desolate.[^h]" },
  { t = "v", n = 39, text = "For I tell you that you will not see Me again until you say, ‘Blessed is He who comes in the name of the Lord.’[^i]”" },
  { t = "note", id = "a", text = "SBL, NE, and WH *They tie up heavy loads*" },
  { t = "note", id = "b", text = "Literally *and to be called ‘Rabbi’ by men*" },
  { t = "note", id = "c", text = "BYZ and TR include *(14) Woe to you, scribes and Pharisees, you hypocrites! You defraud widows of their houses, and for a show make lengthy prayers. Therefore you will receive greater condemnation.*See Mark 12:40 and Luke 20:47." },
  { t = "note", id = "d", text = "Greek *Gehenna*; also in verse 33" },
  { t = "note", id = "e", text = "See Leviticus 11:4 and Leviticus 11:23, where camels and gnats are both forbidden as food." },
  { t = "note", id = "f", text = "NA does not include *and dish*." },
  { t = "note", id = "g", text = "Or *Go ahead, then, and complete*" },
  { t = "note", id = "h", text = "NE and WH do not include *desolate*." },
  { t = "note", id = "i", text = "Psalm 118:26" },
]

[[section]]
id = "24"
title = "Matthew 24"
level = 1
blocks = [
  { t = "h", level = 2, text = "Temple Destruction and Other Signs" },
  { t = "ref", text = "(Mark 13:1–8; Luke 21:5–9)" },
  { t = "v", n = 1, p = true, text = "As Jesus left the temple and was walking away, His disciples came up to Him to point out its buildings." },
  { t = "v", n = 2, p = true, text = "“Do you see all these things?” He replied. “Truly I tell you, not one stone here will be left on another; every one will be thrown down.”" },
  { t = "v", n = 3, p = true, text = "While Jesus was sitting on the Mount of Olives, the disciples came to Him privately. “Tell us,” they said, “when will these things happen, and what will be the sign of Your coming and of the end of the age?”" },
  { t = "v", n = 4, p = true, text = "Jesus answered, “See to it that no one deceives you." },
  { t = "v", n = 5, text = "For many will come in My name, claiming, ‘I am the Christ,’ and will deceive many." },
  { t = "v", n = 6, text = "You will hear of wars and rumors of wars, but see to it that you are not alarmed. These things must happen, but the end is still to come." },
  { t = "v", n = 7, text = "Nation will rise against nation, and kingdom against kingdom. There will be famines and earthquakes in various places." },
  { t = "v", n = 8, text = "All these are the beginning of birth pains." },
  { t = "h", level = 2, text = "Witnessing to All Nations" },
  { t = "ref", text = "(Mark 13:9–13; Luke 21:10–19)" },
  { t = "v", n = 9, p = true, text = "Then they will deliver you over to be persecuted and killed, and you will be hated by all nations because of My name." },
  { t = "v", n = 10, text = "At that time many will fall away and will betray and hate one another," },
  { t = "v", n = 11, text = "and many false prophets will arise and deceive many." },
  { t = "v", n = 12, p = true, text = "Because of the multiplication of wickedness, the love of most will grow cold." },
  { t = "v", n = 13, text = "But the one who perseveres to the end will be saved." },
  { t = "v", n = 14, p = true, text = "And this gospel of the kingdom will be preached in all the world as a testimony to all nations, and then the end will come." },
  { t = "h", level = 2, text = "The Abomination of Desolation" },
  { t = "ref", text = "(Mark 13:14–23; Luke 21:20–24)" },
  { t = "v", n = 15, p = true, text = "So when you see standing in the holy place ‘the abomination of desolation,’[^a] spoken of by the prophet Daniel (let the reader understand)," },
  { t = "v", n = 16, text = "then let those who are in Judea flee to the mountains." },
  { t = "v", n = 17, text = "Let no one on the housetop come down to retrieve anything from his house." },
  { t = "v", n = 18, text = "And let no one in the field return for his cloak." },
  { t = "v", n = 19, p = true, text = "How miserable those days will be for pregnant and nursing mothers!" },
  { t = "v", n = 20, text = "Pray that your flight will not occur in the winter or on the Sabbath." },
  { t = "v", n = 21, text = "For at that time there will be great tribulation, unseen from the beginning of the world until now, and never to be seen again." },
  { t = "v", n = 22, text = "If those days had not been cut short, nobody would be saved. But for the sake of the elect, those days will be cut short." },
  { t = "v", n = 23, p = true, text = "At that time, if anyone says to you, ‘Look, here is the Christ!’ or ‘There He is!’ do not believe it." },
  { t = "v", n = 24, text = "For false Christs and false prophets will appear and perform great signs and wonders to deceive even the elect, if that were possible." },
  { t = "v", n = 25, text = "See, I have told you in advance." },
  { t = "h", level = 2, text = "The Return of the Son of Man" },
  { t = "ref", text = "(Mark 13:24–27; Luke 21:25–28)" },
  { t = "v", n = 26, p = true, text = "So if they tell you, ‘There He is, in the wilderness,’ do not go out, or, ‘Here He is, in the inner rooms,’ do not believe it." },
  { t = "v", n = 27, text = "For just as the lightning comes from the east and flashes as far as the west, so will be the coming of the Son of Man." },
  { t = "v", n = 28, text = "Wherever there is a carcass, there the vultures will gather." },
  { t = "v", n = 29, p = true, text = "Immediately after the tribulation of those days: ‘The sun will be darkened, and the moon will not give its light; the stars will fall from the sky, and the powers of the heavens will be shaken.[^b]’" },
  { t = "v", n = 30, p = true, text = "At that time the sign of the Son of Man will appear in heaven,[^c] and all the tribes of the earth will mourn. They will see the Son of Man coming on the clouds of heaven with power and great glory.[^d]" },
  { t = "v", n = 31, text = "And He will send out His angels with a loud trumpet call, and they will gather His elect from the four winds, from one end of the heavens to the other." },
  { t = "h", level = 2, text = "The Lesson of the Fig Tree" },
  { t = "ref", text = "(Mark 13:28–31; Luke 21:29–33)" },
  { t = "v", n = 32, p = true, text = "Now learn this lesson[^e] from the fig tree: As soon as its branches become tender and sprout leaves, you know that summer is near." },
  { t = "v", n = 33, text = "So also, when you see all these things, you will know that He is near,[^f] right at the door." },
  { t = "v", n = 34, text = "Truly I tell you, this generation will not pass away until all these things have happened." },
  { t = "v", n = 35, text = "Heaven and earth will pass away, but My words will never pass away." },
  { t = "h", level = 2, text = "Readiness at Any Hour" },
  { t = "ref", text = "(Genesis 6:1–7; Mark 13:32–37; Luke 12:35–48)" },
  { t = "v", n = 36, p = true, text = "No one knows about that day or hour, not even the angels in heaven, nor the Son,[^g] but only the Father." },
  { t = "v", n = 37, text = "As it was in the days of Noah, so will it be at the coming of the Son of Man." },
  { t = "v", n = 38, text = "For in the days before the flood, people were eating and drinking, marrying and giving in marriage, up to the day Noah entered the ark." },
  { t = "v", n = 39, text = "And they were oblivious until the flood came and swept them all away. So will it be at the coming of the Son of Man." },
  { t = "v", n = 40, text = "Two men will be in the field: one will be taken and the other left." },
  { t = "v", n = 41, text = "Two women will be grinding at the mill: one will be taken and the other left." },
  { t = "v", n = 42, p = true, text = "Therefore keep watch, because you do not know the day on which your Lord will come." },
  { t = "v", n = 43, text = "But understand this: If the homeowner had known in which watch of the night the thief was coming, he would have kept watch and would not have let his house be broken into." },
  { t = "v", n = 44, text = "For this reason, you also must be ready, because the Son of Man will come at an hour you do not expect." },
  { t = "v", n = 45, p = true, text = "Who then is the faithful and wise servant, whom the master has put in charge of his household, to give the others their food at the proper time?" },
  { t = "v", n = 46, text = "Blessed is that servant whose master finds him doing so when he returns." },
  { t = "v", n = 47, text = "Truly I tell you, he will put him in charge of all his possessions." },
  { t = "v", n = 48, p = true, text = "But suppose that servant is wicked and says in his heart, ‘My master will be away a long time.’" },
  { t = "v", n = 49, text = "And he begins to beat his fellow servants and to eat and drink with drunkards." },
  { t = "v", n = 50, text = "The master of that servant will come on a day he does not expect and at an hour he does not anticipate." },
  { t = "v", n = 51, text = "Then he will cut him to pieces and assign him a place with the hypocrites, where there will be weeping and gnashing of teeth." },
  { t = "note", id = "a", text = "See Daniel 9:27, Daniel 11:31, and Daniel 12:11." },
  { t = "note", id = "b", text = "Or *and the celestial bodies will be shaken*; see Isaiah 13:10, Isaiah 34:4, and Joel 2:10." },
  { t = "note", id = "c", text = "Or *the sky*; twice in this verse" },
  { t = "note", id = "d", text = "See Daniel 7:13–14." },
  { t = "note", id = "e", text = "Or *this parable*" },
  { t = "note", id = "f", text = "Or *it is near*" },
  { t = "note", id = "g", text = "BYZ and TR do not include *nor the Son*." },
]

[[section]]
id = "25"
title = "Matthew 25"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Parable of the Ten Virgins" },
  { t = "v", n = 1, p = true, text = "“At that time the kingdom of heaven will be like ten virgins who took their lamps and went out to meet the bridegroom." },
  { t = "v", n = 2, text = "Five of them were foolish, and five were wise." },
  { t = "v", n = 3, text = "The foolish ones took their lamps but did not take along any extra oil." },
  { t = "v", n = 4, text = "But the wise ones took oil in flasks along with their lamps." },
  { t = "v", n = 5, text = "When the bridegroom was delayed, they all became drowsy and fell asleep." },
  { t = "v", n = 6, p = true, text = "At midnight the cry rang out: ‘Here is the bridegroom! Come out to meet him!’" },
  { t = "v", n = 7, p = true, text = "Then all the virgins woke up and trimmed their lamps." },
  { t = "v", n = 8, text = "The foolish ones said to the wise, ‘Give us some of your oil; our lamps are going out.’" },
  { t = "v", n = 9, p = true, text = "‘No,’ said the wise ones, ‘or there may not be enough for both us and you. Instead, go to those who sell oil and buy some for yourselves.’" },
  { t = "v", n = 10, p = true, text = "But while they were on their way to buy it, the bridegroom arrived. Those who were ready went in with him to the wedding banquet, and the door was shut." },
  { t = "v", n = 11, p = true, text = "Later the other virgins arrived and said, ‘Lord, lord, open the door for us!’" },
  { t = "v", n = 12, p = true, text = "But he replied, ‘Truly I tell you, I do not know you.’" },
  { t = "v", n = 13, p = true, text = "Therefore keep watch, because you do not know the day or the hour.[^a]" },
  { t = "h", level = 2, text = "The Parable of the Talents" },
  { t = "ref", text = "(Luke 19:11–27)" },
  { t = "v", n = 14, p = true, text = "For it is just like a man going on a journey, who called his servants and entrusted them with his possessions." },
  { t = "v", n = 15, text = "To one he gave five talents,[^b] to another two talents, and to another one talent—each according to his own ability. And he went on his journey." },
  { t = "v", n = 16, p = true, text = "The servant who had received the five talents went at once and put them to work[^c] and gained five more." },
  { t = "v", n = 17, text = "Likewise, the one with the two talents gained two more." },
  { t = "v", n = 18, text = "But the servant who had received the one talent went off, dug a hole in the ground, and hid his master’s money." },
  { t = "v", n = 19, p = true, text = "After a long time the master of those servants returned and settled accounts with them." },
  { t = "v", n = 20, text = "The servant who had received the five talents came and presented five more. ‘Master,’ he said, ‘you entrusted me with five talents. See, I have gained five more.’" },
  { t = "v", n = 21, p = true, text = "His master replied, ‘Well done, good and faithful servant! You have been faithful with a few things; I will put you in charge of many things. Enter into the joy of your master!’" },
  { t = "v", n = 22, p = true, text = "The servant who had received the two talents also came and said, ‘Master, you entrusted me with two talents. See, I have gained two more.’" },
  { t = "v", n = 23, p = true, text = "His master replied, ‘Well done, good and faithful servant! You have been faithful with a few things; I will put you in charge of many things. Enter into the joy of your master!’" },
  { t = "v", n = 24, p = true, text = "Finally, the servant who had received the one talent came and said, ‘Master, I knew that you are a hard man, reaping where you have not sown and gathering where you have not scattered seed." },
  { t = "v", n = 25, text = "So I was afraid and went out and hid your talent in the ground. See, you have what belongs to you.’" },
  { t = "v", n = 26, p = true, text = "‘You wicked, lazy servant!’ replied his master. ‘You knew that I reap where I have not sown and gather where I have not scattered seed." },
  { t = "v", n = 27, text = "Then you should have deposited my money with the bankers, and on my return I would have received it back with interest." },
  { t = "v", n = 28, p = true, text = "Therefore take the talent from him and give it to the one who has ten talents." },
  { t = "v", n = 29, text = "For everyone who has will be given more, and he will have an abundance. But the one who does not have, even what he has will be taken away from him." },
  { t = "v", n = 30, text = "And throw that worthless servant into the outer darkness, where there will be weeping and gnashing of teeth.’" },
  { t = "h", level = 2, text = "The Sheep and the Goats" },
  { t = "v", n = 31, p = true, text = "When the Son of Man comes in His glory, and all the angels with Him, He will sit on His glorious throne." },
  { t = "v", n = 32, text = "All the nations will be gathered before Him, and He will separate the people one from another, as a shepherd separates the sheep from the goats." },
  { t = "v", n = 33, text = "He will place the sheep on His right and the goats on His left." },
  { t = "v", n = 34, p = true, text = "Then the King will say to those on His right, ‘Come, you who are blessed by My Father, inherit the kingdom prepared for you from the foundation of the world." },
  { t = "v", n = 35, text = "For I was hungry and you gave Me something to eat, I was thirsty and you gave Me something to drink, I was a stranger and you took Me in," },
  { t = "v", n = 36, text = "I was naked and you clothed Me, I was sick and you looked after Me, I was in prison and you visited Me.’" },
  { t = "v", n = 37, p = true, text = "Then the righteous will answer Him, ‘Lord, when did we see You hungry and feed You, or thirsty and give You something to drink?" },
  { t = "v", n = 38, text = "When did we see You a stranger and take You in, or naked and clothe You?" },
  { t = "v", n = 39, text = "When did we see You sick or in prison and visit You?’" },
  { t = "v", n = 40, p = true, text = "And the King will reply, ‘Truly I tell you, whatever you did for one of the least of these brothers of Mine, you did for Me.’" },
  { t = "v", n = 41, p = true, text = "Then He will say to those on His left, ‘Depart from Me, you who are cursed, into the eternal fire prepared for the devil and his angels." },
  { t = "v", n = 42, text = "For I was hungry and you gave Me nothing to eat, I was thirsty and you gave Me nothing to drink," },
  { t = "v", n = 43, text = "I was a stranger and you did not take Me in, I was naked and you did not clothe Me, I was sick and in prison and you did not look after Me.’" },
  { t = "v", n = 44, p = true, text = "And they too will reply, ‘Lord, when did we see You hungry or thirsty or a stranger or naked or sick or in prison, and did not minister to You?’" },
  { t = "v", n = 45, p = true, text = "Then the King will answer, ‘Truly I tell you, whatever you did not do for one of the least of these, you did not do for Me.’" },
  { t = "v", n = 46, p = true, text = "And they will go away into eternal punishment, but the righteous into eternal life.”" },
  { t = "note", id = "a", text = "BYZ and TR include *when the Son of Man comes*." },
  { t = "note", id = "b", text = "A talent was worth about twenty years’ wages for a laborer." },
  { t = "note", id = "c", text = "Or *(15) ... And he went on his journey at once. (16) ... went and put them to work*. Translators vary as to the placement of the Greek adverb *eutheōs* (at once) at the end of verse 15 or at the beginning of verse 16." },
]

[[section]]
id = "26"
title = "Matthew 26"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Plot to Kill Jesus" },
  { t = "ref", text = "(Mark 14:1–2; Luke 22:1–2; John 11:45–57)" },
  { t = "v", n = 1, p = true, text = "When Jesus had finished saying all these things, He told His disciples," },
  { t = "v", n = 2, text = "“You know that the Passover is two days away, and the Son of Man will be handed over to be crucified.”" },
  { t = "v", n = 3, p = true, text = "At that time the chief priests and elders of the people assembled in the courtyard of the high priest, whose name was Caiaphas," },
  { t = "v", n = 4, text = "and they conspired to arrest Jesus covertly and kill Him." },
  { t = "v", n = 5, text = "“But not during the feast,” they said, “or there may be a riot among the people.”" },
  { t = "h", level = 2, text = "Jesus Anointed at Bethany" },
  { t = "ref", text = "(Mark 14:3–9; Luke 7:36–50; John 12:1–8)" },
  { t = "v", n = 6, p = true, text = "While Jesus was in Bethany in the home of Simon the Leper,[^a]" },
  { t = "v", n = 7, text = "a woman came to Him with an alabaster jar of expensive perfume, which she poured on His head as He reclined at the table." },
  { t = "v", n = 8, p = true, text = "When the disciples saw this, they were indignant and asked, “Why this waste?" },
  { t = "v", n = 9, text = "This perfume could have been sold at a high price, and the money given to the poor.”" },
  { t = "v", n = 10, p = true, text = "Aware of this, Jesus asked, “Why are you bothering this woman? She has done a beautiful deed to Me." },
  { t = "v", n = 11, text = "The poor you will always have with you,[^b] but you will not always have Me." },
  { t = "v", n = 12, text = "By pouring this perfume on Me, she has prepared My body for burial." },
  { t = "v", n = 13, text = "Truly I tell you, wherever this gospel is preached in all the world, what she has done will also be told in memory of her.”" },
  { t = "h", level = 2, text = "Judas Agrees to Betray Jesus" },
  { t = "ref", text = "(Mark 14:10–11; Luke 22:3–6)" },
  { t = "v", n = 14, p = true, text = "Then one of the Twelve, the one called Judas Iscariot, went to the chief priests" },
  { t = "v", n = 15, text = "and asked, “What are you willing to give me if I hand Him over to you?” And they set out for him thirty pieces of silver." },
  { t = "v", n = 16, text = "So from then on Judas looked for an opportunity to betray Jesus." },
  { t = "h", level = 2, text = "Preparing the Passover" },
  { t = "ref", text = "(Mark 14:12–16; Luke 22:7–13)" },
  { t = "v", n = 17, p = true, text = "On the first day of the Feast of Unleavened Bread,[^c] the disciples came to Jesus and asked, “Where do You want us to prepare for You to eat the Passover?”" },
  { t = "v", n = 18, p = true, text = "He answered, “Go into the city to a certain man and tell him that the Teacher says, ‘My time is near. I will keep the Passover with My disciples at your house.’”" },
  { t = "v", n = 19, text = "So the disciples did as Jesus had directed them and prepared the Passover." },
  { t = "h", level = 2, text = "The Last Supper" },
  { t = "ref", text = "(Mark 14:17–26; Luke 22:14–23; 1 Corinthians 11:17–34)" },
  { t = "v", n = 20, p = true, text = "When evening came, Jesus was reclining with the twelve disciples.[^d]" },
  { t = "v", n = 21, text = "And while they were eating, He said to them, “Truly I tell you, one of you will betray Me.”" },
  { t = "v", n = 22, p = true, text = "They were deeply grieved and began to ask Him one after another, “Surely not I, Lord?”" },
  { t = "v", n = 23, p = true, text = "Jesus answered, “The one who has dipped his hand into the bowl with Me will betray Me." },
  { t = "v", n = 24, text = "The Son of Man will go just as it is written about Him, but woe to that man by whom He is betrayed. It would be better for him if he had not been born.”" },
  { t = "v", n = 25, p = true, text = "Then Judas, who would betray Him, said, “Surely not I, Rabbi?” Jesus answered, “You have said it yourself.”" },
  { t = "v", n = 26, p = true, text = "While they were eating, Jesus took bread, spoke a blessing and broke it, and gave it to the disciples, saying, “Take and eat; this is My body.”" },
  { t = "v", n = 27, p = true, text = "Then He took the cup, gave thanks, and gave it to them, saying, “Drink from it, all of you." },
  { t = "v", n = 28, text = "This is My blood of the covenant,[^e] which is poured out for many for the forgiveness of sins." },
  { t = "v", n = 29, text = "I tell you, I will not drink of this fruit of the vine from now on until that day when I drink it anew with you in My Father’s kingdom.”" },
  { t = "v", n = 30, p = true, text = "And when they had sung a hymn, they went out to the Mount of Olives." },
  { t = "h", level = 2, text = "Jesus Predicts Peter’s Denial" },
  { t = "ref", text = "(Zechariah 13:7–9; Mark 14:27–31; Luke 22:31–38; John 13:36–38)" },
  { t = "v", n = 31, p = true, text = "Then Jesus said to them, “This very night you will all fall away on account of Me. For it is written: ‘I will strike the Shepherd, and the sheep of the flock will be scattered.’[^f]" },
  { t = "v", n = 32, p = true, text = "But after I have risen, I will go ahead of you into Galilee.”" },
  { t = "v", n = 33, p = true, text = "Peter said to Him, “Even if all fall away on account of You, I never will.”" },
  { t = "v", n = 34, p = true, text = "“Truly I tell you,” Jesus declared, “this very night, before the rooster crows, you will deny Me three times.”" },
  { t = "v", n = 35, p = true, text = "Peter replied, “Even if I have to die with You, I will never deny You.” And all the other disciples said the same thing." },
  { t = "h", level = 2, text = "Jesus Prays at Gethsemane" },
  { t = "ref", text = "(Mark 14:32–42; Luke 22:39–46)" },
  { t = "v", n = 36, p = true, text = "Then Jesus went with His disciples to a place called Gethsemane, and He told them, “Sit here while I go over there and pray.”" },
  { t = "v", n = 37, p = true, text = "He took with Him Peter and the two sons of Zebedee and began to be sorrowful and deeply distressed." },
  { t = "v", n = 38, text = "Then He said to them, “My soul is consumed with sorrow to the point of death. Stay here and keep watch with Me.”" },
  { t = "v", n = 39, p = true, text = "Going a little farther, He fell facedown and prayed, “My Father, if it is possible, let this cup pass from Me. Yet not as I will, but as You will.”" },
  { t = "v", n = 40, p = true, text = "Then Jesus returned to the disciples and found them sleeping. “Were you not able to keep watch with Me for one hour?” He asked Peter." },
  { t = "v", n = 41, text = "“Watch and pray so that you will not enter into temptation. For the spirit is willing, but the body is weak.”" },
  { t = "v", n = 42, p = true, text = "A second time He went away and prayed, “My Father, if this cup cannot pass unless I drink it, may Your will be done.”" },
  { t = "v", n = 43, text = "And again Jesus returned and found them sleeping, for their eyes were heavy." },
  { t = "v", n = 44, p = true, text = "So He left them and went away once more and prayed a third time, saying the same thing." },
  { t = "v", n = 45, text = "Then He returned to the disciples and said, “Are you still sleeping and resting? Look, the hour is near, and the Son of Man is betrayed into the hands of sinners." },
  { t = "v", n = 46, text = "Rise, let us go! See, My betrayer is approaching!”" },
  { t = "h", level = 2, text = "The Betrayal of Jesus" },
  { t = "ref", text = "(Mark 14:43–52; Luke 22:47–53; John 18:1–14)" },
  { t = "v", n = 47, p = true, text = "While Jesus was still speaking, Judas, one of the Twelve, arrived, accompanied by a large crowd armed with swords and clubs, sent from the chief priests and elders of the people." },
  { t = "v", n = 48, p = true, text = "Now the betrayer had arranged a signal with them: “The One I kiss is the man; arrest Him.”" },
  { t = "v", n = 49, text = "Going directly to Jesus, he said, “Greetings, Rabbi!” and kissed Him." },
  { t = "v", n = 50, p = true, text = "“Friend,” Jesus replied, “do what you came for.”[^g] Then the men stepped forward, seized Jesus, and arrested Him." },
  { t = "v", n = 51, text = "At this, one of Jesus’ companions drew his sword and struck the servant of the high priest, cutting off his ear." },
  { t = "v", n = 52, p = true, text = "“Put your sword back in its place,” Jesus said to him. “For all who draw the sword will die by the sword." },
  { t = "v", n = 53, text = "Are you not aware that I can call on My Father, and He will at once put at My disposal more than twelve legions of angels?" },
  { t = "v", n = 54, text = "But how then would the Scriptures be fulfilled that say it must happen this way?”" },
  { t = "v", n = 55, p = true, text = "At that time Jesus said to the crowd, “Have you come out with swords and clubs to arrest Me as you would an outlaw? Every day I sat teaching in the temple courts,[^h] and you did not arrest Me." },
  { t = "v", n = 56, text = "But this has all happened so that the writings of the prophets would be fulfilled.” Then all the disciples deserted Him and fled." },
  { t = "h", level = 2, text = "Jesus before the Sanhedrin" },
  { t = "ref", text = "(Mark 14:53–65; Luke 22:66–71; John 18:19–24)" },
  { t = "v", n = 57, p = true, text = "Those who had arrested Jesus led Him away to the house of Caiaphas the high priest, where the scribes and elders had gathered." },
  { t = "v", n = 58, text = "But Peter followed Him at a distance, right up to the courtyard of the high priest. And he went in and sat down with the guards to see the outcome." },
  { t = "v", n = 59, p = true, text = "Now the chief priests and the whole Sanhedrin[^i] were seeking false testimony against Jesus in order to put Him to death." },
  { t = "v", n = 60, text = "But they did not find any, though many false witnesses came forward. Finally two came forward" },
  { t = "v", n = 61, text = "and declared, “This man said, ‘I am able to destroy the temple of God and rebuild it in three days.’”" },
  { t = "v", n = 62, p = true, text = "So the high priest stood up and asked Him, “Have You no answer? What are these men testifying against You?”" },
  { t = "v", n = 63, p = true, text = "But Jesus remained silent. Then the high priest said to Him, “I charge You under oath by the living God: Tell us if You are the Christ, the Son of God.”" },
  { t = "v", n = 64, p = true, text = "“You have said it yourself,” Jesus answered. “But I say to all of you, from now on you will see the Son of Man sitting at the right hand of Power[^j] and coming on the clouds of heaven.”[^k]" },
  { t = "v", n = 65, p = true, text = "At this, the high priest tore his clothes and declared, “He has blasphemed! Why do we need any more witnesses? Look, now you have heard the blasphemy." },
  { t = "v", n = 66, text = "What do you think?” “He deserves to die,” they answered." },
  { t = "v", n = 67, p = true, text = "Then they spit in His face and struck Him. Others slapped Him" },
  { t = "v", n = 68, text = "and said, “Prophesy to us, Christ! Who hit You?”" },
  { t = "h", level = 2, text = "Peter Denies Jesus" },
  { t = "ref", text = "(Mark 14:66–72; Luke 22:54–62; John 18:15–18)" },
  { t = "v", n = 69, p = true, text = "Meanwhile, Peter was sitting out in the courtyard, and a servant girl came up to him. “You also were with Jesus the Galilean,” she said." },
  { t = "v", n = 70, p = true, text = "But he denied it before them all: “I do not know what you are talking about.”" },
  { t = "v", n = 71, p = true, text = "When Peter had gone out to the gateway, another servant girl saw him and said to the people there, “This man was with Jesus of Nazareth.”" },
  { t = "v", n = 72, p = true, text = "And again he denied it with an oath: “I do not know the man!”" },
  { t = "v", n = 73, p = true, text = "After a little while, those standing nearby came up to Peter. “Surely you are one of them,” they said, “for your accent gives you away.”" },
  { t = "v", n = 74, p = true, text = "At that he began to curse and swear to them, “I do not know the man!” And immediately a rooster crowed." },
  { t = "v", n = 75, p = true, text = "Then Peter remembered the word that Jesus had spoken: “Before the rooster crows, you will deny Me three times.” And he went outside and wept bitterly." },
  { t = "note", id = "a", text = "Aramaic *Simon the Potter* or *Simon the Jar Maker*" },
  { t = "note", id = "b", text = "See Deuteronomy 15:11." },
  { t = "note", id = "c", text = "Literally *On the first of the Unleavened*; see Exodus 12:14–20." },
  { t = "note", id = "d", text = "BYZ and TR *the Twelve*" },
  { t = "note", id = "e", text = "BYZ and TR *the new covenant*" },
  { t = "note", id = "f", text = "Zechariah 13:7" },
  { t = "note", id = "g", text = "Or *“Friend,” Jesus replied, “for what have you come?”*" },
  { t = "note", id = "h", text = "Literally *the temple*" },
  { t = "note", id = "i", text = "Or *the whole Council*" },
  { t = "note", id = "j", text = "Or *the right hand of the Mighty One*" },
  { t = "note", id = "k", text = "See Psalm 110:1 and Daniel 7:13." },
]

[[section]]
id = "27"
title = "Matthew 27"
level = 1
blocks = [
  { t = "h", level = 2, text = "Jesus Delivered to Pilate" },
  { t = "ref", text = "(Mark 15:1–5)" },
  { t = "v", n = 1, p = true, text = "When morning came, all the chief priests and elders of the people conspired against Jesus to put Him to death." },
  { t = "v", n = 2, text = "They bound Him, led Him away, and handed Him over to Pilate the governor." },
  { t = "h", level = 2, text = "Judas Hangs Himself" },
  { t = "ref", text = "(Zechariah 11:10–17)" },
  { t = "v", n = 3, p = true, text = "When Judas, who had betrayed Him, saw that Jesus was condemned, he was filled with remorse and returned the thirty pieces of silver to the chief priests and elders." },
  { t = "v", n = 4, text = "“I have sinned by betraying innocent blood,” he said. “What is that to us?” they replied. “You bear the responsibility.”" },
  { t = "v", n = 5, p = true, text = "So Judas threw the silver into the temple and left. Then he went away and hanged himself." },
  { t = "v", n = 6, p = true, text = "The chief priests picked up the pieces of silver and said, “It is unlawful to put this into the treasury, since it is blood money.”" },
  { t = "v", n = 7, text = "After conferring together, they used the money to buy the potter’s field as a burial place for foreigners." },
  { t = "v", n = 8, text = "That is why it has been called the Field of Blood to this day." },
  { t = "v", n = 9, text = "Then what was spoken through Jeremiah the prophet was fulfilled: “They took the thirty pieces of silver, the price set on Him by the people of Israel," },
  { t = "v", n = 10, indent = 1, text = "and they gave them for the potter’s field, as the Lord had commanded me.”[^a]" },
  { t = "h", level = 2, text = "Jesus before Pilate" },
  { t = "ref", text = "(Luke 23:1–5; John 18:28–40)" },
  { t = "v", n = 11, p = true, text = "Meanwhile Jesus stood before the governor, who questioned Him: “Are You the King of the Jews?” “You have said so,” Jesus replied." },
  { t = "v", n = 12, p = true, text = "And when He was accused by the chief priests and elders, He gave no answer." },
  { t = "v", n = 13, p = true, text = "Then Pilate asked Him, “Do You not hear how many charges they are bringing against You?”" },
  { t = "v", n = 14, p = true, text = "But Jesus gave no answer, not even to a single charge, much to the governor’s amazement." },
  { t = "h", level = 2, text = "The Crowd Chooses Barabbas" },
  { t = "ref", text = "(Mark 15:6–11; Luke 23:13–25)" },
  { t = "v", n = 15, p = true, text = "Now it was the governor’s custom at the feast to release to the crowd a prisoner of their choosing." },
  { t = "v", n = 16, text = "At that time they were holding a notorious prisoner named Barabbas.[^b]" },
  { t = "v", n = 17, text = "So when the crowd had assembled, Pilate asked them, “Which one do you want me to release to you: Barabbas, or Jesus who is called Christ?”" },
  { t = "v", n = 18, text = "For he knew it was out of envy that they had handed Jesus over to him." },
  { t = "v", n = 19, p = true, text = "While Pilate was sitting on the judgment seat, his wife sent him this message: “Have nothing to do with that innocent man, for I have suffered terribly in a dream today because of Him.”" },
  { t = "v", n = 20, p = true, text = "But the chief priests and elders persuaded the crowds to ask for Barabbas and to have Jesus put to death." },
  { t = "v", n = 21, p = true, text = "“Which of the two do you want me to release to you?” asked the governor. “Barabbas,” they replied." },
  { t = "v", n = 22, p = true, text = "“What then should I do with Jesus who is called Christ?” Pilate asked. They all answered, “Crucify Him!”" },
  { t = "v", n = 23, p = true, text = "“Why?” asked Pilate. “What evil has He done?” But they shouted all the louder, “Crucify Him!”" },
  { t = "h", level = 2, text = "Pilate Washes His Hands" },
  { t = "ref", text = "(Mark 15:12–15)" },
  { t = "v", n = 24, p = true, text = "When Pilate saw that he was accomplishing nothing, but that instead a riot was breaking out, he took water and washed his hands before the crowd. “I am innocent of this man’s blood,[^c]” he said. “You bear the responsibility.”" },
  { t = "v", n = 25, p = true, text = "All the people answered, “His blood be on us and on our children!”" },
  { t = "v", n = 26, p = true, text = "So Pilate released Barabbas to them. But he had Jesus flogged, and handed Him over to be crucified." },
  { t = "h", level = 2, text = "The Soldiers Mock Jesus" },
  { t = "ref", text = "(Isaiah 50:4–11; Mark 15:16–20; Luke 22:63–65; John 19:1–15)" },
  { t = "v", n = 27, p = true, text = "Then the governor’s soldiers took Jesus into the Praetorium and gathered the whole company around Him." },
  { t = "v", n = 28, text = "They stripped Him and put a scarlet robe on Him." },
  { t = "v", n = 29, text = "And they twisted together a crown of thorns and set it on His head. They put a staff in His right hand, knelt down before Him, and mocked Him, saying, “Hail, King of the Jews!”" },
  { t = "v", n = 30, text = "Then they spit on Him and took the staff and struck Him on the head repeatedly." },
  { t = "v", n = 31, p = true, text = "After they had mocked Him, they removed the robe and put His own clothes back on Him. Then they led Him away to crucify Him." },
  { t = "h", level = 2, text = "The Crucifixion" },
  { t = "ref", text = "(Psalm 22:1–31; Mark 15:21–32; Luke 23:26–43; John 19:16–27)" },
  { t = "v", n = 32, p = true, text = "Along the way they found a man from Cyrene, named Simon, and they forced him to carry the cross of Jesus." },
  { t = "v", n = 33, p = true, text = "And when they came to a place called Golgotha, which means The Place of the Skull," },
  { t = "v", n = 34, text = "they offered Him wine to drink, mixed with gall; but after tasting it, He refused to drink it." },
  { t = "v", n = 35, p = true, text = "When they had crucified Him, they divided up His garments by casting lots.[^d]" },
  { t = "v", n = 36, text = "And sitting down, they kept watch over Him there." },
  { t = "v", n = 37, p = true, text = "Above His head they posted the written charge against Him: THIS IS JESUS, THE KING OF THE JEWS." },
  { t = "v", n = 38, p = true, text = "Two robbers[^e] were crucified with Him, one on His right and the other on His left." },
  { t = "v", n = 39, p = true, text = "And those who passed by heaped abuse on Him, shaking their heads" },
  { t = "v", n = 40, text = "and saying, “You who are going to destroy the temple and rebuild it in three days, save Yourself! If You are the Son of God, come down from the cross!”" },
  { t = "v", n = 41, p = true, text = "In the same way, the chief priests, scribes, and elders mocked Him, saying," },
  { t = "v", n = 42, text = "“He saved others, but He cannot save Himself. He is the King of Israel! Let Him come down now from the cross, and we will believe in Him." },
  { t = "v", n = 43, text = "He trusts in God. Let God deliver Him now if He wants Him.[^f] For He said, ‘I am the Son of God.’”" },
  { t = "v", n = 44, p = true, text = "In the same way, even the robbers who were crucified with Him berated Him." },
  { t = "h", level = 2, text = "The Death of Jesus" },
  { t = "ref", text = "(Psalm 22:1–31; Mark 15:33–41; Luke 23:44–49; John 19:28–30)" },
  { t = "v", n = 45, p = true, text = "From the sixth hour until the ninth hour[^g] darkness came over all the land." },
  { t = "v", n = 46, text = "About the ninth hour Jesus cried out in a loud voice, “Eli, Eli,[^h] lema sabachthani?” which means, “My God, My God, why have You forsaken Me?”[^i]" },
  { t = "v", n = 47, p = true, text = "When some of those standing there heard this, they said, “He is calling Elijah.”" },
  { t = "v", n = 48, text = "One of them quickly ran and brought a sponge. He filled it with sour wine,[^j] put it on a reed, and held it up for Jesus to drink.[^k]" },
  { t = "v", n = 49, p = true, text = "But the others said, “Leave Him alone. Let us see if Elijah comes to save Him.”[^l]" },
  { t = "v", n = 50, p = true, text = "When Jesus had cried out again in a loud voice, He yielded up His spirit." },
  { t = "v", n = 51, text = "At that moment the veil of the temple was torn in two from top to bottom. The earth quaked, and the rocks were split." },
  { t = "v", n = 52, text = "The tombs broke open, and the bodies of many saints who had fallen asleep were raised." },
  { t = "v", n = 53, text = "After Jesus’ resurrection, when they had come out of the tombs, they entered the holy city and appeared to many people." },
  { t = "v", n = 54, p = true, text = "When the centurion and those with him who were guarding Jesus saw the earthquake and all that had happened, they were terrified and said, “Truly this was the Son of God.”" },
  { t = "v", n = 55, p = true, text = "And many women were there, watching from a distance. They had followed Jesus from Galilee to minister to Him." },
  { t = "v", n = 56, text = "Among them were Mary Magdalene, Mary the mother of James and Joseph, and the mother of Zebedee’s sons." },
  { t = "h", level = 2, text = "The Burial of Jesus" },
  { t = "ref", text = "(Isaiah 53:9–12; Mark 15:42–47; Luke 23:50–56; John 19:38–42)" },
  { t = "v", n = 57, p = true, text = "When it was evening, there came a rich man from Arimathea named Joseph, who himself was a disciple of Jesus." },
  { t = "v", n = 58, text = "He went to Pilate to ask for the body of Jesus, and Pilate ordered that it be given to him." },
  { t = "v", n = 59, text = "So Joseph took the body, wrapped it in a clean linen cloth," },
  { t = "v", n = 60, text = "and placed it in his own new tomb that he had cut into the rock. Then he rolled a great stone across the entrance to the tomb and went away." },
  { t = "v", n = 61, text = "Mary Magdalene and the other Mary were sitting there opposite the tomb." },
  { t = "h", level = 2, text = "The Guards at the Tomb" },
  { t = "v", n = 62, p = true, text = "The next day, the one after Preparation Day, the chief priests and Pharisees assembled before Pilate." },
  { t = "v", n = 63, text = "“Sir,” they said, “we remember that while He was alive that deceiver said, ‘After three days I will rise again.’" },
  { t = "v", n = 64, text = "So give the order that the tomb be secured until the third day. Otherwise, His disciples may come and steal Him away and tell the people He has risen from the dead. And this last deception would be worse than the first.”" },
  { t = "v", n = 65, p = true, text = "“You have a guard,” Pilate said. “Go, make the tomb as secure as you know how.”" },
  { t = "v", n = 66, text = "So they went and secured the tomb by sealing the stone and posting the guard." },
  { t = "note", id = "a", text = "See Jeremiah 19:1–15, Jeremiah 32:6–9, and Zechariah 11:12–13." },
  { t = "note", id = "b", text = "SBL and NA *Jesus Barabbas*; also in verse 17, but universally called *Barabbas* in verses 20, 21, and 26" },
  { t = "note", id = "c", text = "Literally *this blood*; BYZ and TR *this righteous blood*" },
  { t = "note", id = "d", text = "See Psalm 22:18; TR includes *to fulfill what was said through the prophet: “They divided My garments among them, and cast lots for My clothing.”*" },
  { t = "note", id = "e", text = "Or *insurrectionists*; also in verse 44" },
  { t = "note", id = "f", text = "Psalm 22:8" },
  { t = "note", id = "g", text = "That is, from noon until three in the afternoon" },
  { t = "note", id = "h", text = "NE and WH *Eloi, Eloi*" },
  { t = "note", id = "i", text = "Psalm 22:1" },
  { t = "note", id = "j", text = "Or *filled it with wine vinegar*" },
  { t = "note", id = "k", text = "See Psalm 69:21." },
  { t = "note", id = "l", text = "WH includes *And another took a spear and pierced His side, and water and blood flowed out*; see John 19:34." },
]

[[section]]
id = "28"
title = "Matthew 28"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Resurrection" },
  { t = "ref", text = "(Mark 16:1–8; Luke 24:1–12; John 20:1–9)" },
  { t = "v", n = 1, p = true, text = "After the Sabbath, at dawn on the first day of the week,[^a] Mary Magdalene and the other Mary went to see the tomb." },
  { t = "v", n = 2, p = true, text = "Suddenly there was a great earthquake, for an angel of the Lord descended from heaven, rolled away the stone, and sat on it." },
  { t = "v", n = 3, text = "His appearance was like lightning, and his clothes were white as snow." },
  { t = "v", n = 4, text = "The guards trembled in fear of him and became like dead men." },
  { t = "v", n = 5, p = true, text = "But the angel said to the women, “Do not be afraid, for I know that you are looking for Jesus, who was crucified." },
  { t = "v", n = 6, text = "He is not here; He has risen, just as He said! Come, see the place where He lay.[^b]" },
  { t = "v", n = 7, text = "Then go quickly and tell His disciples, ‘He has risen from the dead and is going ahead of you into Galilee. There you will see Him.’ See, I have told you.”" },
  { t = "v", n = 8, p = true, text = "So they hurried away from the tomb in fear and great joy, and ran to tell His disciples." },
  { t = "v", n = 9, text = "Suddenly[^c] Jesus met them and said, “Greetings!” They came to Him, grasped His feet, and worshiped Him." },
  { t = "v", n = 10, text = "“Do not be afraid,” said Jesus. “Go and tell My brothers to go to Galilee. There they will see Me.”" },
  { t = "h", level = 2, text = "The Report of the Guards" },
  { t = "v", n = 11, p = true, text = "While the women were on their way, some of the guards went into the city and reported to the chief priests all that had happened." },
  { t = "v", n = 12, text = "And after the chief priests had met with the elders and formed a plan, they gave the soldiers a large sum of money" },
  { t = "v", n = 13, text = "and instructed them: “You are to say, ‘His disciples came by night and stole Him away while we were asleep.’" },
  { t = "v", n = 14, text = "If this report reaches the governor, we will satisfy him and keep you out of trouble.”" },
  { t = "v", n = 15, p = true, text = "So the guards took the money and did as they were instructed. And this account has been circulated among the Jews to this very day." },
  { t = "h", level = 2, text = "The Great Commission" },
  { t = "ref", text = "(Mark 16:14–18)" },
  { t = "v", n = 16, p = true, text = "Meanwhile, the eleven disciples went to Galilee, to the mountain Jesus had designated." },
  { t = "v", n = 17, text = "When they saw Him, they worshiped Him, but some doubted." },
  { t = "v", n = 18, p = true, text = "Then Jesus came to them and said, “All authority in heaven and on earth has been given to Me." },
  { t = "v", n = 19, text = "Therefore go and make disciples[^d] of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit," },
  { t = "v", n = 20, text = "and teaching them to obey all that I have commanded you. And surely I am with you always, even to the end of the age.”" },
  { t = "note", id = "a", text = "Literally *Now after the Sabbaths, it being dawn toward the first of the Sabbaths,*" },
  { t = "note", id = "b", text = "BYZ and TR *where the Lord lay*" },
  { t = "note", id = "c", text = "BYZ and TR *They were going to tell His disciples, and suddenly*" },
  { t = "note", id = "d", text = "Literally *Having gone, therefore, make disciples*" },
]

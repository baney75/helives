[[section]]
id = "1"
title = "Jude 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Greeting from Jude" },
  { t = "ref", text = "(James 1:1)" },
  { t = "v", n = 1, p = true, text = "Jude, a servant of Jesus Christ and a brother of James, To those who are called, loved by God the Father, and kept in Jesus Christ:" },
  { t = "v", n = 2, p = true, text = "Mercy, peace, and love be multiplied to you." },
  { t = "h", level = 2, text = "God’s Judgment on the Ungodly" },
  { t = "ref", text = "(2 Peter 3:1–7)" },
  { t = "v", n = 3, p = true, text = "Beloved, although I made every effort to write to you about the salvation we share, I felt it necessary to write and urge you to contend earnestly for the faith entrusted once for all to the saints." },
  { t = "v", n = 4, text = "For certain men have crept in among you unnoticed—ungodly ones who were designated long ago for condemnation. They turn the grace of our God into a license for immorality, and they deny our only Master and Lord, Jesus Christ." },
  { t = "v", n = 5, p = true, text = "Although you are fully aware of this, I want to remind you that after Jesus[^a] had delivered His people out of the land of Egypt, He destroyed those who did not believe." },
  { t = "v", n = 6, text = "And the angels who did not stay within their own domain but abandoned their proper dwelling—these He has kept in eternal chains under darkness, bound for judgment on that great day." },
  { t = "v", n = 7, text = "In like manner, Sodom and Gomorrah and the cities around them, who indulged in sexual immorality and pursued strange flesh, are on display as an example of those who sustain the punishment of eternal fire." },
  { t = "v", n = 8, p = true, text = "Yet in the same way these dreamers defile their bodies, reject authority, and slander glorious beings." },
  { t = "v", n = 9, text = "But even the archangel Michael, when he disputed with the devil over the body of Moses, did not presume to bring a slanderous charge against him, but said, “The Lord rebuke you!”[^b]" },
  { t = "v", n = 10, text = "These men, however, slander what they do not understand, and like irrational animals, they will be destroyed by the things they do instinctively." },
  { t = "v", n = 11, text = "Woe to them! They have traveled the path of Cain; they have rushed for profit into the error of Balaam; they have perished in Korah’s rebellion." },
  { t = "v", n = 12, p = true, text = "These men are hidden reefs[^c] in your love feasts, shamelessly feasting with you but shepherding only themselves. They are clouds without water, carried along by the wind; fruitless trees in autumn, twice dead after being uprooted." },
  { t = "v", n = 13, text = "They are wild waves of the sea, foaming up their own shame; wandering stars, for whom blackest darkness has been reserved forever." },
  { t = "v", n = 14, p = true, text = "Enoch, the seventh from Adam, also prophesied about them: “Behold, the Lord is coming with myriads of His holy ones" },
  { t = "v", n = 15, indent = 2, text = "to execute judgment on everyone, and to convict all the ungodly of every ungodly act of wickedness and every harsh word spoken against Him by ungodly sinners.”[^d]" },
  { t = "v", n = 16, p = true, text = "These men are discontented grumblers, following after their own lusts; their mouths spew arrogance; they flatter others for their own advantage." },
  { t = "h", level = 2, text = "A Call to Persevere" },
  { t = "ref", text = "(Hebrews 10:19–39; 2 Peter 3:1–7)" },
  { t = "v", n = 17, p = true, text = "But you, beloved, remember what was foretold by the apostles of our Lord Jesus Christ" },
  { t = "v", n = 18, text = "when they said to you, “In the last times there will be scoffers who will follow after their own ungodly desires.”[^e]" },
  { t = "v", n = 19, text = "These are the ones who cause divisions, who are worldly and devoid of the Spirit." },
  { t = "v", n = 20, p = true, text = "But you, beloved, by building yourselves up in your most holy faith and praying in the Holy Spirit," },
  { t = "v", n = 21, text = "keep yourselves in the love of God as you await the mercy of our Lord Jesus Christ to bring you eternal life." },
  { t = "v", n = 22, p = true, text = "And indeed, have mercy on those who doubt;" },
  { t = "v", n = 23, text = "save others by snatching them from the fire; and to still others show mercy tempered with fear, hating even the clothing stained by the flesh." },
  { t = "h", level = 2, text = "Doxology" },
  { t = "ref", text = "(Romans 16:25–27)" },
  { t = "v", n = 24, p = true, text = "Now to Him who is able to keep you from stumbling and to present you unblemished in His glorious presence, with great joy—" },
  { t = "v", n = 25, text = "to the only God our Savior be glory, majesty, dominion, and authority through Jesus Christ our Lord before all time, and now, and for all eternity. Amen." },
  { t = "note", id = "a", text = "NE, WH, BYZ, and TR *the Lord*" },
  { t = "note", id = "b", text = "This account is attributed by Origen to the Testament of Moses, also called the Assumption of Moses." },
  { t = "note", id = "c", text = "Or *are blemishes*" },
  { t = "note", id = "d", text = "See the First Book of Enoch (1 Enoch 1:9)." },
  { t = "note", id = "e", text = "See 2 Peter 3:3." },
]

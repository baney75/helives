[[section]]
id = "1"
title = "1 Peter 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Greeting from Peter" },
  { t = "ref", text = "(2 Peter 1:1–2)" },
  { t = "v", n = 1, p = true, text = "Peter, an apostle of Jesus Christ, To the elect who are exiles of the Dispersion throughout Pontus, Galatia, Cappadocia, Asia, and Bithynia, chosen[^a]" },
  { t = "v", n = 2, text = "according to the foreknowledge of God the Father and sanctified by the Spirit for obedience to Jesus Christ and sprinkling by His blood: Grace and peace be yours in abundance." },
  { t = "h", level = 2, text = "A Living Hope" },
  { t = "v", n = 3, p = true, text = "Blessed be the God and Father of our Lord Jesus Christ! By His great mercy He has given us new birth[^b] into a living hope through the resurrection of Jesus Christ from the dead," },
  { t = "v", n = 4, text = "and into an inheritance that is imperishable, undefiled, and unfading, reserved in heaven for you," },
  { t = "v", n = 5, text = "who through faith are shielded by God’s power for the salvation that is ready to be revealed in the last time." },
  { t = "v", n = 6, p = true, text = "In this you greatly rejoice, though now for a little while you may have had to suffer grief in various trials" },
  { t = "v", n = 7, text = "so that the proven character of your faith—more precious than gold, which perishes even though refined by fire—may result in praise, glory, and honor at the revelation of Jesus Christ." },
  { t = "v", n = 8, p = true, text = "Though you have not seen Him, you love Him; and though you do not see Him now, you believe in Him and rejoice with an inexpressible and glorious joy," },
  { t = "v", n = 9, text = "now that you are receiving the goal of your faith, the salvation of your souls." },
  { t = "v", n = 10, p = true, text = "Concerning this salvation, the prophets who foretold the grace to come to you searched and investigated carefully," },
  { t = "v", n = 11, text = "trying to determine the time and setting to which the Spirit of Christ in them was pointing when He predicted the sufferings of Christ and the glories to follow." },
  { t = "v", n = 12, p = true, text = "It was revealed to them that they were not serving themselves, but you, when they foretold the things now announced by those who preached the gospel to you by the Holy Spirit sent from heaven. Even angels long to look into these things." },
  { t = "h", level = 2, text = "A Call to Holiness" },
  { t = "ref", text = "(Hebrews 12:14–17)" },
  { t = "v", n = 13, p = true, text = "Therefore prepare your minds for action.[^c] Be sober-minded. Set your hope fully on the grace to be given you at the revelation of Jesus Christ." },
  { t = "v", n = 14, text = "As obedient children, do not conform to the passions of your former ignorance." },
  { t = "v", n = 15, text = "But just as He who called you is holy, so be holy in all you do," },
  { t = "v", n = 16, text = "for it is written: “Be holy, because I am holy.”[^d]" },
  { t = "v", n = 17, p = true, text = "Since you call on a Father who judges each one’s work impartially, conduct yourselves in reverent fear during your stay as foreigners." },
  { t = "v", n = 18, text = "For you know that it was not with perishable things such as silver or gold that you were redeemed from the empty way of life you inherited from your forefathers," },
  { t = "v", n = 19, text = "but with the precious blood of Christ, a lamb without blemish or spot." },
  { t = "v", n = 20, text = "He was known before the foundation of the world, but was revealed in the last times for your sake." },
  { t = "v", n = 21, p = true, text = "Through Him you believe in God, who raised Him from the dead and glorified Him; and so your faith and hope are in God." },
  { t = "h", level = 2, text = "The Enduring Word" },
  { t = "ref", text = "(Isaiah 40:6–8)" },
  { t = "v", n = 22, p = true, text = "Since you have purified your souls by obedience to the truth so that you have a genuine love for your brothers, love one another deeply, from a pure heart.[^e]" },
  { t = "v", n = 23, text = "For you have been born again, not of perishable seed, but of imperishable, through the living and enduring word of God." },
  { t = "v", n = 24, text = "For, “All flesh is like grass, and all its glory like the flowers of the field; the grass withers and the flowers fall," },
  { t = "v", n = 25, indent = 2, text = "but the word of the Lord stands forever.”[^f] And this is the word that was proclaimed to you." },
  { t = "note", id = "a", text = "Literally *To the elect sojourners of the Diaspora of Pontus, Galatia, Cappadocia, Asia, and Bithynia*. These provinces were located in what is now Turkey." },
  { t = "note", id = "b", text = "Or *has caused us to be born again* or *has begotten us again*" },
  { t = "note", id = "c", text = "Literally *Wherefore gird up the loins of your mind*" },
  { t = "note", id = "d", text = "Leviticus 11:44–45; Leviticus 19:2" },
  { t = "note", id = "e", text = "SBL, NE, and WH *from the heart*" },
  { t = "note", id = "f", text = "Isaiah 40:6–8" },
]

[[section]]
id = "2"
title = "1 Peter 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Living Stone and Chosen People" },
  { t = "ref", text = "(Isaiah 28:14–22; 1 Corinthians 3:10–15; Ephesians 2:19–22)" },
  { t = "v", n = 1, p = true, text = "Rid yourselves, therefore, of all malice, deceit, hypocrisy, envy, and slander." },
  { t = "v", n = 2, text = "Like newborn babies, crave pure spiritual milk, so that by it you may grow up in your salvation," },
  { t = "v", n = 3, text = "now that you have tasted that the Lord is good." },
  { t = "v", n = 4, p = true, text = "As you come to Him, the living stone, rejected by men but chosen and precious in God’s sight," },
  { t = "v", n = 5, text = "you also, like living stones, are being built into a spiritual house to be a holy priesthood, offering spiritual sacrifices acceptable to God through Jesus Christ." },
  { t = "v", n = 6, text = "For it stands in Scripture: “See, I lay in Zion a stone, a chosen and precious cornerstone; and the one who believes in Him will never be put to shame.”[^a]" },
  { t = "v", n = 7, p = true, text = "To you who believe, then, this stone is precious. But to those who do not believe, “The stone the builders rejected has become the cornerstone,”[^b]" },
  { t = "v", n = 8, p = true, text = "and, “A stone of stumbling and a rock of offense.”[^c] They stumble because they disobey the word—and to this they were appointed." },
  { t = "v", n = 9, p = true, text = "But you are a chosen people, a royal priesthood, a holy nation, a people for God’s own possession, to proclaim the virtues of Him who called you out of darkness into His marvelous light." },
  { t = "v", n = 10, text = "Once you were not a people, but now you are the people of God; once you had not received mercy, but now you have received mercy.[^d]" },
  { t = "v", n = 11, p = true, text = "Beloved, I urge you, as foreigners and exiles, to abstain from the desires of the flesh, which war against your soul." },
  { t = "v", n = 12, text = "Conduct yourselves with such honor among the Gentiles that, though they slander you as evildoers, they may see your good deeds and glorify God on the day He visits us." },
  { t = "h", level = 2, text = "Submission to Authorities" },
  { t = "ref", text = "(Romans 13:1–7)" },
  { t = "v", n = 13, p = true, text = "Submit yourselves for the Lord’s sake to every human institution, whether to the king as the supreme authority," },
  { t = "v", n = 14, text = "or to governors as those sent by him to punish those who do wrong and to praise those who do right." },
  { t = "v", n = 15, text = "For it is God’s will that by doing good you should silence the ignorance of foolish men." },
  { t = "v", n = 16, p = true, text = "Live in freedom, but do not use your freedom as a cover-up for evil; live as servants of God." },
  { t = "v", n = 17, text = "Treat everyone with high regard: Love the brotherhood of believers,[^e] fear God, honor the king." },
  { t = "v", n = 18, p = true, text = "Servants, submit yourselves to your masters with all respect,[^f] not only to those who are good and gentle, but even to those who are unreasonable." },
  { t = "v", n = 19, text = "For if anyone endures the pain of unjust suffering because he is conscious of God, this is to be commended." },
  { t = "v", n = 20, text = "How is it to your credit if you are beaten for doing wrong and you endure it? But if you suffer for doing good and you endure it, this is commendable before God." },
  { t = "h", level = 2, text = "Christ’s Example of Suffering" },
  { t = "ref", text = "(Isaiah 53:1–8)" },
  { t = "v", n = 21, p = true, text = "For to this you were called, because Christ also suffered for you, leaving you an example, that you should follow in His footsteps:" },
  { t = "v", n = 22, indent = 1, p = true, text = "“He committed no sin, and no deceit was found in His mouth.”[^g]" },
  { t = "v", n = 23, indent = 1, text = "When they heaped abuse on Him, He did not retaliate; when He suffered, He made no threats, but entrusted Himself to Him who judges justly." },
  { t = "v", n = 24, indent = 1, text = "He Himself bore our sins[^h] in His body on the tree, so that we might die to sin and live to righteousness. “By His stripes you are healed.”[^i]" },
  { t = "v", n = 25, p = true, text = "For “you were like sheep going astray,”[^j] but now you have returned to the Shepherd and Overseer of your souls." },
  { t = "note", id = "a", text = "Isaiah 28:16 (see also LXX)" },
  { t = "note", id = "b", text = "Psalm 118:22" },
  { t = "note", id = "c", text = "Isaiah 8:14" },
  { t = "note", id = "d", text = "Hosea 2:23" },
  { t = "note", id = "e", text = "Literally *Love the brotherhood*" },
  { t = "note", id = "f", text = "Or *in all fear*" },
  { t = "note", id = "g", text = "Isaiah 53:9" },
  { t = "note", id = "h", text = "Isaiah 53:4 (see also LXX)" },
  { t = "note", id = "i", text = "Isaiah 53:5" },
  { t = "note", id = "j", text = "Isaiah 53:6" },
]

[[section]]
id = "3"
title = "1 Peter 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "Wives and Husbands" },
  { t = "ref", text = "(Song of Solomon 1:1–17; Ephesians 5:22–33)" },
  { t = "v", n = 1, p = true, text = "Wives, in the same way, submit yourselves to your husbands, so that even if they refuse to believe the word, they will be won over without words by the behavior of their wives" },
  { t = "v", n = 2, text = "when they see your pure and reverent demeanor." },
  { t = "v", n = 3, p = true, text = "Your beauty should not come from outward adornment, such as braided hair or gold jewelry or fine clothes," },
  { t = "v", n = 4, text = "but from the inner disposition of your heart, the unfading beauty of a gentle and quiet spirit, which is precious in God’s sight." },
  { t = "v", n = 5, text = "For this is how the holy women of the past adorned themselves. They put their hope in God and were submissive to their husbands," },
  { t = "v", n = 6, text = "just as Sarah obeyed Abraham and called him lord. And you are her children if you do what is right and refuse to give way to fear." },
  { t = "v", n = 7, p = true, text = "Husbands, in the same way, treat your wives with consideration as a delicate vessel, and with honor as fellow heirs of the gracious gift of life, so that your prayers will not be hindered." },
  { t = "h", level = 2, text = "Turning from Evil" },
  { t = "v", n = 8, p = true, text = "Finally, all of you, be like-minded and sympathetic, love as brothers, be tenderhearted and humble." },
  { t = "v", n = 9, text = "Do not repay evil with evil or insult with insult, but with blessing, because to this you were called so that you may inherit a blessing." },
  { t = "v", n = 10, text = "For, “Whoever would love life and see good days must keep his tongue from evil and his lips from deceitful speech." },
  { t = "v", n = 11, indent = 1, text = "He must turn from evil and do good; he must seek peace and pursue it." },
  { t = "v", n = 12, indent = 1, text = "For the eyes of the Lord are on the righteous, and His ears are inclined to their prayer. But the face of the Lord is against those who do evil.”[^a]" },
  { t = "v", n = 13, p = true, text = "Who can harm you if you are zealous for what is good?" },
  { t = "h", level = 2, text = "Suffering for Righteousness" },
  { t = "v", n = 14, p = true, text = "But even if you should suffer for what is right, you are blessed. “Do not fear what they fear; do not be shaken.”[^b]" },
  { t = "v", n = 15, text = "But in your hearts sanctify Christ as Lord.[^c] Always be prepared to give a defense to everyone who asks you the reason for the hope that is in you. But respond with gentleness and respect," },
  { t = "v", n = 16, text = "keeping a clear conscience, so that those who slander you may be put to shame by your good behavior in Christ." },
  { t = "v", n = 17, text = "For it is better, if it is God’s will, to suffer for doing good than for doing evil." },
  { t = "v", n = 18, p = true, text = "For Christ also suffered[^d] for sins once for all, the righteous for the unrighteous, to bring you to God. He was put to death in the body but made alive in the Spirit," },
  { t = "v", n = 19, text = "in whom[^e] He also went and preached to the spirits in prison" },
  { t = "v", n = 20, text = "who disobeyed long ago when God waited patiently in the days of Noah while the ark was being built. In the ark a few people, only eight souls, were saved through water." },
  { t = "v", n = 21, text = "And this water symbolizes the baptism that now saves you also—not the removal of dirt from the body, but the pledge of[^f] a clear conscience toward God—through the resurrection of Jesus Christ," },
  { t = "v", n = 22, text = "who has gone into heaven and is at the right hand of God, with angels, authorities, and powers subject to Him." },
  { t = "note", id = "a", text = "Psalm 34:12–16 (see also LXX)" },
  { t = "note", id = "b", text = "Or *“Do not fear their threats; do not be shaken.”*Isaiah 8:12" },
  { t = "note", id = "c", text = "BYZ and TR *But sanctify the Lord God in your hearts.*This sentence may also be included with the quotation from the previous verse; see Isaiah 8:13." },
  { t = "note", id = "d", text = "NE and WH *died*" },
  { t = "note", id = "e", text = "Or *in the spirit, (19) in which*" },
  { t = "note", id = "f", text = "Or *appeal for*" },
]

[[section]]
id = "4"
title = "1 Peter 4"
level = 1
blocks = [
  { t = "h", level = 2, text = "Living for God’s Glory" },
  { t = "ref", text = "(1 Corinthians 10:23–33)" },
  { t = "v", n = 1, p = true, text = "Therefore, since Christ suffered[^a] in His body, arm yourselves with the same resolve, because anyone who has suffered in his body is done with sin." },
  { t = "v", n = 2, text = "Consequently, he does not live out his remaining time on earth for human passions, but for the will of God." },
  { t = "v", n = 3, text = "For you have spent enough time in the past carrying out the same desires as the Gentiles: living in debauchery, lust, drunkenness, orgies, carousing, and detestable idolatry." },
  { t = "v", n = 4, p = true, text = "Because of this, they consider it strange of you not to plunge with them into the same flood of reckless indiscretion, and they heap abuse on you." },
  { t = "v", n = 5, text = "But they will have to give an account to Him who is ready to judge the living and the dead." },
  { t = "v", n = 6, text = "That is why the gospel was preached even to those who are now dead,[^b] so that they might be judged as men in the flesh, but live according to God in the spirit." },
  { t = "v", n = 7, p = true, text = "The end of all things is near. Therefore be clear-minded and sober, so that you can pray." },
  { t = "v", n = 8, text = "Above all, love one another deeply, because love covers over a multitude of sins.[^c]" },
  { t = "v", n = 9, text = "Show hospitality to one another without complaining." },
  { t = "v", n = 10, p = true, text = "As good stewards of the manifold grace of God, each of you should use whatever gift he has received to serve one another." },
  { t = "v", n = 11, text = "If anyone speaks, he should speak as one conveying the words of God. If anyone serves, he should serve with the strength God provides, so that in all things God may be glorified through Jesus Christ, to whom be the glory and the power forever and ever. Amen." },
  { t = "h", level = 2, text = "Suffering as Christians" },
  { t = "v", n = 12, p = true, text = "Beloved, do not be surprised at the fiery trial that has come upon you, as though something strange were happening to you." },
  { t = "v", n = 13, text = "But rejoice that you share in the sufferings of Christ, so that you may be overjoyed at the revelation of His glory." },
  { t = "v", n = 14, p = true, text = "If you are insulted for the name of Christ, you are blessed, because the Spirit of glory and of God rests on you.[^d]" },
  { t = "v", n = 15, text = "Indeed, none of you should suffer as a murderer or thief or wrongdoer, or even as a meddler." },
  { t = "v", n = 16, text = "But if you suffer as a Christian, do not be ashamed, but glorify God that you bear that name.[^e]" },
  { t = "v", n = 17, text = "For it is time for judgment to begin with the family of God; and if it begins with us, what will the outcome be for those who disobey the gospel of God?" },
  { t = "v", n = 18, text = "And, “If it is hard for the righteous to be saved, what will become of the ungodly and the sinner?”[^f]" },
  { t = "v", n = 19, p = true, text = "So then, those who suffer according to God’s will should entrust their souls to their faithful Creator and continue to do good." },
  { t = "note", id = "a", text = "BYZ and TR include *for us*." },
  { t = "note", id = "b", text = "Or *to those who are dead*" },
  { t = "note", id = "c", text = "See Proverbs 10:12" },
  { t = "note", id = "d", text = "BYZ and TR include *On their part He is spoken of as evil, but on your part He is glorified.*" },
  { t = "note", id = "e", text = "Literally *glorify God in that name*; NA *glorify God in this matter*" },
  { t = "note", id = "f", text = "Proverbs 11:31 (see also LXX)" },
]

[[section]]
id = "5"
title = "1 Peter 5"
level = 1
blocks = [
  { t = "h", level = 2, text = "Instructions to Elders" },
  { t = "ref", text = "(1 Timothy 3:1–7; Titus 1:5–9)" },
  { t = "v", n = 1, p = true, text = "As a fellow elder, a witness of Christ’s sufferings, and a partaker of the glory to be revealed, I appeal to the elders[^a] among you:" },
  { t = "v", n = 2, text = "Be shepherds of God’s flock that is among you, watching over them[^b] not out of compulsion, but willingly, as God would have you;[^c] not out of greed, but out of eagerness;" },
  { t = "v", n = 3, text = "not lording it over those entrusted to you, but being examples to the flock." },
  { t = "v", n = 4, text = "And when the Chief Shepherd appears, you will receive the crown of glory that will never fade away." },
  { t = "h", level = 2, text = "Cast Your Cares on Him" },
  { t = "v", n = 5, p = true, text = "Young men, in the same way, submit yourselves to your elders. And all of you, clothe yourselves with humility toward one another, because, “God opposes the proud, but gives grace to the humble.”[^d]" },
  { t = "v", n = 6, p = true, text = "Humble yourselves, therefore, under God’s mighty hand, so that in due time He may exalt you." },
  { t = "v", n = 7, text = "Cast all your anxiety on Him, because He cares for you." },
  { t = "v", n = 8, p = true, text = "Be sober-minded and alert. Your adversary the devil prowls around like a roaring lion, seeking someone to devour." },
  { t = "v", n = 9, text = "Resist him, standing firm in your faith and in the knowledge that your brothers throughout the world are undergoing the same kinds of suffering." },
  { t = "h", level = 2, text = "Benediction and Farewell" },
  { t = "v", n = 10, p = true, text = "And after you have suffered for a little while, the God of all grace, who has called you to His eternal glory in Christ,[^e] will Himself restore you, secure you, strengthen you, and establish you." },
  { t = "v", n = 11, text = "To Him be the power forever and ever. Amen." },
  { t = "v", n = 12, p = true, text = "Through Silvanus,[^f] whom I regard as a faithful brother, I have written to you briefly, encouraging you and testifying that this is the true grace of God. Stand firm in it." },
  { t = "v", n = 13, p = true, text = "The church in Babylon,[^g] chosen together with you, sends you greetings, as does my son Mark." },
  { t = "v", n = 14, p = true, text = "Greet one another with a kiss of love. Peace to all of you who are in Christ.[^h]" },
  { t = "note", id = "a", text = "SBL, NE, and WH *I appeal therefore to the elders*" },
  { t = "note", id = "b", text = "NE and WH do not include *watching over them*." },
  { t = "note", id = "c", text = "WH, BYZ, and TR *but willingly*" },
  { t = "note", id = "d", text = "Proverbs 3:34 (see also LXX)" },
  { t = "note", id = "e", text = "BYZ and TR *in Christ Jesus*" },
  { t = "note", id = "f", text = "That is, Silas" },
  { t = "note", id = "g", text = "Literally *She in Babylon*" },
  { t = "note", id = "h", text = "BYZ and TR include *Amen.*" },
]

[[section]]
id = "1"
title = "Zephaniah 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "Zephaniah Prophesies Judgment on Judah" },
  { t = "ref", text = "(Matthew 13:36–43)" },
  { t = "v", n = 1, p = true, text = "This is the word of the LORD that came to Zephaniah son of Cushi, the son of Gedaliah, the son of Amariah, the son of Hezekiah, in the days of Josiah son of Amon king of Judah:" },
  { t = "v", n = 2, indent = 1, p = true, text = "“I will completely sweep away everything from the face of the earth,” declares the LORD." },
  { t = "v", n = 3, indent = 1, text = "“I will sweep away man and beast; I will sweep away the birds of the air, and the fish of the sea, and the idols with their wicked worshipers.[^a] I will cut off mankind from the face of the earth,” declares the LORD." },
  { t = "v", n = 4, indent = 1, text = "“I will stretch out My hand against Judah and against all who dwell in Jerusalem. I will cut off from this place every remnant of Baal, the names of the idolatrous and pagan priests—" },
  { t = "v", n = 5, indent = 1, text = "those who bow on the rooftops to worship the host of heaven, those who bow down and swear by the LORD but also swear by Milcom,[^b]" },
  { t = "v", n = 6, indent = 1, text = "and those who turn back from following the LORD, neither seeking the LORD nor inquiring of Him.”" },
  { t = "h", level = 2, text = "The Day of the LORD" },
  { t = "ref", text = "(Malachi 4:1–6; 1 Thessalonians 5:1–11; 2 Peter 3:8–13)" },
  { t = "v", n = 7, indent = 1, p = true, text = "Be silent in the presence of the Lord GOD, for the Day of the LORD is near. Indeed, the LORD has prepared a sacrifice; He has consecrated His guests." },
  { t = "v", n = 8, indent = 1, p = true, text = "“On the Day of the LORD’s sacrifice I will punish the princes, the sons of the king, and all who are dressed in foreign apparel." },
  { t = "v", n = 9, indent = 1, text = "On that day I will punish all who leap over the threshold,[^c] who fill the house of their master[^d] with violence and deceit." },
  { t = "v", n = 10, indent = 1, text = "On that day,” declares the LORD, “a cry will go up from the Fish Gate, a wail from the Second District,[^e] and a loud crashing from the hills." },
  { t = "v", n = 11, indent = 1, text = "Wail, O dwellers of the Hollow,[^f] for all your merchants[^g] will be silenced; all who weigh out silver will be cut off." },
  { t = "v", n = 12, indent = 1, p = true, text = "And at that time I will search Jerusalem with lamps and punish the men settled in complacency,[^h] who say to themselves, ‘The LORD will do nothing, either good or bad.’" },
  { t = "v", n = 13, indent = 1, text = "Their wealth will be plundered and their houses laid waste. They will build houses but not inhabit them, and plant vineyards but never drink their wine." },
  { t = "v", n = 14, indent = 1, p = true, text = "The great Day of the LORD is near—near and coming quickly. Listen, the Day of the LORD! Then the cry of the mighty will be bitter." },
  { t = "v", n = 15, indent = 1, text = "That day will be a day of wrath, a day of trouble and distress, a day of destruction and desolation, a day of darkness and gloom, a day of clouds and blackness," },
  { t = "v", n = 16, indent = 1, text = "a day of horn blast and battle cry against the fortified cities, and against the high corner towers." },
  { t = "v", n = 17, indent = 1, text = "I will bring such distress on mankind that they will walk like the blind, because they have sinned against the LORD. Their blood will be poured out like dust and their flesh like dung." },
  { t = "v", n = 18, indent = 1, text = "Neither their silver nor their gold will be able to deliver them on the Day of the LORD’s wrath. The whole earth will be consumed by the fire of His jealousy.” For indeed, He will make a sudden end of all who dwell on the earth.[^i]" },
  { t = "note", id = "a", text = "Or *and the idols that cause the wicked to stumble*" },
  { t = "note", id = "b", text = "Or *by their king*; *Milcom* is a variant of *Molech*; see Leviticus 18:21 and 1 Kings 11:7." },
  { t = "note", id = "c", text = "See 1 Samuel 5:5." },
  { t = "note", id = "d", text = "Or *the temple of their gods*" },
  { t = "note", id = "e", text = "Or *the Second Quarter*, a newer section of Jerusalem; Hebrew *the Mishneh*" },
  { t = "note", id = "f", text = "Or *the market district* or *the Mortar*" },
  { t = "note", id = "g", text = "Or *all the people of Canaan*" },
  { t = "note", id = "h", text = "Or *thickening on the dregs*" },
  { t = "note", id = "i", text = "Or *of all the people living in the land*" },
]

[[section]]
id = "2"
title = "Zephaniah 2"
level = 1
blocks = [
  { t = "h", level = 2, text = "A Call to Repentance" },
  { t = "ref", text = "(Joel 1:13–20; Amos 5:4–15; Luke 13:1–5)" },
  { t = "v", n = 1, indent = 1, p = true, text = "Gather yourselves, gather together, O shameful nation," },
  { t = "v", n = 2, indent = 1, text = "before the decree takes effect[^a] and the day passes like chaff, before the burning anger of the LORD comes upon you, before the Day of the LORD’s anger comes upon you." },
  { t = "v", n = 3, indent = 1, text = "Seek the LORD, all you humble of the earth who carry out His justice. Seek righteousness; seek humility. Perhaps you will be sheltered on the day of the LORD’s anger." },
  { t = "h", level = 2, text = "Judgment on the Philistines" },
  { t = "ref", text = "(Jeremiah 47:1–7)" },
  { t = "v", n = 4, indent = 1, p = true, text = "For Gaza will be abandoned, and Ashkelon left in ruins. Ashdod will be driven out at noon, and Ekron will be uprooted." },
  { t = "v", n = 5, indent = 1, text = "Woe to the dwellers of the seacoast, O nation of the Cherethites! The word of the LORD is against you, O Canaan, land of the Philistines: “I will destroy you, and no one will be left.”" },
  { t = "v", n = 6, indent = 1, text = "So the seacoast will become a land of pastures, with wells[^b] for shepherds and folds for sheep." },
  { t = "v", n = 7, indent = 1, text = "The coast will belong to the remnant of the house of Judah; there they will find pasture. They will lie down in the evening among the houses of Ashkelon, for the LORD their God will attend to them and restore their captives.[^c]" },
  { t = "h", level = 2, text = "Judgment on Moab and Ammon" },
  { t = "ref", text = "(Isaiah 16:1–14; Jeremiah 48:1–47)" },
  { t = "v", n = 8, indent = 1, p = true, text = "“I have heard the reproach of Moab and the insults of the Ammonites, who have taunted My people and threatened their borders." },
  { t = "v", n = 9, indent = 1, text = "Therefore, as surely as I live,” declares the LORD of Hosts, the God of Israel, “surely Moab will be like Sodom and the Ammonites like Gomorrah—a place of weeds and salt pits, a perpetual wasteland. The remnant of My people will plunder them; the remainder of My nation will dispossess them.”" },
  { t = "v", n = 10, indent = 1, p = true, text = "This they shall have in return for their pride, for taunting and mocking the people of the LORD of Hosts." },
  { t = "v", n = 11, indent = 1, text = "The LORD will be terrifying to them when He starves all the gods of the earth. Then the nations of every shore will bow in worship to Him, each in its own place." },
  { t = "h", level = 2, text = "Judgment on Cush and Assyria" },
  { t = "v", n = 12, indent = 1, p = true, text = "“You too, O Cushites,[^d] will be slain by My sword.”" },
  { t = "v", n = 13, indent = 1, p = true, text = "And He will stretch out His hand against the north and destroy Assyria; He will make Nineveh a desolation, as dry as a desert." },
  { t = "v", n = 14, indent = 1, text = "Herds will lie down in her midst, creatures of every kind.[^e] Both the desert owl and screech owl[^f] will roost atop her pillars. Their calls will sound from the window, but desolation will lie on the threshold, for He will expose the beams of cedar." },
  { t = "v", n = 15, indent = 1, p = true, text = "This carefree city that dwells securely, that thinks to herself: “I am it, and there is none besides me,” what a ruin she has become, a resting place for beasts. Everyone who passes by her hisses and shakes his fist." },
  { t = "note", id = "a", text = "Hebrew *is given birth*" },
  { t = "note", id = "b", text = "Or *caves* or *camps*" },
  { t = "note", id = "c", text = "Or *their fortunes*" },
  { t = "note", id = "d", text = "That is, people from the upper Nile region" },
  { t = "note", id = "e", text = "Hebrew *beasts of every nation*" },
  { t = "note", id = "f", text = "The precise identification of the animals rendered *desert owl* and *screech owl* is uncertain." },
]

[[section]]
id = "3"
title = "Zephaniah 3"
level = 1
blocks = [
  { t = "h", level = 2, text = "Judgment on Jerusalem" },
  { t = "v", n = 1, indent = 1, p = true, text = "Woe to the city of oppressors, rebellious and defiled!" },
  { t = "v", n = 2, indent = 1, text = "She heeded no voice; she accepted no correction. She does not trust in the LORD; she has not drawn near to her God." },
  { t = "v", n = 3, indent = 1, text = "Her princes are roaring lions; her judges are evening wolves, leaving nothing for the morning." },
  { t = "v", n = 4, indent = 1, text = "Her prophets are reckless, faithless men. Her priests profane the sanctuary; they do violence to the law." },
  { t = "v", n = 5, indent = 1, text = "The LORD within her is righteous; He does no wrong. He applies His justice morning by morning; He does not fail at dawn, yet the unjust know no shame." },
  { t = "h", level = 2, text = "Purification of the Nations" },
  { t = "v", n = 6, indent = 1, p = true, text = "“I have cut off the nations; their corner towers are destroyed. I have made their streets deserted with no one to pass through. Their cities are laid waste, with no man, no inhabitant." },
  { t = "v", n = 7, indent = 1, text = "I said, ‘Surely you will fear Me and accept correction.’ Then her dwelling place would not be cut off despite all for which I punished her. But they rose early to corrupt all their deeds." },
  { t = "v", n = 8, indent = 1, text = "Therefore wait for Me,” declares the LORD, “until the day I rise to testify.[^a] For My decision is to gather nations, to assemble kingdoms, to pour out upon them My indignation—all My burning anger. For all the earth will be consumed by the fire of My jealousy." },
  { t = "h", level = 2, text = "A Faithful Remnant" },
  { t = "v", n = 9, indent = 1, p = true, text = "For then I will restore pure lips to the peoples, that all may call upon the name of the LORD and serve Him shoulder to shoulder." },
  { t = "v", n = 10, indent = 1, text = "From beyond the rivers of Cush[^b] My worshipers, My scattered people, will bring Me an offering." },
  { t = "v", n = 11, indent = 1, text = "On that day you will not be put to shame for any of the deeds by which you have transgressed against Me. For then I will remove from among you those who rejoice in their pride, and you will never again be haughty on My holy mountain." },
  { t = "v", n = 12, indent = 1, text = "But I will leave within you a meek and humble people, and they will trust in the name of the LORD." },
  { t = "v", n = 13, indent = 1, text = "The remnant of Israel will no longer do wrong or speak lies, nor will a deceitful tongue be found in their mouths. But they will feed and lie down, with no one to make them tremble.”" },
  { t = "h", level = 2, text = "Israel’s Restoration" },
  { t = "v", n = 14, indent = 1, p = true, text = "Sing for joy, O Daughter of Zion; shout aloud, O Israel! Be glad and rejoice with all your heart, O Daughter of Jerusalem!" },
  { t = "v", n = 15, indent = 1, text = "The LORD has taken away your punishment; He has turned back your enemy. Israel’s King, the LORD, is among you; no longer will you fear any harm." },
  { t = "v", n = 16, indent = 1, text = "On that day they will say to Jerusalem: “Do not fear, O Zion; do not let your hands fall limp." },
  { t = "v", n = 17, indent = 1, text = "The LORD your God is among you; He is mighty to save. He will rejoice over you with gladness; He will quiet you with His love;[^c] He will rejoice over you with singing.”" },
  { t = "v", n = 18, indent = 1, p = true, text = "“I will gather those among you who grieve over the appointed feasts, so that you will no longer suffer reproach." },
  { t = "v", n = 19, indent = 1, text = "Behold, at that time, I will deal with all who afflict you. I will save the lame and gather the scattered; and I will appoint praise and fame for the disgraced throughout the earth." },
  { t = "v", n = 20, indent = 1, text = "At that time I will bring you in; yes, at that time I will gather you. For I will give you fame and praise among all the peoples of the earth when I restore your captives[^d] before your very eyes,” says the LORD." },
  { t = "note", id = "a", text = "LXX and Syriac; Hebrew *rise up to plunder*" },
  { t = "note", id = "b", text = "That is, the upper Nile region" },
  { t = "note", id = "c", text = "Or *He will be silent in His love*; LXX and Syriac *He will renew you with His love*" },
  { t = "note", id = "d", text = "Or *your fortunes*" },
]

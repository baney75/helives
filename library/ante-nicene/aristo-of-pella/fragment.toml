[[section]]
id = "aristo-of-pella"
title = "Aristo of Pella."
level = 1
blocks = [
  { t = "p", text = "[a.d. 140.] Aristo of Pella[^3534] is supposed to have been a Jew, whose work was designed to help the failing Judaism of his country. Though his work is lost, alike the original and the Latin translation of one “Celsus,” it seems to have been a popular tract among Christians of Cyprian’s time, and the Latin preface is often suffixed to editions of that Father." },
  { t = "note", id = "3534", text = "Routh, *R. S*., vol. i. p. 93. Westcott, *Canon*, p. 106. Grabe’s mention. Routh’s discussion, in annotations, is most learned and exhaustive." },
  { t = "p", text = "The work of Aristo is known as the *Disputation of Papiscus and Jason*, and Celsus tells us that Jason was a Hebrew Christian, while his opponent was a Jew of Alexandria. Now, Papiscus owns himself convinced by the arguments of Jason, and concludes by a request to be baptized. Celsus, who seems to have been a heathen or an Epicurean, derides the work with scornful commiseration; but Origen rebukes this, and affirms his respect for the work. All this considered, one must think Aristo was “almost persuaded to be a Christian,” and deserves a place among Christian writers." },
  { t = "p", text = "From the Disputation of Jason and Papiscus." },
  { t = "p", text = "“I remember,” says Jerome (*Comm. ad Gal.*, cap. iii. comm. 13), “in the *Dispute between Jason and Papiscus*, which is composed in Greek, to have found it written: ‘The execration of God is he that is hanged.’”" },
  { t = "p", text = "From the Same Work." },
  { t = "p", text = "Jerome likewise, in his *Hebrew Questions on Genesis*, says: “*In the beginning God made the heaven and the earth*. The majority believe, as it is affirmed also in the *Dispute between Jason and Papiscus*, and as Tertullian in his book *Against Praxeas* contends, and as Hilarius too, in his exposition of one of the Psalms, declares, that in the Hebrew it is: ‘In the Son, God made the heaven and the earth.’ But that this is false, the nature of the case itself proves.”" },
  { t = "p", text = "Perhaps from the Same Work." },
  { t = "p", text = "…And when the man himself[^3535] who had instigated them[^3536] to this folly had paid the just penalty (says Eusebius, *Hist.*, iv. 6), “the whole nation from that time was strictly forbidden to set foot on the region about Jerusalem, by the formal decree and enactment of Adrian, who commanded that they should not even from a distance look on their native soil!” So writes Aristo of Pella." },
  { t = "note", id = "3535", text = "Barchochebas." },
  { t = "note", id = "3536", text = "The Jews." },
  { t = "p", text = "From the Same Work." },
  { t = "p", text = "I have found this expression *Seven heavens* (says Maximus, in *Scholia on the work concerning the Mystical Theology*, ascribed to Dionysius the Areopagite, cap. i.) also in the *Dispute between Papiscus and Jason*, written by Aristo of Pella, which Clement of Alexandria, in the sixth book of the *Outlines*,[^3537] says was composed by Saint Luke." },
  { t = "note", id = "3537", text = "῾Υποτυπώσῶς." },
  { t = "p", text = "Concerning the Same Work." },
  { t = "p", text = "*Thus writes Origen*:[^3538]…in which *book* a Christian is represented disputing with a Jew from the Jewish Scriptures, and showing that the prophecies concerning the Christ apply to Jesus: although his opponent addresses himself to the argument with no common ability,[^3539] and in a manner not unbefitting his Jewish character." },
  { t = "note", id = "3538", text = "*Contra Celsum*, iv. 52." },
  { t = "note", id = "3539", text = "Οὐκ ἀγεννῶς." },
]

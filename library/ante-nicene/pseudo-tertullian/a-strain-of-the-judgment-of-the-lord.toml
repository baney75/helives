[[section]]
id = "part-4"
title = "Part IV. A Strain of the Judgment of the Lord."
level = 1
blocks = [
  { t = "p", text = "(Author Uncertain.)[^1281]" },
  { t = "note", id = "1281", text = "The reader is requested to bear in mind, in reading this piece, tedious in its elaborate struggles after effect, that the constant repetitions of words and expressions with which his patience will be tried, are due to the original. It was irksome to reproduce them; but fidelity is a translator’s first law." },
  { t = "p", text = "Who will for me in fitting strain adapt" },
  { t = "p", text = "Field-haunting muses? and with flowers will grace" },
  { t = "p", text = "The spring-tide’s rosy gales? And who will give" },
  { t = "p", text = "The summer harvest’s heavy stalks mature?" },
  { t = "p", text = "5 And to the autumn’s vines their swollen grapes?" },
  { t = "p", text = "Or who in winter’s honour will commend" },
  { t = "p", text = "The olives, ever-peaceful? and will ope" },
  { t = "p", text = "Waters renewed, even at their fountainheads?" },
  { t = "p", text = "And cut from waving grass the leafy flowers?" },
  { t = "p", text = "10 Forthwith the breezes of celestial light" },
  { t = "p", text = "I will attune. Now be it granted me" },
  { t = "p", text = "To meet the lightsome[^1282] muses! to disclose" },
  { t = "note", id = "1282", text = "Luciferas." },
  { t = "p", text = "The secret rivers on the fluvial top" },
  { t = "p", text = "Of Helicon,[^1283] and gladsome woods that grow" },
  { t = "note", id = "1283", text = "Helicon is not named in the original, but it seems to be meant." },
  { t = "p", text = "15 ’Neath other star.[^1284] And simultaneously" },
  { t = "note", id = "1284", text = "i.e., in another clime or continent. The writer is (or feigns to be) an African. Helicon, of course, is in Europe." },
  { t = "p", text = "I will attune in song the eternal flames;" },
  { t = "p", text = "Whence the sea fluctuates with wave immense:" },
  { t = "p", text = "What power[^1285] moves the solid lands to quake;" },
  { t = "note", id = "1285", text = "Virtus." },
  { t = "p", text = "And whence the golden light first shot its rays" },
  { t = "p", text = "20 On the new world; or who from gladsome clay" },
  { t = "p", text = "Could man have moulded; whence in empty world[^1286]" },
  { t = "note", id = "1286", text = "Sæculo." },
  { t = "p", text = "Our race could have upgrown; and what the greed" },
  { t = "p", text = "Of living which each people so inspires;" },
  { t = "p", text = "What things for ill created are; or what" },
  { t = "p", text = "25 Death’s propagation; whence have rosy wreaths" },
  { t = "p", text = "Sweet smell and ruddy hue; what makes the vine" },
  { t = "p", text = "Ferment in gladsome grapes away; and makes" },
  { t = "p", text = "Full granaries by fruit of slender stalks" },
  { t = "p", text = "distended be; or makes the tree grow ripe" },
  { t = "p", text = "30 ’Mid ice, with olives black; who gives to seeds" },
  { t = "p", text = "Their increments of vigour various;" },
  { t = "p", text = "And with her young’s soft shadowings protects" },
  { t = "p", text = "The mother. Good it is all things to know" },
  { t = "p", text = "Which wondrous are in nature, that it may" },
  { t = "p", text = "35 Be granted us to recognise through all" },
  { t = "p", text = "The true Lord, who light, seas, sky, earth prepared," },
  { t = "p", text = "And decked with varied star the new-made world;[^1287]" },
  { t = "note", id = "1287", text = "Mundum." },
  { t = "p", text = "And first bade beasts and birds to issue forth;" },
  { t = "p", text = "And gave the ocean’s waters to be stocked" },
  { t = "p", text = "40 With fish; and gathered in a mass the sands," },
  { t = "p", text = "With living creatures fertilized. Such strains" },
  { t = "p", text = "With stately[^1288] muses will I spin, and waves" },
  { t = "note", id = "1288", text = "Compositis." },
  { t = "p", text = "Healthful will from their fountainheads disclose:" },
  { t = "p", text = "And may this strain of mine the gladsome shower" },
  { t = "p", text = "45 Catch, which from placid clouds doth come, and flows" },
  { t = "p", text = "Deeply and all unsought into men’s souls," },
  { t = "p", text = "And guide it into our new-fumed lands" },
  { t = "p", text = "In copious rills.[^1289]" },
  { t = "note", id = "1289", text = "I have endeavoured to give some intelligible sense to these lines; but the absence of syntax in the original, as it now stands, makes it necessary to guess at the meaning as best one may." },
  { t = "p", text = "Now come: if any one" },
  { t = "p", text = "Still ignorant of God, and knowing naught" },
  { t = "p", text = "50 Of life to come,[^1290] would fain attain to touch" },
  { t = "note", id = "1290", text = "Venturi ævi." },
  { t = "p", text = "The care-effacing living nymph, and through" },
  { t = "p", text = "The swift waves’ virtue his lost life repair," },
  { t = "p", text = "And ’scape the penalties of flame eterne,[^1291]" },
  { t = "note", id = "1291", text = "“But in them nature’s copy’s not *eterne*.”—Shakespeare, *Macbeth*, act iii. scene 2." },
  { t = "p", text = "And rather win the guerdons of the life" },
  { t = "p", text = "55 To come, let such remember God is One," },
  { t = "p", text = "Alone the object of our prayers; who ’neath" },
  { t = "p", text = "His threshold hath the whole world poised; Himself" },
  { t = "p", text = "Eternally abiding, and to be" },
  { t = "p", text = "Alway for aye; holding the ages[^1292] all;" },
  { t = "note", id = "1292", text = "Sæcula." },
  { t = "p", text = "60 Alone, before all ages;[^1293] unbegotten," },
  { t = "note", id = "1293", text = "Sæcula." },
  { t = "p", text = "Limitless God; who holds alone His seat" },
  { t = "p", text = "Supernal; supereminent alone" },
  { t = "p", text = "Above high heavens; omnipotent alone;" },
  { t = "p", text = "Whom all things do obey; who for Himself" },
  { t = "p", text = "65 Formed, when it pleased Him, man for aye; and gave" },
  { t = "p", text = "Him to be pastor of beasts tame, and lord" },
  { t = "p", text = "Of wild; who by a word[^1294] could stretch forth heaven;" },
  { t = "note", id = "1294", text = "*Sermone tenus*: i.e., the exertion (so to speak) needed to do such mighty works only extended to the uttering of a speech; no more was requisite. See for a similar allusion to the contrast between the making of other things and the making of man, the “Genesis,” 30–39." },
  { t = "p", text = "And with a word could solid earth suspend;" },
  { t = "p", text = "And quicklier than word[^1295] had the seas wave" },
  { t = "note", id = "1295", text = "Dicto." },
  { t = "p", text = "70 Disjoined;[^1296] and man’s dear form with His own hands" },
  { t = "note", id = "1296", text = "i.e., from the solid mass of earth. See Gen. i. 9, 10." },
  { t = "p", text = "Did love to mould; and furthermore did will" },
  { t = "p", text = "His own fair likeness[^1297] to exist in him;" },
  { t = "note", id = "1297", text = "Faciem." },
  { t = "p", text = "And by His Spirit on his countenance" },
  { t = "p", text = "The breath[^1298] of life did breathe." },
  { t = "note", id = "1298", text = "“Auram,” or “breeze.”" },
  { t = "p", text = "Unmindful he" },
  { t = "p", text = "75 Of God, such guilt rashly t’ incur! Beyond" },
  { t = "p", text = "The warning’s range he was not ought to touch.[^1299]" },
  { t = "note", id = "1299", text = "“Immemor ille Dei temere committere tale! Non ultra monitum quidquam contingeret.” Whether I have hit the sense here I know not. In this and in other passages I have punctuated for myself." },
  { t = "p", text = "One fruit illicit, whence he was to know" },
  { t = "p", text = "Forthwith how to discriminate alike" },
  { t = "p", text = "Evil and equity, God him forbade" },
  { t = "p", text = "80 To touch. What functions of the world[^1300] did God" },
  { t = "note", id = "1300", text = "Munera mundi." },
  { t = "p", text = "Permit to man, and sealed the sweet sweet pledge" },
  { t = "p", text = "Of His own love! and jurisdiction gave" },
  { t = "p", text = "O’er birds, and granted him both deep and soil" },
  { t = "p", text = "To tame, and mandates useful did impart" },
  { t = "p", text = "85 Of dear salvation! ’Neath his sway He gave" },
  { t = "p", text = "The lands, the souls of flying things, the race" },
  { t = "p", text = "Feathered, and every race, or tame or wild," },
  { t = "p", text = "Of beasts, and the sea’s race, and monsterforms" },
  { t = "p", text = "Shapeless of swimming things. But since so soon" },
  { t = "p", text = "90 The primal man by primal crime transgressed" },
  { t = "p", text = "The law, and left the mandates of the Lord" },
  { t = "p", text = "(Led by a wife who counselled all the ills)," },
  { t = "p", text = "By death he ’gan to perish. Woman ’twas" },
  { t = "p", text = "Who sin’s first ill committed, and (the law" },
  { t = "p", text = "95 Transgressed) deceived her husband. Eve, induced" },
  { t = "p", text = "By guile, the thresholds oped to death, and proved" },
  { t = "p", text = "To her own self, with her whole race as well," },
  { t = "p", text = "A procreatrix of funereal woes." },
  { t = "p", text = "Hence unanticipated wickedness," },
  { t = "p", text = "100 Hence death, like seed, for aye, is scattered. Then" },
  { t = "p", text = "More frequent grew atrocious deed; and toil" },
  { t = "p", text = "More savage set the corrupt orb astir:" },
  { t = "p", text = "(This lure the crafty serpent spread, inspired" },
  { t = "p", text = "By envy’s self:) then peoples more invent" },
  { t = "p", text = "105 Practices of ill deeds; and by ill deeds" },
  { t = "p", text = "Gave birth to seeds of wickedness." },
  { t = "p", text = "And so" },
  { t = "p", text = "The only Lord, whose is the power supreme." },
  { t = "p", text = "Who o’er the heights the summits holds of heaven" },
  { t = "p", text = "Supreme, and in exalted regions dwells" },
  { t = "p", text = "110 In lofty light for ages, mindful too" },
  { t = "p", text = "Of present time, and of futurity" },
  { t = "p", text = "Prescient beforehand, keeps the progeny" },
  { t = "p", text = "Of ill-desert, and all the souls which move" },
  { t = "p", text = "By reason’s force much-erring man—nor less" },
  { t = "p", text = "115 Their tardy bodies governs He—against" },
  { t = "p", text = "The age decreed, so soon as, stretched in death," },
  { t = "p", text = "Men lay aside their ponderous limbs, and light" },
  { t = "p", text = "As air, shall go, their earthly bonds undone," },
  { t = "p", text = "And take in diverse parts their proper spheres" },
  { t = "p", text = "120 (But some He bids be forthwith by glad gales" },
  { t = "p", text = "Recalled to life, and be in secret kept" },
  { t = "p", text = "To wait the decreed law’s awards, until" },
  { t = "p", text = "Their bodies with resuscitated limbs" },
  { t = "p", text = "Revive.[^1301]) Then shall men ’gin to weigh the awards" },
  { t = "note", id = "1301", text = "These lines, again, are but a guess at the meaning of the original, which is as obscure as defiance of grammar can well make it. The sense seems to be, in brief, that while the vast majority are, immediately on their death, shut up in Hades to await the “decreed age,” i.e., the day of judgment, some, like the children raised by Elijah and Elisha, the man who revived on touching Elisha’s bones, and the like, are raised *to die again*. Lower down it will be seen that the writer believes that the saints who came out of their graves after our Lord’s resurrection (see Matt. xxvii. 51–54) did *not* die again." },
  { t = "p", text = "125 Of their first life, and on their crime and faults" },
  { t = "p", text = "To think, and keep them for their penalties" },
  { t = "p", text = "Which will be far from death; and mindful grow" },
  { t = "p", text = "Of pious duties, by God’s judgments taught;" },
  { t = "p", text = "To wait expectant for their penalty" },
  { t = "p", text = "130 And their descendants’, fruit of their own crime;" },
  { t = "p", text = "Or else to live wholly the life of sheep,[^1302]" },
  { t = "note", id = "1302", text = "Cf. Ps. xlix. 14 (xlviii. 15 in LXX.)." },
  { t = "p", text = "Without a name; and in God’s ear, now deaf," },
  { t = "p", text = "Pour unavailing weeping. Shall not God" },
  { t = "p", text = "Almighty, ’neath whose law are all things ruled," },
  { t = "p", text = "135 Be able after death life to restore?" },
  { t = "p", text = "Or is there ought which the creation’s Lord" },
  { t = "p", text = "Unable seems to do? If, darkness chased," },
  { t = "p", text = "He could outstretch the light, and could compound" },
  { t = "p", text = "All the world’s mass by a word suddenly," },
  { t = "p", text = "140 And raise by potent voice all things from *nought*," },
  { t = "p", text = "Why out of *somewhat*[^1303] could He not compound" },
  { t = "note", id = "1303", text = "i.e., the dust into which our bodies turn." },
  { t = "p", text = "The well-known shape which erst had been, which He" },
  { t = "p", text = "Had moulded formerly; and bid the form" },
  { t = "p", text = "Arise assimilated to Himself" },
  { t = "p", text = "145 Again? Since God’s are all things, earth the more" },
  { t = "p", text = "Gives Him all back; for she will, when He bids," },
  { t = "p", text = "Unweave whate’er she woven had before." },
  { t = "p", text = "If one, perhaps, laid on sepulchral pyre," },
  { t = "p", text = "The flame consumed; or one in its blind waves" },
  { t = "p", text = "150 The ocean have dismembered; if of one" },
  { t = "p", text = "The entrails have, in hunger, satisfied" },
  { t = "p", text = "The fishes; or on any’s limbs wild beasts" },
  { t = "p", text = "Have fastened cruel death; or any’s blood," },
  { t = "p", text = "His body reft by birds, unhid have lain:" },
  { t = "p", text = "155 Yet shall they not wrest from the mighty Lord" },
  { t = "p", text = "His latest dues. Need is that men appear" },
  { t = "p", text = "Quickened from death ’fore God, and at His bar" },
  { t = "p", text = "Stand in their shapes resumed. Thus arid seeds" },
  { t = "p", text = "Are drops into the vacant lands, and deep" },
  { t = "p", text = "160 In the fixt furrows die and rot: and hence" },
  { t = "p", text = "Is not their surface[^1304] animated soon" },
  { t = "note", id = "1304", text = "i.e., the surface or ridge of the furrows." },
  { t = "p", text = "With stalks repaired? and do they[^1305] not grow strong" },
  { t = "note", id = "1305", text = "i.e., the furrows." },
  { t = "p", text = "And yellow with the living grains? and, rich" },
  { t = "p", text = "With various usury,[^1306] new harvests rise" },
  { t = "note", id = "1306", text = "“Some thirty-fold, some sixty-fold, some an hundred-fold.” See the parable of the sower." },
  { t = "p", text = "165 In mass? The stars all set, and, born again," },
  { t = "p", text = "Renew their sheen; and day dies with its light" },
  { t = "p", text = "Lost in dense night; and now night wanes herself" },
  { t = "p", text = "As light unveils creation presently;" },
  { t = "p", text = "And now another and another day" },
  { t = "p", text = "170 Rises from its own stars; and the sun sets," },
  { t = "p", text = "Bright as it is with splendour—bearing light;" },
  { t = "p", text = "Light perishes when by the coming eve" },
  { t = "p", text = "The world[^1307] is shaded; and the phœnix lives" },
  { t = "note", id = "1307", text = "Mundo." },
  { t = "p", text = "By her own soot[^1308] renewed, and presently" },
  { t = "note", id = "1308", text = "Fuligine." },
  { t = "p", text = "175 Rises, again a bird, O wondrous sight!" },
  { t = "p", text = "After her burnings! The bare tree in time" },
  { t = "p", text = "Shoots with her leaves; and once more are her boughs" },
  { t = "p", text = "Curved by the germen of the fruits." },
  { t = "p", text = "While then" },
  { t = "p", text = "The world[^1309] throughout is trembling at God’s voice," },
  { t = "note", id = "1309", text = "Mundo." },
  { t = "p", text = "180 And deeply moved are the high air’s powers,[^1310]" },
  { t = "note", id = "1310", text = "Virtutibus. Perhaps the allusion is to Eph. ii. 2, Matt. xxiv. 29, Luke xxi. 26." },
  { t = "p", text = "Then comes a crash unwonted, then ensue" },
  { t = "p", text = "Heaven’s mightiest murmurs, on the approach of God," },
  { t = "p", text = "The whole world’s[^1311] Judge! His countless ministers" },
  { t = "note", id = "1311", text = "Mundi." },
  { t = "p", text = "Forthwith conjoin their rushing march, and God" },
  { t = "p", text = "185 With majesty supernal fence around." },
  { t = "p", text = "Angelic bands will from the heaven descend" },
  { t = "p", text = "To earth; all, God’s host, whose is faculty" },
  { t = "p", text = "Divine; in form and visage spirits all" },
  { t = "p", text = "Of virtue: in them fiery vigour is;" },
  { t = "p", text = "190 Rutilant are their bodies; heaven’s might" },
  { t = "p", text = "Divine about them flashes; the whole orb" },
  { t = "p", text = "Hence murmurs; and earth, trembling to her depths" },
  { t = "p", text = "(Or whatsoe’er her bulk is[^1312]), echoes back" },
  { t = "note", id = "1312", text = "Vel quanta est. If this be the right sense, the words are probably inserted, because the conflagration of “the earth and the works that are therein” predicted in 2 Pet. iii. 10, and referred to lower down in this piece, is supposed to have begun, and thus the “depths” of the earth are supposed to be already diminishing." },
  { t = "p", text = "The roar, parturient of men, whom she," },
  { t = "p", text = "195 Being bidden, will with grief upyield.[^1313] All stand" },
  { t = "note", id = "1313", text = "I have ventured to alter one letter of the Latin; and for “quos reddere jussa do*c*ebit,” read “quos reddere jussa do*l*ebit.” If the common reading be retained, the only possible meaning seems to be “whom she will teach to render (to God) His commands,” i.e., to render obedience to them; or else, “to render (to God) what they are bidden to render,” i.e., an account of themselves; and earth, as their mother, giving them birth out of her womb, is said to teach them to do this. But the emendation, which is at all events simple, seems to give a better sense: “being bidden to render the dead, whom she is keeping, up, earth will grieve at the throes it causes her, but will do it.”" },
  { t = "p", text = "In wonderment. At last disturbed are" },
  { t = "p", text = "The clouds, and the stars move and quake from height" },
  { t = "p", text = "Of sudden power.[^1314] When thus God comes, with voice" },
  { t = "note", id = "1314", text = "Subitæ virtutis ab alto." },
  { t = "p", text = "Of potent sound, at once throughout all realms" },
  { t = "p", text = "200 The sepulchres are burst, and every ground" },
  { t = "p", text = "Outpours bones from wide chasms, and opening sand" },
  { t = "p", text = "Outbelches living peoples; to the hair[^1315]" },
  { t = "note", id = "1315", text = "Comis, here “the heads.”" },
  { t = "p", text = "The members cleave; the bones inwoven are" },
  { t = "p", text = "With marrow; the entwined sinews rule" },
  { t = "p", text = "205 The breathing bodies; and the veins ’gin throb" },
  { t = "p", text = "With simultaneously infused blood:" },
  { t = "p", text = "And, from their caves dismissed, to open day" },
  { t = "p", text = "Souls are restored, and seek to find again" },
  { t = "p", text = "Each its own organs, as at their own place" },
  { t = "p", text = "210 They rise. O wondrous faith! Hence every age" },
  { t = "p", text = "Shoots forth; forth shoots from ancient dust the host" },
  { t = "p", text = "Of dead. Regaining light, there rise again" },
  { t = "p", text = "Mothers, and sires, and high-souled youths, and boys," },
  { t = "p", text = "And maids unwedded; and deceased old men" },
  { t = "p", text = "215 Stand by with living souls; and with the cries" },
  { t = "p", text = "Of babes the groaning orb resounds.[^1316] Then tribes" },
  { t = "note", id = "1316", text = "This passage is imitated from Virgil, *Æn*., vi. 305 sqq.; *Georg*., iv. 475 sqq." },
  { t = "p", text = "Various from their lowest seats will come:" },
  { t = "p", text = "Bands of the Easterns; those which earth’s extreme" },
  { t = "p", text = "Sees; those which dwell in the downsloping clime" },
  { t = "p", text = "220 Of the mid-world, and hold the frosty star’s" },
  { t = "p", text = "Riphæan citadels. Every colonist" },
  { t = "p", text = "Of every land stands frighted here: the boor;" },
  { t = "p", text = "The son of Atreus[^1317] with his diadem" },
  { t = "note", id = "1317", text = "i.e., “the king.” The “Atridæ” of Homer are referred to,—Agamemnon “king of men,” and Menelaus." },
  { t = "p", text = "Of royalty put off; the rich man mixt" },
  { t = "p", text = "225 Coequally in line with pauper peers." },
  { t = "p", text = "Deep tremor everywhere: then groans the orb" },
  { t = "p", text = "With prayers; and peoples stretching forth their hands" },
  { t = "p", text = "Grow stupid with the din!" },
  { t = "p", text = "The Lord Himself" },
  { t = "p", text = "Seated, is bright with light sublime; and fire" },
  { t = "p", text = "230 Potent in all the Virtues[^1318] flashing shines." },
  { t = "note", id = "1318", text = "Or, “Powers.”" },
  { t = "p", text = "And on His high-raised throne the Heavenly One" },
  { t = "p", text = "Coruscates from His seat; with martyrs hemmed" },
  { t = "p", text = "(A dazzling troop of men), and by His seers" },
  { t = "p", text = "Elect accompanied (whose bodies bright" },
  { t = "p", text = "235 Effulgent are with snowy stoles), He towers" },
  { t = "p", text = "Above them. And now priests in lustrous robes" },
  { t = "p", text = "Attend, who wear upon their marked[^1319] front" },
  { t = "note", id = "1319", text = "Insigni. The allusion seems to be to Ezek. ix. 4, 6, Rev. vii. 3 et seqq., xx. 3, 4, and to the inscribed mitre of the Jewish high priest, see Ex. xxviii. 36; xxxix. 30." },
  { t = "p", text = "Wreaths golden-red; and all submissive kneel" },
  { t = "p", text = "And reverently adore. The cry of all" },
  { t = "p", text = "240 Is one: “O Holy, Holy Holy, God!”" },
  { t = "p", text = "To these[^1320] the Lord will mandate give, to range" },
  { t = "note", id = "1320", text = "I have corrected “*his*” for “*hic*.” If the latter be retained, it would seem to mean “hereon.”" },
  { t = "p", text = "The people in twin lines; and orders them" },
  { t = "p", text = "To set apart by number the depraved;" },
  { t = "p", text = "While such as have His biddings followed" },
  { t = "p", text = "245 With placid words He calls, and bids them, clad" },
  { t = "p", text = "With vigour—death quite conquered—ever dwell" },
  { t = "p", text = "Amid light’s inextinguishable airs," },
  { t = "p", text = "Stroll through the ancients’ ever blooming realm," },
  { t = "p", text = "Through promised wealth, through ever sunny swards," },
  { t = "p", text = "250 And in bright body spend perpetual life." },
  { t = "p", text = "A place there is, beloved of the Lord," },
  { t = "p", text = "In Eastern coasts, where light is bright and clear," },
  { t = "p", text = "And healthier blows the breeze; day is eterne," },
  { t = "p", text = "Time changeless: ’tis a region set apart" },
  { t = "p", text = "255 By God, most rich in plains, and passing blest," },
  { t = "p", text = "In the meridian[^1321] of His cloudless seat." },
  { t = "note", id = "1321", text = "Cardine, i.e., the *hinge* as it were upon which the sun turns in his course." },
  { t = "p", text = "There gladsome the air, and is in light" },
  { t = "p", text = "Ever to be; soft is the wind, and breathes" },
  { t = "p", text = "Life-giving blasts; earth, fruitful with a soil" },
  { t = "p", text = "260 Luxuriant, bears all things; in the meads" },
  { t = "p", text = "Flowers shed their fragrance; and upon the plains" },
  { t = "p", text = "The purple—not in envy—mingles all" },
  { t = "p", text = "With golden-ruddy light. One gladsome flower," },
  { t = "p", text = "With its own lustre clad, another clothes;" },
  { t = "p", text = "265 And here with many a seed the dewy fields" },
  { t = "p", text = "Are dappled, and the snowy tilths are crisped" },
  { t = "p", text = "With rosy flowers. No region happier" },
  { t = "p", text = "Is known in other spots; none which in look" },
  { t = "p", text = "Is fairer, or in honour more excels." },
  { t = "p", text = "270 Never in flowery gardens are there born" },
  { t = "p", text = "Such lilies, nor do such upon our plains" },
  { t = "p", text = "Outbloom; nor does the rose so blush, what time," },
  { t = "p", text = "New-born, ’tis opened by the breeze; nor is" },
  { t = "p", text = "The purple with such hue by Tyrian dye" },
  { t = "p", text = "275 Imbued. With coloured pebbles beauteous gleams" },
  { t = "p", text = "The gem: here shines the prasinus;[^1322] there glows" },
  { t = "note", id = "1322", text = "See the “Genesis,” 73." },
  { t = "p", text = "The carbuncle; and giant-emerald" },
  { t = "p", text = "Is green with grassy light. Here too are born" },
  { t = "p", text = "The cinnamons, with odoriferous twigs;" },
  { t = "p", text = "280 And with dense leaf gladsome amomum joins" },
  { t = "p", text = "Its fragrance. Here, a native, lies the gold" },
  { t = "p", text = "Of radiant sheen; and lofty groves reach heaven" },
  { t = "p", text = "In blooming time, and germens fruitfullest" },
  { t = "p", text = "Burden the living boughs. No glades like these" },
  { t = "p", text = "285 Hath Ind herself forth-stretcht; no tops so dense" },
  { t = "p", text = "Rears on her mount the pine; nor with a shade" },
  { t = "p", text = "So lofty-leaved is her cypress crisped;" },
  { t = "p", text = "Nor better in its season blooms her bough" },
  { t = "p", text = "In spring-tide. Here black firs on lofty peak" },
  { t = "p", text = "290 Bloom; and the only woods that know no hail" },
  { t = "p", text = "Are green eternally: no foliage falls;" },
  { t = "p", text = "At no time fails the flower. There, too, there blooms" },
  { t = "p", text = "A flower as red as Tarsine purple is:" },
  { t = "p", text = "A rose, I ween, it is (red hue it has," },
  { t = "p", text = "295 An odour keen); such aspect on its leaves" },
  { t = "p", text = "It wears, such odour breathes. A tree it[^1323] stands," },
  { t = "note", id = "1323", text = "Or, “there.” The question is, whether a different tree is meant, or the rose just spoken of." },
  { t = "p", text = "With a new flower, fairest in fruits; a crop" },
  { t = "p", text = "Life-giving, dense, its happy strength does yield." },
  { t = "p", text = "Rich honies with green cane their fragrance join," },
  { t = "p", text = "300 And milk flows potable in runners full;" },
  { t = "p", text = "And with whate’er that sacred earth is green," },
  { t = "p", text = "It all breathes life; and there Crete’s healing gift[^1324]" },
  { t = "note", id = "1324", text = "This seems to be *marshmallows.*" },
  { t = "p", text = "Is sweetly redolent. There, with smooth tide," },
  { t = "p", text = "Flows in the placid plains a fount: four floods" },
  { t = "p", text = "305 Thence water parted lands.[^1325] The garden robed" },
  { t = "note", id = "1325", text = "Here again it is plain that the writer is drawing his description from what we read of the garden of Eden." },
  { t = "p", text = "With flowers, I wot, keeps ever spring; no cold" },
  { t = "p", text = "Of wintry star varies the breeze; and earth," },
  { t = "p", text = "After her birth-throes, with a kindlier blast" },
  { t = "p", text = "Repairs. Night there is none; the stars maintain" },
  { t = "p", text = "310 Their darkness; angers, envies, and dire greed" },
  { t = "p", text = "Are absent; and out-shut is fear, and cares" },
  { t = "p", text = "Driven from the threshold. Here the Evil One" },
  { t = "p", text = "Is homeless; he is into worthy courts" },
  { t = "p", text = "Out-gone, nor is’t e’er granted him to touch" },
  { t = "p", text = "315 The glades forbidden. But here ancient faith" },
  { t = "p", text = "Rests in elect abode; and life here treads," },
  { t = "p", text = "Joying in an eternal covenant;" },
  { t = "p", text = "And health[^1326] without a care is gladsome here" },
  { t = "note", id = "1326", text = "“Salus,” health (probably) in its widest sense, both bodily and mental; or perhaps “safety,” “salvation.”" },
  { t = "p", text = "In placid tilths, ever to live and be" },
  { t = "p", text = "320 Ever in light." },
  { t = "p", text = "Here whosoe’er hath lived" },
  { t = "p", text = "Pious, and cultivant of equity" },
  { t = "p", text = "And goodness; who hath feared the thundering God" },
  { t = "p", text = "With mind sincere; with sacred duteousness" },
  { t = "p", text = "Tended his parents; and his other life[^1327]" },
  { t = "note", id = "1327", text = "Reliquam vitam, i.e., apparently his life in all other relations; unless it mean his life *after his parents’ death*, which seems less likely." },
  { t = "p", text = "325 Spent ever crimeless; or who hath consoled" },
  { t = "p", text = "With faithful help a friend in indigence;" },
  { t = "p", text = "Succoured the over-toiling needy one," },
  { t = "p", text = "As orphans’ patron, and the poor man’s aid;" },
  { t = "p", text = "Rescued the innocent, and succoured them" },
  { t = "p", text = "330 When press with accusation; hath to guests" },
  { t = "p", text = "His ample table’s pledges given; hath done" },
  { t = "p", text = "All things divinely; pious offices" },
  { t = "p", text = "Enjoined; done hurt to none; ne’er coveted" },
  { t = "p", text = "Another’s: such as these, exulting all" },
  { t = "p", text = "335 In divine praises, and themselves at once" },
  { t = "p", text = "Exhorting, raise their voices to the stars;" },
  { t = "p", text = "Thanksgivings to the Lord in joyous wise" },
  { t = "p", text = "They psalming celebrate; and they shall go" },
  { t = "p", text = "Their harmless way with comrade messengers." },
  { t = "p", text = "340 When ended hath the Lord these happy gifts," },
  { t = "p", text = "And likewise sent away to realms eterne" },
  { t = "p", text = "The just, then comes a pitiable crowd" },
  { t = "p", text = "Wailing its crimes; with parching tears it pours" },
  { t = "p", text = "All groans effusely, and attests[^1328] in acts" },
  { t = "note", id = "1328", text = "i.e., “appeals to.” So Burke: “I *attest* the former, I *attest* the coming generations.” This “attesting of its acts” seems to refer to Matt. xxv. 44. It appeals to them in hope of mitigating its doom." },
  { t = "p", text = "345 With frequent ululations. At the sight" },
  { t = "p", text = "Of flames, their merit’s due, and stagnant pools" },
  { t = "p", text = "Of fire, wrath’s weapons, they ’gin tremble all.[^1329]" },
  { t = "note", id = "1329", text = "This seems to be the sense. The Latin stands thus: “Flammas pro meritis, stagnantia tela tremiscunt.”" },
  { t = "p", text = "Them an angelic host, upsnatching them," },
  { t = "p", text = "Forbids to pray, forbids to pour their cries" },
  { t = "p", text = "350 (Too late!) with clamour loud: pardon withheld," },
  { t = "p", text = "Into the lowest bottom they are hurled!" },
  { t = "p", text = "O miserable men! how oft to you" },
  { t = "p", text = "Hath Majesty divine made itself known!" },
  { t = "p", text = "The sounds of heaven ye have heard; have seen" },
  { t = "p", text = "355 Its lightnings; have experienced its rains" },
  { t = "p", text = "Assiduous; its ires of winds and hail!" },
  { t = "p", text = "How often nights and days serene do make" },
  { t = "p", text = "Your seasons—God’s gifts—fruitful with fair yields!" },
  { t = "p", text = "Roses were vernal; the grain’s summer-tide" },
  { t = "p", text = "360 Failed not; the autumn variously poured" },
  { t = "p", text = "Its mellow fruits; the rugged winter brake" },
  { t = "p", text = "The olives, icy though they were: ’twas God" },
  { t = "p", text = "Who granted all, nor did His goodness fail." },
  { t = "p", text = "At God earth trembled; on His voice the deep" },
  { t = "p", text = "365 Hung, and the rivers trembling fled and left" },
  { t = "p", text = "Sands dry; and every creature everywhere" },
  { t = "p", text = "Confesses God! Ye (miserable men!)" },
  { t = "p", text = "Have heaven’s Lord and earth’s denied; and oft" },
  { t = "p", text = "(Horrible!) have God’s heralds put to flight;[^1330]" },
  { t = "note", id = "1330", text = "Or, “banished.”" },
  { t = "p", text = "370 And rather slain the just with slaughter fell;" },
  { t = "p", text = "And, after crime, fraud ever hath in you" },
  { t = "p", text = "Inhered. Ye then shall reap the natural fruit" },
  { t = "p", text = "Of your iniquitous sowing. That God is" },
  { t = "p", text = "Ye know; yet are ye wont to laugh at Him." },
  { t = "p", text = "375 Into deep darkness ye shall go of fire" },
  { t = "p", text = "And brimstone; doomed to suffer glowing ires" },
  { t = "p", text = "In torments just.[^1331] God bids your bones descend" },
  { t = "note", id = "1331", text = "I adopt the correction (suggested in Migne) of just*is* for just*as*." },
  { t = "p", text = "To[^1332] penalty eternal; go beneath" },
  { t = "note", id = "1332", text = "This is an extraordinary use for the Latin dative; and even if the meaning be “*for* (i.e., to suffer) penalty eternal,” it is scarcely less so." },
  { t = "p", text = "The ardour of an endless raging hell;[^1333]" },
  { t = "note", id = "1333", text = "Gehennæ." },
  { t = "p", text = "380 Be urged, a seething mass, through rotant pools" },
  { t = "p", text = "Of flame; and into threatening flame He bids" },
  { t = "p", text = "The elements convert; and all heaven’s fire" },
  { t = "p", text = "Descend in clouds." },
  { t = "p", text = "Then greedy Tartarus" },
  { t = "p", text = "With rapid fire enclosed is; and flame" },
  { t = "p", text = "385 Is fluctuant within with tempest waves;" },
  { t = "p", text = "And the whole earth her whirling embers blends!" },
  { t = "p", text = "There is a flamy furrow; teeth acute" },
  { t = "p", text = "Are turned to plough it, and for all the years[^1334]" },
  { t = "note", id = "1334", text = "Or, “*in* all the years:” but see note 5 on this page." },
  { t = "p", text = "The fiery torrent will be armed: with force" },
  { t = "p", text = "390 Tartarean will the conflagrations gnash" },
  { t = "p", text = "Their teeth upon the world.[^1335] There are they scorched" },
  { t = "note", id = "1335", text = "Mundo." },
  { t = "p", text = "In seething tide with course precipitate;" },
  { t = "p", text = "Hence flee; thence back are borne in sharp career;" },
  { t = "p", text = "The savage flame’s ire meets them fugitive!" },
  { t = "p", text = "395 And now at length they own the penalty" },
  { t = "p", text = "Their own, the natural issue of their crime." },
  { t = "p", text = "And now the reeling earth, by not a swain" },
  { t = "p", text = "Possest, is by the sea’s profundity" },
  { t = "p", text = "Prest, at her farthest limit, where the sun" },
  { t = "p", text = "400 (His ray out-measured) divides the orb," },
  { t = "p", text = "And where, when traversed is the world,[^1336] the stars" },
  { t = "note", id = "1336", text = "Mundo." },
  { t = "p", text = "Are hidden. Ether thickens. O’er the light" },
  { t = "p", text = "Spreads sable darkness; and the latest flames" },
  { t = "p", text = "Stagnate in secret rills. A place there is" },
  { t = "p", text = "405 Whose nature is with sealed penalties" },
  { t = "p", text = "Fiery, and a dreadful marsh white-hot" },
  { t = "p", text = "With heats infernal, where, in furnaces" },
  { t = "p", text = "Horrific, penal deed roars loud, and seethes," },
  { t = "p", text = "And, rushing into torments, is up-caught" },
  { t = "p", text = "410 By the flame’s vortex wide; by savage wave" },
  { t = "p", text = "And surge the turbid sand all mingled is" },
  { t = "p", text = "With miry bottom. Hither will be sent," },
  { t = "p", text = "Groaning, the captive crowd of evil ones," },
  { t = "p", text = "And wickedness (the sinful body’s train)" },
  { t = "p", text = "415 To burn! Great is the beating there of breasts," },
  { t = "p", text = "By bellowing of grief accompanied;" },
  { t = "p", text = "Wild is the hissing of the flames, and thence" },
  { t = "p", text = "The ululation of the sufferers!" },
  { t = "p", text = "And flames, and limbs sonorous,[^1337] will outrise" },
  { t = "note", id = "1337", text = "“Artusque sonori,” i.e., probably the arms and hands with which (as has been suggested just before) the sufferers beat their unhappy breasts." },
  { t = "p", text = "420 Afar: more fierce will the fire burn; and up" },
  { t = "p", text = "To th’ upper air the groaning will be borne." },
  { t = "p", text = "Then human progeny its bygone deeds" },
  { t = "p", text = "Of ill will weigh; and will begin to stretch" },
  { t = "p", text = "Heavenward its palms; and then will wish to know" },
  { t = "p", text = "425 The Lord, whom erst it would not know, what time" },
  { t = "p", text = "To know Him had proved useful to them. There," },
  { t = "p", text = "His life’s excesses, handiworks unjust," },
  { t = "p", text = "And crimes of savage mind, each will confess," },
  { t = "p", text = "And at the knowledge of the impious deeds" },
  { t = "p", text = "430 Of his own life will shudder. And now first," },
  { t = "p", text = "Whoe’er erewhile cherished ill thoughts of God;" },
  { t = "p", text = "Had worshipped stones unsteady, lyingly" },
  { t = "p", text = "Pretending to divinity; hath e’er" },
  { t = "p", text = "Made sacred to gore-stained images" },
  { t = "p", text = "435 Altars; hath voiceless pictured figures feared;" },
  { t = "p", text = "Hath slender shades of false divinity" },
  { t = "p", text = "Revered; whome’er ill error onward hath" },
  { t = "p", text = "Seduced; whoe’er was an adulterer," },
  { t = "p", text = "Or with the sword had slain his sons; whoe’er" },
  { t = "p", text = "440 Had stalked in robbery; whoe’er by fraud" },
  { t = "p", text = "His clients had deferred; whoe’er with mind" },
  { t = "p", text = "Unfriendly had behaved himself, or stained" },
  { t = "p", text = "His palms with blood of men, or poison mixt" },
  { t = "p", text = "Wherein death lurked, or robed with wicked guise" },
  { t = "p", text = "445 His breast, or at his neighbour’s ill, or gain" },
  { t = "p", text = "Iniquitous, was wont to joy; whoe’er" },
  { t = "p", text = "Committed whatsoever wickedness" },
  { t = "p", text = "Of evil deeds: him mighty heat shall rack," },
  { t = "p", text = "And bitter fire; and these all shall endure," },
  { t = "p", text = "450 In passing painful death, their punishment." },
  { t = "p", text = "Thus shall the vast crowd lie of mourning men!" },
  { t = "p", text = "This oft as holy prophets sang of old," },
  { t = "p", text = "And (by God’s inspiration warned) oft told" },
  { t = "p", text = "The future, none (’tis pity!) none (alas!)" },
  { t = "p", text = "455 Did lend his ears. But God Almighty willed" },
  { t = "p", text = "His guerdons to be known, and His law’s threats" },
  { t = "p", text = "’Mid multitudes of such like signs promulged." },
  { t = "p", text = "He ’stablished them[^1338] by sending prophets more," },
  { t = "note", id = "1338", text = "i.e., the “guerdons” and the “threats.”" },
  { t = "p", text = "These likewise uttering words divine; and some," },
  { t = "p", text = "460 Roused from their sleep, He bids go from their tombs" },
  { t = "p", text = "Forth with Himself, when He, His own tomb burst," },
  { t = "p", text = "Had risen. Many ’wildered were, indeed," },
  { t = "p", text = "To see the tombs agape, and in clear light" },
  { t = "p", text = "Corpses long dead appear; and, wondering" },
  { t = "p", text = "465 At their discourses pious, dulcet words!" },
  { t = "p", text = "Starward they stretch their palms at the mere sound,[^1339]" },
  { t = "note", id = "1339", text = "“Ipsa voce,” unless it mean “voice and all,” i.e., and their voice as well as their palms." },
  { t = "p", text = "And offer God and so—victorious Christ" },
  { t = "p", text = "Their gratulating homage. Certain ’tis" },
  { t = "p", text = "That *these* no more re-sought their silent graves," },
  { t = "p", text = "470 Nor were retained within earth’s bowels shut;[^1340]" },
  { t = "note", id = "1340", text = "See note 1, p. 137." },
  { t = "p", text = "But the remaining host reposes now" },
  { t = "p", text = "In lowliest beds, until—time’s circuit run—" },
  { t = "p", text = "That great day do arrive." },
  { t = "p", text = "Now all of you" },
  { t = "p", text = "Own the true Lord, who alone makes this soul" },
  { t = "p", text = "475 Of ours to see His light[^1341] and can the same" },
  { t = "note", id = "1341", text = "Here again a correction suggested in Migne’s ed., of “su*am* luc*em*” for “su*a* luc*e*,” is adopted." },
  { t = "p", text = "(To Tartarus sent) subject to penalties;" },
  { t = "p", text = "And to whom all the power of life and death" },
  { t = "p", text = "Is open. Learn that God *can* do whate’er" },
  { t = "p", text = "He list; for ’tis enough for Him to *will*," },
  { t = "p", text = "480 And by mere speaking He achieves the deed;" },
  { t = "p", text = "And Him nought plainly, by withstanding, checks." },
  { t = "p", text = "He is my God alone, to whom I trust" },
  { t = "p", text = "With deepest senses. But, since death concludes" },
  { t = "p", text = "Every career, let whoe’er *is* to-day" },
  { t = "p", text = "485 Bethink him over all things in his mind." },
  { t = "p", text = "And thus, while life remains, while ’tis allowed" },
  { t = "p", text = "To see the light and change your life, before" },
  { t = "p", text = "The limit of allotted age o’ertake" },
  { t = "p", text = "You unawares, and that last day, which[^1342] is" },
  { t = "note", id = "1342", text = "“Qui” is read here, after Migne’s suggestion, for “quia;” and Oehler’s and Migne’s punctuation both are set aside." },
  { t = "p", text = "490 By death’s law fixt, your senseless eyes do glaze," },
  { t = "p", text = "Seek what remains worth seeking: watchful be" },
  { t = "p", text = "For dear salvation; and run down with ease" },
  { t = "p", text = "And certainty the good course. Wipe away" },
  { t = "p", text = "By pious sacred rites your past misdeeds" },
  { t = "p", text = "495 Which expiation need; and shun the storms," },
  { t = "p", text = "The too uncertain tempests, of the world.[^1343]" },
  { t = "note", id = "1343", text = "Mundi." },
  { t = "p", text = "Then turn to right paths, and keep sanctities." },
  { t = "p", text = "Hence from your gladsome minds depraved crime" },
  { t = "p", text = "Quite banish; and let long-inveterate fault" },
  { t = "p", text = "500 Be washed forth from your breast; and do away" },
  { t = "p", text = "Wicked ill-stains contracted; and appease" },
  { t = "p", text = "Dread God by prayers eternal; and let all" },
  { t = "p", text = "Most evil mortal things to living good" },
  { t = "p", text = "Give way: and now at once a new life keep" },
  { t = "p", text = "505 Without a crime; and let your minds begin" },
  { t = "p", text = "To use themselves to good things and to true:" },
  { t = "p", text = "And render ready voices to God’s praise." },
  { t = "p", text = "Thus shall your piety find better things" },
  { t = "p", text = "All growing to a flame; thus shall ye, too," },
  { t = "p", text = "510 Receive the gifts of the celestial life;[^1344]" },
  { t = "note", id = "1344", text = "Or, “assume the functions of the heavenly life.”" },
  { t = "p", text = "And, to long age, shall ever live with God," },
  { t = "p", text = "Seeing the starry kingdom’s golden joys." },
]

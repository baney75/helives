[[section]]
id = "book-1"
title = "Book I. Of the Divine Unity, and the Resurrection of the Flesh."
level = 1
blocks = [
  { t = "h", text = "5. Five Books in Reply to Marcion." },
  { t = "h", text = "(Author Uncertain.)" },
  { t = "p", text = "Book I.—Of the Divine Unity, and the Resurrection of the Flesh." },
  { t = "p", text = "Part I.—Of the Divine Unity." },
  { t = "p", text = "After the Evil One’s impiety" },
  { t = "p", text = "Profound, and his life-grudging mind, entrapped" },
  { t = "p", text = "Seducèd men with empty hope, it laid" },
  { t = "p", text = "Them bare, by impious suasion to false trust" },
  { t = "p", text = "5 In him,—not with impunity, indeed;" },
  { t = "p", text = "For he forthwith, as guilty of the deed," },
  { t = "p", text = "And author rash of such a wickedness," },
  { t = "p", text = "Received deserved maledictions. Thus," },
  { t = "p", text = "Thereafter, maddened, he, most desperate foe," },
  { t = "p", text = "10 Did more assail and instigate men’s minds" },
  { t = "p", text = "In darkness sunk. He taught them to forget" },
  { t = "p", text = "The Lord, and leave sure hope, and idols vain" },
  { t = "p", text = "Follow, and shape themselves a crowd of gods," },
  { t = "p", text = "Lots, auguries, false names of stars, the show" },
  { t = "p", text = "15 Of being able to o’errule the births" },
  { t = "p", text = "Of embryos by inspecting entrails, and" },
  { t = "p", text = "Expecting things to come, by hardihood" },
  { t = "p", text = "Of dreadful magic’s renegadoes led," },
  { t = "p", text = "Wondering at a mass of feigned lore;" },
  { t = "p", text = "20 And he impelled them headlong to spurn life," },
  { t = "p", text = "Sunk in a criminal insanity;" },
  { t = "p", text = "To joy in blood; to threaten murders fell;" },
  { t = "p", text = "To love the wound, then, in their neighbour’s flesh;" },
  { t = "p", text = "Or, burning, and by pleasure’s heat entrapped," },
  { t = "p", text = "25 To transgress nature’s covenants, and stain" },
  { t = "p", text = "Pure bodies, manly sex, with an embrace" },
  { t = "p", text = "Unnameable, and uses feminine" },
  { t = "p", text = "Mingled in common contact lawlessly;" },
  { t = "p", text = "Urging embraces chaste, and dedicate" },
  { t = "p", text = "30 To generative duties, to be held" },
  { t = "p", text = "For intercourse obscene for passion’s sake." },
  { t = "p", text = "Such in time past his deeds, assaulting men," },
  { t = "p", text = "Through the soul’s lurking-places, with a flow" },
  { t = "p", text = "Of scorpion-venom,—not that men would blame" },
  { t = "p", text = "35 Him, for they followed of their own accord:" },
  { t = "p", text = "His suasion was in guile; in freedom man" },
  { t = "p", text = "Performed it." },
  { t = "p", text = "Whileas the perfidious one" },
  { t = "p", text = "Continuously through the centuries[^1345]" },
  { t = "note", id = "1345", text = "Sæcula." },
  { t = "p", text = "Is breathing such ill fumes, and into hearts" },
  { t = "p", text = "40 Seduced injecting his own counselling" },
  { t = "p", text = "And hoping in his folly (alas!) to find" },
  { t = "p", text = "Forgiveness of his wickedness, unware" },
  { t = "p", text = "What sentence on his deed is waiting him;" },
  { t = "p", text = "With words of wisdom’s weaving,[^1346] and a voice" },
  { t = "note", id = "1346", text = "The “tectis” of the edd. I have ventured to alter to “textis,” which gives (as in my text) a far better sense." },
  { t = "p", text = "45 Presaging from God’s Spirit, speak a host" },
  { t = "p", text = "Of prophets. Publicly he[^1347] does not dare" },
  { t = "note", id = "1347", text = "i.e., the Evil One." },
  { t = "p", text = "Nakedly to speak evil of the Lord," },
  { t = "p", text = "Hoping by secret ingenuity" },
  { t = "p", text = "He possibly may lurk unseen. At length" },
  { t = "p", text = "50 The soul’s Light[^1348] as the thrall of flesh is held;" },
  { t = "note", id = "1348", text = "i.e., the Son of God." },
  { t = "p", text = "The hope of the despairing, mightier" },
  { t = "p", text = "Than foe, enters the lists; the Fashioner," },
  { t = "p", text = "The Renovator, of the body He;" },
  { t = "p", text = "True Glory of the Father; Son of God;" },
  { t = "p", text = "55 Author unique; a Judge and Lord He came," },
  { t = "p", text = "The orb’s renowned King; to the opprest" },
  { t = "p", text = "Prompt to give pardon, and to loose the bound;" },
  { t = "p", text = "Whose friendly aid and penal suffering" },
  { t = "p", text = "Blend God and renewed man in one. With child" },
  { t = "p", text = "60 Is holy virgin: life’s new gate opes; words" },
  { t = "p", text = "Of prophets find their proof, fulfilled by facts;" },
  { t = "p", text = "Priests[^1349] leave their temples, and—a star their guide—" },
  { t = "note", id = "1349", text = "i.e., the Magi." },
  { t = "p", text = "Wonder the Lord so mean a birth should choose." },
  { t = "p", text = "Waters—sight memorable!—turn to wine;" },
  { t = "p", text = "65 Eyes are restored to blind; fiends trembling cry," },
  { t = "p", text = "Outdriven by His bidding, and own Christ!" },
  { t = "p", text = "All limbs, already rotting, by a word" },
  { t = "p", text = "Are healed; now walks the lame; the deaf forthwith" },
  { t = "p", text = "Hears hope; the maimed extends his hand; the dumb" },
  { t = "p", text = "70 Speaks mighty words: sea at His bidding calms," },
  { t = "p", text = "Winds drop; and all things recognise the Lord:" },
  { t = "p", text = "Confounded is the foe, and yields, though fierce," },
  { t = "p", text = "Now triumphed over, to unequal[^1350] arms!" },
  { t = "note", id = "1350", text = "i.e., arms which *seemed* unequal; for the cross, in which Christ *seemed* to be vanquished, was the very means of His triumph. See Col. ii. 14, 15." },
  { t = "p", text = "When all his enterprises now revoked" },
  { t = "p", text = "75 He[^1351] sees; the flesh, once into ruin sunk," },
  { t = "note", id = "1351", text = "i.e., the Enemy." },
  { t = "p", text = "Now rising; man—death vanquisht quite—to heavens" },
  { t = "p", text = "Soaring; the peoples sealed with holy pledge" },
  { t = "p", text = "Outpoured;[^1352] the work and envied deeds of might" },
  { t = "note", id = "1352", text = "i.e., with the Holy Spirit, the “Pledge” or “Promise” of the Father (see Acts i. 4, 5), “outpoured” upon “the peoples”—both Jewish and Gentile—on the day of Pentecost and many subsequent occasions; see, for instances, Acts x. and xix." },
  { t = "p", text = "Marvellous;[^1353] and hears, too, of penalties" },
  { t = "note", id = "1353", text = "The “mirandæ virtutis opus, invisaque facts,” I take to be the miracles wrought by the apostles through the might (virtus) of the Spirit, as we read in the Acts. These were objects of “envy” to the Enemy, and to such as—like Simon Magus, of whom we find record—were his servants." },
  { t = "p", text = "80 Extreme, and of perpetual dark, prepared" },
  { t = "p", text = "For himself by the Lord by God’s decree" },
  { t = "p", text = "Irrevocable; naked and unarmed," },
  { t = "p", text = "Damned, vanquisht, doomed to perish in a death" },
  { t = "p", text = "Perennial, guilty now, and sure that he" },
  { t = "p", text = "85 No pardon has, a last impiety" },
  { t = "p", text = "Forthwith he dares,—to scatter everywhere" },
  { t = "p", text = "A word for ears to shudder at, nor meet" },
  { t = "p", text = "For voice to speak. Accosting men cast off" },
  { t = "p", text = "From God’s community,[^1354] men wandering" },
  { t = "note", id = "1354", text = "i.e., excommunicated, as Marcion was. The “last impiety” (*extremum nefas*), or “last atrocity” (*extremum facinus*),—see 218, lower down—seems to mean the introduction of *heretical teaching*." },
  { t = "p", text = "90 Without the light, found mindless, following" },
  { t = "p", text = "Things earthly, them he teaches to become" },
  { t = "p", text = "Depraved teachers of depravity." },
  { t = "p", text = "By[^1355] them he preaches that there are two Sires," },
  { t = "note", id = "1355", text = "This use of the ablative, though quite against classical usage, is apparently admissible in late Latinity. It seems to me that the “his” *is* an ablative here, the men being regarded for the moment as merely *instruments*, not *agents*; but it *may* be a dative =\"*to* these he preaches,” etc., i.e., he dictates *to* them what they afterwards are to teach in public." },
  { t = "p", text = "And realms divided: ill’s cause is the Lord[^1356]" },
  { t = "note", id = "1356", text = "It must be borne in mind that “Dominus” (the Lord), and “Deus” (God), are kept as distinct terms throughout this piece." },
  { t = "p", text = "95 Who built the orb, fashioned breath-quickened flesh," },
  { t = "p", text = "And gave the law, and by the seers’ voice spake." },
  { t = "p", text = "Him he affirms not *good*, but owns Him *just*;" },
  { t = "p", text = "Hard, cruel, taking pleasure fell in war;" },
  { t = "p", text = "In judgment dreadful, pliant to no prayers." },
  { t = "p", text = "100 His suasion tells of other one, to none" },
  { t = "p", text = "E’er known, who nowhere is, a deity" },
  { t = "p", text = "False, nameless, constituting nought, and who" },
  { t = "p", text = "Hath spoken precepts none. Him he calls *good*;" },
  { t = "p", text = "Who judges none, but spares all equally," },
  { t = "p", text = "105 And grudges life to none. No judgment waits" },
  { t = "p", text = "The guilty; so he says, bearing about" },
  { t = "p", text = "A gory poison with sweet honey mixt" },
  { t = "p", text = "For wretched men. That flesh can rise—to which" },
  { t = "p", text = "Himself was cause of ruin, which he spoiled" },
  { t = "p", text = "110 Iniquitously with contempt (whence,[^1357] cursed," },
  { t = "note", id = "1357", text = "i.e., for which reason." },
  { t = "p", text = "He hath grief without end), its ever-foe,—" },
  { t = "p", text = "He doth deny; because with various wound" },
  { t = "p", text = "Life to expel and the salvation whence" },
  { t = "p", text = "He fell he strives: and therefore says that Christ" },
  { t = "p", text = "115 Came suddenly to earth,[^1358] but was not made," },
  { t = "note", id = "1358", text = "i.e., as Marcion is stated by some to have taught, in the fifteenth year of Tiberius; founding his statement upon a perverted reading of Luke iii. 1. It will be remembered that Marcion only used St. Luke’s Gospel, and that in a mutilated and corrupted form." },
  { t = "p", text = "By any compact, partner of the flesh;" },
  { t = "p", text = "But Spirit-form, and body feigned beneath" },
  { t = "p", text = "A shape imaginary, seeks to mock" },
  { t = "p", text = "Men with a semblance that what is not is." },
  { t = "p", text = "120 Does this, then, become God, to sport with men" },
  { t = "p", text = "By darkness led? to act an impious lie?" },
  { t = "p", text = "Or falsely call Himself a man? He walks," },
  { t = "p", text = "Is carried, clothed, takes due rest, handled is," },
  { t = "p", text = "Suffers, is hung and buried: man’s are all" },
  { t = "p", text = "125 Deeds which, in holy body conversant," },
  { t = "p", text = "But sent by God the Father, who hath all" },
  { t = "p", text = "Created, He did perfect properly," },
  { t = "p", text = "Reclaiming not another’s but His own;" },
  { t = "p", text = "Discernible to peoples who of old" },
  { t = "p", text = "130 Were hoping for Him by His very work," },
  { t = "p", text = "And through the prophets’ voice to the round world[^1359]" },
  { t = "note", id = "1359", text = "Orbi." },
  { t = "p", text = "Best known: and now they seek an unknown Lord," },
  { t = "p", text = "Wandering in death’s threshold manifest," },
  { t = "p", text = "And leave behind the known. False is their faith," },
  { t = "p", text = "135 False is their God, deceptive their reward," },
  { t = "p", text = "False is their resurrection, death’s defeat" },
  { t = "p", text = "False, vain their martyrdoms, and e’en Christ’s name" },
  { t = "p", text = "An empty sound: whom, teaching that He came" },
  { t = "p", text = "Like magic mist, they (quite demented) own" },
  { t = "p", text = "140 To be the actor of a lie, and make" },
  { t = "p", text = "His passion bootless, and the populace[^1360]" },
  { t = "note", id = "1360", text = "i.e., of the Jews." },
  { t = "p", text = "(A feigned one!) without crime! Is God *thus* true?" },
  { t = "p", text = "Are *such* the honours rendered to the Lord?" },
  { t = "p", text = "Ah! wretched men! gratuitously lost" },
  { t = "p", text = "145 In death ungrateful! Who, by blind guide led," },
  { t = "p", text = "Have headlong rushed into the ditch![^1361] and as" },
  { t = "note", id = "1361", text = "“In fossa,” i.e., as Fabricius (quoted in Migne’s ed.) explains it, “in *de*fossa.” It is the past part. of *fodio*." },
  { t = "p", text = "In dreams the fancied rich man in his store" },
  { t = "p", text = "Of treasure doth exult, and with his hands" },
  { t = "p", text = "Grasps it, the sport of empty hope, so ye, so" },
  { t = "p", text = "150 Deceived, are hoping for a shadow vain" },
  { t = "p", text = "Of guerdon!" },
  { t = "p", text = "Ah! ye silent laughingstocks," },
  { t = "p", text = "Or doomed prey, of the dragon, do ye hope," },
  { t = "p", text = "Stern men, for death in room of gentle peace?[^1362]" },
  { t = "note", id = "1362", text = "If this line be correct,—“Speratis pro pace truces homicidia blanda,”—though I cannot see the propriety of the “truces” in it, it seems to mean, “Do ye hope or expect that the master you are serving will, instead of the gentle peace he promises you, prove a murderer and lead you to death? No, you do not expect it; but so it is.”" },
  { t = "p", text = "Dare ye blame God, who hath works" },
  { t = "p", text = "155 So great? in whose earth, ’mid profuse displays" },
  { t = "p", text = "Of His exceeding parent-care, His gifts" },
  { t = "p", text = "(Unmindful of Himself!) ye largely praise," },
  { t = "p", text = "Rushing to ruin! do ye reprobate—" },
  { t = "p", text = "Approving of the works—the Maker’s self," },
  { t = "p", text = "160 The world’s[^1363] Artificer, whose work withal" },
  { t = "note", id = "1363", text = "Mundi." },
  { t = "p", text = "Ye are yourselves? Who gave those little selves" },
  { t = "p", text = "Great honours; sowed your crops; made all the brutes[^1364]" },
  { t = "note", id = "1364", text = "Animalia." },
  { t = "p", text = "Your subjects; makes the seasons of the year" },
  { t = "p", text = "Fruitful with stated months; grants sweetnesses," },
  { t = "p", text = "165 Drinks various, rich odours, jocund flowers," },
  { t = "p", text = "And the groves’ grateful bowers; to growing herbs" },
  { t = "p", text = "Grants wondrous juices; founts and streams dispreads" },
  { t = "p", text = "With sweet waves, and illumes with stars the sky" },
  { t = "p", text = "And the whole orb: the infinite sole Lord," },
  { t = "p", text = "170 Both Just and Good; known by His work; to none" },
  { t = "p", text = "By aspect known; whom nations, flourishing" },
  { t = "p", text = "In wealth, but foolish, wrapped in error’s shroud," },
  { t = "p", text = "(Albeit ’tis beneath an alien name" },
  { t = "p", text = "They praise Him, yet) their Maker knowing! dread" },
  { t = "p", text = "175 To blame: nor e’en one[^1365]—save you, hell’s new gate!—" },
  { t = "note", id = "1365", text = "The sentence breaks off abruptly, and the verb which should apparently have gone with “e’en one” is joined to the “ye” in the next line." },
  { t = "p", text = "Thankless, ye choose to speak ill of your Lord!" },
  { t = "p", text = "These cruel deadly gifts the Renegade" },
  { t = "p", text = "Terrible has bestowed, through Marcion—thanks" },
  { t = "p", text = "To Cerdo’s mastership—on you; nor comes" },
  { t = "p", text = "180 The thought into your mind that, from Christ’s name" },
  { t = "p", text = "Seduced, Marcion’s name has carried you" },
  { t = "p", text = "To lowest depths.[^1366] Say of His many acts" },
  { t = "note", id = "1366", text = "The Latin is:— “Nec venit in mentem quod vos, a nomine Christi Seductos, ad Marcionis tulit infima nomen.” The rendering in my text, I admit, involves an exceedingly harsh construction of the Latin, but I see not how it is to be avoided; unless either (1) we take *nomen* absolutely, and “ad Marcionis infima” together, and translate, “A name has carried you to Marcion’s lowest depths;” in which case the question arises, What name is meant? can it be the name “Electi”? Or else (2) we take “tulit” as referring to the “terrible renegade,” i.e., the arch-fiend, and “infima” as in apposition with “ad Marcionis nomen,” and translate, “He has carried you to the name of Marcion—deepest degradation.”" },
  { t = "p", text = "What one displeases you? or what hath God" },
  { t = "p", text = "Done which is not to be extolled with praise?" },
  { t = "p", text = "185 Is it that He permits you, all too long," },
  { t = "p", text = "(Unworthy of His patience large,) to see" },
  { t = "p", text = "Sweet light? you, who read truths,[^1367] and, docking them," },
  { t = "note", id = "1367", text = "i.e., the Gospels and other parts of Holy Scripture." },
  { t = "p", text = "Teach these your falsehoods, and approve as past" },
  { t = "p", text = "Things which are yet to be?[^1368] What hinders, else," },
  { t = "note", id = "1368", text = "i.e., I take it, the resurrection. Cf. 2 Tim. ii. 17, 18." },
  { t = "p", text = "190 That *we* believe *your* God incredible?[^1369]" },
  { t = "note", id = "1369", text = "Whether this be the sense (i.e., “either tell us what it is which displeases you in *our* God, whether it be His too great patience in bearing with you, or what; or else tell us what is to hinder *us* from believing *your* God to be an *incredible* being”) of this passage, I will not venture to determine. The last line in the edd. previous to Oehler’s ran: “Aut incredibil*e* quid differt credere vestrum?” Oehler reads “incredibil*em*” (sc. Deum), which I have followed; but he suggests, “Aut incredibil*em qui* differt *cædere* vestrum?” Which may mean “or else”—i.e., if it were not for his “too great patience”—“why”—“qui”—“does He delay to smite your incredible god?” and thus challenge a contest and prove His own superiority." },
  { t = "p", text = "Nor marvel is’t if, practiced as he[^1370] is," },
  { t = "note", id = "1370", text = "i.e., the “terrible renegade.”" },
  { t = "p", text = "He captived you unarmed, persuading you" },
  { t = "p", text = "There are two Fathers (being damned by One)," },
  { t = "p", text = "And all, whom he had erst seduced, are gods;" },
  { t = "p", text = "195 And after that dispread a pest, which ran" },
  { t = "p", text = "With multiplying wound, and cureless crime," },
  { t = "p", text = "To many. Men unworthy to be named," },
  { t = "p", text = "Full of all magic’s madness, he induced" },
  { t = "p", text = "To call themselves “Virtue Supreme;” and feign" },
  { t = "p", text = "200 (With harlot comrade) fresh impiety;" },
  { t = "p", text = "To roam, to fly.[^1371] He is the insane god" },
  { t = "note", id = "1371", text = "The reference here is to Simon Magus; for a brief account of whom, and of the other heretics in this list, down to Hebion inclusive, the reader is referred to the *Adv. omn. Hær.*, above. The words “to roam, to fly,” refer to the alleged wanderings of Simon with his paramour Helen, and his reported attempt (at Rome, in the presence of St. Peter) to fly. The tale is doubtful." },
  { t = "p", text = "Of Valentine, and to his Æonage" },
  { t = "p", text = "Assigned heavens thirty, and Profundity" },
  { t = "p", text = "Their sire.[^1372] He taught two baptisms, and led" },
  { t = "note", id = "1372", text = "The Latin runs thus:— “Et ævo Triginta tribuit cælos, patremque Profundum.” But there seems a confusion between Valentine and his æons and Basilides and his heavens. See the *Adv. omn. Hær*., above." },
  { t = "p", text = "205 The body through the flame. That there are gods" },
  { t = "p", text = "So many as the year hath days, he bade" },
  { t = "p", text = "A Basilides to believe, and worlds" },
  { t = "p", text = "As many. Marcus, shrewdly arguing" },
  { t = "p", text = "Through numbers, taught to violate chaste form" },
  { t = "p", text = "210 ’Mid magic’s arts; taught, too, that the Lord’s cup" },
  { t = "p", text = "Is an oblation, and by prayers is turned" },
  { t = "p", text = "To blood. His[^1373] suasion prompted Hebion" },
  { t = "note", id = "1373", text = "i.e., the Evil One’s, as before." },
  { t = "p", text = "To teach that Christ was born from human seed;" },
  { t = "p", text = "He taught, too, circumcision, and that room" },
  { t = "p", text = "215 Is still left for the Law, and, though Law’s founts" },
  { t = "p", text = "Are lost,[^1374] its elements must be resumed." },
  { t = "note", id = "1374", text = "i.e., probably Jerusalem and the temple there." },
  { t = "p", text = "Unwilling am I to protract in words" },
  { t = "p", text = "His last atrocity, or to tell all" },
  { t = "p", text = "The causes, or the names at length. Enough" },
  { t = "p", text = "220 It is to note his many cruelties" },
  { t = "p", text = "Briefly, and the unmentionable men," },
  { t = "p", text = "The dragon’s organs fell, through whom he now," },
  { t = "p", text = "Speaking so much profaneness, ever toils" },
  { t = "p", text = "To blame the Maker of the world.[^1375] But come;" },
  { t = "note", id = "1375", text = "Mundi." },
  { t = "p", text = "225 Recall your foot from savage Bandit’s cave," },
  { t = "p", text = "While space is granted, and to wretched men" },
  { t = "p", text = "God, patient in perennial parent-love," },
  { t = "p", text = "Condones all deeds through error done! Believe" },
  { t = "p", text = "Truly in the true Sire, who built the orb;" },
  { t = "p", text = "230 Who, on behalf of men incapable" },
  { t = "p", text = "To bear the law, sunk in sin’s whirlpool, sent" },
  { t = "p", text = "The true Lord to repair the ruin wrought," },
  { t = "p", text = "And bring them the salvation promised" },
  { t = "p", text = "Of old through seers. He who the mandates gave" },
  { t = "p", text = "235 Remits sins too. Somewhat, deservedly," },
  { t = "p", text = "Doth He exact, because He formerly" },
  { t = "p", text = "Entrusted somewhat; or else bounteously," },
  { t = "p", text = "As Lord, condones as it were debts to slaves:" },
  { t = "p", text = "Finally, peoples shut up ’neath the curse," },
  { t = "p", text = "240 And meriting the penalty, Himself" },
  { t = "p", text = "Deleting the indictment, bids be washed!" },
  { t = "p", text = "Part II.—Of the Resurrection of the Flesh." },
  { t = "p", text = "The *whole* man, then, believes; the *whole* is washed;" },
  { t = "p", text = "Abstains from sin, or truly suffers wounds" },
  { t = "p", text = "For Christ’s name’s sake: he rises a true[^1376] man," },
  { t = "note", id = "1376", text = "Oehler’s “versus” (=\"changed the man rises”) is set aside for Migne’s “verus.” Indeed it is probably a misprint." },
  { t = "p", text = "245 Death, truly vanquish, shall be mute. But not" },
  { t = "p", text = "Part of the man,—his *soul*,—her own part[^1377] left" },
  { t = "note", id = "1377", text = "i.e., her own dwelling or “quarters,”—the body, to wit, if the reading “sua parte” be correct." },
  { t = "p", text = "Behind, will win the palm which, labouring" },
  { t = "p", text = "And wrestling in the course, combinedly" },
  { t = "p", text = "And simultaneously with *flesh*, she earns." },
  { t = "p", text = "250 Great crime it were for two in chains to bear" },
  { t = "p", text = "A weight, of whom the one were affluent" },
  { t = "p", text = "The other needy, and the wretched one" },
  { t = "p", text = "Be spurned, and guerdons to the happy one" },
  { t = "p", text = "Rendered. Not so the Just—fair Renderer" },
  { t = "p", text = "255 Of wages—deals, both good and just, whom we" },
  { t = "p", text = "Believe Almighty: to the thankless kind" },
  { t = "p", text = "Full is His will of pity. Nay, whate’er" },
  { t = "p", text = "He who hath greater mortal need[^1378] doth need[^1379]" },
  { t = "note", id = "1378", text = "Egestas." },
  { t = "note", id = "1379", text = "Eget." },
  { t = "p", text = "That, by advancement, to his comrade he" },
  { t = "p", text = "260 May equalled be, that will the affluent" },
  { t = "p", text = "Bestow the rather unsolicited:" },
  { t = "p", text = "So are we bidden to believe, and not" },
  { t = "p", text = "Be willing to cast blame unlawfully" },
  { t = "p", text = "On the Lord in our teaching, as if He" },
  { t = "p", text = "265 Were one to raise the *soul*, as having met" },
  { t = "p", text = "With ruin, and to set her free from death" },
  { t = "p", text = "So that the granted faculty of life" },
  { t = "p", text = "Upon the ground of sole desert (because" },
  { t = "p", text = "She bravely acted), should abide with her;[^1380]" },
  { t = "note", id = "1380", text = "I have ventured to alter the “*e*t viven*ti*” of Oehler and Migne into “*u*t viven*di*,” which seems to improve the sense." },
  { t = "p", text = "270 While she who ever shared the common lot" },
  { t = "p", text = "Of toil, the *flesh*, should to the earth be left," },
  { t = "p", text = "The prey of a perennial death. Has, then," },
  { t = "p", text = "The *soul* pleased God by acts of fortitude?" },
  { t = "p", text = "By no means could she Him have pleased alone" },
  { t = "p", text = "275 Without the *flesh*. Hath she borne penal bonds?[^1381]" },
  { t = "note", id = "1381", text = "It seems to me that these ideas should all be expressed interrogatively, and I have therefore so expressed them in my text." },
  { t = "p", text = "The flesh sustained upon her limbs the bonds." },
  { t = "p", text = "Contemned she death? But she hath left the *flesh*" },
  { t = "p", text = "Behind in death. Groaned she in pain?" },
  { t = "p", text = "The *flesh* is slain and vanquisht by the wound. Repose" },
  { t = "p", text = "280 Seeks she? The *flesh*, spilt by the sword in dust," },
  { t = "p", text = "Is left behind to fishes, birds, decay," },
  { t = "p", text = "And ashes; torn she is, unhappy one!" },
  { t = "p", text = "And broken; scattered, she melts away." },
  { t = "p", text = "Hath she not earned to rise? for what could she" },
  { t = "p", text = "285 Have e’er committed, lifeless and alone?" },
  { t = "p", text = "What so life-grudging[^1382] cause impedes, or else" },
  { t = "note", id = "1382", text = "See line 2." },
  { t = "p", text = "Forbids, the *flesh* to take God’s gifts, and live" },
  { t = "p", text = "Ever, conjoined with her comrade *soul*," },
  { t = "p", text = "And see what she hath been, when formerly" },
  { t = "p", text = "290 Converted into dust?[^1383] After, renewed," },
  { t = "note", id = "1383", text = "“Cernere quid fuerit conversa in pulvere quondam.” Whether the meaning be that, as the *soul* will be able (as it should seem) to retrace all that she has experienced since she left the body, so the *body*, when revived, will be able as it were to look back upon all that has happened to her since the soul left her,—something after the manner in which Hamlet traces the imaginary vicissitudes of Cæsar’s dust,—or whether there be some great error in the Latin, I leave the reader to judge." },
  { t = "p", text = "Bear she to God deserved meeds of praise," },
  { t = "p", text = "Not ignorant of herself, frail, mortal, sick.[^1384]" },
  { t = "note", id = "1384", text = "i.e., apparently remembering that she *was* so *before*." },
  { t = "p", text = "Contend ye as to what the living might[^1385]" },
  { t = "note", id = "1385", text = "Vivida virtus." },
  { t = "p", text = "Of the great God can do; who, good alike" },
  { t = "p", text = "295 And potent, grudges life to none? Was this" },
  { t = "p", text = "Death’s captive?[^1386] shall this perish vanquished" },
  { t = "note", id = "1386", text = "I rather incline to read for “hæc captiva fu*it* mortis,” “hæc captiva fu*at* mortis” = “Is this To be death’s thrall?” “This” is, of course, the flesh." },
  { t = "p", text = "Which the Lord hath with wondrous wisdom made," },
  { t = "p", text = "And art? This by His virtue wonderful" },
  { t = "p", text = "Himself upraises; this our Leader’s self" },
  { t = "p", text = "300 Recalls, and this with His own glory clothes" },
  { t = "p", text = "God’s art and wisdom, then, our body shaped" },
  { t = "p", text = "What can by these be made, how faileth it" },
  { t = "p", text = "To be by virtue reproduced?[^1387] No cause" },
  { t = "note", id = "1387", text = "For “Quod c*u*pit his fieri, deest hoc virtute reduci,” I venture to read, “Quod c*a*pit,” etc., taking “capit” as =\"capax est.” “By these,” of course, is by wisdom and art; and “virtue” =\"power.”" },
  { t = "p", text = "Can holy parent-love withstand; (lest else" },
  { t = "p", text = "305 Ill’s cause[^1388] should mightier prove than Power Supreme;)" },
  { t = "note", id = "1388", text = "i.e., the Evil One." },
  { t = "p", text = "That man even now saved by God’s gift, may learn[^1389]" },
  { t = "note", id = "1389", text = "i.e., may learn *to know.*" },
  { t = "p", text = "(Mortal before, now robed in light immense" },
  { t = "p", text = "Inviolable, wholly quickened,[^1390] soul" },
  { t = "note", id = "1390", text = "Oehler’s “vi*s*us” seems to be a mistake for “vi*v*us,” which is Migne’s reading; as in the fragment “*De exsecrandis gentium diis,*” we saw (*sub. fin*.) “vi*d*entem” to be a probable misprint for “vi*v*entem.” If, however, it is to be retained, it must mean “appearing” (i.e., in presence of God) “wholly,” in body as well as soul." },
  { t = "p", text = "And body) God, in virtue infinite," },
  { t = "p", text = "310 In parent-love perennial, through His King" },
  { t = "p", text = "Christ, through whom opened is light’s way; and now," },
  { t = "p", text = "Standing in new light, filled now with each gift,[^1391]" },
  { t = "note", id = "1391", text = "i.e., the double gift of a saved soul and a saved body." },
  { t = "p", text = "Glad with fair fruits of living Paradise," },
  { t = "p", text = "May praise and laud Him to eternity,[^1392]" },
  { t = "note", id = "1392", text = "In æternum." },
  { t = "p", text = "315 Rich in the wealth of the celestial hall." },
]

[[section]]
id = "book-2"
title = "Book II. Of the Harmony of the Old and New Laws."
level = 1
blocks = [
  { t = "p", text = "Book II.—Of the Harmony of the Old and New Laws.[^1393]" },
  { t = "note", id = "1393", text = "I have so frequently had to construct my own text (by altering the reading or the punctuation of the Latin) in this book, that, for brevity’s sake, I must ask the reader to be content with this statement once for all, and not expect each case to be separately noted." },
  { t = "p", text = "After the faith was broken by the dint" },
  { t = "p", text = "Of the foe’s breathing renegades,[^1394] and sworn" },
  { t = "note", id = "1394", text = "The “foe,” as before, is Satan; his “breathing instruments” are the men whom he uses (cf. Shakespeare’s “*no breather*” = no man, in the dialogue between Orlando and Jacques, *As you Like it,* act iii. sc. 2); and they are called “renegades,” like the Evil One himself, because they have deserted from their allegiance to God in Christ." },
  { t = "p", text = "With wiles the hidden pest[^1395] emerged; with lies" },
  { t = "note", id = "1395", text = "Heresy." },
  { t = "p", text = "Self-prompted, scornful of the Deity" },
  { t = "p", text = "5 That underlies the sense, he did his plagues" },
  { t = "p", text = "Concoct: skilled in guile’s path, he mixed his own" },
  { t = "p", text = "Words impious with the sayings of the saints." },
  { t = "p", text = "And on the good seed sowed his wretched tares," },
  { t = "p", text = "Thence willing that foul ruin’s every cause" },
  { t = "p", text = "10 Should grow combined; to wit, that with more speed" },
  { t = "p", text = "His own iniquitous deeds he may assign" },
  { t = "p", text = "To God clandestinely, and may impale" },
  { t = "p", text = "On penalties such as his suasion led;" },
  { t = "p", text = "False with true veiling, turning rough with smooth," },
  { t = "p", text = "15 And, (masking his spear’s point with rosy wreaths,)" },
  { t = "p", text = "Slaying the unwary unforeseen with death" },
  { t = "p", text = "Supreme. His supreme wickedness is this:" },
  { t = "p", text = "That men, to such a depth of madness sunk!" },
  { t = "p", text = "Off-broken boughs![^1396] should into parts divide" },
  { t = "note", id = "1396", text = "Cf. John xv. 2, 4, 5, 6; Rom. xi. 17–20. The writer simply calls them “abruptos homines;” and he seems to mean *excommunicated*, like Marcion." },
  { t = "p", text = "20 The endlessly-dread Deity; Christ’s deeds" },
  { t = "p", text = "Sublime should follow with false praise, and blame" },
  { t = "p", text = "The former acts,[^1397] God’s countless miracles," },
  { t = "note", id = "1397", text = "i.e., those recorded in the Old Testament." },
  { t = "p", text = "Ne’er seen before, nor heard, nor in a heart" },
  { t = "p", text = "Conceived;[^1398] and should so rashly frame in words" },
  { t = "note", id = "1398", text = "I have followed Migne’s suggestion here, and transposed one line of the original. The reference seems to be to Isa. lxiv. 4, quoted in 1 Cor. ii. 9, where the Greek differs somewhat remarkably from the LXX." },
  { t = "p", text = "25 The impermissible impiety" },
  { t = "p", text = "Of wishing by “wide dissimilitude" },
  { t = "p", text = "Of sense” to prove that the two Testaments" },
  { t = "p", text = "Sound adverse each to other, and the Lord’s" },
  { t = "p", text = "Oppose the prophets’ words; of drawing down" },
  { t = "p", text = "30 All the Law’s cause to infamy; and eke" },
  { t = "p", text = "Of reprobating holy fathers’ life" },
  { t = "p", text = "Of old, whom into friendship, and to share" },
  { t = "p", text = "His gifts, God chose. Without beginning, one" },
  { t = "p", text = "Is, for its lesser part, accepted.[^1399] Though" },
  { t = "note", id = "1399", text = "Unless some line has dropped out here, the construction, harsh enough in my English, is yet harsher in the Latin. “Accipitur” has no subject of any kind, and one can only guess from what has gone before, and what follows, that it must mean “*one Testament.*”" },
  { t = "p", text = "35 Of one are four, of four one,[^1400] yet to them" },
  { t = "note", id = "1400", text = "Harsh still. It must refer to the four Gospels—the “coat without seam”—in their quadrate unity; Marcion receiving but one—St. Luke’s—and that without St. Luke’s name, and also in a mutilated and interpolated form." },
  { t = "p", text = "One part is pleasing, three they (in a word)" },
  { t = "p", text = "Reprobate: and they seize, in many ways," },
  { t = "p", text = "On Paul as their own author; yet was he" },
  { t = "p", text = "Urged by a frenzied impulse of his own" },
  { t = "p", text = "40 To his last words:[^1401] all whatsoe’er he spake" },
  { t = "note", id = "1401", text = "This seems to be the sense. The allusion is to the fact that Marcion and his sect accepted but *ten* of St. Paul’s Epistles: leaving out entirely those to Timothy and Titus, and *all* the other books, except his one Gospel." },
  { t = "p", text = "Of the old covenant[^1402] seems hard to them" },
  { t = "note", id = "1402", text = "It seems to me that the reference here must evidently be to the Epistle to the Hebrews, which treats specially of the old covenant. If so, we have some indication as to the authorship, if not the date, of the book: for Tertullian himself, though he frequently cites the Epistle, appears to hesitate (to say the least) as to ascribing it to St. Paul." },
  { t = "p", text = "Because, deservedly, “made gross in heart.”[^1403]" },
  { t = "note", id = "1403", text = "Comp. Isa. vi. 9, 10, with Acts xxviii. 17–29." },
  { t = "p", text = "Weight apostolic, grace of beaming word," },
  { t = "p", text = "Dazzles their mind, nor can they possibly" },
  { t = "p", text = "45 Discern the Spirit’s drift. Dull as they are," },
  { t = "p", text = "Seek they congenial animals!" },
  { t = "p", text = "But ye" },
  { t = "p", text = "Who have not yet, (false deity your guide," },
  { t = "p", text = "Reprobate in your very mind,[^1404]) to death’s" },
  { t = "note", id = "1404", text = "The reference seems to be to Rom. i. 28; comp., too, Tit. i. 15, 16." },
  { t = "p", text = "Inmost caves penetrated, learn there flows" },
  { t = "p", text = "50 A stream perennial from its fount, which feeds" },
  { t = "p", text = "A tree, (twice sixfold are the fruits, its grace!)" },
  { t = "p", text = "And into earth and to the orb’s four winds" },
  { t = "p", text = "Goes out: into so many parts doth flow" },
  { t = "p", text = "The fount’s one hue and savour.[^1405] Thus, withal," },
  { t = "note", id = "1405", text = "The reference is to Gen. ii. 9–14." },
  { t = "p", text = "55 From apostolic word descends the Church," },
  { t = "p", text = "Out of Christ’s womb, with glory of His Sire" },
  { t = "p", text = "All filled, to wash off filth, and vivify" },
  { t = "p", text = "Dead fates.[^1406] The Gospel, four in number, one" },
  { t = "note", id = "1406", text = "Fata mortua. This extraordinary expression appears to mean “dead *men*;” men who, through Adam, are *fated*, so to speak, to die, and are under the sad *fate* of being “*dead* in trespasses and sins.” See Eph. ii. 1. As far as *quantity* is concerned, it might as well be “*facta* mortua,” “dead *works*,” such as we read of in Heb. vi. 1; ix. 14. It is true *these* works cannot strictly be said to be ever *vivified*; but a very similar inaccuracy seems to be committed by our author lower down in this same book." },
  { t = "p", text = "In its diffusion ’mid the Gentiles, this," },
  { t = "p", text = "60 By faith elect accepted, Paul hands down" },
  { t = "p", text = "(Excellent doctor!) pure, without a crime;" },
  { t = "p", text = "And from it he forbade Galatian saints" },
  { t = "p", text = "To turn aside withal; whom “brethren false,”" },
  { t = "p", text = "(Urging them on to circumcise themselves," },
  { t = "p", text = "65 And follow “elements,” leaving behind" },
  { t = "p", text = "Their novel “freedom,”) to “a shadow old" },
  { t = "p", text = "Of things to be” were teaching to be slaves." },
  { t = "p", text = "These were the causes which Paul had to write" },
  { t = "p", text = "To the Galatians: not that they took out" },
  { t = "p", text = "70 One small part of the Gospel, and held that" },
  { t = "p", text = "For the whole bulk, leaving the greater part" },
  { t = "p", text = "Behind. And hence ’tis no words of a book," },
  { t = "p", text = "But Christ Himself, Christ sent into the orb," },
  { t = "p", text = "Who is the gospel, if ye will discern;" },
  { t = "p", text = "75 Who from the Father came, sole Carrier" },
  { t = "p", text = "Of tidings good; whose glory vast completes" },
  { t = "p", text = "The early testimonies; by His work" },
  { t = "p", text = "Showing how great the orb’s Creator is:" },
  { t = "p", text = "Whose deeds, conjoined at the same time with words," },
  { t = "p", text = "80 Those faithful ones, Matthew, Mark, Luke, and John," },
  { t = "p", text = "Recorded unalloyed (not speaking words" },
  { t = "p", text = "External), sanctioned by God’s Spirit, ’neath" },
  { t = "p", text = "So great a Master’s eye!" },
  { t = "p", text = "This paschal Lamb" },
  { t = "p", text = "Is hung, a victim, on the tree: Him Paul," },
  { t = "p", text = "85 Writing decrees to Corinth, with his torch,[^1407]" },
  { t = "note", id = "1407", text = "I have followed Oehler’s “face” for the common “phase;” but what the meaning is I will not venture to decide. It may probably mean one of two things: (*a*) that Paul wrote *by torchlight*; (*b*) that the *light* which Paul holds forth in his life and writings, is a *torch* to show the Corinthians and others Christ." },
  { t = "p", text = "Hands down as slain, the future life and God" },
  { t = "p", text = "Promised to the fathers, whom before" },
  { t = "p", text = "He had attracted." },
  { t = "p", text = "See what virtue, see" },
  { t = "p", text = "What power, the paschal image[^1408] has; ye thus" },
  { t = "note", id = "1408", text = "i.e., the legal passover, “image” or type of “the true Passover,” Christ. See 1 Cor. v. 6–9." },
  { t = "p", text = "90 Will able be to see what power there is" },
  { t = "p", text = "In the true Passover." },
  { t = "p", text = "Lest well-earned love" },
  { t = "p", text = "Should tempt the faithful sire and seer,[^1409] to whom" },
  { t = "note", id = "1409", text = "Abraham. See Gen. xxii. 1–19." },
  { t = "p", text = "His pledge and heir[^1410] was dear, whom God by chance[^1411]" },
  { t = "note", id = "1410", text = "Isaac, a pledge to Abraham of all God’s other promises." },
  { t = "note", id = "1411", text = "Forte. I suppose this means out of the ordinary course of nature; but it is a strange word to use." },
  { t = "p", text = "Had given him, to offer him to God" },
  { t = "p", text = "95 (A mighty execution!), there is shown" },
  { t = "p", text = "To him a lamb entangled by the head" },
  { t = "p", text = "In thorns; a holy victim—holy blood" },
  { t = "p", text = "For blood—to God. From whose piacular death," },
  { t = "p", text = "That to the wasted race[^1412] it might be sign" },
  { t = "note", id = "1412", text = "Israel, wasted by the severities of their Egyptian captivity." },
  { t = "p", text = "100 And pledge of safety, signed are with blood" },
  { t = "p", text = "Their posts and thresholds many:[^1413]—aid immense!" },
  { t = "note", id = "1413", text = "“Mu*lta*;” but “mu*ta*” =\"mute” has been suggested, and is not inapt." },
  { t = "p", text = "The flesh (a witness credible) is given" },
  { t = "p", text = "For food. The Jordan crossed, the land possessed," },
  { t = "p", text = "Joshua by law kept Passover with joy," },
  { t = "p", text = "105 And immolates a lamb; and the great kings" },
  { t = "p", text = "And holy prophets that were after him," },
  { t = "p", text = "Not ignorant of the good promises" },
  { t = "p", text = "Of sure salvation; full of godly fear" },
  { t = "p", text = "The great Law to transgress, (that mass of types" },
  { t = "p", text = "110 In image of the Supreme Virtue once" },
  { t = "p", text = "To come,) did celebrate in order due" },
  { t = "p", text = "The mirrorly-inspected passover.[^1414]" },
  { t = "note", id = "1414", text = "I have given what appears to be a possible sense for these almost unintelligible lines. They run as follows in Oehler:— “Et reliqui magni reges sanctique prophetæ, Non ignorantes certæ promissa salutis, Ingentemque metu pleni transcendere legem, Venturam summæ virtutis imagine molem, Inspectam e speculo celebrarunt ordine pascham.” I rather incline to alter them somehow thus :— “Ingentemque metu plen*is* transcendere legem, Ventur*um* *in* summæ virtutis imagine,—*so*lem Inspect*um* e speculo,—celebrarunt ordine pascham;” connecting these three lines with “non ignorantes,” and rendering:— “Not ignorant of the good promises Of sure salvation; and that One would come, For such as filled are with godly fear The law to overstep, a mighty One, In Highest Virtue’s image,—the Sun seen In mirror:—did in order celebrate The passover.” That is, in brief, they all, in celebrating the type, looked forward to the Antitype to come." },
  { t = "p", text = "In short, if thou recur with rapid mind" },
  { t = "p", text = "To times primordial, thou wilt find results" },
  { t = "p", text = "115 Too fatal following impious words. That man" },
  { t = "p", text = "Easily credulous, alas! and stripped" },
  { t = "p", text = "Of life’s own covering, might covered be" },
  { t = "p", text = "With skins, a lamb is hung: the wound slays sins," },
  { t = "p", text = "Or death by blood effaces or enshrouds" },
  { t = "p", text = "120 Or cherishes the naked with its fleece." },
  { t = "p", text = "Is sheep’s blood of more worth than human blood," },
  { t = "p", text = "That, offered up for sins, it should quench wrath?" },
  { t = "p", text = "Or is a lamb (as if he were more dear!)" },
  { t = "p", text = "Of more worth than much people’s? aid immense!" },
  { t = "p", text = "125 As safeguard of so great salvation, could" },
  { t = "p", text = "A lamb, if offered, have been price enough" },
  { t = "p", text = "For the redeemed? Nay: but Almighty God," },
  { t = "p", text = "The heaven’s and earth’s Creator, infinite,[^1415]" },
  { t = "note", id = "1415", text = "Immensus." },
  { t = "p", text = "Living, and perfect, and perennially" },
  { t = "p", text = "130 Dwelling in light, is not appeased by these," },
  { t = "p", text = "Nor joys in cattle’s blood. Slain be all flocks;" },
  { t = "p", text = "Be every herd upburned into smoke;" },
  { t = "p", text = "That expiatively ’t may pardon win" },
  { t = "p", text = "Of but one sin: in vain at so vile price;" },
  { t = "p", text = "135 Will the stained figure of the Lord—foul flesh—" },
  { t = "p", text = "Prepare, if wise, such honours:[^1416] but the hope" },
  { t = "note", id = "1416", text = "This, again, seems to be the meaning, unless the passage (which is not probable) be corrupt. The flesh, “foul” now with sin, is called the “stained image of the Lord,” as having been originally in His image, but being now stained by guilt." },
  { t = "p", text = "And faith to mortals promised of old—" },
  { t = "p", text = "Great Reason’s counterpart[^1417]—hath wrought to bring" },
  { t = "note", id = "1417", text = "Faith is called so, as being the reflection of divine reason." },
  { t = "p", text = "These boons premeditated and prepared" },
  { t = "p", text = "140 Erst by the Father’s passing parent-love;" },
  { t = "p", text = "That Christ should come to earth, and be a man!" },
  { t = "p", text = "Whom when John saw, baptism’s first opener, John," },
  { t = "p", text = "Comrade of seers, apostle great, and sent" },
  { t = "p", text = "As sure forerunner, witness faithful; John," },
  { t = "p", text = "145 August in life, and marked with praise sublime,[^1418]" },
  { t = "note", id = "1418", text = "i.e., the praise of Christ Himself. See Matt. xi. 7–15, with the parallel passage, Luke vii. 24–30; comp. also John v. 33–35." },
  { t = "p", text = "He shows, to such as sought of olden time" },
  { t = "p", text = "God’s very Paschal Lamb, that He is come" },
  { t = "p", text = "At last, the expiation of misdeed," },
  { t = "p", text = "To undo many’s sins by His own blood," },
  { t = "p", text = "150 In place of reprobates the Proven One," },
  { t = "p", text = "In place of vile the dear; in body, man;" },
  { t = "p", text = "And, in life, God: that He, as the slain Lamb," },
  { t = "p", text = "Might us accept,[^1419] and for us might outpour" },
  { t = "note", id = "1419", text = "i.e., perhaps “render acceptable.”" },
  { t = "p", text = "Himself Thus hath it pleased the Lord to spoil" },
  { t = "p", text = "155 Proud death: thus wretched man will able be" },
  { t = "p", text = "To hope salvation. This slain paschal Lamb" },
  { t = "p", text = "Paul preaches: nor does a phantasmal shape" },
  { t = "p", text = "Of the sublime Lord (one consimilar" },
  { t = "p", text = "To Isaac’s silly sheep[^1420]) the passion bear," },
  { t = "note", id = "1420", text = "See above, 91–99." },
  { t = "p", text = "160 Wherefore He is called Lamb: but ’tis because," },
  { t = "p", text = "As wool, He these renewed bodies clothes," },
  { t = "p", text = "Giving to many covering, yet Himself" },
  { t = "p", text = "Never deficient. Thus does the Lord shroud" },
  { t = "p", text = "In His Sire’s virtue, those whom, disarrayed" },
  { t = "p", text = "165 Of their own light, He by His death redeemed," },
  { t = "p", text = "Virtue which ever is in Him. So, then," },
  { t = "p", text = "The Shepherd who hath lost the sheep Himself" },
  { t = "p", text = "Re-seeks it. He, prepared to tread the strength" },
  { t = "p", text = "Of the vine, and its thorns, or to o’ercome" },
  { t = "p", text = "170 The wolf’s rage, and regain the cattle lost," },
  { t = "p", text = "And brave to snatch them out, the Lion He" },
  { t = "p", text = "In sheepskin-guise, unasked presents Himself" },
  { t = "p", text = "To the contemned[^1421] teeth, baffling by His garb" },
  { t = "note", id = "1421", text = "i.e., teeth which *He* contemned, for His people’s sake: not that they are to *us* contemptible." },
  { t = "p", text = "The robber’s bloody jaws." },
  { t = "p", text = "Thus everywhere" },
  { t = "p", text = "175 Christ seeks force-captured Adam; treads the path" },
  { t = "p", text = "Himself where death wrought ruin; permeates" },
  { t = "p", text = "All the old heroes’ monuments;[^1422] inspects" },
  { t = "note", id = "1422", text = "i.e., perhaps permeating, by the influence of His death, the tombs of all the old saints." },
  { t = "p", text = "Each one; the One of whom all types were full;" },
  { t = "p", text = "Begins e’en from the womb to expel the death" },
  { t = "p", text = "180 Conceived simultaneously with seed" },
  { t = "p", text = "Of flesh within the bosom; purging all" },
  { t = "p", text = "Life’s stages with a silent wisdom; debts" },
  { t = "p", text = "Assuming;[^1423] ready to cleanse all, and give" },
  { t = "note", id = "1423", text = "i.e., undertaking our debts in our stead." },
  { t = "p", text = "Their Maker back the many whom the one[^1424]" },
  { t = "note", id = "1424", text = "Adam. See Rom. v., *passim*." },
  { t = "p", text = "185 Had scattered. And, because one direful man" },
  { t = "p", text = "Down-sunk in pit iniquitous did fall," },
  { t = "p", text = "By dragon-subdued virgin’s[^1425] suasion led;" },
  { t = "note", id = "1425", text = "It is an idea of the genuine Tertullian, apparently, that Eve was a “virgin” all the time she was with Adam in Paradise. A similar idea appears in the “Genesis” above." },
  { t = "p", text = "Because he pleased her wittingly;[^1426] because" },
  { t = "note", id = "1426", text = "Consilio. Comp. 1 Tim. ii. 14, “Adam was not *deceived*.”" },
  { t = "p", text = "He left his heavenly covering[^1427] behind:" },
  { t = "note", id = "1427", text = "Called “life’s own covering” (i.e., apparently his innocence) in 117, above." },
  { t = "p", text = "190 Because the “tree” their nakedness did prove;" },
  { t = "p", text = "Because dark death coerced them: in like wise" },
  { t = "p", text = "Out of the self-same mass[^1428] re-made returns" },
  { t = "note", id = "1428", text = "Or, “ore.”" },
  { t = "p", text = "Renewed now,—the flower of flesh, and host" },
  { t = "p", text = "Of peace,—a flesh from espoused virgin born," },
  { t = "p", text = "195 Not of man’s seed; conjoined to its own" },
  { t = "p", text = "Artificer; without the debt of death." },
  { t = "p", text = "These mandates of the Father through bright stars" },
  { t = "p", text = "An angel carries down, that angel-fame" },
  { t = "p", text = "The tidings may accredit; telling how" },
  { t = "p", text = "200 “A virgin’s debts a virgin, flesh’s flesh," },
  { t = "p", text = "Should pay.” Thus introduced, the Giant-Babe," },
  { t = "p", text = "The Elder-Boy, the Stripling-Man, pursues" },
  { t = "p", text = "Death’s trail. Thereafter, when completed was" },
  { t = "p", text = "The ripe age of man’s strength, when man is wont" },
  { t = "p", text = "205 To see the lives that were his fellows drop" },
  { t = "p", text = "By slow degrees away, and to be changed" },
  { t = "p", text = "In mien to wrinkles foul and limbs inert," },
  { t = "p", text = "While blood forsakes his veins, his course he stayed," },
  { t = "p", text = "And suffered not his fleshly garb to age." },
  { t = "p", text = "210 Upon what day or in what place did fall" },
  { t = "p", text = "Most famous Adam, or outstretched his hand" },
  { t = "p", text = "Rashly to touch the tree, on that same day," },
  { t = "p", text = "Returning as the years revolve, within" },
  { t = "p", text = "The stadium of the “tree” the brave Athlete," },
  { t = "p", text = "215 ’Countering, outstretched His hands, and, penalty" },
  { t = "p", text = "For praise pursuing,[^1429] quite did vanquish death," },
  { t = "note", id = "1429", text = "Comp. Heb. xii. 2, “Who, for the joy that was set before Him”—“ὃς ἀντὶ τῆς προκειμένης αὑτῷ χαρᾶς." },
  { t = "p", text = "Because He left death of His own accord" },
  { t = "p", text = "Behind, disrobing Him of fleshly slough," },
  { t = "p", text = "And of death’s dues; and to the “tree” affixed" },
  { t = "p", text = "220 The serpent’s spoil—“the world’s[^1430] prince” vanquisht quite!" },
  { t = "note", id = "1430", text = "Mundi. See John xiv. 30." },
  { t = "p", text = "Grand trophy of the renegades: for sign" },
  { t = "p", text = "Whereof had Moses hung the snake, that all," },
  { t = "p", text = "Who had by many serpents stricken been," },
  { t = "p", text = "Might gaze upon the dragon’s self, and see" },
  { t = "p", text = "225 Him vanquisht and transfixt." },
  { t = "p", text = "When, afterwards," },
  { t = "p", text = "He reached the infernal region’s secret waves," },
  { t = "p", text = "And, as a victor, by the light which aye" },
  { t = "p", text = "Attended Him, revealed His captive thrall," },
  { t = "p", text = "And by His virtue thoroughly fulfilled" },
  { t = "p", text = "230 The Father’s bidding, He Himself re-took" },
  { t = "p", text = "The body which, spontaneous, He had left:" },
  { t = "p", text = "This was the cause of death: this same was made" },
  { t = "p", text = "Salvation’s path: a messenger of guile" },
  { t = "p", text = "The former was; the latter messenger" },
  { t = "p", text = "235 Of peace: a spouse her man[^1431] did slay; a spouse" },
  { t = "note", id = "1431", text = "Virum." },
  { t = "p", text = "Did bear a lion:[^1432] hurtful to her man[^1433]" },
  { t = "note", id = "1432", text = "“The Lion of the tribe of Juda.” Rev. v. 5." },
  { t = "note", id = "1433", text = "Viro. This use of “*man*” may be justified, to say nothing of other arguments, from Jer. xliv. 19, where “*our men*” seem plainly =\"our husbands.” See marg." },
  { t = "p", text = "A virgin[^1434] proved; a man[^1435] from virgin born" },
  { t = "note", id = "1434", text = "Virgo: a play on the word in connection with the “viro” and what follows." },
  { t = "note", id = "1435", text = "Vir." },
  { t = "p", text = "Proved victor: for a type whereof, while sleep" },
  { t = "p", text = "His[^1436] body wrapped, out of his side is ta’en" },
  { t = "note", id = "1436", text = "i.e., Adam’s. The constructions, as will be seen, are oddly confused throughout, and I rather suspect some transposition of lines." },
  { t = "p", text = "240 A woman,[^1437] who is her lord’s[^1438] rib; whom, he," },
  { t = "note", id = "1437", text = "Mulier." },
  { t = "note", id = "1438", text = "Mariti." },
  { t = "p", text = "Awaking, called “flesh from his flesh, and bones" },
  { t = "p", text = "From his own bones;” with a presaging mind" },
  { t = "p", text = "Speaking. Faith wondrous! Paul deservedly," },
  { t = "p", text = "(Most certain author!) teaches Christ to be" },
  { t = "p", text = "245 “The Second Adam from the heavens.”[^1439] Truth," },
  { t = "note", id = "1439", text = "See 1 Cor. xv. 22 sqq., especially 45, 47." },
  { t = "p", text = "Using her own examples, doth refulge;" },
  { t = "p", text = "Nor covets out of alien source to show" },
  { t = "p", text = "Her paces keen:[^1440] this is a pauper’s work," },
  { t = "note", id = "1440", text = "Acres gressus." },
  { t = "p", text = "Needy of virtue of his own! Great Paul" },
  { t = "p", text = "250 These mysteries—taught to him—did teach; to wit," },
  { t = "p", text = "Discerning that in Christ thy glory is," },
  { t = "p", text = "O Church! from His side, hanging on high “tree,”" },
  { t = "p", text = "His lifeless body’s “blood and humour” flowed." },
  { t = "p", text = "The blood the woman[^1441] was; the waters were" },
  { t = "note", id = "1441", text = "Femina." },
  { t = "p", text = "255 The new gifts of the font:[^1442] this is the Church," },
  { t = "note", id = "1442", text = "Lavacri." },
  { t = "p", text = "True mother of a living people; flesh" },
  { t = "p", text = "New from Christ’s flesh, and from His bones a bone." },
  { t = "p", text = "A spot there is called Golgotha,—of old" },
  { t = "p", text = "The fathers’ earlier tongue thus called its name,—" },
  { t = "p", text = "260 “The skull-pan of a head:” here is earth’s midst;" },
  { t = "p", text = "Here victory’s sign; here, have our elders taught," },
  { t = "p", text = "There was a great head[^1443] found; here the first man," },
  { t = "note", id = "1443", text = "“Os;” lit., “face” or “mouth.”" },
  { t = "p", text = "We have been taught, was buried; here the Christ" },
  { t = "p", text = "Suffers; with sacred blood the earth[^1444] grows moist." },
  { t = "note", id = "1444", text = "Terra." },
  { t = "p", text = "265 That the old Adam’s dust may able be," },
  { t = "p", text = "Commingled with Christ’s blood, to be upraised" },
  { t = "p", text = "By dripping water’s virtue. The “one ewe”" },
  { t = "p", text = "That is, which, during Sabbath-hours, alive" },
  { t = "p", text = "The Shepherd did resolve that He would draw" },
  { t = "p", text = "270 Out of th’ infernal pit. This was the cause" },
  { t = "p", text = "Why, on the Sabbaths, He was wont to cure" },
  { t = "p", text = "The prematurely dead limbs of all flesh;" },
  { t = "p", text = "Or perfected for sight the eyes of him" },
  { t = "p", text = "Blind from his birth—eyes which He had not erst" },
  { t = "p", text = "275 Given; or, in presence of the multitude," },
  { t = "p", text = "Called, during Sabbath-hours, one wholly dead" },
  { t = "p", text = "To life, e’en from the sepulchre.[^1445] Himself" },
  { t = "note", id = "1445", text = "This would seem to refer to Lazarus; but it seems to be an assumption that his raising took place on a Sabbath." },
  { t = "p", text = "The new man’s Maker, the Repairer good" },
  { t = "p", text = "Of th’ old, supplying what did lack, or else" },
  { t = "p", text = "280 Restoring what was lost. About to do—" },
  { t = "p", text = "When dawns “the holy day”—these works, for such" },
  { t = "p", text = "As hope in Him, in plenitude, (to keep" },
  { t = "p", text = "His plighted word,) He taught men thus His power" },
  { t = "p", text = "To do them." },
  { t = "p", text = "What? If flesh dies, and no hope" },
  { t = "p", text = "285 Is given of salvation, say, what grounds" },
  { t = "p", text = "Christ had to feign Himself a man, and head" },
  { t = "p", text = "Men, or have care for flesh? If He recalls[^1446]" },
  { t = "note", id = "1446", text = "i.e., to life." },
  { t = "p", text = "Some few, why shall He not withal recall" },
  { t = "p", text = "All? Can corruption’s power liquefy" },
  { t = "p", text = "290 The body and undo it, and shall not" },
  { t = "p", text = "The virtue of the Lord be powerful" },
  { t = "p", text = "The undone to recall?" },
  { t = "p", text = "They, who believe" },
  { t = "p", text = "Their bodies are *not* loosed from death, do not" },
  { t = "p", text = "Believe the Lord, who wills to raise His own" },
  { t = "p", text = "295 Works sunken; or else say they that the Good" },
  { t = "p", text = "Wills not, and that the Potent hath not power,—" },
  { t = "p", text = "Ignorant from how great a crime they suck" },
  { t = "p", text = "Their milk, in daring to set things infirm" },
  { t = "p", text = "Above the Strong.[^1447] In the grain lurks the tree;" },
  { t = "note", id = "1447", text = "I have ventured to alter the “*M*orti,” of the edd. into “*F*orti;” and “causas” (as we have seen) seems, in this late Latin, nearly =\"res.”" },
  { t = "p", text = "300 And if this[^1448] rot not, buried in the earth," },
  { t = "note", id = "1448", text = "i.e., the grain." },
  { t = "p", text = "It yields not tree-graced fruits.[^1449] Soon bound will be" },
  { t = "note", id = "1449", text = "This may seem an unusual expression, as it is more common to regard the fruit as gracing the tree, than the tree the fruit. But, in point of fact, the tree, with its graceful form and foliage, may be said to give a grace to the fruit; and so our author puts it here: “decoratos arbore fructus.”" },
  { t = "p", text = "The liquid waters: ’neath the whistling cold" },
  { t = "p", text = "They will become, and ever will be stones," },
  { t = "p", text = "Unless a mighty power, by leading on" },
  { t = "p", text = "305 Soft-breathing warmth, undo them. The great bunch" },
  { t = "p", text = "Lurks in the tendril’s slender body: if" },
  { t = "p", text = "Thou seek it, it is not; when God doth will," },
  { t = "p", text = "’Tis seen to be. On trees their leaves, on thorns" },
  { t = "p", text = "The rose, the seeds on plains, are dead and fail," },
  { t = "p", text = "310 And rise again, new living. For man’s use" },
  { t = "p", text = "These things doth God before his eyes recall" },
  { t = "p", text = "And form anew—man’s, for whose sake at first[^1450]" },
  { t = "note", id = "1450", text = "I read “prim*um*” here for “prim*us*.”" },
  { t = "p", text = "The wealthy One made all things bounteously." },
  { t = "p", text = "All naked fall; with its own body each" },
  { t = "p", text = "315 He clothes. Why man alone, on whom He showered" },
  { t = "p", text = "Such honours, should He not recall in all" },
  { t = "p", text = "His first perfection[^1451] to Himself? man, whom" },
  { t = "note", id = "1451", text = "“Tantum” =\"tantum quantum primo fuerat,” i.e., with a body as well as a spirit." },
  { t = "p", text = "He set o’er all?" },
  { t = "p", text = "Flesh, then, and blood are said" },
  { t = "p", text = "To be not worthy of God’s realm, as if" },
  { t = "p", text = "320 Paul spake of flesh *materially*. He" },
  { t = "p", text = "Indeed taught mighty truths; but hearts inane" },
  { t = "p", text = "Think he used carnal speech: for *pristine deeds*" },
  { t = "p", text = "He meant beneath the name of “flesh and blood;”" },
  { t = "p", text = "Remembering, heavenly home—slave that he is," },
  { t = "p", text = "325 His heavenly Master’s words; who gave the name" },
  { t = "p", text = "Of His own honour to men born from Him" },
  { t = "p", text = "Through water, and from His own Spirit poured" },
  { t = "p", text = "A pledge;[^1452] that, by whose virtue men had been" },
  { t = "note", id = "1452", text = "Pignus: “the *promise* of the Father” (Acts i. 4); “the *earnest* of the Spirit” (2 Cor. i. 22; v. 5.). See, too, Eph. i. 13, 14; Rom. viii. 23." },
  { t = "p", text = "Redeemed, His name of honour they withal" },
  { t = "p", text = "330 Might, when renewed, receive. Because, then, He" },
  { t = "p", text = "Refused, on the old score, the heavenly realm" },
  { t = "p", text = "To peoples not yet from His fount re-born," },
  { t = "p", text = "Still with their ancient sordid raiment clad—" },
  { t = "p", text = "These are “the dues of death”—saying that that" },
  { t = "p", text = "335 Which human is must needs be born again,—" },
  { t = "p", text = "“What hath been born of flesh is flesh; and what" },
  { t = "p", text = "From Spirit, life;”[^1453] and that the body, washed," },
  { t = "note", id = "1453", text = "The reference is to John iii. 6, but it is not quite correctly given." },
  { t = "p", text = "Changing with glory its old root’s new seeds,[^1454]" },
  { t = "note", id = "1454", text = "See note on 245, above." },
  { t = "p", text = "Is no more called “from flesh:” Paul follows this;" },
  { t = "p", text = "340 Thus did he speak of “flesh.” In fine, he said[^1455]" },
  { t = "note", id = "1455", text = "See 2 Cor. v. 1. sqq." },
  { t = "p", text = "This frail garb with a robe must be o’erclad," },
  { t = "p", text = "This mortal form be wholly covered;" },
  { t = "p", text = "Not that another body must be given," },
  { t = "p", text = "But that the former one, dismantled,[^1456] must" },
  { t = "note", id = "1456", text = "I read “inerm*um*”—a very rare form—here for “inerm*em*.” But there seems a confusion in the text, which here, as elsewhere, is probably corrupt." },
  { t = "p", text = "345 Be with God’s kingdom wholly on all sides" },
  { t = "p", text = "Surrounded: “In the moment of a glance,”" },
  { t = "p", text = "He says, “it shall be changed:” as, on the blade," },
  { t = "p", text = "Dispreads the red corn’s[^1457] face, and changes ’neath" },
  { t = "note", id = "1457", text = "“Cer*æ*,” which seems senseless here, I have changed to “cer*eris*.”" },
  { t = "p", text = "The sun’s glare its own hue; so the same flesh," },
  { t = "p", text = "350 From “the effulgent glory”[^1458] borrowing," },
  { t = "note", id = "1458", text = "There seems to be a reference to 2 Pet. i. 17." },
  { t = "p", text = "Shall ever joy, and joying,[^1459] shall lack death;" },
  { t = "note", id = "1459", text = "Here again I have altered the punctuation by a very simple change." },
  { t = "p", text = "Exclaiming that “the body’s cruel foe" },
  { t = "p", text = "Is vanquisht quite; death, by the victory" },
  { t = "p", text = "Of the brave Christ, is swallowed;”[^1460] praises high" },
  { t = "note", id = "1460", text = "See 1 Cor. xv. 54; Isa. xxv. 8 (where the LXX. have a strange reading)." },
  { t = "p", text = "355 Bearing to God, unto the highest stars." },
]

[[section]]
id = "book-3"
title = "Book III. Of the Harmony of the Fathers of the Old and New Testaments."
level = 1
blocks = [
  { t = "p", text = "Book III.—Of the Harmony of the Fathers of the Old and New Testaments." },
  { t = "p", text = "Now hath the mother, formerly surnamed" },
  { t = "p", text = "Barren, giv’n birth:[^1461] now a new people, born" },
  { t = "note", id = "1461", text = "Isa. liv. 1; Gal. iv. 27." },
  { t = "p", text = "From the free woman,[^1462] joys: (the slave expelled," },
  { t = "note", id = "1462", text = "Gal. iv. 19–31." },
  { t = "p", text = "Deservedly, with her proud progeny;" },
  { t = "p", text = "5 Who also leaves ungratefully behind" },
  { t = "p", text = "The waters of the living fount,[^1463] and drinks—" },
  { t = "note", id = "1463", text = "The Jewish people leaving Christ, “the fountain of living waters” (Jer. ii. 13; John vii. 37–39), is compared to Hagar leaving the well, which was, we may well believe, close to Abraham’s tent." },
  { t = "p", text = "Errant on heated plains—’neath glowing star:[^1464])" },
  { t = "note", id = "1464", text = "Et tepidis errans ardenti sidere potat. See Gen. xxi. 12–20." },
  { t = "p", text = "Now can the Gentiles as their parent claim" },
  { t = "p", text = "Abraham; who, the Lord’s voice following," },
  { t = "p", text = "10 Like him, have all things left,[^1465] life’s pilgrimage" },
  { t = "note", id = "1465", text = "See Matt. xix. 27; Mark x. 28; Luke xviii. 28." },
  { t = "p", text = "To enter. “Be glad, barren one;” conceive" },
  { t = "p", text = "The promised people; “break thou out, and cry,”" },
  { t = "p", text = "Who with no progeny wert blest; of whom" },
  { t = "p", text = "Spake, through the seers, the Spirit of old time:" },
  { t = "p", text = "15 She hath borne, out of many nations, one;" },
  { t = "p", text = "With whose beginning are her pious limbs" },
  { t = "p", text = "Ever in labour." },
  { t = "p", text = "Hers “just Abel”[^1466] was," },
  { t = "note", id = "1466", text = "See Matt. xxiii. 35." },
  { t = "p", text = "A pastor and a cattle—master he;" },
  { t = "p", text = "Whom violence of brother’s right hand slew" },
  { t = "p", text = "20 Of old. Her Enoch, signal ornament," },
  { t = "p", text = "Limb from her body sprung, by counsel strove" },
  { t = "p", text = "To recall peoples gone astray from God" },
  { t = "p", text = "And following misdeed, (while raves on earth" },
  { t = "p", text = "The horde of robber-renegades,[^1467]) to flee" },
  { t = "note", id = "1467", text = "i.e., apparently the “giants;” see Gen. vi. 4; but there is no mention of them in Enoch’s time (Migne)." },
  { t = "p", text = "25 The giants’sacrilegious cruel race;" },
  { t = "p", text = "Faithful in all himself. With groaning deep[^1468]" },
  { t = "note", id = "1468", text = "i.e., over the general sinfulness." },
  { t = "p", text = "Did he please God, and by deserved toil" },
  { t = "p", text = "Translated[^1469] is reserved as a pledge," },
  { t = "note", id = "1469", text = "I suggest “translat*us*” for “translat*um*” here." },
  { t = "p", text = "With honour high. Perfect in praise, and found" },
  { t = "p", text = "30 Faultless, and just—God witnessing[^1470] the fact—" },
  { t = "note", id = "1470", text = "See Gen. vii. 1." },
  { t = "p", text = "In an adulterous people, Noah (he" },
  { t = "p", text = "Who in twice fifty years[^1471] the ark did weave)" },
  { t = "note", id = "1471", text = "Loosely; 120 years is the number in Gen. vi. 3." },
  { t = "p", text = "By deeds and voice the coming ruin told." },
  { t = "p", text = "Favour he won, snatched out of so great waves" },
  { t = "p", text = "35 Of death, and, with his progeny, preserved." },
  { t = "p", text = "Then, in the generation[^1472] following," },
  { t = "note", id = "1472", text = "Gente." },
  { t = "p", text = "Is Abraham, whose sons ye do deny" },
  { t = "p", text = "Yourselves to be; who first—race, country, sire," },
  { t = "p", text = "All left behind—at suasion of God’s voice" },
  { t = "p", text = "40 Withdrew to realms extern: such honours he" },
  { t = "p", text = "At God’s sublime hand worthily deserved" },
  { t = "p", text = "As to be father to believing tribes" },
  { t = "p", text = "And peoples. Jacob with the patriarchs" },
  { t = "p", text = "(Himself their patriarch) through all his own" },
  { t = "p", text = "45 Life’s space the gladdest times of Christ foresang" },
  { t = "p", text = "By words, act, virtue, toil." },
  { t = "p", text = "Him follows—free" },
  { t = "p", text = "From foul youth’s stain—Joseph, by slander feigned," },
  { t = "p", text = "Doomed to hard penalty and gaol: his groans" },
  { t = "p", text = "Glory succeeds, and the realm’s second crown, so" },
  { t = "p", text = "50 And in dearth’s time large power of furnishing" },
  { t = "p", text = "Bread: so appropriate a type of Christ," },
  { t = "p", text = "So lightsome type of Light, is manifest" },
  { t = "p", text = "To all whose mind hath eyes, that they may see" },
  { t = "p", text = "In a face-mirror[^1473] their sure hope." },
  { t = "note", id = "1473", text = "Speculo vultus. The two words seem to me to go together, and, unless the second be indeed redundant, to mean perhaps a small *hand-mirror*, which affords more facilities for minute examination of the face than a larger fixed one." },
  { t = "p", text = "Himself" },
  { t = "p", text = "55 The patriarch Judah, see; the origin" },
  { t = "p", text = "Of royal line,[^1474] whence leaders rose, nor kings" },
  { t = "note", id = "1474", text = "“Sortis;” lit. “lot,” here =\"the line or family chosen *by lot*.” Compare the similar derivation of “clergy.”" },
  { t = "p", text = "Failed ever from his seed, until the Power" },
  { t = "p", text = "To come, by Gentiles looked for, promised long," },
  { t = "p", text = "Came." },
  { t = "p", text = "Moses, leader of the People, (he" },
  { t = "p", text = "60 Who, spurning briefly—blooming riches, left" },
  { t = "p", text = "The royal thresholds,) rather chose to bear" },
  { t = "p", text = "His people’s toils, afflicted, with bowed neck," },
  { t = "p", text = "By no threats daunted, than to gain himself" },
  { t = "p", text = "Enjoyments, and of many penalties" },
  { t = "p", text = "65 Remission: admirable for such faith" },
  { t = "p", text = "And love, he, with God’s virtue armed, achieved" },
  { t = "p", text = "Great exploits: smote the nation through with plagues;" },
  { t = "p", text = "And left their land behind, and their hard king" },
  { t = "p", text = "Confounds, and leads the People back; trod waves;" },
  { t = "p", text = "70 Sunk the foes down in waters; through a “tree”[^1475]" },
  { t = "note", id = "1475", text = "Lignum." },
  { t = "p", text = "Made ever-bitter waters sweet; spake much" },
  { t = "p", text = "(Manifestly to the People) with the Christ,[^1476]" },
  { t = "note", id = "1476", text = "I have ventured to substitute “Christ*o*” for “Christ*i*;” and thus, for “Cum Christ*i* populo manifeste multa locutus,” read, “Cum Christo (populo manifeste) multa locutus.” The reference is to the fact, on which such special stress is laid, of the Lord’s “speaking to Moses *face to face, as a man speaketh with his friend*.” See especially Num. xii. 5–8, Deut. xxxiv. 9–12, with Deut. xviii. 17–19, Acts iii. 22, 23, vii. 37." },
  { t = "p", text = "From whose face light and brilliance in his own" },
  { t = "p", text = "Reflected shone; dashed on the ground the law" },
  { t = "p", text = "75 Accepted through some few,[^1477]—implicit type," },
  { t = "note", id = "1477", text = "The Latin in Oehler and Migne is thus: “Acceptam legem per paucos fudit in orbem;” and the reference seems to me to be to Ex. xxxii. 15–20, though the use of “orbem” for “ground” is perhaps strange; but “humum” would have been against the metre, if that argument be of any weight in the case of a writer so prolific of false quantities. Possibly the lines may mean that “he diffused through some few”—i.e., through the Jews, “few” as compared with the total inhabitants of the orb—“the Law which he had received;” but then the following line seems rather to favour the former view, because the tables of the Law—called briefly “the Law”—broken by Moses so soon after he had received them, were typical of the inefficacy of all Moses’ own toils, which, after all, ended in disappointment, as he was forbidden, on account of a sin committed in the very last of the forty years, to lead the people into “the land,” as he had fondly hoped to do. Only I suspect some error in “per paucos;” unless it be lawful to supply “dies,” and take it to mean “received during but few days,” i.e., “*within* few days,” “only a few days before,” and “accepted” or “kept” by the People “during but a few days.” Would it be lawful to conjecture “perpau*cis*” as one word, with “ante diebus” to be understood?" },
  { t = "p", text = "And sure, of his own toils!—smote through the rock;" },
  { t = "p", text = "And, being bidden, shed forth streams; and stretched" },
  { t = "p", text = "His hands that, by a sign,[^1478] he vanquish might" },
  { t = "note", id = "1478", text = "i.e., the sign of the cross. See Tertullian, *adv. Marc*., l. iii. c. xviii. *sub. fin*.; also *adv. Jud*., c. x. *med*." },
  { t = "p", text = "The foe; *of* Christ all *severally*, all[^1479]" },
  { t = "note", id = "1479", text = "i.e., all the acts and the experiences of Moses." },
  { t = "p", text = "80 *Combined through* Christ, do speak. Great and approved," },
  { t = "p", text = "He[^1480] rests with praise and peace." },
  { t = "note", id = "1480", text = "Moses." },
  { t = "p", text = "But Joshua," },
  { t = "p", text = "The son of Nun, erst called Oshea—this man" },
  { t = "p", text = "The Holy Spirit to Himself did join" },
  { t = "p", text = "As partner in His name:[^1481] hence did he cleave" },
  { t = "note", id = "1481", text = "See Ex. xxiii. 20–23; and comp. *adv. Marc.*, l. iii. c. xvi." },
  { t = "p", text = "85 The flood; constrained the People to pass o’er;" },
  { t = "p", text = "Freely distributed the land—the prize" },
  { t = "p", text = "Promised the fathers!—stayed both sun and moon" },
  { t = "p", text = "While vanquishing the foe; races extern" },
  { t = "p", text = "And giants’ progeny outdrave; razed groves;" },
  { t = "p", text = "90 Altars and temples levelled; and with mind" },
  { t = "p", text = "Loyal[^1482] performed all due solemnities:" },
  { t = "note", id = "1482", text = "Legitima, i.e., reverent of law." },
  { t = "p", text = "Type of Christ’s name; his virtue’s image." },
  { t = "p", text = "What" },
  { t = "p", text = "Touching the People’s Judges shall I say" },
  { t = "p", text = "Singly? whose virtues,[^1483] if unitedly" },
  { t = "note", id = "1483", text = "i.e., virtuous acts." },
  { t = "p", text = "95 Recorded, fill whole volumes numerous" },
  { t = "p", text = "With space of words. But yet the order due" },
  { t = "p", text = "Of filling out the body of my words," },
  { t = "p", text = "Demands that, out of many, I should tell" },
  { t = "p", text = "The life of few." },
  { t = "p", text = "Of whom when Gideon, guide" },
  { t = "p", text = "100 Of martial band, keen to attack the foe," },
  { t = "p", text = "(Not keen to gain for his own family," },
  { t = "p", text = "By virtue,[^1484] tutelary dignity,[^1485])" },
  { t = "note", id = "1484", text = "Or, “valour.”" },
  { t = "note", id = "1485", text = "The Latin runs thus: “Acer in hostem. Non virtute su*a* tutelam acquirere genti.” I have ventured to read “su*æ*,” and connect it with “genti;” and thus have obtained what seems to me a probable sense. See Judg. viii. 22, 23." },
  { t = "p", text = "And needing to be strengthened[^1486] in the faith" },
  { t = "note", id = "1486", text = "I read “firm*andus*” for “firm*atus*.”" },
  { t = "p", text = "Excited in his mind, seeks for a sign" },
  { t = "p", text = "105 Whereby he either could not, or could, wage" },
  { t = "p", text = "Victorious war; to wit, that with the dew" },
  { t = "p", text = "A fleece, exposèd for the night, should be" },
  { t = "p", text = "Moistened, and all the ground lie dry around" },
  { t = "p", text = "(By this to show that, with the world,[^1487] should dry[^1488]" },
  { t = "note", id = "1487", text = "Mundo." },
  { t = "note", id = "1488", text = "I have again ventured a correction, “coa*r*escere” for “coa*l*escere.” It makes at least *some* sense out of an otherwise (to *me*) unintelligible passage, the “palm” being taken as the well-known symbol of bloom and triumph. So David in Ps. xcii. 12 (xci. 13 in LXX.), “The righteous shall *flourish* like the *palm-tree*.” To “dry” here is, of course, neuter, and means to “wither.”" },
  { t = "p", text = "110 The enemies’ palm); and then again, the fleece" },
  { t = "p", text = "Alone remaining dry, the earth by night" },
  { t = "p", text = "Should with the self-same[^1489] moisture be bedewed:" },
  { t = "note", id = "1489", text = "I have changed “e*a*dem”—which must agree with “nocte,” and hence give a false sense; for it was not, of course, on “*the same night*,” but on the next, that this second sign was given—into “e*o*dem,” to agree with “liquore,” which gives a true one, as the “moisture,” of course, *was* the same,—dew, namely." },
  { t = "p", text = "For by this sign he prostrated the heaps" },
  { t = "p", text = "Of bandits; with Christ’s People ’countering them" },
  { t = "p", text = "115 Without much soldiery, with cavalry[^1490]" },
  { t = "note", id = "1490", text = "Equite. It appears to be used loosely for “men of war” generally." },
  { t = "p", text = "Three hundred—the Greek letter Tau, in truth," },
  { t = "p", text = "That number is[^1491]—with torches armed, and horns" },
  { t = "note", id = "1491", text = "Which is taken, from its form, as a sign of the cross; see below." },
  { t = "p", text = "Of blowers with the mouth: then[^1492] was the *fleece*," },
  { t = "note", id = "1492", text = "Refers to the “when” in 99, above." },
  { t = "p", text = "The people of Christ’s sheep, from holy seed" },
  { t = "p", text = "120 Born (for the *earth* means nations various," },
  { t = "p", text = "And scattered through the orb), which fleece the word" },
  { t = "p", text = "Nourishes; *night* death’s image; *Tau* the sign" },
  { t = "p", text = "Of the dear cross; the *horn* the heraldings" },
  { t = "p", text = "Of life; the *torches* shining in their stand[^1493]" },
  { t = "note", id = "1493", text = "Lychno. The “*faces*” are probably the *wicks*." },
  { t = "p", text = "125 The glowing Spirit: and this *testing*, too," },
  { t = "p", text = "Forsooth, an image of Christ’s virtue was:[^1494]" },
  { t = "note", id = "1494", text = "“Scilicet hoc testamen erat virtutis imago.”" },
  { t = "p", text = "To teach that death’s fierce battles should not be" },
  { t = "p", text = "By trump angelic vanquished before" },
  { t = "p", text = "Th’ indocile People be deservedly" },
  { t = "p", text = "130 By their own fault left desolate behind," },
  { t = "p", text = "And Gentiles, flourishing in faith, received" },
  { t = "p", text = "In praise." },
  { t = "p", text = "Yea, Deborah, a woman far" },
  { t = "p", text = "Above all fame, appears; who, having braced" },
  { t = "p", text = "Herself for warlike toil, for country’s sake," },
  { t = "p", text = "135 Beneath the palm-tree sang how victory" },
  { t = "p", text = "Had crowned her People; thanks to whom it was" },
  { t = "p", text = "That the foes, vanquisht, turned at once their backs," },
  { t = "p", text = "And Sisera their leader fled; whose flight" },
  { t = "p", text = "No man, nor any band, arrested: him," },
  { t = "p", text = "140 Suddenly renegade, a woman’s hand—" },
  { t = "p", text = "Jael’s[^1495]—with wooden weapon vanquished quite," },
  { t = "note", id = "1495", text = "The text as it stands is, in Oehler:— …“Hic Baal Christi victoria signo Extemplo refugam devicit femina ligno;” which I would read:— …“Hunc Jael, Christi victoriæ signo, Extemplo,” etc." },
  { t = "p", text = "For token of Christ’s victory." },
  { t = "p", text = "With firm faith" },
  { t = "p", text = "Jephthah appears, who a deep-wounding vow" },
  { t = "p", text = "Dared make—to promise God a grand reward" },
  { t = "p", text = "145 Of war: him[^1496] then, because he senselessly" },
  { t = "note", id = "1496", text = "For “*hic*” I would incline to read “*huic*.”" },
  { t = "p", text = "Had promised what the Lord not wills, first meets" },
  { t = "p", text = "The pledge[^1497] dear to his heart; who suddenly" },
  { t = "note", id = "1497", text = "i.e., child." },
  { t = "p", text = "Fell by a lot unhoped by any. He," },
  { t = "p", text = "To keep his promise, broke the sacred laws" },
  { t = "p", text = "150 Of parenthood: the shade of mighty fear" },
  { t = "p", text = "Did in his violent mind cover his vow" },
  { t = "p", text = "Of sin: as solace of his widowed life" },
  { t = "p", text = "For[^1498] wickedness, renown, and, for crime, praise," },
  { t = "note", id = "1498", text = "i.e., instead of." },
  { t = "p", text = "He won." },
  { t = "p", text = "Nor Samson’s strength, all corporal might" },
  { t = "p", text = "155 Passing, must we forget; the Spirit’s gift" },
  { t = "p", text = "Was this; the power was granted to his head.[^1499]" },
  { t = "note", id = "1499", text = "i.e., to his unshorn Nazarite locks." },
  { t = "p", text = "Alone he for his People, daggerless," },
  { t = "p", text = "Armless, an ass-jaw grasping, prostrated" },
  { t = "p", text = "A thousand corpses; and no bonds could keep" },
  { t = "p", text = "160 The hero bound: but after his shorn pride" },
  { t = "p", text = "Forsook him thralled, he fell, and, by his death,—" },
  { t = "p", text = "Though vanquisht,—bought his foes back ’neath his power." },
  { t = "p", text = "Marvellous Samuel, who first received" },
  { t = "p", text = "The precept to anoint kings, to give chrism" },
  { t = "p", text = "165 And show men-Christs,[^1500] so acted laudably" },
  { t = "note", id = "1500", text = "Viros ostendere Christos." },
  { t = "p", text = "In life’s space as, e’en after his repose," },
  { t = "p", text = "To keep prophetic rights.[^1501]" },
  { t = "note", id = "1501", text = "See 1 Sam. xxviii. (in LXX. 1 Kings) 11–19." },
  { t = "p", text = "Psalmographist" },
  { t = "p", text = "David, great king and prophet, with a voice" },
  { t = "p", text = "Submiss was wont Christ’s future suffering" },
  { t = "p", text = "170 To sing: which prophecy spontaneously" },
  { t = "p", text = "His thankless lawless People did perform:" },
  { t = "p", text = "Whom[^1502] God had promised that in time to come," },
  { t = "note", id = "1502", text = "i.e., *to* whom, to *David*." },
  { t = "p", text = "Fruit of his womb,[^1503] a holy progeny," },
  { t = "note", id = "1503", text = "“Ex utero:” a curious expression for a man; but so it is." },
  { t = "p", text = "He would on his sublime throne set: the Lord’s" },
  { t = "p", text = "175 Fixt faith did all that He had promised." },
  { t = "p", text = "Corrector of an inert People rose" },
  { t = "p", text = "Emulous[^1504] Hezekiah; who restored" },
  { t = "note", id = "1504", text = "i.e., emulous of David’s virtues." },
  { t = "p", text = "Iniquitous forgetful men the Law:[^1505]" },
  { t = "note", id = "1505", text = "Comp. especially 2 Chron. xxix.; xxx.; xxxi." },
  { t = "p", text = "All these God’s mandates of old time he first" },
  { t = "p", text = "180 Bade men observe, who ended war by prayers,[^1506]" },
  { t = "note", id = "1506", text = "Our author is quite correct in his order. A comparison of dates as given in the Scripture history shows us that his reforms preceded his war with Sennacherib." },
  { t = "p", text = "Not by steel’s point: he, dying, had a grant" },
  { t = "p", text = "Of years and times of life made to his tears:" },
  { t = "p", text = "Deservedly such honour his career" },
  { t = "p", text = "Obtained." },
  { t = "p", text = "With zeal immense, Josiah, prince" },
  { t = "p", text = "185 Himself withal, in like wise acted: none" },
  { t = "p", text = "So much, before or after!—Idols he" },
  { t = "p", text = "Dethroned; destroyed unhallowed temples; burned" },
  { t = "p", text = "With fire priests on their altars; all the bones" },
  { t = "p", text = "Of prophets false updug; the altars burned," },
  { t = "p", text = "190 The carcases to be consumed did serve" },
  { t = "p", text = "For fuel!" },
  { t = "p", text = "To the praise of signal faith," },
  { t = "p", text = "Noble Elijah, (memorable fact!)" },
  { t = "p", text = "Was rapt;[^1507] who hath not tasted yet death’s dues;" },
  { t = "note", id = "1507", text = "The “tactus” of the Latin is without sense, unless indeed it refer to his being twice “touched” by an angel. See 1 Kings (in LXX. 3 Kings) xix. 1–8. I have therefore substituted “raptus,” there being no mention of the angel in the Latin." },
  { t = "p", text = "Since to the orb he is to come again." },
  { t = "p", text = "195 His faith unbroken, then, chastening with stripes" },
  { t = "p", text = "People and frenzied king, (who did desert" },
  { t = "p", text = "The Lord’s best service), and with bitter flames" },
  { t = "p", text = "The foes, shut up the stars; kept in the clouds" },
  { t = "p", text = "The rain; showed all collectively that God" },
  { t = "p", text = "200 Is; made their error patent;—for a flame," },
  { t = "p", text = "Coming with force from heaven at his prayers," },
  { t = "p", text = "Ate up the victim’s parts, dripping with flood," },
  { t = "p", text = "Upon the altar:[^1508]—often as he willed," },
  { t = "note", id = "1508", text = "“Ar*a*s” should probably be “ar*am*.”" },
  { t = "p", text = "So often from on high rushed fire;[^1509] the stream" },
  { t = "note", id = "1509", text = "See 2 Kings (in LXX. 4 Kings) i. 9–12." },
  { t = "p", text = "205 Dividing, he made pathless passable;[^1510]" },
  { t = "note", id = "1510", text = "For “transgressas *et* avia fecit,” I read “transgress*us* avia fecit,” taking “transgressus” as a subst." },
  { t = "p", text = "And, in a chariot raised aloft, was borne" },
  { t = "p", text = "To paradise’s hall." },
  { t = "p", text = "Disciple his" },
  { t = "p", text = "Elisha was, succeeding to his lot:[^1511]" },
  { t = "note", id = "1511", text = "Sortis." },
  { t = "p", text = "Who begged to take to him Elijah’s lot[^1512]" },
  { t = "note", id = "1512", text = "Sortem." },
  { t = "p", text = "210 In double measure; so, with forceful stripe," },
  { t = "p", text = "The People to chastise:[^1513] such and so great" },
  { t = "note", id = "1513", text = "Our author has somewhat mistaken Elisha’s mission apparently; for as there is a significant difference in the meaning of their respective names, so there is in their works: Elijah’s miracles being rather miracles of judgment, it has been remarked; Elisha’s, of mercy." },
  { t = "p", text = "A love for the Lord’s cause he breathed. He smote" },
  { t = "p", text = "Through Jordan; made his feet a way, and crossed" },
  { t = "p", text = "Again; raised with a twig the axe down—sunk" },
  { t = "p", text = "215 Beneath the stream; changed into vital meat" },
  { t = "p", text = "The deathful food; detained a second time," },
  { t = "p", text = "Double in length,[^1514] the rains; cleansed leprosies;[^1515]" },
  { t = "note", id = "1514", text = "The reference is to a famine in Elisha’s days, which—2 Kings (in LXX. 4 Kings) viii. i.—was to last *seven years*; whereas that for which Elijah prayed, as we learn in Jas. v. 17., lasted *three* and *six months*. But it is not said that Elisha *prayed for* that famine." },
  { t = "note", id = "1515", text = "We only read of *one* leprosy which Elisha cleansed—Naaman’s. He *inflicted* leprosy on Gehazi, which was “to cleave to him and to his seed for ever.”" },
  { t = "p", text = "Entangled foes in darkness; and when one" },
  { t = "p", text = "Offcast and dead, by bandits’slaughter slain" },
  { t = "p", text = "220 His limbs, after his death, already hid" },
  { t = "p", text = "In sepulchre, did touch, he—light recalled—" },
  { t = "p", text = "Revived." },
  { t = "p", text = "Isaiah, wealthy seer, to whom" },
  { t = "p", text = "The fount was oped,—so manifest his faith!" },
  { t = "p", text = "Poured from his mouth God’s word forth. Promised was" },
  { t = "p", text = "225 The Father’s will, bounteous through Christ; through him" },
  { t = "p", text = "It testified before the way of life," },
  { t = "p", text = "And was approved:[^1516] but him, though stainless found," },
  { t = "note", id = "1516", text = "Prætestata vi*am* vitæ atque probata per ipsam est. I suspect we should read “vi*a*,” quantity being of no importance with our author, and take “prætestata” as passive: “The way of life was testified before, and proved, through him.”" },
  { t = "p", text = "And undeserving, the mad People cut" },
  { t = "p", text = "With wooden saw in twain, and took away" },
  { t = "p", text = "230 With cruel death." },
  { t = "p", text = "The holy Jeremy" },
  { t = "p", text = "Followed; whom the Eternal’s Virtue bade" },
  { t = "p", text = "Be prophet to the Gentiles, and him told" },
  { t = "p", text = "The future: who, because he brooded o’er" },
  { t = "p", text = "His People’s deeds illaudable, and said" },
  { t = "p", text = "235 (Speaking with voice presaging) that, unless" },
  { t = "p", text = "They had repented of betaking them" },
  { t = "p", text = "To deeds iniquitous against their slaves,[^1517]" },
  { t = "note", id = "1517", text = "This seems to be the meaning, and the reference will then be to Jer. xxxiv. 8–22 (in LXX. xli. 8–22); but the punctuation both in Oehler and Migne makes nonsense, and I have therefore altered it." },
  { t = "p", text = "They should be captived, bore hard bonds, shut up" },
  { t = "p", text = "In squalid gaol; and, in the miry pit," },
  { t = "p", text = "240 Hunger exhausted his decaying limbs." },
  { t = "p", text = "But, after he did prove what they to hear" },
  { t = "p", text = "Had been unwilling, and the foes did lead" },
  { t = "p", text = "The People bound in their triumphal trains," },
  { t = "p", text = "Hardly at length his wrinkled right hand lost" },
  { t = "p", text = "245 Its chains: it is agreed that by no death" },
  { t = "p", text = "Nor slaughter was the hero ta’en away." },
  { t = "p", text = "Faithful Ezekiel, to whom granted was" },
  { t = "p", text = "Rich grace of speech, saw sinners’ secrets; wailed" },
  { t = "p", text = "His own afflictions; prayed for pardon; saw" },
  { t = "p", text = "250 The vengeance of the saints, which is to be" },
  { t = "p", text = "By slaughter; and, in Spirit wrapt, the place" },
  { t = "p", text = "Of the saints’ realm, its steps and accesses," },
  { t = "p", text = "And the salvation of the flesh, he saw." },
  { t = "p", text = "Hosea, Amos, Micah, Joel, too," },
  { t = "p", text = "255 With Obadiah, Jonah, Nahum, come;" },
  { t = "p", text = "Habakkuk, Zephaniah, Haggai," },
  { t = "p", text = "And Zechariah who did violence" },
  { t = "p", text = "Suffer, and Malachi—angel himself!" },
  { t = "p", text = "Are here: these are the Lord’s seers; and their choir," },
  { t = "p", text = "260 As still they sing, is heard; and equally" },
  { t = "p", text = "Their proper wreath of praise they all have earned." },
  { t = "p", text = "How great was Daniel! What a man!" },
  { t = "p", text = "What power!" },
  { t = "p", text = "Who by their own mouth did false witnesses" },
  { t = "p", text = "Bewray, and saved a soul on a false charge" },
  { t = "p", text = "265 Condemned;[^1518] and, before that, by mouth resolved" },
  { t = "note", id = "1518", text = "See the apocryphal “Susanna.”" },
  { t = "p", text = "The king’s so secret dreams; foresaw how Christ" },
  { t = "p", text = "Dissolves the limbs of kingdoms; was accused" },
  { t = "p", text = "For his Lord’s was made the lions’ prey;" },
  { t = "p", text = "And, openly preserved[^1519] before all eyes," },
  { t = "note", id = "1519", text = "For “servat*is*que palam cunctis in pace quievit,” which the edd. give, I suggest “servat*us*que,” etc., and take “palam” for governing “cunctis.”" },
  { t = "p", text = "270 Rested in peace." },
  { t = "p", text = "His Three Companions, scarce" },
  { t = "p", text = "With due praise to be sung, did piously" },
  { t = "p", text = "Contemn the king’s iniquitous decree," },
  { t = "p", text = "Out of so great a number: to the flames" },
  { t = "p", text = "Their bodies given were; but they preferred," },
  { t = "p", text = "275 For the Great Name, to yield to penalties" },
  { t = "p", text = "Themselves, than to an image stretch their palms" },
  { t = "p", text = "On bended knees. Now their o’erbrilliant faith," },
  { t = "p", text = "Now hope outshining all things, the wild fires" },
  { t = "p", text = "Hath quencht, and vanquisht the iniquitous!" },
  { t = "p", text = "280 Ezra the seer, doctor of Law, and priest" },
  { t = "p", text = "Himself (who, after full times, back did lead" },
  { t = "p", text = "The captive People), with the Spirit filled" },
  { t = "p", text = "Of memory, restored by word of mouth" },
  { t = "p", text = "All the seers’ volumes, by the fires and mould[^1520]" },
  { t = "note", id = "1520", text = "Ignibus et *multa* consumpta volumina vatum. *Multa*must, apparently, be an error for some word signifying “mould” or the like; unless, with the disregard of construction and quantity observable in this author, it be an *acc. pl*. to agree with *volumina*, so that we must take *“omnia multa volumina”* together, which would alter the whole construction of the context." },
  { t = "p", text = "285 Consumèd." },
  { t = "p", text = "Great above all born from seed" },
  { t = "p", text = "Is John whose praises hardly shall we skill" },
  { t = "p", text = "To tell: the washer[^1521] of the flesh: the Lord’s" },
  { t = "note", id = "1521", text = "Ablutor." },
  { t = "p", text = "Open forerunner; washer,[^1522] too, of Christ," },
  { t = "note", id = "1522", text = "Ablutor." },
  { t = "p", text = "Himself first born again from Him: the first" },
  { t = "p", text = "290 Of the new convenant, last of the old," },
  { t = "p", text = "Was he; and for the True Way’s sake he died," },
  { t = "p", text = "The first slain victim." },
  { t = "p", text = "See God-Christ! behold" },
  { t = "p", text = "Alike, His Twelve-Fold Warrior-Youth![^1523] in all" },
  { t = "note", id = "1523", text = "Juventus." },
  { t = "p", text = "One faith, one dove, one power; the flower of men;" },
  { t = "p", text = "295 Lightening the world[^1524] with light; comrades of Christ" },
  { t = "note", id = "1524", text = "Mundo." },
  { t = "p", text = "And apostolic men; who, speaking truth," },
  { t = "p", text = "Heard with their ears Salvation,[^1525] with their eyes" },
  { t = "note", id = "1525", text = "Salutem =Christum. So Simeon, “Mine eyes have seen *Thy salvation*,” where the Greek word should be noted and compared with its usage in the LXX., especially in the Psalms. See Luke ii. 30." },
  { t = "p", text = "Saw It, and handled with their hand the late" },
  { t = "p", text = "From death recovered body,[^1526] and partook" },
  { t = "note", id = "1526", text = "Comp. 1 John i. 1, 2." },
  { t = "p", text = "300 As fellow-guests of food therewith, as they" },
  { t = "p", text = "Themselves bear witness." },
  { t = "p", text = "Him did Paul as well" },
  { t = "p", text = "(Forechosen apostle, and in due time sent)," },
  { t = "p", text = "When rapt into the heavens,[^1527] behold: and sent" },
  { t = "note", id = "1527", text = "See 2 Cor. xii. 1 sqq." },
  { t = "p", text = "By Him, he, with his comrade Barnabas," },
  { t = "p", text = "305 And with the earlier associates" },
  { t = "p", text = "Joined in one league together, everywhere" },
  { t = "p", text = "Among the Gentiles hands the doctrine down" },
  { t = "p", text = "That Christ is Head, whose members are the Church," },
  { t = "p", text = "He the salvation of the body, He" },
  { t = "p", text = "310 The members’ life perennial;" },
  { t = "p", text = "He, made flesh, He, ta’en away for all, Himself first rose" },
  { t = "p", text = "Again, salvation’s only hope; and gave" },
  { t = "p", text = "The norm to His disciples: they at once" },
  { t = "p", text = "All variously suffered, for His Name," },
  { t = "p", text = "315 Unworthy penalties." },
  { t = "p", text = "Such members bears" },
  { t = "p", text = "With beauteous body the free mother, since" },
  { t = "p", text = "She never her Lord’s precepts left behind," },
  { t = "p", text = "And in His home hath grown old, to her Lord" },
  { t = "p", text = "Ever most choice, having for His Name’s sake" },
  { t = "p", text = "320 Penalties suffered. For since, barren once," },
  { t = "p", text = "Not yet secure of her futurity," },
  { t = "p", text = "She hath outgiven a people born of seed" },
  { t = "p", text = "Celestial, and[^1528] been spurned, and borne the spleen[^1529]" },
  { t = "note", id = "1528", text = "The common reading is, “Atque suæ famulæ porta*vit* spreta dolorem,” for which Oehler reads “porta*rit*;” but I incline rather to suggest that “porta*vit*” be retained, but that the “a*t*que” be changed into “a*e*que,” thus: “A*e*que suæ famulæ porta*vit* spreta dolorem;” i.e., Since, like Sarah, the once barren Christian church-mother hath had children, *equally*, like Sarah, hath she had to bear scorn and spleen at her handmaid’s—the Jewish church-mother’s—hands." },
  { t = "note", id = "1529", text = "Dolorem." },
  { t = "p", text = "Of her own handmaid; now ’tis time to see" },
  { t = "p", text = "325 This former-barren mother have a son" },
  { t = "p", text = "The heir of her own liberty; not like" },
  { t = "p", text = "The *handmaid’s* heir, yoked in *estate* to *her*," },
  { t = "p", text = "Although she bare him from celestial seed" },
  { t = "p", text = "Conceived. Far be it that ye should with words" },
  { t = "p", text = "330 Unlawful, with rash voice, collectively" },
  { t = "p", text = "Without distinction, give men exemplary" },
  { t = "p", text = "(Heaven’s glowing constellations, to the mass" },
  { t = "p", text = "Of men conjoined by seed alone or blood)," },
  { t = "p", text = "The rugged bondman’s[^1530] name; or that one think" },
  { t = "note", id = "1530", text = "i.e., Ishmael’s." },
  { t = "p", text = "335 That he may speak in servile style about" },
  { t = "p", text = "A People who the mandates followèd" },
  { t = "p", text = "Of the Lord’s Law. No: but we mean the troop" },
  { t = "p", text = "Of sinners, empty, mindless, who have placed" },
  { t = "p", text = "God’s promises in a mistrustful heart;" },
  { t = "p", text = "340 Men vanquisht by the miserable sweet" },
  { t = "p", text = "Of present life: that troop would have been bound" },
  { t = "p", text = "Capital slavery to undergo," },
  { t = "p", text = "By their own fault, if sin’s cause shall impose" },
  { t = "p", text = "Law’s yoke upon the mass. For to serve God," },
  { t = "p", text = "345 And be whole-heartedly intent thereon," },
  { t = "p", text = "Untainted faith, and freedom, is thereto" },
  { t = "p", text = "Prepared spontaneous." },
  { t = "p", text = "The just fathers, then," },
  { t = "p", text = "And holy stainless prophets, many, sang" },
  { t = "p", text = "The future advent of the Lord; and they" },
  { t = "p", text = "350 Faithfully testify what Heaven bids" },
  { t = "p", text = "To men profane: with them the giants,[^1531] men" },
  { t = "note", id = "1531", text = "“Immanes,” if it be the true reading." },
  { t = "p", text = "With Christ’s own glory satiated, made" },
  { t = "p", text = "The consorts of His virtue, filling up" },
  { t = "p", text = "The hallowed words, have stablished our faith;" },
  { t = "p", text = "355 By facts predictions proving." },
  { t = "p", text = "Of these men" },
  { t = "p", text = "Disciples who succeeded them throughout" },
  { t = "p", text = "The orb, men wholly filled with virtue’s breath," },
  { t = "p", text = "And our own masters, have assigned to us" },
  { t = "p", text = "Honours conjoined with works." },
  { t = "p", text = "Of whom the first" },
  { t = "p", text = "360 Whom Peter bade to take his place and sit" },
  { t = "p", text = "Upon this chair in mightiest Rome where he" },
  { t = "p", text = "Himself had sat,[^1532] was Linus, great, elect," },
  { t = "note", id = "1532", text = "This is the way Oehler’s punctuation reads. Migne’s reads as follows:— …“Of whom the first Whom mightiest Rome bade take his place and sit Upon the chair where Peter’s self had sat,” etc." },
  { t = "p", text = "And by the mass approved. And after him" },
  { t = "p", text = "Cletus himself the fold’s flock undertook;" },
  { t = "p", text = "365 As his successor Anacletus was" },
  { t = "p", text = "By lot located: Clement follows him;" },
  { t = "p", text = "Well known was he to apostolic men:[^1533]" },
  { t = "note", id = "1533", text = "“Is apostolicis bene notus.” This may mean, (*a*) as in our text; (*b*) by his apostolically-minded writings—writings like an apostle’s; or (*c*) by the apostolic writings, i.e., by the mention made of him, supposing him to be the same, in Phil. iv. 3." },
  { t = "p", text = "Next Evaristus ruled without a crime" },
  { t = "p", text = "The law.[^1534] To Sixtus Sextus Alexander" },
  { t = "note", id = "1534", text = "Legem." },
  { t = "p", text = "370 Commends the fold: who, after he had filled" },
  { t = "p", text = "His lustral times up, to Telesphorus" },
  { t = "p", text = "Hands it in order: excellent was he," },
  { t = "p", text = "And martyr faithful. After him succeeds" },
  { t = "p", text = "A comrade in the law,[^1535] and master sure:" },
  { t = "note", id = "1535", text = "Legis." },
  { t = "p", text = "375 When lo! the comrade of your wickedness," },
  { t = "p", text = "Its author and forerunner—Cerdo hight—" },
  { t = "p", text = "Arrived at Rome, smarting with recent wounds:" },
  { t = "p", text = "Detected, for that he was scattering" },
  { t = "p", text = "Voices and words of venom stealthily:" },
  { t = "p", text = "380 For which cause, driven from the band, he bore" },
  { t = "p", text = "This sacrilegious brood, the dragon’s breath" },
  { t = "p", text = "Engendering it. Blooming in piety" },
  { t = "p", text = "United stood the Church of Rome, compact" },
  { t = "p", text = "By Peter: whose successor, too, himself," },
  { t = "p", text = "385 And now in the ninth place, Hyginus was," },
  { t = "p", text = "The burden undertaking of his chair." },
  { t = "p", text = "After him followed Pius—Hermas his" },
  { t = "p", text = "Own brother[^1536] was; angelic “Pastor” he," },
  { t = "note", id = "1536", text = "Germine frater." },
  { t = "p", text = "Because he spake the words delivered him:[^1537]" },
  { t = "note", id = "1537", text = "An allusion to the well-known *Pastor* or *Shepherd* of Hermas." },
  { t = "p", text = "390 And Anicetus[^1538] the allotted post" },
  { t = "note", id = "1538", text = "Our author makes the name Anicetus. Rig. (as quoted by Oehler) observes that a comparison of the list of bishops of Rome here given with that given by Tertullian in *de Præscr*., c. xxxii., seems to show that this metrical piece cannot be his." },
  { t = "p", text = "In pious order undertook. ’Neath whom" },
  { t = "p", text = "Marcion here coming, the new Pontic pest," },
  { t = "p", text = "(The secret daring deed in his own heart" },
  { t = "p", text = "Not yet disclosed,) went, speaking commonly," },
  { t = "p", text = "395 In all directions, in his perfidy," },
  { t = "p", text = "With lurking art. But after he began" },
  { t = "p", text = "His deadly arrows to produce, cast off" },
  { t = "p", text = "Deservedly (as author of a crime" },
  { t = "p", text = "So savage), reprobated by the saints," },
  { t = "p", text = "400 He burst, a wondrous monster! on our view." },
]

[[section]]
id = "book-4"
title = "Book IV. Of Marcion's Antitheses."
level = 1
blocks = [
  { t = "p", text = "Book IV.—Of Marcion’s Antitheses.[^1539]" },
  { t = "note", id = "1539", text = "The state of the text in some parts of this book is frightful. It has been almost hopeless to extract any sense whatever out of the Latin in many passages—indeed, the renderings are in these cases little better than guess-work—and the confusion of images, ideas, and quotations is extraordinary." },
  { t = "p", text = "What the Inviolable Power bids" },
  { t = "p", text = "The youthful people,[^1540] which, rich, free, and heir," },
  { t = "note", id = "1540", text = "See the preceding book." },
  { t = "p", text = "Possesses an eternal hope of praise" },
  { t = "p", text = "(By right assigned) is this: that with great zeal" },
  { t = "p", text = "5 Burning, armed with the love of peace—yet not" },
  { t = "p", text = "As teachers (Christ alone doth all things teach[^1541])," },
  { t = "note", id = "1541", text = "I have changed the unintelligible “daret” of the edd. into “docet.” The reference seems to be to Matt. xxiii. 8; Jas. iii. 1; 1 Pet. v. 2, 3." },
  { t = "p", text = "But as Christ’s household—servants—o’er the earth" },
  { t = "p", text = "They should conduct a massive war;[^1542] should raze" },
  { t = "note", id = "1542", text = "Molem belli deducere terræ." },
  { t = "p", text = "The wicked’s lofty towers, savage walls," },
  { t = "p", text = "10 And threats which ’gainst the holy people’s bands" },
  { t = "p", text = "Rise, and dissolve such empty sounds in air." },
  { t = "p", text = "Wherefore we, justly speaking emulous words,[^1543]" },
  { t = "note", id = "1543", text = "Æmulamenta. Migne seems to think the word refers to Marcion’s “Antitheses.”" },
  { t = "p", text = "Out of his[^1544] own words even strive to express" },
  { t = "note", id = "1544", text = "i.e., apparently Marcion’s." },
  { t = "p", text = "The meaning of salvation’s records,[^1545] which" },
  { t = "note", id = "1545", text = "Monumenta." },
  { t = "p", text = "15 Large grace hath poured profusely; and to ope" },
  { t = "p", text = "To the saints’ eyes the Bandit’s[^1546] covert plague:" },
  { t = "note", id = "1546", text = "See the opening of the preceding book." },
  { t = "p", text = "Lest any untrained, daring, ignorant," },
  { t = "p", text = "Fall therein unawares, and (being caught)" },
  { t = "p", text = "Forfeit celestial gifts." },
  { t = "p", text = "God, then, is One" },
  { t = "p", text = "20 To mortals all and everywhere; a Realm" },
  { t = "p", text = "Eternal, Origin of light profound;" },
  { t = "p", text = "Life’s Fount; a Draught fraught[^1547] with all wisdom. He" },
  { t = "note", id = "1547", text = "“Conditus;” i.e., probably (in violation of quantity) the past part. of “condio” = flavoured, seasoned." },
  { t = "p", text = "Produced the orb whose bosom all things girds;" },
  { t = "p", text = "Him not a region, not a place, includes as" },
  { t = "p", text = "25 In circuit: matter none perennial is,[^1548]" },
  { t = "note", id = "1548", text = "I have altered the punctuation here." },
  { t = "p", text = "So as to be self-made, or to have been" },
  { t = "p", text = "Ever, created by no Maker: heaven’s," },
  { t = "p", text = "Earth’s, sea’s, and the abyss’s[^1549] Settler[^1550] is" },
  { t = "note", id = "1549", text = "Inferni." },
  { t = "note", id = "1550", text = "Locator." },
  { t = "p", text = "The Spirit; air’s Divider, Builder, Author," },
  { t = "p", text = "30 Sole God perpetual, Power immense, is He.[^1551]" },
  { t = "note", id = "1551", text = "These lines are capable, according to their punctuation, of various renderings, which for brevity’s sake I must be content to omit." },
  { t = "p", text = "Him had the Law the People[^1552] shown to be" },
  { t = "note", id = "1552", text = "i.e., the People of Israel. See the *de Idol*., p. 148, c. v. note 1." },
  { t = "p", text = "One God,[^1553] whose mighty voice to Moses spake" },
  { t = "note", id = "1553", text = "See Deut. vi. 3, 4, quoted in Mark xii. 29, 30." },
  { t = "p", text = "Upon the mount. Him this His Virtue, too," },
  { t = "p", text = "His Wisdom, Glory, Word, and Son, this Light" },
  { t = "p", text = "35 Begotten from the Light immense,[^1554] proclaims" },
  { t = "note", id = "1554", text = "This savours of the Nicene Creed." },
  { t = "p", text = "Through the seers’ voices, to be One: and Paul,[^1555]" },
  { t = "note", id = "1555", text = "Migne’s pointing is followed, in preference to Oehler’s." },
  { t = "p", text = "Taking the theme in order up, thus too" },
  { t = "p", text = "Himself delivers; “Father there is One[^1556]" },
  { t = "note", id = "1556", text = "“Un*um hunc* esse Patrem;” i.e., “that *this One* (God) is the Father.” But I rather incline to read, “un*umque* esse;” or we may render, “This One is the Sire.”" },
  { t = "p", text = "Through whom were all things made: Christ One, through whom" },
  { t = "p", text = "40 God all things made;”[^1557] to whom he plainly owns" },
  { t = "note", id = "1557", text = "See 1 Cor. viii. 5, 6 (but notice the prepositions in the Greek; our author is not accurate in rendering them); Eph. iv. 4, 5, 6." },
  { t = "p", text = "That every knee doth bow itself;[^1558] of whom" },
  { t = "note", id = "1558", text = "Ad quem se curvare genu plane omne fatetur. The reference is to Phil. ii. 10; but our author is careless in using the present tense, “se curvare.”" },
  { t = "p", text = "Is every fatherhood[^1559] in heaven and earth" },
  { t = "note", id = "1559", text = "The reference is to Eph. iii. 14, 15; but here again our author seems in error, as he refers the words to *Christ*, whereas the meaning of the apostle appears clearly to refer them to*the Father*." },
  { t = "p", text = "Called: who is zealous with the highest love" },
  { t = "p", text = "Of parent-care His people-ward; and wills" },
  { t = "p", text = "45 All flesh to live in holy wise, and wills" },
  { t = "p", text = "His people to appear before Him pure" },
  { t = "p", text = "Without a crime. With such zeal, by a law[^1560]" },
  { t = "note", id = "1560", text = "Legitimos. See book iv. 91." },
  { t = "p", text = "Guards He our safety; warns us *loyal* be;" },
  { t = "p", text = "Chastens; is instant. So, too, has the same" },
  { t = "p", text = "50 Apostle (when Galatian brethren" },
  { t = "p", text = "Chiding)—Paul—written that such zeal hath he.[^1561]" },
  { t = "note", id = "1561", text = "See Gal. iii. 20. But here, again, “Galatas” seems rather like an error; for in speaking to the *Corinthians* St. Paul uses an expression more like our author’s: see 2 Cor. xi. 2. The Latin, too, is faulty: “Talem *se* Paulus zelum *se* scripsit habere,” where, perhaps, for the first “*se*” we should read “*sic.*”" },
  { t = "p", text = "The fathers’sins God freely rendered, then," },
  { t = "p", text = "Slaying in whelming deluge utterly Parents alike with progeny, and e’en" },
  { t = "p", text = "55 Grandchildren in “fourth generation”[^1562] now" },
  { t = "note", id = "1562", text = "Comp. Ex. xx. 5; Deut. v. 9." },
  { t = "p", text = "Descended from the parent-stock, when He" },
  { t = "p", text = "Has then for nearly these nine hundred years" },
  { t = "p", text = "Assisted them. Hard does the judgment seem?" },
  { t = "p", text = "The sentence savage? And in Sodom, too," },
  { t = "p", text = "60 That the still guiltless little one unarmed" },
  { t = "p", text = "And tender should lose life: for what had e’er" },
  { t = "p", text = "The infant sinned? What cruel thou mayst think," },
  { t = "p", text = "Is parent-care’s true duty. Lest misdeed" },
  { t = "p", text = "Should further grow, crime’s authors He did quench," },
  { t = "p", text = "65 And sinful parents’ brood. But, with his sires," },
  { t = "p", text = "The harmless infant pays not penalties" },
  { t = "p", text = "Perpetual, ignorant and not advanced" },
  { t = "p", text = "In crime: but lest he partner should become" },
  { t = "p", text = "Of adult age’s guilt, death immature" },
  { t = "p", text = "70 Undid spontaneous future ills." },
  { t = "p", text = "Why, then," },
  { t = "p", text = "Bids God libation to be poured to Him" },
  { t = "p", text = "With blood of sheep? and takes so stringent means" },
  { t = "p", text = "By Law, that, in the People, none transgress" },
  { t = "p", text = "Erringly, threatening them with instant death" },
  { t = "p", text = "75 By stoning? and why reprobates, again," },
  { t = "p", text = "These gifts of theirs, and says they are to Him" },
  { t = "p", text = "Unwelcome, while He chides a People prest" },
  { t = "p", text = "With swarm of sin?[^1563] Does He, the truthful, bid," },
  { t = "note", id = "1563", text = "See Isa. i. 10–15; Jer. vi. 20." },
  { t = "p", text = "And He, the just, at the same time repel?" },
  { t = "p", text = "80 The causes if thou seekst, cease to be moved" },
  { t = "p", text = "Erringly: for faith’s cause is weightier" },
  { t = "p", text = "Than fancied reason.[^1564] Through a mirror[^1565]—shade" },
  { t = "note", id = "1564", text = "Causa etenim fidei rationis imagine major." },
  { t = "note", id = "1565", text = "Comp. 1 Cor. xiii. 12; Heb. x. 1." },
  { t = "p", text = "Of fulgent light!—behold what the calf’s blood," },
  { t = "p", text = "The heifer’s ashes, and each goat, do mean:" },
  { t = "p", text = "85 The one dismissed goes off, the other falls" },
  { t = "p", text = "A victim at the temple." },
  { t = "p", text = "With calf’s blood" },
  { t = "p", text = "With water mixt the seer[^1566] (thus from on high" },
  { t = "note", id = "1566", text = "Moses. See Heb. ix. 19–22, and the references there." },
  { t = "p", text = "Bidden) besprinkled People, vessels all," },
  { t = "p", text = "Priests, and the written volumes of the Law." },
  { t = "p", text = "90 See here not their true hope, nor yet a mere" },
  { t = "p", text = "Semblance devoid of virtue:[^1567] but behold" },
  { t = "note", id = "1567", text = "Comp. Heb. ix. 13." },
  { t = "p", text = "In the calf’s type Christ destined *bodily*" },
  { t = "p", text = "To suffer; who upon His shoulders bare" },
  { t = "p", text = "The plough-beam’s hard yokes,[^1568] and with fortitude" },
  { t = "note", id = "1568", text = "Alluding probably to our Lord’s bearing of the *cross-beam* of His *cross*—the beam being the “yokes,” and the upright stem of the cross the “plough-beam”—on His shoulders.—See John xix. 17." },
  { t = "p", text = "95 Brake His own heart with the steel share, and poured" },
  { t = "p", text = "Into the furrows water of His own" },
  { t = "p", text = "Life’s blood. For these “temple-vessels” do" },
  { t = "p", text = "Denote our bodies: God’s true temple[^1569] He," },
  { t = "note", id = "1569", text = "Templum. Comp. John ii. 19–22; Col. ii. 9." },
  { t = "p", text = "Not dedicated erst; for to Himself" },
  { t = "p", text = "100 He by His blood associated men," },
  { t = "p", text = "And willed them be His body’s priests, Himself" },
  { t = "p", text = "The Supreme Father’s perfect Priest by right." },
  { t = "p", text = "Hearing, sight, step inert, He cleansed; and, for a “book,”[^1570]" },
  { t = "note", id = "1570", text = "Libro. The reference is to the preceding lines, especially 89, and Heb. ix. 19, αὐτὸ τὸ βιβλίον. The use of “libro” is curious, as it seems to be used partly as if it would be equivalent to *pro libro*, “in the place of a book,” partly in a more truly datival sense, “to serve the purposes of a book;” and our “for” is capable of the two senses." },
  { t = "p", text = "Sprinkled, by speaking[^1571] words of presage, those" },
  { t = "note", id = "1571", text = "For this comparison of “speaking” to “sprinkling,” comp. Deut. xxxii. 2, “My *doctrine shall drop as the rain*; my *speech shall distil as the dew*,” etc.; Job xxix. 22, “My *speech dropped* upon them;” with Eph. v. 26, and with our Lord’s significant action (recorded in the passage here alluded to, John xx. 22) of “*breathing on*” (ἐνεφύσησεν) His disciples. Comp., too, for the “witnesses” and “words of presage,” Luke xxiv. 48, 49; Acts i. 6–8." },
  { t = "p", text = "105 His witnesses: demonstrating the Law" },
  { t = "p", text = "Bound by His holy blood." },
  { t = "p", text = "This cause withal" },
  { t = "p", text = "Our victim through “*the heifer*” manifests" },
  { t = "p", text = "From whose blood taking for the People’s sake" },
  { t = "p", text = "Piacular drops, them the first Levite[^1572] bare" },
  { t = "note", id = "1572", text = "i.e., the chief of the Levites, the high priest." },
  { t = "p", text = "110 Within the veil; and, by God’s bidding, burned" },
  { t = "p", text = "Her corse without the camp’s gates; with whose ash" },
  { t = "p", text = "He cleansed lapsed bodies." },
  { t = "p", text = "Thus our Lord (who us" },
  { t = "p", text = "By His own death redeemed), without the camp[^1573]" },
  { t = "note", id = "1573", text = "Comp. Heb. xiii. 12, 13; John xix. 19, 20." },
  { t = "p", text = "Willingly suffering the violence" },
  { t = "p", text = "115 Of an iniquitous People, did fulfil" },
  { t = "p", text = "The Law, by facts predictions proving;[^1574] who" },
  { t = "note", id = "1574", text = "Comp. the preceding book, 355." },
  { t = "p", text = "A people of contamination full" },
  { t = "p", text = "Doth truly cleanse, conceding all things, as" },
  { t = "p", text = "The body’s Author rich; within heaven’s veil" },
  { t = "p", text = "120 Gone with the blood which—One for many’s deaths—" },
  { t = "p", text = "He hath outpoured." },
  { t = "p", text = "A holy victim, then," },
  { t = "p", text = "Is meet for a great priest; which worthily" },
  { t = "p", text = "He, being perfect, may be proved to have," },
  { t = "p", text = "And offer. He *a body* hath: this is" },
  { t = "p", text = "125 For mortals a live victim; worthy this" },
  { t = "p", text = "Of great price did He offer, One for all." },
  { t = "p", text = "The[^1575] semblance of the “goats” teaches that they" },
  { t = "note", id = "1575", text = "The passage which follows is almost unintelligible. The sense which I have offered in my text is so offered with great diffidence, as I am far from certain of having hit the meaning; indeed, the state of the text is such, that *any* meaning must be a matter of some uncertainty." },
  { t = "p", text = "Are men exiled out of the “peoples twain”[^1576]" },
  { t = "note", id = "1576", text = "i.e., perhaps the Jewish and Christian peoples. Comp. *adv. Jud*., c. 1." },
  { t = "p", text = "As barren;[^1577] fruitless both; (of whom the Lord" },
  { t = "note", id = "1577", text = "i.e., “barren” of faith and good works. The “goats” being but “kids” (see Lev. xvi. 8), would, of course, be barren. “Exiled” seems to mean “excommunicated.” But the comparison of the sacrificed goat to a penitent, and of the scapegoat to an impenitent, excommunicate, is extravagant. Yet I see no other sense." },
  { t = "p", text = "130 Spake also, in the Gospel, telling how" },
  { t = "p", text = "The kids are severed from the sheep, and stand" },
  { t = "p", text = "On the left hand[^1578]): that some indeed there are" },
  { t = "note", id = "1578", text = "See Matt. xxv. 31–33." },
  { t = "p", text = "Who for the Lord’s Name’s sake have suffered: thus" },
  { t = "p", text = "That fruit has veiled their former barrenness:" },
  { t = "p", text = "135 And such, the prophet teaches, on the ground" },
  { t = "p", text = "Of that their final merit worthy are" },
  { t = "p", text = "Of the Lord’s altar: others, cast away" },
  { t = "p", text = "(As was th’ iniquitous rich man, we read," },
  { t = "p", text = "By Lazarus[^1579]), are such as have remained" },
  { t = "note", id = "1579", text = "i.e., Lazarus was not allowed to help him. In that sense he may be said to have been “cast away;” but it is Abraham, not Lazarus, who pronounces his doom. See Luke xvi. 19–31." },
  { t = "p", text = "140 Exiled, persistent in their stubbornness." },
  { t = "p", text = "Now a veil, hanging in the midst, did both" },
  { t = "p", text = "Dissever,[^1580] and had into portions twain" },
  { t = "note", id = "1580", text = "i.e., in that the blood of the one was brought within the veil; the other was not." },
  { t = "p", text = "Divided the one shrine.[^1581] The inner parts" },
  { t = "note", id = "1581", text = "Ædem." },
  { t = "p", text = "Were called “Holies of holies.” Stationed there" },
  { t = "p", text = "145 An altar shone, noble with gold; and there," },
  { t = "p", text = "At the same time, the testaments and ark" },
  { t = "p", text = "Of the Law’s tablets; covered wholly o’er" },
  { t = "p", text = "With lambs’skins[^1582] dyed with heaven’s hue; within" },
  { t = "note", id = "1582", text = "The meaning seems to be, that *the ark*, when it had to be removed from place to place, had (as we learn from Num. iv. 5) to be covered with “the second veil” (as it is called in Heb. ix. 3), which was “of blue,” etc. But that this veil was made “of lambs’ skins” does not appear; on the contrary, it was made of “linen.” The *outer* veil, indeed (not the out*most*, which was of “badgers’ skins,” according to the Eng. ver.; but of “ὑακίνθινα δερματα”—of what material is not said—according to the LXX.), *was* made “of rams’ skins;” but then they were “dyed *red*” (ἡρυθροδανωμένα, LXX.), not “*blue*.” So there is some confusion in our author." },
  { t = "p", text = "Gold-clad;[^1583] and all between of wood. Here are so" },
  { t = "note", id = "1583", text = "The ark was overlaid with gold *without* as well as within. (See Ex. xxv. 10, 11; xxxvii. 1, 2; and this is referred to in Heb. ix. 3, 4—κιβωτὸν…περικεκαλυμμένην—where our Eng. ver. rendering is defective, and in the context as well.) This, however, may be said to be implied in the following words: “and *all between*,” i.e., between the layers above and beneath, “of wood.”" },
  { t = "p", text = "150 The tablets of the Law; here is the urn" },
  { t = "p", text = "Replete with manna; here is Aaron’s rod" },
  { t = "p", text = "Which puts forth germens of the cross[^1584]—unlike" },
  { t = "note", id = "1584", text = "Migne supposes some error in these words. Certainly the sense is dark enough; but see lower down." },
  { t = "p", text = "The cross itself, yet born of storax-tree[^1585]—And over it—in uniformity" },
  { t = "note", id = "1585", text = "It yielded “almonds,” according to the Eng. ver. (Num. xvii. 8). But see the LXX." },
  { t = "p", text = "155 Fourfold—the cherubim their pinions spread," },
  { t = "p", text = "And the inviolable sanctities[^1586]" },
  { t = "note", id = "1586", text = "Sagmina. But the word is a very strange one to use indeed. See the Latin Lexicons, *s.v.*" },
  { t = "p", text = "Covered obediently.[^1587] Without the veil" },
  { t = "note", id = "1587", text = "It might be questionable whether “jussa” refers to “cherubim” or to “sagmina.”" },
  { t = "p", text = "Part of the shrine stood open: facing it," },
  { t = "p", text = "Heavy with broad brass, did an altar stand;" },
  { t = "p", text = "160 And with two triple sets (on each side one)" },
  { t = "p", text = "Of branches woven with the central stem," },
  { t = "p", text = "A lampstand, and as many[^1588] lamps:" },
  { t = "note", id = "1588", text = "i.e., twice three + the central one = 7." },
  { t = "p", text = "The golden substance wholly filled with light" },
  { t = "p", text = "The temple.[^1589]" },
  { t = "note", id = "1589", text = "Our author persists in calling the tabernacle temple." },
  { t = "p", text = "Thus the temple’s outer face," },
  { t = "p", text = "165 Common and open, does the ritual" },
  { t = "p", text = "Denote, then, of a people lingering" },
  { t = "p", text = "Beneath the Law; amid whose[^1590] gloom there shone" },
  { t = "note", id = "1590", text = "i.e., the Law’s." },
  { t = "p", text = "The Holy Spirit’s sevenfold unity" },
  { t = "p", text = "Ever, the People sheltering.[^1591] And thus" },
  { t = "note", id = "1591", text = "“*T*egebat,” i.e., with the “fiery-cloudy pillar,” unless it be an error for “*r*egebat,” which still might apply to the pillar." },
  { t = "p", text = "170 The Lampstand True and living Lamps do shine" },
  { t = "p", text = "Persistently throughout the Law and Seers" },
  { t = "p", text = "On men subdued in heart. And for a type" },
  { t = "p", text = "Of *earth*,[^1592] the altar—so tradition says—" },
  { t = "note", id = "1592", text = "Terræ." },
  { t = "p", text = "Was made. Here constantly, in open space," },
  { t = "p", text = "175 Before all eyes were visible of old" },
  { t = "p", text = "The People’s “works,”[^1593] which ever—“not without" },
  { t = "note", id = "1593", text = "“Operæ,” i.e., sacrifices. The Latin is a hopeless jumble of words without grammatical sequence, and any rendering is mere guesswork." },
  { t = "p", text = "Blood”[^1594]—it did offer, shedding out the gore" },
  { t = "note", id = "1594", text = "Heb. ix. 7." },
  { t = "p", text = "Of lawless life.[^1595] There, too, the Lord—Himself" },
  { t = "note", id = "1595", text = "i.e., of animals which, as irrational, were “without the Law.”" },
  { t = "p", text = "Made victim on behalf of all—denotes" },
  { t = "p", text = "180 The *whole earth*[^1596]—altar in specific sense." },
  { t = "note", id = "1596", text = "Terram." },
  { t = "p", text = "Hence likewise that new covenant author, whom" },
  { t = "p", text = "No language can describe, Disciple John," },
  { t = "p", text = "Testifies that beneath such altar he" },
  { t = "p", text = "Saw souls which had for Christ’s name suffered," },
  { t = "p", text = "185 Praying the vengeance of the mighty God" },
  { t = "p", text = "Upon their slaughter.[^1597] There,[^1598] meantime, is rest." },
  { t = "note", id = "1597", text = "Rev. vi. 9, 10." },
  { t = "note", id = "1598", text = "i.e., beneath the altar. See the 11th verse *ib*." },
  { t = "p", text = "In some unknown part there exists a spot" },
  { t = "p", text = "Open, enjoying its own light; ’tis called" },
  { t = "p", text = "“Abraham’s bosom;” high above the glooms,[^1599]" },
  { t = "note", id = "1599", text = "Or possibly, “deeper than the glooms:” “altior a tenebris.”" },
  { t = "p", text = "190 And far removed from fire, yet ’neath the earth.[^1600]" },
  { t = "note", id = "1600", text = "Terra." },
  { t = "p", text = "The *brazen altar* this is called, whereon" },
  { t = "p", text = "(We have recorded) was a dusky veil.[^1601]" },
  { t = "note", id = "1601", text = "See 141, 142, above." },
  { t = "p", text = "This veil divides both parts, and leaves the one" },
  { t = "p", text = "Open, from the eternal one distinct" },
  { t = "p", text = "195 In worship and time’s usage. To itself" },
  { t = "p", text = "Tis not unfriendly, though of fainter love," },
  { t = "p", text = "By time and space divided, and yet linked" },
  { t = "p", text = "By reason. ’Tis one house, though by a veil" },
  { t = "p", text = "Parted it seems: and thus (when the veil burst," },
  { t = "p", text = "200 On the Lord’s passion) heavenly regions oped" },
  { t = "p", text = "And holy vaults,[^1602] and what was double erst" },
  { t = "note", id = "1602", text = "C*æ*lataque sancta. We might conjecture “c*e*lataque sancta,” =\"and the sanctuaries formerly hidden.”" },
  { t = "p", text = "Became one house perennial." },
  { t = "p", text = "Order due" },
  { t = "p", text = "Traditionally has interpreted" },
  { t = "p", text = "The *inner temple* of the people called" },
  { t = "p", text = "205 After Christ’s Name, with worship heavenly," },
  { t = "p", text = "God’s actual mandates following; (no “shade”" },
  { t = "p", text = "Is *herein* bound, but persons real;[^1603]) complete" },
  { t = "note", id = "1603", text = "This sense appears intelligible, as the writer’s aim seems to be to distinguish between the “actual” commands of God, i.e., the spiritual, essential ones, which the spiritual people “follow,” and which “bind”—not the ceremonial observance of a “shadow of the future blessings” (see Heb. x. 1), but “real persons,” i.e., living souls. But, as Migne has said, the passage is probably faulty and mutilated." },
  { t = "p", text = "By the arrival of the “perfect things.”[^1604]" },
  { t = "note", id = "1604", text = "Comp. Heb. vii. 19; x. 1; xi. 11, 12." },
  { t = "p", text = "The *ark* beneath a type points out to us" },
  { t = "p", text = "210 Christ’s venerable body, joined, through “wood,”[^1605]" },
  { t = "note", id = "1605", text = "“Lignum:” here probably =\"the flesh,” which He took from Mary; the “rod” (according to our author) which Isaiah had foretold." },
  { t = "p", text = "With sacred Spirit: the *aërial*[^1606] *skins*" },
  { t = "note", id = "1606", text = "Aërial, i.e., as he said above, “dyed with *heaven’s hue*.”" },
  { t = "p", text = "Are flesh not born of seed, outstretcht on “wood;”[^1607]" },
  { t = "note", id = "1607", text = "“Ligno,” i.e., “the cross,” represented by the “wood” of which the tabernacle’s boards, on which the coverings were stretched (but comp. 147–8, above), were made." },
  { t = "p", text = "At the same time, with golden semblance fused,[^1608]" },
  { t = "note", id = "1608", text = "As the flame of the lamps appeared to grow out of and be fused with the “golden semblance” or “form” of the lampstand or candlestick." },
  { t = "p", text = "Within, the glowing Spirit joined is" },
  { t = "p", text = "215 Thereto; that, with peace[^1609] granted, flesh might bloom" },
  { t = "note", id = "1609", text = "Of which the olive—of which the pure oil for the lamps was to be made: Ex. xxvii. 20; Lev. xxiv. 2—is a type. “Peace” is granted to “the flesh” through Christ’s work and death in flesh." },
  { t = "p", text = "With Spirit mixt. Of the Lord’s flesh, again," },
  { t = "p", text = "The *urn*, golden and full, a type doth bear." },
  { t = "p", text = "Itself denotes that the new covenant’s Lord" },
  { t = "p", text = "Is *manna*; in that He, true heavenly Bread," },
  { t = "p", text = "220 Is, and hath by the Father been transfused[^1610]" },
  { t = "note", id = "1610", text = "Traditus." },
  { t = "p", text = "Into that bread which He hath to His saints" },
  { t = "p", text = "Assigned for a pledge: this Bread will He" },
  { t = "p", text = "Give perfectly to them who (of good works" },
  { t = "p", text = "The lovers ever) have the bonds of peace" },
  { t = "p", text = "225 Kept. And *the double tablets of the law*" },
  { t = "p", text = "*Written all over*, these, at the same time," },
  { t = "p", text = "Signify that that Law was ever hid" },
  { t = "p", text = "In Christ, who mandate old and new fulfilled," },
  { t = "p", text = "Ark of the Supreme Father as He is," },
  { t = "p", text = "230 Through whom He, being rich, hath all things given." },
  { t = "p", text = "The *storax-rod*, too, nut’s fruit bare itself;" },
  { t = "p", text = "(The virgin’s semblance this, who bare in blood" },
  { t = "p", text = "A body:) on the “wood”[^1611] conjoined ’twill lull" },
  { t = "note", id = "1611", text = "In ligno. The passage is again in an almost desperate state." },
  { t = "p", text = "Death’s bitter, which within sweet fruit doth lurk," },
  { t = "p", text = "235 By virtue of the Holy Spirit’s grace:" },
  { t = "p", text = "Just as Isaiah did predict “a rod”" },
  { t = "p", text = "From Jesse’s seed[^1612]—Mary—from which a flower" },
  { t = "note", id = "1612", text = "Isa. xi. 1, 2." },
  { t = "p", text = "Issues into the orb." },
  { t = "p", text = "The *altar bright with gold*" },
  { t = "p", text = "Denotes the heaven on high, whither ascend" },
  { t = "p", text = "240 Prayers holy, sent up without crime: the Lord" },
  { t = "p", text = "This “altar” spake of, where if one doth gifts" },
  { t = "p", text = "Offer, he must first reconciliate" },
  { t = "p", text = "Peace with his brother:[^1613] thus at length his prayers" },
  { t = "note", id = "1613", text = "Matt. v. 23, 24." },
  { t = "p", text = "Can flame unto the stars. Christ, Victor sole" },
  { t = "p", text = "245 And foremost.[^1614] Priest, thus offered *incense* born" },
  { t = "note", id = "1614", text = "Primus." },
  { t = "p", text = "Not of a *tree*, but prayers.[^1615]" },
  { t = "note", id = "1615", text = "See Rev. viii. 3, 4." },
  { t = "p", text = "The *cherubim*[^1616]" },
  { t = "note", id = "1616", text = "Here ensues a confused medley of all the cherubic figures of Moses, Ezekiel, and St. John." },
  { t = "p", text = "Being, with twice two countenances, one," },
  { t = "p", text = "And are the one word through fourfold order led;[^1617]" },
  { t = "note", id = "1617", text = "i.e., by the four evangelists." },
  { t = "p", text = "The hoped comforts of life’s mandate new," },
  { t = "p", text = "250 Which in their plenitude Christ bare Himself" },
  { t = "p", text = "Unto us from the Father. But the *wings*" },
  { t = "p", text = "In number *four times six*,[^1618] the heraldings" },
  { t = "note", id = "1618", text = "The cherubim, (or, “seraphim” rather,) of Isa. vi. have each *six* wings. Ezekiel mentions *four* cherubim, or “living creatures.” St. John likewise mentions *four* “living creatures.” Our author, combining the passages, and thrusting them into the subject of the Mosaic cherubim, multiplies the *six* (wings) by the *four* (cherubs), and so attains his end—the desired number “*twenty-four*”—to represent the books of the Old Testament, which (by combining certain books) may be reckoned to be *twenty-four* in number." },
  { t = "p", text = "Of the old world denote, witnessing things" },
  { t = "p", text = "Which, we are taught, were after done. On these[^1619]" },
  { t = "note", id = "1619", text = "These wings." },
  { t = "p", text = "255 The heavenly words fly through the orb: with these" },
  { t = "p", text = "Christ’s blood is likewise held context, so told" },
  { t = "p", text = "Obscurely by the seers’ presaging mouth." },
  { t = "p", text = "The *number* of the wings doth set a seal" },
  { t = "p", text = "Upon the ancient volumes; teaching us" },
  { t = "p", text = "260 Those *twenty-four* have certainly enough" },
  { t = "p", text = "Which sang the Lord’s ways and the times of peace:" },
  { t = "p", text = "These all, we see, with the new covenant" },
  { t = "p", text = "Cohere. Thus also John; the Spirit thus" },
  { t = "p", text = "To him reveals that in that number stand" },
  { t = "p", text = "265 The enthroned elders white[^1620] and crowned, who (as" },
  { t = "note", id = "1620", text = "There is again some great confusion in the text. The elders could not “*stand enthroned*:” nor do they stand “*over*,” but “*around*” God’s throne; so that the “insuper solio” could not apply to that." },
  { t = "p", text = "With girding-rope) all things surround, before" },
  { t = "p", text = "The Lord’s throne, and upon the glassy sea" },
  { t = "p", text = "Subigneous: and four living creatures, winged" },
  { t = "p", text = "And full of eyes within and outwardly," },
  { t = "p", text = "270 Do signify that hidden things are oped," },
  { t = "p", text = "And all things shut are at the same time seen," },
  { t = "p", text = "In the word’s eye. The glassy flame-mixt sea" },
  { t = "p", text = "Means that the laver’s gifts, with Spirit fused" },
  { t = "p", text = "Therein, upon believers are conferred." },
  { t = "p", text = "275 Who could e’en tell what the Lord’s parent-care" },
  { t = "p", text = "Before His judgment-seat, before His bar," },
  { t = "p", text = "Prepared hath? that such as willing be" },
  { t = "p", text = "His forum and His judgment for themselves" },
  { t = "p", text = "To antedate, should ’scape! that who thus hastes" },
  { t = "p", text = "280 Might find abundant opportunity!" },
  { t = "p", text = "Thus therefore Law and wondrous prophets sang;" },
  { t = "p", text = "Thus all parts of the covenant old and new," },
  { t = "p", text = "Those sacred rights and pregnant utterances" },
  { t = "p", text = "Of words, conjoined, do flourish. Thus withal," },
  { t = "p", text = "285 Apostles’ voices witness everywhere;" },
  { t = "p", text = "Nor aught of old, in fine, but to the new" },
  { t = "p", text = "Is joined." },
  { t = "p", text = "Thus err they, and thus facts retort" },
  { t = "p", text = "Their sayings, who to false ways have declined;" },
  { t = "p", text = "And from the Lord and God, eternal King," },
  { t = "p", text = "290 Who such an orb produced, detract, and seek" },
  { t = "p", text = "Some other deity ’neath feigned name," },
  { t = "p", text = "Bereft of minds, which (frenzied) they have lost;" },
  { t = "p", text = "Willing to affirm that Christ a stranger is" },
  { t = "p", text = "To the Law; nor is the world’s[^1621] Lord; nor doth will" },
  { t = "note", id = "1621", text = "Mundi." },
  { t = "p", text = "295 Salvation of the flesh; nor was Himself" },
  { t = "p", text = "The body’s Maker, by the Father’s power.[^1622]" },
  { t = "note", id = "1622", text = "Virtute." },
  { t = "p", text = "Them must we flee, stopping (unasked) our ears;" },
  { t = "p", text = "Lest with their speech they stain innoxious hearts." },
  { t = "p", text = "Let therefore us, whom so great grace[^1623] of God" },
  { t = "note", id = "1623", text = "Honestas." },
  { t = "p", text = "300 Hath penetrated, and the true celestial words" },
  { t = "p", text = "Of the great Master-Teacher in good ways" },
  { t = "p", text = "Have trained, and given us right monuments;[^1624]" },
  { t = "note", id = "1624", text = "Or, “records:” “monumenta,” i.e., the written word, according to the canon." },
  { t = "p", text = "Pay honour ever to the Lord, and sing" },
  { t = "p", text = "Endlessly, joying in pure faith, and sure" },
  { t = "p", text = "305 Salvation. Born of the true God, with bread" },
  { t = "p", text = "Perennial are we nourished, and hope" },
  { t = "p", text = "With our whole heart after eternal life." },
]

[[section]]
id = "book-5"
title = "Book V. General Reply to Sundry of Marcion's Heresies."
level = 1
blocks = [
  { t = "p", text = "Book V.—General Reply to Sundry of Marcion’s Heresies.[^1625]" },
  { t = "note", id = "1625", text = "I make no apology for the ruggedness of the versification and the obscurity of the sense in this book, further than to say that the state of the Latin text is such as to render it almost impossible to find any sense at all in many places, while the grammar and metre are not reducible to any known laws. It is about the hardest and most uninteresting book of the five." },
  { t = "p", text = "The *first* Book did the enemy’s words recall" },
  { t = "p", text = "In order, which the senseless renegade" },
  { t = "p", text = "Composed and put forth lawlessly; hence, too," },
  { t = "p", text = "Touched briefly flesh’s hope, Christ’s victory," },
  { t = "p", text = "5 And false ways’ speciousness. The *next* doth teach" },
  { t = "p", text = "The Law’s conjoined mysteries, and what" },
  { t = "p", text = "In the new covenant the one God hath" },
  { t = "p", text = "Delivered. The *third* shows the race, create" },
  { t = "p", text = "From freeborn mother, to be ministers" },
  { t = "p", text = "10 Sacred to seers and patriarchs;[^1626] whom Thou," },
  { t = "note", id = "1626", text = "Or, “consecrated by seers and patriarchs.”" },
  { t = "p", text = "O Christ, in number twice six out of all,[^1627]" },
  { t = "note", id = "1627", text = "i.e., all the number of Thy disciples." },
  { t = "p", text = "Chosest; and, with their names, the lustral[^1628] times" },
  { t = "note", id = "1628", text = "Tempora lustri, i.e., apparently the times during which these “elders” (i.e., the bishops, of whom a list is given at the end of book iii.) held office. “Lustrum” is used of other periods than it strictly implies, and this seems to give some sense to this difficult passage." },
  { t = "p", text = "Of our own elders noted, (times preserved" },
  { t = "p", text = "On record,) showing in whose days appeared" },
  { t = "p", text = "15 The author[^1629] of this wickedness, unknown," },
  { t = "note", id = "1629", text = "i.e., Marcion." },
  { t = "p", text = "Lawless, and roaming, cast forth[^1630] with his brood." },
  { t = "note", id = "1630", text = "i.e., excommunicated." },
  { t = "p", text = "The *fourth*, too, the piacular rites recalls" },
  { t = "p", text = "Of the old Law themselves, and shows them types" },
  { t = "p", text = "In which the Victim True appeared, by saints" },
  { t = "p", text = "20 Expected long since, with the holy Seed." },
  { t = "p", text = "This *fifth* doth many twists and knots untie," },
  { t = "p", text = "Rolls wholly into sight what ills soe’er" },
  { t = "p", text = "Were lurking; drawing arguments, but not" },
  { t = "p", text = "Without attesting prophet." },
  { t = "p", text = "And although" },
  { t = "p", text = "25 With strong arms fortified we vanquish foes," },
  { t = "p", text = "Yet hath the serpent mingled so at once" },
  { t = "p", text = "All things polluted, impious, unallowed," },
  { t = "p", text = "Commaculate,—the blind’s path without light!" },
  { t = "p", text = "A voice contaminant!—that, all the while" },
  { t = "p", text = "30 We are contending the world’s Maker is" },
  { t = "p", text = "Himself sole God, who also spake by voice" },
  { t = "p", text = "Of seers, and proving that there is none else" },
  { t = "p", text = "Unknown; and, while pursuing Him with praise," },
  { t = "p", text = "Who is by various endearment[^1631] known," },
  { t = "note", id = "1631", text = "Complexu vario." },
  { t = "p", text = "35 Are blaming—among other fallacies—" },
  { t = "p", text = "The Unknown’s tardy times: our subject’s fault" },
  { t = "p", text = "Will scarce keep pure our tongue. Yet, for all that," },
  { t = "p", text = "Guile’s many hidden venoms us enforce" },
  { t = "p", text = "(Although with double risk[^1632]) to ope our words." },
  { t = "note", id = "1632", text = "Ancipiti quamquam cum crimine. The last word seems almost =\"*dis*crimine;” just as our author uses “cerno” =\"*dis*cerno.”" },
  { t = "p", text = "40 Who, then, the God whom ye say is the true," },
  { t = "p", text = "Unknown to peoples, alien, in a word," },
  { t = "p", text = "To all the world?[^1633] Him whom none knew before?" },
  { t = "note", id = "1633", text = "Mundo." },
  { t = "p", text = "Came he from high? If ’tis his own[^1634] he seeks," },
  { t = "note", id = "1634", text = "Cf. John i. 11, and see the Greek." },
  { t = "p", text = "Why seek so late? If not his own, why rob" },
  { t = "p", text = "45 Bandit-like? and why ply with words unknown" },
  { t = "p", text = "So oft throughout Law’s rein a People still" },
  { t = "p", text = "Lingering ’neath the Law? If, too, he comes" },
  { t = "p", text = "To pity and to succour all combined," },
  { t = "p", text = "And to re-elevate men vanquisht quite" },
  { t = "p", text = "50 By death’s funereal weight, and to release" },
  { t = "p", text = "Spirit from flesh’s bond obscene, whereby" },
  { t = "p", text = "The inner man (iniquitously dwarfed)" },
  { t = "p", text = "Is held in check; why, then, so late appear" },
  { t = "p", text = "His ever-kindness, duteous vigilance?" },
  { t = "p", text = "55 How comes it that he ne’er at all before" },
  { t = "p", text = "Offered himself to any, but let slip" },
  { t = "p", text = "Poor souls in numbers?[^1635] and then with his mouth" },
  { t = "note", id = "1635", text = "Whether this be the sense I know not. The passage is a mass of confusion." },
  { t = "p", text = "Seeks to regain another’s subjects: ne’er" },
  { t = "p", text = "Expected; not known; sent into the orb." },
  { t = "p", text = "60 Seeking the “ewe” he had not lost before," },
  { t = "p", text = "The Shepherd ought[^1636] to have disrobed himself" },
  { t = "note", id = "1636", text = "i.e., according to Marcion’s view." },
  { t = "p", text = "Of flesh, as if his victor-self withal" },
  { t = "p", text = "Had ever been a spirit, and as such[^1637]" },
  { t = "note", id = "1637", text = "i.e., as spirits, like himself." },
  { t = "p", text = "Willed to rescue all expelled souls," },
  { t = "p", text = "65 Without a body, everywhere, and leave" },
  { t = "p", text = "The spoiled flesh to earth; wholly to fill" },
  { t = "p", text = "The world[^1638] on one day equally with corpses" },
  { t = "note", id = "1638", text = "Mundum." },
  { t = "p", text = "To leave the orb void; and to raise the souls" },
  { t = "p", text = "To heaven. Then would human progeny" },
  { t = "p", text = "70 At once have ceased to be born; nor had" },
  { t = "p", text = "Thereafter any scion of *your*[^1639] kith" },
  { t = "note", id = "1639", text = "i.e., Marcionite." },
  { t = "p", text = "Been born, or spread a new pest[^1640] o’er the orb." },
  { t = "note", id = "1640", text = "See book ii. 3." },
  { t = "p", text = "Or (since at that time[^1641] none of all these things" },
  { t = "note", id = "1641", text = "i.e., apparently on the day of Christ’s resurrection." },
  { t = "p", text = "Is shown to have been done) he should have set" },
  { t = "p", text = "75 A bound to future race; with solid heart" },
  { t = "p", text = "Nuptial embraces would he, in that case" },
  { t = "p", text = "Have sated quite;[^1642] made men grow torpid, reft" },
  { t = "note", id = "1642", text = "Rep*l*esset, i.e., replevisset. If this be the right reading, the meaning would seem to be, “would have taken away all further desire for” them, as satiety or *repletion* takes away all appetite for food. One is almost inclined to hazard the suggestion “rep*r*esset,” i.e., repressisset, “he would have *repressed*,” but that such a contraction would be irregular. Yet, with an author who takes such liberties as the present one, perhaps that might not be a decisive objection." },
  { t = "p", text = "Of fruitful seed; made irksome intercourse" },
  { t = "p", text = "With female sex; and closed up inwardly" },
  { t = "p", text = "80 The flesh’s organs genital: our mind" },
  { t = "p", text = "Had had no will, no potent faculty" },
  { t = "p", text = "Our body: after this the “inner man”" },
  { t = "p", text = "Could withal, joined with blood,[^1643] have been infused" },
  { t = "note", id = "1643", text = "“Junct*u*s,” for the edd.’s “junct*is*,” which, if retained, will mean “in the case of beings still joined with (or to) blood.”" },
  { t = "p", text = "And cleaved to flesh, and would have ever been" },
  { t = "p", text = "85 Perishing. Ever perishes the “ewe:”" },
  { t = "p", text = "And is there then no power of saving her?" },
  { t = "p", text = "Since man is ever being born beneath" },
  { t = "p", text = "Death’s doom, what is the Shepherd’s work, if thus" },
  { t = "p", text = "The “ewe” is stated[^1644] to be found? *Unsought*" },
  { t = "note", id = "1644", text = "“Doc*e*tur,” for the edd.’s “doc*en*tur.” The sense seems to be, if there be any, exceedingly obscure; but for the idea of a half-salvation—the salvation of the “inner man” without the outer—being no salvation at all, and unworthy of “the Good Shepherd” and His work, we may compare the very difficult passage in the *de Pudic.*, c. xiii. *ad fin*." },
  { t = "p", text = "90 In that case, but not *rescued*, she is proved." },
  { t = "p", text = "But now choice is allowed of entering" },
  { t = "p", text = "Wedlock, as hath been ever; and that choice" },
  { t = "p", text = "Sure progeny hath yoked: nations are born" },
  { t = "p", text = "And folk scarce numerable, at whose birth" },
  { t = "p", text = "95 Their souls by living bodies are received;" },
  { t = "p", text = "Nor was it meet that Paul (though, for the time," },
  { t = "p", text = "He did exhort some few, discerning well" },
  { t = "p", text = "The many pressures of a straitened time)" },
  { t = "p", text = "To counsel men in like case to abide" },
  { t = "p", text = "100 As he himself:[^1645] for elsewhere he has bidden" },
  { t = "note", id = "1645", text = "This sense, which I deduce from a transposition of one line and the supplying of the words “*he did exhort*,” which are not expressed, but seem necessary, in the original, agrees well with 1 Cor. vii., which is plainly the passage referred to." },
  { t = "p", text = "The tender ages marry, nor defraud" },
  { t = "p", text = "Each other, but their compact’s dues discharge." },
  { t = "p", text = "But say, whose suasion hath, with fraud astute," },
  { t = "p", text = "Made you “abide,” and in divided love" },
  { t = "p", text = "105 Of offspring live secure, and commit crime" },
  { t = "p", text = "Adulterous, and lose your life? and, though" },
  { t = "p", text = "’Tis perishing, belie (by verbal name)" },
  { t = "p", text = "That fact. For which cause all the so sweet sounds" },
  { t = "p", text = "Of his voice pours he forth, that “you must do," },
  { t = "p", text = "110 Undaunted, whatsoever pleases you;”" },
  { t = "p", text = "Outwardly chaste, stealthily stained with crime!" },
  { t = "p", text = "Of honourable wedlock, by this plea,[^1646]" },
  { t = "note", id = "1646", text = "“Causa;” or perhaps “*means*.” It is, of course, the French “chose.”" },
  { t = "p", text = "He hath deprived you. But why more? ’Tis well" },
  { t = "p", text = "(Forsooth) to be disjoined! for the world, too," },
  { t = "p", text = "115 Expedient ’tis! lest any of *your* seed" },
  { t = "p", text = "Be born! Then will death’s organs[^1647] cease at length!" },
  { t = "note", id = "1647", text = "i.e., you and your like, through whom sin, and in consequence death, is disseminated." },
  { t = "p", text = "The while you hope salvation to retain," },
  { t = "p", text = "Your “total man” quite loses part of man," },
  { t = "p", text = "With mind profane: but neither is man said" },
  { t = "p", text = "120 To be *sole spirit*, nor the *flesh* is called" },
  { t = "p", text = "“The old man;” nor unfriendly are the flesh" },
  { t = "p", text = "And spirit, the *true man* combined in one," },
  { t = "p", text = "The *inner*, and he whom you call “*old foe*;”[^1648]" },
  { t = "note", id = "1648", text = "Here, again, for the sake of the sense, I have transposed a line." },
  { t = "p", text = "Nor are they seen to have each his own set" },
  { t = "p", text = "125 Of senses. One is ruled; the other rules," },
  { t = "p", text = "Groans, joys, grieves, loves; himself[^1649] to his own flesh" },
  { t = "note", id = "1649", text = "i.e., “the other,” the “inner man,” or spirit." },
  { t = "p", text = "Most dear, too; *through* which[^1650] his humanity" },
  { t = "note", id = "1650", text = "i.e., through flesh." },
  { t = "p", text = "Is visible, *with* which commixt he is" },
  { t = "p", text = "Held ever: to its wounds he care applies;" },
  { t = "p", text = "130 And pours forth tears; and nutriments of food" },
  { t = "p", text = "Takes, through its limbs, often and eagerly:" },
  { t = "p", text = "This hopes he to have ever with himself" },
  { t = "p", text = "Immortal; o’er its fracture doth he groan;" },
  { t = "p", text = "And grieves to quit it limb by limb: fixt time" },
  { t = "p", text = "135 Death lords it o’er the unhappy flesh; that so" },
  { t = "p", text = "From light dust it may be renewed, and death" },
  { t = "p", text = "Unfriendly fail at length, when flesh, released," },
  { t = "p", text = "Rises again. This will that victory be" },
  { t = "p", text = "Supreme and long expected, wrought by Him," },
  { t = "p", text = "140 The aye-to-be-revered, who did become" },
  { t = "p", text = "True man; and by His Father’s virtue won:" },
  { t = "p", text = "Who man’s redeemed limbs unto the heavens" },
  { t = "p", text = "Hath raised,[^1651] and richly opened access up" },
  { t = "note", id = "1651", text = "i.e., in His own person." },
  { t = "p", text = "Thither in hope, first to His nation; then" },
  { t = "p", text = "145 To those among all tongues in whom His work" },
  { t = "p", text = "Is ever doing: Minister imbued" },
  { t = "p", text = "With His Sire’s parent-care, seen by the eye" },
  { t = "p", text = "Of the Illimitable, He performed," },
  { t = "p", text = "By suffering, His missions.[^1652]" },
  { t = "note", id = "1652", text = "I hope I have succeeded in giving some intelligible sense; but the passage as it stands in the Latin is nearly hopeless." },
  { t = "p", text = "What say now" },
  { t = "p", text = "150 The impious voices? what th’ abandoned crew?" },
  { t = "p", text = "If He Himself, God the Creator’s self," },
  { t = "p", text = "Gave not the Law,[^1653] He who from Egypt’s vale[^1654]" },
  { t = "note", id = "1653", text = "I read “lege*m*” for “lege*s*.”" },
  { t = "note", id = "1654", text = "I read “*v*alle” for “*c*alle.”" },
  { t = "p", text = "Paved in the waves a path, and freely gave" },
  { t = "p", text = "The seats which He had said of old, why comes" },
  { t = "p", text = "155 He in that very People and that land" },
  { t = "p", text = "Aforesaid? and why rather sought He not" },
  { t = "p", text = "Some other[^1655] peoples or some rival[^1656] realms?" },
  { t = "note", id = "1655", text = "Alios." },
  { t = "note", id = "1656", text = "Altera." },
  { t = "p", text = "Why, further, did He teach that, through the seers," },
  { t = "p", text = "(With Name foretold in full, yet not His own,)" },
  { t = "p", text = "160 He had been often sung of? Whence, again," },
  { t = "p", text = "Could He have issued baptism’s kindly gifts," },
  { t = "p", text = "Promised by some one else, as His own works?" },
  { t = "p", text = "These gifts men who God’s mandates had transgressed," },
  { t = "p", text = "And hence were found polluted, longed for," },
  { t = "p", text = "165 And begged a pardoning rescue from fierce death." },
  { t = "p", text = "Expected long, they[^1657] came: but that to those" },
  { t = "note", id = "1657", text = "i.e., “the gifts of baptism.”" },
  { t = "p", text = "Who recognised them when erst heard, and now" },
  { t = "p", text = "Have recognised them, when in due time found," },
  { t = "p", text = "Christ’s true hand is to give them, this, with voice" },
  { t = "p", text = "170 Paternal, the Creator-Sire Himself" },
  { t = "p", text = "Warns ever from eternity, and claims;" },
  { t = "p", text = "And thus the work of virtue which He framed," },
  { t = "p", text = "And still frames, arms, and fosters, and doth now" },
  { t = "p", text = "Victorious look down on and reclothe" },
  { t = "p", text = "175 With His own light, should with perennial praise" },
  { t = "p", text = "Abide.[^1658]" },
  { t = "note", id = "1658", text = "This seems to give sense to a very obscure passage, in which I have been guided more by Migne’s pointing than by Oehler’s." },
  { t = "p", text = "What[^1659] hath the Living Power done" },
  { t = "note", id = "1659", text = "I read here “qu*i*d” for “qu*o*d.”" },
  { t = "p", text = "To make men recognise what God can give" },
  { t = "p", text = "And man can suffer, and thus live?[^1660] But since" },
  { t = "note", id = "1660", text = "i.e., to make men live by recognising that. Comp. the Psalmist’s prayer: “Give me *understanding* and I shall *live*” (Ps. cxix. 144; in LXX., Ps. cxviii. 144)." },
  { t = "p", text = "Neither predictions earlier nor facts" },
  { t = "p", text = "180 The latest can suede senseless frantic[^1661] men" },
  { t = "note", id = "1661", text = "The “f*u*rentes” of Pam. and Rig. is preferred to Oehler’s “f*e*rentes.”" },
  { t = "p", text = "That God became a man, and (after He" },
  { t = "p", text = "Had suffered and been buried) rose; that they" },
  { t = "p", text = "May credit those so many witnesses" },
  { t = "p", text = "Harmonious,[^1662] who of old did cry aloud" },
  { t = "note", id = "1662", text = "“Complexis,” lit. “embracing.”" },
  { t = "p", text = "185 With heavenly word, let them both[^1663] learn to trust" },
  { t = "note", id = "1663", text = "i.e., both Jews and Gentile heretics, the “senseless frantic men” just referred to probably: or possibly the “ambo” may mean “*both sects*,” viz., the Marcionites and Manichees, against whom the writer whom Oehler supposes to be the probable author of these “Five Books,” Victorinus, a rhetorician of Marseilles, directed his efforts. But it may again be the acc. neut. pl., and mean “let them”—i.e., the “senseless frantic men”—“learn to believe *as to both facts*,” i.e., the incarnation and the resurrection; (see vers. 179, 180;) “the testimony at least of human reason.”" },
  { t = "p", text = "At least terrestrial reason." },
  { t = "p", text = "When the Lord" },
  { t = "p", text = "Christ came to be, as flesh, born into the orb" },
  { t = "p", text = "In time of king Augustus’ reign at Rome," },
  { t = "p", text = "First, by decree, the nations numbered are" },
  { t = "p", text = "190 By census everywhere: this measure, then," },
  { t = "p", text = "This same king chanced to pass, because the" },
  { t = "p", text = "Will" },
  { t = "p", text = "Supreme, in whose high reigning hand doth lie" },
  { t = "p", text = "The king’s heart, had impelled him:[^1664] he was first" },
  { t = "note", id = "1664", text = "I would suggest here, for “…quia summa voluntas In cujus manu regnantis cor *legibus esset*,” something like this, “…quia summa voluntas, In cujus manu regnantis cor *regis, egisset*,” which would only add one more to our author’s false quantities. “Regum egisset” would avoid even that, while it would give some sense. Comp. Prov. xxi. 1." },
  { t = "p", text = "To do it, and the enrolment was reduced" },
  { t = "p", text = "195 To orderly arrangement. Joseph then" },
  { t = "p", text = "Likewise, with his but just delivered wife" },
  { t = "p", text = "Mary,[^1665] with her celestial Son alike," },
  { t = "note", id = "1665", text = "Maria cum conjuge feta. What follows seems to decide the meaning of “feta,” as a child could hardly be included in a census before birth." },
  { t = "p", text = "Themselves withal are numbered. Let, then, such" },
  { t = "p", text = "As trust to instruments of human skill," },
  { t = "p", text = "200 Who may (approving of applying them" },
  { t = "p", text = "As attestators of the holy word)" },
  { t = "p", text = "Inquire into this census, if it be" },
  { t = "p", text = "But found so as we say, then afterwards" },
  { t = "p", text = "Repent they and seek pardon while time still" },
  { t = "p", text = "205 Is had[^1666]" },
  { t = "note", id = "1666", text = "Again I have had to attempt to amend the text of the Latin in order to extract any sense, and am far from sure that I have extracted the right one." },
  { t = "p", text = "The Jews, who own[^1667] to having wrought" },
  { t = "note", id = "1667", text = "“Fatentur,” unless our author use it passively =\"are confessed.”" },
  { t = "p", text = "A grave crime, while in our disparagement" },
  { t = "p", text = "They glow, and do resist us, neither call" },
  { t = "p", text = "Christ’s family unknown, nor can[^1668] affirm" },
  { t = "note", id = "1668", text = "“Possunt,” i.e., probably “have the hardihood.”" },
  { t = "p", text = "They hanged a man, who spake truth, on a tree:[^1669]" },
  { t = "note", id = "1669", text = "Because Christ plainly, as they understood Him, “made Himself the Son of God;” and hence, if they confessed that He had said the truth, and yet that they hanged Him on a tree, they would be pronouncing their own condemnation." },
  { t = "p", text = "210 Ignorant that the Lord’s flesh which they bound[^1670]" },
  { t = "note", id = "1670", text = "“Vi*n*ctam” for “victam” I read here." },
  { t = "p", text = "Was not seed-gendered. But, while partially" },
  { t = "p", text = "They keep a reticence, so partially" },
  { t = "p", text = "They triumph; for they strive to represent" },
  { t = "p", text = "God to the peoples commonly as man." },
  { t = "p", text = "215 Behold the error which o’ercomes you both![^1671]" },
  { t = "note", id = "1671", text = "i.e., you and the Jews. See above on 185." },
  { t = "p", text = "This error will our cause assist, the while," },
  { t = "p", text = "We prove to you those things which certain are." },
  { t = "p", text = "They do deny Him God; you falsely call" },
  { t = "p", text = "Him man, a body bodiless! and ah!" },
  { t = "p", text = "220 A various insanity of mind" },
  { t = "p", text = "Sinks you; which him who hath presumed to hint" },
  { t = "p", text = "You both do, sinking, sprinkle:[^1672] for His deeds" },
  { t = "note", id = "1672", text = "Quod qui præsumpsit mergentes spargitis ambo. What the meaning is I know not, unless it be this: if any one hints to you that you are in an error which is sinking you into perdition, you both join in trying to sink *him* (if “mergentes” be active; or “while you are sinking,” if neuter), and in sprinkling him with your doctrine (or besprinkling him with abuse)." },
  { t = "p", text = "Will then approve Him man alike and God" },
  { t = "p", text = "Commingled, and the world[^1673] will furnish signs" },
  { t = "note", id = "1673", text = "Mundus." },
  { t = "p", text = "225 No few." },
  { t = "p", text = "While then the Son Himself of God" },
  { t = "p", text = "Is seeking to regain the flesh’s limbs,[^1674]" },
  { t = "note", id = "1674", text = "“Dum carnis membra requirit,” i.e., seeking to regain *for God* all the limbs of the flesh as His instruments. Comp. Rom. vi. 13, 19." },
  { t = "p", text = "Already robed as King, He doth sustain" },
  { t = "p", text = "Blows from rude palms; with spitting covered is" },
  { t = "p", text = "His face; a thorn-inwoven crown His head" },
  { t = "p", text = "230 Pierces all round; and to the tree[^1675] Himself" },
  { t = "note", id = "1675", text = "Ligno." },
  { t = "p", text = "Is fixed; wine drugged with myrrh,[^1676] is drunk, and gall[^1677]" },
  { t = "note", id = "1676", text = "“Scriblita,” a curious word." },
  { t = "note", id = "1677", text = "Fel miscetur *aceto*. The reading may have arisen—and it is not confined to our author—from confounding ὄξος with οἶνος. Comp. Matt. xxvii. 33 with Mark xv. 23." },
  { t = "p", text = "Is mixt with vinegar; parted His robe,[^1678]" },
  { t = "note", id = "1678", text = "This is an error, if the “coat” be meant." },
  { t = "p", text = "And in it[^1679] lots are cast; what for himself" },
  { t = "note", id = "1679", text = "Perhaps for “in ill*a*” we should read “in ill*am*”—“on it,” for “in it.”" },
  { t = "p", text = "Each one hath seized he keeps; in murky gloom," },
  { t = "p", text = "235 As God from fleshly body silently" },
  { t = "p", text = "Outbreathes His soul, in darkness trembling day" },
  { t = "p", text = "Took refuge with the sun; twice dawned one day;" },
  { t = "p", text = "Its centre black night covered: from their base" },
  { t = "p", text = "Mounts move in circle, wholly moved was earth," },
  { t = "p", text = "240 Saints’ sepulchres stood ope, and all things joined" },
  { t = "p", text = "In fear to see His passion whom they knew!" },
  { t = "p", text = "His lifeless side a soldier with bare spear" },
  { t = "p", text = "Pierces, and forth flows blood, nor water less" },
  { t = "p", text = "Thence followed. These facts they[^1680] agree to hide," },
  { t = "note", id = "1680", text = "The Jews." },
  { t = "p", text = "245 And are unwilling the misdeed to own," },
  { t = "p", text = "Willing to blink the crime." },
  { t = "p", text = "Can spirit, then," },
  { t = "p", text = "Without a body wear a robe? or is’t" },
  { t = "p", text = "Susceptible of penalty? the wound" },
  { t = "p", text = "Of violence does it bear? or die? or rise?" },
  { t = "p", text = "250 Is blood thence poured? from what flesh. since ye say" },
  { t = "p", text = "He had none? or else, rather, feigned He? if" },
  { t = "p", text = "’Tis safe for you to say so; though you do" },
  { t = "p", text = "(Headlong) so say, by passing over more" },
  { t = "p", text = "In silence. Is not, then, faith manifest?" },
  { t = "p", text = "255 And are not all things fixed? The day before" },
  { t = "p", text = "He then[^1681] should suffer, keeping Passover," },
  { t = "note", id = "1681", text = "For “ante diem qu*am cum* pateretur” I have read “qu*a tum*.”" },
  { t = "p", text = "And handing down a memorable rite[^1682]" },
  { t = "note", id = "1682", text = "Or, “deed”—“factum.”" },
  { t = "p", text = "To His disciples, taking bread alike" },
  { t = "p", text = "And the vine’s juice, “My body, and My blood" },
  { t = "p", text = "260 Which is poured[^1683] for you, this is,” did He say;" },
  { t = "note", id = "1683", text = "Or, “*is being* poured”—“funditur.”" },
  { t = "p", text = "And bade it ever afterward be done." },
  { t = "p", text = "Of what created elements were made," },
  { t = "p", text = "Think ye, the bread and wine which were (He said)" },
  { t = "p", text = "His body with its blood? and what must be" },
  { t = "p", text = "265 Confessed? Proved He not Himself the world’s[^1684]" },
  { t = "note", id = "1684", text = "Mundi." },
  { t = "p", text = "Maker, through deeds? and that He bore at once" },
  { t = "p", text = "A body formed from flesh and blood?" },
  { t = "p", text = "This God" },
  { t = "p", text = "This true Man, too, the Father’s Virtue ’neath" },
  { t = "p", text = "An Image,[^1685] with the Father ever was," },
  { t = "note", id = "1685", text = "I read with Migne, “*Patris* sub imagine virtus,” in preference to the conjecture which Oehler follows, “*Christi* sub imagine virtus.” The reference seems clearly to be to Heb. i. 3." },
  { t = "p", text = "270 United both in glory and in age;[^1686]" },
  { t = "note", id = "1686", text = "Ævo. Perhaps here =\"eternity.”" },
  { t = "p", text = "Because alone He ministers the words" },
  { t = "p", text = "Of the All-Holder; whom He[^1687] upon earth" },
  { t = "note", id = "1687", text = "i.e., “The All-Holder.”" },
  { t = "p", text = "Accepts;[^1688] through whom He all things did create:" },
  { t = "note", id = "1688", text = "Capit." },
  { t = "p", text = "God’s Son, God’s dearest Minister, is He!" },
  { t = "p", text = "275 Hence hath He generation, hence Name too," },
  { t = "p", text = "Hence, finally, a kingdom; Lord from Lord;" },
  { t = "p", text = "Stream from perennial Fount! He, He it was" },
  { t = "p", text = "Who to the holy fathers (whosoe’er" },
  { t = "p", text = "Among them doth profess to have “seen God”[^1689])—" },
  { t = "note", id = "1689", text = "Cf. Jacob’s words in Gen. xxxii. 30; Manoah’s in Judg. xiii. 22; etc." },
  { t = "p", text = "280 God is our witness—since the origin" },
  { t = "p", text = "Of this our world,[^1690] appearing, opened up" },
  { t = "note", id = "1690", text = "Mundi." },
  { t = "p", text = "The Father’s words of promise and of charge" },
  { t = "p", text = "From heaven high: He led the People out;" },
  { t = "p", text = "Smote through th’iniquitous nation; was Himself" },
  { t = "p", text = "285 The column both of light and of cloud’s shade;" },
  { t = "p", text = "And dried the sea; and bids the People go" },
  { t = "p", text = "Right through the waves, the foe therein involved" },
  { t = "p", text = "And covered with the flood and surge: a way" },
  { t = "p", text = "Through deserts made He for the followers" },
  { t = "p", text = "290 Of His high biddings; sent down bread in showers[^1691]" },
  { t = "note", id = "1691", text = "For “*di*misit in *um*bris” I read here “*de*misit in *im*bris.” If we retain the former reading, it will then mean, “dispersed during the shades of night,” during which it was that the manna seems always to have fallen." },
  { t = "p", text = "From heaven for the People; brake the rock;" },
  { t = "p", text = "Bedewed with wave the thirsty;[^1692] and from God" },
  { t = "note", id = "1692", text = "“Sitient*is*” in Oehler must be a misprint for “sitient*es*.”" },
  { t = "p", text = "The mandate of the Law to Moses spake" },
  { t = "p", text = "With thunder, trumpet-sound, and flamey column" },
  { t = "p", text = "295 Terrible to the sight, while men’s hearts shook." },
  { t = "p", text = "After twice twenty years, with months complete," },
  { t = "p", text = "Jordan was parted; a way oped; the wave" },
  { t = "p", text = "Stood in a mass; and the tribes shared the land," },
  { t = "p", text = "Their fathers’ promised boons! The Father’s word," },
  { t = "p", text = "300 Speaking Himself by prophets’ mouth, that He[^1693]" },
  { t = "note", id = "1693", text = "There ought to be a “se” in the Latin if this be the meaning." },
  { t = "p", text = "Would come to earth and be a man, He did" },
  { t = "p", text = "Predict; Christ manifestly to the earth" },
  { t = "p", text = "Foretelling." },
  { t = "p", text = "Then, expected for our aid," },
  { t = "p", text = "Life’s only Hope, the Cleanser of our flesh,[^1694]" },
  { t = "note", id = "1694", text = "For “Mundator carnis *seræ*” =\"the Cleanser of *late* flesh” (which would seem, if it mean anything, to mean that the flesh had to wait long for its cleansing), I have read “carnis *nostræ*.”" },
  { t = "p", text = "305 Death’s Router, from th’ Almighty Sire’s empire" },
  { t = "p", text = "At length He came, and with our human limbs" },
  { t = "p", text = "He clothed Him. Adam—virgin—dragon—tree,[^1695]" },
  { t = "note", id = "1695", text = "Lignum." },
  { t = "p", text = "The cause of ruin, and the way whereby" },
  { t = "p", text = "Rash death us all had vanquisht! by the same" },
  { t = "p", text = "310 Our Shepherd treading, seeking to regain" },
  { t = "p", text = "His sheep—with angel—virgin—His own flesh—" },
  { t = "p", text = "And the “tree’s” remedy;[^1696] whence vanquisht man" },
  { t = "note", id = "1696", text = "I have followed the disjointed style of the Latin as closely as I could here." },
  { t = "p", text = "And doomed to perish was aye wont to go" },
  { t = "p", text = "To meet his vanquisht peers; hence, interposed," },
  { t = "p", text = "315 One in all captives’ room, He did sustain" },
  { t = "p", text = "In body the unfriendly penalty" },
  { t = "p", text = "With patience; by His own death spoiling death;" },
  { t = "p", text = "Becomes salvation’s cause; and, having paid" },
  { t = "p", text = "Throughly our debts by throughly suffering" },
  { t = "p", text = "320 On earth, in holy body, everything," },
  { t = "p", text = "Seeks the infern! here souls, bound for their crime," },
  { t = "p", text = "Which shut up all together by Law’s weight," },
  { t = "p", text = "Without a guard,[^1697] were asking for the boons" },
  { t = "note", id = "1697", text = "Here we seem to see the idea of the “limbus patrum.”" },
  { t = "p", text = "Promised of old, hoped for, and tardy, He" },
  { t = "p", text = "325 To the saints’rest admitted, and, with light," },
  { t = "p", text = "Brought back. For on the third day mounting up,[^1698]" },
  { t = "note", id = "1698", text = "“Subiens” =\"going beneath,” i.e., apparently coming beneath *the walls of heaven.*" },
  { t = "p", text = "A victor, with His body by His Sire’s" },
  { t = "p", text = "Virtue immense, (salvation’s pathway made,)" },
  { t = "p", text = "And bearing God and man is form create," },
  { t = "p", text = "330 He clomb the heavens, leading back with Him" },
  { t = "p", text = "Captivity’s first-fruits (a welcome gift" },
  { t = "p", text = "And a dear figure[^1699] to the Lord), and took" },
  { t = "note", id = "1699", text = "i.e., a figure of the future harvest." },
  { t = "p", text = "His seat beside light’s Father, and resumed" },
  { t = "p", text = "The virtue and the glory of which, while" },
  { t = "p", text = "335 He was engaged in vanquishing the foe" },
  { t = "p", text = "He had been stripped;[^1700] conjoined with Spirit; bound" },
  { t = "note", id = "1700", text = "I have hazarded the conjecture “m*inu*tus” here for the edd.’s “m*uni*tus.” It adds one more, it is true, to our author’s false quantities, but that is a minor difficulty, while it improves (to my mind) the sense vastly." },
  { t = "p", text = "With flesh, on our part. Him, Lord, Christ, King, God," },
  { t = "p", text = "Judgment and kingdom given to His hand," },
  { t = "p", text = "The father is to send unto the orb." },
]

[[section]]
id = "note"
title = "Note."
level = 1
blocks = [
  { t = "p", text = "(N.B.—It has been impossible to note the changes which I have had to make in the text of the Latin. In some cases they will suggest themselves to any scholar who may compare the translation with the original; and in others I must be content to await a more fitting opportunity, if such ever arise, for discussing them.)" },
]

[[section]]
id = "elucidations"
title = "Elucidations."
level = 1
blocks = [
  { t = "h", text = "I." },
  { t = "h", text = "(Appendix, p. 127.)" },
  { t = "p", text = "About these versifications, which are “poems” only as mules are horses, it is enough to say of them, with Dupin, “They are no more Tertullian’s than they are Virgil’s or Homer’s. The poem called *Genesis* seems to be that which Gennadius attributes to Salvian, Bishop of Marseilles. That concerning the *Judgment of God* was, perhaps, composed by Verecundus, an African bishop. In the books *Against Marcion* there are some opinions different from those of Tertullian. There is likewise a poem *To a Senator* in Pamelius’ edition, one of *Sodom*, and in the *Bibliotheca Patrum* one of *Jonas and Nineve*; the first of which is ancient, and the other two seem to be by the same author.”" },
  { t = "p", text = "It is worth while to observe that this rhymester makes two bishops out of one.[^1701] Cletus and Anacletus he supposes different persons, which brings Clement into the fourth place in the see of Rome. Our author elsewhere makes St. Clement the immediate successor of the apostles.[^1702]" },
  { t = "note", id = "1701", text = "See p. 156, *supra*." },
  { t = "note", id = "1702", text = "See *De Præscrip*., cap. xxxii. vol. iii. p. 258." },
  { t = "h", text = "II." },
  { t = "h", text = "(Or is there ought, etc., l. 136, p. 137.)" },
  { t = "p", text = "In taking leave of Tertullian, it may be well to say a word of his famous saying, *Certum est quia impossibile est*. It occurs in the tract *De Carne Christi*,[^1703] and is one of those startling epigrammatic dicta of our author which is no more to be pressed in argument than any other *bon-mot* of a wit or a poet. It is evidently designed as a rhetorical climax, to enforce the same idea which we find in the hymn of Aquinas:—" },
  { t = "note", id = "1703", text = "Cap. v. vol. iii. p. 525." },
  { t = "h", text = "“Et si sensus deficit," },
  { t = "p", text = "Adfirmandum cor sincerum" },
  { t = "h", text = "Sola fides sufficit.”" },
  { t = "p", text = "As Jeremy Taylor[^1704] argues, the condition is, that holy Scripture affirms it. If that be the case, then “all things are possible with God:” I believe; but I do not argue, for it is impossible with men. This is the plain sense of the great Carthaginian doctor’s pithy rhetoric. But Dr. Bunsen sets it on all-fours, and treats it as if it were soberly designed to defy reason,—that reason to which Tertullian constantly makes his appeal against Marcion, and in many of his sayings[^1705] hardly less witty. Speaking of Hippolytus, that writer remarks,[^1706] “He might have said on some points, *Credibile licet ineptum*: he would never have exclaimed with Tertullian, ‘Credibile *quia* ineptum.’” Why attempt to prove the absurdity of such a reflection? As well attempt to defend St. John’s hyperbole[^1707] against a mind incapable of comprehending a figure of speech." },
  { t = "note", id = "1704", text = "*Christ in the Holy Sacrament*, § xi. 6." },
  { t = "note", id = "1705", text = "*De Anima*, cap. xvii." },
  { t = "note", id = "1706", text = "Vol. i. p. 304." },
  { t = "note", id = "1707", text = "Chap. xxi. verse 25." },
]

[[section]]
id = "part-1"
title = "Part I. A Strain of Jonah the Prophet."
level = 1
blocks = [
  { t = "h", text = "X." },
  { t = "h", text = "Appendix.[^1198]" },
  { t = "note", id = "1198", text = "[Elucidation.]" },
  { t = "h", text = "[Translated by the Rev. S. Thelwall.]" },
  { t = "h", text = "1. A Strain of Jonah the Prophet." },
  { t = "p", text = "After the living, aye—enduring death" },
  { t = "p", text = "Of Sodom and Gomorrah; after fires" },
  { t = "p", text = "Penal, attested by time-frosted plains" },
  { t = "p", text = "Of ashes; after fruitless apple-growths," },
  { t = "p", text = "5 Born but to feed the eye; after the death" },
  { t = "p", text = "Of sea and brine, both in like fate involved;" },
  { t = "p", text = "While whatsoe’er is human still retains" },
  { t = "p", text = "In change corporeal its penal badge:[^1199]" },
  { t = "note", id = "1199", text = "These two lines, if this be their true sense, seem to refer to Lot’s wife. But the grammar and meaning of this introduction are alike obscure." },
  { t = "p", text = "A city—Nineveh—by stepping o’er" },
  { t = "p", text = "10 The path of justice and of equity," },
  { t = "p", text = "On her own head had well-nigh shaken down" },
  { t = "p", text = "More fires of rain supernal. For what dread[^1200]" },
  { t = "note", id = "1200", text = "“Metus;” used, as in other places, of *godly* fear." },
  { t = "p", text = "Dwells in a mind subverted? Commonly" },
  { t = "p", text = "Tokens of penal visitations prove" },
  { t = "p", text = "15 All vain where error holds possession. Still," },
  { t = "p", text = "Kindly and patient of our waywardness," },
  { t = "p", text = "And slow to punish, the Almighty Lord" },
  { t = "p", text = "Will launch no shaft of wrath, unless He first" },
  { t = "p", text = "Admonish and knock oft at hardened hearts," },
  { t = "p", text = "20 Rousing with mind august presaging seers." },
  { t = "p", text = "For to the merits of the Ninevites" },
  { t = "p", text = "The Lord had bidden Jonah to foretell" },
  { t = "p", text = "Destruction; but he, conscious that He spare;" },
  { t = "p", text = "The subject, and remits to suppliants" },
  { t = "p", text = "25 The dues of penalty, and is to good" },
  { t = "p", text = "Ever inclinable, was loth to face" },
  { t = "p", text = "That errand; lest he sing his seerly strain" },
  { t = "p", text = "In vain, and peaceful issue of his threats" },
  { t = "p", text = "Ensue. His counsel presently is flight:" },
  { t = "p", text = "30 (If, howsoe’er, there is at all the power" },
  { t = "p", text = "God to avoid, and shun the Lord’s right hand" },
  { t = "p", text = "’Neath whom the whole orb trembles and is held" },
  { t = "p", text = "In check: but is there reason in the act" },
  { t = "p", text = "Which in[^1201] his saintly heart the prophet dares?)" },
  { t = "note", id = "1201", text = "Lit. “from,” i.e., which, *urged by* a heart which is that of a saint, even though on this occasion it failed, the prophet dared." },
  { t = "p", text = "35 On the beach-lip, over against the shores" },
  { t = "p", text = "Of the Cilicians, is a city poised,[^1202]" },
  { t = "note", id = "1202", text = "Libratur." },
  { t = "p", text = "Far-famed for trusty port—Joppa her name." },
  { t = "p", text = "Thence therefore Jonah speeding in a barque" },
  { t = "p", text = "Seeks Tarsus,[^1203] through the signal providence" },
  { t = "note", id = "1203", text = "“Tarshish,” Eng. ver.; perhaps Tartessus in Spain. For this question, and the “trustiness” of Joppa (now Jaffa) as a port, see Pusey on Jonah i. 3." },
  { t = "p", text = "40 Of the same God;[^1204] nor marvel is’t, I ween," },
  { t = "note", id = "1204", text = "Ejusdem per signa Dei." },
  { t = "p", text = "If, fleeing from the Lord upon the lands," },
  { t = "p", text = "He found Him in the waves. For suddenly" },
  { t = "p", text = "A little cloud had stained the lower air" },
  { t = "p", text = "With fleecy wrack sulphureous, itself[^1205]" },
  { t = "note", id = "1205", text = "i.e., the cloud." },
  { t = "p", text = "45 By the wind’s seed excited: by degrees," },
  { t = "p", text = "Bearing a brood globose, it with the sun" },
  { t = "p", text = "Cohered, and with a train caliginous" },
  { t = "p", text = "Shut in the cheated day. The main becomes" },
  { t = "p", text = "The mirror of the sky; the waves are dyed so" },
  { t = "p", text = "50 With black encirclement; the upper air" },
  { t = "p", text = "Down rushes into darkness, and the sea" },
  { t = "p", text = "Uprises; nought of middle space is left;" },
  { t = "p", text = "While the clouds touch the waves, and the waves all" },
  { t = "p", text = "Are mingled by the bluster of the winds" },
  { t = "p", text = "55 In whirling eddy. ’Gainst the renegade," },
  { t = "p", text = "’Gainst Jonah, diverse frenzy joined to rave," },
  { t = "p", text = "While one sole barque did all the struggle breed" },
  { t = "p", text = "’Twixt sky and surge. From this side and from that" },
  { t = "p", text = "Pounded she reels; ’neath each wave-breaking blow" },
  { t = "p", text = "60 The forest of her tackling trembles all;" },
  { t = "p", text = "As, underneath, her spinal length of keel," },
  { t = "p", text = "Staggered by shock on shock, all palpitates;" },
  { t = "p", text = "And, from on high, her labouring mass of yard" },
  { t = "p", text = "Creaks shuddering; and the tree-like mast itself" },
  { t = "p", text = "65 Bends to the gale, misdoubting to be riven." },
  { t = "p", text = "Meantime the rising[^1206] clamour of the crew" },
  { t = "note", id = "1206", text = "Ge*nit*us (Oehler); ge*min*us (Migne) =\"twin clamour,” which is not inapt." },
  { t = "p", text = "Tries every chance for barque’s and dear life’s sake:" },
  { t = "p", text = "To pass from hand to hand[^1207] the tardy coils" },
  { t = "note", id = "1207", text = "M*a*ndare (Oehler). If this be the true reading, the rendering in the text seems to represent the meaning; for “mandare” with *an accusative*, in the sense of “to *bid* the tardy coils tighten the girth’s noose,” seems almost too gross a solecism for even so lax a Latinist as our present writer. Migne, however, reads m*u*ndare—*to “clear”* the tardy coils, i.e., probably from the wash and weed with which the gale was cloying them." },
  { t = "p", text = "To tighten the girth’s noose: straitly to bind" },
  { t = "p", text = "70 The tiller’s struggles; or, with breast opposed," },
  { t = "p", text = "T’ impel reluctant curves. Part, turn by turn," },
  { t = "p", text = "With foremost haste outbale the reeking well" },
  { t = "p", text = "Of inward sea. The wares and cargo all" },
  { t = "p", text = "They then cast headlong, and with losses seek" },
  { t = "p", text = "75 Their perils to subdue. At every crash" },
  { t = "p", text = "Of the wild deep rise piteous cries; and out" },
  { t = "p", text = "They stretch their hands to majesties of gods," },
  { t = "p", text = "Which gods are none; whom might of sea and sky" },
  { t = "p", text = "Fears not, nor yet the less from off their poops" },
  { t = "p", text = "80 With angry eddy sweeping sinks them down." },
  { t = "p", text = "Unconscious of all this, the guilty one" },
  { t = "p", text = "’Neath the poop’s hollow arch was making sleep" },
  { t = "p", text = "Re-echo stertorous with nostril wide" },
  { t = "p", text = "Inflated: whom, so soon as he who guides" },
  { t = "p", text = "85 The functions of the wave-dividing prow" },
  { t = "p", text = "Saw him sleep-bound in placid peace, and proud" },
  { t = "p", text = "In his repose, he, standing o’er him, shook," },
  { t = "p", text = "And said, “Why sing’st, with vocal nostril, dreams," },
  { t = "p", text = "In such a crisis? In so wild a whirl," },
  { t = "p", text = "90 Why keep’st thou only harbour? Lo! the wave" },
  { t = "p", text = "Whelms us, and our one hope is in the gods." },
  { t = "p", text = "Thou also, whosoever is thy god," },
  { t = "p", text = "Make vows, and, pouring prayers on bended knee," },
  { t = "p", text = "Win o’er thy country’s Sovran!”" },
  { t = "p", text = "Then they vote" },
  { t = "p", text = "95 To learn by lot who is the culprit, who" },
  { t = "p", text = "The cause of storm; nor does the lot belie" },
  { t = "p", text = "Jonah: whom then they ask, and ask again," },
  { t = "p", text = "“Who? whence? who in the world? from what abode," },
  { t = "p", text = "What people, hail’st thou?” He avows himself" },
  { t = "p", text = "100 A servant, and an over-timid one," },
  { t = "p", text = "Of God, who raised aloft the sky, who based" },
  { t = "p", text = "The earth, who corporally fused the whole:" },
  { t = "p", text = "A renegade from Him he owns himself," },
  { t = "p", text = "And tells the reason. Rigid turned they all" },
  { t = "p", text = "105 With dread. “What grudge, then, ow’st thou *us*? What now" },
  { t = "p", text = "Will follow? By what deed shall we appease" },
  { t = "p", text = "The main?” For more and far more swelling grew" },
  { t = "p", text = "The savage surges. Then the seer begins" },
  { t = "p", text = "Words prompted by the Spirit of the Lord:[^1208]" },
  { t = "note", id = "1208", text = "Tunc Domini vates ingesta Spiritus infit. Of course it is a gross offence against quantity to make a genitive in “us” short, as the rendering in the text does. But a writer who makes the first syllable in “clamor” and the last syllable of gerunds in *do* short, would scarcely be likely to hesitate about taking similar liberties with a genitive of the so-called fourth declension. It is possible, it is true, to take “vates” and “Spiritus” as in apposition, and render, “Then the seer-Spirit of the Lord begins to utter words inspired,” or “Then the seer-Spirit begins to utter the promptings of the Lord.” But these renderings seem to accord less well with the ensuing words." },
  { t = "p", text = "110 “Lo! I your tempest am; I am the sum" },
  { t = "p", text = "Of the world’s[^1209] madness: ’tis in me,” he says," },
  { t = "note", id = "1209", text = "Mundi." },
  { t = "p", text = "“That the sea rises, and the upper air" },
  { t = "p", text = "Down rushes; land in me is far, death near," },
  { t = "p", text = "And hope in God is none! Come, headlong hurl" },
  { t = "p", text = "115 Your cause of bane: lighten your ship, and cast" },
  { t = "p", text = "This single mighty burden to the main," },
  { t = "p", text = "A willing prey!” But they—all vainly!—strive" },
  { t = "p", text = "Homeward to turn their course; for helm refused" },
  { t = "p", text = "To suffer turning, and the yard’s stiff poise" },
  { t = "p", text = "120 Willed not to change. At last unto the Lord" },
  { t = "p", text = "They cry: “For one soul’s sake give us not o’er" },
  { t = "p", text = "Unto death’s maw, nor let us be besprent" },
  { t = "p", text = "With righteous blood, if thus Thine own right hand" },
  { t = "p", text = "Leadeth.” And from the eddy’s depth a whale" },
  { t = "p", text = "125 Outrising on the spot, scaly with shells,[^1210]" },
  { t = "note", id = "1210", text = "i.e., apparently with shells which had gathered about him as he lay in the deep." },
  { t = "p", text = "Unravelling his body’s train, ’gan urge" },
  { t = "p", text = "More near the waves, shocking the gleaming brine," },
  { t = "p", text = "Seizing—at God’s command—the prey; which, rolled" },
  { t = "p", text = "From the poop’s summit prone, with slimy jaws" },
  { t = "p", text = "130 He sucked; and into his long belly sped" },
  { t = "p", text = "The living feast; and swallowed, with the man," },
  { t = "p", text = "The rage of sky and main. The billowy waste" },
  { t = "p", text = "Grows level, and the ether’s gloom dissolves;" },
  { t = "p", text = "The waves on this side, and the blasts on that," },
  { t = "p", text = "135 Are to their friendly mood restored; and, where" },
  { t = "p", text = "The placid keel marks out a path secure," },
  { t = "p", text = "White traces in the emerald furrow bloom." },
  { t = "p", text = "The sailor then does to the reverend Lord" },
  { t = "p", text = "Of death make grateful offering of his fear;[^1211]" },
  { t = "note", id = "1211", text = "This seems to be the sense of Oehler’s “Nauta at tum Domino leti venerando timorem Sacrificat grates”—“grates” being in apposition with “timorem.” But Migne reads: “Nautæ tum Domino læti venerando timorem Sacrificant grates:”— “The sailors then do to the reverend Lord Gladly make grateful sacrifice of fear:” and I do not see that Oehler’s reading is much better." },
  { t = "p", text = "140 Then enters friendly ports." },
  { t = "p", text = "Jonah the seer" },
  { t = "p", text = "The while is voyaging, in other craft" },
  { t = "p", text = "Embarked, and cleaving ’neath the lowest waves" },
  { t = "p", text = "A wave: his sails the intestines of the fish," },
  { t = "p", text = "Inspired with breath ferine; himself, shut in;" },
  { t = "p", text = "145 By waters, yet untouched; in the sea’s heart" },
  { t = "p", text = "And yet beyond its reach; ’mid wrecks of fleets" },
  { t = "p", text = "Half-eaten, and men’s carcasses dissolved" },
  { t = "p", text = "In putrid disintegrity: in life" },
  { t = "p", text = "Learning the process of his death; but still—" },
  { t = "p", text = "150 To be a sign hereafter of the Lord[^1212]—" },
  { t = "note", id = "1212", text = "Comp. Matt. xii. 38–41; Luke xi. 29, 30." },
  { t = "p", text = "A witness was he (in his very self),[^1213]" },
  { t = "note", id = "1213", text = "These words are not in the original, but are inserted (I confess) to fill up the line, and avoid ending with an incomplete verse. If, however, any one is curious enough to compare the translation, with all its defects, with the Latin, he may be somewhat surprised to find how very little alteration or adaptation is necessary in turning verse into verse." },
  { t = "p", text = "Not of destruction, but of death’s repulse." },
]

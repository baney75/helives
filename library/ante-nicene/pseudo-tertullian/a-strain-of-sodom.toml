[[section]]
id = "part-2"
title = "Part II. A Strain of Sodom."
level = 1
blocks = [
  { t = "h", text = "(Author Uncertain.)" },
  { t = "p", text = "Already had Almighty God wiped off" },
  { t = "p", text = "By vengeful flood (with waters all conjoined" },
  { t = "p", text = "Which heaven discharged on earth and the sea’s plain[^1214]" },
  { t = "note", id = "1214", text = "Maris æquor." },
  { t = "p", text = "Outspued) the times of the primeval age:" },
  { t = "p", text = "5 Had pledged Himself, while nether air should bring" },
  { t = "p", text = "The winters in their course, ne’er to decree," },
  { t = "p", text = "By *liquid* ruin, retribution’s due;" },
  { t = "p", text = "And had assigned, to curb the rains, the bow" },
  { t = "p", text = "Of many hues, sealing the clouds with band" },
  { t = "p", text = "10 Of purple and of green, Iris its name," },
  { t = "p", text = "The rain-clouds’ proper baldric.[^1215]" },
  { t = "note", id = "1215", text = "See Gen. ix. 21, 22; x. 8–17." },
  { t = "p", text = "But alike" },
  { t = "p", text = "With mankind’s second race impiety" },
  { t = "p", text = "Revives, and a new age of ill once more" },
  { t = "p", text = "Shoots forth; allotted now no more to *showers*" },
  { t = "p", text = "15 For ruin, but to *fires*: thus did the land" },
  { t = "p", text = "Of Sodom earn to be by glowing dews" },
  { t = "p", text = "Upburnt, and typically thus portend" },
  { t = "p", text = "The future end.[^1216] There wild voluptuousness" },
  { t = "note", id = "1216", text = "Comp. 2 Pet. iii. 5–14." },
  { t = "p", text = "(Modesty’s foe) stood in the room of law;" },
  { t = "p", text = "20 Which prescient guest would shun, and sooner choose" },
  { t = "p", text = "At Scythian or Busirian altar’s foot" },
  { t = "p", text = "’Mid sacred rites to die, and, slaughtered, pour" },
  { t = "p", text = "His blood to Bebryx, or to satiate" },
  { t = "p", text = "Libyan palæstras, or assume new forms;" },
  { t = "p", text = "25 By virtue of Circæan cups, than lose" },
  { t = "p", text = "His outraged sex in Sodom. At heaven’s gate" },
  { t = "p", text = "There knocked for vengeance marriages commit" },
  { t = "p", text = "With equal incest common ’mong a race" },
  { t = "p", text = "By nature rebels ’gainst themselves;[^1217] and hurts" },
  { t = "note", id = "1217", text = "The expression, “sinners against their own souls,” in Num. xvi. 38—where, however, the LXX. have a very different version—may be compared with this; as likewise Prov. viii. 36." },
  { t = "p", text = "30 Done to man’s name and person equally." },
  { t = "p", text = "But God, forewatching all things, at fix’d time" },
  { t = "p", text = "Doth judge the unjust; with patience tarrying" },
  { t = "p", text = "The hour when crime’s ripe age—not any force" },
  { t = "p", text = "Of wrath impetuous—shall have circumscribed" },
  { t = "p", text = "35 The space for waiting.[^1218]" },
  { t = "note", id = "1218", text = "Whether the above be the sense of this most obscure triplet I will not presume to determine. It is at least (I hope) *intelligible* sense. But that the reader may judge for himself whether he can offer any better, I subjoin the lines, which form a sentence alone, and therefore can be judged of without their context:— “Tempore sed certo Deus omnia prospectulatus, Judicat injustos, patiens ubi criminis ætas Cessandi spatium vis nulla coëgerit iræ.”" },
  { t = "p", text = "Now at length the day" },
  { t = "p", text = "Of vengeance was at hand. Sent from the host" },
  { t = "p", text = "Angelical, two, youths in form, who both" },
  { t = "p", text = "Were ministering spirits,[^1219] carrying" },
  { t = "note", id = "1219", text = "Comp. Heb. i. 14. It may be as well here to inform the reader once for all that prosody as well as syntax is repeatedly set at defiance in these metrical fragments; and hence, of course, arise some of the chief difficulties in dealing with them." },
  { t = "p", text = "The Lord’s divine commissions, come beneath" },
  { t = "p", text = "40 The walls of Sodom. There was dwelling Lot" },
  { t = "p", text = "A transplantation from a pious stock;" },
  { t = "p", text = "Wise, and a practicer of righteousness," },
  { t = "p", text = "He was the only one to think on God:" },
  { t = "p", text = "As oft a fruitful tree is wont to lurk," },
  { t = "p", text = "45 Guest-like, in forests wild. He, sitting then" },
  { t = "p", text = "Before the gate (for the celestials scarce" },
  { t = "p", text = "Had reached the ramparts), though he knew not them" },
  { t = "p", text = "Divine,[^1220] accosts them unsolicited," },
  { t = "note", id = "1220", text = "“Divinos;” i.e., apparently “superhuman,” as everything *heavenly* is." },
  { t = "p", text = "Invites, and with ancestral honour greets;" },
  { t = "p", text = "50 And offers them, preparing to abide" },
  { t = "p", text = "Abroad, a hospice. By repeated prayers" },
  { t = "p", text = "He wins them; and then ranges studiously" },
  { t = "p", text = "The sacred pledges[^1221] on his board,[^1222] and quits[^1223]" },
  { t = "note", id = "1221", text = "Of hospitality—bread and salt, etc." },
  { t = "note", id = "1222", text = "“Mens*a*;” but perhaps “mensæ” may be suggested—“the sacred pledges *of the board*.”" },
  { t = "note", id = "1223", text = "“Dispungit,” which is the only verb in the sentence, and refers both to *pia pignora* and to *amicos*. I use “quit” in the sense in which we speak of “quitting a debtor,” i.e., giving him his full due; but the two lines are very hard, and present (as in the case of those before quoted) a jumble of words without grammar; “pia pignora mensa Officiisque probis studio dispungit amicos;” which may be somewhat more literally rendered than in our text, thus: “he zealously discharges” (i.e., fulfils) “his sacred pledges” (i.e., the promised hospitality which he had offered them) “with (a generous) board, and discharges” (i.e., fulfils his obligations to) “his friends with honourable courtesies.”" },
  { t = "p", text = "His friends with courteous offices. The night" },
  { t = "p", text = "55 Had brought repose: alternate[^1224] dawn had chased" },
  { t = "note", id = "1224", text = "Altera =alterna. But the statement differs from Gen. xix. 4." },
  { t = "p", text = "The night, and Sodom with her shameful law" },
  { t = "p", text = "Makes uproar at the doors. Lot, suppliant wise," },
  { t = "p", text = "Withstands: “Young men, let not your new fed lust" },
  { t = "p", text = "Enkindle you to violate this youth![^1225]" },
  { t = "note", id = "1225", text = "“Istam juventam,” i.e., the two “juvenes” (ver. 31) within." },
  { t = "p", text = "60 Whither is passion’s seed inviting you?" },
  { t = "p", text = "To what vain end your lust? For such an end" },
  { t = "p", text = "No creatures wed: not such as haunt the fens;" },
  { t = "p", text = "Not stall-fed cattle; not the gaping brood" },
  { t = "p", text = "Subaqueous; nor they which, modulant" },
  { t = "p", text = "65 On pinions, hang suspended near the clouds;" },
  { t = "p", text = "Nor they which with forth-stretched body creep" },
  { t = "p", text = "Over earth’s face. To conjugal delight" },
  { t = "p", text = "Each kind its kind doth owe: but female still" },
  { t = "p", text = "To all is wife; nor is there one that has" },
  { t = "p", text = "70 A mother save a female one. Yet now," },
  { t = "p", text = "If youthful vigour holds it right[^1226] to waste" },
  { t = "note", id = "1226", text = "“Fas” =ὅσιον, *morally* right; distinct from “jus” or “licitum.”" },
  { t = "p", text = "The flower of modesty, I have within" },
  { t = "p", text = "Two daughters of a nuptial age, in whom" },
  { t = "p", text = "Virginity is swelling in its bloom," },
  { t = "p", text = "75 Already ripe for harvest—a desire" },
  { t = "p", text = "Worthy of men—which let your pleasure reap!" },
  { t = "p", text = "Myself their sire, I yield them; and will pay" },
  { t = "p", text = "For my guests’ sake, the forfeit of my grief!”" },
  { t = "p", text = "Answered the mob insane: “And who art thou?" },
  { t = "p", text = "80 And what? and whence? to lord it over us," },
  { t = "p", text = "And to expound us laws? Shall foreigner" },
  { t = "p", text = "Rule Sodom, and hurl threats? Now, then, thyself" },
  { t = "p", text = "For daughters and for guests shalt sate our greed!" },
  { t = "p", text = "One shall suffice for all!” So said, so done:" },
  { t = "p", text = "85 The frantic mob delays not. As, whene’er" },
  { t = "p", text = "A turbid torrent rolls with wintry tide," },
  { t = "p", text = "And rushes at one speed through countless streams" },
  { t = "p", text = "Of rivers, if, just where it forks, some tree" },
  { t = "p", text = "Meets the swift waves (not long to stand, save while" },
  { t = "p", text = "90 By her root’s force she shall avail to oppose" },
  { t = "p", text = "Her tufty obstacles), when gradually" },
  { t = "p", text = "Her hold upon the undermined soil" },
  { t = "p", text = "Is failing, with her bared stem she hangs," },
  { t = "p", text = "And, with uncertain heavings to and fro," },
  { t = "p", text = "95 Defers her certain fall; not otherwise" },
  { t = "p", text = "Lot in the mid-whirl of the dizzy mob" },
  { t = "p", text = "Kept nodding, now almost o’ercome. But power" },
  { t = "p", text = "Divine brings succour: the angelic youths," },
  { t = "p", text = "Snatching him from the threshold, to his roof" },
  { t = "p", text = "100 Restore him; but upon the spot they mulct" },
  { t = "p", text = "Of sight the mob insane in open day,—" },
  { t = "p", text = "Fit augury of coming penalties!" },
  { t = "p", text = "Then they unlock the just decrees of God:" },
  { t = "p", text = "That penalty condign from heaven will fall" },
  { t = "p", text = "105 On Sodom; that himself had merited" },
  { t = "p", text = "Safety upon the count of righteousness." },
  { t = "p", text = "“Gird thee, then, up to hasten hence thy flight," },
  { t = "p", text = "And with thee to lead out what family" },
  { t = "p", text = "Thou hast: already we are bringing on" },
  { t = "p", text = "110 Destruction o’er the city.” Lot with speed" },
  { t = "p", text = "Speaks to his sons-in-law; but their hard heart" },
  { t = "p", text = "Scorned to believe the warning, and at fear" },
  { t = "p", text = "Laughed. At what time the light attempts to climb" },
  { t = "p", text = "The darkness, and heaven’s face wears double hue" },
  { t = "p", text = "115 From night and day, the youthful visitants" },
  { t = "p", text = "Were instant to outlead from Sodoma" },
  { t = "p", text = "The race Chaldæan,[^1227] and the righteous house" },
  { t = "note", id = "1227", text = "i.e., Lot’s race or family, which had come from “Ur of the Chaldees.” See Gen. xi. 26, 27, 28." },
  { t = "p", text = "Consign to safety: “Ho! come, Lot! arise," },
  { t = "p", text = "And take thy yokefellow and daughters twain," },
  { t = "p", text = "120 And hence, beyond the boundaries be gone," },
  { t = "p", text = "Preventing[^1228] Sodom’s penalties!” And eke" },
  { t = "note", id = "1228", text = "I use “preventing” in its now unusual sense of “anticipating the arrival of.”" },
  { t = "p", text = "With friendly hands they lead them trembling forth," },
  { t = "p", text = "And then their final mandates give: “Save, Lot," },
  { t = "p", text = "Thy life, lest thou perchance should will to turn" },
  { t = "p", text = "125 Thy retroverted gaze behind, or stay" },
  { t = "p", text = "The step once taken: to the mountain speed!”" },
  { t = "p", text = "Lot feared to creep the heights with tardy step," },
  { t = "p", text = "Lest the celestial wrath-fires should o’ertake" },
  { t = "p", text = "And whelm him: therefore he essays to crave" },
  { t = "p", text = "130 Some other ports; a city small, to wit," },
  { t = "p", text = "Which opposite he had espied. “Hereto,”" },
  { t = "p", text = "He said, “I speed my flight: scarce with its walls" },
  { t = "p", text = "’Tis visible; nor is it far, nor great.”" },
  { t = "p", text = "They, favouring his prayer, safety assured" },
  { t = "p", text = "135 To him and to the city; whence the spot" },
  { t = "p", text = "Is known in speech barbaric by the name" },
  { t = "p", text = "Segor.[^1229] Lot enters Segor while the sun" },
  { t = "note", id = "1229", text = "Σηγώρ in the LXX., “Zoar” in Eng. ver." },
  { t = "p", text = "Is rising,[^1230] the last sun, which glowing bears" },
  { t = "note", id = "1230", text = "“*Simul exoritur* sol.” But both the LXX. and the Eng. ver. say the sun *was risen* when Lot entered the city." },
  { t = "p", text = "To Sodom conflagration; for his rays" },
  { t = "p", text = "140 He had armed all with fire: beneath him spreads" },
  { t = "p", text = "An emulous gloom, which seeks to intercept" },
  { t = "p", text = "The light; and clouds combine to interweave" },
  { t = "p", text = "Their smoky globes with the confused sky:" },
  { t = "p", text = "Down pours a novel shower: the ether seethes" },
  { t = "p", text = "145 With sulphur mixt with blazing flames:[^1231] the air" },
  { t = "note", id = "1231", text = "So Oehler and Migne. But perhaps we may alter the pointing slightly, and read:— “Down pours a novel shower, sulphur mixt With blazing flames: the ether seethes: the air Crackles with liquid exust.”" },
  { t = "p", text = "Crackles with liquid heats exust. From hence" },
  { t = "p", text = "The fable has an echo of the truth" },
  { t = "p", text = "Amid its false, that the sun’s progeny" },
  { t = "p", text = "Would drive his father’s team; but nought availed" },
  { t = "p", text = "150 The giddy boy to curb the haughty steeds" },
  { t = "p", text = "Of fire: so blazed our orb: then lightning reft" },
  { t = "p", text = "The lawless charioteer, and bitter plaint" },
  { t = "p", text = "Transformed his sisters. Let Eridanus" },
  { t = "p", text = "See to it, if one poplar on his banks" },
  { t = "p", text = "155 Whitens, or any bird dons plumage there" },
  { t = "p", text = "Whose note old age makes mellow![^1232]" },
  { t = "note", id = "1232", text = "The story of Phaëthon and his fate is told in Ov., *Met*., ii. 1–399, which may be compared with the present piece. His two sisters were transformed into white poplars, according to some; alders, according to others. See Virg., *Æn*., x. 190 sqq., *Ec*., vi. 62 sqq. His half-brother (Cycnus or Cygnus) was turned into a swan: and the scene of these transformations is laid by Ovid on the banks of the Eridanus (the Po). But the fable is variously told; and it has been suggested that the groundwork of it is to be found rather in the still-standing of the sun recorded in Joshua." },
  { t = "p", text = "*Here* they mourn" },
  { t = "p", text = "O’er miracles of metamorphosis" },
  { t = "p", text = "Of other sort. For, partner of Lot’s flight," },
  { t = "p", text = "His wife (ah me, for woman! even then[^1233]" },
  { t = "note", id = "1233", text = "i.e., as she had been before in the case of Eve. See Gen. iii. 1 sqq." },
  { t = "p", text = "160 Intolerant of law!) alone turned back" },
  { t = "p", text = "At the unearthly murmurs of the sky)" },
  { t = "p", text = "Her daring eyes, but bootlessly: not doomed" },
  { t = "p", text = "To utter what she saw! and then and there" },
  { t = "p", text = "Changed into brittle salt, herself her tomb" },
  { t = "p", text = "165 She stood, herself an image of herself," },
  { t = "p", text = "Keeping an incorporeal form: and still" },
  { t = "p", text = "In her unsheltered station ’neath the heaven" },
  { t = "p", text = "Dures she, by rains unmelted, by decay" },
  { t = "p", text = "And winds unwasted; nay, if some strange hand" },
  { t = "p", text = "170 Deface her form, forthwith from her own store" },
  { t = "p", text = "Her wounds she doth repair. Still is she said" },
  { t = "p", text = "To live, and, ’mid her corporal change, discharge" },
  { t = "p", text = "With wonted blood her sex’s monthly dues." },
  { t = "p", text = "Gone are the men of Sodom; gone the glare" },
  { t = "p", text = "175 Of their unhallowed ramparts; all the house" },
  { t = "p", text = "Inhospitable, with its lords, is gone:" },
  { t = "p", text = "The champaign is one pyre; here embers rough" },
  { t = "p", text = "And black, here ash-heaps with hoar mould, mark out" },
  { t = "p", text = "The conflagration’s course: evanished" },
  { t = "p", text = "180 Is all that old fertility[^1234] which Lot," },
  { t = "note", id = "1234", text = "I have hazarded the bold conjecture—which I see others (Pamelius at all events) had hazarded before me—that “feritas” is used by our author as =\"fertilitas.” The word, of course, is very incorrectly formed etymologically; but etymology is not our author’s *forte* apparently. It will also be seen that there is seemingly a gap at this point, or else some enormous mistake, in the mss. An attempt has been made (see Migne) to correct it, but not a very satisfactory one. For the common reading, which gives two lines, “Occidit illa prior feritas, quam prospiciens Loth Nullus arat frustra piceas fuligine glebas,” which are evidently entirely unconnected with one another, it is proposed to read, “Occidit illa prior feritas, quam prospiciens Loth, Deseruisse pii fertur commercia fratris. Nullas arat,” etc. This use of “fratris” in a wide sense may be justified from Gen. xiii. 8 (to which passage, with its immediate context, there seems to be a reference, whether we adopt the proposed correction or no), and similar passages in Holy Writ. But the transition is still abrupt to the “nullus arat,” etc.; and I prefer to leave the passage as it is, without attempting to supply the hiatus." },
  { t = "p", text = "Seeing outspread before him,…" },
  { t = "p", text = "No ploughman spends his fruitless toil on glebes" },
  { t = "p", text = "Pitchy with soot: or if some acres there," },
  { t = "p", text = "But half consumed, still strive to emulate" },
  { t = "p", text = "185 Autumn’s glad wealth, pears, peaches, and all fruits" },
  { t = "p", text = "Promise themselves full easely[^1235] to the eye" },
  { t = "note", id = "1235", text = "This use of “easely” as a dissyllable is justifiable from Spenser." },
  { t = "p", text = "In fairest bloom, until the plucker’s hand" },
  { t = "p", text = "Is on them: then forthwith the seeming fruit" },
  { t = "p", text = "Crumbles to dust ’neath the bewraying touch," },
  { t = "p", text = "190 And turns to embers vain." },
  { t = "p", text = "Thus, therefore (sky" },
  { t = "p", text = "And earth entombed alike), not e’en the sea" },
  { t = "p", text = "Lives there: the quiet of that quiet sea" },
  { t = "p", text = "Is death![^1236]—a sea which no wave animates" },
  { t = "note", id = "1236", text = "This seems to be the sense, but the Latin is somewhat strange: “mors est maris illa quieti,” i.e., illa (quies) maris quieti mors est. The opening lines of “Jonah” (above) should be compared with this passage and its context." },
  { t = "p", text = "Through its anhealant volumes; which beneath" },
  { t = "p", text = "195 Its native Auster sighs not anywhere;" },
  { t = "p", text = "Which cannot from its depths one scaly race," },
  { t = "p", text = "Or with smooth skin or cork-like fence encased," },
  { t = "p", text = "Produce, or curled shell in single valve" },
  { t = "p", text = "Or double fold enclosed. Bitumen there" },
  { t = "p", text = "200 (The sooty reek of sea exust) alone," },
  { t = "p", text = "With its own crop, a spurious harvest yields;" },
  { t = "p", text = "Which ’neath the stagnant surface vivid heat" },
  { t = "p", text = "From seething mass of sulphur and of brine" },
  { t = "p", text = "Maturing tempers, making earth cohere" },
  { t = "p", text = "205 Into a pitch marine.[^1237] At season due" },
  { t = "note", id = "1237", text = "Inque picem dat terræ hærere marinam." },
  { t = "p", text = "The heated water’s fatty ooze is borne" },
  { t = "p", text = "Up to the surface; and with foamy flakes" },
  { t = "p", text = "Over the level top a tawny skin" },
  { t = "p", text = "Is woven. They whose function is to catch" },
  { t = "p", text = "210 That ware put to, tilting their smooth skin down" },
  { t = "p", text = "With balance of their sides, to teach the film," },
  { t = "p", text = "Once o’er the gunnel, to float in: for, lo!" },
  { t = "p", text = "Raising itself spontaneous, it will swim" },
  { t = "p", text = "Up to the edge of the unmoving craft;" },
  { t = "p", text = "215 And will, when pressed,[^1238] for guerdon large, ensure" },
  { t = "note", id = "1238", text = "“Pressum” (Oehler); “pretium” (Migne): “it will yield a prize, namely, that,” etc." },
  { t = "p", text = "Immunity from the defiling touch" },
  { t = "p", text = "Of weft which female monthly efflux clothes." },
  { t = "p", text = "Behold another portent notable," },
  { t = "p", text = "Fruit of that sea’s disaster: all things cast" },
  { t = "p", text = "220 Therein do swim: gone is its native power" },
  { t = "p", text = "For sinking bodies: if, in fine, you launch" },
  { t = "p", text = "A torch’s lightsome[^1239] hull (where spirit serves" },
  { t = "note", id = "1239", text = "Luciferam." },
  { t = "p", text = "For fire) therein, the apex of the flame" },
  { t = "p", text = "Will act as sail; put out the flame, and ’neath" },
  { t = "p", text = "225 The waters will the light’s wrecks ruin go!" },
  { t = "p", text = "Such Sodom’s and Gomorrah’s penalties," },
  { t = "p", text = "For ages sealed as signs before the eyes" },
  { t = "p", text = "Of unjust nations, whose obdurate hearts" },
  { t = "p", text = "God’s fear have quite forsaken,[^1240] will them teach" },
  { t = "note", id = "1240", text = "Oehler’s pointing is disregarded." },
  { t = "p", text = "230 To reverence heaven-sanctioned rights,[^1241] and lift" },
  { t = "note", id = "1241", text = "“De cælo jura tueri;” possibly “to look for laws from heaven.”" },
  { t = "p", text = "Their gaze unto one only Lord of all." },
]

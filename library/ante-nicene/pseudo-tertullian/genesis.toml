[[section]]
id = "part-3"
title = "Part III. Genesis."
level = 1
blocks = [
  { t = "h", text = "(Author Uncertain.)" },
  { t = "p", text = "In the beginning did the Lord create" },
  { t = "p", text = "The heaven and earth:[^1242] for formless was the land,[^1243]" },
  { t = "note", id = "1242", text = "Terram." },
  { t = "note", id = "1243", text = "Tellus." },
  { t = "p", text = "And hidden by the wave, and God immense[^1244]" },
  { t = "note", id = "1244", text = "Immensus. See note on the word in the fragment “Concerning the Cursing of the Heathen’s Gods.”" },
  { t = "p", text = "O’er the vast watery plains was hovering," },
  { t = "p", text = "5 While chaos and black darkness shrouded all:" },
  { t = "p", text = "Which darkness, when God bade be from the pole[^1245]" },
  { t = "note", id = "1245", text = "Cardine." },
  { t = "p", text = "Disjoined, He speaks, “Let there be light;” and all" },
  { t = "p", text = "In the clear world[^1246] was bright. Then, when the Lord" },
  { t = "note", id = "1246", text = "Mundo." },
  { t = "p", text = "The first day’s work had finished, He formed" },
  { t = "p", text = "10 Heaven’s axis white with nascent clouds: the deep" },
  { t = "p", text = "Immense receives its wandering[^1247] shores, and draws" },
  { t = "note", id = "1247", text = "“Errantia;” so called, probably, either because they appear to move as ships pass them, or because they may be said to “wander” by reason of the constant change which they undergo from the action of the sea, and because of the shifting nature of their sands." },
  { t = "p", text = "The rivers manifold with mighty trains." },
  { t = "p", text = "The third dun light unveiled earth’s[^1248] face, and soon" },
  { t = "note", id = "1248", text = "Terrarum." },
  { t = "p", text = "(Its name assigned[^1249]) the dry land’s story ’gins:" },
  { t = "note", id = "1249", text = "“God called the dry land Earth:” Gen. i. 10." },
  { t = "p", text = "15 Together on the windy champaigns rise" },
  { t = "p", text = "The flowery seeds, and simultaneously" },
  { t = "p", text = "Fruit-bearing boughs put forth procurvant arms." },
  { t = "p", text = "The fourth day, with[^1250] the sun’s lamp generates" },
  { t = "note", id = "1250", text = "i.e., “together with;” it begets both sun and moon." },
  { t = "p", text = "The moon, and moulds the stars with tremulous light" },
  { t = "p", text = "20 Radiant: these elements it[^1251] gave as signs" },
  { t = "note", id = "1251", text = "i.e., “the fourth day.”" },
  { t = "p", text = "To th’ underlying world,[^1252] to teach the times" },
  { t = "note", id = "1252", text = "Mundo." },
  { t = "p", text = "Which, through their rise and setting, were to change." },
  { t = "p", text = "Then, on the fifth, the liquid[^1253] streams receive" },
  { t = "note", id = "1253", text = "Or, “lucid”—liquentia." },
  { t = "p", text = "Their fish, and birds poise in the lower air" },
  { t = "p", text = "25 Their pinions many-hued. The sixth, again," },
  { t = "p", text = "Supples the ice-cold snakes into their coils," },
  { t = "p", text = "And over the whole fields diffuses herds" },
  { t = "p", text = "Of quadrupeds; and mandate gave that all" },
  { t = "p", text = "Should grow with multiplying seed, and roam" },
  { t = "p", text = "30 And feed in earth’s immensity." },
  { t = "p", text = "All these" },
  { t = "p", text = "When power divine by mere command arranged," },
  { t = "p", text = "Observing that things mundane still would lack" },
  { t = "p", text = "A ruler, thus It[^1254] speaks: “With utmost care," },
  { t = "note", id = "1254", text = "i.e., “Power Divine.”" },
  { t = "p", text = "Assimilated to our own aspect,[^1255]" },
  { t = "note", id = "1255", text = "So Milton and Shakespeare." },
  { t = "p", text = "35 Make We a man to reign in the whole orb.”" },
  { t = "p", text = "And him, although He with a single word[^1256]" },
  { t = "note", id = "1256", text = "As (see above, l. 31) He had all other things." },
  { t = "p", text = "Could have compounded, yet Himself did deign" },
  { t = "p", text = "To shape him with His sacred own right hand," },
  { t = "p", text = "Inspiring his dull breast from breast divine." },
  { t = "p", text = "40 Whom when He saw formed in a likeness such" },
  { t = "p", text = "As is His own, He measures how he broods" },
  { t = "p", text = "Alone on gnawing cares. Straight way his eyes" },
  { t = "p", text = "With sleep irriguous He doth perfuse;" },
  { t = "p", text = "That from his left rib woman softlier" },
  { t = "p", text = "45 May formed be, and that by mixture twin" },
  { t = "p", text = "His substance may add firmness to her limbs." },
  { t = "p", text = "To her the name of “Life”—which is called “Eve”[^1257]—" },
  { t = "note", id = "1257", text = "See Gen. iii. 20, with the LXX., and the marg. in the Eng. ver." },
  { t = "p", text = "Is given: wherefore sons, as custom is," },
  { t = "p", text = "Their parents leave, and, with a settled home," },
  { t = "p", text = "50 Cleave to their wives." },
  { t = "p", text = "The seventh came, when God" },
  { t = "p", text = "At His works’ end did rest, decreeing it" },
  { t = "p", text = "Sacred unto the coming ages’ joys." },
  { t = "p", text = "Straightway—the crowds of living things deployed" },
  { t = "p", text = "Before him—Adam’s cunning skill (the gift" },
  { t = "p", text = "55 Of the good Lord) gives severally to all" },
  { t = "p", text = "The name which still is permanent. Himself," },
  { t = "p", text = "And, joined with him, his Eve, God deigns address" },
  { t = "p", text = "“Grow, for the times to come, with manifold" },
  { t = "p", text = "Increase, that with your seed the pole and earth[^1258]" },
  { t = "note", id = "1258", text = "Terræ." },
  { t = "p", text = "60 Be filled; and, as Mine heirs, the varied fruits" },
  { t = "p", text = "Pluck ye, which groves and champaigns render you," },
  { t = "p", text = "From their rich turf.” Thus after He discoursed," },
  { t = "p", text = "In gladsome court[^1259] a paradise is strewn," },
  { t = "note", id = "1259", text = "The “gladsome court”—“læta aula”—seems to mean *Eden, in* which the garden is said to have been planted. See Gen. ii. 8." },
  { t = "p", text = "And looks towards the rays of th’ early sun.[^1260]" },
  { t = "note", id = "1260", text = "i.e., eastward. See the last reference." },
  { t = "p", text = "65 These joys among, a tree with deadly fruits," },
  { t = "p", text = "Breeding, conjoined, the taste of life and death," },
  { t = "p", text = "Arises. In the midst of the demesne[^1261]" },
  { t = "note", id = "1261", text = "Ædibus in mediis." },
  { t = "p", text = "Flows with pure tide a stream, which irrigates" },
  { t = "p", text = "Fair offsprings from its liquid waves, and cuts" },
  { t = "p", text = "70 Quadrified paths from out its bubbling fount" },
  { t = "p", text = "Here wealthy Phison, with auriferous waves," },
  { t = "p", text = "Swells, and with hoarse tide wears[^1262] conspicuous gems," },
  { t = "note", id = "1262", text = "Terit. So Job (xiv. 19), “The waters *wear* the stones.”" },
  { t = "p", text = "This prasinus,[^1263] that glowing carbuncle,[^1264]" },
  { t = "note", id = "1263", text = "“Onyx,” Eng. ver. See the following piece, l. 277." },
  { t = "note", id = "1264", text = "“Bdellium,” Eng. Ver.; ἄνθραξ, LXX." },
  { t = "p", text = "By name; and raves, transparent in its shoals," },
  { t = "p", text = "75 The margin of the land of Havilath." },
  { t = "p", text = "Next Gihon, gliding by the Æthiops," },
  { t = "p", text = "Enriches them. The Tigris is the third," },
  { t = "p", text = "Adjoined to fair Euphrates, furrowing" },
  { t = "p", text = "Disjunctively with rapid flood the land" },
  { t = "p", text = "80 Of Asshur. Adam, with his faithful wife," },
  { t = "p", text = "Placed here as guard and workman, is informed" },
  { t = "p", text = "By such the Thunderer’s[^1265] speech: “Tremble ye not" },
  { t = "note", id = "1265", text = "Comp. Ps. xxix. 3, especially in “Great Bible” (xxviii. 3 in LXX.)" },
  { t = "p", text = "To pluck together the permitted fruits" },
  { t = "p", text = "Which, with its leafy bough, the unshorn grove" },
  { t = "p", text = "85 Hath furnished; anxious only lest perchance" },
  { t = "p", text = "Ye cull the hurtful apple,[^1266] which is green" },
  { t = "note", id = "1266", text = "Malum." },
  { t = "p", text = "With a twin juice for functions several.”" },
  { t = "p", text = "And, no less blind meantime than Night herself," },
  { t = "p", text = "Deep night ’gan hold them, nor had e’en a robe" },
  { t = "p", text = "90 Covered their new-formed limbs." },
  { t = "p", text = "Amid these haunts," },
  { t = "p", text = "And on mild berries reared, a foamy snake," },
  { t = "p", text = "Surpassing living things in sense astute," },
  { t = "p", text = "Was creeping silently with chilly coils." },
  { t = "p", text = "He, brooding over envious lies instinct" },
  { t = "p", text = "95 With gnawing sense, tempts the soft heart beneath" },
  { t = "p", text = "The woman’s breast: “Tell me, why shouldst thou dread" },
  { t = "p", text = "The apple’s[^1267] happy seeds? Why, hath not" },
  { t = "note", id = "1267", text = "Mali." },
  { t = "p", text = "All known fruits hallowed?[^1268] Whence if thou be prompt" },
  { t = "note", id = "1268", text = "“Numquid poma Deus non omnia nota sacravit?”" },
  { t = "p", text = "To cull the honeyed fruits, the golden world[^1269]" },
  { t = "note", id = "1269", text = "Mundus." },
  { t = "p", text = "100 Will on its starry pole return.”[^1270] But she" },
  { t = "note", id = "1270", text = "The writer, supposing it to be night (see 88, 89), seems to mean that the serpent hinted that the fruit would instantly dispel night and restore day. Compare the ensuing lines." },
  { t = "p", text = "Refuses, and the boughs forbidden fears" },
  { t = "p", text = "To touch. But yet her breast ’gins be o’er come" },
  { t = "p", text = "With sense infirm. Straightway, as she at length" },
  { t = "p", text = "With snowy tooth the dainty morsels bit," },
  { t = "p", text = "105 Stained with no cloud the sky serene up-lit!" },
  { t = "p", text = "Then taste, instilling lure in honeyed jaws," },
  { t = "p", text = "To her yet uninitiated lord" },
  { t = "p", text = "Constrained her to present the gift; which he" },
  { t = "p", text = "No sooner took, then—night effaced!:—their eyes" },
  { t = "p", text = "110 Shone out serene in the resplendent world.[^1271]" },
  { t = "note", id = "1271", text = "Mundo." },
  { t = "p", text = "When, then, they each their body bare espied," },
  { t = "p", text = "And when their shameful parts they see, with leaves" },
  { t = "p", text = "Of fig they shadow them." },
  { t = "p", text = "By chance, beneath" },
  { t = "p", text = "The sun’s now setting light, they recognise" },
  { t = "p", text = "115 The sound of the Lord’s voice, and, trembling, haste" },
  { t = "p", text = "To bypaths. Then the Lord of heaven accosts" },
  { t = "p", text = "The mournful Adam: “Say, where now thou art.”" },
  { t = "p", text = "Who suppliant thus answers: “Thine address," },
  { t = "p", text = "O Lord, O Mighty One, I tremble at," },
  { t = "p", text = "120 Beneath my fearful heart; and, being bare," },
  { t = "p", text = "I faint with chilly dread.” Then said the Lord:" },
  { t = "p", text = "“Who hath the hurtful fruits, then, given you?”" },
  { t = "p", text = "“This woman, while she tells me how her eyes" },
  { t = "p", text = "With brilliant day promptly perfused were," },
  { t = "p", text = "125 And on her dawned the liquid sky serene," },
  { t = "p", text = "And heaven’s sun and stars, o’ergave them me!”" },
  { t = "p", text = "Forthwith God’s anger frights perturbed Eve," },
  { t = "p", text = "While the Most High inquires the authorship" },
  { t = "p", text = "Of the forbidden act. Hereon she opes" },
  { t = "p", text = "130 Her tale: “The speaking serpent’s suasive words" },
  { t = "p", text = "I harboured, while the guile and bland request" },
  { t = "p", text = "Misled me: for, with venoms viperous" },
  { t = "p", text = "His words inweaving, stories told he me" },
  { t = "p", text = "Of those delights which should all fruits excel.”" },
  { t = "p", text = "135 Straightway the Omnipotent the dragon’s deeds" },
  { t = "p", text = "Condemns, and bids him be to all a sight" },
  { t = "p", text = "Unsightly, monstrous; bids him presently" },
  { t = "p", text = "With grovelling beast to crawl; and then to bite" },
  { t = "p", text = "And chew the soil; while war should to all time" },
  { t = "p", text = "140 ’Twixt human senses and his tottering self" },
  { t = "p", text = "Be waged, that he might creep, crestfallen, prone," },
  { t = "p", text = "Behind the legs of men,[^1272]—that while he glides" },
  { t = "note", id = "1272", text = "Virorum." },
  { t = "p", text = "Close on their heels they may down-trample him." },
  { t = "p", text = "The woman, sadly caught by guileful words," },
  { t = "p", text = "145 Is bidden yield her fruit with struggle hard," },
  { t = "p", text = "And bear her husband’s yoke with patient zeal.[^1273]" },
  { t = "note", id = "1273", text = "“Servitiumque sui studio perferre mariti;” or, perhaps, “and drudge in patience at her husband’s beck.”" },
  { t = "p", text = "“But thou, to whom the sentence[^1274] of the wife" },
  { t = "note", id = "1274", text = "“Sententia:” her sentence, or opinion, as to the fruit and its effects." },
  { t = "p", text = "(Who, vanquished, to the dragon pitiless" },
  { t = "p", text = "Yielded) seemed true, shalt through long times deplore" },
  { t = "p", text = "150 Thy labour sad; for thou shalt see, instead" },
  { t = "p", text = "Of wheaten harvest’s seed, the thistle rise," },
  { t = "p", text = "And the thorn plenteously with pointed spines:" },
  { t = "p", text = "So that, with weary heart and mournful breast," },
  { t = "p", text = "Full many sighs shall furnish anxious food;[^1275]" },
  { t = "note", id = "1275", text = "Or, “That with heart-weariness and mournful breast Full many sighs may furnish anxious food.”" },
  { t = "p", text = "155 Till, in the setting hour of coming death," },
  { t = "p", text = "To level earth, whence thou thy body draw’st," },
  { t = "p", text = "Thou be restored.” This done, the Lord bestows" },
  { t = "p", text = "Upon the trembling pair a tedious life;" },
  { t = "p", text = "And from the sacred gardens far removes" },
  { t = "p", text = "160 Them downcast, and locates them opposite," },
  { t = "p", text = "And from the threshold bars them by mid fire," },
  { t = "p", text = "Wherein from out the swift heat is evolved" },
  { t = "p", text = "A cherubim,[^1276] while fierce the hot point glows," },
  { t = "note", id = "1276", text = "The writer makes “cherubim”—or “cherubin”—singular. I have therefore retained his mistake. What the “hot point”—“calidus apex”—is, is not clear. It may be an allusion to the “flaming sword” (see Gen. iii. 24); or it may mean the top of the flame." },
  { t = "p", text = "And rolls enfolding flames. And lest their limbs" },
  { t = "p", text = "165 With sluggish cold should be benumbed, the Lord" },
  { t = "p", text = "Hides flayed from cattle’s flesh together sews," },
  { t = "p", text = "With vestures warm their bare limbs covering." },
  { t = "p", text = "When, therefore, Adam—now believing—felt" },
  { t = "p", text = "(By wedlock taught) his manhood, he confers" },
  { t = "p", text = "170 On his loved wife the mother’s name; and, made" },
  { t = "p", text = "Successively by scions twain a sire," },
  { t = "p", text = "Gives names to stocks[^1277] diverse: Caïn the first" },
  { t = "note", id = "1277", text = "Or, “origins”—“orsis”—because Cain and Abel were original types, as it were, of two separate classes of men." },
  { t = "p", text = "Hath for his name, to whom is Abel joined." },
  { t = "p", text = "The latter’s care tended the harmless sheep;" },
  { t = "p", text = "175 The other turned the earth with curved plough." },
  { t = "p", text = "These, when in course of time[^1278] they brought their gifts" },
  { t = "note", id = "1278", text = "“Perpetuo;” “in process of time,” Eng. ver.; μεθ᾽ ἡμέρας, LXX. in Gen. iv. 3." },
  { t = "p", text = "To Him who thunders, offered—as their sense" },
  { t = "p", text = "Prompted them—fruits unlike. The elder one" },
  { t = "p", text = "Offered the first-fruits[^1279] of the fertile glebes:" },
  { t = "note", id = "1279", text = "Quæ prosata fuerant. But, as Wordsworth remarks on Gen. iv., we do not read that Cain’s offerings were first-fruits even." },
  { t = "p", text = "180 The other pays his vows with gentle lamb," },
  { t = "p", text = "Bearing in hand the entrails pure, and fat" },
  { t = "p", text = "Snow-white; and to the Lord, who pious vows" },
  { t = "p", text = "Beholds, is instantly acceptable." },
  { t = "p", text = "Wherefore with anger cold did Cain glow;[^1280]" },
  { t = "note", id = "1280", text = "Quod propter gelida Cain incanduit ira. If this, which is Oehler’s and Migne’s reading, be correct, the words *gelida* and *incanduit* seem to be intentionally contrasted, unless *incandescere* be used here in a supposed sense of “growing white,” “turning pale.” *Urere* is used in Latin of heat and cold indifferently. *Calida* would, of course, be a ready emendation; but *gelida* has the advantage of being far more startling." },
  { t = "p", text = "185 With whom God deigns to talk, and thus begins:" },
  { t = "p", text = "“Tell Me, if thou live rightly, and discern" },
  { t = "p", text = "Things hurtful, couldst thou not then pass thine age" },
  { t = "p", text = "Pure from contracted guilt? Cease to essay" },
  { t = "p", text = "With gnawing sense thy brother’s ruin, who," },
  { t = "p", text = "190 Subject to thee as lord, his neck shall yield.”" },
  { t = "p", text = "Not e’en thus softened, he unto the fields" },
  { t = "p", text = "Conducts his brother; whom when overta’en" },
  { t = "p", text = "In lonely mead he saw, with his twin palms" },
  { t = "p", text = "Bruising his pious throat, he crushed life out." },
  { t = "p", text = "195 Which deed the Lord espying from high heaven," },
  { t = "p", text = "Straitly demands “where Abel is on earth? ”" },
  { t = "p", text = "He says “he will not as his brother’s guard" },
  { t = "p", text = "Be set.” Then God outspeaks to him again:" },
  { t = "p", text = "“Doth not the sound of his blood’s voice, sent up" },
  { t = "p", text = "200 To Me, ascend unto heaven’s lofty pole?" },
  { t = "p", text = "Learn, therefore, for so great a crime what doom" },
  { t = "p", text = "Shall wait thee. Earth, which with thy kinsman’s blood" },
  { t = "p", text = "Hath reeked but now, shall to thy hateful hand" },
  { t = "p", text = "Refuse to render back the cursed seeds" },
  { t = "p", text = "205 Entrusted her; nor shall, if set with herbs," },
  { t = "p", text = "Produce her fruit: that, torpid, thou shalt dash" },
  { t = "p", text = "Thy limbs against each other with much fear.”……" },
]

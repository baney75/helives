[[section]]
id = "chapter-1"
title = "Chapter I. Earliest Heretics: Simon Magus, Menander, Saturninus, Basilides, Nicolaus."
level = 1
blocks = [
  { t = "h", text = "IX." },
  { t = "h", text = "Appendix." },
  { t = "p", text = "Against all Heresies.[^8330]" },
  { t = "note", id = "8330", text = "[On p. 14, this volume, see nearly all that need be said, of this spurious treatise. I add a few references to Routh, *Opuscula*, Vol. 1. p. 160 etc. His honouring it with a place in his work must be my apology for not relegating it to the collection of spurious *Tertulliana*, *sub fine*.]" },
  { t = "h", text = "[Translated by Rev. S. Thelwall.]" },
  { t = "p", text = "Chapter I.—Earliest Heretics:[^8331] Simon Magus, Menander, Saturninus, Basilides, Nicolaus. [The Work Begins as a Fragment.]" },
  { t = "note", id = "8331", text = "[Routh says he inadvertently changed his title to read *Advs. Hæreticos*, but that it is better after all, in view of the opening sentence.]" },
  { t = "p", text = "Of which heretics I will (to pass by a good deal) summarize some few particulars. For of Judaism’s heretics I am silent—Dositheus the Samaritan, I mean, who was the first who had the hardihood to repudiate the prophets, on the ground that they had not spoken under inspiration of the Holy Spirit. Of the Sadducees I am silent, who, springing from the root of this error, had the hardihood to adjoin to this heresy the denial likewise of the resurrection of the flesh.[^8332] The Pharisees I pretermit, who were “divided” from the Jews by their superimposing of certain additaments to the law, which fact likewise made them worthy of receiving this very name;[^8333] and, together with them, the Herodians likewise, who said that Herod was Christ. To those I betake myself who have chosen to make the gospel the starting-point of their heresies." },
  { t = "note", id = "8332", text = "See Acts xxiii. 8, and the references there." },
  { t = "note", id = "8333", text = "Pharisees = Separatists." },
  { t = "p", text = "Of these the first of all is Simon Magus, who in the Acts of the Apostles earned a condign and just sentence from the Apostle Peter.[^8334] He had the hardihood to call himself the Supreme Virtue,[^8335] that is, the Supreme God; and moreover, (to assert) that the universe[^8336] had been originated by his angels; that he had descended in quest of an erring dæmon,[^8337] which was Wisdom; that, in a phantasmal semblance of God, he had *not* suffered among the Jews, but was *as if he had suffered*.[^8338]" },
  { t = "note", id = "8334", text = "See Acts viii. 9–24." },
  { t = "note", id = "8335", text = "I use Virtue in this and similar cases in its Miltonic sense." },
  { t = "note", id = "8336", text = "Mundum." },
  { t = "note", id = "8337", text = "Or, “intelligence.”" },
  { t = "note", id = "8338", text = "Or, “but had undergone *a* *quasi-passion*.”" },
  { t = "p", text = "After him Menander, his disciple (likewise a magician[^8339]), saying the same as Simon. Whatever Simon had affirmed himself to be, this did Menander equally affirm himself to be, asserting that none could possibly have salvation without being baptized in his name." },
  { t = "note", id = "8339", text = "Magus." },
  { t = "p", text = "Afterwards, again, followed Saturninus: he, too, affirming that the innascible[^8340] Virtue, that is God, abides in the highest regions, and that those regions are infinite, and in the regions immediately above us; but that angels far removed from Him made the lower world;[^8341] and that, because light from above had flashed refulgently in the lower regions, the angels had carefully tried to form man after the similitude of that light; that man lay crawling on the surface of the earth; that this light and this higher virtue was, thanks to mercy, the salvable spark in man, while all the rest of him perishes;[^8342] that Christ had not existed in a bodily substance, and had endured a *quasi*-passion in a phantasmal shape merely; that a resurrection of the flesh there will by no means be." },
  { t = "note", id = "8340", text = "Inn*a*scibilem;” but Fr. Junius’ conjecture, “inn*o*scibilem,” is agreeable to the Greek “ἄγνωστος.”" },
  { t = "note", id = "8341", text = "Mundum." },
  { t = "note", id = "8342", text = "The text here is partially conjectural, and if correct, clumsy. For the sense, see *de Anima*, c. xxiii. *ad init*." },
  { t = "p", text = "Afterwards broke out the heretic Basilides. He affirms that there is a supreme Deity, by name Abraxas,[^8343] by whom was created Mind, which in Greek he calls Νοῦς; that thence sprang the Word; that of Him issued Providence, Virtue,[^8344] and Wisdom; that out of these subsequently were made Principalities, powers,[^8345] and Angels; that there ensued infinite issues and processions of angels; that by these angels 365 heavens were formed, and the world,[^8346] in honour of Abraxas, whose name, if computed, has in itself this number. Now, among the last of the angels, those who made this world,[^8347] he places the God of the Jews latest, that is, the God of the Law and of the Prophets, whom he denies to be a God, but affirms to be an angel. To him, he says, was allotted the seed of Abraham, and accordingly he it was who transferred the sons of Israel from the land of Egypt into the land of Canaan; affirming him to be turbulent above the other angels, and accordingly given to the frequent arousing of seditions and wars, yes, and the shedding of human blood. Christ, moreover, he affirms to have been sent, not by this maker of the world,[^8348] but by the above-named Abraxas; and to have come in a phantasm, and been destitute of the substance of flesh: that it was not He who suffered among the Jews, but that Simon[^8349] was crucified in His stead: whence, again, there must be no believing on him who was crucified, lest one confess to having believed on Simon. Martyrdoms, he says, are not to be endured. The resurrection of the flesh he strenuously impugns, affirming that salvation has not been promised to *bodies*." },
  { t = "note", id = "8343", text = "Or, Abraxes, or Abrasax." },
  { t = "note", id = "8344", text = "Or, Power." },
  { t = "note", id = "8345", text = "Potestates." },
  { t = "note", id = "8346", text = "Mundum." },
  { t = "note", id = "8347", text = "Mundum." },
  { t = "note", id = "8348", text = "Mundum." },
  { t = "note", id = "8349", text = "i.e. probably “Simon the Cyrenian.” See Matt. xxvii. 32; Mark xv. 21; Luke xxiii. 26." },
  { t = "p", text = "A brother heretic[^8350] emerged in Nicolaus. He was one of the seven deacons who were appointed in the Acts of the Apostles.[^8351] He affirms that Darkness was seized with a concupiscence—and, indeed, a foul and obscene one—after Light: out of this permixture it is a shame to say what fetid and unclean (combinations arose). The rest (of his tenets), too, are obscene. For he tells of certain Æons, sons of turpitude, and of conjunctions of execrable and obscene embraces and permixtures,[^8352] and certain yet baser outcomes of these. He teaches that there were born, moreover, dæmons, and gods, and spirits seven, and other things sufficiently sacrilegious. alike and foul, which we blush to recount, and at once pass them by. Enough it is for us that this heresy of the Nicolaitans has been condemned by the Apocalypse of the Lord with the weightiest authority attaching to a sentence, in saying “Because this thou holdest, thou hatest the doctrine of the Nicolaitans, which I too hate.”[^8353]" },
  { t = "note", id = "8350", text = "Alter hæreticus. But Fr. Junius suggests “aliter.”" },
  { t = "note", id = "8351", text = "See Acts vi. 1–6. [But the identity is doubtful.]" },
  { t = "note", id = "8352", text = "So Oehler gives in his text. But his suggestion, given in a note, is perhaps preferable: “and of execrable embraces and permixtures, and obscene conjunctions.”" },
  { t = "note", id = "8353", text = "See Rev. ii. 6." },
]

[[section]]
id = "ophites-cainites-sethites"
title = "Ophites, Cainites, Sethites."
level = 1
blocks = [
  { t = "p", text = "Chapter II.—Ophites, Cainites, Sethites." },
  { t = "p", text = "To these are added those heretics likewise who are called *Ophites*:[^8354] for they magnify the serpent to such a degree, that they prefer him even to Christ Himself; for it was he, they say, who gave us the origin of the knowledge of good and of evil.[^8355] His power and majesty (they say) Moses perceiving, set up the brazen serpent; and whoever gazed upon him obtained health.[^8356] Christ Himself (they say further) in His gospel imitates Moses’ serpent’s sacred power, in saying: “And as Moses upreared the serpent in the desert, so it behoveth the Son of man to be upreared.”[^8357] Him they introduce to bless their eucharistic (elements).[^8358] Now the whole parade and doctrine of this error flowed from the following source. They say that from the supreme primary Æon *whom men speak of*[^8359] there emanated several other inferior Æons. To all these, however, there opposed himself an Æon who name is *Ialdabaoth*.[^8360] He had been conceived by the permixture of a second Æon with inferior Æons; and afterwards, when he[^8361] had been desirous of forcing his way into the higher regions, had been disabled by the permixture of the gravity of matter with himself to arrive at the higher regions; had been left in the midst, and had extended himself to his full dimensions, and thus had made the sky.[^8362] *Ialdabaoth*, however, had descended lower, and had made him seven sons, and had shut from their view the upper regions by self-distension, in order that, since (these) angels could not know what was above,[^8363] they might think him the sole God. These inferior Virtues and angels, therefore, had made *man*; and, because he had been originated by weaker and mediocre powers, he lay crawling, worm-like. That Æon, however, out of which *Ialdaboath* had proceeded, moved to the heart with envy, had injected into man as he lay a certain spark; excited whereby, he was through prudence to grow wise, and be able to understand the things above. So, again, the *Ialdaboath* aforesaid, turning indignant, had emitted out of himself the Virtue and similitude of *the serpent*; and this had been the Virtue in paradise—that is, this had been the *serpent*—whom Eve had believed as if he had been God the Son.[^8364] He[^8365] plucked, say they, from the fruit of the tree, and thus conferred on mankind the knowledge of things good and evil.[^8366] Christ, moreover, existed not in substance of flesh: salvation of the flesh is not to be hoped for at all." },
  { t = "note", id = "8354", text = "Or, “Serpentarians,” from ὄφις, a serpent." },
  { t = "note", id = "8355", text = "See Gen. iii. 1–7." },
  { t = "note", id = "8356", text = "See Num. xxi. 4–9." },
  { t = "note", id = "8357", text = "John iii. 14." },
  { t = "note", id = "8358", text = "Eucharistia (neut. pl.) = εὐχαριστεῖα (Fr. Junius in Oehler): perhaps “*the place in which* they celebrate the eucharist.”" },
  { t = "note", id = "8359", text = "These words are intended to give the force of the “illo” of the original." },
  { t = "note", id = "8360", text = "Roberston (*Ch. Hist.* i. p. 39, note 2, ed. 2. 1858) seems to take this word to mean “Son of Darkness or Chaos.”" },
  { t = "note", id = "8361", text = "“Seque” Oehler reads here, which appears bad enough Latin, unless his “se” after “extendisse” is an error." },
  { t = "note", id = "8362", text = "Or, “heaven.”" },
  { t = "note", id = "8363", text = "Or, “what the upper regions were.”" },
  { t = "note", id = "8364", text = "Filio Deo." },
  { t = "note", id = "8365", text = "Or, “she;” but perhaps the text is preferable." },
  { t = "note", id = "8366", text = "See Gen. iii. 1–7." },
  { t = "p", text = "Moreover, also, there has broken out another heresy also, which is called that of the *Cainites*.[^8367] And the reason is, that they magnify Cain as if he had been conceived of some potent Virtue which operated in him; for Abel had been procreated after being conceived of an inferior Virtue, and accordingly had been found inferior. They who assert this likewise defend the traitor Judas, telling us that he is admirable and great, because of the advantages he is vaunted to have conferred on mankind; for some of them think that thanksgiving is to be rendered to Judas on this account: viz., Judas, they say, observing that Christ wished to subvert the truth, betrayed Him, in order that there might be no possibility of truth’s being subverted. And others thus dispute against them, and say: Because the powers of this world[^8368] were unwilling that Christ should suffer, lest through His death salvation should be prepared for mankind, he, consulting for the salvation of mankind, betrayed Christ, in order that there might be no possibility at all of the salvation being impeded, which *was* being impeded through the Virtues which were opposing Christ’s passion; and thus, through the passion of Christ, there might be no possibility of the salvation of mankind being retarded." },
  { t = "note", id = "8367", text = "See *de Bapt.* c. i." },
  { t = "note", id = "8368", text = "Mundi." },
  { t = "p", text = "But, again, the heresy has started forth which is called that of the *Sethites*.[^8369] The doctrine of this perversity is as follows. Two human beings were formed by the angels—Cain and Abel. On their account arose great contentions and discords among the angels; for this reason, that Virtue which was above all the Virtues—which they style the Mother—when they said[^8370] that Abel had been slain, willed this Seth of theirs to be conceived and born in place of Abel, in order that those angels might be escheated who had created those two former human beings, while this pure seed rises and is born. For they say that there had been iniquitous permixtures of two angels and human beings; for which reason that Virtue which (as we have said) they style the Mother brought on the deluge even, for the purpose of vengeance, in order that that seed of permixture might be swept away, and this only seed which was pure be kept entire. But (in vain): for they who had originated those of the former seed sent into the ark (secretly and stealthily, and unknown to that Mother-Virtue), together with those “eight souls,”[^8371] the seed likewise of Ham, in order that the seed of evil should not perish, but should, together with the rest, be preserved, and after the deluge be restored to the earth, and, by example of the rest, should grow up and diffuse itself, and fill and occupy the whole orb.[^8372] Of Christ, moreover, their sentiments are such that they call Him merely Seth, and say that He was instead of the actual Seth." },
  { t = "note", id = "8369", text = "Or, Sethoites." },
  { t = "note", id = "8370", text = "“Dicerent;” but Routh (I think) has conjectured “disceret” “when *she learned*,” etc., which is very simple and apt." },
  { t = "note", id = "8371", text = "See 1 Pet. iii. 20." },
  { t = "note", id = "8372", text = "Cf. Gen. ix. 1, 2, 7, 19." },
]

[[section]]
id = "carpocrates-cerinthus-ebion"
title = "Carpocrates, Cerinthus, Ebion."
level = 1
blocks = [
  { t = "p", text = "Chapter III.—Carpocrates, Cerinthus, Ebion." },
  { t = "p", text = "Carpocrates, furthermore, introduced the following sect. He affirms that there is one Virtue, the chief among the upper (regions): that out of this were produced angels and Virtues, which, being far distant from the upper Virtues, created this world[^8373] in the lower regions: that Christ was not born of *the Virgin* Mary, but was generated—a mere human being—of the seed of Joseph, superior (they admit) above all others in the practice of righteousness and in integrity of life; that He suffered among the Jews; and that His soul alone was received in heaven as having been more firm and hardy than all others: whence he would infer, retaining only the salvation of souls, that there are no resurrections of the body." },
  { t = "note", id = "8373", text = "Mundum." },
  { t = "p", text = "After him brake out the heretic Cerinthus, teaching similarly. For he, too, says that the world[^8374] was originated by those *angels*;[^8375] and sets forth Christ as born of the seed of Joseph, contending that He was merely human, without divinity; affirming also that the Law was given by angels;[^8376] representing the God of the Jews as not the Lord, but an angel." },
  { t = "note", id = "8374", text = "Mundum." },
  { t = "note", id = "8375", text = "“Ab illis” is perhaps an error for “ab angelis,” by absorption of the first syllable. So Routh has conjectured before me." },
  { t = "note", id = "8376", text = "“*Ab* angelis:” an erroneous notion, which professed probably to derive support from John i. 17, Acts vii. 53, Gal. iii. 19, where, however, the Greek prepositions should be carefully noted, and ought in no case to be rendered by “ab.”" },
  { t = "p", text = "His successor was Ebion,[^8377] not agreeing with Cerinthus in every point; in that he affirms the world[^8378] to have been made by God, not by angels; and because it is written, “No disciple above *his* master, nor servant above *his* lord,”[^8379] sets forth likewise the law *as binding*,[^8380] of course for the purpose of excluding the gospel and vindicating Judaism." },
  { t = "note", id = "8377", text = "*Al*. Hebion." },
  { t = "note", id = "8378", text = "*Al*. Hebion." },
  { t = "note", id = "8379", text = "See Matt. x. 24; Luke iv. 40; John xiii. 16." },
  { t = "note", id = "8380", text = "i.e., as Rig.’s quotation from Jerome’s *Indiculus* (in Oehler) shows, “because in so far as, Christ observed it.”" },
]

[[section]]
id = "valentinus-ptolemy-and-secundus-heracleon"
title = "Valentinus, Ptolemy and Secundus, Heracleon."
level = 1
blocks = [
  { t = "p", text = "Chapter IV.—Valentinus, Ptolemy and Secundus, Heracleon." },
  { t = "p", text = "Valentinus the heretic, moreover, introduced many fables. These I will retrench and briefly summarize. For he introduces the Pleroma and the thirty Æons. These Æons, moreover, he explains in the way of syzygies, that is, conjugal unions[^8381] of some kind. For among the first,[^8382] he says, were Depth[^8383] and Silence; of these proceeded Mind and Truth; out of whom burst the Word and Life; from whom, again, were created Man[^8384] and the Church. But (these are not all); for of these last also proceeded twelve Æons; from Speech,[^8385] moreover, and Life *proceeded* other ten Æons: such is the Triacontad of Æons, which is made up in the Pleroma of an ogdoad, a decad, and a duodecad. The thirtieth Æon, moreover, willed to see the great Bythus; and, to see him, had the hardihood to ascend into the upper regions; and not being capable of seeing his magnitude, desponded,[^8386] and almost suffered dissolution, had not some one,—he whom he calls Horos, to wit,—sent to invigorate him, strengthened him by pronouncing the word “Iao.”[^8387] This Æon, moreover, which was thus reduced to despondency, he calls Achamoth, (and says) that he was seized with certain regretful passions, and out of his passions gave birth to material essences.[^8388] For he was panic-stricken, he says, and terror-stricken, and overcome with sadness; and of these passions he conceived and bare. Hence he made the heaven, and the earth, and the sea, and whatever is in them: for which cause all things made by him are infirm, and frail, and capable of falling, and mortal, inasmuch as he himself was conceived and produced from despondency. He, however, originated this world[^8389] out of those material essences which Achamoth, by his panic, or terror, or sadness, or sweat, had supplied. For of his panic, he says, was made darkness; of his fear and ignorance, the spirits of wickedness and malignity; of his sadness and tears, the humidities of founts, the material essence of floods and sea. Christ, moreover, was sent by that First-Father who is Bythus. He, moreover, was not in the substance of our flesh; but, bringing down from heaven some spiritual body or other, passed through the Virgin Mary as water through a pipe, neither receiving nor borrowing aught thence. The resurrection of our present flesh he denies, but (maintains that) of some sister-flesh.[^8390] Of the Law and the prophets some parts he approves, some he disapproves; that is, he disapproves all in reprobating some. A Gospel of his own he likewise has, beside these of ours." },
  { t = "note", id = "8381", text = "Conjugationes. Cowper uses our word “conjugation” in this sense in one of his humorous pieces. [“Pairing-time.”] The “*syzygies*” consisted of one male and one female Æon each." },
  { t = "note", id = "8382", text = "Oehler separates “in primis;” but perhaps they ought to be united—“inprimis,” or “imprimis”—and taken as =\"primo ab initio.”" },
  { t = "note", id = "8383", text = "Bythus." },
  { t = "note", id = "8384", text = "Hominem." },
  { t = "note", id = "8385", text = "“Sermone:” he said “Verbum” before." },
  { t = "note", id = "8386", text = "In defectione fuisse." },
  { t = "note", id = "8387", text = "Cf. *adv. Valent.* cc. x. xiv. [Routh says that this IAO (see note 8) is wanting in the older editions. It was borrowed from the *Adv. Valentin.* to eke out a defect.]" },
  { t = "note", id = "8388", text = "Such appears to be the meaning of this sentence as Oehler gives it. But the text is here corrupt; and it seems plain there must either be something lost relating to this “Achamoth,” or else some capital error in the reading, or, thirdly, some gross and unaccountable confusion in the writer: for the sentence as it stands is wholly irreconcilable with what follows. It evidently makes “Achamoth” identical with “the thirtieth Æon” above-named; and yet, without introducing any fresh subject, the writer goes on to state that this despondent Œon, who “conceived and bare,” was itself the offspring of despondency, and made an infirm world out of the infirm materials which “Achamoth” supposed it with. Now it is apparent from other sources—as, for instance, from *Tert. adv. Valentin*, above referred to—that the “thirtieth Æon” was supposed to be *female*, *Sophia* (Wisdom) by name, and that she was said to be *the parent* of “Achamoth,” or “Enthymesis” (see *adv. Valentin.* cc. ix. x. xi. xiv. xxv.), while “Achamoth” herself appears by some accounts to be also called κάτω Σοφία. The name “Achamoth” itself, which Tertullian (*adv. Valentin.* c. xiv. *ad init.*) calls an “uninterpretable name,” is believed to be a representation of a Hebrew word meaning “wisdom;” and hence, possibly, some of the confusion may have arisen,—from a promiscuous use, namely, of the titles “Achamoth” and “Sophia.” Moreover, it would appear that some words lower down as to the production by “Achamoth” of “Demiurgus,” must have dropped out. Unless these two omissions be supplied, the passage is wholly unintelligible. Can the fact that the Hebrew word which “Achamoth” represents is a *fem. pl.* in any way explain this confused medley, or help to reconcile conflicting accounts? The ἄνω and κάτω Σοφία seem to point in some degree to some such solution of some of the existing difficulties. “Iao,” again, is a word which has cause much perplexity. Can it possibly be connected with ἰάομαι, “to heal?” [See note 8.]" },
  { t = "note", id = "8389", text = "Mundum." },
  { t = "note", id = "8390", text = "Oehler’s suggestion is to vary the pointing so as to give this sense: “The resurrection of this flesh he denies. But of a sister-Law and prophets,” etc. But this seems even more harsh than the other." },
  { t = "p", text = "After him arose the heretics Ptolemy and Secundus, who agree throughout with Valentinus, differing only in the following point: viz., whereas Valentinus had feigned but thirty Æons, they have added several more; for they first added four, and subsequently four more. And Valentine’s assertion, that it was the thirtieth Æon which strayed out from the Pleroma, (as *falling* into despondency,) they deny; for the one which desponded on account of disappointed yearning to see the First-Father was not of the original triacontad, they say." },
  { t = "p", text = "There arose, besides, Heracleon, a brother[^8391]-heretic, whose sentiments pair with Valentine’s; but, by some novelty of terminology, he is desirous of seeming to differ in sentiment. For he introduces the notion that there existed first what he terms (a Monad);[^8392] and then out of that Monad (arose) two, and then the rest of the Æons. Then he introduces the whole *system of* Valentine." },
  { t = "note", id = "8391", text = "“Alter,” i.e., perhaps another *of the same class*." },
  { t = "note", id = "8392", text = "It seems almost necessary to supply some word here; and as “Monade” follows, it seemed simple to supply “Monada.”" },
]

[[section]]
id = "marcus-and-colarbasus"
title = "Marcus and Colarbasus."
level = 1
blocks = [
  { t = "p", text = "Chapter V.—Marcus and Colarbasus." },
  { t = "p", text = "After these there were not wanting a Marcus and a Colarbasus, composing a novel heresy out of the Greek alphabet. For they affirm that without those letters truth cannot be found; nay more, that in those letters the whole plenitude and perfection of truth is comprised; for this was why Christ said, “I am the Alpha and the Omega.”[^8393] In fact, they say that Jesus Christ descended,[^8394] that is, that *the dove* came down on Jesus;[^8395] and, since the dove is styled by the Greek name περιστερά —(*peristera*), it has in itself this number DCCCI.[^8396] These men run through their Ω, Ψ, Χ, Φ, Υ, Τ—through the whole alphabet, indeed, up to Α and Β—and compute ogdoads and decads. So we may grant it useless and idle to recount all their trifles. What, however, must be allowed not merely vain, but likewise dangerous, is this: they feign a second God, beside the Creator; they affirm that Christ was not in the substance of flesh; they say there is to be no resurrection of the flesh." },
  { t = "note", id = "8393", text = "See Rev. i. 7; xxi. 6; xxii. 13." },
  { t = "note", id = "8394", text = "Denique Jesum Christum descendisse. So Oehler, who does not notice any conjectural emendation, or various reading, of the words. If correct, his reading would refer to the views of a twofold Jesus Christ—a real and a phantasmal one—held by docetic Gnostics, or to such views as Valentine’s, in whose system, so far as it is ascertainable from the confused and discrepant account of it, there would appear to have been one Æon called Christ, another called Jesus, and a human person called Jesus and Christ, with whom the true Jesus associated Himself. Some such jumble of ideas the two heretics now under review would seem to have held, if Oehler’s be the true reading. But the difficulties are somewhat lessened if we accept the very simple emendation which naturally suggests itself, and which, I see, Semler has proposed and Routh inclines to receive, “*in* Jesum Christum descendisse,” i.e. “that Christ descended *on* Jesus.”" },
  { t = "note", id = "8395", text = "See Matt. iii. 13–17; Mark i. 9–11; Luke iii. 21–22; John i. 29–34." },
  { t = "note", id = "8396", text = "Habere *secum* numerum DCCCI. So Oehler, after Jos. Scaliger, who, however, seems to have read “*secum hunc* numerum,” for the ordinary reading, “habere *secundum* numerum,” which would mean, “represents, *in the way of* numerical value, DCCCI.”" },
]

[[section]]
id = "cerdo-marcion-lucan-apelles"
title = "Cerdo, Marcion, Lucan, Apelles."
level = 1
blocks = [
  { t = "p", text = "Chapter VI.—Cerdo, Marcion, Lucan, Apelles." },
  { t = "p", text = "To this is added one Cerdo. He introduces two first causes,[^8397] that is, two Gods—one good, the other cruel:[^8398] the good being the superior; the latter, the cruel one, being the creator of the world.[^8399] He repudiates the prophecies and the Law; renounces God the Creator; maintains that Christ who came was the Son of the superior God; affirms that He was not in the substance of flesh; states Him to have been only in a phantasmal shape, to have not really suffered, but undergone a quasipassion, and not to have been born of a virgin, *nay*, really not to have been born at all. A resurrection of the soul merely does he approve, denying that of the body. The Gospel of Luke alone, and that not entire, does he receive. Of the Apostle Paul he takes neither all the epistles, nor in their integrity. The Acts of the Apostles and the Apocalypse he rejects as false." },
  { t = "note", id = "8397", text = "Initia duo." },
  { t = "note", id = "8398", text = "Sævum." },
  { t = "note", id = "8399", text = "Mundi." },
  { t = "p", text = "After him emerged a disciple of his, one Marcion by name, a native of Pontus,[^8400] son of a bishop, excommunicated because of a rape committed on a certain virgin.[^8401] He, starting from the fact that it is said, “Every good tree beareth good fruit, but an evil evil,”[^8402] attempted to approve the heresy of Cerdo; so that his assertions are identical with those of the former heretic before him." },
  { t = "note", id = "8400", text = "“Ponticus genere,” lit. “a Pontic *by race*,” which of course may not necessarily, like our *native*, imply actual *birth* in Pontus. [Note—“son of a bishop:” an index of early date, though not necessarily Ante-Nicene. A mere forgery of later origin would have omitted it.]" },
  { t = "note", id = "8401", text = "Rig., with whom Oehler agrees, reminds us that neither in the *de Præscr.* nor in the *adv. Marc.*, nor, apparently, in Irenæus, is any such statement brought forward." },
  { t = "note", id = "8402", text = "See Matt. vii. 17." },
  { t = "p", text = "After him arose one Lucan by name, a follower and disciple of Marcion. He, too, wading through the same kinds of blasphemy, teaches the same as Marcion and Cerdo had taught." },
  { t = "p", text = "Close on their heels follows Apelles, a disciple of Marcion, who after lapsing, into his own carnality,[^8403] was severed from Marcion. He introduces one God in the infinite upper regions, and states that He made many powers and angels; beside Him, withal, another Virtue, which he affirms to be called Lord, but represents as an angel. By him he will have it appear that the world[^8404] was originated in imitation of a superior world.[^8405] With this *lower* world he mingled throughout (a principle of) repentance, because he had not made it so perfectly as that superior world had been originated. The Law and the prophets he repudiates. Christ he neither, like Marcion, affirms to have been in a phantasmal shape, nor yet in substance of a true body, as the Gospel teaches; but says, because He descended from the upper regions, that in the course of His descent He wove together for Himself a starry and airy[^8406] flesh; and, in His resurrection, restored, in the course of His ascent, to the several individual elements whatever had been borrowed in His descent: and thus—the several parts of His body dispersed—He reinstated in heaven His spirit only. This man denies the resurrection of the flesh. He uses, too, one only apostle; but that is Marcion’s, that is, a mutilated one. He teaches the salvation of souls alone. He has, besides, private but extraordinary lections of his own, which he calls “Manifestations”[^8407] of one Philumene,[^8408] a girl whom he follows as a prophetess. He has, besides, his own books, which he has entitled *books* of Syllogisms, in which he seeks to prove that whatever Moses has written about God is not true, but is false." },
  { t = "note", id = "8403", text = "See *de Præscr.* c. xxx., and comp. with it what is said of Marcion above." },
  { t = "note", id = "8404", text = "Mundum." },
  { t = "note", id = "8405", text = "Mundi." },
  { t = "note", id = "8406", text = "“Aëream,” i.e., composed of the air, the *lower* air, or atmosphere; not “aetheream,” of the *upper* air, or ether." },
  { t = "note", id = "8407", text = "Phaneroseis. Oehler refers to *de Præscr.* c. xxx. *q. v.*" },
  { t = "note", id = "8408", text = "φιλουμένη, “loved one.”" },
]

[[section]]
id = "tatian-cataphrygians-cataproclans-catschinetans"
title = "Tatian, Cataphrygians, Cataproclans, Catæschinetans."
level = 1
blocks = [
  { t = "p", text = "Chapter VII.—Tatian, Cataphrygians, Cataproclans, Catæschinetans." },
  { t = "p", text = "To all these heretics is added one Tatian, a brother-heretic. This man was Justin Martyr’s disciple. After Justin’s death he began to cherish different opinions from his. For he wholly savours of Valentinus; adding this, that Adam cannot even attain salvation: as if, when the branches become salvable,[^8409] the root were not!" },
  { t = "note", id = "8409", text = "Salvi. Perhaps if it be questionable whether this word may be so rendered in a correct Latinist, it may be lawful to render it so in so incorrect a one as our present author." },
  { t = "p", text = "Other heretics swell the list who are called Cataphrygians, but their teaching is not uniform. For there are (of them) *some* who are called Cataproclans;[^8410] there are others who are termed Catæschinetans.[^8411] These have a blasphemy common, and a blasphemy not common, but peculiar and special. The common blasphemy lies in their saying that the Holy Spirit was in the apostles indeed, the Paraclete was not; and in their saying that the Paraclete has spoken in Montanus more things than Christ brought forward into (the compass of) the Gospel, and not merely more, but likewise better and greater. But the particular one they who follow Æschines have; this, namely, whereby they add this, that they affirm Christ to be Himself Son and Father." },
  { t = "note", id = "8410", text = "i.e. followers of Proclus." },
  { t = "note", id = "8411", text = "i.e. followers of Æschines. So this writer takes “Cataphryges” to mean followers of the Phrygians.”" },
]

[[section]]
id = "blastus-two-theodoti-praxeas"
title = "Blastus, Two Theodoti, Praxeas."
level = 1
blocks = [
  { t = "p", text = "Chapter VIII.—Blastus, Two Theodoti, Praxeas." },
  { t = "p", text = "In addition to all these, there is likewise Blastus, who would latently introduce Judaism. For he says the passover is not to be kept otherwise than according to the law of Moses, on the fourteenth of the month. But who would fail to see that evangelical grace is escheated if he recalls Christ to the Law?" },
  { t = "p", text = "Add to these Theodotus the Byzantine, who, after being apprehended for Christ’s Name, and apostatizing,[^8412] ceased not to blaspheme against Christ. For he introduced a doctrine by which to affirm that Christ was merely a human being, but deny His deity; teaching that He was born of the Holy Spirit indeed of a virgin, but was a solitary and bare human being,[^8413] with no pre-eminence above the rest (of mankind), but only that of righteousness." },
  { t = "note", id = "8412", text = "Negavit. See *de Idol.* c. xxiii. note 1." },
  { t = "note", id = "8413", text = "Hominem solitarium atque nudum. The words seems to mean, destitute of anything *super*human." },
  { t = "p", text = "After him brake out a second heretical Theodotus, who again himself introduced a sister-sect, and says that the human being Christ Himself[^8414] was merely conceived alike, and born, of the Holy Spirit and the Virgin Mary, but that He was inferior to Melchizedek; because it is said of Christ, “Thou art a priest unto eternity, after the order of Melchizedek.”[^8415] For that Melchizedek, he says, was a heavenly Virtue of pre-eminent grace; in that Christ acts for human beings, being made their Deprecator and Advocate: Melchizedek does so[^8416] for heavenly angels and Virtues. For to such a degree, he says, is he better than Christ, that he is ἀπάτωρ (fatherless), ἀμήτωρ (motherless), ἀγενεαλογητον (without genealogy), of whom neither the beginning nor the end has been comprehended, nor can be comprehended.[^8417]" },
  { t = "note", id = "8414", text = "Et ips*um* hominem Christum tantummodo. I rather incline to read, as in the preceding sentence, “et ip*se*”: “and himself affirms Christ to have been merely human, conceived alike,” etc." },
  { t = "note", id = "8415", text = "See Ps. cx. 4, and the references there." },
  { t = "note", id = "8416", text = "The Latin here is very careless, unless, with Routh, we suggest “et” for “eo,” and render: “and that what Christ does,” etc., “Melchizedek does,” etc." },
  { t = "note", id = "8417", text = "See Heb. vii. 1–3." },
  { t = "p", text = "But after all these, again, one Praxeas introduced a heresy which Victorinus[^8418] was careful to corroborate. He asserts that Jesus Christ is God the Father Almighty. Him he contends to have been crucified, and suffered, and died; beside which, with a profane and sacrilegious temerity, he maintains the proposition that He is Himself sitting at His own right hand.[^8419]" },
  { t = "note", id = "8418", text = "Who he is, no one knows. Oehler (following the lead of Fabricius on Philaster, cap. 49, p. 102) believes the name to be a mistake for Victor, a bishop of Rome, who (see *Adv. Prax.* c. i.) had held the episcopate when Praxeas was there. His successor was Zephyrinus; and it is an ingenious conjecture of Oehler, that these two names, the one written as a correction of the other, may have been confused: thus, Victor/Zephrynus; and thus of the two may have been made Victorinus." },
  { t = "note", id = "8419", text = "The form and order of the words here used are certainly remarkably similar to the expressions and order of the “Apostles’ Creed.”" },
]

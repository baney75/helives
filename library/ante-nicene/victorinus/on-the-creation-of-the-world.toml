  { t = "note", id = "2212", text = "Probably “knowledge.”" },
  { t = "note", id = "2213", text = "Isa. xi. 2, 3." },
  { t = "note", id = "2214", text = "Or, “the rivers are spread abroad.”" },
  { t = "note", id = "2215", text = "Trabes. [There is no proof of seven heavens in Scripture.]" },
  { t = "note", id = "2216", text = "Coma horribilis curabitur." },
  { t = "note", id = "2217", text = "Ps. xlv. 1 [Vol. i. p. 213, this series.]" },
  { t = "note", id = "2218", text = "John i. 1, 2, 3." },
  { t = "note", id = "2219", text = "1 Cor. xv. 45–47." },
  { t = "p", text = "Behold the seven horns of the Lamb,[^2220] the seven eyes of God[^2221]—the seven eyes are the seven spirits of the Lamb;[^2222] seven torches burning before the throne of God[^2223] seven golden candlesticks,[^2224] seven young sheep,[^2225] the seven women in Isaiah,[^2226] the seven churches in Paul,[^2227] seven deacons,[^2228] seven angels,[^2229] seven trumpets,[^2230] seven seals to the book, seven periods of seven days with which Pentecost is completed, the seven weeks in Daniel,[^2231] also the forty-three weeks in Daniel;[^2232] with Noah, seven of all clean things in the ark;[^2233] seven revenges of Cain,[^2234] seven years for a debt to be acquitted,[^2235] the lamp with seven orifices,[^2236] seven pillars of wisdom in the house of Solomon.[^2237]" },
  { t = "note", id = "2220", text = "Rev. v. 6." },
  { t = "note", id = "2221", text = "Zech. iv. 10." },
  { t = "note", id = "2222", text = "Rev. iv. 5." },
  { t = "note", id = "2223", text = "Rev. iv. 5." },
  { t = "note", id = "2224", text = "Rev. i. 13." },
  { t = "note", id = "2225", text = "Lev. xxiii. 18." },
  { t = "note", id = "2226", text = "Isa. iv. 1." },
  { t = "note", id = "2227", text = "Acts vi. 3?. [This is how the footnote in the print edition is worded. The only verse in the Bible that lists the seven churches is Rev. i. 11.]" },
  { t = "note", id = "2228", text = "Acts vi. 3." },
  { t = "note", id = "2229", text = "Rev. passim." },
  { t = "note", id = "2230", text = "Josh. vi.; Rev. viii." },
  { t = "note", id = "2231", text = "Dan. ix. 25" },
  { t = "note", id = "2232", text = "Dan. ix." },
  { t = "note", id = "2233", text = "Gen. vii. 2" },
  { t = "note", id = "2234", text = "Gen. iv. 15." },
  { t = "note", id = "2235", text = "Deut. xv. 1." },
  { t = "note", id = "2236", text = "Zech. iv. 2." },
  { t = "note", id = "2237", text = "Prov. xi. 1." },
  { t = "p", text = "Now, therefore, you may see that it is being told you of the unerring glory of God in providence; yet, as far as my small capacity shall be able, I will endeavour to set it forth. That He might re-create that Adam by means of the week, and bring aid to His entire creation, was accomplished by the nativity of His Son Jesus Christ our Lord. Who, then, that is taught in the law of God, who that is filled with the Holy Spirit, does not see in his heart, that on the same day on which the dragon seduced Eve, the angel Gabriel brought the glad tidings to the Virgin Mary; that on the same day the Holy Spirit overflowed the Virgin Mary, on which He made light; that on that day He was incarnate in flesh, in which He made the land and water; that on the same day He was put to the breast, on which He made the stars; that on the same day He was circumcised,[^2238] on which the land and water brought forth their offspring; that on the same day He was incarnated, on which He formed man out of the ground; that on the same day Christ was born, on which He formed man; that on that day He suffered, on which Adam fell; that on the same day He rose again from the dead, on which He created light? He, moreover, consummates His humanity in the number seven: of His nativity, His infancy, His boyhood, His youth, His young-manhood, His mature age, His death. I have also set forth His humanity to the Jews in these manners: since He is hungry, is thirsty; since He gave food and drink; since He walks, and retired; since He slept upon a pillow;[^2239] since, moreover, He walks upon the stormy seas with His feet, He commands the winds, He cures the sick and restores the lame, He raises the blind by His speech,[^2240]—see ye that He declares Himself to them to be the Lord." },
  { t = "note", id = "2238", text = "Ea die in sanguine." },
  { t = "note", id = "2239", text = "Mark iv. 38." },
  { t = "note", id = "2240", text = "“He makes the deaf to hear, and recalls the dead:” this is inserted conjecturally by Routh." },
  { t = "p", text = "The day, as I have above related, is divided into two parts by the number twelve—by the twelve hours of day and night; and by these hours too, months, and years, and seasons, and ages are computed. Therefore, doubtless, there are appointed also twelve angels of the day and twelve angels of the night, in accordance, to wit, with the number of hours. For these are the twenty-four witnesses of the days and nights[^2241] which sit before the throne of God, having golden crowns on their heads, whom the Apocalypse of John the apostle and evangelist calls elders, for the reason that they are older both than the other angels and than men." },
  { t = "note", id = "2241", text = "Rev. iv. 4." },
]

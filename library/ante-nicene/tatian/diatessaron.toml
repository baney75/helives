  { t = "note", id = "1326", text = "John vi. 15." },
  { t = "p", text = "[47, 48][^1327]And when the nightfall was near, his disciples went down unto the sea, and sat[^1328] in a boat, and came to the side of Capernaum.[^1329]And the darkness came on, and Jesus [49] had not come to them.[^1330]And the sea was stirred up against them by reason of a violent [50] wind that blew.[^1331]And the boat was distant from the land many furlongs, and they were much damaged by the waves, and the wind was against them." },

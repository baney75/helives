  { t = "note", id = "2307", text = "*cf*. Syriac versions." },
  { t = "note", id = "2308", text = "Matt. xxi. 42a." },
  { t = "p", text = "The stone which the builders declared to be base," },
  { t = "p", text = "[^2309]The same came to be at the head of the corner:" },
  { t = "note", id = "2309", text = "Luke xx. 17b." },
  { t = "p", text = "[56][^2310]From God was this," },
  { t = "note", id = "2310", text = "Matt. xxi. 42c." },
  { t = "p", text = "And it is wonderful in our eyes?" },
  { t = "p", text = "[57][^2311]Therefore I say unto you, The kingdom of God shall be taken from you, and [58] given to a people that will produce fruit.[^2312]And whosoever falleth on this stone shall be broken in pieces: but on whomsoever it falleth, it will grind him to [59] powder.[^2313]And when the chief priests and the Pharisees heard his parables, they [60] perceived that it was concerning them he spake.[^2314]And they sought to seize him; and they feared the multitude, because they were holding to him as the prophet." },
  { t = "note", id = "2311", text = "Matt. xxi. 43." },

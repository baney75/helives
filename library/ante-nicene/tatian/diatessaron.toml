[[section]]
id = "section-28"
title = "Section XXVIII."
level = 1
blocks = [
  { t = "p", text = "Section XXVIII.[^1932]" },
  { t = "note", id = "1932", text = "On margin of Vat. ms., in another hand: “This is the beginning of the second part of *Diatessaron*, which means *The Four*.” See p. 467 of Ciasca’s Essay, mentioned above (Introduction, 5)." },
  { t = "p", text = "[1, 2] [Arabic, p. 107 ][^1933]And at that time the feast of tabernacles of the Jews drew near.[^1934]So the brethren of Jesus said unto him, Remove now hence, and go to Judæa, that [3] thy disciples may see the deeds that thou doest.[^1935] For no man doeth a thing secretly [4] and wisheth to be apparent.[^1936]If thou doest this, shew thyself to the world. For [5] up to this time not even the brethren of Jesus believed on him.[^1937]Jesus said unto them, My time till now has not arrived; but as for you, your time is alway ready. [6][^1938]It is not possible for the world to hate you; but me it hateth, for I bear witness [7] against it, that its deeds are evil.[^1939]As for you, go ye up unto this feast: but I go [8] not up now to this feast; for my time has not yet been completed.[^1940]He said this, and remained behind in Galilee." },
  { t = "note", id = "1933", text = "John vii. 2." },
  { t = "note", id = "1934", text = "John vii. 3." },
  { t = "note", id = "1935", text = "John vii. 4." },
  { t = "note", id = "1936", text = "John vii. 5." },
  { t = "note", id = "1937", text = "John vii. 6." },
  { t = "note", id = "1938", text = "John vii. 7." },
  { t = "note", id = "1939", text = "John vii. 8." },
  { t = "note", id = "1940", text = "John vii. 9." },
  { t = "p", text = "[9][^1941]But when his brethren went up unto the feast, he journeyed from Galilee, and [10] came to the borders of Judæa, to *the country* beyond Jordan;[^1942]and there came after [11] him great multitudes, and he healed them all there.[^1943]And he went out, and proceeded [12] to the feast, not openly, but as one that conceals himself.[^1944]And the Jews sought him [13] at the feast, and said, In what place is this *man?*[^1945]And there occurred much murmuring there in the great multitude that came to the feast, on his account. For [14] some said, He is good: and others said, Nay, but he leadeth the people astray.[^1946]But no man spake of him openly for fear of the Jews." },
  { t = "note", id = "1941", text = "John vii. 10a; Matt. xix. 1b." },
  { t = "note", id = "1942", text = "Matt. xix. 2." },
  { t = "note", id = "1943", text = "John vii. 10b." },
  { t = "note", id = "1944", text = "John vii. 11." },
  { t = "note", id = "1945", text = "John vii. 12." },
  { t = "note", id = "1946", text = "John vii. 13." },
  { t = "p", text = "[15] [Arabic, p. 108 ][^1947]But when the days of the feast of tabernacles were half over, Jesus went [16] up to the temple, and taught.[^1948]And the Jews wondered, and said, How doth [17] this man know writing,[^1949] seeing he hath not learned?[^1950]Jesus answered and said, My doctrine[^1951] [18] is not mine, but his that sent me.[^1952]Whoever wisheth to do his will understandeth my doctrine,[^1953] whether it be from God, or whether I speak of mine own accord. [19][^1954]Whosoever speaketh of his own accord seeketh praise for himself; but whosoever seeketh praise for him that sent him, he is true, and unrighteousness in his heart [20] there is none.[^1955]Did not Moses give you the law, and no man of you keepeth the [21] law?[^1956]Why seek ye to kill me? The multitude answered and said unto him, Thou [22] hast demons:[^1957] who seeketh to kill thee?[^1958]Jesus answered and said unto them, I did [23] one deed, and ye all marvel because of this.[^1959]Moses hath given you circumcision (not because it is from Moses, but it is from the fathers); and ye on the sabbath [24] circumcise a man.[^1960]And if a man is circumcised on the sabbath day, that the law of Moses may not be broken; are ye angry at me, because I healed on the sabbath [25] day the whole man?[^1961]Judge not with hypocrisy, but judge righteous judgement." },
  { t = "note", id = "1947", text = "John vii. 14." },
  { t = "note", id = "1948", text = "John vii. 15." },
  { t = "note", id = "1949", text = "Or, *the scripture*." },
  { t = "note", id = "1950", text = "John vii. 16." },
  { t = "note", id = "1951", text = "This word ordinarily means *knowledge*, but is used in this work in the sense of *doctrine*. The commoner form occurs perhaps only in § 50, 2." },
  { t = "note", id = "1952", text = "John vii. 17." },
  { t = "note", id = "1953", text = "This word ordinarily means *knowledge*, but is used in this work in the sense of *doctrine*. The commoner form occurs perhaps only in § 50, 2." },
  { t = "note", id = "1954", text = "John vii. 18." },
  { t = "note", id = "1955", text = "John vii. 19." },
  { t = "note", id = "1956", text = "John vii. 20." },
  { t = "note", id = "1957", text = "*cf.* § 14, 12." },
  { t = "note", id = "1958", text = "John vii. 21." },
  { t = "note", id = "1959", text = "John vii. 22." },
  { t = "note", id = "1960", text = "John vii. 23." },
  { t = "note", id = "1961", text = "John vii. 24." },
  { t = "p", text = "[26][^1962]And some people from Jerusalem said, Is not this he whom they seek to slay? [27][^1963]And lo, he discourseth with them openly, and they say nothing unto him. Think [28] you that our elders have learned that this is the Messiah indeed?[^1964]But this man is[^1965] known whence he is; and the Messiah, when he cometh, no man knoweth whence [29] he is.[^1966]So Jesus lifted up his voice as he taught in the temple, and said, Ye both know me, and know whence I am; and of my own accord am I not come, but he [30] [Arabic, p. 109 ] that sent me is true, he whom ye know not:[^1967]but I know him; for I am [31] from him, and he sent me.[^1968]And they sought to seize him: and no man [32] laid a hand on him, because his hour had not yet come.[^1969]But many of the multitude believed on him; and they said, The Messiah, when he cometh, can it be that he will do more than these signs that this *man* doeth?" },
  { t = "note", id = "1962", text = "John vii. 25." },
  { t = "note", id = "1963", text = "John vii. 26." },
  { t = "note", id = "1964", text = "John vii. 27." },
  { t = "note", id = "1965", text = "Or, *will be*." },
  { t = "note", id = "1966", text = "John vii. 28." },
  { t = "note", id = "1967", text = "John vii. 29." },
  { t = "note", id = "1968", text = "John vii. 30." },
  { t = "note", id = "1969", text = "John vii. 31." },
  { t = "p", text = "[33][^1970]And a man of that multitude said unto our Lord, Teacher, say to my brother [34] that he divide with me the inheritance.[^1971]Jesus said unto him, Man, who is it that [35] appointed me over you as a judge and divider?[^1972]And he said unto his disciples, Take heed within yourselves of all inordinate desire; for it is not in abundance of [36] possessions that life shall be.[^1973]And he gave them this parable: The ground of a [37] rich man brought forth abundant produce:[^1974]and he pondered within himself, and [38] said, What shall I do, since I have no place to store my produce?[^1975]And he said, I will do this: I will pull down the buildings of my barns, and build them, and make [39] them greater; and store there all my wheat and my goods.[^1976]And I will say to my soul, Soul, thou hast much goods laid by for many years; take thine ease, eat, [40] drink, enjoy thyself.[^1977]God said unto him, O *thou* of little intelligence, this night shall thy soul be taken from thee; and this that thou hast prepared, whose shall it [41] be?[^1978]So is he that layeth up treasures for himself, and is not rich in God." },
  { t = "note", id = "1970", text = "Luke xii. 13." },
  { t = "note", id = "1971", text = "Luke xii. 14." },
  { t = "note", id = "1972", text = "Luke xii. 15." },
  { t = "note", id = "1973", text = "Luke xii. 16." },
  { t = "note", id = "1974", text = "Luke xii. 17." },
  { t = "note", id = "1975", text = "Luke xii. 18." },
  { t = "note", id = "1976", text = "Luke xii. 19." },
  { t = "note", id = "1977", text = "Luke xii. 20." },
  { t = "note", id = "1978", text = "Luke xii. 21." },
  { t = "p", text = "[42][^1979]And while Jesus was going in the way, there came near to him a young man[^1980] of the rulers,[^1981] and fell on his knees, and asked him, and said, Good Teacher, what is [43] it that I must do that I may have eternal life?[^1982]Jesus said unto him, Why callest thou [44] me good, while there is none good but the one, *even* God?[^1983][^1984]Thou knowest the commandments.[^1985] [45][^1986]If thou wouldest enter into life, keep the commandments.[^1987] The young [Arabic, p. 110 ] man said unto him, Which of the commandments?[^1988] Jesus said unto him, [46][^1989]Thou shalt not commit adultery, Thou shalt not steal, Thou shalt not kill, Thou shalt not bear false witness, Thou shalt not do injury, Honour thy father [47] and thy mother: and, Love thy neighbour as thyself.[^1990]That young man said unto [48] him, All these have I kept from my youth: what then is it that I lack?[^1991]And Jesus [49] looked intently at him, and loved him, and said unto him,[^1992]If thou wouldest be perfect, what thou lackest is one thing:[^1993] go away and sell everything that thou hast, and give to the poor, and thou shalt have treasure in heaven: and take thy [50] cross, and follow me.[^1994]And that young man frowned at this word, and went away [51] feeling sad; for he was very rich.[^1995]And when Jesus saw his sadness, he looked towards his disciples, and said unto them, How hard it is for them that have possessions to enter the kingdom of God!" },
  { t = "note", id = "1979", text = "Mark x. 17." },
  { t = "note", id = "1980", text = "From Matthew." },
  { t = "note", id = "1981", text = "From Luke." },
  { t = "note", id = "1982", text = "Mark x. 18." },
  { t = "note", id = "1983", text = "The scribe who wrote the Vat. ms. wrote first *God, the one,* and then reversed the order by writing the Coptic letters for B and A over the words. (See above, Introduction, 5.)" },
  { t = "note", id = "1984", text = "Mark x. 19a." },
  { t = "note", id = "1985", text = "Different words." },
  { t = "note", id = "1986", text = "Matt. xix. 17b; Matt. xix. 18a." },
  { t = "note", id = "1987", text = "Different words." },
  { t = "note", id = "1988", text = "The same word as in Mark x. 19a." },
  { t = "note", id = "1989", text = "Mark x. 19b." },
  { t = "note", id = "1990", text = "Matt. xix. 19b; Matt. xix. 20." },
  { t = "note", id = "1991", text = "Mark x. 21a." },
  { t = "note", id = "1992", text = "Matt. xix. 21b." },
  { t = "note", id = "1993", text = "From Mark." },
  { t = "note", id = "1994", text = "Matt. xix. 22a; Luke xviii. 23b." },
  { t = "note", id = "1995", text = "Luke xviii. 24a; Mark x. 23." },
]

[[section]]
id = "section-29"
title = "Section XXIX."
level = 1
blocks = [
  { t = "p", text = "[1][^1996]Verily I say unto you, It is difficult for a rich man to enter the kingdom of [2] heaven.[^1997]And I say unto you also, that it is easier for a camel to enter the eye of [3] a needle, than for a rich man to enter the kingdom of God.[^1998]And the disciples were wondering at these sayings. And Jesus answered and said unto them again, My children, how hard it is for those that rely on their possessions to enter the [4] kingdom of God![^1999]And those that were listening wondered more, and said amongst [5] themselves, being agitated,[^2000] Who, thinkest thou, can be saved?[^2001]And Jesus looked at them intently, and said unto them, With men this is not possible, but with God *it is:* [6] [Arabic, p. 111 ] it is possible for God to do everything.[^2002]Simon Cephas said unto him, Lo, we have left everything, and followed thee; what is it, thinkest thou, that we [7] shall have?[^2003]Jesus said unto them, Verily I say unto you, Ye that have followed me, in the new world, when the Son of man shall sit on the throne of his glory, ye also [8] shall sit on twelve thrones, and shall judge the twelve tribes of Israel.[^2004]Verily I say unto you, No man leaveth houses, or brothers, or sisters, or father, or mother, or wife, or children, or kinsfolk, or lands, because of the kingdom of God, or for [9] my sake, and the sake of my gospel,[^2005]who shall not obtain[^2006] many times as much in this [10] time, and in the world to come inherit eternal life:[^2007]and now in this time, houses, and brothers, and sisters, and mothers, and children, and lands, with persecution; [11] and in the world to come *ever*lasting life.[^2008]Many that are first shall be last,[^2009] and that are last shall be first." },
  { t = "note", id = "1996", text = "Matt. xix. 23." },
  { t = "note", id = "1997", text = "Matt. xix. 24." },
  { t = "note", id = "1998", text = "Mark x. 24." },
  { t = "note", id = "1999", text = "Mark x. 26." },
  { t = "note", id = "2000", text = "*cf*. note, § 1, 14. Borg. MS, omits *being agitated*." },
  { t = "note", id = "2001", text = "Mark x. 27." },
  { t = "note", id = "2002", text = "Luke xviii. 28; Matt. xix. 27‹b." },
  { t = "note", id = "2003", text = "Matt. xix. 28." },
  { t = "note", id = "2004", text = "Mark x. 29b." },
  { t = "note", id = "2005", text = "Luke xviii. 30." },
  { t = "note", id = "2006", text = "Lit. *meet with*; or, *be recompensed with*." },
  { t = "note", id = "2007", text = "Mark x. 30b." },
  { t = "note", id = "2008", text = "Mark x. 31." },
  { t = "note", id = "2009", text = "The Arabic words are not so strong." },
  { t = "p", text = "[12][^2010]And when the Pharisees heard all this, because of their love for wealth they [13] scoffed at him.[^2011]And Jesus knew what was in their hearts, and said unto them, Ye are they that justify yourselves before men; while God knows your hearts: the thing that is lofty with men is base before God." },
  { t = "note", id = "2010", text = "Luke xvi. 14." },
  { t = "note", id = "2011", text = "Luke xvi. 15." },
  { t = "p", text = "[14][^2012]And he began to say, A *certain* man was rich, and wore silk and purple, and enjoyed [15] himself every day in splendour:[^2013]and there was a poor man named Lazarus, and [16] he was cast down at the door of the rich man,[^2014]afflicted with sores, and he longed to fill [Arabic, p. 112 ] his belly with the crumbs that fell from the table of that rich man; yea, [17] even[^2015] the dogs used to come and lick his sores.[^2016]And it happened that that poor man died, and the angels conveyed him into the bosom of Abraham: and the [18] rich man also died, and was buried.[^2017]And while he was being tormented in Hades, [19] he lifted up his eyes from afar, and saw Abraham with[^2018] Lazarus in his bosom.[^2019]And he called with a loud voice, and said, My father Abraham, have mercy upon me, and send Lazarus to wet the tip of his finger with water, and moisten my tongue [20] for me; for, behold, I am burned in this flame.[^2020]Abraham said unto him, My son, remember that thou receivedst thy good things in thy life, and Lazarus his afflictions: [21] but now, behold, he is at rest here, and thou art tormented.[^2021]And in addition to all this, there is between us and you a great abyss placed, so that they that would cross unto you from hence cannot, nor yet from thence do they cross unto [22] us.[^2022]He said unto him, Then I beseech thee, my father, to send him to my father’s [23] house;[^2023]for I have five brethren; let him go, that they also sin not,[^2024] and come to [24] the abode of this torment.[^2025][^2026]Abraham said unto him, They have Moses and the [25] prophets; let them hear them.[^2027]He said unto him, Nay,[^2028] my father Abraham: but [26] let a man from the dead go unto them, and they will repent.[^2029]Abraham said unto him, If they listen neither to Moses nor to the prophets, neither if a man from the dead rose would they believe him." },
  { t = "note", id = "2012", text = "Luke xvi. 19." },
  { t = "note", id = "2013", text = "Luke xvi. 20." },
  { t = "note", id = "2014", text = "Luke xvi. 21." },
  { t = "note", id = "2015", text = "Or, *so that*." },
  { t = "note", id = "2016", text = "Luke xvi. 22." },
  { t = "note", id = "2017", text = "Luke xvi. 23." },
  { t = "note", id = "2018", text = "Or, *and*." },
  { t = "note", id = "2019", text = "Luke xvi. 24." },
  { t = "note", id = "2020", text = "Luke xvi. 25." },
  { t = "note", id = "2021", text = "Luke xvi. 26." },
  { t = "note", id = "2022", text = "Luke xvi. 27." },
  { t = "note", id = "2023", text = "Luke xvi. 28." },
  { t = "note", id = "2024", text = "The Syriac and Arabic versions here agree with the Greek. For a plausible suggestion as to the origin of the strange reading in the text, see Harris, *The Diatessaron of Tatian*, p. 21, who cites a parallel from Aphraates." },
  { t = "note", id = "2025", text = "This may be simply a corruption of the Peshitta." },
  { t = "note", id = "2026", text = "Luke xvi. 29." },
  { t = "note", id = "2027", text = "Luke xvi. 30." },
  { t = "note", id = "2028", text = "Or, *Surely*. The word is omitted by Borg. ms." },
  { t = "note", id = "2029", text = "Luke xvi. 31." },
  { t = "p", text = "[27][^2030]The kingdom of heaven is like a man that is a householder, which went out early [28] in the morning to hire labourers for his vineyard.[^2031]And he agreed with the labourers on [29] one penny a day for each labourer, and he sent them into his vineyard.[^2032]And he went [30] [Arabic, p. 113 ] out in three hours, and saw others standing in the market idle.[^2033]He said unto them, Go ye also into my vineyard, and what is right I will pay you. [31][^2034]And they went. And he went out also at the sixth and the ninth hour, and did likewise, [32] and sent them.[^2035]And about the eleventh hour he went out, and found others standing idle. He said unto them, Why are ye standing the whole day idle? [33][^2036]They said unto him, Because no one hath hired us. He said unto them, Go ye [34] also into the vineyard, and what is right ye shall receive.[^2037]So when evening came, the lord of the vineyard said unto his steward, Call the labourers, and pay them [35] their wages; and begin with the later ones, and end with the former ones.[^2038]And [36] those of eleven hours[^2039] came, and received each a penny.[^2040]When therefore the first came, they supposed that they should receive something more; and they also [37] received each a penny.[^2041]And when they received *it*, they spake angrily against the [38] householder, and said,[^2042]These last worked one hour, and thou hast made them equal [39] with us, who have suffered the heat of the day, and its burden.[^2043]He answered and said unto one of them, My friend, I do thee no wrong: *was it* not for a penny *that* [40] thou didst bargain with me?[^2044]Take what is thine, and go thy way; for I wish to [41] give this last as I have given thee.[^2045]Or am I not entitled to do with what is mine[^2046] [42] what I choose?[^2047]Or is thine eye perchance evil, because I am good? Thus shall the last *ones* be first, and the first last. The called are many, and the chosen are few." },
  { t = "note", id = "2030", text = "Matt. xx. 1." },
  { t = "note", id = "2031", text = "Matt. xx. 2." },
  { t = "note", id = "2032", text = "Matt. xx. 3." },
  { t = "note", id = "2033", text = "Matt. xx. 4." },
  { t = "note", id = "2034", text = "Matt. xx. 5." },
  { t = "note", id = "2035", text = "Matt. xx. 6." },
  { t = "note", id = "2036", text = "Matt. xx. 7." },
  { t = "note", id = "2037", text = "Matt. xx. 8." },
  { t = "note", id = "2038", text = "Matt. xx. 9." },
  { t = "note", id = "2039", text = "i.e., probably *the eleventh hour* (*cf*. § 21, 10)." },
  { t = "note", id = "2040", text = "Matt. xx. 10." },
  { t = "note", id = "2041", text = "Matt. xx. 11." },
  { t = "note", id = "2042", text = "Matt. xx. 12." },
  { t = "note", id = "2043", text = "Matt. xx. 13." },
  { t = "note", id = "2044", text = "Matt. xx. 14." },
  { t = "note", id = "2045", text = "Matt. xx. 15." },
  { t = "note", id = "2046", text = "Lit. *my thing*." },
  { t = "note", id = "2047", text = "Matt. xx. 16." },
  { t = "p", text = "[43][^2048]And when Jesus entered into the house of one of the chiefs of the Pharisees to eat bread on the sabbath day, and they were watching him to see what he would [44, 45] do,[^2049]and there was before him a man which had the dropsy,[^2050]Jesus answered and [46] said unto the scribes and the Pharisees, Is it lawful on the sabbath to heal?[^2051]But [Arabic, p. 114 ] they were silent. So he took him, and healed him, and sent him away. [47][^2052]And he said unto them, Which of you shall *have* his son or his ox fall on the sabbath day into a well, and not lift him up straightway, and draw water for [48] him?[^2053]And they were not able to answer him a word to that." },
  { t = "note", id = "2048", text = "Luke xiv. 1." },
  { t = "note", id = "2049", text = "Luke xiv. 2." },
  { t = "note", id = "2050", text = "Luke xiv. 3." },
  { t = "note", id = "2051", text = "Luke xiv. 4." },
  { t = "note", id = "2052", text = "Luke xiv. 5." },
  { t = "note", id = "2053", text = "Luke xiv. 6." },
]

[[section]]
id = "section-30"
title = "Section XXX."
level = 1
blocks = [
  { t = "p", text = "[1][^2054]And he spake a parable unto those which were bidden there, because he saw [2] them choose the places that were in the highest part of the sitting room:[^2055]When a man invites thee to a feast, do not go and sit at the head of the room; lest there [3] be there a man more honourable than thou,[^2056]and he that invited you come and say unto thee, Give the place to this man: and thou be ashamed when thou risest and [4] takest[^2057] another place.[^2058]But when thou art invited, go and sit last; so that when he that invited thee cometh, he may say unto thee, My friend, go up higher: and [5] thou shalt have praise before all that were invited with thee.[^2059]For every one that exalteth himself shall be abased; and every one that abaseth himself shall be exalted." },
  { t = "note", id = "2054", text = "Luke xiv. 7." },
  { t = "note", id = "2055", text = "Luke xiv. 8." },
  { t = "note", id = "2056", text = "Luke xiv. 9." },
  { t = "note", id = "2057", text = "Lit. *at thy rising and taking*." },
  { t = "note", id = "2058", text = "Luke xiv. 10." },
  { t = "note", id = "2059", text = "Luke xiv. 11." },
  { t = "p", text = "[6][^2060]And he said also to him that had invited him, When thou makest a feast[^2061] or a banquet,[^2062] do not invite thy friends, nor even thy brethren, nor thy kinsmen, nor thy [7] rich neighbours; lest haply they also invite thee, and thou have this reward.[^2063]But when thou makest a feast, invite the poor, and those with withered hand, and the [8] lame, and the blind:[^2064]and blessed art thou, since they have not the means to reward [9] thee; that thy reward may be at the rising of the righteous.[^2065]And when one of them that were invited heard that, he said unto him, Blessed is he that shall eat bread in the kingdom of God." },
  { t = "note", id = "2060", text = "Luke xiv. 12." },
  { t = "note", id = "2061", text = "Practically synonymous words." },
  { t = "note", id = "2062", text = "Practically synonymous words." },
  { t = "note", id = "2063", text = "Luke xiv. 13." },
  { t = "note", id = "2064", text = "Luke xiv. 14." },
  { t = "note", id = "2065", text = "Luke xiv. 15." },
  { t = "p", text = "[10, 11][^2066]Jesus answered again in parables, and said,[^2067]The kingdom of heaven hath been likened [Arabic, p. 115 ] to[^2068] a certain king, which made a feast[^2069] for his son, and prepared a [12] great banquet,[^2070] and invited many: and he sent his servants at the time of the feast to inform them that were invited,[^2071]Everything is made ready for you; come. And [13] they would not come, but began all of them with one voice to make excuse.[^2072]And the first said unto them, Say to him, I have bought a field, and I must needs go out [14] to see it:[^2073]I pray thee to release[^2074] me, for I ask to be excused. And another said, I have bought five yoke of oxen, and I am going to examine them: I pray thee [15] to release me, for I ask to be excused.[^2075]And another said, I have married a wife, [16] and therefore I cannot come.[^2076]And the king sent also other servants, and said, Say to those that were invited, that my feast is ready, and my oxen and my fatlings are [17] slain, and everything is ready: come to the feast.[^2077]But they made light of it, and [18] went, one to his field, and another to his merchandise:[^2078]and the rest took his [19] servants, and entreated them shamefully, and killed them.[^2079]And one of the servants [20] came, and informed his lord of what had happened.[^2080]And when the king heard, he became angry, and sent his armies; and they destroyed those murderers, and [21] burned their cities.[^2081]Then he said to his servants, The feast is prepared, but those [22] that were invited were not worthy.[^2082]Go out quickly into the markets and into the partings of the ways of the city, and bring in hither the poor, and those with pains, and the lame, and the blind. And the servants did as the king commanded them. [23][^2083]And they came, and said unto him, Our lord, we have done all that thou commandedst [24] us, and there is here still room.[^2084]So the lord said unto his servants, Go out into the roads, and the ways, and the paths, and every one that ye find, invite [25] [Arabic, p. 116 ] to the feast, and constrain them to enter, till my house is[^2085] filled.[^2086]I say unto you, that no one of those people that were invited shall taste of my feast. [26][^2087]And those servants went out into the roads, and gathered all that they found, good and [27] bad: and the banquet-house was filled with guests.[^2088]And the king entered to see those [28] who were seated, and he saw there a man not wearing a festive garment:[^2089]and he said unto him, My friend, how didst thou come in here not having on festive garments? [29][^2090]And he was silent. Then the king said to the servants, Bind his hands and his feet, and put him forth into the outer darkness; there shall be weeping and [30] gnashing of teeth.[^2091]The called are many; and the chosen, few." },
  { t = "note", id = "2066", text = "Matt. xxii. 1; Matt. xxii. 2." },
  { t = "note", id = "2067", text = "Luke xiv. 16b." },
  { t = "note", id = "2068", text = "Borg. ms., *is like*." },
  { t = "note", id = "2069", text = "Used specially of a marriage feast." },
  { t = "note", id = "2070", text = "Lit. *bread*, the Syriac word for which (*not* that in the versions) means also *feast*." },
  { t = "note", id = "2071", text = "Luke xiv. 17; Matt. xxii. 3b." },
  { t = "note", id = "2072", text = "Luke xiv. 18." },
  { t = "note", id = "2073", text = "Luke xiv. 19." },
  { t = "note", id = "2074", text = "Or, *omit*." },
  { t = "note", id = "2075", text = "Luke xiv. 20." },
  { t = "note", id = "2076", text = "Matt. xxii. 4." },
  { t = "note", id = "2077", text = "Matt. xxii. 5." },
  { t = "note", id = "2078", text = "Matt. xxii. 6." },
  { t = "note", id = "2079", text = "Luke xiv. 21a." },
  { t = "note", id = "2080", text = "Matt. xxii. 7." },
  { t = "note", id = "2081", text = "Matt. xxii. 8." },
  { t = "note", id = "2082", text = "Luke xiv. 21c." },
  { t = "note", id = "2083", text = "Luke xiv. 22." },
  { t = "note", id = "2084", text = "Luke xiv. 23a; Matt. xxii. 9b." },
  { t = "note", id = "2085", text = "Or, *that my house may be*." },
  { t = "note", id = "2086", text = "Luke xiv. 23b; Luke xiv. 24." },
  { t = "note", id = "2087", text = "Matt. xxii. 10." },
  { t = "note", id = "2088", text = "Matt. xxii. 11." },
  { t = "note", id = "2089", text = "Matt. xxii. 12." },
  { t = "note", id = "2090", text = "Matt. xxii. 13." },
  { t = "note", id = "2091", text = "Matt. xxii. 14." },
  { t = "p", text = "[31][^2092]And after that, the time of the feast of unleavened bread of the Jews arrived, [32] and Jesus went out to go to Jerusalem.[^2093]And as he went in the way, there met him [33] ten persons who were lepers, and stood afar off:[^2094]and they lifted up their voice, and [34] said, Our Master, Jesus, have mercy upon us.[^2095]And when he saw them, he said unto them, Go and shew yourselves unto the priests. And when they went, they [35] were cleansed.[^2096]And one of them, when he saw himself cleansed, returned, and [36] was praising God with a loud voice;[^2097]and he fell on his face before the feet of [37] Jesus, giving him thanks: and this *man* was a Samaritan.[^2098]Jesus answered and said, [38] Were not those that were cleansed ten? where then are the nine?[^2099]Not one of them turned aside to come and praise God, but this *man* who is of a strange [39] people.[^2100]He said unto him, Arise, and go thy way; for thy faith hath given thee life.[^2101]" },
  { t = "note", id = "2092", text = "John v. 1a." },
  { t = "note", id = "2093", text = "Luke xvii. 11; Luke xvii. 12." },
  { t = "note", id = "2094", text = "Luke xvii. 13." },
  { t = "note", id = "2095", text = "Luke xvii. 14." },
  { t = "note", id = "2096", text = "Luke xvii. 15." },
  { t = "note", id = "2097", text = "Luke xvii. 16." },
  { t = "note", id = "2098", text = "Luke xvii. 17." },
  { t = "note", id = "2099", text = "Luke xvii. 18." },
  { t = "note", id = "2100", text = "Luke xvii. 19." },
  { t = "note", id = "2101", text = "Or, *saved thee*." },
  { t = "p", text = "[40][^2102]And while they were going up in the way to Jerusalem, Jesus went in front of them; and they wondered, and followed him fearing. And he took his twelve disciples apart, [41] and began to tell them privately[^2103] what was about to befall him.[^2104]And he said unto [Arabic, p. 117 ] them, We are going up to Jerusalem, and all the things shall be fulfilled [42] that are written in the prophets concerning the Son of man.[^2105]He shall be delivered to the chief priests and the scribes; and they shall condemn him to death, [43] and deliver him to the peoples;[^2106][^2107]and they shall treat him shamefully, and scourge [44] him, and spit in his face, and humble him,[^2108]and crucify him, and slay him:[^2109]and on [45] the third day he shall rise.[^2110]But they understood not one thing of this; but this word was hidden from them, and they did not perceive these things that were addressed to them." },
  { t = "note", id = "2102", text = "Mark x. 32." },
  { t = "note", id = "2103", text = "Lit. *between himself and them*." },
  { t = "note", id = "2104", text = "Luke xviii. 31b." },
  { t = "note", id = "2105", text = "Mark x. 33b." },
  { t = "note", id = "2106", text = "i.e., Gentiles." },
  { t = "note", id = "2107", text = "Mark x. 34a." },
  { t = "note", id = "2108", text = "An obscure expression; perhaps it was originally a repetition of the preceding clause. It might be emended into *point at him (the finger of scorn*)." },
  { t = "note", id = "2109", text = "Luke xviii. 33." },
  { t = "note", id = "2110", text = "Luke xviii. 34." },
  { t = "p", text = "[46][^2111]Then came near to him the mother of the (two) sons of Zebedee, she and her (two) sons, and worshipped him, and asked of him a *certain* thing.[^2112]And he said [47] unto her, What wouldest thou?[^2113]And James and John, her two sons, came forward, and said unto him, Teacher, we would that all that we ask thou wouldest [48] do unto us.[^2114]He said unto them,[^2115] What would ye that I should do unto you? [49][^2116]They said unto him, Grant us that we may sit, the one on thy right, and the other [50] on thy left, in thy kingdom and thy glory.[^2117]And Jesus said unto them, Ye know not what ye ask. Are ye able to drink the cup that I am to drink? and with the [51] baptism that I am to be baptized with, will ye be baptized?[^2118]And they said unto him, We are able. Jesus said unto them, The cup that I drink ye shall drink; and [52] with the baptism wherewith I am baptized ye shall be baptized:[^2119]but that ye should sit on my right and on my left is not mine to give; but *it is* for him for whom my Father hath prepared *it*." },
  { t = "note", id = "2111", text = "Matt. xx. 20." },
  { t = "note", id = "2112", text = "Matt. xx. 21a." },
  { t = "note", id = "2113", text = "Mark x. 35." },
  { t = "note", id = "2114", text = "Mark x. 36." },
  { t = "note", id = "2115", text = "Lit. of course *the two of them*, and so all through the conversation." },
  { t = "note", id = "2116", text = "Mark x. 37." },
  { t = "note", id = "2117", text = "Mark x. 38." },
  { t = "note", id = "2118", text = "Mark x. 39." },
  { t = "note", id = "2119", text = "Mark x. 40." },
]

[[section]]
id = "section-31"
title = "Section XXXI."
level = 1
blocks = [
  { t = "p", text = "[1][^2120]And when the ten heard, they were moved with anger against James and John. [2][^2121]And Jesus called them, and said unto them, Ye know that the rulers of the nations [3] are their lords; and their great men are set in authority over them.[^2122]Not thus shall it [Arabic, p. 118 ] be amongst you: but he amongst you that would be great, let him be to you a [4] servant;[^2123]and whoever of you would be first,[^2124] let him be to every man a [5] bond-servant:[^2125]*even* as the Son of man also came not to be served, but to serve, and [6] to give himself a ransom in place of the many.[^2126]He said this, and was going about [7] the villages and the cities, and teaching; and he went to Jerusalem.[^2127]And a man asked him, Are those that shall be saved few? Jesus answered and said unto [8] them, Strive ye to enter at the narrow door:[^2128]I say unto you now, that many shall [9] seek to enter, and shall not be able[^2129]—[^2130]from the time when the master of the house riseth, and closeth the door, and ye shall be standing without, and shall knock at the door, and shall begin to say, Our lord, open unto us; and he shall answer and [10] say, I say unto you, I know you not whence ye are:[^2131]and ye shall begin to say, [11] Before thee we did eat and drink, and in our markets didst thou teach;[^2132]and he shall say unto you, I know you not whence ye are; depart[^2133] from me, ye servants [12] of untruth.[^2134]There shall be weeping and gnashing of teeth, when ye see Abraham, and Isaac, and Jacob, and all the prophets, in the kingdom of God, while ye are [13] put forth without.[^2135]And they shall come from the east and the west, and from the [14] north and the south, and shall sit down in the kingdom of God.[^2136]And there shall then be last that have become first, and first that have become last." },
  { t = "note", id = "2120", text = "Mark x. 41." },
  { t = "note", id = "2121", text = "Mark x. 42." },
  { t = "note", id = "2122", text = "Mark x. 43." },
  { t = "note", id = "2123", text = "Mark x. 44." },
  { t = "note", id = "2124", text = "Lit. *advanced*." },
  { t = "note", id = "2125", text = "Matt. xx. 28." },
  { t = "note", id = "2126", text = "Luke xiii. 22." },
  { t = "note", id = "2127", text = "Luke xiii. 23." },
  { t = "note", id = "2128", text = "Luke xiii. 24." },
  { t = "note", id = "2129", text = "Lit. *find*, like the Syriac." },
  { t = "note", id = "2130", text = "Luke xiii. 25." },
  { t = "note", id = "2131", text = "Luke xiii. 26." },
  { t = "note", id = "2132", text = "Luke xiii. 27." },
  { t = "note", id = "2133", text = "This rendering requires the omission of the diacritical point over the middle radical. The text as printed means *perish*." },
  { t = "note", id = "2134", text = "Luke xiii. 28." },
  { t = "note", id = "2135", text = "Luke xiii. 29." },
  { t = "note", id = "2136", text = "Luke xiii. 30." },
  { t = "p", text = "[15, 16][^2137]And when Jesus entered and passed through Jericho,[^2138]there was a man named Zacchæus, [17] rich, and chief of the publicans.[^2139]And he desired to see Jesus who he was; and he was not able for the pressure of the crowd, because Zacchæus was little of stature. [18] [Arabic, p. 119 ][^2140]And he hastened, and went before Jesus, and went up into an unripe fig [19] tree[^2141] to see Jesus: for he was to pass thus.[^2142]And when Jesus came to that place, he saw him, and said unto him, Make haste, and come down, Zacchæus: [20] to-day I must be in thy house.[^2143]And he hastened, and came down, and received [21] him joyfully.[^2144]And when they all saw, they murmured, and said, He hath gone in [22] and lodged with a man that is a sinner.[^2145]So Zacchæus stood, and said unto Jesus, My Lord, now half of my possessions I give to the poor, and what I have unjustly [23] taken[^2146] from every man I give him fourfold.[^2147]Jesus said unto him, Today is salvation [24] come to this house, because this *man* also is a[^2148] son of Abraham.[^2149]For the Son of man came to seek and save the thing that was lost." },
  { t = "note", id = "2137", text = "Luke xix. 1." },
  { t = "note", id = "2138", text = "Luke xix. 2." },
  { t = "note", id = "2139", text = "Luke xix. 3." },
  { t = "note", id = "2140", text = "Luke xix. 4." },
  { t = "note", id = "2141", text = "*cf*. the extract from Isho‘dad (Harris, *Fragments*, p. 19)." },
  { t = "note", id = "2142", text = "Luke xix. 5." },
  { t = "note", id = "2143", text = "Luke xix. 6." },
  { t = "note", id = "2144", text = "Luke xix. 7." },
  { t = "note", id = "2145", text = "Luke xix. 8." },
  { t = "note", id = "2146", text = "A diacritical point must be restored to the second letter of this word. As it stands it gives no sense." },
  { t = "note", id = "2147", text = "Luke xix. 9." },
  { t = "note", id = "2148", text = "Lit. *the*." },
  { t = "note", id = "2149", text = "Luke xix. 10." },
  { t = "p", text = "[25][^2150]And when Jesus went out of Jericho, he and his disciples, there came after him [26] a great multitude.[^2151]And there was a blind man sitting by the way side begging. [27][^2152]And his name was Timæus, the son of Timæus. And he heard the sound of the [28] multitude passing, and asked, Who is this?[^2153]They said unto him, Jesus the Nazarene [29] passeth by.[^2154]And when he heard that it was Jesus, he called out with a loud [30] voice, and said, Jesus, son of David, have mercy on me.[^2155]And those that went before Jesus were rebuking him, that he should hold his peace:[^2156]but he cried the [31] more, and said, Son of David, have mercy on me.[^2157]And Jesus stood, and commanded that they should call him. And they called the blind man, and said unto [32] him, Be of good courage, and rise; for, behold, he calleth thee.[^2158]And the blind [33] man threw away his garment, and rose, and came to Jesus.[^2159]Jesus said unto him, What dost thou wish that I should do unto thee? And that blind man said unto him, My Lord and Master, that my eyes may be opened, so that I may see thee.[^2160] [34] [Arabic, p. 120 ][^2161]And Jesus had compassion on him, and touched his eyes, and said unto [35] him, See; for thy faith hath saved thee.[^2162]And immediately he received his sight,[^2163] and came after him, and praised God; and all the people that saw praised God." },
  { t = "note", id = "2150", text = "Luke xviii. 35a [rather, Matt. xx. 29a + Mark x. 46a.]; Matt. xx. 29b." },
  { t = "note", id = "2151", text = "Luke xviii. 35b." },
  { t = "note", id = "2152", text = "Mark x. 46b; Luke xviii. 36." },
  { t = "note", id = "2153", text = "Luke xviii. 37." },
  { t = "note", id = "2154", text = "Mark x. 47a; Luke xviii. 38." },
  { t = "note", id = "2155", text = "Luke xviii. 39a." },
  { t = "note", id = "2156", text = "Mark x. 48b." },
  { t = "note", id = "2157", text = "Mark x. 49." },
  { t = "note", id = "2158", text = "Mark x. 50." },
  { t = "note", id = "2159", text = "Mark x. 51." },
  { t = "note", id = "2160", text = "*cf*. Matt. xx. 33, Luke xviii. 41, both in Curetonian." },
  { t = "note", id = "2161", text = "Matt. xx. 34a." },
  { t = "note", id = "2162", text = "Luke xviii. 42b; Luke xviii. 43." },
  { t = "note", id = "2163", text = "Lit. *saw*." },
  { t = "p", text = "[36][^2164]And he spake a parable because he was nearing[^2165] Jerusalem, and they supposed [37] that at that time the kingdom of God was about to appear.[^2166]He said unto them, A man, a son of a great race, went into a far country, to receive a kingdom, and [38] return.[^2167]And he called his ten servants, and gave them ten shares, and said unto [39] them, Trade till the time of my coming.[^2168]But the people of his city hated him, and [40] sent messengers after him, and said, We will not that this *man* reign over us.[^2169]And when he had received a[^2170] kingdom, and returned, he said that the servants to whom he had given the money should be called unto him, that he might know what each [41] of them had traded.[^2171]And the first came, and said, My lord, thy share hath gained [42] ten shares.[^2172] The king said unto him, Thou good and faithful servant, who hast [43] been found faithful in a little, be thou set over ten districts.[^2173]And the second came, [44] and said, My lord, thy portion hath gained five portions.[^2174]And he said unto him [45] also, And thou shalt be set over five districts.[^2175]And another came, and said, My [46] lord, here is thy portion, which was with me laid by in a napkin:[^2176]I feared thee, because thou art a hard man, and takest what thou didst not leave, and seekest [47] what thou didst not give, and reapest what thou didst not sow.[^2177]His lord said unto him, From thy mouth shall I judge thee, thou wicked and idle servant, who wast untrustworthy. Thou knewest that I am a hard man, and take what I did not [48] leave, and reap what I did not sow:[^2178]why didst thou not put my money at usury, [49] and so I might come and seek it, with its gains?[^2179]And he said unto those that were standing in front of him, Take from him the share, and give it to him that hath [50, 51] [Arabic, p. 121 ] ten shares.[^2180]They said unto him, Our lord, he hath ten shares.[^2181]He said unto them, I say unto you, Every one that hath shall be given unto; and [52] he that hath not, that which he hath also shall be taken from him.[^2182]And those mine enemies who would not that I should reign over them, bring them, and slay them before me." },
  { t = "note", id = "2164", text = "Luke xix. 11b." },
  { t = "note", id = "2165", text = "Or, *near*." },
  { t = "note", id = "2166", text = "Luke xix. 12." },
  { t = "note", id = "2167", text = "Luke xix. 13." },
  { t = "note", id = "2168", text = "Luke xix. 14." },
  { t = "note", id = "2169", text = "Luke xix. 15." },
  { t = "note", id = "2170", text = "Doubtless a misinterpretation of the Syriac." },
  { t = "note", id = "2171", text = "Luke xix. 16." },
  { t = "note", id = "2172", text = "Luke xix. 17." },
  { t = "note", id = "2173", text = "Luke xix. 18." },
  { t = "note", id = "2174", text = "Luke xix. 19." },
  { t = "note", id = "2175", text = "Luke xix. 20." },
  { t = "note", id = "2176", text = "Luke xix. 21." },
  { t = "note", id = "2177", text = "Luke xix. 22." },
  { t = "note", id = "2178", text = "Luke xix. 23." },
  { t = "note", id = "2179", text = "Luke xix. 24." },
  { t = "note", id = "2180", text = "Luke xix. 25." },
  { t = "note", id = "2181", text = "Luke xix. 26." },

  { t = "note", id = "1908", text = "Matt. xviii. 11." },
  { t = "p", text = "[30][^1909]And after that, Jesus walked in Galilee; and he did not like to walk in Judæa, [31] because the Jews sought to kill him.[^1910]And there came people who told him of [32] the Galilæans, those whose blood Pilate had mingled with their sacrifices.[^1911]Jesus answered and said unto them, Do ye imagine that those Galilæans were sinners [33] more than all the Galilæans, so that this thing has come upon them?[^1912]Nay. Verily I say unto you now,[^1913] that ye shall all also, if ye repent not, likewise perish. [34][^1914]Or perchance those eighteen on whom the palace fell in Siloam, and slew them, do ye imagine that they were to be condemned[^1915] more than all the people that dwell [35] [Arabic, p. 106 ] in Jerusalem? Nay.[^1916]Verily I say unto you, If ye do not all repent, ye shall perish like them." },
  { t = "note", id = "1909", text = "John vii. 1." },
  { t = "note", id = "1910", text = "Luke xiii. 1." },
  { t = "note", id = "1911", text = "Luke xiii. 2." },
  { t = "note", id = "1912", text = "Luke xiii. 3." },
  { t = "note", id = "1913", text = "Borg. ms. omits *now*." },
  { t = "note", id = "1914", text = "Luke xiii. 4." },
  { t = "note", id = "1915", text = "See note, § 10, 13." },
  { t = "note", id = "1916", text = "Luke xiii. 5." },
  { t = "p", text = "[36][^1917]And he spake unto them this parable: A man had a fig tree planted in his vineyard; [37] and he came and sought fruit thereon, and found none.[^1918]So he said to the husbandman, Lo, three years do I come and seek fruit on this fig tree, and find [38] none: cut it down; why doth it render the ground unoccupied?[^1919]The husbandman said unto him, My lord, leave it this year also, that I may dig about it, and dung [39] it;[^1920]then if it bear fruit—! and if not, then cut it down in the coming year." },
  { t = "note", id = "1917", text = "Luke xiii. 6." },
  { t = "note", id = "1918", text = "Luke xiii. 7." },
  { t = "note", id = "1919", text = "Luke xiii. 8." },
  { t = "note", id = "1920", text = "Luke xiii. 9." },
  { t = "p", text = "[40][^1921]And when Jesus was teaching on the sabbath day in one of the synagogues, [41] there was there a woman that had a spirit of disease eighteen years;[^1922]and she was [42] bowed down, and could not straighten herself at all.[^1923]And Jesus saw her, and called [43] her, and said unto her, Woman, be loosed from thy disease.[^1924]And he put his hand [44] upon her; and immediately she was straightened, and praised God.[^1925]And the chief[^1926] of the synagogue answered with anger, because Jesus had healed on a sabbath, and said unto the multitudes, There are six days in which work ought to be done; [45] come in them and be healed, and not on the sabbath day.[^1927]But Jesus answered and said unto him, *Ye* hypocrites, doth not each of you on the sabbath day loose [46] his ox or his ass from the manger, and go and water it?[^1928]Ought not this woman, who is a daughter of Abraham, and whom the devil[^1929] hath bound eighteen years, [47] to be loosed from this bond on the sabbath day?[^1930]And when he said this, they were all put to shame, those standing, who were opposing him:[^1931] and all the people were pleased with all the wonders that proceeded from his hand." },

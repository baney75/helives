]

[[section]]
id = "section-44"
title = "Section XLIV."
level = 1
blocks = [
  { t = "p", text = "[1, 2][^3017]And when Jesus[^3018] finished all these sayings, he said unto his disciples,[^3019]Ye know that after two days will be the passover, and the Son of man is delivered up to be [3] crucified.[^3020]Then gathered together the chief priests, and the scribes, and the elders [4] of the people, unto the court of the chief priest, who was called Caiaphas;[^3021]and they took counsel together concerning Jesus, that they might seize him by subtilty, and [5] kill him.[^3022]But they said, Not during the feast, lest there take place a disturbance among the people;[^3023]for they feared the people." },
  { t = "note", id = "3017", text = "Matt. xxvi. 1." },
  { t = "note", id = "3018", text = "Borg. ms., *the Lord Jesus*." },
  { t = "note", id = "3019", text = "Matt. xxvi. 2." },
  { t = "note", id = "3020", text = "Matt. xxvi. 3." },
  { t = "note", id = "3021", text = "Matt. xxvi. 4." },
  { t = "note", id = "3022", text = "Matt. xxvi. 5." },
  { t = "note", id = "3023", text = "Luke xxii. 2b." },
  { t = "p", text = "[6][^3024]And Satan entered into Judas who was called Iscariot, who was of the number [7] of the twelve.[^3025]And he went away, and communed with the chief priests, and the scribes, and those that held command in the temple, and said unto them, What [8] [Arabic, p. 167 ] would ye pay me, and I will deliver him unto you?[^3026]And they, when they heard *it*, were pleased, and made ready[^3027] for him thirty *pieces* of money.[^3028] [9][^3029]And he promised[^3030] them, and from that time he sought an opportunity[^3031] that he might deliver unto them Jesus without the multitude." },
  { t = "note", id = "3024", text = "Luke xxii. 3." },
  { t = "note", id = "3025", text = "Luke xxii. 4a; Matt. xxvi. 15a." },
  { t = "note", id = "3026", text = "Mark xiv. 11a; Matt. xxvi. 15b." },
  { t = "note", id = "3027", text = "Probably the letter that stands for *and* should be repeated, and the phrase rendered *and appointed*." },
  { t = "note", id = "3028", text = "So Vat. ms. (following Peshitta) and Ibn-at-Tayyib’s Commentary. Borg. ms., followed by Ciasca, has *dirhams of money*." },
  { t = "note", id = "3029", text = "Luke xxii. 6." },
  { t = "note", id = "3030", text = "Lit. *became responsible unto*. Syriac versions as in text above (*cf*. § 44, 33)." },
  { t = "note", id = "3031", text = "The Arabic (lit. *a stumbling* or *a cause of stumbling*) doubtless represents the Syriac." },
  { t = "p", text = "[10][^3032]And on the first day of unleavened bread the disciples came to Jesus, and said unto him, Where wilt thou that we go and make ready for thee that thou mayest eat the passover?" },
  { t = "note", id = "3032", text = "Mark xiv. 12." },
  { t = "p", text = "[11][^3033]And before the feast of the passover, Jesus knew that the hour was arrived for his departure from this world unto his Father; and he loved his own in this world, [12] and to the last he loved them.[^3034]And at the time of the feast, Satan put into the [13] heart of Judas, the son of Simon Iscariot, to deliver him up.[^3035]And Jesus, because he knew that the Father had delivered into his hands everything, and that he came [14] forth from the Father, and goeth unto God,[^3036]rose from supper, and laid *aside* his [15] garments;[^3037]and took a towel, *and* girded his waist, and poured water into a bason, and began to wash the feet of his disciples, and to wipe them with the towel wherewith [16] his waist was girded.[^3038]And when he came to Simon Cephas, Simon said unto [17] him, Dost thou, my Lord, wash for me my feet?[^3039]Jesus answered and said unto [18] him, What I do, now thou knowest not; but afterwards thou shalt learn.[^3040]Simon said unto him, Thou shalt never wash for me my feet. Jesus said unto him, If I [19] wash thee not, thou hast no part with me.[^3041]Simon Cephas said unto him, Then, my [20] Lord, wash not for me my feet alone, but my hands also and my head.[^3042]Jesus said unto him, He that batheth[^3043] needeth not to wash save his feet, whereas his whole [21] *body* is clean: and ye also are clean, but not all of you.[^3044]For Jesus knew him that should betray him; therefore said he, Ye are not all clean." },
  { t = "note", id = "3033", text = "John xiii. 1." },
  { t = "note", id = "3034", text = "John xiii. 2." },
  { t = "note", id = "3035", text = "John xiii. 3." },
  { t = "note", id = "3036", text = "John xiii. 4." },
  { t = "note", id = "3037", text = "John xiii. 5." },
  { t = "note", id = "3038", text = "John xiii. 6." },
  { t = "note", id = "3039", text = "John xiii. 7." },
  { t = "note", id = "3040", text = "John xiii. 8." },
  { t = "note", id = "3041", text = "John xiii. 9." },
  { t = "note", id = "3042", text = "John xiii. 10." },
  { t = "note", id = "3043", text = "The Arabic word means *swimmeth*. The Syriac versions have *is bathed*, which Borg. ms. misreads *bathed*, and Vat. ms. (followed by Ciasca) corrupts into *batheth*, rendering it *swimmeth*." },
  { t = "note", id = "3044", text = "John xiii. 11." },
  { t = "p", text = "[22] [Arabic, p. 168 ][^3045]So when he had washed their feet, he took his garments, and sat down, and [23] said unto them, Know ye what I have done unto you?[^3046]Ye call me, Master, [24] and, Lord: and ye say well; so I am.[^3047]If then I, now, who am your Lord and Master, have washed for you your feet, how needful is it that ye should wash one another’s feet! [25][^3048]This have I given you as an example, that as I have done to you so ye should do [26] also.[^3049]Verily, verily, I say unto you, No servant is greater than his lord; nor an [27] apostle greater than he that sent him.[^3050]If ye know that, ye are happy if ye do it. [28][^3051]My saying this[^3052] is not for all of you: for I know whom I have chosen: but that the scripture might be fulfilled, He that eateth with me bread lifted against me his [29] heel.[^3053]Henceforth I say unto you before it come to pass, that, when it cometh to [30] pass, ye may believe that I am *he*.[^3054]Verily, verily, I say unto you, Whosoever receiveth whomsoever I send receiveth me; and whosoever receiveth me receiveth him that sent me." },
  { t = "note", id = "3045", text = "John xiii. 12." },
  { t = "note", id = "3046", text = "John xiii. 13." },
  { t = "note", id = "3047", text = "John xiii. 14." },
  { t = "note", id = "3048", text = "John xiii. 15." },
  { t = "note", id = "3049", text = "John xiii. 16." },
  { t = "note", id = "3050", text = "John xiii. 17." },
  { t = "note", id = "3051", text = "John xiii. 18." },
  { t = "note", id = "3052", text = "Or, *This my saying*." },
  { t = "note", id = "3053", text = "John xiii. 19." },
  { t = "note", id = "3054", text = "John xiii. 20." },
  { t = "p", text = "[31][^3055]Who is the great *one*, he that sitteth, or he that serveth? is it not he that sitteth? [32][^3056]I am among you as he that serveth.[^3057]But ye are they that have continued with me [33] in my temptations;[^3058]I promise[^3059] you, as my Father promised[^3060] me, the kingdom, that ye may eat and drink at the table of my kingdom." },
  { t = "note", id = "3055", text = "Luke xxii. 27." },
  { t = "note", id = "3056", text = "Luke xxii. 28." },
  { t = "note", id = "3057", text = "Luke xxii. 29." },
  { t = "note", id = "3058", text = "Luke xxii. 30." },
  { t = "note", id = "3059", text = "*cf*. § 44, 9, note." },
  { t = "note", id = "3060", text = "*cf*. § 44, 9, note." },
  { t = "p", text = "[34][^3061]And the first day[^3062] came, the feast of unleavened bread, on which the Jews were [35] wont[^3063] to sacrifice[^3064] the passover.[^3065]And Jesus sent two of his disciples, Cephas and John, and said unto them, Go and make ready for us the passover, that we may eat. [36, 37][^3066]And they said unto him, Where wilt thou that we make ready for thee?[^3067]He said unto them, Go, enter the city;[^3068]and at the time of your entering, there shall meet you a man bearing a pitcher of water;[^3069]follow him, and the place where he entereth, say [38] to such an one, the master of the house,[^3070]Our Master saith, My time is come, and [Arabic, p. 169 ] at thy *house* I keep the passover.[^3071]Where then is the lodging-place where [39] I shall eat with my disciples?[^3072]And he will shew you a large upper room [40] spread and made ready:[^3073]there then make ready for us.[^3074]And his two disciples went out, and came to the city, and found as he had said unto them: and they made ready the passover as he had said unto them." },
  { t = "note", id = "3061", text = "Luke xxii. 7." },
  { t = "note", id = "3062", text = "Vat. ms. has the word *day* on the margin, added by a late hand." },
  { t = "note", id = "3063", text = "The misprint in the Arabic text has been overlooked in the list of *Corrigenda*." },
  { t = "note", id = "3064", text = "Or, *kill*." },
  { t = "note", id = "3065", text = "Luke xxii. 8." },
  { t = "note", id = "3066", text = "Luke xxii. 9." },
  { t = "note", id = "3067", text = "Luke xxii. 10a." },
  { t = "note", id = "3068", text = "Mark xiv. 13b; Luke xxii. 10b." },
  { t = "note", id = "3069", text = "Luke xxii. 11a." },
  { t = "note", id = "3070", text = "Matt. xxvi. 18b." },
  { t = "note", id = "3071", text = "Luke xxii. 11b." },
  { t = "note", id = "3072", text = "Luke xxii. 12." },
  { t = "note", id = "3073", text = "Mark xiv. 15." },
  { t = "note", id = "3074", text = "Mark xiv. 16." },
  { t = "p", text = "[41][^3075]And when the evening was come, and the time arrived, Jesus came and reclined, [42] and the twelve apostles with him.[^3076]And he said unto them, With desire I have [43] desired to eat this passover with you before I suffer:[^3077]I say unto you, that henceforth I shall not eat it, until it is fulfilled in the kingdom of God." },
  { t = "note", id = "3075", text = "Luke xxii. 14." },
  { t = "note", id = "3076", text = "Luke xxii. 15." },
  { t = "note", id = "3077", text = "Luke xxii. 16." },
  { t = "p", text = "[44][^3078]Jesus said that, and was agitated[^3079] in his spirit, and testified, and said, Verily, [45] verily, I say unto you, One of you, *he* that eateth with me, shall betray me.[^3080]And they were very sorrowful; and they began to say unto him, one after another of [46] them, Can it be I, Lord?[^3081]He answered and said unto them, One of the twelve, [47] he that dippeth his hand with me in the dish, will betray me.[^3082]And lo, the hand of [48] him that betrayeth me is on the table.[^3083]And the Son of man goeth, as it is written of him: woe then to that man by whose hand the Son of man is betrayed! for it [49] would have been better for that man had he not been born.[^3084]And the disciples [50] looked one on another, for they knew not to whom he referred;[^3085]and they began to search among themselves, who that might be who was to do *this*." },
  { t = "note", id = "3078", text = "John xiii. 21a." },
  { t = "note", id = "3079", text = "The Syriac word is retained. In Arabic it properly means *become strong* or *proud* (*cf*. § 38, 17)." },
  { t = "note", id = "3080", text = "Mark xiv. 18b; Mark xiv. 19." },
  { t = "note", id = "3081", text = "Mark xiv. 20." },
  { t = "note", id = "3082", text = "Luke xxii. 21." },
  { t = "note", id = "3083", text = "Mark xiv. 21." },
  { t = "note", id = "3084", text = "John xiii. 22." },
  { t = "note", id = "3085", text = "Luke xxii. 23." },
]

[[section]]
id = "section-45"
title = "Section XLV."
level = 1
blocks = [
  { t = "p", text = "[1, 2] [Arabic, p. 170 ][^3086]And one of his disciples was sitting[^3087] in his bosom, *he* whom Jesus loved.[^3088]To him Simon Cephas beckoned, that he should ask him who this *was*, concerning [3] whom he spake.[^3089]And that disciple leaned[^3090] on Jesus’ breast, and said unto him, [4] My Lord, who is this?[^3091]Jesus answered and said, He to whom I shall dip bread, and give it. And Jesus dipped bread, and gave to Judas, the son of Simon Iscariot. [5][^3092]And after the bread, Satan entered him. And Jesus said unto him, What thou [6] desirest to do, hasten the doing of it.[^3093]And no man of them that sat knew why he [7] said this unto him.[^3094]And some of them thought, because Judas had the box, that he was bidding him buy what would be needed for the feast; or, that he might pay [8] something to the poor.[^3095]Judas the betrayer answered and said, Can it be I, my [9] Master? Jesus said unto him, Thou hast said.[^3096]And Judas took the bread straightway, and went forth without: and it was still night." },
  { t = "note", id = "3086", text = "John xiii. 23." },
  { t = "note", id = "3087", text = "The Syriac versions have *reclining*." },
  { t = "note", id = "3088", text = "John xiii. 24." },
  { t = "note", id = "3089", text = "John xiii. 25." },
  { t = "note", id = "3090", text = "Lit. *fell*." },
  { t = "note", id = "3091", text = "John xiii. 26." },
  { t = "note", id = "3092", text = "John xiii. 27." },
  { t = "note", id = "3093", text = "John xiii. 28." },
  { t = "note", id = "3094", text = "John xiii. 29." },
  { t = "note", id = "3095", text = "Matt. xxvi. 25." },
  { t = "note", id = "3096", text = "John xiii. 30." },
  { t = "p", text = "[10][^3097]And Jesus said, Now is the Son of man being glorified,[^3098] and God is being glorified[^3099] [11] in him;[^3100]and if God is glorified in him, God also will glorify him in him, and straightway will glorify him." },
  { t = "note", id = "3097", text = "John xiii. 31." },
  { t = "note", id = "3098", text = "A simple change of diacritical points would give the reading of the Greek and of the Syriac versions." },
  { t = "note", id = "3099", text = "A simple change of diacritical points would give the reading of the Greek and of the Syriac versions." },
  { t = "note", id = "3100", text = "John xiii. 32." },
  { t = "p", text = "[12][^3101]And while they were eating, Jesus took bread, and blessed, and divided;[^3102]and he [13] gave to his disciples, and said unto them, Take and eat; this is my body.[^3103]And he [Arabic, p. 171 ] took a cup, and gave thanks, and blessed, and gave them,[^3104]and said, Take [14, 15] and drink of it, all of you.[^3105]And they drank of it, all of them.[^3106]And he said unto them,[^3107]This is my blood, the new covenant, that is shed for many for the [16] forgiveness of sins.[^3108]I say unto you, I shall not drink henceforth of this, the juice of the vine, until the day in which I drink[^3109] with you new *wine* in the kingdom of [17] God.[^3110]And thus do ye in remembrance of me.[^3111]And Jesus said unto Simon, Simon, [18] behold, Satan asketh that he may sift you like wheat:[^3112]but I entreat[^3113] for thee, that thou lose not thy faith:[^3114] and do thou, at some time, turn[^3115] and strengthen thy brethren." },
  { t = "note", id = "3101", text = "Mark xiv. 22a." },
  { t = "note", id = "3102", text = "Matt. xxvi. 26b." },
  { t = "note", id = "3103", text = "Mark xiv. 23a." },
  { t = "note", id = "3104", text = "Matt. xxvi. 27b." },
  { t = "note", id = "3105", text = "Mark xiv. 23b." },
  { t = "note", id = "3106", text = "Mark xiv. 24a." },
  { t = "note", id = "3107", text = "Matt. xxvi. 28." },
  { t = "note", id = "3108", text = "Matt. xxvi. 29." },
  { t = "note", id = "3109", text = "Peshitta adds *it*. The reading of the Sinaitic is doubtful." },
  { t = "note", id = "3110", text = "Luke xxii. 19b." },
  { t = "note", id = "3111", text = "Luke xxii. 31." },
  { t = "note", id = "3112", text = "Luke xxii. 32." },
  { t = "note", id = "3113", text = "Past tense in Syriac versions." },
  { t = "note", id = "3114", text = "We may translate, with the Syriac versions, *that thy faith fail not*, only if we assign a somewhat Syriac meaning to the verb, and assume either an error in diacritical points (*t* for *y*) or an unusual (Syriac) gender for *faith*." },
  { t = "note", id = "3115", text = "*cf*. Syriac versions." },
  { t = "p", text = "[19][^3116]My children, another little *while* am I with you. And ye shall seek me: and as [20] I said unto the Jews, Whither I go, ye cannot come; I say unto you now also.[^3117]A new commandment I give you, that ye may love one another; and as I have loved [21] you, so shall ye also love one another.[^3118]By this shall every man know that ye are [22] my disciples, if ye have love one to another.[^3119]Simon Cephas said unto him, Our Lord, whither goest thou? Jesus answered and said unto him, Whither I go, thou canst not now follow me; but later thou shalt come." },
  { t = "note", id = "3116", text = "John xiii. 33." },
  { t = "note", id = "3117", text = "John xiii. 34." },
  { t = "note", id = "3118", text = "John xiii. 35." },
  { t = "note", id = "3119", text = "John xiii. 36." },
  { t = "p", text = "[23][^3120]Then said Jesus unto them, Ye all shall desert[^3121] me this night:[^3122] it is written, I [24] will smite the shepherd, and the sheep of the flock shall be scattered.[^3123]But after my [25] rising, I shall go before you into Galilee.[^3124]Simon Cephas answered and said unto [26] him, My Lord, if every man desert thee, I shall at no time desert thee.[^3125]I am with thee ready for imprisonment and for death.[^3126]And my life will I give up for thee. [27] [Arabic, p. 172 ][^3127]Jesus said unto him, Wilt thou give up thy life for me?[^3128]Verily, verily, I say unto thee, Thou shalt to-day, during this night, before the cock crow [28] twice, three times deny me, that thou knowest me not.[^3129]But Cephas said the more,[^3130] Even if it lead to[^3131] death with thee, I shall not deny thee, my Lord. And in like manner said all the disciples also." },
  { t = "note", id = "3120", text = "Matt. xxvi. 31." },
  { t = "note", id = "3121", text = "The Arabic word is not unlike the word for *stumble*, and Borg. ms. omits *me*." },
  { t = "note", id = "3122", text = "Vat. ms. omits *this night*." },
  { t = "note", id = "3123", text = "Matt. xxvi. 32." },
  { t = "note", id = "3124", text = "Matt. xxvi. 33." },
  { t = "note", id = "3125", text = "Luke xxii. 33b." },
  { t = "note", id = "3126", text = "John xiii. 37b." },
  { t = "note", id = "3127", text = "John xiii. 38a." },
  { t = "note", id = "3128", text = "Mark xiv. 30b." },
  { t = "note", id = "3129", text = "Luke xxii. 34b; Mark xiv. 31." },
  { t = "note", id = "3130", text = "Or, *went on saying*." },
  { t = "note", id = "3131", text = "Lit. *end in*. Or, *if I come to (the point of)*." },
  { t = "p", text = "[29][^3132]Then Jesus said unto them, Let not your hearts be troubled:[^3133] believe in God, [30] and believe in me.[^3134]The stations[^3135] in my Father’s house are many, else I should [31] have told[^3136] you. I[^3137] go to prepare for you a place.[^3138]And if I go *to* prepare for you a place, I shall return again, and take you unto me: and so where I am, there ye [32, 33] shall be also.[^3139]And the place that I go ye know,[^3140] and the way ye know.[^3141][^3142]Thomas said unto him, Our Lord, we know not whither thou goest; and how is the way for [34] us to the knowledge of that?[^3143][^3144]Jesus said unto him, I am the way, and the truth, [35] and the life: and no man cometh unto my Father, but through me.[^3145]And if ye had known me, ye should have known my Father: and from henceforth ye know[^3146] him, [36] and have seen him.[^3147]Philip[^3148] said unto him, Our Lord, shew us the Father, and it sufficeth [37] us.[^3149]Jesus said unto him, Have I been all this time with you, and dost thou not know[^3150] me, Philip?[^3151] whosoever hath seen me hath seen the Father; how then sayest [38] thou, Shew us the Father?[^3152]Believest thou not that I am in my Father, and my Father in me? and the saying that I say, I say not of myself: but my Father who dwelleth in [39] me, he doeth these deeds.[^3153]Believe that I am in my Father, and my Father in me: [40] [Arabic, p. 173 ] or else believe for the sake of the deeds.[^3154]Verily, verily, I say unto you, Whosoever believeth in me, the deeds that I do shall he do also; and [41] more than that shall he do: I go unto the Father.[^3155]And what ye shall ask in my [42] name, I shall do unto you, that the Father may be glorified in his Son.[^3156]And if ye [43, 44] ask me[^3157] in my name, I will do *it*.[^3158]If ye love me, keep my commandments.[^3159]And I will entreat of my Father, and he will send unto you another Paraclete, that he [45] may be with you for ever, *even* the Spirit of truth:[^3160]whom the world cannot receive; for it hath not seen him, nor known him: but ye know him; for he hath dwelt[^3161] [46] with you, and is in you.[^3162]I will not leave you orphans: I will come unto you. [47][^3163]Another little *while*, and the world seeth me not; but ye see me that I live, and ye [48] shall live also.[^3164]And in that day ye shall know that I am in my Father, and ye in me, and I in you." },
  { t = "note", id = "3132", text = "John xiv. 1." },
  { t = "note", id = "3133", text = "The diacritical points in both Vat. (followed by Ciasca) and Borg. mss. appear to demand a rendering *inquire* for *be troubled*. In Ibn-at-Tayyib’s comments (not the *text*), however (with other points), we have the meaning *wail* (root *nhb*). Every Syriac version uses a different word." },
  { t = "note", id = "3134", text = "John xiv. 2." },
  { t = "note", id = "3135", text = "Or, *ranks*." },
  { t = "note", id = "3136", text = "Or, *should tell*." },
  { t = "note", id = "3137", text = "Probably the Arabic represents a Syriac *For I*." },
  { t = "note", id = "3138", text = "John xiv. 3." },
  { t = "note", id = "3139", text = "John xiv. 4." },
  { t = "note", id = "3140", text = "Different words." },
  { t = "note", id = "3141", text = "Different words." },
  { t = "note", id = "3142", text = "John xiv. 5." },
  { t = "note", id = "3143", text = "*cf*. Ibn-at-Tayyib’s Commentary (f. 352*a*) and order of words in Peshitta (not Sin.)." },
  { t = "note", id = "3144", text = "John xiv. 6." },
  { t = "note", id = "3145", text = "John xiv. 7." },
  { t = "note", id = "3146", text = "Lit. *have known*." },
  { t = "note", id = "3147", text = "John xiv. 8." },
  { t = "note", id = "3148", text = "Different forms, as in Peshitta." },
  { t = "note", id = "3149", text = "John xiv. 9." },
  { t = "note", id = "3150", text = "More exactly, *hast thou not come to know*." },
  { t = "note", id = "3151", text = "Different forms, as in Peshitta." },
  { t = "note", id = "3152", text = "John xiv. 10." },
  { t = "note", id = "3153", text = "John xiv. 11." },
  { t = "note", id = "3154", text = "John xiv. 12." },
  { t = "note", id = "3155", text = "John xiv. 13." },
  { t = "note", id = "3156", text = "John xiv. 14." },
  { t = "note", id = "3157", text = "The Borg. ms. has *me* clearly (*cf*. Peshitta). The Vat. ms. is ambiguous." },
  { t = "note", id = "3158", text = "John xiv. 15." },
  { t = "note", id = "3159", text = "John xiv. 16." },
  { t = "note", id = "3160", text = "John xiv. 17." },
  { t = "note", id = "3161", text = "Probably a misreading of the Peshitta (not Sin. or Cur.), since the next clause also agrees with it." },
  { t = "note", id = "3162", text = "John xiv. 18." },
  { t = "note", id = "3163", text = "John xiv. 19." },
  { t = "note", id = "3164", text = "John xiv. 20." },
]

[[section]]
id = "section-46"
title = "Section XLVI."
level = 1
blocks = [
  { t = "p", text = "[1][^3165]Whosoever hath my commandments, and keepeth them, he it is that loveth me: and he that loveth me shall be loved of my Father, and I will love him, and will [2] shew myself unto him.[^3166]Judas (not Iscariot) said unto him, My Lord, what is the [3] purpose of thy intention to shew thyself to us, and not to the world?[^3167]Jesus answered and said unto him, Whosoever loveth me will keep my word: and my Father will love him, and to him will we come, and make our[^3168] abode with him. [4][^3169]But he that loveth me not keepeth not my word: and this word that ye hear is not my word, but the Father’s which sent me." },
  { t = "note", id = "3165", text = "John xiv. 21." },
  { t = "note", id = "3166", text = "John xiv. 22." },
  { t = "note", id = "3167", text = "John xiv. 23." },
  { t = "note", id = "3168", text = "Lit. *the* (*cf*. Syriac versions)." },
  { t = "note", id = "3169", text = "John xiv. 24." },
  { t = "p", text = "[5, 6][^3170]This have I spoken unto you, while I was yet with you.[^3171]But the Paraclete, the Holy Spirit, whom my Father will send in my name, he will teach you everything, and [7] [Arabic, p. 174 ] he will bring to your remembrance all that I say unto you.[^3172]Peace I leave you; my peace I give unto you: and not as this world giveth, give I unto you. [8][^3173]Let your heart not be troubled,[^3174] nor fearful. Ye heard that I said unto you, that I go away, and come unto you. If[^3175] ye loved me, ye would rejoice, that I go away to my [9] Father: for my Father is greater than I.[^3176]And now I say unto you before it come [10] to pass, that, when it cometh to pass, ye may believe me.[^3177]Now I will not speak with you much: the Archon of the world will come, and he will have nothing in [11] me:[^3178]but that the world may know that I love my Father, and as my Father charged me, so I do." },
  { t = "note", id = "3170", text = "John xiv. 25." },
  { t = "note", id = "3171", text = "John xiv. 26." },
  { t = "note", id = "3172", text = "John xiv. 27." },
  { t = "note", id = "3173", text = "John xiv. 28." },
  { t = "note", id = "3174", text = "This word is quite unlike that used in § 45, 29." },
  { t = "note", id = "3175", text = "The Syriac form of the introductory particle is wrongly used, for in Arabic it has interrogative force." },
  { t = "note", id = "3176", text = "John xiv. 29." },
  { t = "note", id = "3177", text = "John xiv. 30." },
  { t = "note", id = "3178", text = "John xiv. 31a." },
  { t = "p", text = "[12][^3179]And he said unto them, When I sent you without purses, or wallets, and shoes,[^3180] [13] lacked ye perchance anything? They said unto him, Nothing.[^3181]He said unto them, Henceforth, whosoever hath a purse, let him take it, and likewise the wallet also: and whosoever hath not a sword, shall sell his garment, and buy for himself a [14] sword.[^3182]I say unto you, that this scripture also must be fulfilled in me, that I should be reckoned[^3183] with the transgressors: for all that is said of me is fulfilled in [15] me.[^3184]His disciples said unto him, Our Lord, lo, here are two swords. He said [16] unto them, They are sufficient.[^3185]Arise, let us go hence. And they arose, and praised, and went forth, and went, according to their custom, to the mount of Olives, he and his disciples." },
  { t = "note", id = "3179", text = "Luke xxii. 35." },
  { t = "note", id = "3180", text = "The first letter of the Arabic word has lost its diacritical point." },
  { t = "note", id = "3181", text = "Luke xxii. 36." },
  { t = "note", id = "3182", text = "Luke xxii. 37." },
  { t = "note", id = "3183", text = "A possible rendering of the Syriac *he was reckoned*." },
  { t = "note", id = "3184", text = "Luke xxii. 38." },
  { t = "note", id = "3185", text = "John xiv. 31b; Luke xxii. 39." },
  { t = "p", text = "[17][^3186]And he said unto them, I am the true vine, and my Father is the husbandman. [18][^3187]Every branch that produceth not fruit in me, he taketh it: and that which giveth fruit, [19] he cleanseth it, that it may give much fruit.[^3188]Ye are already clean because of the word [20] that I have spoken unto you.[^3189]Abide in me, and I in you. And as the branch of the [Arabic, p. 175 ] vine cannot produce fruit of itself, if it be not abiding in the vine; so too ye [21] also, if ye abide not in me.[^3190]I am the vine, and ye are the branches: He then that abideth in me, and I in him, he giveth much fruit: for without me ye cannot [22] do anything.[^3191]And if a man abide not in me, he is cast without, like a withered [23] branch; and it is gathered, and cast[^3192] into the fire, that it may be burned.[^3193]If ye abide in me, and my word abide in you, everything that ye desire to ask shall be [24] *done* unto you.[^3194]And herein is the Father glorified, that ye may give much fruit; [25] and ye *shall* be my disciples.[^3195]And as my Father loved me, I loved you also: [26] abide in my love.[^3196]If ye keep my commands, ye shall abide in my love; as I have [27] kept my Father’s commands, and abode in his love.[^3197]I have spoken that unto you, [28] that my joy[^3198] may be in you, and your joy[^3199] be fulfilled.[^3200]This is my commandment, [29] that ye love one another, as I loved you.[^3201]And no love is greater than this, namely, [30] that a man should give his life for his friends.[^3202]Ye are my friends, if ye do all that [31] I command you.[^3203]I call you not now servants; for the servant knoweth not what his lord doeth: my friends have I now called you; for everything that I heard from [32] my Father I have made known unto you.[^3204]Ye did not choose[^3205] me, but I chose I you, and appointed you, that ye also should go and bear fruit, and *that* your fruit should[^3206] [33] abide; and *that* all that ye shall ask my Father in my name, he may[^3207] give you.[^3208]This [34] I command[^3209] you, that ye love one another.[^3210]And if the world hate you, know that [35] before you it hated me.[^3211]If then ye were of the world, the world would love its own: but ye are not of the world: I chose you out of the world: therefore the world [36] [Arabic, p. 176 ] hateth you.[^3212]Remember the word that I said unto you, that no servant is greater than his lord. And if they persecuted[^3213] me, you also will they [37] persecute;[^3214] and if they kept my word, your word also will they keep.[^3215]But all these things will they do unto you for my name’s sake, for they have not known[^3216] him [38] that sent me.[^3217]And if I had not come and spoken unto them, they had not had sin: [39] but now they have no excuse for their sins.[^3218]Whosoever hateth me, also hateth my [40] Father.[^3219]And if I had not done the deeds before them that no other man did, they would not have had sin: but now they have seen and hated me and my Father [41] also: that the word may be fulfilled that is written in their law,[^3220]They hated me for [42] nothing.[^3221]But when the Paraclete is come, whom I will send unto you from my Father, even the Spirit of truth, which goeth forth from my Father, he shall bear witness of [43] me:[^3222]and ye also bear witness, because from the beginning ye *have been* with me." },
  { t = "note", id = "3186", text = "John xv. 1." },
  { t = "note", id = "3187", text = "John xv. 2." },
  { t = "note", id = "3188", text = "John xv. 3." },
  { t = "note", id = "3189", text = "John xv. 4." },
  { t = "note", id = "3190", text = "John xv. 5." },
  { t = "note", id = "3191", text = "John xv. 6." },
  { t = "note", id = "3192", text = "The verbs may be active or passive, but are singular (*cf*. § 38, 43, note)." },
  { t = "note", id = "3193", text = "John xv. 7." },
  { t = "note", id = "3194", text = "John xv. 8." },
  { t = "note", id = "3195", text = "John xv. 9." },
  { t = "note", id = "3196", text = "John xv. 10." },
  { t = "note", id = "3197", text = "John xv. 11." },
  { t = "note", id = "3198", text = "Two words from the same root." },
  { t = "note", id = "3199", text = "Two words from the same root." },
  { t = "note", id = "3200", text = "John xv. 12." },
  { t = "note", id = "3201", text = "John xv. 13." },
  { t = "note", id = "3202", text = "John xv. 14." },
  { t = "note", id = "3203", text = "John xv. 15." },
  { t = "note", id = "3204", text = "John xv. 16." },
  { t = "note", id = "3205", text = "Different words." },
  { t = "note", id = "3206", text = "Or, *shall* and *will*, respectively." },
  { t = "note", id = "3207", text = "Or, *shall* and *will*, respectively." },
  { t = "note", id = "3208", text = "John xv. 17." },
  { t = "note", id = "3209", text = "Or, *have commanded*." },
  { t = "note", id = "3210", text = "John xv. 18." },
  { t = "note", id = "3211", text = "John xv. 19." },
  { t = "note", id = "3212", text = "John xv. 20." },
  { t = "note", id = "3213", text = "*cf*. § 8, 34, note." },
  { t = "note", id = "3214", text = "*cf*. § 8, 34, note." },
  { t = "note", id = "3215", text = "John xv. 21." },
  { t = "note", id = "3216", text = "The Arabic text (Vat.) is grammatically inaccurate, and the Borg. ms. has *know not*." },
  { t = "note", id = "3217", text = "John xv. 22." },
  { t = "note", id = "3218", text = "John xv. 23." },
  { t = "note", id = "3219", text = "John xv. 24." },
  { t = "note", id = "3220", text = "John xv. 25." },
  { t = "note", id = "3221", text = "John xv. 26." },
  { t = "note", id = "3222", text = "John xv. 27." },
  { t = "p", text = "[44, 45][^3223]I have said that unto you, that ye may not stumble.[^3224][^3225]And they shall put you out of their synagogues: and there cometh an[^3226] hour when every one that killeth [46] you shall think that he hath offered unto God an offering.[^3227]And they will do that, [47] because they do not know me, nor my Father.[^3228]I have said that unto you, so that [48] when its time is come, ye may remember it, that I told you.[^3229]And this hitherto I said not unto you, because I was with you. But[^3230] now I go unto him that sent me; and no [49] man of you asketh me whither I go.[^3231]I have said that unto you now, and grief hath [50] come and taken possession of your hearts[^3232]But I say the truth unto you; It is better[^3233] for you that I go away: for if I go not away, the Paraclete will not come unto you; [51] [Arabic, p. 177 ] but if I go away, I will send him unto you.[^3234]And when he cometh, he will reprove the world for sin, and for righteousness, and for judgement: [52, 53] for sin,[^3235]because they have not believed in me;[^3236]and for righteousness, because I go [54] to my Father;[^3237]and for judgement, because[^3238] the Archon of this world hath been [55] judged.[^3239]And further have I many things to speak unto you, but ye cannot tarry[^3240] [56] now.[^3241]Howbeit[^3242] when the Spirit of truth is come, he will remind[^3243] you of all the truth: he will say nothing from himself; but everything that he heareth, that shall [57] he say: and he shall make known unto you the things that are to be.[^3244]And he shall [58] glorify me; for from me shall he take and shew you.[^3245]All that my Father hath is mine: therefore said I unto you, that he taketh[^3246] of mine, and shall shew[^3247] you." },
  { t = "note", id = "3223", text = "John xvi. 1." },
  { t = "note", id = "3224", text = "Lit. *sway (as one does in dozing)*." },
  { t = "note", id = "3225", text = "John xvi. 2." },
  { t = "note", id = "3226", text = "Or, *the*, as in Borg. ms." },
  { t = "note", id = "3227", text = "John xvi. 3." },
  { t = "note", id = "3228", text = "John xvi. 4." },
  { t = "note", id = "3229", text = "John xvi. 5 [in the Greek and English verse 5 begins at *But*.]." },
  { t = "note", id = "3230", text = "In the Greek and English verse 5 begins at *But*." },
  { t = "note", id = "3231", text = "John xvi. 6." },
  { t = "note", id = "3232", text = "John xvi. 7." },
  { t = "note", id = "3233", text = "Or, *best*." },
  { t = "note", id = "3234", text = "John xvi. 8." },
  { t = "note", id = "3235", text = "John xvi. 9." },
  { t = "note", id = "3236", text = "John xvi. 10." },
  { t = "note", id = "3237", text = "John xvi. 11." },
  { t = "note", id = "3238", text = "Lit. *that* (*cf*. Peshitta)." },
  { t = "note", id = "3239", text = "John xvi. 12." },
  { t = "note", id = "3240", text = "Or perhaps *receive (them*). Possibly a Syriac *d* has been read *r*. But Ibn-at-Tayyib in the text of his Commentary (f. 357*a*) has a word which perhaps might be rendered *accommodate yourselves (to them*) (same letters, but last two transposed), while his comment (f. 357*b*) gives *ye cannot bear it*." },
  { t = "note", id = "3241", text = "John xvi. 13." },
  { t = "note", id = "3242", text = "Or, *And*." },
  { t = "note", id = "3243", text = "The Syriac words for *remind* and *lead* differ only in the length of a single stroke. Ibn-at-Tayyib (*ibid*. f. 357*b*) almost seems to have read *illumine you with*, although he calls attention to the “Greek” reading." },
  { t = "note", id = "3244", text = "John xvi. 14." },
  { t = "note", id = "3245", text = "John xvi. 15." },
  { t = "note", id = "3246", text = "Same tense." },
  { t = "note", id = "3247", text = "Same tense." },
]

[[section]]
id = "section-47"
title = "Section XLVII."
level = 1
blocks = [
  { t = "p", text = "[1][^3248]A little *while*, and ye shall not behold me; and a little *while* again, and ye shall [2] behold me; because I go to the Father.[^3249]His disciples therefore said one to another, What is this that he hath said unto us, A little *while*, and ye shall not behold me; and a little *while* again, and ye shall behold me: and, I go to my [3] Father?[^3250]And they said, What is this little *while* that he hath said? We know not [4] what he speaketh.[^3251]And Jesus perceived that they were seeking to ask him, and said unto them, Do ye inquire among yourselves concerning this, that I said unto you, A little *while*, and ye behold me not, and a little while again, and ye shall [5] behold me?[^3252]Verily, verily,[^3253] I say unto you, that ye shall weep and grieve, but the world shall rejoice: and ye shall be sorrowful, but your grief shall turn[^3254] to joy." },
  { t = "note", id = "3248", text = "John xvi. 16." },
  { t = "note", id = "3249", text = "John xvi. 17." },
  { t = "note", id = "3250", text = "John xvi. 18." },
  { t = "note", id = "3251", text = "John xvi. 19." },
  { t = "note", id = "3252", text = "John xvi. 20." },
  { t = "note", id = "3253", text = "Not quite the usual formula, there being here no article." },
  { t = "note", id = "3254", text = "The Arabic might also be rendered *be turned*, but the Syriac is intransitive." },
  { t = "p", text = "[6][^3255]For, a woman when the time is come for her that she should bring forth, the arrival of the day of her bringing forth distresseth her: but whenever she hath brought forth a son, she remembereth not her distress, for joy at the birth of a man into the [7] world.[^3256]And ye now also grieve: but I shall see you, and your hearts shall rejoice, [8] [Arabic, p. 178 ] and your joy no man taketh from you.[^3257]And in that day ye shall ask me nothing. And verily, verily,[^3258] I say unto you, All that ye ask my Father in my name, he will give you.[^3259]Hitherto ye have asked nothing [9] in my name: ask, and ye shall receive, that your joy may be complete." },
  { t = "note", id = "3255", text = "John xvi. 21." },
  { t = "note", id = "3256", text = "John xvi. 22." },
  { t = "note", id = "3257", text = "John xvi. 23." },
  { t = "note", id = "3258", text = "Not quite the usual formula, there being here no article (*cf*. also § 47, 5)." },
  { t = "note", id = "3259", text = "John xvi. 24." },
  { t = "p", text = "[10][^3260]I have spoken unto you now in ænigmas:[^3261] but there will come an hour when[^3262] I shall not speak to you in ænigmas,[^3263] but shall reveal unto you the Father plainly, [11] in that day when[^3264] ye shall ask in my name:[^3265]and I say not unto you, that I shall [12] entreat the Father for you;[^3266]for the Father loveth you, because ye have loved me, [13] and have believed that I came forth from my Father.[^3267]I came forth from my Father, and came into the world: and I leave the world, and go unto my Father. [14][^3268]His disciples said unto him, Lo, thy speech is now plain, and thou hast not said one [15] thing in an ænigma.[^3269]Now, lo, we know that thou knowest everything, and needest not that any man should ask thee: and by this we believe that thou camest forth [16, 17] from God.[^3270]Jesus said unto them, Believe that an hour cometh,[^3271]and lo, it hath come, and ye shall be scattered, every one of you to his place, and shall leave me [18] alone: and yet I am not alone, because the Father is with me.[^3272]This have I said unto you, that in me ye may have peace. And in the world trouble shall overtake you: but be of good courage; for I have overcome the world." },
  { t = "note", id = "3260", text = "John xvi. 25." },
  { t = "note", id = "3261", text = "Not the usual word for *proverb or parable* (*cf*. Syriac versions)." },
  { t = "note", id = "3262", text = "So Vat. ms. and Peshitta. The Borg. ms., followed by Ciasca, has *and a time when*." },
  { t = "note", id = "3263", text = "Not the usual word for *proverb or parable* (*cf*. Syriac versions)." },
  { t = "note", id = "3264", text = "*cf*. Peshitta." },
  { t = "note", id = "3265", text = "John xvi. 26." },
  { t = "note", id = "3266", text = "John xvi. 27." },
  { t = "note", id = "3267", text = "John xvi. 28." },
  { t = "note", id = "3268", text = "John xvi. 29." },
  { t = "note", id = "3269", text = "John xvi. 30." },
  { t = "note", id = "3270", text = "John xvi. 31." },
  { t = "note", id = "3271", text = "John xvi. 32." },
  { t = "note", id = "3272", text = "John xvi. 33." },
  { t = "p", text = "[19][^3273]This said Jesus, and lifted up his eyes unto heaven, and said, My Father, the hour [20] is come; glorify thy Son, that thy Son may glorify thee:[^3274]as thou gavest him authority [21] over all flesh, that all that thou hast given him, he might give them[^3275] eternal life.[^3276]And this is eternal life, that they should[^3277] know that thou alone art true God, and *that he* [22] [Arabic, p. 179 ] whom thou didst send is Jesus the Messiah.[^3278][^3279]I glorified thee in the earth, [23] and the work which thou gavest me to do I have accomplished.[^3280]And now glorify thou me, O Father, beside thee, with that glory which I had with thee [24] before the world was.[^3281]I made known thy name to the men whom thou gavest me out of the world: thine they were, and thou gavest them to me; and they have kept [25, 26] thy word.[^3282]Now they[^3283] know that all that thou hast given me is from thee:[^3284]and the sayings which thou gavest me I have given unto them; and they received *them*, and knew of a truth that I came forth from thee, and believed that thou didst send me. [27][^3285]And I ask for their sake: and my asking is not for the world, but for those whom [28] thou hast given me; for they are thine:[^3286]and all that is mine is thine, and all that is [29] thine is mine: and I am glorified in them.[^3287]And now I am not in the world, and they are in the world, and I come to thee. My[^3288] holy Father, keep them in thy [30] name which thou hast given unto me, that they may be one, as we are.[^3289]When I was with them in the world, I kept them in thy name: and I kept those whom thou gavest unto me: and no man of them hath perished, but the son of perdition; that [31] the scripture might be fulfilled.[^3290]Now I come to thee: and this I say in the world, [32] that my joy may be complete in them.[^3291]I have given them thy word; and the world [33] hated them, because they were not of the world, as I was not of the world.[^3292]And I ask not this, that thou take them from the world, but that thou keep them from the [34, 35] evil one.[^3293]They were not of the world, as I was not of the world.[^3294]O Father, sanctify [36] them in thy truth: for thy word is truth.[^3295]And as thou didst send me into the world, I [37] [Arabic, p. 180 ] also send them into the world.[^3296]And for their sake I sanctify myself, that they [38] also may be sanctified in the truth.[^3297]Neither for these alone do I ask, but for [39] the sake of them that believe in me through their word;[^3298]that they may be all one; as thou art in me, and I in thee, and so they also shall be one in us: that the world [40] may believe that thou didst send me.[^3299]And the glory which thou hast given unto [41] me I have given unto them;[^3300]that they may be one, as we are one; I in them, and thou in me, that they may be perfect into[^3301] one; and *that* the world may know that [42] thou didst send me, and that I[^3302] loved them, as thou lovedst me.[^3303]Father, and those whom thou hast given me, I wish that, where I am, they may be with me also; that they may behold my glory, which thou hast given me: for thou lovedst me before [43] the foundation[^3304] of the world.[^3305]My righteous Father,[^3306] and the world knew thee not, [44] but I know thee; and they knew that thou didst send me; and I made known unto them thy name, and will make it known to them;[^3307]that the love *wherewith* thou lovedst me may be in them, and I shall[^3308] be in them." },
  { t = "note", id = "3273", text = "John xvii. 1." },
  { t = "note", id = "3274", text = "John xvii. 2." },
  { t = "note", id = "3275", text = "Lit. *it* or *him*." },
  { t = "note", id = "3276", text = "John xvii. 3." },
  { t = "note", id = "3277", text = "In the Borg. ms. the sentence begins with *that they might*, the preceding clause being omitted." },
  { t = "note", id = "3278", text = "The above is perhaps the most natural rendering of the Arabic; but the latter is really only an awkward word-for-word reproduction of the Peshitta, which means *know thee, who alone art the God of truth, and him whom thou didst send, (even) Jesus the Messiah*." },
  { t = "note", id = "3279", text = "John xvii. 4." },
  { t = "note", id = "3280", text = "John xvii. 5." },
  { t = "note", id = "3281", text = "John xvii. 6." },
  { t = "note", id = "3282", text = "John xvii. 7." },
  { t = "note", id = "3283", text = "So Ciasca’s text. The Vat. ms. has *I*, with the Peshitta and probably Sinaitic." },
  { t = "note", id = "3284", text = "John xvii. 8." },
  { t = "note", id = "3285", text = "John xvii. 9." },
  { t = "note", id = "3286", text = "John xvii. 10." },
  { t = "note", id = "3287", text = "John xvii. 11." },
  { t = "note", id = "3288", text = "So in Sinaitic. The Peshitta omits *My*." },
  { t = "note", id = "3289", text = "John xvii. 12." },
  { t = "note", id = "3290", text = "John xvii. 13." },
  { t = "note", id = "3291", text = "John xvii. 14." },
  { t = "note", id = "3292", text = "John xvii. 15." },
  { t = "note", id = "3293", text = "John xvii. 16." },
  { t = "note", id = "3294", text = "John xvii. 17." },
  { t = "note", id = "3295", text = "John xvii. 18." },
  { t = "note", id = "3296", text = "John xvii. 19." },
  { t = "note", id = "3297", text = "John xvii. 20." },
  { t = "note", id = "3298", text = "John xvii. 21." },
  { t = "note", id = "3299", text = "John xvii. 22." },
  { t = "note", id = "3300", text = "John xvii. 23." },
  { t = "note", id = "3301", text = "Vat. ms. has *as*." },
  { t = "note", id = "3302", text = "*cf*. Peshitta, as pointed in the editions." },
  { t = "note", id = "3303", text = "John xvii. 24." },
  { t = "note", id = "3304", text = "*cf*. § 17, 17, note." },
  { t = "note", id = "3305", text = "John xvii. 25." },
  { t = "note", id = "3306", text = "The Arabic as it stands should mean *My Father is righteous*; but it is simply the ordinary Syriac reading, and is so rendered above." },
  { t = "note", id = "3307", text = "John xvii. 26." },
  { t = "note", id = "3308", text = "Or perhaps *may*." },
]

[[section]]
id = "section-48"
title = "Section XLVIII."
level = 1
blocks = [
  { t = "p", text = "[1][^3309]This said Jesus, and went forth with his disciples to a place which was called Gethsemane,[^3310] on[^3311] the side that is in the plain[^3312] of Kidron, the mountain,[^3313] the place [2] in which was a garden; and he entered thither, he and his disciples.[^3314]And Judas the [3] betrayer knew that place: for Jesus oft-times met with his disciples there.[^3315]And when Jesus came to the place, he said to his disciples, Sit ye here, so that I may go and pray; [4, 5] [Arabic, p. 181 ] and pray ye, that ye enter not into temptations.[^3316]And he took with him Cephas and the sons of Zebedee together, James and John; and he began to [6] look sorrowful, and to be anxious.[^3317]And he said unto them, My soul is distressed unto [7] death: abide ye here, and watch with me.[^3318]And he withdrew from them a little, [8] the space of a stone’s throw;[^3319]and he kneeled,[^3320] and fell on his face, and prayed, so [9] that, if it *were* possible, this hour *might* pass[^3321] him.[^3322]And he said, Father, thou art able for all things; if thou wilt, let this cup pass me:[^3323]but let not my will be *done*, [10] but let thy will be *done*.[^3324]And he came to his disciples, and found them sleeping; [11] and he said unto Cephas, Simon, didst thou sleep?[^3325]Could ye thus not for one hour [12] watch with me?[^3326]Watch and pray, that ye enter not into temptations: the spirit is [13] willing and ready, but the body is weak.[^3327][^3328]And he went again a second time, and prayed, and said, My Father, if it is not possible with regard to[^3329] this cup that it pass, [14] except I drink it, thy will be *done*.[^3330]And he returned again, and found his disciples sleeping, for their eyes were heavy from their grief and anxiety; and they knew not [15] what to say to him.[^3331]And he left them, and went away again, and prayed a third [16] time, and said the very same word.[^3332]And there appeared unto him an angel from [17] heaven, encouraging him.[^3333]And being afraid[^3334] he prayed continuously:[^3335] and his sweat[^3336] [18] [Arabic, p. 182 ] became like a stream of blood, and fell on the ground.[^3337]Then he rose from [19] his prayer, and came to his disciples, and found them sleeping.[^3338]And he [20] said unto them, Sleep now, and rest:[^3339]the end hath arrived,[^3340] and the hour hath come; [21] and behold, the Son of man is betrayed into the hands of sinners.[^3341]Arise, let us go:[^3342] for he hath come that betrayeth me." },
  { t = "note", id = "3309", text = "John xviii. 1." },
  { t = "note", id = "3310", text = "Matt. xxvi. 36." },
  { t = "note", id = "3311", text = "Vat. ms. has *and on*." },
  { t = "note", id = "3312", text = "The word rendered *plain* (*cf*. Dozy, *Supplement, sub voc*.), which occurs also in the text of Ibn-at-Tayyib (*loc. cit*., f. 362*b*), properly means *lake*. The word in the *Jerusalem Lectionary* means *valley* as well as *stream*. For the whole clause *cf*. the text of John xviii. in *Die vier Evangelien, arabisch, aus der Wiener Handschrift*, edited by P. de Lagarde, 1864." },
  { t = "note", id = "3313", text = "*cf*. Sinaitic Syriac and Luke xxii. 39." },
  { t = "note", id = "3314", text = "John xviii. 2." },
  { t = "note", id = "3315", text = "Luke xxii. 40a; Matt. xxvi. 36b." },
  { t = "note", id = "3316", text = "Luke xxii. 40b; Matt. xxvi. 37." },
  { t = "note", id = "3317", text = "Matt. xxvi. 38." },
  { t = "note", id = "3318", text = "Luke xxii. 41a." },
  { t = "note", id = "3319", text = "Mark xiv. 35b." },
  { t = "note", id = "3320", text = "Lit. *fell on his knees*." },
  { t = "note", id = "3321", text = "Lit. *let this hour pass*. The Borg. ms. omits *him*." },
  { t = "note", id = "3322", text = "Mark xiv. 36a." },
  { t = "note", id = "3323", text = "Luke xxii. 42b." },
  { t = "note", id = "3324", text = "Matt. xxvi. 40a; Mark xiv. 37b." },
  { t = "note", id = "3325", text = "Matt. xxvi. 40b." },
  { t = "note", id = "3326", text = "Matt. xxvi. 41a; Matt. xiv. 38b." },
  { t = "note", id = "3327", text = "Lit. *diseased*. The Arabic word is rare in the sense required by the context (*cf*. Pesh.)." },
  { t = "note", id = "3328", text = "Matt. xxvi. 42." },
  { t = "note", id = "3329", text = "This reading would perhaps more easily arise out of the Sinaitic than out of the Peshitta." },
  { t = "note", id = "3330", text = "Mark xiv. 40." },
  { t = "note", id = "3331", text = "Matt. xxvi. 44." },
  { t = "note", id = "3332", text = "Luke xxii. 43." },
  { t = "note", id = "3333", text = "Luke xxii. 44." },
  { t = "note", id = "3334", text = "*cf*. Peshitta. Or, *And although he was afraid*." },
  { t = "note", id = "3335", text = "The Peshitta (hardly Cur.) is capable of this interpretation." },
  { t = "note", id = "3336", text = "*cf*. Syr., especially Peshitta." },
  { t = "note", id = "3337", text = "Luke xxii. 45a." },
  { t = "note", id = "3338", text = "Luke xxii. 46; Matt. xxvi. 45b." },
  { t = "note", id = "3339", text = "Mark xiv. 41b." },
  { t = "note", id = "3340", text = "*cf*. Syr., especially Peshitta." },
  { t = "note", id = "3341", text = "Mark xiv. 42a; Matt. xxvi. 46b." },
  { t = "note", id = "3342", text = "*cf*. § 4, 20, note." },
  { t = "p", text = "[22][^3343]And while he was still speaking, came Judas the betrayer, one of the twelve, and with him a great multitude carrying lanterns and torches[^3344] and swords and staves, from the chief priests and scribes and elders of the people, and with him the footsoldiers [23] of the Romans.[^3345][^3346]And Judas the betrayer gave them a sign, and said, He whom I shall kiss, he is he: take him with care,[^3347] and lead him *away*.[^3348]" },
  { t = "note", id = "3343", text = "Matt. xxvi. 47." },
  { t = "note", id = "3344", text = "John xviii. 3." },
  { t = "note", id = "3345", text = "*cf*. John xviii. 3 (*Jerusalem Lectionary*). In Syriac *Romans* means *soldiers*. The Arabic *footsoldiers* might be *man* (singular)." },
  { t = "note", id = "3346", text = "Matt. xxvi. 48; Mark xiv. 44b." },
  { t = "note", id = "3347", text = "*cf.* Syriac versions. Obviously we must supply a diacritical point over the last radical, or read the middle one as *dhal.*" },
  { t = "note", id = "3348", text = "Lit. *him to* —. Borg. ms. probably means *bear him away*." },
  { t = "p", text = "[24][^3349]And Jesus, because he knew everything that should come upon him, went forth [25] unto them.[^3350]And immediately Judas the betrayer came to Jesus, and said, Peace, [26] my Master; and kissed him.[^3351]And Jesus said unto him, Judas, with a kiss betrayest [27] thou the Son of man?[^3352]*Was it* for that thou camest, my friend? And Jesus said [28] to those that came unto him, Whom seek ye?[^3353]They said unto him, Jesus the Nazarene. Jesus said unto them, I am he. And Judas the betrayer also was standing [29] with them.[^3354]And when Jesus said unto them, I am he, they retreated backward, and [30] fell to the ground.[^3355]And Jesus asked them again, Whom seek ye? They answered, [31] Jesus the Nazarene.[^3356]Jesus said unto them, I told you that I am he: and if ye seek [32] me, let these go away: that the word might be fulfilled which he spake,[^3357]Of those [33] [Arabic, p. 183 ] whom thou hast given me I lost not even one.[^3358]Then came those that were with Judas, and seized Jesus, and took him." },
  { t = "note", id = "3349", text = "John xviii. 4a." },
  { t = "note", id = "3350", text = "Matt. xxvi. 49; Matt. xxvi. 50a." },
  { t = "note", id = "3351", text = "Luke xxii. 48b." },
  { t = "note", id = "3352", text = "Matt. xxvi. 50b; Luke xxii. 52a, c." },
  { t = "note", id = "3353", text = "John xviii. 4b; John xviii. 5." },
  { t = "note", id = "3354", text = "John xviii. 6." },
  { t = "note", id = "3355", text = "John xviii. 7." },
  { t = "note", id = "3356", text = "John xviii. 8." },
  { t = "note", id = "3357", text = "John xviii. 9." },
  { t = "note", id = "3358", text = "Matt. xxvi. 50c." },
  { t = "p", text = "[34][^3359]And when his disciples saw what happened, they said, Our Lord, shall we smite [35] them with swords?[^3360]And Simon Cephas had a sword, and he drew it, and struck the servant of the chief priest, and cut off his right ear. And the name of that servant [36] was Malchus.[^3361]Jesus said unto Cephas, The cup which my Father hath given [37] me, shall I not drink it?[^3362]Put the sword into its sheath: for all that take with[^3363] the [38] sword shall die by the sword.[^3364]Thinkest[^3365] thou that I am not able to ask of my [39] Father, and he shall now raise up for me more than[^3366] twelve tribes of angels?[^3367]Then [40] how should the scriptures which were spoken be fulfilled, that thus it must be?[^3368]Your [41] leave in this.[^3369][^3370]And he touched the ear of him that was struck, and healed it. And in that hour Jesus said to the multitudes, As they come out against a thief are ye come out against me with swords and staves to take me? Daily was I with you in [42] the temple sitting teaching, and ye took me not:[^3371]but this is your hour, and the power [43] of darkness.[^3372]And that was, that the scriptures of the prophets might be fulfilled." },
  { t = "note", id = "3359", text = "Luke xxii. 49." },
  { t = "note", id = "3360", text = "John xviii. 10." },
  { t = "note", id = "3361", text = "John xviii. 11a." },
  { t = "note", id = "3362", text = "John xviii. 11c; Matt. xxvi. 52b." },
  { t = "note", id = "3363", text = "*With*is doubtless an accidental repetition of *by* (the same Arabic particle) in the next clause." },
  { t = "note", id = "3364", text = "Matt. xxvi. 53." },
  { t = "note", id = "3365", text = "The introductory interrogative particle may represent an original *Or*." },
  { t = "note", id = "3366", text = "Vat. ms. omits *than*, and has *more* only in the margin by another hand." },
  { t = "note", id = "3367", text = "Matt. xxvi. 54." },
  { t = "note", id = "3368", text = "Luke xxii. 51b." },
  { t = "note", id = "3369", text = "The phrase is awkward. The rendering is different in the text (f. 292*a*, *cf*. Lagarde, *Die vier Evv*.), and yet again in the comment (f. 293*a*) of Ibn-at-Tayyib’s Commentary." },
  { t = "note", id = "3370", text = "Matt. xxvi. 55." },
  { t = "note", id = "3371", text = "Luke xxii. 53b." },
  { t = "note", id = "3372", text = "Matt. xxvi. 56." },
  { t = "p", text = "[44][^3373]Then the disciples all left him, and fled. And the footsoldiers and the officers [45] and the soldiers[^3374] of the Jews seized Jesus, and came.[^3375]And a certain[^3376] young man [46] followed him, and he was wrapped in a towel, naked:[^3377]and they seized him; so he [47] [Arabic, p. 184 ] left the towel, and fled naked.[^3378]Then they took Jesus, and bound him, and brought him to Annas first; because he was the father in law of Caiaphas, [48] who was chief priest that year.[^3379]And Caiaphas was he that counselled the Jews, that it was necessary that one man should die instead of the people." },
  { t = "note", id = "3373", text = "John xviii. 12a." },
  { t = "note", id = "3374", text = "*cf*. § 11, 11." },
  { t = "note", id = "3375", text = "Mark xiv. 51." },
  { t = "note", id = "3376", text = "Lit. *one*." },
  { t = "note", id = "3377", text = "Mark xiv. 52." },
  { t = "note", id = "3378", text = "John xviii. 12b; John xviii. 13." },
  { t = "note", id = "3379", text = "John xviii. 14." },
  { t = "p", text = "[49][^3380]And Simon Cephas and one of the other disciples followed Jesus. And the chief [50] priest knew that disciple, and he entered with Jesus into the court;[^3381]but Simon was standing without at the door. And that other disciple, whom the chief priest knew, [51] went out and spake unto her that kept the door, and she brought Simon in.[^3382]And when the maid that kept the door saw Simon, she looked stedfastly at him, and said unto him, Art not thou also one of the disciples of this man, I mean Jesus the [52] Nazarene?[^3383]But he denied, and said, Woman, I know him not, neither know I even [53] what thou sayest.[^3384]And the servants and the soldiers rose, and made a fire in the [54] middle of the court, that they might warm themselves; for it was cold.[^3385]And when [55] the fire burned up, they sat down around it.[^3386]And Simon also came, and sat down with them to warm himself, that he might see the end of what should happen." },
  { t = "note", id = "3380", text = "John xviii. 15." },
  { t = "note", id = "3381", text = "John xviii. 16." },
  { t = "note", id = "3382", text = "John xviii. 17a." },
  { t = "note", id = "3383", text = "Luke xxii. 57; Mark xiv. 68b." },
  { t = "note", id = "3384", text = "John xviii. 18a." },
  { t = "note", id = "3385", text = "Luke xxii. 55a." },
  { t = "note", id = "3386", text = "John xviii. 18c; Matt. xxvi. 58b." },
]

[[section]]
id = "section-49"
title = "Section XLIX."
level = 1
blocks = [
  { t = "p", text = "[1, 2][^3387]And the chief priest asked Jesus about his disciples, and about his doctrine.[^3388][^3389]And Jesus said unto him, I was speaking[^3390] openly to the people; and I ever taught in the synagogue, and in the temple, where all the Jews gather; and I have spoken nothing in [3] [Arabic, p. 185 ] secret.[^3391]Why askest thou me? ask those that have heard, what I spake unto [4] them: for they know all that I said.[^3392]And when he had said that, one of the soldiers which were standing *there* struck the cheek[^3393] of Jesus, and said unto him, [5] Dost thou thus answer the chief priest?[^3394]Jesus answered and said unto him, If I [6] have spoken evil, bear witness of evil:[^3395] but if well, why didst thou smite me?[^3396]And Annas sent Jesus bound unto Caiaphas the chief priest." },
  { t = "note", id = "3387", text = "John xviii. 19." },
  { t = "note", id = "3388", text = "*cf*. § 6, 40, note." },
  { t = "note", id = "3389", text = "John xviii. 20." },
  { t = "note", id = "3390", text = "Peshitta, *spake*; Sin. omits the verse; Cur. lacking." },
  { t = "note", id = "3391", text = "John xviii. 21." },
  { t = "note", id = "3392", text = "John xviii. 22." },
  { t = "note", id = "3393", text = "See § 9, 7, note." },
  { t = "note", id = "3394", text = "John xviii. 23." },
  { t = "note", id = "3395", text = "Borg. ms. has *the evil*." },
  { t = "note", id = "3396", text = "John xviii. 24." },
  { t = "p", text = "[7][^3397]And when Jesus went out, Simon Cephas was standing in the outer court warming [8] himself.[^3398]And that maid saw him again, and began to say to those that stood [9] *by*, This *man* also was there with Jesus the Nazarene.[^3399]And those that stood *by* [10] came forward and said to Cephas, Truly thou art one of his disciples.[^3400]And he [11] denied again with an oath, I know not the man.[^3401]And after a little one of the servants of the chief priest, the kinsman of him whose ear Simon cut off, saw him; and [12] he disputed[^3402] and said, Truly this *man* was with him:[^3403]and he also is a Galilæan; [13] and his speech resembles.[^3404][^3405]And he said unto Simon, Did not I see thee with him [14] in the garden?[^3406]Then began Simon to curse,[^3407] and to swear, I know not this man [15] whom ye have mentioned.[^3408]And immediately, while he was speaking, the cock crew [16] twice.[^3409]And in that hour Jesus turned, he being without, and looked stedfastly at Cephas. And Simon remembered the word of our Lord, which he said unto him, [17, 18][^3410]Before the cock crow twice, thou shalt deny me thrice.[^3411]And Simon went forth without, and wept bitterly." },
  { t = "note", id = "3397", text = "John xviii. 25a." },
  { t = "note", id = "3398", text = "Mark xiv. 69a." },
  { t = "note", id = "3399", text = "Matt. xxvi. 71b; Matt. xxvi. 73b." },
  { t = "note", id = "3400", text = "Matt. xxvi. 72." },
  { t = "note", id = "3401", text = "Luke xxii. 58a; John xviii. 26a." },
  { t = "note", id = "3402", text = "This is an alternative meaning of the Syriac word *affirmed*, used in the Peshitta." },
  { t = "note", id = "3403", text = "Luke xxii. 59b." },
  { t = "note", id = "3404", text = "*cf*. Sinaitic (Curetonian wanting). Vat. ms., which Ciasca follows, adds *him* or *it*." },
  { t = "note", id = "3405", text = "Matt. xxvi. 73c; John xviii. 26b." },
  { t = "note", id = "3406", text = "Mark xiv. 71." },
  { t = "note", id = "3407", text = "Borg. ms., by adding diacritical points, gets *asserted*." },
  { t = "note", id = "3408", text = "Luke xxii. 60b." },
  { t = "note", id = "3409", text = "Luke xxii. 61a." },
  { t = "note", id = "3410", text = "Mark xiv. 30b, c." },
  { t = "note", id = "3411", text = "Luke xxii. 62." },
  { t = "p", text = "[19] [Arabic, p. 186 ][^3412]And when the morning approached, the servants of all the chief priests and the scribes and the elders of the people and all the multitude assembled, [20, 21] and made a plot;[^3413]and they took counsel against Jesus to put him to death.[^3414]And they sought false witnesses who should witness against him, that they might put him to [22, 23] death, and they found not;[^3415]but many false witnesses came,[^3416]but their witness did not [24, 25] agree.[^3417]But at last there came two lying witnesses,[^3418]and said, We heard him say, I will destroy this[^3419] temple of God that is made with hands, and will build another not [26, 27] made with hands after three days.[^3420]And not even so did their witness agree. But Jesus was silent.[^3421]And the chief priest rose in the midst, and asked Jesus, and said, [28][^3422]Answerest thou not a word concerning anything? what do these[^3423] witness against [29, 30] thee?[^3424]But Jesus was silent, and answered him nothing.[^3425]And they took him up [31] into their assembly,[^3426] and said unto him, If thou art the Messiah, tell us.[^3427]He said [32] unto them, If I tell you, ye will not believe me:[^3428]and if I ask you, ye will not answer [33] me a word, nor let me go.[^3429]And the chief priest answered and said unto him, I adjure thee by the living God, that thou tell us whether thou art the Messiah, the [34, 35] Son of the living God.[^3430]Jesus said unto him, Thou hast said that I am he.[^3431]They all said unto him, Then thou art now the Son of God? Jesus said, Ye have said [36] that I am he.[^3432]I say unto you, that henceforth ye shall see the Son of man sitting [37] [Arabic, p. 187 ] at the right hand of power, and coming on the clouds of heaven.[^3433]Then the [38] chief priest rent his tunic,[^3434] and said, He hath blasphemed.[^3435]And they all said, Why should we seek now witnesses? we have heard now the blasphemy from his mouth. [39, 40] What then think ye?[^3436]They all answered and said, He is worthy of death.[^3437]Then some of them drew near, and spat in his face, and struck him, and scoffed at him. [41][^3438]And the soldiers struck him on his cheeks,[^3439] and said, Prophesy unto us, *thou* Messiah: [42] who is he that struck thee?[^3440]And many other things spake they falsely,[^3441] and said against him." },
  { t = "note", id = "3412", text = "Luke xxii. 66a." },
  { t = "note", id = "3413", text = "Matt. xxvii. 1b." },
  { t = "note", id = "3414", text = "Matt. xxvi. 59b." },
  { t = "note", id = "3415", text = "Matt. xxvi. 60a." },
  { t = "note", id = "3416", text = "Mark xiv. 59." },
  { t = "note", id = "3417", text = "Matt. xxvi. 60b." },
  { t = "note", id = "3418", text = "Mark xiv. 57b; Mark xiv. 58." },
  { t = "note", id = "3419", text = "Syriac order, but not in agreement with the versions." },
  { t = "note", id = "3420", text = "Mark xiv. 59; Matt. xxvi. 63a." },
  { t = "note", id = "3421", text = "Mark xiv. 60a." },
  { t = "note", id = "3422", text = "Matt. xxvi. 62b." },
  { t = "note", id = "3423", text = "Vat. ms. has *anything, when these*." },
  { t = "note", id = "3424", text = "Mark xiv. 61a." },
  { t = "note", id = "3425", text = "Luke xxii. 66b." },
  { t = "note", id = "3426", text = "The word usually means *synagogue* in this work." },
  { t = "note", id = "3427", text = "Luke xxii. 67." },
  { t = "note", id = "3428", text = "Luke xxii. 68." },
  { t = "note", id = "3429", text = "Matt. xxvi. 63b." },
  { t = "note", id = "3430", text = "Matt. xxvi. 64a." },
  { t = "note", id = "3431", text = "Luke xxii. 70." },
  { t = "note", id = "3432", text = "Matt. xxvi. 64b." },
  { t = "note", id = "3433", text = "Mark xiv. 63a; Matt. xxvi. 65b." },
  { t = "note", id = "3434", text = "The foreign word used in the Peshitta is preserved. The Sinaitic uses a Syriac word meaning *garment*." },
  { t = "note", id = "3435", text = "Luke xxii. 71." },
  { t = "note", id = "3436", text = "Mark xiv. 64b; Matt. xxvi. 66." },
  { t = "note", id = "3437", text = "Mark xiv. 65a; Luke xxii. 63b." },
  { t = "note", id = "3438", text = "Mark xiv. 65c; Matt. xxvi. 68." },
  { t = "note", id = "3439", text = "See § 9, 7, note." },
  { t = "note", id = "3440", text = "Luke xxii. 65." },
  { t = "note", id = "3441", text = "See § 7, 17, note." },
  { t = "p", text = "[43][^3442]And all of their assembly arose,[^3443] and took Jesus, and brought him bound[^3444] to [44] the prætorium,[^3445] and delivered him up to Pilate the judge;[^3446]but they entered not into the prætorium, that they might not be defiled when they should eat the passover." },
  { t = "note", id = "3442", text = "John xviii. 28; Mark xv. 1b." },
  { t = "note", id = "3443", text = "*cf*. Luke xxiii. 1a." },
  { t = "note", id = "3444", text = "*cf.* Matt. xxvii. 2; Mark xv. 1." },
  { t = "note", id = "3445", text = "Arabic, *diwdn*." },
  { t = "note", id = "3446", text = "John xviii. 28c." },
  { t = "p", text = "[45][^3447]And Jesus stood before the judge. And Pilate went forth unto them without, and [46] said unto them, What accusation[^3448] have ye against this man?[^3449]They answered and said unto him, If he had not been doing evils, neither should we have delivered [47] him up unto thee.[^3450]We found this *man* leading our people astray, and restraining from giving tribute to Cæsar, and saying of himself that he is the King, the Messiah. [48][^3451]Pilate said unto them, Then take ye him, and judge him according to your law. [Arabic, p. 188 ] The Jews said unto him, We have no authority to put a man to death: [49][^3452]that the word might be fulfilled, which Jesus spake, when he made known by what manner of death he was to die." },
  { t = "note", id = "3447", text = "Matt. xxvii. 11a; John xviii. 29." },
  { t = "note", id = "3448", text = "Lit. *plea*." },
  { t = "note", id = "3449", text = "John xviii. 30." },
  { t = "note", id = "3450", text = "Luke xxiii. 2b." },
  { t = "note", id = "3451", text = "John xviii. 31." },
  { t = "note", id = "3452", text = "John xviii. 32." },
  { t = "p", text = "[50][^3453]And Pilate entered into the prætorium, and called Jesus, and said unto him, Art [51] thou the King of the Jews?[^3454]Jesus said unto him, Of thyself saidst thou this, or [52] did others tell it thee concerning me?[^3455]Pilate said unto him, Am I, forsooth,[^3456] a Jew? The sons of thy nation[^3457] and the chief priests delivered thee unto me: what [53] hast thou done?[^3458]Jesus said unto him, My kingdom is not of this world: if my kingdom were of this world, then would my servants fight, that I should not be [54] delivered to the Jews: now my kingdom is not from hence.[^3459]Pilate said unto him, Then *thou art* a king? Jesus said unto him, Thou hast said that I am a king. And for this was I born, and for this came I into the world, that I should bear witness [55] of the truth.[^3460]And every one that is of the truth heareth my voice. Pilate said unto him, And what is the truth? And when he said that, he went out again unto the Jews." },
  { t = "note", id = "3453", text = "John xviii. 33." },
  { t = "note", id = "3454", text = "John xviii. 34." },
  { t = "note", id = "3455", text = "John xviii. 35." },
  { t = "note", id = "3456", text = "See § 4, 24, note." },
  { t = "note", id = "3457", text = "The Syriac word." },
  { t = "note", id = "3458", text = "John xviii. 36." },
  { t = "note", id = "3459", text = "John xviii. 37." },
  { t = "note", id = "3460", text = "John xviii. 38a." },
]

[[section]]
id = "section-50"
title = "Section L."
level = 1
blocks = [
  { t = "p", text = "[1][^3461]And Pilate said unto the chief priests and the multitude, I have not found [2] against this man anything.[^3462]But they cried out and said, He hath disquieted[^3463] our people with his teaching in all Judæa, and he began[^3464] from Galilee and unto this [3] place.[^3465]And Pilate, when he heard the name of Galilee, asked, Is this man a Galilæan? [4][^3466]And when he learned that he was under the jurisdiction of Herod, he sent him to Herod: for he was in Jerusalem in those days." },
  { t = "note", id = "3461", text = "Luke xxiii. 4." },
  { t = "note", id = "3462", text = "Luke xxiii. 5." },
  { t = "note", id = "3463", text = "Or, *led astray* (*cf*. § 25, 17, note)." },
  { t = "note", id = "3464", text = "*cf*. Syriac versions." },
  { t = "note", id = "3465", text = "Luke xxiii. 6." },
  { t = "note", id = "3466", text = "Luke xxiii. 7." },
  { t = "p", text = "[5][^3467]And Herod, when he saw Jesus, rejoiced exceedingly: for he had desired to see him for a long time, because he had heard regarding him many things; and he counted on[^3468] [6] [Arabic, p. 189 ] seeing some sign from him.[^3469]And he questioned him with many words; but [7] Jesus answered him not a word.[^3470]And the scribes and chief priests were [8] standing *by*, and they accused him vehemently.[^3471]And Herod scoffed at him, he and his servants; and when he had scoffed at him, he clothed him in robes of scarlet, [9] and sent him to Pilate.[^3472]And on that day Pilate and Herod became friends, there having been[^3473] enmity between them before that." },
  { t = "note", id = "3467", text = "Luke xxiii. 8." },
  { t = "note", id = "3468", text = "Same word as in § 10, 16 (see note there)." },
  { t = "note", id = "3469", text = "Luke xxiii. 9." },
  { t = "note", id = "3470", text = "Luke xxiii. 10." },
  { t = "note", id = "3471", text = "Luke xxiii. 11." },
  { t = "note", id = "3472", text = "Luke xxiii. 12." },
  { t = "note", id = "3473", text = "Lit. *and there was*." },
  { t = "p", text = "[10, 11][^3474]And Pilate called the chief priests and the rulers of the people,[^3475]and said unto them, Ye brought unto me this man, as the perverter of your people: and I have tried him before you, and have not found in this man any cause[^3476] of all that ye [12] seek[^3477] against him:[^3478]nor yet Herod: for I sent him unto him; and he hath done [13] nothing for which he should deserve death.[^3479]So now I will chastise him, and let [14, 15] him go.[^3480]The multitude all cried out and said, Take him from us, take him.[^3481]And [16] the chief priests and the elders accused him of many things.[^3482]And during their [17] accusation he answered not a word.[^3483]Then Pilate said unto him, Hearest thou not [18] how many *things* they witness against thee?[^3484]And he answered him not, not even one word: and Pilate marvelled at that." },
  { t = "note", id = "3474", text = "Luke xxiii. 13." },
  { t = "note", id = "3475", text = "Luke xxiii. 14." },
  { t = "note", id = "3476", text = "The Arabic word may also, like the Syriac, mean *thing*, but hardly, as that does here, *fault* or *crime*. The Vat. ms., pointing differently, reads *thing*. The same confusion occurs at § 40, 35 (*cf*. a converse case in § 25, 40)." },
  { t = "note", id = "3477", text = "So Ciasca’s text, following the Borg. ms. The Vat. ms. has *plotted*, which is nearer the Syriac *accuse*." },
  { t = "note", id = "3478", text = "Luke xxiii. 15." },
  { t = "note", id = "3479", text = "Luke xxiii. 16." },
  { t = "note", id = "3480", text = "Luke xxiii. 18a." },
  { t = "note", id = "3481", text = "Mark xv. 3a." },
  { t = "note", id = "3482", text = "Matt. xxvii. 12." },
  { t = "note", id = "3483", text = "Matt. xxvii. 13." },
  { t = "note", id = "3484", text = "Matt. xxvii. 14." },
  { t = "p", text = "[19][^3485]And when the judge sat on his tribune, his wife sent unto him, and said unto him, See that thou have nothing to do with that righteous *man*: for I have suffered much in my dream[^3486] to-day because of him." },
  { t = "note", id = "3485", text = "Matt. xxvii. 19." },
  { t = "note", id = "3486", text = "See § 3, 12, note." },
  { t = "p", text = "[20][^3487]And at every feast the custom of the judge was to release to the people one [21] prisoner, him whom they would.[^3488]And there was in their prison a well-known prisoner, [22, 23] called Barabbas.[^3489]And when they assembled, Pilate said unto them,[^3490]Ye have a custom, that I should release unto you a prisoner at the passover: will ye that I [24] release unto you the King of the Jews?[^3491]And they all cried out and said, Release not [Arabic, p. 190 ] unto us this *man*, but release unto us Barabbas. And this Barabbas was a [25] robber,[^3492]who for sedition[^3493] and murder, which was in the city, was cast into the [26] prison.[^3494]And all the people cried out and began to ask *him to do* as the custom was [27] that he should do with them.[^3495]And Pilate answered and said unto them, Whom will ye that I release unto you? Barabbas, or Jesus which is called the Messiah, the [28] King of the Jews?[^3496]For Pilate knew that envy had moved them to deliver him up. [29][^3497]And the chief priests and the elders asked the multitudes to deliver Barabbas, and [30] to destroy Jesus.[^3498]The judge answered and said unto them, Whom of the two will [31] ye that I release unto you? They said, Barabbas.[^3499]Pilate said unto them, And [32] Jesus which is called the Messiah, what shall I do with him?[^3500]They all cried out [33] and said, Crucify him.[^3501]And Pilate spake to them again, for he desired to release [34] Jesus;[^3502]but they cried out and said, Crucify him, crucify him, and release unto us [35] Barabbas.[^3503]And Pilate said unto them a third time, What evil hath this *man* done? I have not found in him any cause[^3504] to necessitate death: I will chastise him and [36] let him go.[^3505]But they increased in importunity[^3506] with a loud voice, and asked him to crucify him. And their voice, and the voice of the chief priests, prevailed. [37][^3507]Then Pilate released unto them that one who was cast into prison for sedition and murder, Barabbas, whom they asked for:[^3508]and he scourged Jesus with whips.[^3509]" },
  { t = "note", id = "3487", text = "Matt. xxvii. 15." },
  { t = "note", id = "3488", text = "Matt. xxvii. 16." },
  { t = "note", id = "3489", text = "Matt. xxvii. 17a." },
  { t = "note", id = "3490", text = "John xviii. 39." },
  { t = "note", id = "3491", text = "John xviii. 40." },
  { t = "note", id = "3492", text = "Luke xxiii. 19." },
  { t = "note", id = "3493", text = "Ciasca’s text, following the Vat. ms., has *disorder*. Borg. ms. has *division (cf. heresies*, Curetonian of § 50, 37), which by addition of a diacritical point gives *sedition*; *cf*. § 50, 37 (Ciasca, following Vat. ms.), and Peshitta (both places)." },
  { t = "note", id = "3494", text = "Mark xv. 8." },
  { t = "note", id = "3495", text = "Mark xv. 9a; Matt. xxvii. 17b." },
  { t = "note", id = "3496", text = "Matt. xxvii. 18." },
  { t = "note", id = "3497", text = "Matt. xxvii. 20." },
  { t = "note", id = "3498", text = "Matt. xxvii. 21." },
  { t = "note", id = "3499", text = "Matt. xxvii. 22a." },
  { t = "note", id = "3500", text = "Mark xv. 13." },
  { t = "note", id = "3501", text = "Luke xxiii. 20." },
  { t = "note", id = "3502", text = "Luke xxiii. 21." },
  { t = "note", id = "3503", text = "Luke xxiii. 22." },
  { t = "note", id = "3504", text = "Our translator has retained the Syriac word, which in this context means *fault* (see § 50, 11, note)." },
  { t = "note", id = "3505", text = "Luke xxiii. 23." },
  { t = "note", id = "3506", text = "The word used in Vat ms. means a repeated *charge* or *attack*. That in Borg. ms. is probably used in the post-classical sense of *importuning him*. Either word might be written by a copyist for the other. The same double reading probably occurs again at § 53, 55." },
  { t = "note", id = "3507", text = "Mark xv. 15a; Luke xxiii. 25a." },
  { t = "note", id = "3508", text = "Matt. xxvii. 26b." },
  { t = "note", id = "3509", text = "*cf*. Syriac versions." },
  { t = "p", text = "[38][^3510]Then the footsoldiers of the judge took Jesus, and went into the prætorium, and [39] [Arabic, p. 191 ] gathered unto him all of the footsoldiers.[^3511]And they stripped him, and put on [40] him a scarlet cloak.[^3512]And they clothed him in garments of purple, and plaited [41] a crown of thorns, and placed it on his head, and a reed in his right hand;[^3513]and while they mocked at him and laughed, they fell down on their knees before him, and bowed [42] down to[^3514] him, and said, Hail,[^3515] King of the Jews![^3516]And they spat in his face, and took the reed from his hand, and struck him on his head,[^3517]and smote his cheeks. [43][^3518]And Pilate went forth without again, and said unto the Jews, I bring him forth to [44] you, that ye may know that I do not find, in examining[^3519] him, even one crime.[^3520][^3521]And Jesus went forth without, wearing the crown of thorns and the purple garments. [45][^3522]Pilate said unto them, Behold, the man! And when the chief priests and the soldiers[^3523] saw him, they cried out and said, Crucify him, crucify him. Pilate said unto them, Take him yourselves, and crucify him: for I find not a cause[^3524] against [46] him.[^3525]The Jews said unto him, We have a law, and according to our law he deserves [47] death, because he made himself the Son of God.[^3526]And when Pilate heard this word, [48] his fear increased;[^3527]and he entered again into the porch, and said to Jesus, Whence [49] art thou?[^3528]But Jesus answered him not a word. Pilate said unto him, Speakest[^3529] thou not unto me? knowest thou not that I have authority to release thee, and have [50] authority to crucify thee?[^3530]Jesus said unto him, Thou hast not any[^3531] authority over me, if thou wert not given *it* from above: therefore the sin of him that delivered [51] me up unto thee is greater than thy sin.[^3532]And for this word Pilate wished to release him: but the Jews cried out, If thou let him go, thou art not a friend of Cæsar: for every one that maketh himself a king is against Cæsar." },
  { t = "note", id = "3510", text = "Matt. xxvii. 27." },
  { t = "note", id = "3511", text = "Matt. xxvii. 28." },
  { t = "note", id = "3512", text = "John xix. 2." },
  { t = "note", id = "3513", text = "Matt. xxvii. 29b." },
  { t = "note", id = "3514", text = "This may be a mere clerical error (very natural in Arabic) for *scoffed* at, the reading of the Syriac versions. This being so, it is worthy of remark that the reading is apparently common to the two mss. The Syriac words are, however, also somewhat similar. The *Jerusalem Lectionary* has a word agreeing with the text above." },
  { t = "note", id = "3515", text = "Lit. *Peace*." },
  { t = "note", id = "3516", text = "Matt. xxvii. 30." },
  { t = "note", id = "3517", text = "John xix. 3b." },
  { t = "note", id = "3518", text = "John xix. 4." },
  { t = "note", id = "3519", text = "This reading may be a corruption of a very literal rendering of the Peshitta." },
  { t = "note", id = "3520", text = "*cf*. § 50, 11." },
  { t = "note", id = "3521", text = "John xix. 5." },
  { t = "note", id = "3522", text = "John xix. 6." },
  { t = "note", id = "3523", text = "*cf*. § 11, 11, note." },
  { t = "note", id = "3524", text = "See § 50, 35, note." },
  { t = "note", id = "3525", text = "John xix. 7." },
  { t = "note", id = "3526", text = "John xix. 8." },
  { t = "note", id = "3527", text = "John xix. 9." },
  { t = "note", id = "3528", text = "John xix. 10." },
  { t = "note", id = "3529", text = "Borg. ms., *Why speakest*; a reading that might be a corruption of the Peshitta." },
  { t = "note", id = "3530", text = "John xix. 11." },
  { t = "note", id = "3531", text = "Lit. *even one* (Pesh.)." },
  { t = "note", id = "3532", text = "John xix. 12." },
]

[[section]]
id = "section-51"
title = "Section LI."
level = 1
blocks = [
  { t = "p", text = "[1] [Arabic, p. 192 ][^3533]And when Pilate heard this saying, he took Jesus out, and sat on the tribune in the place which was called the pavement of stones, but in the Hebrew [2] called Gabbatha.[^3534]And that day was the Friday of the passover: and it had reached [3] about the sixth hour.[^3535][^3536]And he said to the Jews, Behold, your King! And they cried out, Take him, take him, crucify him, crucify him. Pilate said unto them, Shall I crucify your King? The chief priests said unto him, We have no king except [4] Cæsar.[^3537]And Pilate, when he saw *it*, and[^3538] he was gaining nothing, but the tumult was increasing, took water, and washed his hands before the multitude, and said, I [5] am innocent of the blood of this innocent *man*: ye shall know.[^3539][^3540]And all the people [6] answered and said, His blood be on us, and on our children.[^3541]Then Pilate commanded to grant them their request; and delivered up Jesus to be crucified, according to their wish." },
  { t = "note", id = "3533", text = "John xix. 13." },
  { t = "note", id = "3534", text = "John xix. 14." },
  { t = "note", id = "3535", text = "Lit. *six hours*." },
  { t = "note", id = "3536", text = "John xix. 15." },
  { t = "note", id = "3537", text = "Matt. xxvii. 24." },
  { t = "note", id = "3538", text = "Or, *that*." },
  { t = "note", id = "3539", text = "*cf*. Peshitta. Or, *Ye know* (*cf*. Sinaitic)." },
  { t = "note", id = "3540", text = "Matt. xxvii. 25." },
  { t = "note", id = "3541", text = "John xix. 16a." },
  { t = "p", text = "[7][^3542]Then Judas the betrayer, when he saw Jesus wronged, went and returned the [8] thirty *pieces* of money to the chief priests and the elders,[^3543]and said, I have sinned in my betraying innocent blood. And they said unto him, And we, what must we *do*? [9] know thou.[^3544]And he threw down the money in the temple, and departed; and *he* [10] went away[^3545] and hanged[^3546] himself.[^3547]And the chief priests took the money, and said, We have not authority to cast it into the place of the offering,[^3548] for it is the price [11] of blood.[^3549]And they took counsel, and bought with it the plain of the potter, for [12] the burial of strangers.[^3550]Therefore that plain was called, The field of blood, unto [13] [Arabic, p. 193 ] this day.[^3551]Therein[^3552] was fulfilled the saying in the prophet which said, I took thirty *pieces* of money, the price of the precious *one, which was* fixed [14] by the children of Israel;[^3553]and I paid them for the plain of the potter, as the Lord commanded me." },
  { t = "note", id = "3542", text = "Matt. xxvii. 3." },
  { t = "note", id = "3543", text = "Matt. xxvii. 4." },
  { t = "note", id = "3544", text = "Matt. xxvii. 5." },
  { t = "note", id = "3545", text = "Borg. ms. omits *and he went away*." },
  { t = "note", id = "3546", text = "Lit. *strangled*." },
  { t = "note", id = "3547", text = "Matt. xxvii. 6." },
  { t = "note", id = "3548", text = "*cf*. § 32, 15, note." },
  { t = "note", id = "3549", text = "Matt. xxvii. 7." },
  { t = "note", id = "3550", text = "Matt. xxvii. 8." },
  { t = "note", id = "3551", text = "Matt. xxvii. 9." },
  { t = "note", id = "3552", text = "Or, *at that (time*)." },
  { t = "note", id = "3553", text = "Matt. xxvii. 10." },
  { t = "p", text = "[15][^3554]And the Jews took Jesus, and went away to crucify him.[^3555]And when he bare his [16] cross and went out, they stripped him of those purple and scarlet garments which he [17] had on, and put on him his *own* garments.[^3556]And while they were going with him, they found a man, a Cyrenian, coming from the country, named Simon, the father of Alexander and Rufus:[^3557]and they compelled this *man* to bear the cross of Jesus. [18][^3558]And they took the cross and laid it upon him, that he might bear it, and come after Jesus; and Jesus went, and his cross behind him." },
  { t = "note", id = "3554", text = "John xix. 16b; Mark xv. 20b." },
  { t = "note", id = "3555", text = "John xix. 17a; Matt. xxvii. 31b." },
  { t = "note", id = "3556", text = "Matt. xxvii. 32a; Mark xv. 21b." },
  { t = "note", id = "3557", text = "Matt. xxvii. 32b." },
  { t = "note", id = "3558", text = "Luke xxiii. 26b." },
  { t = "p", text = "[19][^3559]And there followed him much people, and women which were lamenting and [20] raving.[^3560][^3561]But Jesus turned unto them and said, Daughters of Jerusalem, weep not [21] for me: weep for yourselves, and for your children.[^3562]Days are coming, when they shall say, Blessed are the barren, and the wombs that bare not, and the breasts [22] that gave not suck.[^3563]Then shall they begin to say to the mountains, Fall on us; and [23] to the hills, Cover us.[^3564]For if they do so in the green tree,[^3565] what shall be in the dry?" },
  { t = "note", id = "3559", text = "Luke xxiii. 27." },
  { t = "note", id = "3560", text = "Lit. *being burned*. The text is probably corrupt." },
  { t = "note", id = "3561", text = "Luke xxiii. 28." },
  { t = "note", id = "3562", text = "Luke xxiii. 29." },
  { t = "note", id = "3563", text = "Luke xxiii. 30." },
  { t = "note", id = "3564", text = "Luke xxiii. 31." },
  { t = "note", id = "3565", text = "Lit. *wood* (*cf*. Syr. and Greek)." },
  { t = "p", text = "[24][^3566]And they brought with Jesus two others of the malefactors,[^3567] to be put to death." },
  { t = "note", id = "3566", text = "Luke xxiii. 32." },
  { t = "note", id = "3567", text = "Or, *others, malefactors*." },
  { t = "p", text = "[25][^3568]And when they came unto a certain place called The skull, and called in the Hebrew Golgotha, they crucified him there:[^3569]they crucified with him these two [26] malefactors, one on his right, and the other on his left.[^3570]And the scripture was [27] [Arabic, p. 194 ] fulfilled, which saith, He was numbered with the transgressors.[^3571]And they gave him to drink wine and myrrh, and vinegar which had been mixed with the myrrh;[^3572]and he tasted, and would not drink; and he received it not." },
  { t = "note", id = "3568", text = "Luke xxiii. 33a; John xix. 17c." },
  { t = "note", id = "3569", text = "Luke xxiii. 33b." },
  { t = "note", id = "3570", text = "Mark xv. 28." },
  { t = "note", id = "3571", text = "Mark xv. 23a." },
  { t = "note", id = "3572", text = "Matt. xxvii. 34b; Mark xv. 23b." },
  { t = "p", text = "[28][^3573]And the soldiers, when they had crucified Jesus, took his garments, and cast lots for them in four parts, to every party of the soldiers a part; and his tunic was [29] without sewing, from the top woven throughout.[^3574]And they said one to another, Let us not rend it, but cast lots for it, whose it shall be: and the scripture was fulfilled, which saith," },
  { t = "note", id = "3573", text = "John xix. 23." },
  { t = "note", id = "3574", text = "John xix. 24." },
  { t = "p", text = "They divided my garments among them," },
  { t = "p", text = "And cast the lot for my vesture." },
  { t = "p", text = "[30, 31][^3575]This the soldiers did. And they sat and guarded him there.[^3576]And Pilate wrote on a tablet the cause of his death, and put it on the wood of the cross above his head.[^3577] And there was written upon it thus: This is Jesus the Nazarene, the King of the [32] Jews.[^3578]And this tablet[^3579] read many of the Jews: for the place where Jesus was crucified was near the city: and it was written in Hebrew and Greek and Latin. [33][^3580]And the chief priests said unto Pilate, Write not, The King of the Jews; but, He it is [34] that[^3581] said, I am the King of the Jews.[^3582]Pilate said unto them, What hath been [35] written hath been written.[^3583][^3584]And the people were standing beholding; and they [36] that passed by were reviling[^3585] him, and shaking[^3586] their heads, and saying,[^3587]Thou that destroyest the temple, and buildest it in three days,[^3588]save thyself if thou art the Son [37] of God, and come down from the cross.[^3589]And in like manner the chief priests and the [Arabic, p. 195 ] scribes and the elders and the Pharisees derided him, and laughed one with [38, 39] another, and said,[^3590]The saviour of others cannot save himself.[^3591]If he is the Messiah, the chosen of God, and the King of Israel,[^3592] let him come down now from the [40] cross, that we may see, and believe in him.[^3593]He that relieth on God—let him deliver him [41] now, if he is pleased with him: for he said, I am the Son of God.[^3594]And the soldiers [42] also scoffed at him in that they came near unto him,[^3595]and brought him vinegar, and [43] said unto him, If thou art the King of the Jews, save thyself.[^3596]And likewise the two robbers[^3597] also that were crucified with him reproached him." },
  { t = "note", id = "3575", text = "Matt. xxvii. 36." },
  { t = "note", id = "3576", text = "John xix. 19." },
  { t = "note", id = "3577", text = "Matt. xxvii. 37." },
  { t = "note", id = "3578", text = "John xix. 20." },
  { t = "note", id = "3579", text = "A different word from that in the preceding verse; in each case, the word used in the Peshitta (Cur. and Sin. lacking)." },
  { t = "note", id = "3580", text = "John xix. 21." },
  { t = "note", id = "3581", text = "The Syriac words, retained in Ibn-at-Tayyib’s Commentary (f. 366*a*), seem to have been transposed. Vat. ms. omits *he*, probably meaning *but that he said*." },
  { t = "note", id = "3582", text = "John xix. 22." },
  { t = "note", id = "3583", text = "In a carelessly written Arabic ms. there is almost no difference between *hath been written* and *I have written*, as it is in Ibn-at-Tayyib (*loc. cit*., f. 366*a*)." },
  { t = "note", id = "3584", text = "Luke xxiii. 35a; Matt. xxvii. 39." },
  { t = "note", id = "3585", text = "*cf*. § 7, 17, note. Borg. ms. has *jesting at.*" },
  { t = "note", id = "3586", text = "The Arabic text has *deriding* (*cf*. § 51, 37). Either *with* is accidentally omitted, or, more probably, we should correct the spelling to *shaking* (*cf*. Syriac versions)." },
  { t = "note", id = "3587", text = "Matt. xxvii. 40a; Mark xv. 29." },
  { t = "note", id = "3588", text = "Matt. xxvii. 40c." },
  { t = "note", id = "3589", text = "Matt. xxvii. 41." },
  { t = "note", id = "3590", text = "Matt. xxvii. 42a." },
  { t = "note", id = "3591", text = "Luke xxiii. 35c; Matt. xxvii. 42c." },
  { t = "note", id = "3592", text = "Verse 37 or Mt." },
  { t = "note", id = "3593", text = "Matt. xxvii. 43." },
  { t = "note", id = "3594", text = "Luke xxiii. 36." },
  { t = "note", id = "3595", text = "Luke xxiii. 37." },
  { t = "note", id = "3596", text = "Matt. xxvii. 44." },
  { t = "note", id = "3597", text = "Borg. ms. has *boys* (an easy clerical error)." },
  { t = "p", text = "[44][^3598]And one of those two malefactors who were crucified with him reviled him, and [45] said, If thou art the Messiah, save thyself, and save us also.[^3599]But his comrade rebuked him, and said, Dost thou not even fear God, being thyself also in this [46] condemnation?[^3600]And we with justice, and as we deserved, and according to our deed,[^3601] have we been rewarded: but this *man* hath not done anything unlawful. [47][^3602]And he said unto Jesus, Remember me, my Lord, when thou comest in thy kingdom. [48][^3603]Jesus said unto him, Verily[^3604] I say unto thee, To-day shalt thou be with me in Paradise." },
  { t = "note", id = "3598", text = "Luke xxiii. 39." },
  { t = "note", id = "3599", text = "Luke xxiii. 40." },
  { t = "note", id = "3600", text = "Luke xxiii. 41." },
  { t = "note", id = "3601", text = "*Our deed* might be read *we have done*, and perhaps our translator’s style would justify our writing *as* for *to*." },
  { t = "note", id = "3602", text = "Luke xxiii. 42." },
  { t = "note", id = "3603", text = "Luke xxiii. 43." },
  { t = "note", id = "3604", text = "Borg. ms. has *Verily, verily*." },
  { t = "p", text = "[49][^3605]And there stood by the cross of Jesus his mother, and his mother’s sister,[^3606] [50] Mary[^3607] that was related to Clopas, and Mary Magdalene.[^3608]And Jesus saw his mother, and that disciple whom he loved standing *by*; and he said to his mother, [51] Woman, behold, thy son![^3609]And he said to that disciple, Behold, thy mother! And from that hour that disciple took her unto him*self*." },
  { t = "note", id = "3605", text = "John xix. 25." },
  { t = "note", id = "3606", text = "A single word in Arabic." },
  { t = "note", id = "3607", text = "Vat. ms. has *and Mary*." },
  { t = "note", id = "3608", text = "John xix. 26." },
  { t = "note", id = "3609", text = "John xix. 27." },
  { t = "p", text = "[52] [Arabic, p. 196 ][^3610]And from the sixth hour[^3611] darkness was on all the land unto the ninth [53] hour,[^3612] and the sun became dark.[^3613]And at the ninth hour Jesus cried out with a loud voice, and said, Yail, Yaili,[^3614] why hast thou forsaken me? which[^3615] is, My [54] God, my God, why hast thou forsaken me?[^3616]And some of those that stood there, when they heard, said,[^3617] This *man* called Elijah." },
  { t = "note", id = "3610", text = "Matt. xxvii. 45a; Luke xxiii. 44b." },
  { t = "note", id = "3611", text = "Lit *six hours* and *nine hours* respectively." },
  { t = "note", id = "3612", text = "Lit *six hours* and *nine hours* respectively." },
  { t = "note", id = "3613", text = "Luke xxiii. 45a; Mark xv. 34." },
  { t = "note", id = "3614", text = "In Vat. ms. the second word is like the first. The syllable *Ya* doubtless is the Arabic interjection *O!*" },
  { t = "note", id = "3615", text = "The Borg. ms. omits from *which* to *me*." },
  { t = "note", id = "3616", text = "Matt. xxvii. 47." },
  { t = "note", id = "3617", text = "Borg. ms. omits *when they*, and has *and said*." },
]

[[section]]
id = "section-52"
title = "Section LII."
level = 1
blocks = [
  { t = "p", text = "[1][^3618]And after that, Jesus knew that all things were finished; and that the scripture [2] might be accomplished, he said, I thirst.[^3619]And there was set a vessel full of vinegar: and in that hour one of them hasted, and took a sponge, and filled it with that [3] vinegar,[^3620]and fastened it on a reed, and brought it near[^3621] his mouth to give him a [4] drink.[^3622]And when Jesus had taken that vinegar, he said, Everything is finished. [5][^3623]But the rest said, Let be, that we may[^3624] see whether Elijah cometh to save him. [6, 7][^3625]And Jesus said, My Father, forgive them; for they know not what they do. And Jesus cried again with a loud voice, and said, My Father, into thy hands I commend[^3626] my spirit.[^3627]He said that, and bowed his head, and gave up his spirit." },
  { t = "note", id = "3618", text = "John xix. 28." },
  { t = "note", id = "3619", text = "John xix. 29a; Matt. xxvii. 48." },
  { t = "note", id = "3620", text = "Mark xv. 36b." },
  { t = "note", id = "3621", text = "*cf*. § 12, 13, note." },
  { t = "note", id = "3622", text = "John xix. 30a." },
  { t = "note", id = "3623", text = "Matt. xxvii. 49; Luke xxiii. 34." },
  { t = "note", id = "3624", text = "Or, *Let us*." },
  { t = "note", id = "3625", text = "Luke xxiii. 46a." },
  { t = "note", id = "3626", text = "Lit. *lay down*." },
  { t = "note", id = "3627", text = "John xix. 30b." },
  { t = "p", text = "[8][^3628]And immediately the face of[^3629] the door of the temple was rent into two parts from [9] top to bottom;[^3630]and the earth was shaken; and the stones were split to pieces; and the [Arabic, p. 197 ] tombs were opened; and the bodies of many saints which slept, arose and [10] came forth;[^3631]and after his resurrection they entered into the holy city and [11] appeared unto many.[^3632]And the officer of the footsoldiers, and they that were with him who were guarding Jesus,[^3633] when they saw the earthquake, and the things which came [12] to pass, feared greatly, and praised God, and said,[^3634]This man *was* righteous; and, [13] Truly he was the Son of God.[^3635]And all the multitudes that were come together to the sight, when they saw what came to pass, returned and smote upon their breasts." },
  { t = "note", id = "3628", text = "Matt. xxvii. 51." },
  { t = "note", id = "3629", text = "*cf*. Syriac versions and Ibn-at-Tayyib’s Commentary. Vat. ms. omits *the face of*." },
  { t = "note", id = "3630", text = "Matt. xxvii. 52." },
  { t = "note", id = "3631", text = "Matt. xxvii. 53." },
  { t = "note", id = "3632", text = "Matt. xxvii. 54." },
  { t = "note", id = "3633", text = "This sentence is a good example of word-for-word translation of the Peshitta." },
  { t = "note", id = "3634", text = "Luke xxiii. 47b; Matt. xxvii. 54b." },
  { t = "note", id = "3635", text = "Luke xxiii. 48." },
  { t = "p", text = "[14][^3636]And the Jews, because of the Friday, said, Let these bodies not remain on their crosses,[^3637] because it is the morning of the sabbath (for that sabbath was a great day); and they asked of Pilate that they might break the legs of those that were [15] crucified, and take them down.[^3638]And the soldiers came, and brake the legs of the [16] first, and that other which was crucified with him:[^3639]but when they came to Jesus, [17] they saw that he had died before, so they brake not his legs:[^3640]but one of the soldiers pierced[^3641] him in his side with a spear, and immediately there came forth blood and [18] water.[^3642]And he that hath seen hath borne witness, and his witness is true: and he [19] knoweth that he hath said the truth, that ye also may believe.[^3643]This he did, that [20] the scripture might be fulfilled, which saith, A bone shall not be broken in him;[^3644]and the scripture also which saith, Let them look upon him whom they pierced.[^3645]" },
  { t = "note", id = "3636", text = "John xix. 31." },
  { t = "note", id = "3637", text = "The word is probably plural." },
  { t = "note", id = "3638", text = "John xix. 32." },
  { t = "note", id = "3639", text = "John xix. 33." },
  { t = "note", id = "3640", text = "John xix. 34." },
  { t = "note", id = "3641", text = "Lit. *ripped*." },
  { t = "note", id = "3642", text = "John xix. 35." },
  { t = "note", id = "3643", text = "John xix. 36." },
  { t = "note", id = "3644", text = "John xix. 37." },
  { t = "note", id = "3645", text = "Lit. *ripped*." },
  { t = "p", text = "[21][^3646]And there were in the distance all the acquaintance of Jesus standing, and the women that came with him from Galilee, those that followed him and ministered. [22][^3647]One of them was Mary Magdalene; and Mary the mother of James the little and [23] [Arabic, p. 198 ] Joses,[^3648]and the mother of the sons of Zebedee, and Salome, and many others which came up with him unto Jerusalem;[^3649]and they saw that." },
  { t = "note", id = "3646", text = "Luke xxiii. 49a; Mark xv. 41b." },
  { t = "note", id = "3647", text = "Matt. xxvii. 56a; Mark xv. 40b." },
  { t = "note", id = "3648", text = "Matt. xxvii. 56c; Mark xv. 40c, 41c." },
  { t = "note", id = "3649", text = "Luke xxiii. 49b." },
  { t = "p", text = "[24][^3650]And when the evening of the Friday was come, because of the entering of the [25] sabbath,[^3651]there came a rich man,[^3652] a noble[^3653] of Ramah,[^3654] a city of Judah,[^3655] named Joseph, and he was a good man and upright;[^3656]and he was a[^3657] disciple of Jesus, but [26] was concealing himself for fear of the Jews.[^3658]And he did not agree with the accusers [27] in their desire and their deeds:[^3659]and he was looking for the kingdom of God.[^3660]And this man went boldly, and entered in unto Pilate, and asked of him the body of [28] Jesus.[^3661]And Pilate wondered how he had died already: and he called the officer of [29] the footsoldiers, and asked him concerning his death before the time.[^3662]And when [30] he knew, he commanded him to deliver up his body unto Joseph.[^3663]And Joseph bought for him a winding cloth of pure linen, and took down the body of Jesus, [31] and wound it in it; and they came and took it.[^3664]And there came unto him Nicodemus also, who of old came unto Jesus by night; and he brought with him perfume[^3665] [32] of myrrh and aloes, about a hundred pounds.[^3666]And they took the body of Jesus, and wound it in the linen and the perfume, as was the custom of the Jews to bury." },
  { t = "note", id = "3650", text = "Mark xv. 42." },
  { t = "note", id = "3651", text = "Luke xxiii. 50." },
  { t = "note", id = "3652", text = "Matt. xxvii. 57." },
  { t = "note", id = "3653", text = "Borg. ms. omits." },
  { t = "note", id = "3654", text = "Luke xxiii. 51b." },
  { t = "note", id = "3655", text = "Syriac versions." },
  { t = "note", id = "3656", text = "John xix. 38b." },
  { t = "note", id = "3657", text = "Lit. *the*." },
  { t = "note", id = "3658", text = "Luke xxiii. 51a." },
  { t = "note", id = "3659", text = "Luke xxiii. 51c." },
  { t = "note", id = "3660", text = "Mark xv. 43b." },
  { t = "note", id = "3661", text = "Mark xv. 44." },
  { t = "note", id = "3662", text = "Mark xv. 45a." },
  { t = "note", id = "3663", text = "Matt. xxvii. 58b; Mark xv. 46a." },
  { t = "note", id = "3664", text = "John xix. 38d; John xix. 39." },
  { t = "note", id = "3665", text = "The preparation used in embalming." },
  { t = "note", id = "3666", text = "John xix. 40." },
  { t = "p", text = "[33][^3667]And there was in the place where Jesus was crucified a garden; and in that garden [34] a new tomb cut out in a rock,[^3668] wherein was never man yet laid.[^3669]And they left [35] Jesus there because the sabbath had come in, and because the tomb was near.[^3670]And they pushed[^3671] a great stone, and thrust[^3672] it against the door of the sepulchre, and [36] went away.[^3673]And Mary Magdalene and Mary that was related to Joses came to [37] [Arabic, p. 199 ] the sepulchre after them,[^3674][^3675]and sat opposite the sepulchre,[^3676] and saw the [38] body, how they took it in and laid it there.[^3677]And they returned, and bought ointment[^3678] and perfume,[^3679] and prepared[^3680] *it*, that they might come and anoint him. [39][^3681]And on the day which was the sabbath day they desisted according to the command." },
  { t = "note", id = "3667", text = "John xix. 41." },
  { t = "note", id = "3668", text = "Mark xv. 46. Lit. *a stone*." },
  { t = "note", id = "3669", text = "John xix. 42." },
  { t = "note", id = "3670", text = "Matt. xxvii. 60b." },
  { t = "note", id = "3671", text = "On the plural, which is to be found also in Ibn-at-Tayyib’s Commentary, see § 38, 43, note (end). The word chosen might be simply a clerical error for an original Arabic *rolled*." },
  { t = "note", id = "3672", text = "Lit. *cast* (*cf*. Sinaitic)." },
  { t = "note", id = "3673", text = "Mark xv. 47a." },
  { t = "note", id = "3674", text = "Dual. The clause (from *came*) is found verbatim in Sin. and Cur. at Luke xxiii. 55. Here, after the word *Luke* of the reference, at the end of leaf 117 of Vat. ms., is a note by a later hand: “Here a leaf is wanting.” This second and last lacuna extends from § 52, 37, to § 53, 4." },
  { t = "note", id = "3675", text = "Luke xxiii. 55b." },
  { t = "note", id = "3676", text = "Matt. xxvii. 61b." },
  { t = "note", id = "3677", text = "Luke xxiii. 56a; Mark xvi. 1b." },
  { t = "note", id = "3678", text = "*cf*. Sinaitic." },
  { t = "note", id = "3679", text = "The two *Arabic* words are practically synonymous (*cf*. Luke xxiii. 56, Pesh.)." },
  { t = "note", id = "3680", text = "Luke xxiii. 56." },
  { t = "note", id = "3681", text = "Luke xxiii. 56c." },
  { t = "p", text = "[40, 41][^3682]And the chief priests and the Pharisees gathered unto Pilate, and said unto him,[^3683]Our lord, we remember that that misleader said, while he was alive, After three days [42] I rise.[^3684]And now send beforehand and guard the tomb[^3685] until the third day,[^3686] lest his disciples come and steal him by night, and they will say unto the people that he [43] is risen from the dead: and the last error shall be worse than the first.[^3687]He said unto them, And have ye not guards?[^3688] go, and take precautions as ye know *how*. [44][^3689]And they went, and set *guards* at the tomb, and sealed that stone, with the guards." },
  { t = "note", id = "3682", text = "Matt. xxvii. 62." },
  { t = "note", id = "3683", text = "Matt. xxvii. 63." },
  { t = "note", id = "3684", text = "Matt. xxvii. 64." },
  { t = "note", id = "3685", text = "The ms. omits *the tomb*." },
  { t = "note", id = "3686", text = "Lit. *three days*." },
  { t = "note", id = "3687", text = "Matt. xxvii. 65." },
  { t = "note", id = "3688", text = "The word might be taken as a collective noun, singular. But *cf*. Peshitta and § 52, 51." },
  { t = "note", id = "3689", text = "Matt. xxvii. 66." },
  { t = "p", text = "[45][^3690]And in the evening of the sabbath, which is the morning of the first *day*, and in [46] the dawning[^3691] while the darkness yet remained, came Mary Magdalene and the other Mary and other women to see the tomb.[^3692]They brought with them the [47] perfume which they had prepared, and said among themselves,[^3693]Who is it that will [48] remove for us the stone from the door of the tomb? for it was very great.[^3694]And when they said thus, there occurred a great earthquake; and an angel came down [49] from heaven, and came and removed the stone from the door.[^3695]And they came and found the stone removed from the sepulchre, and the angel sitting upon the [50] stone.[^3696]And his appearance was as the lightning, and his raiment white as the [51] snow:[^3697]and for fear of him the guards were troubled, and became as dead *men*. [52][^3698]And when he went away, the women entered into the sepulchre; and they found [53] [Arabic, p. 200 ] not the body of Jesus.[^3699]And they saw there a young man sitting on the [54] right, arrayed in a white garment; and they were amazed.[^3700][^3701]And the angel answered and said unto the women, Fear ye not: for I know that ye seek Jesus the [55] Nazarene, who hath been crucified. He is not here; but he is risen, as he said.[^3702]Come and see the place where our Lord lay." },
  { t = "note", id = "3690", text = "Matt. xxviii. 1a; Luke xxiv. 1b." },
  { t = "note", id = "3691", text = "*cf*. Peshitta. The Arabic word is variously explained." },
  { t = "note", id = "3692", text = "Matt. xxviii. 1b; Luke xxiv. 1d." },
  { t = "note", id = "3693", text = "Mark xvi. 3." },
  { t = "note", id = "3694", text = "Mark xvi. 4b; Matt. xxviii. 2a." },
  { t = "note", id = "3695", text = "Luke xxiv. 2; Matt. xxviii. 2b." },
  { t = "note", id = "3696", text = "Matt. xxviii. 3." },
  { t = "note", id = "3697", text = "Matt. xxviii. 4." },
  { t = "note", id = "3698", text = "Luke xxiv. 3." },
  { t = "note", id = "3699", text = "Mark xvi. 5b." },
  { t = "note", id = "3700", text = "The diacritical points of the first letter must be corrected." },
  { t = "note", id = "3701", text = "Matt. xxviii. 5." },
  { t = "note", id = "3702", text = "Matt. xxviii. 6." },
]

[[section]]
id = "section-53"
title = "Section LIII."
level = 1
blocks = [
  { t = "p", text = "Section LIII.[^3703]" },
  { t = "note", id = "3703", text = "The Borg. ms. indicates the beginning of the sections, not by titles, but by “*vittas ampliusculas auroque oblinitas*” (Ciasca, Introduction). Ciasca indicates in the *Corrigenda*, opposite p. 210 of the Arabic text, where this section should begin." },
  { t = "p", text = "[1][^3704]And while they marvelled at that, behold, two men standing above them, their [2] raiment shining:[^3705]and they were seized with fright, and bowed down their face to [3] the earth: and they said unto them, Why seek ye the living *one* with the dead?[^3706]He is not here; he is risen: remember what he was speaking unto you while he was in [4] Galilee, and saying,[^3707]The Son of man is to be delivered up into the hands of sinners, [5] and to be crucified, and on the third day to rise.[^3708]But go in haste, and say to his disciples and to Cephas, He is risen from among the dead; and lo, he goeth before [6] you into Galilee;[^3709]and there ye shall see him, where[^3710] he said unto you: lo, I have [7] told you.[^3711]And they remembered his sayings; and they departed in haste from the [8] tomb with joy and great fear, and hastened and went;[^3712]and perplexity and fear [9] encompassed them; and they told no man anything, for they were afraid.[^3713]And Mary hastened, and came to Simon Cephas, and to that other disciple whom Jesus loved, and said unto them, They have taken our Lord from the sepulchre, and I [10] know not where they have laid him.[^3714]And Simon went out, and that other disciple, [11] and came to the sepulchre.[^3715]And they hastened both together: and that disciple [12] outran[^3716] Simon, and came first to the sepulchre;[^3717]and he looked down, and saw the [13] linen laid; but he went not in.[^3718]And Simon came after him, and entered into the [14] [Arabic, p. 201 ] sepulchre, and saw the linen laid;[^3719]and the scarf with which his head was bound was not with the linen, but wrapped and laid aside in a certain place. [15][^3720]Then entered that disciple which came first to the sepulchre, and saw, and believed. [16][^3721]And they knew not yet from the scriptures that the Messiah was to rise from among [17] the dead.[^3722]And those two disciples went to their place." },
  { t = "note", id = "3704", text = "Luke xxiv. 4." },
  { t = "note", id = "3705", text = "Luke xxiv. 5." },
  { t = "note", id = "3706", text = "Luke xxiv. 6." },
  { t = "note", id = "3707", text = "Luke xxiv. 7." },
  { t = "note", id = "3708", text = "Matt. xxviii. 7a." },
  { t = "note", id = "3709", text = "Mark xvi. 7b; Matt. xxviii. 7c." },
  { t = "note", id = "3710", text = "Possibly the translator’s style would warrant the translation *as*." },
  { t = "note", id = "3711", text = "Luke xxiv. 8; Matt. xxviii. 8a." },
  { t = "note", id = "3712", text = "Mark xvi. 8b." },
  { t = "note", id = "3713", text = "John xx. 2." },
  { t = "note", id = "3714", text = "John xx. 3." },
  { t = "note", id = "3715", text = "John xx. 4." },
  { t = "note", id = "3716", text = "Lit. *hastened and preceded*." },
  { t = "note", id = "3717", text = "John xx. 5." },
  { t = "note", id = "3718", text = "John xx. 6." },
  { t = "note", id = "3719", text = "John xx. 7." },
  { t = "note", id = "3720", text = "John xx. 8." },
  { t = "note", id = "3721", text = "John xx. 9." },
  { t = "note", id = "3722", text = "John xx. 10." },
  { t = "p", text = "[18][^3723]But Mary remained[^3724] at the tomb weeping: and while she wept, she looked [19] down into the tomb;[^3725]and she saw two angels sitting in white raiment, one of them toward his pillow, and the other toward his feet, where the body of Jesus had been [20] laid.[^3726]And they said unto her, Woman, why weepest thou? She said unto them, [21] They have taken my Lord, and I know not where they have left him.[^3727]She said that, and turned behind her, and saw Jesus standing, and knew not that it was [22] Jesus.[^3728]Jesus said unto her, Woman, why weepest thou? whom seekest thou? And she supposed[^3729] him *to be* the gardener, and said, My lord, if thou hast taken him, [23] tell me where thou hast laid him, that I may go and take him.[^3730]Jesus said unto her, Mary. She turned, and said unto him in Hebrew, Rabboni; which is, being [24] interpreted, Teacher.[^3731]Jesus said unto her, Touch me not;[^3732] for I have not ascended yet unto my Father: go to my brethren, and say unto them, I ascend unto my Father and your Father, and my God and your God." },
  { t = "note", id = "3723", text = "John xx. 11." },
  { t = "note", id = "3724", text = "Probably an Arabic copyist’s emendation (addition of *alif*) for *stood*." },
  { t = "note", id = "3725", text = "John xx. 12." },
  { t = "note", id = "3726", text = "John xx. 13." },
  { t = "note", id = "3727", text = "John xx. 14." },
  { t = "note", id = "3728", text = "John xx. 15." },
  { t = "note", id = "3729", text = "*cf.*, § 10, 16." },
  { t = "note", id = "3730", text = "John xx. 16." },
  { t = "note", id = "3731", text = "John xx. 17." },
  { t = "note", id = "3732", text = "*cf*. § 12, 13." },
  { t = "p", text = "[25][^3733]And on the First-day on which he rose, he appeared first unto Mary Magdalene, from whom he had cast out seven demons." },
  { t = "note", id = "3733", text = "Mark xvi. 9." },
  { t = "p", text = "[26][^3734]And some of those guards[^3735] came to the city, and informed the chief priests of [27] [Arabic, p. 202 ] all that had happened.[^3736]And they assembled with the elders, and took [28] counsel;[^3737]and they gave money, not a little, to the guards, and said unto them, Say ye, His disciples came and stole him by night, while we were sleeping." },
  { t = "note", id = "3734", text = "Matt. xxviii. 11b." },
  { t = "note", id = "3735", text = "The Vat. ms. has a form that is distinctively plural. The Borg. ms. uses, with a plural adjective, the form found in § 52, 43. In the next verse the relation of the mss. is reversed." },
  { t = "note", id = "3736", text = "Matt. xxviii. 12." },
  { t = "note", id = "3737", text = "Matt. xxviii. 13." },
  { t = "p", text = "[29][^3738]And if the judge hear that, we will make a plea with him, and free you of blame. [30][^3739]And they, when they took the money, did according to what they taught them. And this word spread among the Jews unto this day." },
  { t = "note", id = "3738", text = "Matt. xxviii. 14." },
  { t = "note", id = "3739", text = "Matt. xxviii. 15." },
  { t = "p", text = "[31][^3740]And then came Mary Magdalene, and announced to the disciples that she had seen our Lord, and that he had said that unto her." },
  { t = "note", id = "3740", text = "John xx. 18." },
  { t = "p", text = "[32][^3741]And while the first[^3742] women[^3743] were going in the way to inform[^3744] his disciples,[^3745] [33] Jesus met them, and said unto them, Peace unto you.[^3746]And they came and took [34] hold of his feet, and worshipped him.[^3747]Then said Jesus unto them, Fear not: but go and say to my brethren that they depart into Galilee, and there they shall see [35] me.[^3748]And those women returned, and told all that to the eleven, and to the rest of the disciples;[^3749]and to those that had been with him, for they were saddened and [36] weeping.[^3750]And those were Mary Magdalene, and Joanna, and Mary the mother of James, and the rest who were with them: and they were those that told the apostles. [37][^3751]And they, when they heard them say that he was alive and had appeared unto them, [38] did not believe them:[^3752]and these sayings were before their eyes as the sayings of madness. [39] [Arabic, p. 203 ][^3753]And after that, he appeared to two of them, on that day, and while they were going to the village which was named Emmaus, and whose distance [40] from Jerusalem was sixty furlongs.[^3754][^3755]And they were talking the one of them with the [41] other of all the things which had happened.[^3756]And during the time of their talking and [42] inquiring with one another, Jesus came and reached them, and walked with them.[^3757]But [43] their eyes were veiled that they should not know him.[^3758]And he said unto them, What are these sayings which ye address the one of you to the other, as ye walk and are [44] sad?[^3759]One of them, whose name was Cleopas, answered and said unto him, Art thou perchance alone a stranger to Jerusalem, since thou knowest not what was in [45] it in these days? He said unto them, What was?[^3760]They said unto him, Concerning Jesus, he who was from Nazareth, a man who was a prophet, and powerful in [46] speech and deeds before God and before all the people:[^3761]and the chief priests and [47] the elders delivered him up to the sentence of[^3762] death, and crucified him.[^3763]But we supposed that he was the one who was to deliver Israel. And since all[^3764] these [48] things happened there have passed three days.[^3765]But *certain* women of us also [49] informed us that they had come to the sepulchre;[^3766]and when they found not his body, they came and told us that they had seen there the angels, and they[^3767] said [50] concerning him that he was alive.[^3768]And some of us also went to the sepulchre, and [51] found the matter as the women had said: only they saw him not.[^3769]Then said Jesus [52] unto them, Ye lacking in discernment, and heavy in heart to believe![^3770]Was it not in all the sayings of the prophets that the Messiah was to suffer these things, and to [53] [Arabic, p. 204 ] enter into his Glory?[^3771]And he began from Moses and from all the prophets, [54] and interpreted to them concerning himself from all the scriptures.[^3772]And they drew near unto the village, whither they were going: and he was leading them to [55] imagine that he was as if going to a distant region.[^3773]And they pressed[^3774] him, and said unto him, Abide with us: for the day hath declined now to the darkness. And he went [56] in to abide with them.[^3775]And when he sat with them, he took bread, and blessed, [57] and brake, and gave to them.[^3776]And straightway their eyes were opened, and they [58] knew him; and he was taken away from them.[^3777][^3778]And they said the one to the other, Was not our heart heavy within us, while he was speaking to us in the way, and interpreting to us the scriptures?" },
  { t = "note", id = "3741", text = "Matt. xxviii. 8b." },
  { t = "note", id = "3742", text = "The word *first* is less correctly spelled in Borg. ms." },
  { t = "note", id = "3743", text = "The Vat. ms. omits *women* and *to inform his disciples*." },
  { t = "note", id = "3744", text = "*Inform*is dual and masc. in the ms., while the other verbs and pronouns are plural and feminine." },
  { t = "note", id = "3745", text = "The Vat. ms. omits *women* and *to inform his disciples*." },
  { t = "note", id = "3746", text = "Matt. xxviii. 9." },
  { t = "note", id = "3747", text = "Matt. xxviii. 10." },

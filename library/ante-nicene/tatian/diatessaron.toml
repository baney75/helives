[[section]]
id = "section-27"
title = "Section XXVII."
level = 1
blocks = [
  { t = "p", text = "[1][^1868]Therefore the kingdom of heaven is like a certain king, who would make a [2] reckoning with his servants.[^1869]And when he began to make *it*, they brought to him one who [3] owed him ten talents.[^1870][^1871]And because he had not wherewith to pay, his lord ordered that he should be sold, he, and his wife, and children, and all that he [4] had, and payment be made.[^1872]So that servant fell down and worshipped *him*, and said unto him, My lord, have patience with me, and I shall pay thee everything. [5][^1873]And the lord of that servant had compassion, and released him, and forgave him his [6] debt.[^1874]And that servant went out, and found one of his fellow-*servants*, who owed him [Arabic, p. 104 ] a hundred pence;[^1875] and he took him, and dealt severely with him, and said [7] unto him, Give me what thou owest.[^1876]So the fellow-servant fell down at his [8] feet, and besought him, and said, Grant me respite, and I will pay thee.[^1877]And he would not; but took him, and cast him into prison, till he should give him his debt. [9][^1878]And when their fellow-*servants* saw what happened, it distressed them much; and [10] they came and told their lord of all that had taken place.[^1879]Then his lord called him, and said unto him, *Thou* wicked servant, all that debt I forgave thee, because [11] thou besoughtest me:[^1880]was it not then incumbent on thee also to have mercy on thy [12] fellow-servant, as I had mercy on thee?[^1881][^1882]And his lord became wroth, and delivered [13] him to the scourgers, till he should pay all that he owed.[^1883]So shall my Father which is in heaven do unto you, if one forgive not his brother his wrong conduct[^1884] from [14] his heart.[^1885]Take heed within[^1886] yourselves: if thy brother sin, rebuke him; and if he [15] repent, forgive him.[^1887]And if he act wrongly towards thee seven times in a day, and on that day return seven times unto thee, and say, I repent towards thee; forgive him. [16][^1888]And if thy brother act wrongly towards thee, go and reprove him between thee and [17] him alone: if he hear thee, thou hast gained thy brother.[^1889]But if he hear thee not, take with thee one or two, and so[^1890] at the mouth of two or three every saying shall [18] be established.[^1891]And if he listen not to these also, tell the congregation;[^1892] and if he listen not even to the congregation, let him be unto thee as a publican and a Gentile.[^1893] [19][^1894]Verily I say unto you, All that ye bind on earth shall be bound in heaven: [20] and what ye loose on earth shall be loosed in heaven.[^1895]I say unto you also, If two of you agree on earth to ask, everything shall[^1896] be granted them from my Father [21] [Arabic, p. 105 ] which is in heaven.[^1897]For where two or three are gathered in my name, there [22] am I amongst them.[^1898]Then Cephas drew near to him, and said unto him, My Lord, how many times, if my brother act wrongly towards me, should I forgive him? [23] until seven times?[^1899]Jesus said unto him, I say not unto thee, Until seven; but, Until seventy [24] times seven, seven.[^1900][^1901]And the servant that knoweth his lord’s will, and maketh not [25] ready for him according to his will, shall meet with much punishment;[^1902]but he that knoweth not, and doeth something for which he meriteth punishment, shall meet with slight punishment. Every one to whom much hath been given, much shall be asked of him; and he that hath had much committed to him, much shall be [26] required at his hand.[^1903]I came to cast fire upon the earth; and I would that it had [27] been kindled already.[^1904][^1905]And I have a baptism to be baptized with, and greatly am [28] I straitened till it be accomplished.[^1906]See *that ye* despise not[^1907] one of these little ones that believe in me. Verily I say unto you, Their angels at all times see the [29] face of my Father which is in heaven.[^1908]The Son of man came to save the thing which was lost." },

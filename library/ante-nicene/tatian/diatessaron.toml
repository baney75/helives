[[section]]
id = "section-12"
title = "Section XII."
level = 1
blocks = [
  { t = "p", text = "[1][^888]And all the multitude of the Gadarenes entreated him to depart from them, because that great fear took hold upon them." },
  { t = "note", id = "888", text = "Luke viii. 37a." },
  { t = "p", text = "[2, 3][^889]But Jesus went up into the ship, and crossed, and came to his city.[^890]And that man from whom the devils went out entreated that he might stay with him; but [4] Jesus sent him away, and said unto him,[^891]Return to thy house, and make known what [5] God hath done for thee.[^892]And he went, and began to publish in Decapolis[^893] what Jesus had done for him; and they all marvelled." },
  { t = "note", id = "889", text = "Matt. ix. 1." },
  { t = "note", id = "890", text = "Luke viii. 38." },
  { t = "note", id = "891", text = "Luke viii. 39a." },
  { t = "note", id = "892", text = "Mark v. 20." },
  { t = "note", id = "893", text = "Lit. *the ten cities*." },
  { t = "p", text = "[6][^894]And when Jesus had crossed in the ship to that side, a great multitude received [7] him; and they were all looking for him.[^895]And a man named Jairus, the chief of the [8] synagogue, fell before the feet of Jesus,[^896]and besought him much, and said unto him, I have an only daughter, and she is come nigh unto death;[^897]but come and lay thy [9] hand upon her, and she shall live.[^898]And Jesus rose, and his disciples, and they followed [10] him.[^899]And there joined him a great multitude, and they pressed him." },
  { t = "note", id = "894", text = "Mark v. 21a; Luke viii. 40b." },
  { t = "note", id = "895", text = "Luke viii. 41a." },
  { t = "note", id = "896", text = "Mark v. 23a." },
  { t = "note", id = "897", text = "Matt. ix. 18b." },
  { t = "note", id = "898", text = "Matt. ix. 19." },
  { t = "note", id = "899", text = "Mark v. 24b." },
  { t = "p", text = "[11, 12][^900]And a woman, which had a flow of blood for twelve years,[^901]*had* suffered much of many physicians, and spent all that she had, and was not benefited at all, but her [13] trouble increased further.[^902]And when she heard of Jesus, she came in the thronging of [14] [Arabic, p. 47 ] the crowd behind him, and touched[^903] his garments;[^904]and she thought within [15] herself, If I *could* reach to touch his garments, I should live.[^905]And immediately the fountain of her blood was dried; and she felt in her body that she was healed [16] of her plague.[^906]And Jesus straightway knew within himself that power had gone out of him; and he turned to the crowd, and said, Who approached unto my garments? [17][^907]And on their denying, all of them, Simon Cephas and those with him said unto him, Our Master, the multitudes throng thee and press thee, and sayest thou, Who approached [18] unto me?[^908]And he said, Some one approached unto me; and I knew that [19] power went forth from me.[^909]And that woman, when she saw that she was not hid [20] from him, came fearing and agitated (for she knew what had happened to her),[^910]and fell down and worshipped him, and told, in the presence of all the people, for what [21] reason she touched *him*, and how she was healed immediately.[^911]And Jesus said unto her, Be of good courage, daughter; thy faith hath made thee alive; depart in peace, and be whole from thy plague." },
  { t = "note", id = "900", text = "Mark v. 25." },
  { t = "note", id = "901", text = "Mark v. 26." },
  { t = "note", id = "902", text = "Mark v. 27." },
  { t = "note", id = "903", text = "See § 8, 17, note." },
  { t = "note", id = "904", text = "Mark v. 28." },
  { t = "note", id = "905", text = "Mark v. 29." },
  { t = "note", id = "906", text = "Mark v. 30." },
  { t = "note", id = "907", text = "Luke viii. 45b." },
  { t = "note", id = "908", text = "Luke viii. 46." },
  { t = "note", id = "909", text = "Luke viii. 47a." },
  { t = "note", id = "910", text = "Mark v. 33b; Luke viii. 47c." },
  { t = "note", id = "911", text = "Luke viii. 48; Mark v. 34b." },
  { t = "p", text = "[22][^912]And while he was yet speaking, there came a man from the house of the chief of the synagogue, and said unto him, Thy daughter hath died; so trouble not the [23] teacher.[^913]But Jesus heard, and said unto the father of the maid, Fear not: but believe [24] only, and she shall live.[^914]And he suffered no man to go with him, except [25] Simon Cephas, and James, and John the brother of James.[^915]And they reached the house of the chief of the synagogue; and he saw them agitated, weeping and wailing. [26][^916]And he entered, and said unto them, Why are ye agitated *and* weeping? the [27] [Arabic, p. 48 ] maid hath not died, but she is sleeping.[^917]And they laughed at him, for [28] they knew that she had died.[^918]And he put every man forth without, and took the father of the maid, and her mother, and Simon, and James, and John, and [29] entered into the place where the maid was laid.[^919]And he took hold of the hand of the maid, and said unto her, Maid, arise.[^920]And her spirit returned, and straightway [30] she arose and walked:[^921]and she was about twelve years *of age*.[^922]And he commanded [31] that there should be given to her something to eat.[^923]And her father wondered greatly: [32] and he warned them that they should tell no man what had happened.[^924]And this report spread in all that land." },
  { t = "note", id = "912", text = "Luke viii. 49." },
  { t = "note", id = "913", text = "Luke viii. 50." },
  { t = "note", id = "914", text = "Mark v. 37." },
  { t = "note", id = "915", text = "Mark v. 38." },
  { t = "note", id = "916", text = "Mark v. 39." },
  { t = "note", id = "917", text = "Luke viii. 53." },
  { t = "note", id = "918", text = "Mark v. 40b." },
  { t = "note", id = "919", text = "Mark v. 41." },
  { t = "note", id = "920", text = "Luke viii. 55a." },
  { t = "note", id = "921", text = "Mark v. 42b." },
  { t = "note", id = "922", text = "Luke viii. 55b." },
  { t = "note", id = "923", text = "Luke viii. 56." },
  { t = "note", id = "924", text = "Matt. ix. 26." },
  { t = "p", text = "[33][^925]And when Jesus crossed over from there, there joined him two blind men, crying [34] out, and saying, Have mercy on us, *thou* son of David.[^926]And when he came to the house, those two blind men came to him: and Jesus said unto them, Believe ye [35] that I am able to do this? They said unto him, Yea, our Lord.[^927]Then he touched[^928] [36] their eyes, and said, As ye have believed, it shall be unto you.[^929]And immediately their eyes were opened. And Jesus forbade them, and said, See that no man know. [37][^930]But they went out and published the news in all that land." },
  { t = "note", id = "925", text = "Matt. ix. 27." },
  { t = "note", id = "926", text = "Matt. ix. 28." },
  { t = "note", id = "927", text = "Matt. ix. 29." },
  { t = "note", id = "928", text = "Lit. *went forward to* (*cf*. § 8, 17, note)." },
  { t = "note", id = "929", text = "Matt. ix. 30." },
  { t = "note", id = "930", text = "Matt. ix. 31." },
  { t = "p", text = "[38][^931]And when Jesus went out, they brought to him a dumb man having a devil. [39][^932]And on the going out of the devil that dumb man spake. And the multitudes marvelled, and said, It was never so seen in Israel" },
  { t = "note", id = "931", text = "Matt. ix. 32." },
  { t = "note", id = "932", text = "Matt. ix. 33." },
  { t = "p", text = "[40][^933]And Jesus was going about in all the cities and *in* the villages, and teaching in their synagogues, and proclaiming the good news of the kingdom, and healing every disease [41] [Arabic, p. 49 ] and sickness; and many followed him.[^934]And when Jesus saw the multitudes, he had compassion on them, for they were wearied and scattered,[^935] as sheep [42] that have no shepherd.[^936]And he called his twelve disciples, and gave them power and [43] much authority over all devils and diseases;[^937]and sent them two and two, that they [44] might proclaim the kingdom of God, and *to* heal the sick.[^938]And he charged them, and said, Walk not in the way of the heathen, nor enter into the cities of the Samaritans.[^939] [45, 46][^940]Go especially unto the sheep that are lost of the sons of Israel.[^941]And [47] when ye go, proclaim and say, The kingdom of heaven is come near.[^942]And heal the sick, and cleanse the lepers, and cast out the devils: freely ye have received, freely [48, 49] give.[^943]Get you not gold, nor silver, nor brass in your purses;[^944]and take nothing for the way, except a staff only; nor bag, nor bread; neither shall ye have two tunics, [50] nor shoes, nor staff, but be shod with sandals;[^945]for the labourer is worthy of his food. [51][^946]And whatever city or village ye enter, inquire who is worthy in it, and there be until [52, 53] ye go out.[^947]And when ye enter into the house, ask for the peace of the house: and if the house is worthy, your peace shall come upon it;[^948]but if it is not worthy, your [54] peace shall return unto you.[^949]And whosoever shall not receive you, nor hear your sayings, when ye go out from that house, or from that village, shake off the dust [55] [Arabic, p. 50 ] that is under your feet against them for a testimony.[^950]And verily I say unto you, To the land of Sodom and Gomorrah there shall be rest in the day of judgement, rather than to that city." },
  { t = "note", id = "933", text = "Matt. ix. 35." },
  { t = "note", id = "934", text = "Matt. ix. 36." },
  { t = "note", id = "935", text = "Lit. *cast away* (*cf*. meanings of Syriac word)." },
  { t = "note", id = "936", text = "Matt. x. 1a; Luke ix. 1b." },
  { t = "note", id = "937", text = "Luke ix. 2." },
  { t = "note", id = "938", text = "Matt. x. 5." },
  { t = "note", id = "939", text = "§ 34, 40, shows that this Arabic form may be so translated." },
  { t = "note", id = "940", text = "Matt. x. 6." },
  { t = "note", id = "941", text = "Matt. x. 7." },
  { t = "note", id = "942", text = "Matt. x. 8." },
  { t = "note", id = "943", text = "Matt. x. 9f." },
  { t = "note", id = "944", text = "Mark vi. 8b; Luke ix. 3." },
  { t = "note", id = "945", text = "Matt. x. 10c; Mark vi. 9a." },
  { t = "note", id = "946", text = "Matt. x. 10d." },
  { t = "note", id = "947", text = "Matt. x. 11." },
  { t = "note", id = "948", text = "Matt. x. 12; Matt. x. 13." },
  { t = "note", id = "949", text = "Matt. x. 14a; Mark vi. 11b." },
  { t = "note", id = "950", text = "Matt. x. 15." },
]

[[section]]
id = "section-13"
title = "Section XIII."
level = 1
blocks = [
  { t = "p", text = "[1][^951]I am sending you as lambs among wolves: be ye now wise as serpents, and [2] harmless[^952] as doves.[^953]Beware of men: they shall deliver you to the councils of the [3] magistrates, and scourge you in their synagogues;[^954]and shall bring you before governors and kings for my sake, for a testimony against them and against the nations. [4][^955]And when they deliver you up, be not[^956] anxious, nor consider beforehand, what ye [5] shall say; but ye shall be given[^957] in that hour what ye ought to speak.[^958]Ye do not [6] speak, but the Spirit of your Father speaketh in you.[^959]The brother shall deliver up his brother to death, and the father his son; and the sons shall rise against their [7] parents, and put them to death.[^960]And ye shall be hated of every man because of [8] my name; but he that endureth unto the end of the matter shall be saved.[^961][^962]When they expel you from this city, flee to another. Verily I say unto you, Ye shall not finish all the cities of the people of Israel, until the Son of man come." },
  { t = "note", id = "951", text = "Matt. x. 16." },
  { t = "note", id = "952", text = "The word is occasionally used in this sense, but ordinarily means *sound, unhurt*." },
  { t = "note", id = "953", text = "Matt. x. 17." },
  { t = "note", id = "954", text = "Matt. x. 18." },
  { t = "note", id = "955", text = "Matt. x. 19." },
  { t = "note", id = "956", text = "From this point down to Matt. x. 27a, is assigned by Vat. ms. to Mark." },
  { t = "note", id = "957", text = "Borg. ms. reads, *but what ye are granted ye shall speak, and ye shall be given in*, etc., and there seems to be a trace of this reading in Ciasca’s text." },
  { t = "note", id = "958", text = "Matt. x. 20." },
  { t = "note", id = "959", text = "Matt. x. 21." },
  { t = "note", id = "960", text = "Matt. x. 22." },
  { t = "note", id = "961", text = "See note to § 1, 78." },
  { t = "note", id = "962", text = "Matt. x. 23." },
  { t = "p", text = "[9, 10][^963]A disciple is not superior to his lord, nor a servant to his master.[^964]For it is enough then for the disciple that he be as his lord, and the servant as his master. If they have called the master of the house Beelzebul, how much more the people [11] of his house![^965]Fear them not therefore:[^966] for there is nothing covered, that shall [12] [Arabic, p. 51 ] not be revealed; nor hid, that shall not be disclosed and published.[^967]What I say unto you in the darkness, speak ye in the light; and what ye have told [13] secretly in the ears in closets, let it be proclaimed on the housetops.[^968]I say unto you now, my beloved, Be not agitated at[^969] those who kill the body, but have no power to [14] kill the soul. I will inform you whom ye shall fear: him[^970] which is able to destroy [15] soul and body in hell.[^971]Yea, I say unto you, Be afraid of him especially. Are not two sparrows sold for a farthing in a bond?[^972] and one of them shall not fall on the [16] ground without your Father.[^973]But what concerns you: even the hair of your heads [17, 18] also is numbered.[^974]Fear not therefore; ye are better than many sparrows.[^975]Every man who confesseth me now before men, I also will confess him before my Father [19] which is in heaven;[^976]but whosoever denieth me before men, I also will deny him before my Father which is in heaven." },
  { t = "note", id = "963", text = "Matt. x. 24." },
  { t = "note", id = "964", text = "Matt. x. 25." },
  { t = "note", id = "965", text = "Matt. x. 26." },
  { t = "note", id = "966", text = "See note to § 9, 21." },
  { t = "note", id = "967", text = "Matt. x. 27a; Luke xii. 3b." },
  { t = "note", id = "968", text = "Luke xii. 4a; Luke x. 28b." },
  { t = "note", id = "969", text = "Perhaps this Arabic word is a copyist’s error for that used a few lines further down in Luke xii. 5, the Arabic words being very similar; but see note on § 1, 14." },
  { t = "note", id = "970", text = "Syriac." },
  { t = "note", id = "971", text = "Luke xii. 5; Matt. x. 29." },
  { t = "note", id = "972", text = "The Vat. ms., like the Brit. Mus. text of Ibn-at-Tayyib’s Commentary, omits *for a farthing*, retaining *in a bond*. The two phrases are simply different explanations of the same Syriac consonants. These are really the naturalised Greek word rendered *farthing* in Eng. version; but they also form a Syriac word meaning *bond*." },
  { t = "note", id = "973", text = "Matt. x. 30." },
  { t = "note", id = "974", text = "Matt. x. 31." },
  { t = "note", id = "975", text = "Matt. x. 32." },
  { t = "note", id = "976", text = "Matt. x. 33." },
  { t = "p", text = "[20][^977]Think ye that I am come to cast peace into the earth? I came not to cast peace, [21] but to cast dissension.[^978]Henceforth there shall be five in one house, three of them [22] disagreeing with two, and the two with the three.[^979]The father shall become hostile to his son, and the son to his father; and the mother to her daughter, and the daughter to her mother; and the mother in law to her daughter in law, and the daughter [23] in law to her mother in law:[^980]and a man’s enemies shall be the people of his house. [24][^981]Whosoever loveth father or mother better than me is not worthy of me; and whosoever [Arabic, p. 52 ] loveth son or daughter more than his love of me is not worthy of me. [25][^982]And every one that doth not take his cross and follow me is not worthy of [26] me.[^983]Whosoever findeth his life[^984] shall lose it; and whosoever loseth his life[^985] for my sake shall find it." },
  { t = "note", id = "977", text = "Luke xii. 51." },
  { t = "note", id = "978", text = "Luke xii. 52." },
  { t = "note", id = "979", text = "Luke xii. 53." },
  { t = "note", id = "980", text = "Matt. x. 36." },
  { t = "note", id = "981", text = "Matt. x. 37." },
  { t = "note", id = "982", text = "Matt. x. 38." },
  { t = "note", id = "983", text = "Matt. x. 39." },
  { t = "note", id = "984", text = "Or, *soul*." },
  { t = "note", id = "985", text = "Or, *soul*." },
  { t = "p", text = "[27][^986]And whosoever receiveth you receiveth me; and whosoever receiveth me receiveth [28] him that sent me.[^987]And whosoever receiveth a prophet in the name of a prophet shall take[^988] a prophet’s reward; and whosoever shall receive a righteous man [29] in the name of a righteous man shall take[^989] a righteous man’s reward.[^990]And every one that shall give to drink to one of these least ones a drink of water only, in the name of a disciple, verily I say unto you, he shall not lose his reward." },
  { t = "note", id = "986", text = "Matt. x. 40." },
  { t = "note", id = "987", text = "Matt. x. 41." },
  { t = "note", id = "988", text = "Or, *receive*." },
  { t = "note", id = "989", text = "Or, *receive*." },
  { t = "note", id = "990", text = "Matt. x. 42a; Mark ix. 41b." },
  { t = "p", text = "[30][^991]And when Jesus finished charging his twelve disciples, he removed thence to [31] teach and preach in their cities.[^992]And while they were going in the way they entered into a certain village; and a woman named Martha entertained him in her house. [32][^993]And she had a sister named Mary, and she came and sat at the feet of our Lord, [33] and heard his sayings.[^994]But Martha was disquieted by much serving; and she came and said unto him, My Lord, givest thou no heed that my sister left me alone to [34] serve? speak to her that she help me.[^995]Jesus answered and said unto her, Martha, [35] Martha, thou art solicitous and impatient[^996] on account of many things:[^997]but what is sought is one *thing*. But Mary hath chosen for herself a good portion, and that which shall not be taken from her." },
  { t = "note", id = "991", text = "Matt. xi. 1." },
  { t = "note", id = "992", text = "Luke x. 38." },
  { t = "note", id = "993", text = "Luke x. 39." },
  { t = "note", id = "994", text = "Luke x. 40." },
  { t = "note", id = "995", text = "Luke x. 41." },
  { t = "note", id = "996", text = "Or, *agitated*." },
  { t = "note", id = "997", text = "Luke x. 42." },
  { t = "p", text = "[36][^998]And the apostles went forth, and preached to the people that they might repent. [37][^999]And they cast out many devils, and anointed many sick with oil, and healed them. [38, 39][^1000]And the disciples of John told him[^1001] of all these things.[^1002]And when John heard in [Arabic, p. 53 ] the prison of the doings of the Messiah, he called two of his disciples, and sent them to Jesus, and said, Art thou he that cometh, or look we for [40] another?[^1003]And they came to Jesus, and said unto him, John the Baptist hath sent [41] us unto thee, and said, Art thou he that cometh, or look we for another?[^1004]And in that hour he cured many of diseases, and of plagues of an evil spirit; and he gave sight [42] to many blind.[^1005]Jesus answered and said unto them, Go and tell John everything ye have seen and heard: the blind see, and the lame walk, and the lepers are cleansed, and the blind[^1006] hear, and the dead rise, and the poor have the gospel preached to [43] them.[^1007]And blessed is he who doubteth not in me." },
  { t = "note", id = "998", text = "Mark vi. 12." },
  { t = "note", id = "999", text = "Mark vi. 13." },
  { t = "note", id = "1000", text = "Luke vii. 18." },
  { t = "note", id = "1001", text = "Lit. *And his disciples told John*, as in the Greek, etc." },
  { t = "note", id = "1002", text = "Matt. xi. 2a; Luke vii. 19." },
  { t = "note", id = "1003", text = "Luke vii. 20." },
  { t = "note", id = "1004", text = "Luke vii. 21." },
  { t = "note", id = "1005", text = "Luke vii. 22." },
  { t = "note", id = "1006", text = "A different word from that used in the preceding verse. It is either an Arabic copyist’s error for the word for *deaf* used in Ibn-at-Tayyib’s Commentary, or a careless blunder." },
  { t = "note", id = "1007", text = "Luke vii. 23." },
  { t = "p", text = "[44][^1008]And when John’s disciples departed, Jesus began to say to the multitudes concerning John, What went ye out into the wilderness to see? a reed shaken with the [45] winds?[^1009]And if not, then what went ye out to see? a man clothed in soft raiment? Behold, they that are in magnificent garments and in voluptuousness are in the abode [46] of kings.[^1010]And if not, then what went ye out to see? a prophet? Yea, I say unto [47] you, and more than a prophet.[^1011]This is he of whom it is written," },
  { t = "note", id = "1008", text = "Luke vii. 24." },
  { t = "note", id = "1009", text = "Luke vii. 25." },
  { t = "note", id = "1010", text = "Luke vii. 26." },
  { t = "note", id = "1011", text = "Luke vii. 27." },
  { t = "p", text = "I am sending my messenger before thy face" },
  { t = "p", text = "To prepare the way before thee." },
]

[[section]]
id = "section-14"
title = "Section XIV."
level = 1
blocks = [
  { t = "p", text = "[1][^1012]Verily I say unto you, There hath not arisen among those whom women have borne a greater than John the Baptist; but he that is little now in the kingdom of heaven is greater than he." },
  { t = "note", id = "1012", text = "Matt. xi. 11." },
  { t = "p", text = "[2] [Arabic, p. 54 ][^1013]And all the people which heard, and the publicans, justified[^1014] God, for [3] they had been baptized with the baptism of John.[^1015]But the Pharisees and the scribes wronged[^1016] the purpose of God in themselves, in that they were not baptized of [4] him.[^1017]And from the days of John the Baptist until now the kingdom of heaven is [5] snatched away by violence.[^1018]The law and the prophets *were* until John; and after that, the kingdom of God is preached, and all press to enter it:[^1019]and they that exert themselves [6, 7] snatch it away.[^1020]All the prophets and the law until John prophesied.[^1021]And if ye [8] will, then receive *it*, that he is Elijah, which is to come.[^1022]Whosoever hath ears that hear [9] let him hear.[^1023]Easier is the perishing of heaven and earth, than the passing away of [10] one point of the law.[^1024]To whom then shall I liken the people of this generation,[^1025] and [11] to whom are they like?[^1026]They are like the children sitting in the market, which call to their companions, and say, We sang to you, and ye danced not; we wailed to you, [12] and ye wept not.[^1027]John the Baptist came neither eating bread nor drinking wine; [13] and ye said, He hath demons:[^1028]and the Son of man came eating and drinking; and ye said, Behold, a gluttonous man, and a drinker of wine, and an associate of publicans [14, 15] and sinners![^1029]And wisdom was justified of all her children.[^1030]And when he said that, they came to the house. And there gathered unto him again multitudes, [16] so that they found not bread to eat.[^1031]And while he was casting out a devil which was dumb, when he cast out that devil, that dumb *man* spake. And the multitudes [17] [Arabic, p. 55 ] marvelled.[^1032]And the Pharisees, when they heard, said, This *man* doth not cast out the devils, except by Beelzebul the chief of the demons, which is in him. [18, 19][^1033]And others requested of him a sign from heaven, to tempt him.[^1034]And Jesus knew their thoughts, and said unto them in parables, Every kingdom that withstandeth itself shall become desolate; and every house or city that disagreeth with itself shall not [20] stand:[^1035]and if a devil cast out a devil, he withstandeth himself; neither shall he be [21] able to stand, but his end shall be.[^1036]Then how now shall his kingdom stand? for ye [22] said that I cast out devils by Beelzebul.[^1037]And if I by Beelzebul cast out the devils, then your children, by what do they cast them out? And for this cause they shall [23] be judges against you.[^1038]But if I by the Spirit of God cast out devils, then the kingdom [24] of God is come near unto you.[^1039]Or how can a man enter into the house of a valiant *man*, and seize his garments,[^1040] if he do not beforehand secure himself[^1041] from [25] that valiant *man?* and then will he cut off[^1042] his house.[^1043]But when the valiant man is [26] armed, guarding his house, his possessions are in peace.[^1044]But if one come who is more valiant than he, he overcometh him, and taketh his whole armour, on which [27] he relieth, and divideth his spoil.[^1045]Whosoever is not with me is against me; and [28] whosoever gathereth not with me scattereth abroad.[^1046]For this reason I say unto you, [Arabic, p. 56 ] that all sins and blasphemies with which men blaspheme shall be forgiven [29] them:[^1047]but whosoever shall blaspheme against the Holy Spirit, there is no [30] forgiveness for him for ever, but he is deserving of eternal punishment:[^1048]because they [31] said that he had an unclean spirit.[^1049]And he said also, Every one that speaketh a word against the Son of man, it shall be forgiven him; but whosoever speaketh against the Holy Spirit, it shall not be forgiven him, neither in this world, nor in the world to [32] come.[^1050]Either ye must make a good tree[^1051] and its fruit good; or ye must make an evil [33] tree[^1052] and its fruit evil: for the tree is known by its fruit.[^1053]Ye children of vipers, how can ye, being evil, speak good things? from the overflowings of the heart the mouth [34] speaketh.[^1054]The good man from the good treasures which are in his heart bringeth forth good things; and the wicked man from the evil treasures which are in his [35] heart bringeth forth evils.[^1055]I say unto you, that every idle word which men shall [36] speak, they shall give an answer for in the day of judgement:[^1056]for by thy sayings thou shalt be justified, and by thy sayings thou shalt be judged." },
  { t = "note", id = "1013", text = "Luke vii. 29." },
  { t = "note", id = "1014", text = "Syriac. In Arabic the word ordinarily means *believed*." },
  { t = "note", id = "1015", text = "Luke vii. 30." },
  { t = "note", id = "1016", text = "See below, § 20, 28, note." },
  { t = "note", id = "1017", text = "Matt. xi. 12a." },
  { t = "note", id = "1018", text = "Luke xvi. 16." },
  { t = "note", id = "1019", text = "Matt. xi. 12b." },
  { t = "note", id = "1020", text = "Matt. xi. 13." },
  { t = "note", id = "1021", text = "Matt. xi. 14." },
  { t = "note", id = "1022", text = "Matt. xi. 15." },
  { t = "note", id = "1023", text = "Luke xvi. 17." },
  { t = "note", id = "1024", text = "Luke vii. 31b." },
  { t = "note", id = "1025", text = "See § 1, 49, note." },
  { t = "note", id = "1026", text = "Luke vii. 32." },
  { t = "note", id = "1027", text = "Luke vii. 33." },
  { t = "note", id = "1028", text = "Luke vii. 34." },
  { t = "note", id = "1029", text = "Luke vii. 35." },
  { t = "note", id = "1030", text = "Mark iii. 20, and verse 19b." },
  { t = "note", id = "1031", text = "Luke xi. 14." },
  { t = "note", id = "1032", text = "Matt. xii. 24." },
  { t = "note", id = "1033", text = "Luke xi. 16." },
  { t = "note", id = "1034", text = "Matt. xii. 25." },
  { t = "note", id = "1035", text = "Matt. xii. 26a." },
  { t = "note", id = "1036", text = "Mark iii. 26b; Matt. xii. 26b." },
  { t = "note", id = "1037", text = "Luke xi. 18b; Matt. xii. 27." },
  { t = "note", id = "1038", text = "Matt. xii. 28." },
  { t = "note", id = "1039", text = "Matt. xii. 29." },
  { t = "note", id = "1040", text = "The word used in the Syriac versions (Pesh. and Cur.) means *garments* as well as *utensils*, and the Arabic translator has chosen the wrong meaning (*cf*. § 42, 44)." },
  { t = "note", id = "1041", text = "Certain derivatives from the same root signify *bind*, but hardly this word." },
  { t = "note", id = "1042", text = "The two Arab. mss. differ in this word, but the meaning is about the same. Perhaps both are corrupt." },
  { t = "note", id = "1043", text = "Luke xi. 21." },
  { t = "note", id = "1044", text = "Luke xi. 22." },
  { t = "note", id = "1045", text = "Luke xi. 23." },
  { t = "note", id = "1046", text = "Mark iii. 28." },
  { t = "note", id = "1047", text = "Mark iii. 29." },
  { t = "note", id = "1048", text = "Mark iii. 30." },
  { t = "note", id = "1049", text = "Matt. xii. 32." },
  { t = "note", id = "1050", text = "Matt. xii. 33." },
  { t = "note", id = "1051", text = "Or, *a tree good.*" },
  { t = "note", id = "1052", text = "Or, *a tree evil.*" },
  { t = "note", id = "1053", text = "Matt. xii. 34." },
  { t = "note", id = "1054", text = "Luke vi. 45a." },
  { t = "note", id = "1055", text = "Matt. xii. 36." },
  { t = "note", id = "1056", text = "Matt. xii. 37." },
  { t = "p", text = "[37][^1057]And he said to the multitudes, When ye see the clouds appear from the west, [38] straightway ye say that there cometh rain; and so it cometh to pass.[^1058]And when [39] the south wind bloweth, ye say that there will be heat; and it cometh to pass.[^1059]And when the evening is come, ye say, It *will be* fair weather, for the heaven has become [40] red.[^1060]And in the morning ye say, To-day there will be severe weather, for the redness [Arabic, p. 57 ] of the heaven is paling.[^1061]*Ye* hypocrites, ye know to examine the face of the heaven and the earth; but the signs of this time ye know not to discern." },
  { t = "note", id = "1057", text = "Luke xii. 54." },
  { t = "note", id = "1058", text = "Luke xii. 55." },
  { t = "note", id = "1059", text = "Matt. xvi. 2b." },
  { t = "note", id = "1060", text = "Matt. xvi. 3." },
  { t = "note", id = "1061", text = "Matt. xvi. 4; this is reckoned to verse 3 in the Greek." },
  { t = "p", text = "[41][^1062]Then they brought to him one possessed of a demon, dumb *and* blind; and he [42] healed him, so that the dumb and blind began to speak and see.[^1063]And all the multitudes wondered, and said, Is this, think you, the son of David?" },
  { t = "note", id = "1062", text = "Matt. xii. 22." },
  { t = "note", id = "1063", text = "Matt. xii. 23." },
  { t = "p", text = "[43][^1064]And the apostles returned unto Jesus, and told him everything that they had [44] done and wrought.[^1065][^1066]And he said unto them, Come, let us go into the desert alone, and rest ye a little. And many were going and returning, and they had not leisure, not even to eat bread." },
  { t = "note", id = "1064", text = "Mark vi. 30." },
  { t = "note", id = "1065", text = "*Wrought* may have arisen from *taught* by a transcriptional error (transposition of *l* and *m*) *within* the Arabic text. As it appears to occur in both mss., they would seem to have a common origin, which, however, can hardly have been the autograph of the translator." },
  { t = "note", id = "1066", text = "Mark vi. 31." },
  { t = "p", text = "[45][^1067]And after that, there came to *him* one of the Pharisees, and besought him that he would eat bread with him. And he entered into the house of that Pharisee, and [46] reclined.[^1068]And there was in that city a woman *that was* a sinner; and when she knew that he was sitting in the house of that Pharisee, she took a box of sweet ointment, [47] and stood behind him,[^1069]towards his feet, weeping, and began to wet his feet with her tears, and to wipe them with the hair of her head, and to kiss his feet, and [48] anoint them with the sweet ointment.[^1070]And when that[^1071] Pharisee saw *it*, who invited him, he thought within himself, and said, This *man*, if he were a prophet, would know who she is and what is her history: for the woman which touched him was a sinner." },
  { t = "note", id = "1067", text = "Luke vii. 36." },
  { t = "note", id = "1068", text = "Luke vii. 37." },
  { t = "note", id = "1069", text = "Luke vii. 38." },
  { t = "note", id = "1070", text = "Luke vii. 39." },
  { t = "note", id = "1071", text = "A comparison with the Syriac text recommends this rendering." },
]

[[section]]
id = "section-15"
title = "Section XV."
level = 1
blocks = [
  { t = "p", text = "[1][^1072]Jesus answered and said unto him, Simon, I have something to say unto thee. And [2] he said unto him, Say *on*, my Master.[^1073]Jesus said unto him, There were two debtors [Arabic, p. 58 ] to one creditor; and one of them owed five hundred pence, and the other [3] owed fifty pence.[^1074]And because they had not wherewith to pay, he forgave [4] them both. Which of them ought to love him more?[^1075]Simon answered and said, I suppose, he to whom he forgave most. Jesus said unto him, Thou hast judged rightly. [5][^1076]And he turned to that woman, and said to Simon, Dost thou see this woman? I entered into thy dwelling, and thou gavest me not water to wash my feet: but this [6] *woman* hath bathed[^1077] my feet with her tears, and dried them with her hair.[^1078]And thou kissedst me not: but this *woman*, since she[^1079] entered, hath not ceased to kiss my [7] feet.[^1080]And thou anointedst not my head with oil:[^1081] but this *woman* hath anointed [8] my feet with sweet ointment.[^1082][^1083]And for this, I say unto thee, Her many sins are forgiven her, because she loved much; for he to whom little is forgiven loveth little. [9, 10][^1084]And he said unto that woman, Thy sins are forgiven thee.[^1085]And those that were invited [11] began to say within themselves, Who is this that forgiveth sins also?[^1086]And Jesus said to that woman, Thy faith hath saved thee; go in peace." },
  { t = "note", id = "1072", text = "Luke vii. 40." },
  { t = "note", id = "1073", text = "Luke vii. 41." },
  { t = "note", id = "1074", text = "Luke vii. 42." },
  { t = "note", id = "1075", text = "Luke vii. 43." },
  { t = "note", id = "1076", text = "Luke vii. 44." },
  { t = "note", id = "1077", text = "Lit. *sunk,* a word the choice of which is explained by the Syriac." },
  { t = "note", id = "1078", text = "Luke vii. 45." },
  { t = "note", id = "1079", text = "Or, *I*." },
  { t = "note", id = "1080", text = "Luke vii. 46." },
  { t = "note", id = "1081", text = "Same word in Arabic." },
  { t = "note", id = "1082", text = "Same word in Arabic." },
  { t = "note", id = "1083", text = "Luke vii. 47." },
  { t = "note", id = "1084", text = "Luke vii. 48." },
  { t = "note", id = "1085", text = "Luke vii. 49." },
  { t = "note", id = "1086", text = "Luke vii. 50." },
  { t = "p", text = "[12][^1087]And many believed in him when they saw the signs which he was doing. [13, 14][^1088]But Jesus did not trust[^1089] himself to them,[^1090]for he knew every man, and he needed not any man to testify to him concerning every man; for he knew what was in man." },
  { t = "note", id = "1087", text = "John ii. 23b." },
  { t = "note", id = "1088", text = "John ii. 24." },
  { t = "note", id = "1089", text = "The meaning is not apparent." },
  { t = "note", id = "1090", text = "John ii. 25." },
  { t = "p", text = "[15][^1091]And after that, Jesus set apart from his disciples other seventy, and sent them two and two before his face to every region and city whither he was purposing to [16] go.[^1092]And he said unto them, The harvest is abundant, and the labourers are few: [17] entreat now the Lord of the harvest, that he send forth labourers into his harvest.[^1093]Go [18] [Arabic, p. 59 ] ye: and lo, I am sending you as lambs among wolves.[^1094]Take not with you [19] purses, nor a wallet, nor shoes; neither salute any man in the way.[^1095]And [20] whatsoever house ye enter, first salute that house:[^1096]and if there be there a son of peace, [21] let your peace rest upon him; but if there be not, your peace shall return to you.[^1097]And be ye in that house eating and drinking what they have:[^1098] for the labourer is worthy of [22] his hire.[^1099]And remove not from house to house. And into whatsoever city ye enter, [23] and they receive you, eat what is presented to you:[^1100]and heal the sick that are [24] therein, and say unto them, The kingdom of God is come near unto you.[^1101]But whatsoever city ye enter, and they receive you not, go out into the market, and say, [25][^1102]Even the dust that clave to our feet from your city, we shake off against you; but [26] know[^1103] this,[^1104] that the kingdom of God is come near unto you.[^1105]I say unto you, that for Sodom there shall be quiet in the day of judgement, but there shall not be for [27] that city.[^1106]Then began Jesus to rebuke the cities in which there had been many [28] mighty works,[^1107] and they repented not.[^1108]And he said, Woe unto thee, Chorazin! woe unto thee, Bethsaida! if there had been in Tyre and Sidon the signs which were in [29] thee, it may be that they would have repented in sackcloth and ashes.[^1109]Howbeit I say unto you, that for Tyre and Sidon there shall be rest in the day of judgement, [30] more than for you.[^1110]And thou, Capernaum, which art exalted unto heaven, shalt sink down unto Hades; for if there had been in Sodom the wonders[^1111] which were [31] in thee, it would have remained until this day.[^1112]And now I say unto thee, that for the land of Sodom there shall be quiet in the day of judgement, more than for thee." },
  { t = "note", id = "1091", text = "Luke x. 1." },
  { t = "note", id = "1092", text = "Luke x. 2." },
  { t = "note", id = "1093", text = "Luke x. 3." },
  { t = "note", id = "1094", text = "Luke x. 4." },
  { t = "note", id = "1095", text = "Luke x. 5." },
  { t = "note", id = "1096", text = "Luke x. 6." },
  { t = "note", id = "1097", text = "Luke x. 7." },
  { t = "note", id = "1098", text = "*cf.* Syriac versions." },
  { t = "note", id = "1099", text = "Luke x. 8." },
  { t = "note", id = "1100", text = "Luke x. 9." },
  { t = "note", id = "1101", text = "Luke x. 10." },
  { t = "note", id = "1102", text = "Luke x. 11." },
  { t = "note", id = "1103", text = "The first letter of the word has been lost." },
  { t = "note", id = "1104", text = "Lit. *that*, as often in this work." },
  { t = "note", id = "1105", text = "Luke x. 12." },
  { t = "note", id = "1106", text = "Matt. xi. 20." },
  { t = "note", id = "1107", text = "Lit. *powers*." },
  { t = "note", id = "1108", text = "Matt. xi. 21." },
  { t = "note", id = "1109", text = "Matt. xi. 22." },
  { t = "note", id = "1110", text = "Matt. xi. 23." },
  { t = "note", id = "1111", text = "The word as printed by Ciasca perhaps means *gifts*, but by dropping a point from the second letter we get the post-classical word given in the text above." },
  { t = "note", id = "1112", text = "Matt. xi. 24." },
  { t = "p", text = "[32] [Arabic, p. 60 ][^1113]And he said again unto his apostles, Whosoever heareth you heareth me; and whosoever heareth me heareth him that sent me: and whosoever wrongeth[^1114] you wrongeth me; and whosoever wrongeth me wrongeth him that sent me." },
  { t = "note", id = "1113", text = "Luke x. 16." },
  { t = "note", id = "1114", text = "See below, § 20, 28, note." },
  { t = "p", text = "[33][^1115]And those seventy returned with great joy, and said unto him, Our Lord, even [34] the devils also are subject unto us in thy name.[^1116]He said unto them, I beheld [35] Satan[^1117] fallen like lightning from heaven.[^1118]Behold, I am giving you authority to tread upon serpents and scorpions, and the whole race[^1119] of the enemy; and nothing shall [36] hurt you.[^1120]Only ye must not rejoice that the devils are subject unto you; but be glad that your names are written in heaven." },
  { t = "note", id = "1115", text = "Luke x. 17." },
  { t = "note", id = "1116", text = "Luke x. 18." },
  { t = "note", id = "1117", text = "The word translated *devil* in preceding verse." },
  { t = "note", id = "1118", text = "Luke x. 19." },
  { t = "note", id = "1119", text = "This is an Arabic clerical error for *forces*. The Syriac word for *power* means also *military forces*, which was apparently rendered in Arabic *army*, a word that differs from *race* only in diacritical points." },
  { t = "note", id = "1120", text = "Luke x. 20." },
  { t = "p", text = "[37][^1121]And in that hour Jesus rejoiced in the Holy Spirit, and said, I acknowledge thee, my Father, Lord of heaven and earth, that thou didst hide these things from the wise and understanding, and didst reveal them unto children: yea, my Father; so [38] was thy will.[^1122]And he turned to his disciples,[^1123] and said unto them, Everything hath been delivered to me of my Father: and no man knoweth who the Son is, save the Father; and who the Father is, save the Son, and to whomsoever the Son willeth [39] to reveal *him*.[^1124]Come unto me, all of you, ye *that are* wearied and bearers of burdens, [40] and I will give you rest.[^1125]Bear my yoke upon you, and learn of me; for[^1126] I [41] am gentle and lowly in my heart: and ye shall find rest unto your souls.[^1127]For my yoke is pleasant, and my burden is light." },
  { t = "note", id = "1121", text = "Luke x. 21." },
  { t = "note", id = "1122", text = "Luke x. 22." },
  { t = "note", id = "1123", text = "*cf*. Pesh. and A.V. margin." },
  { t = "note", id = "1124", text = "Matt. xi. 28." },
  { t = "note", id = "1125", text = "Matt. xi. 29." },
  { t = "note", id = "1126", text = "Lit. *that* (*cf*. above, § 1, 50, note)." },
  { t = "note", id = "1127", text = "Matt. xi. 30." },
  { t = "p", text = "[42][^1128]And while great multitudes were going with him, he turned, and said unto them, [43][^1129]Whosoever cometh unto me, and hateth not his father, and his mother, and his brethren, and his sisters, and his wife, and his children, and himself[^1130] also, cannot [44] [Arabic, p. 61 ] be a disciple to me.[^1131]And whosoever doth not take his cross, and follow [45] me, cannot be a disciple to me.[^1132]Which of you desireth to build a tower, and doth not sit down first and reckon his expenses and whether he hath *enough* to [46] complete it?[^1133][^1134]lest when he hath laid the foundations, and is not able to finish, all that [47] behold him[^1135] laugh at him, and say,[^1136]This man began to build, and was not able to [48] finish.[^1137]Or what king goeth to the battle to fight with another king,[^1138] and doth not consider first whether he is able with ten thousand to meet him that cometh to him [49] with twenty thousand?[^1139]And if he is not able, he sendeth unto him while he is afar [50] off, and seeketh peace.[^1140]So shall[^1141] every man of you consider, that desireth to be a disciple to me; for if he renounceth not all that he hath, he cannot be a disciple to me." },
  { t = "note", id = "1128", text = "Luke xiv. 25." },
  { t = "note", id = "1129", text = "Luke xiv. 26." },
  { t = "note", id = "1130", text = "Or, *his life*; or, *his soul*." },
  { t = "note", id = "1131", text = "Luke xiv. 27." },
  { t = "note", id = "1132", text = "Luke xiv. 28." },
  { t = "note", id = "1133", text = "This rendering assumes that *tower* is treated as feminine." },
  { t = "note", id = "1134", text = "Luke xiv. 29." },
  { t = "note", id = "1135", text = "Or, *it*." },
  { t = "note", id = "1136", text = "Luke xiv. 30." },
  { t = "note", id = "1137", text = "Luke xiv. 31." },
  { t = "note", id = "1138", text = "Or, *a king like him*." },
  { t = "note", id = "1139", text = "Luke xiv. 32." },
  { t = "note", id = "1140", text = "Luke xiv. 33." },
  { t = "note", id = "1141", text = "Or, *let*." },
]

[[section]]
id = "section-16"
title = "Section XVI."
level = 1
blocks = [
  { t = "p", text = "[1][^1142]Then answered certain of the scribes and Pharisees, that they might tempt him, [2] and said, Teacher, we desire to see a sign from thee.[^1143]He answered and said, This evil and adulterous generation[^1144] seeketh a sign; and it shall not be given a sign, [3] except the sign of Jonah the prophet.[^1145]And as Jonah was a sign to the inhabitants [4] of Nineveh, so shall the Son of man also be to this generation.[^1146]And as Jonah was in the belly of the great fish three days and three nights, so shall the Son of man [5] be in the heart of the earth three days and three nights.[^1147]The queen of the south shall rise in the judgement with the people of this generation, and condemn[^1148] them: for she came from the ends of the earth that she might hear the wisdom of Solomon; [6] [Arabic, p. 62 ] and behold, here is a better than Solomon.[^1149]The men of Nineveh shall stand in the judgement with this generation, and condemn it: for they repented at [7] the preaching of Jonah; and behold, here is a greater than Jonah.[^1150]The unclean spirit, when he goeth out of the man, departeth, and goeth about through places wherein are no waters, that he may find rest for himself; and when he findeth *it* not, he [8] saith, I will return to my house whence I came out.[^1151]And if he come and find it [9] adorned *and* set in order,[^1152]then he goeth, and associateth with himself seven other spirits worse than himself; and they enter and dwell in it: and the end of that man [10] shall be worse than his beginning.[^1153]Thus shall it be unto this evil generation." },
  { t = "note", id = "1142", text = "Matt. xii. 38." },
  { t = "note", id = "1143", text = "Matt. xii. 39." },
  { t = "note", id = "1144", text = "See § 1, 49, note." },
  { t = "note", id = "1145", text = "Luke xi. 30." },
  { t = "note", id = "1146", text = "Matt. xii. 40." },
  { t = "note", id = "1147", text = "Luke xi. 31." },
  { t = "note", id = "1148", text = "See note to § 10, 13." },
  { t = "note", id = "1149", text = "Matt. xii. 41." },
  { t = "note", id = "1150", text = "Luke xi. 24." },
  { t = "note", id = "1151", text = "Luke xi. 25." },
  { t = "note", id = "1152", text = "Luke xi. 26." },
  { t = "note", id = "1153", text = "Matt. xii. 45b." },
  { t = "p", text = "[11][^1154]And while he was saying that, a woman from the multitude lifted up her voice, and said unto him, Blessed is the womb that bare thee, and the breasts that nursed [12] thee.[^1155]But he said unto her, Blessed is he that heareth the word of God, and keepeth it." },
  { t = "note", id = "1154", text = "Luke xi. 27." },
  { t = "note", id = "1155", text = "Luke xi. 28." },
  { t = "p", text = "[13][^1156]And while he was speaking unto the multitude, there came unto him his mother [14] and his brethren, and sought to speak with him;[^1157]and they were not able, because of [15] the multitude; and they stood without and sent, calling him unto them.[^1158]A man said unto him, Behold, thy mother and thy brethren *are* standing without, and seek to [16] speak with thee.[^1159]But he answered unto him that spake unto him, Who is my [17] mother? and who are my brethren?[^1160]And he beckoned with his hand, stretching it out towards his disciples, and said, Behold, my mother! and behold, my brethren! [18][^1161]And every man that shall do the will of my Father which is in heaven is my brother, and my sister, and my mother." },
  { t = "note", id = "1156", text = "Matt. xii. 46a; Luke viii. 19a." },
  { t = "note", id = "1157", text = "Matt. xii. 46c; Luke viii. 19b." },
  { t = "note", id = "1158", text = "Mark iii. 31; Matt. xii. 47." },
  { t = "note", id = "1159", text = "Matt. xii. 48." },
  { t = "note", id = "1160", text = "Matt. xxii. 49." },
  { t = "note", id = "1161", text = "Matt. xii. 50." },
  { t = "p", text = "[19][^1162]And after that, Jesus was going about in the cities and in the villages, and proclaiming [Arabic, p. 63 ] and preaching the kingdom of God, and his[^1163] twelve with him, [20][^1164]and the women which had been healed of diseases and of evil spirits, Mary [21] that *was* called Magdalene, from whom he had cast out seven devils,[^1165]and Joanna the wife of Chuza Herod’s steward, and Susanna, and many others, who were ministering to them of their substance." },
  { t = "note", id = "1162", text = "Luke viii. 1." },
  { t = "note", id = "1163", text = "The Arabic printed text gives no sense. A simple change in the diacritical points of one letter gives the reading of the Syriac versions, which is adopted here." },
  { t = "note", id = "1164", text = "Luke viii. 2." },
  { t = "note", id = "1165", text = "Luke viii. 3." },
  { t = "p", text = "[22][^1166]And after that, Jesus went out of the house, and sat on the sea shore.[^1167]And there [23] gathered unto him great multitudes. And when the press of the people was great upon him, he went up and sat in the boat; and all the multitude was standing on the [24] shore of the sea.[^1168]And he spake to them much in parables, and said, The sower [25] went forth to sow: and when he sowed,[^1169]some fell on the beaten highway; and it was [26] trodden upon, and the birds ate it.[^1170]And other fell on the rocks: and some, where there was not much earth; and straightway it sprang up, because it had no depth in [27] the earth:[^1171]and when the sun rose, it withered; and because it had no root, it dried [28] up.[^1172]And some fell among thorns; and the thorns sprang up with it, and choked it; [29] and it yielded no fruit.[^1173]And other fell into excellent *and* good[^1174] ground; and it came up, and grew, and brought forth fruit, some thirty, and some sixty, and some [30] a hundred.[^1175]And when he said that, he cried, He that hath ears that hear, let him [31] hear.[^1176]And when they were alone, his disciples came, and asked him, and said unto [32] him, What is this parable? and why spakest thou unto them in parables?[^1177]He [Arabic, p. 64 ] answered and said unto them, Unto you is given the knowledge of the secrets of the kingdom of God; but it is not given unto them that are [33] without.[^1178]He that hath shall be given unto, and there shall be added; and he that [34] hath not, that which he hath shall be taken from him also.[^1179]For this *cause* therefore I speak unto them in parables; because they see, and see not; and hear, and hear [35] not, nor understand.[^1180]And in them is being fulfilled the prophecy of Isaiah, who said," },
  { t = "note", id = "1166", text = "Matt. xiii. 1." },
  { t = "note", id = "1167", text = "Matt. xiii. 2." },
  { t = "note", id = "1168", text = "Matt. xiii. 3." },
  { t = "note", id = "1169", text = "Matt. xiii. 4a; Luke viii. 5b." },
  { t = "note", id = "1170", text = "Matt. xiii. 5." },
  { t = "note", id = "1171", text = "Matt. xiii. 6." },
  { t = "note", id = "1172", text = "Luke viii. 7; Mark iv. 7b." },
  { t = "note", id = "1173", text = "Luke viii. 8a; Mark iv. 8b." },
  { t = "note", id = "1174", text = "*cf*. Peshitta (against Cur. and Sin.)." },
  { t = "note", id = "1175", text = "Luke viii. 8c." },
  { t = "note", id = "1176", text = "Mark iv. 10; with additions from Matt. xiii. 10, and Luke viii. 9." },
  { t = "note", id = "1177", text = "Mark iv. 11; Matt. xiii. 11." },
  { t = "note", id = "1178", text = "Matt. xiii. 12." },
  { t = "note", id = "1179", text = "Matt. xiii. 13." },
  { t = "note", id = "1180", text = "Matt. xiii. 14." },
  { t = "p", text = "Hearing they shall hear, and shall not understand;" },
  { t = "p", text = "And seeing they shall see, and shall not perceive:" },
  { t = "p", text = "[36][^1181]The heart of this people is waxed gross," },
  { t = "note", id = "1181", text = "Matt. xiii. 15." },
  { t = "p", text = "And their hearing with their ears is become heavy," },
  { t = "p", text = "And they have closed their eyes;" },
  { t = "p", text = "Lest they should see with their eyes," },
  { t = "p", text = "And hear with their ears," },
  { t = "p", text = "And understand with their hearts," },
  { t = "p", text = "And should return," },
  { t = "p", text = "And I should heal them." },
  { t = "p", text = "[37, 38][^1182]But ye, blessed are your eyes, which see; and your ears, which hear.[^1183]Blessed [39] are the eyes which see what ye see.[^1184]Verily I say unto you, Many of the prophets and the righteous longed to see what ye see, and saw not; and to hear what ye [40] hear, and heard not.[^1185]When ye know not this parable, how shall ye know all parables? [41, 42][^1186]Hear ye the parable of the sower.[^1187]The sower which sowed, sowed the word [43] of God.[^1188]Every one who heareth the word of the kingdom, and understandeth it not, the evil one cometh and snatcheth away the word *that hath been* sown in his [44] heart: and this is that *which was* sown on the middle of the highway.[^1189]But *that* which was sown on the rocks is he that heareth the word, and straightway receiveth [45, 46] [Arabic, p. 65 ] it with joy;[^1190]only, it hath no root in his soul, but his belief in it *is* for a time;[^1191]and whenever there is distress or persecution because of a[^1192] word, he [47] stumbleth[^1193] quickly.[^1194]And *that which was* sown among the thorns is he that heareth the word;[^1195]and the care of this world, and the error of riches, and the rest of the [48] other lusts enter, and choke the word, and it becometh without fruit.[^1196]And that which was sown in good ground is he that heareth my word in a pure *and* good heart, and understandeth it, and holdeth to it, and bringeth forth fruit with patience,[^1197]and produceth either a hundredfold or sixtyfold or thirty." },
  { t = "note", id = "1182", text = "Matt. xiii. 16." },
  { t = "note", id = "1183", text = "Luke x. 23b." },
  { t = "note", id = "1184", text = "Matt. xiii. 17." },
  { t = "note", id = "1185", text = "Mark iv. 13b." },
  { t = "note", id = "1186", text = "Matt. xiii. 18." },
  { t = "note", id = "1187", text = "Mark iv. 14." },
  { t = "note", id = "1188", text = "Matt. xiii. 19." },
  { t = "note", id = "1189", text = "Matt. xiii. 20." },
  { t = "note", id = "1190", text = "Matt. xiii. 21a." },
  { t = "note", id = "1191", text = "Luke viii. 13b; Matt. xiii. 21c." },
  { t = "note", id = "1192", text = "See above, § 1, 40, note 2." },
  { t = "note", id = "1193", text = "Or, *is seduced* (*cf*. § 25, 17, note)." },
  { t = "note", id = "1194", text = "Matt. xiii. 22a." },
  { t = "note", id = "1195", text = "Mark iv. 19b." },
  { t = "note", id = "1196", text = "Luke viii. 15." },
  { t = "note", id = "1197", text = "Matt. xiii. 23b." },
  { t = "p", text = "[49][^1198]And he said, So is the kingdom of God, like a man who casteth seed into the [50] earth, and sleepeth and riseth by night and day,[^1199]and the seed groweth and cometh [51] up, whence[^1200] he knoweth not.[^1201]And the earth bringeth it to the fruit; and first it [52] will be blade, and after it ear, and at last perfect wheat in the ear:[^1202]and whenever the fruit ripeneth,[^1203] he bringeth immediately the sickle, for the harvest hath come." },
  { t = "note", id = "1198", text = "Mark iv. 26." },
  { t = "note", id = "1199", text = "Mark iv. 27." },
  { t = "note", id = "1200", text = "Or, *while*." },
  { t = "note", id = "1201", text = "Mark iv. 28." },
  { t = "note", id = "1202", text = "Mark iv. 29." },
  { t = "note", id = "1203", text = "Lit. *fatteneth*, as in Peshitta." },
]

[[section]]
id = "section-17"
title = "Section XVII."
level = 1
blocks = [
  { t = "p", text = "[1][^1204]And he set forth to them another parable, and said, The kingdom of heaven is [2] like a man who sowed good seed in his field;[^1205]but when men slept, his enemy came [3] and sowed tares among the wheat, and went away.[^1206]And when the blade sprang up [4] and brought forth fruit, there were noticed the tares also.[^1207]And the servants of the master of the house came, and said unto him, Our lord, didst thou not sow good [5] [Arabic, p. 66 ] seed in thy field? whence are there tares in it?[^1208]He said unto them, An enemy hath done this. His servants said unto him, Wilt thou that we go [6] and separate it?[^1209]He said unto them, Perhaps,[^1210] when ye separate the tares, ye would [7] root up with them wheat also.[^1211]Leave them to grow both together until the harvest: and in the time of the harvest I will say unto the reapers, Separate the tares first, and bind them in bundles to be burned with fire; and gather the wheat into my barns." },
  { t = "note", id = "1204", text = "Matt. xiii. 24." },
  { t = "note", id = "1205", text = "Matt. xiii. 25." },
  { t = "note", id = "1206", text = "Matt. xiii. 26." },
  { t = "note", id = "1207", text = "Matt. xiii. 27." },
  { t = "note", id = "1208", text = "Matt. xiii. 28." },
  { t = "note", id = "1209", text = "Matt. xiii. 29." },
  { t = "note", id = "1210", text = "See above, § 4, 24, note." },
  { t = "note", id = "1211", text = "Matt. xiii. 30." },
  { t = "p", text = "[8, 9][^1212]And he set forth to them another parable, and said,[^1213]To what is the kingdom of [10] God like? and to what shall I liken it? and in what parable shall I set it forth?[^1214]It [11] is like a grain of mustard seed, which a man took, and planted in his field:[^1215]and of the number of the things that are sown in the earth it is smaller than all of the things [12] which are sown, which are upon the earth;[^1216]but when it is grown, it is greater than all the herbs, and produceth large branches, so that the birds of heaven make *their* nests in its branches." },
  { t = "note", id = "1212", text = "Matt. xiii. 31a." },
  { t = "note", id = "1213", text = "Luke xiii. 18b." },
  { t = "note", id = "1214", text = "Mark iv. 30b; Luke xiii. 19a." },
  { t = "note", id = "1215", text = "Matt. xiii. 31c; Mark iv. 31b." },
  { t = "note", id = "1216", text = "Matt. xiii. 32b; Mark iv. 32b." },
  { t = "p", text = "[13, 14][^1217]And he set forth to them another parable:[^1218]To what shall I liken the kingdom of [15] God?[^1219]It is like the leaven which a woman took, and kneaded into three measures of flour, until the whole of it was leavened." },
  { t = "note", id = "1217", text = "Mark iv. 33; or rather Matt. xiii. 33a." },
  { t = "note", id = "1218", text = "Luke xiii. 20b." },
  { t = "note", id = "1219", text = "Matt. xiii. 33b." },
  { t = "p", text = "[16][^1220]And Jesus spake all that to the multitudes by way of parables, according as they [17] were able to hear.[^1221]And without parables spake he not unto them; that the saying of the Lord through the prophet might be fulfilled:" },
  { t = "note", id = "1220", text = "Matt. xiii. 34a; Mark iv. 33b." },
  { t = "note", id = "1221", text = "Matt. xiii. 34b; Matt. xiii. 35." },
  { t = "p", text = "I will open my mouth in parables;" },
  { t = "p", text = "And I will utter secrets which were before the foundations[^1222] of the world." },
  { t = "note", id = "1222", text = "The word (if not a corruption of that used in the Brit. Mus. text of Ibn-at-Tayyib’s Commentary, and in § 43, 46 where, however, according to Ciasca’s foot-note, it was not the word first written by the scribe) is Syriac. Perhaps it means *the ends of the earth* (see P. Smith, *Thes. Syr*.). Still a third word is used in § 47, 42." },
  { t = "p", text = "[18][^1223]But he explained to his disciples privately everything." },
  { t = "note", id = "1223", text = "Mark iv. 34b." },
  { t = "p", text = "[19][^1224]Then Jesus left[^1225] the multitudes, and came to the house. And his disciples came unto him, and said unto him, Explain unto us that parable about the tares [20] [Arabic, p. 67 ] and the field.[^1226]He answered and said unto them, He that sowed good seed is [21] the Son of man;[^1227]and the field is the world; and the good seed are the children of the [22] kingdom;[^1228]and the tares are the children of the evil one; and the enemy that sowed them[^1229] is Satan; and the harvest is the end of the world; and the reapers are the angels. [23][^1230]And as the tares are separated and burned in the fire, so shall it be in the end of [24] this world.[^1231]The Son of man shall send his angels, and separate from his kingdom [25] all things that injure,[^1232]and all the doers of iniquity, and they shall cast them into the [26] furnace of fire: and there shall be weeping and gnashing of teeth.[^1233]Then the righteous shall shine as the sun in the kingdom of their Father. Whosoever hath ears that hear, let him hear." },
  { t = "note", id = "1224", text = "Matt. xiii. 36." },
  { t = "note", id = "1225", text = "*cf*. § 11, 32, note." },
  { t = "note", id = "1226", text = "Matt. xiii. 37." },
  { t = "note", id = "1227", text = "Matt. xiii. 38." },
  { t = "note", id = "1228", text = "Matt. xiii. 39." },
  { t = "note", id = "1229", text = "Singular." },
  { t = "note", id = "1230", text = "Matt. xiii. 40." },
  { t = "note", id = "1231", text = "Matt. xiii. 41." },
  { t = "note", id = "1232", text = "Matt. xiii. 42." },
  { t = "note", id = "1233", text = "Matt. xiii. 43." },
  { t = "p", text = "[27][^1234]And again the kingdom of heaven is like treasure hid in a field: that which a man found and hid; and, for his pleasure in it, went and sold all that he had, and bought that field." },
  { t = "note", id = "1234", text = "Matt. xiii. 44." },
  { t = "p", text = "[28][^1235]And again the kingdom of heaven is like a man *that is* a merchant seeking excellent [29] pearls;[^1236]and when he found one pearl of great price, he went and sold everything that he had, and bought it." },
  { t = "note", id = "1235", text = "Matt. xiii. 45." },
  { t = "note", id = "1236", text = "Matt. xiii. 46." },
  { t = "p", text = "[30][^1237]And again the kingdom of heaven is like a net that was cast[^1238] into the sea, and [31] gathered of every kind:[^1239]and when it was filled, they drew it up on to the shore of the sea, and sat down to select; and the good of them they threw into the vessels, [32] and the bad they threw outside.[^1240]Thus shall it be in the end of the world: the angels [33] shall go forth,[^1241]and separate the wicked from among the good, and shall cast them into the furnace of fire: there shall be weeping and gnashing of teeth." },
  { t = "note", id = "1237", text = "Matt. xiii. 47." },
  { t = "note", id = "1238", text = "*cf*. note to § 10, 8." },
  { t = "note", id = "1239", text = "Matt. xiii. 48." },
  { t = "note", id = "1240", text = "Matt. xiii. 49." },
  { t = "note", id = "1241", text = "Matt. xiii. 50." },
  { t = "p", text = "[34][^1242]Jesus said unto them, Have ye understood all these *things?* They said unto [35] [Arabic, p. 68 ] him, Yea, our Lord.[^1243]He said unto them, Therefore every scribe that becometh a disciple of the kingdom of heaven is like a man that is a householder, who bringeth out of his treasures the new and the old." },
  { t = "note", id = "1242", text = "Matt. xiii. 51." },
  { t = "note", id = "1243", text = "Matt. xiii. 52." },
  { t = "p", text = "[36, 37][^1244]And when Jesus had finished all these parables, he removed thence, and came to his city;[^1245]and he taught them in their synagogues, so that they were perplexed. [38][^1246]And when the sabbath came, Jesus began to teach in the synagogue; and many of [39] those that heard marvelled, and said, Whence came these things to this *man?* And many envied him and gave no heed to him, but said, What is this wisdom that is given to this *man*, that there should happen at his hands such as these mighty works?[^1247] [40][^1248]Is not this a carpenter, son of a carpenter? and is not his mother called Mary? and [41] his brethren, James, and Joses, and Simon, and Judas?[^1249]And his sisters, all of them, [42] lo, are they not all with us?[^1250]Whence hath this *man* all these things? And they were in doubt concerning him.[^1251]And Jesus knew their opinion, and said unto them, Will ye haply[^1252] say unto me this proverb, Physician, heal first thyself: and all that [43] we have heard that thou didst in Capernaum, do here also in thine *own* city?[^1253]And he said, Verily I say unto you, A prophet is not received in his *own* city, nor among [44] his brethren:[^1254]for a prophet is not despised, save in his *own* city, and among his *own* [45] kin, and in his *own* house.[^1255]Verily I say unto you, In the days of Elijah the prophet, there were many widows among the children of Israel, when the heaven held back [46] three years and six months,[^1256]and there was a great famine in all the land; and Elijah [Arabic, p. 69 ] was not sent to one of them, save to Zarephath of Sidon, to a woman that was [47] a widow.[^1257]And many lepers were among the children of Israel in the days of Elisha the prophet; but not one of them was cleansed, save Naaman the Nabathæan.[^1258] [48][^1259]And he was not able to do there many mighty works,[^1260] because of their unbelief; [49] except that he laid his hand upon a few of the sick, and healed *them*.[^1261]And he marvelled [50] at their lack of faith.[^1262]And when those who were in the synagogue heard, [51] they were all filled with wrath; and they rose up,[^1263]and brought him forth outside the city, and brought him to the brow of the hill upon which their city was built, that [52] they might cast him from its summit:[^1264]but he passed through among them and went away." },
  { t = "note", id = "1244", text = "Matt. xiii. 53." },
  { t = "note", id = "1245", text = "Matt. xiii. 54." },
  { t = "note", id = "1246", text = "Mark vi. 2." },
  { t = "note", id = "1247", text = "Lit. *powers*." },
  { t = "note", id = "1248", text = "Matt. xiii. 55." },
  { t = "note", id = "1249", text = "Matt. xiii. 56." },
  { t = "note", id = "1250", text = "Matt. xiii. 57." },
  { t = "note", id = "1251", text = "Luke iv. 23." },
  { t = "note", id = "1252", text = "*cf*. above, § 4, 24, note." },
  { t = "note", id = "1253", text = "Luke iv. 24." },
  { t = "note", id = "1254", text = "Mark vi. 4b." },
  { t = "note", id = "1255", text = "Luke iv. 25." },
  { t = "note", id = "1256", text = "Luke iv. 26." },
  { t = "note", id = "1257", text = "Luke iv. 27." },
  { t = "note", id = "1258", text = "Of the Syriac versions Cur. and Sin. are wanting. Pesh. has *Aramæan*." },
  { t = "note", id = "1259", text = "Mark vi. 5." },
  { t = "note", id = "1260", text = "Lit. *powers*." },
  { t = "note", id = "1261", text = "Mark vi. 6a." },
  { t = "note", id = "1262", text = "Luke iv. 28." },
  { t = "note", id = "1263", text = "Luke iv. 29." },
  { t = "note", id = "1264", text = "Luke iv. 30." },
  { t = "p", text = "[53][^1265]And he went about in the villages which *were* around Nazareth, and taught in their synagogues." },
  { t = "note", id = "1265", text = "Mark vi. 6b." },
]

[[section]]
id = "section-18"
title = "Section XVIII."
level = 1
blocks = [
  { t = "p", text = "[1][^1266]At that time Herod the tetrarch heard of the fame of Jesus, and all the things which came to pass at his hand;[^1267]and he marvelled, for he had obtained excellent [2] information concerning him.[^1268][^1269]And *some* men said that John the Baptist was risen [3] from among the dead;[^1270]and[^1271] others said that Elijah had appeared; and others, Jeremiah; [4] and others, that a prophet of the old prophets was risen;[^1272]and others said that he [5] was a prophet like one of the prophets.[^1273]Herod said to his servants, This is John the Baptist, he whom I beheaded; he is risen from among the dead: therefore mighty [6] [Arabic, p. 70 ] works result from him.[^1274]For Herod him*self* had sent and taken John, and cast him into prison, for the sake of Herodias his brother Philip’s wife, whom he [7] had taken.[^1275]And John said to Herod, Thou hast no authority to take the wife of thy [8] brother.[^1276]And Herodias avoided him and wished to kill him; and she could not. [9][^1277]But Herod feared John, for he knew that he was a righteous man *and* a holy; and [10] he guarded him, and heard him much, and did, and obeyed him with gladness.[^1278]And he wished to kill him; but he feared the people, for they adhered to him as the [11] prophet.[^1279]And there was a celebrated day, and Herod had made a feast for his great men on the day of his anniversary,[^1280] and for the officers and for the chief men [12] of Galilee.[^1281]And the daughter of Herodias came in and danced in the midst of the company, and pleased Herod and those that sat with him. And the king said to the [13] damsel, Ask of me what thou wilt, and I will give it thee.[^1282]And he sware unto her, [14] Whatsoever thou shalt ask, I will give it thee, to the half of my kingdom.[^1283]And she went out, and said unto her mother, What shall I ask him?[^1284] She said unto her, The [15] head of John the Baptist.[^1285]And immediately she came in hastily to the king, and said unto him, I desire in this hour that thou give me on a dish the head of John [16] the Baptist.[^1286]And the king was exceeding sorry; but because of the oath and the [17] guests he did not wish to refuse her.[^1287]But immediately the king sent an executioner, and commanded that he should bring the head of John: and he went and cut off [18] the head of John in the prison,[^1288]and brought it on a dish, and delivered it to the [19] damsel; and the damsel gave it to her mother.[^1289]And his disciples heard, and came [Arabic, p. 71 ] and took his body, and buried it.[^1290]And they came and told[^1291] Jesus what [20] had happened.[^1292]And for this cause Herod said, I beheaded John: who [21] is this, of whom I hear these things. And he desired to see him.[^1293]And Jesus, when he heard, removed thence in a boat to a waste place alone, to the other side of the sea of the Galilee of Tiberias.[^1294]" },
  { t = "note", id = "1266", text = "Matt. xiv. 1; Luke ix. 7b." },
  { t = "note", id = "1267", text = "Mark vi. 14b." },
  { t = "note", id = "1268", text = "There can be little doubt that this is the meaning of the Arabic. There is nothing like it in the Peshitta; the Curetonian is of course lacking; but the phrase in the Sinaitic is very similar." },
  { t = "note", id = "1269", text = "Luke ix. 7c." },
  { t = "note", id = "1270", text = "Luke ix. 8a; Matt. xvi. 14b." },

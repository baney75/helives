  { t = "note", id = "3765", text = "Luke xxiv. 22." },
  { t = "note", id = "3766", text = "Luke xxiv. 23." },
  { t = "note", id = "3767", text = "Masc. Plural." },
  { t = "note", id = "3768", text = "Luke xxiv. 24." },
  { t = "note", id = "3769", text = "Luke xxiv. 25." },
  { t = "note", id = "3770", text = "Luke xxiv. 26." },
  { t = "note", id = "3771", text = "Luke xxiv. 27." },
  { t = "note", id = "3772", text = "Luke xxiv. 28." },
  { t = "note", id = "3773", text = "Luke xxiv. 29." },
  { t = "note", id = "3774", text = "*cf*. § 50, 36, note." },
  { t = "note", id = "3775", text = "Luke xxiv. 30." },
  { t = "note", id = "3776", text = "Luke xxiv. 31." },
  { t = "note", id = "3777", text = "Vat. ms. omits this clause." },
  { t = "note", id = "3778", text = "Luke xxiv. 32." },
  { t = "p", text = "[59][^3779]And they rose in that hour, and returned to Jerusalem, and found the eleven [60] gathered, and those that were with them, saying,[^3780]Truly our Lord is risen, and hath [61] appeared to Simon.[^3781]And they related what happened in the way, and how they knew him when he brake the bread.[^3782]Neither believed they that also." },
  { t = "note", id = "3779", text = "Luke xxiv. 33." },
  { t = "note", id = "3780", text = "Luke xxiv. 34." },

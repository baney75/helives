level = 1
blocks = [
  { t = "p", text = "[1][^2653]And Jesus six days before the passover[^2654] came to Bethany, where was Lazarus, [2] whom Jesus raised from among the dead.[^2655]And they made[^2656] a feast for him there: [3] and Martha was serving; while Lazarus was one of them that sat with him.[^2657]And [4] at the time of Jesus’ being at Bethany in the house of Simon the leper,[^2658]great multitudes of the Jews heard that Jesus was there: and they came, not because of Jesus alone, but [Arabic, p. 147 ] that they might look also on Lazarus, whom he raised from among the dead. [5, 6][^2659]And the chief priests considered *how* they might kill Lazarus also;[^2660]because [7] many of the Jews were going on his account, and believing in Jesus.[^2661]And Mary took a case of the ointment of fine nard, of great price,[^2662]and opened it, and poured [8] it out on the head of Jesus as he was reclining;[^2663]and she anointed his feet, and wiped them with her hair: and the house was filled with the odour of the ointment. [9, 10][^2664]But Judas Iscariot, one of the disciples, he that was to betray him, said,[^2665]Why was [11] not this ointment sold for three hundred pence, and given unto the poor?[^2666]This he said, not because of his care for the poor, but because he was a thief, and the chest [12] was with him, and what was put[^2667] into it he used to bear.[^2668]And that displeased the rest of the disciples also within themselves, and they said, Why went this ointment [13] to waste?[^2669]It was possible that it should be sold for much, and the poor be given [14] it.[^2670]And they were angry with[^2671] Mary.[^2672]And Jesus perceived *it*, and said unto them,[^2673]Leave her; why molest ye her? a good work hath she accomplished on me:[^2674]for the [15] day of my burial kept she it.[^2675]At all times the poor are with you, and when ye [16] wish ye can do them a kindness:[^2676]but I am not at all times with you.[^2677]And for this *cause*, when she poured[^2678] this ointment on my body, it is as if she did it for my burial, [17] and anointed my body beforehand.[^2679]And verily I say unto you, In every place where this my gospel shall be proclaimed in all the world, what she did shall be told for a memorial of her." },
  { t = "note", id = "2653", text = "John xii. 1." },
  { t = "note", id = "2654", text = "*cf*. the Greek phrase." },
  { t = "note", id = "2655", text = "John xii. 2." },
  { t = "note", id = "2656", text = "Lit. *he made* (*cf*. first note to § 38, 43, last sentence)." },
  { t = "note", id = "2657", text = "Mark xiv. 3a." },
  { t = "note", id = "2658", text = "John xii. 9." },
  { t = "note", id = "2659", text = "John xii. 10." },
  { t = "note", id = "2660", text = "John xii. 11." },
  { t = "note", id = "2661", text = "John xii. 3a." },
  { t = "note", id = "2662", text = "Mark xiv. 3b." },
  { t = "note", id = "2663", text = "John xii. 3b." },
  { t = "note", id = "2664", text = "John xii. 4." },
  { t = "note", id = "2665", text = "John xii. 5." },
  { t = "note", id = "2666", text = "John xii. 6." },
  { t = "note", id = "2667", text = "Lit. *fell* (*cf*. § 25, 18)." },
  { t = "note", id = "2668", text = "Mark xiv. 4." },
  { t = "note", id = "2669", text = "Matt. xxvi. 9." },
  { t = "note", id = "2670", text = "Mark xiv. 5b." },
  { t = "note", id = "2671", text = "Or, *spake angrily to*." },
  { t = "note", id = "2672", text = "Matt. xxvi. 10a." },
  { t = "note", id = "2673", text = "Mark xiv. 6b." },
  { t = "note", id = "2674", text = "John xii. 7b." },
  { t = "note", id = "2675", text = "John xii. 8a." },
  { t = "note", id = "2676", text = "Mark xiv. 7b." },
  { t = "note", id = "2677", text = "Matt. xxvi. 12." },
  { t = "note", id = "2678", text = "Lit. *cast*, as in Greek." },
  { t = "note", id = "2679", text = "Mark xiv. 8b; Mark xiv. 9." },
  { t = "p", text = "[18, 19] [Arabic, p. 148 ][^2680]And when Jesus said that, he went out leisurely to go to Jerusalem.[^2681]And when he arrived at Bethphage and at Bethany, beside the mount which is [20] called the mount of Olives,[^2682]Jesus sent two of his disciples, and he said unto them, Go [21] into this village that is opposite you:[^2683]and when ye enter it, ye shall find an ass tied, and [22] a colt with him,[^2684] which no man ever yet mounted: loose him, and bring them[^2685] unto me.[^2686]And if any man say unto you, Why loose ye them? say unto him thus, We [23] seek them for our Lord; and straightway send them hither.[^2687]All this was, that what was said in the prophet might be fulfilled, which said," },
  { t = "note", id = "2680", text = "Luke xix. 28." },
  { t = "note", id = "2681", text = "Luke xix. 29a; Matt. xxi. 1b." },
  { t = "note", id = "2682", text = "Matt. xxi. 2a; Mark xi. 2b." },
  { t = "note", id = "2683", text = "Matt. xxi. 2b; Luke xix. 30b." },
  { t = "note", id = "2684", text = "*Sic*." },
  { t = "note", id = "2685", text = "Dual in Arabic." },
  { t = "note", id = "2686", text = "Matt. xxi. 2c; Luke xix. 31a." },
  { t = "note", id = "2687", text = "Matt. xxi. 3b; Matt. xxi. 4." },
  { t = "p", text = "[24][^2688]Say ye unto the daughter of Zion," },
  { t = "note", id = "2688", text = "Matt. xxi. 5." },
  { t = "p", text = "Behold, thy King cometh unto thee," },
  { t = "p", text = "Meek, and riding upon an ass," },
  { t = "p", text = "And upon a colt the foal of an ass." },
  { t = "p", text = "[25][^2689]And the disciples did not know this at that time: but after that Jesus was glorified, his disciples remembered that these *things* were written of him, and *that* this [26] they had done unto him.[^2690]And when the two disciples went, they found as he had [27] said unto them, and they did as Jesus charged them.[^2691]And when they loosed them, [28] their owners said unto them, Why loose ye them?[^2692]They said unto them, We seek [29] them for our Lord.[^2693]And they let them *go*. And they brought the ass and the colt, [30] and they placed on the colt their garments; and Jesus mounted it.[^2694]And most of the multitudes spread their garments on the ground before him: and others cut branches [31] from the trees, and threw *them* in the way.[^2695]And when he neared his[^2696] descent from [Arabic, p. 149 ] the mount of Olives, all the disciples began to rejoice and to praise God with [32] a loud voice for all the powers which they had seen;[^2697]and they said, Praise in the highest; Praise to the Son of David: Blessed is he that cometh in the name [33] of the Lord;[^2698]and blessed[^2699] is the kingdom that cometh, *that* of[^2700] our father David:[^2701]Peace in heaven, and praise in the highest." },
  { t = "note", id = "2689", text = "John xii. 16." },
  { t = "note", id = "2690", text = "Matt. xxi. 6a; Luke xix. 32b." },
  { t = "note", id = "2691", text = "Matt. xxi. 6b; Luke xix. 33." },
  { t = "note", id = "2692", text = "Luke xix. 34." },
  { t = "note", id = "2693", text = "Mark xi. 6b; Matt. xxi. 7." },
  { t = "note", id = "2694", text = "Matt. xxi. 8." },
  { t = "note", id = "2695", text = "Luke xix. 37." },
  { t = "note", id = "2696", text = "The Syriac versions have *the*." },
  { t = "note", id = "2697", text = "Matt. xxi. 9b [or better Luke xix. 38a.]." },
  { t = "note", id = "2698", text = "Mark xi. 10a." },
  { t = "note", id = "2699", text = "Or, *and, Blessed*." },
  { t = "note", id = "2700", text = "The Arabic has *to*, but it probably represents the Syriac text with the meaning given above." },
  { t = "note", id = "2701", text = "Luke xix. 38c." },
  { t = "p", text = "[34][^2702]And a great multitude, that which came to the feast, when they heard that Jesus [35] was coming to Jerusalem, took young palm branches,[^2703][^2704]and went forth to meet him, and cried and said, Praise: Blessed is he that cometh in the name of the Lord, the [36] King of Israel.[^2705]Certain therefore of the Pharisees from among the multitudes [37] said unto him, Our Master, rebuke thy disciples.[^2706]He said unto them, Verily I say unto you, If these were silent, the stones would cry out." },
  { t = "note", id = "2702", text = "John xii. 12b." },
  { t = "note", id = "2703", text = "Lit. *the heart* (or, *pith) of the palm*. The word *pith*, which occurs also in the Æhiopic version (Ezek. xxvii. 25; Jubilees, ch. 16) and in Ibn-at-Tayyib’s exposition, though not in the Brit. Mus. gospel text, is perhaps used here of the inner branches from its resemblance to the post-biblical Hebrew word employed in accounts of the Feast of Tabernacles." },
  { t = "note", id = "2704", text = "John xii. 13." },
  { t = "note", id = "2705", text = "Luke xix. 39." },
  { t = "note", id = "2706", text = "Luke xix. 40." },
  { t = "p", text = "[38, 39][^2707]And when he drew near, and saw the city, he wept over it, and said,[^2708]Would that thou hadst known the things that are[^2709] for thy peace, in this thy day! now that is [40] hidden from thine eyes.[^2710]There shall come unto thee days when thine enemies [41] shall encompass thee, and straiten thee from every quarter,[^2711]and shall get possession of[^2712] thee, and thy children within thee; and they shall not leave in thee a stone upon another; because thou knewest not the time of thy visitation." },
  { t = "note", id = "2707", text = "Luke xix. 41." },
  { t = "note", id = "2708", text = "Luke xix. 42." },
  { t = "note", id = "2709", text = "Lit. *are found*, a rendering due to the Syriac." },
  { t = "note", id = "2710", text = "Luke xix. 43." },
  { t = "note", id = "2711", text = "Luke xix. 44." },
  { t = "note", id = "2712", text = "So Ciasca’s text, following Vat. ms. The other ms. has *drag*, which by restoring a diacritical point to the third radical would give *destroy*, the reading of the Syriac versions. Ibn-at-Tayyib’s Commentary has *hide*." },
  { t = "p", text = "[42][^2713]And when he entered into Jerusalem, the whole city was agitated, and they said, [43] Who is this?[^2714]And the multitudes said, This is Jesus, the prophet that is from Nazareth [44] of Galilee.[^2715]And the multitude which was with him bare witness that he called [45] Lazarus from the grave, and raised him from among the dead.[^2716]And for this *cause* great multitudes went out to meet him, because they heard the sign which he did." },
  { t = "note", id = "2713", text = "Matt. xxi. 10." },
  { t = "note", id = "2714", text = "Matt. xxi. 11." },
  { t = "note", id = "2715", text = "John xii. 17." },
  { t = "note", id = "2716", text = "John xii. 18." },
]

[[section]]
id = "section-40"
title = "Section XL."
level = 1
blocks = [
  { t = "p", text = "[1] [Arabic, p. 150 ][^2717]And when Jesus entered the temple, they brought unto him blind and [2] lame: and he healed them.[^2718]But when the chief priests and the Pharisees saw the wonders that he did, and the children that were crying in the temple and [3] saying, Praise be to the Son of David: it distressed them,[^2719]and they said, Hearest thou not what these say? Jesus said unto them, Yea: did ye not read long ago, From [4] the mouths of children and infants thou hast chosen my praise?[^2720]And the Pharisees said one to another, Behold, do ye not see that nothing availeth us? for lo, the whole world hath followed him." },
  { t = "note", id = "2717", text = "Matt. xxi. 14." },
  { t = "note", id = "2718", text = "Matt. xxi. 15." },
  { t = "note", id = "2719", text = "Matt. xxi. 16." },
  { t = "note", id = "2720", text = "John xii. 19." },
  { t = "p", text = "[5][^2721]And there were among them certain Gentiles also, which had come up to worship [6] at the feast:[^2722]these therefore came to Philip, who was of Bethsaida of Galilee, [7] and asked him, and said unto him, My lord, we wish to see Jesus.[^2723]And Philip [8] came and told Andrew: and Andrew and Philip told Jesus.[^2724]And Jesus answered and said unto them, The hour is come nigh, in which the Son of man is to be glorified. [9][^2725]Verily, verily, I say unto you, A grain of wheat, if it fall not and die in the [10] earth, remaineth alone; but if it die, it beareth much fruit.[^2726]He that loveth his life[^2727] destroyeth it; and he that hateth his life[^2728] in this world shall keep it unto the life eternal. [11][^2729]If a man serve me, he will follow me; and where I am, there shall my servant be [12] also: and whosoever serveth me, the Father will honour him.[^2730]Now is my soul troubled: [Arabic, p. 151 ] and what shall I say? My Father, deliver me from this hour. But [13] for this cause came I unto this hour.[^2731]My Father, glorify thy name. And a [14] voice was heard from heaven, I have glorified *it*, and shall glorify *it*.[^2732]And the multitude that were standing heard, and said, This is thunder: and others said, An [15] angel speaketh to him.[^2733]Jesus answered and said unto them, Not because of me [16] was this voice, but because of you.[^2734]Now is the judgement of this world; and the [17] prince of this world shall now be cast forth.[^2735]And I, when I am lifted up from the [18] earth, shall draw every man unto me.[^2736]This he said, that he might shew by what [19] manner of death he should die.[^2737]The multitudes said unto him, We have heard out of the law that the Messiah abideth for ever: how then sayest thou, that the Son of [20] man is to be lifted up? who is this, the Son of man?[^2738]Jesus said unto them, Another little while is the light with you. Walk so long as ye have light, lest the darkness overtake you; for he that walketh in the darkness knoweth not whither he goeth. [21][^2739]So long as ye have light, believe the light, that ye may be the children of the light." },
  { t = "note", id = "2721", text = "John xii. 20." },
  { t = "note", id = "2722", text = "John xii. 21." },
  { t = "note", id = "2723", text = "John xii. 22." },
  { t = "note", id = "2724", text = "John xii. 23." },
  { t = "note", id = "2725", text = "John xii. 24." },
  { t = "note", id = "2726", text = "John xii. 25." },
  { t = "note", id = "2727", text = "Or, *soul*; or, *self*." },
  { t = "note", id = "2728", text = "Or, *soul*; or, *self*." },
  { t = "note", id = "2729", text = "John xii. 26." },
  { t = "note", id = "2730", text = "John xii. 27." },
  { t = "note", id = "2731", text = "John xii. 28." },
  { t = "note", id = "2732", text = "John xii. 29." },
  { t = "note", id = "2733", text = "John xii. 30." },
  { t = "note", id = "2734", text = "John xii. 31." },
  { t = "note", id = "2735", text = "John xii. 32." },
  { t = "note", id = "2736", text = "John xii. 33." },
  { t = "note", id = "2737", text = "John xii. 34." },
  { t = "note", id = "2738", text = "John xii. 35." },
  { t = "note", id = "2739", text = "John xii. 36." },
  { t = "p", text = "[22][^2740]And when certain of the Pharisees asked of Jesus, when the kingdom of God should come, he answered and said unto them, The kingdom of God cometh not [23] with expectation:[^2741]neither shall they say, Lo, it is here! nor, Lo, it is there! for the kingdom of God is within you." },
  { t = "note", id = "2740", text = "Luke xvii. 20." },
  { t = "note", id = "2741", text = "Luke xvii. 21." },
  { t = "p", text = "[24][^2742]And in the day*time* he was teaching in the temple; and at night he used to go [25] out, and pass the night in the mount called the mount of Olives.[^2743]And all the people came[^2744] to him in the morning in the temple, to hear his word." },
  { t = "note", id = "2742", text = "Luke xxi. 37." },
  { t = "note", id = "2743", text = "Luke xxi. 38." },
  { t = "note", id = "2744", text = "i.e., *used to come*." },
  { t = "p", text = "[26, 27][^2745]Then spake Jesus unto the multitudes and his disciples, and said unto them,[^2746]On [28] [Arabic, p. 152 ] the seat of Moses are seated the scribes and Pharisees:[^2747]everything that they say unto you now to keep, keep and do: but according to their deeds [29] do ye not; for they say, and do not.[^2748]And they bind heavy burdens, and lay them on the shoulders of the people; while they with one of their fingers will not come [30, 31] near[^2749] them.[^2750]But all their deeds they do to make a shew before men.[^2751]And all the multitude were hearing that with pleasure." },
  { t = "note", id = "2745", text = "Matt. xxiii. 1." },
  { t = "note", id = "2746", text = "Matt. xxiii. 2." },
  { t = "note", id = "2747", text = "Matt. xxiii. 3." },
  { t = "note", id = "2748", text = "Matt. xxiii. 4." },
  { t = "note", id = "2749", text = "Or, *touch*." },
  { t = "note", id = "2750", text = "Matt. xxiii. 5a." },
  { t = "note", id = "2751", text = "Mark xii. 37b." },
  { t = "p", text = "[32][^2752]And in the course of his teaching he said unto them, Guard yourselves from the [33] scribes, who desire to walk in robes,[^2753]and love salutation in the marketplaces, and sitting in the highest places of the synagogues, and at feasts in the highest parts of [34] the rooms:[^2754]and they broaden their amulets, and lengthen the cords of their cloaks, [35][^2755]and *love* that they should be called by men, My master,[^2756]and devour widows’ houses, because[^2757] of their prolonging their prayers; these then shall receive greater judgement. [36][^2758]But ye, be ye not called masters:[^2759] for your master is one; all ye are brethren. [37][^2760]Call not then to yourselves *any one*[^2761] father on earth: for your Father is one, who is [38] in heaven.[^2762]And be not called directors: for your director is one, *even* the Messiah. [39, 40][^2763]He that is great among you shall be unto you a minister.[^2764]Whosoever shall exalt himself shall be abased; and whosoever shall abase himself shall be exalted." },
  { t = "note", id = "2752", text = "Mark xii. 38." },
  { t = "note", id = "2753", text = "Mark xii. 39." },
  { t = "note", id = "2754", text = "Matt. xxiii. 5b." },
  { t = "note", id = "2755", text = "Matt. xxiii. 7b." },
  { t = "note", id = "2756", text = "Mark xii. 40." },
  { t = "note", id = "2757", text = "The Syriac word means *on the pretext of* as well as *because of* (*cf*. § 50, 11, note)." },
  { t = "note", id = "2758", text = "Matt. xxiii. 8." },
  { t = "note", id = "2759", text = "This word is not spelled in the ordinary way. Doubtless we should supply two diacritical points and read, with the Syriac versions, *My master*." },
  { t = "note", id = "2760", text = "Matt. xxiii. 9." },
  { t = "note", id = "2761", text = "*cf*. Peshitta." },
  { t = "note", id = "2762", text = "Matt. xxiii. 10." },
  { t = "note", id = "2763", text = "Matt. xxiii. 11." },
  { t = "note", id = "2764", text = "Matt. xxiii. 12." },
  { t = "p", text = "[41][^2765]Woe unto you, Pharisees! because ye love the highest places in the synagogues, and salutation in the marketplaces." },
  { t = "note", id = "2765", text = "Luke xi. 43." },
  { t = "p", text = "[42][^2766]Woe unto you, scribes and Pharisees, hypocrites! because ye devour widows’ houses, because[^2767] of your prolonging your prayers: for this *reason* then ye shall receive greater judgement." },
  { t = "note", id = "2766", text = "Matt. xxiii. 14." },
  { t = "note", id = "2767", text = "Syriac, same as in § 40, 35; Arabic different." },
  { t = "p", text = "[43][^2768]Woe unto you, scribes and Pharisees, hypocrites! because ye have shut the kingdom of God before men." },
  { t = "note", id = "2768", text = "Matt. xxiii. 13a." },
  { t = "p", text = "[44] [Arabic, p. 153 ][^2769]Woe unto you that know the law! for ye concealed the keys of knowledge:[^2770]ye enter not, and those that are entering ye suffer not to enter." },
  { t = "note", id = "2769", text = "Luke xi. 52a." },
  { t = "note", id = "2770", text = "Matt. xxiii. 13b." },
  { t = "p", text = "[45][^2771]Woe unto you, scribes and Pharisees, hypocrites! because[^2772] ye compass land and sea to draw[^2773] one proselyte; and when he is *become so*, ye make him a son of hell twice as much[^2774] as yourselves." },
  { t = "note", id = "2771", text = "Matt. xxiii. 15." },
  { t = "note", id = "2772", text = "Adopting the reading of Borg. ms. (*cf*. next verse)." },
  { t = "note", id = "2773", text = "Perhaps this reading is due to the easy confusion of *d* and *r* in Syriac; but it might also conceivably be a corruption of the Arabic word in the next clause. It occurs also in the text of Ibn-at-Tayyib’s Commentary." },
  { t = "note", id = "2774", text = "Doubtless the Arabic word should be read as a monosyllable, as in Ibn-at-Tayyib’s Commentary." },
  { t = "p", text = "[46][^2775]Woe unto you, ye blind guides! because ye say, Whosoever sweareth by the temple, it is nothing; but whosoever sweareth by the gold that is in the temple, [47] shall be condemned.[^2776][^2777]Ye blind foolish *ones*: which is greater, the gold, or the [48] temple which sanctifieth the gold?[^2778]And, Whosoever sweareth by the altar, it is nothing; but whosoever sweareth by the offering that is upon it, shall be condemned.[^2779] [49][^2780]Ye blind foolish *ones*: which is greater, the offering, or the altar which sanctifieth [50] the offering?[^2781]Whosoever then sweareth by the altar, hath sworn by it, and by all [51] that is upon it.[^2782]And whosoever sweareth by the temple, hath sworn by it, and by [52] him that is dwelling in it.[^2783]And whosoever sweareth by heaven, hath sworn by the throne of God, and by him that sitteth upon it." },
  { t = "note", id = "2775", text = "Matt. xxiii. 16." },
  { t = "note", id = "2776", text = "See § 10, 13." },
  { t = "note", id = "2777", text = "Matt. xxiii. 17." },
  { t = "note", id = "2778", text = "Matt. xxiii. 18." },
  { t = "note", id = "2779", text = "See § 10, 13." },
  { t = "note", id = "2780", text = "Matt. xxiii. 19." },
  { t = "note", id = "2781", text = "Matt. xxiii. 20." },
  { t = "note", id = "2782", text = "Matt. xxiii. 21." },
  { t = "note", id = "2783", text = "Matt. xxiii. 22." },
  { t = "p", text = "[53][^2784]Woe unto you, scribes and Pharisees, hypocrites! because ye tithe mint and rue and dill and cummin and all herbs, and ye leave the important *matters* of the law, judgement, and mercy, and faith, and the love of God: this ought ye to do, and [54] not to leave that *undone*.[^2785]Ye blind guides, which strain out a gnat, and swallow[^2786] camels." },
  { t = "note", id = "2784", text = "Matt. xxiii. 23." },
  { t = "note", id = "2785", text = "Matt. xxiii. 24." },
  { t = "note", id = "2786", text = "The Arabic word as printed gives no suitable sense. Either the last radical has been omitted, or the last two radicals have exchanged places." },
  { t = "p", text = "[55][^2787]Woe unto you, scribes and Pharisees, hypocrites! because ye cleanse the outside of the cup and of the platter, while the inside of them is full of injustice and wrong. [56][^2788]Ye blind Pharisees, cleanse first the inside of the cup and of the platter, then shall the outside of them be cleansed." },
  { t = "note", id = "2787", text = "Matt. xxiii. 25." },
  { t = "note", id = "2788", text = "Matt. xxiii. 26." },
  { t = "p", text = "[57] [Arabic, p. 154 ][^2789]Woe unto you, scribes and Pharisees, hypocrites! because ye resemble whited sepulchres, which appear[^2790] from the outside beautiful, but within [58] full of the bones of the dead, and all uncleanness.[^2791]So ye also from without appear unto men like the righteous, but within ye are full of wrong and hypocrisy." },
  { t = "note", id = "2789", text = "Matt. xxiii. 27." },
  { t = "note", id = "2790", text = "Lit. *are seen*." },
  { t = "note", id = "2791", text = "Matt. xxiii. 28." },
  { t = "p", text = "[59][^2792]One of the scribes answered and said unto him, Teacher, in this saying of thine [60] thou art casting a slur on us.[^2793]He said, And to you also, ye scribes, woe! for ye lade men with heavy burdens, and ye with one of your fingers come not near[^2794] those burdens." },
  { t = "note", id = "2792", text = "Luke xi. 45." },
  { t = "note", id = "2793", text = "Luke xi. 46." },
  { t = "note", id = "2794", text = "Or, *touch*." },
  { t = "p", text = "[61][^2795]Woe unto you, scribes and Pharisees, hypocrites! for ye build the tombs of the prophets, which your fathers killed, and adorn the burying-places of the righteous, [62] and say,[^2796]If we had been in the days of our fathers, we should not have been partakers [63] with them in the blood of the prophets.[^2797]Wherefore, behold, ye witness against [64] yourselves, that ye are the children of those that slew the prophets.[^2798]And ye also, [65] ye fill up the measure[^2799] of your fathers.[^2800]Ye serpents, ye children of vipers, where shall ye flee from the judgement of Gehenna?" },
  { t = "note", id = "2795", text = "Matt. xxiii. 29a; Luke xi. 47b; Matt. xxiii. 29b." },
  { t = "note", id = "2796", text = "Matt. xxiii. 30." },
  { t = "note", id = "2797", text = "Matt. xxiii. 31." },
  { t = "note", id = "2798", text = "Matt. xxiii. 32." },
  { t = "note", id = "2799", text = "Lit. *boundary* or *limit*." },
  { t = "note", id = "2800", text = "Matt. xxiii. 33." },
]

[[section]]
id = "section-41"
title = "Section XLI."
level = 1
blocks = [
  { t = "p", text = "[1][^2801]Therefore, behold, I, the wisdom of God, am sending unto you prophets, and apostles, and wise men, and scribes: and some of them ye shall slay and crucify; and some of them ye shall beat in your synagogues, and persecute[^2802] from city to [2] city:[^2803]that there may come on you all the blood of the righteous that hath been poured upon the ground[^2804] from the blood of Abel the pure to the blood of Zachariah the son of Barachiah, whom ye slew between the temple[^2805] and the altar. [3][^2806]Verily I say unto you, All these *things* shall come upon this generation.[^2807]" },
  { t = "note", id = "2801", text = "Matt. xxiii. 34." },
  { t = "note", id = "2802", text = "*cf*. 8, 34." },
  { t = "note", id = "2803", text = "Matt. xxiii. 35." },
  { t = "note", id = "2804", text = "Or, *earth*." },
  { t = "note", id = "2805", text = "Or, *sanctuary*." },
  { t = "note", id = "2806", text = "Matt. xxiii. 36." },
  { t = "note", id = "2807", text = "See § 1, 49, note." },
  { t = "p", text = "[4] [Arabic, p. 155 ][^2808]O Jerusalem, Jerusalem, slayer of the prophets, and stoner of them that are sent unto her! how many times did I wish to gather thy children, as [5] a hen gathereth her chickens under her wings, and ye would not![^2809]Your house shall [6] be left over you desolate.[^2810]Verily I say unto you, Ye shall not see me henceforth, till ye shall say Blessed is he that cometh in the name of the Lord." },
  { t = "note", id = "2808", text = "Matt. xxiii. 37." },
  { t = "note", id = "2809", text = "Matt. xxiii. 38." },
  { t = "note", id = "2810", text = "Matt. xxiii. 39." },
  { t = "p", text = "[7][^2811]And many of the rulers also believed on him; but because of the Pharisees they [8] were not confessing *him*, lest they be put[^2812] out of the synagogue:[^2813]and they loved [9] the praise of men more than the praising of God.[^2814]And Jesus cried and said, [10] Whosoever believeth in me, believeth not in me, but in him that sent me.[^2815]And [11] whosoever seeth me hath seen him that sent me.[^2816]I am come a light[^2817] into the [12] world, and so every one that believeth in me abideth not in the darkness.[^2818]And whosoever heareth my sayings, and keepeth them not, I judge him not: for I came [13] not to judge the world, but to give the world life.[^2819][^2820]Whosoever wrongeth[^2821] me, and receiveth not my sayings, there is one that judgeth him: the word that I spake, it [14] shall judge him at the last day.[^2822]I from myself did not speak: but the Father which sent me, he hath given me commandment,[^2823] what I should say, and what I [15] should speak; and I know that his commandment[^2824] is eternal life.[^2825]The things that I say now, as my Father hath said unto me, *even* so I say." },
  { t = "note", id = "2811", text = "John xii. 42." },
  { t = "note", id = "2812", text = "Lit. *become*." },
  { t = "note", id = "2813", text = "John xii. 43." },
  { t = "note", id = "2814", text = "John xii. 44." },
  { t = "note", id = "2815", text = "John xii. 45." },
  { t = "note", id = "2816", text = "John xii. 46." },
  { t = "note", id = "2817", text = "The text as it stands ought to mean *I am a light*. *I am come*; but it is a word-for-word reproduction of the Peshitta, and should therefore doubtless be rendered as above." },
  { t = "note", id = "2818", text = "John xii. 47." },
  { t = "note", id = "2819", text = "Or, *to save the world* (*cf*. § 1, 78, note)." },
  { t = "note", id = "2820", text = "John xii. 48." },
  { t = "note", id = "2821", text = "See § 20, 28, note." },
  { t = "note", id = "2822", text = "John xii. 49." },
  { t = "note", id = "2823", text = "Not the same word." },
  { t = "note", id = "2824", text = "Not the same word." },
  { t = "note", id = "2825", text = "John xii. 50." },
  { t = "p", text = "[16][^2826]And when he said that unto them, the scribes and Pharisees began their evil-doing, being angry with *him*, and finding fault with his sayings, and harassing[^2827] him [17] in many things;[^2828]seeking to catch something from his mouth, that they might be able to calumniate him." },
  { t = "note", id = "2826", text = "Luke xi. 53." },
  { t = "note", id = "2827", text = "So Ciasca, following Vat. ms. The true reading, however, is probably that underlying the Borg. ms. If we restore diacritical points to the radical letters we get *deceiving* (*cf*. § 41, 31), an alternative meaning (or the word *laying wait for*, used in the Peshitta. The Arabic follows the Peshitta very closely in this and the following verse." },
  { t = "note", id = "2828", text = "Luke xi. 54." },
  { t = "p", text = "[18][^2829]And when there gathered together myriads of great multitudes, which almost trode [Arabic, p. 156 ] one upon another, Jesus began to say unto his disciples, Preserve yourselves [19] from the leaven of the Pharisees, which is hypocrisy.[^2830]For there is nothing [20] concealed, that shall not be revealed: nor hid, that shall not be known.[^2831]Everything that ye have said in the darkness shall be heard in the light; and what ye have spoken secretly in the ears in the inner chambers shall be proclaimed on the roofs." },
  { t = "note", id = "2829", text = "Luke xii. 1." },
  { t = "note", id = "2830", text = "Luke xii. 2." },
  { t = "note", id = "2831", text = "Luke xii. 3." },
  { t = "p", text = "[21, 22][^2832]This said Jesus, and he went and hid himself from them.[^2833]But notwithstanding [23] his having done all these signs before them, they believed not in him:[^2834]that the word of Isaiah the prophet might be fulfilled, who said," },
  { t = "note", id = "2832", text = "John xii. 36b." },
  { t = "note", id = "2833", text = "John xii. 37." },
  { t = "note", id = "2834", text = "John xii. 38." },
  { t = "p", text = "My Lord, who is he that hath believed to hear us?" },
  { t = "p", text = "And the arm of the Lord, to whom hath it appeared?" },
  { t = "p", text = "[24][^2835]And for this reason it is not possible for them to believe, because Isaiah also said," },
  { t = "note", id = "2835", text = "John xii. 39." },
  { t = "p", text = "[25][^2836]They have blinded their eyes, and made dark their heart;" },
  { t = "note", id = "2836", text = "John xii. 40." },
  { t = "p", text = "That they may not see with their eyes, and understand with their heart," },
  { t = "p", text = "And turn," },
  { t = "p", text = "So that I should heal them." },
  { t = "p", text = "[26][^2837]This said Isaiah when he saw his glory, and spake of him." },
  { t = "note", id = "2837", text = "John xii. 41." },
  { t = "p", text = "[27][^2838]And when Jesus went out of the temple, certain of his disciples came forward [28] to shew[^2839] him the buildings of the temple,[^2840]and its beauty and greatness, and the strength of the stones that were laid in it, and the elegance of its building, and that [29] it was adorned with noble stones and beautiful colours.[^2841]Jesus answered and said [30] unto them, See ye these great buildings?[^2842]verily I say unto you, Days will come, when there shall not be left here a stone upon another, that shall not be cast down." },
  { t = "note", id = "2838", text = "Matt. xxiv. 1." },
  { t = "note", id = "2839", text = "Or, *and shewed*." },
  { t = "note", id = "2840", text = "Mark xiii. 1b; Luke xxi. 5b." },
  { t = "note", id = "2841", text = "Matt. xxiv. 2a." },
  { t = "note", id = "2842", text = "Luke xix. 43a; Luke xix. 44b [or rather Matt. xxiv. 2b, or Mark xiii. 2b]." },
  { t = "p", text = "[31][^2843]And two days before[^2844] the passover of unleavened bread, the chief priests and [32] the scribes sought how they might take him by deceit,[^2845] and kill him:[^2846]and they said, It shall not be at the feast, lest the people be agitated." },
  { t = "note", id = "2843", text = "Mark xiv. 1." },
  { t = "note", id = "2844", text = "Lit. *before two days would be* (*cf*. Sin. and above, § 39, 1, note)." },
  { t = "note", id = "2845", text = "*cf*. § 41, 16, note." },
  { t = "note", id = "2846", text = "Mark xiv. 2." },
  { t = "p", text = "[33][^2847]And when Jesus sat on the mount of Olives opposite the temple, his disciples, Simon Cephas and James and John and Andrew, came forward unto him, and said unto him [34] between themselves and him,[^2848]Teacher, tell us when that shall be, and what is the sign [35] [Arabic, p. 157 ] of thy coming and the end of the world.[^2849]Jesus answered and said unto them, Days will come, when ye shall long to see one of the days of the Son of [36, 37][^2850]man, and shall not behold.[^2851]Take heed lest any man lead you astray. Many shall [38] come in my name, and say, I am the Messiah;[^2852]and they shall say, The time is come [39] near, and shall lead many astray: go not therefore after them.[^2853]And when ye hear of wars and tidings of insurrections, see *to it*, be[^2854] not agitated: for these *things* must [40] first be; only the end is not yet come.[^2855]Nation shall rise against nation, and kingdom [41] against kingdom:[^2856]and great earthquakes shall be in one place and another, and there shall be famines and deaths and agitations: and there shall be fear and terror and great signs that[^2857] shall appear from heaven, and there shall be great [42, 43] storms[^2858]All these *things* are the beginning of travail.[^2859]But before all of that, they shall lay hands upon you, and persecute you, and deliver you unto the synagogues [44] and into prisons, and bring you before kings and judges for my name’s sake.[^2860]And [45] that shall be unto you for a witness.[^2861]But first must my gospel be preached unto all [46] nations.[^2862]And when they bring you into the synagogues before the rulers and the authorities, be not anxious beforehand how ye shall answer for yourselves, or what ye [47, 48] shall say:[^2863]because it is not ye that speak, but the Holy Spirit.[^2864]Lay it to your heart, not [49] [Arabic, p. 158 ] to be anxious before the time what ye shall say:[^2865]and I shall[^2866] give you understanding and wisdom,[^2867] which all your adversaries shall not be able to gainsay. [50][^2868]And then shall they deliver you unto constraint, and shall kill you: and ye shall be [51] hated of all nations because of my name.[^2869]And then shall many go astray,[^2870] and they [52] shall hate one another, and deliver one another unto death.[^2871]And your parents, and your brethren, and your kinsfolk, and your friends shall deliver you up, and shall [53, 54] slay some of you.[^2872]But a lock of hair from your heads shall not perish.[^2873]And by [55] your patience ye shall gain[^2874] your souls.[^2875]And many *men*,[^2876] false prophets, shall arise, [56] and lead many astray.[^2877]And because of the abounding of iniquity, the love of many [57] shall wax cold.[^2878]But he that endureth to the end, the same shall be saved.[^2879]And [58] this, the[^2880] gospel of the kingdom, shall be preached in all the world for a testimony to all nations; and then shall come the end of all." },
  { t = "note", id = "2847", text = "Mark xiii. 3." },
  { t = "note", id = "2848", text = "Luke xxi. 7b; Matt. xxiv. 3b." },
  { t = "note", id = "2849", text = "Matt. xxiv. 4a; Luke xvii. 22b; Matt. xxiv. 4b." },
  { t = "note", id = "2850", text = "Matt. xxiv. 5a." },
  { t = "note", id = "2851", text = "Luke xxi. 8b." },
  { t = "note", id = "2852", text = "Mark xiii. 6b; Luke xxi. 8c." },
  { t = "note", id = "2853", text = "Mark xiii. 7a; Matt. xxiv. 7b; Luke xxi. 9b." },
  { t = "note", id = "2854", text = "Or, *that ye be*, if we suppose the present text to have resulted from the loss of the second of two *alifs*." },
  { t = "note", id = "2855", text = "Matt. xxiv. 7a." },
  { t = "note", id = "2856", text = "Luke xxi. 11." },
  { t = "note", id = "2857", text = "Or, omit *that*." },
  { t = "note", id = "2858", text = "Matt. xxiv. 8." },
  { t = "note", id = "2859", text = "Luke xxi. 12." },
  { t = "note", id = "2860", text = "Luke xxi. 13." },
  { t = "note", id = "2861", text = "Mark xiii. 10." },
  { t = "note", id = "2862", text = "Luke xii. 11." },
  { t = "note", id = "2863", text = "Mark xiii. 11b." },
  { t = "note", id = "2864", text = "Luke xxi. 14." },
  { t = "note", id = "2865", text = "Luke xxi. 15." },
  { t = "note", id = "2866", text = "The Arabic text lacks a letter." },
  { t = "note", id = "2867", text = "Borg. ms. reads *you the fruits of wisdom*." },
  { t = "note", id = "2868", text = "Matt. xxiv. 9." },
  { t = "note", id = "2869", text = "Matt. xxiv. 30." },
  { t = "note", id = "2870", text = "See § 25, 17, note." },
  { t = "note", id = "2871", text = "Luke xxi. 16." },
  { t = "note", id = "2872", text = "Luke xxi. 18." },
  { t = "note", id = "2873", text = "Luke xxi. 19." },
  { t = "note", id = "2874", text = "Or, *possess*." },
  { t = "note", id = "2875", text = "Matt. xxiv. 11." },
  { t = "note", id = "2876", text = "So the Arabic text; but it doubtless simply represents the Syriac, which here agrees with the Greek." },
  { t = "note", id = "2877", text = "Matt. xxiv. 12." },
  { t = "note", id = "2878", text = "Matt. xxiv. 13." },
  { t = "note", id = "2879", text = "Matt. xxiv. 14." },
  { t = "note", id = "2880", text = "So the Arabic text; but it doubtless simply represents the Syriac, which here agrees with the Greek." },
]

[[section]]
id = "section-42"
title = "Section XLII."
level = 1
blocks = [
  { t = "p", text = "[1][^2881]But when ye see Jerusalem with the army compassing it about, then know that [2] its desolation is come near.[^2882]Those then that are in Judæa at that time shall flee to the mountain; and those that are within her shall flee; and those that are in the [3] villages shall not enter her.[^2883]For these days are the days of vengeance, that all that [4] is written may be fulfilled.[^2884]And when ye see the unclean sign of desolation,[^2885] spoken of in Daniel the prophet, standing in the pure place, he that readeth shall understand, [5, 6][^2886]and then he that is in Judæa shall flee in to the mountain:[^2887]and let him that is on the [7] roof not go down, nor enter in to take anything from his house:[^2888]and let him that is in [8] [Arabic, p. 159 ] the field not turn behind him to take his garment.[^2889]Woe to them that are with child and to them that give suck in those days! there shall be great [9] distress in the land, and wrath against this nation.[^2890]And they shall fall on the edge of the sword,[^2891] and shall be taken captive to every land: and Jerusalem shall be trodden down of the nations, until the times of the nations be ended." },
  { t = "note", id = "2881", text = "Luke xxi. 20." },
  { t = "note", id = "2882", text = "Luke xxi. 21." },
  { t = "note", id = "2883", text = "Luke xxi. 22." },
  { t = "note", id = "2884", text = "Matt. xxiv. 15." },
  { t = "note", id = "2885", text = "So Vat. ms., following the Peshitta. Ciasca follows Borg. ms., which by a change of diacritical points has the hardly grammatical reading, *see that it is the desolation, the unclean thing spoken of*. Ibn-at-Tayyib’s Commentary supports Vat. ms." },
  { t = "note", id = "2886", text = "Matt. xxiv. 16." },
  { t = "note", id = "2887", text = "Mark xiii. 15." },
  { t = "note", id = "2888", text = "Mark xiii. 16." },
  { t = "note", id = "2889", text = "Luke xxi. 23." },
  { t = "note", id = "2890", text = "Luke xxi. 24." },
  { t = "note", id = "2891", text = "This word has a Syriac meaning given to it. In Arabic it means *war*." },
  { t = "p", text = "[10][^2892]Then if any man say unto you, The Messiah is here; or, Lo, he is there; believe [11] him not:[^2893]there shall rise then false Messiahs and prophets of lying, and shall do signs and wonders, in order that they may lead astray even the elect also, if they [12] be able.[^2894]But as for you, beware: for I have acquainted you with everything [13] beforehand.[^2895]If then they say unto you, Lo, he is in the desert; go not out, lest ye [14] be taken: and if they say unto you, Lo, he is in the chamber; believe not.[^2896]And as the lightning appeareth from the east, and is seen unto the west; so shall be the [15] coming of the Son of man.[^2897]But first he must suffer much and be rejected by this [16] generation.[^2898][^2899]Pray therefore that your flight be not in winter, nor on a sabbath: [17][^2900]there shall be then great tribulation,[^2901] the like of which there hath not been from the [18] beginning of the world till now, nor shall be.[^2902]And except the Lord had shortened those days, no flesh would have lived: but because of the elect, whom he elected, [19] he shortened those days.[^2903]And there shall be signs in the sun and the moon and the stars; and upon the earth affliction[^2904] of the nations, and rubbing of hands for the confusion[^2905] [20] [Arabic, p. 160 ] of the noise of the sea, and an earthquake:[^2906]the souls of men shall [21] go forth from fear of that which is to come upon the earth.[^2907]And in those days, straightway after the distress of those days, the sun shall become dark, and the moon shall not shew its light, and the stars shall fall from heaven, and the powers [22] of heaven shall be convulsed:[^2908]and then shall appear the sign of the Son of man in heaven: and at that time all the tribes of the earth shall wail, and look unto the Son [23] of man coming on the clouds of heaven with power and much glory.[^2909]And he shall send his angels with the great trumpet, and they shall gather his elect from the four [24] winds, from one end of heaven to the other.[^2910][^2911]But when these things begin to be, be of good cheer, and lift up your heads; for your salvation[^2912] is come near." },
  { t = "note", id = "2892", text = "Mark xiii. 21." },
  { t = "note", id = "2893", text = "Matt. xxiv. 24." },
  { t = "note", id = "2894", text = "Mark xiii. 23." },
  { t = "note", id = "2895", text = "Matt. xxiv. 26." },
  { t = "note", id = "2896", text = "Matt. xxiv. 27." },
  { t = "note", id = "2897", text = "Luke xvii. 25." },
  { t = "note", id = "2898", text = "*cf*. § 16, 2." },
  { t = "note", id = "2899", text = "Matt. xxiv. 20." },
  { t = "note", id = "2900", text = "Matt. xxiv. 21." },
  { t = "note", id = "2901", text = "Same Arabic (and Syriac) word as in § 41, 50." },
  { t = "note", id = "2902", text = "Mark xiii. 20." },
  { t = "note", id = "2903", text = "Luke xxi. 25." },
  { t = "note", id = "2904", text = "Same Arabic (and Syriac) word as in § 41, 50." },
  { t = "note", id = "2905", text = "So the Borg. ms. The Vat. ms., followed by Ciasca, has *grief*." },
  { t = "note", id = "2906", text = "Luke xxi. 26a." },
  { t = "note", id = "2907", text = "Mark xiii. 24a; Matt. xxiv. 29." },
  { t = "note", id = "2908", text = "Matt. xxiv. 30." },
  { t = "note", id = "2909", text = "Matt. xxiv. 31." },
  { t = "note", id = "2910", text = "Lit. *the end of heaven unto its end*." },
  { t = "note", id = "2911", text = "Luke xxi. 28." },
  { t = "note", id = "2912", text = "Or, *deliverance*." },
  { t = "p", text = "[25][^2913]Learn the example of the fig tree: when it letteth down its branches,[^2914] and putteth [26] forth its leaves, ye know that the summer is come;[^2915]so ye also, when ye see these things begun to be, know ye that the kingdom of God hath arrived at the [27] door.[^2916]Verily I say unto you, This generation shall not pass away, until all these [28] *things* shall be.[^2917]Heaven and earth shall pass away, but my sayings shall not pass away." },
  { t = "note", id = "2913", text = "Matt. xxiv. 32." },
  { t = "note", id = "2914", text = "*cf*. Peshitta, which text the translator seems to have misread." },
  { t = "note", id = "2915", text = "Matt. xxiv. 33." },
  { t = "note", id = "2916", text = "Matt. xxiv. 34." },
  { t = "note", id = "2917", text = "Matt. xxiv. 35." },
  { t = "p", text = "[29][^2918]Take heed to yourselves, that your hearts become not heavy with inordinate desire,[^2919] and drunkenness, and the care of the world at any time, and that day come [30] upon you suddenly:[^2920]for it is as a shock that shocks all the inhabitants that are on the [31] face of the whole earth.[^2921]Watch at all times, and pray, that ye may be worthy to escape [Arabic, p. 161 ] from all the things that are to be, and that ye may stand before the Son of [32] man.[^2922]Of that day and of that hour hath no man learned, not even the angels [33] of heaven, neither the Son, but the Father.[^2923]See ye, and watch and pray: for ye know [34] not when that time *will be*.[^2924]*It is* as a man, who journeyed, and left his house, and gave his authority to his servants, and appointed every man to his work, and [35] charged the porter to be wakeful.[^2925]Be wakeful then:[^2926] since ye know not when the lord of the house cometh, in the evening, or in the middle of the night, or when the [36] cock croweth, or in the morning;[^2927]lest he come unexpectedly, and find you sleeping. [37][^2928]The thing that I say unto you, unto all of you do I say it, Be ye watchful." },
  { t = "note", id = "2918", text = "Luke xxi. 34." },
  { t = "note", id = "2919", text = "*cf*. Peshitta." },
  { t = "note", id = "2920", text = "Luke xxi. 35." },
  { t = "note", id = "2921", text = "Luke xxi. 36." },
  { t = "note", id = "2922", text = "Mark xiii. 32." },
  { t = "note", id = "2923", text = "Mark xiii. 33." },
  { t = "note", id = "2924", text = "Mark xiii. 34." },
  { t = "note", id = "2925", text = "Mark xiii. 35." },
  { t = "note", id = "2926", text = "*cf*. § 9, 21." },
  { t = "note", id = "2927", text = "Mark xiii. 36." },
  { t = "note", id = "2928", text = "Mark xiii. 37." },
  { t = "p", text = "[38][^2929]For as it was in the days of Noah, so shall the coming of the Son of man be. [39][^2930]As they were before the flood eating and drinking, and taking wives, and giving [40] wives to men,[^2931]until the day in which Noah entered into the ark, and they perceived not till the flood came, and took them all; so shall the coming of the Son of man [41] be.[^2932]And as it was in the days of Lot; they were eating and drinking, and selling [42] and buying, and planting and building,[^2933]on the day in which Lot went out from Sodom, and the Lord rained fire and brimstone from heaven, and destroyed them [43, 44] all:[^2934]so shall it be in the day in which the Son of man is revealed.[^2935][^2936]And in that day, whosoever is on the roof, and his garments[^2937] in the house, let him not go down to [45] take them: and he that is in the field shall not turn behind him.[^2938]Remember Lot’s [46] wife.[^2939]Whosoever shall desire to save his life shall destroy it: but whosoever shall [47] destroy his life shall save it.[^2940]Verily I say unto you, In that night there shall be two on [48] [Arabic, p. 162 ] one bed; one shall be taken, and another left.[^2941]And two *women* shall be grinding [49] at one mill; one shall be taken, and another left.[^2942]And two shall be in the [50] field; one shall be taken, and another left.[^2943]They answered and said unto him, To what place, our Lord? He said unto them, Where the body is, there will the eagles [51, 52] gather.[^2944]Be attentive now: for ye know not at what hour your Lord cometh.[^2945]Know this: if the master of the house had known in what watch the thief would come, he would have been attentive, and would not make it possible that his house should be [53] broken through.[^2946]Therefore be ye also ready: for in the hour that ye think not the Son of man cometh." },
  { t = "note", id = "2929", text = "Matt. xxiv. 37." },
  { t = "note", id = "2930", text = "Matt. xxiv. 38." },
  { t = "note", id = "2931", text = "Matt. xxiv. 39." },

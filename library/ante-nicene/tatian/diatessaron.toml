  { t = "note", id = "1294", text = "A misunderstanding or slavish reproduction of the Syriac. The Brit. Mus. text of Ibn-at-Tayyib’s Commentary has *of Galilee, Tiberias*." },
  { t = "p", text = "[22][^1295]And many saw them going, and knew them, and hastened by land[^1296] from all the cities, and came thither beforehand;[^1297]for they saw the signs which he was doing on the [23, 24] sick.[^1298]And Jesus went up into the mountain, and sat there with his disciples.[^1299]And [25] the feast of the passover of the Jews was near.[^1300]And Jesus lifted up his eyes, and saw great multitudes coming to him.[^1301]And he was moved with compassion for them, for [26] they were like sheep that *were* without a shepherd.[^1302]And he received them, and spake to them concerning the kingdom of God, and healed those who had need of healing." },
  { t = "note", id = "1295", text = "Mark vi. 33a." },
  { t = "note", id = "1296", text = "*cf*. Syriac versions and margin of R.V." },
  { t = "note", id = "1297", text = "John vi. 2b." },
  { t = "note", id = "1298", text = "John vi. 3." },
  { t = "note", id = "1299", text = "John vi. 4." },
  { t = "note", id = "1300", text = "John vi. 5a." },
  { t = "note", id = "1301", text = "Mark vi. 34b." },
  { t = "note", id = "1302", text = "Luke ix. 11b." },
  { t = "p", text = "[27][^1303]And when the evening approached,[^1304] his disciples came to him, and said unto [28] him,[^1305]The place is desert, and the time is past; send away the multitudes of the people,[^1306] that they may go to the towns and villages which are around us, and buy for [29] themselves bread; for they have nothing to eat.[^1307]But he said unto them, They have [30] no need to go away; give ye them what may be eaten.[^1308]They said unto him, We have not here *enough*.[^1309]He said unto Philip, Whence shall we buy bread that these may eat? [31, 32][^1310]And he said that proving him; and he knew what he was resolved to do.[^1311]Philip said [Arabic, p. 72 ] unto him, Two hundred pennyworth of bread would not suffice them after[^1312] [33] every one of them hath taken a small amount.[^1313]One of his disciples said unto [34] him (namely, Andrew the brother of Simon Cephas),[^1314]Here is a lad having five loaves [35] of barley and two fishes: but this amount, what is it for all these?[^1315]But wilt thou that we go and buy for all the people what may be eaten? for we have no more [36] than these five loaves and the two fishes.[^1316]And the grass was plentiful in that place. Jesus said unto them, Arrange all the people that they may sit down on the grass, [37] fifty people in a company.[^1317]And the disciples did so. And all the people sat down [38] by companies, by hundreds and fifties.[^1318]Then Jesus said unto them, Bring hither [39] those five loaves and the two fishes.[^1319]And when they brought him that, Jesus took the bread and the fish, and looked to heaven, and blessed, and divided, and gave to [40] his disciples to set before them;[^1320]and the disciples set for the multitudes the bread [41] and the fish; and they ate, all of them, and were satisfied.[^1321]And when they were satisfied, he said unto his disciples, Gather the fragments that remain over, that nothing [42] be lost.[^1322]And they gathered, and filled twelve baskets with fragments, being those that remained over from those which ate of the five barley loaves and the two [43] fishes.[^1323]And those people who ate were five thousand, besides the women and children. [44] [Arabic, p. 73 ][^1324]And straightway he pressed his disciples to go up into the ship, and that they should go before him unto the other side to Bethsaida, while he [45] him*self* should send away the multitudes.[^1325]And those people who saw the sign which [46] Jesus did, said, Of a truth this is a prophet who hath come into the world.[^1326]And Jesus knew their purpose to come and take him, and make him a king; and he left them, and went up into the mountain alone for prayer." },
  { t = "note", id = "1303", text = "Matt. xiv. 15a." },
  { t = "note", id = "1304", text = "Or, *came*." },
  { t = "note", id = "1305", text = "Mark vi. 36." },

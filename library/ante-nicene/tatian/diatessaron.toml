]

[[section]]
id = "section-32"
title = "Section XXXII."
level = 1
blocks = [
  { t = "p", text = "[1][^2183]And when Jesus entered Jerusalem, he went up to the temple of God, and found [2] there oxen and sheep and doves.[^2184]And when he beheld those that sold and those that bought, and the money-changers sitting,[^2185]he made for himself a scourge of rope, and drove them all out of the temple, and the sheep and the oxen, and the money-changers;[^2186]and he threw down their money, and upset their tables, and the seats of [3] them that sold the doves;[^2187]and he was teaching, and saying unto them, Is it not written, My house is a house of prayer for all peoples? and ye have made it a den [4] for robbers.[^2188]And he said unto those that sold the doves, Take this hence, and [5] make not my Father’s house a house of merchandise.[^2189]And he suffered not any [6] one to carry vessels inside the temple.[^2190]And his disciples remembered the scripture, [7] The zeal of thy house hath eaten me up.[^2191]The Jews answered and said unto him, [8] What sign hast thou shewn us, that thou doest this?[^2192]Jesus answered and said unto [9] them, Destroy this temple, and I shall raise it in three days.[^2193]The Jews said unto him, This temple was built in forty-six years, and wilt thou raise it in three days? [10][^2194]But he spake unto them of the temple of his body, that when[^2195] they destroyed it, he [11] [Arabic, p. 122 ] would raise it in three days.[^2196]When therefore he rose from among the dead, his disciples remembered that he said this; and they believed the scriptures, and the word that Jesus spake." },
  { t = "note", id = "2183", text = "Matt. xxi. 12a; John ii. 14a." },
  { t = "note", id = "2184", text = "Matt. xxi. 12b." },
  { t = "note", id = "2185", text = "John ii. 14b." },
  { t = "note", id = "2186", text = "Matt. xxi. 12c." },
  { t = "note", id = "2187", text = "Matt. xxi. 13." },
  { t = "note", id = "2188", text = "John ii. 16." },
  { t = "note", id = "2189", text = "Mark xi. 16." },
  { t = "note", id = "2190", text = "John ii. 17." },
  { t = "note", id = "2191", text = "John ii. 18." },
  { t = "note", id = "2192", text = "John ii. 19." },
  { t = "note", id = "2193", text = "John ii. 20." },
  { t = "note", id = "2194", text = "John ii. 21." },
  { t = "note", id = "2195", text = "Or, *if*." },
  { t = "note", id = "2196", text = "John ii. 22." },
  { t = "p", text = "[12][^2197]And when Jesus sat down over against the treasury, he observed how the multitudes were casting their offerings into the treasury: and many rich *men* were [13, 14] throwing in much.[^2198]And there came a poor widow, and cast in two mites.[^2199]And Jesus called his disciples, and said unto them, Verily I say unto you, This poor [15] widow cast into the treasury more than all the people:[^2200]and all of these cast into the place of the offering of God[^2201] of the superfluity of their wealth; while this *woman* of her want threw in all that she possessed." },
  { t = "note", id = "2197", text = "Mark xii. 41." },
  { t = "note", id = "2198", text = "Mark xii. 42a." },
  { t = "note", id = "2199", text = "Luke xxi. 3." },
  { t = "note", id = "2200", text = "Mark xii. 44a." },
  { t = "note", id = "2201", text = "Lit. *house of the offering of God*, as in the ms. described by Gildemeister (at Luke xxi. 4); but it is simply a reproduction of the phrase used in the Peshitta at Luke xxi. 3. The parallel passages are a good deal fused together." },
  { t = "p", text = "[16][^2202]And he spake unto them this parable, concerning people who trusted in themselves [17] that they are righteous, and despised every man:[^2203]Two men went up to the [18] temple to pray; one of them a Pharisee, and the other a publican.[^2204]And the Pharisee stood apart,[^2205] and prayed thus, O Lord, I thank thee, since I am not like the rest of men, the unjust, the profligate, the extortioners, or even like this publican; [19][^2206]but I fast two days a week, and tithe all my possessions.[^2207][^2208]And the publican was [20] standing at a distance, and he would not even lift up his eyes to heaven, but was [21] beating upon his breast, and saying, O Lord, have mercy on me, me the sinner.[^2209]I say unto you, that this man went down justified to his house more than the Pharisee. Every one that exalteth himself shall be abased; and every one that abaseth himself shall be exalted." },
  { t = "note", id = "2202", text = "Luke xviii. 9." },
  { t = "note", id = "2203", text = "Luke xviii. 10." },
  { t = "note", id = "2204", text = "Luke xviii. 11." },
  { t = "note", id = "2205", text = "Lit. *between him and himself*." },
  { t = "note", id = "2206", text = "Luke xviii. 12." },
  { t = "note", id = "2207", text = "Or, *gains*." },
  { t = "note", id = "2208", text = "Luke xviii. 13." },
  { t = "note", id = "2209", text = "Luke xviii. 14." },
  { t = "p", text = "[22] [Arabic, p. 123 ][^2210]And when eventide was come, he left all the people, and went outside the [23] city to Bethany, he and his twelve, and he remained there.[^2211]And all the people, because they knew the place, came to him, and he received them; and them that [24] had need of healing he healed.[^2212]And on the morning of the next day, when he returned [25] to the city from Bethany, he hungered.[^2213]And he saw a[^2214] fig tree at a distance on the beaten highway, having on it leaves. And he came unto it, *expecting* to find something on it; and when he came, he found nothing on it but the leaves—it[^2215] was not [26] the season of figs—[^2216]and he said unto it, Henceforward for ever let no man eat fruit of thee. And his disciples heard." },
  { t = "note", id = "2210", text = "Mark xi. 19a; Matt. xxi. 17." },
  { t = "note", id = "2211", text = "Luke ix. 11." },
  { t = "note", id = "2212", text = "Mark xi. 12." },
  { t = "note", id = "2213", text = "Mark xi. 13." },
  { t = "note", id = "2214", text = "Lit. *one* (Syriac)." },
  { t = "note", id = "2215", text = "Lit. *and it*." },
  { t = "note", id = "2216", text = "Mark xi. 14." },
  { t = "p", text = "[27][^2217]And they came to Jerusalem. And there was there a man of the Pharisees, [28] named Nicodemus, ruler of the Jews.[^2218]This *man* came unto Jesus by night, and said unto him, My Master, we know that thou hast been sent from God as a teacher; and no man can do these signs that thou doest, except him whom God is [29] with.[^2219]Jesus answered and said unto him, Verily, verily, I say unto thee, If a man [30] be not born a second *time*, he cannot see the kingdom of God.[^2220]Nicodemus said unto him, How can a man who is old be born? can he, think you, return again to [31] his mother’s womb a second time, to enter and be born?[^2221]Jesus answered and said unto him, Verily, verily, I say unto thee, If a man be not born of water and the Spirit, [32] he cannot enter the kingdom of God.[^2222]For he that is born of flesh is flesh; and he that [33] is born of Spirit is spirit.[^2223]Wonder not that I said unto thee that ye must be born a [34] [Arabic, p. 124 ] second *time*.[^2224]The wind bloweth where it listeth, and thou hearest its voice, but thou knowest not from what place it cometh, nor whither it goeth: so [35] is every man that is born of the Spirit.[^2225]Nicodemus answered and said unto him, [36] How can that be?[^2226]Jesus answered and said unto him, Art thou teaching[^2227] Israel, [37] and *yet* knowest not these things?[^2228]Verily, verily, I say unto thee, What we know [38] we say, and what we have seen we witness: and ye receive not our witness.[^2229]If I said unto you what is on earth, and ye believed not, how then, if I say unto you [39] what is in heaven, will ye believe?[^2230]And no man hath ascended up into heaven, except him that descended from heaven, the Son of man, which is in heaven. [40][^2231]And as Moses lifted up the serpent in the wilderness, so is the Son of man to be [41] lifted up;[^2232]so that every man who may believe in him may not perish, but have [42] eternal life.[^2233]God so loved the world, that[^2234] he should give his only Son; and so every one that believeth on him should not perish, but should have eternal life. [43][^2235]God sent not his Son into the world to judge the world; but that the world might [44] be saved by his hand.[^2236]He that believeth in him shall not be judged: but he that believeth not is condemned beforehand, because he hath not believed in the name [45] of the only *Son*, the Son of God.[^2237][^2238]This is the judgement, that the light came into the world, and men loved the darkness more than the light; because their deeds [46] were evil.[^2239]Whosoever doeth evil deeds hateth the light, and cometh not to the [47] light, lest his deeds be reproved.[^2240]But he that doeth the truth cometh to the light, that his deeds may be known, that they have been done in God." },
  { t = "note", id = "2217", text = "Mark xi. 15a; John iii. 1." },
  { t = "note", id = "2218", text = "John iii. 2." },
  { t = "note", id = "2219", text = "John iii. 3." },
  { t = "note", id = "2220", text = "John iii. 4." },
  { t = "note", id = "2221", text = "John iii. 5." },
  { t = "note", id = "2222", text = "John iii. 6." },
  { t = "note", id = "2223", text = "John iii. 7." },
  { t = "note", id = "2224", text = "John iii. 8." },
  { t = "note", id = "2225", text = "John iii. 9." },
  { t = "note", id = "2226", text = "John iii. 10." },
  { t = "note", id = "2227", text = "Or *the teacher of*." },
  { t = "note", id = "2228", text = "John iii. 11." },
  { t = "note", id = "2229", text = "John iii. 12." },
  { t = "note", id = "2230", text = "John iii. 13." },
  { t = "note", id = "2231", text = "John iii. 14." },
  { t = "note", id = "2232", text = "John iii. 15." },
  { t = "note", id = "2233", text = "John iii. 16." },
  { t = "note", id = "2234", text = "The Arabic particle means *in order that*. Perhaps it is a clerical error for *so that*; or it may be meant to represent the Syriac." },
  { t = "note", id = "2235", text = "John iii. 17." },
  { t = "note", id = "2236", text = "John iii. 18." },
  { t = "note", id = "2237", text = "The translator has followed too closely the order of words in his Syriac original, which agrees with the Text. Rec." },
  { t = "note", id = "2238", text = "John iii. 19." },

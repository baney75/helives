  { t = "p", text = "[40][^2289]Hear another parable: A man was a householder, and planted a vineyard, and surrounded it with a hedge, and digged in it a winepress, and built in it a tower, [41, 42][^2290]and gave it to husbandmen, and went to a distance for a long time.[^2291]So when the time of the fruits came, he sent his servants[^2292] unto the husbandmen, that they might [43] send him of the produce[^2293] of his vineyard.[^2294]And those husbandmen beat him, and [44] sent him away empty.[^2295]And he sent unto them another servant also; and they [45] stoned him, and wounded[^2296] him, and sent him away with shameful handling.[^2297]And he sent again another; and they slew him. And he sent many other servants unto [46] them.[^2298]And the husbandmen took his servants, and one they beat, and another they [47] stoned, and another they slew.[^2299]So he sent again other servants more than the first; and [48] [Arabic, p. 128 ] they did likewise with them.[^2300]So the owner of the vineyard said, What shall I do? I will send my beloved son: it may be they will see him and be [49, 50] ashamed.[^2301]So at last he sent unto them his beloved son that he had.[^2302]But the husbandmen, when they saw the son, said amongst themselves, This is the heir. [51, 52][^2303]And they said, We will slay him, and so the inheritance will be ours.[^2304]So they took [53] him, and put him forth without the vineyard, and slew him.[^2305]When then the lord [54] of the vineyard shall come, what will he do with those husbandmen?[^2306]They said unto him, He will destroy them in the worst of ways,[^2307] and give the vineyard to [55] other husbandmen, who will give him fruit in its season.[^2308]Jesus said unto them, Have ye never read in the scripture," },
  { t = "note", id = "2289", text = "Matt. xxi. 33a." },
  { t = "note", id = "2290", text = "Luke xx. 9b." },
  { t = "note", id = "2291", text = "Mark xxi. 34." },
  { t = "note", id = "2292", text = "The difference between singular and plural is very slight in Arabic." },

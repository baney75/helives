[[section]]
id = "section-19"
title = "Section XIX."
level = 1
blocks = [
  { t = "p", text = "[1][^1332]And in the fourth watch of the night Jesus came unto them, walking upon the [2][^1333]water, after they had rowed[^1334] with difficulty about twenty-five or thirty furlongs. [3][^1335]And when he drew near unto their boat, his disciples saw him walking on the water; and they were troubled, and supposed that it was a false appearance; and they cried [4] out from their fear.[^1336]But Jesus straightway spoke unto them, and said, Take courage, [5] for it is I; fear not.[^1337]Then Cephas answered and said unto him, My Lord, if it be thou, [6] bid me to come unto thee on the water.[^1338]And Jesus said unto him, Come. And [7] Cephas went down out of the boat, and walked on the water to come unto Jesus.[^1339]But [Arabic, p. 74 ] when he saw the wind strong, he feared, and was on the point of sinking; [8] and he lifted up his voice, and said, My Lord, save me.[^1340]And immediately our Lord stretched out his hand and took *hold of* him, and said unto him, [9] Thou of little faith, why didst thou doubt?[^1341]And when Jesus came near, he went up [10] unto them into the boat, he and Simon, and immediately the wind ceased.[^1342]And those that were in the ship came and worshipped him, and said, Truly thou art the [11] Son of God.[^1343]And straightway that ship arrived at the land which they made for. [12][^1344]And when they came out of the ship to the land, they marvelled greatly and were [13] perplexed in themselves:[^1345]and they had not understood by means of[^1346] that bread, because their heart was gross." },
  { t = "note", id = "1332", text = "Matt. xiv. 25." },
  { t = "note", id = "1333", text = "John vi. 19a, c." },
  { t = "note", id = "1334", text = "Lit. *travelled*." },
  { t = "note", id = "1335", text = "Matt. xiv. 26." },
  { t = "note", id = "1336", text = "Matt. xiv. 27." },
  { t = "note", id = "1337", text = "Matt. xiv. 28." },
  { t = "note", id = "1338", text = "Matt. xiv. 29." },
  { t = "note", id = "1339", text = "Matt. xiv. 30." },
  { t = "note", id = "1340", text = "Matt. xiv. 31." },
  { t = "note", id = "1341", text = "Matt. xiv. 32." },
  { t = "note", id = "1342", text = "Matt. xiv. 33." },
  { t = "note", id = "1343", text = "John vi. 21b." },
  { t = "note", id = "1344", text = "Mark vi. 54a; Mark vi. 51b." },
  { t = "note", id = "1345", text = "Mark vi. 52." },
  { t = "note", id = "1346", text = "Lit. *from*." },
  { t = "p", text = "[14][^1347]And when the people of that region knew of the arrival of Jesus, they made haste in all that land, and began to bring those that were diseased,[^1348] borne in their [15] beds to the place where they heard that he was.[^1349]And wheresoever the place *might be* which he entered, of the villages or the cities, they laid the sick in the markets, and sought of him that they might touch[^1350] were it only the edge of his garment: and all that touched[^1351] him were healed and lived.[^1352]" },
  { t = "note", id = "1347", text = "Mark vi. 54; Mark vi. 55." },
  { t = "note", id = "1348", text = "Strictly used of severe chronic disease." },
  { t = "note", id = "1349", text = "Mark vi. 56." },
  { t = "note", id = "1350", text = "*cf*. § 12, 13, and note to § 8, 17." },
  { t = "note", id = "1351", text = "The word used at § 12, 35." },
  { t = "note", id = "1352", text = "Or, *revived*, i.e., *made to live*." },
  { t = "p", text = "[16][^1353]And on the day after that, the multitude which was standing on the shore of the sea saw that there was there no other ship save that into which the disciples had [17] gone up,[^1354]and that Jesus went not up into the ship with his disciples (but there were other ships from Tiberias near[^1355] the place where they ate the bread when Jesus blessed [18] *it*):[^1356]and when that multitude saw that Jesus was not there, nor yet his disciples, they [19] [Arabic, p. 75 ] went up into those ships, and came to Capernaum, and sought Jesus.[^1357]And when they found him on the other side of the sea, they said unto him, Our [20] Master, when camest thou hither?[^1358]Jesus answered and said unto them, Verily, verily, I say unto you, Ye have not sought me because of[^1359] your seeing the signs, but because of [21] your eating the bread and being satisfied.[^1360]Serve not the food which perisheth, but the food which abideth in eternal life,[^1361] which the Son of man will give unto you: him[^1362] [22] hath God the Father sealed.[^1363]They said unto him, What shall we do that we may [23] work the work of God?[^1364]Jesus answered and said unto them, This is the work of [24] God, that ye believe in him whom he hath sent.[^1365]They said unto him, What sign hast thou done, that we may see, and believe in thee? what hast thou wrought? [25][^1366]Our fathers ate the manna in the wilderness; as it was written, Bread from heaven [26] gave he them to eat.[^1367]Jesus said unto them, Verily, verily, I say unto you, Moses gave you not bread from [27] heaven; but my Father gave[^1368] you the bread of truth[^1369] from heaven.[^1370]The bread of God is that which came down from heaven and gave the [28, 29] world life.[^1371]They said unto him, Our Lord, give us at all times this bread.[^1372]Jesus said unto them, I am the bread of life: whosoever cometh unto me shall not hunger, [30] and whosoever believeth in me shall not thirst for ever.[^1373]But I said unto you, [31] Ye have seen me, and have not believed.[^1374]And all that my Father hath given to me cometh unto me; and whosoever cometh unto me I shall not cast him forth without. [32][^1375]I came down from heaven, not to do my *own* will, but to do the will of him [33] that sent me;[^1376]and this is the will of him that sent me, that I should lose nothing of [34] [Arabic, p. 76 ] that which he gave me, but raise it up in the last day.[^1377]This is the will of my Father, that every one that seeth the Son, and believeth in him, should have eternal life; and I will raise him up in the last day." },
  { t = "note", id = "1353", text = "John vi. 22a." },
  { t = "note", id = "1354", text = "John vi. 23." },
  { t = "note", id = "1355", text = "Lit. *on the border of*." },
  { t = "note", id = "1356", text = "John vi. 24." },

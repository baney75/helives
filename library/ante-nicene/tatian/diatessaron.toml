  { t = "note", id = "1846", text = "Luke xv. 31." },
  { t = "note", id = "1847", text = "Luke xv. 32." },
  { t = "p", text = "[34][^1848]And he spake a parable unto his disciples: There was a rich man, and he had [35] a steward; and he was accused to him that he had squandered his property.[^1849]So his lord called him, and said unto him, What is this that I hear regarding thee? Give me the account of thy stewardship; for it is now impossible that thou shouldest [36] be a steward for me.[^1850]The steward said within himself, What shall I do, seeing that my lord taketh from me the stewardship? To dig I am not able; and to beg[^1851] I [37] am ashamed.[^1852]I know what I will do, that, when I go out of the stewardship, they [38] may receive me into their houses.[^1853]And he called one after another of his lord’s [39] debtors, and said to the first, How much owest thou my lord?[^1854]He said unto him, An hundred portions[^1855] of oil. He said unto him, Take thy writing, and sit down, and write [40] quickly fifty portions.[^1856][^1857]And he said to the next, And thou, how much owest thou my lord? He said unto him, An hundred cors of wheat. He said unto him, Take [41] [Arabic, p. 103 ] thy writing, and sit down, and write eighty cors.[^1858]And our[^1859] lord commended the sinful steward[^1860] because he had done a wise deed; for the children [42] of this world are wiser than the children of the light in this their age.[^1861]And I also say unto you, Make unto yourselves friends with the wealth of this unrighteousness;[^1862] [43] so that, when it is exhausted, they may receive you into their tents for ever.[^1863]He who is faithful in[^1864] a little is faithful also in much: and he who is unrighteous in a [44] little is unrighteous also in much.[^1865]If then in the wealth of unrighteousness ye were [45] not trustworthy, who will intrust you with the truth?[^1866][^1867]If ye are not found faithful in what does not belong to you, who will give you what belongeth to you?" },
  { t = "note", id = "1848", text = "Luke xvi. 1." },
  { t = "note", id = "1849", text = "Luke xvi. 2." },
  { t = "note", id = "1850", text = "Luke xvi. 3." },
  { t = "note", id = "1851", text = "Vat. ms. (followed by Ciasca’s text) has *and if I beg*, by a common confusion of grammatical forms." },

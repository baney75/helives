  { t = "note", id = "1363", text = "John vi. 28." },
  { t = "note", id = "1364", text = "John vi. 29." },
  { t = "note", id = "1365", text = "John vi. 30." },
  { t = "note", id = "1366", text = "John vi. 31." },
  { t = "note", id = "1367", text = "John vi. 32." },
  { t = "note", id = "1368", text = "Represents a mistaken vocalisation of the Peshitta." },
  { t = "note", id = "1369", text = "Lit. *equity*; see above, § 3, 53, note." },
  { t = "note", id = "1370", text = "John vi. 33." },
  { t = "note", id = "1371", text = "John vi. 34." },
  { t = "note", id = "1372", text = "John vi. 35." },
  { t = "note", id = "1373", text = "John vi. 36." },
  { t = "note", id = "1374", text = "John vi. 37." },
  { t = "note", id = "1375", text = "John vi. 38." },
  { t = "note", id = "1376", text = "John vi. 39." },
  { t = "note", id = "1377", text = "John vi. 40." },
  { t = "p", text = "[35][^1378]The Jews therefore murmured against him because of his saying, I am the bread [36] which came down from heaven.[^1379]And they said, Is not this Jesus, the son of Joseph, whose father and mother we know? then how saith this *man*, I came down from [37, 38] heaven?[^1380]Jesus answered and said unto them, Murmur not one with another.[^1381]No man is able to come unto me, except the Father which sent me draw him; and I will [39] raise him up in the last day.[^1382]It is written in the prophet, They shall all be the taught of God. Every one who heareth from the Father now,[^1383] and learneth of him, cometh [40] unto me.[^1384]No man now seeth the Father; but he that is from God, he it is that seeth [41] the Father.[^1385]Verily, verily, I say unto you, Whosoever believeth in me hath eternal [42, 43] life.[^1386]I am the bread of life.[^1387]Your fathers ate the manna in the wilderness, and [44] they died.[^1388]This is the bread which came down from heaven, that a man may eat [45] of it, and not die.[^1389]I am the bread of life which came down from heaven: and if a man eat of this bread he shall live for ever:[^1390]and the bread which I shall give is my body, which I give for the life of the world." },
  { t = "note", id = "1378", text = "John vi. 41." },
  { t = "note", id = "1379", text = "John vi. 42." },
  { t = "note", id = "1380", text = "John vi. 43." },
  { t = "note", id = "1381", text = "John vi. 44." },
  { t = "note", id = "1382", text = "John vi. 45." },
  { t = "note", id = "1383", text = "i.e., *therefore* (see note, § 9, 21)." },
  { t = "note", id = "1384", text = "John vi. 46." },
  { t = "note", id = "1385", text = "John vi. 47." },
  { t = "note", id = "1386", text = "John vi. 48." },
  { t = "note", id = "1387", text = "John vi. 49." },
  { t = "note", id = "1388", text = "John vi. 50." },
  { t = "note", id = "1389", text = "John vi. 51." },
  { t = "note", id = "1390", text = "John vi. 51b; in Ciasca’s text John vi. 51b–71 are cited as vi. 52–72. (See Introduction, 20, note.)" },
  { t = "p", text = "[46][^1391]The Jews therefore quarrelled one with another, and said, How can he give us [47] [Arabic, p. 77 ] his body that we may eat it?[^1392]Jesus said unto them, Verily, verily, I say unto you, If ye do not eat the body of the Son of man and drink his blood, ye shall [48] not have life in yourselves.[^1393]Whosoever eateth of my body and drinketh of my blood [49] hath eternal life; and I will raise him up in the last day.[^1394]My body truly is meat,[^1395] and [50] my blood truly is drink.[^1396][^1397]Whosoever eateth my body and drinketh my blood abideth [51] in me, and I in him—[^1398]as the living Father sent me, and I am alive because of the [52] Father; and whosoever eateth me, he also shall live because of me.[^1399]This is the bread which came down from heaven: and not according as your fathers ate the [53] manna, and died: whosoever eateth of this bread shall live for ever.[^1400]This he said in [54] the synagogue, when he was teaching in Capernaum.[^1401]And many of his disciples, when they heard, said, This word is hard; who is he that can hear it?" },
  { t = "note", id = "1391", text = "John vi. 52." },
  { t = "note", id = "1392", text = "John vi. 53." },
  { t = "note", id = "1393", text = "John vi. 54." },
  { t = "note", id = "1394", text = "John vi. 55." },
  { t = "note", id = "1395", text = "Or, *eaten*." },
  { t = "note", id = "1396", text = "Or, *drunk*." },
  { t = "note", id = "1397", text = "John vi. 56." },
  { t = "note", id = "1398", text = "John vi. 57." },
  { t = "note", id = "1399", text = "John vi. 58." },
  { t = "note", id = "1400", text = "John vi. 59." },
  { t = "note", id = "1401", text = "John vi. 60." },
]

[[section]]
id = "section-20"
title = "Section XX."
level = 1
blocks = [
  { t = "p", text = "[1][^1402]And Jesus knew within himself that his disciples were murmuring because of [2] that, and he said unto them, Doth this trouble you?[^1403]*What* if ye should see the Son [3] of man then ascend to the place where he was of old?[^1404]It is the spirit that quickeneth, and the body profiteth nothing: the words[^1405] that I speak unto you are spirit [4] and life.[^1406]But there are some of you that do not believe. And Jesus knew beforehand who they were who should[^1407] not believe, and who it was that should betray [5] him.[^1408]And he said unto them, Therefore I said unto you, No man can come unto me, if that hath not been given him by the Father." },
  { t = "note", id = "1402", text = "John vi. 61." },
  { t = "note", id = "1403", text = "John vi. 62." },
  { t = "note", id = "1404", text = "John vi. 63." },
  { t = "note", id = "1405", text = "Lit. *speech*." },
  { t = "note", id = "1406", text = "John vi. 64." },
  { t = "note", id = "1407", text = "Or, *did*." },
  { t = "note", id = "1408", text = "John vi. 65." },
  { t = "p", text = "[6] [Arabic, p. 78 ][^1409]And because of this word many of his disciples turned back and walked [7] not with him.[^1410]And Jesus said unto the twelve, Do ye haply also wish to [8] go away?[^1411]Simon Cephas answered and said, My Lord, to whom shall we go? thou [9] hast the words of eternal life.[^1412]And we have believed and known that thou art the [10] Messiah, the Son of the living God.[^1413]Jesus said unto them, Did not I choose you, [11] ye company of the twelve, and of you one is a devil?[^1414]He said that because of Judas the son of Simon Iscariot; for he, being of the twelve, was purposed to[^1415] betray him." },
  { t = "note", id = "1409", text = "John vi. 66." },
  { t = "note", id = "1410", text = "John vi. 67." },
  { t = "note", id = "1411", text = "John vi. 68." },
  { t = "note", id = "1412", text = "John vi. 69." },
  { t = "note", id = "1413", text = "John vi. 70." },
  { t = "note", id = "1414", text = "John vi. 71." },
  { t = "note", id = "1415", text = "Or, *was to*." },
  { t = "p", text = "[12][^1416]And while he was speaking, one of the Pharisees came asking of him that he [13] would eat with him: and he went in, and reclined *to meat*.[^1417]And that Pharisee, when [14] he saw it,[^1418] marvelled that he had not first cleansed himself before his eating.[^1419]Jesus said unto him, Now do ye Pharisees wash the outside of the cup and the dish, and ye think that ye are cleansed; but your inside is full of injustice and wickedness." },
  { t = "note", id = "1416", text = "Luke xi. 37." },
  { t = "note", id = "1417", text = "Luke xi. 38." },
  { t = "note", id = "1418", text = "Or, *him.*" },
  { t = "note", id = "1419", text = "Luke xi. 39." },
  { t = "p", text = "[15, 16][^1420]Ye of little mind, did not he that made the outside make the inside?[^1421]Now give what ye have[^1422] in alms, and everything *shall be* clean unto you." },
  { t = "note", id = "1420", text = "Luke xi. 40." },
  { t = "note", id = "1421", text = "Luke xi. 41." },
  { t = "note", id = "1422", text = "*cf*. Peshitta." },
  { t = "p", text = "[17, 18][^1423]And there came to him Pharisees and scribes, come from Jerusalem.[^1424]And when they saw some of his disciples eating bread while they had not washed their hands, [19] they found fault.[^1425]For all of the Jews and the Pharisees, if they wash not their [20] hands thoroughly, eat not; for they held[^1426] to the ordinance[^1427] of the elders.[^1428]And they ate not what was bought from the market, except they washed it; and many other things did they keep of what they had received, such as the washing of cups, and [21] measures, and vessels of brass, and couches.[^1429]And scribes[^1430] and Pharisees asked him, [Arabic, p. 79 ] Why do thy disciples not walk according to the ordinances of the elders, but [22] eat bread without washing their hands?[^1431]Jesus answered and said unto them, Why do ye also overstep the command of God by reason of your ordinance? [23][^1432]God said, Honour thy father and thy mother; and, Whosoever revileth his father and [24] his mother shall surely die.[^1433]But ye say, If a man say to his father or to his mother, [25] What thou receivest[^1434] from me is an offering,—[^1435]and ye[^1436] suffer him not to do anything [26] for his father or his mother;[^1437]and ye[^1438] make void and reject the word of God by reason of the ordinance that ye have ordained and commanded, such as the washing [27] of cups and measures, and what resembles that ye do much.[^1439]And ye forsook [28] the command of God, and held to the ordinance of men.[^1440]Do[^1441] ye well to wrong[^1442] [29] the command of God in order that ye may establish your ordinance?[^1443]Ye hypocrites, well did Isaiah the prophet prophesy concerning you, and say," },
  { t = "note", id = "1423", text = "Mark vii. 1." },
  { t = "note", id = "1424", text = "Mark vii. 2." },
  { t = "note", id = "1425", text = "Mark vii. 3." },
  { t = "note", id = "1426", text = "i.e., *were holding*." },
  { t = "note", id = "1427", text = "Or, *custom, tradition*; and so wherever the word occurs." },
  { t = "note", id = "1428", text = "Mark vii. 4." },
  { t = "note", id = "1429", text = "Mark vii. 5." },
  { t = "note", id = "1430", text = "*Sic*." },
  { t = "note", id = "1431", text = "Matt. xv. 3." },
  { t = "note", id = "1432", text = "Matt. xv. 4a; Mark vii. 10b." },
  { t = "note", id = "1433", text = "Mark vii. 11." },
  { t = "note", id = "1434", text = "The printed Arabic text has *he receiveth* and *they*, resulting from a misplacement of diacritical points by an Arabic copyist." },
  { t = "note", id = "1435", text = "Mark vii. 12." },
  { t = "note", id = "1436", text = "The printed Arabic text has *he receiveth* and *they*, resulting from a misplacement of diacritical points by an Arabic copyist." },
  { t = "note", id = "1437", text = "Mark vii. 13." },
  { t = "note", id = "1438", text = "The printed Arabic text has *he receiveth* and *they*, resulting from a misplacement of diacritical points by an Arabic copyist." },
  { t = "note", id = "1439", text = "Mark vii. 8." },
  { t = "note", id = "1440", text = "Mark vii. 9." },
  { t = "note", id = "1441", text = "Here begins verse 9 in Greek." },
  { t = "note", id = "1442", text = "The Syriac word for *injure* also means *reject, deny*." },
  { t = "note", id = "1443", text = "Matt. xv. 7." },
  { t = "p", text = "[30][^1444]This people honoureth me with its[^1445] lips;" },
  { t = "note", id = "1444", text = "Matt. xv. 8." },
  { t = "note", id = "1445", text = "*Sic*." },
  { t = "p", text = "But their heart is very far from me." },
  { t = "p", text = "[31][^1446]But in vain do they fear me," },
  { t = "note", id = "1446", text = "Matt. xv. 9." },
  { t = "p", text = "In that they teach the commands of men." },
  { t = "p", text = "[32][^1447]And Jesus called all the multitude, and said unto them, Hear me, all of you, and [33] understand:[^1448]nothing without the man, which then enters him, is able to defile him; [34] but what goeth out of him, that it is which defileth the man.[^1449]He that hath ears [35] that hear, let him hear.[^1450]Then his disciples drew near, and said unto him, Knowest [36] thou that the Pharisees which heard this word were angry?[^1451]He answered and said unto them, Every plant which my Father which is in heaven planted not shall be [37] [Arabic, p. 80 ] uprooted.[^1452]Let them alone; for they are blind leading blind. And if the blind lead[^1453] the blind, both of them shall fall into a hollow." },
  { t = "note", id = "1447", text = "Mark vii. 14." },
  { t = "note", id = "1448", text = "Mark vii. 15." },
  { t = "note", id = "1449", text = "Mark vii. 16." },
  { t = "note", id = "1450", text = "Matt. xv. 12." },
  { t = "note", id = "1451", text = "Matt. xv. 13." },
  { t = "note", id = "1452", text = "Matt. xv. 14." },
  { t = "note", id = "1453", text = "The Arabic word is here used with a Syriac meaning." },
  { t = "p", text = "[38][^1454]And when Jesus entered the house from the multitude, Simon Cephas asked him, [39] and said unto him, My Lord, explain to us that parable.[^1455]He said unto them, Do ye also thus not understand? Know ye not that everything that entereth into the [40] man from without cannot defile him;[^1456]because it entereth not into his heart; it entereth into his stomach only, and thence is cast forth in the cleansing which maketh [41] clean all the food?[^1457][^1458]The thing which goeth forth from the mouth of the man proceedeth [42] from his heart, and it is that which defileth the man.[^1459]From within[^1460] the [43] heart of men proceed evil thoughts,[^1461]fornication, adultery, theft, false witness, murder, injustice, wickedness, deceit, stupidity, evil eye, calumny, pride, foolishness: [44][^1462]these evils all of them from within proceed from the heart, and they are *the things* [45] which defile the man:[^1463]but if a man eat while he washeth not his hands, he is not defiled." },
  { t = "note", id = "1454", text = "Mark vii. 17a; Matt. xv. 15." },
  { t = "note", id = "1455", text = "Mark vii. 18b." },
  { t = "note", id = "1456", text = "Mark vii. 19." },
  { t = "note", id = "1457", text = "This clause in the Peshitta is not very clear, and the Arabic version fails to get from it the meaning of the Greek." },
  { t = "note", id = "1458", text = "Matt. xv. 18." },
  { t = "note", id = "1459", text = "Mark vii. 21." },
  { t = "note", id = "1460", text = "Or, *From within, from*." },
  { t = "note", id = "1461", text = "Mark vii. 22." },
  { t = "note", id = "1462", text = "Mark vii. 23." },
  { t = "note", id = "1463", text = "Matt. xv. 20b." },
  { t = "p", text = "[46][^1464]And Jesus went out thence, and came to the borders of Tyre and Sidon. And he entered into a certain house, and desired that no man should know it;[^1465] and [47] he could not be hid.[^1466]But straightway a Canaanitish woman, whose daughter had an [48, 49] unclean spirit, heard of him.[^1467]And that woman was a Gentile of Emesa of Syria.[^1468]And she came out after him, crying out, and saying, Have mercy upon me, my Lord, *thou* [50] son of David; for my daughter is seized in an evil way by Satan.[^1469][^1470]And he answered [Arabic, p. 81 ] her not a word. And his disciples came and besought him, and said, Send [51] her away: for she crieth after us.[^1471]He answered and said unto them, I was [52] not sent except to the sheep that are gone astray of the house of Israel.[^1472]But she came and worshipped him, and said, My Lord, help me, have mercy upon me." },
  { t = "note", id = "1464", text = "Matt. xv. 21a; Mark vii. 24b." },
  { t = "note", id = "1465", text = "Or, *about him*." },
  { t = "note", id = "1466", text = "Mark vii. 25a." },
  { t = "note", id = "1467", text = "Mark vii. 26a." },
  { t = "note", id = "1468", text = "Matt. xv. 22b." },
  { t = "note", id = "1469", text = "Or, *the devil*." },
  { t = "note", id = "1470", text = "Matt. xv. 23." },
  { t = "note", id = "1471", text = "Matt. xv. 24." },
  { t = "note", id = "1472", text = "Matt. xv. 25." },
  { t = "p", text = "[53][^1473]Jesus said unto her, It is not seemly that the children’s bread should be taken and [54] thrown to the dogs.[^1474]But she said, Yea, my Lord: the dogs also eat of the crumbs [55] that fall from their masters’ tables, and live.[^1475]Then said Jesus unto her, O woman, [56] great is thy faith: it shall be unto thee as thou hast desired.[^1476]Go then *thy way;* and [57] because of this word, the devil is gone out of thy daughter.[^1477]And her daughter was [58] healed in that hour.[^1478]And that woman went away to her house, and found her daughter laid upon the bed, and the devil gone out of her." },
  { t = "note", id = "1473", text = "Matt. xv. 26." },
  { t = "note", id = "1474", text = "Matt. xv. 27." },
  { t = "note", id = "1475", text = "Matt. xv. 28a." },
  { t = "note", id = "1476", text = "Mark vii. 29b." },
  { t = "note", id = "1477", text = "Matt. xv. 28b." },
  { t = "note", id = "1478", text = "Mark vii. 30." },
]

[[section]]
id = "section-21"
title = "Section XXI."
level = 1
blocks = [
  { t = "p", text = "[1][^1479]And Jesus went out again from the border*s* of Tyre and Sidon, and came to the [2] sea of Galilee, towards the borders of Decapolis.[^1480]And they brought unto him one dumb and deaf, and entreated him that he would lay his hand upon him and heal [3] him.[^1481]And he drew him away from the multitude, and went away alone, and spat [4] upon his fingers, and thrust *them* into his ears, and touched his tongue;[^1482]and looked [5] to heaven, and sighed, and said unto him, Be opened.[^1483]And in that hour his ears [6] were opened, and the bond of his tongue was loosed, and he spake with ease.[^1484]And Jesus charged them much that they should not tell this to any man: but the more [7] he charged them, *the more* they increased in publishing, and marvelled much,[^1485]and [Arabic, p. 82 ] said, This *man* doeth everything well: he made the deaf to hear, and those that lacked speech to speak." },
  { t = "note", id = "1479", text = "Mark vii. 31." },
  { t = "note", id = "1480", text = "Mark vii. 32." },
  { t = "note", id = "1481", text = "Mark vii. 33." },
  { t = "note", id = "1482", text = "Mark vii. 34." },
  { t = "note", id = "1483", text = "Mark vii. 35." },
  { t = "note", id = "1484", text = "Mark vii. 36." },
  { t = "note", id = "1485", text = "Mark vii. 37." },
  { t = "p", text = "[8, 9][^1486]And while he was passing through the land of Samaria,[^1487]he came to one of the cities of the Samaritans, called Sychar, beside the field which Jacob gave to Joseph to [10] his son.[^1488]And there was there a spring of water of Jacob’s. And Jesus was fatigued from the exertion of the way, and sat at the spring. And the time was about the [11] sixth hour.[^1489][^1490]And a woman of Samaria came to draw water; and Jesus said unto [12] her, Give me water, that I may drink.[^1491]And his disciples had entered into the city [13] to buy for themselves food.[^1492]And that Samaritan woman said unto him, How dost thou, being a Jew, ask me to give thee to drink, while I am a Samaritan woman? [14][^1493](And the Jews mingle not with the Samaritans.[^1494]) Jesus answered and said unto her, If thou knewest the gift of God, and who this is that said unto thee, Give me [15] to drink; thou wouldest ask him, and he would give thee the water of life.[^1495]That woman said unto him, My Lord, thou hast no bucket, and the well is deep: from [16] whence hast thou the water of life?[^1496]Can it be that thou art greater than our father Jacob, who gave us this well, and drank from it, and his children, and his sheep? [17][^1497]Jesus answered and said unto her, Every one that drinketh of this water shall thirst [18] again:[^1498]but whosoever drinketh of the water which I shall give him shall not thirst for ever: but the water which I shall give him shall be in him a spring of water springing [19] up unto eternal life.[^1499]That woman said unto him, My Lord, give me of this water, that [20] I may not thirst again, neither come and draw water from here.[^1500]Jesus said unto her, [21] [Arabic, p. 83 ] Go and call thy husband, and come hither.[^1501]She said unto him, I have no [22] husband.[^1502]Jesus said unto her, Thou saidst well, I have no husband: five husbands hast thou had, and this *man* whom thou hast now is not thy husband; and [23] in this thou saidst truly.[^1503]That woman said unto him, My Lord, I perceive thee to [24] be a prophet.[^1504]Our fathers worshipped in this mountain; and ye say that in Jerusalem [25] is the place in which worship must be.[^1505]Jesus said unto her, Woman, believe me, an hour cometh, when neither in this mountain, nor yet in Jerusalem, shall ye worship [26] the Father.[^1506]Ye worship that which ye know not: but we worship that which [27] we know: for salvation is of the Jews.[^1507]But an hour cometh, and now is, when the true worshippers shall worship the Father in spirit and truth: and the Father also [28] seeketh such as these worshippers.[^1508]For God is a Spirit: and they that worship him [29] must worship him in spirit and in truth.[^1509]That woman said unto him, I know that [30] the Messiah cometh:[^1510]and when he is come, he will teach us everything. Jesus said unto her, I that speak unto thee am he." },
  { t = "note", id = "1486", text = "John iv. 4." },
  { t = "note", id = "1487", text = "John iv. 5." },
  { t = "note", id = "1488", text = "John iv. 6." },
  { t = "note", id = "1489", text = "Lit. *six hours* (*cf*. Syr.)." },
  { t = "note", id = "1490", text = "John iv. 7." },
  { t = "note", id = "1491", text = "John iv. 8." },
  { t = "note", id = "1492", text = "John iv. 9." },
  { t = "note", id = "1493", text = "John iv. 10." },
  { t = "note", id = "1494", text = "For the form *cf*. below, § 34, 40." },
  { t = "note", id = "1495", text = "John iv. 11." },
  { t = "note", id = "1496", text = "John iv. 12." },
  { t = "note", id = "1497", text = "John iv. 13." },
  { t = "note", id = "1498", text = "John iv. 14." },
  { t = "note", id = "1499", text = "John iv. 15." },
  { t = "note", id = "1500", text = "John iv. 16." },
  { t = "note", id = "1501", text = "John iv. 17." },
  { t = "note", id = "1502", text = "John iv. 18." },
  { t = "note", id = "1503", text = "John iv. 19." },
  { t = "note", id = "1504", text = "John iv. 20." },
  { t = "note", id = "1505", text = "John iv. 21." },
  { t = "note", id = "1506", text = "John iv. 22." },
  { t = "note", id = "1507", text = "John iv. 23." },
  { t = "note", id = "1508", text = "John iv. 24." },
  { t = "note", id = "1509", text = "John iv. 25." },
  { t = "note", id = "1510", text = "John iv. 26." },
  { t = "p", text = "[31][^1511]And while he was speaking, his disciples came; and they wondered how he would speak[^1512] with a woman; but not one of them said unto him, What seekest thou? or, [32] What[^1513] speakest thou with her?[^1514]And the woman left her waterpot, and went to the [33] city, and said to the people,[^1515]Come, and see a man who told me all that *ever* I did: [34] perhaps then he is the Messiah.[^1516]And people went out from the city, and came to [35] him.[^1517]And in the mean while his disciples besought him, and said unto him, Our [36, 37] master, eat.[^1518]And he said unto them, I have food to eat that ye know not.[^1519]And the disciples said amongst themselves, Can any one have brought him aught to eat?[^1520] [38][^1521]Jesus said unto them, My food is to do the will of him that sent me, and to accomplish [39] [Arabic, p. 84 ] his work.[^1522]Said ye not that after four months cometh the harvest? behold, I therefore say unto you, Lift up your eyes, and behold the lands, [40] that they have become white, and the harvest is already come.[^1523][^1524]And he that reapeth receiveth his wages, and gathereth the fruit of eternal life;[^1525] and the sower and [41] the reaper rejoice together.[^1526]For in this is found the word of truth, One soweth, and [42] another reapeth.[^1527]And I sent you to reap that in which ye have not laboured: others laboured, and ye have entered on their labour." },
  { t = "note", id = "1511", text = "John iv. 27." },
  { t = "note", id = "1512", text = "Or, *was speaking*." },
  { t = "note", id = "1513", text = "But see note to § 7, 38." },
  { t = "note", id = "1514", text = "John iv. 28." },
  { t = "note", id = "1515", text = "John iv. 29." },
  { t = "note", id = "1516", text = "John iv. 30." },
  { t = "note", id = "1517", text = "John iv. 31." },
  { t = "note", id = "1518", text = "John iv. 32." },
  { t = "note", id = "1519", text = "John iv. 33." },
  { t = "note", id = "1520", text = "The text is uncertain." },
  { t = "note", id = "1521", text = "John iv. 34." },
  { t = "note", id = "1522", text = "John iv. 35." },
  { t = "note", id = "1523", text = "Or, *come beforehand*." },
  { t = "note", id = "1524", text = "John iv. 36." },
  { t = "note", id = "1525", text = "So in the Arabic, contrary to the usual practice of this writer (*cf*. § 6, 19)." },
  { t = "note", id = "1526", text = "John iv. 37." },
  { t = "note", id = "1527", text = "John iv. 38." },
  { t = "p", text = "[43][^1528]And from that city many of the Samaritans believed in him because of the words [44] of that woman, who testified and said, He told me all that *ever* I did.[^1529]And when those Samaritans came unto him, they besought him to abide with them; and he [45, 46] abode with them two days.[^1530]And many believed in him because of his word;[^1531]and they said to that woman, Now not because of thy saying have we believed in him: we have heard and known that this truly is the Messiah, the Saviour of the world." },
  { t = "note", id = "1528", text = "John iv. 39." },
  { t = "note", id = "1529", text = "John iv. 40." },
  { t = "note", id = "1530", text = "John iv. 41." },
  { t = "note", id = "1531", text = "John iv. 42." },
  { t = "p", text = "[47, 48][^1532]And after two days Jesus went out thence and departed to Galilee.[^1533]And Jesus [49] testified that a prophet is not honoured in his own city.[^1534]And when he came to Galilee, the Galilæans received him." },
  { t = "note", id = "1532", text = "John iv. 43." },
  { t = "note", id = "1533", text = "John iv. 44." },
  { t = "note", id = "1534", text = "John iv. 45a." },
]

[[section]]
id = "section-22"
title = "Section XXII."
level = 1
blocks = [
  { t = "p", text = "[1][^1535]And when Jesus came to a certain village, there drew near to him a leper, and fell at his feet, and besought him, and said unto him, If thou wilt, thou art able to [2] cleanse me.[^1536]And Jesus had mercy upon him, and stretched forth his hand, and [3] touched him, and said, I will cleanse[^1537] thee.[^1538]And immediately his leprosy departed [4] from him, and he was cleansed.[^1539]And he sternly charged him, and sent him out, [5] [Arabic, p. 85 ] and said unto him,[^1540]See that thou tell *not* any man: but go and shew thyself to the priests, and offer an offering for thy cleansing as Moses commanded [6] for their testimony.[^1541]But he, when he went out, began to publish much, and spread abroad the news, so that Jesus could not enter into any of the cities openly, for the extent to which the report of him spread, but he remained without in a desert [7] place.[^1542]And much people came unto him from one place and another,[^1543] to hear [8] his word, and that they might be healed of their pains.[^1544]And he used to withdraw from them into the desert, and pray." },
  { t = "note", id = "1535", text = "Luke v. 12." },
  { t = "note", id = "1536", text = "Mark i. 41." },
  { t = "note", id = "1537", text = "Lit. *to cleanse*." },
  { t = "note", id = "1538", text = "Mark i. 42." },
  { t = "note", id = "1539", text = "Mark i. 43." },
  { t = "note", id = "1540", text = "Mark i. 44." },
  { t = "note", id = "1541", text = "Mark i. 45a." },
  { t = "note", id = "1542", text = "Luke v. 15." },
  { t = "note", id = "1543", text = "This phrase does not occur in the Syriac versions (Cur. wanting), but is obviously a Syriac construction." },
  { t = "note", id = "1544", text = "Luke v. 16." },
  { t = "p", text = "[9][^1545]And after that, was the feast of the Jews; and Jesus went up to Jerusalem." },
  { t = "note", id = "1545", text = "John v. 1." },
  { t = "p", text = "[10][^1546]And there was in Jerusalem a place prepared for bathing,[^1547] which was called in [11] Hebrew the House of Mercy, having five porches.[^1548]And there were laid in them much people of the sick, and blind, and lame, and paralysed, waiting for the moving [12] of the water.[^1549]And the angel from time to time went down into the place of bathing,[^1550] and moved the water; and the first that went down after the moving [13] of the water, every pain that he had was healed.[^1551]And a man was there who had a [14] disease for thirty-eight years.[^1552]And Jesus saw this *man* laid, and knew[^1553] that he had [15] been thus a long time; and he said unto him, Wouldest thou be made whole?[^1554]That diseased one answered and said, Yea, my Lord, I have no man, when the water moveth, to put me into the bathing-place; but when I come, another goeth down before [16, 17] me.[^1555]Jesus said unto him, Rise, take thy bed, and walk.[^1556]And immediately that man was healed; and he rose, and carried his bed, and walked." },
  { t = "note", id = "1546", text = "John v. 2." },
  { t = "note", id = "1547", text = "Or, *baptism*. The phrase almost exactly reproduces the Syriac versions." },
  { t = "note", id = "1548", text = "John v. 3." },
  { t = "note", id = "1549", text = "John v. 4." },
  { t = "note", id = "1550", text = "Or, *baptism*. The phrase almost exactly reproduces the Syriac versions." },
  { t = "note", id = "1551", text = "John v. 5." },
  { t = "note", id = "1552", text = "John v. 6." },
  { t = "note", id = "1553", text = "Or, *learned*." },
  { t = "note", id = "1554", text = "John v. 7." },
  { t = "note", id = "1555", text = "John v. 8." },
  { t = "note", id = "1556", text = "John v. 9." },
  { t = "p", text = "[18][^1557]And that day was a sabbath. And when the Jews saw that healed one, they[^1558] said [19] unto him, It is a sabbath: thou hast no authority to carry thy bed.[^1559]And he answered and said unto them, He that made me whole, the same said unto me, Take thy bed, [20] [Arabic, p. 86 ] and walk.[^1560]They asked him therefore, Who is this man that said unto thee, [21] Take thy bed, and walk?[^1561]But he that was healed knew not who it was; for Jesus had removed from that place to another, because of the press of the great multitude [22] which was in that place.[^1562]And after two days Jesus happened upon him in the temple, and said unto him, Behold, thou art whole: sin not again, lest there come upon [23] thee what is worse than the first.[^1563]And that man went, and said to the Jews that it [24] was Jesus that had healed him.[^1564]And because of that the Jews persecuted Jesus and [25] sought to kill him, because he was doing this on the sabbath.[^1565]And Jesus said unto [26] them, My Father worketh until now, and I also work.[^1566]And because of this especially the Jews sought to kill him, not because he profaned the sabbath only; but for his saying also that God was his Father, and his making himself equal with God. [27][^1567]Jesus answered and said unto them, Verily, verily, I say unto you, The Son cannot do anything of himself, but what he seeth the Father do; what the Father doeth, [28] that the Son also doeth like him.[^1568]The Father loveth his Son, and everything that he doeth he sheweth him: and more than these works will he shew him, that ye [29] may marvel.[^1569]And as the Father raiseth the dead and giveth them life, so the Son [30] also giveth life to whomsoever he will.[^1570]And the Father judgeth no man, but hath [31] given all judgement unto the Son;[^1571]that every man may honour the Son, as he honoureth the Father. And he that honoureth not the Son honoureth not the Father which [32] sent him.[^1572]Verily, verily, I say unto you, Whosoever heareth my word, and believeth in him that sent me, hath eternal life, and cometh not into judgement, but passeth from [33] [Arabic, p. 87 ] death unto life.[^1573]Verily, verily, I say unto you, An hour shall come, and now is also, when the dead shall hear the voice of the Son of God; and those [34] which hear shall live.[^1574]And as the Father hath life in himself,[^1575] likewise he gave to [35] the Son also that he might have life in himself,[^1576][^1577]and authority to do judgement also, [36] because[^1578] he is the Son of man.[^1579]Marvel not then at that: I mean the coming of the hour when all that are in the tombs shall hear his voice, and shall come forth: [37][^1580]those that have done good, to the resurrection of life; and those that have done evil *deeds*, to the resurrection of judgement." },
  { t = "note", id = "1557", text = "John v. 10." },
  { t = "note", id = "1558", text = "Vat. ms. has *he*." },
  { t = "note", id = "1559", text = "John v. 11." },
  { t = "note", id = "1560", text = "John v. 12." },
  { t = "note", id = "1561", text = "John v. 13." },
  { t = "note", id = "1562", text = "John v. 14." },
  { t = "note", id = "1563", text = "John v. 15." },
  { t = "note", id = "1564", text = "John v. 16." },
  { t = "note", id = "1565", text = "John v. 17." },
  { t = "note", id = "1566", text = "John v. 18." },
  { t = "note", id = "1567", text = "John v. 19." },
  { t = "note", id = "1568", text = "John v. 20." },
  { t = "note", id = "1569", text = "John v. 21." },
  { t = "note", id = "1570", text = "John v. 22." },
  { t = "note", id = "1571", text = "John v. 23." },
  { t = "note", id = "1572", text = "John v. 24." },
  { t = "note", id = "1573", text = "John v. 25." },
  { t = "note", id = "1574", text = "John v. 26." },
  { t = "note", id = "1575", text = "Borg. ms. reads *his person*." },
  { t = "note", id = "1576", text = "Borg. ms. reads *his person*." },
  { t = "note", id = "1577", text = "John v. 27." },
  { t = "note", id = "1578", text = "Lit. *that*; or, *Verily*." },
  { t = "note", id = "1579", text = "John v. 28." },
  { t = "note", id = "1580", text = "John v. 29." },
  { t = "p", text = "[38][^1581]I am not able of myself to do anything; but as I hear, I judge: and my judgement [39] is just; I seek not my *own* will, but the will of him that sent me.[^1582]I[^1583] bear witness [40] of myself, and so[^1584] my witness is not true.[^1585]It is another that beareth witness [41] of me; and I know that the witness which he beareth of me is true.[^1586]Ye have sent [42] unto John, and he hath borne witness of the truth.[^1587]But not from man do I seek [43] witness; but I say that ye may live.[^1588][^1589]That[^1590] was a lamp which shineth and [44] giveth light: and ye were pleased to glory now[^1591] in his light.[^1592]But I have witness greater than that of John: the works which my Father hath given me to accomplish, [45] those works which I do, bear witness of me, that the Father hath sent me.[^1593]And the Father which sent me, he hath borne witness of me. Ye have neither heard his [46] voice at any time, nor seen his appearance.[^1594]And his word abideth not in you; because [47] in him whom he hath sent ye do not believe.[^1595]Search the scriptures, in which ye rejoice[^1596] [48] that ye have eternal life;[^1597]and they bear witness of me; and ye do not wish to come to [49, 50] [Arabic, p. 88 ] me, that ye may have eternal life.[^1598]I seek not praise of men.[^1599]But I know [51] you, that the love of God is not in you.[^1600]I am come in the name of my Father, and ye received me not; but if another come in his own name, that *one* will [52] ye receive.[^1601]And how can ye believe, while ye receive praise one from another, and [53] praise from God, the One, ye seek not?[^1602]Can it be that ye think that I will accuse you before the Father? Ye have one that accuseth you, Moses, in whom ye have [54] rejoiced.[^1603][^1604]If ye believed Moses, ye would believe me also; Moses wrote of me. [55][^1605]And if ye believed not his writings, how shall ye believe my words?" },
  { t = "note", id = "1581", text = "John v. 30." },
  { t = "note", id = "1582", text = "John v. 31." },
  { t = "note", id = "1583", text = "So Ciasca’s Arabic text. Borg. ms. has *If I*, and instead of *and so, etc*., simply *a witness which is not true, etc.;* but its text of the next sentence is quite corrupt." },
  { t = "note", id = "1584", text = "So Ciasca’s Arabic text. Borg. ms. has *If I*, and instead of *and so, etc*., simply *a witness which is not true, etc*.; but its text of the next sentence is quite corrupt." },
  { t = "note", id = "1585", text = "John v. 32." },
  { t = "note", id = "1586", text = "John v. 33." },
  { t = "note", id = "1587", text = "John v. 34." },
  { t = "note", id = "1588", text = "Or, *be saved*." },
  { t = "note", id = "1589", text = "John v. 35." },
  { t = "note", id = "1590", text = "Or, *that (man)*." },
  { t = "note", id = "1591", text = "Were it not also in Ibn-at-Tayyib’s Commentary (Brit. Mus. text) we should assume *now* to be a corruption of an original Arabic reading, *for a season* (*cf*. Syr.)." },
  { t = "note", id = "1592", text = "John v. 36." },
  { t = "note", id = "1593", text = "John v. 37." },
  { t = "note", id = "1594", text = "John v. 38." },
  { t = "note", id = "1595", text = "John v. 39." },
  { t = "note", id = "1596", text = "This word (often used by our translator) means in Syriac (transposed) *believe, think, hope* (*cf*. § 8, 8, note)." },
  { t = "note", id = "1597", text = "John v. 40." },
  { t = "note", id = "1598", text = "John v. 41." },

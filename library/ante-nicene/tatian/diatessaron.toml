[[section]]
id = "section-34"
title = "Section XXXIV."
level = 1
blocks = [
  { t = "p", text = "[1][^2315]Then went the Pharisees and considered how they might ensnare him in a word, [2] and deliver him into the power of the judge,[^2316] and into the power of the ruler.[^2317]And they sent unto him their disciples, with the kinsfolk of Herod; and they said unto him, [Arabic, p. 129 ] Teacher, we know that thou speakest the truth, and teachest the way of God with equity,[^2318] and art not lifted up[^2319] by any man: for thou actest not so as to [3] be seen of any man.[^2320]Tell us now, What is thy opinion? Is it lawful that we should [4] pay the tribute to Cæsar, or not? shall we give, or shall we not give?[^2321]But Jesus knew [5] their deceit, and said unto them,[^2322]Why tempt ye me, ye hypocrites? Shew me the [6] penny of the tribute.[^2323]So they brought unto him a penny. Jesus said unto them, To whom belongeth this image and inscription? They said unto him, To Cæsar. [7, 8][^2324]He said unto them, Give what is Cæsar’s to Cæsar, and what is God’s to God.[^2325]And they could not make him slip in a *single* word before the people; and they marvelled at his word, and refrained." },
  { t = "note", id = "2315", text = "Matt. xxii. 15; Luke xx. 20b." },
  { t = "note", id = "2316", text = "Vat. ms. omits *the power*. We should then translate (with Pesh. and Sin.) *unto judgement*." },
  { t = "note", id = "2317", text = "Matt. xxii. 16." },
  { t = "note", id = "2318", text = "See note, § 3, 53." },
  { t = "note", id = "2319", text = "Possibly this is the meaning of the Arabic phrase, which occurs also in Ibn-at-Tayyib’s Commentary (Brit. Mus. text)." },
  { t = "note", id = "2320", text = "Matt. xxii. 17." },
  { t = "note", id = "2321", text = "Mark xii. 15a." },
  { t = "note", id = "2322", text = "Matt. xxii. 18b; Matt. xxii. 19." },
  { t = "note", id = "2323", text = "Matt. xxii. 20." },
  { t = "note", id = "2324", text = "Matt. xxii. 21." },
  { t = "note", id = "2325", text = "Luke xx. 26." },
  { t = "p", text = "[9][^2326]And on that day came the Sadducees, and said unto him,[^2327] There is no life for [10] the dead.[^2328]And they asked him, and said unto him, Teacher, Moses said unto us, If a man die, not having children, let his brother take his wife, and raise up seed [11] for his brother.[^2329]Now there *were* with us seven brethren: and the first took a wife, [12] and died without children;[^2330]and the second took his wife, and died without children; [13][^2331]and the third also took her; and in like manner the seven of them also, and they [14, 15] died without leaving children.[^2332]And last of them all the woman died also.[^2333]At the resurrection, then, which of these seven shall have this woman? for all of them took [16] her.[^2334]Jesus answered and said unto them, Is it not for this that ye have erred, [17] because ye know not the scriptures, nor the power of God?[^2335]And the sons of this [18] world take wives, and the women become the men’s;[^2336][^2337]but those that have become worthy of that world, and the resurrection from among the dead, do[^2338] not take [19] [Arabic, p. 130 ] wives, and the women also do[^2339] not become the men’s.[^2340]Nor is it possible that they should die; but they[^2341] are like the angels, and are the children of [20] God, because they have become the children of the resurrection.[^2342]For in[^2343] the resurrection of the dead, have ye not read in the book of Moses, how from the bush God said unto him, I am the God of Abraham, and the God of Isaac, and the God of Jacob? [21][^2344]And God is not *the God* of the dead, but of the living: for all of them are alive with him. And ye have erred greatly." },
  { t = "note", id = "2326", text = "Matt. xxii. 23." },
  { t = "note", id = "2327", text = "*cf*. the Syriac versions." },
  { t = "note", id = "2328", text = "Matt. xxii. 24." },
  { t = "note", id = "2329", text = "Matt. xxii. 25; Luke xx. 29b." },
  { t = "note", id = "2330", text = "Luke xx. 30." },
  { t = "note", id = "2331", text = "Luke xx. 31." },
  { t = "note", id = "2332", text = "Matt. xxii. 27." },
  { t = "note", id = "2333", text = "Matt. xxii. 28." },
  { t = "note", id = "2334", text = "Matt. xxii. 29a; Mark xii. 24b." },
  { t = "note", id = "2335", text = "Luke xx. 34b." },
  { t = "note", id = "2336", text = "*cf*. the Syriac versions." },
  { t = "note", id = "2337", text = "Luke xx. 35." },
  { t = "note", id = "2338", text = "Or, *shall*." },
  { t = "note", id = "2339", text = "Or, *shall*." },
  { t = "note", id = "2340", text = "Luke xx. 36." },
  { t = "note", id = "2341", text = "Borg. ms., *all of them* instead of *but they*." },
  { t = "note", id = "2342", text = "Matt. xxii. 30a; Mark xii. 26b." },
  { t = "note", id = "2343", text = "Or, *Moreover, regarding*." },
  { t = "note", id = "2344", text = "Luke xx. 38; Mark xii. 27b." },
  { t = "p", text = "[22, 23][^2345]And when the multitudes heard, they were wondering at his teaching.[^2346]And [24] some of the scribes answered and said unto him, Teacher, thou hast well said.[^2347]But the rest of the Pharisees, when they saw his silencing the Sadducees on this point, gathered against him to contend with him." },
  { t = "note", id = "2345", text = "Matt. xxii. 33." },
  { t = "note", id = "2346", text = "Luke xx. 39." },
  { t = "note", id = "2347", text = "Matt. xxii. 34." },
  { t = "p", text = "[25][^2348]And one of the scribes, of those that knew the law, when he saw the excellence [26] of his answer to them, desired to try him, and said unto him,[^2349]What shall I do to inherit eternal life? and,[^2350]Which of the commandments is greater, and has precedence [27] in the law?[^2351]Jesus said unto him, The first of all the commandments is, Hear, O [28] Israel; The Lord our God, the Lord is one:[^2352]and thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy thought, and with all thy [29, 30] strength.[^2353]This is the great and preëminent[^2354] commandment.[^2355]And the second, which is like it, is, Thou shalt love thy neighbour as thyself. And another commandment [31] greater than these two there is not.[^2356]On these two commandments, then, are hung the [32] [Arabic, p. 131 ] law and the prophets.[^2357]That scribe said unto him, Excellent! my Master;[^2358] thou hast said truly that he is one, and there is no other outside of him: [33][^2359]and that a man should love him with all his heart, and with all his thought, and with all his soul, and with all his strength, and that he should love his neighbour as [34] himself, is better than all savours and sacrifices.[^2360]And Jesus saw him that he had answered wisely; and he answered and said unto him, Thou art not far from the [35, 36] kingdom of God.[^2361]Thou hast spoken rightly: do this, and thou shalt live.[^2362]And he, as his desire was to justify himself, said unto him, And who is my neighbour? [37][^2363]Jesus said unto him, A man went down from Jerusalem to Jericho; and the robbers fell upon him, and stripped[^2364] him, and beat him, his life remaining in him *but* little,[^2365] [38] and went away.[^2366]And it happened that there came down a certain priest that way; [39] and he saw him, and passed by.[^2367]And likewise a Levite also came and reached [40] that place, and saw him, and passed by.[^2368]And a certain Samaritan, as he journeyed, [41] came to[^2369] the place where he was, and saw him, and had compassion on him,[^2370]and came near, and bound up his strokes,[^2371] and poured on them wine and oil; and he set[^2372] him on the ass, and brought him to the inn, and expended his care upon him. [42][^2373]And on the morrow of that day he took out two pence, and gave them to the innkeeper, and said unto him, Care for him; and if thou spendest upon him more, [43] when I return, I shall give thee.[^2374]Who of these three now, thinkest thou, is nearest [44] to him that fell among the robbers?[^2375]And he said unto him, He that had compassion [45] [Arabic, p. 132 ] on him.[^2376]Jesus said unto him, Go, and do thou also likewise. And no man dared afterwards to ask him anything." },
  { t = "note", id = "2348", text = "Matt. xxii. 35a; Mark xii. 28b." },
  { t = "note", id = "2349", text = "Luke x. 25b." },
  { t = "note", id = "2350", text = "Mark xii. 28b." },
  { t = "note", id = "2351", text = "Mark xii. 29." },
  { t = "note", id = "2352", text = "Mark xii. 30a; Matt. xxii. 37b [rather, Mark xii. 30b.]." },
  { t = "note", id = "2353", text = "Matt. xxii. 38." },
  { t = "note", id = "2354", text = "This simply represents *first* in Syriac." },
  { t = "note", id = "2355", text = "Mark xii. 31." },
  { t = "note", id = "2356", text = "Matt. xxii. 40." },
  { t = "note", id = "2357", text = "Mark xii. 32." },
  { t = "note", id = "2358", text = "Vat. ms. has a corruption of *Excellent! Rabbi,* better preserved by Borg. ms., which, however, adds our translator’s ordinary rendering of *Rabbi—my Master*. This explanation is confirmed by Ibn-at-Tayyib’s Commentary. Ciasca’s emended text cannot be right." },
  { t = "note", id = "2359", text = "Mark xii. 33." },
  { t = "note", id = "2360", text = "Mark xii. 34a." },
  { t = "note", id = "2361", text = "Luke x. 28b." },
  { t = "note", id = "2362", text = "Luke x. 29." },
  { t = "note", id = "2363", text = "Luke x. 30." },
  { t = "note", id = "2364", text = "The diacritical point over the third radical must be removed." },
  { t = "note", id = "2365", text = "*cf*. Peshitta." },
  { t = "note", id = "2366", text = "Luke x. 31." },
  { t = "note", id = "2367", text = "Luke x. 32." },
  { t = "note", id = "2368", text = "Luke x. 33." },
  { t = "note", id = "2369", text = "Ciasca’s Arabic text (apparently following Borg. ms.) has *till he* before *came*. This is unsupported by any of the three Syriac texts, although they differ from one another. Perhaps *till* and *came* should be transposed. The translation would then be as given in the text above; but this rendering may also be obtained according to § 54, 1, note." },
  { t = "note", id = "2370", text = "Luke x. 34." },
  { t = "note", id = "2371", text = "The Syriac word used means both *wounds* and *strokes*." },
  { t = "note", id = "2372", text = "The Arabic word is a favourite of the translator’s, and may therefore be original. One cannot help thinking, however, that it is a clerical error for *mounted* (*cf*. Cur. and Sin.)." },
  { t = "note", id = "2373", text = "Luke x. 35." },
  { t = "note", id = "2374", text = "Luke x. 36." },
  { t = "note", id = "2375", text = "Luke x. 37." },
  { t = "note", id = "2376", text = "Mark xii. 34b." },
  { t = "p", text = "[46][^2377]And he was teaching every day in the temple. But the chief priests and scribes and the elders of the people sought to destroy him:[^2378]and they could[^2379] not *find* what [47] they should do with him; and all the people were hanging upon him to hear him. [48][^2380]And many of the multitude believed on him, and said, The Messiah, when he [49] cometh, can it be that he will do more than these signs that this *man* doeth?[^2381]And the Pharisees heard the multitudes say that of him; and the chief priests sent [50] officers[^2382] to seize him.[^2383]And Jesus said unto them, I am with you *but* a short time [51] yet, and I go to him that sent me.[^2384]And ye shall seek me, and shall not find me: [52] and where I shall be, ye shall not be able to come.[^2385]The Jews said within themselves, Whither hath this *man* determined to go that we shall not be able[^2386] *to find* him? can it be that he is determined to go to the regions of the nations,[^2387] and teach [53] the heathen?[^2388]What is this word that he said, Ye shall seek me, and shall not find me: and where I am, ye cannot come?" },
  { t = "note", id = "2377", text = "Luke xix. 47." },
  { t = "note", id = "2378", text = "Luke xix. 48." },
  { t = "note", id = "2379", text = "In Syriac *could* and *found* are represented by the same word. The Arabic translator has chosen the wrong one." },
  { t = "note", id = "2380", text = "John vii. 31." },
  { t = "note", id = "2381", text = "John vii. 32." },
  { t = "note", id = "2382", text = "See note, § 11, 11." },
  { t = "note", id = "2383", text = "John vii. 33." },
  { t = "note", id = "2384", text = "John vii. 34." },
  { t = "note", id = "2385", text = "John vii. 35." },
  { t = "note", id = "2386", text = "See note above, on § 34, 46." },
  { t = "note", id = "2387", text = "i.e., Gentiles." },
  { t = "note", id = "2388", text = "John vii. 36." },
]

[[section]]
id = "section-35"
title = "Section XXXV."
level = 1
blocks = [
  { t = "p", text = "[1][^2389]And on the great day, which is the last of the feast, Jesus stood, crying out and [2] saying, If *any* man is thirsty, let him come unto me, and drink.[^2390]Every one that believeth in me, as the scriptures said, there shall flow from his belly rivers of pure [3] water.[^2391]He said that referring to the Spirit, which those who believed in him were to receive: for the Spirit was not yet granted; and because Jesus had not yet been [4] [Arabic, p. 133 ] glorified.[^2392]And many of the multitude that heard his words said, This is [5] in truth the prophet.[^2393]And others said, This is the Messiah. But others [6] said, Can it be that the Messiah will come from Galilee?[^2394]Hath not the scripture said that from the seed of David, and from Bethlehem, the village of David, the [7] Messiah cometh?[^2395]And there occurred a dissension in the multitude because of him. [8][^2396]And some of them were wishing to seize him; but no man laid a hand upon him." },
  { t = "note", id = "2389", text = "John vii. 37." },
  { t = "note", id = "2390", text = "John vii. 38." },
  { t = "note", id = "2391", text = "John vii. 39." },
  { t = "note", id = "2392", text = "John vii. 40." },
  { t = "note", id = "2393", text = "John vii. 41." },
  { t = "note", id = "2394", text = "John vii. 42." },
  { t = "note", id = "2395", text = "John vii. 43." },
  { t = "note", id = "2396", text = "John vii. 44." },
  { t = "p", text = "[9][^2397]And those officers came to the chief priests and Pharisees: and the priests said [10] unto them, Why did ye not bring him?[^2398]The officers said, Never spake man thus [11] as speaketh this man.[^2399]The Pharisees said unto them, Perhaps ye also have gone [12, 13] astray?[^2400]Hath any of the rulers or the Pharisees haply believed in him?[^2401]except [14] this people which knows not the law; they are accursed.[^2402]Nicodemus, one of them, [15] he that had come to Jesus by night,[^2403]said unto them, Doth our law haply condemn [16] a man, except it hear him first and know what he hath done?[^2404]They answered and said unto him, Art thou also haply from Galilee? Search, and see that a prophet riseth not from Galilee." },
  { t = "note", id = "2397", text = "John vii. 45." },
  { t = "note", id = "2398", text = "John vii. 46." },
  { t = "note", id = "2399", text = "John vii. 47." },
  { t = "note", id = "2400", text = "John vii. 48." },
  { t = "note", id = "2401", text = "John vii. 49." },
  { t = "note", id = "2402", text = "John vii. 50." },
  { t = "note", id = "2403", text = "John vii. 51." },
  { t = "note", id = "2404", text = "John vii. 52." },
  { t = "p", text = "[17, 18][^2405]And when the Pharisees assembled, Jesus asked them, and said,[^2406]What say ye of [19] the Messiah? whose son is he? They said unto him, The son of David.[^2407]He said unto them, And how doth David in the Holy Spirit call him Lord? for he said," },
  { t = "note", id = "2405", text = "Matt. xxii. 41." },
  { t = "note", id = "2406", text = "Matt. xxii. 42." },
  { t = "note", id = "2407", text = "Matt. xxii. 43." },
  { t = "p", text = "[20][^2408]The Lord said unto my Lord," },
  { t = "note", id = "2408", text = "Matt. xxii. 44." },
  { t = "p", text = "Sit on my right hand," },
  { t = "p", text = "That I may put thine enemies under thy feet." },
  { t = "p", text = "[21, 22][^2409]If then David calleth him Lord, how is he his son?[^2410]And no one was able to answer him; and no man dared from that day again to ask him of anything." },
  { t = "note", id = "2409", text = "Matt. xxii. 45." },
  { t = "note", id = "2410", text = "Matt. xxii. 46." },
  { t = "p", text = "[23][^2411]And Jesus addressed them again, and said, I am the light of the world; and he that [24] followeth me shall not walk in darkness, but shall find the light of life.[^2412]The Pharisees [Arabic, p. 134 ] said unto him, Thou bearest witness to thyself; thy witness is not true.[^2413]Jesus [25] answered and said unto them, If I bear witness to myself, my witness is true; for I know whence I came, and whither I go; but ye know not whence I came, or [26, 27] whither I go.[^2414]And ye judge after the flesh; and I judge no man.[^2415]And even if I judge, my judgement is true; because I am not alone, but I and my Father which [28, 29] sent me.[^2416]And in your law it is written, that the witness of two men is true.[^2417]I am he that beareth witness to myself, and my Father which sent me beareth witness to [30] me.[^2418]They said unto him, Where is thy Father? Jesus answered and said unto them, Ye know not me, nor my Father: for did ye know me, ye would know my [31] Father.[^2419]He said these sayings in the treasury, where he was teaching in the [32] temple:[^2420]and no man seized him; because his hour had not yet come. Jesus said unto them again, I go truly, and ye shall seek me and not find me, and ye shall die [33] in your sins: and where I go, ye cannot come.[^2421]The Jews said, Will he haply kill [34] himself, that he saith, Where I go, ye cannot come?[^2422]He said unto them, Ye are from below; and I am from above: ye are of this world; and I am not of this [35] world.[^2423]I said unto you, that ye shall die in your sins: if ye believe not that I am [36] he, ye shall die in your sins.[^2424]The Jews said, And thou, who art thou? Jesus said [37] unto them, If I should begin to speak unto you,[^2425]I have concerning you many words and judgement: but he that sent me is true; and I, what I heard from him is what [38, 39] I say in the world.[^2426]And they knew not that he meant by that the Father.[^2427]Jesus [Arabic, p. 135 ] said unto them again, When ye have lifted up the Son of man, then ye shall know that I am he: and I do nothing of myself, but as my Father [40] taught me, so I speak.[^2428]And he that sent me is with me; and my Father hath not [41] left me alone; because I do what is pleasing to him at all times.[^2429]And while he was saying that, many believed in him." },
  { t = "note", id = "2411", text = "John viii. 12." },
  { t = "note", id = "2412", text = "John viii. 13." },
  { t = "note", id = "2413", text = "John viii. 14." },
  { t = "note", id = "2414", text = "John viii. 15." },
  { t = "note", id = "2415", text = "John viii. 16." },
  { t = "note", id = "2416", text = "John viii. 17." },
  { t = "note", id = "2417", text = "John viii. 18." },
  { t = "note", id = "2418", text = "John viii. 19." },
  { t = "note", id = "2419", text = "John viii. 20." },
  { t = "note", id = "2420", text = "John viii. 21." },
  { t = "note", id = "2421", text = "John viii. 22." },
  { t = "note", id = "2422", text = "John viii. 23." },
  { t = "note", id = "2423", text = "John viii. 24." },
  { t = "note", id = "2424", text = "John viii. 25." },
  { t = "note", id = "2425", text = "John viii. 26." },
  { t = "note", id = "2426", text = "John viii. 27." },
  { t = "note", id = "2427", text = "John viii. 28." },
  { t = "note", id = "2428", text = "John viii. 29." },
  { t = "note", id = "2429", text = "John viii. 30." },
  { t = "p", text = "[42][^2430]And Jesus said to those Jews that believed in him, If ye abide in my words, truly [43] ye are my disciples;[^2431]and ye shall know the truth, and the truth shall make you free. [44][^2432]They said unto him, We are the seed of Abraham, and have never served any man [45] in the way of slavery: how then sayest thou, Ye shall be free children?[^2433]Jesus said unto them, Verily, verily, I say unto you, Every one that doeth a sin is a slave of [46] sin.[^2434]And the slave doth not remain for ever in the house; but the son remaineth [47, 48] for ever.[^2435]And if the Son set you free, truly ye shall be free children. I know that ye are the seed of Abraham; but ye seek to slay me, because ye are unable for my [49] word.[^2436]And what I saw with my Father, I say: and what ye saw with your father, [50] ye do.[^2437]They answered and said unto him, Our father is Abraham. Jesus said unto them, If ye were the children of Abraham, ye would do the deeds of Abraham. [51][^2438]Now, behold, ye seek to kill me, a man that speak[^2439] with you[^2440] the truth, that I [52] heard from God: this did Abraham not do.[^2441]And ye do the deeds of your father. They said unto him, We were not *born* of fornication;[^2442] we have one Father, who is [53] God.[^2443]Jesus said unto them, If God were your Father, ye would love me: I proceeded and came[^2444] from God; and it was not of my own self that I came,[^2445] but he sent [54] [Arabic, p. 136 ] me.[^2446]Why then do ye not know my word? Because ye cannot hear my word. [55][^2447]Ye are from the father, the devil,[^2448] and the lust of your father do ye desire to do, who from the beginning is a slayer of men, and in the truth standeth not, because the truth is not in him. And when he speaketh untruth, he speaketh from [56] himself: for he is a liar, and the father of untruth.[^2449]And I who speak the truth, ye [57] believe me not.[^2450]Who of you rebuketh me for a sin? And if I speak the truth, ye [58] do not believe me.[^2451][^2452]Whosoever is of God heareth the words of God: therefore do [59] ye not hear, because ye are not of God.[^2453]The Jews answered and said unto him, [60] Did we not say well that thou art a Samaritan, and hast demons?[^2454]Jesus said unto them, As for me, I have not a devil; but my Father do I honour, and ye dishonour [61] me.[^2455]I seek not my glory: here is one who seeketh and judgeth." },
  { t = "note", id = "2430", text = "John viii. 31." },
  { t = "note", id = "2431", text = "John viii. 32." },
  { t = "note", id = "2432", text = "John viii. 33." },
  { t = "note", id = "2433", text = "John viii. 34." },
  { t = "note", id = "2434", text = "John viii. 35." },
  { t = "note", id = "2435", text = "John viii. 37." },
  { t = "note", id = "2436", text = "John viii. 38." },
  { t = "note", id = "2437", text = "John viii. 39." },
  { t = "note", id = "2438", text = "John viii. 40." },
  { t = "note", id = "2439", text = "Lit. *speaketh*, according to Arabic idiom." },
  { t = "note", id = "2440", text = "Borg. ms. omits *with you*." },
  { t = "note", id = "2441", text = "John viii. 41." },
  { t = "note", id = "2442", text = "Borg. ms. has *an adulteress*, mistaking the less common Arabic word for a clerical error." },
  { t = "note", id = "2443", text = "John viii. 42." },
  { t = "note", id = "2444", text = "Different words are used in the Arabic; so in the Greek, but not in the Peshitta. Sin. and Cur. are wanting." },
  { t = "note", id = "2445", text = "Different words are used in the Arabic; so in the Greek, but not in the Peshitta. Sin. and Cur. are wanting." },
  { t = "note", id = "2446", text = "John viii. 43." },
  { t = "note", id = "2447", text = "John viii. 44." },
  { t = "note", id = "2448", text = "Lit. *backbiter*." },
  { t = "note", id = "2449", text = "John viii. 45." },
  { t = "note", id = "2450", text = "John viii. 46." },
  { t = "note", id = "2451", text = "This is probably simply a clerical error for the ordinary reading, *why have ye not believed me?* The Arabic words *why* and *not* having the same consonants, one of them was purposely or accidentally omitted by a copyist." },
  { t = "note", id = "2452", text = "John viii. 47." },
  { t = "note", id = "2453", text = "John viii. 48." },
  { t = "note", id = "2454", text = "John viii. 49." },
  { t = "note", id = "2455", text = "John viii. 50." },
]

[[section]]
id = "section-36"
title = "Section XXXVI."
level = 1
blocks = [
  { t = "p", text = "[1][^2456]Verily, verily, I say unto you, Whosoever keepeth my word shall not see death [2] for ever.[^2457]The Jews said unto him, Now we know that thou hast demons. Abraham is dead, and the prophets; and thou sayest, Whosoever keepeth my word shall not [3] taste death for ever.[^2458]Art thou haply greater than our father Abraham, who is [4] dead, and than the prophets, which are dead? whom makest thou thyself?[^2459]Jesus said unto them, If I glorify myself, my glory is nothing: my Father is he that [5] glorifieth me; *of* whom ye say, that he is our[^2460] God;[^2461]and *yet* ye have not known him: but I know him; and if I should say that I know him not, I should become [6] [Arabic, p. 137 ] a liar like you: but I know him, and keep his word.[^2462]Abraham your father [7] longed to see my day; and he saw, and rejoiced.[^2463]The Jews said unto him, [8] Thou art now not fifty years old, and hast thou seen Abraham?[^2464]Jesus said unto [9] them, Verily, verily, I say unto you, Before Abraham was, I am.[^2465]And they take[^2466] stones to stone him:[^2467]but Jesus concealed himself, and went out of the temple. And he passed through them, and went *his way*." },
  { t = "note", id = "2456", text = "John viii. 51." },
  { t = "note", id = "2457", text = "John viii. 52." },
  { t = "note", id = "2458", text = "John viii. 53." },
  { t = "note", id = "2459", text = "John viii. 54." },
  { t = "note", id = "2460", text = "*cf*. Peshitta. The Sinaitic omits *our*." },
  { t = "note", id = "2461", text = "John viii. 55." },
  { t = "note", id = "2462", text = "John viii. 56." },
  { t = "note", id = "2463", text = "John viii. 57." },
  { t = "note", id = "2464", text = "John viii. 58." },
  { t = "note", id = "2465", text = "John viii. 59." },
  { t = "note", id = "2466", text = "The Vat. ms. has *took him*, probably omitting *stones*, though Ciasca does not say so. *Take* is probably a copyist’s error (change in diacritical paints) for *took*." },
  { t = "note", id = "2467", text = "John viii. 60 [reckoned to verse 59 in the Greek.]." },
  { t = "p", text = "[10][^2468]And as he passed, he saw a man blind from his mother’s womb.[^2469]And his [11] disciples asked him, and said, Our Master, who sinned, this *man*, or his parents, so [12] that he was born blind?[^2470][^2471]Jesus said unto them, Neither did he sin, nor his parents: [13] but that the works of God may be seen in him.[^2472][^2473]It is incumbent on me to do the deeds of him that sent me, while it is day: a night will come, and no man will be [14] able to busy himself.[^2474]As long as I am in the world, I am the light of the world. [15][^2475]And when he said that, he spat upon the ground, and made clay of his spittle, and [16] smeared *it* on the eyes of the blind man, and said unto him,[^2476]Go and wash thyself in [17] the pool[^2477] of Siloam.[^2478][^2479]And he went and washed, and came seeing. And his neighbours, which saw him of old begging, said, Is not this he that was sitting begging? [18][^2480]And some said, It is he; and others said, Nay, but he resembles him much. He [19, 20] said, I am he.[^2481]They said unto him, How then were thine eyes opened?[^2482]He answered and said unto them, A man named Jesus made clay, and smeared *it* on my eyes, and said unto me, Go and wash in the water of Siloam: and I went and [21] washed, and received sight.[^2483][^2484]They said unto him, Where is he? He said, I know not. [22, 23] [Arabic, p. 138 ][^2485]And they brought him that was previously blind to the Pharisees.[^2486]And the day in which Jesus made clay and opened with it his eyes was a sabbath [24] day.[^2487]And again the Pharisees asked him, How didst thou receive sight? And he said [25] unto them, He put clay on mine eyes, and I washed, and received sight.[^2488]The people[^2489] of the Pharisees said, This man is not from God, for he keepeth not the sabbath. And others said, How can a man *that is* a sinner do these signs? And there came [26] to be a division amongst them.[^2490]And again they said to that blind man, Thou, then, what sayest thou of him that opened for thee thine eyes? He said unto them, [27] I say that he is a prophet.[^2491]And the Jews did not believe concerning him, that he was blind, and received sight, until they summoned the parents of him who received [28] sight, and asked them,[^2492]Is this[^2493] your son, *of* whom ye said that he was born blind? [29] how then, behold, doth he now see?[^2494]His parents answered and said, We know [30] that this is our son, and that he was born blind:[^2495]but how he has come to see now, or who it is that opened his eyes, we know not: and he also has reached his prime; [31] ask him, and he will speak for himself.[^2496]This said his parents, because they were fearing the Jews: and the Jews decided, that if any man should confess of him that [32] he was the Messiah, they would put him out of the synagogue.[^2497]For this reason [33] said his parents, He hath reached his prime; ask him.[^2498]And they called the man a second time, him that was blind, and said unto him, Praise God: we know that this [34] man is a sinner.[^2499]He answered and said unto them, Whether he be a sinner, I know [35] not: I know one thing, that I was blind, and I now see.[^2500]They said unto him again, [36] [Arabic, p. 139 ] What did he unto thee? how opened he for thee thine eyes?[^2501]He said unto them, I said unto you, and ye did not hear: what[^2502] wish ye further to hear? [37] ye also, do ye wish to become disciples to him?[^2503]And they reviled him, and said unto him, Thou art the disciple[^2504] of that *man*; but as for us, we are the disciples of [38] Moses.[^2505]And we know that God spake unto Moses: but this man, we know not [39] whence he is.[^2506]The man answered and said unto them, From this is the wonder, [40] because ye know not whence he is, and mine eyes hath he opened.[^2507]And we know that God heareth not the voice of sinners: but whosoever feareth him, and doeth [41] his will, him he heareth.[^2508]From eternity hath it not been heard of, that a man [42] opened the eyes of a blind *man*, who had been born in blindness.[^2509]If then this *man* [43] were not from God, he could not do that.[^2510]They answered and said unto him, Thou wast all of thee born in sins, and dost thou teach us? And they put him forth without." },
  { t = "note", id = "2468", text = "John ix. 1." },
  { t = "note", id = "2469", text = "John ix. 2." },
  { t = "note", id = "2470", text = "A different word in Arabic from that used in verses 1 and 6." },
  { t = "note", id = "2471", text = "John ix. 3." },
  { t = "note", id = "2472", text = "The Vat. ms. has *that we may see the works of God in him*. By the addition of a diacritical point this would give the same sense as in the text above, and more grammatically." },
  { t = "note", id = "2473", text = "John ix. 4." },
  { t = "note", id = "2474", text = "John ix. 5." },
  { t = "note", id = "2475", text = "John ix. 6." },
  { t = "note", id = "2476", text = "John ix. 7." },
  { t = "note", id = "2477", text = "The Arabic word properly means *baptism*. The Syriac has both meanings." },
  { t = "note", id = "2478", text = "Lit. *Shiloha*, as in Syriac." },
  { t = "note", id = "2479", text = "John ix. 8." },
  { t = "note", id = "2480", text = "John ix. 9." },
  { t = "note", id = "2481", text = "John ix. 10." },
  { t = "note", id = "2482", text = "John ix. 11." },
  { t = "note", id = "2483", text = "Lit. *saw*." },
  { t = "note", id = "2484", text = "John ix. 12." },
  { t = "note", id = "2485", text = "John ix. 13." },
  { t = "note", id = "2486", text = "John ix. 14." },
  { t = "note", id = "2487", text = "John ix. 15." },
  { t = "note", id = "2488", text = "John ix. 16." },
  { t = "note", id = "2489", text = "An easy clerical error for *Some*." },
  { t = "note", id = "2490", text = "John ix. 17." },
  { t = "note", id = "2491", text = "John ix. 18." },
  { t = "note", id = "2492", text = "John ix. 19." },
  { t = "note", id = "2493", text = "Lit. *them, whether this be*." },
  { t = "note", id = "2494", text = "John ix. 20." },
  { t = "note", id = "2495", text = "John ix. 21." },
  { t = "note", id = "2496", text = "John ix. 22." },
  { t = "note", id = "2497", text = "John ix. 23." },
  { t = "note", id = "2498", text = "John ix. 24." },
  { t = "note", id = "2499", text = "John ix. 25." },
  { t = "note", id = "2500", text = "John ix. 26." },
  { t = "note", id = "2501", text = "John ix. 27." },
  { t = "note", id = "2502", text = "Or, *why* (*cf*. note, § 7, 38)." },
  { t = "note", id = "2503", text = "John ix. 28." },
  { t = "note", id = "2504", text = "*Disciples* is probably simply a misprint in Ciasca’s text." },
  { t = "note", id = "2505", text = "John ix. 29." },
  { t = "note", id = "2506", text = "John ix. 30." },
  { t = "note", id = "2507", text = "John ix. 31." },
  { t = "note", id = "2508", text = "John ix. 32." },
  { t = "note", id = "2509", text = "John ix. 33." },
  { t = "note", id = "2510", text = "John ix. 34." },
  { t = "p", text = "[44][^2511]And Jesus heard of his being put forth without, and found him, and said unto [45] him, Dost thou believe in the Son of God?[^2512]He that was made whole answered [46] and said, Who is he, my Lord, that I may believe in him?[^2513]Jesus said unto him, [47] Thou hast seen him, and he that speaketh to thee is he.[^2514]And he said, I believe, my Lord. And he fell down worshipping him." },
  { t = "note", id = "2511", text = "John ix. 35." },
  { t = "note", id = "2512", text = "John ix. 36." },
  { t = "note", id = "2513", text = "John ix. 37." },
  { t = "note", id = "2514", text = "John ix. 38." },
]

[[section]]
id = "section-37"
title = "Section XXXVII."
level = 1
blocks = [
  { t = "p", text = "[1][^2515]And Jesus said, To judge the world am I come, so that they that see not may [2] see, and they that see may become blind.[^2516]And some of the Pharisees which were [3] with him heard that, and they said unto him, Can it be that we are blind?[^2517]Jesus said unto them, If ye were blind, ye should not have sin: but now ye say, We see: and because of this your sin remaineth.[^2518]" },
  { t = "note", id = "2515", text = "John ix. 39." },
  { t = "note", id = "2516", text = "John ix. 40." },
  { t = "note", id = "2517", text = "John ix. 41." },
  { t = "note", id = "2518", text = "Or, *is permanent*." },
  { t = "p", text = "[4] [Arabic, p. 140 ][^2519]Verily, verily, I say unto you, Whosoever entereth not into the fold of the sheep by the door, but goeth up from another place, that *man* is a thief and a [5, 6] stealer.[^2520]But he that entereth by the door is the shepherd of the sheep.[^2521]And therefore[^2522] the keeper of the door openeth for him the door; and the sheep hear his voice: and [7] he calleth his sheep[^2523] by their names, and they go forth unto him.[^2524]And when he putteth forth his sheep, he goeth before them, and his sheep[^2525] follow him: because [8] they know his voice.[^2526]And after a stranger will the sheep not go, but they flee from [9] him: because they hear not the voice of a stranger.[^2527]This parable spake Jesus unto them: but they knew not what he was saying unto them." },
  { t = "note", id = "2519", text = "John x. 1." },
  { t = "note", id = "2520", text = "John x. 2." },
  { t = "note", id = "2521", text = "John x. 3." },
  { t = "note", id = "2522", text = "Or, *to him*." },
  { t = "note", id = "2523", text = "A different word (lit. *rams*) from that used in the other verses; so in Peshitta (*cf*. Sin., which, however, differs somewhat); *cf*. also § 54, 40 f., note." },
  { t = "note", id = "2524", text = "John x. 4." },
  { t = "note", id = "2525", text = "A different word (lit. *rams*) from that used in the other verses; so in Peshitta (*cf*. Sin., which, however, differs somewhat); *cf*. also § 54, 40 f., note." },
  { t = "note", id = "2526", text = "John x. 5." },
  { t = "note", id = "2527", text = "John x. 6." },
  { t = "p", text = "[10][^2528]Jesus said unto them again, Verily, verily, I say unto you, I am the door of the [11] sheep.[^2529]And all that came are thieves and stealers: but the sheep heard them not. [12][^2530]I am the door: and if a man enter by me, he shall live, and shall go in and go out, [13] and shall find pasture.[^2531]And the stealer cometh not, save that he may steal, and kill, and destroy: but I came that they might have life, and that they might have [14] the thing *that is* better.[^2532][^2533]I am the good shepherd; and the good shepherd giveth [15] himself[^2534] for his sheep.[^2535]But the hireling, who is not a shepherd, and whose the sheep[^2536] are not, when he seeth the wolf as it cometh, leaveth the sheep, and fleeth, [16] and the wolf cometh, and snatcheth away the sheep, and scattereth[^2537] them:[^2538]and the [17] hireling fleeth because he is an hireling, and hath no care for the sheep.[^2539]I am the [18] good shepherd;[^2540]and I know what is mine, and what is mine knoweth me, as my Father knoweth me, and I know my Father; and I give myself[^2541] for the sheep. [19][^2542]And I have other sheep also, that are not of this flock: them also I must invite, and they shall hear my voice; and all the sheep shall be one, and the shepherd one. [20] [Arabic, p. 141 ][^2543]And therefore doth my Father love me, because I give my life, that I may [21] take it again.[^2544]No man taketh it from me, but I leave it of my own choice. And I have the right to leave it, and have the right also to take it. And this commandment did I receive of my Father." },
  { t = "note", id = "2528", text = "John x. 7." },
  { t = "note", id = "2529", text = "John x. 8." },
  { t = "note", id = "2530", text = "John x. 9." },
  { t = "note", id = "2531", text = "John x. 10." },
  { t = "note", id = "2532", text = "Or, *best thing*. Vat. ms. omits from *but I came*." },
  { t = "note", id = "2533", text = "John x. 11." },
  { t = "note", id = "2534", text = "Or, *his life*." },
  { t = "note", id = "2535", text = "John x. 12." },
  { t = "note", id = "2536", text = "*cf*. note to § 37, 6." },
  { t = "note", id = "2537", text = "Or, *to snatch…and scatter*." },
  { t = "note", id = "2538", text = "John x. 13." },
  { t = "note", id = "2539", text = "John x. 14." },
  { t = "note", id = "2540", text = "John x. 15." },
  { t = "note", id = "2541", text = "Or, *my life*." },
  { t = "note", id = "2542", text = "John x. 16." },
  { t = "note", id = "2543", text = "John x. 17." },
  { t = "note", id = "2544", text = "John x. 18." },
  { t = "p", text = "[22][^2545]And there occurred a disagreement among the Jews because of these sayings. [23][^2546]And many of them said, He hath a devil, and is afflicted with madness;[^2547] why listen [24] ye to him?[^2548]And others said, These sayings are not those of *men* possessed with demons. Can a demon haply open the eyes of a blind *man?*" },
  { t = "note", id = "2545", text = "John x. 19." },
  { t = "note", id = "2546", text = "John x. 20." },
  { t = "note", id = "2547", text = "Lit. *epilepsy*." },
  { t = "note", id = "2548", text = "John x. 21." },
  { t = "p", text = "[25, 26][^2549]And the feast of the dedication came on at Jerusalem: and it was winter.[^2550]And [27] Jesus was walking in the temple in the porch of Solomon.[^2551]The Jews therefore surrounded him, and said unto him, Until when dost thou make our hearts anxious? [28][^2552]If thou art the Messiah, tell us plainly. He answered and said unto them, I told you, and ye believe not: and the deeds that I do in my Father’s name bear witness [29, 30] to me.[^2553]But ye believe not, because ye are not of my sheep,[^2554] as I said unto you. [31][^2555]And my sheep[^2556] hear my voice, and I know them, and they come after me:[^2557]and I give them eternal life; and they shall not perish for ever, nor shall any man snatch [32] them out of my hands.[^2558][^2559]For the Father, who hath given *them* unto me, is greater [33] than all; and no man is able to take *them* from the hand of my[^2560] Father.[^2561]I and [34, 35] my Father are one.[^2562]And the Jews took stones to stone him.[^2563]Jesus said unto them, Many good deeds from my Father have I shewed you; because of which[^2564] of them, [36] then, do ye stone me?[^2565]The Jews said unto him, Not for the good deeds do we stone thee, but because thou blasphemest; and, whilst thou art a man, makest thyself [37] God.[^2566]Jesus said unto them, Is it not thus written in your law, I said, Ye are gods? [38] [Arabic, p. 142 ][^2567]And if he called those gods—for[^2568] to them came the word of God (and it is [39] not possible in[^2569] the scripture that *anything* should be undone)—[^2570]he then, whom the Father hath sanctified and sent into the world, do ye say that he blasphemeth; [40] because I said unto you, I am the Son of God?[^2571]If then I do not the deeds of my [41] Father, ye believe me not.[^2572][^2573]But if I do, *even* if ye believe not me, believe the deeds: that ye may know and believe that my Father is in me, and I in my Father. [42][^2574]And they sought again to take him: and he went forth out of their hands." },
  { t = "note", id = "2549", text = "John x. 22." },
  { t = "note", id = "2550", text = "John x. 23." },
  { t = "note", id = "2551", text = "John x. 24." },
  { t = "note", id = "2552", text = "John x. 25." },
  { t = "note", id = "2553", text = "John x. 26." },
  { t = "note", id = "2554", text = "*cf*. § 37, 6." },
  { t = "note", id = "2555", text = "John x. 27." },
  { t = "note", id = "2556", text = "*cf*. § 37, 6." },
  { t = "note", id = "2557", text = "John x. 28." },
  { t = "note", id = "2558", text = "Or, *hand*; but probably dual (*cf*. Syr.)." },
  { t = "note", id = "2559", text = "John x. 29." },
  { t = "note", id = "2560", text = "So Peshitta; but Sin. *the*. Borg. ms. omits *the hand of*." },
  { t = "note", id = "2561", text = "John x. 30." },
  { t = "note", id = "2562", text = "John x. 31." },
  { t = "note", id = "2563", text = "John x. 32." },
  { t = "note", id = "2564", text = "Lit. *which deed*." },
  { t = "note", id = "2565", text = "John x. 33." },
  { t = "note", id = "2566", text = "John x. 34." },
  { t = "note", id = "2567", text = "John x. 35." },
  { t = "note", id = "2568", text = "*cf*. Peshitta." },
  { t = "note", id = "2569", text = "This *in* could more easily arise as a clerical error (repetition) in the Syriac text." },
  { t = "note", id = "2570", text = "John x. 36." },
  { t = "note", id = "2571", text = "John x. 37." },
  { t = "note", id = "2572", text = "So Ciasca’s text, following Vat. ms. But this is probably a clerical error for the reading of Borg. ms., which omits *ye*." },
  { t = "note", id = "2573", text = "John x. 38." },
  { t = "note", id = "2574", text = "John x. 39." },
  { t = "p", text = "[43][^2575]And he went beyond Jordan to the place where John was baptizing formerly; [44] and abode there.[^2576]And many people came unto him; and they said, John did not [45] work even one sign: but all that John said of this man is truth.[^2577]And many believed in him." },
  { t = "note", id = "2575", text = "John x. 40." },
  { t = "note", id = "2576", text = "John x. 41." },
  { t = "note", id = "2577", text = "John x. 42." },
  { t = "p", text = "[46][^2578]And there was a sick *man*, named Lazarus, of the village of Bethany, the brother [47] of Mary and Martha.[^2579]And Mary was she that anointed with sweet ointment the feet of Jesus, and wiped *them* with her hair; and Lazarus, who was sick, was the [48] brother of this *woman*.[^2580][^2581]And his sisters sent unto Jesus, and said unto him, Our [49] Lord, behold, he whom thou lovest is sick.[^2582]But Jesus said, This sickness is not unto death, but for the glorifying of God, that the Son of God may be glorified [50, 51] because of it.[^2583]And Jesus loved Martha, and Mary, and Lazarus.[^2584]And when he [52] heard that he was sick, he abode in the place where he was two days.[^2585]And after that, [53] he said unto his disciples, Come, let us go into Judæa.[^2586]His disciples said unto him, Our [Arabic, p. 143 ] Master, now the Jews desire to stone thee; and goest thou again thither? [54, 55][^2587]Jesus said unto them, Is not the day of twelve hours? If then a man walk in the day, he stumbleth not, because he seeth the light of the world.[^2588]But if [56] a man walk in the night, he stumbleth, because there is no lamp in him.[^2589]This said Jesus: and after that, he said unto them, Lazarus our friend hath fallen asleep; but [57] I am going to awaken him.[^2590]His disciples said unto him, Our Lord, if he hath [58] fallen asleep, he will recover.[^2591]But Jesus said that concerning his death: while they [59] supposed that he spake of lying down to sleep.[^2592]Then Jesus said unto them plainly, [60] Lazarus is dead.[^2593]And I am glad that I was not there for your sakes, that ye may [61] believe; but let us go thither.[^2594]Thomas, who is called Thama,[^2595] said to the disciples, his companions, Let us also go, and die with him." },

  { t = "note", id = "1601", text = "John v. 44." },
  { t = "note", id = "1602", text = "John v. 45." },
  { t = "note", id = "1603", text = "This word (often used by our translator) means in Syriac (transposed) *believe, think, hope* (*cf.* § 8, 8, note)." },
  { t = "note", id = "1604", text = "John v. 46." },
  { t = "note", id = "1605", text = "John v. 47." },
]

[[section]]
id = "section-23"
title = "Section XXIII."
level = 1
blocks = [
  { t = "p", text = "[1][^1606]And Jesus departed thence, and came to the side of the sea of Galilee, and went [2] up into the mountain, and sat there.[^1607]And there came unto him great multitudes, having with them lame, and blind, and dumb, and maimed, and many others, and [3] they cast them at the feet of Jesus:[^1608]for they had seen all the signs which he did in [4] Jerusalem, when they were gathered at the feast.[^1609]And he healed them all.[^1610]And those multitudes marvelled when they saw dumb *men* speak, and maimed *men* healed, and lame *men* walk, and blind *men* see; and they praised the God of Israel." },
  { t = "note", id = "1606", text = "Matt. xv. 29." },
  { t = "note", id = "1607", text = "Matt. xv. 30a." },
  { t = "note", id = "1608", text = "John iv. 45b." },
  { t = "note", id = "1609", text = "Matt. xv. 30b." },
  { t = "note", id = "1610", text = "Matt. xv. 31." },
  { t = "p", text = "[5][^1611]And Jesus called his disciples, and said unto them, I have compassion on this multitude, because of their continuing with me three days, having nothing to eat; and to send them away fasting I am not willing, lest they faint in the way,[^1612]some of them having [6] [Arabic, p. 89 ] come from far.[^1613]His disciples said unto him, Whence have we in the desert [7] bread wherewith to satisfy all this multitude?[^1614]Jesus said unto them, How [8] many loaves have ye?[^1615]They said unto him, Seven, and a few small fishes. And he [9] commanded the multitudes to sit down upon the ground;[^1616]and he took those seven loaves and the fish, and blessed, and brake, and gave to his disciples to set before [10] them; and the disciples set before the multitudes.[^1617]And they all ate, and were satisfied: and they took that which remained over of the fragments, seven basketfuls. [11][^1618]And the people that ate were four thousand men, besides the women and children. [12][^1619]And when the multitudes departed, he went up into the boat, and came to the borders of Magada.[^1620]" },
  { t = "note", id = "1611", text = "Matt. xv. 32." },
  { t = "note", id = "1612", text = "Mark viii. 3b." },
  { t = "note", id = "1613", text = "Matt. xv. 33." },
  { t = "note", id = "1614", text = "Matt. xv. 34." },
  { t = "note", id = "1615", text = "Matt. xv. 35." },
  { t = "note", id = "1616", text = "Matt. xv. 36." },
  { t = "note", id = "1617", text = "Matt. xv. 37." },
  { t = "note", id = "1618", text = "Matt. xv. 38." },
  { t = "note", id = "1619", text = "Matt. xv. 39." },
  { t = "note", id = "1620", text = "Arabic *Magadu*, as in Peshitta." },
  { t = "p", text = "[13][^1621]And the Pharisees and Sadducees came to him, and began to seek a discussion with him. And they asked him to shew them a sign from heaven, tempting him. [14][^1622]And Jesus sighed within himself, and said, What sign seeketh this evil and adulterous generation? It seeketh a sign, and it shall not be given a sign, except the sign [15] of Jonah the prophet.[^1623]Verily I say unto you, This generation shall not be given a [16] sign.[^1624]And he left[^1625] them, and went up into the boat, and went away to that side." },
  { t = "note", id = "1621", text = "Matt. xvi. 1a; Mark viii. 11b." },
  { t = "note", id = "1622", text = "Mark viii. 12a; Matt. xvi. 4." },
  { t = "note", id = "1623", text = "Mark viii. 12b." },
  { t = "note", id = "1624", text = "Mark viii. 13." },
  { t = "note", id = "1625", text = "*cf*. § 11, 32, note." },
  { t = "p", text = "[17][^1626]And his disciples forgot to take with them bread, and there was not with them [18] in the boat, not even[^1627] one loaf.[^1628]And Jesus charged them, and said, Take heed, and guard yourselves from the leaven of the Pharisees and Sadducees, and from the [19] leaven of Herod.[^1629]And they reflected within themselves that they had taken with them [20] no bread.[^1630]And Jesus knew, and said unto them, Why[^1631] think ye within yourselves, O *ye* of little faith, and are anxious, because ye have no bread?[^1632]until now do ye not perceive, [21] neither understand? is your heart yet hard?[^1633]And have ye eyes, and *yet* see not? [22] [Arabic, p. 90 ] and have ye ears, and *yet* hear not?[^1634]and do ye not remember when I brake those five loaves for five thousand? and how many baskets full of broken [23] pieces took ye[^1635] up? They said, Twelve.[^1636]He said unto them, And the seven also for four thousand: how many baskets full of broken pieces took ye[^1637] up? They [24] said, Seven.[^1638]He said unto them, How have ye not understood that I spake not to you because of[^1639] the bread, but that ye should beware of the leaven of the Pharisees [25] and Sadducees?[^1640]Then they understood that he spake, not that they should beware of the leaven of the bread, but of the doctrine of the Pharisees and Sadducees, which he called leaven." },
  { t = "note", id = "1626", text = "Mark viii. 14." },
  { t = "note", id = "1627", text = "The change of a single letter in the Arabic would turn *not even* into *except*; but Ibn-at-Tayyib’s Commentary (Brit. Mus. text) also has *not even*." },
  { t = "note", id = "1628", text = "Mark viii. 15." },
  { t = "note", id = "1629", text = "Matt. xvi. 7." },
  { t = "note", id = "1630", text = "Matt. xvi. 8." },
  { t = "note", id = "1631", text = "Lit. *What*. See note to § 7, 38." },
  { t = "note", id = "1632", text = "Mark viii. 17b." },
  { t = "note", id = "1633", text = "Mark viii. 18." },
  { t = "note", id = "1634", text = "Mark viii. 19." },
  { t = "note", id = "1635", text = "Or, *ye took*." },
  { t = "note", id = "1636", text = "Mark viii. 20." },
  { t = "note", id = "1637", text = "Or, *ye took*." },
  { t = "note", id = "1638", text = "Mark viii. 21a; Matt. xvi. 11." },
  { t = "note", id = "1639", text = "Or, *concerning*." },
  { t = "note", id = "1640", text = "Matt. xvi. 12." },
  { t = "p", text = "[26][^1641]And after that, he came to Bethsaida. And they brought to him a certain[^1642] blind [27] *man*, and besought him that he would touch him.[^1643]And he took the hand of that blind man, and led him out without the village, and spat in his eyes, and laid his [28] hand on him,[^1644] and asked him, What seest thou?[^1645]And that blind man looked intently, [29] and said unto him, I see men as trees walking.[^1646]And he placed his hand [30] again on his eyes; and they were restored,[^1647] and he saw everything clearly.[^1648]And he sent him to his house, and said, Do not enter even into the village, nor tell any man in the village." },
  { t = "note", id = "1641", text = "Mark viii. 22." },
  { t = "note", id = "1642", text = "Lit. *one*, probably representing Syriac idiom (*cf*. Sinaitic?)." },
  { t = "note", id = "1643", text = "Mark viii. 23." },
  { t = "note", id = "1644", text = "The Peshitta also omits *on him*." },
  { t = "note", id = "1645", text = "Mark viii. 24." },
  { t = "note", id = "1646", text = "Mark viii. 25." },
  { t = "note", id = "1647", text = "An intransitive word." },
  { t = "note", id = "1648", text = "Mark viii. 26." },
  { t = "p", text = "[31][^1649]And Jesus went forth, and his disciples, to the villages of Cæsarea Philippi. [32][^1650]And while he was going in the way, and his disciples alone,[^1651] he asked his disciples, [33] and said, What do men say of me that I am, the Son of man?[^1652][^1653]They said unto him, Some say, John the Baptist; and others, Elijah; and others, Jeremiah, or one of the [34, 35] prophets.[^1654]He said unto them, And ye, what say ye that I am?[^1655]Simon Cephas answered [36] [Arabic, p. 91 ] and said, Thou art the Messiah, the Son of the living God.[^1656]Jesus answered and said unto him, Blessed art thou, Simon son of Jonah: flesh and [37] blood hath not revealed *it* unto thee, but my Father which is in heaven.[^1657]And I say unto thee also, that thou art Cephas,[^1658] and on this rock will I build my church; and the [38] gates of Hades shall not prevail against it.[^1659]To thee will I give the keys of the kingdom of heaven: and whatsoever thou shalt bind on earth shall be bound in heaven; and [39] whatsoever thou shalt loose on earth shall be loosed in heaven.[^1660]And he sternly charged his disciples, and warned them that they should not tell any man concerning him, [40] that he was the Messiah.[^1661]And henceforth began Jesus to shew to his disciples [41] that he was determined[^1662] to go to Jerusalem,[^1663]and suffer much, and be rejected of the elders, and of the chief priests, and of the scribes, and be killed, and on the [42] third day rise.[^1664]And he was speaking[^1665] plainly.[^1666]And Simon Cephas, as one grieved [43] for him, said, Far be thou, my Lord, from that.[^1667]And he turned, and looked upon [44] his disciples, and rebuked Simon, and said,[^1668]Get thee behind me, Satan: for thou art a stumblingblock unto me: for thou thinkest not of what pertains to God, but of what pertains to men." },
  { t = "note", id = "1649", text = "Mark viii. 27a." },
  { t = "note", id = "1650", text = "Matt. xvi. 13b." },
  { t = "note", id = "1651", text = "Or, *his disciples being alone*. There is no such clause in the Syriac versions (Pesh., Sin.)." },
  { t = "note", id = "1652", text = "The Arabic, which reappears in Ibn-at-Tayyib’s Commentary (Brit. Mus. text), and seems to represent the consonantal text of the Peshitta, is awkward. § 23, 34 (Arabic), shows, however, that the rendering given in the text is the meaning intended by the translator." },
  { t = "note", id = "1653", text = "Matt. xvi. 14." },
  { t = "note", id = "1654", text = "Matt. xvi. 15." },
  { t = "note", id = "1655", text = "Matt. xvi. 16." },
  { t = "note", id = "1656", text = "Matt. xvi. 17." },
  { t = "note", id = "1657", text = "Matt. xvi. 18." },
  { t = "note", id = "1658", text = "Same Arabic word in both places. See note to § 5, 11." },
  { t = "note", id = "1659", text = "Matt. xvi. 19." },
  { t = "note", id = "1660", text = "Matt. xvi. 20." },
  { t = "note", id = "1661", text = "Matt. xvi. 21a." },
  { t = "note", id = "1662", text = "The word is freely used in this work in the post-classical sense of *about to*." },
  { t = "note", id = "1663", text = "Mark viii. 31b." },
  { t = "note", id = "1664", text = "Mark viii. 32a." },
  { t = "note", id = "1665", text = "The Arabic might perhaps be construed *and to speak*, depending on *began* in § 23, 40; but the clause agrees with the Sinaitic of Mark, as does the following." },
  { t = "note", id = "1666", text = "Matt. xvi. 22." },
  { t = "note", id = "1667", text = "Mark viii. 33a." },
  { t = "note", id = "1668", text = "Matt. xvi. 23b." },
  { t = "p", text = "[45][^1669]And Jesus called the multitudes with his disciples, and said unto them, Whosoever would come after me, let him deny himself, and take his cross every day, and [46] come after me.[^1670]And whosoever would save his life shall lose it; and whosoever [47] loseth his life for my sake, and for the sake of my gospel, shall save it.[^1671]What shall [48] a man profit, if he gain all the world, and destroy[^1672] his own life,[^1673] or lose it?[^1674]or what [49] [Arabic, p. 92 ] will a man give *in* ransom for his life?[^1675][^1676]Whosoever shall deny me and my sayings in this sinful and adulterous generation, the Son of man also will [50] deny him, when he cometh in the glory of his Father with his holy angels.[^1677]For the Son of man is about to[^1678] come in the glory of his Father with his holy angels; and then shall he reward each man according to his works." },
  { t = "note", id = "1669", text = "Mark viii. 34a; Luke ix. 23b." },
  { t = "note", id = "1670", text = "Mark viii. 35." },
  { t = "note", id = "1671", text = "Luke ix. 25." },
  { t = "note", id = "1672", text = "Or, *lose*." },
  { t = "note", id = "1673", text = "Or, *self*; or, *soul*." },
  { t = "note", id = "1674", text = "Mark viii. 37." },
  { t = "note", id = "1675", text = "Or, *self*; or, *soul*." },
  { t = "note", id = "1676", text = "Mark viii. 38." },
  { t = "note", id = "1677", text = "Matt. xvi. 27." },
  { t = "note", id = "1678", text = "See § 23, 40, note." },
]

[[section]]
id = "section-24"
title = "Section XXIV."
level = 1
blocks = [
  { t = "p", text = "[1][^1679]And he said unto them, Verily I say unto you, There be here now some standing that shall not taste death, until they see the kingdom of God come[^1680] with strength,[^1681]and the Son of man who cometh in his kingdom." },
  { t = "note", id = "1679", text = "Mark ix. 1." },
  { t = "note", id = "1680", text = "i.e., *already come*." },
  { t = "note", id = "1681", text = "Matt. xvi. 28b." },
  { t = "p", text = "[2][^1682]And after six days Jesus took Simon Cephas, and James, and John his brother, [3] and brought them up into a high mountain, the three of them only.[^1683]And while they [4] were praying, Jesus changed, and became after the fashion of another person;[^1684]and his face shone like the sun, and his raiment was very white like the snow, and as [5] the light of lightning, so that nothing on earth can whiten[^1685] like it.[^1686]And there appeared [6] unto him Moses and Elijah talking to Jesus.[^1687]And they thought that the time [7] of his decease which was to be accomplished at Jerusalem was come.[^1688]And Simon and those that were with him were heavy in the drowsiness of sleep; and with effort they roused themselves, and saw his glory, and those two men that were standing with him. [8] [Arabic, p. 93 ][^1689]And when they began to depart from him, Simon said unto Jesus, My [9] Master, it is good for us to be here:[^1690]and if thou wilt, we will make here three tabernacles; one for thee, and one for Moses, and one for Elijah;[^1691]not knowing [10] what he said, because of the fear which took possession of them.[^1692]And while he [11] was yet saying that, a bright cloud overshadowed them.[^1693]And when they saw Moses [12] and Elijah that they had entered into that cloud, they feared again.[^1694]And a voice was heard out of the cloud, saying, This is my beloved Son, whom I have chosen; [13] hear ye therefore him.[^1695]And when this voice was heard, Jesus was found alone. [14][^1696]And the disciples, when they heard the voice, fell on their faces from the fear which [15] took hold of them.[^1697]And Jesus came and touched them and said, Arise, be not [16] afraid.[^1698]And they lifted up their eyes, and saw Jesus as he was." },
  { t = "note", id = "1682", text = "Matt. xvii. 1." },
  { t = "note", id = "1683", text = "Luke ix. 29a." },
  { t = "note", id = "1684", text = "Matt. xvii. 2b; Luke ix. 29b." },
  { t = "note", id = "1685", text = "Or, *become white*. In the Pesh. the verb is transitive. In Sin. the clause is omitted." },
  { t = "note", id = "1686", text = "Mark ix. 3b; Mark ix. 4." },
  { t = "note", id = "1687", text = "Luke ix. 31b." },
  { t = "note", id = "1688", text = "Luke ix. 32." },
  { t = "note", id = "1689", text = "Luke ix. 33a." },
  { t = "note", id = "1690", text = "Matt. xvii. 4b." },
  { t = "note", id = "1691", text = "Luke ix. 33c." },
  { t = "note", id = "1692", text = "Mark ix. 6b; Matt. xvii. 5a." },
  { t = "note", id = "1693", text = "Luke ix. 34b." },
  { t = "note", id = "1694", text = "Matt. xvii. 5b." },
  { t = "note", id = "1695", text = "Luke ix. 36a." },
  { t = "note", id = "1696", text = "Matt. xvii. 6." },
  { t = "note", id = "1697", text = "Matt. xvii. 7." },
  { t = "note", id = "1698", text = "Matt. xvii. 8." },
  { t = "p", text = "[17][^1699]And when they went down from the mountain, Jesus charged them, and said unto them, Tell not what ye have seen to any man, until the Son of man rise from [18] among the dead.[^1700]And they kept the word within themselves, and told no man in [19] those days what they had seen.[^1701]And they reflected among themselves, What is this [20] word which he spake unto us, I, when I am risen from among the dead?[^1702]And his disciples asked him, and said, What is that which the scribes say, then, that Elijah [21] must first come?[^1703]He said unto them, Elijah cometh first to set in order everything, [Arabic, p. 94 ] and as it was written of the Son of man, that he should suffer many things, [22] and be rejected.[^1704]But I say unto you, that Elijah is come, and they knew him not, and have done unto him whatsoever they desired, as it was written of him. [23, 24][^1705]In like manner the Son of man is to suffer of them.[^1706]Then understood the disciples that he spake unto them concerning John the Baptist." },
  { t = "note", id = "1699", text = "Matt. xvii. 9." },
  { t = "note", id = "1700", text = "Mark ix. 10a; Luke ix. 36c." },
  { t = "note", id = "1701", text = "Mark ix. 10b." },
  { t = "note", id = "1702", text = "Mark ix. 11a; Matt. xvii. 10b." },
  { t = "note", id = "1703", text = "Mark ix. 12." },
  { t = "note", id = "1704", text = "Mark ix. 13." },
  { t = "note", id = "1705", text = "Matt. xvii. 12b." },
  { t = "note", id = "1706", text = "Matt. xvii. 13." },
  { t = "p", text = "[25][^1707]And on that day whereon they came down from the mountain, there met him a multitude of many people standing with his disciples, and the scribes were discussing [26] with them.[^1708]And the people, when they saw Jesus, were perplexed,[^1709] and in the [27] midst of their joy hastened[^1710] and saluted him.[^1711]And on that day came certain of the Pharisees, and said unto him, Get thee out, and go hence; for Herod seeketh [28] to kill thee.[^1712]Jesus said unto them, Go ye and say to this fox, Behold, I am casting out demons, and I heal to-day and to-morrow, and on the third day I am perfected. [29][^1713]Nevertheless I must be watchful[^1714] to-day and to-morrow, and on the last day I shall depart; for it cannot be that a prophet perish outside of Jerusalem." },
  { t = "note", id = "1707", text = "Mark ix. 14." },
  { t = "note", id = "1708", text = "Mark ix. 15." },
  { t = "note", id = "1709", text = "This rendering assumes that the diacritical point is due to a clerical error. The text as printed can hardly be translated without forcing." },
  { t = "note", id = "1710", text = "This Arabic word repeatedly represents a Syriac *ran* (*cf*. § 53, 11). A different word is so used in § 26, 21." },
  { t = "note", id = "1711", text = "Luke xiii. 31." },
  { t = "note", id = "1712", text = "Luke xiii. 32." },
  { t = "note", id = "1713", text = "Luke xiii. 33." },
  { t = "note", id = "1714", text = "The Syriac word used in the Peshitta is here translated just as it was translated in § 1, 79 (see note); but the Greek shows that in the present passage the Syriac word means *go about* (*cf*. Cur.)." },
  { t = "p", text = "[30][^1715]And after that, there came to him a man from that multitude, and fell upon his knees, and said unto him, I beseech thee, my Lord, look upon my son;[^1716]he is my [31] only *child*: and the spirit cometh upon him suddenly.[^1717]A lunacy[^1718] hath come upon [32] him, and he meeteth with evils.[^1719]And when it cometh upon him, it beateth him about;[^1720] [33] and he foameth, and gnasheth his teeth, and wasteth;[^1721][^1722]and many times it hath thrown him into the water and into the fire to destroy him, and it hardly leaveth him after [34] [Arabic, p. 95 ] bruising him.[^1723]And I brought him near to thy disciples, and they could [35] not heal him.[^1724]Jesus answered and said, O faithless and perverse generation, till when shall I be with you? and till when shall I bear with you? bring thy son [36] hither.[^1725]And he brought him unto him: and when the spirit saw him, immediately [37] it beat him about; and he fell upon the ground, and was raging and foaming.[^1726]And Jesus asked his father, How long is the time during which he hath been thus? He [38] said unto him, From his youth until now.[^1727]But, my Lord, help me wherein thou [39] canst, and have mercy upon me.[^1728]Jesus said unto him, If thou canst believe! All [40] things are possible to him that believeth.[^1729]And immediately the father of the child [41] cried out, weeping, and said, I believe, my Lord; help my lack of faith.[^1730]And when Jesus saw the hastening of the people, and their coming at the sound, he rebuked that unclean spirit, and said to it, Thou dumb[^1731] spirit that speakest not, I command [42] thee,[^1732] come out of him, and enter not again into him.[^1733]And that spirit, devil,[^1734] cried out much, and bruised him, and came out; and that child fell as one dead, and [43] many thought that he had died.[^1735]But Jesus took him by his hand, and raised him [44] up, and gave him to his father; and that child was healed from that hour.[^1736]And the people all marvelled at the greatness of God." },
  { t = "note", id = "1715", text = "Luke ix. 38a; Matt. xvii. 14b." },
  { t = "note", id = "1716", text = "Luke ix. 38b." },
  { t = "note", id = "1717", text = "Luke ix. 39a; Matt. xvii. 15b." },
  { t = "note", id = "1718", text = "Lit. The *son-of-the-roof*, a Syriac phrase meaning *a demon of lunacy*." },
  { t = "note", id = "1719", text = "Mark ix. 18a." },
  { t = "note", id = "1720", text = "A word used in Arabic of the devil producing insanity; but here it reproduces the Peshitta." },
  { t = "note", id = "1721", text = "Lit. *becometh light*; but a comparison with the Peshitta suggests that we should change one diacritical point and read *withereth*, as in Ibn-at-Tayyib’s Commentary. An equally easy emendation would be *wasteth*." },
  { t = "note", id = "1722", text = "Matt. xvii. 15c; Luke ix. 39c." },
  { t = "note", id = "1723", text = "Matt. xvii. 16." },
  { t = "note", id = "1724", text = "Matt. xvii. 17." },
  { t = "note", id = "1725", text = "Mark ix. 20." },
  { t = "note", id = "1726", text = "Mark ix. 21." },
  { t = "note", id = "1727", text = "Mark ix. 22b." },
  { t = "note", id = "1728", text = "Mark ix. 23." },
  { t = "note", id = "1729", text = "Mark ix. 24." },
  { t = "note", id = "1730", text = "Mark ix. 25." },
  { t = "note", id = "1731", text = "In Syriac, but not in Arabic, the word means *deaf* or *dumb*, according to the context." },
  { t = "note", id = "1732", text = "Ciasca’s Arabic follows Vat. ms. in inserting a *that* (pronoun) after *thee*." },
  { t = "note", id = "1733", text = "Mark ix. 26." },
  { t = "note", id = "1734", text = "Doubtless alternative renderings of the same Syriac word (*demon*)." },
  { t = "note", id = "1735", text = "Mark ix. 27a; Luke ix. 42b." },
  { t = "note", id = "1736", text = "Matt. xvii. 18b; Luke ix. 43a." },
  { t = "p", text = "[45][^1737]And when Jesus entered into the house, his disciples came, and asked him [46] privately,[^1738] and said unto him, Why were we not able to heal him?[^1739]Jesus said unto [Arabic, p. 96 ] them, Because of your unbelief. Verily I say unto you, If ye have faith as a grain of mustard seed, ye shall say to this mountain, Remove hence; [47] and it shall remove; and nothing shall overcome you.[^1740]But it is impossible to cast out this kind by anything except by fasting and prayer." },
  { t = "note", id = "1737", text = "Mark ix. 28." },
  { t = "note", id = "1738", text = "Lit. *between themselves and him*." },
  { t = "note", id = "1739", text = "Matt. xvii. 20." },
  { t = "note", id = "1740", text = "Mark ix. 29b." },
  { t = "p", text = "[48][^1741]And when he went forth thence, they passed through Galilee: and he would not [49] that any man should know it.[^1742][^1743]And he taught his disciples, and said unto them, [50][^1744]Keep ye these sayings in your ears and your hearts: for the Son of man is to be delivered into the hands of men, and they shall kill him; and when he is killed, he [51] shall rise on the third day.[^1745]But they knew not the word which he spake unto them, for it was concealed from them, that they should not perceive it; and they feared to [52] ask him about this word.[^1746]And they were exceeding sorrowful." },
  { t = "note", id = "1741", text = "Mark ix. 30." },
  { t = "note", id = "1742", text = "Or, *about him*." },
  { t = "note", id = "1743", text = "Mark ix. 31a; Luke ix. 44a." },
  { t = "note", id = "1744", text = "Mark ix. 31b." },
  { t = "note", id = "1745", text = "Luke ix. 45." },
  { t = "note", id = "1746", text = "Matt. xvii. 23b." },
]

[[section]]
id = "section-25"
title = "Section XXV."
level = 1
blocks = [
  { t = "p", text = "[1][^1747]And in that day this thought presented itself to his disciples, and they said, which [2] haply should be the great*est* among them.[^1748][^1749]And when they came to Capernaum, and entered into the house, Jesus said unto them, What were ye considering in the [3] way among yourselves?[^1750]And they were silent because they had considered that *matter*." },
  { t = "note", id = "1747", text = "Luke ix. 46." },
  { t = "note", id = "1748", text = "Borg. ms. omits *among them*." },
  { t = "note", id = "1749", text = "Mark ix. 33." },
  { t = "note", id = "1750", text = "Mark ix. 34a." },
  { t = "p", text = "[4][^1751]And when Simon went forth without, those that received two dirhams for the tribute came to Cephas, and said unto him, Doth your master not give his two [5] dirhams? He said unto them, Yea.[^1752]And when Cephas entered the house, Jesus anticipated him, and said unto him, What thinkest thou, Simon? the kings of the earth, from whom do they receive custom and tribute? from their sons, or from [6] [Arabic, p. 97 ] strangers?[^1753]Simon said unto him, From strangers. Jesus said unto him, Children then are free. Simon said unto him, Yea. Jesus said unto him, [7] Give thou also unto them, like the stranger.[^1754]But, lest it trouble them, go thou to the sea, and cast *a* hook; and the first fish that cometh up, open its mouth, *and* thou shalt find a stater: take therefore that, and give for me and thee." },
  { t = "note", id = "1751", text = "Matt. xvii. 24b." },
  { t = "note", id = "1752", text = "Matt. xvii. 25." },
  { t = "note", id = "1753", text = "Matt. xvii. 26." },
  { t = "note", id = "1754", text = "Matt. xvii. 27." },
  { t = "p", text = "[8][^1755]And in that hour came the disciples to Jesus, and said unto him, Who, thinkest [9] thou, is greater in the kingdom of heaven?[^1756]And Jesus knew the thought of their heart, and called a[^1757] child, and set him in the midst, and took him in his arms, and [10] said unto them,[^1758]Verily I say unto you, If ye do not return, and become as children, [11] ye shall not enter the kingdom of heaven.[^1759]Every one that shall receive in my name such as this child hath received me:[^1760]and whosoever receiveth me receiveth [12] not me, but him that sent me.[^1761]And he who is little in your company,[^1762] the same [13] shall be great.[^1763]But whosoever shall injure one of these little ones that believe in me, it were better for him that a great millstone[^1764] should be hanged about his neck, and *he should be* drowned in the depths of the sea." },
  { t = "note", id = "1755", text = "Matt. xviii. 1." },
  { t = "note", id = "1756", text = "Luke ix. 47a; Mark ix. 36." },
  { t = "note", id = "1757", text = "Lit. *one* (Syriac idiom)." },
  { t = "note", id = "1758", text = "Matt. xviii. 3." },
  { t = "note", id = "1759", text = "Luke ix. 48." },
  { t = "note", id = "1760", text = "Mark ix. 37b." },
  { t = "note", id = "1761", text = "Luke ix. 48c." },
  { t = "note", id = "1762", text = "In the present work this word frequently means *synagogue*." },
  { t = "note", id = "1763", text = "Matt. xviii. 6." },
  { t = "note", id = "1764", text = "Lit. *millstone of an ass*." },
  { t = "p", text = "[14][^1765]John answered and said, Our Master, we saw one casting out devils in thy name; [15] and we prevented him, because he followed not thee with us.[^1766]Jesus said unto them, Prevent him not; for no man doeth powers in my name, and can hasten to speak evil [16, 17] of me.[^1767]Every one who is not in opposition to you is with you.[^1768]Woe unto the world [Arabic, p. 98 ] because of trials![^1769] but woe unto that man by whose hand the trials come! [18][^1770]If thy hand or thy foot injure thee, cut it off, and cast it from thee; for it is better for thee to enter into life being halt or maimed, and not that thou shouldest have two hands or two feet, and fall into the hell of fire that burneth[^1771] for ever; [19, 20][^1772]where their worm dieth not, and their fire is not quenched.[^1773]And if thine eye seduce[^1774] [21] thee, pluck it out, and cast it from thee;[^1775]for it is better for thee to enter the kingdom of God with one eye, than that thou shouldest have two eyes, and fall into the [22, 23] fire of Gehenna;[^1776]where their worm dieth not, and their fire is not quenched.[^1777]Every [24] *one* shall be salted with fire, and every sacrifice shall be salted with salt.[^1778]How good [25] is salt! but if the salt also be tasteless, wherewith shall it be salted?[^1779]It is fit neither for the land nor for dung, but they cast it out. He that hath ears to hear, let him [26] hear.[^1780]Have ye salt in yourselves, and be in peace one with another." },
  { t = "note", id = "1765", text = "Luke ix. 49." },
  { t = "note", id = "1766", text = "Mark ix. 39." },
  { t = "note", id = "1767", text = "Luke ix. 50b." },
  { t = "note", id = "1768", text = "Matt. xviii. 7a, c." },
  { t = "note", id = "1769", text = "i.e., experiences that test one; or, *seductions*. The word is variously used." },
  { t = "note", id = "1770", text = "Matt. xviii. 8." },
  { t = "note", id = "1771", text = "Or, *is kindled*." },
  { t = "note", id = "1772", text = "Mark ix. 44." },
  { t = "note", id = "1773", text = "Matt. xviii. 9a." },
  { t = "note", id = "1774", text = "See note to § 25, 17." },
  { t = "note", id = "1775", text = "Mark ix. 47b." },
  { t = "note", id = "1776", text = "Mark ix. 48." },
  { t = "note", id = "1777", text = "Mark ix. 49." },
  { t = "note", id = "1778", text = "Mark ix. 50a." },
  { t = "note", id = "1779", text = "Luke xiv. 34b; Luke xiv. 35." },
  { t = "note", id = "1780", text = "Mark ix. 50c." },
  { t = "p", text = "[27][^1781]And he arose from thence, and came to the borders of Judæa beyond Jordan: and there went unto him thither great multitudes, and he healed them; and he taught [28] them also, according to his custom.[^1782]And the Pharisees came unto him, tempting [29] him, and asking him, Is it lawful for a man to put away his wife?[^1783]He said, What [30] did Moses command you?[^1784]They said, Moses made it allowable for us, *saying*, Whosoever [31] will, let him write a writing of divorcement, and put away his wife.[^1785]Jesus answered and said unto them,[^1786]Have ye not read, He that made *them* from the beginning [32] made them male and female, and said,[^1787]For this reason shall the man leave his father [Arabic, p. 99 ] and his mother, and cleave to his wife; and they both shall be one body? [33][^1788]So then they are not twain, but one body; the thing, then, which God hath [34] joined together, let no man put asunder.[^1789]And those Pharisees said unto him, Why did Moses consent[^1790] that a *man* should give a writing of divorcement and put her away? [35][^1791]Jesus said unto them, Moses because of the hardness of your hearts gave you leave [36] to divorce your wives; but in the beginning it was not so.[^1792]I say unto you, Whosoever putteth away[^1793] his wife without fornication, and marrieth another, hath exposed [37] her to adultery.[^1794]And his disciples, when he entered the house, asked him again [38] about that.[^1795]And he said unto them, Every one who putteth away his wife, and [39] marrieth another, hath exposed her to adultery.[^1796]And any woman that leaveth her husband, and becometh another’s, hath committed adultery.[^1797]And whosoever marrieth [40] her that is divorced hath committed adultery.[^1798]And his disciples said unto him, If there be between the man and the woman such a case[^1799] as this, it is not good for [41] a man to marry.[^1800]He said unto them, Not every man can endure this saying, except [42] him to whom it is given.[^1801]There are eunuchs which from their mother’s womb[^1802] were born so; and there are eunuchs which through men became eunuchs; and there are eunuchs which made themselves eunuchs for the sake of the kingdom of heaven. He that is able to be content, let him be content." },
  { t = "note", id = "1781", text = "Mark x. 1." },
  { t = "note", id = "1782", text = "Mark x. 2." },
  { t = "note", id = "1783", text = "Mark x. 3." },
  { t = "note", id = "1784", text = "Mark x. 4." },
  { t = "note", id = "1785", text = "Mark x. 5a." },
  { t = "note", id = "1786", text = "Matt. xix. 4." },
  { t = "note", id = "1787", text = "Matt. xix. 5." },
  { t = "note", id = "1788", text = "Matt. xix. 6." },
  { t = "note", id = "1789", text = "Matt. xix. 7." },
  { t = "note", id = "1790", text = "So the Arabic; but the Syriac versions follow the Greek, and *consent* is doubtless a (very easy, and, in view of the succeeding context, natural) clerical error for an original Arabic *charge*." },
  { t = "note", id = "1791", text = "Matt. xix. 8." },
  { t = "note", id = "1792", text = "Matt. xix. 9a." },
  { t = "note", id = "1793", text = "Or, *leaveth*." },
  { t = "note", id = "1794", text = "Mark x. 10." },
  { t = "note", id = "1795", text = "Mark x. 11." },
  { t = "note", id = "1796", text = "Mark x. 12." },
  { t = "note", id = "1797", text = "Matt. xix. 9b." },
  { t = "note", id = "1798", text = "Matt. xix. 10." },
  { t = "note", id = "1799", text = "Lit. *blame*, a mistranslation (found also in the Brit. Mus. text of Ibn-at-Tayyib’s Commentary) of the Syriac word, which is ambiguous (*cf*. even the Greek). For a somewhat similar case see § 50, 11, note." },
  { t = "note", id = "1800", text = "Matt. xix. 11." },
  { t = "note", id = "1801", text = "Matt. xix. 12." },
  { t = "note", id = "1802", text = "Lit. *wombs*." },
  { t = "p", text = "[43][^1803]Then they brought to him children, that he should lay his hand upon them, and [44] pray: and his disciples were rebuking those that were bringing them.[^1804]And Jesus saw, and it was distressing to him; and he said unto them, Suffer the children to [Arabic, p. 100 ] come unto me, and prevent them not; for those that are like these have [45] the kingdom of God.[^1805]Verily I say unto you, Whosoever receiveth not the [46] kingdom of God as this child, shall not enter it.[^1806]And he took them in his arms, and laid his hand upon them, and blessed them." },
  { t = "note", id = "1803", text = "Matt. xix. 13a." },
  { t = "note", id = "1804", text = "Mark x. 13b; Mark x. 14." },
  { t = "note", id = "1805", text = "Mark x. 15." },
  { t = "note", id = "1806", text = "Mark x. 16." },
]

[[section]]
id = "section-26"
title = "Section XXVI."
level = 1
blocks = [
  { t = "p", text = "[1, 2][^1807]And there came unto him publicans and sinners to hear his word.[^1808]And the scribes and the Pharisees murmured, and said, This man receiveth sinners, and [3] eateth with them.[^1809]And Jesus, when he beheld their murmuring, spake unto them [4] this parable:[^1810]What man of you, having an hundred sheep, if one of them were lost, would not leave the ninety-nine in the wilderness, and go and seek the straying *one* [5] till he found it?[^1811]Verily I say unto you, When he findeth it, he will rejoice over it [6] more than *over* the ninety-nine that went not astray;[^1812]and bear it on his shoulders, and bring it to his house, and call his friends and neighbours,[^1813]and say unto them, [7] Rejoice with me, since I have found my straying sheep.[^1814]So your Father which is in heaven willeth[^1815] not that one of these little ones that have strayed should perish, [8] and he seeketh for them repentance.[^1816]I say unto you, Thus there shall be rejoicing in heaven over one sinner that repenteth, more than *over* ninety-nine righteous persons that do not need repentance." },
  { t = "note", id = "1807", text = "Luke xv. 1." },
  { t = "note", id = "1808", text = "Luke xv. 2." },
  { t = "note", id = "1809", text = "Luke xv. 3." },
  { t = "note", id = "1810", text = "Luke xv. 4." },
  { t = "note", id = "1811", text = "Matt. xviii. 13." },
  { t = "note", id = "1812", text = "Luke xv. 5b." },
  { t = "note", id = "1813", text = "Luke xv. 6." },
  { t = "note", id = "1814", text = "Matt. xviii. 14." },
  { t = "note", id = "1815", text = "Strictly, *preferreth*, but used also as in the text." },
  { t = "note", id = "1816", text = "Luke xv. 7." },
  { t = "p", text = "[9][^1817]And what woman having ten drachmas would lose one of them, and not light a [10] lamp, and sweep the house, and seek it with care till she found it;[^1818]and when she found it, call her friends and neighbours, and say unto them, Rejoice with me, as I [11] have found my drachma that was lost?[^1819]I say unto you, Thus there shall be joy [Arabic, p. 101 ] before the angels of God over the one sinner that repenteth, more than over the ninety-nine righteous *persons* that do not need repentance." },
  { t = "note", id = "1817", text = "Luke xv. 8." },
  { t = "note", id = "1818", text = "Luke xv. 9." },
  { t = "note", id = "1819", text = "Luke xv. 10." },
  { t = "p", text = "[12, 13][^1820]And Jesus spake unto them also another parable:[^1821]A man had two sons: and the younger son said unto him, My father, give me my portion that belongeth to [14] me of thy goods.[^1822]And he divided between them his property. And after a few days the younger son gathered everything that belonged to him, and went into a [15] far country, and there squandered his property by living prodigally.[^1823]And when he had exhausted everything he had, there occurred a great dearth in that country. [16][^1824]And when he was in want, he went and joined himself to one of the people of a city [17] of that country; and that *man* sent him into the field[^1825] to feed the swine.[^1826]And he used to long to fill his belly with the carob that those swine were eating: and no man [18] gave him.[^1827]And when he returned unto himself, he said, How many hired servants now in my father’s house have bread enough and to spare, while I here perish with [19] hunger![^1828]I will arise and go to my father’s house, and say unto him, My father,[^1829]I [20] have sinned in heaven and before thee, and am not worthy now to be called thy [21] son: make me as one of thy hired servants.[^1830]And he arose, and came to his father. But his father saw him while he was at a distance, and was moved with compassion [22] for him, and ran,[^1831] and fell on his breast,[^1832] and kissed him.[^1833]And his son said unto him, My father, I have sinned in heaven and before thee, and am not worthy to be [23] called thy son.[^1834]His father said unto his servants, Bring forth a stately robe, and put [24] *it* on him; and put a ring on his hand, and put on him shoes on his feet:[^1835]and bring and [25] slay a fatted ox, that we may eat and make merry:[^1836]for this my son was dead, and is [26] [Arabic, p. 102 ] alive; and was lost, and is found.[^1837]And they began to be merry.[^1838] Now his elder son was in the field; and when he came and drew near to the house, [27] he heard the sound of many singing.[^1839][^1840]And he called one of the lads, and asked him [28] what this was.[^1841]He said unto him, Thy brother hath arrived; and thy father hath [29] slain a fatted ox, since he hath received him safe and sound.[^1842][^1843]And he was angry, [30] and would not enter; so his father went out, and besought him to enter.[^1844]And he said to his father, How many years do I serve thee in bondage, and I never transgressed a commandment of thine; and thou hast never given me a kid, that I might [31] make merry with my friends?[^1845]but this thy son, when he had squandered thy [32] property with harlots, and come, thou hast slain for him a fatted ox.[^1846]His father said unto him, My son, thou art at all times with me, and everything I have is [33] thine.[^1847]It behoveth thee to rejoice and make merry, since this thy brother was dead, and is alive; and *was* lost, and is found." },

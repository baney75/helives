  { t = "note", id = "2614", text = "This is the Syriac word (*cf*. the versions, and below, § 44, 44; see also Ibn-at-Tayyib’s Commentary, *ad loc*)." },
  { t = "note", id = "2615", text = "John xi. 34." },
  { t = "note", id = "2616", text = "John xi. 35." },
  { t = "note", id = "2617", text = "So in Syriac versions." },
  { t = "note", id = "2618", text = "John xi. 36." },
  { t = "note", id = "2619", text = "John xi. 37." },
  { t = "note", id = "2620", text = "John xi. 38." },
  { t = "note", id = "2621", text = "John xi. 39." },
  { t = "note", id = "2622", text = "Borg. ms. omits *some time: he hath been*." },
  { t = "note", id = "2623", text = "John xi. 40." },
  { t = "note", id = "2624", text = "John xi. 41." },
  { t = "note", id = "2625", text = "John xi. 42." },
  { t = "note", id = "2626", text = "John xi. 43." },
  { t = "note", id = "2627", text = "John xi. 44." },
  { t = "p", text = "[29][^2628]And many of the Jews which came unto Mary, when they saw the deed of Jesus, [30] believed in him.[^2629]But some of them went to the Pharisees, and informed them of all that Jesus did." },
  { t = "note", id = "2628", text = "John xi. 45." },
  { t = "note", id = "2629", text = "John xi. 46." },
  { t = "p", text = "[31][^2630]And the chief priests and the Pharisees gathered, and said, What shall we do? [32] for lo, this man doeth many signs.[^2631]And if we leave him thus, all men will believe [33] in him: and the Romans will come and take our country and people.[^2632]And one of them, who was called Caiaphas, the chief priest he was in that year, said unto them, [34][^2633]Ye know not anything, nor consider that it is more advantageous for us that one [35] man should die instead of the people, and not that the whole people perish.[^2634]And this he said not of himself: but because he was the chief priest of[^2635] that year, he [36] prophesied that Jesus was to die instead of the people;[^2636]and not instead of the people alone, but that he might gather the scattered children of God together. [37][^2637]And from that day they considered *how* to kill him." },
  { t = "note", id = "2630", text = "John xi. 47." },
  { t = "note", id = "2631", text = "John xi. 48." },
  { t = "note", id = "2632", text = "John xi. 49." },
  { t = "note", id = "2633", text = "John xi. 50." },
  { t = "note", id = "2634", text = "John xi. 51." },
  { t = "note", id = "2635", text = "So both mss.; but the Vat. ms. had originally a reading equivalent to the text above with *of* omitted." },
  { t = "note", id = "2636", text = "John xi. 52." },
  { t = "note", id = "2637", text = "John xi. 53." },
  { t = "p", text = "[38] [Arabic, p. 146 ][^2638]And Jesus did not walk openly amongst the Jews, but departed thence to a place near the wilderness, to a town[^2639] called Ephraim; and he was there, going [39] about with his disciples.[^2640]And the passover of the Jews was near: and many went [40] up from the villages unto Jerusalem before the feast, to purify themselves.[^2641]And they sought for Jesus, and said one to another in the temple, What think ye of his [41] holding back from the feast?[^2642]And the chief priests and the Pharisees had given commandment, that, if any man knew in what place he was, he should reveal *it* to them, that they might take him." },
  { t = "note", id = "2638", text = "John xi. 54." },
  { t = "note", id = "2639", text = "The Arabic word as printed (following Vat. ms.) means *a place for monks to live in*, but we should certainly restore a diacritical point *over* the last letter, and thus obtain another Syriac loan-word (that used here in the Peshitta), meaning *town*. See also Ibn-at-Tayyib’s Commentary, *ad loc*." },
  { t = "note", id = "2640", text = "John xi. 55." },
  { t = "note", id = "2641", text = "John xi. 56." },
  { t = "note", id = "2642", text = "John xi. 57." },
  { t = "p", text = "[42][^2643]And when the days of his going up were accomplished, he prepared himself that [43] he might go[^2644] to Jerusalem.[^2645]And he sent messengers before him, and departed,[^2646] and [44] entered into a village[^2647] of Samaria, that they might make ready for him.[^2648]And they [45] received him not, because he[^2649] was prepared for going to Jerusalem.[^2650]And when James and John his disciples saw *it*, they said unto him, Our Lord, wilt thou that we speak, and fire come down from heaven, to extirpate them, as did Elijah also? [46][^2651]And Jesus turned, and rebuked them, and said, Ye know not of what spirit ye are. [47][^2652]Verily the Son of man did not come to destroy lives, but to give life. And they went to another village." },
  { t = "note", id = "2643", text = "Luke ix. 51." },
  { t = "note", id = "2644", text = "The present Arabic reading *in going* could pretty easily arise from that assumed in the translation above." },
  { t = "note", id = "2645", text = "Luke ix. 52." },
  { t = "note", id = "2646", text = "This and the following verb are singular in the printed Arabic (against the versions), although Ciasca renders them plural. A copyist using a carelessly written Arabic exemplar might conceivably overlook the plural terminations. Besides, they are often omitted in Syriac mss." },
  { t = "note", id = "2647", text = "*cf*. note, § 1, 40." },
  { t = "note", id = "2648", text = "Luke ix. 53." },
  { t = "note", id = "2649", text = "Lit. *his body*." },
  { t = "note", id = "2650", text = "Luke ix. 54." },
  { t = "note", id = "2651", text = "Luke ix. 55." },
  { t = "note", id = "2652", text = "Luke ix. 56." },
]


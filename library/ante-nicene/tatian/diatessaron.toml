[[section]]
id = "introduction"
title = "Introduction."
level = 1
blocks = [
  { t = "p", text = "The aim of the following introductory paragraphs is neither to furnish a detailed restatement of facts already known, nor to offer an independent contribution to the discussion of the problems that arise, although in other circumstances such an attempt might be made with advantage. All that is needed and practicable here is to describe briefly, if possible, the nature of the connection between the English treatise forming the next part of this volume and the ancient work known as the *Diatessaron* of Tatian; and then to indicate in a few words some of the more important or interesting features of the work itself, and some of the historical and other problems that are in one way or another connected with it." },
  { t = "p", text = "1 *The Text Translated*.—What is offered to the reader is a translation into English of an Arabic text, published at Rome in 1888, in a volume entitled in Arabic *Diatessaron, which Titianus Compiled from the Four Gospels*, with the alternative Latin title, *Tatiani Evangeliorum Harmoniæ, Arabice*. The Roman volume consists of two parts—the text, covering a little over 209 very clearly printed Arabic pages, and a Latin half, comprising a scholarly introduction (pp. v.–xv.), a Latin translation (pp. 1–99), and a table showing the order in which the passages taken from the gospels occur in the text. The editor is P. Agostino Ciasca, a well known Orientalist, “scriptor” at the Vatican Library." },
  { t = "p", text = "2 *Former Translations*.—In his Introduction (p. xiv. f.) Ciasca explains that in his translation he aimed at preserving *quantum*, *salva fidelitate, integrum fuit, indolem stylumque Clementinæ Vulgate*. This Latin version was in its turn translated into English by the Rev. J. Hamlyn Hill, B.D., and published in 1894 in a volume entitled *The Earliest Life of Christ*, with an interesting introduction and a number of valuable appendices. The ms. of Mr. Hill’s translation of the Latin of Ciasca was compared with the Arabic original by Mr. G. Buchanan Gray, M.A., lecturer in Hebrew and the Old Testament in Mansfield College, Oxford." },
  { t = "p", text = "3 *The Present Translation*.—The translation offered here is quite independent of either of these two. Ciasca’s Latin was seldom consulted, except when it was thought the Arabic might perhaps be obscured by a misprint. After the translation was completed, Hill’s English was compared with it to transfer Mr. Hill’s valuable system of references to the margin of this work, and to lessen the risk of oversights passing the last revision unnoticed. In two or three cases this process led to the adoption of a different construction, and in a few of the more awkward passages a word was borrowed as being less harsh than that which had originally been written. Speaking generally, the present version appears to differ from Mr. Hill’s in adhering more closely to the original.[^17]" },
  { t = "note", id = "17", text = "For further explanation of the method followed see 20." },
  { t = "p", text = "4 *The Arabic Text*.—Only two Arabic mss. are known to exist. Ciasca tells us (p. xiv.) that he took as the basis of his text that ms. which is more careful in its orthography, the Cod. Vat. Arab. No. 14. He, however, printed at the foot of the page the variants of the other ms., and supplied from it two lacunæ in the Cod. Vat.,[^18] substituted its readings for those of the Cod. Vat. where he thought them preferable, and followed its testimony in omitting two important passages.[^19] Here and there Ciasca has emended the text, but he does not profess to have produced a critical edition.[^20]" },
  { t = "note", id = "18", text = "See notes to § 7, 47, and § 52, 36, of the present translation." },
  { t = "note", id = "19", text = "See below, 12, (2)." },
  { t = "note", id = "20", text = "See also below, 6, and 20." },
  { t = "p", text = "5 *The Arabic mss.*—Unfortunately, the present writer has not had an opportunity of examining these two mss.; but they have been described at some length by Ciasca; Codex XIV. in Pitra’s *Analecta Sacra*, iv., 465 ff., and the other codex in the volume with which we are dealing, p. vi. ff. I. The former, which we shall call the Vatican ms. (in Ciasca’s footnotes it is called A), was brought to the Vatican from the East by Joseph S. Assemani[^21] about a.d. 1719. It was described by Stephen E. Assemani,[^22] Rosenmüller, and Akerblad,[^23] and then at length by Ciasca, to whose account the reader must be referred for the details. It consists of 123 folios, of which the first seven are somewhat spoiled, and of which two are missing,[^24] and is supposed by Ciasca, from the character of the writing, and from the presence of certain Coptic letters[^25] by the first hand, to have been written in Egypt. S. Assemani assigned it to the twelfth century, and Ciasca accepts his verdict, while Akerblad says the thirteenth or fourteenth century. The text of the ms. is pretty fully vocalised, but there are few diacritical points. There are marginal notes, some of them by a later hand,[^26] which Ciasca classifies as (1) emendations, (2) restorations, (3) explanations. II. The second ms., which we shall call the Borgian (in Ciasca’s footnotes it is called B), was brought to the Borgian Museum from Egypt in August, 1886. It has at the end the following inscription in Arabic: “A present from Halim Dos Ghali, the Copt, the Catholic, to the Apostolic See, in the year of Christ 1886.”[^27] Antonius Morcos, Visitor Apostolic of the Catholic Copts, when, in the beginning of 1886, he was shown and informed about the Vatican ms., told of this other one and was the means of its being sent to Rome. The Borgian ms., which Ciasca refers to the fourteenth century, consists of 355 folios. Folios 1–85[^28] contain an anonymous preface on the gospels, briefly described by Ciasca, who, however, does not say whether it appears to have been originally written in Arabic or to have been translated into that language. With folios 96*b*, 97*a*, which are reproduced in phototype in Ciasca’s edition, begins the Introductory Note given in full at the beginning of the present translation. The text of the *Diatessaron* ends on folio 353*a*, but is followed by certain appendices, for which see below, §55, 17, note. This ms. is complete, and has, as we shall see,[^29] in some respects a better text, though it is worse in its orthography than the Vatican ms." },
  { t = "note", id = "21", text = "*Bibl. Or.*, i., 619." },
  { t = "note", id = "22", text = "Mai, *Vet. script. nova. collect*., iv., 14." },
  { t = "note", id = "23", text = "*cf*. Zahn, *Forschungen*, i., 294 ff." },
  { t = "note", id = "24", text = "See below, § 7, 47, note, and § 52, 36, note." },
  { t = "note", id = "25", text = "See below, § 28, 43, note." },
  { t = "note", id = "26", text = "See below, foot-notes, *passim*." },
  { t = "note", id = "27", text = "The first leaf bears a more pretentious Latin inscription, quoted by Ciasca, p. vi." },
  { t = "note", id = "28", text = "Can this be a misprint for 95?" },
  { t = "note", id = "29", text = "See below, 13." },
  { t = "p", text = "6 *Condition of the Arabic Text*.—Ciasca’s text does not profess to be critically determined, for which purpose a more careful study of each of the mss. and an estimate of their respective texts would be indispensable. Although the Borgian ms. is supposed by Ciasca to be a century or two later than the Vatican ms. it is clearly not a copy of the latter, for not only does it sometimes offer more original readings, but, as we shall see, its text in some points coincides more exactly in scope with the original work. The list of various readings supplied by Ciasca,[^30] which is equal to about a fifth or a quarter of the text itself, ought to yield, on being analysed, some canons of criticism. The footnotes of the present edition are enough to show that a number of the peculiar features of Ciasca’s text do not belong to the original Arabic ms.; and further study would dispose of still more. On the other hand, there are unfortunately some indications[^31] that the common ancestor of both mss., though perhaps less than two centuries removed from the original, was not the original itself, and therefore emendation may be necessary even where both mss. agree. From first to last it has to be borne in mind that a great deal of work was done at Arabic versions of the gospels,[^32] and the text of the copy from which our two mss. are descended may already have suffered from contact with other versions; while the special activity of the thirteenth century may have left its mark in some places on the text of the Borgian ms., supposing it to be chronologically the later." },
  { t = "note", id = "30", text = "He does not state, in so many words, that the list is absolutely exhaustive." },
  { t = "note", id = "31", text = "See, e.g., below, § 13, 42, note, and § 14, 43, note." },
  { t = "note", id = "32", text = "See the valuable article of Guidi, “Le traduzioni degli Evangelii in arabo e in etiopico” (*Atti della R. Accademia dei Lincei; Classe di Scienze Morali, Storiche e filologiche*. *Serie Quarta*, 1888, *Parte Prima*—*Memorie*, pp. 5–38). Some of his results are briefly stated in Scrivener, *A Plain Introd. to the Crit. of the N.T*., 4th ed., ii., 162." },
  { t = "p", text = "7 *Origin of the Arabic Text*.—If some of the uncouthness of the Arabic text is due to corruption in the course of transmission, much is also due to its being not an original work, but a translation. That it is, in the main, a translation from Syriac is too obvious to need proof.[^33] The Introductory Notice and Subscription to the Borgian ms., moreover, expressly state that the work was translated by one Abu’l Faraj ‘Abdulla ibn-at-Tayyib,[^34] an “excellent and learned priest,” and the inferiority of parts of the translation,[^35] and entire absence of any confirmatory evidence,[^36] hardly suffice to refute this assertion. Still, the Borgian ms. is a late witness, and although it most probably preserves a genuine tradition as to the author of our work, its statement need not therefore necessarily be correct in every point." },
  { t = "note", id = "33", text = "*cf.*the foot-notes *passim*, e.g., § 13, 14, § 14, 24." },
  { t = "note", id = "34", text = "See below, note to Subscription." },
  { t = "note", id = "35", text = "See a glaring case in § 52, 11." },
  { t = "note", id = "36", text = "The references to the readings of the *Diatessaron* in Ibn-at-Tayyib’s own commentary on the gospels (see next note) are remarkably impersonal for one who had made or was to make a translation of it." },
  { t = "p", text = "8 *The Arabic Editor and his Method*.—Ibn-at-Tayyib (d. 1043) is a well known man, a Nestorian monk and scholar, secretary to Elias I., Patriarch of Nisibis (for references to sources see, e.g., Ciasca’s Introduction, p. xi. f. and Steinschneider’s long note in his *Polemische und apologetische Lit. in Arabische Sprache*, pp. 52–55). As we are here concerned with him simply as a link in the chain connecting our present work with its original source, the only point of interest for us is the method he followed in producing it. Did he prepare an independent translation or did he make use of existing Arabic versions, his own or others’? Until this question which space forbids us to discuss here, has been more thoroughly investigated,[^37] it must suffice to say that in view of the features in the present text that have not yet been shown to exist in any other Arabic version, it is still at least a tenable hypothesis that Ibn-at-Tayyib’s ms. constituted to a considerable extent a real translation rather than a sort of Arabic parallel to the Codex Fuldensis (see below, 12)." },
  { t = "note", id = "37", text = "A specially important part of the general question is this, What are the mutual relations of the following: (1) a supposed version of at least Matthew and John made from the Syriac by Ibn-at-Tayyib, mentioned by Ibn-al-‘Assal in the Preface to his scholarly recension of the gospels (ms. numbered Or. 3382 in Brit. Mus., folio 384*b*) and used by him in determining his text; (2) the gospel text interwoven with the commentary of Ibn-at-Tayyib on the gospels, a commentary which De Slane says the author wrote in Syriac and then translated into Arabic; (3) our present work. Of mss. testifying to No. 1 we have some dating from the time of Ibn-al-‘Assal himself; of No. 2 we have, in addition to others, an eleventh-century ms. in Paris, described by De Slane (catalogue No. 85) as being “un volume dépareillé du ms. original de l’ouvrage”; of No. 3 we have of course the Vatican and Borgian mss. What is the mutual relation of these texts; were any two of them identical? The Brit. Mus. ms. of the second has many points of contact with the third, but is dated 1805 a.d. Does the older Paris ms. stand more or less closely related? Did Ibn-at-Tayyib himself really translate any or all of these texts, or did he simply select or edit them? Space does not permit us to point out, far less to discuss, the various possibilities." },
  { t = "p", text = "9 *The Syriac Text Translated*—The eleventh century ms. of Ibn-at-Tayyib, could we reach it, would bring us face to face with the more interesting question of the nature of his Syriac original. The Subscription to the Borgian ms. states, probably copying the statement from its exemplar, that this was a. Syriac ms. in the handwriting of ‘Isa ibn-‘Ali al Motatabbib, pupil of Honain ibn Ishak. This Honain was a famous Arabic physician and medical writer of Bagdad (d. 873), whose school produced quite a number of translations and translators, among whom Ibn-‘Ali, supposed to be identical with the Syriac lexicographer of the same name, is known to have had a high place. The Syriac ms., therefore, that Ibn-at-Tayyib translated takes us back to about the year 900. But the Subscription to each of our mss.[^38] states that the work ended is the gospel called *Diatessaron*, compiled from the four gospels by Titianus; while the Introductory Note to the Borgian ms. adds that this Titianus was a Greek. The next step, therefore, is to inquire whether any traces exist of such a Syriac work, or any statements by which we can check the account just given of it." },
  { t = "note", id = "38", text = "The text is given below in full at its proper place." },
  { t = "p", text = "10 *Other Traces of a Syriac Text*.—No copy of a Syriac *Diatessaron* has yet been shown to have survived.[^39] A number of quotations[^40] from such a work have, however, been found in a Syriac commentary on the New Testament by Isho‘dad of Merv (*circ*. 852), a contemporary of Honain, Ibn-‘Ali’s teacher.[^41] The value of these extracts is apparent, for they take us back one generation earlier than Ibn-at-Tayyib’s Syriac exemplar. More important still, they do not entirely agree with the text of our Arabic version. To solve the problem thus raised, we must examine some of the statements about the *Diatessaron* to be found in ecclesiastical writers." },
  { t = "note", id = "39", text = "Prof. Gottheil, indeed, announced in 1892 in the *Journal of Biblical Literature* (vol. xi., pt. i., p. 71) that he had been privately informed of the existence of a complete copy of the Syriac *Diatessaron.* Unfortunately, however, as he has kindly informed me, he has reluctantly come to the conclusion that the ms. in question, which is not yet accessible, is “nothing more than the commentary of Isho‘dad” mentioned in the text. A similar rumor lately circulated probably originated simply in the pamphlet of Goussen mentioned in the next note. S. Bäumer, on the other hand, in his article, “Tatians Diatessaron, seine bisher. Lit. u. die Reconstruction des Textes nach einer neuentdeckten Handschrift” (*Literarischer* *Handweiser*, 1890, 153–169) which the present writer has not been able to see, perhaps refers simply to the Borgian ms." },
  { t = "note", id = "40", text = "Attention was called to these by Profs. Isaac H. Hall and R. J. H. Gottheil (*Journ. of Bibl. Lit*., x., 153 ff.; xi., 68 ff.); then by Prof. J. R. Harris (*Contemp. Rev*., Aug., 1895, p. 271 ff., and, more fully, *Fragments of the Com. of Ephr. Syr. on the Diatess*., London, 1895) and by Goussen (*Studia Theologica*, fasc. i., Lips., 1895)." },
  { t = "note", id = "41", text = "Prof. Harris promises an edition of this commentary." },
  { t = "p", text = "11 *Statements about the Diatessaron*.—One of the most widely known is that of Isho‘dad himself, who, in his Preface to the Gospel of Mark, says: “Tatian, disciple of Justin, the philosopher and martyr, selected from the four gospels, and combined and composed a gospel, and called it *Diatessaron*, i.e., the Combined,…and upon this gospel Mar Ephraem commented.”[^42] Dionysius Bar Salibi (twelfth century) repeats each of these phrases, adding, “Its commencement was, ‘In the beginning was the Word.’”[^43] These statements identify the author of the *Diatessaron* with a man otherwise known, and tell us that the great Syrian father Ephraem (d. 373) wrote a commentary on it. Unfortunately, no Syriac ms. of Ephraem’s work is known to have survived;[^44] but quotations from it, or allusions to it, are being found in other Syriac writers. One further reference will suffice for the present. Theodoret, Bishop of Cyrrhus, four hundred years before Isho‘dad, wrote thus in his book on Heresies (written in 453): “Tatian the Syrian.…This [writer] also composed the gospel which is called *Diatessaron*, cutting out the genealogies and whatever other passages show that the Lord was born of the seed of David according to the flesh.”[^45] Before examining the testimonials we have now adduced, we must notice certain more remote sources of information." },
  { t = "note", id = "42", text = "Harris, *Fragments*, p. 14, where the Syriac text is quoted." },
  { t = "note", id = "43", text = "*Bib. Or*., ii., 159 f. Most of them are repeated again by Bar Hebræus (d. 1286), although some confusion is produced by his interweaving some phrases from Eusebius of Cæsarea. (*Bib. Or*., i., 57 f., and a longer quotation in English in *Contemp. Rev*., Aug., 1895, p. 274 f.)" },
  { t = "note", id = "44", text = "Lagarde’s statement (*Nachrichten von der Königl. Gesellsch. der Wiss., etc., zu Göttingen,* 1891, No. 4, p. 153) that a ms. had been discovered, appears to have been unfounded. Prof. Rahlfs of Göttingen kindly tells me that he believes this is so." },
  { t = "note", id = "45", text = "Migne, *Patrol. græc*., tom. lxxxiii., col. 369, 372." },
  { t = "p", text = "12 *Non-Syriac Texts of the Diatessaron*.—Although Ephraem’s Syriac commentary on the *Diatessaron* is for the present lost, there is an Armenian version of it[^46] extant in two mss. dating from about the time of Bar Salibi and our Vat. ms.[^47] A Latin translation of this work, published in 1876 by Moesinger,[^48] formed the main basis of Zahn’s attempt[^49] to reconstruct the *Diatessaron*. Appendix X in Hill’s *Diatessaron* (pp. 334–377) contains an English translation of the texts commented on by Ephraem, made from Moesinger’s Latin, but collated with the Armenian by Professor J. Armitage Robinson, of Cambridge. A comparison of this document with our Arabic text shows a remarkable agreement in the order and contents, but just as remarkable a lack of agreement in the kind of text presented. The same phenomenon is met with when we compare our Arabic text with a document that carries us back three hundred years before the time of Isho‘dad, and therefore more than six hundred years before the Armenian mss.—the Codex Fuldensis of the Vulgate.[^50] This ms. contains an arrangement of the gospel matter that its discoverer and publisher, Bishop Victor of Capua (d. 554), rightly concluded must represent the *Diatessaron* of Tatian, but for the text of which was apparently substituted that of the Vulgate.[^51] We are now ready to weigh the testimony we have gathered.[^52]" },
  { t = "note", id = "46", text = "Published at Venice in 1836." },
  { t = "note", id = "47", text = "The two Armenian mss. are dated a.d. 1195." },
  { t = "note", id = "48", text = "*Evangelii Concordantis Expositio, facta* *a S. Ephraemo* (Ven., 1876)." },
  { t = "note", id = "49", text = "*Forschungen zur Geschichte des neutestamentlichen Kanons*, I. Theil." },
  { t = "note", id = "50", text = "Edited by Ernestus Ranke, Marb. and Lips., 1868." },
  { t = "note", id = "51", text = "For other forms of the *Diatessaron*, of no critical importance, see S. Hemphill*, The Diatessaron of Tatian* (London, 1888), Appendix D and the refs. there." },
  { t = "note", id = "52", text = "Further references, chiefly repetitions in one form or another of the statements we have quoted, may be found in a convenient form in Harnack, *Gesch. d. altchrist. Lit. bis. Euseb*., 493–496; *cf*. also the works mentioned by Hill (*op. cit*.) p. 378 f." },
  { t = "p", text = "13 *Accretions to the Diatessaron*.—The statements we are to consider are: (1) Bar Salibi’s, that Tatian’s *Diatessaron* began with “In the beginning was the Word”;[^53] (2) Theodoret’s, that Tatian cut out the genealogies; and (3) the same writer’s, that Tatian also cut out “whatever other passages show that the Lord was born of the seed of David according to the flesh.” Of these statements 1 conflicts with the Arabic text, which begins with Mark, and the Codex Fuldensis, which begins with Luke, but agrees with the Ephraem source; the same is true of 2; while 3 conflicts with all three texts. Our limits do not admit of our discussing these points in detail. It must suffice to say (1) that, although a more careful examination at firsthand of the introductory notices in the two Arabic mss. seems needed before one can venture to propound a complete theory, a comparison of the two texts, and a consideration of the descriptions given by Ciasca and Lagarde,[^54] make it almost certain that the genuine Arabic text of Ibn-at-Tayyib began with John i. 1. Similarly the first four verses of Luke (on which see also below, § 1. 6, note) were probably not in the original text of the ms. that Victor found, for they are not mentioned in the (old) table of contents. We seem thus to detect a process of gradual accretion of material drawn from the ordinary gospel text. (2) The genealogies illustrate the same process. In the Vatican ms. they form part of the text.[^55] But in the Borgian ms., although they precede the Subscription, and therefore *may* have been already in the ninth century Syriac ms. used by Ibn-at-Tayyib, they are still placed by themselves, after a blank space, at the end of the volume, with a title of their own.[^56] Here, therefore, we actually see stages of the process of accretion. (3) It is therefore possible that the same account must also be given of 3, although in this case we have no direct proof." },
  { t = "note", id = "53", text = "*cf*. the words of Aphraates, senior contemporary of Ephraem: “As it is written in the beginning of the Gospel of our Vivifier: In the beginning was the Word.” (*Patrol. Syr.*, pars i., tom. i., 21, lines 17–19)." },
  { t = "note", id = "54", text = "*Nachrichten von der Königl. Gesellsch. der Wiss*., etc., March 17, 1886, No. 4, p. 151 ff." },
  { t = "note", id = "55", text = "See notes to § 1, 81, and § 4, 29." },
  { t = "note", id = "56", text = "See note to § 55, 17." },
  { t = "p", text = "14 *Passages Lost from the Diatessaron*.—If the Diatessaron has thus been growing so as to represent the ordinary text of the canonical gospels more completely, we have also evidence that suggests that it has been at some time or times purged of certain features that are lacking in these canonical gospels. For one case of this kind see below, §4, 36, note." },
  { t = "p", text = "15 *Presentation of the Text of the Diatessaron*.—We have observed already that the Latin, Armenian, and Arabic *Diatessarons* correspond pretty closely in subject matter and arrangement, but differ markedly in text. The Codex Fuldensis is really a ms. of the Vulgate, although the text that Victor found was probably somewhat different. The Armenian text differs materially from the ordinary Syriac version of the New Testament (the Peshitta), showing a marked connection with another type of Syriac text represented now by the Curetonian and Sinaitic (Lewis) mss. The Arabic text, on the other hand, almost systematically represents the Peshitta. The explanation of the condition of text in the Codex Fuldensis is obvious. On the other hand, the relationship of the Armenian and Arabic texts to the original *Diatessaron* must be determined by weighing very multifarious evidence that cannot be even cited here (see above 6 ff.). The two texts depend, as we have seen, on late mss. but all the earlier references and quotations go to show that the Armenian text[^57] stands much more closely related to the original than does the Arabic." },
  { t = "note", id = "57", text = "The Armenian version of Ephraem is supposed to date from the fifth century." },
  { t = "p", text = "16 *Checkered History of the Diatessaron*.—What use the Arabic edition of Ibn-at-Tayyib was put to when made we do not know. ‘Abd Isho‘ (d. 1318) speaks in the highest terms of Tatian’s work, saying, “…With all diligence he attended to the utmost degree to the right order of those things which were said and done by the Saviour; of his own he did not add a single saying.”[^58] But the leaders of the Syrian church had not always thought so. Theodoret (*loc. cit*.) some nine hundred years earlier had written thus: “…Even those that follow the apostolic doctrines, not perceiving the mischief of the composition,” used “the book too simply as an abridgment.” A few years earlier Rabbula, Bishop of Edessa (d. 435), had said:[^59] “Let the presbyters and deacons give heed that in all the churches there be provided and read a copy of the Distinct Gospel,” i.e., not the harmonized or mixed gospel. But obviously these men were trying to suppress traditional practice due to very different views. Theodoret (*loc. cit*.) found more than two hundred copies of the work “held in respect in the churches”; and the *Doctrine of Addai* (Edessa, third to fourth century) seems simply to identify the *Diatessaron* and the New Testament.[^60] Outside of the Syriac speaking churches we find no signs of any such use of the *Diatessaron*. It would seem, therefore, that at a quite early stage the *Diatessaron* was very widely if not universally read in the Syriac churches, and commented on by scholars as the gospel; that in time it fell under the condemnation of some at least of the church leaders, who made violent efforts to suppress it; that it could not be suppressed; that a commentary on it was (perhaps in the fifth century[^61]) translated into Armenian; that it was still discussed by commentators, and new Syriac mss. of it made in the ninth century, and thought worth the labor of reproduction in Arabic in the beginning of the eleventh century; that mss. of the Armenian volume continued to be made down to the very end of the twelfth century, and of the Arabic edition down to the fourteenth century; but that this long life was secured at the expense of a more or less rapid assimilation of the text to that of the great Syriac Bible which from the fourth century onwards became more and more exclusively used—the Peshitta." },
  { t = "note", id = "58", text = "Mai, *Script. vet. nov. Coll*., x., 191." },
  { t = "note", id = "59", text = "Overbeck, S. *Ephraemi*, etc., *Opera Selecta*, p. 220, lines 3–5." },
  { t = "note", id = "60", text = "Phillips, *Doct. Add*., p. 36, 15–17 [E. Tr. p. 34 ]." },
  { t = "note", id = "61", text = "Moesinger, *Evang. Concord*., etc., p. xi." },
  { t = "p", text = "17 *The Author of the Diatessaron*.—The *Diatessaron* is such an impersonal work that we do not need to know very much about its compiler.[^62] It will suffice here to say that he tells us himself that he was born “in the land of the Assyrians,” and brought up a heathen. After travelling in search of knowledge, he settled at Rome, where he became a pupil of Justin Martyr, professed Christianity, and wrote in Greek his *Address to the Greeks*,[^63] translated in vol. iii. of the *Ante-Nicene Christian Library*. He was too independent in his attitude to maintain a permanent popularity, and after Justin’s death left Rome and returned to Mesopotamia. It was probably here that he issued in Syriac his most important work, the *Diatessaron*, which won such a warm place in the heart of the Syrian church. Among the Greek scholars, however, he became more and more regarded as a heretic, Encratite (ascetic), and Gnostic." },
  { t = "note", id = "62", text = "The latest discussion of the question whether this really was Tatian is Mr. Rendel Harris’s article in the *Contemp. Rev*., Aug., 1895." },
  { t = "note", id = "63", text = "Best ed. by Eduard Schwartz, in *Texte und Untersuchungen*, IV. Band, Heft 1." },
  { t = "p", text = "18 *The Diatessaron as a Harmony*.—Not very much need be said on this subject, as every reader can collect the facts for himself. In its present form the Harmony draws from all the four canonical gospels, and from very little else. Opinions differ as to whether it originally indicated the gospel from which any given piece was drawn, and some uncertainty must remain in special cases as to what gospel actually has been drawn upon. Professor G. F. Moore, in a very interesting article on the *Diatessaron*,[^64] having counted the references in the Arabic mss., states that the Arabic text contains 50 percent of Mark, 66 percent of Luke, 76.5 percent of Matthew, and 96 percent of John. The summation of his figures gives the following result: out of a total of 3780 verses in the four gospels, the *Diatessaron* quotes 2769 and omits 1011. As to the order in which the whole is arranged, Moore thinks that Matthew has chiefly been followed; while Zahn regards the Fourth Gospel as normative. For a specimen of the way in which words and phrases from the different gospels are woven together, we may refer to § 52, 35 ff., and the notes thereon. In the Arabic mss., and probably in the Syriac exemplar, the work is divided into fifty-four almost equal chapters, followed by one short one—a feature that agrees well with what we have learned of the work as being of old the lectionary of the Syrian church." },
  { t = "note", id = "64", text = "“Tatian’s *Diatessaron* and the Analysis of the Pentateuch,” *Journ. of Bibl. Lit*., vol. ix., 1890, pt. ii., 201–215." },
  { t = "p", text = "19 *Problems Connected with the Diatessaron*.—The *Diatessaron* opens up a very wide field of study. A few points may be here enumerated (see also above, 8, and note there). In what language was it written? On the view favoured by an increasing majority of scholars, that it was written in Syriac, was it a translation or simply a compilation? What precisely is its relation to the Syriac versions and the “Western” text generally? Then there is its bearing on the date and formation of the canonical gospels; the phenomenon of its so long supplying the place of those gospels; the analogy it presents to the Pentateuch, according to the critical view of the origin of the latter. These and other issues make the *Diatessaron* an important and interesting study." },
  { t = "p", text = "20 *The Present Translation*.—The work of translation has been found much more tedious than was anticipated, notwithstanding the fact that considerably more than half of it is the work of my wife, which I have simply revised with special attention to the many obscurities dealt with in the footnotes. We have, however, worked so much together that it is very doubtful whether any one could assign the various parts to their respective sources. My wife also verified the Arabic references to the gospels printed on the margin to the right of the text,[^65] and prepared the Index to these references—an extremely laborious and perplexing piece of work. This Index is inserted merely for the practical purpose of enabling the reader to find any given gospel piece in the Diatessaron. When a verse is not found in the Index, an equivalent passage from some of the other gospels should be looked for. On the margin to the left of the text are indicated the pages of the Arabic text and the sections and verses in Hill’s version.[^66]" },
  { t = "note", id = "65", text = "The refs., except where the foot-notes indicate otherwise, are to the verses of the English or Greek Bible. The numbers of the Arabic verse refs. (which follow the Vulgate and therefore in one or two passages differ from the English numbers by one) may, however, have been occasionally retained through oversight. It is only the name of the gospel that can possibly be ancient." },
  { t = "note", id = "66", text = "It may be mentioned that it has been found very convenient to mark these figures on the margin of the Arabic text. An English index (that given here, or that in Hill’s volume) can then be used for the Arabic text also." },
  { t = "p", text = "The aim has been to make a literal translation. As two freer translations already exist, it seemed best to incline to the side of being overliteral. If, however, features due simply to *Arabic* idiom have been preserved, this is an oversight. Uniformity could only have been secured by devoting a much longer time to the work than the editor was able to allow. The difficulties are due to the corrupt state of the Arabic text,[^67] and to the awkward reproduction[^68] or actual misunderstanding[^69] of the Syriac original by the author or authors of the Arabic translation. It has been impossible to maintain consistency in dealing with these phenomena. If any rendering seem strange, it will be well to consult the Syriac versions before deciding that it is wrong. A good deal of attention, too, has to be paid to the usage of the Arabic text, which, though it has many points of contact with other Arabic versions of the gospels, e.g., the ms. described by Gildemeister (*De evangg. in arab. e simp. Syr*., 1865), is as yet for us (see above, 8) a distinct version, possessed of an individuality of its own, one pronounced feature being its very close adherence to its Syriac original. Another revision of the present translation, in the light of a fuller study of these features, would doubtless lead to changes both in the text and in the footnotes. The latter aim at preventing misunderstanding and giving some examples of the peculiarities of the text, and of the differences between the mss. To have dealt systematically with the text and various readings would have required much more time and space than was available. The consequence of this incompleteness has been some uncertainty at times what text to translate. As already stated (paragraphs 4 and 6), Ciasca’s printed text neither represents any one ms. nor professes to be based in its eclecticism on any systematic critical principles. On the whole Ciasca has here been followed somewhat mechanically in deciding what to exhibit in the text and what to relegate to the footnotes. As a rule conjectural emendations have not been admitted into the *text* except where the ms. readings would hardly bear translation. Italics in the text denote words supplied for the sake of English idiom; in the footnotes, quotations from the mss. It is to be noted that many linguistic usages said, for shortness, in the footnotes to be characteristic of the present work, i.e., as compared with ordinary Arabic, are common in Arabic versions. “Syriac versions” means the three (Pesh., Cur., Sin.), or as many of them as contain the passage in question; if the Peshitta alone is quoted, it may be assumed that Cur. and Sin. are missing or diverge." },
  { t = "note", id = "67", text = "e.g., § 8, 10. For a list of suggested emendations see at end of Index." },
  { t = "note", id = "68", text = "e.g., § 52, 11." },
  { t = "note", id = "69", text = "e.g., § 45, 33." },
  { t = "p", text = "In conclusion we may say that an effort has been made to preserve even the order of words; but it must be emphasized that it is very doubtful whether it is wise for any one to use the Arabic *Diatessaron* for critical purposes who is not acquainted with Arabic and Syriac. The tenses, e.g., are much vaguer in Arabic than in Greek and English, and are, moreover, in this work often accommodated to Syriac idiom. The Greek and the Revised Version have been used to determine in almost every case how the vague Arabic tenses and conjunctions should be rendered. It is therefore only where it *differs* from these that our translation can be quoted without investigation as giving positive evidence." },
  { t = "p", text = "This is not a final translation. Few books have had a more remarkable literary history than the *Diatessaron*, and that history is by no means done. Much careful argument will yet be devoted to it, and perhaps discoveries as important as any hitherto made are yet to shed light on the problems that encircle it. If our work can help any one to take a step in advance, we shall not regret the toil." },
  { t = "p", text = "Oxford, 21st December, 1895." },
]

[[section]]
id = "introductory-notes"
title = "Introductory Notes."
level = 1
blocks = [
  { t = "h", text = "1. In the Borgian Ms." },
  { t = "p", text = "In the name of the one God, the Father, and the Son, and the Holy Spirit, to him be the glory forever. We shall begin, with the help of God most high, the writing of the pure gospel, the blooming garden, called *Diatessaron* (a word meaning “fourfold”), the work compiled by Titianus the Greek out of the four evangelists—Matthew the elect, whose symbol is M, Mark the chosen, whose symbol is R, Luke the approved, whose symbol is K, and John the beloved, whose symbol is H. The work was translated from Syriac into Arabic by the excellent and learned priest Abu’l Faraj ‘Abdulla ibn-at-Tayyib,[^70] may God grant him his favour. He began with the first of[^71] And he said: The Beginning[^72] of the Gospel of Jesus the Son of the living God. John:[^73] In the beginning, etc." },
  { t = "note", id = "70", text = "The ms. here has *Tabib*, but the name is correctly given in the Subscription (*q.v*.)." },
  { t = "note", id = "71", text = "i.e., simply *He began with*." },
  { t = "note", id = "72", text = "The vowel signs as printed by Ciasca imply some such construction as*And he said as a beginning: The Gospel*, etc. But the vocalisation is of course not authoritative, and a comparison with the preface in the Vatican ms. suggests the rendering given above. The word translated *Beginning* in the two Introductory Notes is the very word (whichever spelling be adopted) used by Ibn-at-Tayyib himself in his comments on Mark i. (at least according to the Brit. Mus. ms.), although not in the gospel text prefixed to the Comments *as it now stands*, or indeed in any ms. Arabic gospel in the Brit. Mus. This would seem to militate against our theory of the original form of this much-debated passage in the Introductory Notes, as indicated by the use of small type for the later inserted phrases; and the difficulty appears at first to be increased by the following words in Ibn-at-Tayyib’s comments on Mark i. (Brit. Mus. ms., fol. 190a), and some say that the Greek citation *and in the Diatessaron, which Tatianus the pupil of Justianus the philosopher wrote, the quotation is not written*, “Isaiah,” but, “as it is written in the prophet.” This is a remarkable statement about the *Diatessaron*. But the sentence is hardly grammatical. Perhaps the words printed in italics originally formed a complete sentence by themselves, possibly on the margin. If this conjecture be correct we might emend, e.g., by restoring them to the margin, and repeating the last three words or some equivalent phrase in the text. It would be interesting to know how the Paris ms. reads. See below, p. 138 (Suggested Emendations)." },
  { t = "note", id = "73", text = "Ciasca does not state whether the word *John* occurs here in the Borgian ms. or not." },
  { t = "h", text = "2. In the Vatican ms." },
  { t = "p", text = "In the name of the Father, and the Son, and the Holy Spirit, giver of life, the God that is one in substance in his essence, and three in persons in his attributes. The first of his Gospel is He began the first of his Gospel with Mark. And he said: The Beginning[^74] of the Gospel of Jesus the Son of the living God. John: In the beginning, etc." },
  { t = "note", id = "74", text = "The vowel signs as printed by Ciasca imply some such construction as*And he said as a beginning: The Gospel*, etc. But the vocalisation is of course not authoritative, and a comparison with the preface in the Vatican ms. suggests the rendering given above. The word translated Beginning in the two Introductory Notes is the very word (whichever spelling be adopted) used by Ibn-at-Tayyib himself in his comments on Mark i. (at least according to the Brit. Mus. ms.), although not in the gospel text prefixed to the Comments *as it now stands*, or indeed in any ms. Arabic gospel in the Brit. Mus. This would seem to militate against our theory of the original form of this much-debated passage in the Introductory Notes, as indicated by the use of small type for the later inserted phrases; and the difficulty appears at first to be increased by the following words in Ibn-at-Tayyib’s comments on Mark i. (Brit. Mus. ms., fol. 190a), and some say that the Greek citation *and in the Diatessaron, which Tatianus the pupil of Justianus the philosopher wrote, the quotation is not written*, “Isaiah,” but, “as it is written in the prophet”. This is a remarkable statement about the *Diatessaron*. But the sentence is hardly grammatical. Perhaps the words printed in italics originally formed a complete sentence by themselves, possibly on the margin. If this conjecture be correct we might emend, e.g., by restoring them to the margin, and repeating the last three words or some equivalent phrase in the text. It would be interesting to know how the Paris ms. reads. See below, p. 138 (Suggested Emendations)." },
]

[[section]]
id = "section-1"
title = "Section I."
level = 1
blocks = [
  { t = "h", text = "The Text of the Diatessaron." },
  { t = "h", text = "[Section I]" },
  { t = "p", text = "[1][^75]In the beginning was the Word, and the Word was with God, and God is the [2,3] Word.[^76]This *was* in the beginning with God.[^77]Everything was by his hand, and [4] without him not even one existing thing was *made*.[^78]In him was life, and the life [5] is the light of men.[^79]And the light shineth in the darkness, and the darkness apprehended it not." },
  { t = "note", id = "75", text = "John i. 1." },
  { t = "note", id = "76", text = "John i. 2." },
  { t = "note", id = "77", text = "John i. 3." },
  { t = "note", id = "78", text = "John i. 4." },
  { t = "note", id = "79", text = "John i. 5." },
  { t = "p", text = "[6][^80][^81]There was in the days of Herod the king a priest whose name was Zacharias, of the family of Abijah; and his wife was of the daughters of Aaron, and her name [7] was Elizabeth.[^82]And they were both righteous before God, walking in all his commands, [8] and in the uprightness of God without reproach.[^83]And they had no son, for [9] Elizabeth was barren, and they had both advanced in age.[^84]And while he discharged [10] [Arabic, p. 2 ] the duties of priest in the order of his service before God,[^85]according to the custom of the priesthood it was his turn to burn incense; so he entered the [11] temple of the Lord.[^86]And the whole gathering of the people were praying without at the [12] time of the incense.[^87]And there appeared unto Zacharias the angel of the Lord, standing [13] at the right of the altar of incense;[^88]and Zacharias was troubled when he saw him, [14] and fear fell upon him.[^89]But the angel said unto him, Be not agitated,[^90] Zacharias, for thy prayer is heard, and thy wife Elizabeth shall bear thee a son, and thou shalt [15] call his name John;[^91]and thou shalt have joy and gladness, and many shall rejoice [16] at his birth.[^92]And he shall be great before the Lord, and shall not drink wine nor strong drink, and he shall be filled with the Holy Spirit[^93] while he is in his mother’s [17] womb.[^94]And he shall turn back many of the children of Israel to the Lord their [18] God.[^95]And he shall go before him in the spirit, and in the power of Elijah the prophet, to turn back the heart of the fathers to the sons, and those that obey not to the knowledge[^96] of the righteous; and to prepare for the Lord a perfect people. [19][^97]And Zacharias said unto the angel, How shall I know this, since I am an old man [20] and my wife is advanced in years?[^98]And the angel answered and said unto him, I am Gabriel, that standeth before God; and I was sent to speak unto thee, and give [21] thee tidings of this.[^99]Henceforth thou shalt be speechless, and shalt not be able to speak until the day in which this shall come to pass, because thou didst not trust [22] this my word, which shall be accomplished in its time.[^100]And the people were standing [Arabic, p. 3 ] awaiting Zacharias, and they were perplexed at his delaying in the temple. [23][^101]And when Zacharias went out, he was not able to speak unto them: so they knew that he had seen in the temple a vision; and he made signs unto them, and [24] continued dumb.[^102]And when the days of his service were completed, he departed to his dwelling." },
  { t = "note", id = "80", text = "On the margin of the Vatican ms., fol. 1*a*, are written by a later hand these words, *The first of his Gospel*. *The first of the Evangel* (*is*) *the Gospel of Luke*; followed by the text of the first four verses of Luke, and that in turn by the words, *Four complete Gospels*, Matthew, and Mark, and Luke, and John. See Ciasca’s *Essay*, cited above (Introduction, 5), p. 468." },
  { t = "note", id = "81", text = "Luke i. 5." },
  { t = "note", id = "82", text = "Luke i. 6." },
  { t = "note", id = "83", text = "Luke i. 7." },
  { t = "note", id = "84", text = "Luke i. 8." },
  { t = "note", id = "85", text = "Luke i. 9." },
  { t = "note", id = "86", text = "Luke i. 10." },
  { t = "note", id = "87", text = "Luke i. 11." },
  { t = "note", id = "88", text = "Luke i. 12." },
  { t = "note", id = "89", text = "Luke i. 13." },
  { t = "note", id = "90", text = "This word is constantly recurring in the sense of *fear*." },
  { t = "note", id = "91", text = "Luke i. 14." },
  { t = "note", id = "92", text = "Luke i. 15." },
  { t = "note", id = "93", text = "Everywhere, except in the introductory notes, the Arabic is *the Spirit of Holiness*, as in the Arabic versions." },
  { t = "note", id = "94", text = "Luke i. 16." },
  { t = "note", id = "95", text = "Luke i. 17." },
  { t = "note", id = "96", text = "See § 28, 17, note." },
  { t = "note", id = "97", text = "Luke i. 18." },
  { t = "note", id = "98", text = "Luke i. 19." },
  { t = "note", id = "99", text = "Luke i. 20." },
  { t = "note", id = "100", text = "Luke i. 21." },
  { t = "note", id = "101", text = "Luke i. 22." },
  { t = "note", id = "102", text = "Luke i. 23." },
  { t = "p", text = "[25][^103]And after those days Elizabeth his wife conceived; and she hid herself five [26] months, and said,[^104]This hath the Lord done unto me in the days when he looked upon me, to remove my reproach from among men." },
  { t = "note", id = "103", text = "Luke i. 24." },
  { t = "note", id = "104", text = "Luke i. 25." },
  { t = "p", text = "[27][^105]And[^106] in the sixth month Gabriel the angel was sent from God to Galilee[^107] to a [28] city called Nazareth,[^108]to a virgin given in marriage to a man named Joseph, of the [29] house of David; and the virgin’s name was Mary.[^109]And the angel entered unto her and said unto her, Peace be unto thee, thou who art filled with grace. Our Lord [30] is with thee, thou blessed amongst women.[^110]And she, when she beheld, was agitated [31] at his word, and pondered what this salutation could be.[^111]And the angel said unto [32] her, Fear not, Mary, for thou hast found favour with God.[^112]Thou shalt now conceive, [33] and bear a son, and call his name Jesus.[^113]This shall be great, and shall be called the Son of the Most High; and the Lord God will give him the throne of [34] David his father: and he shall rule over the house of Jacob for ever;[^114]and to his [35] kingdom there shall be no end.[^115]Mary said unto the angel, How shall this be to [36] me when no man hath known me?[^116]The angel answered and said unto her, The [Arabic, p. 4 ] Holy Spirit will come, and the power of the Most High shall rest upon thee, and therefore shall *he* that is born of thee be pure, and shall be called the Son [37] of God.[^117]And lo, Elizabeth thy kinswoman, she also hath conceived a son in her old [38] age; and this is the sixth month with her, her that is called barren.[^118]For nothing is [39] difficult for God.[^119]Mary said, Lo, I am the handmaid of the Lord; let it be unto me according unto thy word. And the angel departed from her." },
  { t = "note", id = "105", text = "Luke i. 26." },
  { t = "note", id = "106", text = "The Vat. ms. has over this verse, *The second section, from the Gospel of Luke*, i.e., as divided in the Syriac and Arabic versions." },
  { t = "note", id = "107", text = "The Borgian ms. omits *to Galilee*." },
  { t = "note", id = "108", text = "Luke i. 27." },
  { t = "note", id = "109", text = "Luke i. 28." },
  { t = "note", id = "110", text = "Luke i. 29." },
  { t = "note", id = "111", text = "Luke i. 30." },
  { t = "note", id = "112", text = "Luke i. 31." },
  { t = "note", id = "113", text = "Luke i. 32." },
  { t = "note", id = "114", text = "Luke i. 33." },
  { t = "note", id = "115", text = "Luke i. 34." },
  { t = "note", id = "116", text = "Luke i. 35." },
  { t = "note", id = "117", text = "Luke i. 36." },
  { t = "note", id = "118", text = "Luke i. 37." },
  { t = "note", id = "119", text = "Luke i. 38." },
  { t = "p", text = "[40][^120]And then Mary arose in those days and went in haste into the hill country,[^121] to a[^122] [41] city of Judah;[^123]and entered into the house of Zacharias, and asked for the health of [42] Elizabeth.[^124]And when Elizabeth heard the salutation of Mary, the babe leaped in [43] her womb.[^125]And Elizabeth was filled with the Holy Spirit; and cried with a loud voice and said unto Mary, Blessed art thou amongst women, and blessed is the [44] fruit that is in thy womb.[^126]Whence have I this *privilege*, that the mother of my [45] Lord should come unto me?[^127]When the sound of thy salutation reached my ears, [46] with great joy rejoiced the babe in my womb.[^128]And blessed is she who believed [47] that what was spoken *to her* from the Lord would be fulfilled.[^129]And Mary said," },
  { t = "note", id = "120", text = "Luke i. 39." },
  { t = "note", id = "121", text = "Vat. ms., like that described by Gildemeister (see Introduction, 20) has *into Galilee* (*cf*. § 8, 10, note)." },
  { t = "note", id = "122", text = "Lit. *the*, a form due to Syriac influence (*cf*. § ii. 12, and *passim*)." },
  { t = "note", id = "123", text = "Luke i. 40." },
  { t = "note", id = "124", text = "Luke i. 41." },
  { t = "note", id = "125", text = "Luke i. 42." },
  { t = "note", id = "126", text = "Luke i. 43." },
  { t = "note", id = "127", text = "Luke i. 44." },
  { t = "note", id = "128", text = "Luke i. 45." },
  { t = "note", id = "129", text = "Luke i. 46." },
  { t = "p", text = "My soul doth magnify the Lord," },
  { t = "p", text = "[48][^130]And my spirit hath rejoiced in God my Saviour," },
  { t = "note", id = "130", text = "Luke i. 47." },
  { t = "p", text = "[49][^131]Who hath looked upon the low estate of his handmaiden:" },
  { t = "note", id = "131", text = "Luke i. 48." },
  { t = "p", text = "Lo, henceforth, all generations[^132] shall pronounce blessing on me." },
  { t = "note", id = "132", text = "The Arabic word ordinarily means *tribe* or *nation*, but in this work it regularly represents the Syriac word used in the N.T. for *generation*." },
  { t = "p", text = "[50][^133]For[^134] he hath done great things for me, who is mighty," },
  { t = "note", id = "133", text = "Luke i. 49." },
  { t = "note", id = "134", text = "The Arabic would naturally be rendered, *the blessing on me, That*; but a number of passages in this work seem to justify the rendering given in the text (*cf*., e.g., § 46, 54, and especially § 15, 40)." },
  { t = "p", text = "And holy is his name." },
  { t = "p", text = "[51][^135]And his mercy embraceth them who fear him," },
  { t = "note", id = "135", text = "Luke i. 50." },
  { t = "p", text = "Throughout the ages and the times." },
  { t = "p", text = "[52] [Arabic, p. 5 ][^136]He wrought the victory with his arm," },
  { t = "note", id = "136", text = "Luke i. 51." },
  { t = "p", text = "And scattered them that prided themselves in their opinions." },
  { t = "p", text = "[53][^137]He overthrew them that acted haughtily from their thrones," },
  { t = "note", id = "137", text = "Luke i. 52." },
  { t = "p", text = "And raised the lowly." },
  { t = "p", text = "[54][^138]He satisfied with good things the hungry," },
  { t = "note", id = "138", text = "Luke i. 53." },
  { t = "p", text = "And left the rich without anything." },
  { t = "p", text = "[55][^139]He helped Israel his servant," },
  { t = "note", id = "139", text = "Luke i. 54." },
  { t = "p", text = "And remembered his mercy" },
  { t = "p", text = "[56][^140](According as he spake with our fathers)" },
  { t = "note", id = "140", text = "Luke i. 55." },
  { t = "p", text = "Unto Abraham and unto his seed for ever." },
  { t = "p", text = "[57][^141]And Mary abode with Elizabeth about three months, and returned unto her house." },
  { t = "note", id = "141", text = "Luke i. 56." },
  { t = "p", text = "[58, 59][^142]And Elizabeth’s time of delivery was come; and she brought forth a son.[^143]And her neighbours and kinsfolk heard that God had multiplied his mercy towards her; [60] and they rejoiced with her.[^144]And when[^145] it was the eighth day, they came to circumcise the child, and called him Zacharias, *calling him* by the name of his father. [61][^146]And his mother answered and said unto them, Not so; but he shall be called John. [62][^147]And they said unto her, There is no man of thy kindred that is called by this name. [63, 64][^148]And they made signs to his father, *saying*, How dost thou wish to name him?[^149]And he asked for a tablet, and wrote and said, His name is John. And every one wondered. [65][^150]And immediately his mouth was opened, and his tongue, and he spake and [66] praised God.[^151]And fear fell on all their neighbours: and this was spoken of[^152] in all [67] the mountains of Judah.[^153]And all who heard pondered in their hearts and said, What shall this child be? And the hand of the Lord was with him." },
  { t = "note", id = "142", text = "Luke i. 57." },
  { t = "note", id = "143", text = "Luke i. 58." },
  { t = "note", id = "144", text = "Luke i. 59." },
  { t = "note", id = "145", text = "The text is indistinct in the Vat. ms. The reading seems to be conflate, the doublets being *when it was*, which is the reading of Ibn-at-Tayyib’s Commentary, and *on*." },
  { t = "note", id = "146", text = "Luke i. 60." },
  { t = "note", id = "147", text = "Luke i. 61." },
  { t = "note", id = "148", text = "Luke i. 62." },
  { t = "note", id = "149", text = "Luke i. 63." },
  { t = "note", id = "150", text = "Luke i. 64." },
  { t = "note", id = "151", text = "Luke i. 65." },
  { t = "note", id = "152", text = "Lit. *described* (*cf*. § ii. 46)." },
  { t = "note", id = "153", text = "Luke i. 66." },
  { t = "p", text = "[68][^154]And Zacharias his father was filled with the Holy Spirit, and prophesied and said," },
  { t = "note", id = "154", text = "Luke i. 67." },
  { t = "p", text = "[69][^155]Blessed is the Lord, the God of Israel," },
  { t = "note", id = "155", text = "Luke i. 68." },
  { t = "p", text = "Who hath cared for his people, and wrought for it salvation;" },
  { t = "p", text = "[70][^156]And hath raised for us the horn of salvation" },
  { t = "note", id = "156", text = "Luke i. 69." },
  { t = "p", text = "[Arabic, p. 6 ] In the house of David his servant" },
  { t = "p", text = "[71][^157](As he spake by the mouth of his holy prophets from eternity)," },
  { t = "note", id = "157", text = "Luke i. 70." },
  { t = "p", text = "[72][^158]That he might save us from our enemies," },
  { t = "note", id = "158", text = "Luke i. 71." },
  { t = "p", text = "And from the hand of all them that hate us." },
  { t = "p", text = "[73][^159]And he hath performed his mercy towards our fathers," },
  { t = "note", id = "159", text = "Luke i. 72." },
  { t = "p", text = "And remembered his holy covenants," },
  { t = "p", text = "[74][^160]And the oath which he sware unto Abraham our father," },
  { t = "note", id = "160", text = "Luke i. 73." },
  { t = "p", text = "[75][^161]That he would give us deliverance from the hand of our enemies," },
  { t = "note", id = "161", text = "Luke i. 74." },
  { t = "p", text = "And without fear we shall[^162] serve before him" },
  { t = "note", id = "162", text = "Or, *should*." },
  { t = "p", text = "[76][^163]All our days with equity and righteousness." },
  { t = "note", id = "163", text = "Luke i. 75." },
  { t = "p", text = "[77][^164]And as for thee, O child, prophet of the Most High shalt thou be called." },
  { t = "note", id = "164", text = "Luke i. 76." },
  { t = "p", text = "Thou shalt go forth before the face of the Lord to prepare his way," },
  { t = "p", text = "[78][^165]To give the knowledge of salvation[^166] unto his people," },
  { t = "note", id = "165", text = "Luke i. 77." },
  { t = "note", id = "166", text = "Here and elsewhere the Arabic translator uses *life* and *live* and *give life*, as in Syriac, for *salvation*, etc." },
  { t = "p", text = "For the forgiveness of their sins," },
  { t = "p", text = "[79][^167]Through the mercy of[^168] the compassion of our God," },
  { t = "note", id = "167", text = "Luke i. 78." },
  { t = "note", id = "168", text = "Borg. ms. has *and* for *of*." },
  { t = "p", text = "With which he careth for[^169] us, to appear[^170] from on high" },
  { t = "note", id = "169", text = "The word used in the Peshitta means *visit*, either in the sense of *caring for* or in that of *frequenting*. See § 24, 29." },
  { t = "note", id = "170", text = "So Borg. ms. The Vat. ms. is very indistinct. Lagarde (see Introduction, 13, note), quoting Guidi, prints *Whereby there visiteth us the manifestation from on high*. The difference in Arabic is in a single stroke." },
  { t = "p", text = "[80][^171]To give light to them that sit in darkness and under the shadow of death," },
  { t = "note", id = "171", text = "Luke i. 79." },
  { t = "p", text = "And to set straight our feet in the way of peace." },
  { t = "p", text = "[81][^172]And the child grew and became strong in the spirit, and abode in the desert until the time of his appearing unto the children of Israel." },
  { t = "note", id = "172", text = "Luke i. 80." },
]

[[section]]
id = "section-2"
title = "Section II."
level = 1
blocks = [
  { t = "p", text = "[1] [Arabic, p. 7 ][^173]Now[^174] the birth of Jesus the Messiah was on this wise: In the time when his mother was given in marriage to Joseph, before they came together, [2] she was found with child of the Holy Spirit.[^175]And Joseph her husband was a just *man* and did not wish to expose her, and he purposed to put her away secretly. [3][^176]But when he thought of this, the angel of the Lord appeared unto him in a dream, and said unto him, Joseph, son of David, fear not to take Mary thy wife, for that [4] which is begotten[^177] in her is of the Holy Spirit.[^178]She shall bear a son, and thou shalt [5] call his name Jesus, and he shall save[^179] his people from their sins.[^180]And all this was that the saying from the Lord by the prophet might be fulfilled:" },
  { t = "note", id = "173", text = "Matt. i. 18." },
  { t = "note", id = "174", text = "This is preceded in Vat. ms. by the genealogy, Matt. i. 1–17 (see Introduction, 13), with the marginal note *The Beginning of the Gospel of Matthew*. (Lagarde, *op. cit*., 1886, p. 154.) The text presents nothing worthy of note in this place except that verse 16, construed on the same principle as the preceding verses, to which, except in the words printed in italics, it is strictly parallel in construction, reads thus: “Jacob begat Joseph, *the husband of Mary*, who *of her* begat Jesus, the Messiah” (*cf*. the remarkable reading of Sin. Syriac). As it stands, this is the only possible interpretation of the words, for *who* is masculine. But a mistake in the gender of a relative pronoun is very common in Arabic among illiterate people, while in Syriac there is, to begin with, no distinction. If then we correct the relative, *who of her* will become *of whom* (fem.), and *begat* will of course be construed as passive. We thus get the text followed in Ibn-at-Tayyib’s Commentary, the ordinary reading of the Peshitta, *of whom was born Jesus*." },
  { t = "note", id = "175", text = "Matt. i. 19." },
  { t = "note", id = "176", text = "Matt. i. 20." },
  { t = "note", id = "177", text = "The Arabic might even more naturally be rendered *born*, thus giving us the reading that Isho‘dad tells us was that of the *Diatessaron* (Harris, *Fragments*, p. 16 f.); but throughout the whole genealogy (see § 1, 81, note) this word has been used by the Vat. ms. in the sense of *begat*. Here the Borg. ms. has *of her* for *in her*; but Ibn-at-Tayyib in his Commentary discusses *why* Matthew wrote *in* and not *of*." },
  { t = "note", id = "178", text = "Matt. i. 21." },
  { t = "note", id = "179", text = "*cf*. § 1, 78." },
  { t = "note", id = "180", text = "Matt. i. 22." },
  { t = "p", text = "[6][^181]Behold, the virgin shall conceive, and bear a son," },
  { t = "note", id = "181", text = "Matt. i. 23." },
  { t = "p", text = "And they shall call his name Immanuel," },
  { t = "p", text = "[7] which is, being interpreted, With us is our God.[^182]And when Joseph arose from his [8] sleep, he did as the angel of the Lord commanded him, and took his wife;[^183]and knew her not until she brought forth her firstborn son." },
  { t = "note", id = "182", text = "Matt. i. 24." },
  { t = "note", id = "183", text = "Matt. i. 25a." },
  { t = "p", text = "[9][^184]And in those days there went forth a decree from Augustus Cæsar that all the [10] people of his dominion[^185] should be enrolled.[^186]This first enrolment was[^187] while Quirinius [11, 12] was governor of Syria.[^188]And every man went to be enrolled in his city.[^189]And Joseph went up also from Nazareth, a city of Galilee, to Judæa, to the city of David [13] which is called Bethlehem (for he was of the house of David and of his tribe),[^190]with [14] [Arabic, p. 8 ] Mary his betrothed, she being with child, to be enrolled there.[^191]And while [15] she was there the days for her being delivered were accomplished.[^192]And she brought forth her firstborn son; and she wrapped him in swaddling cloths and laid him in a manger, because there was no place for them where they were staying." },
  { t = "note", id = "184", text = "Luke ii. 1." },
  { t = "note", id = "185", text = "The Arabic expression is clearly meant to represent that used in the Peshitta." },
  { t = "note", id = "186", text = "Luke ii. 2." },
  { t = "note", id = "187", text = "This is the most *natural* meaning of the Arabic sentence; which, however, is simply a word-for-word reproduction." },
  { t = "note", id = "188", text = "Luke ii. 3." },
  { t = "note", id = "189", text = "Luke ii. 4." },
  { t = "note", id = "190", text = "Luke ii. 5." },
  { t = "note", id = "191", text = "Luke ii. 6." },
  { t = "note", id = "192", text = "Luke ii. 7." },
  { t = "p", text = "[16][^193]And there were in that region shepherds abiding, keeping their flock in the watch [17] of the night.[^194]And behold, the angel of God came unto them, and the glory of the [18] Lord shone upon them; and they were greatly terrified.[^195]And the angel said unto them, Be not terrified; for I bring you tidings of great joy which shall be to the [19] whole world;[^196]there is born to you this day a Saviour, which is the Lord the Messiah, [20] in the city of David.[^197]And this is a sign for you: ye shall find a babe wrapped [21] in swaddling cloths and laid in a manger.[^198]And there appeared with the angels suddenly many heavenly forces praising[^199] God and saying," },
  { t = "note", id = "193", text = "Luke ii. 8." },
  { t = "note", id = "194", text = "Luke ii. 9." },
  { t = "note", id = "195", text = "Luke ii. 10." },
  { t = "note", id = "196", text = "Luke ii. 11." },
  { t = "note", id = "197", text = "Luke ii. 12." },
  { t = "note", id = "198", text = "Luke ii. 13." },
  { t = "note", id = "199", text = "The Arabic represents Syr. idiom." },
  { t = "p", text = "[22][^200]Praise be to God in the highest," },
  { t = "note", id = "200", text = "Luke ii. 14." },
  { t = "p", text = "And on the earth peace, and good hope to men." },
  { t = "p", text = "[23][^201]And when the angels departed from them to heaven, the shepherds spake to one another and said, We will go to Bethlehem and see this word which hath been, as [24] the Lord made known unto us.[^202]And they came with haste, and found Mary and [25] Joseph, and the babe laid in a manger.[^203]And when they saw, they reported the word [26] which was spoken to them about the child.[^204]And all that heard wondered at the [27] description which the shepherds described[^205] to them.[^206]But Mary kept these[^207] sayings [28] and discriminated[^208] them in her heart.[^209]And those shepherds returned, magnifying and praising God for all that they had seen and heard, according as it was described unto them." },
  { t = "note", id = "201", text = "Luke ii. 15." },
  { t = "note", id = "202", text = "Luke ii. 16." },
  { t = "note", id = "203", text = "Luke ii. 17." },
  { t = "note", id = "204", text = "Luke ii. 18." },
  { t = "note", id = "205", text = "*cf*. § 1, 66, note." },
  { t = "note", id = "206", text = "Luke ii. 19." },
  { t = "note", id = "207", text = "Borg. ms. inserts *all* above the line, after *these*. The meaning ought then to be, *these things, namely, all the sayings*." },
  { t = "note", id = "208", text = "The Arab. might mean *set them apart;* but the Syriac is against this." },
  { t = "note", id = "209", text = "Luke ii. 20." },
  { t = "p", text = "[29] [Arabic, p. 9 ][^210]And when eight days were fulfilled that the child should be circumcised, his name was called Jesus, being that by which he was called by the angel before his conception in the womb." },
  { t = "note", id = "210", text = "Luke ii. 21." },
  { t = "p", text = "[30][^211]And when the days of their purification according to the law of Moses were [31] completed, they took him up to Jerusalem to present him before the Lord[^212](as it is written in the law of the Lord, Every male opening the womb shall be called the [32] holy *thing* of the Lord),[^213]and to give a sacrificial victim as it is said in the law of [33] the Lord, A pair of doves or two young pigeons.[^214]And there was in Jerusalem a man whose name was Simeon; and this man was upright and pious, and expecting [34] the consolation of Israel; and the Holy Spirit was upon him.[^215]And it had been said unto him by the Holy Spirit, that he should not see death till he had seen with [35] his eyes the Messiah[^216] of the Lord.[^217]And this man came by the Spirit to the temple; and at the time when his parents brought in the child Jesus, that they might [36] present for him a sacrifice, as it is written in the law,[^218]he bare him in his arms and praised God and said," },
  { t = "note", id = "211", text = "Luke ii. 22." },
  { t = "note", id = "212", text = "Luke ii. 23." },
  { t = "note", id = "213", text = "Luke ii. 24." },
  { t = "note", id = "214", text = "Luke ii. 25." },
  { t = "note", id = "215", text = "Luke ii. 26." },
  { t = "note", id = "216", text = "Or, *anointed*." },
  { t = "note", id = "217", text = "Luke ii. 27." },
  { t = "note", id = "218", text = "Luke ii. 28." },
  { t = "p", text = "[37][^219]Now loosest thou the bonds of thy servant, O Lord, in peace,[^220]" },
  { t = "note", id = "219", text = "Luke ii. 29." },
  { t = "note", id = "220", text = "For order *cf*. (in part) Sin. Syriac." },
  { t = "p", text = "According to thy saying;" },
  { t = "p", text = "[38][^221]For mine eye hath witnessed thy mercy," },
  { t = "note", id = "221", text = "Luke ii. 30." },
  { t = "p", text = "[39][^222]Which thou hast made ready because of the whole world;" },
  { t = "note", id = "222", text = "Luke ii. 31." },
  { t = "p", text = "[40][^223]A light for the unveiling[^224] of the nations," },
  { t = "note", id = "223", text = "Luke ii. 32." },
  { t = "note", id = "224", text = "i.e., *becoming manifest*." },
  { t = "p", text = "And a glory to thy people Israel." },
  { t = "p", text = "[41][^225]And Joseph and his mother were marvelling at the things which were being said [42] concerning him.[^226]And Simeon blessed them and said to Mary his mother, Behold, he is set for the overthrow and rising of many in Israel; and for a sign of contention; [43][^227]and a spear[^228] shall pierce[^229] through thine own soul; that the thoughts of the [44] [Arabic, p. 10 ] hearts of many may be revealed.[^230]And Anna the prophetess, the daughter of Phanuel, of the tribe of Asher, was also advanced in years (and she dwelt [45] with her husband seven years from her virginity,[^231]and she remained a widow about eighty-four years); and she left not the temple, and served night and day with [46] fasting and prayer.[^232]And she also rose in that hour and thanked the Lord, and she [47] spake of him with every one who was expecting the deliverance of Jerusalem.[^233]And when they had accomplished everything according to what is in the law of the Lord, they returned to Galilee, to Nazareth their city." },
  { t = "note", id = "225", text = "Luke ii. 33." },
  { t = "note", id = "226", text = "Luke ii. 34." },
  { t = "note", id = "227", text = "Luke ii. 35." },
  { t = "note", id = "228", text = "So also in Syriac versions and the quotation of Isho’dad from Ephraem (Harris, *Fragments*, p. 34), but not the Armenian version." },
  { t = "note", id = "229", text = "The Arabic sides with the Peshitta and Ibn-at-Tayyib’s Commentary, against the remarkable reading of Sin. supported by Isho’dad, as in last note (*Syriac* text), and the Armenian in Hill, p. 336. See now also *The Guardian*, Dec. 18, 1895." },
  { t = "note", id = "230", text = "Luke ii. 36." },
  { t = "note", id = "231", text = "Luke ii. 37." },
  { t = "note", id = "232", text = "Luke ii. 38." },
  { t = "note", id = "233", text = "Luke ii. 39." },
]

[[section]]
id = "section-3"
title = "Section III."
level = 1
blocks = [
  { t = "p", text = "[1, 2][^234]And after that,[^235] the Magi came from the east to Jerusalem,[^236]and said, Where is the King of the Jews which was born? We have seen his star in the east, and have [3] come to worship him.[^237]And Herod the king heard, and he was troubled, and all [4] Jerusalem with him.[^238]And he gathered all the chief priests and the scribes of the [5] people, and asked them in what place[^239] the Messiah should be born.[^240]They said, In Bethlehem of Judæa: thus it is written in the prophet," },
  { t = "note", id = "234", text = "Matt. ii. 1b." },
  { t = "note", id = "235", text = "On the substitution of this general phrase for Matt. ii. 1a, see the remarks of Harris in *Fragments*, etc., p. 37 ff." },
  { t = "note", id = "236", text = "Matt. ii. 2." },
  { t = "note", id = "237", text = "Matt. ii. 3." },
  { t = "note", id = "238", text = "Matt. ii. 4." },
  { t = "note", id = "239", text = "This periphrasis for *where* is very characteristic of this work." },
  { t = "note", id = "240", text = "Matt. ii. 5." },
  { t = "p", text = "[6][^241]Thou also, Bethlehem of Judah," },
  { t = "note", id = "241", text = "Matt. ii. 6." },
  { t = "p", text = "Art not contemptible among the kings of Judah:" },
  { t = "p", text = "From thee shall go forth a king," },
  { t = "p", text = "And he shall be a shepherd to my people Israel." },
  { t = "p", text = "[7][^242]Then Herod called the Magi secretly, and inquired of them the time at which [8] the star appeared to them.[^243]And he sent them to Bethlehem, and said unto them, Go and search about the child diligently; and when ye have found him, come and [9] make known to me, that I also may go and worship him.[^244]And they, when they [Arabic, p. 11 ] heard the king, departed; and lo, the star which they had seen in the east went before them, until it came and stood above the place where the child [10, 11] was.[^245]And when they beheld the star, they rejoiced with very great joy.[^246]And they entered the house and beheld the child with Mary his mother, and fell down worshipping him, and opened their saddle-bags and offered to him offerings, gold and [12] myrrh and frankincense.[^247]And they saw in a dream[^248] that they should not return to Herod, and they travelled by another way in going to their country." },
  { t = "note", id = "242", text = "Matt. ii. 7." },
  { t = "note", id = "243", text = "Matt. ii. 8." },
  { t = "note", id = "244", text = "Matt. ii. 9." },
  { t = "note", id = "245", text = "Matt. ii. 10." },
  { t = "note", id = "246", text = "Matt. ii. 11." },
  { t = "note", id = "247", text = "Matt. ii. 12." },
  { t = "note", id = "248", text = "So in later Arabic and some Arabic versions. According to classical usage the word means *sleep*." },
  { t = "p", text = "[13][^249]And when they had departed, the angel of the Lord appeared in a dream to Joseph, and said unto him, Rise, take the child and his mother, and flee into Egypt, and be thou there until I speak to thee; for Herod is determined to seek the child [14] to slay him.[^250]And Joseph arose and took the child and his mother in the night, and [15] fled into Egypt,[^251]and remained in it until the time of the death of Herod: that that might be fulfilled which was said by the Lord in the prophet, which said, From [16] Egypt did I call my son.[^252]And Herod then, when he saw that he was mocked of the Magi, was very angry, and sent and killed all the male children which were in Bethlehem and all its borders, from two years old and under, according to the time [17] which he had inquired from the Magi.[^253]Then was fulfilled the saying in Jeremiah the prophet, which said," },
  { t = "note", id = "249", text = "Matt. ii. 13." },
  { t = "note", id = "250", text = "Matt. ii. 14." },
  { t = "note", id = "251", text = "Matt. ii. 15." },
  { t = "note", id = "252", text = "Matt. ii. 16." },
  { t = "note", id = "253", text = "Matt. ii. 17." },
  { t = "p", text = "[18][^254]A voice was heard in Ramah," },
  { t = "note", id = "254", text = "Matt. ii. 18." },
  { t = "p", text = "Weeping and much lamentation;" },
  { t = "p", text = "Rachel weeping[^255] for her children," },
  { t = "note", id = "255", text = "Or, *is weeping*, and so in next line *is not willing*." },
  { t = "p", text = "And not willing to be consoled for their loss." },
  { t = "p", text = "[19][^256]But when Herod the king died, the angel of the Lord appeared in a dream to [20] Joseph in Egypt,[^257]and said unto him, Rise and take the child and his mother, and [Arabic, p. 12 ] go into the land of Israel; for they have died who sought the child’s life. [21][^258]And Joseph rose and took the child and his mother, and came to the land [22] of Israel.[^259]But when he heard that Archelaus had become king over Judæa instead of Herod his father, he feared to go thither; and he saw in a dream that he should [23] go into the land of Galilee,[^260]and that he should abide in a city called Nazareth: that the saying in the prophet might be fulfilled, that he should be called a Nazarene." },
  { t = "note", id = "256", text = "Matt. ii. 19." },
  { t = "note", id = "257", text = "Matt. ii. 20." },
  { t = "note", id = "258", text = "Matt. ii. 21." },
  { t = "note", id = "259", text = "Matt. ii. 22." },
  { t = "note", id = "260", text = "Matt. ii. 23." },
  { t = "p", text = "[24][^261]And the child grew, and became strong in spirit, becoming filled with wisdom; and the grace of God was upon him." },
  { t = "note", id = "261", text = "Luke ii. 40." },
  { t = "p", text = "[25][^262]And his kinsfolk[^263] used to go every year to Jerusalem at the feast of the passover. [26][^264]And when he was twelve years old, they went up according to their custom, [27] to the feast.[^265]And when the days were accomplished, they returned; and the child [28] Jesus remained in Jerusalem, and Joseph and his mother knew not:[^266]and they supposed that he was with the children of their company. And when they had gone one day’s journey, they sought him beside their people and those who knew them, [29] and they found him not;[^267]so they returned to Jerusalem and sought him again. [30][^268]And after three days they found him in the temple, sitting in the midst of the teachers, [31] hearing them and asking them *questions*;[^269]and all who heard him wondered at [32] his wisdom and his words.[^270]And when they saw him they wondered, and his mother said unto him, My son, why hast thou dealt with us thus? behold, I and thy father [33] have been seeking for thee with much anxiety.[^271]And he said unto them, Why were [34] ye seeking me? know[^272] ye not that I must be in the house of my Father?[^273]And they [35] understood not the word which he spake unto them.[^274]And he went down with them, and came to Nazareth; and he was obedient to them: and his mother used to keep all these sayings in her heart." },
  { t = "note", id = "262", text = "Luke ii. 41." },
  { t = "note", id = "263", text = "A general word (*cf*. Syr. versions)." },
  { t = "note", id = "264", text = "Luke ii. 42." },
  { t = "note", id = "265", text = "Luke ii. 43." },
  { t = "note", id = "266", text = "Luke ii. 44." },
  { t = "note", id = "267", text = "Luke ii. 45." },
  { t = "note", id = "268", text = "Luke ii. 46." },
  { t = "note", id = "269", text = "Luke ii. 47." },
  { t = "note", id = "270", text = "Luke ii. 48." },
  { t = "note", id = "271", text = "Luke ii. 49." },
  { t = "note", id = "272", text = "Or, *knew*." },
  { t = "note", id = "273", text = "Luke ii. 50." },
  { t = "note", id = "274", text = "Luke ii. 51." },
  { t = "p", text = "[36] [Arabic, p. 13 ][^275]And Jesus grew in his stature and wisdom, and in grace with God and men." },
  { t = "note", id = "275", text = "Luke ii. 52." },
  { t = "p", text = "[37][^276]And in the fifteenth year of the reign of Tiberius Cæsar, when Pontius Pilate was governor in Judæa, and one of the four rulers, Herod, in Galilee; and Philip his brother, one of the four rulers, in Ituræa and in the district of Trachonitis; and [38] Lysanias, one of the four rulers, in Abilene;[^277]in the chief-priesthood of Annas and Caiaphas, the command[^278] of God went forth to John the son of Zacharias in the [39] desert.[^279]And he came into all the region which is about Jordan, proclaiming the [40] baptism of repentance unto[^280] the forgiveness of sins.[^281]And he was preaching in the [41] wilderness of Judæa, and saying,[^282]Repent ye; the kingdom of heaven is come near. [42][^283]This is he that was spoken *of* in Isaiah the prophet," },
  { t = "note", id = "276", text = "Luke iii. 1." },
  { t = "note", id = "277", text = "Luke iii. 2." },
  { t = "note", id = "278", text = "There is a very rare use of this Arabic word in the Hebrew sense of *saying*." },
  { t = "note", id = "279", text = "Luke iii. 3." },
  { t = "note", id = "280", text = "So Vat. ms. The Borg. ms. has *with*." },
  { t = "note", id = "281", text = "Matt. iii. 1b." },
  { t = "note", id = "282", text = "Matt. iii. 2." },
  { t = "note", id = "283", text = "Matt. iii. 3a." },
  { t = "p", text = "The voice which crieth in the desert," },
  { t = "p", text = "[43][^284]Prepare ye the way of the Lord," },
  { t = "note", id = "284", text = "Luke iii. 4b." },
  { t = "p", text = "And make straight in the plain, paths for our God." },
  { t = "p", text = "[44][^285]All the valleys shall become filled," },
  { t = "note", id = "285", text = "Luke iii. 5." },
  { t = "p", text = "And all the mountains and hills shall become low;" },
  { t = "p", text = "And the rough shall become plain, And the difficult place, easy;" },
  { t = "p", text = "[45][^286]And all flesh shall see the salvation[^287] of God." },
  { t = "note", id = "286", text = "Luke iii. 6." },
  { t = "note", id = "287", text = "See note on § 1, 78." },
  { t = "p", text = "[46][^288]This *man* came to bear witness, that he might bear witness to the light, that [47] every man might believe through his mediation.[^289]He was not the light, but that he [48] might bear witness to the light,[^290]which was the light of truth, that giveth light to [49] every man coming into the world.[^291]He was in the world, and the world was made [50] by him, and the world knew [51] him not.[^292]He came unto his own, and his own received him not.[^293]And those who received him, to them gave he the power[^294] that they might [52] be sons of God,—those which believe in his name:[^295]which were born, not of blood, [53] nor of the will of the flesh, nor of the will of a man, but of God.[^296]And the Word became flesh, and took up his abode among us; and we saw his glory as the glory [54] of the only *Son* from the Father, which is full of grace and equity.[^297][^298]John bare witness [Arabic, p. 14 ] of him, and cried, and said, This is he that I said cometh after me and [55] was before me, because he was before me.[^299][^300]And of his fullness received [56] we all grace for grace.[^301]For the law was given through the mediation of Moses, but truth and grace were[^302] through Jesus Christ." },
  { t = "note", id = "288", text = "John i. 7." },
  { t = "note", id = "289", text = "John i. 8." },
  { t = "note", id = "290", text = "John i. 9." },
  { t = "note", id = "291", text = "John i. 10." },
  { t = "note", id = "292", text = "John i. 11." },
  { t = "note", id = "293", text = "John i. 12." },
  { t = "note", id = "294", text = "Or, *authority*." },
  { t = "note", id = "295", text = "John i. 13." },
  { t = "note", id = "296", text = "John i. 14." },
  { t = "note", id = "297", text = "In Syr. this word also means *truth*." },
  { t = "note", id = "298", text = "John i. 15." },
  { t = "note", id = "299", text = "Or, *earlier than I*." },
  { t = "note", id = "300", text = "John i. 16." },
  { t = "note", id = "301", text = "John i. 17." },
  { t = "note", id = "302", text = "i.e., *came to be*." },
]

[[section]]
id = "section-4"
title = "Section IV."
level = 1
blocks = [
  { t = "p", text = "[1][^303]No man hath seen God at any time; the only *Son*, God,[^304] which is in the bosom of his Father, he hath told of *him*." },
  { t = "note", id = "303", text = "John i. 18." },
  { t = "note", id = "304", text = "*cf*. Peshitta, etc. (not Cur.); *cf*. also Gildemeister, *op. cit*., p. 29, on Luke ix. 20." },
  { t = "p", text = "[2][^305]And this is the witness of John when the Jews sent to him from Jerusalem priests [3] and Levites to ask him, Who art thou?[^306]And he acknowledged, and denied not; [4] and he confessed that he was not the Messiah.[^307]And they asked him again, What then? Art thou Elijah? And he said, I am not he. Art thou a prophet? He [5] said, No.[^308]They said unto him, Then who art thou? that we may answer them that [6] sent us. What sayest thou of thyself?[^309]And he said, I am the voice that crieth in [7] the desert, Repair ye the way of the Lord, as said Isaiah the prophet.[^310]And they [8] that were sent were from[^311] the Pharisees.[^312]And they asked him and said unto him, Why baptizest thou now, when thou art not the Messiah, nor Elijah, nor a prophet? [9][^313]John answered and said unto them, I baptize with[^314] water: among you is standing [10] one whom ye know not:[^315]this is he who I said cometh after me and was before [11] me, the latchets of whose shoes I am not worthy to unloose.[^316]And that was in Bethany beyond Jordan, where John was baptizing." },
  { t = "note", id = "305", text = "John i. 19." },
  { t = "note", id = "306", text = "John i. 20." },
  { t = "note", id = "307", text = "John i. 21." },
  { t = "note", id = "308", text = "John i. 22." },
  { t = "note", id = "309", text = "John i. 23." },
  { t = "note", id = "310", text = "John i. 24." },
  { t = "note", id = "311", text = "Lit. *from the side of*." },
  { t = "note", id = "312", text = "John i. 25." },
  { t = "note", id = "313", text = "John i. 26." },
  { t = "note", id = "314", text = "Or, *in*." },
  { t = "note", id = "315", text = "John i. 27." },
  { t = "note", id = "316", text = "John i. 28." },
  { t = "p", text = "[12][^317]Now John’s raiment was camel’s hair, and *he was* girded with skins, and his food [13] [Arabic, p. 15 ] was of locusts and honey of the wilderness.[^318][^319]Then went out unto him the people of Jerusalem, and all Judæa, and all the region which is about the [14, 15] Jordan;[^320]and they were baptized of him in the river Jordan, confessing their sins.[^321]But when he saw many of the Pharisees[^322] and Sadducees[^323] coming to be baptized, he said unto them, Ye children of vipers, who hath led you to flee from the wrath to come? [16, 17][^324]Do now the fruits which are worthy of repentance;[^325]and think and say not within yourselves, We have a father, *even* Abraham; for I say unto you, that God is able to [18] raise up of these stones children unto Abraham.[^326]Behold, the axe hath been laid at the roots of the trees, and so every tree that beareth not good fruit shall be taken and [19] cast into the fire.[^327]And the multitudes were asking him and saying, What shall we do? [20][^328]He answered and said unto them, He that hath two tunics shall[^329] give to him that [21] hath not; and he that hath food shall[^330] do likewise.[^331]And the publicans also came [22] to be baptized, and they said unto him, Teacher, what shall we do?[^332]He said unto [23] them, Seek not more than what ye are commanded to seek.[^333]And the servants[^334] of the guard asked him and said, And we also, what shall we do? He said unto them, Do not violence to any man, nor wrong him; and let your allowances satisfy you." },
  { t = "note", id = "317", text = "Matt. iii. 4." },
  { t = "note", id = "318", text = "On the original *Diatessaron* reading, *honey and milk of the mountains*, or, *milk and honey of the mountains*, which latter Ibn-at-Tayyib cites in his Commentary (folio 44b, 45a) as a reading, but without any allusion to the *Diatessaron*, see, e.g., now Harris, *Fragments of the Com*. *of Ephr. Syr. upon the Diat*. (London, 1895), p. 17 f." },
  { t = "note", id = "319", text = "Matt. iii. 5." },
  { t = "note", id = "320", text = "Matt. iii. 6." },
  { t = "note", id = "321", text = "Matt. iii. 7." },
  { t = "note", id = "322", text = "The translator uses invariably an Arabic word (name of a sect) meaning *Separatists*." },
  { t = "note", id = "323", text = "Lit. *Zindiks*, a name given to Persian dualists and others." },
  { t = "note", id = "324", text = "Matt. iii. 8." },
  { t = "note", id = "325", text = "Matt. iii. 9." },
  { t = "note", id = "326", text = "Matt. iii. 10." },
  { t = "note", id = "327", text = "Luke iii. 10." },
  { t = "note", id = "328", text = "Luke iii. 11." },
  { t = "note", id = "329", text = "Grammar requires this rendering, but solecisms in this kind of word are very common, and in this work (e.g., § 48, 21) the jussive particle is sometimes omitted. We should therefore probably render *let him give, let him do*, etc." },
  { t = "note", id = "330", text = "Grammar requires this rendering, but solecisms in this kind of word are very common, and in this work (e.g., § 48, 21) the jussive particle is sometimes omitted. We should therefore probably render *let him give, let him do*, etc." },
  { t = "note", id = "331", text = "Luke iii. 12." },
  { t = "note", id = "332", text = "Luke iii. 13." },
  { t = "note", id = "333", text = "Luke iii. 14." },
  { t = "note", id = "334", text = "*cf*. Peshitta, where the word has its special meaning, *soldiers*." },
  { t = "p", text = "[24][^335]And when the people were conjecturing about John, and all of them thinking [25] in their hearts whether he were haply[^336] the Messiah,[^337]John answered and said unto them, I baptize you with water; there cometh one after me who is stronger than I, the latchets of whose shoes I am not worthy to loosen; he will baptize you with the [26] Holy Spirit and fire:[^338]who taketh the fan in his hand to cleanse his threshing-floors, [Arabic, p. 16 ] and the wheat he gathereth into his garners, while the straw he shall burn in fire which can[^339] not be put out." },
  { t = "note", id = "335", text = "Luke iii. 15 ." },
  { t = "note", id = "336", text = "Our translator constantly uses this Arabic word (which we render *haply*, or, *can it be?* or, *perhaps*, etc.) to represent the Syriac word used in this place. The latter is used in various ways, and need not be interrogative, as our translator renders it (*cf*. especially § 17, 6)." },
  { t = "note", id = "337", text = "Luke iii. 16." },
  { t = "note", id = "338", text = "Luke iii. 17 ." },
  { t = "note", id = "339", text = "Or, *shall*." },
  { t = "p", text = "[27][^340]And other things he taught and preached among the people." },
  { t = "note", id = "340", text = "Luke iii. 18." },
  { t = "p", text = "[28][^341]Then came Jesus from Galilee to the Jordan to John, to be baptized of him. [29][^342]And Jesus was about thirty years old, and it was supposed that he was the son of [30] Joseph.[^343][^344]And John saw Jesus coming unto him, and said, This is the Lamb of [31] God, that taketh on itself the burden of the sins of the world![^345]This is he concerning whom I said, There cometh after me a man who was before me, because he was [32] before me.[^346][^347]And I knew him not; but that he should be made manifest to Israel, [33] for this cause came I to baptize with water.[^348]And John was hindering him and [34] saying, I have need of being baptized by thee, and comest thou to me?[^349]Jesus answered him and said, Suffer this now: thus it is our duty to fulfill all righteousness. [35] Then he suffered him.[^350]And when all the people were baptized, Jesus also [36] was baptized.[^351]And immediately he went up out of the water, and heaven opened [37] [Arabic, p. 17 ] to him,[^352][^353]and the Holy Spirit descended upon him in the similitude of the [38] body of a dove;[^354]and lo, a voice from heaven, saying, This is my beloved [39] Son, in whom I am well pleased.[^355]And John bare witness and said, I beheld the [40] Spirit descend from heaven like a dove; and it abode upon him.[^356]But I knew him not; but he that sent me to baptize with water, he said unto me, Upon whomsoever thou shalt behold the Spirit descending and lighting upon him, the same is he that [41] baptizeth with the Holy Spirit.[^357]And I have seen and borne witness that this is the Son of God." },
  { t = "note", id = "341", text = "Matt. iii. 13." },
  { t = "note", id = "342", text = "Luke iii. 23a." },
  { t = "note", id = "343", text = "The Vat. ms. here gives the genealogy (Luke iii. 23–38), of which we shall quote only the last words: *the son of Adam; who (was) from God*. If this were not the reading of the Peshitta (against Sin.) and Ibn-at-Tayyib’s Commentary, one might explain *from* as a corruption of the Arabic *son of*, the words being very similar. On the Borg. ms. see § 55, 17, note." },
  { t = "note", id = "344", text = "John i. 29." },
  { t = "note", id = "345", text = "John i. 30." },
  { t = "note", id = "346", text = "*cf*. § 3, 54, note." },
  { t = "note", id = "347", text = "John i. 31." },
  { t = "note", id = "348", text = "Matt. iii. 14." },
  { t = "note", id = "349", text = "Matt. iii. 15." },
  { t = "note", id = "350", text = "Luke iii. 21b." },
  { t = "note", id = "351", text = "Matt. iii. 16b." },
  { t = "note", id = "352", text = "For the statement of Isho’dad (see above, Introduction, 10), “And straightway, as the *Diatessaron* testifieth, light shone forth,” etc., see Harris, *Fragments*, etc., p. 43 f." },
  { t = "note", id = "353", text = "Luke iii. 22a." },
  { t = "note", id = "354", text = "Matt. iii. 17." },
  { t = "note", id = "355", text = "John i. 32." },
  { t = "note", id = "356", text = "John i. 33." },
  { t = "note", id = "357", text = "John i. 34." },
  { t = "p", text = "[42, 43][^358]And Jesus returned from the Jordan, filled with the Holy Spirit.[^359]And immediately the Spirit took him out into the wilderness, to be tried of the devil;[^360][^361]and he [44] was with the beasts.[^362]And he fasted forty days and forty nights.[^363]And he ate nothing [45] in those days, and at the end of them he hungered.[^364]And the tempter came and said unto him, If thou art the Son of God, speak, and these stones shall become [46] bread.[^365]He answered and said, It is written, Not by bread alone shall man live, but [47] by every word that proceedeth out of the mouth of God.[^366]Then the devil[^367] brought [48] him to the holy city, and set him on the pinnacle of the temple,[^368]and said unto him, If thou art the Son of God, cast thyself down: for it is written," },
  { t = "note", id = "358", text = "Luke iv. 1a." },
  { t = "note", id = "359", text = "Mark i. 12." },
  { t = "note", id = "360", text = "Lit. *calumniator*." },
  { t = "note", id = "361", text = "Mark i. 13b." },
  { t = "note", id = "362", text = "Matt. iv. 2a." },
  { t = "note", id = "363", text = "Luke iv. 2b." },
  { t = "note", id = "364", text = "Matt. iv. 2b, 3." },
  { t = "note", id = "365", text = "Matt. iv. 4." },
  { t = "note", id = "366", text = "Matt. iv. 5." },
  { t = "note", id = "367", text = "Lit. *calumniator*." },
  { t = "note", id = "368", text = "Matt. iv. 6." },
  { t = "p", text = "He shall give his angels charge concerning thee:" },
  { t = "p", text = "And they shall take thee on their arms," },
  { t = "p", text = "So that thy foot shall not stumble against a stone." },
  { t = "p", text = "[49][^369]Jesus said unto him, And[^370] it is written also, Thou shalt not tempt the Lord thy [50] God.[^371]And the devil[^372] took him up to a high mountain, and shewed him all the kingdoms [51] [Arabic, p. 18 ] of the earth, and their glory, in the least time;[^373]and the devil[^374] said unto him, To thee will I give all this dominion, and its glory, which is delivered to [52] me that I may give it to whomsoever I will.[^375]If then thou wilt worship before me, all of it shall be thine." },
  { t = "note", id = "369", text = "Matt. iv. 7." },
  { t = "note", id = "370", text = "Borg. ms. omits *and*." },
  { t = "note", id = "371", text = "Luke iv. 5." },
  { t = "note", id = "372", text = "Lit. *backbiter*, a different word from that used above in § 4, 43, 47." },
  { t = "note", id = "373", text = "Luke iv. 6." },
  { t = "note", id = "374", text = "Lit. *backbiter*, a different word from that used above in § 4, 43, 47." },
  { t = "note", id = "375", text = "Luke iv. 7." },
]

[[section]]
id = "section-5"
title = "Section V."
level = 1
blocks = [
  { t = "p", text = "[1][^376]Jesus answered and said unto him, Get thee hence, Satan: for it is written, Thou [2] shalt worship the Lord thy God, and him alone shalt thou serve.[^377]And when the [3] devil[^378] had completed all his temptations, he departed from him for a season.[^379]And behold, the angels drew near and ministered unto him." },
  { t = "note", id = "376", text = "Matt. iv. 10." },
  { t = "note", id = "377", text = "Luke iv. 13." },
  { t = "note", id = "378", text = "Lit. *backbiter*, a different word from that used above in § 4, 43, 47." },
  { t = "note", id = "379", text = "Matt. iv. 11b." },
  { t = "p", text = "[4, 5][^380]And next day John was standing, and two of his disciples;[^381]and he saw Jesus as [6] he was walking, and said, Behold, the Lamb of God![^382]And his two disciples heard [7] him saying *this*,[^383] and they followed Jesus.[^384]And Jesus turned and saw them coming after him, and said unto them, What seek ye? They said unto him, Our master, [8] where art thou staying?[^385]And he said unto them, Come and see. And they came and saw his place, and abode with him that day: and it was about the tenth hour. [9][^386]One of the two which heard from[^387] John, and followed Jesus, was Andrew the [10] brother of Simon.[^388]And he saw first Simon his brother, and said unto him, We have [11] found the Messiah.[^389]And he brought him unto Jesus. And Jesus looked upon him and said, Thou art Simon, son of Jonah: thou shalt be called Cephas.[^390]" },
  { t = "note", id = "380", text = "John i. 35." },
  { t = "note", id = "381", text = "John i. 36." },
  { t = "note", id = "382", text = "John i. 37." },
  { t = "note", id = "383", text = "Or, *speaking*." },
  { t = "note", id = "384", text = "John i. 38." },
  { t = "note", id = "385", text = "John i. 39." },
  { t = "note", id = "386", text = "John i. 40." },
  { t = "note", id = "387", text = "*cf*. Peshitta." },
  { t = "note", id = "388", text = "John i. 41a." },
  { t = "note", id = "389", text = "John i. 42a." },
  { t = "note", id = "390", text = "The Arabic word used throughout this work means *Stones*." },
  { t = "p", text = "[12][^391]And on the next day Jesus desired to go forth to Galilee, and he found Philip, [13] [Arabic, p. 19 ] and said unto him, Follow me.[^392]Now Philip was of Bethsaida, of the city [14] of Andrew and Simon.[^393]And Philip found Nathanael, and said unto him, He of whom Moses did write in the law and in the prophets, we have found that [15] he is Jesus the son of Joseph of Nazareth.[^394]Nathanael said unto him, Is it possible that there can be any good thing from Nazareth? Philip said unto him, Come and [16] see.[^395]And Jesus saw Nathanael coming to him, and said of him, This is indeed a[^396] [17] son of Israel in whom is no guile.[^397]And Nathanael said unto him, Whence knowest thou me? Jesus said unto him, Before Philip called thee, while thou wast under the [18] fig tree, I saw thee.[^398]Nathanael answered and said unto him, My Master, thou art [19] the Son of God; thou art the King of Israel.[^399]Jesus said unto him, Because I said unto thee, I saw thee under the fig tree, hast thou believed? thou shalt see what is [20] greater than this.[^400]And he said unto him, Verily, verily, I say unto you, Henceforth ye shall see the heavens opened, and the angels of God ascending and descending upon the Son of man." },
  { t = "note", id = "391", text = "John i. 43." },
  { t = "note", id = "392", text = "John i. 44." },
  { t = "note", id = "393", text = "John i. 45." },
  { t = "note", id = "394", text = "John i. 46." },
  { t = "note", id = "395", text = "John i. 47." },
  { t = "note", id = "396", text = "Lit. *the* (*cf*. note to § 1, 40)." },
  { t = "note", id = "397", text = "John i. 48." },
  { t = "note", id = "398", text = "John i. 49." },
  { t = "note", id = "399", text = "John i. 50." },
  { t = "note", id = "400", text = "John i. 51." },
  { t = "p", text = "[21][^401]And Jesus returned in the power of the Spirit to Galilee." },
  { t = "note", id = "401", text = "Luke iv. 14a." },
  { t = "p", text = "[22][^402]And on the third day there was a feast in Cana,[^403] a[^404] city of Galilee; and the [23] mother of Jesus was there:[^405]and Jesus also and his disciples were invited to the [24] feast.[^406]And they lacked wine: and his mother said unto Jesus, They have no wine. [25][^407]And Jesus said unto her, What have I to do with thee, woman? hath not mine [26] hour come?[^408][^409]And his mother said unto the servants, What he saith unto you, do. [27][^410]And there were there six vessels of stone, placed for the Jews’ purification, such as [28] [Arabic, p. 20 ] would contain two or three jars.[^411]And Jesus said unto them, Fill the vessels [29] with water. And they filled them to the top.[^412]He said unto them, Draw [30] out now, and present to the ruler of the feast. And they did *so*.[^413]And when the ruler of the company tasted that water which had become wine, and knew not whence it was (but the servants knew, because they filled up the water), the ruler of the company called [31] the bridegroom,[^414]and said unto him, Every man presenteth first the good wine, and on intoxication he bringeth what is poor; but thou hast kept the good wine until [32] now.[^415]And this is the first sign[^416] which Jesus did in Cana of Galilee, and manifested [33] his glory; and his disciples believed on him.[^417]And his fame spread in all the country [34] which was around them.[^418]And he taught in their synagogues, and was glorified [35] by[^419] every man.[^420]And he came to Nazareth, where he had been brought up, and entered, according to his custom, into the synagogue on the sabbath day, and stood [36] up to read.[^421]And he was given the book of Isaiah the prophet. And Jesus opened the book and found the place where it was written," },
  { t = "note", id = "402", text = "John ii. 1." },
  { t = "note", id = "403", text = "Arabic *Qatna*; at § 5, 32, *Qatina*, following the Syriac form." },
  { t = "note", id = "404", text = "Lit. *the* (*cf*. note to § 1, 40)." },
  { t = "note", id = "405", text = "John ii. 2." },
  { t = "note", id = "406", text = "John ii. 3." },
  { t = "note", id = "407", text = "John ii. 4." },
  { t = "note", id = "408", text = "The reading of Cur. and Sin. is not known; but *cf*. Moesinger, p. 53, and Isho’dad quoted in Harris, *Fragments*, etc., p. 46." },
  { t = "note", id = "409", text = "John ii. 5." },
  { t = "note", id = "410", text = "John ii. 6." },
  { t = "note", id = "411", text = "John ii. 7." },
  { t = "note", id = "412", text = "John ii. 8." },
  { t = "note", id = "413", text = "John ii. 9." },
  { t = "note", id = "414", text = "John ii. 10." },
  { t = "note", id = "415", text = "John ii. 11." },
  { t = "note", id = "416", text = "Perhaps a comma should be inserted after *sign*." },
  { t = "note", id = "417", text = "Luke iv. 14b." },
  { t = "note", id = "418", text = "Luke iv. 15." },
  { t = "note", id = "419", text = "If the text does not contain a misprint the word for *by* is wanting in both mss. It should doubtless be restored as in § 7, 3." },
  { t = "note", id = "420", text = "Luke iv. 16." },
  { t = "note", id = "421", text = "Luke iv. 17." },
  { t = "p", text = "[37][^422]The Spirit of the Lord is upon me," },
  { t = "note", id = "422", text = "Luke iv. 18." },
  { t = "p", text = "And for this anointed he me, to preach good tidings to the poor;" },
  { t = "p", text = "And he hath sent me to heal the broken-hearted," },
  { t = "p", text = "And to proclaim forgiveness to the evil-doers,[^423] and sight to the blind," },
  { t = "note", id = "423", text = "*Evil-doers* could easily be an Arabic copyist’s corruption of *captives*; but the word used here for *forgiveness* could hardly spring from an Arabic *release* (in Ibn-at-Tayyib’s Commentary, where the thing seems to have happened, a different word is used). In Syriac, however, they are the same; while the first pair contain the same consonants." },
  { t = "p", text = "And to bring the broken into forgiveness,[^424]" },
  { t = "note", id = "424", text = "See preceding note." },
  { t = "p", text = "[38][^425]And to proclaim an acceptable year of the Lord." },
  { t = "note", id = "425", text = "Luke iv. 19." },
  { t = "p", text = "[39][^426]And he rolled up the book and gave it to the servant, and went and sat down: [40] and the eyes of all that were in the synagogue were observing him.[^427]And he began to say unto them, To-day hath this scripture been fulfilled which ye have heard with [41] your ears.[^428]And they all bare him witness, and wondered at the words of grace which were proceeding from his mouth." },
  { t = "note", id = "426", text = "Luke iv. 20." },
  { t = "note", id = "427", text = "Luke iv. 21." },
  { t = "note", id = "428", text = "Luke iv. 22a." },
  { t = "p", text = "[42] [Arabic, p. 21 ][^429]And from that time began Jesus to proclaim the gospel of the kingdom [43] of God, and to say, Repent ye, and believe in the gospel.[^430]The time is fulfilled, and the kingdom of heaven hath come near." },
  { t = "note", id = "429", text = "Matt. iv. 17a." },
  { t = "note", id = "430", text = "Mark i. 15." },
  { t = "p", text = "[44][^431]And while he was walking on the shore of the sea of Galilee, he saw two brethren, Simon who was called Cephas, and Andrew his brother, casting their nets into [45] the sea; for they were fishers.[^432]And Jesus said unto them, Follow me, and I will [46] make you fishers of men.[^433]And they immediately left their nets there and followed [47] him.[^434]And when he went on from thence, he saw other two brothers, James the son of Zebedee, and John his brother, in the ship with Zebedee their father, mending [48] their nets; and Jesus called them.[^435]And they immediately forsook the ship and their father Zebedee, and followed him." },
  { t = "note", id = "431", text = "Matt. iv. 18." },
  { t = "note", id = "432", text = "Matt. iv. 19." },
  { t = "note", id = "433", text = "Matt. iv. 20." },
  { t = "note", id = "434", text = "Matt. iv. 21." },
  { t = "note", id = "435", text = "Matt. iv. 22." },
  { t = "p", text = "[49][^436]And when the multitude gathered unto him to hear the word of God, while he [50] was standing on the shore of the sea of Gennesaret,[^437]he saw two boats standing beside the sea, while[^438] the two fishers which were gone out of them were washing their [51] nets.[^439]And one of them belonged to Simon Cephas. And Jesus went up and sat down in it, and commanded that they should move away a little from the land into [52] the water. And he sat down and taught the multitudes from the boat.[^440]And when he had left off his speaking, he said unto Simon, Put out into the deep, and cast your [53] net for a draught.[^441]And Simon answered and said unto him, My Master, we toiled [54] all night and caught nothing; now[^442] at thy word I will cast the net.[^443]And when they did this, there were enclosed[^444] a great many fishes; and their net was on the [55] point of breaking.[^445]And they beckoned to their comrades that were in the other boat, to come and help them. And when they came, they filled both boats, so that they were on the point of sinking." },
  { t = "note", id = "436", text = "Luke v. 1." },
  { t = "note", id = "437", text = "Luke v. 2." },
  { t = "note", id = "438", text = "Or, *but*." },
  { t = "note", id = "439", text = "Luke v. 3." },
  { t = "note", id = "440", text = "Luke v. 4." },
  { t = "note", id = "441", text = "Luke v. 5." },
  { t = "note", id = "442", text = "Borg. ms. has *but*. The Arabic expressions are very similar." },
  { t = "note", id = "443", text = "Luke v. 6." },
  { t = "note", id = "444", text = "Borg. ms. has *he did this, he enclosed*, on which see § 38, 43, note (end). Either reading could spring from the other, within the Arabic." },
  { t = "note", id = "445", text = "Luke v. 7." },
]

[[section]]
id = "section-6"
title = "Section VI."
level = 1
blocks = [
  { t = "p", text = "[1] [Arabic, p. 22 ][^446]But when Simon Cephas saw *this* he fell before the feet of Jesus, and said unto him, My Lord, I beseech of thee to depart from me, for I am [2] a sinful man.[^447]And amazement took possession of him, and of all who were with him, [3] because of the draught of the fishes which they had taken.[^448]And thus also were James and John the sons of Zebedee overtaken,[^449] who were Simon’s partners. And Jesus said [4] unto Simon, Fear not; henceforth thou shalt be a fisher of men unto life.[^450]And they brought the boats to the land; and they left everything, and followed him." },
  { t = "note", id = "446", text = "Luke v. 8." },
  { t = "note", id = "447", text = "Luke v. 9." },
  { t = "note", id = "448", text = "Luke v. 10." },
  { t = "note", id = "449", text = "The verb may be active as well as passive, but does not agree in gender with *amazement*. Mistakes in gender are, however, very common transcriptional errors." },
  { t = "note", id = "450", text = "Luke v. 11." },
  { t = "p", text = "[5][^451]And after that came Jesus and his disciples into the land of Judæa; and he went [6] about there with them, and baptized.[^452]And John also was baptizing in Ænon, which is beside Salim, because there was much water there: and they came, and were baptized. [7, 8][^453]And John was not yet come into prison.[^454]And there was an inquiry between [9] one of John’s disciples and one of the Jews about purifying.[^455]And they[^456] came unto John, and said unto him, Our master, he that was with thee beyond Jordan, to whom [10] thou hast borne witness, behold, he also baptizeth, and many come to him.[^457]John answered and said unto them,[^458] A man can receive nothing of himself, except it be [11] given him[^459] from heaven.[^460]Ye are they that bear witness unto me that I said, I am [12] not the Messiah, but I am one sent[^461] before him.[^462]And he that hath a bride is a bridegroom: and the friend of the bridegroom is he that standeth and listeneth to him, and rejoiceth greatly because of the bridegroom’s voice. Lo now,[^463] behold, [13, 14] [Arabic, p. 23 ] my joy becometh complete.[^464][^465]And he must increase and I decrease.[^466]For[^467] he that is come from above is higher than everything; and he that is of the earth, of the earth he is, and of the earth he speaketh; and he that came down from heaven is [15] higher than all.[^468]And he beareth witness of what he hath seen and heard: and no man [16] receiveth his witness.[^469]And he that hath received his witness hath asserted[^470] that he is [17] truly God.[^471][^472]And he whom God hath sent speaketh the words[^473] of God: God gave [18] not the Spirit by measure.[^474]The Father loveth the Son, and hath put everything in [19] his hands.[^475]Whosoever believeth in the Son hath eternal[^476] life; but whosoever obeyeth not the Son shall not see life, but the wrath of God cometh[^477] upon him." },
  { t = "note", id = "451", text = "John iii. 22." },
  { t = "note", id = "452", text = "John iii. 23." },
  { t = "note", id = "453", text = "John iii. 24." },
  { t = "note", id = "454", text = "John iii. 25." },
  { t = "note", id = "455", text = "John iii. 26." },
  { t = "note", id = "456", text = "Dual." },
  { t = "note", id = "457", text = "John iii. 27." },
  { t = "note", id = "458", text = "Plural. In the Peshitta it is two individuals in verse 25. In Sin. the first is an individual and the second is ambiguous. In Cur. both are plural." },
  { t = "note", id = "459", text = "Or, *he be given it*." },
  { t = "note", id = "460", text = "John iii. 28." },
  { t = "note", id = "461", text = "The ordinary word for *apostle*." },
  { t = "note", id = "462", text = "John iii. 29." },
  { t = "note", id = "463", text = "See § 9, 21, note." },
  { t = "note", id = "464", text = "So Ciasca’s printed text. The Vat. ms., however, probably represents a past tense." },
  { t = "note", id = "465", text = "John iii. 30." },
  { t = "note", id = "466", text = "John iii. 31." },
  { t = "note", id = "467", text = "*cf*. Peshitta." },
  { t = "note", id = "468", text = "John iii. 32." },
  { t = "note", id = "469", text = "John iii. 33." },
  { t = "note", id = "470", text = "*cf*. consonants of Syriac text." },
  { t = "note", id = "471", text = "Borg. ms., *that God is truly*, or, assuming a very common grammatical inaccuracy, *that God is true or truth*, the reading in Ibn-at-Tayyib’s Commentary." },
  { t = "note", id = "472", text = "John iii. 34." },
  { t = "note", id = "473", text = "Lit. *saying*." },
  { t = "note", id = "474", text = "John iii. 35." },
  { t = "note", id = "475", text = "John iii. 36." },
  { t = "note", id = "476", text = "Lit. *the life of eternity*; here and everywhere except § 21, 40." },
  { t = "note", id = "477", text = "i.e., alighteth-and-stayeth." },
  { t = "p", text = "[20][^478]And Jesus learned[^479] that the Pharisees had heard that he had received many disciples, [21] and that he was baptizing more than John[^480](not that Jesus was himself baptizing, [22] but his disciples);[^481]and *so* he left Judæa." },
  { t = "note", id = "478", text = "John iv. 1." },
  { t = "note", id = "479", text = "Or, *knew*." },
  { t = "note", id = "480", text = "John iv. 2." },
  { t = "note", id = "481", text = "John iv. 3a." },
  { t = "p", text = "[23][^482]And Herod the governor, because he used to be rebuked by John because of Herodias the wife of Philip his brother, and for all the sins which he was committing, [24] added to all that also this,[^483]that he shut up John in prison." },
  { t = "note", id = "482", text = "Luke iii. 19." },
  { t = "note", id = "483", text = "Luke iii. 20." },
  { t = "p", text = "[25][^484]And when Jesus heard that John was delivered up, he went away to Galilee. [26][^485]And he entered again into Cana, where he had made the water wine. And there [27] was at Capernaum a king’s servant, whose son was sick.[^486]And this *man* heard that Jesus was come from Judæa to Galilee; and he went to him, and besought of him that he would come down and heal his son; for he had come near unto death. [28, 29][^487]Jesus said unto him, Except ye see signs and wonders, ye do[^488] not believe.[^489]The [Arabic, p. 24 ] king’s servant said unto him, My Lord, come down, that the child die not. [30][^490]Jesus said unto him, Go; for thy son is alive. And that man believed the [31] word which Jesus spake, and went.[^491]And when he went down, his servants met him [32] and told him, and[^492] said unto him, Thy son is alive.[^493]And he asked them at what time he recovered. They said unto him, Yesterday at the seventh hour the fever left [33] him.[^494]And his father knew that that was at that hour in which Jesus said unto him, [34] Thy son is alive.[^495]And he believed, he and the whole people of his house. And this [35] is the second sign[^496] which Jesus did when he returned from Judæa to Galilee.[^497]And he was preaching in the synagogues of Galilee." },
  { t = "note", id = "484", text = "Matt. iv. 12." },
  { t = "note", id = "485", text = "John iv. 46." },
  { t = "note", id = "486", text = "John iv. 47." },
  { t = "note", id = "487", text = "John iv. 48." },
  { t = "note", id = "488", text = "Or, *will*." },
  { t = "note", id = "489", text = "John iv. 49." },
  { t = "note", id = "490", text = "John iv. 50." },
  { t = "note", id = "491", text = "John iv. 51." },
  { t = "note", id = "492", text = "Or, *good news, and*." },
  { t = "note", id = "493", text = "John iv. 52." },
  { t = "note", id = "494", text = "John iv. 53." },
  { t = "note", id = "495", text = "John iv. 54." },
  { t = "note", id = "496", text = "See § 5, 32, note." },
  { t = "note", id = "497", text = "Luke iv. 44." },
  { t = "p", text = "[36][^498]And he left Nazareth, and came and dwelt in Capernaum by the sea shore, in the [37] borders of Zebulun and Naphtali:[^499]that it might be fulfilled which was said in Isaiah the prophet, who said," },
  { t = "note", id = "498", text = "Matt. iv. 13." },
  { t = "note", id = "499", text = "Matt. iv. 14." },
  { t = "p", text = "[38][^500]The land of Zebulun, the land of Naphtali," },
  { t = "note", id = "500", text = "Matt. iv. 15." },
  { t = "p", text = "The way of the sea, the passage of the Jordan," },
  { t = "p", text = "Galilee of the nations:" },
  { t = "p", text = "[39][^501]The people sitting in darkness" },
  { t = "note", id = "501", text = "Matt. iv. 16." },
  { t = "p", text = "Saw a great light," },
  { t = "p", text = "And those sitting in the region and in the shadow of death," },
  { t = "p", text = "There appeared to them a light." },
  { t = "p", text = "[40][^502]And he taught them on the sabbaths.[^503]And they wondered because of his doctrine:[^504] [41] for his word was as if it were authoritative.[^505]And there was in the synagogue [42] a man with an unclean devil, and he cried out with a loud voice, and said,[^506]Let me alone; what have I to do with thee, thou Jesus of Nazareth? art thou come for our [43] destruction? I know thee who thou art, thou Holy One of God.[^507]And Jesus rebuked him, and said, Stop up thy mouth, and come out of him. And the demon threw him [44] in the midst and came out of him, having done him no harm.[^508]And great amazement [Arabic, p. 25 ] took hold upon every man. And they talked one with another, and said, What is this word that orders the unclean spirits with power and [45] authority, and they come out?[^509]And the news of him spread abroad in all the region which was around them." },
  { t = "note", id = "502", text = "Luke iv. 31b." },
  { t = "note", id = "503", text = "Luke iv. 32." },
  { t = "note", id = "504", text = "Perhaps we might here render *learning*; but see § 28, 17, note." },
  { t = "note", id = "505", text = "Luke iv. 33." },
  { t = "note", id = "506", text = "Luke iv. 34." },
  { t = "note", id = "507", text = "Luke iv. 35." },
  { t = "note", id = "508", text = "Luke iv. 36." },
  { t = "note", id = "509", text = "Luke iv. 37." },
  { t = "p", text = "[46][^510]And when Jesus went out of the synagogue,[^511]he saw a man sitting among the publicans,[^512] named Matthew: and he said unto him, Come after me. And he rose, and followed him." },
  { t = "note", id = "510", text = "Luke iv. 38." },
  { t = "note", id = "511", text = "Matt. ix. 9b." },
  { t = "note", id = "512", text = "So in the Arabic. It is, however, simply a misinterpretation of the expression in the Syriac versions for *at the place of toll* (*cf*. Ibn-at-Tayyib’s Commentary)." },
  { t = "p", text = "[47, 48][^513]And Jesus came to the house of Simon and Andrew with James and John.[^514]And Simon’s wife’s mother was oppressed with a great fever, and they besought him for [49] her.[^515]And he stood over her and rebuked her fever, and it left her, and immediately [50] she rose and ministered to them.[^516]And at even they brought to him many that had [51] demons: and he cast out their devils with the[^517] word.[^518]And all that had sick, their diseases being divers *and* malignant, brought them unto him. And he laid his hand [52] on them one by one[^519] and healed them:[^520]that that might be fulfilled which was said [53] in the prophet Isaiah, who said, He taketh our pains and beareth our diseases.[^521]And [54] all the city was gathered together unto the door of Jesus.[^522]And he cast out devils also from many, as they were crying out and saying, Thou art the Messiah, the Son of God; and he rebuked them. And he suffered not the demons to speak, because they knew him that he was the Lord the Messiah." },
  { t = "note", id = "513", text = "Mark i. 29b." },
  { t = "note", id = "514", text = "Luke iv. 38c." },
  { t = "note", id = "515", text = "Luke iv. 39." },
  { t = "note", id = "516", text = "Matt. viii. 16a." },
  { t = "note", id = "517", text = "*cf*. § 1, 40, note 2." },
  { t = "note", id = "518", text = "Luke iv. 40b." },
  { t = "note", id = "519", text = "Or, *each*." },
  { t = "note", id = "520", text = "Matt. viii. 17." },
  { t = "note", id = "521", text = "Mark i. 33." },
  { t = "note", id = "522", text = "Luke iv. 41." },
]

[[section]]
id = "section-7"
title = "Section VII."
level = 1
blocks = [
  { t = "p", text = "[1] [Arabic, p. 26 ][^523]And in the morning of that day he went out very early, and went to a [2] desert place, and was there praying.[^524]And Simon and those that were with [3] him sought him.[^525]And when they found him, they said unto him, All the people seek for [4] thee.[^526]He said unto them, Let us go into the adjacent villages and towns, that I may [5] preach there also; for to this end did I come.[^527]And the multitudes were seeking him, and came till they reached him; and they took hold of him, that he should not [6] go away from them.[^528]But Jesus said unto them, I must preach of the kingdom of [7] God in other cities also: for because of this gospel was I sent.[^529]And Jesus was going about all the cities and the villages, and teaching in their synagogues, and preaching the gospel of the kingdom, and healing all the diseases and all the sicknesses, [8][^530]and casting out the devils.[^531]And his fame became known[^532]that[^533] he was teaching in [9] every place and being glorified by every man.[^534]And when he passed by, he saw Levi the son of Alphæus sitting among the tax-gatherers;[^535] and he said unto him, Follow [10] me: and he rose and followed him.[^536]And the news of him was heard of in all the land of Syria: and they brought unto him all those whom grievous ills had befallen through divers diseases, and those that were enduring torment, and those that were possessed, and lunatics,[^537] and paralytics; and he healed them." },
  { t = "note", id = "523", text = "Mark i. 35." },
  { t = "note", id = "524", text = "Mark i. 36." },
  { t = "note", id = "525", text = "Mark i. 37." },
  { t = "note", id = "526", text = "Mark i. 38." },
  { t = "note", id = "527", text = "Luke iv. 42." },
  { t = "note", id = "528", text = "Luke iv. 43." },
  { t = "note", id = "529", text = "Matt. ix. 35." },
  { t = "note", id = "530", text = "Mark i. 39." },
  { t = "note", id = "531", text = "Luke iv. 14b." },
  { t = "note", id = "532", text = "Luke iv. 15." },
  { t = "note", id = "533", text = "This may represent a Syriac *as*." },
  { t = "note", id = "534", text = "Mark ii. 14." },
  { t = "note", id = "535", text = "See above, note to § 6, 46, which applies, although the Arabic words are different." },
  { t = "note", id = "536", text = "Matt. iv. 24." },
  { t = "note", id = "537", text = "Lit. *son-of-the-roofs*, a Syriac expression (*cf.* § 24, 31, note)." },
  { t = "p", text = "[11, 12][^538]And after some days Jesus entered into Capernaum again.[^539]And when they heard that he was in the house,[^540] many gathered, so that it could not hold them, even about [13] [Arabic, p. 27 ] the door; and he made known to them the word of God.[^541]And there were there some of the Pharisees and the teachers of the law, sitting, come from all the villages of Galilee, and Judæa, and Jerusalem; and the power of the Lord was [14] present to heal them.[^542]And some men brought a bed with a man on it who was paralytic. [15] And they sought to bring him in and lay him before him.[^543]And when they found no way to bring him in because of the multitude of people, they went up to the roof, and let him down with his bed from the roofing,[^544] into the midst before Jesus. [16][^545]And when Jesus saw their faith, he said unto the paralytic, My son, thy sins are forgiven [17] thee.[^546]And the scribes and Pharisees began to think within their hearts, Why doth this man blaspheme?[^547] Who is it that is able to forgive sins, but God alone? [18][^548]And Jesus knew by the spirit that they were thinking this within themselves, and he [19] said unto them, Why do ye think this within your heart?[^549]Which is better,[^550] that it should be said to the paralytic, Thy sins are forgiven thee, or *that* it should be said [20] to him, Arise, and take thy bed, and walk?[^551]That ye may know that the Son of man [21] is empowered on earth to forgive sins (and he said to the paralytic),[^552]I say unto thee, [22] Arise, take thy bed, and go to thine house.[^553]And he rose forthwith, and took his bed, and went out in the presence of all.[^554]And he went to his house praising God. [23][^555]And when those multitudes saw, they feared;[^556]and amazement took possession of [24] them,[^557]and they praised God, who had given such power to men.[^558]And they said, We have seen marvellous things to-day,[^559]of which we have never before seen the like." },
  { t = "note", id = "538", text = "Mark ii. 1." },
  { t = "note", id = "539", text = "Mark ii. 2." },
  { t = "note", id = "540", text = "This is the end of verse 1 in the Greek." },
  { t = "note", id = "541", text = "Luke v. 17b." },
  { t = "note", id = "542", text = "Luke v. 18." },
  { t = "note", id = "543", text = "Luke v. 19." },
  { t = "note", id = "544", text = "This word may be either a singular or a plural." },
  { t = "note", id = "545", text = "Luke v. 20." },
  { t = "note", id = "546", text = "Luke v. 21." },
  { t = "note", id = "547", text = "This word ordinarily means *to forge lies against*; but our translator uses it regularly as here." },
  { t = "note", id = "548", text = "Mark ii. 8." },
  { t = "note", id = "549", text = "Mark ii. 9." },
  { t = "note", id = "550", text = "Peshitta has *easier*." },
  { t = "note", id = "551", text = "Mark ii. 10." },
  { t = "note", id = "552", text = "Mark ii. 11." },
  { t = "note", id = "553", text = "Mark ii. 12a." },
  { t = "note", id = "554", text = "Luke v. 25b." },
  { t = "note", id = "555", text = "Matt. ix. 8a." },
  { t = "note", id = "556", text = "Luke v. 26a." },
  { t = "note", id = "557", text = "Matt. ix. 8b." },
  { t = "note", id = "558", text = "Luke v. 26c." },
  { t = "note", id = "559", text = "Mark ii. 12c." },
  { t = "p", text = "[25] [Arabic, p. 28 ][^560]And after that, Jesus went out, and saw a publican, named Levi, sitting [26] among the publicans:[^561] and he said unto him, Follow me.[^562]And he left [27] everything, and rose, and followed him.[^563]And Levi made him a great feast in his house. And there was a great multitude of the publicans and others sitting with him. [28][^564]And the scribes and Pharisees murmured, and said unto his disciples, Why do ye eat [29] and drink with the publicans and sinners?[^565]Jesus answered and said unto them, The physician seeketh not those who are well, but those that are afflicted with grievous [30, 31] sickness.[^566][^567]I came not to call the righteous, but the sinners, to repentance.[^568]And they said unto him, Why do the disciples of John fast always, and pray, and the [32] Pharisees also, but thy disciples eat and drink?[^569]He said unto them, Ye cannot make [33] the sons of the marriage feast[^570] fast, while the bridegroom is with them.[^571]Days will come, when the bridegroom is taken away from them; then will they fast in those [34] days.[^572]And he spake unto them a parable:[^573]No man inserteth a new patch and seweth it in a worn garment, lest the newness of the new take from the worn, and [35] there occur a great rent.[^574]And no man putteth fresh wine into old skins, lest the wine burst the skins, and the skins be destroyed, and the wine spilled; but they put [36] the fresh wine in the new skins, and both are preserved.[^575]And no man drinketh old wine and straightway desireth fresh; for he saith, The old is better." },
  { t = "note", id = "560", text = "Luke v. 27." },
  { t = "note", id = "561", text = "See above, note to § 6, 46." },
  { t = "note", id = "562", text = "Luke v. 28." },
  { t = "note", id = "563", text = "Luke v. 29." },
  { t = "note", id = "564", text = "Luke v. 30." },
  { t = "note", id = "565", text = "Luke v. 31." },
  { t = "note", id = "566", text = "A Syriacism." },
  { t = "note", id = "567", text = "Luke v. 32." },
  { t = "note", id = "568", text = "Luke v. 33." },
  { t = "note", id = "569", text = "Luke v. 34." },
  { t = "note", id = "570", text = "The Arabic word, which occurs here in many of the Arabic versions, could also be read *bridegroom*. The Syriac word for *marriage chamber* is also used in the sense of *marriage feast*." },
  { t = "note", id = "571", text = "Luke v. 35." },
  { t = "note", id = "572", text = "Luke v. 36a." },
  { t = "note", id = "573", text = "Mark ii. 21." },
  { t = "note", id = "574", text = "Mark ii. 22." },
  { t = "note", id = "575", text = "Luke v. 38, 39." },
  { t = "p", text = "[37][^576]And while Jesus was walking on the sabbath day among the sown fields, his disciples [Arabic, p. 29 ] hungered. And they were rubbing the ears with their hands, and [38] eating.[^577]But some of the Pharisees, when they saw them,[^578]said unto him, See, [39] why[^579] do thy disciples on the sabbath day that which is not lawful?[^580]But Jesus said unto them, Have ye not read in olden time what David did, when he had need and [40] hungered, he and those that were with him?[^581]how he entered the house of God, when Abiathar was high priest, and ate the bread of the table of the Lord, which it was not lawful that any should eat, save the priests, and gave to them that were with him also? [41][^582]And he said unto them, The sabbath was created because of man, and man was not [42] created because of the sabbath.[^583]Or have ye not read in the law, that the priests in [43] the temple profane the sabbath, and *yet* they are blameless?[^584]I say unto you now, [44] that here is what[^585] is greater than the temple.[^586]If ye had known *this*:[^587] I love mercy, [45] not sacrifice, ye would not have condemned[^588] those on whom is no blame.[^589]The [46] Lord of the sabbath is the Son of man.[^590]And his relatives heard, and went out to take him, and said, He hath gone out of his mind." },
  { t = "note", id = "576", text = "Matt. xii. 1." },
  { t = "note", id = "577", text = "Matt. xii. 2a." },
  { t = "note", id = "578", text = "Mark ii. 24." },
  { t = "note", id = "579", text = "Syr. In Arab. it means *what?*" },
  { t = "note", id = "580", text = "Mark ii. 25." },
  { t = "note", id = "581", text = "Mark ii. 26." },
  { t = "note", id = "582", text = "Mark ii. 27." },
  { t = "note", id = "583", text = "Matt. xii. 5." },
  { t = "note", id = "584", text = "Matt. xii. 6." },
  { t = "note", id = "585", text = "This may be simply a misinterpretation of the ordinary Syriac reading, which in all probability agrees with the masculine reading found in the Text. Rec. of the Greek." },
  { t = "note", id = "586", text = "Matt. xii. 7." },
  { t = "note", id = "587", text = "Is it possible that the Arabic word after *known* is not meant simply to introduce the quotation, but is to be taken in the adverbial sense, *how* representing the Syriac *what that is?*" },
  { t = "note", id = "588", text = "See § 10, 13, note." },
  { t = "note", id = "589", text = "Matt. xii. 8." },
  { t = "note", id = "590", text = "Mark iii. 21." },
  { t = "p", text = "[47][^591]And on the next[^592] sabbath day he entered[^593] into the synagogue and was teaching. [48][^594]And there was there a man whose right hand was withered. And the scribes and the Pharisees were watching him, whether he would heal on the sabbath day, [49] that they might find the means of accusing him.[^595]But he knew their thoughts, and said unto the man whose hand was withered, Rise and come near into the midst of [50] the synagogue.[^596]And when he came and stood, Jesus said unto them, I ask you, which is lawful to be done on the sabbath day, good or evil? shall lives be saved or [51] [Arabic, p. 30 ] destroyed?[^597]But they were silent.[^598]Regarding[^599] them with anger, being grieved because of the hardness of their hearts. And he said unto the man, Stretch out thy hand. And he stretched it out: and his hand became straight. [52][^600]Then he said unto them, What man of you shall have one sheep, and if it fall into a [53] well on the sabbath day, will not take it and lift it out?[^601]And how much is man better than a sheep! Wherefore it is lawful on the sabbath to do good." },
  { t = "note", id = "591", text = "Luke vi. 6." },
  { t = "note", id = "592", text = "Lit. *other*. The definite article is a mistake of the translator." },
  { t = "note", id = "593", text = "Here, at the end of leaf 17 of Vat. ms., is a note by a later hand: “Here a leaf is missing.” This first lacuna extends from § 7, 47 to § 8, 17." },
  { t = "note", id = "594", text = "Luke vi. 7." },
  { t = "note", id = "595", text = "Luke vi. 8." },
  { t = "note", id = "596", text = "Luke vi. 9." },
  { t = "note", id = "597", text = "Mark iii. 4b." },
  { t = "note", id = "598", text = "Mark iii. 5." },
  { t = "note", id = "599", text = "An easy clerical error for *And so he regarded* (*cf*. Peshitta)." },
  { t = "note", id = "600", text = "Matt. xii. 11." },
  { t = "note", id = "601", text = "Matt. xii. 12." },
]

[[section]]
id = "section-8"
title = "Section VIII."
level = 1
blocks = [
  { t = "p", text = "[1][^602]And the Pharisees went out, and consulted together concerning him, that they [2] might destroy him.[^603]And Jesus perceived, and removed thence: and great multitudes [3] followed him; and he healed all of them:[^604]and he forbade them that they should [4] not make him known:[^605][^606]that the saying in Isaiah the prophet might be fulfilled, which said," },
  { t = "note", id = "602", text = "Matt. xii. 14." },
  { t = "note", id = "603", text = "Matt. xii. 15." },
  { t = "note", id = "604", text = "Matt. xii. 16." },
  { t = "note", id = "605", text = "Lit. *lead to him*." },
  { t = "note", id = "606", text = "Matt. xii. 17." },
  { t = "p", text = "[5][^607]Behold, my servant[^608] with whom I am pleased;" },
  { t = "note", id = "607", text = "Matt. xii. 18." },
  { t = "note", id = "608", text = "The Arabic word strictly means *young man*." },
  { t = "p", text = "My beloved in whom my soul hath delighted:[^609]" },
  { t = "note", id = "609", text = "Or, *rested*." },
  { t = "p", text = "My spirit have I put upon him," },
  { t = "p", text = "And he shall proclaim to the nations judgement." },
  { t = "p", text = "[6][^610]He shall not dispute, nor cry out;" },
  { t = "note", id = "610", text = "Matt. xii. 19." },
  { t = "p", text = "And no man shall hear his voice in the marketplace." },
  { t = "p", text = "[7][^611]And a bruised reed shall he not break," },
  { t = "note", id = "611", text = "Matt. xii. 20." },
  { t = "p", text = "And a smoking lamp[^612] shall he not extinguish," },
  { t = "note", id = "612", text = "Or, *wick*." },
  { t = "p", text = "Until he shall bring forth judgement unto victory." },
  { t = "p", text = "[8][^613]And the nations shall rejoice in his name.[^614]" },
  { t = "note", id = "613", text = "Matt. xii. 21." },
  { t = "note", id = "614", text = "The Arab. might also mean*, And he shall preach (the good tidings) to the peoples in his name* (*cf*. § 22, 47, note)." },
  { t = "p", text = "[9][^615]And in those days Jesus went out to the mountain that he might pray, and he [10] spent the night[^616] there in prayer to God.[^617]And when the morning was come, he called the disciples.[^618]And he went towards the sea: and there followed him much people [11] from Galilee that he might pray,[^619][^620]and from Judæa, and from Jerusalem, and from Idumæa, and from beyond Jordan, and from Tyre, and from Sidon, and from Decapolis; [12] and great multitudes came unto him, which had heard what he did.[^621]And he spake to his disciples to bring him the boat because of the multitudes, that they [13] might not throng him.[^622]And he healed many, so that they were almost falling on [Arabic, p. 31 ] him[^623] on account of their seeking to get near him. And[^624] those that had [14] plagues and unclean spirits,[^625]as soon as they beheld him, would fall, and [15] cry out, and say, Thou art the Son of God.[^626]And he rebuked them much, that they [16] should not make him known.[^627]And those that were under the constraint of[^628] unclean [17] spirits were healed.[^629]And all of the crowd were seeking to come near[^630] him; because power went out from him, and he healed them all." },
  { t = "note", id = "615", text = "Luke vi. 12." },
  { t = "note", id = "616", text = "This phrase, in this case adopted from the Syriac, really means, in Arab., *morning found him*." },
  { t = "note", id = "617", text = "Luke vi. 13a." },
  { t = "note", id = "618", text = "Mark iii. 7." },
  { t = "note", id = "619", text = "It must be remembered that we have here only one ms. The Arabic words for *Galilee* and for *mountain* are very similar. The words *that he might pray* have therefore probably made their way here by some error from § 8, 9, above." },
  { t = "note", id = "620", text = "Mark iii. 8." },
  { t = "note", id = "621", text = "Mark iii. 9." },
  { t = "note", id = "622", text = "Mark iii. 10." },
  { t = "note", id = "623", text = "So (with the Peshitta) by transposing two letters. The Arabic text as it stands can hardly be translated. *Almost* may be simply a corruption of the Arabic word *were*." },
  { t = "note", id = "624", text = "The syntax of the Arabic is ambiguous. The alternative followed above, which seems the most natural, is that which agrees most nearly with the Peshitta." },
  { t = "note", id = "625", text = "Mark iii. 11." },
  { t = "note", id = "626", text = "Mark iii. 12." },
  { t = "note", id = "627", text = "Luke vi. 18." },
  { t = "note", id = "628", text = "Or, *troubled with*." },
  { t = "note", id = "629", text = "Luke vi. 19." },
  { t = "note", id = "630", text = "This is the meaning of the Arabic word, as it is the primary meaning of the Syriac; but in this work a number of words meaning *approach* are used (and generally translated) in the sense of *touch*. The commonest word so used is that in § 12, 13 (*cf*. also § 12, 35)." },
  { t = "p", text = "[18, 19][^631]And when Jesus saw the multitudes, he went up to the mountain.[^632]And he called his disciples, and chose from them twelve; and they are those whom he named [20] apostles:[^633]Simon, whom he named Cephas, and Andrew his brother, and James and [21] John, and Philip and Bartholomew,[^634]and Matthew and Thomas, and James the son [22] of Alphæus, and Simon which *was* called the Zealot,[^635]and Judas the son of James, [23] and Judas the Iscariot, being he that had betrayed him.[^636][^637]And Jesus went down with them and stood in the plain, and the company of his disciples, and the great [24] multitude of people.[^638]And these twelve he chose to be with him, and that he might [25] send them to preach, and to have power to heal the sick and to cast out devils." },
  { t = "note", id = "631", text = "Matt. v. 1a." },
  { t = "note", id = "632", text = "Luke vi. 13b." },
  { t = "note", id = "633", text = "Luke vi. 14." },
  { t = "note", id = "634", text = "Luke vi. 15." },
  { t = "note", id = "635", text = "Luke vi. 16." },
  { t = "note", id = "636", text = "So Vat. ms., followed by Ciasca (*cf*. Sin.). Borg. ms. has *he that was betraying or was a traitor* (*cf*. Peshitta)." },
  { t = "note", id = "637", text = "Luke vi. 17a." },
  { t = "note", id = "638", text = "Mark iii. 14." },
  { t = "p", text = "[26][^639]Then he lifted up his eyes unto them, and opened his mouth,[^640]and taught them, and said," },
  { t = "note", id = "639", text = "Luke vi. 20." },
  { t = "note", id = "640", text = "Matt. v. 2." },
  { t = "p", text = "[27][^641]Blessed are the poor in spirit: for the kingdom of heaven is theirs." },
  { t = "note", id = "641", text = "Matt. v. 3." },
  { t = "p", text = "[28][^642]Blessed are the sorrowful: for they shall be comforted." },
  { t = "note", id = "642", text = "Matt. v. 4." },
  { t = "p", text = "[29][^643]Blessed are the humble: for they shall inherit the earth." },
  { t = "note", id = "643", text = "Matt. v. 5." },
  { t = "p", text = "[30][^644]Blessed are they that hunger and thirst after righteousness: for they shall be satisfied." },
  { t = "note", id = "644", text = "Matt. v. 6." },
  { t = "p", text = "[31][^645]Blessed are the merciful: for on them shall be mercy." },
  { t = "note", id = "645", text = "Matt. v. 7." },
  { t = "p", text = "[32] [Arabic, p. 32 ][^646]Blessed are the pure in their hearts: for they shall see God." },
  { t = "note", id = "646", text = "Matt. v. 8." },
  { t = "p", text = "[33][^647]Blessed are the peacemakers: for they shall be called the sons of God." },
  { t = "note", id = "647", text = "Matt. v. 9." },
  { t = "p", text = "[34][^648]Blessed are they that were persecuted[^649] for righteousness’ sake: for the kingdom of heaven is theirs." },
  { t = "note", id = "648", text = "Matt. v. 10." },
  { t = "note", id = "649", text = "This word, the ordinary meaning of which is *expel*, is freely used by our translator in the sense of *persecute*." },
  { t = "p", text = "[35][^650]Blessed are ye when men shall hate you, and separate you from them, and persecute you, and reproach you,[^651]and shall speak against you with all evil talk, for my [36] sake, falsely.[^652]Then rejoice and be glad, for your reward is great in heaven: for so persecuted they the prophets before you." },
  { t = "note", id = "650", text = "Luke vi. 22a." },
  { t = "note", id = "651", text = "Matt. v. 11b." },
  { t = "note", id = "652", text = "Matt. v. 12." },
  { t = "p", text = "[37][^653]But woe unto you rich! for ye have received your consolation." },
  { t = "note", id = "653", text = "Luke vi. 24." },
  { t = "p", text = "[38][^654]Woe unto you that are satisfied! ye shall hunger." },
  { t = "note", id = "654", text = "Luke vi. 25." },
  { t = "p", text = "Woe unto you that laugh now! ye shall weep and be sad." },
  { t = "p", text = "[39][^655]Woe unto you when men praise you! for so did their fathers use to do to the false prophets." },
  { t = "note", id = "655", text = "Luke v. 26." },
  { t = "p", text = "[40][^656]Unto you do I say, *ye* which hear,[^657]Ye are the salt of the earth: if then the salt become tasteless, wherewith shall it be salted? For any purpose it is of no use, but [41] is thrown outside, and men tread upon it.[^658]Ye are the light of the world. It is [42] impossible that a city built on a mountain should be hid.[^659]Neither do they light a lamp and place it under a bushel, but on the lamp-stand, and it giveth light to all [43] who are in the house.[^660]So shall[^661] your light shine before men, that they may see [44] your good works, and glorify your Father which is in heaven.[^662]There is nothing [45] secret that shall not be revealed, or hidden that shall not be known.[^663]Whoever hath ears that hear, let him hear." },
  { t = "note", id = "656", text = "Luke vi. 27." },
  { t = "note", id = "657", text = "Matt. v. 13." },
  { t = "note", id = "658", text = "Matt. v. 14." },
  { t = "note", id = "659", text = "Matt. v. 15." },
  { t = "note", id = "660", text = "Matt. v. 16." },
  { t = "note", id = "661", text = "Or, *let* (*cf.* § 4, 20, note)." },
  { t = "note", id = "662", text = "Mark iv. 22." },
  { t = "note", id = "663", text = "Mark iv. 23." },
  { t = "p", text = "[46][^664]Think not that I came to destroy the law or the prophets; I came not to destroy, [47] but to complete.[^665]Verily I say unto you, Until heaven and earth shall pass, there [Arabic, p. 33 ] shall not pass one point or one letter of the law, until all of it shall be [48] *accomplished*.[^666]Every one who shall violate now one of these small commandments, and shall teach men so, shall be called lacking in the kingdom of heaven: every one that shall do and teach shall[^667] be called great in the kingdom [49] of heaven.[^668]I say unto you now, unless your righteousness abound more than that of the scribes and Pharisees, ye shall not enter the kingdom of heaven." },
  { t = "note", id = "664", text = "Matt. v. 17." },
  { t = "note", id = "665", text = "Matt. v. 18." },
  { t = "note", id = "666", text = "Matt. v. 19." },
  { t = "note", id = "667", text = "Lit. *this (man) shall*." },
  { t = "note", id = "668", text = "Matt. v. 20." },
  { t = "p", text = "[50][^669]Ye have heard that it was said to the ancients, Do not kill; and every one that [51] killeth is worthy of the judgement.[^670]But I say unto you that every one who is angry with his brother without a cause is worthy of the judgement; and every one that saith to his brother, Thou foul one, is condemned[^671] by the synagogue; and whosoever [52] saith to him, Thou fool, is worthy of the fire of Gehenna.[^672]If thou art now offering thy gift at the altar, and rememberest there that thy brother hath conceived [53] against thee any grudge,[^673]leave thy gift at the altar, and go first and satisfy thy [54] brother, and then return and offer thy gift.[^674]Join[^675] thine adversary quickly,[^676]and while thou art still with him in the way, give a ransom and free thyself from him; [55] lest thine adversary deliver thee to the judge,[^677]and the judge deliver thee to the tax-collector, [56] and thou fall into prison.[^678]And verily I say unto thee, Thou shalt not go out thence until thou payest the last farthing." },
  { t = "note", id = "669", text = "Matt. v. 21." },
  { t = "note", id = "670", text = "Matt. v. 22." },
  { t = "note", id = "671", text = "See § 10, 13, note." },
  { t = "note", id = "672", text = "Matt. v. 23." },
  { t = "note", id = "673", text = "Matt. v. 24." },
  { t = "note", id = "674", text = "Matt. v. 25a." },
  { t = "note", id = "675", text = "The text is rather uncertain." },
  { t = "note", id = "676", text = "Luke xii. 58a." },
  { t = "note", id = "677", text = "Matt. v. 25c." },
  { t = "note", id = "678", text = "Matt. v. 26." },
  { t = "p", text = "[57, 58][^679]Ye have heard that it was said, Do not commit adultery:[^680]but I now say unto you, that every one that looketh at a woman lusting after her hath forthwith already [59] [Arabic, p. 34 ] committed adultery with her in his heart.[^681]If thy right eye injure thee, put it out and cast it from thee; for it is preferable for thee that one of thy [60] members should perish, and not thy whole body go into the fire *of hell*.[^682]And if thy right hand injure thee, cut it off and cast it from thee; and it is better for thee that [61] one of thy members should perish, and not thy whole body fall into Gehenna.[^683]It was said that he that putteth away his wife *should* give her a writing of divorcement: [62][^684]but I say unto you, that every one that putteth away his wife, except for the cause of adultery, hath made it lawful for[^685] her to commit adultery: and whosoever taketh one that is put away committeth adultery." },
  { t = "note", id = "679", text = "Matt. v. 27." },
  { t = "note", id = "680", text = "Matt. v. 28." },
  { t = "note", id = "681", text = "Matt. v. 29." },
  { t = "note", id = "682", text = "Matt. v. 30." },
  { t = "note", id = "683", text = "Matt. v. 31." },
  { t = "note", id = "684", text = "Matt. v. 32." },
  { t = "note", id = "685", text = "The text is probably corrupt. Vat. ms. has on margin, *i.e., caused her*." },
]

[[section]]
id = "section-9"
title = "Section IX."
level = 1
blocks = [
  { t = "p", text = "[1][^686]Ye have heard also that it was said unto the ancients, Lie not, but perform unto [2] God in thy oaths:[^687]but I say unto you, Swear not at all; neither by heaven, for it [3] is God’s throne;[^688]nor by the earth, for it is a footstool under his feet; nor yet by [4] Jerusalem, for it is the city of the great[^689] King.[^690]Neither shalt thou swear by thy [5] head, for thou canst not make in it one lock of hair black or white.[^691]But your word shall be either Yea or Nay, and what is in excess of this is of the evil one." },
  { t = "note", id = "686", text = "Matt. v. 33." },
  { t = "note", id = "687", text = "Matt. v. 34." },
  { t = "note", id = "688", text = "Matt. v. 35." },
  { t = "note", id = "689", text = "The adj. is in the superlative." },
  { t = "note", id = "690", text = "Matt. v. 36." },
  { t = "note", id = "691", text = "Matt. v. 37." },
  { t = "p", text = "[6, 7][^692]Ye have heard that it was said, Eye for eye, and tooth for tooth:[^693]but I say unto you, Stand not in opposition to the evil;[^694] but whosoever smiteth thee on thy right [8] cheek,[^695] turn to him also the other.[^696]And he that would sue thee, and take thy tunic, [9] leave to him also thy wrapper.[^697]And whosoever compelleth thee one mile, go with [10] [Arabic, p. 35 ] him twain.[^698]And he that asketh thee, give unto him:[^699]and he that would borrow of thee, prevent him not. And prosecute[^700] not him that taketh thy [11] substance.[^701]And as ye desire that men should do to you, so do ye also to them." },
  { t = "note", id = "692", text = "Matt. v. 38." },
  { t = "note", id = "693", text = "Matt. v. 39." },
  { t = "note", id = "694", text = "A literal reproduction of the Greek, like that in Syr. versions." },
  { t = "note", id = "695", text = "Lit. *jaw*." },
  { t = "note", id = "696", text = "Matt. v. 40." },
  { t = "note", id = "697", text = "Matt. v. 41." },
  { t = "note", id = "698", text = "Matt. v. 42." },
  { t = "note", id = "699", text = "Luke vi. 30b." },
  { t = "note", id = "700", text = "Or, *punish*." },
  { t = "note", id = "701", text = "Luke vi. 31." },
  { t = "p", text = "[12, 13][^702]Ye have heard that it was said, Love thy neighbour and hate thine enemy:[^703]but I say unto you, Love your enemies, and pray for those that curse you, and deal well with those that hate you, and pray for those who take you with violence and persecute you; [14][^704]that ye may be sons of your heavenly Father, who maketh his sun to rise on the good and the evil, and sendeth down his rain on the righteous and the [15] unrighteous.[^705]If ye love them that love you, what reward shall ye have?[^706]for the publicans [16] and sinners also love those that love them.[^707]And if ye do a kindness to those [17] who treat you well, where is your superiority? for sinners also do likewise.[^708]And if ye lend to him of whom ye hope for a reward,[^709] where is your superiority? for the [18] sinners also lend to sinners, seeking recompense from[^710] them.[^711]But love your enemies, and do good to them, and lend, and cut not off the hope of any man; that your reward may be great, and ye may be the children of the Highest: for he is lenient [19] towards the wicked and the ungrateful.[^712]Be ye merciful, even as your Father also is [20] merciful.[^713]And if ye inquire for the good of your brethren only, what more have [21] ye done *than others?* is not this the conduct of the publicans also?[^714]Be ye now[^715] perfect, even as your Father which is in heaven is perfect." },
  { t = "note", id = "702", text = "Matt. v. 43." },
  { t = "note", id = "703", text = "Matt. v. 44." },
  { t = "note", id = "704", text = "Matt. v. 45." },
  { t = "note", id = "705", text = "Matt. v. 46." },
  { t = "note", id = "706", text = "Luke vi. 32b." },
  { t = "note", id = "707", text = "Luke vi. 33." },
  { t = "note", id = "708", text = "Luke vi. 34." },
  { t = "note", id = "709", text = "Or, *return*." },
  { t = "note", id = "710", text = "Or, *to be given back as much by*." },
  { t = "note", id = "711", text = "Luke vi. 35." },
  { t = "note", id = "712", text = "Luke vi. 36." },
  { t = "note", id = "713", text = "Matt. v. 47." },
  { t = "note", id = "714", text = "Matt. v. 48." },
  { t = "note", id = "715", text = "Our translator is continually using this word (*cf*. § 9, 23) where the context and the originals require *then* or *therefore*. We shall only occasionally reproduce the peculiarity." },
  { t = "p", text = "[22][^716]Consider your alms; do them not before men to let them see you: and if it be not [23] so,[^717] ye have no reward before your Father which is in the heavens.[^718]When then thou givest an alms now, do not sound a trumpet before thee, as do the people of hypocrisy, [Arabic, p. 36 ] in the synagogues and the marketplaces, that men may praise them. And [24] verily say I unto you, They have received their reward.[^719]But thou, when [25] thou doest alms, let thy left hand not know what thy right hand doeth;[^720]that thine alms may be concealed: and thy Father which seeth in secret shall reward thee openly." },
  { t = "note", id = "716", text = "Matt. vi. 1." },
  { t = "note", id = "717", text = "A clumsy phrase." },
  { t = "note", id = "718", text = "Matt. vi. 2." },
  { t = "note", id = "719", text = "Matt. vi. 3." },
  { t = "note", id = "720", text = "Matt. vi. 4." },
  { t = "p", text = "[26][^721]And whenever thou prayest, be not as the hypocrites, who love to stand in the synagogues and in the corners of the marketplaces for prayers, that men may behold [27] them.[^722]And verily say I unto you, They have received their reward. But thou, when thou prayest, enter into thy closet, and fasten thy door, and pray to thy Father in secret, and thy Father which seeth in secret shall reward thee openly. [28][^723]And whenever ye pray, be not babblers, as the heathen; for they think that by the [29] abundance of their words they shall be heard.[^724]Then be not ye now like unto them: [30] for your Father knoweth your request before ye ask him.[^725]One of his disciples said [31] unto him, Our Lord, teach us to pray, as John taught his disciples.[^726]Jesus said unto [32] them, Thus now pray ye now:[^727][^728]Our Father which art in heaven, Hallowed be thy [33, 34] name.[^729]Thy kingdom come. Thy will be *done*,[^730] as in heaven, so on earth.[^731]Give us the [35] food of to-day.[^732]And forgive us our trespasses, as we forgave those that trespass*ed* [36] against us.[^733]And bring us not into temptations, but deliver us from the evil one. For [37] thine is the kingdom, and the power, and the glory, for ever and ever.[^734][^735]If ye forgive [Arabic, p. 37 ] men their wrong-doing,[^736] your Father which is in heaven will forgive you. [38][^737]But if ye forgive not men, neither will your Father pardon your wrong-doing." },
  { t = "note", id = "721", text = "Matt. vi. 5." },
  { t = "note", id = "722", text = "Matt. vi. 6." },
  { t = "note", id = "723", text = "Matt. vi. 7." },
  { t = "note", id = "724", text = "Matt. vi. 8." },
  { t = "note", id = "725", text = "Luke xi. 1b." },
  { t = "note", id = "726", text = "Luke xi. 2a." },
  { t = "note", id = "727", text = "The Arabic text makes Matthew begin here." },
  { t = "note", id = "728", text = "Matt. vi. 9." },
  { t = "note", id = "729", text = "Matt. vi. 10." },
  { t = "note", id = "730", text = "The text as printed reads, *That thy will may be (done)*; but it is to be explained as a (very common grammatical) transcriptional error. The Cur., however, has *and*." },
  { t = "note", id = "731", text = "Matt. vi. 11." },
  { t = "note", id = "732", text = "Matt. vi. 12." },
  { t = "note", id = "733", text = "Matt. vi. 13." },
  { t = "note", id = "734", text = "Lit. *unto the age of the ages*." },
  { t = "note", id = "735", text = "Matt. vi. 14." },
  { t = "note", id = "736", text = "Or, *folly*; and so in following verse." },
  { t = "note", id = "737", text = "Matt. vi. 15." },
  { t = "p", text = "[39][^738]When ye fast, do not frown, as the hypocrites; for they make their faces austere, that they may be seen of[^739] men that they are fasting. Verily I say unto you, They [40] have received their reward.[^740]But when thou fastest, wash thy face and anoint thy [41] head;[^741]that thou make not an appearance to men of fasting, but to thy Father which is in secret: and thy Father which seeth in secret shall reward thee." },
  { t = "note", id = "738", text = "Matt. vi. 16." },
  { t = "note", id = "739", text = "Or, *shew to*." },
  { t = "note", id = "740", text = "Matt. vi. 17." },
  { t = "note", id = "741", text = "Matt. vi. 18." },
  { t = "p", text = "[42][^742]Be not agitated, little flock; for your Father hath delighted to give you the kingdom. [43][^743]Sell your possessions, and give in alms; take to yourselves purses that wax [44] not old.[^744]Lay not up treasure on earth, where moth and worm corrupt, and where [45] thieves break through and steal:[^745]but lay up for yourselves treasure in heaven, where [46] moth and worm do not corrupt, nor thieves break through nor steal:[^746]for where your [47] treasure is, there also will your heart be.[^747]The lamp of the body is the eye: if then[^748] [48] thine eye now be sound, thy whole body also shall be light.[^749]But if thine eye be evil, all thy body shall be dark. And if the light which is in thee is darkness, how [49] great is[^750] thy darkness![^751]Be watchful that the light which is in thee be not darkness. [50][^752]Because that, if thy whole body is light, and have no part dark, it shall all be light, as the lamp giveth light to thee with its flame." },
  { t = "note", id = "742", text = "Luke xii. 32." },
  { t = "note", id = "743", text = "Luke xii. 33a." },
  { t = "note", id = "744", text = "Matt. vi. 19." },
  { t = "note", id = "745", text = "Matt. vi. 20." },
  { t = "note", id = "746", text = "Matt. vi. 21." },
  { t = "note", id = "747", text = "Matt. vi. 22." },
  { t = "note", id = "748", text = "Or, *for if*." },
  { t = "note", id = "749", text = "Matt. vi. 23." },
  { t = "note", id = "750", text = "Or, *will be*." },
  { t = "note", id = "751", text = "Luke xi. 35." },
  { t = "note", id = "752", text = "Luke xi. 36." },
]

[[section]]
id = "section-10"
title = "Section X."
level = 1
blocks = [
  { t = "p", text = "[1] [Arabic, p. 38 ][^753]No man can serve two masters; and that because it is necessary that he hate one of them and love the other, and honour one of them and despise the [2] other.[^754]Ye cannot serve God and possessions. And because of this I say unto you, Be not anxious for yourselves,[^755] what ye shall eat and what ye shall drink; neither for your bodies, what ye shall put on. Is not the life better than the food, and the body [3] than the raiment?[^756]Consider the birds of the heaven, which sow not, nor reap, nor store in barns; and *yet* your Father which is in heaven feedeth them. Are not ye [4] better than they?[^757]Who of you when he trieth is able to add to his stature one [5] cubit?[^758]If then ye are not able for a small *thing*, why are ye anxious about the [6, 7] rest?[^759]Consider the wild lily, how it grows, although it toils not, nor spins;[^760]and I say unto you that Solomon in the greatness of his glory was not clothed like one of [8] them.[^761]And if God so clothe the grass of the field, which to-day is, and to-morrow [9] is cast[^762] into the oven, how much more shall be unto you, O ye of little faith![^763]Be not anxious, so as to say, What shall we eat? or, What shall we drink? or, With [10] what shall we be clothed?[^764]Neither let your minds be perplexed in this:[^765]all these *things* the nations of the world seek; and your Father which is in heaven knoweth [11] your need of all these things.[^766]Seek ye first the kingdom of God, and his righteousness; [12] [Arabic, p. 39 ] and all these shall come to you as something additional for you.[^767]Be not anxious for the morrow; for the morrow shall be anxious for what belongs to it. Sufficient unto the day is its evil." },
  { t = "note", id = "753", text = "Matt. vi. 24." },
  { t = "note", id = "754", text = "Matt. vi. 25." },
  { t = "note", id = "755", text = "Or, *your souls*; or, *your lives*." },
  { t = "note", id = "756", text = "Matt. vi. 26." },
  { t = "note", id = "757", text = "Matt. vi. 27." },
  { t = "note", id = "758", text = "Luke xii. 26." },
  { t = "note", id = "759", text = "Matt. vi. 28." },
  { t = "note", id = "760", text = "Matt. vi. 29." },
  { t = "note", id = "761", text = "Matt. vi. 30." },
  { t = "note", id = "762", text = "Lit. *falleth* (*cf*. Syriac)." },
  { t = "note", id = "763", text = "Matt. vi. 31." },
  { t = "note", id = "764", text = "Luke xii. 29b." },
  { t = "note", id = "765", text = "Matt. vi. 32." },
  { t = "note", id = "766", text = "Matt. vi. 33." },
  { t = "note", id = "767", text = "Matt. vi. 34." },
  { t = "p", text = "[13][^768]Judge not, that ye be not judged:[^769]condemn[^770] not, that ye be not condemned: [14][^771]forgive, *and* it shall be forgiven you: release, and ye shall be released: give, that ye may be given *unto*; with good measure, abundant, full, they shall thrust[^772] into your [15] bosoms.[^773]With what measure ye measure it shall be measured to you. See *to it* what ye hear: with what measure ye measure it shall be measured to you; and ye [16] shall be given more.[^774]I say unto those that hear, He that hath shall be given *unto*; and he that hath not, that which he regards[^775] as his shall be taken from him." },
  { t = "note", id = "768", text = "Matt. vii. 1." },
  { t = "note", id = "769", text = "Luke vi. 37b." },
  { t = "note", id = "770", text = "The word means *to contend successfully*, but is used throughout by our translator in the sense of *condemn*." },
  { t = "note", id = "771", text = "Luke vi. 38." },
  { t = "note", id = "772", text = "This is the reading adopted by Ciasca in his Latin version. The diacritical points in the Arabic text, as he has printed it (perhaps a misprint), give second person plural passive instead of third plural active." },
  { t = "note", id = "773", text = "Mark iv. 24b." },
  { t = "note", id = "774", text = "Mark iv. 25." },
  { t = "note", id = "775", text = "*cf*. Luke viii. 18b. Our translator uses the same word in § 50, 5=Luke xxiii. 8b; and in both cases it represents the same word in the Syriac versions." },
  { t = "p", text = "[17][^776]And he spake unto them a parable, Can a blind man haply guide a blind man? [18] shall[^777] they not both fall into a hollow?[^778]A disciple is not better than his master; [19] every perfect man shall be as his master.[^779]Why lookest thou at the mote which is in the eye of thy brother, but considerest not the column that is in thine *own* eye? [20][^780]Or how canst thou say to thy brother, Brother, I will take out the mote from thine eye; and the column which is in thine eye thou seest not? Thou hypocrite, take out first the column from thine eye; and then shalt thou see to take out the mote from the eye of thy brother." },
  { t = "note", id = "776", text = "Luke vi. 39." },
  { t = "note", id = "777", text = "Or, *Do*." },
  { t = "note", id = "778", text = "Luke vi. 40." },
  { t = "note", id = "779", text = "Luke vi. 41." },
  { t = "note", id = "780", text = "Luke vi. 42." },
  { t = "p", text = "[21][^781]Give not that which is holy unto the dogs, neither cast your pearls before the swine, lest they trample them with their feet, and return and wound you." },
  { t = "note", id = "781", text = "Matt. vii. 6." },
  { t = "p", text = "[22][^782]And he said unto them, Who of you, that hath a friend, goeth to him at midnight, [23] and saith unto him, My friend, lend me three loaves;[^783]for a friend hath come [24] to me from a journey, and I have nothing to offer to him:[^784]and that friend shall [Arabic, p. 40 ] answer him from within, and say unto him, Trouble me not; for the door is shut, and my children are with me in bed, and I cannot rise and give thee? [25][^785]And verily I say unto you, If he will not give him because of friendship, yet because [26] of *his* importunity he will rise and give him what he seeketh.[^786]And I also say unto you, Ask, *and* ye shall be given *unto*; seek, *and* ye shall find; knock, *and* it shall be [27] opened unto you.[^787]Every one that asketh receiveth, and he that seeketh findeth, and [28] he that knocketh, it shall be opened to him.[^788]What father of you, shall his son ask for bread—will he, think you, give him a stone?[^789]and if he ask of him a fish, will he, [29] think you,[^790]instead of the fish give him a serpent? and if he ask him for an egg, will [30] he, think you, extend to him a scorpion?[^791]If ye then, *although* being evil, know the gifts *which are* good, and give them to your children, how much more shall your [31] Father which is in heaven give the Holy Spirit to them that ask him?[^792]Whatsoever ye would that men should do to you, do ye even so to them: this is the law and the prophets." },
  { t = "note", id = "782", text = "Luke xi. 5." },
  { t = "note", id = "783", text = "Luke xi. 6." },
  { t = "note", id = "784", text = "Luke xi. 7." },
  { t = "note", id = "785", text = "Luke xi. 8." },
  { t = "note", id = "786", text = "Luke xi. 9." },
  { t = "note", id = "787", text = "Luke xi. 10." },
  { t = "note", id = "788", text = "Luke xi. 11." },
  { t = "note", id = "789", text = "The Arabic might also be rendered, *What father of you whom his son asketh for bread, will (think you) give him a stone?* But as the Peshitta preserves the confused construction of the Greek, it is probably better to render as above." },
  { t = "note", id = "790", text = "Luke xi. 12." },
  { t = "note", id = "791", text = "Luke xi. 13." },
  { t = "note", id = "792", text = "Matt. vii. 12." },
  { t = "p", text = "[32][^793]Enter[^794] ye by the narrow gate; for the wide gate and the broad way lead to destruction, [33] and many they be which go therein.[^795]How narrow is the gate and straitened the way leading to life! and few be they that find it." },
  { t = "note", id = "793", text = "Matt. vii. 13." },
  { t = "note", id = "794", text = "There is nothing about *striving*. The verb is *walaga*, which means *enter* (*cf*. § 11, 48)." },
  { t = "note", id = "795", text = "Matt. vii. 14." },
  { t = "p", text = "[34][^796]Beware of false prophets, which come to you in sheep’s[^797] clothing, while within [35] they are ravening wolves.[^798]But by their fruits ye shall know them.[^799]For every tree is known by its fruit. For figs are not gathered[^800] of thorns, neither are grapes plucked of [36] briers.[^801]Even so every good tree bringeth forth good fruit, but the evil tree bringeth [37] [Arabic, p. 41 ] forth evil fruit.[^802]The good tree cannot bring forth evil fruit, neither *can* the [38] evil tree bring forth good fruit.[^803]The good man from the good treasures that are in his heart bringeth forth good *things*; and the evil man from the evil treasures that are in his heart bringeth forth evil *things*: and from the overflowings of the [39] heart the lips speak.[^804]Every tree that beareth not good fruit is cut *down* and cast [40, 41] into the fire.[^805]Therefore by their fruits ye shall know them.[^806]Not all that say unto me, My Lord, my Lord, shall enter the kingdom of the heavens; but he that doeth [42] the will of my Father which is in heaven.[^807]Many shall say unto me in that day, My Lord, my Lord, did we not prophesy in thy name, and in thy name cast out [43] devils, and in thy name do many powers?[^808]Then shall I say unto them, I never [44] knew you: depart from me, ye servants of iniquity.[^809]Every man that cometh unto [45] me, and heareth my sayings, and doeth them, I will shew you to what he is like:[^810]he is like the wise man which built a house, and digged and went deep, and laid the [46] foundations on a rock:[^811]and the rain came down, and the rivers overflowed, and the winds blew, and shook that house, and it fell not: for its foundation was laid on [47] rocks.[^812]And every one that heareth these my words, and doeth them not, is like [48] the foolish man which built his house on sand, without foundation:[^813]and the rain descended, and the rivers overflowed, and the winds blew, and smote upon that house, and it fell: and the fall of it was great." },
  { t = "note", id = "796", text = "Matt. vii. 15." },
  { t = "note", id = "797", text = "Or, *lambs’*." },
  { t = "note", id = "798", text = "Matt. vii. 16a." },
  { t = "note", id = "799", text = "Luke vi. 44." },
  { t = "note", id = "800", text = "The verbs might be *singular* active, but not *plural* as in Syriac versions (*cf*., however, § 38, 43, note, end). In the Borg. ms. the nouns are in the accusative." },
  { t = "note", id = "801", text = "Matt. vii. 17." },
  { t = "note", id = "802", text = "Matt. vii. 18." },
  { t = "note", id = "803", text = "Luke vi. 45." },
  { t = "note", id = "804", text = "Matt. vii. 19." },
  { t = "note", id = "805", text = "Matt. vii. 20." },
  { t = "note", id = "806", text = "Matt. vii. 21." },
  { t = "note", id = "807", text = "Matt. vii. 22." },
  { t = "note", id = "808", text = "Matt. vii. 23." },
  { t = "note", id = "809", text = "Luke vi. 47." },
  { t = "note", id = "810", text = "Luke vi. 48." },
  { t = "note", id = "811", text = "Matt. vii. 25." },
  { t = "note", id = "812", text = "Matt. vii. 26." },
  { t = "note", id = "813", text = "Matt. vii. 27." },
]

[[section]]
id = "section-11"
title = "Section XI."
level = 1
blocks = [
  { t = "p", text = "[1] [Arabic, p. 42 ][^814]And when Jesus finished these sayings, the multitudes were astonished [2] at his teaching;[^815]and that because he was teaching them as one having authority, not as their scribes and the Pharisees." },
  { t = "note", id = "814", text = "Matt. vii. 28." },
  { t = "note", id = "815", text = "Matt. vii. 29." },
  { t = "p", text = "[3][^816]And when he descended from the mountain, great multitudes followed him." },
  { t = "note", id = "816", text = "Matt. viii. 1." },
  { t = "p", text = "[4][^817]And when Jesus entered Capernaum, the servant of one of the chiefs was in an [5] evil case, and he was precious to him, and he was at the point of death.[^818]And he [6] heard of Jesus, and came to him with the elders of the Jews;[^819]and he besought him, and said, My Lord, my boy is laid in the house paralysed,[^820] and he is suffering grievous [7] torment.[^821]And the elders urgently requested of him, and said, He is worthy that [8] this should be done unto him:[^822]for he loveth our people, and he also built the synagogue [9, 10] for us.[^823]Jesus said unto him, I will come and heal him.[^824]That chief answered and said, My Lord, I am not worthy that my roof should shade thee; but it sufficeth [11] that thou speak a word, and my lad shall be healed.[^825]And I also am a man in obedience to authority, having under my hand soldiers:[^826] and I say to this *one*, Go, and he goeth; and to another, Come, and he cometh; and to my servant that he do this, [12] and he doeth *it*.[^827]And when Jesus heard that, he marvelled at him,[^828] and turned and said unto the multitude that were coming with him,[^829]Verily I say unto you, I have [13] not found in Israel *the* like *of* this faith.[^830]I say unto you, that many shall come from the east and the west, and shall recline with Abraham and Isaac and Jacob [14] [Arabic, p. 43 ] in the kingdom of heaven:[^831]but the children of the kingdom shall be cast [15] forth into the outer darkness: and there shall be weeping and gnashing of teeth.[^832]And Jesus said to that chief, Go thy way; as thou hast believed, *so* shall it be unto thee. [16][^833]And his lad was healed in that hour. And that chief returned to the house and found that sick servant healed." },
  { t = "note", id = "817", text = "Matt. viii. 5a; Luke vii. 2." },
  { t = "note", id = "818", text = "Luke vii. 3." },
  { t = "note", id = "819", text = "Matt. viii. 5b; Matt. viii. 6." },
  { t = "note", id = "820", text = "i.e., so as to be unable to walk." },
  { t = "note", id = "821", text = "Luke vii. 4b." },
  { t = "note", id = "822", text = "Luke vii. 5." },
  { t = "note", id = "823", text = "Matt. viii. 7." },
  { t = "note", id = "824", text = "Matt. viii. 8." },
  { t = "note", id = "825", text = "Luke vii. 8." },
  { t = "note", id = "826", text = "Or, *bodies of soldiers*." },
  { t = "note", id = "827", text = "Luke vii. 9a." },
  { t = "note", id = "828", text = "Or, *it*." },
  { t = "note", id = "829", text = "Matt. viii. 10b." },
  { t = "note", id = "830", text = "Matt. viii. 11." },
  { t = "note", id = "831", text = "Matt. viii. 12." },
  { t = "note", id = "832", text = "Matt. viii. 13." },
  { t = "note", id = "833", text = "Luke vii. 10." },
  { t = "p", text = "[17][^834]And the day after, he was going to a city called Nain, and his disciples with him, [18] and a great multitude.[^835]And when he was come near the gate of the city, he saw a crowd[^836] accompanying one *that was* dead, the only son of his mother; and his mother was a widow: and there was with her a great multitude of the people of the [19] city.[^837]And when Jesus saw her, he had compassion on her, and said unto her, Weep [20] not.[^838]And he went and advanced to the bier, and the bearers of it stood still; and [21] he said, Young man, I say unto thee, Arise.[^839]And that dead *man* sat up and began [22] to speak; and he gave him to his mother.[^840]And fear came on all the people: and they praised God, and said, There hath risen among us a great prophet: and, God [23] hath had regard to his people.[^841]And this news concerning him spread in all Judæa, and in all the region which was about them." },
  { t = "note", id = "834", text = "Luke vii. 11." },
  { t = "note", id = "835", text = "Luke vii. 12." },
  { t = "note", id = "836", text = "Lit. *company*." },
  { t = "note", id = "837", text = "Luke vii. 13." },
  { t = "note", id = "838", text = "Luke vii. 14." },
  { t = "note", id = "839", text = "Luke vii. 15." },
  { t = "note", id = "840", text = "Luke vii. 16." },
  { t = "note", id = "841", text = "Luke vii. 17." },
  { t = "p", text = "[24][^842]And when Jesus saw great multitudes surrounding him, he commanded them to [25] depart to the other side.[^843]And while they were going in the way, there came one of the scribes and said unto him, My Master, I will follow thee whithersoever thou [26] goest.[^844]Jesus said unto him, The foxes have holes, and the birds of the heaven have [27] nests; but the Son of man hath not a place in which to lay his head.[^845]And he said unto another, Follow me. And he said unto him, My Lord, suffer me first to go and [28] bury my father.[^846]Jesus said unto him, Leave the dead to bury their dead; but thou, [29] follow me and preach the kingdom of God.[^847]And another said unto him, I will follow [Arabic, p. 44 ] thee, my Lord; but first suffer me to go and salute my household and [30] come.[^848]Jesus said unto him, There is no one who putteth his hand to the plough[^849] and looketh behind him, and *yet* is fit for the kingdom of God." },
  { t = "note", id = "842", text = "Matt. viii. 18." },
  { t = "note", id = "843", text = "Luke ix. 57a; Matt. viii. 19." },
  { t = "note", id = "844", text = "Matt. viii. 20." },
  { t = "note", id = "845", text = "Luke ix. 59." },
  { t = "note", id = "846", text = "Luke ix. 60." },
  { t = "note", id = "847", text = "Luke ix. 61." },
  { t = "note", id = "848", text = "Luke ix. 62." },
  { t = "note", id = "849", text = "Lit. *plough of the yoke*." },
  { t = "p", text = "[31][^850]And he said to them on that day in the evening, Let us go over to the other side [32] of the lake; and he left[^851] the multitudes.[^852]And Jesus went up and sat in the ship, [33] he and his disciples, and there were with them other ships.[^853]And there occurred on the sea a great tempest[^854] of whirlwind and wind,[^855] and the ship was on the point of [34] sinking from the greatness[^856] of the waves.[^857]But Jesus was sleeping on a cushion in the stern of the ship;[^858]and his disciples came and awoke him, and said unto him, Our [35] Lord, save us; lo, we perish.[^859]And he rose, and rebuked the winds and the turbulence of the water, and said to the sea, Be still, for thou art rebuked;[^860]and the wind [36] was still, and there was a great calm.[^861]And he said unto them, Why are ye thus [37] afraid? and why have ye no faith?[^862]And they feared greatly.[^863] And they marvelled, and said one to another, Who, think you, is this, who commandeth also the wind and the waves and the sea, and they obey him?" },
  { t = "note", id = "850", text = "Mark iv. 35; Luke viii. 22d." },
  { t = "note", id = "851", text = "*cf*., e.g., at § 17, 19, § 23, 16, where the same Arabic and Syriac word is used; *cf*. also the ambiguity of the Greek (R.V. has *left*)." },
  { t = "note", id = "852", text = "Mark iv. 36a; Luke viii. 22b." },
  { t = "note", id = "853", text = "Mark iv. 36c; Matt. viii. 24a." },
  { t = "note", id = "854", text = "Lit. *commotion*." },
  { t = "note", id = "855", text = "Luke viii. 23c." },
  { t = "note", id = "856", text = "Or, *abundance*." },
  { t = "note", id = "857", text = "Mark iv. 38a." },
  { t = "note", id = "858", text = "Matt. viii. 25." },
  { t = "note", id = "859", text = "Luke viii. 24b." },
  { t = "note", id = "860", text = "Mark iv. 39b." },
  { t = "note", id = "861", text = "Mark iv. 40." },
  { t = "note", id = "862", text = "Luke viii. 25b." },
  { t = "note", id = "863", text = "The last clause belongs in the Greek to verse 41." },
  { t = "p", text = "[38][^864]And they departed and came to the country of the Gadarenes, which is on the [39] other side, opposite the land of Galilee.[^865]And when he went out of the ship to the land,[^866]there met him from among the tombs a man who had a devil for a long time, [40] and wore no clothes, neither dwelt in a house, but among the tombs.[^867]And no man was [Arabic, p. 45 ] able to bind him with chains,[^868]because any time that he was bound with chains [41] and fetters he cut the chains and loosened the fetters;[^869]and he was snatched[^870] [42] away of the devil into the desert,[^871]and no man was able to quiet him; and at all times, in the night and in the day, he would be among the tombs and in the mountains;[^872]and no man was able to pass by that way;[^873]and he would cry out and wound himself [43] with stones.[^874]And when he saw Jesus at a distance, he hastened and worshipped [44] him, and cried with a loud voice and said,[^875]What have we to do with thee, Jesus, [45] Son of the most high God?[^876]I adjure thee by God, torment me not. And Jesus commanded the unclean spirit to come out of the man: and he had *suffered*[^877] a long [46] time since the time when he came into captivity to it.[^878]And Jesus asked him, What is thy name? He said unto him, Legion; for there had entered into him many [47] devils.[^879]And they besought him that he would not command them to depart into [48] the depths.[^880]And there was there a herd of many swine, feeding in the mountain, and those devils besought him to give them leave to enter the swine; and he gave [49] them leave.[^881]And the devils went out of the man and entered into the swine.[^882]And that herd hastened to the summit and fell down into the midst of the sea, about two [50] thousand, and they were choked in the water.[^883]And when the keepers saw what [51] happened, they fled, and told those in the cities and villages.[^884]And the people went out to see what had happened; and they came to Jesus, and found the man whose [Arabic, p. 46 ] devils had gone out, clothed, modest,[^885] seated at the feet of Jesus; and they [52] feared.[^886]And they reported what they saw, and how the man was healed who had a devil,[^887]and concerning those swine also." },
  { t = "note", id = "864", text = "Luke viii. 26." },
  { t = "note", id = "865", text = "Luke viii. 27a." },
  { t = "note", id = "866", text = "Mark v. 2b; Luke viii. 27c." },
  { t = "note", id = "867", text = "Mark v. 3b." },
  { t = "note", id = "868", text = "Mark v. 4a." },
  { t = "note", id = "869", text = "Luke viii. 29c." },
  { t = "note", id = "870", text = "Imperfect tense." },
  { t = "note", id = "871", text = "Mark v. 4b, 5a." },
  { t = "note", id = "872", text = "Matt. viii. 28b." },
  { t = "note", id = "873", text = "Mark v. 5b." },
  { t = "note", id = "874", text = "Mark v. 6." },
  { t = "note", id = "875", text = "Mark v. 7a; Luke viii. 28b." },
  { t = "note", id = "876", text = "Mark v. 7c; Luke viii. 29a." },
  { t = "note", id = "877", text = "Lit. *and it was for him*." },
  { t = "note", id = "878", text = "Luke viii. 30." },

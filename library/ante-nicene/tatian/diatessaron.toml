[[section]]
id = "section-33"
title = "Section XXXIII."
level = 1
blocks = [
  { t = "p", text = "[1] [Arabic, p. 125 ][^2241]And when evening came, Jesus went forth outside of the city, he and his [2] disciples.[^2242]And as they passed in the morning, the disciples saw that fig tree [3] withered away from its root.[^2243]And they passed by, and said, How did the fig tree dry [4] up immediately?[^2244]And Simon remembered, and said unto him, My Master, behold, [5] that fig tree which thou didst curse hath dried up.[^2245]And Jesus answered and said [6] unto them, Let there be in you the faith of God.[^2246]Verily I say unto you, if ye believe, and doubt not in your hearts, and assure yourselves that that will be which [7] ye say, ye shall have what ye say.[^2247]And if ye say to this mountain, Remove, and [8] fall[^2248] into the sea, it shall be.[^2249]And all that ye ask God in prayer, and believe, he [9, 10] will give you.[^2250]And the apostles[^2251] said unto our Lord, Increase our[^2252] faith.[^2253]He said unto them, If there be in you faith like a grain of mustard, ye shall say to this fig tree, Be thou torn up, and be thou planted in the sea; and it will obey you. [11][^2254]Who of you hath a servant driving a yoke of oxen or tending sheep, and if he [12] come from the field, will say unto him straightway, Go and sit down?[^2255]Nay,[^2256] he will say unto him, Make ready for me wherewith I may sup, and gird thy waist, and serve me, till I eat and drink; and afterwards thou shalt eat and drink also. [13][^2257]Doth that servant haply, who did what he was bid, receive his praise? I think [14] not.[^2258]So ye also, when ye have done all that ye were bid, say, We are idle servants; what it was our duty to do, we have done." },
  { t = "note", id = "2241", text = "Mark xi. 19." },
  { t = "note", id = "2242", text = "Mark xi. 20." },

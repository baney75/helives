[[section]]
id = "section-54"
title = "Section LIV."
level = 1
blocks = [
  { t = "p", text = "[1][^3783]And while they talked together,[^3784] the evening of that day arrived which was the First-day; and the doors were shut where the disciples were, because of the fear of the [2] Jews;[^3785]and Jesus came and stood among them, and said unto them, Peace *be* with you: I am he; fear not.[^3786]But they were agitated, and became afraid, and supposed that they [3] saw a spirit.[^3787]Jesus said unto them, Why are ye agitated? and why do thoughts rise [4] [Arabic, p. 205 ] in[^3788] your hearts?[^3789]See my hands and my feet, that I am he: feel me, and know that a spirit hath not flesh and bones, as ye see me having that. [5][^3790]And when he had said this, he shewed them his hands and his feet and his side.[^3791] [6][^3792]And they were until this time unbelieving, from their joy and their wonder. He [7] said unto them, Have ye anything here to eat?[^3793]And they gave him a portion of broiled fish and of honey.[^3794][^3795]And he took *it*, and ate before them." },
  { t = "note", id = "3783", text = "Luke xxiv. 36a; John xx. 19." },
  { t = "note", id = "3784", text = "The Arabic word after *together* looks as if it might be due to a misreading of the Syriac, but it is probably a usage cited by Dozy, *Supplément*, etc., i., 247." },
  { t = "note", id = "3785", text = "Luke xxiv. 36c." },
  { t = "note", id = "3786", text = "Luke xxiv. 37." },
  { t = "note", id = "3787", text = "Luke xxiv. 38." },
  { t = "note", id = "3788", text = "Lit. *on* (*cf*. Pesh.)." },
  { t = "note", id = "3789", text = "Luke xxiv. 39." },
  { t = "note", id = "3790", text = "Luke xxiv. 40." },
  { t = "note", id = "3791", text = "Borg. ms. has *sides*." },
  { t = "note", id = "3792", text = "Luke xxiv. 41." },
  { t = "note", id = "3793", text = "Luke xxiv. 42." },
  { t = "note", id = "3794", text = "Borg. ms. omits *and of honey*." },
  { t = "note", id = "3795", text = "Luke xxiv. 43." },
  { t = "p", text = "[8][^3796]And he said unto them, These are the sayings which I spake unto you, while I was with you, that[^3797] everything must be fulfilled, which is written in the law of [9] Moses, and the prophets, and the psalms, concerning me.[^3798]Then opened he their [10] heart, that they might understand the scriptures; and he said unto them,[^3799]Thus it is written, and thus it is necessary[^3800] that the Messiah suffer, and rise from among the [11] dead on the third day;[^3801]and *that* repentance unto the forgiveness of sins be preached [12] in his name among all the peoples; and the beginning shall be from Jerusalem.[^3802]And [13] ye shall be witnesses of that. And I send unto you the promise of my Father.[^3803]And [14] when the disciples heard that, they were glad.[^3804]And Jesus said unto them again, [15] Peace *be* with you: as my Father hath sent me, I also send you.[^3805]And when he had said this, he breathed on them, and said unto them, Receive ye the Holy Spirit: [16][^3806]and if ye forgive sins to *any* man, they shall be forgiven him; and if ye retain them against *any* man, they shall be retained." },
  { t = "note", id = "3796", text = "Luke xxiv. 44." },
  { t = "note", id = "3797", text = "Vat. ms.,*for*." },
  { t = "note", id = "3798", text = "Luke xxiv. 45." },
  { t = "note", id = "3799", text = "Luke xxiv. 46." },
  { t = "note", id = "3800", text = "Borg. ms. omits *it is necessary*." },
  { t = "note", id = "3801", text = "Luke xxiv. 47." },
  { t = "note", id = "3802", text = "Luke xxiv. 48." },
  { t = "note", id = "3803", text = "Luke xxiv. 49a; John xx. 20b." },
  { t = "note", id = "3804", text = "John xx. 21." },
  { t = "note", id = "3805", text = "John xx. 22." },
  { t = "note", id = "3806", text = "John xx. 23." },
  { t = "p", text = "[17][^3807]But Thomas, one of the twelve, called Thama, was not there with the disciples [18] when Jesus came.[^3808]The disciples therefore said unto him, We have seen our Lord. But he said unto them, If I do not see in his hands the places of the nails, and put on them my fingers, and pass my hand over his side, I will not believe." },
  { t = "note", id = "3807", text = "John xx. 24." },
  { t = "note", id = "3808", text = "John xx. 25." },
  { t = "p", text = "[19][^3809]And after eight days, on the next First-day, the disciples were assembled again within, and Thomas with them. And Jesus came, the doors being shut, and stood [20] [Arabic, p. 206 ] in the midst, and said unto them, Peace *be* with you.[^3810]And he said to Thomas, Bring hither thy finger, and behold my hands; and bring *hither* [21] thy hand, and spread it on my side: and be not unbelieving, but believing.[^3811]Thomas [22] answered and said unto him, My Lord and my God.[^3812]Jesus said unto him, Now since thou hast seen me, thou hast believed: blessed are they that have not seen me, and have believed." },
  { t = "note", id = "3809", text = "John xx. 26." },
  { t = "note", id = "3810", text = "John xx. 27." },
  { t = "note", id = "3811", text = "John xx. 28." },
  { t = "note", id = "3812", text = "John xx. 29." },
  { t = "p", text = "[23][^3813]And many other signs did Jesus before his disciples, and they are they which [24] are not written in this book:[^3814]but these that[^3815] are written also *are* that ye may believe in Jesus the Messiah, the Son of God; and *that* when ye have believed, ye may have in his name eternal life." },
  { t = "note", id = "3813", text = "John xx. 30." },
  { t = "note", id = "3814", text = "John xx. 31." },
  { t = "note", id = "3815", text = "*cf*. Peshitta." },
  { t = "p", text = "[25][^3816]And after that, Jesus shewed *himself* again to his disciples at the sea of Tiberias; [26] and he shewed *himself* unto them thus.[^3817]And there were together Simon Cephas, and Thomas which was called Twin,[^3818] and Nathanael who was of Cana of Galilee, [27] and the sons of Zebedee, and two other of the disciples.[^3819]Simon Cephas said unto them, I go to catch fish. They said unto him, And we also come with thee. And they went forth, and went up into the boat; and in that night they caught nothing. [28][^3820]And when the morning arrived, Jesus stood on the shore of the sea: but the disciples [29] knew not that it was Jesus.[^3821]And Jesus said unto them, Children, have ye anything [30] to eat? They said unto him, No.[^3822]He said unto them, Cast your net from the right side of the boat, and ye shall find.[^3823] And they threw, and they were not able [31] to draw the net for the abundance of the fish that were come[^3824] into it.[^3825]And that disciple whom Jesus loved said to Cephas, This is our Lord. And Simon, when he heard that it was our Lord, took his tunic, and girded it on his waist (for he was [32] naked), and cast himself into the sea to come to Jesus.[^3826]But some others of the disciples came in the boat[^3827] (and they were not far from the land, but about two [33] [Arabic, p. 207 ] hundred cubits), and drew that net of fish.[^3828]And when they went up on the [34] land, they saw live coals laid, and fish laid thereon, and bread.[^3829]And Jesus [35] said unto them, Bring of this fish which ye have now caught.[^3830]Simon Cephas therefore went up, and dragged the net to the land, full of great fish, a hundred and fifty-three [36] fishes: and with all this weight that net was not rent.[^3831]And Jesus said unto them, Come and sit down. And no man of the disciples dared to ask him who he was, for they knew that it was our Lord. But he did not appear to them in his *own* [37, 38] form.[^3832]And Jesus came, and took bread and fish, and gave unto them.[^3833]This is the third time that Jesus appeared to his disciples, when he had risen from among the dead." },
  { t = "note", id = "3816", text = "John xxi. 1." },
  { t = "note", id = "3817", text = "John xxi. 2." },
  { t = "note", id = "3818", text = "Apparently the Vat. ms. means to translate the word. The Borg. ms. retains *Tama*, as both mss. did in § 37, 61." },
  { t = "note", id = "3819", text = "John xxi. 3." },
  { t = "note", id = "3820", text = "John xxi. 4." },
  { t = "note", id = "3821", text = "John xxi. 5." },
  { t = "note", id = "3822", text = "John xxi. 6." },
  { t = "note", id = "3823", text = "So Peshitta. Vat. ms. has a form that might possibly be a corruption of *take*." },
  { t = "note", id = "3824", text = "Or, *were taken*." },
  { t = "note", id = "3825", text = "John xxi. 7." },
  { t = "note", id = "3826", text = "John xxi. 8." },
  { t = "note", id = "3827", text = "Vat. ms. adds *unto Jesus.*" },
  { t = "note", id = "3828", text = "John xxi. 9." },
  { t = "note", id = "3829", text = "John xxi. 10." },
  { t = "note", id = "3830", text = "John xxi. 11." },
  { t = "note", id = "3831", text = "John xxi. 12." },
  { t = "note", id = "3832", text = "John xxi. 13." },
  { t = "note", id = "3833", text = "John xxi. 14." },
  { t = "p", text = "[39][^3834]And when they had breakfasted, Jesus said to Simon Cephas, Simon, son of Jonah, lovest thou me more than these? He said unto him, Yea, my Lord; thou [40] knowest that I love thee.[^3835]Jesus said unto him, Feed for me my lambs. He said unto him again a second time, Simon, son of Jonah, lovest thou me? He said unto him, Yea, my Lord; thou knowest that I love thee. He said unto him, Feed for [41] me my sheep.[^3836][^3837]He said unto him again the third time, Simon, son of Jonah, lovest thou me? And it grieved Cephas that he said unto him three times, Lovest thou me? He said unto him, My Lord, thou knowest everything; thou knowest that I [42] love thee.[^3838]Jesus said unto him, Feed for me my sheep.[^3839] Verily, verily, I say unto thee, When thou wast a child, thou didst gird thy waist for thyself, and go whither [Arabic, p. 208 ] thou wouldest: but when thou shalt be old, thou shalt stretch out thy hands, and another shall gird thy waist, and take thee whither thou wouldest not. [43][^3840]He said that to him to explain by what death he was to glorify God. And when he [44] had said that, he said unto him, Come after me.[^3841]And Simon Cephas turned, and saw that disciple whom Jesus loved following him; he which at the supper leaned[^3842] on [45] Jesus’ breast, and said, My Lord, who is it that betrayeth thee?[^3843]When therefore Cephas saw him, he said to Jesus, My Lord, and this *man*, what shall be in his [46] case?[^3844][^3845]Jesus said unto him, If I will that this *man* remain until I come, what is [47] that to thee? follow thou me.[^3846]And this word spread among the brethren, that that disciple should not die: but Jesus said not that he should not die; but, If I will that this *man* remain until I come, what is that to thee?" },
  { t = "note", id = "3834", text = "John xxi. 15." },
  { t = "note", id = "3835", text = "John xxi. 16." },
  { t = "note", id = "3836", text = "Lit. *rams*." },
  { t = "note", id = "3837", text = "John xxi. 17." },
  { t = "note", id = "3838", text = "John xxi. 18." },
  { t = "note", id = "3839", text = "Lit. *ewes*. For the three words *cf*. Peshitta and Sinaitic." },
  { t = "note", id = "3840", text = "John xxi. 19." },
  { t = "note", id = "3841", text = "John xxi. 20." },
  { t = "note", id = "3842", text = "*cf*. § 45, 3, note." },
  { t = "note", id = "3843", text = "John xxi. 21." },
  { t = "note", id = "3844", text = "Lit. *of him*." },
  { t = "note", id = "3845", text = "John xxi. 22." },
  { t = "note", id = "3846", text = "John xxi. 23." },
  { t = "p", text = "[48][^3847]This is the disciple which bare witness of that, and wrote it: and we know that his witness is true." },
  { t = "note", id = "3847", text = "John xxi. 24." },
]

[[section]]
id = "section-55"
title = "Section LV."
level = 1
blocks = [
  { t = "p", text = "[1][^3848]But the eleven disciples went into Galilee, to the mountain[^3849] where Jesus had [2] appointed them.[^3850]And when they saw him, they worshipped him: but there were of [3] them who doubted.[^3851]And while they sat there he appeared to them again, and upbraided *them* for their lack of faith and the hardness of their hearts, those that saw him when he was risen, and believed not.[^3852]" },
  { t = "note", id = "3848", text = "Matt. xxviii. 16." },
  { t = "note", id = "3849", text = "Vat. ms. omits *to the mountain*." },
  { t = "note", id = "3850", text = "Matt. xxviii. 17." },
  { t = "note", id = "3851", text = "Mark xvi. 14." },
  { t = "note", id = "3852", text = "This seems to be the meaning of the text of the mss. Ciasca conjecturally emends it by printing in his Arabic text *because they* after *hearts*; but this is of no use unless one also ignores the *and* before *believed*." },
  { t = "p", text = "[4] [Arabic, p. 209 ][^3853]Then said Jesus unto them, I have been given all authority in heaven [5] and earth; and as my Father hath sent me, so I also send you.[^3854]Go now into [6] all the world, and preach my gospel in all the creation;[^3855]and teach[^3856] all the peoples, and [7] baptize them in the name of the Father and the Son and the Holy Spirit;[^3857]and teach them to keep all whatsoever I commanded you: and lo, I am with you all the days, unto [8] the end of the world.[^3858]For whosoever believeth and is baptized shall be saved; but [9] whosoever believeth not shall be rejected.[^3859]And the signs[^3860] which shall attend those that believe in me are these: that they shall cast out devils in my name; and they [10] shall speak with new tongues;[^3861]and they shall take *up* serpents, and if they drink deadly poison,[^3862] it shall not injure them; and they shall lay their hands on the diseased, [11] and they shall be healed.[^3863]But ye, abide in the city of Jerusalem, until ye be clothed with power from on high." },
  { t = "note", id = "3853", text = "Matt. xxviii. 18b." },
  { t = "note", id = "3854", text = "John xx. 21b; Mark xvi. 15b." },
  { t = "note", id = "3855", text = "Matt. xxviii. 19b." },
  { t = "note", id = "3856", text = "Or, *make disciples of*." },
  { t = "note", id = "3857", text = "Matt. xxviii. 20." },
  { t = "note", id = "3858", text = "Mark xvi. 16." },
  { t = "note", id = "3859", text = "Mark xvi. 17." },
  { t = "note", id = "3860", text = "Not the usual word, although that is used in the Peshitta." },
  { t = "note", id = "3861", text = "Mark xvi. 18." },
  { t = "note", id = "3862", text = "The Arabic translator renders it *the poison of death*." },
  { t = "note", id = "3863", text = "Luke xxiv. 49b." },
  { t = "p", text = "[12][^3864]And our Lord Jesus, after speaking to them, took them out to Bethany: and he [13] lifted up his hands, and blessed them.[^3865]And while he blessed them, he was separated from them, and ascended into heaven, and sat down at the right hand of God. [14, 15][^3866]And they worshipped him, and returned to Jerusalem with great joy:[^3867]and at all times they were in the temple, praising and blessing God. Amen." },
  { t = "note", id = "3864", text = "Mark xvi. 19a; Luke xxiv. 50." },
  { t = "note", id = "3865", text = "Luke xxiv. 51; Mark xvi. 19c." },
  { t = "note", id = "3866", text = "Luke xxiv. 52." },
  { t = "note", id = "3867", text = "Luke xxiv. 53." },
  { t = "p", text = "[16][^3868]And from thence they went forth, and preached in every place; and our Lord helped them, and confirmed their sayings by the signs which they did.[^3869]" },
  { t = "note", id = "3868", text = "Mark xvi. 20." },
  { t = "note", id = "3869", text = "*cf*. Peshitta." },
  { t = "p", text = "[17][^3870]And here are also many other things which Jesus did, which if they were written every one of them, not even the world, according to my opinion, would contain the books which should be written.[^3871]" },
  { t = "note", id = "3870", text = "John xxi. 25." },
  { t = "note", id = "3871", text = "In the Borg. ms. the text ends on folio 353*a*. On folios 354*a*-355*a* are found the genealogies, with the title, *Book of the Generation of Jesus,* that of Luke following that of Matthew without any break. Ciasca has told us nothing of the nature of the text. The Subscription follows on folio 355*b*." },
]

[[section]]
id = "subscriptions"
title = "Subscriptions."
level = 1
blocks = [
  { t = "p", text = "I. In Borgian ms." },
  { t = "p", text = "*Here* endeth the Gospel which Tatianus compiled and named *Diatessaron*, i.e., The Fourfold, a compilation from the four Gospels of the holy Apostles, the excellent Evangelists (peace be upon them). It was translated by the excellent and learned priest, Abu’l Faraj ‘Abdulla ibn-at-Tayyib[^3872] (may God grant him favour), from Syriac into Arabic, from an exemplar written by ‘Isa[^3873] ibn-‘Ali al-Motatabbib,[^3874] pupil of Honain ibn-Ishak (God have mercy on them both). Amen." },
  { t = "note", id = "3872", text = "See note 1 to Introductory Note in Borg. ms. (above, p. 42)." },
  { t = "note", id = "3873", text = "ms., by misplacing the diacritical signs, has *Ghobasi.*" },
  { t = "note", id = "3874", text = "The ms. has *Mottayyib*; but Ciasca, in an additional note inserted after the volume was printed, gives the correct form." },
  { t = "p", text = "2. In Vatican ms.[^3875]" },
  { t = "note", id = "3875", text = "The Arabic text of this Subscription is given by Ciasca in his essay, *De Tatiani Diatessaron arabica Versione*, in I. B. Pitra’s *Analecta Sacra*, tom. iv., p. 466." },
  { t = "p", text = "*Here* endeth, by the help of God, the holy Gospel that Titianus compiled from the four Gospels, which is known as *Diatessaron*. And praise be to God, as he is entitled to it and lord of it! And to him be the glory for ever." },
]

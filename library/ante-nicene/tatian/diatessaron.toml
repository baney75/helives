[[section]]
id = "section-38"
title = "Section XXXVIII."
level = 1
blocks = [
  { t = "p", text = "[1, 2][^2596]And Jesus came to Bethany, and found him *already* four days in the grave.[^2597]And Bethany was beside Jerusalem, and its distance from it *was* a sum of fifteen furlongs;[^2598] [3][^2599]and many of the Jews came unto Mary and Martha, to comfort their heart [4] because of their brother.[^2600]And Martha, when she heard that Jesus had come, went [5] out to meet him: but Mary was sitting in the house.[^2601]Martha then said unto Jesus, [6] My Lord, if thou hadst been here, my brother had not died.[^2602]But I know now that, [7] whatever thou shalt ask of God, he will give thee.[^2603]Jesus said unto her, Thy brother shall [8] rise.[^2604]Martha said unto him, I know that he shall rise in the resurrection at the last day. [9][^2605]Jesus said unto her, I am the resurrection, and the life: whosoever believeth in [10] [Arabic, p. 144 ] me, even though he die, he shall live:[^2606]and every living one that believeth [11] in me shall never die. Believest thou this?[^2607]She said unto him, Yea, my Lord: I believe that thou art the Messiah, the Son of God, that cometh into the [12] world.[^2608]And when she had said that, she went and called Mary her sister secretly, [13] and said unto her, Our Master hath come, and summoneth thee.[^2609]And Mary, when [14] she heard, rose in haste, and came unto him.[^2610](And Jesus then had not come into [15] the village, but was in the place where Martha met him.)[^2611]And the Jews also that were with her in the house, to comfort her, when they saw that Mary rose up and went out in haste, went after her, because they supposed that she was going to the [16] tomb to weep.[^2612]And Mary, when she came to where Jesus was, and saw him, fell at his feet, and said unto him, If thou hadst been here, my Lord, my brother had [17] not died.[^2613]And Jesus came; and when he saw her weeping, and the Jews that were [18] with her weeping, he was troubled[^2614] in himself, and sighed; and he said,[^2615]In what [19] place have ye laid him? And they said unto him, Our Lord, come and see.[^2616]And [20] the tears of Jesus came.[^2617][^2618]The Jews therefore said, See the greatness of his love for [21] him![^2619]But some of them said, Could not this *man*, who opened the eyes of that [22] blind *man*, have caused that this *man* also should not die?[^2620]And Jesus came to the place of burial, being troubled within himself. And the place of burial was a cave, [23] and a stone was placed at its door.[^2621]Jesus therefore said, Take these stones *away*. Martha, the sister of him *that was* dead, said unto him, My Lord, he hath come to [24] stink for some time: he hath been[^2622] four days *dead*.[^2623]Jesus said unto her, Did not I say [25] [Arabic, p. 145 ] unto thee, If thou believest, thou shalt see the glory of God?[^2624]And they removed those stones. And Jesus lifted his eyes on high, and said, My Father, [26] I thank thee since thou didst hear me.[^2625]And I know that thou at all times hearest me: but I say this unto thee because of this multitude that is standing, that they [27] may believe that thou didst send me.[^2626]And when he had said that, he cried with a [28] loud voice, Lazarus, come forth.[^2627]And that dead *man* came out, having his hands and feet bound with bandages, and his face wrapped in a scarf. Jesus said unto them, Loose him, and let him go." },

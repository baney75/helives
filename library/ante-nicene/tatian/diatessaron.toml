  { t = "note", id = "2258", text = "Luke xvii. 10." },
  { t = "p", text = "[15][^2259]For this reason I say unto you, Whatever ye pray and ask, believe that ye [16] [Arabic, p. 126 ] receive, and ye shall have.[^2260]And when ye stand to pray, forgive what is in your heart against *any* man; and your Father which is in heaven will [17] forgive you also your wrong-doings.[^2261]But if ye forgive not men their wrong-doings, neither will your Father forgive you also your wrong-doings." },
  { t = "note", id = "2259", text = "Mark xi. 24." },
  { t = "note", id = "2260", text = "Mark xi. 25." },
  { t = "note", id = "2261", text = "Mark xi. 26." },
  { t = "p", text = "[18][^2262]And he spake unto them a parable also, that they should pray at all times, and [19] not be slothful:[^2263]There was a judge in a city, who feared not God, nor was ashamed [20] for men:[^2264]and there was a widow in that city; and she came unto him, and said, [21] Avenge me of mine adversary.[^2265]And he would not for a long time: but afterwards he said within himself, If of God I have no fear, and before men I have no shame; [22][^2266]*yet* because this widow vexeth *me*, I will avenge her, that she come not at all times [23, 24] and annoy me.[^2267]And our Lord said, Hear ye what the judge of injustice said.[^2268]And shall not God *still* more do vengeance for his elect, who call upon him in the night [25] and *in* the day, and grant them respite?[^2269]I say unto you, He will do vengeance for them speedily. Thinkest thou the Son of man will come and find faith on the earth?" },
  { t = "note", id = "2262", text = "Luke xviii. 1." },
  { t = "note", id = "2263", text = "Luke xviii. 2." },
  { t = "note", id = "2264", text = "Luke xviii. 3." },
  { t = "note", id = "2265", text = "Luke xviii. 4." },
  { t = "note", id = "2266", text = "Luke xviii. 5." },
  { t = "note", id = "2267", text = "Luke xviii. 6." },
  { t = "note", id = "2268", text = "Luke xviii. 7." },
  { t = "note", id = "2269", text = "Luke xviii. 8." },
  { t = "p", text = "[26, 27][^2270]And they came again to Jerusalem.[^2271]And it came to pass, on one of the days, as Jesus was walking in the temple, and teaching the people, and preaching *the* [28] *gospel*,[^2272]that the chief priests and the scribes with the elders came upon him, and said unto him, Tell us:[^2273]By what power doest thou this? and who gave thee this [29] power to do that?[^2274]And Jesus said unto them, I also will ask you one word, and if [30] ye tell me, I also shall tell you by what power I do that.[^2275]The baptism of John, from [31] what place *is* it? from heaven or of men?[^2276]Tell me.[^2277]And they reflected within themselves, [Arabic, p. 127 ] and said, If we shall say unto him, From heaven; he will say unto [32] us, For what reason did ye not believe him?[^2278]But[^2279] if we shall say, Of men; [33] we fear[^2280] that the people will stone us, all of them.[^2281]And all of them were holding[^2282] [34] to John, that he was a true prophet.[^2283]They answered and said unto him, We know [35] not.[^2284]Jesus said unto them, Neither tell I you also by what power I work. What think ye? A man had two sons; and he went to the first, and said unto him, My [36] son, go to-day, and till in the vineyard.[^2285]And he answered and said, I do not wish [37] to: but finally he repented, and went.[^2286]And he went to the other, and said unto [38] him likewise.[^2287]And he answered and said, Yea, my lord: and went not. Which of these two did the will of his father? They said unto him, The first. Jesus said unto them, Verily I say unto you, The publicans and harlots go before you into [39] the kingdom of God.[^2288]John came unto you in the way of righteousness, and ye believed him not; but the publicans and harlots believed him; and ye, not even when ye saw, did ye repent at last, that ye might believe in him." },
  { t = "note", id = "2270", text = "Mark xi. 15a." },
  { t = "note", id = "2271", text = "Luke xx. 1." },
  { t = "note", id = "2272", text = "Luke xx. 2a." },
  { t = "note", id = "2273", text = "Mark xi. 28b." },
  { t = "note", id = "2274", text = "Mark xi. 29a; Matt. xxi. 24b." },
  { t = "note", id = "2275", text = "Matt. xxi. 25a." },

[[section]]
id = "homily-on-habib-the-martyr"
title = "Homily on Habib the Martyr."
level = 1
blocks = [
  { t = "h", text = "Ancient Syriac Documents." },
  { t = "p", text = "Homily on Habib the Martyr, Composed by Mar Jacob.[^3303]" },
  { t = "note", id = "3303", text = "The ms. from which this is taken is Cod. Add. 17,158, fol. 30 vers. Mar Jacob, bishop of Sarug, or Batnæ, was one of the most learned and celebrated among all the Syriac writers. He was born a.d. 452, made bishop of Sarug a.d. 519, and died a.d. 521. He was the author of several liturgical works, epistles, and sermons, and, amongst these, of numerous metrical homilies, of which two are given here. Assemani enumerates no less than 231. Ephraem Syrus also wrote a similar homily on Habib, Shamuna, and Guria. The metre of the original in this and the following homily consists of twelve syllables, and six dissyllabic feet; but whether they were read as iambs ortroches, or as both, appears to depend on the nature of the Syriac accentuation, which is still an unsettled question. Hoffmann, in his slight notice of the subject (*Gram. Syr*., § 13), merely says: “Scimus, poësin Syriacam non quantitatis sed *accentus* tantum rationem habere, versusque suos *syllabarum numero* metiri. Quâ tamen poëseos Syriacæ conditione *varietas morarum in pronuntiandis vocalibus observandarum* non tollitur.”—Tr." },
  { t = "p", text = "Habib the martyr, clad in flame, hath called to me out of the fire," },
  { t = "p", text = "That for him likewise I should fashion an image of beauty among the glorious." },
  { t = "p", text = "Comrade of conquerors, lo! he beckoneth to me out of the burning," },
  { t = "p", text = "That, as for the glory of his Lord, I should sing concerning him." },
  { t = "p", text = "In the midst of live coals stands the *heroic* man, and lo! he calleth to me," },
  { t = "p", text = "That I should fashion his image: but the blazing fire permits me not." },
  { t = "p", text = "His love is fervid, glowing is his faith;" },
  { t = "p", text = "His fire also burneth, and who is adequate to recount his love?" },
  { t = "p", text = "Nay, by reason of that love which led the martyr into the fire," },
  { t = "p", text = "No man is able to recount his beauties divine." },
  { t = "p", text = "For who shall dare enter and see in the blazing fire" },
  { t = "p", text = "To whom he is like, and after what pattern he is to be fashioned among the glorious?" },
  { t = "p", text = "Shall I fashion his image by the side of the youths, the children of the furnace?" },
  { t = "p", text = "With Hananiah shall I reckon Habib? I know not." },
  { t = "p", text = "Lo! these were not burned there: how, then, is he like?" },
  { t = "p", text = "He, *I say*, like them, when he was burned and the youths not?" },
  { t = "p", text = "Which, I ask, *the more* beautiful—Habib the martyr, or Azariah?" },
  { t = "p", text = "Difficult for me is the image: how I am to look upon it, I know not." },
  { t = "p", text = "Lo! Michael was not burned by the flame;" },
  { t = "p", text = "But Habib was burned: which, then, *the more* beautiful to him that looketh upon him?" },
  { t = "p", text = "Who shall dare say that this is repulsive, or that;" },
  { t = "p", text = "Or not so comely this as that, to him that beholdeth him?" },
  { t = "p", text = "Three *there are* in the fire, and the flame cometh not near them;" },
  { t = "p", text = "But one was burned: and how shall I suffice to tell" },
  { t = "p", text = "That the Fourth *form* is that of Him who went down into the midst of the furnace," },
  { t = "p", text = "That He might fashion an image for Habib there along with *those of* the three?" },
  { t = "p", text = "He giveth a place in the fire to him who was burned," },
  { t = "p", text = "That he may be, instead of Him the Fourth, by the side of the conquerors." },
  { t = "p", text = "And, if of the three the beauties be glorious, though they were not burned," },
  { t = "p", text = "How shall not this one, who *was* burned, be mingled with the glorious?" },
  { t = "p", text = "If a man have the power either to be burned or not to be burned," },
  { t = "p", text = "Of this man, who was burned, more exalted was the beauty than that of the three." },
  { t = "p", text = "But, inasmuch as the Lord is the control *of all things*," },
  { t = "p", text = "*He* is to be praised, *both* where He rescues and where He delivers up." },
  { t = "p", text = "Moreover, too, the will of the three who were not burned," },
  { t = "p", text = "And of him who was burned, is one and the same, in this case and in that;[^3304]" },
  { t = "note", id = "3304", text = "Lit. “here and there.”—Tr." },
  { t = "p", text = "And, had its Lord commanded the fire to burn them," },
  { t = "p", text = "*Even* those three on their part, burned they would have been;" },
  { t = "p", text = "And, if He had signified to it that it should not burn that one man also," },
  { t = "p", text = "He would not have been burned; nor had it been of himself that he was rescued." },
  { t = "p", text = "To go into the fire was of their own will, when they went in;" },
  { t = "p", text = "But that they were not burned—*because* the Lord of the fire willed and commanded it." },
  { t = "p", text = "Therefore one equal beauty is that of him who was burned," },
  { t = "p", text = "And that of him who was not burned, because the will also was equal." },
  { t = "p", text = "Beloved martyr! exalted is thy beauty; exalted is thy rank:" },
  { t = "p", text = "Graceful too thy crown, and mingled thy story with *that of* the glorious." },
  { t = "p", text = "Choice gold art thou, and the fire hath tried thee, and resplendent is thy beauty." },
  { t = "p", text = "And lo! into the King’s crown art thou wrought, along with the victorious." },
  { t = "p", text = "Good workman! who, in the doctrine of the Son of God," },
  { t = "p", text = "Pursueth his course like a valiant[^3305] man, because of the beauty of his faith." },
  { t = "note", id = "3305", text = "Cureton has “prosperous,” which Dr. Payne Smith condemns, remarking: “*** I find generally used for the Gk. ἄριστος, and once or twice for κράτιστος . It answers more frequently to *strenuus* = courageous, heroic.”—Tr." },
  { t = "p", text = "Habib the martyr was a teacher of that which is true;" },
  { t = "p", text = "A preacher also, whose mouth was full of faith." },
  { t = "p", text = "Watchful was he, and prompt *for service;* and he encouraged with his teaching" },
  { t = "p", text = "The household of the house of God, through his faith." },
  { t = "p", text = "Of light was he full, and he wrestled with the darkness" },
  { t = "p", text = "Which overspread the country from the paganism which had darkened it." },
  { t = "p", text = "With the Gospel of the Son was his mouth filled in the congregations;" },
  { t = "p", text = "And as it were a leader of the way did he become to the villages when he arrived in them." },
  { t = "p", text = "Zealous he was, because he was concerned for the doctrine" },
  { t = "p", text = "Divine, that he might establish the adherents[^3306] of the faith." },
  { t = "note", id = "3306", text = "Lit. “the party” or “side.”—Tr." },
  { t = "p", text = "At the time when the winds of the pagans blew, a lamp was he," },
  { t = "p", text = "And flamed forth whilst they blew upon him, and went not out." },
  { t = "p", text = "All on fire was he, and filled with the love of his Lord, and was concerned" },
  { t = "p", text = "For this—that he might speak of Him without hindrance.[^3307]" },
  { t = "note", id = "3307", text = "As in Gal. v. 7, answering to the Gk. ἐγκόπτω. The verb *** (Pa.) properly means to *disquiet* (as in John xiv. 1), then to *hinder*.—Tr." },
  { t = "p", text = "The thorns of errour sprang up in the land from paganism;" },
  { t = "p", text = "And, as much as in him lay, he rooted them out by his diligence." },
  { t = "p", text = "He taught, admonished, and confirmed in the faith," },
  { t = "p", text = "The friends of Christ,[^3308] who were harassed by persecutors." },
  { t = "note", id = "3308", text = "The ordinary word for “Christians” in these documents is the borrowed Χριστιανοί : here a native word is used, formed from the one which we read as “Messiah.”—Tr." },
  { t = "p", text = "Against sword and against fire did he wrestle," },
  { t = "p", text = "With love hot as the flame, and was not afraid." },
  { t = "p", text = "Like a two-edged brand,[^3309] keen was" },
  { t = "note", id = "3309", text = "A corruption of the word σαμψηρά is used here. It is said by Josephus, *Antiq*., xx. 2, 3, to have been the name given by the Assyrians to some kind of sword. Suidas mentions it as a barbarian word for σπάθη, a *broadsword*. Cureton’s “scimetar” would be preferable, as being somewhat more distinctive, if it appeared that a scimetar could have two edges.—Tr." },
  { t = "p", text = "His faith, and against error did he contend." },
  { t = "p", text = "Leaven did he prove to be in this land which had become exhausted[^3310]" },
  { t = "note", id = "3310", text = "The temptation was strong to render ***, “became unleavened” (or, “tasteless”), a sense apparently required by the decided figure employed and by the language of the next couplet, where “insipid ” corresponds to “salt.” The word *** (= ἄζυμον), moreover, if not the Arabic *** (to which Schaaf, though it does not appear on what authority, assigns the meaning “*sine fermento massam subegit*”), seems to point in the same direction. Dr. Payne Smith, however, is not aware of any instance of the proposed meaning: he says, “My examples make *** = ἐκλείπω, to fail.”—Tr." },
  { t = "p", text = "Through fondness for the idols of vanity which error had brought in." },
  { t = "p", text = "He was like salt by reason of his savoury doctrine" },
  { t = "p", text = "To this region, which had become insipid through unbelief." },
  { t = "p", text = "A deacon was he, and filled the place of a high-priest" },
  { t = "p", text = "By the preaching and teaching of that which is true." },
  { t = "p", text = "He was to the flock a good shepherd whilst he was *its* overseer;" },
  { t = "p", text = "And his life laid he down for the flock while he tended it." },
  { t = "p", text = "He chased away the wolf, and drove off from it the beast of prey." },
  { t = "p", text = "And he repaired the breaches, and gathered the lambs into their folds." },
  { t = "p", text = "He went out secretly *and* encouraged the congregations:" },
  { t = "p", text = "He strengthened them, and exhorted them, and held them up." },
  { t = "p", text = "And he forged armour of faith, and put it on them," },
  { t = "p", text = "That they might not be ignominiously overthrown[^3311] by the paganism which abounded." },
  { t = "note", id = "3311", text = "Or “brought to contempt.”—Tr." },
  { t = "p", text = "The flocks of the fold of the Son of God were being laid waste" },
  { t = "p", text = "By persecutors: and he encouraged the lambs and the ewes." },
  { t = "p", text = "And he was an advocate to the household of faith;" },
  { t = "p", text = "And he taught them not to be daunted by persecutors." },
  { t = "p", text = "He taught them to run to meet death," },
  { t = "p", text = "Without being afraid either of sword or of fire." },
  { t = "p", text = "In the teaching of the Son of God he prospered," },
  { t = "p", text = "So that his faith pursued its course without dread." },
  { t = "p", text = "Then errour grew envious, became furious, and was maddened, because of him;" },
  { t = "p", text = "And she pursued after him, that she might shed upon the earth innocent blood." },
  { t = "p", text = "The Defamer, who hates the race of men," },
  { t = "p", text = "Laid snares for him, that he might rid the place of his presence.[^3312]" },
  { t = "note", id = "3312", text = "Lit. “society.”—Tr." },
  { t = "p", text = "He who hateth the truth pursued after him to put him to death," },
  { t = "p", text = "That he might make his voice to cease[^3313] from the teaching of the house of God." },
  { t = "note", id = "3313", text = "Or “that his voice might cease.”—Tr." },
  { t = "p", text = "And errour raised an outcry *demanding* that Habib should die, because she hated him;" },
  { t = "p", text = "Vexation goaded her on, and she sought to take away his life." },
  { t = "p", text = "His story was talked about[^3314] before the pagan judge of the country," },
  { t = "note", id = "3314", text = "Lit. “mooted.”—Tr." },
  { t = "p", text = "And the dear fame of him reached the king: who in great rage," },
  { t = "p", text = "And because the diadem was interwoven with paganism, decreed[^3315] death" },
  { t = "note", id = "3315", text = "Lit. “reached the king in great rage (i.e., *so as to cause* great rage, *** being often = εἰς denoting result), and, because…, he decreed.”—Dr. Payne Smith." },
  { t = "p", text = "Against Habib, because he was full of faith." },
  { t = "p", text = "And, when the command reached the judge, he armed himself" },
  { t = "p", text = "With rage and fury; and, with a mind thirsting for blood," },
  { t = "p", text = "And like hunters who lay nets for the young stag," },
  { t = "p", text = "After Habib did they go out to catch *him*." },
  { t = "p", text = "But this man was a preacher of the faith," },
  { t = "p", text = "Who in the highway of the crucifixion was prospering;" },
  { t = "p", text = "And, that he might benefit by his teaching the children of his people," },
  { t = "p", text = "His work embraced the countries round about him." },
  { t = "p", text = "So, when error went out after him, she found him not:" },
  { t = "p", text = "Not that he was fled, but that he had gone out to preach the Gospel." },
  { t = "p", text = "Then, because of the fury of the pagans, which was great beyond all that was meet," },
  { t = "p", text = "His kindred and his mother did they seize for his sake." },
  { t = "p", text = "Blessed art thou, O woman! mother since thou art of the martyr." },
  { t = "p", text = "For wherefore was it that they seized thee *and* bound thee, iniquitously?" },
  { t = "p", text = "What do they require of thee, O thou full of beauty? What, *I ask*, have they required of thee?" },
  { t = "p", text = "Lo! they require of thee that thou bring the martyr, that he may be a sacrifice." },
  { t = "p", text = "Bring, oh bring thy sweet fruit to the place of the oblation—" },
  { t = "p", text = "*The fruit* whose smell is fragrant, that it may be incense to the Godhead." },
  { t = "p", text = "Fair shoot, thy cluster bring from where it is," },
  { t = "p", text = "That its wine may be for a libation whose taste is sweet." },
  { t = "p", text = "The lamb heard that they were seeking him, that he might be a sacrifice;" },
  { t = "p", text = "And he set out and came to the sacrificers rejoicing." },
  { t = "p", text = "He heard that others also were being afflicted for his sake," },
  { t = "p", text = "And he came that he might bear the suffering which was his, in the stead of many." },
  { t = "p", text = "The lot fell on him, to be himself alone a sacrifice;" },
  { t = "p", text = "And the fire that was to offer him up was looking out *for him* until he came." },
  { t = "p", text = "Of the many who were bound for his sake" },
  { t = "p", text = "Not one single person was seized to die, but only he." },
  { t = "p", text = "He it was that was worthy, and for him was martyrdom reserved;" },
  { t = "p", text = "And to snatch the martyr’s place no man was able." },
  { t = "p", text = "And therefore of his own will did he present himself" },
  { t = "p", text = "To the judge, that he might be seized, and die for Jesus’ sake." },
  { t = "p", text = "He heard that they sought him, and he came that he might be seized, even as they sought him:" },
  { t = "p", text = "And he went in of himself before the judge, and dauntless was his look." },
  { t = "p", text = "He hid not himself, nor did he wish to flee from the judge:" },
  { t = "p", text = "For with light was he imbued, and from the darkness he would not flee." },
  { t = "p", text = "No robber *was he*, no murderer, no thief," },
  { t = "p", text = "No child of night: but all his course was run in open day." },
  { t = "p", text = "Wherefore from his flock should the good shepherd flee," },
  { t = "p", text = "And leave his fold to be devoured by robbers?" },
  { t = "p", text = "Wherefore should the physician flee, who goeth forth to heal diseases," },
  { t = "p", text = "And to cure souls by the blood of the Son of God?" },
  { t = "p", text = "A fearless countenance[^3316] did the *brave* man carry with him, and a great heart;" },
  { t = "note", id = "3316", text = "Lit. “openness of countenance.”—Tr." },
  { t = "p", text = "And to meet death he ran, rejoicing, for Jesus’ sake." },
  { t = "p", text = "He went in, he stood before the judge, saying to him:" },
  { t = "p", text = "I am Habib, whom ye sought: lo! *here* I stand." },
  { t = "p", text = "And the pagan trembled, and amazement seized him, and he marvelled at him—" },
  { t = "p", text = "At the man who was not afraid, either of sword or of fire." },
  { t = "p", text = "While he thought that he was fleeing apace, he entered in and mocked him;" },
  { t = "p", text = "And the judge shook, for he saw him courageous in the *very* face of death." },
  { t = "p", text = "A disciple he of that Son of God who said:" },
  { t = "p", text = "“Rise, come, let us go: for he that betrayeth me lo! is here.”" },
  { t = "p", text = "And to the crucifiers, again, He said: “Whom seek ye?”" },
  { t = "p", text = "They say: “Jesus.” And He said to them: “I am He.”" },
  { t = "p", text = "The Son of God of His own will came to the cross;" },
  { t = "p", text = "And on Him the martyr looked, and presented himself *uncompelled* before the judge." },
  { t = "p", text = "And the pagan beheld him, and was smitten with fear, and was exasperated *against him*." },
  { t = "p", text = "His rage was excited, and he began in his fury to put to him questions.[^3317]" },
  { t = "note", id = "3317", text = "Prop. “agitate questions.”—Tr." },
  { t = "p", text = "And, as if he had been one who had shed on the ground the blood of the slain," },
  { t = "p", text = "He proceeded to question the saintly man, but he was not ashamed:" },
  { t = "p", text = "Menacing him, and trying to terrify him, and to frighten him," },
  { t = "p", text = "And recounting the sufferings which were being prepared by him on his account." },
  { t = "p", text = "But Habib, when questioned, was not afraid," },
  { t = "p", text = "Was not ashamed, and was not frightened by the menaces *he heard*." },
  { t = "p", text = "Lifting up his voice, he confessed Jesus, the Son of God—" },
  { t = "p", text = "That he was His servant, and was His priest, and His minister.[^3318]" },
  { t = "note", id = "3318", text = "Or “deacon.”—Tr." },
  { t = "p", text = "At the fury of the pagans, roaring at him like lions," },
  { t = "p", text = "He trembled not, nor ceased[^3319] from the confession of the Son of God." },
  { t = "note", id = "3319", text = "Or “so as to cease.”—Tr." },
  { t = "p", text = "He was scourged, and the scourgings were very dear to him," },
  { t = "p", text = "Seeing that he bore a little of the stripes of the Son of God." },
  { t = "p", text = "He was put into bonds,[^3320] and he looked on his Lord, whom also they had bound;" },
  { t = "note", id = "3320", text = "Lit. “he entered into bondage.”—Tr." },
  { t = "p", text = "And his heart rejoiced that in the path of His sufferings he had begun to walk." },
  { t = "p", text = "He ascended the block,[^3321] and they tore him with combs, but his soul was radiant with light," },
  { t = "note", id = "3321", text = "The *equuleus* is meant.—Tr." },
  { t = "p", text = "Because he was *deemed* worthy that on him should come the agony of the sufferings of crucifixion." },
  { t = "p", text = "In the pathway of death had he set his face to walk," },
  { t = "p", text = "And what could he desire to find in it but sufferings?" },
  { t = "p", text = "The fire of sacrifice[^3322] was betrothed to him, and for her did he look;" },
  { t = "note", id = "3322", text = "Or “of the sacrifices.”—Tr." },
  { t = "p", text = "And she *on her part* sent him combs, and stripes, and pains, to taste." },
  { t = "p", text = "All the while that she was coming, she sent him sufferings, that by means of them" },
  { t = "p", text = "He might be prepared, so that when she met him she might not dismay him." },
  { t = "p", text = "Sufferings purged him, so that, when the blazing fire should put him to the proof," },
  { t = "p", text = "There might not be any dross *found* in his choice gold." },
  { t = "p", text = "And he endured the whole of the pains that came upon him," },
  { t = "p", text = "That he might have experience *of suffering*, and in the burning stand like a brave man." },
  { t = "p", text = "And he accepted rejoicing the sufferings which he had to bear:" },
  { t = "p", text = "For he knew that at their termination he should find death." },
  { t = "p", text = "And he was not afraid, either of death or of sufferings:" },
  { t = "p", text = "For with that wine of the crucifixion his heart was drunk." },
  { t = "p", text = "He despised his body, while it was being dragged along by the persecutors;" },
  { t = "p", text = "And his limbs, while they were being torn asunder in bitter agony.[^3323]" },
  { t = "note", id = "3323", text = "Lit. “bitterly.”—Tr." },
  { t = "p", text = "Scourges on his back, combs on his sides, stocks on his feet," },
  { t = "p", text = "And fire in front of him: still was he brave and full of faith." },
  { t = "p", text = "They taunted him: Lo! thou worshippest a man;" },
  { t = "p", text = "But he said: A man I worship not," },
  { t = "p", text = "But God, who took a body and became man:" },
  { t = "p", text = "Him do I worship, because He is God with Him that begat Him." },
  { t = "p", text = "The faith of Habib, the martyr, was full of light" },
  { t = "p", text = "And by it was enlightened Edessa, the faithful *city*." },
  { t = "p", text = "The daughter of Abgar, whom Addæus betrothed to the crucifixion—" },
  { t = "p", text = "Through it is her light, through it her truth and her faith." },
  { t = "p", text = "Her king is from it, her martyrs from it, her truth from it;" },
  { t = "p", text = "The teachers also of *her* faith are from it." },
  { t = "p", text = "Abgar believed that Thou art God, the Son of God;" },
  { t = "p", text = "And he received a blessing because of the beauty of his faith." },
  { t = "p", text = "Sharbil the martyr, son of the Edessæans, more-ever said:" },
  { t = "p", text = "My heart is led captive by God, who became man." },
  { t = "p", text = "And Habib the martyr, who also was crowned at Edessa," },
  { t = "p", text = "Confessed these things: that He took a body and became man;" },
  { t = "p", text = "That He is the Son of God, and also is God, and became man." },
  { t = "p", text = "Edessa learned from teachers the things that are true:" },
  { t = "p", text = "Her king taught her, her martyrs taught her, the faith;" },
  { t = "p", text = "But to others, who were fraudulent teachers, she would not hearken." },
  { t = "p", text = "Habib the martyr, in the ear of Edessa, thus cried aloud" },
  { t = "p", text = "Out of the midst of the fire: A man I worship not," },
  { t = "p", text = "But God, who took a body and became man" },
  { t = "p", text = "Him do I worship. *Thus* confessed the martyr with uplifted voice." },
  { t = "p", text = "From confessors torn with combs, burnt, raised up *on the block*, slain" },
  { t = "p", text = "And *from* a righteous king, did Edessa learn the faith," },
  { t = "p", text = "And she knows our Lord—that He is even God, the Son of God;" },
  { t = "p", text = "She also learned and firmly believed that He took a body and became man." },
  { t = "p", text = "Not from common scribes did she learn the faith:" },
  { t = "p", text = "Her king taught her, her martyrs taught her; and she firmly believed them:" },
  { t = "p", text = "And, if she be calumniated as having ever worshipped a man," },
  { t = "p", text = "She points to her martyrs, who died for Him as being God." },
  { t = "p", text = "A man I worship not, said Habib," },
  { t = "p", text = "Because it is written: “Cursed is he that putteth his trust in a man.”[^3324]" },
  { t = "note", id = "3324", text = "Jer. xvii. 5.—Tr." },
  { t = "p", text = "Forasmuch as He is God, I worship Him, yea submit to be burned" },
  { t = "p", text = "For His sake, nor will I renounce His faith." },
  { t = "p", text = "This truth has Edessa held fast from her youth," },
  { t = "p", text = "And in her old age she will not barter it away as a daughter of the poor." },
  { t = "p", text = "Her righteous king became to her a scribe, and from him she learned" },
  { t = "p", text = "Concerning our Lord—that He is the Son of God, yea God." },
  { t = "p", text = "Addæus, who brought the bridegroom’s ring and put it on her hand," },
  { t = "p", text = "Betrothed her thus to the Son of God, who is the Only-*begotten*." },
  { t = "p", text = "Sharbil the priest, who made trial and proof of all gods," },
  { t = "p", text = "Died, even as he said, “for God who became man.”" },
  { t = "p", text = "Shamuna and Guria, for the sake of the Only-*begotten*," },
  { t = "p", text = "Stretched out their necks *to receive the stroke*, and for Him died, forasmuch as He is God." },
  { t = "p", text = "And Habib the martyr, who was teacher of congregations," },
  { t = "p", text = "Preached of Him, that He took a body and became man." },
  { t = "p", text = "For a man the martyr would not have *submitted to be* burned in the fire;" },
  { t = "p", text = "But he was burned “for the sake of God who became man.”" },
  { t = "p", text = "And Edessa is witness that thus he confessed while he was being burned:" },
  { t = "p", text = "And from the confession of a martyr that has been burned who is he that can escape?" },
  { t = "p", text = "All minds does faith reduce to silence and despise—" },
  { t = "p", text = "*She* that is full of light and stoopeth not to shadows." },
  { t = "p", text = "She despiseth him that maligns the Son by denying that He is God;" },
  { t = "p", text = "Him too that saith “He took not a body and became man.”" },
  { t = "p", text = "In faith which was full of truth he stood upon the fire;" },
  { t = "p", text = "And he became incense, and propitiated with his fragrance the Son of God." },
  { t = "p", text = "In all *his* afflictions, and in all *his* tortures, and in all *his* sufferings," },
  { t = "p", text = "Thus did he confess, and thus did he teach the blessed *city*." },
  { t = "p", text = "And this truth did Edessa hold fast touching our Lord—" },
  { t = "p", text = "Even that He is God, and of Mary became a man." },
  { t = "p", text = "And the bride hates him that denies His God-head," },
  { t = "p", text = "And despises and contemns him that maligns His corporeal nature." },
  { t = "p", text = "And she recognises Him *as* One in Godhead and in manhood—" },
  { t = "p", text = "The Only-*begotten*, whose body is inseparable from Him." },
  { t = "p", text = "And thus did the daughter of the Parthians learn to believe," },
  { t = "p", text = "And thus did she firmly hold, and thus does she teach him that listens to her." },
  { t = "p", text = "The judge, therefore, full of *zeal for* paganism, commanded" },
  { t = "p", text = "That the martyr should be led forth and burned in the fire which was reserved for him." },
  { t = "p", text = "And forthwith a strap was thrust into his mouth, as *though he had been* a murderer," },
  { t = "p", text = "His confession being kept within his heart towards God." },
  { t = "p", text = "And they hurried him away, and he went out from the judgment-hall, rejoicing" },
  { t = "p", text = "That the hour was come when the crown should be given to his faith." },
  { t = "p", text = "And there went out with him crowds of people, that they might bear him company," },
  { t = "p", text = "Looking upon him, not as a dead man accompanied *to his burial*," },
  { t = "p", text = "But as a man who was going away that by means of fire he might become a bridegroom," },
  { t = "p", text = "And that there might be bestowed the crown which was by righteousness reserved for him." },
  { t = "p", text = "They looked upon him as upon a man entering into battle," },
  { t = "p", text = "And around him were spears, and lances, and swords, but he vanquished them." },
  { t = "p", text = "They beheld him going up like a champion from the contest," },
  { t = "p", text = "And in his triumph chaplets were brought to him by those who beheld." },
  { t = "p", text = "They looked upon him as he vanquished principalities and powers," },
  { t = "p", text = "Which all made war with him, and he put them to shame." },
  { t = "p", text = "The whole congregation of the followers of Christ exulted over him," },
  { t = "p", text = "Because he raised up the friends[^3325] of the faith by the sufferings which he bore." },
  { t = "note", id = "3325", text = "Lit. “side,” or “party.”—Tr." },
  { t = "p", text = "There went forth with him the Church, a bride full of light;" },
  { t = "p", text = "And her face was beaming on the beloved martyr who was united to her." },
  { t = "p", text = "Then did his mother, because it was the marriage-feast for her son," },
  { t = "p", text = "Deck herself in garments nobler than her wont." },
  { t = "p", text = "Since sordid raiment suited not the banquet-hall," },
  { t = "p", text = "In magnificent *attire* all white she clad herself right tastefully." },
  { t = "p", text = "Hither to the battle came down love to fight" },
  { t = "p", text = "In the mother’s soul—*the love* of nature, and *the love* of God." },
  { t = "p", text = "She looked upon her son as he went forth to be put into the flame;" },
  { t = "p", text = "And, forasmuch as there was in her the love of the Lord, she suffered not." },
  { t = "p", text = "The yearnings of her mother’s womb cried out on behalf of its fruit;" },
  { t = "p", text = "But faith silenced them, so that their tumult ceased." },
  { t = "p", text = "Nature shrieked over the limb which was severed from her;" },
  { t = "p", text = "But the love of the Lord intoxicated the soul, that she should not perceive it." },
  { t = "p", text = "Nature loved, but the love of the Lord did conquer in the strife" },
  { t = "p", text = "Within the soul of the mother, that she should not grieve for her beloved." },
  { t = "p", text = "And instead of suffering, her heart was filled with all emotions of joy;" },
  { t = "p", text = "And, instead of mourning, she went forth in splendid apparel." },
  { t = "p", text = "And she accompanied him as he went out to be burned, and was elate," },
  { t = "p", text = "Because the love of the Lord vanquished that of nature." },
  { t = "p", text = "And *clad* in white, as for a bridegroom, she made a marriage-feast—" },
  { t = "p", text = "*She* the mother of the martyr, and was blithe because of him." },
  { t = "p", text = "“Shamuna the Second” may we call this blessed *one:*" },
  { t = "p", text = "Since, had seven been burned instead of one, she had been well content." },
  { t = "p", text = "One she had, and she gave him to be food for the fire;" },
  { t = "p", text = "And, even as that one, if she had had seven, she had given *them all*." },
  { t = "p", text = "He was cast into the fire, and the blaze kindled around him;" },
  { t = "p", text = "And his mother looked on, and grieved not at his burning." },
  { t = "p", text = "Another eye, which gazeth upon the things unseen," },
  { t = "p", text = "Was in her soul, and by reason of this she exulted when he was being burned." },
  { t = "p", text = "On the gems of light which are in martyrs’ crowns she looked," },
  { t = "p", text = "And on the glory which is laid up for them after their sufferings;" },
  { t = "p", text = "And *on* the promised blessings which they inherit yonder through their afflictions," },
  { t = "p", text = "And *on* the Son of God who clothes their limbs with light;" },
  { t = "p", text = "And *on* the manifold beauties of that kingdom which shall not be dissolved," },
  { t = "p", text = "And *on* the ample door which is opened for them to enter in to God." },
  { t = "p", text = "On these did the martyr’s mother look when he was being burned," },
  { t = "p", text = "And she rejoiced, she exalted, and in white did she go forth with him." },
  { t = "p", text = "She looked upon him while the fire consumed his frame," },
  { t = "p", text = "And, forasmuch as his crown was very noble, she grieved not." },
  { t = "p", text = "The sweet root was thrown into the fire, upon the coals;" },
  { t = "p", text = "And it turned to incense, and cleansed the air from pollution." },
  { t = "p", text = "With the fumes of sacrifice had the air been polluted," },
  { t = "p", text = "And by the burning of this martyr was it cleansed." },
  { t = "p", text = "The firmament was fetid with the exhalations from[^3326] the altars;" },
  { t = "note", id = "3326", text = "Lit. “the sacrifices of.”—Tr." },
  { t = "p", text = "And there rose up the sweet perfume of the martyr, and it grew sweet thereby." },
  { t = "p", text = "And the sacrifices ceased, and there was peace in the assemblies;" },
  { t = "p", text = "And the sword was blunted, that it should no more lay waste the friends of Christ." },
  { t = "p", text = "With Sharbil it began, with Habib it ended, in our land;" },
  { t = "p", text = "And from that time[^3327] even until now not one has it slain, since he was burned." },
  { t = "note", id = "3327", text = "Lit. “from him.”—Tr." },
  { t = "p", text = "Constantine, chief of conquerors, took the empire," },
  { t = "p", text = "And the cross has trampled on the diadem of the emperor, and is set upon his head." },
  { t = "p", text = "Broken is the lofty horn of idolatry," },
  { t = "p", text = "And from the burning of the martyr even until now not one has it pierced." },
  { t = "p", text = "His smoke arose, and it became incense to the Godhead;" },
  { t = "p", text = "And by it was the air purged which was tainted by paganism," },
  { t = "p", text = "And by his burning was the whole land cleansed:" },
  { t = "p", text = "Blessed be he that gave him a crown, and glory, and a good name!" },
  { t = "p", text = "*Here* endeth the Homily on Habib the martyr, composed by Mar Jacob." },
]

[[section]]
id = "homily-on-guria-and-shamuna"
title = "Homily on Guria and Shamuna."
level = 1
blocks = [
  { t = "p", text = "Shamuna and Guria, martyrs who made themselves illustrious in their afflictions," },
  { t = "p", text = "Have in love required of me to tell of their illustrious deeds." },
  { t = "p", text = "To champions of the faith the doctrine calleth me," },
  { t = "p", text = "That I should go and behold their contests and their crowns." },
  { t = "p", text = "Children of the right hand, who have done battle against the left," },
  { t = "p", text = "Have called me this day to recite the marvellous tale of their conflicts:—" },
  { t = "p", text = "Simple old men, who entered into the fight like heroes," },
  { t = "p", text = "And nobly distinguished themselves in the strife of blood:" },
  { t = "p", text = "Those who were the salt of our land, and it was sweetened thereby," },
  { t = "p", text = "And its savour was restored, which had become insipid through unbelief:" },
  { t = "p", text = "Candlesticks of gold, which were full of the oil of the crucifixion," },
  { t = "p", text = "By which was lighted up all our region, which had turned to darkness:" },
  { t = "p", text = "Two lamps, of which, when all the winds were blowing" },
  { t = "p", text = "Of every *kind of* error, the lights were not put out;" },
  { t = "p", text = "Good labourers, who from the spring of day laboured" },
  { t = "p", text = "In the blessed vineyard of the house of God right duteously:" },
  { t = "p", text = "Bulwarks of our land, who became to us as it were a defence" },
  { t = "p", text = "Against all spoilers in all the wars that surrounded us:" },
  { t = "p", text = "Havens of peace, a place also of retreat for all that were distressed," },
  { t = "p", text = "And a resting-place for the head of every one that was in need of succour:" },
  { t = "p", text = "Two precious pearls, which were" },
  { t = "p", text = "An ornament for the bride of my lord Abgar, the Aramæan’s son." },
  { t = "p", text = "Teachers they were who practised their teaching in blood," },
  { t = "p", text = "And whose faith was known by their sufferings." },
  { t = "p", text = "On their bodies they wrote the story of the Son of God" },
  { t = "p", text = "With *the marks of* combs and scourges which thickly covered them." },
  { t = "p", text = "They showed their love, not by words of the mouth alone," },
  { t = "p", text = "But by tortures and by the rending of their limbs asunder." },
  { t = "p", text = "For the love of the Son of God they gave up their bodies:" },
  { t = "p", text = "Since it beseemeth the lover that for his love he should give up himself." },
  { t = "p", text = "Fire and sword proved their love, how true *it was;*" },
  { t = "p", text = "And more beautiful than silver tried in *a furnace of* earth were their necks." },
  { t = "p", text = "They looked on God, and, because they saw His exalted beauties," },
  { t = "p", text = "Therefore did they look with contempt upon their sufferings for His sake." },
  { t = "p", text = "The Sun of righteousness had arisen in their hearts;" },
  { t = "p", text = "And they were enlightened by it, and with *His* light chased they away the darkness." },
  { t = "p", text = "At the idols of vanity, which error had brought in, they laughed," },
  { t = "p", text = "Instinct with the faith of the Son of God which is full of light." },
  { t = "p", text = "The love of the Lord was as a fire in their hearts;" },
  { t = "p", text = "Nor could all the brambles of idolatry stand before it." },
  { t = "p", text = "Fixed was their love on God unchangeably:[^3328]" },
  { t = "note", id = "3328", text = "Or “who changes not.”—Tr." },
  { t = "p", text = "And therefore did they look with scorn upon the sword,[^3329] all athirst as it was for blood." },
  { t = "note", id = "3329", text = "Σαμψηρά.— Tr." },
  { t = "p", text = "With guilelessness and *yet with* wisdom stood they in the judgment-hall," },
  { t = "p", text = "As they had been commanded by the Teacher of that which is true." },
  { t = "p", text = "Despising as they did kindred and family, guileless were they;" },
  { t = "p", text = "Forasmuch, also, as possessions and wealth were held in no account by them." },
  { t = "p", text = "*Nor guileless only:* for in the judgment-hall with the wisdom of serpents *too*" },
  { t = "p", text = "They were heedful of the faith of the house of God." },
  { t = "p", text = "When a serpent is seized and struck, he guards his head," },
  { t = "p", text = "But gives up and leaves exposed all his body to his captors:" },
  { t = "p", text = "And, so long as his head is kept *from harm*, his life abideth in him;" },
  { t = "p", text = "But, if the head be struck, his life is left *a prey* to destruction." },
  { t = "p", text = "The head of the soul is men’s faith;" },
  { t = "p", text = "And, if this be preserved *unharmed*, by it is also preserved their life:[^3330]" },
  { t = "note", id = "3330", text = "Or “salvation:” a different word from that used in speaking of the serpent.—Tr." },
  { t = "p", text = "Even though the whole body be lacerated with blows," },
  { t = "p", text = "*Yet*, so long as faith is preserved, the soul is alive;" },
  { t = "p", text = "But, if faith is struck *down* by unbelief," },
  { t = "p", text = "Lost is the soul, and life has perished from the man." },
  { t = "p", text = "Shamuna and Guria of the faith as men[^3331]" },
  { t = "note", id = "3331", text = "Lit. “as a man.”—Tr." },
  { t = "p", text = "Were heedful, that it should not be struck *down* by persecutors:" },
  { t = "p", text = "For they knew that, if faith is preserved," },
  { t = "p", text = "Both soul and body are preserved from destruction." },
  { t = "p", text = "And, because of this, touching their faith were they solicitous," },
  { t = "p", text = "That that should not be struck *down* in which their very life was hidden." },
  { t = "p", text = "They gave up their bodies both to blows and to dislocation,[^3332]" },
  { t = "note", id = "3332", text = "Or “rending asunder.”—Tr." },
  { t = "p", text = "Yea to every *kind of* torture, that their faith should not be stricken *down;*" },
  { t = "p", text = "And, even as the serpent also hides his head from blows," },
  { t = "p", text = "So hid they their faith within their hearts;" },
  { t = "p", text = "And the body was smitten, and endured stripes, and bore sufferings:" },
  { t = "p", text = "But overthrown was not their faith which was within their hearts." },
  { t = "p", text = "The mouth betrayeth the soul to death when it speaks," },
  { t = "p", text = "And with the tongue, as with a sword, worketh slaughter." },
  { t = "p", text = "And from it spring up both life and death to men:" },
  { t = "p", text = "Denying *a man* dies, confessing he lives, and *the mouth* hath power over it." },
  { t = "p", text = "Denial is death, and in confession is the soul’s life;" },
  { t = "p", text = "And power hath the mouth over them both, like a judge." },
  { t = "p", text = "The word of the mouth openeth the door for death to enter in;" },
  { t = "p", text = "This, too, calleth for life, and it beameth forth upon the man." },
  { t = "p", text = "Even the robber by one word of faith" },
  { t = "p", text = "Won him the kingdom, and became heir of paradise,[^3333] all fraught with blessings." },
  { t = "note", id = "3333", text = "Lit. “the garden.”—Tr." },
  { t = "p", text = "The wicked judges too, from the martyrs, the sons of the right hand," },
  { t = "p", text = "Demanded that by word of mouth only they should blaspheme;" },
  { t = "p", text = "But, like true men holding fast the faith," },
  { t = "p", text = "They uttered not a word by which unbelief might be served." },
  { t = "p", text = "Shamuna, beauty of our faith, who is adequate to *tell of* thee?" },
  { t = "p", text = "All too narrow is my mouth for thy praise, too mean for thee to be spoken of by it." },
  { t = "p", text = "Thy truth is thy beauty, thy crown thy suffering, thy wealth thy stripes," },
  { t = "p", text = "And by reason of thy blows magnificent is the beauty of thy championship." },
  { t = "p", text = "Proud of thee is our country, as of a treasury which is full of gold:" },
  { t = "p", text = "Since wealth art thou to us, and a coveted store which cannot be stolen *from us*." },
  { t = "p", text = "Guria, martyr, staunch hero of our faith," },
  { t = "p", text = "Who shall suffice thee, to recount thy beauties divine?" },
  { t = "p", text = "Lo! tortures on thy body are set like gems of beryl," },
  { t = "p", text = "And the sword on thy neck like a chain of choice gold." },
  { t = "p", text = "Thy blood upon thy form is a robe of glory full of beauty," },
  { t = "p", text = "And the scourging of thy back a vesture with which the sun may not compare." },
  { t = "p", text = "Radiant thou art and comely by virtue of these thy sufferings, so abounding;" },
  { t = "p", text = "And resplendent are thy beauties, because of the pains which are *so* severe upon thee." },
  { t = "p", text = "Shamuna, our riches, richer art thou than the rich:" },
  { t = "p", text = "For lo! the rich stand at thy door, that thou mayest relieve them." },
  { t = "p", text = "Small thy village, poor thy country: who, then, gave thee" },
  { t = "p", text = "That lords of villages and cities should court thy favour?" },
  { t = "p", text = "Lo! judges in their robes and vestments" },
  { t = "p", text = "Take dust from thy threshold, as *though it were* the medicine of life." },
  { t = "p", text = "The cross is rich, and to its worshippers increaseth riches;" },
  { t = "p", text = "And its poverty despiseth all the riches of the world." },
  { t = "p", text = "Shamuna and Guria, sons of the poor, lo! at your doors" },
  { t = "p", text = "Bow down the rich, that they may receive from you *supplies for* their wants." },
  { t = "p", text = "The Son of God in poverty and want" },
  { t = "p", text = "Showed to the world that all its riches are as nothing," },
  { t = "p", text = "*His disciples*, all fishermen, all poor, all weak," },
  { t = "p", text = "All men of little note, became illustrious through His faith." },
  { t = "p", text = "One fisherman, whose “village” too was a home of fishermen,[^3334]" },
  { t = "note", id = "3334", text = "i.e., “Bethsaida.”—Tr." },
  { t = "p", text = "He made chief over the twelve, yea head of the house.[^3335]" },
  { t = "note", id = "3335", text = "Or “steward.”—Tr." },
  { t = "p", text = "One a tentmaker, who aforetime was a persecutor," },
  { t = "p", text = "He seized upon, and made him a chosen vessel for the faith." },
  { t = "p", text = "Shamuna and Guria came from villages that were not wealthy," },
  { t = "p", text = "And lo! in a great city became they lords;" },
  { t = "p", text = "And its chief men, its judges also, stand before their doors," },
  { t = "p", text = "And they solicit their charity to satisfy their wants." },
  { t = "p", text = "From their confession of the faith of the Son of God" },
  { t = "p", text = "These blessed men acquired riches beyond compute." },
  { t = "p", text = "Poor did He Himself become, and the poor made He rich;" },
  { t = "p", text = "And lo! enriched is the whole creation through His poverty." },
  { t = "p", text = "The chosen martyrs did battle against error," },
  { t = "p", text = "And in the confession of the Son of God stood they firm like valiant men." },
  { t = "p", text = "They went in and confessed Him before the judge with look undaunted,[^3336]" },
  { t = "note", id = "3336", text = "Lit. “with openness of countenance.”—Tr." },
  { t = "p", text = "That He too might confess them, even as they confessed Him, before His Father." },
  { t = "p", text = "There arose against them the war of pagans like a tempest;" },
  { t = "p", text = "But the cross was their helmsman, and steered them on." },
  { t = "p", text = "They were required to sacrifice to lifeless images," },
  { t = "p", text = "But they departed not from their confession of the Son of God." },
  { t = "p", text = "The wind of idolatry blew in their faces," },
  { t = "p", text = "But they themselves were as rocks piled up against the hurricane." },
  { t = "p", text = "Like a swift whirlwind, error snatched at them;" },
  { t = "p", text = "But, forasmuch as they were sheltered by the crucifixion, it hurt them not." },
  { t = "p", text = "The Evil One set on all his dogs to bark, that they might bite them;" },
  { t = "p", text = "But, forasmuch as they had the cross for a staff, they put them all to flight." },
  { t = "p", text = "But who is sufficient to tell of their contests," },
  { t = "p", text = "Or their sufferings, or the rending asunder of their limbs?" },
  { t = "p", text = "Or who can paint the picture of their coronation,[^3337]" },
  { t = "note", id = "3337", text = "Lit. “portray the image of their crowns.”—Tr." },
  { t = "p", text = "How they went up from the contest covered with glory?" },
  { t = "p", text = "To judgment they went in, but of the judge they took no account;" },
  { t = "p", text = "Nor were they anxious what they should say when questioned." },
  { t = "p", text = "The judge menaced *them*, and multiplied his words of threatening;" },
  { t = "p", text = "And recounted tortures and all *kinds of* inflictions, that he might terrify them." },
  { t = "p", text = "He spake great words,[^3338] that by fright and intimidation," },
  { t = "note", id = "3338", text = "Lit. “magnified his words.”—Tr." },
  { t = "p", text = "By menaces too, he might incline them to sacrifice." },
  { t = "p", text = "Yet the combatants despised the menaces, and the intimidations," },
  { t = "p", text = "And the sentence of judgment, and all bodily deaths;" },
  { t = "p", text = "And they prepared themselves for insult and stripes, and for blows," },
  { t = "p", text = "And for provocation, and to be dragged along, and to be burnt;" },
  { t = "p", text = "For imprisonment also, and for bonds, and for all evil things," },
  { t = "p", text = "And for all tortures, and for all sufferings, rejoicing all the while." },
  { t = "p", text = "They were not alarmed nor affrighted, nor dismayed," },
  { t = "p", text = "Nor did the sharpness of the tortures bend them to sacrifice." },
  { t = "p", text = "Their body they despised, and as dung upon the ground accounted they it:" },
  { t = "p", text = "For they knew that, the more it was beaten, the more would its beauty increase;" },
  { t = "p", text = "And, the more the judge increased his menaces to alarm them," },
  { t = "p", text = "The more did they show their contempt of him, having no fear of his threats." },
  { t = "p", text = "He kept telling them what tortures he had prepared for them;" },
  { t = "p", text = "And they continued telling him about Gehenna which was reserved for him." },
  { t = "p", text = "By those things which he told *them* he tried to frighten them to sacrifice;" },
  { t = "p", text = "And they spoke to him about the fearful judgment yonder." },
  { t = "p", text = "Truth is wiser than wise words," },
  { t = "p", text = "And very hateful, however much it may be adorned, is falsehood." },
  { t = "p", text = "Shamuna and Guria went on speaking truth," },
  { t = "p", text = "While the judge continued to utter falsehood." },
  { t = "p", text = "And therefore were they not afraid of his threatening," },
  { t = "p", text = "Because all his menaces against the truth were accounted *by them* as empty sound.[^3339]" },
  { t = "note", id = "3339", text = "Lit. “as breath.”—Tr." },
  { t = "p", text = "The intercourse of the world they despised, they contemned and scorned, *yea* they abandoned;" },
  { t = "p", text = "And to return to it they had no wish, or to enter it *again*." },
  { t = "p", text = "From the place of judgment they set their faces to depart" },
  { t = "p", text = "To that meeting-place for them all, the life of the new world." },
  { t = "p", text = "They cared neither for possessions nor for houses," },
  { t = "p", text = "Nor for the advantages of this world, so full of evil." },
  { t = "p", text = "In the world of light was their heart bound captive with God," },
  { t = "p", text = "And to “that” country did they set their face to depart;" },
  { t = "p", text = "And they looked to the sword, to come and be a bridge" },
  { t = "p", text = "To let them pass over to God, for whom they were longing." },
  { t = "p", text = "This world they accounted as a little tent," },
  { t = "p", text = "But that yonder as a city full of beauties;" },
  { t = "p", text = "And they were in haste by the sword to depart hence" },
  { t = "p", text = "To the land of light, which is full of blessing for those who are worthy of it." },
  { t = "p", text = "The judge commanded to hang them up by their arms," },
  { t = "p", text = "And without mercy did they stretch them out in bitter agony." },
  { t = "p", text = "A demon’s fury breathed rage into the heart of the judge," },
  { t = "p", text = "And embittered him against the stedfast ones, *inciting him* to crush them;" },
  { t = "p", text = "And between the height and the depth he stretched them out to afflict them:" },
  { t = "p", text = "And they were a marvel to both sides, *when they saw* how much they endured." },
  { t = "p", text = "At the old men’s frame heaven and earth marvelled," },
  { t = "p", text = "*To see* how much suffering it bore nor cried out for help under *their* affliction." },
  { t = "p", text = "Hung up and dragged along are their feeble bodies by their arms," },
  { t = "p", text = "Yet is there deep silence, nor is there one that cries out for help or that murmurs." },
  { t = "p", text = "Amazed were all who beheld their contests," },
  { t = "p", text = "*To see* how *calmly* the outstretched forms bore the inflictions *laid upon them*.[^3340]" },
  { t = "note", id = "3340", text = "Lit. “how much the outstretched forms bore in consequence of the inflictions.”—Tr." },
  { t = "p", text = "Amazed too was Satan at their spotless frames," },
  { t = "p", text = "*To see* what weight of affliction they sustained without a groan." },
  { t = "p", text = "Yea, and gladdened too were the angels by that fortitude *of theirs*," },
  { t = "p", text = "*To see* how patiently it bore that contest so terrible that was." },
  { t = "p", text = "But, as combatants who were awaiting their crowns," },
  { t = "p", text = "There entered no sense of weariness into their minds." },
  { t = "p", text = "Nay, it was the judge that grew weary; yea, he was astonished:" },
  { t = "p", text = "But the noble men *before him felt* no weariness in their afflictions." },
  { t = "p", text = "He asked them whether they would consent to sacrifice;" },
  { t = "p", text = "But the mouth was unable to speak from pain." },
  { t = "p", text = "Thus did the persecutors increase their inflictions," },
  { t = "p", text = "Until they gave no place for the word to be spoken." },
  { t = "p", text = "Silent was the mouth from the inflictions laid on their limbs;" },
  { t = "p", text = "But the will, like that of a hero, was nerved with fortitude from itself." },
  { t = "p", text = "Alas for the persecutors! how destitute were they of righteousness!" },
  { t = "p", text = "But the children of light—how were they clad in faith!" },
  { t = "p", text = "They demand speech, when there is no place for speaking," },
  { t = "p", text = "Since the word of the mouth was forbidden them by pain." },
  { t = "p", text = "Fast bound was the body, and silent the mouth, and it was unable" },
  { t = "p", text = "To utter the word when unrighteously questioned." },
  { t = "p", text = "And what should the martyr do, who had no power to say," },
  { t = "p", text = "When he was questioned, that he would not sacrifice?" },
  { t = "p", text = "All silent were the old men full of faith," },
  { t = "p", text = "And from pain they were incapable of speaking." },
  { t = "p", text = "Yet questioned they were: and in what way, if a man is silent" },
  { t = "p", text = "When he is questioned, shall he assent to that which is said?" },
  { t = "p", text = "But the old men, that they might not be thought to assent," },
  { t = "p", text = "Expressed clearly by signs the word which it behoved them to speak." },
  { t = "p", text = "Their heads they shook, and, instead of speech, by a dumb sign they showed" },
  { t = "p", text = "The resolve of the new man that was within." },
  { t = "p", text = "Their heads hung down, signifying amidst their pains" },
  { t = "p", text = "That they were not going to sacrifice, and every one understood their meaning." },
  { t = "p", text = "As long as there was in them place for speech, with speech did they confess;" },
  { t = "p", text = "But, when it was forbidden them by pain, they spake with a dumb sign." },
  { t = "p", text = "Of faith they spoke both with the voice and without the voice:" },
  { t = "p", text = "So that, when speaking and also when silent, they were *alike* stedfast." },
  { t = "p", text = "Who but must be amazed at the path of life, how narrow it is," },
  { t = "p", text = "And how straight to him that desires to walk in it?" },
  { t = "p", text = "Who but must marvel *to see* that, when the will is watchful and ready," },
  { t = "p", text = "It is very broad and full of light to him that goeth therein?" },
  { t = "p", text = "About the path are ditches; full also is it of pitfalls;" },
  { t = "p", text = "And, if one turn but a little aside from it, a ditch receives him." },
  { t = "p", text = "That dumb sign only is there between the right and the left," },
  { t = "p", text = "And on “Yea” and “Nay” stand[^3341] sin and righteousness." },
  { t = "note", id = "3341", text = "Or “depend.”—Tr." },
  { t = "p", text = "By a dumb sign only did the blessed men plainly signify that they would not sacrifice," },
  { t = "p", text = "And in virtue of a single dumb sign did the path lead them to Eden;" },
  { t = "p", text = "And, if this same dumb sign had inclined and turned down but a little" },
  { t = "p", text = "Toward the depth, the path of the old men would have been to Gehenna." },
  { t = "p", text = "Upwards they made a sign, *to signify* that upwards were they prepared to ascend;" },
  { t = "p", text = "And in consequence of that sign they ascended and mingled with the heavenly ones." },
  { t = "p", text = "Between sign and sign were Paradise and Gehenna:" },
  { t = "p", text = "They made a sign that they would not sacrifice, and they inherited the place of the kingdom." },
  { t = "p", text = "Even while they were silent they were advocates for the Son of God:" },
  { t = "p", text = "For not in multitude of words doth faith consist." },
  { t = "p", text = "That fortitude of theirs was a full-voiced confession," },
  { t = "p", text = "And as though with open mouth declared they *their* faith by signs;" },
  { t = "p", text = "And every one knew what they were saying, though silent," },
  { t = "p", text = "And enriched and increased was the faith of the house of God;" },
  { t = "p", text = "And error was put to shame by reason of two old men, who, though they spake not," },
  { t = "p", text = "Vanquished it; and they kept silence, and their faith stood fast." },
  { t = "p", text = "And, though tempestuous accents were heard from the judge," },
  { t = "p", text = "And the commands of the emperor were dreadful, yea violent," },
  { t = "p", text = "And paganism had a bold face and an open mouth," },
  { t = "p", text = "And its voice was raised, and silent were the old men with pain," },
  { t = "p", text = "*Yet* null and void became the command and drowned was the voice of the judge," },
  { t = "p", text = "And without speech the mute sign of the martyrs bore off the palm." },
  { t = "p", text = "Talking and clamour, and the sound of stripes, on the left;" },
  { t = "p", text = "And deep silence and suffering standing on the right;" },
  { t = "p", text = "And, by one mute sign with which the old men pointed above their heads," },
  { t = "p", text = "The head of faith was lifted up, and error was put to shame." },
  { t = "p", text = "Worsted in the encounter were they who spoke, and the victory was to the silent:" },
  { t = "p", text = "For, voiceless they uttered by signs the discourse of faith." },
  { t = "p", text = "They took them down, because they had vanquished while silent;" },
  { t = "p", text = "And they put them in bonds, threatening *yet* to vanquish them." },
  { t = "p", text = "Bonds and a dungeon void of light were by the martyrs" },
  { t = "p", text = "Held of no account—yea *rather* as the light which has no end." },
  { t = "p", text = "*To be* without bread, and without water, and without light," },
  { t = "p", text = "Pleased them well, because of the love of the Son of God." },
  { t = "p", text = "The judge commanded by their feet to hang them up" },
  { t = "p", text = "With their heads downwards, by a sentence all unrighteous:" },
  { t = "p", text = "Hanged up was Shamuna with his head downwards; and he prayed" },
  { t = "p", text = "*In* prayer pure and strained clear by pain." },
  { t = "p", text = "Sweet fruit was hanging on the tree in that judgment-hall," },
  { t = "p", text = "And its taste and smell made the very denizens of heaven to marvel." },
  { t = "p", text = "Afflicted was his body, but sound was his faith;" },
  { t = "p", text = "Bound fast was his person, but unfettered was his prayer over his deed." },
  { t = "p", text = "For, prayer nothing whatsoever turneth aside," },
  { t = "p", text = "And *nothing* hindereth it—not even sword, not even fire." },
  { t = "p", text = "His form was turned upside down, but *his* prayer was unrestrained," },
  { t = "p", text = "And straight was its path on high to the abode of the angels." },
  { t = "p", text = "The more the affliction of the chosen martyr was increased," },
  { t = "p", text = "The more from his lips was all confession heard." },
  { t = "p", text = "The martyrs longed for the whetted sword affectionately," },
  { t = "p", text = "And sought it as a treasure full of riches." },
  { t = "p", text = "A new work has the Son of God wrought in the world—" },
  { t = "p", text = "That dreadful death should be yearned for[^3342] by many." },
  { t = "note", id = "3342", text = "Or “beloved.”—Tr." },
  { t = "p", text = "That men should run to meet the sword is a thing unheard of," },
  { t = "p", text = "Except they were those whom Jesus has enlisted in His service by His crucifixion." },
  { t = "p", text = "That death is bitter, every one knoweth lo! from earliest time:" },
  { t = "p", text = "To martyrs alone is it not bitter to be slain." },
  { t = "p", text = "They laughed at the whetted sword when they saw it," },
  { t = "p", text = "And greeted it with smiles: for it was that which was the occasion of their crowns." },
  { t = "p", text = "As though it had been something hated, they left the body to be beaten:" },
  { t = "p", text = "Even though loving it, they held it not back from pains." },
  { t = "p", text = "For the sword they waited, and the sword went forth and crowned them:" },
  { t = "p", text = "Because for it they looked; and it came to meet them, even as they desired." },
  { t = "p", text = "The Son of God slew death by His crucifixion;" },
  { t = "p", text = "And, inasmuch as death is slain, it caused no suffering to the martyrs." },
  { t = "p", text = "With a wounded serpent one playeth without fear;" },
  { t = "p", text = "A slain lion even a coward will drag along:" },
  { t = "p", text = "The great serpent our Lord crushed by His crucifixion;" },
  { t = "p", text = "The dread lion did the Son of God slay by His sufferings." },
  { t = "p", text = "Death bound He fast, and laid him prostrate and trampled on him at the gate of Hades;" },
  { t = "p", text = "And *now* whosoever will draweth near and mocketh at him, because he is slain." },
  { t = "p", text = "These old men, Shamuna and Guria, mocked at death," },
  { t = "p", text = "As at that lion which by the Son of God was slain." },
  { t = "p", text = "The great serpent, which slew Adam among the trees," },
  { t = "p", text = "*Who* could seize, so long as he drank not of the blood of the cross?" },
  { t = "p", text = "The Son of God crushed the dragon by His crucifixion," },
  { t = "p", text = "And lo! boys and old men mock at the wounded serpent." },
  { t = "p", text = "Pierced is the lion with the spear which *pierced* the side of the Son of God;" },
  { t = "p", text = "And whosoever will trampleth on him, yea mocketh at him." },
  { t = "p", text = "The Son of God—He is the cause of all good things," },
  { t = "p", text = "And Him doth it behove every mouth to celebrate." },
  { t = "p", text = "He did Himself espouse[^3343] the bride with the blood which flowed from His wounds," },
  { t = "note", id = "3343", text = "Lit. “purchase.”—Tr." },
  { t = "p", text = "And of His wedding-friends He demanded as a nuptial gift[^3344] the blood of their necks." },
  { t = "note", id = "3344", text = "***, though not in the lexicons, is the same word that appears in Castel as ***." },
  { t = "p", text = "The Lord of the wedding-feast hung on the cross in nakedness," },
  { t = "p", text = "And whosoever came to be a guest, He let fall His blood upon him." },
  { t = "p", text = "Shamuna and Guria gave up their bodies for His sake" },
  { t = "p", text = "To sufferings and tomes and to all the various forms of woe.[^3345]" },
  { t = "note", id = "3345", text = "Lit. “to the forms (σχήματα) of all afflictions.”—Tr." },
  { t = "p", text = "At Him they looked as He was mocked by wicked men," },
  { t = "p", text = "And thus did they themselves endure mockery without a groan." },
  { t = "p", text = "Edessa was enriched by your slaughter, O blessed ones:" },
  { t = "p", text = "For ye adorned her with your crowns and with your sufferings." },
  { t = "p", text = "Her beauty are ye, her bulwark ye, her salt ye," },
  { t = "p", text = "Her riches and her store, yea her boast and all her treasure." },
  { t = "p", text = "Faithful stewards are ye:[^3346]" },
  { t = "note", id = "3346", text = "This seems preferable to Cureton’s “Ye are the stewards of (her) faith.” The expression exactly corresponds in form to that in Luke xvi. 8 (Peshito): “the steward of injustice” =\"the unjust steward.”" },
  { t = "p", text = "Since by your sufferings ye did array the bride in beauty." },
  { t = "p", text = "The daughter of the Parthians, who was espoused to the cross,[^3347]" },
  { t = "note", id = "3347", text = "Lit. “crucifixion.”—Tr." },
  { t = "p", text = "Of *you* maketh her boast: since by your teaching lo! she was enlightened." },
  { t = "p", text = "Her advocates are ye; scribes who, though silent, vanquished" },
  { t = "p", text = "All error, whilst its voice was uplifted high in unbelief." },
  { t = "p", text = "Those old men[^3348] of the daughter of the Hebrews were sons of Belial,[^3349]" },
  { t = "note", id = "3348", text = "Or “elders.”—Tr." },
  { t = "note", id = "3349", text = "By this name the men referred to (not, however, the elders, but the two false witnesses suborned by them) are called in 1 Kings xxi. 10, 13. The expression in the text is literally “sons of iniquity,” and that is used by the Peshito.—Tr." },
  { t = "p", text = "False witnesses, who killed Naboth, feigning themselves *to be true*." },
  { t = "p", text = "Her did Edessa outdo by her two old men full of beauty," },
  { t = "p", text = "Who were witnesses to the Son of God, and died like Naboth." },
  { t = "p", text = "Two were there, and two here, old men;" },
  { t = "p", text = "And these were called witnesses, and witnesses those." },
  { t = "p", text = "Let us now see which of them were witnesses chosen of God," },
  { t = "p", text = "And which city is beloved by reason of her old men and of her honourable ones." },
  { t = "p", text = "Lo! the sons of Belial who slew Naboth are witnesses;" },
  { t = "p", text = "And here Shamuna and Guria, again, are witnesses." },
  { t = "p", text = "Let us now see which witnesses, and which old men," },
  { t = "p", text = "And which city can stand with confidence[^3350] before God." },
  { t = "note", id = "3350", text = "Or “have an open countenance.”—Tr." },
  { t = "p", text = "Sons of Belial were those witnesses of that adulterous woman," },
  { t = "p", text = "And lo! their shame is all portrayed in their names." },
  { t = "p", text = "Edessa’s just and righteous old men, her witnesses," },
  { t = "p", text = "Were like Naboth, who himself also was slain for righteousness’ sake." },
  { t = "p", text = "They were not like the two lying sons of Belial," },
  { t = "p", text = "Nor is Edessa like Zion, which also crucified *the Lord*." },
  { t = "p", text = "Like herself her old men were false, yea dared" },
  { t = "p", text = "To shed on the ground innocent blood wickedly." },
  { t = "p", text = "*But* by these witnesses here lo! the truth is spoken.—" },
  { t = "p", text = "Blessed be He who gave us the treasure-store of their crowns!" },
  { t = "p", text = "*Here* endeth the Homily on Guria and Shamuna." },
]

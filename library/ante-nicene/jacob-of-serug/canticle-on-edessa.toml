[[section]]
id = "a-canticle-of-mar-jacob-the-teacher"
title = "A Canticle of Mar Jacob the Teacher on Edessa."
level = 1
blocks = [
  { t = "h", text = "Ancient Syriac Documents." },
  { t = "p", text = "A Canticle of Mar[^2939] Jacob the Teacher on Edessa.[^2940]" },
  { t = "note", id = "2939", text = "Or, “My Lord,” or “Mr.”—Tr." },
  { t = "note", id = "2940", text = "This is taken from Cod. Add. 17, 158, fol. 56, where is added: “when she sent to our Lord to come to her.”" },
  { t = "p", text = "Edessa sent to Christ by an epistle to come to her and enlighten her. On behalf of all the peoples did she make intercession to Him that He would leave Zion, which hated Him, and come to the peoples, who loved Him." },
  { t = "p", text = "She despatched a messenger to Him, and begged of Him to enter into friendship with her. By the righteous king she made intercession to Him, that He would depart from the *Jewish* people, and towards the *other* peoples direct His burden." },
  { t = "p", text = "From among all kings one wise king did the daughter of the peoples find. Ambassador she made him. To her Lord she sent by him: Come Thou unto me; I will forget in Thee all idols and carved images." },
  { t = "p", text = "The harlot heard the report of Him from afar, as she was standing in the street, going astray with idols, playing the wench with carved images. She loved, she much desired Him, when He was far away, and begged Him to admit her into His chamber." },
  { t = "p", text = "Let the much-desired Bridegroom kiss me: with the kisses of His mouth let me be blessed. I have heard of Him from afar: may I see Him near; and may I place my lips upon His, and be delighted by seeing Him with mine eyes." },
  { t = "p", text = "Thy breasts are better to me than wine: for the fragrance of Thy sweetness is life for evermore. With Thy milk shall I be nourished; with Thy fragrance shall I grow sweet from the smoke of idols, which with its rank odour did make me fetid." },
  { t = "p", text = "Draw me after Thee into Thy fold: for I am a sheep gone astray in the world. After Thee do I run, and Thy converse do I seek: that in me may be completed that number of a hundred, by means of a lost one which is found.[^2941]" },
  { t = "note", id = "2941", text = "[Luke xv. 6.]" },
  { t = "p", text = "Let Gabriel rejoice and be exceeding glad, with the company of all the angels, in Thee, the Good Shepherd, who on Thy shoulders didst carry the maimed sheep, that that number of a hundred might be preserved." },
  { t = "p", text = "Thy love is better than wine; than the face of the upright Thy affection. By wine let us be reminded of Thee, how by the cup of Thy blood Thou didst grant us to obtain new life, and the upright did celebrate Thy love." },
  { t = "p", text = "A church am I from among the peoples, and I have loved the Only-begotten who was sent *by God:* whereas His betrothed hated Him, I have loved Him; and by the hands of Abgar the Black[^2942] do I beseech Him to come to me and visit me." },
  { t = "note", id = "2942", text = "See note on p. 652." },
  { t = "p", text = "Black am I, yet comely. Ye daughters of Zion, blameless is your envy, seeing that the Son of the Glorious One hath espoused me, to bring me into His chamber. Even when I was hateful, He loved me, for He is able to make me fairer than water." },
  { t = "p", text = "Black was I in sins, but I am comely: for I have repented and turned me. I have put away in baptism that hateful hue, for He hath washed me in His innocent blood who is the Saviour of all creatures." },
  { t = "p", text = "*Here* end the Extracts from the Canticle on Edessa.[^2943]" },
  { t = "note", id = "2943", text = "[This ancient imitation of the Canticles shows how that book was understood, as of Christ and His Church.]" },
]

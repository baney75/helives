[[section]]
id = "introductory-notice"
title = "Introductory Notice."
level = 1
blocks = [
  { t = "h", text = "to" },
  { t = "h", text = "Two Epistles Concerning Virginity." },
  { t = "h", text = "By Professor M. B. Riddle, D.D." },
  { t = "p", text = "Among the “Pseudo-Clementina” the *Two Epistles concerning Virginity* must properly be placed. The evidence against the genuineness seems conclusive; yet, with the exception of the homily usually styled the *Second Epistle of Clement*,[^290] no spurious writings attributed to the great Roman Father can be assigned an earlier date than these two letters. Uhlhorn, in view of the reference to the *sub-introductæ*, thinks they were written shortly before the time of Cyprian;[^291] and this seems very probable. Jerome was acquainted with the writings (*Ad Jovinum*, i. 12), and possibly Epiphanius (*Hær*., xxx. 15). Hence we may safely allow an early date. Yet these evidences of age tell against the genuineness." },
  { t = "note", id = "290", text = "See vol. vii. pp. 509–523." },
  { t = "note", id = "291", text = "Against this class Cyprian stoutly contended. Comp. Cyprian, *Ante-Nicene Fathers*, vol. v. pp. 357, 358, 587–592." },
  { t = "p", text = "1. Early works of this character would not have disappeared from notice to such an extent, had they been authenticated as writings of Clement. Supporting, as they do, the ascetic tendency prevalent in the Western Church at and after the date when they are first noticed by Christian writers, they would have been carefully preserved and frequently cited, had they been genuine. The name of the great Roman Father would have been so weighty, that the advocates of celibacy would have kept the documents in greater prominence. The silence of Eusebius respecting the letters is an important fact in this discussion." },
  { t = "p", text = "2. A second argument against the genuineness is derived from the ascetic tone itself. Such pronounced statements are not, we must firmly hold, to be found in the Christian literature of the sub-apostolic age. This historical argument is further sustained by other indications in the epistles. They point to a stage of ecclesiastical development which belongs to a much later period than that of Clement." },
  { t = "p", text = "3. The use of Scripture in these letters seems to be conclusive against the Clementine authorship. A comparison with the citations in the genuine Epistle of Clement shows that these writings make much greater use of the Pauline (particularly the Pastoral) Epistles; that the Old Testament is less frequently cited, and that the mode of handling proof-texts is that of a later age." },
  { t = "p", text = "4. The judgment of the most candid patristic scholars is against the genuineness. Of Protestants, Wetstein stands alone in supporting the Clementine authorship; and his position is readily explained by the fact that he discovered the Syriac version which restored the writings to modern scholars (see below). The genuineness is defended by Villecourt and Beelen (see below), also by Möhler, Champagny, and Brück. But such experts as Mansi, Hefele, Alzog, and Funk, among Roman Catholics, unite with Protestant scholars in assigning a later date, and consequently in denying the Clementine authorship." },
  { t = "h", text = "Translator’s Introductory Notice." },
  { t = "p", text = "While the great mass of early Christian literature bearing the name of Clement of Rome is undoubtedly spurious, the case is somewhat different with regard to the two following epistles. Not only have Roman Catholic writers maintained their genuineness with great ingenuity and learning, but Wetstein, who first edited them, argued powerfully for their being received as the authentic productions of Clement; and even Neander has admitted that they may possibly have been written by that friend and fellow-labourer of the apostles." },
  { t = "p", text = "Their literary history in modern times is somewhat curious. Wetstein unexpectedly discovered them appended to a copy of the Syriac Peschito version of the New Testament furnished to him by Sir James Porter, then British ambassador at Constantinople. He soon afterwards (1752) published them in Syriac, accompanied by a Latin version of his own, with Prolegomena, in which he upheld their genuineness. This speedily called forth two works, one by Lardner (1753), and a second by Venema (1754), in both of which their authenticity was disputed. To these writings Wetstein himself, and, after his death, Gallandius, published rejoinders; but the question remained as far from positive settlement as ever, and continues *sub-judice* even at the present day" },
  { t = "p", text = "It is generally admitted (and, of course, *asserted* by those that maintain their truly Clementine origin) that Greek was the original language of these epistles. Many have argued that they contain plain references to the *sub-introductæ* spoken of in the literature of the third century, and that therefore they were probably composed in the Oriental Church about that period." },
  { t = "p", text = "These epistles have been very carefully edited in recent times by the Roman Catholic scholars Villecourt (1853) and Beelen (1856). Both have argued strenuously for the genuineness of the letters, but it may be doubted if they have succeeded in repelling all the objections of Lardner and Venema. Beelen’s work is a highly scholarly production, and his Prolegomena are marked by great fulness and perspicuity." },
  { t = "p", text = "A German translation of these epistles was published by Zingerle (1821). They are now for the first time translated into the English language." },
  { t = "p", text = "The translation is made from the text of Beelen." },
  { t = "p", text = "The division into chapters is due to Wetstein." },
]

[[section]]
id = "the-first-epistle-of-the-blessed-clement"
title = "The First Epistle of the Blessed Clement, the Disciple of Peter the Apostle."
level = 1
blocks = [
  { t = "h", level = 3, text = "Two Epistles Concerning Virginity." },
  { t = "h", level = 3, text = "The First Epistle of the Blessed Clement, the Disciple of Peter the Apostle." },
  { t = "p", text = "Chapter I.—The Salutation." },
  { t = "p", text = "To all those who love and cherish their life *which is* in Christ through God the Father, and obey the truth of God in hope of eternal life; to those who bear affection towards their brethren and towards their neighbours in the love of God; to the blessed *brother* virgins,[^292] who devote themselves to preserve virginity “for the sake of the kingdom of heaven;”[^293] and to the holy *sister* virgins: the peace which is in God.[^294]" },
  { t = "note", id = "292", text = "In later Greek παρθένος was used of both sexes (*comp*. Rev. xiv. 4). The Syriac original employs both a masculine and a feminine form. This will not always be indicated in the following translation." },
  { t = "note", id = "293", text = "Matt. xix. 12." },
  { t = "note", id = "294", text = "Or “to the holy virgins who are in God: peace.” So Zingerle, and probably Wetstein." },
  { t = "h", text = "Chapter II. For True Virginity Perfect Virtue is Necessary." },
  { t = "p", text = "Chapter II.—For True Virginity Perfect Virtue is Necessary." },
  { t = "p", text = "Of all virgins of either sex who have truly resolved to preserve virginity for the sake of the kingdom of heaven—of each and every one of them it is required that he be worthy of the kingdom of heaven in every thing. For not by eloquence[^295] or renown,[^296] by station[^297] and descent, or by beauty or strength, or by length of life,[^298] is the kingdom of heaven obtained; but it is obtained by the power of faith, when a man exhibits the works of faith. For whosoever is truly righteous, his works testify concerning his faith, that he is truly a believer, with a faith which is great, a faith which is perfect, a faith which is in God, a faith which shines in good works, that the Father of all may be glorified through Christ. Now, those who are truly virgins for the sake of God give heed to Him who hath said, “Let not righteousness and faith fail thee; bind them on thy neck, and thou shalt find favour for thyself; and devise thou good things before God and before men.”[^299] “The paths,” therefore, “of the righteous shine as the light, and the light of them advances until the day is perfect.”[^300] For the beams of their light illumine the whole creation even now by good works, as those who are truly “the light of the world,”[^301] giving light to “those who sit in darkness,”[^302] that they may arise and go forth from the darkness by the light of the good works of the fear of God, “that they may see our good works and glorify our Father who is in heaven.”[^303] For it is required of the man of God, that in all his words and works he be perfect, and that in his life he be adorned with all exemplary and well-ordered behaviour,[^304] and do all his deeds in righteousness, as a man of God." },
  { t = "note", id = "295", text = "Zing., not so well, takes this to mean, “by the confession of the mouth” (durch das mündliche Bekenntniss), comparing Matt. vii. 21." },
  { t = "note", id = "296", text = "*Lit*. “by word or by name.”" },
  { t = "note", id = "297", text = "The Greek word σχῆμα, here adopted in the Syriac, is sometimes thus used.—Beelen." },
  { t = "note", id = "298", text = "*Lit*. “much time.”" },
  { t = "note", id = "299", text = "Prov. iii. 3, 4 (LXX.)." },
  { t = "note", id = "300", text = "*Lit*. “fixed.” Prov. iv. 18." },
  { t = "note", id = "301", text = "Matt. v. 14." },
  { t = "note", id = "302", text = "Isa. ix. 2; Matt. iv. 16." },
  { t = "note", id = "303", text = "Matt. v. 16; 1 Pet. ii. 12." },
  { t = "note", id = "304", text = "Probably referring to 1 Cor. xiv. 40.—Beelen." },
  { t = "h", text = "Chapter III. True Virgins Prove Themselves Such by Self-Denial, as Does the True Believer by Good Works." },
  { t = "p", text = "Chapter III.—True Virgins Prove Themselves Such by Self-Denial, as Does the True Believer by Good Works." },
  { t = "p", text = "For virgins are a beautiful pattern to believers, and to those who shall believe. The name alone, indeed, without works, does not introduce into the kingdom of heaven; but, if a man be truly a believer, such an one can be saved. For, if a person be only called a believer in name, whilst he is not such in works, he cannot possibly be a believer. “Let no one,” therefore, “lead you astray with the empty words of error.”[^305] For, merely because a person is called a virgin, if he be destitute of works excellent and comely, and suitable to virginity, he cannot possibly be saved. For our Lord called such virginity as that “foolish,” as He said in the Gospel;[^306] and because it had neither oil nor light, it was left outside of the kingdom of heaven, and was shut out from the joy of the bridegroom, and was reckoned with His enemies. For such persons as these “have the appearance only of the fear of God, but the power of it they deny.”[^307] For they “think with themselves that they are something, whilst they are nothing, and are deceived. But let every one constantly try[^308] his works,”[^309] and know himself; for empty worship does he offer, whosoever he be that makes profession of virginity and sanctity, “and denies its power.” For virginity of such a kind is impure, and disowned by all good works. For “every tree whatsoever is known from its fruits.”[^310] “See that thou understand[^311] what I say: God will give thee understanding.”[^312] For whosoever engages before God to preserve sanctity must be girded with all the holy power of God. And, if with true fear[^313] he crucify his body, he for the sake of the fear of God excuses himself from that word *in* which *the Scripture*[^314]has said: “Be fruitful, and multiply,”[^315] and *shuns* all the display, and care, and sensuality,[^316] and fascination of this world, and its revelries and its drunkenness, and all its luxury and ease, and withdraws from the entire life of[^317] this world, and from its snares, and nets, and hindrances; and, whilst thou walkest[^318] upon the earth, be zealous that thy work and thy business be in heaven." },
  { t = "note", id = "305", text = "Eph. v. 6." },
  { t = "note", id = "306", text = "Matt. xxv. 2." },
  { t = "note", id = "307", text = "2 Tim. iii. 5." },
  { t = "note", id = "308", text = "*Lit*. “let every one be trying.”" },
  { t = "note", id = "309", text = "Gal. vi. 3, 4." },
  { t = "note", id = "310", text = "Matt. xii. 33. [More probably Luke vi. 44.—R.]" },
  { t = "note", id = "311", text = "Or “consider.” There is no play on words in the passage quoted (2 Tim. ii. 7), nor perhaps was this intended in the Syriac." },
  { t = "note", id = "312", text = "2 Tim. ii. 7." },
  { t = "note", id = "313", text = "*Lit*. “true in fear *of God*.” The reading is probably faulty.—Beelen." },
  { t = "note", id = "314", text = "The ellipsis is usually to be thus filled up in these epistles. [In similar cases which follow, italics will not be used.—R.]" },
  { t = "note", id = "315", text = "Gen. i. 28." },
  { t = "note", id = "316", text = "Or “the sensual pleasures.”" },
  { t = "note", id = "317", text = "Or “from all intercourse with.”" },
  { t = "note", id = "318", text = "Either something is here omitted by the transcriber, or Clement has varied the form of expression.—Beelen." },
  { t = "h", text = "Chapter IV. Continuation of the Remarks on Self-Denial; Object and Reward of True Virgins." },
  { t = "p", text = "Chapter IV.—Continuation of the Remarks on Self-Denial; Object and Reward of True Virgins." },
  { t = "p", text = "For he who covets for himself these things *so* great and excellent, withdraws and severs himself on this account from all the world, that he may go *and* live a life divine and heavenly, like the holy angels, in work pure and holy, and “in the holiness[^319] of the Spirit of God,”[^320] and that he may serve God Almighty through Jesus Christ for the sake of the kingdom of heaven. On this account he severs himself from all the appetites of the body. And not only does he excuse himself from this *command*, “Be fruitful, and multiply,” but he longs for the “hope promised” and prepared “and laid up in heaven”[^321] by God, who has declared with His mouth, and He does not lie, that it is “better than sons and daughters,”[^322] and that He will give to virgins a notable place in the house of God, which is *something* “better than sons and daughters,” and better than *the place of* those who have passed a wedded life in sanctity, and whose “bed has not been defiled.”[^323] For God will give to virgins the kingdom of heaven, as to the holy angels, by reason of this great and noble profession." },
  { t = "note", id = "319", text = "“Sanctification.”—Beelen. [So A.V. The R.V. correctly renders ἁγιασμός, “sanctification,” in every instance.—R.]" },
  { t = "note", id = "320", text = "2 Thess. ii. 13." },
  { t = "note", id = "321", text = "Col. i. 5." },
  { t = "note", id = "322", text = "Isa. lvi. 4, 5." },
  { t = "note", id = "323", text = "Heb. xiii. 4." },
  { t = "h", text = "Chapter V. The Irksomeness and the Enemies of Virginity." },
  { t = "p", text = "Chapter V.—The Irksomeness and the Enemies of Virginity." },
  { t = "p", text = "Thou desirest, then, to be a virgin? Knowest thou what hardship and irksomeness there is in true virginity—that which stands constantly at all seasons before God, and does not withdraw *from His service*, and “is anxious how it may please its Lord with a holy body, and with *its* spirit?”[^324] Knowest thou what great glory pertains to virginity, and is it for this that thou dost *set thyself to* practise it? Dost thou really know and understand what it is thou art eager to do? Art thou acquainted with the noble task of holy virginity? Dost thou know how, like a man, to enter “lawfully” upon[^325] this contest and “strive,”[^326] that, in the might of the Holy Spirit,[^327] thou choosest this for thyself, that thou mayest be crowned with a crown of light, and that they may lead thee about *in triumph* through “the Jerusalem above”?[^328] If so be, then, that thou longest for all these things, conquer the body; conquer the appetites of the flesh; conquer the world in the Spirit of God; conquer these vain things of time, which pass away and grow old, and decay, and come to an end; conquer the dragon;[^329] conquer the lion;[^330] conquer the serpent;[^331] conquer Satan;—through Jesus Christ, who doth strengthen thee by the hearing of His words and the divine Eucharist.[^332] “Take up thy cross and follow”[^333] Him who makes thee clean, Jesus Christ thy Lord. Strive to run straight forward and boldly, not with fear, but with courage, relying on the promise of thy Lord, that thou shalt obtain the victor-crown[^334] of thy “calling on high”[^335] through Jesus Christ. For whosoever walks perfect in faith, and not fearing, doth in very deed receive the crown of virginity, which is great in its toil and great in its reward. Dost thou understand and know how honourable a thing is sanctity?[^336] Dost thou understand how great and exalted and excellent is the glory of virginity?[^337]" },
  { t = "note", id = "324", text = "1 Cor. vii. 34." },
  { t = "note", id = "325", text = "*Lit*. “descend to.”" },
  { t = "note", id = "326", text = "2 Tim. ii. 5." },
  { t = "note", id = "327", text = "The words, “in the might of the Holy Spirit,” appear to obscure the sense.—Beelen." },
  { t = "note", id = "328", text = "Gal. iv. 26." },
  { t = "note", id = "329", text = "Rev. xii. 7." },
  { t = "note", id = "330", text = "1 Pet. v. 8." },
  { t = "note", id = "331", text = "2 Cor. xi. 3." },
  { t = "note", id = "332", text = "*Lit*. “the Eucharist of the Godhead.” This is an evidence of later date than the sub-apostolic age.—R.]" },
  { t = "note", id = "333", text = "Matt. xvi. 24." },
  { t = "note", id = "334", text = "*Lit*. “crown of victory.”" },
  { t = "note", id = "335", text = "Phil. iii. 14." },
  { t = "note", id = "336", text = "i.e. continency. [The use of the terms “sanctity,” “holy,” etc., in the limited sense of “continency,” “chaste,” etc., is strong evidence of the later origin.—R]" },
  { t = "note", id = "337", text = "The last two sentences properly belong to chap. vi." },
  { t = "h", text = "Chapter VI. Divinity of Virginity." },
  { t = "p", text = "Chapter VI.—Divinity of Virginity." },
  { t = "p", text = "The womb of a holy virgin[^338] carried our Lord Jesus Christ, the Son of God; and the body which our Lord wore, and in which He carried on the conflict in this world, He put on from a holy virgin. From this, therefore, understand the greatness and dignity of virginity. Dost thou wish to be a Christian? Imitate Christ in everything. John, the ambassador, he who came before our Lord, he “than whom there was not a greater among those born of women,”[^339] the holy messenger of our Lord, was a virgin. Imitate, therefore, the ambassador of our Lord, and be his follower[^340] in every thing. *That* John, again, who “reclined on the bosom of our Lord, and whom He greatly loved,”[^341]—he, too, was a holy person.[^342] For it was not without reason that our Lord loved him. Paul, also, and Barnabas, and Timothy, with all the others, “whose names are written in the book of life,”[^343]—these, I say, all cherished and loved sanctity,[^344] and ran in the contest, and finished their course without blemish, as imitators of Christ, and as sons of the living God. Moreover, also, Elijah and Elisha, and many other holy men, we find to have lived a holy[^345] and spotless life. If, therefore, thou desirest to be like these, imitate them with all thy power. For the Scripture has said, “The elders who are among you, honour; and, seeing their manner of life and conduct, imitate their faith.”[^346] And again it saith, “Imitate me, my brethren, as I *imitate* Christ.”[^347]" },
  { t = "note", id = "338", text = "Or “the Holy Virgin.”" },
  { t = "note", id = "339", text = "Matt. xi. 11." },
  { t = "note", id = "340", text = "*Lit*. “lover,” or “friend.”" },
  { t = "note", id = "341", text = "John xxi. 20." },
  { t = "note", id = "342", text = "i.e., a virgin." },
  { t = "note", id = "343", text = "Phil. iv. 3." },
  { t = "note", id = "344", text = "i.e., virginity." },
  { t = "note", id = "345", text = "i.e., celibate, or chaste." },
  { t = "note", id = "346", text = "Heb. xiii. 7." },
  { t = "note", id = "347", text = "1 Cor. xi. 1." },
  { t = "h", text = "Chapter VII. The True Virgin." },
  { t = "p", text = "Chapter VII.—The True Virgin." },
  { t = "p", text = "Those, therefore, who imitate Christ, imitate Him earnestly. For those who have “put on Christ”[^348] in truth, express His likeness in their thoughts, and in their whole life, and in all their behaviour: in word, and in deeds, and in patience, and in fortitude, and in knowledge, and in chastity, and in long-suffering, and in a pure heart, and in faith, and in hope, and in full and perfect love towards God. No virgin, therefore, unless they be in everything as Christ, and as those “who are Christs,”[^349] can be saved. For every virgin who is in God is holy in her body and in her spirit, and is constant in the service of her Lord, not turning away from it any whither, but waiting upon Him always in purity and holiness in the Spirit of God, being “solicitous how she may please her Lord,”[^350] *by living* purely and without stain, and solicitous to be pleasing before Him in every thing. She who is such does not withdraw from our Lord, but in spirit is *ever* with her Lord: as it is written, “Be ye holy, as I am holy, saith the Lord.”[^351]" },
  { t = "note", id = "348", text = "Rom. xiii. 14." },
  { t = "note", id = "349", text = "Gal. v. 24." },
  { t = "note", id = "350", text = "1 Cor. vii. 32." },
  { t = "note", id = "351", text = "1 Pet. i. 15 (*cf.* Lev. xi. 44)." },
  { t = "h", text = "Chapter VIII. Virgins, by the Laying Aside of All Carnal Affection, are Imitators of God." },
  { t = "p", text = "Chapter VIII.—Virgins, by the Laying Aside of All Carnal Affection, are Imitators of God." },
  { t = "p", text = "For, if a man be only in name called holy, he is not holy; but he must be holy in everything: in his body and in his spirit. And those who are virgins rejoice at all times in becoming like God and His Christ, and are imitators of them. For in those that are such there is not “the mind[^352] of the flesh.” In those who are truly believers, and “in whom the Spirit of Christ dwells”[^353]—in them “the mind of the flesh” cannot be: which is fornication, uncleanness, wantonness; idolatry,[^354] sorcery; enmity, jealousy, rivalry, wrath, disputes, dissensions, ill-will; drunkenness, revelry; buffoonery, foolish talking, boisterous laughter; backbiting, insinuations; bitterness, rage; clamour, abuse, insolence of speech; malice, inventing of evil, falsehood; talkativeness,[^355] babbling;[^356] threatenings, gnashing of teeth, readiness to accuse,[^357] jarring,[^358] disdainings, blows; perversions *of the right,*[^359]laxness *in judgment*; haughtiness, arrogance, ostentation, pompousness, *boasting* of family, of beauty, of position, of wealth, of an arm of flesh;[^360] quarrelsomeness, injustice,[^361] eagerness for victory; hatred, anger, envy, perfidy, retaliation;[^362] debauchery, gluttony, “overreaching (which is idolatry),”[^363] “the love of money (which is the root of all evils);”[^364] love of display, vainglory, love of rule, assumption, pride (which is called death, and which “God fights against”).[^365] Every man with whom are these and such like things—every such man is of the flesh. For, “he that is born of the flesh is flesh; and he that is of the earth speaketh of the earth,”[^366] and his thoughts are of the earth. And “the mind of the flesh is enmity towards God. For it does not submit itself to the law of God; for it cannot *do so*,”[^367] because it is in the flesh, “in which dwells no good,”[^368] because the Spirit of God is not in it. For this cause justly does the Scripture say regarding such a generation as this: “My Spirit shall not dwell in men for ever, because they are flesh.”[^369] “Whosoever, therefore, has not the Spirit of God in him, is none of His:”[^370] as it is written, “The Spirit of God departed from Saul, and an evil spirit troubled him, which was sent upon him from God.”[^371]" },
  { t = "note", id = "352", text = "Rom. viii. 6 (φρόνημα)." },
  { t = "note", id = "353", text = "Rom. viii. 9." },
  { t = "note", id = "354", text = "*Lit*. “the worship of idols.” The single word *** sometimes used to express “idolatry” (as in *Eph. Syr*., opp. tom. i. p. 116), is not found in these epistles." },
  { t = "note", id = "355", text = "*Lit*. “much talking.”" },
  { t = "note", id = "356", text = "*Lit*. “empty words.”" },
  { t = "note", id = "357", text = "The word thus rendered is not in the lexicons, but is well illustrated by Isa. xxix. 21 (“that *make* a man an offender”), where the Hiphil of חָטָא is used, corresponding to the Aphel of the same root, from which the present word is derived." },
  { t = "note", id = "358", text = "The word is used in the Peschito of 1 Tim. vi. 5, to express διαπαρατριβαί (“incessant quarrellings,” *Alf*.); [R.V., “wranglings.”—R.]." },
  { t = "note", id = "359", text = "Ex. Conject. Beelen. The word is not in the lexicons." },
  { t = "note", id = "360", text = "Or “power.”" },
  { t = "note", id = "361", text = "*Lit*. “folly;” but so used in 2 Cor. xii. 13." },
  { t = "note", id = "362", text = "Or “returning of evils.”" },
  { t = "note", id = "363", text = "Col. iii. 5." },
  { t = "note", id = "364", text = "1 Tim. vi. 10." },
  { t = "note", id = "365", text = "1 Pet. v. 5; Jas. iv. 6." },
  { t = "note", id = "366", text = "John iii. 6, 31." },
  { t = "note", id = "367", text = "Rom. viii. 7." },
  { t = "note", id = "368", text = "Rom. vii. 18." },
  { t = "note", id = "369", text = "Gen. vi. 3. [This is an example of the vicious method of interpretation, not yet extirpated, which carries Paul’s distinctive use of the term “flesh” back to the Pentateuch, where no ethical sense is necessarily implied.—R.]" },
  { t = "note", id = "370", text = "Rom. vii. 9. [The Apostle speaks of “the Spirit of *Christ*.”—R.]" },
  { t = "note", id = "371", text = "1 Sam. xvi. 14." },
  { t = "h", text = "Chapter IX. Continuation of the Subject of Mortification; Dignity of Persons Consecrated to God." },
  { t = "p", text = "Chapter IX.—Continuation of the Subject of Mortification; Dignity of Persons Consecrated to God." },
  { t = "p", text = "He in whomsoever the Spirit of God is, is in accord with the will of the Spirit of God; and, because he is in accord with the Spirit of God, therefore does he mortify the deeds of the body and live unto God, “treading down and subjugating the body and keeping it under; so that, while preaching to others,” he may be a beautiful example and pattern to believers, and may spend his life in works which are worthy of the Holy Spirit, so that he may “not be cast away,”[^372] but may be approved before God and before men. For in “the man who is of God,”[^373] with him *I say* there is nothing of the mind of the flesh; and especially in virgins *of either sex*; but the fruits of all of them are “the fruits of the Spirit”[^374] and of life, and they are truly the city of God, and the houses and temples in which God abides and dwells, and among which He walks, as in the holy city of heaven. For in this “do ye appear to the world as lights, in that ye give heed to the Word of life,”[^375] and thus ye are in truth the praise, and the boast, and the crown of rejoicing, and the delight of good servants in our Lord Jesus Christ. For all who see you will “acknowledge that ye are the seed which the Lord hath blessed;”[^376] in very deed a seed honourable and holy, and “a priestly kingdom, a holy people, the people of the inheritance,”[^377] the heirs of the promises of God; *of* things which do not decay, nor wither; of “that which eye hath not seen, and ear hath not heard, and which hath not come up into the heart of man; of that which God hath prepared for those who love Him and keep His commandments.”[^378]" },
  { t = "note", id = "372", text = "1 Cor. ix. 27." },
  { t = "note", id = "373", text = "1 Tim. vi. 11." },
  { t = "note", id = "374", text = "Gal. v. 22." },
  { t = "note", id = "375", text = "Phil. ii. 15, 16." },
  { t = "note", id = "376", text = "Isa. lxi. 9." },
  { t = "note", id = "377", text = "1 Pet. ii. 9." },
  { t = "note", id = "378", text = "1 Cor. ii. 9." },
  { t = "h", text = "Chapter X. Denunciation of Dangerous and Scandalous Association with Maidens." },
  { t = "p", text = "Chapter X.—Denunciation of Dangerous and Scandalous Association with Maidens." },
  { t = "p", text = "Now, we are persuaded of you, my brethren, that your thoughts are occupied about those things which are requisite for your salvation.[^379] But we speak thus[^380] in consequence of the evil rumours and reports concerning shameless men, who, under pretext of the fear of God, have their dwelling with maidens, and *so,* expose themselves to danger, and walk with them along the road and in solitary places[^381] alone—a course which is full of dangers, and full of stumbling-blocks and snares and pitfalls; nor is it in any respect right for Christians and those who fear God so to conduct themselves. Others, too, eat and drink with them at entertainments *allowing themselves* in loose behaviour and much uncleanness—such as ought not to be among believers, and especially among those who have chosen for themselves *a life of* holiness.[^382] Others, again, meet together for vain and trifling conversation and merriment, and that they may speak evil of one another; and they hunt up tales against one another, and are idle: persons with whom we do not allow you even to eat bread. Then, others gad about among the houses of virgin brethren or sisters, on pretence of visiting them, or reading the Scriptures *to them*, or exorcising them. Forasmuch as they are idle and do no work, they pry into those things which ought not to be inquired into, and by means of plausible words make merchandise of the name of Christ. *These are* men from whom the divine apostle kept aloof, because of the multitude of their evil *deeds*; as it is written: “Thorns sprout in the hands of the idle;”[^383] and, “The ways of the idle are full of thorns.”[^384]" },
  { t = "note", id = "379", text = "Or “life.”" },
  { t = "note", id = "380", text = "The words which follow, “concerning those things which we speak,” appear not to be genuine.—Beelen." },
  { t = "note", id = "381", text = "Beelen supposes a ἓν διὰ δυοῖν: “along the lonely road.”" },
  { t = "note", id = "382", text = "i.e., virginity." },
  { t = "note", id = "383", text = "Prov. xxvi. 9." },
  { t = "note", id = "384", text = "Prov. xv. 19 (LXX.)." },
  { t = "h", text = "Chapter XI. Perniciousness of Idleness; Warning Against the Empty Longing to Be Teachers; Advice About Teaching and the Use of Divine Gifts." },
  { t = "p", text = "Chapter XI.—Perniciousness of Idleness; Warning Against the Empty Longing to Be Teachers; Advice About Teaching and the Use of Divine Gifts." },
  { t = "p", text = "Such are the ways of all those who do not work, but go hunting for tales, and think to themselves that this is profitable and right.[^385] For such persons are like those idle and prating widows “who go wandering about[^386] among houses”[^387] with their prating, and hunt for idle tales, and carry them from house to house with much exaggeration, without fear of God. And besides all this, barefaced men as they are,[^388] under pretence of teaching, they set forth a variety of doctrines. And would that they taught the doctrines of truth! But it is this which is *so* disquieting, that they understand not what they mean, and assert that which is not *true*: because they wish to be teachers, and to display themselves as skilful in speaking; because they traffic in iniquity in the name of Christ—which it is not right for the servants of God *to do*. And they hearken not to that which the Scripture has said: “Let not many be teachers among you, my brethren, and be not all of you prophets.”[^389] For “he who does not transgress in word is a perfect man, able to keep down and subjugate his whole body.”[^390] And, “If a man speak, let him speak in the words[^391] of God.”[^392] And, “If there is in thee understanding, give an answer to thy brother but if not, put thy hand on thy mouth.”[^393] For, “at one time *it is proper* to keep silence, and at another thee to speak.”[^394] And again it says “When a man speaks in season, it is honourable[^395] to him.”[^396] And again it says: “Let your speech be seasoned with grace. For it is required of a man to know how to give an answer to every one in season.”[^397] For “he that utters whatsoever comes to his mouth, that man produces strife; and he that utters a superfluity of words increases vexation; and he that is hasty with his lips falls into evil. For because of the unruliness of the tongue cometh anger; but the perfect man keeps watch over his tongue, and loves his soul’s life.”[^398] For these are they “who by good words and fair speeches lead astray the hearts of the simple, and, while offering them blessings, lead them astray.”[^399] Let us, therefore, fear the judgment which awaits teachers. For a severe judgment will those teachers receive “who teach, but do not,”[^400] and those who take *upon them* the name of Christ falsely, and say: We teach the truth, and *yet* go wandering about idly, and exalt themselves, and make their boast” in the mind of the flesh.”[^401] These, moreover, are like “the blind man who leads the blind man, and they both fall into the ditch.”[^402] And they will receive judgment, because in their talkativeness and their frivolous teaching they teach natural[^403] wisdom and the “frivolous error of the plausible words of the wisdom of men,”[^404] “according to the will of the prince of the dominion of the air, and of the spirit which works in those men who will not obey, according to the training of this world, and not according to the doctrine of Christ.”[^405] But if thou hast received “the word of knowledge, or the word of instruction, or of prophecy,”[^406] blessed be God, “who helps every man without grudging—that God who gives to every man and does not upbraid *him*.”[^407] With the gift, therefore, which thou hast received from our Lord, serve *thy* spiritual brethren, the prophets who know that the words which thou speakest are *those* of our Lord; and declare the gift which thou hast received in the Church for the edification of the brethren in Christ (for good and excellent are those things which help the men of God), if so be that they are truly with thee.[^408]" },
  { t = "note", id = "385", text = "*Lit*. “profit and righteousness.”" },
  { t = "note", id = "386", text = "*Lit*. “go about and wander.”" },
  { t = "note", id = "387", text = "1 Tim. v. 13." },
  { t = "note", id = "388", text = "*Lit*, “in their barefacedness.”" },
  { t = "note", id = "389", text = "1 Cor. xii. 29. [But compare Jas. iii. 1: “Be not many teachers” (R.V.), which precedes the next citation.—R.]" },
  { t = "note", id = "390", text = "Jas. iii. 2." },
  { t = "note", id = "391", text = "*Lit*. “speech.”" },
  { t = "note", id = "392", text = "1 Pet. iv. 11." },
  { t = "note", id = "393", text = "Ecclus. v. 14." },
  { t = "note", id = "394", text = "Eccl. iii. 7." },
  { t = "note", id = "395", text = "*Lit*. “beautiful.”" },
  { t = "note", id = "396", text = "Prov. xxv. 11." },
  { t = "note", id = "397", text = "*Lit*. “in his place.” Col. iv. 6." },
  { t = "note", id = "398", text = "*Lit*. “his soul for life.” Prov. xviii. 6; xiii. 3; xxi. 23." },
  { t = "note", id = "399", text = "Rom. xvi. 17–19." },
  { t = "note", id = "400", text = "Matt. xxiii. 3." },
  { t = "note", id = "401", text = "Col. ii. 18." },
  { t = "note", id = "402", text = "Matt. xv. 14." },
  { t = "note", id = "403", text = "As 1 Cor. xv. 44 (ψυχικός).—See Jas. iii. 15 [also 1 Cor. ii. 13, 14.—R.]." },
  { t = "note", id = "404", text = "See Col. ii. 8." },
  { t = "note", id = "405", text = "Eph. ii. 2; Col. ii. 8." },
  { t = "note", id = "406", text = "1 Cor. xii. 8–10." },
  { t = "note", id = "407", text = "Jas. i. 5." },
  { t = "note", id = "408", text = "An obscure clause, which Beelen supposes to be due to the misapprehension of the Syrian translator. Perhaps the difficulty will be met if we read “gifts,” as do Wets. and Zing., by a change in the pointing." },
  { t = "h", text = "Chapter XII. Rules for Visits, Exorcisms, and How People are to Assist the Sick, and to Walk in All Things Without Offence." },
  { t = "p", text = "Chapter XII.—Rules for Visits, Exorcisms, and How People are to Assist the Sick, and to Walk in All Things Without Offence." },
  { t = "p", text = "Moreover, also, this is comely and useful, that a man “visit orphans and widows,”[^409] and especially those poor persons who have many children. These things are, without controversy, required of the servants of God, and comely and suitable for them. This also, again, is suitable and right and comely for those who are brethren in Christ, that they should visit those who are harassed by evil spirits, and pray and pronounce adjurations[^410] over them, intelligently, *offering* such prayer as is acceptable before God; not with a multitude of fine words,[^411] well prepared and arranged, so that they may appear to men eloquent and of a good memory. *Such men* are “like a sounding pipe, or a tinkling cymbal;”[^412] and they bring no help to those over whom they make their adjurations; but they speak with terrible words, and affright people, but do not act with true faith, according to the teaching of our Lord, who hath said: “This kind goeth not out but by fasting and prayer,”[^413] offered unceasingly and with earnest mind. And let them holily ask and beg of God, with cheerfulness and all circumspection and purity, without hatred and without malice. In this way let us approach a brother or a sister who is sick, and visit them in a way that is right, without guile, and without covetousness, and without noise, and without talkativeness, and without such behaviour as is alien from the fear of God, and without haughtiness, but with the meek and lowly spirit of Christ. Let them, therefore, with fasting and with prayer make their adjurations, and not with the elegant and well-arranged and fitly-ordered words of learning, but as men who have received the gift of healing from God, confidently, to the glory of God. By[^414] your fastings and prayers and perpetual watching, together with your other good works, mortify the works of the flesh by the power of the Holy Spirit. He who acts thus “is a temple of the Holy Spirit of God.”[^415] Let this man cast out demons, and God will help him. For it is good that a man help those that are sick. Our Lord hath said: “Cast out demons,” at the same time *commanding* many other acts of healing; and, “Freely ye have received, freely give.”[^416] For such persons as these a goodly recompense is *laid up* by God, because they serve their brethren with the gifts which have been given them by the Lord. This is also comely and helpful to the servants of God, because they act according to the injunctions of our Lord, who hath said: “I was sick, and ye visited Me, and so on.”[^417] And this is comely and right and just, that we visit our neighbours for the sake of God with all seemliness of manner and purity of behaviour; as the Apostle hath said: “Who is sick, and I am not sick? who is offended, and I am not offended?”[^418] But all these things are spoken in reference to the love with which a man should love his neighbour. And in these things let us occupy ourselves,[^419] without giving offence, and let us not do anything with partiality or for the shaming of others, but let us love the poor as the servants of God, and especially let us visit them. For this is comely before God and before men, that we should remember the poor, and be lovers of the brethren and of strangers, for the sake of God and for the sake of those who believe in God, as we have learnt from the law and from the prophets, and from our Lord Jesus Christ, concerning the love of the brotherhood and the love of strangers: for ye know the words which have been spoken concerning the love of the brotherhood and the love of strangers;[^420] powerfully are the words spoken to all those who do them." },
  { t = "note", id = "409", text = "Jas. i. 27." },
  { t = "note", id = "410", text = "Or “exorcisms.”" },
  { t = "note", id = "411", text = "*Lit*. “elegant and numerous words.”" },
  { t = "note", id = "412", text = "1 Cor. xiii. 1." },
  { t = "note", id = "413", text = "Matt. xvii. 21. [Or Mark ix. 29; the verse in Matthew is of doubtful genuineness.—R.]" },
  { t = "note", id = "414", text = "Or “in.”" },
  { t = "note", id = "415", text = "1 Cor. vi. 19." },
  { t = "note", id = "416", text = "Matt. x. 8." },
  { t = "note", id = "417", text = "*Lit*. “and things similar to these,” Matt. xxv. 36." },
  { t = "note", id = "418", text = "2 Cor. xi. 29." },
  { t = "note", id = "419", text = "*Lit*. “let us be.”" },
  { t = "note", id = "420", text = "Beelen here omits, as spurious, the words, “because this same thing is pleasant and agreeable to you: because ye are all taught of God.”" },
  { t = "h", text = "Chapter XIII. What Priests Should Be and Should Not Be." },
  { t = "p", text = "Chapter XIII.—What Priests Should Be and Should Not Be." },
  { t = "p", text = "Beloved brethren! that a man should build up and establish the brethren on the faith in one God, this also is manifest and well-known. This too, again, is comely, that a man should not be envious of his neighbour. And moreover, again, it is suitable and comely that all those who work the works of the Lord should work the works of the Lord in the fear of God. Thus is it required of them to conduct themselves. That “the harvest is great, but the workmen are few,” this also is well-known and manifest. Let us, therefore, “ask of the Lord of the harvest” that He would send forth workmen into the harvest;[^421] such workmen as “shall skilfully dispense the word of truth;” workmen “who shall not be ashamed;”[^422] faithful workmen; workmen who shall be “the light of the world;”[^423] workmen who “work not for the food that perisheth, but for that food which abideth unto life eternal;”[^424] workmen who shall be such as the apostles; workmen who imitate the Father, and the Son, and the Holy Spirit; who are concerned for the salvation of men; not “hireling”[^425] workmen; not workmen to whom the fear of God and righteousness appear to be gain; not workmen who “serve their belly;” not workmen who “with fair speeches and pleasant words mislead the hearts of the innocent;”[^426] not workmen who imitate the children of light, while they are not light but darkness—“men whose end is destruction;”[^427] not workmen who practise iniquity and wickedness and fraud; not “crafty workmen;”[^428] not workmen “drunken” and “faithless;”[^429] nor workmen who traffic in Christ;[^430] not misleaders; not “lovers of money; not malevolent.”[^431]" },
  { t = "note", id = "421", text = "Matt. ix. 37, 38." },
  { t = "note", id = "422", text = "*Lit*. “without shame,” 2 Tim. ii. 15." },
  { t = "note", id = "423", text = "Matt. v. 14." },
  { t = "note", id = "424", text = "John vi. 27." },
  { t = "note", id = "425", text = "John x. 12, 13." },
  { t = "note", id = "426", text = "Rom. xvi. 18." },
  { t = "note", id = "427", text = "Phil. iii. 9." },
  { t = "note", id = "428", text = "2 Cor. xi. 13." },
  { t = "note", id = "429", text = "See Matt. xxiv. 45–51." },
  { t = "note", id = "430", text = "[Comp. the term χριστέμπορος “Christ-monger,” “Christ-trafficker,” in *Teaching*, chap. xii. 5, vol. vii. p. 381.—R.]" },
  { t = "note", id = "431", text = "1 Tim. iii. 3; Tit. i. 7." },
  { t = "p", text = "Let us, therefore, contemplate and imitate the faithful who have conducted themselves well in the Lord, as is becoming and suitable to our calling and profession. Thus let us do service before God in justice and righteousness, and without blemish, “occupying ourselves with things good and comely before God *and* also before men.”[^432] For this is comely, that God be glorified in us in all things." },
  { t = "note", id = "432", text = "Rom. xii. 17." },
  { t = "p", text = "*Here* endeth the first Epistle of Clement." },
]

[[section]]
id = "the-second-epistle-of-the-same-clement"
title = "The Second Epistle of the Same Clement."
level = 1
blocks = [
  { t = "p", text = "Chapter I.—He Describes the Circumspectness of His Intercourse with the Other Sex, and Tells How in His Journeys He Acts at Places Where There are Brethren Only." },
  { t = "p", text = "I would, moreover, have you know, my brethren, of what sort is our conduct in Christ, as well as that of all our brethren, in the *various* places in which we are. And if so be that you approve it, do ye also conduct yourselves in like manner in the Lord. Now we, if God help us, conduct ourselves thus: with maidens we do not dwell, nor have we anything in common with them; with maidens we do not eat, nor drink; and, where a maiden sleeps, we do not sleep; neither do women wash our feet, nor anoint us; and on no account do we sleep where a maiden sleeps who is unmarried or has taken the vow:[^433] even though she be in some other place *if she be* alone, we do not pass the night there.[^434] Moreover, if it chance that the time *for rest* overtake us in a place, whether in the country, or in a village, or in a town, or in a hamlet,[^435] or wheresoever we happen to be, and there are found brethren in that place, we turn in to one who is a brother, and call together there all the brethren, and speak to them words of encouragement and exhortation.[^436] And those among us who are gifted in speaking will speak such words as are earnest, and serious, and chaste, in the fear of God, and *exhort them* to please God in everything, and abound and go forward in good works, and “be free from[^437] anxious care in everything,”[^438] as is fit and right for the people of God." },
  { t = "note", id = "433", text = "*Lit*. “or *is* a daughter of the covenant.”" },
  { t = "note", id = "434", text = "Beelen’s rendering, “we do not even pass the night,” seems not to be favoured either by the arrangement or the context." },
  { t = "note", id = "435", text = "*Lit* “dwelling-place.”" },
  { t = "note", id = "436", text = "Or “consolation.” So παράκλησις in the N.T. has both senses." },
  { t = "note", id = "437", text = "*Lit*. “without.”" },
  { t = "note", id = "438", text = "Phil. iv. 6." },
  { t = "h", text = "Chapter II. His Behaviour in Places Where There Were Christians of Both Sexes." },
  { t = "p", text = "Chapter II.—His Behaviour in Places Where There Were Christians of Both Sexes." },
  { t = "p", text = "And if, moreover, it chance that we are distant from our homes and from our neighbours, and the day decline and the eventide overtake us, and the brethren press us, through love of the brotherhood and by reason of their affection for strangers, to stay with them, so that we may watch with them, and they may hear the holy word of God and do *it*, and be fed with the words of the Lord, so that they may be mindful of them, and they set before us bread and water and that which God provides, and we be willing and consent to stay through the night with them; if there be there a holy man,[^439] with him we turn in and lodge, and that same brother will provide and prepare whatever is necessary for us; and he himself waits upon us, and he himself washes our feet for us and anoints us with ointment, and he himself gets ready a bed for us, that we may sleep in reliance on God. All these things will that consecrated brother, who is in the place in which we tarry, do in his own person. He will himself serve the brethren, and each one of the brethren who are in the same place will join with him in rendering all those services[^440] which are requisite for the brethren. But with us may no female, whether young maiden or married woman, be there at that time;[^441] nor she that is aged,[^442] nor she that has taken the vow; not even a maid-servant, whether Christian or heathen; but there shall only be men with men. And, if we see it to be requisite to stand and pray for the sake of the women, and to speak words of exhortation and edification, we call *together* the brethren and all the holy sisters and maidens, *and* likewise all the other women who are there, *inviting them* with all modesty and becoming behaviour to come and feast on the truth.[^443] And those among us who are skilled in speaking speak to them, and exhort them in those words which God has given us. And then we pray, and salute[^444] one another, the men the men. But the women and the maidens will wrap their hands in their garments; *and* we also, with circumspection and with all purity, our eyes looking upwards, shall wrap our right hand in our garments; and then they will come and give us the salutation on our right hand wrapped in our garments. Then we go where God permits us." },
  { t = "note", id = "439", text = "i.e., one who has taken the vow of celibacy." },
  { t = "note", id = "440", text = "*Lit*. “will with him minister all those things.”" },
  { t = "note", id = "441", text = "[The minuteness of all these precepts is of itself suspicious. The “simplicity” of the earlier age had evidently passed when these prohibitions were penned.—R.]" },
  { t = "note", id = "442", text = "***, Beelen’s conjecture for ***, “rich.” Zingerle proposes ***, “about *to be married*.”" },
  { t = "note", id = "443", text = "*Lit*. “come to the delight of the truth.”" },
  { t = "note", id = "444", text = "*Lit*. “ask of the peace of.”" },
  { t = "h", text = "Chapter III. Rules for the Conduct of Celibate Brethren in Places Where There are Only Married Christians." },
  { t = "p", text = "Chapter III.—Rules for the Conduct of Celibate Brethren in Places Where There are Only Married Christians." },
  { t = "p", text = "And if again we chance to come into a place where there is no consecrated brother, but all are married, all those who are there will receive the brother who comes to them, and minister to him, and care for his wants[^445] in everything, assiduously, with good-will. And the brother shall be ministered to by them in the way that is suitable. And the brother will say to the married persons who are in that place: We holy men do not eat or drink with women, nor are we waited on by women or by maidens, nor do women wash our feet for us, nor do women anoint us, nor do women prepare our bed for us, nor do we sleep where women sleep, so that we may be without reproach in everything, lest any one should be offended or stumble at us. And, whilst we observe all these things, “we are without offence to every man.”[^446] As persons, therefore, “who know the fear of the Lord, we persuade men, and to God we are made manifest.”[^447]" },
  { t = "note", id = "445", text = "*Lit*. “for that which in his;” or “for what *belongs* to him.”" },
  { t = "note", id = "446", text = "2 Cor. vi. 3." },
  { t = "note", id = "447", text = "2 Cor. v. 11." },
  { t = "h", text = "Chapter IV. Conduct of the Holy Man Where There are Women Only." },
  { t = "p", text = "Chapter IV.—Conduct of the Holy Man Where There are Women Only." },
  { t = "p", text = "But if we chance to come into a place where there are no *Christian* men, but all the believers are women and maidens,[^448] and they press us to pass the night there in that place, we call them all together to some suitable place,[^449] and ask them how they do; and according to that which we learn from them, and what we see to be their state of mind, we address them in a suitable manner, as men fearing God. And when they have all assembled and come *together*, and we see that they are in peace,[^450] we address to them words of exhortation in the fear of God, and read the Scripture to them, with purity and in the concise[^451] and weighty words of the fear of God. We do everything as for their edification. And as to those who are married, we speak to them in the Lord in a manner suited to them. And if, moreover, the day decline and the eventide draw on, we select, in order to pass the night there, a woman who is aged and the most exemplary[^452] of them all; and we speak to her to give us a place all to ourselves, where no woman enters, nor maiden. And this old woman herself will bring us a lamp, and whatever is requisite for us she will herself bring us. From love to the brethren, she will bring whatever is requisite for the service of stranger brethren. And she herself, when the time for sleep is come, will depart and go to her house in peace." },
  { t = "note", id = "448", text = "*Lit*. “all of them are believing women and maidens.”" },
  { t = "note", id = "449", text = "*Lit*. “some place on the right side.” The Syrian translator has probably mistaken the meaning of εἰς ἕνα τόπον δεξιόν, where δεξιόν may be compared with *dexter* in Hor., *Sat*., ii. 1, 18.—Beelen." },
  { t = "note", id = "450", text = "Probably meaning, “when we have inquired of their welfare.”" },
  { t = "note", id = "451", text = "*Lit*. “compressed.”" },
  { t = "note", id = "452", text = "*Lit*. “chaste,” or “modest.”" },
  { t = "h", text = "Chapter V. Where There is Only One Woman, the Father Does Not Make a Stay; How Carefully Stumbling-Blocks Must Be Avoided." },
  { t = "p", text = "Chapter V.—Where There is Only One Woman, the Father Does Not Make a Stay; How Carefully Stumbling-Blocks Must Be Avoided." },
  { t = "p", text = "But if, moreover, we chance upon a place, and find there one believing woman only, and no other person be there but she only, we do not stop there, nor pray there, nor read the Scriptures there, but we flee as from before the face of a serpent, and as from before the face of sin. Not that we disdain the believing woman—far be it from us to be so minded towards our brethren in Christ!—but, because she is alone, we are afraid lest any one should make insinuations against us in words of falsehood. For the hearts of men are firmly set[^453] on evil. And, that we may not give a pretext to those who desire to get a pretext against us and to speak evil of us, and that we may not be a stumbling-block to any one, on this account we cut off the pretext of those who desire to get a pretext against us; on this account we must be “on our guard that we be to no one a stumbling-block, neither to the Jews, nor to the Gentiles, nor yet to the Church of God; and we must not seek that which is profitable to ourselves only, but that which is for the profit of many, so that they may be saved.”[^454] For this does not profit us, that another stumble because of us. Let us, therefore, be studiously on our guard at all times, that we do not smite our brethren and give them to drink of a disquieting conscience through our being to them a stumbling-block. For “if for the sake of meat our brother be made sad, or shocked, or made weak, or caused to stumble, we are not walking in the love of God. For the sake of meat thou causest him to perish for whose sake Christ died.”[^455] For, *in* “thus sinning against your brethren and wounding their sickly consciences, ye sin against Christ Himself. For, if for the sake of meat my brother is made to stumble,” let us *who are* believers say, “Never will we eat flesh, that we may not make our brother to stumble.”[^456] These things, moreover, does ever one who truly loves God, who truly takes up his cross, and puts on Christ, and loves his neighbour; the man who watches over himself that he be not a stumbling-block to any one, that no one be caused to stumble because of him and die because he is constantly with maidens and lives in the same house with them—a thing which is not right—to the overthrow of those who see and hear. Evil conduct like this is fraught with stumbling and peril, and *is* akin[^457] to death. But blessed is that man who is circumspect and fearful in everything for the sake of purity!" },
  { t = "note", id = "453", text = "Or “are set and fixed.”" },
  { t = "note", id = "454", text = "1 Cor. x. 32, 33." },
  { t = "note", id = "455", text = "Rom. xiv. 15. [The Apostle’s noble and consistent counsel to the “strong” brethren at Rome is in sharp contrast with the use here made of it. Only one of the “weak” brethren could have written this epistle.—R.]" },
  { t = "note", id = "456", text = "1 Cor. viii. 12, 13." },
  { t = "note", id = "457", text = "*Lit*. “near.”" },
  { t = "h", text = "Chapter VI. How Christians Should Behave Themselves Among Heathens." },
  { t = "p", text = "Chapter VI.—How Christians Should Behave Themselves Among Heathens." },
  { t = "p", text = "If, moreover, it chance that we go to a place in which there are no Christians, and it be important for us to stay there a few days, let us be “wise as serpents, and harmless as doves;”[^458] and let us “not be as the foolish, but as the wise,”[^459] in all the *self*-restraint of the fear of God, that God may be glorified in everything through our Lord Jesus Christ, through our chaste and holy behaviour. For, “whether we eat, or drink, or do anything else, let us do it as for the glory of God.”[^460] Let “all those who see us acknowledge that we are a blessed seed,”[^461] “sons of the living God,”[^462] in everything—in all *our* words in shamefastness, in purity, in humility, forasmuch as we do not copy the heathen in anything, nor are *as* believers like *other* men, but in everything are estranged from the wicked. And we “do not cast that which is holy before dogs, nor pearls before swine;”[^463] but with all possible *self*-restraint, and with all discretion, and with all fear of God, and with earnestness of mind we praise God. For we do not minister where heathens are drinking and blaspheming in their feasts with words of impurity, because of their wickedness.[^464] Therefore do we not sing *psalms* to the heathens, nor do we read to them the Scriptures, that we may not be like *common* singers, either those who play on the lyre,[^465] or those who sing with the voice, or *like* soothsayers, as many are, who follow these practices and do these things, that they may sate themselves with a paltry mouthful of bread, and who, for the sake of a sorry cup of wine, go *about* “singing the songs of the Lord in the strange land”[^466] of the heathen, and doing what is not right. Do not so, my brethren; we beseech you, my brethren, let not these deeds be done among you; but put away those who choose thus to behave themselves with infamy and disgrace. It is not proper, my brethren, that these things should be so. But we beseech you, brethren in righteousness, that these things be so *done* with you as with us, as for a pattern of believers, and of those who shall believe. Let us be of the flock of Christ, in all righteousness, and in all holy and unblemished conduct, behaving ourselves with uprightness and sanctity, as is right for believers, and observing those things which are praiseworthy, and pure, and holy, and honourable, and noble; and do ye promote[^467] all those things which are profitable. For ye are “our joy, and our crown,” and our hope, and our life, “if so be that ye stand in the Lord.”[^468] So be it![^469]" },
  { t = "note", id = "458", text = "Matt. x. 16." },
  { t = "note", id = "459", text = "Eph. v. 15." },
  { t = "note", id = "460", text = "1 Cor. x. 31." },
  { t = "note", id = "461", text = "Isa. lxi. 9." },
  { t = "note", id = "462", text = "Phil. ii. 15." },
  { t = "note", id = "463", text = "Matt. vii. 6." },
  { t = "note", id = "464", text = "Beelen joins “because of their wickedness” with the words that follow." },
  { t = "note", id = "465", text = "Or “cithara.”" },
  { t = "note", id = "466", text = "Ps. cxxxvii. 4." },
  { t = "note", id = "467", text = "Or “set on foot.”" },
  { t = "note", id = "468", text = "Phil. iv. 1." },
  { t = "note", id = "469", text = "Or “Amen.”" },
  { t = "h", text = "Chapter VII. Uses of Considering Admonitory Examples, as Well as Instructive Patterns." },
  { t = "p", text = "Chapter VII.—Uses of Considering Admonitory Examples, as Well as Instructive Patterns." },
  { t = "p", text = "Let us consider, therefore, my brethren, and see how all the righteous fathers conducted themselves during the whole time of their sojourn in *this* life, and let us search and examine from the law *down* to the New Testament. For this is both becoming and profitable, that we should know how many men there have been, and who *they were*, that have perished through women; and who and how many have been the women that have perished through men, by reason of the constancy with which they have associated with one another. And further, also, for the same reason, I will show how many have been the men, and who *they were*, that lived all their lifetime, and continued even to the close, with one another in *the performance of* chaste works without blemish. And it is manifest and well-known that this is so.[^470]" },
  { t = "note", id = "470", text = "Wetstein and Zingerle join on this sentence to the next, by a change of the construction." },
  { t = "h", text = "Chapter VIII. Joseph and Potiphar's Wife; Of What Kind Love to Females Ought to Be." },
  { t = "p", text = "Chapter VIII.—Joseph and Potiphar’s Wife; Of What Kind Love to Females Ought to Be." },
  { t = "p", text = "*There is* Joseph, faithful, and intelligent, and wise, and who feared God in everything. Did not a woman conceive an excessive passion for the beauty of this chaste and upright man? And, when he would not yield and consent to gratify her passionate desire,[^471] she cast the righteous man into every kind of distress and torment, to within a little of death,[^472] by *bearing* false witness. But God delivered him from all the evils that came upon him through *this* wretched woman. Ye see, my brethren, what distresses the constant sight of the person of the Egyptian woman brought upon the righteous man. Therefore, let us not be constantly with women, nor with maidens. For this is not profitable for those who truly wish to “gird up their loins.”[^473] For it is required that we love the sisters in all purity and chasteness, and with all curbing of thought, in the fear of God, not associating constantly with them, nor finding access to them at every hour." },
  { t = "note", id = "471", text = "*Lit.* “her passion and her desire.”" },
  { t = "note", id = "472", text = "*Lit*. “even to death.”" },
  { t = "note", id = "473", text = "Luke xii. 35." },
  { t = "h", text = "Chapter IX. Samson's Admonitory Fall." },
  { t = "p", text = "Chapter IX.—Samson’s Admonitory Fall." },
  { t = "p", text = "Hast thou not heard concerning Samson the Nazarite, “with whom was the Spirit of God,”[^474] the man of great strength? This man, who was a Nazarite, and consecrated to God, and who was *gifted* with strength and might, a woman brought to ruin with *her* wretched body, and with *her* vile passion. Art thou, perchance, such a man as he? Know thyself, and know the measure of thy strength.[^475] “The married woman catcheth precious souls.”[^476] Therefore, we do not allow any man whatsoever to sit with a married woman; much less to live in the same house with a maiden who has taken the vow, or to sleep where she sleeps, or to be constantly with her. For this is to be hated and abominated by those who fear God." },
  { t = "note", id = "474", text = "Judges xiii. 25." },
  { t = "note", id = "475", text = "*Lit*. “know thy measure.”" },
  { t = "note", id = "476", text = "Prov. vi. 26." },
  { t = "h", text = "Chapter X. David's Sin, So Admonitory to Us Weak Men." },
  { t = "p", text = "Chapter X.—David’s Sin, So Admonitory to Us Weak Men." },
  { t = "p", text = "Does not the case of David instruct thee, whom God “found a man after His heart,”[^477] one faithful, faultless, pious, true? This same man saw the beauty of a woman—I mean of Bathsheba—when he saw her as she was cleansing herself and washing unclothed. This woman the holy man saw, and was thoroughly[^478] captivated with desire by the sight of her.[^479] See, then, what evils he committed because of a woman, and *how* this righteous man sinned, and gave command that the husband of this woman should be killed in battle. Ye have seen what wicked schemes he laid and executed, and *how*, because of his passion for a woman, he perpetrated a murder—*he*, David, who was called “the anointed of the Lord.”[^480] Be admonished, O man: for, if such men as these have been brought to ruin through women, what is *thy* righteousness, or what art thou among the holy, that thou consortest with women and with maidens day and night, with much silliness, without fear of God? Not *thus*, my brethren, not thus let us conduct ourselves; but let us be mindful of that word which is spoken concerning a woman: “Her hands lay snares, and her heart spreadeth nets; but the just shall escape from her, whilst the wicked falleth into her hands.”[^481] Therefore let us, who are consecrated,[^482] be careful not to live in the same house with females who have taken the vow. For such conduct as this is not becoming nor right for the servants of God." },
  { t = "note", id = "477", text = "1 Sam. xvi. 13; Ps. lxxxix. 20, seqq.; Acts xiii. 22." },
  { t = "note", id = "478", text = "*Lit*. “verily.”" },
  { t = "note", id = "479", text = "“By the pleasure *derived* from the sight of her.”—Beelen." },
  { t = "note", id = "480", text = "Ps. xviii. 50; 2 Sam. xix. 21." },
  { t = "note", id = "481", text = "Eccl. vii. 26." },
  { t = "note", id = "482", text = "*Lit*. “holy.”" },
  { t = "h", text = "Chapter XI. Admonitory History of the Incestuous Children of David." },
  { t = "p", text = "Chapter XI.—Admonitory History of the Incestuous Children of David." },
  { t = "p", text = "Hast thou not read concerning Amnon and Tamar, the children of David? This Amnon conceived a passion for his sister, and humbled her, and did not spare her, because he longed for her with a shameful passion; and he proved wicked and profligate because of his constant intercourse with her, without the fear of God, and he “wrought uncleanness in Israel.”[^483] Therefore, it is not proper for us, nor right for us, to associate with sisters, *indulging* in laughter and looseness; but *we ought to behave towards them* with all chasteness and purity, and in the fear of the Lord." },
  { t = "note", id = "483", text = "Gen. xxxiv. 7." },
  { t = "h", text = "Chapter XII. Solomon's Infatuation Through Women." },
  { t = "p", text = "Chapter XII.—Solomon’s Infatuation Through Women." },
  { t = "p", text = "Hast thou not read the history of Solomon, the son of David, the man to whom God gave wisdom, and knowledge, and largeness of mind,[^484] and riches, and much glory, beyond all men? Yet this same man, through women, came to ruin,[^485] and departed from the Lord." },
  { t = "note", id = "484", text = "*Lit*. “heart.”" },
  { t = "note", id = "485", text = "Or “perished.”" },
  { t = "h", text = "Chapter XIII. The History of Susanna Teaches Circumspection with the Eyes and in Society." },
  { t = "p", text = "Chapter XIII.—The History of Susanna Teaches Circumspection with the Eyes and in Society." },
  { t = "p", text = "Hast thou not read, and dost thou not know, concerning those elders who were in the days of Susanna, who, because they were constantly with women, and looking upon the beauty which was another’s,[^486] fell into the depths of wantonness, and were not able to keep themselves in a chaste mind,[^487] but were overcome by a depraved disposition, and came suddenly[^488] upon the blessed Susanna to corrupt her. But she did not consent to their foul passion, but cried unto God, and God saved her out of the hands of the bad old men. Does it not, therefore, behove us to tremble and be afraid, forasmuch as these old men, judges and elders of the people of God, fell from their dignity because of a woman? For they did not keep in mind that which is said: “Look thou not on the beauty which is another’s;” and, “The beauty of woman has destroyed many;”[^489] and “With a married woman do not sit;”[^490] and that, again, *in* which it says: “Is there any one that puts fire in his bosom, and does not burn his clothes;”[^491] or, “Does a man walk on fire, and his feet are not scorched? So whosoever goeth in to another man’s wife is not pure from evil, and whosoever comes near to her shall not escape.”[^492] And again it says: “Thou shalt not long after the beauty a woman, lest she take thee captive with her eyelids;”[^493] and, “Thou shalt not look upon a maiden, lest thou perish through desire of her;”[^494] and, “With a woman that sings beautifully thou shalt not constantly be;”[^495] and, “Let him that thinketh he standeth take heed lest he fall.”[^496]" },
  { t = "note", id = "486", text = "Susanna having a husband, Joachim." },
  { t = "note", id = "487", text = "*Lit*. “a mind of chasteness.”" },
  { t = "note", id = "488", text = "*Lit*. “rose.”" },
  { t = "note", id = "489", text = "Ecclus. ix. 8, 9." },
  { t = "note", id = "490", text = "Ecclus. ix. 12." },
  { t = "note", id = "491", text = "Prov. vi. 27." },
  { t = "note", id = "492", text = "Prov. vi. 28, 29." },
  { t = "note", id = "493", text = "Prov. vi. 25." },
  { t = "note", id = "494", text = "Ecclus. ix. 5." },
  { t = "note", id = "495", text = "Ecclus. ix. 4." },
  { t = "note", id = "496", text = "1 Cor. x. 12." },
  { t = "h", text = "Chapter XIV. Examples of Circumspect Behaviour from the Old Testament." },
  { t = "p", text = "Chapter XIV.—Examples of Circumspect Behaviour from the Old Testament." },
  { t = "p", text = "But see what it says also concerning *those* holy men, the prophets, and concerning the apostles of our Lord. Let us see whether any one of *these* holy men was constantly with maidens, or with young married women, or with such widows as the divine apostle declines to receive. Let us consider, in the fear of God, the manner of life of *these* holy men. Lo! we find it written concerning Moses and Aaron, that they acted and lived in the company of[^497] men, who *themselves also* followed a course of conduct like theirs. And thus *did* Joshua also, the son of Nun. Woman was there none with them; but they by themselves used holily to minister before God, men with men. And not only so; but they taught the people, that, whensoever the host moved, every tribe should move on apart, and the women with the women apart, and that they should go into the rear behind the host, and the men also apart by their tribes. And, according to the command of the Lord, so did they set out, like a wise people, that there might be no disorder on account of the women when the host moved. With beautiful and well-ordered arrangements did they march without stumbling. For lo! the Scriptures bear testimony to my words: “When the children of Israel had crossed over the Sea of Suth, Moses and the children of Israel sang the praises of the Lord, and said: We will praise the Lord, because He is exceedingly to be praised.”[^498] And, after that Moses had finished[^499] singing praises, then Miriam, the sister of Moses and Aaron, took a timbrel in her hands, and all the women went out after her, and sang praises with her, women with women apart, and men with men apart. Then again, we find that Elisha and Gehazi and the sons of the prophets lived together in the fear of God, and that they had no females living with them. Micah *too*, and all the prophets likewise, we find to have lived in this manner in the fear of the Lord." },
  { t = "note", id = "497", text = "*Lit*. “their conduct and living was with.”" },
  { t = "note", id = "498", text = "Exod. xv. 1." },
  { t = "note", id = "499", text = "*Lit*. “ceased from.”" },
  { t = "h", text = "Chapter XV. The Example of Jesus; How We May Allow Ourselves to Be Served by Women." },
  { t = "p", text = "Chapter XV.—The Example of Jesus; How We May Allow Ourselves to Be Served by Women." },
  { t = "p", text = "And, not to extend our discourse to *too* great length, what shall we say concerning our Lord Jesus Christ? Our Lord Himself was constantly with His twelve disciples when He had come *forth* to the world. And not only so; but also, when He was sending them out, He sent them out two and two together, men with men; but women were not sent with them, and neither in the highway nor in the house did they associate with women or with maidens: and thus they pleased God in everything. Also, when our Lord Jesus Christ Himself was talking with the woman of Samaria by the well alone, “His disciples came” and found Him talking with her, “and wondered that Jesus was standing and talking with a woman.”[^500] Is He not a rule, such as may not be set aside, an example, and a pattern to all the tribes of men? And not only so; but also, when our Lord was risen from the place of the dead, and Mary came to the place of sepulture, she ran and fell at the feet of our Lord and worshipped Him, and would have taken hold of Him. But He said to her: “Touch Me not; for I am not yet ascended to My Father.”[^501] Is it not, then, matter for astonishment, that, while our Lord did not allow Mary, the blessed woman, to touch His feet, yet *thou* livest with them, and art waited on by women and maidens, and sleepest where they sleep, and women wash thy feet for thee, and anoint thee! Alas for this culpable state of mind! Alas for this state of mind which is destitute of fear! Alas for this affrontery and folly, which is without fear of God! Dost thou not judge thine own self? Dost thou not examine thine own self? Dost thou not know thine own self and the measure of thy strength? These things, moreover, are trustworthy, and these things are true and right; and these are rules immutable for those who behave themselves uprightly in our Lord. Many holy women, again, ministered to holy men of their substance, as the Shunammite woman ministered to Elisha; but she did not live with him, but the prophet lived in a house apart. And, when her son died, she wanted to throw herself at the feet of the prophet; but his attendant would not allow her, but restrained her. But Elisha said to his servant: “Let her alone, because her soul is distressed.”[^502] From these things, then, we ought to understand their manner of life. To Jesus Christ our Lord women ministered of their substance: but they did not live with him; but chastely, and holily, and unblameably they behaved before the Lord, and finished their course, and received the crown in[^503] our Lord God Almighty." },
  { t = "note", id = "500", text = "John iv. 27." },
  { t = "note", id = "501", text = "John xx. 17." },
  { t = "note", id = "502", text = "2 Kings iv. 27." },
  { t = "note", id = "503", text = "Beelen suggests the reading “from,” or to render the present text “by.”" },
  { t = "h", text = "Chapter XVI. Exhortation to Union and to Obedience; Conclusion." },
  { t = "p", text = "Chapter XVI.—Exhortation to Union and to Obedience; Conclusion." },
  { t = "p", text = "Therefore, we beseech you, our brethren in our Lord, that these things be observed with you, as with us, and that we may be of the same mind, that we may be one in you and ye may be one in us, and that in everything we may be *of* one soul and one heart in our Lord. Whosoever knoweth the Lord heareth us; and every one who is not of God heareth not us. He who desires truly to keep sanctity heareth us; and the virgin who truly desires to keep virginity heareth us; but she who does not truly desire to keep virginity doth not hear us. Finally, farewell in our Lord, and rejoice in the Lord, all ye saints. Peace and joy be with you from God the Father through Jesus Christ our Lord. So be it." },
  { t = "p", text = "*Here* endeth the Second Epistle of Clement, the disciple of Peter. His prayer be with us! So be it." },
]

[[section]]
id = "fragments-of-the-books-on-arithmetic"
title = "Fragments of the Books on Arithmetic."
level = 1
blocks = [
  { t = "p", text = "[^1194] What is mathematics?" },
  { t = "note", id = "1194", text = "Fabricius, *Biblioth. Græca*, ed. Harles, vol. iii. p. 462. Hamburg, 1793." },
  { t = "p", text = "Aristotle thinks that all philosophy consisted of theory and practice,[^1195] and divides the practical into ethical and political, and the theoretic again into the theological, the physical, and the mathematical. And thus very clearly and skilfully he shows that mathematics is (a branch of) philosophy." },
  { t = "note", id = "1195", text = "θεωρίας καὶ πράξεως." },
  { t = "p", text = "The Chaldæans were the originators of astronomy, and the Egyptians of geometry and arithmetic.…" },
  { t = "p", text = "And whence did mathematics derive its name?" },
  { t = "p", text = "Those of the Peripatetic school affirmed that in rhetoric and poetry, and in the popular music, any one may be an adept though he has gone through no process of study; but that in those pursuits properly called studies,[^1196] none can have any real knowledge unless he has first become a student of them. Hence they supposed that the theory of these things was called *Mathematics*, from μάθημα, study, science. And the followers of Pythagoras are said to have given this more distinctive name of mathematics to geometry, and arithmetic alone. For of old these had each its own separate name; and they had up till then no name common to both. And he (Archytas) gave them this name, because he found science[^1197] in them, and that in a manner suitable to man’s study.[^1198] For they (the Pythagoreans) perceived that these studies dealt with things eternal and immutable and perfect,[^1199] in which things alone they considered that science consisted. But the more recent philosophers have given a more extensive application to this name, so that, in their opinion, the mathematician deals not only with substances[^1200] incorporeal, and falling simply within the province of the understanding,[^1201] but also with that which touches upon corporeal and sensible matter. For he ought to be cognisant of[^1202] the course of the stars, and their velocity, and their magnitudes, and forms, and distances. And, besides, he ought to investigate their dispositions to vision, examining into the causes, why they are not seen as of the same form and of the same size from every distance, retaining, indeed, as we know them to do, their dispositions relative to each other,[^1203] but producing, at the same time, deceptive appearances, both in respect of order and position. And these are so, either as determined by the state of the heavens and the air, or as seen in reflecting and all polished surfaces and in transparent bodies, and in all similar kinds. In addition to this, they thought that the man ought to be versed in mechanics and geometry and dialectics. And still further, that he should engage himself with the causes of the harmonious combination of sounds, and with the composition of music; which things are bodies,[^1204] or at least are to be ultimately referred to sensible matter." },
  { t = "note", id = "1196", text = "μαθήματα." },
  { t = "note", id = "1197", text = "τὸ ἐπιστημονικόν." },
  { t = "note", id = "1198", text = "μάθησιν." },
  { t = "note", id = "1199", text = "εἰλικρινῆ, absolute." },
  { t = "note", id = "1200", text = "ὕλην." },
  { t = "note", id = "1201", text = "νοητήν." },
  { t = "note", id = "1202", text = "θεωρητικός." },
  { t = "note", id = "1203", text = "τοὺς πρὸς ἄλληλα λόγους." },
  { t = "note", id = "1204", text = "σώματα, substances." },
  { t = "p", text = "What is mathematics?" },
  { t = "p", text = "Mathematics is a theoretic science[^1205] of things apprehensible by perception and sensation for communication to others.[^1206] And before this a certain person indulging in a joke, while hitting his mark, said that mathematics is that science to which Homer’s description of Discord may be applied.—" },
  { t = "note", id = "1205", text = "ἐπιστήμη θεωρητική." },
  { t = "note", id = "1206", text = "πρὸς τὴν τῶν ὑποπιπτόντων δόσιν." },
  { t = "p", text = "“Small at her birth, but rising every hour," },
  { t = "p", text = "While scarce the skies her horrid (mighty) head can bound," },
  { t = "p", text = "She stalks on earth and shakes the world around.”[^1207]" },
  { t = "note", id = "1207", text = "*Iliad*, iv. 442–443 (Pope)." },
  { t = "p", text = "For it begins with a point and a line,[^1208] and forthwith it takes heaven itself and all things within its compass." },
  { t = "note", id = "1208", text = "σημείου καὶ γραμμῆς." },
  { t = "p", text = "How many divisions are there of mathematics?" },
  { t = "p", text = "Of the more notable and the earliest mathematics there are two principal divisions, viz., arithmetic and geometry. And of the mathematics which deals with things sensible there are six divisions, viz., computation (practical arithmetic), geodesy, optics, theoretical music, mechanics, and astronomy. But that neither the so-called tactics nor architecture,[^1209] nor the popular music, nor physics, nor the art which is called equivocally the mechanical, constitutes, as some think, a branch of mathematics, we shall prove, as the discourse proceeds, clearly and systematically." },
  { t = "note", id = "1209", text = "τὸ ἀρχιτεκτονικόν." },
  { t = "p", text = "As to the circle having eight solids and six superficies and four angles.…What branches of arithmetic have closest affinity with each other? Computation and theoretical music have a closer affinity than others with arithmetic; for this department, being one also of quantity and ratio, approaches it in number and proportion.[^1210] Optics and geodesy, again, are more in affinity with geometry. And mechanics and astrology are in general affinity with both." },
  { t = "note", id = "1210", text = "ἀναλογίας." },
  { t = "p", text = "As to mathematics having its principles[^1211] in hypothesis and about hypothesis. Now, the term hypothesis is used in three ways, or indeed in many ways. For according to one usage of the term we have the dramatic revolution;[^1212] and in this sense there are said to be hypotheses in the dramas of Euripides. According to a second meaning, we have the investigation of matters in the special in rhetoric; and in this sense the Sophists say that a hypothesis must be proposed. And, according to a third signification, the beginning of a proof is called a hypothesis, as being the begging of certain matters with a view to the establishment of another in question. Thus it is said that Democritus[^1213] used a hypothesis, namely, that of atoms and a vacuum; and Asclepiades[^1214] that of atoms[^1215] and pores. Now, when applied to mathematics, the term hypothesis is to be taken in the third sense." },
  { t = "note", id = "1211", text = "ἀρχάς, beginnings." },
  { t = "note", id = "1212", text = "περιπέτεια, reversal of circumstances on which the plot of a tragedy hinges." },
  { t = "note", id = "1213", text = "A native of Abdera, in Thrace, born about 460 b.c., and, along with Leucippus, the founder of the philosophical theory of atoms, according to which the creation of all things was explained as being due to the fortuitous combination of an infinite number of atoms floating in infinite space." },
  { t = "note", id = "1214", text = "A famous physician, a native of Bithynia, but long resident in great repute at Rome in the middle of the first century b.c. He adopted the Epicurean doctrine of atoms and pores, and tried to form a new theory of disease, on the principle that it might be in all cases reduced to obstruction of the pores and irregular distribution of the atoms." },
  { t = "note", id = "1215", text = "ὄγκοις." },
  { t = "p", text = "That Pythagoras was not the only one who duly honoured arithmetic, but that his best known disciples did so too, being wont to say that “all things fit number.”[^1216]" },
  { t = "note", id = "1216", text = "[Wisd. xi. 20; Ecclus. xxxviii. 29 and xlii. 7.]" },
  { t = "p", text = "That arithmetic has as its immediate end chiefly the theory of science,[^1217] than which there is no end either greater or nobler. And its second end is to bring together in one all that is found in determinate substance.[^1218]" },
  { t = "note", id = "1217", text = "τὴν ἐπιστημονικὴν θεωρίαν." },
  { t = "note", id = "1218", text = "συλλήβδην καταλαβεῖν πόσα τῇ ὡρισμένῃ οὐσίᾳ συμβέβηκεν." },
  { t = "p", text = "Who among the mathematicians has made any discovery?" },
  { t = "p", text = "Eudemus[^1219] relates in his *Astrologies* that Œnopides[^1220] found out the circle of the zodiac and the cycle[^1221] of the great year. And Thales[^1222] discovered the eclipse of the sun and its period in the tropics in its constant inequality. And Anaximander[^1223] discovered that the earth is poised in space,[^1224] and moves round the axis of the universe. And Anaximenes[^1225] discovered that the moon has her light from the sun, and found out also the way in which she suffers eclipse. And the rest of the mathematicians have also made additions to these discoveries. We may instance the facts—that the fixed stars move round the axis passing through the poles, while the planets remove from each other[^1226] round the perpendicular axis of the zodiac; and that the axis of the fixed stars and the planets is the side of a pentedecagon with four-and-twenty parts." },
  { t = "note", id = "1219", text = "A native of Rhodes, a disciple of Aristotle, and editor of his works." },
  { t = "note", id = "1220", text = "A native of Chios, mentioned by Plato in connection with Anaxagoras, and therefore supposed by some to have been a contemporary of the latter sage." },
  { t = "note", id = "1221", text = "περίστασιν, revolution." },
  { t = "note", id = "1222", text = "Of Miletus, one of the sages, and founder of the Ionic school." },
  { t = "note", id = "1223", text = "Of Miletus, born 610 b.c., the immediate successor of Thales in the Ionic school of philosophy." },
  { t = "note", id = "1224", text = "μετέωρος." },
  { t = "note", id = "1225", text = "Of Miletus, the third in the series of Ionic philosophers." },
  { t = "note", id = "1226", text = "απεχουσιν ἀλλήλων." },
]

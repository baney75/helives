[[section]]
id = "on-the-sole-government-of-god"
title = "On the Sole Government of God"
level = 1
blocks = [
  { t = "p", text = "[^2594] [Translated by the Rev. G. Reith, M.A.]" },
  { t = "note", id = "2594", text = "Θεοῦ is omitted in mss., but μοναρχία of itself implies it." },
]

[[section]]
id = "chapter-1"
title = "Chapter I.—Object of the author."
level = 1
blocks = [
  { t = "p", text = "Although human nature at first received a union of intelligence and safety to discern the truth, and the worship due to the one Lord of all, yet envy, insinuating the excellence of human greatness, turned men away to the making of idols; and this superstitious custom, after continuing for a long period, is handed down to the majority as if it were natural and true. It is the part of a lover of man, or rather of a lover of God, to remind men who have neglected it of that which they ought to know. For the truth is of itself sufficient to show forth, by means of those things which are contained under the pole of heaven, the order [instituted by] Him who has created them. But forgetfulness having taken possession of the minds of men, through the long-suffering of God, has acted recklessly in transferring to mortals the name which is applicable to the only true God; and from the few the infection of sin spread to the many, who were blinded by popular usage to the knowledge of that which was lasting and unchangeable. For the men of former generations, who instituted private and public rites in honour of such as were more powerful, caused forgetfulness of the Catholic[^2595] faith to take possession of their posterity; but I, as I have just stated, along with a God-loving mind, shall employ the speech of one who loves man, and set it before those who have intelligence, which all ought to have who are privileged to observe the administration of the universe, so that they should worship unchangeably Him who knows all things. This I shall do, not by mere display of words, but by altogether using demonstration drawn from the old poetry in Greek literature,[^2596] and from writings very common amongst all. For from these the famous men who have handed down idol-worship as law to the multitudes, shall be taught and convicted by their own poets and literature of great ignorance." },
  { t = "note", id = "2595", text = "i.e., the doctrine that God only is to be worshipped." },
  { t = "note", id = "2596", text = "Literally, “history.”" },
]

[[section]]
id = "chapter-2"
title = "Chapter II.—Testimonies to the unity of God."
level = 1
blocks = [
  { t = "p", text = "First, then, Æschylus,[^2597] in expounding the arrangement of his work,[^2598] expressed himself also as follows respecting the only God:—" },
  { t = "note", id = "2597", text = "Grotius supposes this to be Æschylus the younger in some prologue." },
  { t = "note", id = "2598", text = "This may also be translated: “expounding the set of opinions prevalent in his day.”" },
  { t = "q", text = "“Afar from mortals place the holy God," },
  { t = "q", text = "Nor ever think that He, like to thyself," },
  { t = "q", text = "In fleshly robes is clad; for all unknown" },
  { t = "q", text = "Is the great God to such a worm as thou." },
  { t = "q", text = "Divers similitudes He bears; at times" },
  { t = "q", text = "He seems as a consuming fire that burns" },
  { t = "q", text = "Unsated; now like water, then again" },
  { t = "q", text = "In sable folds of darkness shrouds Himself." },
  { t = "q", text = "Nay, even the very beasts of earth reflect" },
  { t = "q", text = "His sacred image; whilst the wind, clouds, rain," },
  { t = "q", text = "The roll of thunder and the lightning flash," },
  { t = "q", text = "Reveal to men their great and sovereign Lord." },
  { t = "q", text = "Before Him sea and rocks, with every fount," },
  { t = "q", text = "And all the water floods, in reverence bend;" },
  { t = "q", text = "And as they gaze upon His awful face," },
  { t = "q", text = "Mountains and earth, with the profoundest depths" },
  { t = "q", text = "Of ocean, and the highest peaks of hills," },
  { t = "q", text = "Tremble: for He is Lord Omnipotent;" },
  { t = "q", text = "And this the glory is of God Most High.”" },
  { t = "p", text = "But he was not the only man initiated in the knowledge of God; for Sophocles also thus describes the nature of the only Creator of all things, the One God:—" },
  { t = "q", text = "“There is one God, in truth there is but one," },
  { t = "q", text = "Who made the heavens and the broad earth beneath," },
  { t = "q", text = "The glancing waves of ocean, and the winds;" },
  { t = "q", text = "But many of us mortals err in heart," },
  { t = "q", text = "And set up, for a solace in our woes," },
  { t = "q", text = "Images of the gods in stone and brass," },
  { t = "q", text = "Or figures carved in gold or ivory;" },
  { t = "q", text = "And, furnishing for these, our handiworks," },
  { t = "q", text = "Both sacrifice and rite magnificent," },
  { t = "q", text = "We think that thus we do a pious work.”" },
  { t = "p", text = "And Philemon also, who published many explanations of ancient customs, shares in the knowledge of the truth; and thus he writes:—" },
  { t = "q", text = "“Tell me what thoughts of God we should conceive?" },
  { t = "q", text = "One, all things seeing, yet Himself unseen.”" },
  { t = "p", text = "Even Orpheus, too, who introduces three hundred and sixty gods, will bear testimony in my favour from the tract called *Diathecæ*, in which he appears to repent of his error by writing the following:—" },
  { t = "q", text = "“I’ll speak to those who lawfully may hear;" },
  { t = "q", text = "All others, ye profane, now close the doors!" },
  { t = "q", text = "And, O Musæus, hearken thou to me," },
  { t = "q", text = "Who offspring art of the light-bringing moon." },
  { t = "q", text = "The words I tell thee now are true indeed," },
  { t = "q", text = "And if thou former thoughts of mine hast seen," },
  { t = "q", text = "Let them not rob thee of the blessed life;" },
  { t = "q", text = "But rather turn the depths of thine own heart" },
  { t = "q", text = "Unto that place where light and knowledge dwell." },
  { t = "q", text = "Take thou the word divine to guide thy steps;" },
  { t = "q", text = "And walking well in the straight certain path," },
  { t = "q", text = "Look to the one and universal King," },
  { t = "q", text = "One, self-begotten, and the only One" },
  { t = "q", text = "Of whom all things, and we ourselves, are sprung." },
  { t = "q", text = "All things are open to His piercing gaze," },
  { t = "q", text = "While He Himself is still invisible;" },
  { t = "q", text = "Present in all His works, though still unseen," },
  { t = "q", text = "He gives to mortals evil out of good," },
  { t = "q", text = "Sending both chilling wars and tearful griefs;" },
  { t = "q", text = "And other than the Great King there is none." },
  { t = "q", text = "The clouds for ever settle round His throne;" },
  { t = "q", text = "And mortal eyeballs in mere mortal eyes" },
  { t = "q", text = "Are weak to see Jove, reigning over all." },
  { t = "q", text = "He sits established in the brazen heavens" },
  { t = "q", text = "Upon His throne; and underneath His feet" },
  { t = "q", text = "He treads the earth, and stretches His right hand" },
  { t = "q", text = "To all the ends of ocean, and around" },
  { t = "q", text = "Tremble the mountain ranges, and the streams," },
  { t = "q", text = "The depths, too, of the blue and hoary sea.”" },
  { t = "p", text = "He speaks indeed as if he had been an eyewitness of God’s greatness. And Pythagoras[^2599] agrees with him when he writes:—" },
  { t = "note", id = "2599", text = "“Pythagorei cujusdam fetus.”—Otto, after Goezius." },
  { t = "q", text = "“Should one in boldness say, Lo, I am God!" },
  { t = "q", text = "Besides the One—Eternal—Infinite," },
  { t = "q", text = "Then let him from the throne he has usurped" },
  { t = "q", text = "Put forth his power and form another globe," },
  { t = "q", text = "Such as we dwell in, saying, This is mine." },
  { t = "q", text = "Nor only so, but in this new domain" },
  { t = "q", text = "For ever let him dwell. If this he can," },
  { t = "q", text = "Then verily he is a god proclaimed.”" },
]

[[section]]
id = "chapter-3"
title = "Chapter III.—Testimonies to a future judgment."
level = 1
blocks = [
  { t = "p", text = "Then further concerning Him, that He alone is powerful, both to institute judgment on the deeds performed in life, and on the ignorance of the Deity [displayed by men], I can adduce witnesses from your own ranks; and first Sophocles,[^2600] who speaks as follows:—" },
  { t = "note", id = "2600", text = "[Langus compares 2 Pet. iii. 7.]" },
  { t = "q", text = "“That time of times shall come, shall surely come," },
  { t = "q", text = "When from the golden ether down shall fall" },
  { t = "q", text = "Fire’s teeming treasure, and in burning flames" },
  { t = "q", text = "All things of earth and heaven shall be consumed;" },
  { t = "q", text = "And then, when all creation is dissolved," },
  { t = "q", text = "The sea’s last wave shall die upon the shore," },
  { t = "q", text = "The bald earth stript of trees, the burning air" },
  { t = "q", text = "No winged thing upon its breast shall bear." },
  { t = "q", text = "There are two roads to Hades, well we know;[^2601]" },
  { t = "note", id = "2601", text = "Some propose to insert these three lines in the centre of the next quotation from Philemon, after the line, “Nay, there’s an eye,” etc." },
  { t = "q", text = "By this the righteous, and by that the bad," },
  { t = "q", text = "On to their separate fates shall tend; and He," },
  { t = "q", text = "Who all things had destroyed, shall all things save.”" },
  { t = "p", text = "And Philemon[^2602] again:—" },
  { t = "note", id = "2602", text = "Some say *Diphilus*." },
  { t = "q", text = "“Think’st thou, Nicostratus, the dead, who here" },
  { t = "q", text = "Enjoyed whate’er of good life offers man," },
  { t = "q", text = "Escape the notice of Divinity," },
  { t = "q", text = "As if they might forgotten be of Him?" },
  { t = "q", text = "Nay, there’s an eye of Justice watching all;" },
  { t = "q", text = "For if the good and bad find the same end," },
  { t = "q", text = "Then go thou, rob, steal, plunder, at thy will," },
  { t = "q", text = "Do all the evil that to thee seems good." },
  { t = "q", text = "Yet be not thou deceived; for underneath" },
  { t = "q", text = "There is a throne and place of judgment set," },
  { t = "q", text = "Which God the Lord of all shall occupy;" },
  { t = "q", text = "Whose name is terrible, nor shall I dare" },
  { t = "q", text = "To breathe it forth in feeble human speech.”" },
  { t = "p", text = "And Euripides:[^2603]—" },
  { t = "note", id = "2603", text = "Grotius joins these lines to the preceding. Clement of Alexandria assigns them, and the others, which are under the name of Euripides, to Diphilus." },
  { t = "q", text = "“Not grudgingly he gives a lease of life," },
  { t = "q", text = "That we the holders may be fairly judged;" },
  { t = "q", text = "And if a mortal man doth think to hide" },
  { t = "q", text = "His daily guilt from the keen eye of God," },
  { t = "q", text = "It is an evil thought; so if perchance" },
  { t = "q", text = "He meets with leisure-taking Justice, she" },
  { t = "q", text = "Demands him as her lawful prisoner:" },
  { t = "q", text = "But many of you hastily commit" },
  { t = "q", text = "A twofold sin, and say there is no God." },
  { t = "q", text = "But, ah! there is; there is. Then see that he" },
  { t = "q", text = "Who, being wicked, prospers, may redeem" },
  { t = "q", text = "The time so precious, else hereafter waits" },
  { t = "q", text = "For him the due reward of punishment.”" },
]

[[section]]
id = "chapter-4"
title = "Chapter IV.—God desires not sacrifices, but righteousness."
level = 1
blocks = [
  { t = "p", text = "And that God is not appeased by the libations and incense of evil-doers, but awards vengeance in righteousness to each one, Philemon[^2604] again shall bear testimony to me:—" },
  { t = "note", id = "2604", text = "Some attribute these lines to Menander, others regard them as spurious." },
  { t = "q", text = "“If any one should dream, O Pamphilus," },
  { t = "q", text = "By sacrifice of bulls or goats—nay, then," },
  { t = "q", text = "By Jupiter—of any such like things;" },
  { t = "q", text = "Or by presenting gold or purple robes," },
  { t = "q", text = "Or images of ivory and gems;" },
  { t = "q", text = "If thus he thinks he may propitiate God," },
  { t = "q", text = "He errs, and shows himself a silly one." },
  { t = "q", text = "But let him rather useful be, and good," },
  { t = "q", text = "Committing neither theft nor lustful deeds," },
  { t = "q", text = "Nor murder foul, for earthly riches’ sake." },
  { t = "q", text = "Let him of no man covet wife or child," },
  { t = "q", text = "His splendid house, his wide-spread property," },
  { t = "q", text = "His maiden, or his slave born in his house," },
  { t = "q", text = "His horses, or his cattle, or his beeves," },
  { t = "q", text = "Nay, covet not a pin, O Pamphilus," },
  { t = "q", text = "For God, close by you, sees whate’er you do." },
  { t = "q", text = "He ever with the wicked man is wroth," },
  { t = "q", text = "But in the righteous takes a pleasure still," },
  { t = "q", text = "Permitting him to reap fruit of his toil," },
  { t = "q", text = "And to enjoy the bread his sweat has won." },
  { t = "q", text = "But being righteous, see thou pay thy vows," },
  { t = "q", text = "And unto God the giver offer gifts." },
  { t = "q", text = "Place thy adorning not in outward shows," },
  { t = "q", text = "But in an inward purity of heart;" },
  { t = "q", text = "Hearing the thunder then, thou shalt not fear," },
  { t = "q", text = "Nor shalt thou flee, O master, at its voice," },
  { t = "q", text = "For thou art conscious of no evil deed," },
  { t = "q", text = "And God, close by you, sees whate’er you do.”" },
  { t = "p", text = "Again, Plato, in *Timæus*,[^2605] says: “But if any one on consideration should actually institute a rigid inquiry, he would be ignorant of the distinction between the human and the divine nature; because God mingles many[^2606] things up into one, [and again is able to dissolve one into many things,] seeing that He is endued with knowledge and power; but no man either is, or ever shall be, able to perform any of these.”" },
  { t = "note", id = "2605", text = "P. 68, D, [cap. 30.]" },
  { t = "note", id = "2606", text = "The mss. are corrupt here. They seem to read, and one actually does read, “all” for “many.” “Many” is in Plato, and the clause in brackets is taken from Plato to fill up the sense." },
]

[[section]]
id = "chapter-5"
title = "Chapter V.—The vain pretensions of false gods."
level = 1
blocks = [
  { t = "p", text = "But concerning those who think that they shall share the holy and perfect name, which some have received by a vain tradition as if they were gods, Menander in the *Auriga* says:—" },
  { t = "q", text = "“If there exists a god who walketh out" },
  { t = "q", text = "With an old woman, or who enters in" },
  { t = "q", text = "By stealth to houses through the folding-doors," },
  { t = "q", text = "He ne’er can please me; nay, but only he" },
  { t = "q", text = "Who stays at home, a just and righteous God," },
  { t = "q", text = "To give salvation to His worshippers.”" },
  { t = "p", text = "The same Menander, in the *Sacerdos*, says:—" },
  { t = "q", text = "“There is no God, O woman, that can save" },
  { t = "q", text = "One man by another; if indeed a man," },
  { t = "q", text = "With sound of tinkling cymbals, charm a god" },
  { t = "q", text = "Where’er he listeth, then assuredly" },
  { t = "q", text = "He who doth so is much the greater god." },
  { t = "q", text = "But these, O Rhode, are but the cunning schemes" },
  { t = "q", text = "Which daring men of intrigue, unabashed," },
  { t = "q", text = "Invent to earn themselves a livelihood," },
  { t = "q", text = "And yield a laughing-stock unto the age.”" },
  { t = "p", text = "Again, the same Menander, stating his opinion about those who are received as gods, proving rather that they are not so, says:—" },
  { t = "q", text = "“Yea, if I this beheld, I then should wish" },
  { t = "q", text = "That back to me again my soul returned." },
  { t = "q", text = "For tell me where, O Getas, in the world" },
  { t = "q", text = "’Tis possible to find out righteous gods?”" },
  { t = "p", text = "And in the *Depositum*:—" },
  { t = "q", text = "“There’s an unrighteous judgment, as it seems," },
  { t = "q", text = "Even with the gods.”" },
  { t = "p", text = "And Euripides the tragedian, in *Orestes*, says:—" },
  { t = "q", text = "“Apollo having caused by his command" },
  { t = "q", text = "The murder of the mother, knoweth not" },
  { t = "q", text = "What honesty and justice signify." },
  { t = "q", text = "We serve the gods, whoever they may be;" },
  { t = "q", text = "But from the central regions of the earth" },
  { t = "q", text = "You see Apollo plainly gives response" },
  { t = "q", text = "To mortals, and whate’er he says we do." },
  { t = "q", text = "I him obeyed, when she that bore me fell" },
  { t = "q", text = "*Slain* *by my hand: he is the wicked man.*" },
  { t = "q", text = "Then slay him, for ’twas he that sinned, not I." },
  { t = "q", text = "What could I do? Think you not that the god" },
  { t = "q", text = "Should free me from the blame which I do bear?”" },
  { t = "p", text = "The same also in *Hippolytus*:—" },
  { t = "q", text = "“But on these points the gods do not judge right.”" },
  { t = "p", text = "And in *Ion*:—" },
  { t = "q", text = "“But in the daughter of Erechtheus" },
  { t = "q", text = "What interest have I? for that pertains" },
  { t = "q", text = "Not unto such as me. But when I come" },
  { t = "q", text = "With golden vessels for libations, I" },
  { t = "q", text = "The dew shall sprinkle, and yet needs must warn" },
  { t = "q", text = "Apollo of his deeds; for when he weds" },
  { t = "q", text = "Maidens by force, the children secretly" },
  { t = "q", text = "Begotten he betrays, and then neglects" },
  { t = "q", text = "When dying. Thus not you; but while you may" },
  { t = "q", text = "Always pursue the virtues, for the gods" },
  { t = "q", text = "Will surely punish men of wickedness." },
  { t = "q", text = "How is it right that you, who have prescribed" },
  { t = "q", text = "Laws for men’s guidance, live unrighteously?" },
  { t = "q", text = "But ye being absent, I shall freely speak," },
  { t = "q", text = "And ye to men shall satisfaction give" },
  { t = "q", text = "For marriage forced, thou Neptune, Jupiter," },
  { t = "q", text = "Who over heaven presides. The temples ye" },
  { t = "q", text = "Have emptied, while injustice ye repay." },
  { t = "q", text = "And though ye laud the prudent to the skies," },
  { t = "q", text = "Yet have ye filled your hands with wickedness." },
  { t = "q", text = "No longer is it right to call men ill" },
  { t = "q", text = "If they do imitate the sins[^2607] of gods;[^2608]" },
  { t = "note", id = "2607", text = "κακά in Euripedes, καλά in text." },
  { t = "note", id = "2608", text = "[See Warburton’s *Divine Legation* (book ii. § 4), vol. ii. p. 20. Ed. London, 1811.]" },
  { t = "q", text = "Nay, evil let their teachers rather be.”" },
  { t = "p", text = "And in *Archelaus*:—" },
  { t = "q", text = "“Full oft, my son, do gods mankind perplex.”" },
  { t = "p", text = "And in *Bellerophon*:—" },
  { t = "q", text = "“They are no gods, who do not what is right.”" },
  { t = "p", text = "And again in the same:—" },
  { t = "q", text = "“Gods reign in heaven most certainly, says one;" },
  { t = "q", text = "But it is false,— -yea, false, -and let not him" },
  { t = "q", text = "Who speaks thus, be so foolish as to use" },
  { t = "q", text = "Ancient tradition, or to pay regard" },
  { t = "q", text = "Unto my words: but with unclouded eye" },
  { t = "q", text = "Behold the matter in its clearest light." },
  { t = "q", text = "Power absolute, I say, robs men of life" },
  { t = "q", text = "And property; transgresses plighted faith;" },
  { t = "q", text = "Nor spares even cities, but with cruel hand" },
  { t = "q", text = "Despoils and devastates them ruthlessly." },
  { t = "q", text = "But they that do these things have more success" },
  { t = "q", text = "Than those who live a gentle pious life;" },
  { t = "q", text = "And cities small, I know, which reverence gods," },
  { t = "q", text = "Submissive bend before the many spears" },
  { t = "q", text = "Of larger impious ones; yea, and methinks" },
  { t = "q", text = "If any man lounge idly, and abstain" },
  { t = "q", text = "From working with his hands for sustenance," },
  { t = "q", text = "Yet pray the gods; he very soon will know" },
  { t = "q", text = "If they from him misfortunes will avert.”" },
  { t = "p", text = "And Menander in *Diphilus*:[^2609]—" },
  { t = "note", id = "2609", text = "These lines are assigned to Diphilus." },
  { t = "q", text = "“Therefore ascribe we praise and honour great" },
  { t = "q", text = "To Him who Father is, and Lord of all;" },
  { t = "q", text = "Sole maker and preserver of mankind," },
  { t = "q", text = "And who with all good things our earth has stored.”" },
  { t = "p", text = "The same also in the *Piscatores*:—" },
  { t = "q", text = "“For I deem that which nourishes my life" },
  { t = "q", text = "Is God; but he whose custom ’tis to meet" },
  { t = "q", text = "The wants of men,—He needs not at our hands" },
  { t = "q", text = "Renewed supplies, Himself being all in all.”[^2610]" },
  { t = "note", id = "2610", text = "The words from “but” to “all” are assigned by Otto to Justin, not to Menander." },
  { t = "p", text = "The same in the *Fratres*:—" },
  { t = "q", text = "“God ever is intelligence to those" },
  { t = "q", text = "Who righteous are: so wisest men have thought.”" },
  { t = "p", text = "And in the *Tibicinæ*:—" },
  { t = "q", text = "“Good reason finds a temple in all things" },
  { t = "q", text = "Wherein to worship; for what is the mind," },
  { t = "q", text = "But just the voice of God within us placed?”" },
  { t = "p", text = "And the tragedian in *Phrixus*:—" },
  { t = "q", text = "“But if the pious and the impious" },
  { t = "q", text = "Share the same lot, how could we think it just," },
  { t = "q", text = "If Jove, the best, judges not uprightly?”" },
  { t = "p", text = "In *Philoctetes*:—" },
  { t = "q", text = "“You see how honourable gain is deemed" },
  { t = "q", text = "Even to the gods; and how he is admired" },
  { t = "q", text = "Whose shrine is laden most with yellow gold." },
  { t = "q", text = "What, then, doth hinder thee, since it is good" },
  { t = "q", text = "To be like gods, from thus accepting gain?”" },
  { t = "p", text = "In *Hecuba*:—" },
  { t = "q", text = "“O Jupiter! whoever thou mayest be," },
  { t = "q", text = "Of whom except in word all knowledge fails;”" },
  { t = "p", text = "and,—" },
  { t = "q", text = "“Jupiter, whether thou art indeed" },
  { t = "q", text = "A great necessity, or the mind of man," },
  { t = "q", text = "I worship thee!”" },
]

[[section]]
id = "chapter-6"
title = "Chapter VI.—We should acknowledge one only God."
level = 1
blocks = [
  { t = "p", text = "Here, then, is a proof of virtue, and of a mind loving prudence, to recur to the communion of the unity,[^2611] and to attach one’s self to prudence for salvation, and make choice of the better things according to the free-will placed in man; and not to think that those who are possessed of human passions are lords of all, when they shall not appear to have even equal power with men. For in Homer,[^2612] Demodocus says he is self-taught —" },
  { t = "note", id = "2611", text = "See chap. i., the opening sentence." },
  { t = "note", id = "2612", text = "*Odyssey*, xxii. 347." },
  { t = "q", text = "“God inspired me with strains”—" },
  { t = "p", text = "though he is a mortal. Æsculapius and Apollo are taught to heal by Chiron the Centaur,—a very novel thing indeed, for gods to be taught by a man. What need I speak of Bacchus, who the poet says is mad? or of Hercules, who he says is unhappy? What need to speak of Mars and Venus, the leaders of adultery; and by means of all these to establish the proof which has been undertaken? For if some one, in ignorance, should imitate the deeds which are said to be divine, he would be reckoned among impure men, and a stranger to life and humanity; and if any one does so knowingly, he will have a plausible excuse for escaping vengeance, by showing that imitation of godlike deeds of audacity is no sin. But if any one should blame these deeds, he will take away their well-known names, and not cover them up with specious and plausible words. It is necessary, then, to accept the true and invariable Name, not proclaimed by my words only, but by the words of those who have introduced us to the elements of learning, in order that we may not, by living idly in this present state of existence, not only as those who are ignorant of the heavenly glory, but also as having proved ourselves ungrateful, render our account to the Judge.[^2613]" },
  { t = "note", id = "2613", text = "[N. B.—This tractate is probably the genuine work of Justin.]" },
]

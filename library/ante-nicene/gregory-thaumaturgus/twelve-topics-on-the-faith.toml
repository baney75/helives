[[section]]
id = "topic-i"
title = "Topic I."
level = 1
blocks = [
  { t = "h", text = "Twelve Topics on the Faith." },
  { t = "h", text = "Wherein is Given Also the Formula of Excommunication, and an Explication is Subjoined to Each.[^390]" },
  { t = "note", id = "390", text = "Works of Grester, vol. xv. p. 434, Ratisbon, 1741, in fol., from a manuscript codex." },
  { t = "p", text = "Topic I." },
  { t = "p", text = "If any one says that the body of Christ is uncreated, and refuses to acknowledge that He, being the uncreated Word (God) of God, took the flesh of created humanity and appeared incarnate, even as it is written, let him be anathema." },
  { t = "p", text = "Explication." },
  { t = "p", text = "How could the body be said to be uncreated? For the uncreated is the passionless, invulnerable, intangible. But Christ, on rising from the dead, showed His disciples the print of the nails and the wound made by the spear, and a body that could be handled, although He also had entered among them when the doors were shut, with the view of showing them at once the energy of the divinity and the reality of the body." },
  { t = "p", text = "Yet, while being God, He was recognised as man in a natural manner; and while subsisting truly as man, He was also manifested as God by His works.[^391]" },
  { t = "note", id = "391", text = "This paragraph is wanting in a very ancient copy." },
]

[[section]]
id = "topic-ii"
title = "Topic II."
level = 1
blocks = [
  { t = "p", text = "Topic II." },
  { t = "p", text = "If any one affirms that the flesh of Christ is consubstantial with the divinity, and refuses to acknowledge that He, subsisting Himself in the form of God as God before all ages, emptied Himself and took the form of a servant, even as it is written, let him be anathema." },
  { t = "p", text = "Explication." },
  { t = "p", text = "How could the flesh, which is conditioned by time, be said to be consubstantial[^392] with the timeless divinity? For that is designated consubstantial which is the same in nature and in eternal duration without variableness." },
  { t = "note", id = "392", text = "ὁμοουσιος." },
]

[[section]]
id = "topic-iii"
title = "Topic III."
level = 1
blocks = [
  { t = "p", text = "Topic III." },
  { t = "p", text = "If any one affirms that Christ, just like one of the prophets, assumed the perfect man, and refuses to acknowledge that, being begotten in the flesh of the Virgin,[^393] He became man and was born in Bethlehem, and was brought up in Nazareth, and advanced in age, and on completing the set number of years (appeared in public and) was baptized in the Jordan, and received this testimony from the Father, “This is my beloved Son,”[^394] even as it is written, let him be anathema." },
  { t = "note", id = "393", text = "Reading ἐκ παρθένου for ἐκ παθόντος." },
  { t = "note", id = "394", text = "Matt. iii. 17." },
  { t = "p", text = "Explication." },
  { t = "p", text = "How could it be said that Christ (the Lord) assumed the perfect man just like one of the prophets, when He, being the Lord Himself, became man by the incarnation effected through the Virgin? Wherefore it is written, that “the first man was of the earth, earthy.”[^395] But whereas he that was formed of the earth returned to the earth, He that became the second man returned to heaven. And so we read of the “first Adam and the last Adam.”[^396] And as it is admitted that the second came by the first according to the flesh, for which reason also Christ is called man and the Son of man; so is the witness given that the second is the Savior of the first, for whose sake He came down from heaven. And as the Word came down from heaven, and was made man, and ascended again to heaven, He is on that account said to be the second Adam from heaven." },
  { t = "note", id = "395", text = "1 Cor. xv. 47." },
  { t = "note", id = "396", text = "1 Cor. xv. 45." },
]

[[section]]
id = "topic-iv"
title = "Topic IV."
level = 1
blocks = [
  { t = "p", text = "Topic IV." },
  { t = "p", text = "If any one affirms that Christ was born of the seed of man by the Virgin, in the same manner as all men are born, and refuses to acknowledge that He was made flesh by the Holy Spirit and the holy Virgin Mary, and became man of the seed of David, even as it is written, let him be anathema." },
  { t = "p", text = "Explication." },
  { t = "p", text = "How could one say that Christ was born of the seed of man by the Virgin, when the holy Gospel and the angel, in proclaiming the good tidings, testify of Mary the Virgin that she said, “How shall this be, seeing I know not a man?”[^397] Wherefore he says, “The Holy Ghost shall come upon thee, and the power of the highest shall overshadow thee: therefore also that holy thing which shall be born of thee shall be called the Son of the Highest.”[^398] And to Joseph he says, “Fear not to take unto thee Mary thy wife: for that which is conceived in her is of the Holy Ghost. And she shall bring forth a son, and they shall call His name Jesus: for He shall save His people from their sins.”[^399]" },
  { t = "note", id = "397", text = "Luke i. 34." },
  { t = "note", id = "398", text = "Luke i. 35." },
  { t = "note", id = "399", text = "Matt. i. 20, 21." },
]

[[section]]
id = "topic-v"
title = "Topic V."
level = 1
blocks = [
  { t = "p", text = "Topic V." },
  { t = "p", text = "If any one affirms that the Son of God who is before the ages is one, and He who has appeared in these last times is another, and refuses to acknowledge that He who is before the ages is the same with Him who appeared in these last times, even as it is written, let him be anathema." },
  { t = "p", text = "Explication." },
  { t = "p", text = "How could it be said that the Son of God who is before the ages, and He who has appeared in these last times, are different, when the Lord Himself says, “Before Abraham was, I am;”[^400] and, “I came forth from God, and I come, and again I go to my Father?”[^401]" },
  { t = "note", id = "400", text = "John viii. 58." },
  { t = "note", id = "401", text = "John xiii. and xvi." },
]

[[section]]
id = "topic-vi"
title = "Topic VI."
level = 1
blocks = [
  { t = "p", text = "Topic VI." },
  { t = "p", text = "If any one affirms that He who suffered is one, and that He who suffered not is another, and refuses to acknowledge that the Word, who is Himself the impassibie and unchangeable God, suffered in the flesh which He had assumed really, yet without mutation, even as it is written, let him be anathema." },
  { t = "p", text = "Explication." },
  { t = "p", text = "How could it be said that He who suffered is one, and He who suffered not another, when the Lord Himself says, “The Son of man must suffer many things, and be killed, and be raised again the third day from the dead;”[^402] and again, “When ye see the Son of man sitting on the right hand of the Father;”[^403] and again, “When the Son of man cometh in the glory of His Father?”[^404]" },
  { t = "note", id = "402", text = "Matt. xvi. 21." },
  { t = "note", id = "403", text = "Matt. xxvi. 64; Mark xiv. 62." },
  { t = "note", id = "404", text = "Matt. xvi. 27." },
]

[[section]]
id = "topic-vii"
title = "Topic VII."
level = 1
blocks = [
  { t = "p", text = "Topic VII." },
  { t = "p", text = "If any one affirms that Christ is saved, and refuses to acknowledge that He is the Saviour of the world, and the Light of the world, even as it is written,[^405] let him be anathema." },
  { t = "note", id = "405", text = "Isa. ix.; Matt. iv.; John i.; iii.; viii.; ix.; xii." },
  { t = "p", text = "Explication." },
  { t = "p", text = "How could one say that Christ is saved, when the Lord Himself says, “I am the life;”[^406] and, “I am come that they might have life;”[^407] and, “He that believeth on me shall not see death, but he shall behold the life eternal?”[^408]" },
  { t = "note", id = "406", text = "John xi. 25; xiv. 6." },
  { t = "note", id = "407", text = "John x. 10." },
  { t = "note", id = "408", text = "John viii. 51." },
]

[[section]]
id = "topic-viii"
title = "Topic VIII."
level = 1
blocks = [
  { t = "p", text = "Topic VIII." },
  { t = "p", text = "If any one affirms that Christ is perfect man and also God the Word in the way of separation,[^409] and refuses to acknowledge the one Lord Jesus Christ, even as it is written, let him be anathema." },
  { t = "note", id = "409", text = "διαιρετῶς." },
  { t = "p", text = "Explication." },
  { t = "p", text = "How could one say that Christ is perfect man and also God the Word in the way of separation, when the Lord Himself says, “Why seek ye to kill me, a man that hath told you the truth, which I have heard of God?”[^410] For God the Word did not give a man for us, but He gave Himself for us, having been made man for our sake. Wherefore He says: “Destroy this temple, and in three days I will raise it up. But He spake of the temple of His body.”[^411]" },
  { t = "note", id = "410", text = "John viii. 40." },
  { t = "note", id = "411", text = "Or, and incorruptible." },
]

[[section]]
id = "topic-ix"
title = "Topic IX."
level = 1
blocks = [
  { t = "p", text = "Topic IX." },
  { t = "p", text = "If any one says that Christ suffers change or alteration, and refuses to acknowledge that He is unchangeable in the Spirit, though corruptible[^412] in the flesh,[^413] let him be anathema." },
  { t = "note", id = "412", text = "John ii. 20, 21." },
  { t = "note", id = "413", text = "[Christ’s flesh being incorruptible, transubstantiation cannot be true: the holy food is digested in its material part.]" },
  { t = "p", text = "Explication." },
  { t = "p", text = "How could one say that Christ suffers change or alteration, when the Lord Himself says, “I am and change not;”[^414] again, “His soul shall not be left in Hades, neither shall His flesh see corruption?”[^415]" },
  { t = "note", id = "414", text = "Mal. iii. 6." },
  { t = "note", id = "415", text = "Ps. xvi. 10; Acts ii. 31." },
]

[[section]]
id = "topic-x"
title = "Topic X."
level = 1
blocks = [
  { t = "p", text = "Topic X." },
  { t = "p", text = "If any one affirms that Christ assumed the man only in part, and refuses to acknowledge that He was made in all things like us, apart from sin, let him be anathema." },
  { t = "p", text = "Explication." },
  { t = "p", text = "How could one say that Christ assumed the man only in part, when the Lord Himself says, “I lay down my life, that I might take it again, for the sheep;”[^416] and, “My flesh is meat indeed, and my blood is drink indeed;”[^417] and, “He that eateth my flesh, and drinketh my blood, hath eternal life?”[^418]" },
  { t = "note", id = "416", text = "John x. 17." },
  { t = "note", id = "417", text = "John vi. 55." },
  { t = "note", id = "418", text = "John vi. 56." },
]

[[section]]
id = "topic-xi"
title = "Topic XI."
level = 1
blocks = [
  { t = "p", text = "Topic XI." },
  { t = "p", text = "If any one affirms that the body of Christ is void of soul and understanding,[^419] and refuses to acknowledge that He is perfect man, one and the same in all things (with us), let him be anathema." },
  { t = "note", id = "419", text = "ἄψυχον και ἀνόητον." },
  { t = "p", text = "Explication." },
  { t = "p", text = "How could one say that the body of the Lord (Christ) is void of soul and understanding? For perturbation, and grief, and distress, are not the properties either of a flesh void of soul, or of a soul void of understanding; nor are they the sign of the immutable Divinity, nor the index of a mere phantasm, nor do they mark the defect of human weakness; but the Word exhibited in Himself the exercise of the affections and susceptibilities proper to us, having endued Himself with our passibility, even as it is written, that “He hath borne our griefs, and carried our sorrows.”[^420] For perturbation, and grief, and distress, are disorders of soul; and toil, and sleep, and the body’s liability to wounding, are infirmities of the flesh." },
  { t = "note", id = "420", text = "Isa. liii. 4." },
]

[[section]]
id = "topic-xii"
title = "Topic XII."
level = 1
blocks = [
  { t = "p", text = "Topic XII." },
  { t = "p", text = "If any one says that Christ was manifested in the world only in semblance, and refuses to acknowledge that He came actually in the flesh, let him be anathema." },
  { t = "p", text = "Explication." },
  { t = "p", text = "How could one say that Christ was manifested only in semblance in the world, born as He was in Bethlehem, and made to submit to the circumcising of the flesh, and lifted up by Simeon, and brought up on to His twelfth year (at home), and made subject to His parents, and baptized in Jordan, and nailed to the cross, and raised again from the dead?" },
  { t = "p", text = "Wherefore, when it is said that He was “troubled in spirit,”[^421] that “He was sorrowful in soul,”[^422] that “He was wounded in body,”[^423] He places before us designations of susceptibilities proper to our constitution, in order to show that He was made man in the world, and had His conversation with men,[^424] yet without sin. For He was born in Bethlehem according to the flesh, in a manner meet for Deity, the angels of heaven recognising Him as their Lord, and hymning as their God Him who was then wrapped in swaddling-clothes in a manger, and exclaiming, “Glory to God in the highest, and on earth peace, good-will among men.”[^425] He was brought up in Nazareth; but in divine fashion He sat among the doctors, and astonished them by a wisdom beyond His years, in respect of the capacities of His bodily life, as is recorded in the Gospel narrative. He was baptized in Jordan, not as receiving any sanctification for Himself, but as gifting a participation in sanctification to others. He was tempted in the wilderness, not as giving way, however, to temptation, but as putting our temptations before Himself on the challenge of the tempter, in order to show the powerlessness of the tempter." },
  { t = "note", id = "421", text = "John xi. 33; xii. 27; xiii. 21." },
  { t = "note", id = "422", text = "Matt. xxvi. 38." },
  { t = "note", id = "423", text = "Isa. liii. 5." },
  { t = "note", id = "424", text = "Baruch iii. 38." },
  { t = "note", id = "425", text = "Luke ii. 14." },
  { t = "p", text = "Wherefore He says, “Be of good cheer, I have overcome the world.”[^426] And this He said, not as holding before us any contest proper only to a God, but as showing our own flesh in its capacity to overcome suffering, and death, and corruption, in order that, as sin entered into the world by flesh, and death came to reign by sin over all men, the sin in the flesh might also be condemned through the selfsame flesh in the likeness thereof;[^427] and that that overseer of sin, the tempter, might be overcome, and death be cast down from its sovereignty, and the corruption in the burying of the body be done away, and the first-fruits of the resurrection be shown, and the principle of righteousness begin its course in the world through faith, and the kingdom of heaven be preached to men, and fellowship be established between God and men." },
  { t = "note", id = "426", text = "John xvi. 33." },
  { t = "note", id = "427", text = "Rom. v. 12; viii. 3." },
  { t = "p", text = "In behalf of this grace let us glorify the Father, who has given His only begotten Son for the life of the world. Let us glorify the Holy Spirit that worketh in us, and quickeneth us, and furnisheth the gifts meet for the fellowship of God; and let us not intermeddle with the word of the Gospel by lifeless disputations, scattering about endless questionings and logomachies, and making a hard thing of the gentle and simple word of faith; but rather let us work the work of faith, let us love peace, let us exhibit concord, let us preserve unity, let us cultivate love, with which God is well pleased." },
  { t = "p", text = "As it is not for us to know the times or the seasons which the Father hath put in His own power,[^428] but only to believe that there will come an end to time, and that there will be a manifestation of a future world, and a revelation of judgment, and an advent of the Son of God, and a recompense of works, and an inheritance in the kingdom of heaven, so it is not for us to know how the Son of God became man; for this is a great mystery, as it is written, “Who shall declare His generation? for His life is taken from the earth.”[^429] But it is for us to believe that the Son of God became man, according to the Scriptures; and that He was seen on the earth, and had His conversation with men, according to the Scriptures, in their likeness, yet without sin; and that He died for us, and rose again from the dead, as it is written; and that He was taken up to heaven, and sat down at the right hand of the Father, whence He shall come to judge the quick and the dead, as it is written; lest, while we war against each other with words, any should be led to blaspheme the word of faith, and that should come to pass which is written, “By reason of you is my name[^430] continually blasphemed among the nations.”[^431]" },
  { t = "note", id = "428", text = "Acts i. 7." },
  { t = "note", id = "429", text = "Isa. liii. 8." },
  { t = "note", id = "430", text = "Or, the name of God." },
  { t = "note", id = "431", text = "Isa. lii. 5." },
]

[[section]]
id = "elucidations"
title = "Elucidations."
level = 1
blocks = [
  { t = "p", text = "These “twelve anathemas,” as they are called, do evidently refute the Nestorians and later heretics. Evidently, therefore, we must assign this document to another author. And, as frequent references are made to such tests, I subjoin a list of Œcumenical or Catholic Councils, properly so called, as follows:—" },
  { t = "p", text = "1. Jerusalem, against *Judaism*,[^432] a.d. 50." },
  { t = "note", id = "432", text = "As widely different from the other councils as the Apostles from their successors, and part of its decisions were local and temporary. For all that, it was the greatest of councils, and truly *General*." },
  { t = "p", text = "2. Nicæa, against *Arianism* (1),[^433] a.d. 325." },
  { t = "note", id = "433", text = "These numbers indicate the ordinary reckoning of writers, and is correct ecclesiastically. The Council of Jerusalem, however, is the base of Christian orthodoxy, and decided the great principles by which the “General Councils” were professedly ruled." },
  { t = "p", text = "3. Constantinople (I.), against *Semi-Arianism* (2), a.d. 381." },
  { t = "p", text = "4. Ephesus, against *Nestorianism* (3), a.d. 431." },
  { t = "p", text = "5. Chalcedon, against *Eutychianism* (4), a.d. 451." },
  { t = "p", text = "6. Constantinople (II.), against *Monophysitism* (5), a.d. 553." },
  { t = "p", text = "7. Constantinople (III.), against *Monothelitism* (6),[^434] a.d. 680.[^435]" },
  { t = "note", id = "434", text = "Theological students are often puzzled to recall the councils in order, and not less to recall the rejected heresies. I have found two mnemonics useful, thus: (1) INCE *and* (CCC) *three hundred*; (2) JAS. NEMM. *Dulce est desipere*, etc." },
  { t = "note", id = "435", text = "a.d. 325 to 680 is the Synodical Period. Gregory I. (Rome) placed the *first four* councils next to the four Gospels." },
  { t = "p", text = "These are all *the undisputed* councils. The *Seventh Council*, so called (a.d. 537), was not a free council, and was rejected by a free council of the West, convened at Frankfort a.d. 794. Its acceptance by the Roman pontiffs, subsequently, should have no logical force with the Easterns, who do not recognise their supremacy even over the councils of the West; and no free council has ever been held under pontifical authority. The above list, therefore, is a complete list of all the councils of the undivided Church as defined by Catholic canons. There has been no possibility of a *Catholic* council since the division of East and West. The Council of Frankfort is the pivot of subsequent history, and its fundamental importance has not been sufficiently insisted upon." },
]

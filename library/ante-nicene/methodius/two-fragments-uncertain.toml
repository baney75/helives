[[section]]
id = "fragment-2"
title = "Fragment II."
level = 1
blocks = [
  { t = "p", text = "Perhaps these three persons of our ancestors, being in an image the consubstantial representatives of humanity, are, as also Methodius thinks, types of the Holy and Consubstantial Trinity,[^3186] the innocent and unbegotten Adam being the type and resemblance of God the Father Almighty, who is uncaused, and the cause of all; his begotten son[^3187] shadowing forth the image of the begotten Son and Word of God; whilst Eve, that proceedeth forth from Adam,[^3188] signifies the person and procession of the Holy Spirit.[^3189]" },
  { t = "note", id = "3186", text = "[Such is the fact, no doubt, as to the ancestors of the Jewish race; the fatherly character of Abraham, the filial character of Isaac, and the missionary offices of Jacob—whose wisdom and organizing faculties are so conspicuous—interpreting, in some degree, “the Holy and Consubstantial Trinity.” This seems to be hinted, indeed, in the formula, “I am the God of Abraham, and the God of Isaac, and the God of Jacob.” Isaac’s submission to be sacrificed upon Mount Moriah, and Jacob’s begetting and sending forth the twelve patriarchs, singularly identify them as types of the Atoning Son and the regenerating Spirit, whose gifts and mission were imparted to the twelve Apostles.]" },
  { t = "note", id = "3187", text = "[Abel.]" },
  { t = "note", id = "3188", text = "[Note the single procession. The formula of the Hebrews, however, above noted, supplies a type of the *Filioque* and the *ab utroque* in the true sense of those terms.]" },
  { t = "note", id = "3189", text = "[Recur to chap. v. of *The Banquet*, p. 333, *supra*.]" },
]

[[section]]
id = "general-note"
title = "General Note."
level = 1
blocks = [
  { t = "h", text = "(*Vexillas*,—as they are called, p. 399.)" },
  { t = "p", text = "It is very curious to note how certain ideas are inherited from the earliest Fathers, and travel down, as here, to find a new expression in a distant age. Here our author reflects Justin Martyr,[^3190] and the *Labarum*[^3191] itself is the outcrop of what Justin wrote to Antoninus Pius." },
  { t = "note", id = "3190", text = "See vol. i. p. 181, this series." },
  { t = "note", id = "3191", text = "See p. 285, *supra*, under *the Emperors*." },
]

[[section]]
id = "fragment-1"
title = "Fragment I."
level = 1
blocks = [
  { t = "h", text = "Some Other Fragments of the Same Methodius." },
  { t = "h", text = "I.[^3175]" },
  { t = "note", id = "3175", text = "Ex Nicetæ *Catena on Job*, cap. xix. p. 429, edit. Londin., 1637. All the shorter fragments collected in the editions of Migne and Jahn are here appended." },
  { t = "p", text = "But, perhaps, since the friends of Job imagined that they understood the reason why he suffered such things, that just man, using a long speech to them, confesses that the wisdom of the divine judgment is incomprehensible, not only to him, but also to every man, and declares that this earthly region is not the fitting place for understanding the knowledge of the divine counsels. One might say, that perfect and absolute piety—a thing plainly divine, and of God alone given to man, is in this place called wisdom. But the sense of the words is as follows: God, he says, hath given great things unto men, sowing, as it were, in their nature the power of discovery, together with wisdom, and the faculty of art. And men having received this, dig metals out of the earth, and cultivate it; but that wisdom which is conjoined with piety, it is not possible in any place to discover. Man cannot obtain it from his own resources, nor can he give it unto others. Hence it was that the wise men of the Greeks, who in their own strength sought to search out piety, and the worship of the Deity, did not attain their end. For it is a thing, as we have said, which exceeds human strength, the gift and the grace of God; and therefore from the beginning, partly by visions, partly by the intervention of angels, partly by the discourses of the divinely-inspired prophets, God instructed man in the principles of true religion. Nay, moreover, that contemplative wisdom by which we are impelled to the arts, and to other pursuits, and with which we are all in common, just and unjust, alike endued, is the gift of God: if we have been made rational creatures, we have received this. Wherefore, also, in a former place it was said, as of a thing that is of God bestowed, “Is it not the Lord who teacheth understanding and knowledge?”[^3176]" },
  { t = "note", id = "3176", text = "Job xxi. 22; xxii. 2." },
]

[[section]]
id = "fragment-2"
title = "Fragment II."
level = 1
blocks = [
  { t = "p", text = "[^3177] Observe that the Lord was not wont from the beginning to speak with man; but after that the soul was prepared, and exercised in many ways, and had ascended into the height by contemplation, so far as it is possible for human nature to ascend, then is it His wont to speak, and to reveal His Word unto those who have attained unto this elevation. But since the whirlwind is the producer of the tempests, and Job, in the tempest of his afflictions, had not made shipwreck of his faith, but his constancy shone forth the rather; therefore it was that He who gave him an answer answered him by the whirlwind, to signify the tempest of calamity which had befallen him; but, because He changed the stormy condition of his affairs into one of serene tranquillity, He spoke to him not only by the whirlwind, but in clouds also." },
  { t = "note", id = "3177", text = "Ex Nicetæ *Catena on Job*, cap. xxvi. p. 538." },
]

[[section]]
id = "fragment-3"
title = "Fragment III."
level = 1
blocks = [
  { t = "p", text = "[^3178] Many have descended into the deep, not so as to walk on it, but so as to be by its bonds restrained. Jesus alone walked on the deep, where there are no traces of walkers, as a free man. For He chose death, to which He was not subject, that He might deliver those who were the bondslaves of death; saying to the prisoners, “Go forth; and to them that are in darkness, show yourselves.”[^3179] With which, also, the things which follow are consistent." },
  { t = "note", id = "3178", text = "Ex Nicetæ *Catena on Job*, p. 547." },
  { t = "note", id = "3179", text = "Isa. xlix. 9." },
]

[[section]]
id = "fragment-4"
title = "Fragment IV."
level = 1
blocks = [
  { t = "p", text = "[^3180] Seest thou how, at the end of the contest, with a loud proclamation he declares the praises of the combatant, and discovers that which was in his afflictions hidden, in the words: “Thinkest thou that I had else answered thee, but that thou shouldest appear just?”[^3181] This is the salve of his wounds, this the reward of his patience. For as to what followed, although he received double his former possessions, these may seem to have been given him by divine providence as small indeed, and for trifling causes, even though to some they may appear great." },
  { t = "note", id = "3180", text = "Ex Nicetæ *Catena on Job*, cap. xxviii. p. 570." },
  { t = "note", id = "3181", text = "Job xl. 3 (LXX.)." },
  { t = "h", text = "Fragment, Uncertain." },
  { t = "p", text = "Thou contendest with Me, and settest thyself against Me, and opposest those who combat for Me. But where wert thou when I made the world? What wert thou then? Hadst thou yet, says He, fallen from thy mother? for there was darkness, in the beginning of the world’s creation, He says, upon the face of the deep. Now this darkness was no created darkness, but one which of set purpose had place, by reason of the absence of light." },
]

[[section]]
id = "fragment-5"
title = "Fragment V."
level = 1
blocks = [
  { t = "p", text = "[^3182] But Methodius: The Holy Spirit, who of God is given to all men, and of whom Solomon said, “For Thine incorruptible Spirit is in all things,”[^3183] He receives for the conscience, which condemns the offending soul." },
  { t = "note", id = "3182", text = "Ex Nicetæ *Catena on Job*, cap. xix. p. 418, ex Olympiodoro." },
  { t = "note", id = "3183", text = "Wisd. xii. 1. [“The Spirit of Christ,” given to all; John i. 9.]" },
]

[[section]]
id = "fragment-6"
title = "Fragment VI."
level = 1
blocks = [
  { t = "h", text = "VI.[^3184] The Same Methodius." },
  { t = "note", id = "3184", text = "Ex Parallelis. Damascen., *Opp.*, tom. ii. p. 331, D." },
  { t = "p", text = "I account it a greater good to be reproved than to reprove, inasmuch as it is more excellent to free oneself from evil than to free another." },
]

[[section]]
id = "fragment-7"
title = "Fragment VII."
level = 1
blocks = [
  { t = "h", text = "VII.[^3185] The Same Methodius." },
  { t = "note", id = "3185", text = "*Ibid.*, p. 488, B." },
  { t = "p", text = "Human nature cannot clearly perceive pure justice in the soul, since, as to many of its thoughts, it is but dim-sighted." },
]

[[section]]
id = "fragment-8"
title = "Fragment VIII."
level = 1
blocks = [
  { t = "h", text = "VIII. The Same Methodius." },
  { t = "p", text = "Wickedness never could recognise virtue or its own self." },
]

[[section]]
id = "fragment-9"
title = "Fragment IX."
level = 1
blocks = [
  { t = "h", text = "IX. The Same Methodius." },
  { t = "p", text = "Justice, as it seems, is four square, on all sides equal and like." },
  { t = "p", text = "The just judgment of God is accommodated to our affections; and such as our estate is, proportionate and similar shall the retribution be which is allotted us." },
]

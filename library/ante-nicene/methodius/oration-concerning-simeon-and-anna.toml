  { t = "note", id = "3043", text = "2 Cor. vii. 4." },
  { t = "p", text = "VII. While the old man was thus exultant, and rejoicing with exceeding great and holy joy, that which had before been spoken of in a figure by the prophet Isaiah, the holy mother of God now manifestly fulfilled. For taking, as from a pure and undefiled altar, that coal living and ineffable, with man’s flesh invested, in the embrace of her sacred hands, as it were with the tongs, she held Him out to that just one, addressing and exhorting him, as it seems to me, in words to this effect: Receive, O reverend senior, thou of priests the most excellent, receive the Lord, and reap the full fruition of that hope of thine which is not left widowed and desolate. Receive, thou of men the most illustrious, the unfailing treasure, and those riches which can never be taken away. Take to thine embrace, O thou of men most wise, that unspeakable might, that unsearchable power, which can alone support thee. Embrace, thou minister of the temple, the Greatness infinite, and the Strength incomparable. Fold thyself around Him who is the very life itself, and live, O thou of men most venerable. Cling closely to incorruption and be renewed, O thou of men most righteous. Not too bold is the attempt; shrink not from it then, O thou of men most holy. Satiate thyself with Him thou hast longed for, and take thy delight in Him who has been given, or rather who gives Himself to thee, O thou of men most divine. Joyfully draw thy light, O thou of men most pious, from the Sun of Righteousness, that gleams around thee through the unsullied mirror of the flesh. Fear not His gentleness, nor let His clemency terrify thee, O thou of men most blessed. Be not afraid of His lenity, nor shrink from His kindness, O thou of men most modest. Join thyself to Him with alacrity, and delay not to obey Him. That which is spoken to thee, and held out to thee, savours not of over-boldness. Be not then reluctant, O thou of men the most decorous. The flame of the grace of my Lord does not consume, but illuminates thee, O thou of men most just.[^3044] Let the bush which set forth me in type, with respect to the verity of that fire which yet had no subsistence, teach thee this, O thou who art in the law the best instructed.[^3045] Let that furnace which was as it were a breeze distilling dew persuade thee, O master, of the dispensation of this mystery. Then, beside all this, let my womb be a proof to thee, in which He was contained, who in nought else was ever contained, of the substance of which the incarnate Word yet deigned to become incarnate. The blast[^3046] of the trumpet does not now terrify those who approach, nor a second time does the mountain all on smoke cause terror to those who draw nigh, nor indeed does the law punish relentlessly[^3047] those who would boldly touch. What is here present speaks of love to man; what is here apparent, of the Divine condescension. Thankfully, then, receive the God who comes to thee, for He shall take away thine iniquities, and thoroughly purge thy sins. In thee, let the cleansing of the world first, as in type, have place. In thee, and by thee, let that justification which is of grace become known beforehand to the Gentiles. Thou art worthy of the quickening first-fruits. Thou hast made good use of the law. Use grace henceforth. With the letter thou hast grown weary; in the spirit be renewed. Put off that which is old, and clothe thyself with that which is new. For of these matters I think not that thou art ignorant." },
  { t = "note", id = "3044", text = "Exod. iii. 2." },
  { t = "note", id = "3045", text = "Dan. iii. 21." },
  { t = "note", id = "3046", text = "Exod. xix. 16." },
  { t = "note", id = "3047", text = "Ps. vi. 6." },
  { t = "p", text = "VIII. Upon all this that righteous man, waxing bold and yielding to the exhortation of the mother of God, who is the handmaid of God in regard to the things which pertain to men, received into his aged arms Him who in infancy was yet the Ancient of days, and blessed God, and said, “Lord, now lettest Thou Thy servant depart in peace, according to Thy word: for mine eyes have seen Thy salvation, which Thou hast prepared before the face of all people; a light to lighten the Gentiles, and the glory of Thy people Israel.”[^3048] I have received from Thee a joy unmixed with pain. Do thou, O Lord, receive me rejoicing, and singing of Thy mercy and compassion. Thou hast given unto me this joy of heart. I render unto Thee with gladness my tribute of thanksgiving. I have known the power of the love of God. Since, for my sake, God of Thee begotten, in a manner ineffable, and without corruption, has become man. I have known the inexplicable greatness of Thy love and care for us, for Thou hast sent forth Thine own bowels to come to our deliverance. Now, at length, I understand what I had from Solomon learned: “Strong as death is love: for by it shall the sting of death be done away, by it shall the dead see life, by it shall even death learn what death is, being made to cease from that dominion which over us he exercised. By it, also, shall the serpent, the author of our evils, be taken captive and overwhelmed.”[^3049] Thou hast made known to us, O Lord, Thy salvation,[^3050] causing to spring up for us the plant of peace, and we shall no longer wander in error. Thou hast made known to us, O Lord, that Thou hast not unto the end overlooked Thy servants; neither hast Thou, O beneficent One, forgotten entirely the works of Thine hands. For out of Thy compassion for our low estate Thou hast shed forth upon us abundantly that goodness of Thine which is inexhaustible, and with Thy very nature cognate, having redeemed us by Thine only begotten Son, who is unchangeably like to Thee, and of one substance with Thee; judging it unworthy of Thy majesty and goodness to entrust to a servant the work of saving and benefiting Thy servants, or to cause that those who had offended should be reconciled by a minister. But by means of that light, which is of one substance with Thee, Thou hast given light to those that sat in darkness[^3051] and in the shadow of death, in order that in Thy light they might see the light of knowledge;[^3052] and it has seemed good to Thee, by means of our Lord and Creator, to fashion us again unto immortality; and Thou hast graciously given unto us a return to Paradise by means of Him who separated us from the joys of Paradise; and by means of Him who hath power to forgive sins Thou hast[^3053] blotted out the handwriting which was against us.[^3054] Lastly, by means of Him who is a partaker of Thy throne and who cannot be separated from Thy divine nature, Thou hast given unto us the gift of reconciliation and access unto Thee with confidence in order that, by the Lord who recognises the sovereign authority of none, by the true and omnipotent God, the subscribed sanction, as it were, of so many and such great blessings might constitute the justifying gifts of grace to be certain and indubitable rights to those who have obtained mercy. And this very thing the prophet before had announced in the words: No ambassador, nor angel, but the Lord Himself saved them; because He loved them, and spared them, and He took them up, and exalted them.[^3055] And all this was, not of works of righteousness[^3056] which we have done, nor because we loved Thee,—for our first earthly forefather, who was honourably entertained, in the delightful abode of Paradise, despised Thy divine and saving commandment, and was judged unworthy of that life-giving place, and mingling his seed with the bastard off-shoots of sin, he rendered it very weak;—but Thou, O Lord, of Thine own self, and of Thine ineffable love toward the creature of Thine hands, hast confirmed Thy mercy toward us, and, pitying our estrangement from Thee, hast moved Thyself at the sight of our degradation[^3057] to take us into compassion. Hence, for the future, a joyous festival is established for us of the race of Adam, because the first Creator of Adam of His own free-will has become the Second Adam. And the brightness of the Lord our God hath come down to sojourn with us, so that we see God face to face, and are saved. Therefore, O Lord, I seek of Thee to be allowed to depart. I have seen Thy salvation; let me be delivered from the bent yoke of the letter. I have seen the King Eternal, to whom no other succeeds; let me be set free from this servile and burdensome chain. I have seen Him who is by nature my Lord and Deliverer; may I obtain, then, His decree for my deliverance. Set me free from the yoke of condemnation, and place me under the yoke of justification. Deliver me from the yoke of the curse, and of the letter that killeth;[^3058] and enrol me in the blessed company of those who, by the grace of this Thy true Son, who is of equal glory and power with Thee, have been received into the adoption of sons." },

  { t = "note", id = "3068", text = "2 Kings ii. 20; iv. 41; v." },
  { t = "p", text = "X. But why do I digress, and lengthen out my discourse, giving it the rein with these varied illustrations, and that when the truth of thy matter stands like a column before the eye, in which it were better and more profitable to luxuriate and delight in? Wherefore, bidding adieu to the spiritual narrations and wondrous deeds of the saints throughout all ages, I pass on to thee who art always to be had in remembrance, and who holdest the helm, as it were, of this festival.[^3069]" },
  { t = "note", id = "3069", text = "[The feast of the Purification. Here follows an impassioned apostrophe, which apart from its Oriental extravagance is full of poetical beauty. Its language, however, like that of other parts of this Oration, suggests at least interpolation, subsequent to the Nestorian controversy. Previously, there would have been no call for such vehemence of protestation.]" },
  { t = "p", text = "Blessed art thou, all-blessed, and to be desired of all. Blessed of the Lord is thy name, full of divine grace, and grateful exceedingly to God, mother of God, thou that givest light to the faithful. Thou art the circumscription, so to speak, of Him who cannot be circumscribed; the root[^3070] of the most beautiful flower; the mother of the Creator; the nurse of the Nourisher; the circumference of Him who embraces all things; the upholder of Him[^3071] who upholds all things by His word; the gate through which God appears in the flesh;[^3072] the tongs of that cleansing coal;[^3073] the bosom in small of that bosom which is all-containing; the fleece of wool,[^3074] the mystery of which cannot be solved; the well of Bethlehem,[^3075] that reservoir of life which David longed for, out of which the draught of immortality gushed forth; the mercy-seat[^3076] from which God in human form was made known unto men; the spotless robe of Him who clothes Himself with light as with a garment.[^3077] Thou hast lent to God, who stands in need of nothing, that flesh which He had not, in order that the Omnipotent might become that which it was his good pleasure to be. What is more splendid than this? What than this is more sublime? He who fills earth and heaven,[^3078] whose are all things, has become in need of thee, for thou hast lent to God that flesh which He had not. Thou hast clad the Mighty One with that beauteous panoply of the body by which it has become possible for Him to be seen by mine eyes. And I, in order that I might freely approach to behold Him, have received that by which all the fiery darts of the wicked shall be quenched.[^3079] Hail! hail! mother and handmaid of God. Hail! hail! thou to whom the great Creditor of all is a debtor. We are all debtors to God, but to thee He is Himself indebted." },
  { t = "note", id = "3070", text = "Isa. xl. 1." },
  { t = "note", id = "3071", text = "Heb. i. 3." },
  { t = "note", id = "3072", text = "Ezek. xliv. 2." },
  { t = "note", id = "3073", text = "Isa. vi. 6." },
  { t = "note", id = "3074", text = "Judg. vi. 37." },
  { t = "note", id = "3075", text = "2 Sam. xxiii. 17." },
  { t = "note", id = "3076", text = "Exod. xxxv. 17." },
  { t = "note", id = "3077", text = "Ps. civ. 2." },
  { t = "note", id = "3078", text = "Jer. xxiii. 24." },
  { t = "note", id = "3079", text = "Ephes. vi. 16." },
  { t = "p", text = "For He who said, “Honour thy father and thy mother,”[^3080] will have most assuredly, as Himself willing to be proved by such proofs, kept inviolate that grace, and His own decree towards her who ministered to Him that nativity to which He voluntarily stooped, and will have glorified with a divine honour her whom He, as being without a father, even as she was without a husband, Himself has written down as mother. Even so must these things be. For the hymns[^3081] which we offer to thee, O thou most holy and admirable habitation of God, are no merely useless and ornamental words. Nor, again, is thy spiritual laudation mere secular trifling, or the shoutings of a false flattery, O thou who of God art praised; thou who to God gavest suck; who by nativity givest unto mortals their beginning of being, but they are of clear and evident truth. But the time would fail us, ages and succeeding generations too, to render unto thee thy fitting salutation as the mother of the King Eternal,[^3082] even as somewhere the illustrious prophet says, teaching us how incomprehensible thou art.[^3083] How great is the house of God, and how large is the place of His possession! Great, and hath none end, high and unmeasurable. For verily, verily, this prophetic oracle, and most true saying, is concerning thy majesty; for thou alone hast been thought worthy to share with God the things of God; who hast alone borne in the flesh Him, who of God the Father was the Eternally and Only-Begotten. So do they truly believe who hold fast to the pure faith.[^3084]" },
  { t = "note", id = "3080", text = "Exod. xx. 12." },
  { t = "note", id = "3081", text = "[Apostrophes like the above; panegyrical, not odes of worship.]" },
  { t = "note", id = "3082", text = "1 Tim. i. 17." },
  { t = "note", id = "3083", text = "Baruch iii. 24, 25." },
  { t = "note", id = "3084", text = "[This must have been interpolated after the Council of Ephesus, a.d. 431. The whole Oration is probably after that date.]" },
  { t = "p", text = "XI. But for the time that remains, my most attentive hearers, let us take up the old man, the receiver of God, and our pious teacher, who hath put in here, as it were, in safety from that virginal sea, and let us refresh him, both satisfied as to his divine longing, and conveying to us this most blessed theology; and let us ourselves follow out the rest of our discourse, directing our course unerringly with reference to our prescribed end, and that under the guidance of God the Almighty, so shall we not be found altogether unfruitful and unprofitable as to what is required of us. When, then, to these sacred rites, prophecy and the priesthood had been jointly called, and that pair of just ones elected of God—Simeon, I mean, and Anna, bearing in themselves most evidently the images of both peoples—had taken their station by the side of that glorious and virginal throne,—for by the old man was represented the people of Israel, and the law now waxing old; whilst the widow represents the Church of the Gentiles, which had been up to this point a widow,—the old man, indeed, as personating the law, seeks dismissal; but the widow, as personating the Church, brought her joyous confession of faith[^3085] and spake of Him to all that looked for redemption in Jerusalem, even as the things that were spoken of both have been appositely and excellently recorded, and quite in harmony with the sacred festival. For it was fitting and necessary that the old man who knew so accurately that decree of the law, in which it is said: Hear Him, and every soul that will not hearken unto Him shall be cut off from His people,[^3086] should seek a peaceful discharge from the tutorship of the law; for in truth it were insolence and presumption, when the king is present and addressing the people, for one of his attendants to make a speech over against him, and that to this man his subjects should incline their ears. It was necessary, too, that the widow who had been increased with gifts beyond measure, should in festal strains return her thanks to God; and so the things which there took place were agreeable to the law. But, for what remains, it is necessary to inquire how, since the prophetic types and figures bear, as has been shown, a certain analogy and relation to this prominent feast, it is said that the house was filled with smoke. Nor does the prophet say this incidentally, but with significance, speaking of that cry of the Thrice-Holy,[^3087] uttered by the heavenly seraphs. You will discover the meaning of this, my attentive hearer, if you do but take up and examine what follows upon this narration: For hearing, he says, ye shall hear, and shall not understand; and seeing, ye shall see, and not perceive.[^3088] When, therefore, the foolish Jewish children had seen the glorious wonders which, as David sang, the Lord had performed in the earth, and had seen the sign from the depth[^3089] and from the height meeting together, without division or confusion; as also Isaiah had before declared, namely, a mother beyond nature, and an offspring beyond reason; an earthly mother and a heavenly son; a new taking of man’s nature, I say, by God, and a child-bearing without marriage; what in creation’s circuit could be more glorious and more to be spoken of than this! yet when they had seen this it was all one as if they had not seen it; they closed their eyes, and in respect of praise were supine. Therefore the house in which they boasted was filled with smoke." },
  { t = "note", id = "3085", text = "Luke ii. 38." },
  { t = "note", id = "3086", text = "Deut. xviii. 15–19." },
  { t = "note", id = "3087", text = "Isa. vi. 4." },
  { t = "note", id = "3088", text = "Isa. vi. 9; Acts xxviii. 26." },
  { t = "note", id = "3089", text = "Ps. xlvi. 8; Isa. vii. 11." },
  { t = "p", text = "XII. And in addition to this, when besides the spectacle, and even beyond the spectacle, they heard an old man, very righteous, very worthy of credit, worthy also of emulation, inspired by the Holy Spirit, a teacher of the law, honoured with the priesthood, illustrious in the gift of prophecy, by the hope which he had conceived of Christ, extending the limits of life, and putting off the debt of death—when they saw him, I say, leaping for joy, speaking words of good omen, quite transformed with gladness of heart, entirely rapt in a divine and holy ecstasy; who from a man had been changed into an angel by a godly change, and, for the immensity of his joy, chanted his hymn of thanksgiving, and openly proclaimed the “Light to lighten the Gentiles, and the glory of Thy people Israel.”[^3090] Not even then were they willing to hear what was placed within their hearing, and held in veneration by the heavenly beings themselves; wherefore the house in which they boasted was filled with smoke. Now smoke is a sign and sure evidence of wrath; as it is written, “There went up a smoke in His anger, and fire from His countenance devoured;”[^3091] and in another place, “Amongst the disobedient people shall the fire burn,”[^3092] which plainly, in the revered Gospels, our Lord signified, when He said to the Jews, “Behold your house is left unto you desolate.”[^3093] Also, in another place, “The king sent forth his armies, and destroyed those murderers, and burnt up their city.”[^3094] Of such a nature was the adverse reward of the Jews for their unbelief, which caused them to refuse to pay to the Trinity the tribute of praise. For after that the ends of the earth were sanctified, and the mighty house of the Church was filled, by the proclamation of the Thrice Holy, with the glory of the Lord, as the great waters cover the seas,[^3095] there happened to them the things which before had been declared, and the beginning of prophecy was confirmed by its issue, the preacher of truth signifying, as has been said, by the Holy Spirit, as it were in an example, the dreadful destruction which was to come upon them, in the words: “In the year in which king Uzziah died, I saw the Lord”—Uzziah, doubtless, as an apostate, being taken as the representative of the whole apostate body—the head of which he certainly was—who also, paying the penalty due to his presumption, carried on his forehead, as upon a brazen statue, the divine vengeance engraved, by the loathsomeness of leprosy, exhibiting to all the retribution of their loathsome impiety. Wherefore with divine wisdom did he, who had foreknowledge of these events, oppose the bringing in of the thankful Anna to the casting out of the ungrateful synagogue. Her very name also pre-signifies the Church, that by the grace of Christ and God is justified in baptism. For Anna is, by interpretation, grace." },
  { t = "note", id = "3090", text = "Luke ii. 32." },
  { t = "note", id = "3091", text = "Ps. xviii. 8." },
  { t = "note", id = "3092", text = "Ecclus. xxii. 7." },
  { t = "note", id = "3093", text = "Matt. xxiii. 38." },
  { t = "note", id = "3094", text = "Matt. xvii. 7." },
  { t = "note", id = "3095", text = "Isa. vi. 3, 4; i." },
  { t = "p", text = "XIII. But here, as in port, putting in the vessel that bears the ensign of the cross, let us reef the sails of our oration, in order that it may be with itself commensurate. Only first, in as few words as possible, let us salute the city of the Great King[^3096] together with the whole body of the Church, as being present with them in spirit, and keeping holy-day with the Father, and the brethren most held in honour there. Hail, thou city of the Great King, in which the mysteries of our salvation are consummated. Hail, thou heaven upon earth, Sion, the city that is for ever faithful unto the Lord. Hail, and shine thou Jerusalem, for thy light is come, the Light Eternal, the Light for ever enduring, the Light Supreme, the Light Immaterial, the Light of one substance with God and the Father, the Light which is in the Spirit, and in which is the Father; the Light which illumines the ages; the Light which gives light to mundane and supramundane things, Christ our very God. Hail, city sacred and elect of the Lord. Joyfully keep thy festal days, for they will not multiply so as to wax old and pass away. Hail, thou city most happy, for glorious things are spoken of thee; thy priest shall be clothed with righteousness, and thy saints shall shout for joy, and thy poor shall be satisfied with bread.[^3097] Hail! rejoice, O Jerusalem, for the Lord reigneth in the midst of thee.[^3098] That Lord, I say, who in His simple and immaterial Deity, entered our nature, and of the virgin’s womb became ineffably incarnate; that Lord, who was partaker of nothing else save the lump of Adam, who was by the serpent tripped up. For the Lord laid not hold of the seed of angels[^3099]—those, I say, who fell not away from that beauteous order and rank that was assigned to them from the beginning. To us He condescended, that Word who was always with the Father co-existent God. Nor, again, did He come into the world to restore; nor will He restore, as has been imagined by some impious advocates of the devil, those wicked demons who once fell from light; but when the Creator and Framer of all things had, as the most divine Paul says, laid hold of the seed of Abraham, and through him of the whole human race, He was made man for ever, and without change, in order that by His fellowship with us, and our joining on to Him, the ingress of sin into us might be stopped, its strength being broken by degrees, and itself as wax being melted, by that fire which the Lord, when He came, sent upon the earth.[^3100] Hail to thee, thou Catholic Church,[^3101] which hast been planted in all the earth, and do thou rejoice with us. Fear not, little flock, the storms of the enemy,[^3102] for it is your Father’s good pleasure to give you the kingdom, and that you should tread upon the necks of your enemies.[^3103] Hail, and rejoice, thou that wast once barren, and without seed unto godliness, but who hast now many children of faith.[^3104] Hail, thou people of the Lord, thou chosen generation, thou royal priesthood, thou holy nation, thou peculiar people—show forth His praises who hath called you out of darkness into His marvellous light; and for His mercies glorify Him.[^3105]" },
  { t = "note", id = "3096", text = "Ps. xlviii. 2; Matt. v. 35; Isa. i. 26." },
  { t = "note", id = "3097", text = "Isa. lx. 1; Ps. lxxxvii. 3; Ps. cxxxii. 16." },

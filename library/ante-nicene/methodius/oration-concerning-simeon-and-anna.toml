  { t = "note", id = "2992", text = "John i. 11; Ps. l. 3. ἦλθεν—ἐμφανῶς. The text plainly requires this connection with evident allusion to Ps. l. “Our God will manifestly come” ἐμφανῶς ἥξει, which passage our author connects with another from John i.—Tr." },
  { t = "note", id = "2993", text = "Ecclus. i. 10." },
  { t = "note", id = "2994", text = "2 Cor. v. 17." },
  { t = "note", id = "2995", text = "τὴν ἀκίνητον ἧτταν ἐγκαυχησάμενοι. It seems better to retain this. Pantinus would substitute ἀνίκητον for ἀκίνητον, and render less happily “invicto hoc certamine victos.”" },
  { t = "note", id = "2996", text = "[See p. 309, note 1, *supra*, and the reflection upon even the *Banquet of Philosophers*, the *Symposium* of Plato.]" },
  { t = "note", id = "2997", text = "Rom. ix. 5." },
  { t = "p", text = "II. Come, therefore, Isaiah, most solemn of preachers and greatest of prophets, wisely unfold to the Church the mysteries of the congregation in glory, and incite our excellent guests abundantly, to satiate themselves with enduring dainties, in order that, placing the reality which we possess over against that mirror of thine, truthful prophet as thou art, thou mayest joyfully clap thine hands at the issue of thy predictions. It came to pass, he says, “in the year in which king Uzziah died, I saw the Lord sitting upon a throne, high and lifted up; and the house was full of His glory. And the seraphim stood round about him: each one had six wings. And one cried unto another, and said, Holy, holy, holy, is the Lord of hosts: the whole earth is full of His glory. And the posts of the door were moved at the voice of him that cried, and the house was filled with smoke. And I said, Woe is me! I am pricked to the heart, for I am a man of unclean lips, and I dwell in the midst of a people of unclean lips: for mine eyes have seen the King, the Lord of hosts. And one of the seraphim was sent unto me, having a live coal in his hand, which he had taken with the tongs from off the altar. And he touched my mouth, and said, Lo, this hath touched thy lips; and thine iniquity is taken away, and thy sin is purged. Also I heard the voice of the Lord, saying, Whom shall I send, and who will go unto this people? Then said I, Here am I; send me. And He said, Go, and tell this people, Hear ye indeed, but understand not; and see ye indeed, but perceive not.”[^2998] These are the proclamations made beforehand by the prophet through the Spirit. Do thou, dearly beloved, consider the force of these words. So shalt thou understand the issue of these sacramental[^2999] symbols, and know both what and how great this assembling together of ourselves is. And since the prophet has before spoken of this miracle, come thou, and with the greatest ardour and exultation, and alacrity of heart, together with the keenest sagacity of thine intelligence, and therewith approach Bethlehem the renowned, and place before thy mind an image clear and distinct, comparing the prophecy with the actual issue of events. Thou wilt not stand in need of many words to come to a knowledge of the matter; only fix thine eyes on the things which are taking place there. “All things truly are plain to them that understand, and right to them that find knowledge.”[^3000] For, behold, as a throne high and lifted up by the glory of Him that fashioned it, the virgin-mother is there made ready, and that most evidently for the King, the Lord of hosts. Upon this, consider the Lord now coming unto thee in sinful flesh. Upon this virginal throne, I say, worship Him who now comes to thee by this new and ever-adorable way. Look around thee with the eye of faith, and thou wilt find around Him, as by the ordinance of their courses,[^3001] the royal and priestly company of the seraphim. These, as His bodyguard, are ever wont to attend the presence of their king. Whence also in this place they are not only said to hymn with their praises the divine substance of the divine unity, but also the glory to be adored by all of that one of the sacred Trinity, which now, by the appearance of God in the flesh, hath even lighted upon earth. They say: “The whole earth is full of His glory.” For we believe that, together with the Son, who was made man for our sakes, according to the good pleasure of His will,[^3002] was also present the Father, who is inseparable from Him as to His divine nature, anal also the Spirit, who is of one and the same essence with Him.[^3003] For, as says Paul, the interpreter of the divine oracle,[^3004] “God was in Christ reconciling the world unto Himself, not imputing their trespasses unto them.”[^3005] He thus shows that the Father was in the Son, because that one and the same will worked in them." },
  { t = "note", id = "2998", text = "Isa. vi. 1–9. The quotations are from LXX. version." },
  { t = "note", id = "2999", text = "μυστήριον is, in the Greek Fathers, equivalent to the Latin *Sacramentum.*—Tr." },
  { t = "note", id = "3000", text = "Prov. viii. 9." },
  { t = "note", id = "3001", text = "ἱεράτευμα. Perhaps less definitely priesthood. Acc. Arist. it is ἡ περὶ τοὺς θεοὺς ἐπιμέλεια. The cult and ordinances of religion to be observed especially by the priests, whose business it is to celebrate the excellence of God.—Tr." },
  { t = "note", id = "3002", text = "κατὰ τὴν εὐδοκίαν. Allusion is made to Eph. i. 5, According to the good pleasure of God, and His decree for the salvation of man. Less aptly Pantinus renders, ob propensam secæm in nos voluntatem.—Tr." },
  { t = "note", id = "3003", text = "“One and the same essence.” This is the famous ὁμοουσιοςof the Nicene Council.—Tr." },
  { t = "note", id = "3004", text = "ἱεροφάντης, teacher of the divine oracles. This, which is the technical term for the presiding priest at Eleusis, and the Greek translation of the Latin “Pontifex Maximus,” is by our author applied to St. Paul.—Tr." },
  { t = "note", id = "3005", text = "2 Cor. v. 19." },
  { t = "p", text = "III. Do thou, therefore, O lover of this festival, when thou hast considered well the glorious mysteries of Bethlehem, which were brought to pass for thy sake, gladly join thyself to the heavenly host, which is celebrating magnificently thy salvation.[^3006] As once David did before the ark, so do thou, before this virginal throne, joyfully lead the dance. Hymn with gladsome song the Lord, who is always and everywhere present, and Him who from Teman,[^3007] as says the prophet, hath thought fit to appear, and that in the flesh, to the race of men. Say, with Moses, “He is my God, and I will glorify Him; my father’s God, and I will exalt Him.”[^3008] Then, after thine hymn of thanksgiving, we shall usefully inquire what cause aroused the King of Glory to appear in Bethlehem. His compassion for us compelled Him, who cannot be compelled, to be born in a human body at Bethlehem. But what necessity was there that He, when a suckling infant,[^3009] that He who, though both in time, was not limited by time, that He, who though wrapped in swaddling clothes, was not by them held fast, what necessity was there that He should be an exile and a stranger from His country? Should you, forsooth, wish to know this, ye congregation most holy, and upon whom the Spirit of God hath breathed, listen to Moses proclaiming plainly to the people, stimulating them, as it were, to the knowledge of this extraordinary nativity, and saying, “Every male that openeth the womb, shall be called holy to the Lord.”[^3010] O wondrous circumstance! “O the depth of the riches both of the wisdom and knowledge of God!”[^3011] It became indeed the Lord of the law and the prophets to do all things in accordance with His own law, and not to make void the law, but to fulfil it, and rather to connect with the fulfilment of the law the beginning of His grace. Therefore it is that the mother, who was superior to the law, submits to the law. And she, the holy and undefiled one, observes that time of forty days that was appointed for the unclean. And He who makes us free from the law, became subject to the law; and there is offered for Him, who hath sanctified us, a pair of clean birds,[^3012] in testimony of those who approach clean and blameless. Now that that parturition was unpolluted, and stood not in need of expiatory victims, Isaiah is our witness, who proclaims distinctly to the whole earth under the sun: “Before she travailed,” he says, “she brought forth; before her pains came, she escaped, and brought forth a man-child.”[^3013] Who hath heard such a thing? Who hath seen such things? The must holy virgin mother, therefore, escaped entirely the manner of women even before she brought forth: doubtless, in order that the Holy Spirit, betrothing her unto Himself, and sanctifying her, she might conceive without intercourse with man. She hath brought forth her first-born Son, even the only-begotten Son of God, Him, I say, who in the heavens above shone forth as the only-begotten, without mother, from out His Father’s substance, and preserved the virginity of His natural unity undivided and inseparable; and who on earth, in the virgin’s nuptial chamber, joined to Himself the nature of Adam, like a bridegroom, by an inalienable union, and preserved His mother’s purity uncorrupt and uninjured—Him, in short, who in heaven was begotten without corruption, and on earth brought forth in a manner quite unspeakable. But to return to our subject." },
  { t = "note", id = "3006", text = "2 Sam. vi. 14." },
  { t = "note", id = "3007", text = "Hab. iii. 3." },
  { t = "note", id = "3008", text = "Exod. xv. 2." },
  { t = "note", id = "3009", text = "ὑποτίτθιον τυγχάνοντα. It is an aggravation, so to speak, that He not only willed to become an infant, and to take upon Him, of necessity, the infirmities of infancy, but even at that tender age to be banished from His country, and to make a forcible change of residence, μέτοικος γενέσθαν. μέτοικοι are those who, at the command of their princes, are transferred, by way of punishment, to another State. Their lands are confiscated. They are sometimes called ἀνάσπαστοι. Like to the condition of these was that of Jesus, who fled into Egypt soon after His birth. For the condition of the μέτοικοι at Athens, see Art. *Smith’s Dict. Antiq.*—Tr." },
  { t = "note", id = "3010", text = "Exod. xxxi. 19." },
  { t = "note", id = "3011", text = "Rom. xi. 33." },
  { t = "note", id = "3012", text = "Luke xi. 24." },
  { t = "note", id = "3013", text = "Isa. lxvi. 7." },
  { t = "p", text = "IV. Therefore the prophet brought the virgin from Nazareth, in order that she might give birth at Bethlehem to her salvation-bestowing child, and brought her back again to Nazareth, in order to make manifest to the world the hope of life. Hence it was that the ark of God removed from the inn at Bethlehem, for there He paid to the law that debt of the forty days, due not to justice but to grace, and rested upon the mountains of Sion, and receiving into His pure bosom as upon a lofty throne, and one transcending the nature of man, the Monarch of all,[^3014] she presented Him there to God the Father, as the joint-partner of His throne and inseparable from His nature, together with that pure and undefiled flesh which he had of her substance assumed. The holy mother goes up to the temple to exhibit to the law a new and strange wonder, even that child long expected, who opened the virgin’s womb, and yet did not burst the barriers of virginity; that child, superior to the law, who yet fulfilled the law; that child that was at once before the law, and yet after it; that child, in short, who was of her incarnate beyond the law of nature.[^3015] For in other cases every womb being first opened by connection with a man, and, being impregnated by his seed, receives the beginning of conception, and by the pangs which make perfect parturition, doth at length bring forth to light its offspring endowed with reason, and with its nature consistent, in accordance with the wise provision of God its Creator. For God said, “Be fruitful, and multiply, and replenish the earth.” But the womb of this virgin, without being opened before, or being impregnated with seed, gave birth to an offspring that transcended nature, while at the same time it was cognate to it, and that without detriment to the indivisible unity, so that the miracle was the more stupendous, the prerogative of virginity likewise remaining intact. She goes up, therefore to the temple, she who was more exalted than the temple, clothed with a double glory—the glory, I say, of undefiled virginity, and that of ineffable fecundity, the benediction of the law, and the sanctification of grace. Wherefore he says who saw it: “And the whole house was full of His glory, and the seraphim stood round about him; and one cried unto another, and said, Holy, holy, holy, is the Lord of hosts: the whole earth is full of His glory.”[^3016] As also the blessed prophet Habakkuk has charmingly sung, saying, “In the midst of two living creatures thou shalt be known: as the years draw nigh thou shalt be recognised—when the time is come thou shalt be shown forth.”[^3017] See, I pray you, the exceeding accuracy of the Spirit. He speaks of knowledge, recognition, showing forth. As to the first of these: “In the midst of two living creatures thou shalt be known,”[^3018] he refers to that overshadowing of the divine glory which, in the time of the law, rested in the Holy of holies upon the covering of the ark, between the typical cherubim, as He says to Moses, “There will I be known to thee.”[^3019] But He refers likewise to that concourse of angels, which hath now come to meet us, by the divine and ever adorable manifestation of the Saviour Himself in the flesh, although He in His very nature cannot be beheld by us, as Isaiah has even before declared. But when He says, “As the years draw nigh, thou shalt be recognised,” He means, as has been said before, that glorious recognition of our Saviour, God in the flesh, who is otherwise invisible to mortal eye; as somewhere Paul, that great interpreter of sacred mysteries, says: “But when the fulness of the time was come, God sent forth His Son, made of a woman, made under the law, to redeem them that were under the law, that we might receive the adoption of sons.”[^3020] And then, as to that which is subjoined, “When the time is come, Thou shalt be shown forth,” what exposition doth this require, if a man diligently direct the eye of his mind to the festival which we are now celebrating? “For then shalt Thou be shown forth,” He says, “as upon a kingly charger, by Thy pure and chaste mother, in the temple, and that in the grace and beauty of the flesh assumed by Thee.” All these things the prophet, summing up for the sake of greater clearness, exclaims in brief: “The Lord is in His holy temple;”[^3021] “Fear before Him all the earth.”[^3022]" },
  { t = "note", id = "3014", text = "*Cf.* Luke ii. 22." },
  { t = "note", id = "3015", text = "[Here seems to me a deep and true insight regarding the scriptural topics and events touched upon.]" },
  { t = "note", id = "3016", text = "Isa. vi. 3." },
  { t = "note", id = "3017", text = "The quotation from the prophet Habakkuk is from the LXX. version.—Tr." },
  { t = "note", id = "3018", text = "Hab. iii. 2." },
  { t = "note", id = "3019", text = "Exod. xxv. 22." },
  { t = "note", id = "3020", text = "Gal. iv. 4, 5." },
  { t = "note", id = "3021", text = "Hab. ii. 20." },
  { t = "note", id = "3022", text = "Ps. xcvi. 9." },
  { t = "p", text = "V. Tremendous, verily, is the mystery connected with thee, O virgin mother, thou spiritual throne, glorified and made worthy of God.[^3023] Thou hast brought forth, before the eyes of those in heaven and earth, a pre-eminent wonder. And it is a proof of this, and an irrefragable argument, that at the novelty of thy supernatural child-bearing, the angels sang on earth, “Glory to God in the highest, and on earth peace, good-will towards men,”[^3024] by their threefold song bringing in a threefold holiness.[^3025] Blessed art thou among the generations of women, O thou of God most blessed, for by thee the earth has been filled with that divine glory of God; as in the Psalms it is sung: “Blessed be the Lord God of Israel, and the whole earth shall be filled with His glory. Amen. Amen.”[^3026] And the posts of the door, says the prophet, moved at the voice of him that cried, by which is signified the veil of the temple drawn before the ark of the covenant, which typified thee, that the truth might be laid open to me, and also that I might be taught, by the types and figures which went before, to approach with reverence and trembling to do honour to the sacred mystery which is connected with thee; and that by means of this prior shadow-painting of the law I might be restrained from boldly and irreverently contemplating with fixed gaze Him who, in His incomprehensibility, is seated far above all.[^3027] For if to the ark, which was the image and type of thy sanctity, such honour was paid of God that to no one but to the priestly order only was the access to it open, or ingress allowed to behold it, the veil separating it off, and keeping the vestibule as that of a queen, what, and what sort of veneration is due to thee from us who are of creation the least, to thee who art indeed a queen; to thee, the living ark of God, the Lawgiver; to thee, the heaven that contains Him who can be contained of none? For since thou, O holy virgin,[^3028] hast dawned as a bright day upon the world and hast brought forth the Sun of Righteousness, that hateful horror of darkness has been chased away; the power of the tyrant has been broken, death hath been destroyed, hell swallowed up, and all enmity dissolved before the face of peace; noxious diseases depart now that salvation looks forth; and the whole universe has been filled with the pure and clear light of truth. To which things Solomon alludes in the Book of Canticles, and begins thus: “My beloved is mine, and I am his; he feedeth among the lilies until the day break, and the shadows flee away.”[^3029] Since then, the God of gods hath appeared in Sion, and the splendour of His beauty hath appeared in Jerusalem; and “a light has sprung up for the righteous, and joy for those who are true of heart.”[^3030] According to the blessed David, the Perfecter and Lord of the perfected[^3031] hath, by the Holy Spirit, called the teacher and minister of the law to minister and testify of those things which were done." },
  { t = "note", id = "3023", text = "[Note “*made* worthy;” so “found grace” and “*my* Saviour,” in St. Luke. Hence not immaculate by nature.]" },
  { t = "note", id = "3024", text = "Luke ii. 14." },
  { t = "note", id = "3025", text = "τὸν τῆιπλασιασμὸν τὴς ἁγιότητος, Pantinus translates *triplicem sanctitatis rationem*, but this is hardly theological. Allusion is made to the song of the seraphim, Isa. vi.; and our author contends that the threefold hymn sung by the angels at Christ’s birth answers to that threefold acclamation of theirs in sign of the triune Deity.—Tr." },
  { t = "note", id = "3026", text = "Ps. lxxii. 18, 19." },
  { t = "note", id = "3027", text = "τὸν τὰ πάντα ἐν ἀκαταληψίᾳ ὑπεριδρυμένον. *Cf.* 1 Tim. vi. 16, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται.—Tr." },
  { t = "note", id = "3028", text = "[This *apostrophe* is not prayer nor worship. (See sec. xiv., *infra.*) It may be made by any orator. See Burgon’s pertinent references to Legh Richmond and Bishop Horne, *Lett. from Rome*, pp. 237, 238.]" },
  { t = "note", id = "3029", text = "Cant. ii. 16, 17." },
  { t = "note", id = "3030", text = "Ps. xcvii. 11." },
  { t = "note", id = "3031", text = "ὁ τῶν τελουμένων τελειωτής, initiator, consummator. διὰ τοῦ Πνεύματος ἁγίου is to be referred to συνεκάλεσεν, rather than to τῶν πραττομένων .—Tr." },
  { t = "p", text = "VI. Hence the aged Simeon, putting off the weakness of the flesh, and putting on the strength of hope, in the face of the law hastened to receive the Minister of the law, the Teacher[^3032] with authority, the God of Abraham, the Protector of Isaac, the Holy One of Israel, the Instructor of Moses; Him, I say, who promised to show him His divine incarnation, as it were His hinder parts;[^3033] Him who, in the midst of poverty, was rich; Him who in infancy was before the ages; Him who, though seen, was invisible; Him who in comprehension was incomprehensible; Him who, though in littleness, yet surpassed all magnitude—at one and the same time in the temple and in the highest heavens—on a royal throne, and on the chariot of the cherubim Him who is both above and below continuously; Him who is in the form of a servant, and in the form of God the Father; a subject, and yet King of all. He was entirely given up to desire, to hope, to joy; he was no longer his own, but His who had been looked for. The Holy Spirit had announced to him the joyful tidings, and before he reached the temple, carried aloft by the eyes of his understanding, as if even now he possessed what he had longed for, he exulted with joy. Being thus led on, and in his haste treading the air with his steps, he reaches the shrine hitherto held sacred; but, not heeding the temple, he stretches out his holy arms to the Ruler of the temple, chanting forth in song such strains as become the joyous occasion: I long for Thee, O Lord God of my fathers, and Lord of mercy, who hast deigned, of Thine own glory and goodness, which provides for all, of Thy gracious condescension, with which Thou inclinest towards us, as a Mediator bringing peace, to establish harmony between earth and heaven. I seek Thee, the Great Author of all. With longing I expect Thee who, with Thy word, embracest all things. I wait for Thee, the Lord of life and death. For Thee I look, the Giver of the law, and the Successor of the law. I hunger for Thee, who quickenest the dead; I thirst for Thee, who refreshest the weary; I desire Thee, the Creator and Redeemer of the world.[^3034] Thou art our God, and Thee we adore; Thou art our holy Temple, and in Thee we pray; Thou art our Lawgiver, and Thee we obey; Thou art God of all things the First. Before Thee was no other god begotten of God the Father; neither after Thee shall there be any other son consubstantial and of one glory with the Father. And to know Thee is perfect righteousness, and to know Thy power is the root of immortality.[^3035] Thou art He who, for our salvation, was made the head stone of the corner, precious and honourable, declared before to Sion.[^3036] For all things are placed under Thee as their Cause and Author, as He who brought all things into being out of nothing, and gave to what was unstable a firm coherence; as the connecting Band and Preserver of that which has been brought into being; as the Framer of things by nature different; as He who, with wise and steady hand, holds the helm of the universe; as the very Principle of all good order; as the irrefragable Bond of concord and peace. For in Thee we live, and move, and have our being.[^3037] Wherefore, O Lord my God, I will glorify Thee, I will praise Thy name; for Thou hast done wonderful things; Thy counsels of old are faithfulness and truth; Thou art clothed with majesty and honour.[^3038] For what is more splendid for a king than a purple robe embroidered around with flowers, and a shining diadem? Or what for God, who delights in man, is more magnificent than this merciful assumption of the manhood, illuminating with its resplendent rays those who sit in darkness and the shadow of death?[^3039] Fitly did that temporal king and Thy servant once sing of Thee as the King Eternal, saying, Thou art fairer than the children of men, who amongst men art very God and man.[^3040] For Thou hast girt, by Thy incarnation, Thy loins with righteousness, and anointed Thy veins with faithfulness, who Thyself art very righteousness and truth, the joy and exultation of all.[^3041] Therefore rejoice with me this day, ye heavens, for the Lord hath showed mercy to His people. Yea, let the clouds drop the dew of righteousness upon the world; let the foundations of the earth sound a trumpet-blast to those in Hades, for the resurrection of them that sleep is come.[^3042] Let the earth also cause compassion to spring up to its inhabitants; for I am filled with comfort; I am exceeding joyful since I have seen Thee, the Saviour of men.[^3043]" },
  { t = "note", id = "3032", text = "τὸν αὐθέντην διδάσκαλον. The allusion is to Mark i. 22." },

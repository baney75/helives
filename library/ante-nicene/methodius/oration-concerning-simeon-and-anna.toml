[[section]]
id = "oration-concerning-simeon-and-anna-on-the"
title = "Oration Concerning Simeon and Anna On the Day that They Met in the Temple."
level = 1
blocks = [
  { t = "p", text = "On the Day that They Met in the Temple.[^2986]" },
  { t = "note", id = "2986", text = "The oration likewise treats of the Holy *Theotocos.* [Published by Pantinus, 1598, and obviously corrupt. Dupin states that it is “not mentioned by the ancients, nor even by Photius.” The style resembles that of Methodius in many places.]" },
  { t = "p", text = "I. Although I have before, as briefly as possible, in my dialogue on chastity, sufficiently laid the foundations, as it were, for a discourse on virginity, yet to-day the season has brought forward the entire subject of the glory of virginity, and its incorruptible crown, for the delightful consideration of the Church’s foster-children. For to-day the council chamber of the divine oracles is opened wide, and the signs prefiguring this glorious day, with its effects and issues, are by the sacred preachers read over to the assembled Church. Today the accomplishment of that ancient and true counsel is, in fact and deed, gloriously manifested to the world. Today, without any covering,[^2987] and with unveiled face, we see, as in a mirror, the glory of the Lord, and the majesty of the divine ark itself. To-day, the most holy assembly, bearing upon its shoulders the heavenly joy that was for generations expected, imparts it to the race of man. “Old things are passed away”[^2988]—things new burst forth into flowers, and such as fade not away. No longer does the stern decree of the law bear sway, but the grace of the Lord reigneth, drawing all men to itself by saving long-suffering. No second time is an Uzziah[^2989] invisibly punished, for daring to touch what may not be touched; for God Himself invites, and who will stand hesitating with fear? He says: “Come unto Me, all ye that labour and are heavy laden.”[^2990] Who, then, will not run to Him? Let no Jew contradict the truth, looking at the type which went before the house of Obededom.[^2991] The Lord has “*manifestly come to His own*.”[^2992] And sitting on a living and not inanimate ark, as upon the mercy-seat, He comes forth in solemn procession upon the earth. The publican, when he touches this ark, comes away just; the harlot, when she approaches this, is remoulded, as it were, and becomes chaste; the leper, when he touches this, is restored whole without pain. It repulses none; it shrinks from none; it imparts the gifts of healing, without itself contracting any disease; for the Lord, who loves and cares for man, in it makes His resting-place. These are the gifts of this new grace. This is that new and strange thing that has happened under the sun[^2993]—a thing that never had place before, nor will have place again. That which God of His compassion toward us foreordained has come to pass, He hath given it fulfilment because of that love for man which is so becoming to Him. With good right, therefore, has the sacred trumpet sounded, “Old things are passed away, behold all things are become new.”[^2994] And what shall I conceive, what shall I speak worthy of this day? I am struggling to reach the inaccessible, for the remembrance of this holy virgin far transcends all words of mine. Wherefore, since the greatness of the panegyric required completely puts to shame our limited powers, let us betake ourselves to that hymn which is not beyond our faculties, and boasting in our own[^2995] unalterable defeat, let us join the rejoicing chorus of Christ’s flock, who are keeping holy-day. And do you, my divine and saintly auditors, keep strict silence, in order that through the narrow channel of ears, as into the harbour of the understanding, the vessel freighted with truth may peacefully sail. We keep festival, not according to the vain customs of the Greek mythology; we keep a feast which brings with it no ridiculous or frenzied banqueting[^2996] of the gods, but which teaches us the wondrous condescension to us men of the awful glory of Him who is God over all.[^2997]" },
  { t = "note", id = "2987", text = "2 Cor. iii. 18." },

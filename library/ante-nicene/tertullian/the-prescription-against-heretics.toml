[[section]]
id = "introduction-by-the-american-editor"
title = "Introduction, by the American Editor."
level = 1
blocks = [
  { t = "p", text = "The Second Class of Tertullian’s works, according to the logical method I have endeavoured to carry out, is that which includes his treatises against the heresies of his times. In these, the genius of our author is brilliantly illustrated, while, in melancholy fact, he is demonstrating the folly of his own final lapse and the wickedness of that schism and heresy into which he fell away from Truth. Were it not that history abounds in like examples of the frailty of the human intellect and of the insufficiency of “man that walketh to direct his steps,” we should be forced to a theory of mental decay to account for inconsistencies so gross and for delusions so besotted. “Genius to madness is *indeed* allied,” and who knows but something like that imbecility which closed the career of Swift[^1846] may have been the fate of this splendid wit and versatile man of parts? Charity, admiration and love force this inquiry upon my own mind continually, as I explore his fascinating pages. And the order in which the student will find them in this series, will lead, I think, to similar reflections on the part of many readers. We observe a natural bent and turn of mind, even in his Catholic writings, which indicate his perils. These are more and more apparent in his recent works, as his enthusiasm heats itself into a frenzy which at last becomes a rage. He breaks down by degrees, as in orthodoxy so also in force and in character. It is almost like the collapse of Solomon or of Bacon. And though our own times have produced no example of stars of equal magnitude, to become falling-stars, we have seen illustrations the most humiliating, of those calm words of Bishop Kaye: “Human nature often presents the curious phenomenon of an union of the most opposite qualities in the same mind; of vigour, acuteness and discrimination on some subjects, with imbecility, dulness and bigotry on others.” Milton, himself another example of his own threnode, breaks forth in this splendid utterance of lyrical confession:" },
  { t = "note", id = "1846", text = "“From Marlboro’s eyes the tears of dotage flow, And Swift expires a driveller and a show.”" },
  { t = "p", text = "“God of our fathers what is man?" },
  { t = "p", text = "Nor do I name of men the common rout," },
  { t = "p", text = "That, wandering loose about," },
  { t = "p", text = "Grow up and perish as the summer fly," },
  { t = "p", text = "Heads without name, no more remembered," },
  { t = "p", text = "But such as thou hast solemnly elected," },
  { t = "p", text = "With gifts and graces eminently adorned," },
  { t = "p", text = "To some great work, thy glory" },
  { t = "p", text = "And people’s safety, *which in part they effect*.”" },
  { t = "p", text = "And here, I must venture a remark on the ambiguity of the expressions concerning our author’s Montanism. In the treatise against Marcion, written late in his career, Tertullian identifies himself with the Church and strenuously defends its faith and its apostolic order. In only rare instances does his weakness for the “new prophecy” crop out, and then, it is only as one identifies himself with a school within the church. Precisely so Fenelon maintained his milder Montanism, without a thought of deserting the Latin Church. Afterwards Fenelon drew back, but at last poor Tertullian fell away. So with the Jansenists. They credited the *miracles* and the *convulsions* (or ecstasies) of their school,[^1847] and condemned those who rejected them, as Tertullian condemns the *Psychics*. The great expounder of the Nicene Faith (Bp. Bull) does indeed speak very decidedly of Tertullian as a *lapser*, even when he wrote his first book against Marcion. His semi-schismatic position must be allowed. But, was it a *formal* lapse at that time? The English non-jurors were long in communion with the Church, even while they denounced their brethren and the “Erastianizing” clergy, much as Tertullian does the *Psychics*. St. Augustine speaks of *Tertullianists*[^1848] with great moderation, and notes the final downfall of our author as something distinct from Tertullianism. When we reflect, therefore, that only four of all his varied writings (now extant) are proofs of an accomplished lapse, ought we not carefully to maintain the distinction between the Montanistic Tertullian and Tertullian the Montanist? Bishop Bull, it seems to me would not object to this way of putting it, when we consider his own discrimination in the following weighty words. He says:" },
  { t = "note", id = "1847", text = "See the story of the Abbé Paris, Guettée, *Histoire de L’Eglise de France*, Tom. xii. p. 12. Also, Parton, *Voltaire*, Vol. I. pp. 236, 261, etc." },
  { t = "note", id = "1848", text = "See opp. Tom. viii. p. 46, Ed. Migne." },
  { t = "p", text = "“A clear distinction must be made between those works which Tertullian, when already a Montanist, wrote specifically in defence of Montanism *against the church*, and those which he composed, as a Montanist indeed, yet *not in defence of Montanism against the church*, but rather, *in defence of the common doctrines of the church*—and of Montanus, in opposition to other heretics.”" },
  { t = "p", text = "Now in arranging the works of this second class, *the Prescription* comes logically first, because, written in Orthodoxy, it forcibly upholds the Scriptural Rule of Faith, the Catholic touchstone of all professed verity. It is also a necessary Introduction to the great work against Marcion which I have placed next in order; giving it the precedence to which it is entitled in part on chronological ground, in part because of the general purity of its material with the exhibition it presents of the author’s mental processes and of his very gradual decline from Truth." },
  { t = "p", text = "Very fortunate were the Edinburgh Editors in securing for this work and some others, the valuable labours of Dr. Holmes, of whom I have elsewhere given some biographical particulars. The merit and fulness of his annotations are so marked, that I have been spared a great deal of work, such as I was forced to bestow on the former volumes of this American Edition. But on the other hand these pages have given me much patient study and toil as an editor, because of the “shreds and patches” in which Tertullian comes to us, in the Edinburgh Series; and because of some typographical peculiarities, exceptional in that Series itself, and presenting complications, when transferred to a new form of mechanical arrangement. For example, apart from some valuable material which belongs to the General Preface, and which I have transferred accordingly, the following dislocations confronted me to begin with: The *Marcion* is presented to us in Volume VII. apart from the other writings of Tertullian. At the close of Vol. XI. we reach the *Ad Nationes*, of which Dr. Holmes is the translator, another hand (Mr. Thelwall’s) having been employed on former pages of that volume. It is not till we reach Volume XV. that Tertullian again appears, but this volume is wholly the work of Dr. Holmes. Finally, in Volume XVIII., we meet Tertullian again, (Mr. Thelwall the able translator), but, here is placed the “Introduction” to all the works of Tertullian, which, of course, I have, transferred to its proper place. I make these explanations by no means censoriously, but to point out at once the nature of my own task, and the advantage that accrues to the reader, by the order in which the works of the great Tertullian appear in this edition, enabling him to compare different or parallel passages, all methodically arranged in consecutive pages, without a minute’s search, or delay." },
  { t = "p", text = "Now, as to typographical difficulties to which I have referred, Dr. Holmes marks all his multiplied and useful notes with *brackets*, which are almost always superfluous, and which in this American Edition are used to designate my own contributions, when printed with the text, or apart from Preface and Elucidations. These, therefore, I have removed necessarily and with no appreciable loss to the work, but great gain to the beauty of the page. But, again, Dr. Holmes’ translations are all so heavily bracketed as to become an eyesore, and the disfigured pages have been often complained of as afflictive to the reader. Many words strictly implied by the original Latin, and which should therefore be unmarked, are yet put between brackets. Even minute words (*and*, or *to wit*, or *again*,) when, in the nature of the case the English idiom requires them, are thus marked. I have not retained these blemishes; but when an inconsiderable word or a repetition does add to the sense, or qualify it, I have italicized such words, throwing more important interpolations into parenthetical marks, which are less painful to the sight than brackets. I have found them quite as serviceable to denote the auxiliary word or phrase; and where the author himself uses a parenthesis, I have observed very few instances in which a sensible reader would confound it with the translator’s efforts to eke out the sense. Sometimes, an awkward interpolation has been thrown into a footnote. Occasionally the crabbed sentences of the great Carthaginian are so obscure that Dr. Holmes has been unable to make them lucid, although, with the original in hand, he probably felt a force in his own rendering which the mere English reader must fail to perceive. In a few such instances, noting the fact in the margin, I have tried to bring out the sense, by slight modifications of punctuation and arrangement. Occasionally too I have dropped a superfluous interpolation (such as *e.g.*, *to conclude*, or let me say again,) when I have found that it only served to clog and overcharge a sentence. Last of all, Dr. Holmes’ *headings* have sometimes been condensed, to avoid phrases and sentences immediately recurring in the chapter.[^1849] These purely mechanical parts require a terse form of statement, like those in the English Bible, and I have frequently reduced them on that model, dropping redundant adverbs and adjectives to bring out the catchwords." },
  { t = "note", id = "1849", text = "Take e.g. the heading to chapter xxiv. of the *De Præscriptione*. It reads thus: “*St. Peter’s further vindication. St. Paul was not at all superior to St. Peter in teaching. Nothing was imparted to the former, in the “third heaven,” to enable him to add to the faith—however foolishly the heretics may boast of him as if they had, forsooth, been favoured with some of the secrets so imparted to him in paradise.*” If the reader will turn to the chapter referred to, he will observe an instance of condensation by which nothing is forfeited that is requisite to a *heading*, though redundancies are dropped." },
]

[[section]]
id = "chapter-1"
title = "Chapter I. Introductory. Heresies Must Exist, and Even Abound; They are a Probation to Faith."
level = 1
blocks = [
  { t = "p", text = "The Prescription Against Heretics.[^1850]" },
  { t = "note", id = "1850", text = "Of the various forms of the title of this treatise, *de Præscriptione Hæreticorum,* *de Præscriptionibus Hæreticorum,* *de Præscriptionibus adversus Hæreticos*, the first is adopted by Oehler after the oldest authorities, such as the Liber Argobardinus and the Codex Paterniacensis (or Seletstadiensis), and the Editio Princeps of Rhenanus. The term *præscriptio* is a legal one, meaning a *demurrer*, or formal objection. The genitive *hæreticorum* is used in an objective sense, as if *adversus hæreticos*. Tertullian himself, in *de Carne Christi*, ii. says, “Sed plenius ejusmodi præscriptionibus adversus omnes hæreses alibi jam usi sumus.” The title therefore means, “On the Church’s Prescriptive Rule against Heresies of all kinds.” [Elucidation I.]" },
  { t = "h", text = "[Translated by the Rev. Peter Holmes, D.D., F.R.A.S., Etc., Etc.]" },
  { t = "p", text = "Chapter I.—Introductory. Heresies Must Exist, and Even Abound; They are a Probation to Faith." },
  { t = "p", text = "The character of the times in which we live is such as to call forth from us even this admonition, that we ought not to be astonished at the heresies (which abound)[^1851] neither ought their existence to surprise us, for it was foretold that they should come to pass;[^1852] nor the fact that they subvert the faith of some, for their final cause is, by affording a trial to faith, to give it also the opportunity of being “approved.”[^1853] Groundless, therefore, and inconsiderate is the offence of the many[^1854] who are scandalized by the very fact that heresies prevail to such a degree. How great (might their offence have been) if they had not existed.[^1855] When it has been determined that a thing must by all means be, it receives the (final) cause for which it has its being. This secures the power through which it exists, in such a way that it is impossible for it not to have existence." },
  { t = "note", id = "1851", text = "Istas." },
  { t = "note", id = "1852", text = "Matt. vii. 15; xxiv. 4, 11, 24; 1 Tim. iv. 1–3; 2 Pet. ii. 1." },
  { t = "note", id = "1853", text = "1 Cor. xi. 19." },
  { t = "note", id = "1854", text = "Plerique, “the majority.”" },
  { t = "note", id = "1855", text = "The Holy Ghost having foretold that they should exist. (Rigalt.)" },
]

[[section]]
id = "analogy-between-fevers-and-heresies-heresies-not"
title = "Analogy Between Fevers and Heresies. Heresies Not to Be Wondered At: Their Strength Derived from Weakness of Men's Faith. They Have Not the Truth. Simile of Pugilists and Gladiators in Illustration."
level = 1
blocks = [
  { t = "p", text = "Chapter II.—Analogy Between Fevers and Heresies. Heresies Not to Be Wondered At: Their Strength Derived from Weakness of Men’s Faith. They Have Not the Truth. Simile of Pugilists and Gladiators in Illustration." },
  { t = "p", text = "Taking the similar case[^1856] of fever, which is appointed a place amongst all other deadly and excruciating issues (of life) for destroying man: we are not surprised either that it exists, for there it is, or that it consumes man, for that is the purpose of its existence. In like manner, with respect to heresies, which are produced for the weakening and the extinction of faith, since we feel a dread because they have this power, we should first dread the fact of their existence; for as long as they exist, they have their power; and as long as they have their power, they have their existence. But still fever, as being an evil both in its cause[^1857] and in its power, as all know, we rather loathe than wonder at, and to the best of our power guard against, not having its extirpation in our power. Some men prefer wondering at heresies, however, which bring with them eternal death and the heat of a stronger fire, for possessing this power, instead of avoiding their power when they have the means of escape: but heresies would have no power, if (men) would cease to wonder that they have such power. For it either happens that, while men wonder, they fall into a snare, or, because they are ensnared, they cherish their surprise, as if heresies were so powerful because of some truth which belonged to them. It would no doubt be a wonderful thing that evil should have any force of its own, were it not that heresies are strong in those persons who are not strong in faith. In a combat of boxers and gladiators, generally speaking, it is not because a man is strong that he gains the victory, or loses it because he is not strong, but because he who is vanquished was a man of no strength; and indeed this very conqueror, when afterwards matched against a really powerful man, actually retires crest-fallen from the contest. In precisely the same way, heresies derive such strength as they have from the infirmities of individuals—having no strength whenever they encounter a really powerful faith." },
  { t = "note", id = "1856", text = "Denique has in Tertullian sometimes the meaning of *proinde*." },
  { t = "note", id = "1857", text = "Causam “purpose,” “final cause.”" },
]

[[section]]
id = "weak-people-fall-an-easy-prey-to"
title = "Weak People Fall an Easy Prey to Heresy, Which Derives Strength from the General Frailty of Mankind. Eminent Men Have Fallen from Faith; Saul, David, Solomon. The Constancy of Christ."
level = 1
blocks = [
  { t = "p", text = "Chapter III.—Weak People Fall an Easy Prey to Heresy, Which Derives Strength from the General Frailty of Mankind. Eminent Men Have Fallen from Faith; Saul, David, Solomon. The Constancy of Christ." },
  { t = "p", text = "It is usual, indeed, with persons of a weaker character, to be so built up (in confidence) by certain individuals who are caught by heresy, as to topple over into ruin themselves. How comes it to pass, (they ask), that this woman or that man, who were the most faithful, the most prudent, and the most approved[^1858] in the church, have gone over to the other side? Who that asks such a question does not in fact reply to it himself, to the effect that men whom heresies have been able to pervert[^1859] ought never to have been esteemed prudent, or faithful, or approved? This again is, I suppose, an extraordinary thing, that one who has been approved should afterwards fall back? Saul, who was good beyond all others, is afterwards subverted by envy.[^1860] David, a good man “after the Lord’s own heart,”[^1861] is guilty afterwards of murder and adultery.[^1862] Solomon, endowed by the Lord with all grace and wisdom, is led into idolatry, by women.[^1863] For to the Son of God alone was it reserved to persevere to the last without sin.[^1864] But what if a bishop, if a deacon, if a widow, if a virgin, if a doctor, if even a martyr,[^1865] have fallen from the rule (of faith), will heresies on that account appear to possess[^1866] the truth? Do we prove the faith[^1867] by the persons, or the persons by the faith? No one is wise, no one is faithful, no one excels in dignity,[^1868] but the Christian; and no one is a Christian but he who perseveres even to the end.[^1869] You, as a man, know any other man from the outside appearance. You think as you see. And you see as far only as you have eyes. But says (the Scripture), “the eyes of the Lord are lofty.”[^1870] “Man looketh at the outward appearance, but God looketh at the heart.”[^1871] “The Lord (beholdeth and) knoweth them that are His;”[^1872] and “the plant which (my heavenly Father) hath not planted, He rooteth up;”[^1873] and “the first shall,” as He shows, “be last;”[^1874] and He carries “His fan in His hand to purge His threshing-floor.”[^1875] Let the chaff of a fickle faith fly off as much as it will at every blast of temptation, all the purer will be that heap of corn which shall be laid up in the garner of the Lord. Did not certain of the disciples turn back from the Lord Himself,[^1876] when they were offended? Yet the rest did not therefore think that they must turn away from following Him,[^1877] but because they knew that He was the Word of Life, and was come from God,[^1878] they continued in His company to the very last, after He had gently inquired of them whether they also would go away.[^1879] It is a comparatively small thing,[^1880] that certain men, like Phygellus, and Hermogenes, and Philetus, and Hymenæus, deserted His apostle:[^1881] the betrayer of Christ was himself one of the apostles. We are surprised at seeing His churches forsaken by some men, although the things which we suffer after the example of Christ Himself, show us to be Christians. “They went out from us,” says (St. John,) “but they were not of us. If they had been of us, they would no doubt have continued with us.”[^1882]" },
  { t = "note", id = "1858", text = "Usitatissimi, “most experienced.”" },
  { t = "note", id = "1859", text = "Demutare." },
  { t = "note", id = "1860", text = "1 Sam. xviii. 8, 9." },

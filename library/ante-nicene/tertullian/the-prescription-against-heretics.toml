[[section]]
id = "the-apostles-not-ignorant-the-heretical-pretence"
title = "The Apostles Not Ignorant. The Heretical Pretence of St. Peter's Imperfection Because He Was Rebuked by St. Paul. St. Peter Not Rebuked for Error in Teaching."
level = 1
blocks = [
  { t = "p", text = "Chapter XXIII.—The Apostles Not Ignorant. The Heretical Pretence of St. Peter’s Imperfection Because He Was Rebuked by St. Paul. St. Peter Not Rebuked for Error in Teaching." },
  { t = "p", text = "Now, with the view of branding[^2091] the apostles with some mark of ignorance, they put forth the case of Peter and them that were with him having been rebuked by Paul. “Something therefore,” they say, “was wanting in them.” (This they allege,) in order that they may from this construct that other position of theirs, that a fuller knowledge may possibly have afterwards come over (the apostles,) such as fell to the share of Paul when he rebuked those who preceded him. I may here say to those who reject *The Acts of the Apostles*: “It is first necessary that you show us who this Paul was,—both what he was before he was an apostle, and how he became an apostle,”—so very great is the use which they make of him in respect of other questions also. It is true that he tells us himself that he was a persecutor before he became an apostle,[^2092] still this is not enough for any man who examines before he believes, since even the Lord Himself did not bear witness of Himself.[^2093] But let them believe without the Scriptures, if their object is to believe contrary to the Scriptures.[^2094] Still they should show, from the circumstance which they allege of Peter’s being rebuked by Paul, that Paul added yet another form of the gospel besides that which Peter and the rest had previously set forth. But the fact is,[^2095] having been converted from a persecutor to a preacher, he is introduced as one of the brethren to brethren, by brethren—to them, indeed, by men who had put on faith from the apostles’ hands. Afterwards, as he himself narrates, he “went up to Jerusalem for the purpose of seeing Peter,”[^2096] because of his office, no doubt,[^2097] and by right of a common belief and preaching. Now they certainly would not have been surprised at his having become a preacher instead of a persecutor, if his preaching were of something contrary; nor, moreover, would they have “glorified the Lord,”[^2098] because Paul had presented himself as an adversary to Him. They accordingly even gave him “the right hand of fellowship,”[^2099] as a sign of their agreement with him, and arranged amongst themselves a distribution of office, not a diversity of gospel, so that they should severally preach not a different gospel, but (the same), to different persons,[^2100] Peter to the circumcision, Paul to the Gentiles. Forasmuch, then, as Peter was rebuked because, after he had lived with the Gentiles, he proceeded to separate himself from their company out of respect for persons, the fault surely was one of conversation, not of preaching.[^2101] For it does not appear from this, that any other God than the Creator, or any other Christ than (the son) of Mary, or any other hope than the resurrection, was (by him) announced." },
  { t = "note", id = "2091", text = "Suggillandam." },
  { t = "note", id = "2092", text = "Gal. i. 13." },
  { t = "note", id = "2093", text = "John v. 31." },
  { t = "note", id = "2094", text = "Ut credunt contra Scripturas." },
  { t = "note", id = "2095", text = "Atquin." },
  { t = "note", id = "2096", text = "Gal. i. 18." },
  { t = "note", id = "2097", text = "Scilicet." },
  { t = "note", id = "2098", text = "Gal. i. 24." },
  { t = "note", id = "2099", text = "Gal. ii. 9." },
  { t = "note", id = "2100", text = "The same verse. [Note Peter’s restriction to Jews.]" },
  { t = "note", id = "2101", text = "Vers. 12, 13. See also *Anti-Marcion*, iv. 3 (*Trans*. p. 182)." },
]

[[section]]
id = "st-peter-s-further-vindication-st-paul"
title = "St. Peter's Further Vindication. St. Paul Not Superior to St. Peter in Teaching. Nothing Imparted to the Former in the Third Heaven Enabled Him to Add to the Faith. Heretics Boast as If Favoured with Some of the Secrets Imparted to Him."
level = 1
blocks = [
  { t = "p", text = "Chapter XXIV.—St. Peter’s Further Vindication. St. Paul Not Superior to St. Peter in Teaching. Nothing Imparted to the Former in the Third Heaven Enabled Him to Add to the Faith. Heretics Boast as If Favoured with Some of the Secrets Imparted to Him." },
  { t = "p", text = "I have not the good fortune,[^2102] or, as I must rather say,[^2103] I have not the unenviable task,[^2104] of setting apostles by the ears.[^2105] But, inasmuch as our very perverse cavillers obtrude the rebuke in question for the set purpose of bringing the earlier[^2106] doctrine into suspicion, I will put in a defence, as it were, for Peter, to the effect that even Paul said that he was “made all things to all men—to the Jews a Jew,” to those who were not Jews as one who was not a Jew—“that he might gain all.”[^2107] Therefore it was according to times and persons and causes that they used to censure certain practices, which they would not hesitate themselves to pursue, in like conformity to times and persons and causes. Just (*e.g.*) as if Peter too had censured Paul, because, whilst forbidding circumcision, he actually circumcised Timothy himself. Never mind[^2108] those who pass sentence on apostles! It is a happy fact that Peter is on the same level with Paul in the very glory[^2109] of martyrdom. Now, although Paul was carried away even to the third heaven, and was caught up to paradise,[^2110] and heard certain revelations there, yet these cannot possibly seem to have qualified him for (teaching) another doctrine, seeing that their very nature was such as to render them communicable to no human being.[^2111] If, however, that unspeakable mystery[^2112] did leak out,[^2113] and become known to any man, and if any heresy affirms that it does itself follow the same, (then) either Paul must be charged with having betrayed the secret, or some other man must actually[^2114] be shown to have been afterwards “caught up into paradise,” who had permission to speak out plainly what Paul was not allowed (even) to mutter." },
  { t = "note", id = "2102", text = "Non mihi tam bene est." },
  { t = "note", id = "2103", text = "Immo." },
  { t = "note", id = "2104", text = "Non mihi tam male est." },
  { t = "note", id = "2105", text = "Ut committam." },
  { t = "note", id = "2106", text = "Superiorem, “that which Peter had preached.”" },
  { t = "note", id = "2107", text = "1 Cor. ix. 20, 22." },
  { t = "note", id = "2108", text = "Viderint." },
  { t = "note", id = "2109", text = "Et in martyrio." },
  { t = "note", id = "2110", text = "2 Cor. xii. 4." },
  { t = "note", id = "2111", text = "Nulli hominum." },
  { t = "note", id = "2112", text = "Nescio quid illud." },
  { t = "note", id = "2113", text = "Emanavit." },
  { t = "note", id = "2114", text = "Et." },
]

[[section]]
id = "the-apostles-did-not-keep-back-any"
title = "The Apostles Did Not Keep Back Any of the Deposit of Doctrine Which Christ Had Entrusted to Them. St. Paul Openly Committed His Whole Doctrine to Timothy."
level = 1
blocks = [
  { t = "p", text = "Chapter XXV.—The Apostles Did Not Keep Back Any of the Deposit of Doctrine Which Christ Had Entrusted to Them. St. Paul Openly Committed His Whole Doctrine to Timothy." },
  { t = "p", text = "But here is, as we have said,[^2115] the same madness, in their allowing indeed that the apostles were ignorant of nothing, and preached not any (doctrines) which contradicted one another, but at the same time insisting that they did not reveal all to all men, for that they proclaimed some openly and to all the world, whilst they disclosed others (only) in secret and to a few, because Paul addressed even this expression to Timothy: “O Timothy, guard that which is entrusted to thee;”[^2116] and again: “That good thing which was committed unto thee keep.”[^2117] What is this deposit? Is it so secret as to be supposed to characterize[^2118] a new doctrine? or is it a part of that charge of which he says, “This charge I commit unto thee, son Timothy?”[^2119] and also of that precept of which he says, “I charge thee in the sight of God, who quickeneth all things, and before Jesus Christ who witnessed a good confession under Pontius Pilate, that thou keep this commandment?”[^2120] Now, what is (this) commandment and what is (this) charge? From the preceding and the succeeding contexts, it will be manifest that there is no mysterious[^2121] hint darkly suggested in this expression about (some) far-fetched[^2122] doctrine, but that a warning is rather given against receiving any other (doctrine) than that which *Timothy* had heard from himself, *as I take it* publicly: “Before many witnesses” is his phrase.[^2123] Now, if they refuse to allow that the church is meant by these “many witnesses,” it matters nothing, since nothing could have been secret which was produced “before many witnesses.” Nor, again, must the circumstance of his having wished him to “commit these things to faithful men, who should be able to teach others also,”[^2124] be construed into a proof of there being some occult gospel. For, when he says “these things,” he refers to the things of which he is writing at the moment. In reference, however, to occult subjects, he would have called them, as being absent, *those things*, not *these things*, to one who had a joint knowledge of them with himself.[^2125]" },
  { t = "note", id = "2115", text = "Above, in chap. xxii. [Note the Gnostic *madness* of such a plea. Kaye, p. 235 and Elucidation IV.]" },
  { t = "note", id = "2116", text = "1 Tim. vi. 20." },
  { t = "note", id = "2117", text = "2 Tim. i. 14." },
  { t = "note", id = "2118", text = "Ut alterius doctrinæ deputetur." },
  { t = "note", id = "2119", text = "1 Tim. i. 18." },
  { t = "note", id = "2120", text = "1 Tim. vi. 13." },
  { t = "note", id = "2121", text = "Nescis quid." },
  { t = "note", id = "2122", text = "Remotiore." },
  { t = "note", id = "2123", text = "2 Tim. ii. 2." },
  { t = "note", id = "2124", text = "2 Tim. ii. 2." },
  { t = "note", id = "2125", text = "Apud conscientiam. [Clement of Alexandria is to be interpreted by *Tertullian*, with whom he does not essentially differ. For Clement’s Esoteric Doctrine (See Vol. II. pp. 302, 313, etc.) is defined as *perfecting* the type of the Christian by the *strong meat* of Truth, of which *the entire deposit* is presupposed as common to all Christians. We must not blame Clement for the abuse of his teaching by perverters of Truth itself.]" },
]

[[section]]
id = "the-apostles-did-in-all-cases-teach"
title = "The Apostles Did in All Cases Teach the Whole Truth to the Whole Church. No Reservation, Nor Partial Communication to Favourite Friends."
level = 1
blocks = [
  { t = "p", text = "Chapter XXVI.—The Apostles Did in All Cases Teach the Whole Truth to the Whole Church. No Reservation, Nor Partial Communication to Favourite Friends." },
  { t = "p", text = "Besides which, it must have followed, that, for the man to whom he committed the ministration of the gospel, he would add the injunction that it be not ministered in all places,[^2126] and without respect to persons,[^2127] in accordance with the Lord’s saying, “Not to cast one’s pearls before swine, nor that which is holy unto dogs.”[^2128] Openly did the Lord speak,[^2129] without any intimation of a hidden mystery. He had Himself commanded that, “whatsoever they had heard in darkness” and in secret, they should “declare in the light and on the house-tops.”[^2130] He had Himself foreshown, by means of a parable, that they should not keep back in secret, fruitless of interest,[^2131] a single pound, that is, one word of His. He used Himself to tell them that a candle was not usually “pushed away under a bushel, but placed on a candlestick,” in order to “give light to all who are in the house.”[^2132] These things the apostles either neglected, or failed to understand, if they fulfilled them not, by concealing any portion of the light, that is, of the word of God and the mystery of Christ. Of no man, I am quite sure, were they afraid,—neither of Jews nor of Gentiles in their violence;[^2133] with all the greater freedom, then, would they certainly preach in the church, who held not their tongue in synagogues and public places. Indeed they would have found it impossible either to convert Jews or to bring in Gentiles, unless they “set forth in order”[^2134] that which they would have them believe. Much less, when churches were advanced in the faith, would they have withdrawn from them anything for the purpose of committing it separately to some few others. Although, even supposing that among intimate friends,[^2135] so to speak, they did hold certain discussions, yet it is incredible that these could have been such as to bring in some other rule of faith, differing from and contrary to that which they were proclaiming through the Catholic churches,[^2136]—as if they spoke of one God in the Church, (and) another at home, and described one substance of Christ, publicly, (and) another secretly, and announced one hope of the resurrection before all men, (and) another before the few; although they themselves, in their epistles, besought men that they would all speak one and the same thing, and that there should be no divisions and dissensions in the church,[^2137] seeing that they, whether Paul or others, preached the same things. Moreover, they remembered (the words): “Let your communication be yea, yea; nay, nay; for whatsoever is more than this cometh of evil;”[^2138] so that they were not to handle the gospel in a diversity of treatment." },
  { t = "note", id = "2126", text = "Passim." },
  { t = "note", id = "2127", text = "Inconsiderate." },
  { t = "note", id = "2128", text = "Matt. vii. 6." },
  { t = "note", id = "2129", text = "John xviii. 20." },
  { t = "note", id = "2130", text = "Matt. x. 27." },
  { t = "note", id = "2131", text = "Luke xix. 20–24." },
  { t = "note", id = "2132", text = "Matt. v. 15." },
  { t = "note", id = "2133", text = "Literally, “the violence of neither Jew nor Gentile.”" },
  { t = "note", id = "2134", text = "Luke i. 1." },
  { t = "note", id = "2135", text = "Domesticos. [All this interprets Clement and utterly deprives the Trent System of its appeal to a secret doctrine, against our *Præscription*.]" },
  { t = "note", id = "2136", text = "Catholice, or, “which they were bringing before the public in catholic way.”" },
  { t = "note", id = "2137", text = "1 Cor. i. 10." },
  { t = "note", id = "2138", text = "Matt. v. 37." },
]

[[section]]
id = "granted-that-the-apostles-transmitted-the-whole"
title = "Granted that the Apostles Transmitted the Whole Doctrine of Truth, May Not the Churches Have Been Unfaithful in Handing It On? Inconceivable that This Can Have Been the Case."
level = 1
blocks = [
  { t = "p", text = "Chapter XXVII.—Granted that the Apostles Transmitted the Whole Doctrine of Truth, May Not the Churches Have Been Unfaithful in Handing It On? Inconceivable that This Can Have Been the Case." },
  { t = "p", text = "Since, therefore, it is incredible that the apostles were either ignorant of the whole scope of the message which they had to declare,[^2139] or failed to make known to all men the entire rule of faith, let us see whether, while the apostles proclaimed it, perhaps, simply and fully, the churches, through their own fault, set it forth otherwise than the apostles had done. All these suggestions of distrust[^2140] you may find put forward by the heretics. They bear in mind how the churches were rebuked by the apostle: “O foolish Galatians, who hath bewitched you?”[^2141] and, “Ye did run so well; who hath hindered you?”[^2142] and how the epistle actually begins: “I marvel that ye are so soon removed from Him, who hath called you as His own in grace, to another gospel.”[^2143] That they likewise (remember), what was written to the Corinthians, that they “were yet carnal,” who “required to be fed with milk,” being as yet “unable to bear strong meat;”[^2144] who also “thought that they knew somewhat, whereas they knew not yet anything, as they ought to know.”[^2145] When they raise the objection that the churches were rebuked, let them suppose that they were also corrected; let them also remember those (churches), concerning whose faith and knowledge and conversation the apostle “rejoices and gives thanks to God,” which nevertheless even at this day, unite with those which were rebuked in the privileges of one and the same institution." },
  { t = "note", id = "2139", text = "Plenitudinem prædicationis." },
  { t = "note", id = "2140", text = "Scrupulositatis." },
  { t = "note", id = "2141", text = "Gal. iii. 1." },
  { t = "note", id = "2142", text = "Gal. v. 7." },
  { t = "note", id = "2143", text = "Gal. i. 6." },
  { t = "note", id = "2144", text = "1 Cor. iii. 1, and following verses." },
  { t = "note", id = "2145", text = "1 Cor. viii. 2." },
]

[[section]]
id = "the-one-tradition-of-the-faith-which"
title = "The One Tradition of the Faith, Which is Substantially Alike in the Churches Everywhere, a Good Proof that the Transmission Has Been True and Honest in the Main."
level = 1
blocks = [
  { t = "p", text = "Chapter XXVIII.—The One Tradition of the Faith, Which is Substantially Alike in the Churches Everywhere, a Good Proof that the Transmission Has Been True and Honest in the Main." },
  { t = "p", text = "Grant, then, that all have erred; that the apostle was mistaken in giving his testimony; that the Holy Ghost had no such respect to any one (church) as to lead it into truth, although sent with this view by Christ,[^2146] and for this asked of the Father that He might be the teacher of truth;[^2147] grant, also, that He, the Steward of God, the Vicar of Christ,[^2148] neglected His office, permitting the churches for a time to understand differently, (and) to believe differently, what He Himself was preaching by the apostles,—is it likely that so many churches, and they so great, should have gone astray into one and the same faith? No casualty distributed among many men issues in one and the same result. Error of doctrine in the churches must necessarily have produced various issues. When, however, that which is deposited among many is found to be one and the same, it is not the result of error, but of tradition. Can any one, then, be reckless[^2149] enough to say that they were in error who handed on the tradition?" },
  { t = "note", id = "2146", text = "John xiv. 26." },
  { t = "note", id = "2147", text = "John xv. 26." },
  { t = "note", id = "2148", text = "[Tertullian knows no other Vicar of Christ than the Holy Spirit. They who attribute infallibility to any mortal man become Montanists; they attribute the Paraclete’s voice to their oracle.]" },
  { t = "note", id = "2149", text = "Audeat." },
]

[[section]]
id = "the-truth-not-indebted-to-the-care"
title = "The Truth Not Indebted to the Care of the Heretics; It Had Free Course Before They Appeared. Priority of the Church's Doctrine a Mark of Its Truth."
level = 1
blocks = [
  { t = "p", text = "Chapter XXIX.—The Truth Not Indebted to the Care of the Heretics; It Had Free Course Before They Appeared. Priority of the Church’s Doctrine a Mark of Its Truth." },
  { t = "p", text = "In whatever manner error came, it reigned of course[^2150] only as long as there was an absence of heresies? Truth had to wait for certain Marcionites and Valentinians to set it free. During the interval the gospel was wrongly[^2151] preached; men wrongly believed; so many thousands were wrongly baptized; so many works of faith were wrongly wrought; so many miraculous gifts,[^2152] so many spiritual endowments,[^2153] were wrongly set in operation; so many priestly functions, so many ministries,[^2154] were wrongly executed; and, to sum up the whole, so many martyrs wrongly received their crowns! Else, if not wrongly done, and to no purpose, how comes it to pass that the things of God were on their course before it was known to what God they belonged? that there were Christians before Christ was found? that there were heresies before true doctrine? Not so; for in all cases truth precedes its copy, the likeness succeeds the reality. Absurd enough, however, is it, that heresy should be deemed to have preceded its own prior doctrine, even on this account, because it is that (doctrine) itself which foretold that there should be heresies against which men would have to guard! To a church which possessed this doctrine, it was written—yea, the doctrine itself writes to its own church—“Though an angel from heaven preach any other gospel than that which we have preached, let him be accursed.”[^2155]" },
  { t = "note", id = "2150", text = "Utique, ironical." },
  { t = "note", id = "2151", text = "Perperam." },
  { t = "note", id = "2152", text = "Virtutes, “potestatem edendi miracula” (Oehler)." },
  { t = "note", id = "2153", text = "Charismata." },
  { t = "note", id = "2154", text = "Ministeria. Another reading has *mysteria*, “mysteries” or “sacraments.”" },
  { t = "note", id = "2155", text = "Gal. i. 8. [In this chapter (xxix.) the principle of *Prescription* is condensed and brought to the needle-point—*Quod semper*. If you can’t show that your doctrine was *always* taught, it is false: and this is “Prescription.”]" },
]

[[section]]
id = "comparative-lateness-of-heresies-marcion-s-heresy"
title = "Comparative Lateness of Heresies. Marcion's Heresy. Some Personal Facts About Him. The Heresy of Apelles. Character of This Man; Philumene; Valentinus; Nigidius, and Hermogenes."
level = 1
blocks = [
  { t = "p", text = "Chapter XXX.—Comparative Lateness of Heresies. Marcion’s Heresy. Some Personal Facts About Him. The Heresy of Apelles. Character of This Man; Philumene; Valentinus; Nigidius, and Hermogenes." },
  { t = "p", text = "Where was Marcion *then*, that shipmaster of Pontus, the zealous student of Stoicism? Where was Valentinus *then*, the disciple of Platonism? For it is evident that those men lived not so long ago,—in the reign of Antoninus for the most part,[^2156]—and that they at first were believers in the doctrine of the Catholic Church, in the church of Rome under the episcopate of the blessed Eleutherus,[^2157] until on account of their ever restless curiosity, with which they even infected the brethren, they were more than once expelled. Marcion, indeed, [went] with the two hundred sesterces which he had brought into the church, and,[^2158] when banished at last to a permanent excommunication, they scattered abroad the poisons of their doctrines. Afterwards, it is true, Marcion professed repentance, and agreed to the conditions granted to him—that he should receive reconciliation if he restored to the church all the others whom he had been training for perdition: he was prevented, however, by death. It was indeed[^2159] necessary that there should be heresies;[^2160] and yet it does not follow from that necessity, that heresies are a good thing. As if it has not been necessary also that there should be evil! It was even necessary that the Lord should be betrayed; but woe to the traitor![^2161] So that no man may from this defend heresies. If we must likewise touch the descent[^2162] of Apelles, he is far from being “one of the old school,”[^2163] like his instructor and moulder, Marcion; he rather forsook the continence of Marcion, by resorting to the company of a woman, and withdrew to Alexandria, out of sight of his most abstemious[^2164] master. Returning therefrom, after some years, unimproved, except that he was no longer a Marcionite, he clave[^2165] to another woman, the maiden Philumene (whom we have already[^2166] mentioned), who herself afterwards became an enormous prostitute. Having been imposed on by her vigorous spirit,[^2167] he committed to writing *the revelations* which he had learned of her. Persons are still living who remember them,—their own actual disciples and successors,—who cannot therefore deny the lateness of their date. But, in fact, by their own works they are convicted, even as the Lord said.[^2168] For since Marcion separated the New Testament from the Old, he is (necessarily) subsequent to that which he separated, inasmuch as it was only in his power to separate what was (previously) united. Having then been united previous to its separation, the fact of its subsequent separation proves the subsequence also of the man who effected the separation. In like manner Valentinus, by his different expositions and acknowledged[^2169] emendations, makes these changes on the express ground of previous faultiness, and therefore demonstrates the difference[^2170] of the documents. These corrupters of the truth we mention as being more notorious and more public[^2171] than others. There is, however, a certain man[^2172] named Nigidius, and Hermogenes, and several others, who still pursue the course[^2173] of perverting the ways of the Lord. Let them show me by what authority they come! If it be some other God they preach, how comes it that they employ the things and the writings and the names of that God against whom they preach? If it be the same God, why treat Him in some other way? Let them prove themselves to be new apostles![^2174] Let them maintain that Christ has come down a second time, taught in person a second time, has been twice crucified, twice dead, twice raised! For thus has the apostle described (the order of events in the life of Christ); for thus, too, is He[^2175] accustomed to make His apostles—to give them, (that is), power besides of working the same miracles which He worked Himself.[^2176] I would therefore have their mighty deeds also brought forward; except that I allow their mightiest deed to be that by which they perversely vie with the apostles. For whilst they used to raise men to life from the dead, these consign men to death from their living state." },
  { t = "note", id = "2156", text = "Fere." },
  { t = "note", id = "2157", text = "[Kaye, p. 226.]" },
  { t = "note", id = "2158", text = "See *adv. Marcion*, iv. 4. *infra.*" },
  { t = "note", id = "2159", text = "Enim, profecto (Oehler)." },
  { t = "note", id = "2160", text = "1 Cor. xi. 19." },
  { t = "note", id = "2161", text = "Mark. xiv. 21." },
  { t = "note", id = "2162", text = "Stemma. The reading of the *Cod. Agobard*. is “stigma,” which gives very good sense." },
  { t = "note", id = "2163", text = "Vetus." },
  { t = "note", id = "2164", text = "Sanctissimi. This may be an *ironical* allusion to Marcion’s repudiation of marriage." },
  { t = "note", id = "2165", text = "Impegit." },
  { t = "note", id = "2166", text = "In chap. vi. p. 246 above." },
  { t = "note", id = "2167", text = "Energemate. Oehler defines this word, “vis et efficacia dæmonum, quibus agebatur.” [But see Lardner, *Credib.* viii. p. 540.]" },
  { t = "note", id = "2168", text = "Matt. vii. 16." },

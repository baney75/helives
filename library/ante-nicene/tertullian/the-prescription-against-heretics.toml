]

[[section]]
id = "truth-first-falsehood-afterwards-as-its-perversion"
title = "Truth First, Falsehood Afterwards, as Its Perversion. Christ's Parable Puts the Sowing of the Good Seed Before the Useless Tares."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXI.—Truth First, Falsehood Afterwards, as Its Perversion. Christ’s Parable Puts the Sowing of the Good Seed Before the Useless Tares." },
  { t = "p", text = "Let me return, however, from this digression[^2177] to discuss[^2178] the priority of truth, and the comparative lateness[^2179] of falsehood, deriving support for my argument even from that parable which puts in the first place the sowing by the Lord of the good seed of the wheat, but introduces at a later stage the adulteration of the crop by its enemy the devil with the useless weed of the wild oats. For herein is figuratively described the difference of doctrines, since in other passages also the word of God is likened unto seed. From the actual order, therefore, it becomes clear, that that which was first delivered is of the Lord and is true, whilst that is strange and false which was afterwards introduced. This sentence will keep its ground in opposition to all later heresies, which have no consistent quality of kindred knowledge[^2180] inherent in them—to claim the truth as on their side." },
  { t = "note", id = "2177", text = "Ab excessu." },
  { t = "note", id = "2178", text = "Disputandam. Another reading has *deputandam*, i.e., “to attribute.”" },
  { t = "note", id = "2179", text = "Posteritatem." },
  { t = "note", id = "2180", text = "Nulla constantia de conscientia, “no conscientious ground of confidence” (Dodgson)." },
]

[[section]]
id = "none-of-the-heretics-claim-succession-from"
title = "None of the Heretics Claim Succession from the Apostles. New Churches Still Apostolic, Because Their Faith is that Which the Apostles Taught and Handed Down. The Heretics Challenged to Show Any Apostolic Credentials."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXII.—None of the Heretics Claim Succession from the Apostles. New Churches Still Apostolic, Because Their Faith is that Which the Apostles Taught and Handed Down. The Heretics Challenged to Show Any Apostolic Credentials." },
  { t = "p", text = "But if there be any (heresies) which are bold enough to plant themselves in the midst of the apostolic age, that they may thereby seem to have been handed down by the apostles, because they existed in the time of the apostles, we can say: Let them produce the original records[^2181] of their churches; let them unfold the roll of their bishops, running down in due succession from the beginning in such a manner that [that first bishop of theirs[^2182]] bishop shall be able to show for his ordainer and predecessor some one of the apostles or of apostolic men,—a man, moreover, who continued stedfast with the apostles. For this is the manner in which the apostolic churches transmit[^2183] their registers:[^2184] as the church of Smyrna, which records that Polycarp was placed therein by John; as also the church of Rome, which makes Clement to have been ordained in like manner by Peter.[^2185] In exactly the same way the other churches likewise exhibit (their several worthies), whom, as having been appointed to their episcopal places by apostles, they regard as transmitters of the apostolic seed. Let the heretics contrive[^2186] something of the same kind. For after their blasphemy, what is there that is unlawful for them (to attempt)? But should they even effect the contrivance, they will not advance a step. For their very doctrine, after comparison with that of the apostles, will declare, by its own diversity and contrariety, that it had for its author neither an apostle nor an apostolic man; because, as the apostles would never have taught things which were self-contradictory, so the apostolic men would not have inculcated teaching different from the apostles, unless they who received their instruction from the apostles went and preached in a contrary manner. To this test, therefore will they be submitted for proof[^2187] by those churches, who, although they derive not their founder from apostles or apostolic men (as being of much later date, for they are in fact being founded daily), yet, since they agree in the same faith, they are accounted as not less apostolic because they are akin in doctrine.[^2188] Then let all the heresies, when challenged to these two[^2189] tests by our apostolic church, offer their proof of how they deem themselves to be apostolic. But in truth they neither are so, nor are they able to prove themselves to be what they are not. Nor are they admitted to peaceful relations and communion by such churches as are in any way connected with apostles, inasmuch as they are in no sense themselves apostolic because of their diversity as to the mysteries of the faith.[^2190]" },
  { t = "note", id = "2181", text = "Origines, “the originals” (Dodgson)." },
  { t = "note", id = "2182", text = "Ille. A touch of irony occurs in the phrase “primus ille episcopus.”" },
  { t = "note", id = "2183", text = "Deferunt." },
  { t = "note", id = "2184", text = "Fastos." },
  { t = "note", id = "2185", text = "[Linus and Cletus must have died or been martyred, therefore, almost as soon as appointed. Our author had seen these registers, no doubt.]" },
  { t = "note", id = "2186", text = "Confingant." },
  { t = "note", id = "2187", text = "Probabuntur. Another reading is *provocabuntur*, “will be challenged.” [Not to one particular See, but to all the Apostolic churches: *Quod ubique*.]" },
  { t = "note", id = "2188", text = "Pro consanguinitate doctrinæ." },
  { t = "note", id = "2189", text = "That is, the succession of bishops from the apostles, and the identity of doctrine with the apostolic." },
  { t = "note", id = "2190", text = "Sacramenti." },
]

[[section]]
id = "present-heresies-seedlings-of-the-tares-noted"
title = "Present Heresies (Seedlings of the Tares Noted by the Sacred Writers) Already Condemned in Scripture. This Descent of Later Heresy from the Earlier Traced in Several Instances."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXIII.—Present Heresies (Seedlings of the Tares Noted by the Sacred Writers) Already Condemned in Scripture. This Descent of Later Heresy from the Earlier Traced in Several Instances." },
  { t = "p", text = "Besides all this, I add a review of the doctrines themselves, which, existing as they did in the days of the apostles, were both exposed and denounced by the said apostles. For by this method they will be more easily reprobated,[^2191] when they are detected to have been even then in existence, or at any rate to have been seedlings[^2192] of the (tares) which then were. Paul, in his first epistle to the Corinthians, sets his mark on certain who denied and doubted the resurrection.[^2193] This opinion was the especial property of the Sadducees.[^2194] A part of it, however, is maintained by Marcion and Apelles and Valentinus, and all other impugners of the resurrection. Writing also to the Galatians, he inveighs against such men as observed and defend circumcision and the (Mosaic) law.[^2195] Thus runs Hebion’s heresy. Such also as “forbid to marry” he reproaches in his instructions to Timothy.[^2196] Now, this is the teaching of Marcion and his follower Apelles. (The apostle) directs a similar blow[^2197] against those who said that “the resurrection was past already.”[^2198] Such an opinion did the Valentinians assert of themselves. When again he mentions “endless genealogies,”[^2199] one also recognises Valentinus, in whose system a certain Æon, whosoever he be,[^2200] of a new name, and that not one only, generates of his own grace[^2201] Sense and Truth; and these in like manner produce of themselves Word[^2202] and Life, while these again afterwards beget Man and the Church. From these primary eight[^2203] ten other Æons after them spring, and then the twelve others arise with their wonderful names, to complete the mere story of the thirty Æons. The same apostle, when disapproving of those who are “in bondage to elements,”[^2204] points us to some dogma of Hermogenes, who introduces matter as having no beginning,[^2205] and then compares it with God, who has no beginning.[^2206] By thus making the mother of the elements a goddess, he has it in his power “to be in bondage” to a being which he puts on a par with[^2207] God. John, however, in the Apocalypse is charged to chastise those “who eat things sacrificed to idols,” and “who commit fornication.”[^2208] There are even now another sort of Nicolaitans. Theirs is called the Gaian[^2209] heresy. But in his epistle he especially designates those as “Antichrists” who “denied that Christ was come in the flesh,”[^2210] and who refused to think that Jesus was the Son of God. The one dogma Marcion maintained; the other, Hebion.[^2211] The doctrine, however, of Simon’s sorcery, which inculcated the worship of angels,[^2212] was itself actually reckoned amongst idolatries and condemned by the Apostle Peter in Simon’s own person." },
  { t = "note", id = "2191", text = "Traducentur." },
  { t = "note", id = "2192", text = "Semina sumpsisse." },
  { t = "note", id = "2193", text = "1 Cor. xv. 12." },
  { t = "note", id = "2194", text = "Comp. Tertull. *De Resur. Carnis*, xxxvi." },
  { t = "note", id = "2195", text = "Gal. v. 2." },
  { t = "note", id = "2196", text = "1 Tim. iv. 3." },
  { t = "note", id = "2197", text = "Æque tangit." },
  { t = "note", id = "2198", text = "2 Tim. ii. 3." },
  { t = "note", id = "2199", text = "1 Tim. i. 4." },
  { t = "note", id = "2200", text = "Nescio qui." },
  { t = "note", id = "2201", text = "Charite." },
  { t = "note", id = "2202", text = "Sermonem." },
  { t = "note", id = "2203", text = "De qua prima ogdoade. [See Irenæus, Vol. I. p. 316, *etc.* this Series.]" },
  { t = "note", id = "2204", text = "Gal. iv. 9." },
  { t = "note", id = "2205", text = "Non natam, literally, “as being unbegotten.”" },
  { t = "note", id = "2206", text = "Deo non nato." },
  { t = "note", id = "2207", text = "Comparat." },
  { t = "note", id = "2208", text = "Rev. ii. 14." },
  { t = "note", id = "2209", text = "Gaiana. So Oehler; the common reading being “*Caiana*.”" },
  { t = "note", id = "2210", text = "1 John iv. 3." },
  { t = "note", id = "2211", text = "Comp. Epiphanius, i. 30." },
  { t = "note", id = "2212", text = "Referred to perhaps in Col. ii. 18." },
]

[[section]]
id = "no-early-controversy-respecting-the-divine-creator"
title = "No Early Controversy Respecting the Divine Creator; No Second God Introduced at First. Heresies Condemned Alike by the Sentence and the Silence of Holy Scripture."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXIV.—No Early Controversy Respecting the Divine Creator; No Second God Introduced at First. Heresies Condemned Alike by the Sentence and the Silence of Holy Scripture." },
  { t = "p", text = "These are, as I suppose, the different kinds of spurious doctrines, which (as we are informed by the apostles themselves) existed in their own day. And yet we find amongst so many various perversions of truth, not one school[^2213] which raised any controversy concerning God as the Creator of all things. No man was bold enough to surmise a second god. More readily was doubt felt about the Son than about the Father, until Marcion introduced, in addition to the Creator, another god of goodness only. Apelles made the Creator of some nondescript[^2214] glorious angel, who belonged to the superior God, the god (according to him,) of the law and of Israel, affirming that he was fire.[^2215] Valentinus disseminated his Æons, and traced the sin of one Æon[^2216] to the production of God the Creator. To none, forsooth, except these, nor prior to these, was revealed the truth of the Divine Nature; and they obtained this especial honour and fuller favour from the devil, we cannot doubt,[^2217] because he wished even in this respect to rival God, that he might succeed, by the poison of his doctrines, in doing himself what the Lord said could not be done—making “the disciples above their Master.”[^2218] Let the entire mass[^2219] of heresies choose, therefore, for themselves the times when they should appear, provided that the *when* be an unimportant point; allowing, too, that they be not of the truth, and (as a matter of course[^2220]) that such as had no existence in the time of the apostles could not possibly have had any connection with the apostles. If indeed they had then existed, their names would be extant,[^2221] with a view to their own repression likewise. Those (heresies) indeed which did exist in the days of the apostles, are condemned in their very mention.[^2222] If it be true, then, that those heresies, which in the apostolic times were in a rude form, are now found to be the same, only in a much more polished shape, they derive their condemnation from this very circumstance. Or if they were not the same, but arose afterwards in a different form, and merely assumed from them certain tenets, then, by sharing with them an agreement in their teaching,[^2223] they must needs partake in their condemnation, by reason of the above-mentioned definition,[^2224] of lateness of date, which meets us on the very threshold.[^2225] Even if they were free from any participation in condemned doctrine, they would stand already judged[^2226] on the mere ground of time, being all the more spurious because they were not even named by the apostles. Whence we have the firmer assurance, that these were (the heresies) which even then,[^2227] were announced as about to arise." },
  { t = "note", id = "2213", text = "Institutionem." },
  { t = "note", id = "2214", text = "Nescio quem." },
  { t = "note", id = "2215", text = "Igneum, “consisted of fire.”" },
  { t = "note", id = "2216", text = "“The *ectroma*, or fall of Sophia from the Pleroma, from whom the Creator was fabled to be descended” (Dodgson)." },
  { t = "note", id = "2217", text = "Scilicet." },
  { t = "note", id = "2218", text = "Luke vi. 40." },
  { t = "note", id = "2219", text = "Universæ." },
  { t = "note", id = "2220", text = "Utique." },
  { t = "note", id = "2221", text = "Nominarentur et ipsæ." },
  { t = "note", id = "2222", text = "Nominatione, i.e. by the apostles." },
  { t = "note", id = "2223", text = "Prædicationis." },
  { t = "note", id = "2224", text = "Fine." },
  { t = "note", id = "2225", text = "Præcedente." },
  { t = "note", id = "2226", text = "Præjudicarentur. [i.e. by Præscription.]" },
  { t = "note", id = "2227", text = "i.e., in the days of the apostles, and by their mouth." },
]

[[section]]
id = "let-heretics-maintain-their-claims-by-a"
title = "Let Heretics Maintain Their Claims by a Definite and Intelligible Evidence. This the Only Method of Solving Their Questions. Catholics Appeal Always to Evidence Traceable to Apostolic Sources."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXV.—Let Heretics Maintain Their Claims by a Definite and Intelligible Evidence. This the Only Method of Solving Their Questions. Catholics Appeal Always to Evidence Traceable to Apostolic Sources." },
  { t = "p", text = "Challenged and refuted by us, according to these definitions, let all the heresies boldly on their part also advance similar rules to these against our doctrine, whether they be later than the apostles or contemporary with the apostles, provided they be different from them; provided also they were, by either a general or a specific censure, precondemned by them. For since they deny the truth of (our doctrine), they ought to prove that it also is heresy, refutable by the same rule as that by which they are themselves refuted; and at the same time to show us where we must seek the truth, which it is by this time evident has no existence amongst them. Our system[^2228] is not behind any in date; on the contrary, it is earlier than all; and this fact will be the evidence of that truth which everywhere occupies the first place. The apostles, again, nowhere condemn it; they rather defend it,—a fact which will show that it comes from themselves.[^2229] For that doctrine which they refrain from condemning, when they have condemned every strange opinion, they show to be their own, and on that ground too they defend it." },
  { t = "note", id = "2228", text = "Res." },
  { t = "note", id = "2229", text = "Indicium proprietatis, a proof of its being their own." },
]

[[section]]
id = "the-apostolic-churches-the-voice-of-the"
title = "The Apostolic Churches the Voice of the Apostles. Let the Heretics Examine Their Apostolic Claims, in Each Case, Indisputable. The Church of Rome Doubly Apostolic; Its Early Eminence and Excellence. Heresy, as Perverting the Truth, is Connected Therewith."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXVI.—The Apostolic Churches the Voice of the Apostles. Let the Heretics Examine Their Apostolic Claims, in Each Case, Indisputable. The Church of Rome Doubly Apostolic; Its Early Eminence and Excellence. Heresy, as Perverting the Truth, is Connected Therewith." },
  { t = "p", text = "Come now, you who would indulge a better curiosity, if you would apply it to the business of your salvation, run over the apostolic churches, in which the very thrones[^2230] of the apostles are still pre-eminent in their places,[^2231] in which their own authentic writings[^2232] are read, uttering the voice and representing the face of each of them severally. Achaia is very near you, (in which) you find Corinth. Since you are not far from Macedonia, you have Philippi; (and there too) you have the Thessalonians. Since you are able to cross to Asia, you get Ephesus. Since, moreover, you are close upon Italy,[^2233] you have Rome, from which there comes even into our own hands the very authority (of apostles themselves).[^2234] How happy is its church, on which apostles poured forth all their doctrine along with their blood! where Peter endures a passion like his Lord’s! where Paul wins his crown in a death like John’s[^2235] where the Apostle John was first plunged, unhurt, into boiling oil, and thence remitted to his island-exile! See what she has learned, what taught, what fellowship has had with even (our) churches in Africa![^2236] One Lord God does she acknowledge, the Creator of the universe, and Christ Jesus (born) of the Virgin Mary, the Son of God the Creator; and the Resurrection of the flesh; the law and the prophets she unites[^2237] in one volume with the writings of evangelists and apostles, from which she drinks in her faith. This she seals with the water (of baptism), arrays with the Holy Ghost, feeds with the Eucharist, cheers with martyrdom,[^2238] and against such a discipline thus (maintained) she admits no gainsayer. This is the discipline which I no longer say foretold that heresies should come, but from[^2239] which they proceeded. However, they were not of her, because they were opposed to her.[^2240] Even the rough wild-olive arises from the germ[^2241] of the fruitful, rich, and genuine[^2242] olive; also from the seed[^2243] of the mellowest and sweetest fig there springs the empty and useless wild-fig. In the same way heresies, too, come from our plant,[^2244] although not of our kind; (they come) from the grain of truth,[^2245] but, owing to their falsehood, they have only wild leaves to show.[^2246]" },
  { t = "note", id = "2230", text = "Cathedræ." },
  { t = "note", id = "2231", text = "Suis locis præsident." },
  { t = "note", id = "2232", text = "Authenticæ. This much disputed phrase may refer to the *autographs* or the Greek *originals* (rather than the Latin translations), or full *unmutilated* copies as opposed to the garbled ones of the heretics. The second sense is probably the correct one." },
  { t = "note", id = "2233", text = "[Note, *those near by* may resort to this ancient and glorious church; not as any better than Corinth, or Philippi, or having any higher Apostolic throne. See Irenæus, Vol. I. p. 415, (note) and Elucid. p. 460.]" },
  { t = "note", id = "2234", text = "Compare our *Anti-Marcion*, iv. 5, p. 186." },
  { t = "note", id = "2235", text = "The Baptist’s." },
  { t = "note", id = "2236", text = "[Observe—“even with us in Africa.” If this implies noteworthy love, it proves that there was no organic relation requiring such particular fellowship, even in the West.]" },
  { t = "note", id = "2237", text = "Miscet." },
  { t = "note", id = "2238", text = "We have taken Oehler’s hint in favour of “martyrio.” The usual reading “martyrium” (meaning “she exhorts to martyrdom”) is stiff, and unsuited to the context." },
  { t = "note", id = "2239", text = "De." },
  { t = "note", id = "2240", text = "Or, “they were not of *it*, because they were opposed to *it*,” i.e., the discipline or teaching." },
  { t = "note", id = "2241", text = "Nucleo." },
  { t = "note", id = "2242", text = "Necessariæ." },
  { t = "note", id = "2243", text = "Papavere. “Ego cum aliis *papaver ficus* interpretor de seminalibus ficus, non de ipso fructu” (Oehler)." },
  { t = "note", id = "2244", text = "Frutice." },
  { t = "note", id = "2245", text = "We again follow Oehler’s hint, who would like to read “de grano veritatis.” The texts are obscure, and vary much here." },
  { t = "note", id = "2246", text = "Silvestres." },
]

[[section]]
id = "heretics-not-being-christians-but-rather-perverters"
title = "Heretics Not Being Christians, But Rather Perverters of Christ's Teaching, May Not Claim the Christian Scriptures. These are a Deposit, Committed to and Carefully Kept by the Church."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXVII.—Heretics Not Being Christians, But Rather Perverters of Christ’s Teaching, May Not Claim the Christian Scriptures. These are a Deposit, Committed to and Carefully Kept by the Church." },
  { t = "p", text = "Since this is the case, in order that the truth may be adjudged to belong to us, “as many as walk according to the rule,” which the church has handed down from the apostles, the apostles from Christ, *and* Christ from God, the reason of our position is clear, when it determines that heretics ought not to be allowed to challenge an appeal to the Scriptures, since we, without the Scriptures, prove that they have nothing to do with the Scriptures. For as they are heretics, they cannot be true Christians, because it is not from Christ that they get that which they pursue of their own mere choice, and from the pursuit incur and admit the name of heretics.[^2247] Thus, not being Christians, they have acquired[^2248] no right to the Christian Scriptures; and it may be very fairly said to them, “Who are you? When and whence did you come? As you are none of mine, what have you to do with that which is mine? Indeed, Marcion, by what right do you hew my wood? By whose permission, Valentinus, are you diverting the streams of my fountain? By what power, Apelles, are you removing my landmarks? This is my property. Why are you, the rest, sowing and feeding here at your own pleasure? This (I say) is my property. I have long possessed it; I possessed it before you. I hold sure title-deeds from the original owners themselves, to whom the estate belonged. I am the heir of the apostles. Just as they carefully prepared their will and testament, and committed it to a trust, and adjured (the trustees to be faithful to their charge),[^2249] even so do I hold it. As for you, they have, it is certain, always held you as disinherited, and rejected you as strangers—as enemies. But on what ground are heretics strangers and enemies to the apostles, if it be not from the difference of their teaching, which each individual of his own mere will has either advanced or received in opposition to the apostles?”" },
  { t = "note", id = "2247", text = "“That is, in following out their own choice (αἳρεσις) of opinions, they both receive and admit the name of *heretics*,” αἱρετικοί, “self-choosers” (Dodgson). [In Theology, *technically*, one must be a baptized Christian in order to be a heretic. The Mohammedans, e.g., are not *heretics* but *pagans*. But, our author speaks rhetorically.]" },
  { t = "note", id = "2248", text = "Capiunt." },
  { t = "note", id = "2249", text = "Compare 1 Tim. v. 21, and vi. 13; 2 Tim. ii. 14, and iv. 1–4." },
]

[[section]]
id = "harmony-of-the-church-and-the-scriptures"
title = "Harmony of the Church and the Scriptures. Heretics Have Tampered with the Scriptures, and Mutilated, and Altered Them. Catholics Never Change the Scriptures, Which Always Testify for Them."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXVIII.—Harmony of the Church and the Scriptures. Heretics Have Tampered with the Scriptures, and Mutilated, and Altered Them. Catholics Never Change the Scriptures, Which Always Testify for Them." },
  { t = "p", text = "Where diversity of doctrine is found, *there*, then, must the corruption both of the Scriptures and the expositions thereof be regarded as existing. On those whose purpose it was to teach differently, lay the necessity of differently arranging the instruments of doctrine.[^2250] They could not possibly have effected their diversity of teaching in any other way than by having a difference in the means whereby they taught. As in their case, corruption in doctrine could not possibly have succeeded without a corruption also of its instruments, so to ourselves also integrity of doctrine could not have accrued, without integrity in those means by which doctrine is managed. Now, what is there in our Scriptures which is contrary to us?[^2251] What of our own have we introduced, that we should have to take it away again, or else add to it, or alter it, in order to restore to its natural soundness anything which is contrary to it, and contained in the Scriptures?[^2252] What we are ourselves, that also the Scriptures are (and have been) from the beginning.[^2253] Of them we have our being, before there was any other way, before they were interpolated by you. Now, inasmuch as all interpolation must be believed to be a later process, for the express reason that it proceeds from rivalry which is never in any case previous to nor home-born[^2254] with that which it emulates, it is as incredible to every man of sense that we should seem to have introduced any corrupt text into the Scriptures, existing, as we have been, from the very first, and being the first, as it is that they have not in fact introduced it who are both later in date and opposed (to the Scriptures). One man perverts the Scriptures with his hand, another their meaning by his exposition. For although Valentinus seems to use the entire volume,[^2255] he has none the less laid violent hands on the truth only with a more cunning mind and skill[^2256] than Marcion. Marcion expressly and openly used the knife, not the pen, since he made such an excision of the Scriptures as suited his own subject-matter.[^2257] Valentinus, however, abstained from such excision, because he did not invent Scriptures to square with his own subject-matter, but adapted his matter to the Scriptures; and yet he took away more, and added more, by removing the proper meaning of every particular word, and adding fantastic arrangements of things which have no real existence.[^2258]" },
  { t = "note", id = "2250", text = "By the *instrumenta doctrinæ* he here means the writings of the New Testament." },
  { t = "note", id = "2251", text = "[Our author insists on the precise agreement of Catholic Tradition with Holy Scripture. See valuable remarks on Schleiermacher, in Kaye, pp. 279–284.]" },
  { t = "note", id = "2252", text = "We add the original of this sentence, which is obscured by its terseness: “Quid de proprio intulimus, ut aliquid contrarium ei et in Scripturis deprehensum detractione vel adjectione vel transmutatione remediaremus?”" },
  { t = "note", id = "2253", text = "That is, teaching the same faith and conversation (De la Cerda)." },
  { t = "note", id = "2254", text = "Domestica." },
  { t = "note", id = "2255", text = "Integro instrumento." },
  { t = "note", id = "2256", text = "Callidiore ingenio." },
  { t = "note", id = "2257", text = "That is, cutting out whatever did not fall in with it (Dodgson)." },
  { t = "note", id = "2258", text = "Non comparentium rerum. [Note, he says above “of *them*, the Scriptures, we, Catholics, *have our being*.” *Præscription* does not undervalue Scripture as the food and life of the Church, but supplies a short and decisive method with innovaters.]" },
]

[[section]]
id = "what-st-paul-calls-spiritual-wickednesses-displayed"
title = "What St. Paul Calls Spiritual Wickednesses Displayed by Pagan Authors, and by Heretics, in No Dissimilar Manner. Holy Scripture Especially Liable to Heretical Manipulation. Affords Material for Heresies, Just as Virgil Has Been the Groundwork of Literary Plagiarisms, Different in Purport from the Original."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXIX.—What St. Paul Calls Spiritual Wickednesses Displayed by Pagan Authors, and by Heretics, in No Dissimilar Manner. Holy Scripture Especially Liable to Heretical Manipulation. Affords Material for Heresies, Just as Virgil Has Been the Groundwork of Literary Plagiarisms, Different in Purport from the Original." },
  { t = "p", text = "These were the ingenious arts of “spiritual wickednesses,”[^2259] wherewith we also, my brethren, may fairly expect to have “to wrestle,” as necessary for faith, that the elect may be made manifest, (and) that the reprobate may be discovered. And therefore they possess influence, and a facility in thinking out and fabricating[^2260] errors, which ought not to be wondered at as if it were a difficult and inexplicable process, seeing that in profane writings also an example comes ready to hand of a similar facility. You see in our own day, composed out of Virgil,[^2261] a story of a wholly different character, the subject-matter being arranged according to the verse, and the verse according to the subject-matter. In short,[^2262] Hosidius Geta has most completely pilfered his tragedy of *Medea* from Virgil. A near relative of my own, among some leisure productions[^2263] of his pen, has composed out of the same poet *The Table of Cebes*. On the same principle, those *poetasters* are commonly called *Homerocentones*, “collectors of Homeric odds and ends,” who stitch into one piece, patchwork fashion, works of their own from the lines of Homer, out of many scraps put together from this passage and from that (in miscellaneous confusion). Now, unquestionably, the Divine Scriptures are more fruitful in resources of all kinds for this sort of facility. Nor do I risk contradiction in saying[^2264] that the very Scriptures were even arranged by the will of God in such a manner as to furnish materials for heretics, inasmuch as I read that “there must be heresies,”[^2265] which there cannot be without the Scriptures." },
  { t = "note", id = "2259", text = "See Eph. vi. 12, and 1 Cor. xi. 18." },
  { t = "note", id = "2260", text = "Instruendis." },
  { t = "note", id = "2261", text = "Oehler reads “ex Vergilio,” although the *Codex Agobard*. as “ex Virgilio.”" },
  { t = "note", id = "2262", text = "Denique. [“Getica lyra.”]" },
  { t = "note", id = "2263", text = "Otis." },
  { t = "note", id = "2264", text = "Nec periclitor dicere. [Truly, a Tertullianic paradox; but compare 2 Pet. iii. 16. N.B. Scripture the test of heresy.]" },
  { t = "note", id = "2265", text = "1 Cor. xi. 19." },
]

[[section]]
id = "no-difference-in-the-spirit-of-idolatry"
title = "No Difference in the Spirit of Idolatry and of Heresy. In the Rites of Idolatry, Satan Imitated and Distorted the Divine Institutions of the Older Scriptures. The Christian Scriptures Corrupted by Him in the Perversions of the Various Heretics."
level = 1
blocks = [
  { t = "p", text = "Chapter XL.—No Difference in the Spirit of Idolatry and of Heresy. In the Rites of Idolatry, Satan Imitated and Distorted the Divine Institutions of the Older Scriptures. The Christian Scriptures Corrupted by Him in the Perversions of the Various Heretics." },
  { t = "p", text = "The question will arise, By whom is to be interpreted[^2266] the sense of the passages which make for heresies? By the devil, of course, to whom pertain those wiles which pervert the truth, and who, by the mystic rites of his idols, vies even with the essential portions[^2267] of the sacraments of God.[^2268] He, too, baptizes some—that is, his own believers and faithful followers;[^2269] he promises the putting away[^2270] of sins by a laver (of his own); and if my memory still serves me, Mithra there, (in the kingdom of Satan,) sets his marks on the foreheads of his soldiers; celebrates also the oblation of bread, and introduces an image of a resurrection, and before a sword wreathes a crown.[^2271] What also must we say to (Satan’s) limiting his chief priest[^2272] to a single marriage? He, too, has his virgins; he, too, has his proficients in continence.[^2273] Suppose now we revolve in our minds the superstitions of Numa Pompilius, and consider his priestly offices and badges and privileges, his sacrificial services, too, and the instruments and vessels of the sacrifices themselves, and the curious rites of his expiations and vows: is it not clear to us that the devil imitated the well-known[^2274] moroseness of the Jewish law? Since, therefore he has shown such emulation in his great aim of expressing, in the concerns of his idolatry, those very things of which consists the administration of Christ’s sacraments, it follows, of course, that the same being, possessing still the same genius, both set his heart upon,[^2275] and succeeded in, adapting[^2276] to his profane and rival creed the very documents of divine things and of the Christian saints[^2277]—his interpretation from their interpretations, his words from their words, his parables from their parables. For this reason, then, no one ought to doubt, either that “spiritual wickednesses,” from which also heresies come, have been introduced by the devil, or that there is any real difference between heresies and idolatry, seeing that they appertain both to the same author and the same work that idolatry does. They either pretend that there is another god in opposition to the Creator, or, even if they acknowledge that the Creator is the one only God, they treat of Him as a different being from what He is in truth. The consequence is, that every lie which they speak of God is in a certain sense a sort of idolatry." },
  { t = "note", id = "2266", text = "“Interpretur” is here a passive verb." },
  { t = "note", id = "2267", text = "Res." },
  { t = "note", id = "2268", text = "Sacramentorum divinorum. The form, however, of this phrase seems to point not only to the *specific sacraments* of the gospel, but to the *general mysteries* of our religion." },
  { t = "note", id = "2269", text = "Compare Tertullian’s treatises, *de Bapt*. v. and *de Corona*, last chapter." },
  { t = "note", id = "2270", text = "Expositionem." },
  { t = "note", id = "2271", text = "“Et sub gladio redimit coronam” is the text of this obscure sentence, which seems to allude to a pretended *martyrdom*. Compare Tertullian’s tract, *de Corona*, last chapter." },
  { t = "note", id = "2272", text = "The *Flamen Dialis*. See Tertullian’s tract, *ad* *Uxorem*, i. 7." },
  { t = "note", id = "2273", text = "[*Corruptio optimi pessima*. Compare the surprising parallels of M. Huc between debased Christianity and the paganism of Thibet, etc. *Souvenirs d’un voyage*, etc. Hazlitt’s translation, 1867.]" },
  { t = "note", id = "2274", text = "Morositatem Illam. [He refers to the minute and vexatious ordinances complained of by St. Peter (Acts xiv. 10,) which Latin Christianity has ten-folded, in his name.]" },
  { t = "note", id = "2275", text = "Gestiit." },
  { t = "note", id = "2276", text = "Attemperare." },
  { t = "note", id = "2277", text = "i.e., the Scriptures of the New Testament." },
]

[[section]]
id = "the-conduct-of-heretics-its-frivolity-worldliness"
title = "The Conduct of Heretics: Its Frivolity, Worldliness, and Irregularity. The Notorious Wantonness of Their Women."
level = 1
blocks = [
  { t = "p", text = "Chapter XLI.—The Conduct of Heretics: Its Frivolity, Worldliness, and Irregularity. The Notorious Wantonness of Their Women." },
  { t = "p", text = "I must not omit an account of the conduct[^2278] also of the heretics—how frivolous it is, how worldly, how merely human, without seriousness, without authority, without discipline, as suits their creed. To begin with, it is doubtful who is a catechumen, and who a believer; they have all access alike, they hear alike, they pray alike—even heathens, if any such happen to come among them. “That which is holy they will cast to the dogs, and their pearls,” although (to be sure) they are not real ones, “they will fling to the swine.”[^2279] Simplicity they will have to consist in the overthrow of discipline, attention to which on our part they call brothelry.[^2280] Peace also they huddle up[^2281] anyhow with all comers; for it matters not to them, however different be their treatment of subjects, provided only they can conspire together to storm the citadel of the one only Truth. All are puffed up, all offer you knowledge. Their catechumens are perfect before they are full-taught.[^2282] The very women of these heretics, how wanton they are! For they are bold enough to teach, to dispute, to enact exorcisms, to undertake[^2283] cures—it may be even to baptize.[^2284] Their ordinations, are carelessly administered,[^2285] capricious, changeable.[^2286] At one time they put *novices* in office; at another time, men who are bound to some secular employment;[^2287] at another, persons who have apostatized from us, to bind them by vainglory, since they cannot by the truth. Nowhere is promotion easier than in the camp of rebels, where the mere fact of being there is a foremost service.[^2288] And so it comes to pass that to-day one man is their bishop, to-morrow another; to-day he is a deacon who to-morrow is a reader; to-day he is a presbyter who tomorrow is a layman. For even on laymen do they impose the functions of priesthood." },
  { t = "note", id = "2278", text = "Conversationis." },
  { t = "note", id = "2279", text = "See Matt. vii. 6." },
  { t = "note", id = "2280", text = "Lenocinium. “Pandering” is Archdeacon Dodgson’s word." },
  { t = "note", id = "2281", text = "Miscent." },
  { t = "note", id = "2282", text = "Edocti." },
  { t = "note", id = "2283", text = "Repromittere." },
  { t = "note", id = "2284", text = "Compare Tertullian’s tract, *de Bapt*. I. and *de Veland. Virg*. viii. [Also, Epiphan. iv. p. 453, Ed. Oehler.]" },
  { t = "note", id = "2285", text = "Temerariæ." },
  { t = "note", id = "2286", text = "They were constantly changing their ministers. It was a saying of the heretics, “Alius hodie episcopus, cras alius” (Rigalt.)." },
  { t = "note", id = "2287", text = "Sæculo obstrictos." },
  { t = "note", id = "2288", text = "Promereri est." },
]

[[section]]
id = "heretics-work-to-pull-down-and-to"
title = "Heretics Work to Pull Down and to Destroy, Not to Edify and Elevate. Heretics Do Not Adhere Even to Their Own Traditions, But Harbour Dissent Even from Their Own Founders."
level = 1
blocks = [
  { t = "p", text = "Chapter XLII.—Heretics Work to Pull Down and to Destroy, Not to Edify and Elevate. Heretics Do Not Adhere Even to Their Own Traditions, But Harbour Dissent Even from Their Own Founders." },
  { t = "p", text = "But what shall I say concerning the ministry of the word, since they make it their business not to convert the heathen, but to subvert our people? This is rather the glory which they catch at, to compass the fall of those who stand, not the raising of those who are down. Accordingly, since the very work which they purpose to themselves comes not from the building up of their own society, but from the demolition of the truth, they undermine our edifices, that they may erect their own. Only deprive them of the law of Moses, and the prophets, and the divinity of the Creator, and they have not another objection to talk about. The consequence is, that they more easily accomplish the ruin of standing houses than the erection of fallen ruins. It is only when they have such objects in view that they show themselves humble and bland and respectful. Otherwise they know no respect even for their own leaders. Hence it is [supposed] that schisms seldom happen among heretics, because, even when they exist, they are not obvious.[^2289] Their very unity, however,[^2290] is schism. I am greatly in error if they do not amongst themselves swerve even from their own regulations, forasmuch as every man, just as it suits his own temper, modifies the traditions he has received after the same fashion as the man who handed them down did, when he moulded them according to his own will. The progress of the matter is an acknowledgment at once of its character and of the manner of its birth. That was allowable to the Valentinians which had been allowed to Valentinus; that was also fair for the Marcionites which had been done by Marcion—even to innovate on the faith, as was agreeable to their own pleasure. In short, all heresies, when thoroughly looked into, are detected harbouring dissent in many particulars even from their own founders. The majority of them have not even churches.[^2291] Motherless, houseless, creedless, outcasts, they wander about in their own essential worthlessness.[^2292]" },
  { t = "note", id = "2289", text = "Non parent." },
  { t = "note", id = "2290", text = "Enim. [e.g. The Trent system of Unity, alas! is of this sort.]" },
  { t = "note", id = "2291", text = "Hence the saying, “Wasps make combs, so Marcionites make churches” (see our *Anti-Marcion*, p. 187); describing the strangeness and uselessness of the societies, not (as Gibbon said) their number (Dodgson)." },
  { t = "note", id = "2292", text = "Sua in vilitate. Another reading, pronounced corrupt by Oehler, has “quasi sibi latæ vagantur,” *q.d*. “All for themselves, as it were, they wander” etc. (Dodgson)." },
]

[[section]]
id = "loose-company-preferred-by-heretics-ungodliness-the"
title = "Loose Company Preferred by Heretics. Ungodliness the Effect of Their Teaching the Very Opposite of Catholic Truth, Which Promotes the Fear of God, Both in Religious Ordinances and Practical Life."
level = 1
blocks = [
  { t = "p", text = "Chapter XLIII.—Loose Company Preferred by Heretics. Ungodliness the Effect of Their Teaching the Very Opposite of Catholic Truth, Which Promotes the Fear of God, Both in Religious Ordinances and Practical Life." },
  { t = "p", text = "It has also been a subject of remark, how extremely frequent is the intercourse which heretics hold with magicians, with mountebanks, with astrologers, with philosophers; and the reason is,[^2293] that they are men who devote themselves to curious questions. “Seek, and ye shall find,” is everywhere in their minds. Thus, from the very nature of their conduct, may be estimated the quality of their faith. In their discipline we have an index of their doctrine. They say that God is not to be feared; therefore all things are in their view free and unchecked. Where, however is God not feared, except where He *is* not? Where God is not, there truth also is not. Where there is no truth, then, naturally enough, there is also such a discipline as theirs. But where God is, there exists “the fear of God, which is the beginning of wisdom.”[^2294] Where the fear of God is, there is seriousness, an honourable and yet thoughtful[^2295] diligence, as well as an anxious carefulness and a well-considered admission (to the sacred ministry)[^2296] and a safely-guarded[^2297] communion, and promotion after good service, and a scrupulous submission (to authority), and a devout attendance,[^2298] and a modest gait, and a united church, and God *in* all things." },
  { t = "note", id = "2293", text = "Scilicet." },
  { t = "note", id = "2294", text = "Ps. cxi. 10; Prov. i. 7." },
  { t = "note", id = "2295", text = "Attonita, as if in fear that it might go wrong (Rigalt.)." },
  { t = "note", id = "2296", text = "In contrast to the opposite fault of the heresies exposed above." },
  { t = "note", id = "2297", text = "Deliberata, where the character was *well weighed* previous to admission to the eucharist." },
  { t = "note", id = "2298", text = "Apparitio, the duty and office of an *apparitor*, or attendant on men of higher rank, whether in church or state." },
]

[[section]]
id = "heresy-lowers-respect-for-christ-and-destroys"
title = "Heresy Lowers Respect for Christ, and Destroys All Fear of His Great Judgment. The Tendency of Heretical Teaching on This Solemn Article of the Faith. The Present Treatise an Introduction to Certain Other Anti-Heretical Works of Our Author."
level = 1
blocks = [
  { t = "p", text = "Chapter XLIV.—Heresy Lowers Respect for Christ, and Destroys All Fear of His Great Judgment. The Tendency of Heretical Teaching on This Solemn Article of the Faith. The Present Treatise an Introduction to Certain Other Anti-Heretical Works of Our Author." },
  { t = "p", text = "These evidences, then, of a stricter discipline existing among us, are an additional proof of truth, from which no man can safely turn aside, who bears in mind that future judgment, when “we must all stand before the judgment-seat of Christ,”[^2299] to render an account of our faith itself before all things. What, then, will they say who shall have defiled it, even the virgin which Christ committed to them with the adultery of heretics? I suppose they will allege that no injunction was ever addressed to them by Him or by His apostles concerning depraved[^2300] and perverse doctrines assailing them,[^2301] or about their avoiding and abhorring the same. (He and His apostles, perhaps,) will acknowledge[^2302] that the blame rather lies with themselves and their disciples, in not having given us previous warning and instruction! They[^2303] will, besides, add a good deal respecting the high authority of each doctor of heresy,—how that these mightily strengthened belief in their own doctrine; how that they raised the dead, restored the sick, foretold the future, that so they might deservedly be regarded as apostles. As if this caution were not also in the written record: that many should come who were to work even the greatest miracles, in defence of the deceit of their corrupt preaching. So, forsooth, they will deserve to be forgiven! If, however, any, being mindful of the writings and the denunciations of the Lord and the apostles, shall have stood firm in the integrity of the faith, I suppose *they* will run great risk of missing pardon, when the Lord answers: I plainly forewarned you that there should be teachers of false doctrine in my name, as well as that of the prophets and apostles also; and to my own disciples did I give a charge, that they should preach the same things to you. But as for you, it was not, of course, to be supposed[^2304] that you would believe me! I once gave the gospel and the doctrine of the said rule (of life and faith) to my apostles; but afterwards it was my pleasure to make considerable changes in it! I had promised a resurrection, even of the flesh; but, on second thoughts, it struck me[^2305] that I might not be able to keep my promise! I had shown myself to have been born of a virgin; but this seemed to me afterwards to be a discreditable thing.[^2306] I had said that He was my Father, who is the Maker of the sun and the showers; but another and better father has adopted me! I had forbidden you to lend an ear to heretics; but in this I erred! Such (blasphemies), it is possible,[^2307] do enter the minds of those who go out of the right path,[^2308] and who do not defend[^2309] the true faith from the danger which besets it. On the present occasion, indeed, our treatise has rather taken up a general position against heresies, (showing that they must) all be refuted on definite, equitable, and necessary rules, without[^2310] any comparison with the Scriptures. For the rest, if God in His grace permit, we shall prepare answers to certain of these heresies in separate treatises.[^2311] To those who may devote their leisure in reading through these (pages), in the belief of the truth, be peace, and the grace of our God Jesus Christ for ever.[^2312]" },
  { t = "note", id = "2299", text = "2 Cor. v. 10." },
  { t = "note", id = "2300", text = "Scævis." },
  { t = "note", id = "2301", text = "Futuris." },
  { t = "note", id = "2302", text = "It seems to us, that this is the force of the strong irony, indicated by the “credo,” which pervades this otherwise unintelligible passage. Dodgson’s version seems untenable: “Let them (the heretics) acknowledge that the fault is with themselves rather than with those who prepared us so long beforehand.”" },
  { t = "note", id = "2303", text = "Christ and His apostles, as before, in continuation of the strong irony." },
  { t = "note", id = "2304", text = "This must be the force of a sentence which is steeped in irony: “Scilicet cum vos non crederetis.” We are indebted to Oehler for restoring the sentence thus." },
  { t = "note", id = "2305", text = "Recogitavi." },
  { t = "note", id = "2306", text = "Turpe." },
  { t = "note", id = "2307", text = "Capit." },
  { t = "note", id = "2308", text = "Exorbitant." },
  { t = "note", id = "2309", text = "Cavent." },
  { t = "note", id = "2310", text = "This sense comes from the “repellendas” and the “a collatione Scripturarum.”" },
  { t = "note", id = "2311", text = "Specialiter. He did this, indeed, in his treatises against Marcion, Hermogenes, the Valentinians, Praxeas, and others. [These are to follow in this Series. Kaye (p. 47) justly considered this sentence as proving the *De Præscript*, a preface to all his treatises against particular heresies.]" },
  { t = "note", id = "2312", text = "Elucidation V." },
]

[[section]]
id = "elucidations"
title = "Elucidations."
level = 1
blocks = [
  { t = "h", text = "I." },
  { t = "h", text = "(Prescription, Chap. I., p. 243, *Supra*.*)*" },
  { t = "p", text = "In adopting this expression from the Roman Law, Tertullian has simply puzzled beginners to get at his idea. Nor do they learn much when it is called a *demurrer*, which, if I comprehend the word as used in law-cases, is a rejoinder to the testimony of the other party, amounting to—“Well, what of it? It does not prove your case.” Something like this is indeed in Tertullian’s use of the term *præscription*; but Dr. Holmes furnishes what seems to me the best explanation, (though he only half renders it,) “the Prescriptive Rule against Heresies.” In a word, it means, “*the Rule of Faith* asserted against Heresies.” And his practical point is, it is useless to discuss Scripture with convicted (Titus iii. 10, 11.) heretics; every one of them is ready with “his psalm, his doctrine, his interpretation,” and you may argue fruitlessly till Doomsday. But bring them to the test of (*Quod Semper*, etc.), the apostolic *præscription* (1 Corinthians xi. 16).—*We have no such custom neither the Churches of God*. State this *Rule of Faith*, viz. Holy Scripture, as interpreted from the apostolic day: if it proves the doctrine or custom a *novelty*, then it has no foundation, and even if it be harmless, it cannot be innocently professed against the order and peace of the churches." },
  { t = "h", text = "II." },
  { t = "h", text = "(Semler, cap. x., note 15, p. 248.)" },
  { t = "p", text = "The extent to which Bp. Kaye has stretched his notice of this critic is to be accounted for by the fact that, for a time, the German School of the last century exerted a sad influence in England. In early life Dr. Pusey came near to being led away by it, and Hugh James Rose was raised up to resist it. Semler lived (at Halle and elsewhere) from a.d. 1725 to 1791. Kahnis in his invaluable manual, named below, thus speaks of his Patristic theories: “The history of the Kingdom of God became, under his hands, a world of atoms, which crossed each other as chaotically as the masses of notes which lay heaped up in the memory of Semler.…Under his pragmatical touches the halo of the martyrs faded, etc.” *Internal Hist. of German Protestantism* (since *circa* 1750, ) by Ch. Fred. Aug. Kahnis, D.D. (Lutheran) Professor at Leipzig. Translated. T. and F. Clark, Edinburgh, 1856." },
  { t = "h", text = "III." },
  { t = "h", text = "(Peter, cap. xxii. note 6, p. 253.)" },
  { t = "p", text = "In the treatise of Cyprian, *De Unitate*, we shall have occasion to speak fully on this interesting point. The reference to Kaye may suffice, here. But, since the inveterate confusion of all that is said of Peter with all that is claimed by a modern bishop for himself promotes a false view of this passage, it may be well to note (1) that St. Peter’s name is expounded by himself (1 Peter ii. 4, 5) so as to make Christ the Rock and *all believers* “lively stones”—or *Peters*—by faith in Him. St. Peter is often called *the rock*, most justly, in this sense, by a rhetorical play on his name: Christ the Rock and all believers “*lively stones*,” being cemented with Him by the Spirit. But, (2) this *specialty* of St. Peter, as such, belongs to him (*Cephas*) only. (3) So far as transmitted it belongs to no particular See. (4) The claim of Rome is disproved by *Præscription*. (5) Were it otherwise, it would not justify that See in making new articles of Faith. (6) Nor in its Schism with the East. (7) When it restores St. Peter’s Doctrine and Holiness, to the Latin Churches, there will be no quarrel about pre-eminence. Meantime, Rome’s *fallibility* is expressly taught in Romans xi. 18–21." },
  { t = "h", text = "IV." },
  { t = "h", text = "(The Apostles, cap. xxv. p. 254.)" },
  { t = "p", text = "Nothing less than a new incarnation of Christ and a new commission to new apostles can give us anything new in religion. This *præscription* is our Catholic answer to the Vatican oracles of our own time. These give us a new revelation, prefacing the Gospels (1) by defining the *immaculate conception* of Mary in the womb of her mother; and (2) adding a new chapter to the Acts of the Apostles, in defining the infallibility of a single bishop." },
  { t = "p", text = "Clearly, had Tertullian known anything of this last dogma of Latin Novelty, he would not have taken the trouble to write this treatise. He would have said to heretics, We can neither discuss Scripture nor Antiquity with you. Rome is the touchstone of dogma, and to its bishop we refer you." },
  { t = "h", text = "V." },
  { t = "h", text = "(Truth and Peace, cap. xliv. p. 265.)" },
  { t = "p", text = "The famous appeal of Bishop Jewel, known as “the Challenge at Paul’s Cross,” which he made in a sermon preached there on Passion Sunday, a.d. 1560, is an instance of “*Præscription* against heresies,” well worthy of being recalled, in a day which has seen Truth and Peace newly sacrificed to the ceaseless innovations of Rome. It is as follows:—“If any learned man of all our adversaries, or, if all the learned men that be alive, be able to bring *any one sufficient sentence* out of any old Catholic doctor or father; or out of any old general Council; or out of the Holy Scriptures of God;[^2313] or, any *one example* of the primitive Church, whereby it may be clearly and plainly proved, that—" },
  { t = "note", id = "2313", text = "It must be remembered that an appeal to Scripture lies behind Tertullian’s *Præscription*: only he will not discuss Holy Scripture with heretics." },
  { t = "p", text = "1. There was any private mass in the whole world at that time, for the space of six hundred years after Christ; or that—" },
  { t = "p", text = "2. There was then any communion ministered unto the people under one kind; or that—" },
  { t = "p", text = "3. The people had their common prayers, then, in a strange tongue that they understood not; or that—" },
  { t = "p", text = "4. The bishop of Rome was then called an universal bishop, or the head of the universal Church; or that—" },
  { t = "p", text = "5. The people was then taught to believe that Christ’s body is really, substantially, corporally, carnally or naturally in the Sacrament; or that—" },
  { t = "p", text = "6. His body is, or may be, in a thousand places or more, at one time; or that—" },
  { t = "p", text = "7. The priest did then hold up the Sacrament over his head; or that—" },
  { t = "p", text = "8. The people did then fall down and worship it with godly honour; or that—" },
  { t = "p", text = "9. The Sacrament was then, or now ought to be, hanged up under a canopy; or that—" },
  { t = "p", text = "10. In the Sacrament after the words of consecration there remaineth only the *accidents* and shews, without the *substance* of bread and wine; or that—" },
  { t = "p", text = "11. The priest then divided the Sacrament in three parts and afterwards received himself, alone; or that—" },
  { t = "p", text = "12. Whosoever had said the Sacrament is a pledge, a token, or a remembrance of Christ’s body, had therefore been judged a heretic; or that—" },
  { t = "p", text = "13. It was lawful, then, to have thirty, twenty, fifteen, ten, or five masses said in one Church, in one day; or that—" },
  { t = "p", text = "14. Images were then set up in churches to the intent the people might worship them; or that—" },
  { t = "p", text = "15. The lay people was then forbidden to read the word of God, in their own tongue:" },
  { t = "p", text = "“If any man alive be able to prove any of these articles, by any one clear or plain clause or sentence, either of the Scriptures, or of the old doctors, or of any old General Council, or by any Example of the Primitive Church; I promise, then, that I will give over and subscribe unto him.”" },
  { t = "p", text = "All this went far beyond the concession of *præscription* which makes little of *any one saying of any one Father*, and demands the general consent of Antiquity; but, it is needless to say that Jewel’s challenge has remained unanswered for more than three hundred years, and so it will be to all Eternity." },
  { t = "p", text = "With great erudition Jewel enlarged his propositions and maintained all his points. See his works, vol. I., p. 20 *et seqq*. Cambridge University Press, 1845." },
]

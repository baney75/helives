[[section]]
id = "the-research-after-definite-truth-enjoined-on"
title = "The Research After Definite Truth Enjoined on Us. When We Have Discovered This, We Should Be Content."
level = 1
blocks = [
  { t = "p", text = "Chapter IX.—The Research After Definite Truth Enjoined on Us. When We Have Discovered This, We Should Be Content." },
  { t = "p", text = "I now purposely[^1956] relinquish this ground of argument. Let it be granted, that the words, “Seek, and ye shall find,” were addressed to all men (equally). Yet even here one’s aim is[^1957] carefully to determine[^1958] the sense of the words[^1959] consistently with[^1960] (that reason),[^1961] which is the guiding principle[^1962] in all interpretation. (Now) no divine saying is so unconnected[^1963] and diffuse, that its *words* only are to be insisted on, and their *connection* left undetermined. But at the outset I lay down (this position) that there is some one, and therefore definite, thing taught by Christ, which the Gentiles are by all means bound to believe, and for that purpose to “seek,” in order that they may be able, when they have “found” it, to believe. However,[^1964] there can be no indefinite seeking for that which has been taught as one only definite thing. You must “seek” until you “find,” and believe when you have found; nor have you anything further to do but to keep what you have believed provided you believe this besides, that nothing else is to be believed, and therefore nothing else is to be sought, after you have found and believed what has been taught by Him who charges you to seek no other thing than that which He has taught.[^1965] When, indeed, any man doubts about this, proof will be forthcoming,[^1966] that we have in our possession[^1967] that which was taught by Christ. Meanwhile, such is my confidence in our proof, that I anticipate it, in the shape of an admonition to certain persons, not “to seek” anything beyond what they have believed—that this is what they ought to have sought, how to avoid[^1968] interpreting, “Seek, and ye shall find,” without regard to the rule of reason." },
  { t = "note", id = "1956", text = "Sponte." },
  { t = "note", id = "1957", text = "Expetit." },
  { t = "note", id = "1958", text = "Certare." },
  { t = "note", id = "1959", text = "Sensus." },
  { t = "note", id = "1960", text = "Cum." },
  { t = "note", id = "1961", text = "See Oehler’s note." },
  { t = "note", id = "1962", text = "Gubernaculo. See Irenæus, ii. 46, for a similar view (Rigalt.). Surely Dodgson’s version, if intelligible in itself even, incorrectly represents Tertullian’s sense." },
  { t = "note", id = "1963", text = "Dissoluta." },
  { t = "note", id = "1964", text = "Porro." },
  { t = "note", id = "1965", text = "[Not to be contented with Truth, once known, is a sin preceding that against the Holy Spirit, and this state of mind explains the judicial blindness inflicted on Lapsers, as asserted by St. Paul, 2 Thess. ii. 10, 13, where note—“they received not the *love* of the truth.” They had it and were not content with it.]" },
  { t = "note", id = "1966", text = "Constabit." },
  { t = "note", id = "1967", text = "Penes nos." },
  { t = "note", id = "1968", text = "Ne." },
]

[[section]]
id = "one-has-succeeded-in-finding-definite-truth"
title = "One Has Succeeded in Finding Definite Truth, When He Believes. Heretical Wits are Always Offering Many Things for Vain Discussion, But We are Not to Be Always Seeking."
level = 1
blocks = [
  { t = "p", text = "Chapter X.—One Has Succeeded in Finding Definite Truth, When He Believes. Heretical Wits are Always Offering Many Things for Vain Discussion, But We are Not to Be Always Seeking." },
  { t = "p", text = "Now the reason of this saying is comprised in three points: in the matter, in the time, in the limit.[^1969] In the matter, so that you must consider *what it is* you have to seek; in the time, *when* you have to seek; in the limit, *how long*. What you have “to seek,” then, is that which Christ has taught,[^1970] (and you must go on seeking) of course for such time as you fail to find,[^1971]—until indeed you find[^1972] it. But you have succeeded in finding[^1973] when you have believed. For you would not have believed if you had not found; as neither would you have sought except with a view to find. Your object, therefore, in seeking *was* to find; and your object in finding *was* to believe. All further delay for seeking and finding you have prevented[^1974] by believing. The very fruit of your seeking has determined for you this limit. This boundary[^1975] has He set for you Himself, who is unwilling that you should believe anything else than what He has taught, or, therefore, even seek for it. If, however, because so many other things have been taught by one and another, we are on that account bound to go on seeking, so long as we are able to find anything, we must (at that rate) be ever seeking, and never believe anything at all. For where shall be the end of seeking? where the stop[^1976] in believing? where the completion in finding? (Shall it be) with Marcion? But even Valentinus proposes (to us the) maxim, “Seek, and ye shall find.” (Then shall it be) with Valentinus? Well, but Apelles, too, will assail me with the same quotation; Hebion also, and Simon, and all in turn, have no other argument wherewithal to entice me, and draw me over to their side. Thus I shall be nowhere, and still be encountering[^1977] (that challenge), “Seek, and ye shall find,” precisely as if I had no resting-place;[^1978] as if (indeed) I had never found that which Christ has taught—that which ought[^1979] to be sought, that which must needs[^1980] be believed." },
  { t = "note", id = "1969", text = "In modo." },
  { t = "note", id = "1970", text = "This is, “*the matter*.”" },
  { t = "note", id = "1971", text = "“The time.”" },
  { t = "note", id = "1972", text = "“The limit.”" },
  { t = "note", id = "1973", text = "Invenisti." },
  { t = "note", id = "1974", text = "Fixisti, “determined.”" },
  { t = "note", id = "1975", text = "Fossam." },
  { t = "note", id = "1976", text = "Statio, “resting-place.”" },
  { t = "note", id = "1977", text = "Dum convenero." },
  { t = "note", id = "1978", text = "This is the rendering of Oehler’s text, “et velut si nusquam. There are other readings of this obscure passage, of which as we add the two most intelligible. The *Codex Agobardinus* has, “et velim si nunquam;” that is, “and I would that I were nowhere,” with no fixed belief—in such wise as never to have had the truth; not, as must now be, to have forfeited it. (Dodgson). This seems far-fetched, and inferior to the reading of Pamelius and his mss.: “et velint me sic esse nusquam;”—or (as Semler puts it) “velint sic nusquam;” i.e., “and they (the heretics) would wish me to be nowhere”—without the fixed faith of the Catholic. This makes good sense. [Semler is here mentioned, and if anybody wishes to understand what sort of editor he was, he may be greatly amused by Kaye’s examination of some of his positions, pp. 64–84. Elucidation II.]" },
  { t = "note", id = "1979", text = "Oportet." },
  { t = "note", id = "1980", text = "Necesse est. Observe these degrees of obligation." },
]

[[section]]
id = "after-we-have-believed-search-should-cease"
title = "After We Have Believed, Search Should Cease; Otherwise It Must End in a Denial of What We Have Believed. No Other Object Proposed for Our Faith."
level = 1
blocks = [
  { t = "p", text = "Chapter XI.—After We Have Believed, Search Should Cease; Otherwise It Must End in a Denial of What We Have Believed. No Other Object Proposed for Our Faith." },
  { t = "p", text = "There is impunity in erring, if there is no delinquency; although indeed to err it is itself an act of delinquency.[^1981] With impunity, I repeat, does a man ramble,[^1982] when he (purposely) deserts nothing. But yet, if I have believed what I was bound to believe, and then afterwards think that there is something new to be sought after, I of course expect that there is something else to be found, although I should by no means entertain such expectation, unless it were because I either had not believed, although I apparently had become a believer, or else have ceased to believe. If I thus desert my faith, I am found to be a denier thereof. Once for all I would say, No man seeks, except him who either never possessed, or else has lost (what he sought). The old woman (in the Gospel)[^1983] had lost one of her ten pieces of silver, and therefore she sought it;[^1984] when, however, she found it, she ceased to look for it. The neighbour was without bread, and therefore he knocked; but as soon as the door was opened to him, and he received the bread, he discontinued knocking.[^1985] The widow kept asking to be heard by the judge, because she was not admitted; but when her suit was heard, thenceforth she was silent.[^1986] So that there is a limit both to seeking, and to knocking, and to asking. “For to every one that asketh,” says He, “it shall be given, and to him that knocketh it shall be opened, and by him that seeketh it shall be found.”[^1987] Away with the man[^1988] who is ever seeking because he never finds; for he seeks there where nothing can be found. Away with him who is always knocking because it will never be opened to him; for he knocks where there is none (to open). Away with him who is always asking because he will never be heard; for he asks of one who does not hear." },
  { t = "note", id = "1981", text = "Quamvis et errare delinquere est." },
  { t = "note", id = "1982", text = "Vagatur." },
  { t = "note", id = "1983", text = "Anus illa." },
  { t = "note", id = "1984", text = "Luke xv. 8." },
  { t = "note", id = "1985", text = "Luke xi. 5." },
  { t = "note", id = "1986", text = "Luke xviii. 2, 3." },
  { t = "note", id = "1987", text = "Luke xi. 9." },
  { t = "note", id = "1988", text = "Viderit." },
]

[[section]]
id = "a-proper-seeking-after-divine-knowledge-which"
title = "A Proper Seeking After Divine Knowledge, Which Will Never Be Out of Place or Excessive, is Always Within the Rule of Faith."
level = 1
blocks = [
  { t = "p", text = "Chapter XII.—A Proper Seeking After Divine Knowledge, Which Will Never Be Out of Place or Excessive, is Always Within the Rule of Faith." },
  { t = "p", text = "As for us, although we must still seek, and *that* always, yet where ought our search to be made? Amongst the heretics, where all things are foreign[^1989] and opposed to our own verity, and to whom we are forbidden to draw near? What slave looks for food from a stranger, not to say an enemy of his master? What soldier expects to get bounty and pay from kings who are unallied, I might almost say hostile—unless forsooth he be a deserter, and a runaway, and a rebel? Even that old woman[^1990] searched for the piece of silver within her own house. It was also at his neighbour’s door that the persevering assailant kept knocking. Nor was it to a hostile judge, although a severe one, that the widow made her appeal. No man gets instruction[^1991] from that which tends to destruction.[^1992] No man receives illumination from a quarter where all is darkness. Let our “seeking,” therefore be in that which is our own, and from those who are our own: and concerning that which is our own,—that, and only that,[^1993] which can become an object of inquiry without impairing the rule of faith." },
  { t = "note", id = "1989", text = "Extranea." },
  { t = "note", id = "1990", text = "Although Tertullian calls her “anus,” St. Luke’s word is γυνή not γραῦς." },
  { t = "note", id = "1991", text = "Instrui potest." },
  { t = "note", id = "1992", text = "Unde destruitur." },
  { t = "note", id = "1993", text = "Idque dumtaxat." },
]

[[section]]
id = "summary-of-the-creed-or-rule-of"
title = "Summary of the Creed, or Rule of Faith. No Questions Ever Raised About It by Believers. Heretics Encourage and Perpetuate Thought Independent of Christ's Teaching."
level = 1
blocks = [
  { t = "p", text = "Chapter XIII.—Summary of the Creed, or Rule of Faith. No Questions Ever Raised About It by Believers. Heretics Encourage and Perpetuate Thought Independent of Christ’s Teaching." },
  { t = "p", text = "Now, with regard to this rule of faith—that we may from this point[^1994] acknowledge what it is which we defend—it is, you must know, that which prescribes the belief that there is one only God, and that He is none other than the Creator of the world, who produced all things out of nothing through His own Word, first of all sent forth;[^1995] that this Word is called His Son, *and*, under the name of God, was seen “in diverse manners” by the patriarchs, heard at all times in the prophets, at last brought down by the Spirit and Power of the Father into the Virgin Mary, was made flesh in her womb, and, being born of her, went forth as Jesus Christ; thenceforth He preached the new law and the new promise of the kingdom of heaven, worked miracles; having been crucified, He rose again the third day; (then) having ascended[^1996] into the heavens, He sat at the right hand of the Father; sent instead of Himself[^1997] the Power of the Holy Ghost to lead such as believe; will come with glory to take the saints to the enjoyment of everlasting life and of the heavenly promises, and to condemn the wicked to everlasting fire, after the resurrection of both these classes shall have happened, together with the restoration of their flesh. This rule, as it will be proved, was taught by Christ, and raises amongst ourselves no other questions than those which heresies introduce, and which make men heretics.[^1998]" },
  { t = "note", id = "1994", text = "Jam hinc." },
  { t = "note", id = "1995", text = "Primo omnium demissum. Literally, “sent down.” See on this *procession of the Son of God* to create the world, Bishop Bull’s *Defence of the Nicene Creed, etc*., by the translator of this work, pp. 445 and following." },
  { t = "note", id = "1996", text = "Ereptum, having been taken away." },
  { t = "note", id = "1997", text = "Vicariam. [Scott’s *Christian Life*, Vol. III. p. 64.]" },
  { t = "note", id = "1998", text = "[See Bunsen (Hippol. III. Notes, etc., p. 129.) for a castigated form of the Latin Creed, as used in Rome. Observe it lacks the word *Catholic*. But a much better study of these formulas may be found in Dupin’s comparative Table. First Cent. pp. 9–12.]" },
]

[[section]]
id = "curiosity-ought-not-range-beyond-the-rule"
title = "Curiosity Ought Not Range Beyond the Rule of Faith. Restless Curiosity, the Feature of Heresy."
level = 1
blocks = [
  { t = "p", text = "Chapter XIV.—Curiosity Ought Not Range Beyond the Rule of Faith. Restless Curiosity, the Feature of Heresy." },
  { t = "p", text = "So long, however, as its form exists in its proper order, you may seek and discuss as much as you please, and give full rein to[^1999] your curiosity, in whatever seems to you to hang in doubt, or to be shrouded in obscurity. You have at hand, no doubt, some learned[^2000] brother gifted with the grace of knowledge, some one of the experienced class, some one of your close acquaintance who is curious like yourself; although with yourself, a seeker he will, after all,[^2001] be quite aware[^2002] that it is better for you to remain in ignorance, lest you should come to know what you ought not, because you have acquired the knowledge of what you ought to know.[^2003] “Thy faith,” He says, “hath saved thee”[^2004] not *observe* your skill[^2005] in the Scriptures. Now, faith has been deposited in the rule; it has a law, and (in the observance thereof) salvation. Skill,[^2006] however, consists in curious art, having for its glory simply the readiness that comes from knack.[^2007] Let such curious art give place to faith; let such glory yield to salvation. At any rate, let them either relinquish their noisiness,[^2008] or else be quiet. To know nothing in opposition to the rule (of faith), is to know all things. (Suppose) that heretics were not enemies to the truth, so that we were not forewarned to avoid them, what sort of conduct would it be to agree with men who do themselves confess that they are still seeking? For if they are still seeking, they have not as yet found anything amounting to certainty; and therefore, whatever they seem for a while[^2009] to hold, they betray their own scepticism,[^2010] whilst they continue seeking. You therefore, who seek after their fashion, looking to those who are themselves ever seeking, a doubter to doubters, a waverer to waverers, must needs be “led, blindly by the blind, down into the ditch.”[^2011] But when, for the sake of deceiving us, they pretend that they are still seeking, in order that they may palm[^2012] their essays[^2013] upon us by the suggestion of an anxious sympathy,[^2014]—when, in short (after gaining an access to us), they proceed at once to insist on the necessity of our inquiring into such points as they were in the habit of advancing, then it is high time for us in moral obligation[^2015] to repel[^2016] them, so that they may know that it is not Christ, but themselves, whom we disavow. For since they are still seekers, they have no fixed tenets yet;[^2017] and being not fixed in tenet, they have not yet believed; and being not yet believers, they are not Christians. But even though they have their tenets and their belief, they still say that inquiry is necessary in order to discussion.[^2018] Previous, however, to the discussion, they deny what they confess not yet to have believed, so long as they keep it an object of inquiry. When men, therefore, are not Christians even on their own admission,[^2019] how much more (do they fail to appear such) to us! What sort of truth is that which they patronize,[^2020] when they commend it to us with a lie? Well, but they actually[^2021] treat of the Scriptures and recommend (their opinions) out of the Scriptures! To be sure they do.[^2022] From what other source could they derive arguments concerning the things of the faith, except from the records of the faith?" },
  { t = "note", id = "1999", text = "Omnem libidinem effundas, “pour out the whole desire for.”" },
  { t = "note", id = "2000", text = "Doctor, literally, “teacher.” See Eph. iv. 11; also above; chap. iii. p. 244." },
  { t = "note", id = "2001", text = "This seems to be the more probable meaning of *novissime* in this rather obscure sentence. Oehler treats it adverbially as “postremo,” and refers to a similar use of the word below in chap. xxx. Dr. Routh (and, after him, the translator in *The Library of the Fathers*, Tertullian, p. 448) makes the word a noun, “thou newest of novices,” and refers to Tertullian’s work, *against Praxeas*, chap. xxvii., for a like use. This seems to us too harsh for the present context." },
  { t = "note", id = "2002", text = "Sciet." },
  { t = "note", id = "2003", text = "See 1 Cor. xii. 8." },
  { t = "note", id = "2004", text = "Luke xviii. 42." },
  { t = "note", id = "2005", text = "Exercitatio." },
  { t = "note", id = "2006", text = "Exercitatio." },
  { t = "note", id = "2007", text = "De peritiæ studio." },
  { t = "note", id = "2008", text = "Non obstrepant." },
  { t = "note", id = "2009", text = "Interim." },
  { t = "note", id = "2010", text = "Dubitationem." },
  { t = "note", id = "2011", text = "Matt. xv. 14." },
  { t = "note", id = "2012", text = "Insinuent." },
  { t = "note", id = "2013", text = "Tractatus." },
  { t = "note", id = "2014", text = "Or, “by instilling an anxiety into us” (Dodgson)." },
  { t = "note", id = "2015", text = "Jam debemus." },
  { t = "note", id = "2016", text = "Refutare." },
  { t = "note", id = "2017", text = "Nondum tenent." },

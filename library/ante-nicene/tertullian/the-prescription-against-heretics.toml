[[section]]
id = "christ-s-word-seek-and-ye-shall"
title = "Christ's Word, Seek, and Ye Shall Find, No Warrant for Heretical Deviations from the Faith. All Christ's Words to the Jews are for Us, Not Indeed as Specific Commands, But as Principles to Be Applied."
level = 1
blocks = [
  { t = "p", text = "Chapter VIII.—Christ’s Word, Seek, and Ye Shall Find, No Warrant for Heretical Deviations from the Faith. All Christ’s Words to the Jews are for Us, Not Indeed as Specific Commands, But as Principles to Be Applied." },
  { t = "p", text = "I come now to the point which (is urged both by our own brethren and by the heretics). Our brethren adduce *it* as a pretext for entering on curious inquiries,[^1930] and the heretics insist on it for importing the scrupulosity (of their unbelief).[^1931] It is written, they say, “Seek, and ye shall find.”[^1932] Let us remember at what time the Lord said this. I think it was at the very outset of His teaching, when there was still a doubt felt by all whether He were the Christ, and when even Peter had not yet declared Him to be the Son of God, and John (Baptist) had actually ceased to feel assurance about Him.[^1933] With good reason, therefore, was it then said, “Seek, and ye shall find,” when inquiry was still be to made of Him who was not yet become known. Besides, this *was said* in respect of the Jews. For it is to them that the whole matter[^1934] of this reproof[^1935] pertains, seeing that they had (a revelation) where they might seek Christ." },
  { t = "note", id = "1930", text = "Curiositatem." },
  { t = "note", id = "1931", text = "Scrupulositatem, “hair-splitting.”" },
  { t = "note", id = "1932", text = "Matt. vii. 7." },
  { t = "note", id = "1933", text = "See our translation of the *Anti-Marcion*, iv. 18 (*infra*), and Tertullian’s treatise, *de Bapt*. x." },
  { t = "note", id = "1934", text = "Sermo." },
  { t = "note", id = "1935", text = "Suggillationis." },
  { t = "p", text = "“They have,” says He, “Moses and Elias,”[^1936]—in other words, the law and the prophets, which preach Christ; as also in another place He says plainly, “Search the Scriptures, in which ye expect (to find) salvation; for they testify of me;”[^1937] which will be the meaning of “Seek, and ye shall find.” For it is clear that the next words also apply to the Jews: “Knock, and it shall be opened unto you.”[^1938] The Jews had formerly been in covenant with[^1939] God; but being afterwards cast off on account of their sins, they began to be[^1940] without God. The Gentiles, on the contrary, had never been in covenant with God; they were only as “a drop from a bucket,” and “as dust from the threshing floor,”[^1941] and were ever outside the door. Now, how shall he who was always outside knock at the place where he never was? What door does he know of, when he has passed through none, either by entrance or ejection? Is it not rather he who is aware that he once lived within and was thrust out, that (probably) found the door and knocked thereat? In like manner, “Ask, and ye shall receive,”[^1942] is suitably said[^1943] to one who was aware from whom he ought to ask,—by whom also some promise had been given; that is to say, “the God of Abraham, of Isaac, and of Jacob.” Now, the Gentiles knew nothing either of Him, or of any of His promises. Therefore it was to Israel that he spake when He said, “I am not sent but to the lost sheep of the house of Israel.”[^1944] Not yet had He “cast to the dogs the children’s bread;”[^1945] not yet did He charge them to “go into the way of the Gentiles.”[^1946] It is only at the last that He instructs them to “go and teach all nations, and baptize them,”[^1947] when they were so soon to receive “the Holy Ghost, the Comforter, who should guide them into all the truth.”[^1948] And this, too, makes towards the same conclusion. If the apostles, who were ordained[^1949] to be teachers to the Gentiles, were themselves to have the Comforter for their teacher, far more needless[^1950] was it to say to us, “Seek, and ye shall find,” to whom was to come, without research,[^1951] our instruction[^1952] by the apostles, and to the apostles themselves by the Holy Ghost. All the Lord’s sayings, indeed, are set forth for all men; through the ears of the Jews have they passed on to us. Still most of them were addressed to *Jewish* persons;[^1953] they therefore did not constitute instruction properly designed[^1954] for ourselves, but *rather* an example.[^1955]" },
  { t = "note", id = "1936", text = "Luke xvi. 29." },
  { t = "note", id = "1937", text = "John v. 39." },
  { t = "note", id = "1938", text = "Matt. vii. 7." },
  { t = "note", id = "1939", text = "Penes." },
  { t = "note", id = "1940", text = "Or, “were for the first time.”" },
  { t = "note", id = "1941", text = "Isa. xl. 15." },
  { t = "note", id = "1942", text = "Matt. vii. 7." },
  { t = "note", id = "1943", text = "Competit." },
  { t = "note", id = "1944", text = "Matt. xv. 24." },
  { t = "note", id = "1945", text = "Ver. 26." },
  { t = "note", id = "1946", text = "Matt. x. 5." },
  { t = "note", id = "1947", text = "Matt. xxviii. 19." },
  { t = "note", id = "1948", text = "John xvi. 13." },
  { t = "note", id = "1949", text = "Destinati." },
  { t = "note", id = "1950", text = "Multo magis vacabat." },
  { t = "note", id = "1951", text = "Ultro." },
  { t = "note", id = "1952", text = "Doctrina." },
  { t = "note", id = "1953", text = "In personas, i.e., *Judæorum* (Oehler)." },
  { t = "note", id = "1954", text = "Proprietatem admonitionis." },
  { t = "note", id = "1955", text = "“That is, not a specific command” primarily meant for us, but a principle “to be applied by us” (Dodgson)." },

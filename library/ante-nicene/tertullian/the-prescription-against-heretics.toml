  { t = "note", id = "1865", text = "[Here the word martyr means no more than a *witness* or *confessor*, and may account for what are called *exaggerated statements* as to the number of primitive martyrs. See Kaye p. 128.]" },
  { t = "note", id = "1866", text = "Obtinere." },

[[section]]
id = "heretics-not-to-be-allowed-to-argue"
title = "Heretics Not to Be Allowed to Argue Out of the Scriptures. The Scriptures, in Fact, Do Not Belong to Them."
level = 1
blocks = [
  { t = "p", text = "Chapter XV.—Heretics Not to Be Allowed to Argue Out of the Scriptures. The Scriptures, in Fact, Do Not Belong to Them.[^2023]" },
  { t = "note", id = "2023", text = "[See *Marcion*, B. I. Cap. xxii. *infra*, note.]" },
  { t = "p", text = "We are therefore come to (the gist of) our position; for at this point we were aiming, and for this we were preparing in the preamble of our address (which we have just completed),—so that we may now join issue on the contention to which our adversaries challenge us. They put forward[^2024] the Scriptures, and by this insolence[^2025] of theirs they at once influence some. In the encounter itself, however, they weary the strong, they catch the weak, and dismiss waverers with a doubt. Accordingly, we oppose to them this step above all others, of not admitting them to any discussion of the Scriptures.[^2026]" },
  { t = "note", id = "2024", text = "Obtendunt." },
  { t = "note", id = "2025", text = "Audacia." },
  { t = "note", id = "2026", text = "De Scripturis. But as this preposition is often the sign of the *instrument* in Tertullian, this phrase may mean “*out of*,” or “*by means of* the Scriptures.” See the last chapter." },
  { t = "p", text = "If in these lie their resources, before they can use them, it ought to be clearly seen to whom belongs the possession of the Scriptures, that none may be admitted to the use thereof who has no title at all to the privilege." },
]

[[section]]
id = "apostolic-sanction-to-this-exclusion-of-heretics"
title = "Apostolic Sanction to This Exclusion of Heretics from the Use of the Scriptures. Heretics, According to the Apostle, are Not to Be Disputed With, But to Be Admonished."
level = 1
blocks = [
  { t = "p", text = "Chapter XVI.—Apostolic Sanction to This Exclusion of Heretics from the Use of the Scriptures. Heretics, According to the Apostle, are Not to Be Disputed With, But to Be Admonished." },
  { t = "p", text = "I might be thought to have laid down this position to remedy distrust in my case,[^2027] or from a desire of entering on the contest[^2028] in some other way, were there not reasons on my side, especially this, that our faith owes deference[^2029] to the apostle, who forbids us to enter on “questions,” or to lend our ears to new-fangled statements,[^2030] or to consort with a heretic “after the first and second admonition,”[^2031] not, (be it observed,) after discussion. Discussion he has inhibited in this way, by designating *admonition* as the purpose of dealing with a heretic, and the *first* one too, because he is not a Christian; in order that he might not, after the manner of a Christian, seem to require correction again and again, and “before two or three witnesses,”[^2032] seeing that he ought to be corrected, for the very reason that he is not to be disputed with; and in the next place, because a controversy over the Scriptures can, clearly,[^2033] produce no other effect than help to upset either the stomach or the brain." },
  { t = "note", id = "2027", text = "De consilio diffidentiæ." },
  { t = "note", id = "2028", text = "Constitutionis, “prima causarum conflictio,”—a term of the law courts." },
  { t = "note", id = "2029", text = "Obsequium." },
  { t = "note", id = "2030", text = "1 Tim. vi. 3, 4." },
  { t = "note", id = "2031", text = "Tit. iii. 10." },
  { t = "note", id = "2032", text = "Matt. xviii. 16." },
  { t = "note", id = "2033", text = "Plane, ironical." },
]

[[section]]
id = "heretics-in-fact-do-not-use-but"
title = "Heretics, in Fact, Do Not Use, But Only Abuse, Scripture. No Common Ground Between Them and You."
level = 1
blocks = [
  { t = "p", text = "Chapter XVII.—Heretics, in Fact, Do Not Use, But Only Abuse, Scripture. No Common Ground Between Them and You." },
  { t = "p", text = "Now this heresy of yours[^2034] does not receive certain Scriptures; and whichever of them it does receive, it perverts by means of additions and diminutions, for the accomplishment of it own purpose; and such as it does receive, it receives not in their entirety; but even when it does receive any up to a certain point[^2035] as entire, it nevertheless perverts even these by the contrivance of diverse interpretations. Truth is just as much opposed by an adulteration of its meaning as it is by a corruption of its text.[^2036] Their vain presumptions must needs refuse to acknowledge the (writings) whereby they are refuted. They rely on those which they have falsely put together, and which they have selected, because of[^2037] their ambiguity. Though most skilled[^2038] in the Scriptures, you will make no progress,[^2039] when everything which you maintain is denied on the other side, and whatever you deny is (by them) maintained. As for yourself, indeed, you will lose nothing but your breath, and gain nothing but vexation from their blasphemy." },
  { t = "note", id = "2034", text = "Ista hæresis." },
  { t = "note", id = "2035", text = "Aliquatenus." },
  { t = "note", id = "2036", text = "Stilus." },
  { t = "note", id = "2037", text = "“De” has often the sense of “propter” in our author." },
  { t = "note", id = "2038", text = "Literally, “O most skilled.”" },
  { t = "note", id = "2039", text = "Quid promovebis." },
]

[[section]]
id = "great-evil-ensues-to-the-weak-in"
title = "Great Evil Ensues to the Weak in Faith, from Any Discussion Out of the Scriptures. Conviction Never Comes to the Heretic from Such a Process."
level = 1
blocks = [
  { t = "p", text = "Chapter XVIII.—Great Evil Ensues to the Weak in Faith, from Any Discussion Out of the Scriptures. Conviction Never Comes to the Heretic from Such a Process." },
  { t = "p", text = "But with respect to the man for whose sake you enter on the discussion of the Scriptures,[^2040] with the view of strengthening him when afflicted with doubts, (let me ask) will it be to the truth, or rather to heretical opinions that he will lean? Influenced by the very fact that he sees you have made no progress, whilst the other side is on an equal footing[^2041] (with yourself) in denying and in defence, or at any rate on a like standing[^2042] he will go away confirmed in his uncertainty[^2043] by the discussion, not knowing which side to adjudge heretical. For, no doubt, they too are able[^2044] to retort these things on us. It is indeed a necessary consequence that they should go so far as to say that adulterations of the Scriptures, and false expositions thereof, are rather introduced by ourselves, inasmuch as they, no less than we[^2045] maintain that truth is on their side." },
  { t = "note", id = "2040", text = "Or, “from the Scriptures.”" },
  { t = "note", id = "2041", text = "Æquo gradu." },
  { t = "note", id = "2042", text = "Statu certe pari." },
  { t = "note", id = "2043", text = "Incertior." },
  { t = "note", id = "2044", text = "Habent." },
  { t = "note", id = "2045", text = "Proinde." },
]

[[section]]
id = "appeal-in-discussion-of-heresy-lies-not"
title = "Appeal, in Discussion of Heresy, Lies Not to the Scriptures. The Scriptures Belong Only to Those Who Have the Rule of Faith."
level = 1
blocks = [
  { t = "p", text = "Chapter XIX.—Appeal, in Discussion of Heresy, Lies Not to the Scriptures. The Scriptures Belong Only to Those Who Have the Rule of Faith." },
  { t = "p", text = "Our appeal, therefore, must not be made to the Scriptures; nor must controversy be admitted on points in which victory will either be impossible,[^2046] or uncertain, or not certain enough.[^2047] But even if a discussion from the Scriptures[^2048] should not turn out in such a way as to place both sides on a par, (yet) the natural order of things would require that this point should be first proposed, which is now the only one which we must discuss: “With whom lies that very faith to which the Scriptures belong.[^2049] From what and through whom, and when, and to whom, has been handed down that rule,[^2050] by which men become Christians?” For wherever it shall be manifest that the true Christian rule and faith shall be, *there* will likewise be the true Scriptures and expositions thereof, and all the Christian traditions." },
  { t = "note", id = "2046", text = "Nulla." },
  { t = "note", id = "2047", text = "Parum certa." },
  { t = "note", id = "2048", text = "Conlatio scripturarum, or, “a polemical comparison of the Scriptures.”" },
  { t = "note", id = "2049", text = "Quibus competat fides ipsa cujus sint Scripturæ." },
  { t = "note", id = "2050", text = "Disciplina [or, where was the guide-post set?]" },
]

[[section]]
id = "christ-first-delivered-the-faith-the-apostles"
title = "Christ First Delivered the Faith. The Apostles Spread It; They Founded Churches as the Depositories Thereof. That Faith, Therefore, is Apostolic, Which Descended from the Apostles, Through Apostolic Churches."
level = 1
blocks = [
  { t = "p", text = "Chapter XX.—Christ First Delivered the Faith. The Apostles Spread It; They Founded Churches as the Depositories Thereof. That Faith, Therefore, is Apostolic, Which Descended from the Apostles, Through Apostolic Churches." },
  { t = "p", text = "Christ Jesus our Lord (may He bear with me a moment in thus expressing myself!), whosoever He is, of what God soever He is the Son, of what substance soever He is man and God, of what faith soever He is the teacher, of what reward soever He is the Promiser, did, whilst He lived on earth, Himself declare what He was, what He had been, what the Father’s will was which He was administering, what the duty of man was which He was prescribing; (and this declaration He made,) either openly to the people, or privately to His disciples, of whom He had chosen the twelve chief ones to be at His side,[^2051] and whom He destined to be the teachers of the nations. Accordingly, after one of these had been struck off, He commanded the eleven others, on His departure to the Father, to “go and teach *all* nations, who were to be baptized into the Father, and into the Son, and into the Holy Ghost.”[^2052] Immediately, therefore, so did the apostles, whom this designation indicates as “*the sent*.” Having, on the authority of a prophecy, which occurs in a psalm of David,[^2053] chosen Matthias by lot as the twelfth, into the place of Judas, they obtained the promised power of the Holy Ghost for the gift of miracles and of utterance; and after first bearing witness to the faith in Jesus Christ throughout Judæa, and founding churches (there), they next went forth into the world and preached the same doctrine of the same faith to the nations. They then in like manner founded churches in every city, from which all the other churches, one after another, derived the tradition of the faith,[^2054] and the seeds of doctrine, and are every day deriving them,[^2055] that they may become churches. Indeed, it is on this account only that they will be able to deem themselves apostolic, as being the offspring of apostolic churches. Every sort of thing[^2056] must necessarily revert to its original for its classification.[^2057] Therefore the churches, although they are so many and so great, comprise but the one primitive church, (founded) by the apostles, from which they all (spring). In this way all are primitive, and all are apostolic, whilst they are all proved to be one, in (unbroken) unity, by their peaceful communion,[^2058] and title of brotherhood, and bond[^2059] of hospitality,—privileges[^2060] which no other rule directs than the one tradition of the selfsame mystery.[^2061]" },
  { t = "note", id = "2051", text = "Mark iv. 34." },
  { t = "note", id = "2052", text = "Matt. xxviii. 19." },
  { t = "note", id = "2053", text = "Ps. cix. 8; comp. with Acts i. 15–20." },
  { t = "note", id = "2054", text = "Traducem fidei." },
  { t = "note", id = "2055", text = "Mutuantur “borrowing.”" },
  { t = "note", id = "2056", text = "Omne genus." },
  { t = "note", id = "2057", text = "Censeatur or, “for its origin.”" },
  { t = "note", id = "2058", text = "Communicatio pacis." },
  { t = "note", id = "2059", text = "Contesseratio. [3 John 8.]" },
  { t = "note", id = "2060", text = "Jura, “rights.”" },
  { t = "note", id = "2061", text = "That is, of the faith, or Christian creed." },
]

[[section]]
id = "all-doctrine-true-which-comes-through-the"
title = "All Doctrine True Which Comes Through the Church from the Apostles, Who Were Taught by God Through Christ. All Opinion Which Has No Such Divine Origin and Apostolic Tradition to Show, is Ipso Facto False."
level = 1
blocks = [
  { t = "p", text = "Chapter XXI.—All Doctrine True Which Comes Through the Church from the Apostles, Who Were Taught by God Through Christ. All Opinion Which Has No Such Divine Origin and Apostolic Tradition to Show, is Ipso Facto False." },
  { t = "p", text = "From this, therefore, do we draw up our rule. Since the Lord Jesus Christ sent the apostles to preach, (our rule is) that no others ought to be received as preachers than those whom Christ appointed; for “no man knoweth the Father save the Son, and he to whomsoever the Son will reveal Him.”[^2062] Nor does the Son seem to have revealed Him to any other than the apostles, whom He sent forth to preach—that, of course, which He revealed to them. Now, what that was which they preached—in other words, what it was which Christ revealed to them—can, as I must here likewise prescribe, properly be proved in no other way than by those very churches which the apostles founded in person, by declaring the gospel to them directly themselves, both *vivâ voce*, as the phrase is, and subsequently by their epistles. If, then, these things are so, it is in the same degree[^2063] manifest that all doctrine which agrees with the apostolic churches—those moulds[^2064] and original sources of the faith must be reckoned for truth, as undoubtedly containing that which the (said) churches received from the apostles, the apostles from Christ, Christ from God. Whereas all doctrine must be prejudged[^2065] as false[^2066] which savours of contrariety to the truth of the churches and apostles of Christ and God. It remains, then, that we demonstrate whether this doctrine of ours, of which we have now given the rule, has its origin[^2067] in the tradition of the apostles, and whether all other *doctrines* do not *ipso facto*[^2068]proceed from falsehood. We hold communion with the apostolic churches because our doctrine is in no respect different *from theirs*. This is *our* witness of truth." },
  { t = "note", id = "2062", text = "Matt. xi. 27." },
  { t = "note", id = "2063", text = "Perinde." },
  { t = "note", id = "2064", text = "Matricibus." },
  { t = "note", id = "2065", text = "Præjudicandam. [This then is *Præscription*.]" },
  { t = "note", id = "2066", text = "De mendacio." },
  { t = "note", id = "2067", text = "Censeatur." },
  { t = "note", id = "2068", text = "Ex hoc ipso, “from this very circumstance.”" },
]

[[section]]
id = "attempt-to-invalidate-this-rule-of-faith"
title = "Attempt to Invalidate This Rule of Faith Rebutted. The Apostles Safe Transmitters of the Truth. Sufficiently Taught at First, and Faithful in the Transmission."
level = 1
blocks = [
  { t = "p", text = "Chapter XXII.—Attempt to Invalidate This Rule of Faith Rebutted. The Apostles Safe Transmitters of the Truth. Sufficiently Taught at First, and Faithful in the Transmission." },
  { t = "p", text = "But inasmuch as the proof is so near at hand,[^2069] that if it were at once produced there would be nothing left to be dealt with, let us give way for a while to the opposite side, if they think that they can find some means of invalidating this rule, just as if no proof were forthcoming from us. They usually tell us that the apostles did not know all things: (but herein) they are impelled by the same madness, whereby they turn round to the very opposite point,[^2070] and declare that the apostles certainly knew all things, but did not deliver all things to all persons,—in either case exposing Christ to blame for having sent forth apostles who had either too much ignorance, or too little simplicity. What man, then, of sound mind can possibly suppose that they were ignorant of anything, whom the Lord ordained to be masters (or teachers),[^2071] keeping them, as He did, inseparable (from Himself) in their attendance, in their discipleship, in their society, to whom, “when they were alone, He used to expound” all things[^2072] which were obscure, telling them that “to them it was given to know those mysteries,”[^2073] which it was not permitted the people to understand? Was anything withheld from the knowledge of Peter, who is called “the rock on which the church should be built,”[^2074] who also obtained “the keys of the kingdom of heaven,”[^2075] with the power of “loosing and binding in heaven and on earth?”[^2076] Was anything, again, concealed from John, the Lord’s most beloved disciple, who used to lean on His breast[^2077] to whom alone the Lord pointed Judas out as the traitor,[^2078] whom He commended to Mary as a son in His own stead?[^2079] Of what could He have meant those to be ignorant, to whom He even exhibited His own glory with Moses and Elias, and the Father’s voice moreover, from heaven?[^2080] Not as if He thus disapproved[^2081] of all the rest, but because “by three witnesses must every word be established.”[^2082] After the same fashion,[^2083] too, (I suppose,) were they ignorant to whom, after His resurrection also, He vouchsafed, as they were journeying together, “to expound all the Scriptures.”[^2084] No doubt[^2085] He had once said, “I have yet many things to say unto you, but ye cannot hear them now;” but even then He added, “When He, the Spirit of truth, shall come, He will lead you into all truth.”[^2086] He (thus) shows that there was nothing of which they were ignorant, to whom He had promised the future attainment of all truth by help of the Spirit of truth. And assuredly He fulfilled His promise, since it is proved in the Acts of the Apostles that the Holy Ghost did come down. Now they who reject that Scripture[^2087] can neither belong to the Holy Spirit, seeing that they cannot acknowledge that the Holy Ghost has been sent as yet to the disciples, nor can they presume to claim to be a church themselves[^2088] who positively have no means of proving when, and with what swaddling-clothes[^2089] this body was established. Of so much importance is it to them not to have any proofs for the things which they maintain, lest along with them there be introduced damaging exposures[^2090] of those things which they mendaciously devise." },
  { t = "note", id = "2069", text = "Expedita." },
  { t = "note", id = "2070", text = "Susam rursus convertun." },
  { t = "note", id = "2071", text = "Magistros." },
  { t = "note", id = "2072", text = "Mark iv. 34." },
  { t = "note", id = "2073", text = "Matt. xiii. 11." },
  { t = "note", id = "2074", text = "Matt. xvi. 18. [See Kaye p. 222, also Elucidation II.]" },
  { t = "note", id = "2075", text = "Ver. 19." },
  { t = "note", id = "2076", text = "Ver. 19." },
  { t = "note", id = "2077", text = "John xxi. 20." },
  { t = "note", id = "2078", text = "John xiii. 25. [N.B. loco suo.]" },
  { t = "note", id = "2079", text = "John xix. 26." },
  { t = "note", id = "2080", text = "Matt. xvii. 1–8." },
  { t = "note", id = "2081", text = "Reprobans." },
  { t = "note", id = "2082", text = "Deut. xix. 15, and 2 Cor. xiii. 1." },
  { t = "note", id = "2083", text = "Itaque, ironical." },
  { t = "note", id = "2084", text = "Luke xxiv. 27." },
  { t = "note", id = "2085", text = "Plane." },
  { t = "note", id = "2086", text = "John xvi. 12, 13." },

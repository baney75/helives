[[section]]
id = "warnings-against-heresy-given-us-in-the"
title = "Warnings Against Heresy Given Us in the New Testament. Sundry Passages Adduced. These Imply the Possibility of Falling into Heresy."
level = 1
blocks = [
  { t = "p", text = "Chapter IV.—Warnings Against Heresy Given Us in the New Testament. Sundry Passages Adduced. These Imply the Possibility of Falling into Heresy." },
  { t = "p", text = "But let us rather be mindful of the sayings of the Lord, and of the letters of the apostles; for they have both told us beforehand that there shall be heresies, and have given us, in anticipation, warnings to avoid them; and inasmuch as we are not alarmed because they exist, so we ought not to wonder that they are capable of doing that, on account of which they must be shunned. The Lord teaches us that many “ravening wolves shall come in sheep’s clothing.”[^1883] Now, what are these sheep’s clothing’s, but the external surface of the Christian profession? Who are the ravening wolves but those deceitful senses and spirits which are lurking within to waste the flock of Christ? Who are the false prophets but deceptive predictors of the future? Who are the false apostles but the preachers of a spurious gospel?[^1884] Who also are the Antichrists, both now and evermore, but the men who rebel against Christ?[^1885] Heresies, at the present time, will no less rend the church by their perversion of doctrine, than will Antichrist persecute her at that day by the cruelty of his attacks,[^1886] except that persecution make seven martyrs, (but) heresy only apostates. And therefore “heresies must needs be in order that they which are approved might be made manifest,”[^1887] both those who remained stedfast under persecution, and those who did not wander out of their way[^1888] into heresy. For *the apostle* does not mean[^1889] that those persons should be deemed *approved* who exchange their creed for heresy; although they contrariously interpret his words to their own side, when he says in another passage, “Prove all things; hold fast that which is good;”[^1890] as if, after proving all things amiss, one might not through error make a determined choice of some evil thing." },
  { t = "note", id = "1883", text = "Matt. vii. 15." },
  { t = "note", id = "1884", text = "Adulteri evangelizatores, the spurious preachers of the gospel. [Galat. i. 8, 9, an example of Apostolic præscription.]" },
  { t = "note", id = "1885", text = "Hoc *scil*. “tempore.”" },
  { t = "note", id = "1886", text = "Oehler’s “persecutionem” ought of course to be “persecutionum.”" },
  { t = "note", id = "1887", text = "1 Cor. xi. 19." },
  { t = "note", id = "1888", text = "Exorbitaverint." },
  { t = "note", id = "1889", text = "Juvat." },
  { t = "note", id = "1890", text = "1 Thess. v. 21. [But Truth is to be demonstrated as a *theorem*, not treated as a *problem* of which we must seek the solution.]" },
]

[[section]]
id = "heresy-as-well-as-schism-and-dissension"
title = "Heresy, as Well as Schism and Dissension, Disapproved by St. Paul, Who Speaks of the Necessity of Heresies, Not as a Good, But, by the Will of God, Salutary Trials for Training and Approving the Faith of Christians."
level = 1
blocks = [
  { t = "p", text = "Chapter V.—Heresy, as Well as Schism and Dissension, Disapproved by St. Paul, Who Speaks of the Necessity of Heresies, Not as a Good, But, by the Will of God, Salutary Trials for Training and Approving the Faith of Christians." },
  { t = "p", text = "Moreover, when he blames dissensions and schisms, which undoubtedly are evils, he immediately adds *heresies* likewise. Now, that which he subjoins to evil things, he of course confesses to be itself an evil; and all the greater, indeed, because he tells us that his belief of their schisms and dissensions was grounded on his knowledge that “there must be heresies also.”[^1891] For he shows us that it was owing to the prospect of the greater evil that he readily believed the existence of the lighter ones; and so far indeed was he from believing, in respect of evils (of such a kind), that heresies were good, that his object was to forewarn us that we ought not to be surprised at temptations of even a worse stamp, since (he said) they tended “to make manifest all such as were approved;”[^1892] in other words, those whom they were unable to pervert.[^1893] In short, since the whole passage[^1894] points to the maintenance of unity and the checking of divisions, inasmuch as heresies sever men from unity no less than schisms and dissensions, no doubt he classes heresies under the same head of censure as he does schisms also and dissensions. And by so doing, he makes those to be “not approved,” who have fallen into heresies; more especially when with reproofs he exhorts[^1895] men to turn away from such, teaching them that they should “all speak and think the selfsame thing,”[^1896] the very object which heresies do not permit." },
  { t = "note", id = "1891", text = "1 Cor. xi. 19." },
  { t = "note", id = "1892", text = "1 Cor. xi. 18." },
  { t = "note", id = "1893", text = "Depravare." },
  { t = "note", id = "1894", text = "Capitulum." },
  { t = "note", id = "1895", text = "Objurget." },
  { t = "note", id = "1896", text = "1 Cor. i. 10." },
]

[[section]]
id = "heretics-are-self-condemned-heresy-is-self"
title = "Heretics are Self-Condemned. Heresy is Self-Will, Whilst Faith is Submission of Our Will to the Divine Authority. The Heresy of Apelles."
level = 1
blocks = [
  { t = "p", text = "Chapter VI.—Heretics are Self-Condemned. Heresy is Self-Will, Whilst Faith is Submission of Our Will to the Divine Authority. The Heresy of Apelles." },
  { t = "p", text = "On this point, however, we dwell no longer, since it is the same Paul who, in his Epistle to the Galatians, counts “heresies” among “the sins of the flesh,”[^1897] who also intimates to Titus, that “a man who is a heretic” must be “rejected after the first admonition,” on the ground that “he that is such is perverted, and committeth sin, as a self-condemned man.”[^1898] Indeed, in almost every epistle, when enjoining on us (the duty) of avoiding false doctrines, he sharply condemns[^1899] heresies. Of these the practical effects[^1900] are false doctrines, called in Greek *heresies*,[^1901] a word used in the sense of that *choice* which a man makes when he either teaches them (to others)[^1902] or takes up with them (for himself).[^1903] For this reason it is that he calls the heretic *self-condemned*,[^1904] because he has himself chosen that for which he is condemned. We, however, are not permitted to cherish any object[^1905] after our own will, nor yet to make choice of that which another has introduced of his private fancy. In the Lord’s apostles we possess our authority; for even they did not of themselves choose to introduce anything, but faithfully delivered to the nations (of mankind) the doctrine[^1906] which they had received from Christ. If, therefore, even “an angel from heaven should preach any other gospel” (than theirs), he would be called accursed[^1907] by us. The Holy Ghost had even then foreseen that there would be in a certain virgin (called) Philumene[^1908] an angel of deceit, “transformed into an angel of light,”[^1909] by whose miracles and illusions[^1910] Apelles was led (when) he introduced his new heresy." },
  { t = "note", id = "1897", text = "Gal. v. 20." },
  { t = "note", id = "1898", text = "Tit. iii. 10, 11." },
  { t = "note", id = "1899", text = "Taxat." },
  { t = "note", id = "1900", text = "Opera." },
  { t = "note", id = "1901", text = "Αἱρέσεις ." },
  { t = "note", id = "1902", text = "Instituendas." },
  { t = "note", id = "1903", text = "Suscipiendas." },
  { t = "note", id = "1904", text = "[A remarkable word is subjoined by the Apostle (ἐξέστραπται) which signifies *turned inside out*, and so self-condemned, as exhibiting his inward contentiousness and pravity." },
  { t = "note", id = "1905", text = "Nihil, any *doctrine*." },
  { t = "note", id = "1906", text = "Disciplinam, including both the principles and practice of the Christian religion." },
  { t = "note", id = "1907", text = "Anathema. See Gal. i. 8." },
  { t = "note", id = "1908", text = "Concerning Philumene, see below, chap. xxv.; *Eusebius, Hist. Eccl*. v. 13; Augustine, *de Hæres*, chap. xlii. ; Jerome, *Epist. adv. Ctesiph*. (*Works*, ed. Ben.) iv. 477, and in his Commentary on Galatians, ii. See also Tertullian, *Against Marcion*, p. 139, Edinb. Edition." },
  { t = "note", id = "1909", text = "2 Cor. xi. 14." },
  { t = "note", id = "1910", text = "Præstigiis." },
]

[[section]]
id = "pagan-philosophy-the-parent-of-heresies-the"
title = "Pagan Philosophy the Parent of Heresies. The Connection Between Deflections from Christian Faith and the Old Systems of Pagan Philosophy."
level = 1
blocks = [
  { t = "p", text = "Chapter VII.—Pagan Philosophy the Parent of Heresies. The Connection Between Deflections from Christian Faith and the Old Systems of Pagan Philosophy." },
  { t = "p", text = "These are “the doctrines” of men and “of demons”[^1911] produced for itching ears of the spirit of this world’s wisdom: this the Lord called “foolishness,”[^1912] and “chose the foolish things of the world” to confound even philosophy itself. For (philosophy) it is which is the material of the world’s wisdom, the rash interpreter of the nature and the dispensation of God. Indeed[^1913] heresies are themselves instigated[^1914] by philosophy. From this source came the Æons, and I known not what infinite forms,[^1915] and the trinity of man[^1916] in the system of Valentinus, who was of Plato’s school. From the same source came Marcion’s better god, with all his tranquillity; he came of the Stoics. Then, again, the opinion that the soul dies is held by the Epicureans; while the denial of the restoration of the body is taken from the aggregate school of all the philosophers; also, when matter is made equal to God, then you have the teaching of Zeno; and when any doctrine is alleged touching a god of fire, then Heraclitus comes in. The same subject-matter is discussed over and over again[^1917] by the heretics and the philosophers; the same arguments[^1918] are involved. Whence comes evil? Why is it permitted? What is the origin of man? and in what way does he come? Besides the question which Valentinus has very lately proposed—Whence comes God? Which he settles with the answer: From *enthymesis* and *ectroma*.[^1919] Unhappy Aristotle! who invented for these men dialectics, the art of building up and pulling down; an art so evasive in its propositions,[^1920] so far-fetched in its conjectures, so harsh, in its arguments, so productive of contentions—embarrassing[^1921] even to itself, retracting everything, and really treating of[^1922] nothing! Whence spring those “fables and endless genealogies,”[^1923] and “unprofitable questions,”[^1924] and “words which spread like a cancer?”[^1925] From all these, when the apostle would restrain us, he expressly names *philosophy* as that which he would have us be on our guard against. Writing to the Colossians, he says, “See that no one beguile you through philosophy and vain deceit, after the tradition of men, and contrary to the wisdom of the Holy Ghost.”[^1926] He had been at Athens, and had in his interviews (with its philosophers) become acquainted with that human wisdom which pretends to know the truth, whilst it only corrupts it, and is itself divided into its own manifold heresies, by the variety of its mutually repugnant sects. What indeed has Athens to do with Jerusalem? What concord is there between the Academy and the Church? what between heretics and Christians? Our instruction comes from “the porch of Solomon,”[^1927] who had himself taught that “the Lord should be sought in simplicity of heart.”[^1928] Away with[^1929] all attempts to produce a mottled Christianity of Stoic, Platonic, and dialectic composition! We want no curious disputation after possessing Christ Jesus, no inquisition after enjoying the gospel! With our faith, we desire no further belief. For this is our palmary faith, that there is nothing which we ought to believe besides." },
  { t = "note", id = "1911", text = "1 Tim. iv. 1." },
  { t = "note", id = "1912", text = "1 Cor. iii. 18 and 25." },
  { t = "note", id = "1913", text = "Denique." },
  { t = "note", id = "1914", text = "Subornantur." },
  { t = "note", id = "1915", text = "Formeæ, “*Ideæ*” (Oehler)." },
  { t = "note", id = "1916", text = "See Tertullian’s treatises, *adversus Valentinum*, xxv., and *de Anima*, xxi.; also Epiphanius, *Hær.* xxxi . 23." },
  { t = "note", id = "1917", text = "Volutatur." },
  { t = "note", id = "1918", text = "Retractatus." },
  { t = "note", id = "1919", text = "“De enthymesi;” for this word Tertullian gives *animationem* (in his tract against Valentinus, ix.), which seems to mean, “the mind in operation.” (See the same treatise, x. xi.) With regard to the other word, Jerome (on Amos. iii.) adduces Valentinus as calling Christ ἔκτρωμα, that is, *abortion*." },
  { t = "note", id = "1920", text = "Sententiis." },
  { t = "note", id = "1921", text = "Molestam." },
  { t = "note", id = "1922", text = "Tractaverit, in the sense of *conclusively settling*." },
  { t = "note", id = "1923", text = "1 Tim. i. 4." },
  { t = "note", id = "1924", text = "Tit. iii. 9." },
  { t = "note", id = "1925", text = "2 Tim. ii. 17." },
  { t = "note", id = "1926", text = "Col. ii. 8. The last clause, “præter providentiam Spiritus Sancti,” is either Tertullian’s reading, or his gloss of the *apostle’s* οὐ κατὰ Χριστόν—“not after Christ.”" },
  { t = "note", id = "1927", text = "Because in the beginning of the church the apostles taught in Solomon’s porch, Acts iii. 5." },
  { t = "note", id = "1928", text = "Wisdom of Solomon, i. 1." },

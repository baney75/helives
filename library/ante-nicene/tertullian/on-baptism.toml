[[section]]
id = "of-john-s-baptism"
title = "Of John's Baptism."
level = 1
blocks = [
  { t = "p", text = "Chapter X.—Of John’s Baptism." },
  { t = "p", text = "We have spoken, so far as our moderate ability permitted, of the *generals* which form the groundwork of the sanctity[^8636] of baptism. I will now, equally to the best of my power, proceed to the rest of its character, touching certain minor questions." },
  { t = "note", id = "8636", text = "Religionem." },
  { t = "p", text = "The baptism announced by John formed the subject, even at that time, of a question, proposed by the Lord Himself indeed to the Pharisees, whether that baptism were heavenly, or truly earthly:[^8637] about which they were unable to give a consistent[^8638] answer, inasmuch as they understood not, because they believed not. But *we*, with but as poor a measure of understanding as of faith, *are* able to determine that that baptism was *divine* indeed, (yet in respect of the command, not in respect of efficacy[^8639] too, in that we read that John was *sent by the Lord* to perform this duty,)[^8640] but *human* in its nature: for it conveyed nothing celestial, but it fore-ministered to things celestial; being, to wit, appointed over *repentance*, which is in man’s power.[^8641] In fact, the doctors of the law and the Pharisees, who were unwilling to “believe,” did not “repent” either.[^8642] But if repentance is a thing human, its baptism must necessarily be of the same nature: else, if it had been celestial, it would have given both the Holy Spirit and remission of sins. But none either pardons sins or freely grants the Spirit save God only.[^8643] Even the Lord Himself said that the Spirit would not descend on any other condition, but that He should first ascend to the Father.[^8644] What the Lord was not yet conferring, of course the servant could not furnish. Accordingly, in the Acts of the Apostles, we find that men who had “John’s baptism” had not received the Holy Spirit, whom they knew not even by hearing.[^8645] That, then, was no celestial thing which furnished no celestial (endowments): whereas the very thing which *was* celestial in John—the Spirit of prophecy—so completely failed, after the transfer of the whole Spirit to the Lord, that he presently sent to inquire whether He whom he had himself preached,[^8646] whom he had pointed out when coming to him, were “HE.”[^8647] And so “the baptism of repentance”[^8648] was dealt with[^8649] as if it were a candidate for the remission and sanctification shortly about to follow in Christ: for in that John used to preach “baptism *for* the remission of sins,”[^8650] the declaration was made with reference to *future* remission; if it be true, (as it is,) that repentance is antecedent, remission subsequent; and this is “preparing the way.”[^8651] But he who “prepares” does not himself “perfect,” but procures for another to perfect. John himself professes that the celestial things are not his, but Christ’s, by saying, “He who is from the earth speaketh concerning the earth; He who comes from the *realms* above is above all;”[^8652] and again, by saying that he “baptized in repentance only, but that One would shortly come who would baptize in the Spirit and fire;”[^8653]—of course because true and stable faith is baptized with *water*, unto salvation; pretended and weak faith is baptized with *fire*, unto judgment." },
  { t = "note", id = "8637", text = "Matt. xxi. 25; Mark xi. 30; Luke xx. 4." },
  { t = "note", id = "8638", text = "Constanter." },
  { t = "note", id = "8639", text = "Potestate." },
  { t = "note", id = "8640", text = "See John i. 33." },
  { t = "note", id = "8641", text = "It is difficult to see how this statement is to be reconciled with Acts v. 31. [i.e. under the universal illumination, John i. 9.]" },
  { t = "note", id = "8642", text = "Matt. iii. 7–12; xxi. 23, 31, 32." },
  { t = "note", id = "8643", text = "Mark ii. 8; 1 Thess. iv. 8; 2 Cor. i. 21, 22; v. 5." },
  { t = "note", id = "8644", text = "John xvi. 6, 7." },
  { t = "note", id = "8645", text = "Acts xix. 1–7. [John vii. 39.]" },
  { t = "note", id = "8646", text = "Matt. iii. 11, 12; John i. 6–36." },
  { t = "note", id = "8647", text = "Matt. xi. 2–6; Luke vii. 18–23. [He repeats this view.]" },
  { t = "note", id = "8648", text = "Acts xix. 4." },
  { t = "note", id = "8649", text = "Agebatur." },
  { t = "note", id = "8650", text = "Mark i. 4." },
  { t = "note", id = "8651", text = "Luke i. 76." },
  { t = "note", id = "8652", text = "John iii. 30, 31, briefly quoted." },
  { t = "note", id = "8653", text = "Matt. iii. 11, not quite exactly given." },
]

[[section]]
id = "answer-to-the-objection-that-the-lord"
title = "Answer to the Objection that “The Lord Did Not Baptize.”"
level = 1
blocks = [
  { t = "p", text = "Chapter XI.—Answer to the Objection that “The Lord Did Not Baptize.”" },
  { t = "p", text = "“But behold, “say some, “the Lord came, and baptized not; for we read, ‘And yet He used not to baptize, but His disciples!’”[^8654] As if, in truth, John had preached that He would baptize with His own hands! Of course, his words are not so to be understood, but as simply spoken after an ordinary manner; just as, for instance, we say, “The emperor set forth an edict,” or, “The prefect cudgelled him.” Pray does the emperor in person set forth, or the prefect in person cudgel? One whose ministers do a thing is always said to do it.[^8655] So “He will baptize you” will have to be understood as standing for, “Through Him,” or “Into Him,” “you will be baptized.” But let not (the fact) that “He Himself baptized not” trouble any. For into whom should He baptize? Into repentance? Of what use, then, do you make His forerunner? Into remission of sins, which He used to give by a word? Into Himself, whom by humility He was concealing? Into the Holy Spirit, who had not yet descended from the Father? Into the Church, which His apostles had not yet founded? And thus it was with the selfsame “baptism of John” that His disciples used to baptize, as ministers, with which John before had baptized as forerunner. Let none think it was with some other, because no other exists, except that of Christ subsequently; which at that time, of course, could not be given by His disciples, inasmuch as the glory of the Lord had not yet been fully attained,[^8656] nor the efficacy of the font[^8657] established through the passion and the resurrection; because neither can our death see dissolution except by the Lord’s passion, nor our life be restored without His resurrection." },
  { t = "note", id = "8654", text = "John iv. 2." },
  { t = "note", id = "8655", text = "For instances of this, compare Matt. viii. 5 with Luke vii. 3, 7; and Mark x. 35 with Matt. xx. 20." },
  { t = "note", id = "8656", text = "Cf. 1 Pet. i. 11, *ad fin.*" },
  { t = "note", id = "8657", text = "Lavacri." },
]

[[section]]
id = "of-the-necessity-of-baptism-to-salvation"
title = "Of the Necessity of Baptism to Salvation."
level = 1
blocks = [
  { t = "p", text = "Chapter XII.—Of the Necessity of Baptism to Salvation." },
  { t = "p", text = "When, however, the prescript is laid down that “without baptism, salvation is attainable by none” (chiefly on the ground of that declaration of the Lord, who says, “Unless one be born of water, he hath not life”[^8658]), there arise immediately scrupulous, nay rather audacious, doubts on the part of some, “how, in accordance with that prescript, salvation is attainable by the apostles, whom—Paul excepted—we do not find baptized in the Lord? Nay, since Paul is the only one of them who has put on *the garment of* Christ’s baptism,[^8659] either the peril of all the others who lack the water of Christ is prejudged, that the prescript may be maintained, or else the prescript is rescinded if salvation has been ordained even for the unbaptized.” I have heard—the Lord is my witness—doubts of that kind: that none may imagine me so abandoned as to excogitate, unprovoked, in the licence of my pen, ideas which would inspire others with scruple." },
  { t = "note", id = "8658", text = "John iii. 5, not fully given." },
  { t = "note", id = "8659", text = "See Gal. iii. 27." },
  { t = "p", text = "And now, as far as I shall be able, I will reply to them who affirm “that the apostles were unbaptized.” For if they had undergone the human baptism of John, and were longing for that of the Lord, *then* since the Lord Himself had defined baptism to be *one*;[^8660] (saying to Peter, who was desirous[^8661] of being thoroughly bathed, “He who hath once bathed hath no necessity *to wash* a second time;”[^8662] which, of course, He would not have said at all to one *not* baptized;) even here we have a conspicuous[^8663] proof against those who, in order to destroy the sacrament of water, deprive the apostles even of John’s baptism. Can it seem credible that “the way of the Lord,” that is, the baptism of John, had not then been “prepared” in those persons who were being destined to *open* the way of the Lord throughout the whole world? The Lord Himself, though no “repentance” was due from *Him*, was baptized: was baptism not necessary for *sinners*? As for the fact, then, that “others were not baptized”—they, however, were not companions of Christ, but enemies of the faith, doctors of the law and Pharisees. From which fact is gathered an additional suggestion, that, since the *opposers* of the Lord *refused* to be baptized, they who *followed* the Lord *were* baptized, and were not like-minded with their own rivals: especially when, if there were any one to whom they clave, the Lord had exalted John above him (by the testimony) saying, “Among them who are born of women *there is* none greater than John the Baptist.”[^8664]" },
  { t = "note", id = "8660", text = "See Eph. iv. 5." },
  { t = "note", id = "8661", text = "“Volenti,” which Oehler notes as a suggestion of Fr. Junius, is adopted here in preference to Oehler’s “nolenti.”" },
  { t = "note", id = "8662", text = "John xiii. 9, 10." },
  { t = "note", id = "8663", text = "Exerta. Comp. c. xviii. *sub init.*; *ad Ux.* ii. c. i. *sub fin.*" },
  { t = "note", id = "8664", text = "Matt. xi. 11, ἐγήγερται omitted." },
  { t = "p", text = "Others make the suggestion (forced enough, clearly “that the apostles then served the turn of baptism when in their little ship, were sprinkled and covered with the waves: that Peter himself also was immersed enough when he walked on the sea.”[^8665] It is, however, as I think, one thing to be sprinkled or intercepted by the violence of the sea; another thing to be baptized in obedience to the discipline of religion. But that little ship did present a figure of the Church, in that she is disquieted “in the sea,” that is, in the world,[^8666] “by the waves,” that is, by persecutions and temptations; the Lord, through patience, sleeping as it were, until, roused in their last extremities by the prayers of the saints, He checks the world,[^8667] and restores tranquillity to His own." },
  { t = "note", id = "8665", text = "Matt. viii. 24; xiv. 28, 29. [Our author seems to allow that sprinkling is baptism, but not Christian baptism: a very curious passage. Compare the foot-washing, John xiii. 8.]" },
  { t = "note", id = "8666", text = "Sæculo." },
  { t = "note", id = "8667", text = "Sæculum." },
  { t = "p", text = "Now, whether they were baptized in any manner whatever, or whether they continued unbathed[^8668] to the end—so that even that saying of the Lord touching the “one bath”[^8669] does, under the person of Peter, merely regard *us*—still, to determine concerning the salvation of the apostles is audacious enough, because on *them* the prerogative even of first choice,[^8670] and thereafter of undivided intimacy, might be able to confer the compendious grace of baptism, seeing they (I think) followed Him who was wont to promise salvation to every believer. “Thy faith,” He would say, “hath saved thee;”[^8671] and, “Thy sins shall be remitted thee,”[^8672] on thy believing, of course, albeit thou be not *yet* baptized. If that[^8673] was wanting to the apostles, I know not in the faith of what things it was, that, roused by one word of the Lord, *one* left the toll-booth behind for ever;[^8674] *another* deserted father and ship, and the craft by which he gained his living;[^8675] *a third*, who disdained his father’s obsequies,[^8676] fulfilled, before he heard it, that highest precept of the Lord, “He who prefers father or mother to me, is not worthy of me.”[^8677]" },
  { t = "note", id = "8668", text = "Illoti." },
  { t = "note", id = "8669", text = "Lavacrum. [John xiii. 9, 10, as above.]" },
  { t = "note", id = "8670", text = "i.e. of being the first to be chosen." },
  { t = "note", id = "8671", text = "Luke xviii. 42; Mark x. 52." },
  { t = "note", id = "8672", text = "“Remittentur” is Oehler’s reading; “remittuntur” others read; but the Greek is in perfect tense. See Mark ii. 5." },
  { t = "note", id = "8673", text = "i.e. faith, or perhaps the “compendious grace of baptism.”" },
  { t = "note", id = "8674", text = "Matt. ix. 9." },
  { t = "note", id = "8675", text = "Matt. iv. 21, 22." },
  { t = "note", id = "8676", text = "Luke ix. 59, 60; but it is not said there that the man *did* it." },
  { t = "note", id = "8677", text = "Matt. x. 37." },
]

[[section]]
id = "another-objection-abraham-pleased-god-without-being"
title = "Another Objection: Abraham Pleased God Without Being Baptized. Answer Thereto. Old Things Must Give Place to New, and Baptism is Now a Law."
level = 1
blocks = [
  { t = "p", text = "Chapter XIII.—Another Objection: Abraham Pleased God Without Being Baptized. Answer Thereto. Old Things Must Give Place to New, and Baptism is Now a Law." },
  { t = "p", text = "Here, then, those miscreants[^8678] provoke questions. And so they say, “Baptism is not necessary for them to whom faith is sufficient; for withal, Abraham pleased God by a sacrament of no water, but of faith.” But in all cases it is the *later* things which have a conclusive force, and the *subsequent* which prevail over the antecedent. Grant that, in days gone by, there was salvation by means of bare faith, before the passion and resurrection of the Lord. But now that faith has been enlarged, and is become a faith which believes in His nativity, passion, and resurrection, there has been an amplification added to the sacrament,[^8679] viz., the sealing act of baptism; the clothing, in some sense, of the faith which before was bare, and which cannot exist now without its proper law. For the *law* of baptizing has been *imposed*, and the formula prescribed: “Go,” *He* saith, “teach the nations, baptizing them into the name of the Father, and of the Son, and of the Holy Spirit.”[^8680] The comparison with this law of that definition, “Unless a man have been reborn of water and Spirit, he shall not enter into the kingdom of the heavens,”[^8681] has tied faith to the necessity of baptism. Accordingly, all thereafter[^8682] *who became* believers used to be baptized. *Then* it was, too,[^8683] that Paul, when he believed, was baptized; and this is the meaning of the precept which the Lord had given him when smitten with the plague of loss *of sight*, saying, “Arise, and enter Damascus; there shall be demonstrated to thee what thou oughtest to do,” to wit—be baptized, which was the only thing lacking to him. That point excepted, he had sufficiently *learnt and believed* “the Nazarene” to be “the Lord, the Son of God.”[^8684]" },
  { t = "note", id = "8678", text = "i.e. probably the Cainites. See c. ii." },
  { t = "note", id = "8679", text = "i.e. the sacrament, or obligation of faith. See beginning of chapter." },
  { t = "note", id = "8680", text = "Matt. xxviii. 19: “all” omitted." },
  { t = "note", id = "8681", text = "John ii. 5: “shall not” for “cannot;” “kingdom of the heavens”—an expression only occurring in Matthew—for “kingdom of God.”" },
  { t = "note", id = "8682", text = "i.e. from the time when the Lord gave the “law.”" },
  { t = "note", id = "8683", text = "i.e. not till *after* the “law” had been made." },
  { t = "note", id = "8684", text = "See Acts ix. 1–31." },
]

[[section]]
id = "of-paul-s-assertion-that-he-had"
title = "Of Paul's Assertion, that He Had Not Been Sent to Baptize."
level = 1
blocks = [
  { t = "p", text = "Chapter XIV.—Of Paul’s Assertion, that He Had Not Been Sent to Baptize." },
  { t = "p", text = "But they roll back *an objection* from *that* apostle himself, in that he said, “For Christ sent me not to baptize;”[^8685] as if by this argument baptism were done away! For *if so*, why did he baptize Gaius, and Crispus, and the house of Stephanas?[^8686] However, even if Christ had not sent *him* to baptize, yet He had given *other* apostles the precept to baptize. But these words were written to the Corinthians in regard of the circumstances of that particular time; seeing that schisms and dissensions were agitated among them, while one attributes *everything* to Paul, another to Apollos.[^8687] For which reason the “peace-making”[^8688] apostle, for fear he should seem to claim all *gifts* for himself, says that he had been sent “not to baptize, but to preach.” For preaching is the prior thing, baptizing the posterior. Therefore the preaching came *first*: but I think baptizing withal was *lawful* to him to whom preaching was." },
  { t = "note", id = "8685", text = "1 Cor. i. 17." },
  { t = "note", id = "8686", text = "1 Cor. i. 14, 16." },
  { t = "note", id = "8687", text = "1 Cor. i. 11, 12; iii. 3, 4." },
  { t = "note", id = "8688", text = "Matt. v. 9; referred to in *de Patien.* c. ii." },
]

[[section]]
id = "unity-of-baptism-remarks-on-heretical-and"
title = "Unity of Baptism. Remarks on Heretical And Jewish Baptism."
level = 1
blocks = [
  { t = "p", text = "Chapter XV.—Unity of Baptism. Remarks on Heretical And Jewish Baptism." },
  { t = "p", text = "I know not whether any further point is mooted to bring baptism into controversy. Permit me to call to mind what I have omitted above, lest I seem to break off the train of impending thoughts in the middle. There is to us one, and but one, baptism; as well according to the Lord’s gospel[^8689] as according to the apostle’s letters,[^8690] inasmuch as *he says*, “One God, and one baptism, and one church in the heavens.”[^8691] But it must be admitted that the question, “What rules are to be observed with regard to heretics?” is worthy of being treated. For it is to *us*[^8692] that that assertion[^8693] refers. Heretics, however, have no fellowship in our discipline, whom the mere fact of their excommunication[^8694] testifies to be outsiders. I am not bound to recognize in *them* a thing which is enjoined on *me*, because they and we have not the same God, nor one—that is, *the same*—Christ. And therefore their baptism is not one *with ours* either, because it is not *the same; a baptism* which, since they have it not duly, doubtless they have *not at all*; nor is that capable of being *counted* which is not *had*.[^8695] Thus they cannot *receive* it either, because they *have it not*. But this point has already received a fuller discussion from us in Greek. We enter, then, the font[^8696] *once: once* are sins washed away, because they ought never to be repeated. But the Jewish Israel bathes daily,[^8697] because he is daily being defiled: and, for fear that *defilement* should be practised among *us* also, therefore was the definition touching the one bathing[^8698] made. Happy water, which *once* washes away; which does not mock sinners (with vain hopes); which does not, by being infected with the repetition of impurities, again defile them whom it has washed!" },
  { t = "note", id = "8689", text = "Oehler refers us to c. xii. above, “He who hath once bathed.”" },
  { t = "note", id = "8690", text = "i.e. the Epistle to the Ephesians especially." },
  { t = "note", id = "8691", text = "Eph. iv. 4, 5, 6, but very inexactly quoted." },
  { t = "note", id = "8692", text = "i.e. us Christians; of “Catholics,” as Oehler explains it." },
  { t = "note", id = "8693", text = "i.e. touching the “one baptism.”" },
  { t = "note", id = "8694", text = "Ademptio communicationis. [See Bunsen, *Hippol.* III. p. 114, Canon 46.]" },
  { t = "note", id = "8695", text = "Comp. Eccles. i. 15." },
  { t = "note", id = "8696", text = "Lavacrum." },
  { t = "note", id = "8697", text = "Compare *de Orat.* c. xiv." },
  { t = "note", id = "8698", text = "In John xiii. 10, and Eph. iv. 5." },
]

[[section]]
id = "of-the-second-baptism-with-blood"
title = "Of the Second Baptism--With Blood."
level = 1
blocks = [
  { t = "p", text = "Chapter XVI.—Of the Second Baptism—With Blood." },
  { t = "p", text = "We *have* indeed, likewise, a *second* font,[^8699] (itself withal *one with the former*,) of *blood*, to wit; concerning which the Lord said, “I have to be baptized with a baptism,”[^8700] when He had been baptized already. For He had come “by means of water and blood,”[^8701] just as John has written; that He might be baptized by the water, glorified by the blood; to make *us*, in like manner, *called* by *water, chosen*[^8702] by *blood*. These two baptisms He sent out from the wound in His pierced side,[^8703] in order that they who believed in His blood might be bathed with the water; they who had been bathed in the water might likewise drink the blood.[^8704] This is the baptism which both stands in lieu of the fontal bathing[^8705] when that has not been received, and restores it when lost." },
  { t = "note", id = "8699", text = "Lavacrum. [See Aquinas, *Quæst.* lxvi. 11.]" },
  { t = "note", id = "8700", text = "Luke xii. 50, not given in full." },
  { t = "note", id = "8701", text = "1 John v. 6." },
  { t = "note", id = "8702", text = "Matt. xx. 16; Rev. xvii. 14." },
  { t = "note", id = "8703", text = "John xix. 34. See c. ix. *ad fin.*" },
  { t = "note", id = "8704", text = "See John vi. 53, etc." },
  { t = "note", id = "8705", text = "Lavacrum. [The three baptisms: *fluminis,* *flaminis,* *sanguinis*.]" },
]

[[section]]
id = "of-the-power-of-conferring-baptism"
title = "Of the Power of Conferring Baptism."
level = 1
blocks = [
  { t = "p", text = "Chapter XVII.—Of the Power of Conferring Baptism." },
  { t = "p", text = "For concluding our brief subject,[^8706] it remains to put you in mind also of the due observance of giving and receiving baptism. Of giving it, the chief priest[^8707] (who is the bishop) has the right: in the next place, the presbyters and deacons, yet not without the bishop’s authority, on account of the honour of the Church, which being preserved, peace is preserved. Beside these, even laymen have the right; for what is equally received can be equally given. Unless bishops, or priests, or deacons, be on the spot, *other* disciples are called *i.e. to the work*. The word of the Lord ought not to be hidden by any: in like manner, too, baptism, which is equally God’s property,[^8708] can be administered by all. But how much more is the rule[^8709] of reverence and modesty incumbent on laymen—seeing that these *powers*[^8710] belong to their superiors—lest they assume to themselves the *specific*[^8711] function of the bishop! Emulation of the episcopal office is the mother of schisms. The most holy apostle has said, that “all things are *lawful*, but not all *expedient*.”[^8712] Let it suffice assuredly, in cases of *necessity*, to avail yourself (of that rule[^8713], if at any time circumstance either of place, or of time, or of person compels you (so to do); for *then* the stedfast courage of the succourer, when the situation of the endangered one is urgent, is exceptionally admissible; inasmuch as he will be guilty of a human creature’s loss if he shall refrain from bestowing what he had free liberty to bestow. But the woman of pertness,[^8714] who has usurped the power to teach, will of course not give birth for herself likewise to a right of baptizing, unless some new beast shall arise[^8715] like the former; so that, just as the one abolished baptism,[^8716] so some other should in her own right confer it! But if the writings which wrongly go under Paul’s name, claim Thecla’s example as a licence for women’s teaching and baptizing, let them know that, in Asia, the presbyter who composed that writing,[^8717] as if he were augmenting Paul’s fame from his own store, after being convicted, and confessing that he had done it from love of Paul, was removed[^8718] from his office. For how credible would it seem, that he who has not permitted a *woman*[^8719] even to *learn* with over-boldness, should give a *female*[^8720] the power of *teaching* and of *baptizing*! “Let them be silent,” he says, “and at home consult their own husbands.”[^8721]" },
  { t = "note", id = "8706", text = "Materiolam." },
  { t = "note", id = "8707", text = "Summus sacerdos. Compare *de Orat.* xxviii., “nos…veri sacerdotes,” etc.: and *de Ex. Cast.* c. vii., “nonne et laici sacerdotes sumus?”" },
  { t = "note", id = "8708", text = "Census." },
  { t = "note", id = "8709", text = "Disciplina." },
  { t = "note", id = "8710", text = "i.e. the powers of administering baptism and “sowing the word.” [i.e. “The Keys.” *Scorpiace*, p. 643.]" },
  { t = "note", id = "8711", text = "Dicatum." },
  { t = "note", id = "8712", text = "1 Cor. x. 23, where μοι in the received text seems interpolated." },
  { t = "note", id = "8713", text = "Or, as Oehler explains it, of your power of baptizing, etc." },
  { t = "note", id = "8714", text = "Quintilla. See c. i." },
  { t = "note", id = "8715", text = "Evenerit. Perhaps Tertullian means literally—though that sense of the word is very rare—“shall issue out of her,” alluding to his “pariet” above." },
  { t = "note", id = "8716", text = "See c. i. *ad fin.*" },
  { t = "note", id = "8717", text = "The allusion is to a spurious work entitled *Acta Pauli et Theclæ*. [Of which afterwards. But see Jones, *on the Canon*, II. p. 353, and Lardner, *Credibility*, II. p. 305.]" },
  { t = "note", id = "8718", text = "Decessisse." },
  { t = "note", id = "8719", text = "Mulieri." },
  { t = "note", id = "8720", text = "Fœminæ." },
  { t = "note", id = "8721", text = "1 Cor. xiv. 34, 35." },
]

[[section]]
id = "of-the-persons-to-whom-and-the"
title = "Of the Persons to Whom, and the Time When, Baptism is to Be Administered."
level = 1
blocks = [
  { t = "p", text = "Chapter XVIII.—Of the Persons to Whom, and the Time When, Baptism is to Be Administered." },
  { t = "p", text = "But they whose office it is, know that baptism is not rashly to be administered. “Give to every one who beggeth thee,”[^8722] has a reference of its own, appertaining especially to almsgiving. On the contrary, this *precept* is rather to be looked at carefully: “Give not the holy thing to the dogs, nor cast your pearls before swine;”[^8723] and, “Lay not hands easily on *any*; share not other men’s sins.”[^8724] If Philip so “easily” baptized the chamberlain, let us reflect that a manifest and conspicuous[^8725] evidence that the Lord deemed him worthy had been interposed.[^8726] The Spirit had enjoined Philip to proceed to that road: the eunuch himself, too, was not found idle, nor as one who was suddenly seized with an eager desire to be baptized; but, after going up to the temple for prayer’s sake, being intently engaged on the divine Scripture, was thus suitably discovered—to whom God had, unasked, sent an apostle, which one, again, the Spirit bade adjoin himself to the chamberlain’s chariot. The Scripture which *he was reading*[^8727]falls in opportunely with his faith: *Philip*, being requested, is taken to sit beside him; the Lord is pointed out; faith lingers not; water needs no waiting for; the work is completed, and the apostle snatched away. “But Paul too was, in fact, ‘speedily’ baptized:” for Simon,[^8728] his host, speedily recognized him to be “an appointed vessel of election.” God’s approbation sends sure premonitory tokens before it; every “petition”[^8729] may both deceive and be deceived. And so, according to the circumstances and disposition, and even age, of each individual, the delay of baptism is preferable; principally, however, in the case of little children. For why is it necessary—if (baptism itself) is not so necessary[^8730]—that the sponsors likewise should be thrust into danger? Who both themselves, by reason of mortality, may fail to fulfil their promises, and may be disappointed by the development of an evil disposition, *in those for whom they stood*? The Lord does indeed say, “Forbid them not to come unto me.”[^8731] Let them “come,” then, while they are growing up; let them “come” while they are learning, while they are learning whither to come;[^8732] let them become Christians[^8733] when they have become able to know Christ. Why does the innocent period of life hasten to the “remission of sins?” More caution will be exercised in worldly[^8734] matters: so that one who is *not* trusted with earthly substance *is* trusted with divine! Let them know how to “ask” for salvation, that you may seem (at least) to have given “to him that asketh.”[^8735] For no less cause must the unwedded also be deferred—in whom *the ground of* temptation is prepared, alike in such as *never were* wedded[^8736] by means of their maturity, and in the *widowed* by means of their freedom—until they either marry, or else be more fully strengthened for continence. If any understand the weighty import of baptism, they will fear its reception more than its delay: sound faith is secure of salvation." },
  { t = "note", id = "8722", text = "Luke vi. 30. [See note 4, p. 676.]" },
  { t = "note", id = "8723", text = "Matt. vii. 6." },
  { t = "note", id = "8724", text = "1 Tim. v. 22; μηδενὶ omitted, ταχέως rendered by “facile,” and μηδἔ by “ne.”" },
  { t = "note", id = "8725", text = "“Exertam,” as in c. xii.: “probatio exerta,” “a conspicuous proof.”" },
  { t = "note", id = "8726", text = "Comp. Acts viii. 26–40." },
  { t = "note", id = "8727", text = "Acts viii. 28, 30, 32, 33, and Isa. liii. 7, 8, especially in LXX. The quotation, as given in Acts, agrees nearly *verbatim* with the Cod. Alex. there." },
  { t = "note", id = "8728", text = "Tertullian seems to have confused the “Judas” with whom Saul stayed (Acts ix. 11) with the “Simon” with whom St. Peter stayed (Acts ix. 43); and it was Ananias, not Judas, to whom he was pointed out as “an appointed vessel,” and by whom he was baptized. [So above, he seems to have confounded Philip, the deacon, with Philip the apostle.]" },
  { t = "note", id = "8729", text = "See note 24, [where Luke vi. 30 is shown to be abused]." },
  { t = "note", id = "8730", text = "Tertullian has already allowed (in c. xvi) that baptism is not *indispensably* necessary to salvation." },
  { t = "note", id = "8731", text = "Matt. xix. 14; Mark x. 14; Luke xviii. 16." },
  { t = "note", id = "8732", text = "Or, “whither they are coming.”" },
  { t = "note", id = "8733", text = "i.e. in baptism." },
  { t = "note", id = "8734", text = "Sæcularibus." },
  { t = "note", id = "8735", text = "See beginning of chapter, [where Luke vi. 30, is shown to be abused]." },
  { t = "note", id = "8736", text = "Virginibus; but he is speaking about men as well as women. Comp. *de Orat.* c. xxii. [I need not point out the bearings of the above chapter, nor do I desire to interpose any comments. The Editor’s interpolations, where purely gratuitous, I have even stricken out, though I agree with them. See that work of genius, the *Liberty of Prophesying*, by Jer. Taylor, sect. xviii. and its candid admissions.]" },
]

[[section]]
id = "of-the-times-most-suitable-for-baptism"
title = "Of the Times Most Suitable for Baptism."
level = 1
blocks = [
  { t = "p", text = "Chapter XIX.—Of the Times Most Suitable for Baptism." },
  { t = "p", text = "The Passover affords a more *than usually* solemn day for baptism; when, withal, the Lord’s passion, in which we are baptized, was completed. Nor will it be incongruous to interpret figuratively *the fact* that, when the Lord was about to celebrate the last Passover, He said to the disciples who were sent to make preparation, “Ye will meet a man bearing water.”[^8737] He points out the place for celebrating the Passover by the sign of *water*. After that, Pentecost is a most joyous space[^8738] for conferring baptisms;[^8739] wherein, too, the resurrection of the Lord was repeatedly proved[^8740] among the disciples, and the hope of the advent of the Lord indirectly pointed to, in that, at that time, when He had been received back into the heavens, the angels[^8741] told the apostles that “He would so come, as He had withal ascended into the heavens;”[^8742] at Pentecost, of course. But, moreover, when Jeremiah says, “And I will gather them together from the extremities of the land in the feast-day,” he signifies the day of the Passover and of Pentecost, which is properly a “feast-day.”[^8743] However, *every* day is the Lord’s; every hour, every time, is apt for baptism: if there is a difference in the *solemnity*, distinction there is none in the *grace*." },
  { t = "note", id = "8737", text = "Mark xiv. 13; Luke xxii. 10, “a small earthen pitcher of water.”" },
  { t = "note", id = "8738", text = "[He means the whole fifty days from the Paschal Feast till Pentecost, including the latter. Bunsen *Hippol.* III. 18.]" },
  { t = "note", id = "8739", text = "Lavacris." },
  { t = "note", id = "8740", text = "Frequentata, i.e. by His frequent appearance. See Acts i. 3, δι᾽ ἡμερῶν τεσσαράκοντα ὀπτανόμενος αὐτοῖς." },
  { t = "note", id = "8741", text = "Comp. Acts i. 10 and Luke ix. 30: in each place St. Luke says, ἄνδρες δύο: as also in xxiv. 4 of his Gospel." },
  { t = "note", id = "8742", text = "Acts i. 10, 11; but it is οὐρανόν throughout in the Greek." },
  { t = "note", id = "8743", text = "Jer. xxxi. 8, xxxviii. 8 in LXX., where ἐν ἑορτῇ φασέκ is found, which is not in the English version." },
]

[[section]]
id = "of-preparation-for-and-conduct-after-the"
title = "Of Preparation For, and Conduct After, the Reception of Baptism."
level = 1
blocks = [
  { t = "p", text = "Chapter XX.—Of Preparation For, and Conduct After, the Reception of Baptism." },
  { t = "p", text = "They who are about to enter baptism ought to pray with repeated prayers, fasts, and bendings of the knee, and vigils all the night through, and with the confession of all bygone sins, that they may express *the meaning* even of the baptism of John: “They were baptized,” saith (the Scripture), “confessing their own sins.”[^8744] To us it is matter for thankfulness if we do *now* publicly confess our iniquities or our turpitudes:[^8745] for we do at the same time both make satisfaction[^8746] for our former sins, by mortification of our flesh and spirit, and lay beforehand the foundation of defences against the temptations which will closely follow. “Watch and pray,” saith (the Lord), “lest ye fall into temptation.”[^8747] And the reason, I believe, why they *were* tempted was, that they fell asleep; so that they deserted the Lord when apprehended, and he who continued to stand by Him, and used the sword, even denied Him thrice: for withal the word had gone before, that “no one *un*tempted should attain the celestial kingdoms.”[^8748] The Lord Himself forthwith after *baptism*[^8749] temptations surrounded, when in forty days He had kept fast. “Then,” some one will say, “it becomes *us*, too, rather to fast *after* baptism.”[^8750] Well, and who forbids you, unless it be the necessity for joy, and the thanksgiving for salvation? But so far as I, with my poor powers, understand, the Lord figuratively retorted upon Israel the reproach *they had cast on the Lord*.[^8751] For the people, after crossing the sea, and being carried about in the desert during forty years, although they were there nourished with divine supplies, nevertheless were more mindful of their belly and their gullet than of God. Thereupon the Lord, driven apart into desert places after baptism,[^8752] showed, by maintaining a fast of forty days, that the man of God lives “not by bread alone,” but “by the word of God;”[^8753] and that temptations incident to fulness or immoderation of appetite are shattered by abstinence. Therefore, blessed *ones*, whom the grace of God awaits, when you ascend from that most sacred font[^8754] of your new birth, and spread your hands[^8755] for the first time in the house of your mother,[^8756] together with your brethren, ask from the Father, ask from the Lord, that His own specialties of grace *and* distributions of gifts[^8757] may be supplied you. “Ask,” saith He, “and ye shall receive.”[^8758] Well, you *have* asked, and have received; you *have* knocked, and it has been opened to you. Only, I pray that, when you are asking, you be mindful likewise of Tertullian the sinner.[^8759]" },
  { t = "note", id = "8744", text = "Matt. iii. 6. [See the collection of Dr. Bunsen for the whole primitive discipline to which Tertullian has reference, *Hippol.* Vol. III. pp. 5–23, and 29.]" },
  { t = "note", id = "8745", text = "Perhaps Tertullian is referring to Prov. xxviii. 13. If we confess *now*, we shall be forgiven, and not put to shame at the judgment day." },
  { t = "note", id = "8746", text = "See *de Orat.* c. xxiii. *ad fin.*, and the note there." },
  { t = "note", id = "8747", text = "Matt. xxvi. 41." },
  { t = "note", id = "8748", text = "What passage is referred to is doubtful. The editors point us to Luke xxii. 28, 29; but the reference is unsatisfactory." },
  { t = "note", id = "8749", text = "Lavacrum." },
  { t = "note", id = "8750", text = "Lavacro. Compare the beginning of the chapter." },
  { t = "note", id = "8751", text = "Viz. by their murmuring for bread (see Ex. xvi. 3, 7); and again—nearly forty years after—in another place. See Num. xxi. 5." },
  { t = "note", id = "8752", text = "Aquam: just as St. Paul says the Israelites had been “*baptized*” (or “*baptized themselves*”) “into Moses in the cloud and *in the sea*.” 1 Cor. x. 2." },
  { t = "note", id = "8753", text = "Matt. iv. 1–4." },
  { t = "note", id = "8754", text = "Lavacro." },
  { t = "note", id = "8755", text = "In prayer: comp. *de Orat.* c. xiv." },
  { t = "note", id = "8756", text = "i.e. the Church: comp. *de Orat.* c. 2." },
  { t = "note", id = "8757", text = "1 Cor. xii. 4–12." },
  { t = "note", id = "8758", text = "Matt. vii. 7; Luke xi. 9; αἰτεῖτε, καὶ δοθήσεται, ὑμῖν in both places." },
  { t = "note", id = "8759", text = "[The translator, though so learned and helpful, too often encumbers the text with superfluous interpolations. As many of these, while making the reading difficult, add nothing to the sense yet destroy the terse, crabbed force of the original, I have occasionally restored the spirit of a sentence, by removing them.]" },
]

[[section]]
id = "elucidation"
title = "Elucidation."
level = 1
blocks = [
  { t = "p", text = "The argument (p. 673, note 6,) is conclusive, but not clear. The disciples of John must have been baptized by him, (Luke vii. 29–30) and “all the people,” must have included those whom Jesus called. But, this was not Christ’s baptism: See Acts xix. 2, 5. Compare note 8, p. 673. And see the American Editor’s “Apollos.”" },
]

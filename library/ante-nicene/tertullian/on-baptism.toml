[[section]]
id = "chapter-1"
title = "Chapter I. Introduction. Origin of the Treatise."
level = 1
blocks = [
  { t = "h", text = "II." },
  { t = "h", text = "On Baptism." },
  { t = "h", text = "[Translated by the Rev. S. Thelwall.]" },
  { t = "p", text = "Chapter I.—Introduction. Origin of the Treatise." },
  { t = "p", text = "Happy is our[^8542] sacrament of water, in that, by washing away the sins of our early blindness, we are set free *and admitted* into eternal life! A treatise on this matter will not be superfluous; instructing not only such as are just becoming formed (in the faith), but them who, content with having simply believed, without full examination of the grounds[^8543] of the traditions, carry (in mind), through ignorance, an untried *though* probable faith. The consequence is, that a viper of the Cainite heresy, lately conversant in this quarter, has carried away a great number with her most venomous doctrine, making it her first aim to destroy baptism. Which is quite in accordance with nature; for vipers and asps and basilisks themselves generally do affect arid and waterless places. But we, little fishes, after the example of our ΙΧΘΥΣ[^8544] Jesus Christ, are born in water, nor have we safety in any other way than by permanently abiding in water; so that most monstrous creature, who had no right to teach even sound doctrine,[^8545] knew full well how to kill the little fishes, by taking them away from the water!" },
  { t = "note", id = "8542", text = "i.e. Christian (Oehler)." },
  { t = "note", id = "8543", text = "Rationibus." },
  { t = "note", id = "8544", text = "This curious allusion it is impossible, perhaps, to render in our language. The word ΙΧΘΥΣ (*ikhthus*) in Greek means “a fish;” and it was used as a name for our Lord Jesus, because the initials of the words ᾽Ιησοῦς Χριστὸς Θεοῦ Υἰὸς Σωτήρ (i.e. Jesus Christ the Son of God, the Savior), make up that word. Oehler with these remarks, gives abundant references on that point. [Dr. Allix suspects Montanism here, but see Kaye, p. 43, and Lardner, *Credib.* II. p. 335. We may date it *circa* a.d. 193.]" },
  { t = "note", id = "8545", text = "As being a woman. See 1 Tim. ii. 11, 12." },
]

[[section]]
id = "the-very-simplicity-of-god-s-means"
title = "The Very Simplicity of God's Means of Working, a Stumbling-Block to the Carnal Mind."
level = 1
blocks = [
  { t = "p", text = "Chapter II.—The Very Simplicity of God’s Means of Working, a Stumbling-Block to the Carnal Mind." },
  { t = "p", text = "Well, but how great is the force of perversity for *so* shaking the faith or entirely preventing its reception, that it impugns it on the very principles of which *the faith* consists! There is absolutely nothing which makes men’s minds more obdurate than the simplicity of the divine works which are visible in the *act*, when compared with the grandeur which is promised thereto in the *effect*; so that from the very fact, that with so great simplicity, without pomp, without any considerable novelty of preparation, finally, without expense, a man is dipped in water, and amid the utterance of some few words, is sprinkled, and then rises again, not much (or not at all) the cleaner, the consequent attainment of eternity[^8546] is esteemed the more incredible. I am a deceiver if, on the contrary, it is not from their circumstance, and preparation, and expense, that *idols*’ solemnities or mysteries get their credit and authority built up. Oh, miserable incredulity, which quite deniest to God His own properties, simplicity and power! What then? Is it not wonderful, too, that death should be washed away by bathing? But it is the more to be believed if the wonderfulness be the reason why it is *not* believed. For what does it behove divine works to be in their quality, except that they be above all wonder?[^8547] We also ourselves wonder, but it is *because* we believe. Incredulity, on the other hand, wonders, but does *not* believe: for the simple *acts* it wonders at, as if they were vain; the grand *results*, as if they were impossible. And grant that it be just as you think[^8548] sufficient to meet each point is the divine declaration which has forerun: “The foolish things of the world hath God elected to confound its wisdom;”[^8549] and, “The things very difficult with men are easy with God.”[^8550] For if God is wise and powerful (which even they who pass Him by do not deny), it is with good reason that He lays the material causes of His own operation in the contraries of wisdom and of power, that is, in foolishness and impossibility; since every virtue receives its cause from those things by which it is called forth." },
  { t = "note", id = "8546", text = "Consecutio æternitatis." },
  { t = "note", id = "8547", text = "Admirationem." },
  { t = "note", id = "8548", text = "i.e. that the simple be vain, and the grand impossible." },
  { t = "note", id = "8549", text = "1 Cor. i. 27, not quite exactly quoted." },
  { t = "note", id = "8550", text = "Luke xviii. 27, again inexact." },
]

[[section]]
id = "water-chosen-as-a-vehicle-of-divine"
title = "Water Chosen as a Vehicle of Divine Operation and Wherefore. Its Prominence First of All in Creation."
level = 1
blocks = [
  { t = "p", text = "Chapter III.—Water Chosen as a Vehicle of Divine Operation and Wherefore. Its Prominence First of All in Creation." },
  { t = "p", text = "Mindful of this declaration as of a conclusive prescript, we nevertheless *proceed to* treat *the question*, “How *foolish* and *impossible* it is to be formed anew by water. In what respect, pray, has this material substance merited an office of so high dignity?” The authority, I suppose, of the liquid element has to be examined.[^8551] This[^8552] however, is found in abundance, and that from the very beginning. For *water* is one of those things which, before all the furnishing of the world, were quiescent with God in a yet unshapen[^8553] state. “In the first beginning,” saith *Scripture*, “God made the heaven and the earth. But the earth was invisible, and unorganized,[^8554] and darkness was over the abyss; and the Spirit of the Lord was hovering[^8555] over the waters.”[^8556] The first thing, O man, which you have to venerate, is the *age* of the waters in that their substance is ancient; the second, their *dignity*, in that they were the seat of the Divine Spirit, more pleasing *to Him*, no doubt, than all the other then existing elements. For the darkness was total thus far, shapeless, without the ornament of stars; and the abyss gloomy; and the earth unfurnished; and the heaven unwrought: water[^8557] alone—always a perfect, gladsome, simple material substance, pure in itself—supplied a worthy vehicle to God. What *of the fact* that waters were in some way the regulating powers by which the disposition of the world thenceforward was constituted by God? For the suspension of the celestial firmament in the midst He caused by “dividing the waters;”[^8558] the suspension of “the dry land” He accomplished by “separating the waters.” After the world had been hereupon set in order through *its* elements, when inhabitants were given it, “the waters” were the first to receive the precept “to bring forth living creatures.”[^8559] Water was the first to produce that which had life, that it might be no wonder in baptism if waters know how to give life.[^8560] For was not the work of fashioning man himself also achieved with the aid of waters? Suitable material is found in the *earth*, yet not apt for the purpose unless it be moist and juicy; which (earth) “the waters,” separated the fourth day before into their own place, temper with their remaining moisture to a clayey consistency. If, from that time onward, I go forward in recounting universally, or at more length, the evidences of the “authority” of this element which I can adduce to show how great is its power or its grace; how many ingenious devices, how many functions, how useful an instrumentality, it affords the world, I fear I may seem to have collected rather the praises of water than the reasons of baptism; although I should *thereby* teach all the more fully, that it is not to be doubted that God has made the material substance which He has disposed throughout all His products[^8561] and works, obey Him also in His own peculiar sacraments; that the *material substance* which governs terrestrial life acts as agent likewise in the celestial." },
  { t = "note", id = "8551", text = "Compare the Jews’ question, Matt. xxi. 23." },
  { t = "note", id = "8552", text = "Its authority." },
  { t = "note", id = "8553", text = "Impolita." },
  { t = "note", id = "8554", text = "Incomposita." },
  { t = "note", id = "8555", text = "Ferebatur." },
  { t = "note", id = "8556", text = "Gen. i. 1, 2, and comp. the LXX." },
  { t = "note", id = "8557", text = "Liquor." },
  { t = "note", id = "8558", text = "Gen. i. 6, 7, 8." },
  { t = "note", id = "8559", text = "Animas." },
  { t = "note", id = "8560", text = "Animare." },
  { t = "note", id = "8561", text = "Rebus." },
]

[[section]]
id = "the-primeval-hovering-of-the-spirit-of"
title = "The Primeval Hovering of the Spirit of God Over the Waters Typical of Baptism. The Universal Element of Water Thus Made a Channel of Sanctification. Resemblance Between the Outward Sign and the Inward Grace."
level = 1
blocks = [
  { t = "p", text = "Chapter IV.—The Primeval Hovering of the Spirit of God Over the Waters Typical of Baptism. The Universal Element of Water Thus Made a Channel of Sanctification. Resemblance Between the Outward Sign and the Inward Grace." },
  { t = "p", text = "But it will suffice to have *thus* called at the outset those points in which withal is recognised that primary principle of baptism,—which was even then fore-noted by the very attitude *assumed* for a type of baptism,—that the Spirit of God, who hovered over (the waters) from the beginning, would continue to linger over the waters of the baptized.[^8562] But a holy thing, of course, hovered over a holy; or else, from that which hovered over that which *was* hovered over borrowed a holiness, since it is necessary that in every case an underlying material substance should catch the quality of that which overhangs it, most of all a corporeal of a spiritual, adapted (as the spiritual is) through the subtleness of its substance, both for penetrating and insinuating. Thus the nature of the waters, sanctified by the Holy One, itself conceived withal the power of sanctifying. Let no one say, “Why then, are we, pray, baptized with the very waters which then existed in the first beginning?” Not with those waters, of course, except in so far as the *genus* indeed is one, but the *species* very many. But what is an attribute to the *genus* reappears[^8563] likewise in the *species*. And accordingly it makes no difference whether a man be washed in a sea or a pool, a stream or a fount, a lake or a trough;[^8564] nor is there any distinction between those whom John baptized in the Jordan and those whom Peter baptized in the Tiber, unless withal the eunuch whom Philip baptized in the midst of his journeys with chance water, derived (therefrom) more or less of salvation *than others*.[^8565] All waters, therefore, in virtue of the pristine privilege of their origin, do, after invocation of God, attain the sacramental power of sanctification; for the Spirit immediately supervenes from the heavens, and rests over the waters, sanctifying them from Himself; and being thus sanctified, they imbibe at the same time the power of sanctifying. Albeit the similitude may be admitted to be suitable to the simple act; that, since we are defiled by sins, as it were by dirt, we should be washed from those stains in waters. But as sins do not show themselves in our *flesh* (inasmuch as no one carries on his skin the spot of idolatry, or fornication, or fraud), so persons of that kind are foul in the *spirit*, which is the author of the sin; for the spirit is lord, the flesh servant. Yet they each mutually share the guilt: the spirit, on the ground of command; the flesh, of subservience. Therefore, after the waters have been in a manner endued with medicinal virtue[^8566] through the intervention of the angel,[^8567] the spirit is corporeally washed in the waters, and the flesh is in the same spiritually cleansed." },
  { t = "note", id = "8562", text = "Intinctorum." },
  { t = "note", id = "8563", text = "Redundat." },
  { t = "note", id = "8564", text = "Alveo." },
  { t = "note", id = "8565", text = "Acts viii. 26–40." },
  { t = "note", id = "8566", text = "Medicatis." },
  { t = "note", id = "8567", text = "See c. vi. *ad init.*, and c. v. *ad fin.*" },
]

[[section]]
id = "use-made-of-water-by-the-heathen"
title = "Use Made of Water by the Heathen. Type of the Angel at the Pool of Bethsaida."
level = 1
blocks = [
  { t = "p", text = "Chapter V.—Use Made of Water by the Heathen. Type of the Angel at the Pool of Bethsaida.[^8568]" },
  { t = "note", id = "8568", text = "Bethesda, Eng. Ver." },
  { t = "p", text = "“Well, but the nations, who are strangers to all understanding of spiritual powers, ascribe to their idols the imbuing of waters with the self-same efficacy.” (So they do) but they cheat themselves with waters which are widowed.[^8569] For washing is the channel through which they are initiated into some sacred rites—of some notorious Isis or Mithras. The gods themselves likewise they honour by washings. Moreover, by carrying water around, and sprinkling it, they everywhere expiate[^8570] country-seats, houses, temples, and whole cities: at all events, at the Apollinarian and Eleusinian games they are baptized; and they presume that the effect of their doing that is their regeneration and the remission of the penalties due to their perjuries. Among the ancients, again, whoever had defiled himself with murder, was wont to go in quest of purifying waters. Therefore, if the mere nature of water, in that it is the appropriate material for washing away, leads men to flatter themselves with a belief in omens of purification, how much more truly will waters render that service through the authority of God, by whom all their nature has been constituted! If men think that water is endued with a medicinal virtue by religion, what religion is more effectual than that of the living God? Which fact being acknowledged, we recognise here also the zeal of the devil rivalling the things of God,[^8571] while we find him, too, practising baptism in his *subjects*. What similarity is there? The unclean cleanses! the ruiner sets free! the damned absolves! He will, forsooth, destroy his own work, by washing away the sins which himself inspires! These (remarks) have been set down by way of testimony against such as reject the faith; if they put no trust in the things of God, the spurious imitations of which, in the case of God’s rival, they do trust in. Are there not other cases too, in which, without any sacrament, unclean spirits brood on waters, in spurious imitation of that brooding[^8572] of the Divine Spirit in the very beginning? Witness all shady founts, and all unfrequented brooks, and the ponds in the baths, and the conduits[^8573] in *private* houses, or the cisterns and wells which are said to have the property of “spiriting away,”[^8574] through the power, that is, of a hurtful spirit. Men whom waters have drowned[^8575] or affected with madness or with fear, they call nymph-caught,[^8576] or “lymphatic,” or “hydro-phobic.” Why have we adduced these instances? Lest any think it too hard *for belief* that a holy angel of God should grant his presence to waters, to temper them to man’s salvation; while the evil angel holds frequent profane commerce with the selfsame element to man’s ruin. If it seems a novelty for an angel to be present in waters, an example of what was to come to pass has forerun. An angel, by his intervention, was wont to stir the pool at Bethsaida.[^8577] They who were complaining of ill-health used to watch for him; for whoever had been the first to descend into them, after his washing, ceased to complain. This figure of corporeal healing sang of a spiritual healing, according to the rule by which things carnal are always antecedent[^8578] as figurative of things spiritual. And thus, when the grace of God advanced to higher degrees among men,[^8579] an accession *of efficacy* was granted to the waters and to the angel. They who[^8580] were wont to remedy bodily defects,[^8581] now heal the spirit; they who used to work temporal salvation[^8582] now renew eternal; they who did set free but once in the year, now save peoples in a body[^8583] daily, death being done away through ablution of sins. The guilt being removed, of course the penalty is removed too. Thus man will be restored for God to His “likeness,” who in days bygone had been *conformed* to “the image” of God; (the “image” is counted (to be) in his *form*: the “likeness” in his *eternity*:) for he receives again that Spirit of God which he had then first received from His *afflatus*, but had afterward lost through sin." },
  { t = "note", id = "8569", text = "i.e., as Oehler rightly explains, “lacking the Holy Spirit’s presence and virtue.”" },
  { t = "note", id = "8570", text = "Or, “purify.”" },
  { t = "note", id = "8571", text = "[Diabolus Dei Simius.]" },
  { t = "note", id = "8572", text = "Gestationem." },
  { t = "note", id = "8573", text = "Euripi." },
  { t = "note", id = "8574", text = "Rapere." },
  { t = "note", id = "8575", text = "Necaverunt." },
  { t = "note", id = "8576", text = "“Nympholeptos,” restored by Oehler, = νυμφολήπτους." },
  { t = "note", id = "8577", text = "So Tertullian reads, and some copies, but not the best, of the New Testament in the place referred to, John v. 1–9. [And note Tertullian’s textual testimony as to this Scripture.]" },
  { t = "note", id = "8578", text = "Compare 1 Cor. xv. 46." },
  { t = "note", id = "8579", text = "John i. 16, 17." },
  { t = "note", id = "8580", text = "Qui: i.e. probably “angeli qui.”" },
  { t = "note", id = "8581", text = "Vitia." },
  { t = "note", id = "8582", text = "Or, “health”—salutem." },
  { t = "note", id = "8583", text = "Conservant populos." },
]

[[section]]
id = "the-angel-the-forerunner-of-the-holy"
title = "The Angel the Forerunner of the Holy Spirit. Meaning Contained in the Baptismal Formula."
level = 1
blocks = [
  { t = "p", text = "Chapter VI.—The Angel the Forerunner of the Holy Spirit. Meaning Contained in the Baptismal Formula." },
  { t = "p", text = "Not that *in*[^8584] the waters we obtain the Holy Spirit; but in the water, under (the witness of) the angel, we are cleansed, and prepared *for* the Holy Spirit. In this case also a type has preceded; for thus was John beforehand the Lord’s forerunner, “preparing His ways.”[^8585] Thus, too, does the angel, the witness[^8586] of baptism, “make the paths straight”[^8587] for the Holy Spirit, who is about to come upon us, by the washing away of sins, which faith, sealed in (the name of) the Father, and the Son, and the Holy Spirit, obtains. For if “in *the mouth of* three witnesses every word shall stand:”[^8588]—while, through the benediction, we have the same (three) as witnesses of our faith whom we have as sureties[^8589] of our salvation too—how much more does the number of the divine names suffice for the assurance of our hope likewise! Moreover, after the pledging both of the attestation of faith and the promise[^8590] of salvation under “three witnesses,” there is added, of necessity, mention of the Church;[^8591] inasmuch as, wherever there are three, (that is, the Father, the Son, and the Holy Spirit, ) there is the Church, which is a body of three.[^8592]" },
  { t = "note", id = "8584", text = "Compare c. viii., where Tertullian appears to regard the Holy Spirit as given *after* the baptized had come out of the waters and received the “unction.”" },
  { t = "note", id = "8585", text = "Luke i. 76." },
  { t = "note", id = "8586", text = "Arbiter. [Eccles. v. 6, and Acts xii. 15.]" },
  { t = "note", id = "8587", text = "Isa. xl. 3; Matt. iii. 3." },
  { t = "note", id = "8588", text = "Deut. xix. 15; Matt. xviii. 16; 2 Cor. xiii. 1." },
  { t = "note", id = "8589", text = "Sponsores." },
  { t = "note", id = "8590", text = "Sponsio." },
  { t = "note", id = "8591", text = "Compare *de Orat.* c. ii. *sub fin.*" },
  { t = "note", id = "8592", text = "Compare the *de Orat.* quoted above, and *de Patien.* xxi.; and see Matt. xviii. 20." },
]

[[section]]
id = "of-the-unction"
title = "Of the Unction."
level = 1
blocks = [
  { t = "p", text = "Chapter VII.—Of the Unction." },
  { t = "p", text = "After this, when we have issued from the font,[^8593] we are thoroughly anointed with a blessed unction,—(a practice derived) from the old discipline, wherein on entering the priesthood, *men* were wont to be anointed with oil from a horn, ever since Aaron was anointed by Moses.[^8594] Whence Aaron is called “Christ,”[^8595] from the “chrism,” which is “the unction;” which, when made spiritual, furnished an appropriate name to the Lord, because He was “anointed” with the Spirit by God the Father; as *written* in the Acts: “For truly they were gathered together in this city[^8596] against Thy Holy Son whom Thou hast anointed.”[^8597] Thus, too, in *our* case, the unction runs carnally, (*i.e.* on the body,) but profits spiritually; in the same way as the *act* of baptism itself too is carnal, in that we are plunged in water, *but* the *effect* spiritual, in that we are freed from sins." },
  { t = "note", id = "8593", text = "Lavacro." },
  { t = "note", id = "8594", text = "See Ex. xxix. 7; Lev. viii. 12; Ps. cxxxiii. 2." },
  { t = "note", id = "8595", text = "i.e. “Anointed.” Aaron, or at least the priest, is actually so called in the LXX., in Lev. iv. 5, 16, ὁ ἱερεὺς ὁ Χριστός: as in the Hebrew it is the word whence *Messiah* is derived which is used." },
  { t = "note", id = "8596", text = "Civitate." },
  { t = "note", id = "8597", text = "Acts iv. 27. “In this city” (ἐν τῇ πόλει ταύτῃ) is omitted in the English version; and the name ᾽Ιησοῦν, “Jesus,” is omitted by Tertullian. Compare Acts x. 38 and Lev. iv. 18 with Isa. lxi. 1 in the LXX." },
]

[[section]]
id = "of-the-imposition-of-hands-types-of"
title = "Of the Imposition of Hands. Types of the Deluge and the Dove."
level = 1
blocks = [
  { t = "p", text = "Chapter VIII.—Of the Imposition of Hands. Types of the Deluge and the Dove." },
  { t = "p", text = "In the next place the hand is laid on us, invoking and inviting the Holy Spirit through benediction.[^8598] Shall it be granted possible for human ingenuity to summon a spirit into water, and, by the application of hands from above, to animate their union into one body[^8599] with another spirit of so clear sound;[^8600] and shall it not be possible for God, in the case of His own organ,[^8601] to produce, by means of “holy hands,”[^8602] a sublime spiritual modulation? But this, as well as the former, is derived from the old sacramental rite in which Jacob blessed his grandsons, born of Joseph, Ephrem[^8603] and Manasses; with his hands laid on them and interchanged, and indeed so transversely slanted one over the other, that, by delineating Christ, they even portended the future benediction into Christ.[^8604] Then, over our cleansed and blessed bodies willingly descends from the Father that Holiest Spirit. Over the waters of baptism, recognising as it were His primeval seat,[^8605] He reposes: (He who) glided down on the Lord “in the shape of a dove,”[^8606] in order that the nature of the Holy Spirit might be declared by means of the creature (the emblem) of simplicity and innocence, because even in her bodily structure the dove is without literal[^8607] gall. And accordingly He says, “Be ye simple as doves.”[^8608] Even this is not without the supporting evidence[^8609] of a preceding figure. For just as, after the waters of the deluge, by which the old iniquity was purged—after the baptism, so to say, of the world—a *dove* was the herald which announced to the earth the assuagement[^8610] of celestial wrath, when she had been sent her way out of the ark, and had returned with the olive-branch, a sign which even among the nations is the fore-token of *peace*;[^8611] so by the self-same law[^8612] of heavenly effect, to earth—that is, to our flesh[^8613]—as it emerges from the font,[^8614] after its old sins flies the *dove* of the Holy Spirit, bringing us the peace of God, sent out from the heavens where is the Church, the typified ark.[^8615] But the world returned unto sin; in which point baptism would ill be compared to the deluge. And so it is destined to fire; just as the man too is, who after baptism renews his sins:[^8616] so that this also ought to be accepted as a sign for our admonition." },
  { t = "note", id = "8598", text = "[See Bunsen, *Hippol.* Vol. III. Sec. xiii. p. 22.]" },
  { t = "note", id = "8599", text = "Concorporationem." },
  { t = "note", id = "8600", text = "The reference is to certain hydraulic organs, which the editors tell us are described by Vitruvius, ix. 9 and x. 13, and Pliny, *H. N.* vii. 37." },
  { t = "note", id = "8601", text = "i.e. Man. There may be an allusion to Eph. ii. 10, “We are His worksmanship,” and to Ps. cl. 4." },
  { t = "note", id = "8602", text = "Compare 1 Tim. ii. 8." },
  { t = "note", id = "8603", text = "i.e. Ephraim." },
  { t = "note", id = "8604", text = "In Christum." },
  { t = "note", id = "8605", text = "See c. iv. p. 668." },
  { t = "note", id = "8606", text = "Matt. iii. 16; Luke iii. 22." },
  { t = "note", id = "8607", text = "Ipso. The ancients held this." },
  { t = "note", id = "8608", text = "Matt. x. 16. Tertullian has rendered ἀκέραιοι (*unmixed*) by “simplices,” i.e. without fold." },
  { t = "note", id = "8609", text = "Argumento." },
  { t = "note", id = "8610", text = "Pacem." },
  { t = "note", id = "8611", text = "Paci." },
  { t = "note", id = "8612", text = "Dispositione." },
  { t = "note", id = "8613", text = "See *de Orat.* iv. *ad init.*" },
  { t = "note", id = "8614", text = "Lavacro." },
  { t = "note", id = "8615", text = "Compare *de Idol.* xxiv. *ad fin.*" },
  { t = "note", id = "8616", text = "[2 Pet. i. 9; Heb. x. 26, 27, 29. These awful texts are too little felt by modern Christians. They are too often explained away.]" },
]

[[section]]
id = "types-of-the-red-sea-and-the"
title = "Types of the Red Sea, and the Water from the Rock."
level = 1
blocks = [
  { t = "p", text = "Chapter IX.—Types of the Red Sea, and the Water from the Rock." },
  { t = "p", text = "How many, therefore, are the pleas[^8617] of nature, how many the privileges of grace, how many the solemnities of discipline, the figures, the preparations, the prayers, which have ordained the sanctity of water? First, indeed, when the people, set unconditionally free,[^8618] escaped the violence of the Egyptian king by crossing over *through water*, it was *water* that extinguished[^8619] the king himself, with his entire forces.[^8620] What figure more manifestly fulfilled in the sacrament of baptism? The nations are set free from the world[^8621] by means of *water*, to wit: and the devil, their old tyrant, they leave quite behind, overwhelmed in the *water*. Again, *water* is restored from its defect of “bitterness” to its native grace of “sweetness” by the tree[^8622] of Moses. That tree was Christ,[^8623] restoring, to wit, of Himself, the *veins* of sometime envenomed and bitter nature into the all-salutary *waters* of baptism. This is the *water* which flowed continuously down for the people from the “accompanying rock;” for if Christ is “the Rock,” without doubt we see baptism blest by the *water* in Christ. How mighty is the grace of *water*, in the sight of God and His Christ, for the confirmation of baptism! Never is Christ without *water*: if, that is, He is Himself baptized in *water*;[^8624] inaugurates in *water* the first rudimentary displays of His power, when invited to the nuptials;[^8625] invites the thirsty, when He makes a discourse, to His own sempiternal *water*;[^8626] approves, when teaching concerning love,[^8627] among works of charity,[^8628] the cup of *water* offered to a poor (child);[^8629] recruits His strength at a *well*;[^8630] walks over the *water*;[^8631] willingly crosses the *sea*;[^8632] ministers *water* to His disciples.[^8633] Onward even to the passion does the witness of baptism last: while He is being surrendered to the cross, *water* intervenes; witness Pilate’s hands:[^8634] when He is wounded, forth from His side bursts *water*; witness the soldier’s lance![^8635]" },
  { t = "note", id = "8617", text = "Patrocinia—“pleas *in defence*.”" },
  { t = "note", id = "8618", text = "“Libere expeditus,” set free, and that without any conditions, such as Pharaoh had from time to time tried to impose. See Ex. viii. 25, 28; x. 10, 11, 24." },
  { t = "note", id = "8619", text = "“Extinxit,” as it does *fire*." },
  { t = "note", id = "8620", text = "Ex. xiv. 27–30." },
  { t = "note", id = "8621", text = "Sæculo." },
  { t = "note", id = "8622", text = "See Ex. xv. 24, 25." },
  { t = "note", id = "8623", text = "“The Tree of Life,” “the True Vine,” etc." },
  { t = "note", id = "8624", text = "Matt. iii. 13–17." },
  { t = "note", id = "8625", text = "John ii. 1–11." },
  { t = "note", id = "8626", text = "John vii. 37, 38." },
  { t = "note", id = "8627", text = "Agape. See *de Orat.* c. 28, *ad fin.*" },
  { t = "note", id = "8628", text = "Dilectionis. See *de Patien.* c. xii." },
  { t = "note", id = "8629", text = "Matt. x. 42." },
  { t = "note", id = "8630", text = "John iv. 6." },
  { t = "note", id = "8631", text = "Matt. xiv. 25." },
  { t = "note", id = "8632", text = "Mark iv. 36." },
  { t = "note", id = "8633", text = "John xiii. 1–12." },
  { t = "note", id = "8634", text = "Matt. xxvii. 24. Comp. *de Orat.* c. xiii." },

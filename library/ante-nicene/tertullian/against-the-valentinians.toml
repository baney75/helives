[[section]]
id = "chapter-1"
title = "Chapter I. Introductory. Tertullian Compares the Heresy to the Old Eleusinian Mysteries. Both Systems Alike in Preferring Concealment of Error and Sin to Proclamation of Truth and Virtue."
level = 1
blocks = [
  { t = "h", text = "IV." },
  { t = "h", text = "Against the Valentinians." },
  { t = "p", text = "In Which the Author Gives a Concise Account of, Together with Sundry Caustic Animadversions on, the Very Fantastic Theology of the Sect. This Treatise is Professedly Taken from the Writings of Justin, Miltiades, Irenæus, and Proculus." },
  { t = "h", text = "[Translated by Dr. Roberts.]" },
  { t = "p", text = "Chapter I.—Introductory. Tertullian Compares the Heresy to the Old Eleusinian Mysteries. Both Systems Alike in Preferring Concealment of Error and Sin to Proclamation of Truth and Virtue." },
  { t = "p", text = "The Valentinians, who are no doubt a very large body of heretics—comprising as they do so many apostates from the truth, who have a propensity for fables, and no discipline to deter them (therefrom) care for nothing so much as to obscure[^6611] what they preach, if indeed they (can be said to) preach who obscure *their doctrine*. The officiousness with which they guard their doctrine is an officiousness which betrays their guilt.[^6612] Their disgrace is proclaimed in the very earnestness with which they maintain their religious system. Now, in the case of those Eleusinian mysteries, which are the very heresy of Athenian superstition, it is their secrecy that is their disgrace. Accordingly, they previously beset all access to their body with tormenting conditions;[^6613] *and* they require a long initiation before they enrol (their members),[^6614] even instruction during five years for their perfect disciples,[^6615] in order that they may mould[^6616] their opinions by this suspension of full knowledge, and apparently raise the dignity of their mysteries in proportion to the craving for them which they have previously created. Then follows the duty of silence. Carefully is that guarded, which is so long in finding. All the divinity, however, lies in their secret recesses:[^6617] there are revealed *at last* all the aspirations of the fully initiated,[^6618] the entire mystery of the sealed tongue, the symbol of virility. But this allegorical representation,[^6619] under the pretext of nature’s reverend name, obscures a real sacrilege by help of an arbitrary symbol,[^6620] and by *empty* images obviates[^6621] the reproach of falsehood![^6622] In like manner, the heretics who are now the object of our remarks,[^6623] the Valentinians, have formed Eleusinian dissipations[^6624] of their own, consecrated by a profound silence, having nothing of the heavenly in them but their mystery.[^6625] By the help of the sacred names and titles and arguments of true religion, they have fabricated the vainest and foulest figment for men’s pliant liking,[^6626] out of the affluent suggestions of Holy Scripture, since from its many springs many *errors* may well emanate. If you propose to them inquiries sincere and honest, they answer you with stern[^6627] look and contracted brow, and say, “The subject is profound.” If you try them with subtle questions, with the ambiguities of their double tongue, they affirm a community of faith (with yourself). If you intimate to them that you understand *their opinions*, they insist on knowing nothing themselves. If you come to a close engagement with them they destroy your own fond hope of a victory over them by a self-immolation.[^6628] Not even to their own disciples do they commit a secret before they have made sure of them. They have the knack of persuading men before instructing them; although truth persuades by teaching, but does not teach by first persuading." },
  { t = "note", id = "6611", text = "Occultant. [This tract may be assigned to any date not earlier than a.d. 207. Of this Valentinus, see cap. iv. *infra*, and *de Præscript.* capp. 29, 30, *supra*.]" },
  { t = "note", id = "6612", text = "We are far from certain whether we have caught the sense of the original, which we add, that the reader may judge for himself, and at the same time observe the terseness of our author: “Custodiæ officium conscientiæ officium est, confusio prædicatur, dum religio asseveratur.”" },
  { t = "note", id = "6613", text = "Et aditum prius cruciant." },
  { t = "note", id = "6614", text = "Antequam consignant." },
  { t = "note", id = "6615", text = "Epoptas: see Suidas, *s.v.* ᾽Επόπται." },
  { t = "note", id = "6616", text = "Ædificent." },
  { t = "note", id = "6617", text = "Adytis." },
  { t = "note", id = "6618", text = "Epoptarum." },
  { t = "note", id = "6619", text = "Dispositio." },
  { t = "note", id = "6620", text = "Patrocinio coactæ figuræ." },
  { t = "note", id = "6621", text = "Excusat." },
  { t = "note", id = "6622", text = "“Quid enim aliud est simulachrum nisi falsum?” (Rigalt.)" },
  { t = "note", id = "6623", text = "Quos nunc destinamus." },
  { t = "note", id = "6624", text = "Lenocinia." },
  { t = "note", id = "6625", text = "Taciturnitate." },
  { t = "note", id = "6626", text = "Facili caritati. Oehler, after Fr. Junius, gives, however, this phrase a subjective turn thus: “by affecting a charity which is easy to them, costing nothing.”" },
  { t = "note", id = "6627", text = "Concreto." },
  { t = "note", id = "6628", text = "Sua cæde." },
]

[[section]]
id = "these-heretics-brand-the-christians-as-simple"
title = "These Heretics Brand the Christians as Simple Persons. The Charge Accepted, and Simplicity Eulogized Out of the Scriptures."
level = 1
blocks = [
  { t = "p", text = "Chapter II.—These Heretics Brand the Christians as Simple Persons. The Charge Accepted, and Simplicity Eulogized Out of the Scriptures." },
  { t = "p", text = "For this reason we are branded[^6629] by them as simple, and as being merely so, without being wise also; as if indeed wisdom were compelled to be wanting in simplicity, whereas the Lord unites them both: “Be ye therefore wise as serpents, and simple as doves.”[^6630] Now if we, on our parts, be accounted foolish because we are simple, does it then follow that they are not simple because they are wise? Most perverse, however, are they who are not simple, even as they are most foolish who are not wise. And yet, (if I must choose) I should prefer taking[^6631] the *latter* condition for the lesser fault; since it is perhaps better to have a wisdom which falls short in quantity, than that which is bad in quality[^6632]—better to be in error than to mislead. Besides, the face of the Lord[^6633] is patiently waited for by those who “seek Him in simplicity of heart,” as says the very Wisdom—not of Valentinus, but—of Solomon.[^6634] Then, again, infants have borne[^6635] by their blood a testimony to Christ. (Would you say) that it was children who shouted “Crucify Him”?[^6636] They were neither children nor infants; in other words, they were not simple. The apostle, too, bids us to “become children again” towards God,[^6637] “to be as children in malice” by our simplicity, yet as being also “wise in our practical faculties.”[^6638] At the same time, with respect to the order of development in Wisdom, I have admitted[^6639] that it flows from simplicity. In brief, “the dove” has usually served to figure Christ; “the serpent,” to tempt Him. The one even from the first has been the harbinger of divine peace; the other from the beginning has been the despoiler of the divine image. Accordingly, simplicity alone[^6640] will be more easily able to know and to declare God, *whereas* wisdom alone will rather do Him violence,[^6641] and betray Him." },
  { t = "note", id = "6629", text = "Notamur." },
  { t = "note", id = "6630", text = "Matt. x. 16." },
  { t = "note", id = "6631", text = "In the original the phrase is put *passively*: “malim eam partem meliori sumi vitio.”" },
  { t = "note", id = "6632", text = "How terse is the original! minus sapere quam pejus." },
  { t = "note", id = "6633", text = "Facies Dei." },
  { t = "note", id = "6634", text = "Wisd. of Sol. i. 1." },
  { t = "note", id = "6635", text = "Litaverunt: “consecrated.”" },
  { t = "note", id = "6636", text = "Tertullian’s words are rather suggestive of sense than of syntax: “Pueros vocem qui crucem clamant?”" },
  { t = "note", id = "6637", text = "Secundum Deum: “according to God’s will.”" },
  { t = "note", id = "6638", text = "1 Cor. xiv. 20, where Tertullian renders the ταῖς φρεσί (A.V. “understanding”) by “sensibus.”" },
  { t = "note", id = "6639", text = "Dedi." },
  { t = "note", id = "6640", text = "i.e., without wisdom." },
  { t = "note", id = "6641", text = "Concutere." },
]

[[section]]
id = "the-folly-of-this-heresy-it-dissects"
title = "The Folly of This Heresy. It Dissects and Mutilates the Deity. Contrasted with the Simple Wisdom of True Religion. To Expose the Absurdities of the Valentinian System is to Destroy It."
level = 1
blocks = [
  { t = "p", text = "Chapter III.—The Folly of This Heresy. It Dissects and Mutilates the Deity. Contrasted with the Simple Wisdom of True Religion. To Expose the Absurdities of the Valentinian System is to Destroy It." },
  { t = "p", text = "Let, then, the serpent hide himself as much as he is able, and let him wrest[^6642] all his wisdom in the labyrinths of his obscurities; let him dwell deep down in the ground; let him worm himself into secret holes; let him unroll his length through his sinuous joints;[^6643] let him tortuously crawl, though not all at once,[^6644] beast as he is that skulks the light. Of our dove, however, how simple is the very home!—always in high and open places, and facing the light! As the symbol of the Holy Spirit, it loves the (radiant) East, that figure of Christ.[^6645] Nothing causes truth a blush, except only being hidden, because no man will be ashamed to give ear thereto. *No man will be ashamed* to recognise Him as God whom nature has already commended to him, whom he already perceives in all His works,[^6646]—Him indeed who is simply, for this reason, imperfectly known; because man has not thought of Him as only one, because he has named Him in a plurality (of gods), and adored Him in other *forms*. Yet,[^6647] to induce oneself to turn from this multitude of deities to another crowd,[^6648] to remove from a familiar authority to an unknown one, to wrench oneself from what is manifest to what is hidden, is to offend faith on the very threshold. Now, even suppose that you are initiated into the entire fable, will it not occur to you that you have heard something very like it from your fond nurse[^6649] when you were a baby, amongst the lullabies she sang to you[^6650] about the towers of Lamia, and the horns of the sun?[^6651] Let, however, any man approach the subject from a knowledge of the faith which he has otherwise learned, as soon as he finds so many names of Æons, so many marriages, so many offsprings, so many exits, so many issues, felicities *and* infelicities of a dispersed and mutilated Deity, will that man hesitate at once to pronounce that these are “the fables and endless genealogies” which the inspired apostle[^6652] by anticipation condemned, whilst these seeds of heresy were even then shooting forth? Deservedly, therefore, must they be regarded as wanting in simplicity, and as merely prudent, who produce such fables not without difficulty, and defend them only indirectly, who at the same time do not thoroughly instruct those whom they teach. This, of course, shows their astuteness, if their lessons are disgraceful; their unkindness, if they are honourable. As for us, however, who are the simple folk, we know all about it. In short, this is the very first weapon with which we are armed for our encounter; it unmasks[^6653] and brings to view[^6654] the whole of their depraved system.[^6655] And in this we have the first augury of our victory; because even merely to point out that which is concealed with so great an outlay of artifice,[^6656] is to destroy it." },
  { t = "note", id = "6642", text = "Torqueat." },
  { t = "note", id = "6643", text = "Per anfractus." },
  { t = "note", id = "6644", text = "Nec semel totus." },
  { t = "note", id = "6645", text = "By this remark it would seem that Tertullian read sundry passages in his Latin Bible similarly to the subsequent Vulgate version. For instance, in Zech. vi. 12, the prophet’s words הִנֵּה־אִישׁ צֵמַ שְׁמןֹ (“Behold the Man, whose name is the Branch”), are rendered in the Vulgate, “Ecce Vir *Oriens* nomen ejus.” Similarly in Zech. iii. 8, “Servum meum adducam Orientem.” (Compare Luke i. 78, where the ᾽Ανατολὴ ἐξ ὕψ·ους (“the day-spring from on high”) is in the same version “*Oriens* ex alto.”)" },
  { t = "note", id = "6646", text = "Or, perhaps, “whom it (nature) feels in all its works.”" },
  { t = "note", id = "6647", text = "Alioquin." },
  { t = "note", id = "6648", text = "Alloquin a turba eorum et aliam frequentiam suadere: which perhaps is best rendered, “But from one rabble of gods to frame and teach men to believe in another set,” etc." },
  { t = "note", id = "6649", text = "A nutricula." },
  { t = "note", id = "6650", text = "Inter somni difficultates." },
  { t = "note", id = "6651", text = "These were child’s stories at Carthage in Tertullian’s days." },
  { t = "note", id = "6652", text = "Apostoli spiritus: see 1 Tim. i. 4." },
  { t = "note", id = "6653", text = "Detectorem." },
  { t = "note", id = "6654", text = "Designatorem." },
  { t = "note", id = "6655", text = "Totius conscientiæ illorum." },
  { t = "note", id = "6656", text = "Tanto impendio." },
]

[[section]]
id = "the-heresy-traceable-to-valentinus-an-able"
title = "The Heresy Traceable to Valentinus, an Able But Restless Man. Many Schismatical Leaders of the School Mentioned. Only One of Them Shows Respect to the Man Whose Name Designates the Entire School."
level = 1
blocks = [
  { t = "p", text = "Chapter IV.—The Heresy Traceable to Valentinus, an Able But Restless Man. Many Schismatical Leaders of the School Mentioned. Only One of Them Shows Respect to the Man Whose Name Designates the Entire School." },
  { t = "p", text = "We know, I say, most fully their actual origin, and we are quite aware why we call them Valentinians, although they affect to disavow their name. They have departed, it is true,[^6657] from their founder, yet is their origin by no means destroyed; and even if it chance to be changed, the very change bears testimony to the fact. Valentinus had expected to become a bishop, because he was an able man both in genius and eloquence. Being indignant, however, that another obtained the dignity by reason of a claim which confessorship[^6658] had given him, he broke with the church of the true faith. Just like those (restless) spirits which, when roused by ambition, are usually inflamed with the desire of revenge, he applied himself with all his might[^6659] to exterminate the truth; and finding the clue[^6660] of a certain old opinion, he marked out a path for himself with the subtlety of a serpent. Ptolemæus afterwards entered on the same path, by distinguishing the names and the numbers of the Ænons into personal substances, which, however, he kept apart from God. Valentinus had included these in the very essence of the Deity, as senses and affections of motion. Sundry bypaths were then struck off therefrom, by Heraclean and Secundus and the magician Marcus. Theotimus worked hard about “the images of the law.” Valentinus, however, was as yet nowhere, and still the Valentinians derive their name from Valentinus. Axionicus at Antioch is the only man who at the present time does honour[^6661] to the memory of Valentinus, by keeping his rules[^6662] to the full. But this heresy is permitted to fashion itself into as many various shapes as a courtezan, who usually changes and adjusts her dress every day. And why not? When they review that spiritual seed of theirs in every man after this fashion, whenever they have hit upon any novelty, they forthwith call their presumption a revelation, their own perverse ingenuity a spiritual gift; but (they deny all) unity, *admitting only* diversity.[^6663] And thus we clearly see that, setting aside their customary dissimulation, most of them are in a divided state, being ready to say (and that sincerely) of certain points of their belief, “This is not so;” and, “I take this in a different sense;” and, “I do not admit that.” By this variety, indeed, innovation is stamped on the very face of their rules; besides which, it wears all the colourable features of ignorant conceits.[^6664]" },
  { t = "note", id = "6657", text = "Enim." },
  { t = "note", id = "6658", text = "Martyrii." },
  { t = "note", id = "6659", text = "Conversus." },
  { t = "note", id = "6660", text = "Semitam." },
  { t = "note", id = "6661", text = "Consolatur." },
  { t = "note", id = "6662", text = "Regularum: the particulars of his system. [Here comes in the word, borrowed from heresy, which shaped Monasticism in after times and created the *regular* orders.]" },
  { t = "note", id = "6663", text = "Nec unitatem, sed diversitatem: scil. appellant." },
  { t = "note", id = "6664", text = "Colores ignorantiarum." },
]

[[section]]
id = "many-eminent-christian-writers-have-carefully-and"
title = "Many Eminent Christian Writers Have Carefully and Fully Refuted the Heresy. These the Author Makes His Own Guides."
level = 1
blocks = [
  { t = "p", text = "Chapter V.—Many Eminent Christian Writers Have Carefully and Fully Refuted the Heresy. These the Author Makes His Own Guides." },
  { t = "p", text = "My own path, however, lies along the original tenets[^6665] of their chief teachers, not with the self-appointed leaders of their promiscuous[^6666] followers. Nor shall we hear it said of us from any quarter, that we have of our own mind fashioned our own materials, since these have been already produced, both in respect of the opinions and their refutations, in carefully written volumes, by so many eminently holy and excellent men, not only those who have lived before us, but those also who were contemporary with the heresiarchs themselves: for instance Justin, philosopher and martyr;[^6667] Miltiades, the sophist[^6668] of the churches; Irenæus, that very exact inquirer into all doctrines;[^6669] our own Proculus, the model[^6670] of chaste old age and Christian eloquence. All these it would be my desire closely to follow in every work of faith, even as in this particular one. Now if there are no heresies at all but what those who refute them are supposed to have fabricated, then the apostle who predicted them[^6671] must have been guilty of falsehood. If, however, there are heresies, they can be no other than those which are the subject of discussion. No writer can be supposed to have so much time on his hands[^6672] as to fabricate materials which are already in his possession." },
  { t = "note", id = "6665", text = "Archetypis." },
  { t = "note", id = "6666", text = "Passivorum." },
  { t = "note", id = "6667", text = "[See Vol. I. pp. 171, 182, this series]." },
  { t = "note", id = "6668", text = "In a good sense, from the elegance of his style." },
  { t = "note", id = "6669", text = "[See Vol. I. p. 326, of this series. Tertullian appropriates the work of Irenæus, (B. i.) against the Gnostics without further ceremony: translation excepted.]" },
  { t = "note", id = "6670", text = "Dignitas. [Of this Proculus see Kaye, p. 55.]" },
  { t = "note", id = "6671", text = "1 Cor. xi. 19." },
  { t = "note", id = "6672", text = "Otiosus." },
]

[[section]]
id = "although-writing-in-latin-he-proposes-to"
title = "Although Writing in Latin He Proposes to Retain the Greek Names of the Valentinian Emanations of Deity. Not to Discuss the Heresy But Only to Expose It. This with the Raillery Which Its Absurdity Merits."
level = 1
blocks = [
  { t = "p", text = "Chapter VI.—Although Writing in Latin He Proposes to Retain the Greek Names of the Valentinian Emanations of Deity. Not to Discuss the Heresy But Only to Expose It. This with the Raillery Which Its Absurdity Merits." },
  { t = "p", text = "In order then, that no one may be blinded by so many outlandish[^6673] names, collected together, and adjusted at pleasure,[^6674] and of doubtful import, I mean in this little work, wherein we merely undertake to propound this (heretical) mystery, to explain in what manner we are to use them. Now the rendering of some of these *names* from the Greek so as to produce an equally obvious sense of the word, is by no means an easy process: in the case of some others, the genders are not suitable; while others, again, are more familiarly known in their Greek form. For the most part, therefore, we shall use the Greek names; their meanings will be seen on the margins of the pages. Nor will the Greek be unaccompanied with the Latin *equivalents*; only these will be marked in lines above, for the purpose of explaining[^6675] the personal names, rendered necessary by the ambiguities of such of them as admit some different meaning. But although I must postpone all discussion, and be content at present with the mere exposition (of the heresy), still, wherever any scandalous feature shall seem to require a castigation, it must be attacked[^6676] by all means, if only with a passing thrust.[^6677] Let the reader regard it as the skirmish before the battle. It will be my drift to show how to wound[^6678] rather than to inflict deep gashes. If in any instance mirth be excited, this will be quite as much as the subject deserves. There are many things which deserve refutation in such a way as to have no gravity expended on them. Vain and silly topics are met with especial fitness by laughter. Even the truth may indulge in ridicule, because it is jubilant; it may play with its enemies, because it is fearless.[^6679] Only we must take care that its laughter be not unseemly, and so itself be laughed at; but wherever its mirth is decent, there it is a duty *to indulge it*. And so at last I enter on my task." },
  { t = "note", id = "6673", text = "Tam peregrinis." },
  { t = "note", id = "6674", text = "Compactis." },
  { t = "note", id = "6675", text = "Ut signum hoc sit." },
  { t = "note", id = "6676", text = "Or *stormed* perhaps; *expugnatio* is the word." },
  { t = "note", id = "6677", text = "Delibatione transfunctoria." },
  { t = "note", id = "6678", text = "Ostendam vulnera." },
  { t = "note", id = "6679", text = "Secura." },
]

[[section]]
id = "the-first-eight-emanations-or-ons-called"
title = "The First Eight Emanations, or Æons, Called the Ogdoad, are the Fountain of All the Others. Their Names and Descent Recorded."
level = 1
blocks = [
  { t = "p", text = "Chapter VII.—The First Eight Emanations, or Æons, Called the Ogdoad, are the Fountain of All the Others. Their Names and Descent Recorded." },
  { t = "p", text = "Beginning with Ennius,[^6680] the Roman poet, he simply spoke of “the spacious saloons[^6681] of heaven,”—either on account of their elevated site, or because in Homer he had read about Jupiter banqueting therein. As for *our* heretics, however, it is marvellous what storeys upon storeys[^6682] and what heights upon heights, they have hung up, raised *and* spread out as a dwelling for each several god of theirs. Even our Creator has had arranged for Him the saloons of Ennius in the fashion of private rooms,[^6683] with chamber piled upon chamber, and assigned to each god by just as many staircases as there were heresies. The universe, *in fact*, has been turned into “rooms to let.”[^6684] Such storeys of the heavens you would imagine to be detached tenements in some happy isle of the blessed,[^6685] I know not where. There the god even of the Valentinians has his dwelling in the attics. They call him indeed, as to his essence, Αἰῶν τέλειος (*Perfect Æon*), but in respect of his personality, Προαρχή (*Before the Beginning*), ῾Η ᾽Αρχή (*The Beginning*), and sometimes Bythos (*Depth*),[^6686] a name which is most unfit for one who dwells in the heights above! They describe him as unbegotten, immense, infinite, invisible, and eternal; as if, when they described him to be such as we know that he ought to be, they straightway prove him to be a being who may be said to have had such an existence even before all things else. I indeed insist upon[^6687] it that he is such a being; and there is nothing which I detect in beings of this sort more obvious, than that they who are said to have been before all things—things, too, not their own—are found to be behind all things. Let it, however, be granted that this Bythos of theirs existed in the infinite ages of the past in the greatest and profoundest repose, in the extreme rest of a placid and, if I may use the expression, stupid divinity, such as Epicurus has enjoined upon us. And yet, although they would have him be alone, they assign to him a second person in himself and with himself, Ennoea (*Thought*), which they also call both Charis (*Grace*) and Sige (*Silence*). Other things, as it happened, conduced in this most agreeable repose to remind him of the need of by and by producing out of himself the beginning of all things. This he deposits in lieu of seed in the genital region, as it were, of the womb of his Sige. Instantaneous conception is the result: Sige becomes pregnant, and is delivered, of course in silence; and her offspring is Nus (Mind), very like his father and his equal in every respect. In short, he alone is capable of comprehending the measureless and incomprehensible greatness of his father. Accordingly he is even called the Father himself, and the Beginning of all things, and, with great propriety, Monogenes (*The Only-begotten*). And yet not with absolute propriety, since he is not born alone. For along with him a female also proceeded, whose name was Veritas[^6688] (*Truth*). But how much more suitably might Monogenes be called Protogenes (*First begotten*), since he was begotten first! Thus Bythos and Sige, Nus and Veritas, are alleged to be the first fourfold team[^6689] of the Valentinian set (of gods)[^6690] the parent stock and origin of them all. For immediately when[^6691] Nus received the function of a procreation of his own, he too produces out of himself Sermo (*the Word*) and Vita (*the Life*). If this latter existed not previously, of course she existed not in Bythos. And a pretty absurdity would it be, if *Life* existed not in God! However, this offspring also produces fruit, having for its mission the initiation of the universe and the formation of the entire Pleroma: it procreates Homo (*Man*) and Ecclesia (*the Church*). Thus you have an Ogdoad, a double Tetra, out of the conjunctions of males and females—the cells[^6692] (so to speak) of the primordial Æons, the fraternal nuptials of the Valentinian gods, the simple originals[^6693] of heretical sanctity and majesty, a rabble[^6694]—shall I say of criminals[^6695] or of deities?[^6696]—at any rate, the fountain of all ulterior fecundity." },
  { t = "note", id = "6680", text = "Primus omnium." },
  { t = "note", id = "6681", text = "Cœnacula: dining halls." },
  { t = "note", id = "6682", text = "Supernitates supernitatum." },
  { t = "note", id = "6683", text = "Ædicularum." },
  { t = "note", id = "6684", text = "Meritorium." },
  { t = "note", id = "6685", text = "This is perhaps a fair rendering of “Insulam Feliculam credas tanta tabulata cœlorum, nescio ubi.” “Insula” is sometimes “a detached house.” It is difficult to say what “Felicula” is; it seems to be a diminutive of Felix. It occurs in Arrian’s *Epictetica* as the name of a slave." },
  { t = "note", id = "6686", text = "We follow Tertullian’s mode of designation all through. He, for the most part, gives the Greek names in Roman letters, but not quite always." },
  { t = "note", id = "6687", text = "Expostulo: “I postulate as a first principle.”" },
  { t = "note", id = "6688", text = "Tertullian is responsible for this *Latin* word amongst the Greek names. The strange mixture occurs often." },
  { t = "note", id = "6689", text = "Quadriga." },
  { t = "note", id = "6690", text = "Factionis." },
  { t = "note", id = "6691", text = "Ibidem simul." },
  { t = "note", id = "6692", text = "Cellas." },
  { t = "note", id = "6693", text = "Census." },
  { t = "note", id = "6694", text = "Turbam." },
  { t = "note", id = "6695", text = "Criminum." },
  { t = "note", id = "6696", text = "Numinum." },
]

[[section]]
id = "the-names-and-descent-of-other-ons"
title = "The Names and Descent of Other Æons; First Half a Score, Then Two More, and Ultimately a Dozen Besides. These Thirty Constitute the Pleroma. But Why Be So Capricious as to Stop at Thirty?"
level = 1
blocks = [
  { t = "p", text = "Chapter VIII.—The Names and Descent of Other Æons; First Half a Score, Then Two More, and Ultimately a Dozen Besides. These Thirty Constitute the Pleroma. But Why Be So Capricious as to Stop at Thirty?" },
  { t = "p", text = "For, behold, when the second Tetrad—Sermo and Vita, Homo and Ecclesia[^6697]—had borne fruit to the Father’s glory, having an intense desire of themselves to present to the Father something similar of their own, they bring other issue into being[^6698]—conjugal of course, as the others were[^6699]—by the union of the twofold nature. On the one hand, Sermo and Vita pour out at a birth a half-score of Æons; on the other hand, Homo and Ecclesia produce a couple more, so furnishing an equipoise to their parents, since this pair with the other ten make up just as many as they did themselves procreate. I now give the names of the half-score whom I have mentioned: Bythios (*Profound*) and Mixis (*Mixture*), Ageratos (*Never old*) and Henosis (*Union*), Autophyes (*Essential nature*) and Hedone (*Pleasure*), Acinetos (*Immoveable*) and Syncrasis (*Commixture*,) Monogenes (*Only-begotten*) and Macaria (*Happiness*). On the other hand, these will make up the number twelve (to which I have also referred): Paracletus (*Comforter*) and Pistis (*Faith*), Patricas (*Paternal*) and Elpis (*Hope*), Metricos (*Maternal*) and Agape (*Love*), Ainos (*Praise*)[^6700] and Synesis (*Intelligence*), Ecclesiasticus (*Son of Ecclesia*) and Macariotes (*Blessedness*), Theletus[^6701] (*Perfect*) and Sophia (*Wisdom*). I cannot help[^6702] here quoting from a like example what may serve to show the import of these names. In the schools of Carthage there was once a certain Latin rhetorician, an excessively cool fellow,[^6703] whose name was Phosphorus. He was personating a man of valour, and wound up[^6704] with saying, “I come to you, excellent citizens, from battle, with victory for myself, with happiness for you, full of honour, covered with glory, the favourite of fortune, the greatest of men, decked with triumph.” And forthwith his scholars begin to shout for the school of Phosphorus, φεῦ[^6705] (*ah!*). Are you a believer in[^6706] Fortunata, and Hedone, and Acinetus, and Theletus? Then shout out your φεῦ for the school of Ptolemy.[^6707] This must be that mystery of the Pleroma, the fulness of the thirty-fold divinity. Let us see what special attributes[^6708] belong to these numbers—four, and eight, and twelve. Meanwhile with the number thirty all fecundity ceases. The generating force and power and desire of the Æons is spent.[^6709] As if there were not still left some strong rennet for curdling numbers.[^6710] As if no other names were to be got out of the page’s hall![^6711] For why are there not sets of fifty and of a hundred procreated? Why, too, are there no comrades and boon companions[^6712] named *for them*?" },
  { t = "note", id = "6697", text = "We everywhere give Tertullian’s own names, whether of Greek form or Latin. On their first occurrence we also give their English sense." },
  { t = "note", id = "6698", text = "Ebulliunt." },
  { t = "note", id = "6699", text = "Proinde conjugales." },
  { t = "note", id = "6700", text = "Of this name there are two forms—Αἶνος (*Praise*) and ᾽Αεινοῦς (*Eternal Mind*)." },
  { t = "note", id = "6701", text = "Or Τελετός (Teletus). Another form of this Æon’s name is Φιλητός (*Philetus* = *Beloved*). Oehler always reads Theletus." },
  { t = "note", id = "6702", text = "Cogor." },
  { t = "note", id = "6703", text = "Frigidissimus." },
  { t = "note", id = "6704", text = "Cum virum fortem peroraret…inquit." },
  { t = "note", id = "6705", text = "Tertullian’s joke lies in the equivocal sense of this cry, which may mean either admiration and joy, or grief and rage." },
  { t = "note", id = "6706", text = "Audisti: interrogatively." },
  { t = "note", id = "6707", text = "See above, chap. iv. p. 505." },
  { t = "note", id = "6708", text = "Privilegia." },
  { t = "note", id = "6709", text = "Castrata." },
  { t = "note", id = "6710", text = "Tanta numerorum coagula." },
  { t = "note", id = "6711", text = "The *pædagogium* was either the place where boys were trained as pages (often for lewd purposes), or else the boy himself of such a character." },
  { t = "note", id = "6712", text = "Oehler reads, “hetæri (ἑταῖροι) et syntrophi.” Another reading, supported by Rigaltius, is “sterceiæ,” instead of the former word, which gives a very contemptuous sense, suitable to Tertullian’s irony." },
]

[[section]]
id = "other-capricious-features-in-the-system-the"
title = "Other Capricious Features in the System. The Æons Unequal in Attributes. The Superiority of Nus; The Vagaries of Sophia Restrained by Horos. Grand Titles Borne by This Last Power."
level = 1
blocks = [
  { t = "p", text = "Chapter IX.—Other Capricious Features in the System. The Æons Unequal in Attributes. The Superiority of Nus; The Vagaries of Sophia Restrained by Horos. Grand Titles Borne by This Last Power." },
  { t = "p", text = "But, further, there is an “acceptance[^6713] of persons,” inasmuch as Nus alone among them all enjoys the knowledge of the immeasurable Father, joyous and exulting, while they of course pine in sorrow. To be sure, Nus, so far as in him lay, both wished and tried to impart to the others also all that he had learnt about the greatness and incomprehensibility of the Father; but his mother, Sige, interposed—she who (you must know) imposes silence even on her own beloved heretics;[^6714] although they affirm that this is done at the will of the Father, who will have all to be inflamed with a longing after himself. Thus, while they are tormenting themselves with these internal desires, while they are burning with the secret longing to know the Father, the crime is almost accomplished. For of the twelve Æons which Homo and Ecclesia had produced, the youngest by birth (never mind the solecism, since Sophia (Wisdom) is her name), unable to restrain herself, breaks away without the society of her husband Theletus, in quest of the Father and contracts that kind of sin which had indeed arisen amongst the others who were conversant with Nus but had flowed on to this *Æon*,[^6715] that is, to Sophia; as is usual with maladies which, after arising in one part of the body, spread abroad their infection to some other limb. The fact is,[^6716] under a pretence of love to the Father, she was overcome with a desire to rival Nus, who alone rejoiced in the knowledge of the Father.[^6717] But when Sophia, straining after impossible aims, was disappointed of her hope, she is both overcome with difficulty, and racked with affection. *Thus* she was all but swallowed up by reason of the charm and toil (of her research),[^6718] and dissolved into the remnant of *his* substance;[^6719] nor would there have been any other alternative for her than perdition, if she had not by good luck fallen in with Horus (*Limit*). He too had considerable power. He is the foundation of the great[^6720] universe, and, externally, the guardian thereof. To him they give the additional names of Crux (*Cross*), and Lytrotes (*Redeemer*,) and Carpistes (*Emancipator*).[^6721] When Sophia was thus rescued from danger, and tardily persuaded, she relinquished further research after the Father, found repose, and laid aside all her excitement,[^6722] *or* Enthymesis (*Desire*,) along with the passion which had come over her." },
  { t = "note", id = "6713", text = "Exceptio." },
  { t = "note", id = "6714", text = "Tertullian has, above, remarked on the silent and secret practices of the Valentinians: see chap. i. p. 503." },
  { t = "note", id = "6715", text = "In hunc derivaret." },
  { t = "note", id = "6716", text = "Sed enim." },
  { t = "note", id = "6717", text = "De Patre." },
  { t = "note", id = "6718", text = "Præ vi dulcedinis et laboris." },
  { t = "note", id = "6719", text = "It is not easy to say what is the meaning of the words, “Et in reliquam substantiam dissolvi.” Rigaltius renders them: “So that whatever substance was left to her was being dissolved.” This seems to be forcing the sentence unnaturally. Irenæus (according to the Latin translator) says: “Resolutum in universam substantiam,” “Resolved into his (the Father’s) general substance,” i. 2, 2. [Vol. I. p. 317.]" },
  { t = "note", id = "6720", text = "Illius." },
  { t = "note", id = "6721", text = "So Grabe; but *Reaper*, according to Neander." },
  { t = "note", id = "6722", text = "Animationem." },
]

[[section]]
id = "another-account-of-the-strange-aberrations-of"
title = "Another Account of the Strange Aberrations of Sophia, and the Restraining Services of Horus. Sophia Was Not Herself, After All, Ejected from the Pleroma, But Only Her Enthymesis."
level = 1
blocks = [
  { t = "p", text = "Chapter X.—Another Account of the Strange Aberrations of Sophia, and the Restraining Services of Horus. Sophia Was Not Herself, After All, Ejected from the Pleroma, But Only Her Enthymesis." },
  { t = "p", text = "But some dreamers have given another account of the aberration[^6723] and recovery of Sophia. After her vain endeavours, and the disappointment of her hope, she was, I suppose, disfigured with paleness and emaciation, and that neglect of her beauty which was natural to one who[^6724] was deploring the denial of the Father,—an affliction which was no less painful than his loss. Then, in the midst of all this sorrow, she by herself alone, without any conjugal help, conceived and bare a female offspring. Does this excite your surprise? Well, even the hen has the power of being able to bring forth by her own energy.[^6725] They say, too, that among vultures there are only females, which become parents alone. At any rate, she was another without aid from a male, and she began at last to be afraid that her end was even at hand. She was all in doubt about the treatment[^6726] of her case, and took pains at self-concealment. Remedies *could* nowhere *be found*. For where, then, should we have tragedies and comedies, from which to borrow the process of exposing what has been born without connubial modesty? While the thing is in this evil plight, she raises her eyes, and turns them to the Father. Having, however, striven in vain, as her strength was failing her, she falls to praying. Her entire kindred also supplicates in her behalf, and especially Nus. Why not? What was the cause of so vast an evil? Yet not a single casualty[^6727] befell Sophia without its effect. All her sorrows operate. Inasmuch as all that conflict of hers contributes to the origin of Matter. *Her* ignorance, *her* fear, *her* distress, become substances. Hereupon the Father by and by, being moved, produces in his own image, with a view to these *circumstances*[^6728] the Horos whom we have mentioned above; (and this he does) by means of Monogenes Nus, a male-female (Æon), because there is this variation of statement about the Father’s[^6729] sex. They also go on to tell us that Horos is likewise called Metagogius, that is, “a conductor about,” as well as Horothetes (*Setter of Limits*). By his assistance they declare that Sophia was checked in her illicit courses, and purified from all evils, and henceforth strengthened (in virtue), and restored to the conjugal state: (they add) that she indeed remained within the bounds[^6730] of the Pleroma, but that her Enthymesis, with the accruing[^6731] Passion, was banished by Horos, and crucified and cast out from the Pleroma,—even as they say, *Malum foras*! (Evil, avaunt!) Still, that was a spiritual essence, as being the natural impulse of an Æon, although without form or shape, inasmuch as it had apprehended nothing, and therefore was pronounced to be an infirm and feminine fruit.[^6732]" },
  { t = "note", id = "6723", text = "Exitum." },
  { t = "note", id = "6724", text = "Uti quæ." },
  { t = "note", id = "6725", text = "Comp. Aristotle, *Hist. Anim.* vi. 2; Pliny, *H. N.* x. 58, 60." },
  { t = "note", id = "6726", text = "Ratione." },
  { t = "note", id = "6727", text = "Exitus." },
  { t = "note", id = "6728", text = "In hæc: in relation to the case of Sophia." },
  { t = "note", id = "6729", text = "Above, in chap. viii. we were told that Nus, who was so much like the Father, was himself called “Father.”" },
  { t = "note", id = "6730", text = "In censu." },
  { t = "note", id = "6731", text = "Appendicem." },
  { t = "note", id = "6732", text = "Literally, “infirm fruit and a female,” *i.e.* “had not shared in any male influence, but was a purely female production.” See our *Irenæus*, i. 4. [Vol. I. p. 321.]" },
]

[[section]]
id = "the-profane-account-given-of-the-origin"
title = "The Profane Account Given of the Origin of Christ and the Holy Ghost Sternly Rebuked. An Absurdity Respecting the Attainment of the Knowledge of God Ably Exposed."
level = 1
blocks = [
  { t = "p", text = "Chapter XI.—The Profane Account Given of the Origin of Christ and the Holy Ghost Sternly Rebuked. An Absurdity Respecting the Attainment of the Knowledge of God Ably Exposed." },
  { t = "p", text = "Accordingly, after the banishment of the Enthymesis, and the return of her mother Sophia to her husband, the (illustrious) Monogenes, the Nus,[^6733] released indeed from all care and concern of the Father, in order that he might consolidate all things, and defend and at last fix the Pleroma, and so prevent any concussion of the kind again, once more[^6734] emits a new couple[^6735] (blasphemously named). I should suppose the coupling of two males to be a very shameful thing, or else the one[^6736] must be a female, and so the male is discredited[^6737] by the female. One divinity is assigned in the case of all these, to procure a complete adjustment among the Æons. Even from this fellowship in a common duty two schools actually arise, two chairs,[^6738] and, to some extent,[^6739] the inauguration of a division in the doctrine of Valentinus. It was the function of Christ to instruct the Æons in the nature of their conjugal relations[^6740] (you see what the whole thing was, of course!), and how to form some guess about the unbegotten,[^6741] and to give them the capacity of generating within themselves the knowledge of the Father; it being impossible to catch the idea of him, or comprehend him, or, in short, even to enjoy any perception of him, either by the eye or the ear, except through Monogenes (the Only-begotten). Well, I will even grant them what they allege about knowing the Father, so that they do not refuse us (the attainment of) the same. I would rather point out what is perverse in their doctrine, how they were taught that the incomprehensible part of the Father was the cause of their own perpetuity,[^6742] whilst that which might be comprehended of him was the reason[^6743] of their generation and formation. Now by these several positions[^6744] the tenet, I suppose, is insinuated, that it is expedient for God not to be apprehended, on the very ground that the incomprehensibility of His character is the cause of perpetuity; whereas what in Him is comprehensible is productive, not of perpetuity, but rather of conditions which lack perpetuity—namely, nativity and formation. The Son, indeed, they made capable of comprehending the Father. The manner in which He is comprehended, the recently produced Christ fully taught them. To the Holy Spirit, however, belonged the special gifts, whereby they, having been all set on a complete par in respect of their earnestness to learn, should be enabled to offer up their thanksgiving, and be introduced to a true tranquillity." },
  { t = "note", id = "6733", text = "Ille nus." },
  { t = "note", id = "6734", text = "Iterum: above." },
  { t = "note", id = "6735", text = "Copulationem: The profane reference is to Christ and the Spirit." },
  { t = "note", id = "6736", text = "[A shocking reference to the Spirit which I modify to *one* of the Divine Persons.]" },
  { t = "note", id = "6737", text = "Vulneratur." },
  { t = "note", id = "6738", text = "Cathedræ." },
  { t = "note", id = "6739", text = "Quædam." },
  { t = "note", id = "6740", text = "Conjugiorum." },
  { t = "note", id = "6741", text = "Innati conjectationem." },
  { t = "note", id = "6742", text = "Perpetuitatis: *i.e.* “what was unchangeable in their condition and nature.”" },
  { t = "note", id = "6743", text = "Rationem: perhaps “the means.”" },
  { t = "note", id = "6744", text = "Hac dispositione." },
]

[[section]]
id = "the-strange-jumble-of-the-pleroma-the"
title = "The Strange Jumble of the Pleroma. The Frantic Delight of the Members Thereof. Their Joint Contribution of Parts Set Forth with Humorous Irony."
level = 1
blocks = [
  { t = "p", text = "Chapter XII.—The Strange Jumble of the Pleroma. The Frantic Delight of the Members Thereof. Their Joint Contribution of Parts Set Forth with Humorous Irony." },
  { t = "p", text = "Thus they are all on the self-same footing in respect of form and knowledge, all of them having become what each of them severally is; none being a different being, because they are all what the others are.[^6745] They are all turned into[^6746] Nuses, into Homos, into Theletuses;[^6747] and so in the case of the females, into Siges, into Zoes, into Ecclesias, into Fortunatas, so that Ovid would have blotted out his own Metamorphoses if he had only known our larger one in the present day. Straightway they were reformed and thoroughly established, and being composed to rest from the truth, they celebrate the Father in a chorus[^6748] of praise in the exuberance of their joy. *The Father* himself also revelled[^6749] in the glad feeling; of course, because his children and grandchildren sang so well. And why should he not revel in absolute delight? Was not the Pleroma freed (from all danger)? What ship’s captain[^6750] fails to rejoice even with indecent frolic? Every day we observe the uproarious ebullitions of sailors’ joys.[^6751] Therefore, as sailors always exult over the reckoning they pay in common, so do these Æons enjoy a similar pleasure, one as they now all are in form, and, as I may add,[^6752] in feeling too. With the concurrence of even their new brethren and masters,[^6753] they contribute into one common stock the best and most beautiful thing with which they are severally adorned. Vainly, as I suppose. For if they were all one by reason by the above-mentioned thorough equalization, there was no room for the process of a common reckoning,[^6754] which for the most part consists of a pleasing variety. They all contributed the one good thing, which they all were. There would be, in all probability, a formal procedure[^6755] in the mode or in the form of the very equalization in question. Accordingly, out of the donation which they contributed[^6756] to the honour and glory of the Father, they jointly fashion[^6757] the most beautiful constellation of the Pleroma, and its perfect fruit, Jesus. Him they also surname[^6758] Soter (*Saviour*) and Christ, and Sermo (*Word*) after his ancestors;[^6759] and lastly Omnia (*All Things*), as formed from a universally culled nosegay,[^6760] *like* the jay of Æsop, the Pandora of Hesiod, the bowl[^6761] of Accius, the honey-cake of Nestor, the miscellany of Ptolemy. How much nearer the mark, if these idle title-mongers had called him Pancarpian, after certain Athenian customs.[^6762] By way of adding external honour also to their wonderful puppet, they produce for him a bodyguard of angels of like nature. If this be their mutual condition, it may be all right; if, however, they are consubstantial with Soter (for I have discovered how doubtfully the case is stated), where will be his eminence when surrounded by attendants who are co-equal with himself?" },
  { t = "note", id = "6745", text = "Nemo aliud quia alteri omnes." },
  { t = "note", id = "6746", text = "Refunduntur." },
  { t = "note", id = "6747", text = "The reader will, of course, see that we give a familiar English plural to these names, as better expressing Tertullian’s irony." },
  { t = "note", id = "6748", text = "Concinunt." },
  { t = "note", id = "6749", text = "Diffundebatur." },
  { t = "note", id = "6750", text = "Nauclerus: “pilot.”" },
  { t = "note", id = "6751", text = "Tertullian lived in a seaport at Carthage." },
  { t = "note", id = "6752", text = "Nedum." },
  { t = "note", id = "6753", text = "Christ and the Holy Spirit, [i.e. blasphemously.]" },
  { t = "note", id = "6754", text = "Symbolæ ratio." },
  { t = "note", id = "6755", text = "Ratio." },
  { t = "note", id = "6756", text = "Ex ære collaticio. In reference to the common *symbola*, Tertullian adds the proverbial formula, “quod aiunt” (as they say)." },
  { t = "note", id = "6757", text = "Compingunt." },
  { t = "note", id = "6758", text = "Cognominant." },
  { t = "note", id = "6759", text = "De patritus. Irenæus’ word here is πατρωνυμικῶς (“*patronymice*”)." },
  { t = "note", id = "6760", text = "Ex omnium defloratione." },
  { t = "note", id = "6761", text = "Patina." },
  { t = "note", id = "6762", text = "Alluding to the olive-branch, ornamented with all sorts of fruits (compare our “Christmas tree”), which was carried about by boys in Athens on a certain festival (White and Riddle)." },
]

[[section]]
id = "first-part-of-the-subject-touching-the"
title = "First Part of the Subject, Touching the Constitution of the Pleroma, Briefly Recapitulated. Transition to the Other Part, Which is Like a Play Outside the Curtain."
level = 1
blocks = [
  { t = "p", text = "Chapter XIII.—First Part of the Subject, Touching the Constitution of the Pleroma, Briefly Recapitulated. Transition to the Other Part, Which is Like a Play Outside the Curtain." },
  { t = "p", text = "In this series, then, is contained the first emanation of Æons, who are alike born, and are married, and produce offspring: there are the most dangerous fortunes of Sophia in her ardent longing for the Father, the most seasonable help of Horos, the expiation of her Enthymesis and accruing Passion, the instruction of Christ and the Holy Spirit, their tutelar reform of the Æons, the piebald ornamentation of Soter, the consubstantial retinue[^6763] of the angels. All that remains, according to you, is the fall of the curtain and the clapping of hands.[^6764] What remains in my opinion, however, is, that you should hear and take heed. At all events, these things are said to have been played out within the company of the Pleroma, the first scene of the tragedy. The rest of the play, however, is beyond the curtain—I mean outside of the Pleroma. And yet if it be such within the bosom of the Father, within the embrace of the guardian Horos, what must it be outside, in free space,[^6765] where God did not exist?" },
  { t = "note", id = "6763", text = "Comparaticium antistatum. The latter word Oehler explains, “ante ipsum stantes;” the former, “quia genus eorum comparari poterat substantiæ Soteris” (so Rigaltus)." },
  { t = "note", id = "6764", text = "The reader will see how obviously this is meant in Tertullian’s “Quod superest, inquis, vos valete et plaudite.” This is the well-known allusion to the end of the play in the old Roman theatre. See Quintilian, vi. 1, 52; comp. Horace, *A. P.* 155. Tertullian’s own parody to this formula, immediately after, is: “Immo quod superest, inquam, vos audite et proficite." },
  { t = "note", id = "6765", text = "In libero: which may be, however, “beyond the control of Horos.”" },
]

[[section]]
id = "the-adventures-of-achamoth-outside-the-pleroma"
title = "The Adventures of Achamoth Outside the Pleroma. The Mission of Christ in Pursuit of Her. Her Longing for Christ. Horos' Hostility to Her. Her Continued Suffering."
level = 1
blocks = [
  { t = "p", text = "Chapter XIV.—The Adventures of Achamoth Outside the Pleroma. The Mission of Christ in Pursuit of Her. Her Longing for Christ. Horos’ Hostility to Her. Her Continued Suffering." },
  { t = "p", text = "For Enthymesis, or rather Achamoth—because by this inexplicable[^6766] name alone must she be henceforth designated—when in company with the vicious Passion, her inseparable companion, she was expelled to places devoid of that light which is the substance of the Pleroma, even to the void and empty region of Epicurus, she becomes wretched also because of the place of her banishment. She is indeed without either form or feature, even an untimely and abortive production. Whilst she is in this plight,[^6767] Christ descends from[^6768] the heights, conducted by Horos, in order to impart form to the abortion, out of his own energies, the form of substance only, but not of knowledge also. Still she is left with some property. She has restored to her the odour of immortality, in order that she might, under its influence, be overcome with the desire of better things than belonged to her present plight.[^6769] Having accomplished His merciful mission, not without the assistance of the Holy Spirit, Christ returns to the Pleroma. It is usual out of an abundance of things[^6770] for names to be also forthcoming. Enthymesis came from action;[^6771] whence Achamoth came is still a question; Sophia emanates from the Father, the Holy Spirit from an angel. She entertains a regret for Christ immediately after she had discovered her desertion by him. Therefore she hurried forth herself, in quest of the light of Him Whom she did not at all discover, as He operated in an invisible manner; for how else would she make search for His light, which was as unknown to her as He was Himself? Try, however, she did, and perhaps would have found Him, had not the self-same Horos, who had met her mother so opportunely, fallen in with the daughter quite as unseasonably, so as to exclaim at her Iao! just as we hear the cry “Porro Quirites” (“Out of the way, Romans!”), or else Fidem Cæsaris!” (“By the faith of Cæsar!”), whence (as they will have it) the name Iao comes to be found is the Scriptures.[^6772] Being thus hindered from proceeding further, and being unable to surmount[^6773] the Cross, that is to say, Horos, because she had not yet practised herself in the part of Catullus’ *Laureolus*,[^6774] *and* given over, as it were, to that passion of hers in a manifold and complicated mesh, she began to be afflicted with every impulse thereof, with sorrow,—because she had not accomplished her enterprise, with fear,—lest she should lose her life, even as she had lost the light, with consternation, *and* then with ignorance. But not as her mother (did she suffer this), for *she* was an Æon. Hers, however, was a worse suffering, considering her condition; for another tide of emotion still overwhelmed her, even of conversion to the Christ, by Whom she had been restored to life, and had been directed[^6775] to this very conversion." },
  { t = "note", id = "6766", text = "Ininterpretabili." },
  { t = "note", id = "6767", text = "Tertullian’s “Dum ita rerum habet” is a copy of the Greek οὕτω τῶν πραγμάτων ἔχουσο." },
  { t = "note", id = "6768", text = "Deflectitur a." },
  { t = "note", id = "6769", text = "Casus sui." },
  { t = "note", id = "6770", text = "Rerum ex liberalitatibus." },
  { t = "note", id = "6771", text = "De actia fuit. [See Vol. I. pp. 320, 321.]" },
  { t = "note", id = "6772", text = "It is not necessary, with Rigaltius, to make a difficulty about this, when we remember that Tertullian only refers to a silly conceit of the Valentinians touching the origin of the sacred name." },
  { t = "note", id = "6773", text = "Or does “nec habens *supervolare* crucem” mean “being unable to *elude* the cross?” As if Tertullian meant, in his raillery, to say, that Achamoth had not the skill of the player who played the part of Laureolus. Although so often suspended on the gibbet, he had of course as often escaped the real penalty." },
  { t = "note", id = "6774", text = "A notorious robber, the hero of a play by Lutatius Catullus, who is said to have been crucified." },
  { t = "note", id = "6775", text = "Temperata." },
]

[[section]]
id = "strange-account-of-the-origin-of-matter"
title = "Strange Account of the Origin of Matter, from the Various Affections of Achamoth. The Waters from Her Tears; Light from Her Smile."
level = 1
blocks = [
  { t = "p", text = "Chapter XV.—Strange Account of the Origin of Matter, from the Various Affections of Achamoth. The Waters from Her Tears; Light from Her Smile." },
  { t = "p", text = "Well, now, the Pythagoreans may learn, the Stoics may know, Plato himself (may discover), whence Matter, which they will have to be unborn, derived both its origin and substance for all this pile of the world—(a mystery) which not even the renowned[^6776] Mercurius Trismegistus, master (as he was) of all physical philosophy, thought out.[^6777] You have just heard of “Conversion,” one element in the “Passion” (we have so often mentioned). Out of this the whole life of the world,[^6778] and even that of the Demiurge himself, our God, is said to have had its being. Again, you have heard of “sorrow” and “fear.” From these all other created things[^6779] took their beginning. For from her[^6780] tears flowed the entire mass of waters. From this circumstance one may form an idea of the calamity[^6781] which she encountered, so vast were the kinds of the tears wherewith she overflowed. She had salt tear-drops, she had bitter, and sweet, and warm, and cold, and bituminous, and ferruginous, and sulphurous, and even[^6782] poisonous, so that the Nonacris exuded therefrom which killed Alexander; and the river of the Lyncestæ[^6783] flowed from the same source, which produces drunkenness; and the Salmacis[^6784] was derived from the same source, which renders men effeminate. The rains of heaven Achamoth whimpered forth,[^6785] and we on our part are anxiously employed in saving up in our cisterns the very wails and tears of another. In like manner, from the “consternation” and “alarm” (of which we have also heard), bodily elements were derived. And yet amidst so many circumstances of solitude, in this vast prospect of destitution, she occasionally smiled at the recollection of the sight of Christ, and from this smile of joy light flashed forth. How great was this beneficence of Providence, which induced her to smile, and all that we might not linger for ever in the dark! Nor need you feel astonished how[^6786] from her joy so splendid an element[^6787] could have beamed upon the world, when from her sadness even so necessary a provision[^6788] flowed forth for man. O illuminating smile! O irrigating tear! And yet it might now have acted as some alleviation amidst the horror of her situation; for she might have shaken off all the obscurity thereof as often as she had a mind to smile, even not to be obliged to turn suppliant to those who had deserted her.[^6789]" },
  { t = "note", id = "6776", text = "Ille." },
  { t = "note", id = "6777", text = "Recogitavit." },
  { t = "note", id = "6778", text = "“Omnis anima hujus mundi” may, however, mean “every living soul.” So Bp. Kaye, *On Tertullian*, p. 487." },
  { t = "note", id = "6779", text = "Cetera." },
  { t = "note", id = "6780", text = "Achamoth’s." },
  { t = "note", id = "6781", text = "Exitum." },
  { t = "note", id = "6782", text = "Utique." },
  { t = "note", id = "6783", text = "These two rivers, with their peculiar qualities, are mentioned by Pliny, *H. N.* ii. 103; [and the latter by Milton against Salmasius.]" },
  { t = "note", id = "6784", text = "Ovid. *Metam.* iv. 286." },
  { t = "note", id = "6785", text = "Pipiavit." },
  { t = "note", id = "6786", text = "Qui." },
  { t = "note", id = "6787", text = "As light." },
  { t = "note", id = "6788", text = "Instrumentum: water is meant." },
  { t = "note", id = "6789", text = "Christ and the Holy Spirit. Oehler." },
]

[[section]]
id = "achamoth-purified-from-all-impurities-of-her"
title = "Achamoth Purified from All Impurities of Her Passion by the Paraclete, Acting Through Soter, Who Out of the Above-Mentioned Impurities Arranges Matter, Separating Its Evil from the Better Qualities."
level = 1
blocks = [
  { t = "p", text = "Chapter XVI.—Achamoth Purified from All Impurities of Her Passion by the Paraclete, Acting Through Soter, Who Out of the Above-Mentioned Impurities Arranges Matter, Separating Its Evil from the Better Qualities." },
  { t = "p", text = "She, too, resorts to prayers, after the manner of her mother. But Christ, Who now felt a dislike to quit the Pleroma, appoints the Paraclete as his deputy. To her, therefore, he despatches Soter,[^6790] (who must be the same as Jesus, to whom the Father imparted the supreme power over the whole body of the Æons, by subjecting them all to him, so that “by him,” as the apostle says, “all things were created”[^6791]), with a retinue and cortege of contemporary angels, and (as one may suppose) with the dozen fasces. Hereupon Achamoth, being quite struck with the pomp of his approach, immediately covered herself with a veil, moved at first with a dutiful feeling of veneration and modesty; but afterwards she surveys him calmly, and his prolific equipage.[^6792] With such energies as she had derived from the contemplation, she meets him with the salutation, Κύριε, χαῖρε (“Hail, Lord”)! Upon this, I suppose, he receives her, confirms and conforms her in knowledge, as well as cleanses[^6793] her from all the outrages of Passion, without, however, utterly severing them, with an indiscriminateness like that which had happened in the casualties which befell her mother. For such vices as had become inveterate and confirmed by practice he throws together; and when he had consolidated them in one mass, he fixes them in a separate body, so as to compose the corporeal condition of Matter, extracting out of her inherent, incorporeal passion such an aptitude of nature[^6794] as might qualify it to attain to a reciprocity of bodily substances,[^6795] which should emulate one another, so that a twofold condition of the substances might be arranged; *one* full of evil through its faults, *the other* susceptible of passion from conversion. This will prove to be Matter, which has set us in battle array against Hermogenes, and all others who presume to teach that God made all things out of Matter, not out of nothing." },
  { t = "note", id = "6790", text = "Saviour: another title of their Paraclete." },
  { t = "note", id = "6791", text = "Col. i. 16." },
  { t = "note", id = "6792", text = "Fructiferumque suggestum." },
  { t = "note", id = "6793", text = "Expumicat." },
  { t = "note", id = "6794", text = "Habilitatem atque naturam. We have treated this as a “hendiadys.”" },
  { t = "note", id = "6795", text = "Æquiparantias corpulentiarum." },
]

[[section]]
id = "achamoth-in-love-with-the-angels-a"
title = "Achamoth in Love with the Angels. A Protest Against the Lascivious Features of Valentinianism. Achamoth Becomes the Mother of Three Natures."
level = 1
blocks = [
  { t = "p", text = "Chapter XVII.—Achamoth in Love with the Angels. A Protest Against the Lascivious Features of Valentinianism. Achamoth Becomes the Mother of Three Natures." },
  { t = "p", text = "Then Achamoth, delivered at length from all her evils, wonderful to tell[^6796] goes on and bears fruit with greater results. For warmed with the joy of so great an escape from her unhappy condition, and at the same time heated with the actual contemplation of the angelic luminaries (one is ashamed) *to use such language*, (but there is no other way of expressing one’s meaning), she during the emotion somehow became personally inflamed with desire[^6797] towards them, and at once grew pregnant with a spiritual conception, at the very image of which the violence of her joyous transport, and the delight of her prurient excitement had imbibed and impressed upon her. She at length gave birth to an offspring, and then there arose a leash of natures,[^6798] from a triad of causes,—one material, arising from her passion; another animal, arising from her conversion; the third spiritual, which had its origin in her imagination." },
  { t = "note", id = "6796", text = "Ecce." },
  { t = "note", id = "6797", text = "Subavit et ipsa." },
  { t = "note", id = "6798", text = "Trinitas generum." },
]

[[section]]
id = "blasphemous-opinion-concerning-the-origin-of-the"
title = "Blasphemous Opinion Concerning the Origin of the Demiurge, Supposed to Be the Creator of the Universe."
level = 1
blocks = [
  { t = "p", text = "Chapter XVIII.—Blasphemous Opinion Concerning the Origin of the Demiurge, Supposed to Be the Creator of the Universe." },
  { t = "p", text = "Having become a better proficient[^6799] in practical conduct by the authority which, we may well suppose,[^6800] accrued to her from her three children, she determined to impart form to each of the natures. The spiritual one however, she was unable to touch, inasmuch as she was herself spiritual. For a participation in the same nature has, to a very great extent,[^6801] disqualified like and consubstantial beings from having superior power over one another. Therefore[^6802] she applies herself solely to the animal nature, adducing the instructions of Soter[^6803] (for her guidance). And first of all (she does) what cannot be described and read, and heard of, without an intense horror at the blasphemy thereof: she produces this God of ours, the God of all except of the heretics, the Father and Creator[^6804] and King of all things, which are inferior to him. For from him do they proceed. If, however, they proceed from him, and not rather from Achamoth, or if only secretly from her, without his perceiving her, he was impelled to all that he did, even like a puppet[^6805] which is moved from the outside. In fact, it was owing to this very ambiguity about the personal agency in the works which were done, that they coined for him the mixed name of (*Motherly Father*),[^6806] whilst his other appellations were distinctly assigned according to the conditions and positions of his works: so that they call him *Father* in relation to the animal substances to which they give the place of honour[^6807] on his right hand; whereas, in respect of the material substances which they banish[^6808] to his left hand, they name him *Demiurgus*; whilst *his title King* designates his authority over both classes, *nay* over the universe.[^6809]" },
  { t = "note", id = "6799", text = "Exercitior." },
  { t = "note", id = "6800", text = "Scilicet." },
  { t = "note", id = "6801", text = "Fere." },
  { t = "note", id = "6802", text = "Eo animo." },
  { t = "note", id = "6803", text = "See above, chap. xvi. p. 512." },
  { t = "note", id = "6804", text = "Demiurgum." },
  { t = "note", id = "6805", text = "Et velut sigillario. “*Sigillarium* est νευρόσπαστον,” Oehler." },
  { t = "note", id = "6806", text = "The Father acting through and proceeding from his Mother." },
  { t = "note", id = "6807", text = "Commendant." },
  { t = "note", id = "6808", text = "Delegant." },
  { t = "note", id = "6809", text = "Communiter in universitatem." },
]

[[section]]
id = "palpable-absurdities-and-contradictions-in-the-system"
title = "Palpable Absurdities and Contradictions in the System Respecting Achamoth and the Demiurge."
level = 1
blocks = [
  { t = "p", text = "Chapter XIX.—Palpable Absurdities and Contradictions in the System Respecting Achamoth and the Demiurge." },
  { t = "p", text = "And yet there is not any agreement between the propriety of the names and that of the works, from which all the names are suggested; since all of them ought to have borne the name of her by whom the things were done, unless after all[^6810] it turn out that they were not made by her. For, although they say that Achamoth devised these forms in honour of the Æons, they yet[^6811] transfer this *work* to Soter as its author, when they say that he[^6812] operated through her, so far as to give her the very image of the invisible and unknown Father—that is, the image which was unknown and invisible to the Demiurge; whilst he[^6813] formed this same Demiurge in imitation[^6814] of Nus the son *of Propator*;[^6815] and whilst the archangels, who were the work of the Demiurge, resembled the other Æons. Now, when I hear of such images of the three, I ask, do you not wish me to laugh at these pictures of their most extravagant painter? At the female Achamoth, a picture of the Father? At the Demiurge, ignorant of his mother, much more so of his father? At the picture of Nus, ignorant of his father too, and the ministering angels, facsimiles of their lords? This is painting a mule from an ass, and sketching Ptolemy from Valentinus." },
  { t = "note", id = "6810", text = "Jam." },
  { t = "note", id = "6811", text = "Rursus." },
  { t = "note", id = "6812", text = "This is the force of the “qui” with the subjunctive verb." },
  { t = "note", id = "6813", text = "Soter." },
  { t = "note", id = "6814", text = "Effingeret." },
  { t = "note", id = "6815", text = "There seems to be a relative gradation meant among these *extra-Pleroma* beings, as there was among the Æons of the Pleroma; and, further, a relation between the two sets of beings—Achamoth bearing a relation to Propator, the Demiurge to Nus, etc." },
]

[[section]]
id = "the-demiurge-works-away-at-creation-as"
title = "The Demiurge Works Away at Creation, as the Drudge of His Mother Achamoth, in Ignorance All the While of the Nature of His Occupation."
level = 1
blocks = [
  { t = "p", text = "Chapter XX—The Demiurge Works Away at Creation, as the Drudge of His Mother Achamoth, in Ignorance All the While of the Nature of His Occupation." },
  { t = "p", text = "The Demiurge therefore, placed as he was without the limits of the Pleroma in the ignominious solitude of his eternal exile, founded a new empire—this world (of ours)—by clearing away the confusion and distinguishing the difference between the two substances which severally constituted it,[^6816] the animal and the material. Out of incorporeal (elements) he constructs bodies, heavy, light, erect[^6817] and stooping, celestial and terrene. He then completes the sevenfold stages of heaven itself, with his own throne above all. Whence he had the additional name of Sabbatum from the hebdomadal nature of his abode; his mother Achamoth, too, had the title Ogdoada, after the precedent of the primeval Ogdoad.[^6818] These heavens, however, they consider to be intelligent,[^6819] and sometimes they make angels of them, as indeed they do of the Demiurge himself; as also (they call) Paradise the fourth archangel, because they fix it above the third heaven, of the power of which Adam partook, when he sojourned there amidst its fleecy clouds[^6820] and shrubs.[^6821] Ptolemy remembered perfectly well the prattle of his boyhood,[^6822] that apples grew in the sea, and fishes on the tree; after the same fashion, he assumed that nut-trees flourished in the skies. The Demiurge does his work in ignorance, and therefore perhaps he is unaware that trees ought to be planted only on the ground. His mother, of course, knew all about it: how is it, then, that she did not suggest the fact, since she was actually executing her own operation? But whilst building up so vast an edifice for her son by means of those works, which proclaim him at once to be father, god and, king before the conceits of the Valentinians, why she refused to let them be known to even him,[^6823] is a question which I shall ask afterwards." },
  { t = "note", id = "6816", text = "Duplicis substantiæ illius disclusæ." },
  { t = "note", id = "6817", text = "Sublimantia." },
  { t = "note", id = "6818", text = "Ogdoadis primogenitalis: what Irenæus calls “the first-begotten and primary Ogdoad of the Pleroma” (See our *Irenæus*, Vol. I.; also above, chap. vii. p. 506.)" },
  { t = "note", id = "6819", text = "Noëros." },
  { t = "note", id = "6820", text = "Nubeculas." },
  { t = "note", id = "6821", text = "Arbusculas." },
  { t = "note", id = "6822", text = "Puerilium dicibulorum." },
  { t = "note", id = "6823", text = "*Sibi* here must refer to the secondary agent of the sentence." },
]

[[section]]
id = "the-vanity-as-well-as-ignorance-of"
title = "The Vanity as Well as Ignorance of the Demiurge. Absurd Results from So Imperfect a Condition."
level = 1
blocks = [
  { t = "p", text = "Chapter XXI.—The Vanity as Well as Ignorance of the Demiurge. Absurd Results from So Imperfect a Condition." },
  { t = "p", text = "Meanwhile you must believe[^6824] that Sophia has the surnames of earth and of Mother—“Mother-Earth,” of course—and (what may excite your laughter still more heartily) even Holy Spirit. In this way they have conferred all honour on that female, I suppose even a beard, not to say other things. Besides,[^6825] the Demiurge had so little mastery over things,[^6826] on the score,[^6827] you must know,[^6828] of his inability to approach spiritual essences, (constituted as he was) of animal elements, that, imagining himself to be the only being, he uttered this soliloquy: “I am God, and beside me there is none else.”[^6829] But for all that, he at least was aware that he had not himself existed before. He understood, therefore, that he had been created, and that there must be a creator of a creature of some sort or other. How happens it, then, that he seemed to himself to be the only being, notwithstanding his uncertainty, and although he had, at any rate, some suspicion of the existence of some creator?" },
  { t = "note", id = "6824", text = "Tenendum." },
  { t = "note", id = "6825", text = "Alioquin." },
  { t = "note", id = "6826", text = "Adeo rerum non erat compos." },
  { t = "note", id = "6827", text = "Censu." },
  { t = "note", id = "6828", text = "Scilicet." },
  { t = "note", id = "6829", text = "Isa. xlv. 5; xlvi. 9." },
]

[[section]]
id = "origin-of-the-devil-in-the-criminal"
title = "Origin of the Devil, in the Criminal Excess of the Sorrow of Achamoth. The Devil, Called Also Munditenens, Actually Wiser Than the Demiurge, Although His Work."
level = 1
blocks = [
  { t = "p", text = "Chapter XXII.—Origin of the Devil, in the Criminal Excess of the Sorrow of Achamoth. The Devil, Called Also Munditenens, Actually Wiser Than the Demiurge, Although His Work." },
  { t = "p", text = "The odium felt amongst them[^6830] against the devil is the more excusable,[^6831] even because the peculiarly sordid character of his origin justifies it.[^6832] For he is supposed by them to have had his origin in that criminal excess[^6833] of her[^6834] sorrow, from which they also derive the birth of the angels, and demons, and all the wicked spirits. Yet they affirm that the devil is the work of the Demiurge, and they call him Munditenens[^6835] (*Ruler of the World*), and maintain that, as he is of a spiritual nature, he has a better knowledge of the things above than the Demiurge, an animal being. He deserves from them the pre-eminence which all heresies provide him with." },
  { t = "note", id = "6830", text = "Infamia apud illos." },
  { t = "note", id = "6831", text = "Tolerabilior." },
  { t = "note", id = "6832", text = "Capit: “capax est,” nimirum “infamiæ” (Fr. Junius)." },
  { t = "note", id = "6833", text = "Ex nequitia." },
  { t = "note", id = "6834", text = "Achamoth’s." },
  { t = "note", id = "6835", text = "Irenæus’ word is Κοσμοκράτωρ; see also Eph. vi. 12." },
]

[[section]]
id = "the-relative-positions-of-the-pleroma-the"
title = "The Relative Positions of the Pleroma. The Region of Achamoth, and the Creation of the Demiurge. The Addition of Fire to the Various Elements and Bodies of Nature."
level = 1
blocks = [
  { t = "p", text = "Chapter XXIII.—The Relative Positions of the Pleroma. The Region of Achamoth, and the Creation of the Demiurge. The Addition of Fire to the Various Elements and Bodies of Nature." },
  { t = "p", text = "Their most eminent powers, moreover, they confine within the following limits, as in a citadel. In the most elevated of all summits presides the tricenary Pleroma,[^6836] Horos marking off its boundary line. Beneath it, Achamoth occupies the intermediate space for her abode,[^6837] treading down her son. For under her comes the Demiurge in his own Hebdomad, or rather the Devil, *sojourning* in this world in common with ourselves, formed, as has been said above, of the same elements and the same body, out of the most profitable calamities of Sophia; inasmuch as, (if it had not been for these,) our spirit would have had no space for inhaling and ejecting[^6838] air—that delicate vest of all corporeal creatures, that revealer of all colours, that instrument of the seasons—if the sadness of Sophia had not filtered it, just as her fear did the animal existence, and her conversion the Demiurge himself. Into all these elements and bodies fire was fanned. Now, since they have not as yet explained to us the original sensation of this[^6839] in Sophia, I will on my own responsibility[^6840] conjecture that its spark was struck out of the delicate emotions[^6841] of her (feverish grief). For you may be quite sure that, amidst all her vexations, she must have had a good deal of fever.[^6842]" },
  { t = "note", id = "6836", text = "Above, in chap. viii., he has mentioned the Pleroma as “the fulness of the thirtyfold divinity.”" },
  { t = "note", id = "6837", text = "Metatur." },
  { t = "note", id = "6838", text = "Reciprocandi." },
  { t = "note", id = "6839", text = "Fire." },
  { t = "note", id = "6840", text = "Ego." },
  { t = "note", id = "6841", text = "Motiunculis." },
  { t = "note", id = "6842", text = "Febricitasse." },
]

[[section]]
id = "the-formation-of-man-by-the-demiurge"
title = "The Formation of Man by the Demiurge. Human Flesh Not Made of the Ground, But of a Nondescript Philosophic Substance."
level = 1
blocks = [
  { t = "p", text = "Chapter XXIV.—The Formation of Man by the Demiurge. Human Flesh Not Made of the Ground, But of a Nondescript Philosophic Substance." },
  { t = "p", text = "Such being their conceits respecting God, or, if you like,[^6843] the gods, of what sort are their figments concerning man? For, after he had made the world, the Demiurge turns his hands to man, and chooses for him as his substance not any portion of “the dry land,” as they say, of which alone we have any knowledge (although it was, at that time, not yet dried by the waters becoming separated from the earthy residuum, and only afterwards became dry), but of the invisible substance of that matter, which philosophy indeed dreams of, from its fluid and fusible composition, the origin of which I am unable to imagine, because it exists nowhere. Now, since fluidity and fusibility are qualities of liquid matter, and since everything liquid flowed from Sophia’s tears, we must, as a necessary conclusion, believe that muddy earth is constituted of Sophia’s eye-rheums and viscid discharges,[^6844] which are just as much the dregs of tears as mud is the sediment of waters. Thus does the Demiurge mould man as a potter does his clay, and animates him with his own breath. Made after his image and likeness, he will therefore be both material and animal. A fourfold being! For in respect of his “image,” he must be deemed clayey,[^6845] that is to say, material, although the Demiurge is not composed of matter; but as to his “likeness,” he is animal, for such, too, is the Demiurge. You have two (of his constituent elements). Moreover, a coating of flesh was, as they allege, afterwards placed over the clayey substratum, and it is this tunic of skin which is susceptible of sensation." },
  { t = "note", id = "6843", text = "Vel." },
  { t = "note", id = "6844", text = "Ex pituitis et gramis." },
  { t = "note", id = "6845", text = "Choicus." },
]

[[section]]
id = "an-extravagant-way-of-accounting-for-the"
title = "An Extravagant Way of Accounting for the Communication of the Spiritual Nature to Man. It Was Furtively Managed by Achamoth, Through the Unconscious Agency of Her Son."
level = 1
blocks = [
  { t = "p", text = "Chapter XXV.—An Extravagant Way of Accounting for the Communication of the Spiritual Nature to Man. It Was Furtively Managed by Achamoth, Through the Unconscious Agency of Her Son." },
  { t = "p", text = "In Achamoth, moreover, there was inherent a certain property of a spiritual germ, of her mother Sophia’s substance; and Achamoth herself had carefully severed off (the same quality), and implanted it in her son the Demiurge, although he was actually unconscious of it. It is for you to imagine[^6846] the industry of this clandestine arrangement. For to this end had she deposited and concealed (this germ), that, whenever the Demiurge came to impart life to Adam by his inbreathing, he might at the same time draw off from the vital principle[^6847] the spiritual seed, and, as by a pipe, inject it into the clayey nature; in order that, being then fecundated in the material body as in a womb, and having fully grown there, it might be found fit for one day receiving the perfect Word.[^6848] When, therefore, the Demiurge commits to Adam the transmission of his own vital principle,[^6849] the spiritual man lay hid, *although* inserted by his breath, and at the same time introduced into the body, because the Demiurge knew no more about his mother’s seed than about herself. To this seed they give the name of Ecclesia (*the Church*), the mirror of the church above, and the perfection[^6850] of man; tracing this *perfection* from Achamoth, just as they do the animal nature from the Demiurge, the clayey material of the body (they derive) from the primordial substance,[^6851] the flesh from Matter. So that you have a new Geryon here, only a fourfold (rather than a threefold) monster." },
  { t = "note", id = "6846", text = "Accipe." },
  { t = "note", id = "6847", text = "Anima derivaret." },
  { t = "note", id = "6848", text = "Sermoni perfecto." },
  { t = "note", id = "6849", text = "Traducem animæ suæ." },
  { t = "note", id = "6850", text = "Censum." },
  { t = "note", id = "6851", text = "Or, the substance of ᾽Αρχή." },
]

[[section]]
id = "the-three-several-natures-the-material-the"
title = "The Three Several Natures--The Material, the Animal, and the Spiritual, and Their Several Destinations. The Strange Valentinian Opinion About the Structure of Soter's Nature."
level = 1
blocks = [
  { t = "p", text = "Chapter XXVI.—The Three Several Natures—The Material, the Animal, and the Spiritual, and Their Several Destinations. The Strange Valentinian Opinion About the Structure of Soter’s Nature." },
  { t = "p", text = "In like manner they assign to each of them a separate end.[^6852] To the material, that is to say the carnal (nature), which they also call “the left-handed,” they assign undoubted destruction; to the animal (nature), which they also call “the right-handed,” a doubtful issue, inasmuch as it oscillates between the material and the spiritual, and is sure to fall at last on the side to which it has mainly gravitated. As regards the spiritual, however, (they say) that it enters into the formation of the animal, in order that it may be educated in company with it and be disciplined by repeated intercourse with it. For the animal (nature) was in want of training even by the senses: for this purpose, accordingly, was the whole structure of the world provided; for this purpose also did Soter (*the Saviour*) present Himself in the world—even for the salvation of the animal (nature). By yet another arrangement they will have it that He, in some prodigious way,[^6853] clothed Himself with the primary portions[^6854] of those substances, the whole of which He was going to restore to salvation; in such wise that He assumed the spiritual nature from Achamoth, whilst He derived the animal (being), Christ, afterwards from the Demiurge; His corporal substance, however, which was constructed of an animal nature (only with wonderful and indescribable skill), He wore for a dispensational purpose, in order that He might, in spite of His own unwillingness,[^6855] be capable of meeting persons, and of being seen and touched by them, and even of dying. But there was nothing material assumed by Him, inasmuch as *that* was incapable of salvation. As if He could possibly have been more required by any others than by those who were in want of salvation! And all this, in order that by severing the condition of our flesh from Christ they may also deprive it of the hope of salvation!" },
  { t = "note", id = "6852", text = "Exitum." },
  { t = "note", id = "6853", text = "Monstruosum illum." },
  { t = "note", id = "6854", text = "Prosicias induisse. Irenæus says, “Assumed the first-fruits,” τὰς ἀπαρχάς." },
  { t = "note", id = "6855", text = "Ingratis." },
]

[[section]]
id = "the-christ-of-the-demiurge-sent-into"
title = "The Christ of the Demiurge, Sent into the World by the Virgin. Not of Her. He Found in Her, Not a Mother, But Only a Passage or Channel. Jesus Descended Upon Christ, at His Baptism, Like a Dove; But, Being Incapable of Suffering, He Left Christ to Die on the Cross Alone."
level = 1
blocks = [
  { t = "p", text = "Chapter XXVII.—The Christ of the Demiurge, Sent into the World by the Virgin. Not of Her. He Found in Her, Not a Mother, But Only a Passage or Channel. Jesus Descended Upon Christ, at His Baptism, Like a Dove; But, Being Incapable of Suffering, He Left Christ to Die on the Cross Alone." },
  { t = "p", text = "I now adduce[^6856] (what they say) concerning Christ, upon whom some of them engraft Jesus with so much licence, that they foist into Him a spiritual seed together with an animal *inflatus*. Indeed, I will not undertake to describe[^6857] these incongruous crammings,[^6858] which they have contrived in relation both to their men and their gods. Even the Demiurge has a Christ of His own—His natural Son. An animal, in short, produced by Himself, proclaimed by the prophets—His position being one which must be decided by prepositions; in other words, He was produced *by means of* a virgin, rather than *of* a virgin! On the ground that, having descended into the virgin rather in the manner of a passage through her than of a birth by her, He came into existence *through* her, not *of* her—not experiencing a mother in her, but nothing more than a way. Upon this same Christ, therefore (so they say), Jesus descended in the sacrament of baptism, in the likeness of a dove. Moreover, there was even in Christ accruing from Achamoth the condiment of a spiritual seed, in order of course to prevent the corruption of all the other stuffing.[^6859] For after the precedent of the principal Tetrad, they guard him with four substances—the spiritual one of Achamoth, the animal one of the Demiurge, the corporeal one, which cannot be described, and that of Soter, or, in other phrase, the columbine.[^6860] As for Soter (*Jesus*), he remained in Christ to the last, impassible, incapable of injury, incapable of apprehension. By and by, when it came to a question of capture, he departed from him during the examination before Pilate. In like manner, his mother’s seed did not admit of being injured, being equally exempt from all manner of outrage,[^6861] and being undiscovered even by the Demiurge himself. The animal and carnal Christ, however, does suffer after the fashion[^6862] of the superior Christ, who, for the purpose of producing Achamoth, had been stretched upon the cross, that is, Horos, in a substantial though not a cognizable[^6863] form. In this manner do they reduce all things to mere images—Christians themselves being indeed nothing but imaginary beings!" },
  { t = "note", id = "6856", text = "Reddo." },
  { t = "note", id = "6857", text = "Nescio quæ." },
  { t = "note", id = "6858", text = "Fartilia." },
  { t = "note", id = "6859", text = "Farsura." },
  { t = "note", id = "6860", text = "That which descended like a dove." },
  { t = "note", id = "6861", text = "Æque insubditivam." },
  { t = "note", id = "6862", text = "In delineationem." },
  { t = "note", id = "6863", text = "Agnitionali." },
]

[[section]]
id = "the-demiurge-cured-of-his-ignorance-by"
title = "The Demiurge Cured of His Ignorance by the Saviour's Advent, from Whom He Hears of the Great Future in Store for Himself."
level = 1
blocks = [
  { t = "p", text = "Chapter XXVIII.—The Demiurge Cured of His Ignorance by the Saviour’s Advent, from Whom He Hears of the Great Future in Store for Himself." },
  { t = "p", text = "Meanwhile the Demiurge, being still ignorant of everything, although he will actually have to make some announcement himself by the prophets, but is quite incapable of even this part of his duty (because they divide authority over the prophets[^6864] between Achamoth, the Seed, and the Demiurge), no sooner heard of the advent of Soter (*Saviour*) than he runs to him with haste and joy, with all his might, like the centurion in the Gospel.[^6865] And being enlightened by him on all points, he learns from him also of his own prospect how that he is to succeed to his mother’s place. Being thenceforth free from all care, he carries on the administration of this world, mainly under the plea of protecting the church, for as long a time as may be necessary and proper." },
  { t = "note", id = "6864", text = "Prophetiale patrocinium." },
  { t = "note", id = "6865", text = "Matt. viii. 5, 6." },
]

[[section]]
id = "the-three-natures-again-adverted-to-they"
title = "The Three Natures Again Adverted to. They are All Exemplified Amongst Men. For Instance, by Cain, and Abel, and Seth."
level = 1
blocks = [
  { t = "p", text = "Chapter XXIX.—The Three Natures Again Adverted to. They are All Exemplified Amongst Men. For Instance, by Cain, and Abel, and Seth." },
  { t = "p", text = "I will now collect from different sources, by way of conclusion, what they affirm concerning the dispensation[^6866] of the whole human race. Having at first stated their views as to *man’s* threefold nature—which was, however, united in one[^6867] in the case of Adam—they then proceed after him to divide it (into three) with their especial characteristics, finding opportunity for such distinction in the posterity of Adam himself, in which occurs a threefold division as to moral differences. Cain and Abel, and Seth, who were in a certain sense the sources of the human race, become the fountain-heads of just as many qualities[^6868] of nature and essential character.[^6869] The material nature,[^6870] which had become reprobate for salvation, they assign to Cain; the animal nature, which was poised between divergent hopes, they find[^6871] in Abel; the spiritual, preordained for certain salvation, they store up[^6872] in Seth. In this way also they make a twofold distinction among souls, as to their property of good and evil—according to the material condition derived from Cain, or the animal from Abel. Men’s spiritual state they derive over and above the other conditions,[^6873] from Seth adventitiously,[^6874] not in the way of nature, but of grace,[^6875] in such wise that Achamoth infuses it[^6876] among superior beings like rain[^6877] into good souls, that is, those who are enrolled in the animal class. Whereas the material class—in other words, those which are bad souls—they say, never receive the blessings of salvation;[^6878] for that nature they have pronounced to be incapable of any change or reform in its natural condition.[^6879] This grain, then, of spiritual seed is modest and very small when cast from her hand, but under her instruction[^6880] increases and advances into full conviction, as we have already said;[^6881] and the souls, on this very account, so much excelled all others, that the Demiurge, even then in his ignorance, held them in great esteem. For it was from their list that he had been accustomed to select men for kings and for priests; and these even now, if they have once attained to a full and complete knowledge of these foolish conceits of theirs,[^6882] since they are already naturalized in the fraternal bond of the spiritual state, will obtain a sure salvation, nay, one which is on all accounts their due." },
  { t = "note", id = "6866", text = "De dispositione." },
  { t = "note", id = "6867", text = "Inunitam." },
  { t = "note", id = "6868", text = "Argumenta." },
  { t = "note", id = "6869", text = "Essentiæ." },
  { t = "note", id = "6870", text = "Choicum: “the clayey.” Having the doubtful issues, which arise from freedom of the will (Oehler)." },
  { t = "note", id = "6871", text = "Recondunt: or, “discover.”" },
  { t = "note", id = "6872", text = "Recondunt: or, “discover.”" },
  { t = "note", id = "6873", text = "Superducunt." },
  { t = "note", id = "6874", text = "De obvenientia." },
  { t = "note", id = "6875", text = "Indulgentiam." },
  { t = "note", id = "6876", text = "The “quos” here relates to “spiritalem statum,” but expressing the *sense* rather than the grammatical propriety, refers to the plural idea of “good souls” (Oehler)." },
  { t = "note", id = "6877", text = "Depluat." },
  { t = "note", id = "6878", text = "Salutaria." },
  { t = "note", id = "6879", text = "We have tried to retain the emphatic repetition, “inreformabilem naturæ naturam.”" },
  { t = "note", id = "6880", text = "Eruditu hujus." },
  { t = "note", id = "6881", text = "Above, in ch. xxv. p. 515." },
  { t = "note", id = "6882", text = "Istarum næniarum." },
]

[[section]]
id = "the-lax-and-dangerous-views-of-this"
title = "The Lax and Dangerous Views of This Sect Respecting Good Works. That These are Unnecessary to the Spiritual Man."
level = 1
blocks = [
  { t = "p", text = "Chapter XXX.—The Lax and Dangerous Views of This Sect Respecting Good Works. That These are Unnecessary to the Spiritual Man." },
  { t = "p", text = "For this reason it is that they neither regard works[^6883] as necessary for themselves, nor do they observe any of the calls of duty, eluding even the necessity of martyrdom on any pretence which may suit their pleasure. For this rule, (they say), is enjoined upon the animal seed, in order that the salvation, which we do not possess by any privilege of our state,[^6884] we may work out by right[^6885] of our conduct. Upon us, who are of an imperfect nature,[^6886] is imprinted the mark of this (animal) seed, because we are reckoned *as sprung* from the loves of Theletus,[^6887] and consequently as an abortion, just as their mother was. But *woe* to us indeed, should we in any point transgress the yoke of discipline, should we grow dull in the works of holiness and justice, should we desire to make our confession anywhere else, I know not where, and not before the powers of this world at the tribunals of the chief magistrates![^6888] As for them, however, they may prove their nobility by the dissoluteness[^6889] of their life and their diligence[^6890] in sin, since Achamoth fawns on them as her own; for she, too, found sin no unprofitable pursuit. Now it is held amongst them, that, for the purpose of honouring the celestial marriages,[^6891] it is necessary to contemplate and celebrate the mystery always by cleaving to a companion, that, is to a woman; otherwise (they account any man) degenerate, and a bastard[^6892] to the truth, who spends his life in the world without loving a woman or uniting himself to her. Then what is to become of the eunuchs whom we see amongst them?" },
  { t = "note", id = "6883", text = "Operationes: the doing of (good) works.”" },
  { t = "note", id = "6884", text = "As, forsooth, we should in the *spiritual* state." },
  { t = "note", id = "6885", text = "Suffragio." },
  { t = "note", id = "6886", text = "Being animal, not spiritual." },
  { t = "note", id = "6887", text = "See above. ch. ix. x. p. 508." },
  { t = "note", id = "6888", text = "See *Scorpiace*, ch. x. *infra*." },
  { t = "note", id = "6889", text = "Passivitate." },
  { t = "note", id = "6890", text = "“Diligentia” may mean “proclivity” (Rigalt.)." },
  { t = "note", id = "6891", text = "Of the Æons." },
  { t = "note", id = "6892", text = "Nec legitimum: “not a lawful son.”" },
]

[[section]]
id = "at-the-last-day-great-changes-take"
title = "At the Last Day Great Changes Take Place Amongst the Æons as Well as Among Men. How Achamoth and the Demiurge are Affected Then. Irony on the Subject."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXI.—At the Last Day Great Changes Take Place Amongst the Æons as Well as Among Men. How Achamoth and the Demiurge are Affected Then. Irony on the Subject." },
  { t = "p", text = "It remains that we say something about the end of the world,[^6893] and the dispensing of reward. As soon as Achamoth has completed the full harvest of her seed, and has then proceeded to gather it into her garner, or, after it has been taken to the mill and ground to flour, has hidden it in the kneading-trough with yeast until the whole be leavened, then shall the end speedily come.[^6894] Then, to begin with, Achamoth herself removes from the middle region,[^6895] from the second stage to the highest, since she is restored to the Pleroma: she is immediately received by that paragon of perfection[^6896] Soter, as her spouse of course, and they two afterwards consummate[^6897] new nuptials. This must be the spouse of the Scripture,[^6898] the Pleroma of espousals (for you might suppose that the Julian laws[^6899] were interposing, since there are these migrations from place to place). In like manner, the Demiurge, too, will then change the scene of his abode from the celestial Hebdomad[^6900] to the higher regions, to his mother’s now vacant saloon[^6901]—by this time knowing her, without however seeing her. (A happy coincidence!) For if he had caught a glance of her, he would have preferred never to have known her." },
  { t = "note", id = "6893", text = "De consummatione." },
  { t = "note", id = "6894", text = "Urgebit." },
  { t = "note", id = "6895", text = "See above, ch. xxiii. p. 514." },
  { t = "note", id = "6896", text = "Compacticius ille." },
  { t = "note", id = "6897", text = "Fient." },
  { t = "note", id = "6898", text = "Query, the Holy Scriptures, or the writings of the Valentinians?" },
  { t = "note", id = "6899", text = "Very severe against adultery, and even against celibacy." },
  { t = "note", id = "6900", text = "In ch. xx. this “scenam de Hebdomade cælesti” is called “cælorum septemplicem scenam” =\"the sevenfold stage of heaven.”" },
  { t = "note", id = "6901", text = "Cœnaculum. See above, ch. vii. p. 506." },
]

[[section]]
id = "indignant-irony-exposing-the-valentinian-fable-about"
title = "Indignant Irony Exposing the Valentinian Fable About the Judicial Treatment of Mankind at the Last Judgment. The Immorality of the Doctrine."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXII.—Indignant Irony Exposing the Valentinian Fable About the Judicial Treatment of Mankind at the Last Judgment. The Immorality of the Doctrine." },
  { t = "p", text = "As for the human race, its end will be to the following effect:—To all which bear the earthy[^6902] and material mark there accrues an entire destruction, because “all flesh is grass,”[^6903] and amongst these is the soul of mortal man, except when it has found salvation by faith. The souls of just men, that is to say, our souls, will be conveyed to the Demiurge in the abodes of the middle region. We are duly thankful; we shall be content to be classed with our god, in whom lies our own origin.[^6904] Into the palace of the Pleroma nothing of the animal nature is admitted—nothing but the spiritual swarm of Valentinus. There, then, the first process is the despoiling of men themselves, that is, men within the Pleroma.[^6905] Now this despoiling consists of the putting off of the souls in which they appear to be clothed, which they will give back to their Demiurge as they had obtained[^6906] them from him. They will then become wholly intellectual spirits—impalpable,[^6907] invisible[^6908]—and in this state will be readmitted invisibly to the Pleroma—stealthily, if the case admits of the idea.[^6909] What then? They will be dispersed amongst the angels, the attendants on Soter. As sons, do you suppose? Not at all. As servants, then? No, not even so. Well, as phantoms? Would that it were nothing more! Then in what capacity, if you are ashamed to tell us? In the capacity of brides. Then will they end[^6910] their Sabine rapes with the sanction of wedlock. This will be the guerdon of the spiritual, this the recompense of their faith! Such fables have their use. Although but a Marcus or a Gaius,[^6911] full-grown in this flesh of ours, with a beard and such like proofs (of virility,) it may be a stern husband, a father, a grandfather, a great-grandfather (never mind what, in fact, if only a male), you may perhaps in the bridal-chamber of the Pleroma—I have already said so tacitly[^6912]—even become the parent by an angel of some Æon of high numerical rank.[^6913] For the right celebration of these nuptials, instead of the torch and veil, I suppose that secret fire is then to burst forth, which, after devastating the whole existence of things, will itself also be reduced to nothing at last, after everything has been reduced to ashes; and so their fable too will be ended.[^6914] But I, too, am no doubt a rash man, in having exposed so great a mystery in so derisive a way: I ought to be afraid that Achamoth, who did not choose to make herself known even to her own son, would turn mad, that Theletus would be enraged, that Fortune[^6915] would be irritated. But I am yet a liege-man of the Demiurge. I have to return after death to the place where there is no more giving in marriage, where I have to be clothed upon rather than to be despoiled,—where, even if I am despoiled of my sex, I am classed with angels—not a male angel, nor a female one. There will be no one to do aught against me, nor will they then find any male energy in me." },
  { t = "note", id = "6902", text = "Choicæ: “clayey.”" },
  { t = "note", id = "6903", text = "Isa. xl. 6." },
  { t = "note", id = "6904", text = "See above, in ch. xxiv. p. 515." },
  { t = "note", id = "6905", text = "Interiores." },
  { t = "note", id = "6906", text = "Averterant." },
  { t = "note", id = "6907", text = "Neque detentui obnoxii." },
  { t = "note", id = "6908", text = "Neque conspectui obnoxii." },
  { t = "note", id = "6909", text = "Si ita est: or, “since such is the fact.”" },
  { t = "note", id = "6910", text = "Claudent." },
  { t = "note", id = "6911", text = "But slaves, in fact." },
  { t = "note", id = "6912", text = "This parenthetic clause, “tacendo jam dixi,” perhaps means, “I say this with shame,” “I would rather not have to say it.”" },
  { t = "note", id = "6913", text = "The common reading is, “Onesimum Æonem,” an Æon called Onesimus, in supposed allusion to Philemon’s Onesimus. But this is too far-fetched. Oehler discovers in “Onesimum” the corruption of some higher number ending in “esimum.”" },
  { t = "note", id = "6914", text = "This is Oehler’s idea of “et nulla jam fabula.” Rigaltius, however, gives a good sense to this clause: “All will come true at last; there will be no fable.”" },
  { t = "note", id = "6915", text = "The same as *Macariotes*, in ch. viii. above, p. 507." },
]

[[section]]
id = "these-remaining-chapters-an-appendix-to-the"
title = "These Remaining Chapters an Appendix to the Main Work. In This Chapter Tertullian Notices a Difference Among Sundry Followers of Ptolemy, a Disciple of Valentinus."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXIII.—These Remaining Chapters an Appendix to the Main Work. In This Chapter Tertullian Notices a Difference Among Sundry Followers of Ptolemy, a Disciple of Valentinus." },
  { t = "p", text = "I shall now at last produce, by way of *finale*,[^6916] after so long a story, those points which, not to interrupt the course of it, and by the interruption distract the reader’s attention, I have preferred reserving to this place. They have been variously advanced by those who have improved on[^6917] the doctrines of Ptolemy. For there have been in his school “disciples above their master,” who have attributed to their Bythus two wives—Cogitatio (*Thought*) and Voluntas (*Will*). For Cogitatio alone was not sufficient wherewith to produce any offspring, although from the two wives procreation was most easy to him. The former bore him Monogenes (*Only-Begotten*) and Veritas (*Truth*). Veritas was a female after the likeness of Cogitatio; Monogenes a male bearing a resemblance to Voluntas. For it is the strength of Voluntas which procures the masculine nature,[^6918] inasmuch as she affords efficiency to Cogitatio." },
  { t = "note", id = "6916", text = "Velut epicitharisma." },
  { t = "note", id = "6917", text = "Emendatoribus." },
  { t = "note", id = "6918", text = "Censum." },
]

[[section]]
id = "other-varying-opinions-among-the-valentinians-respecting"
title = "Other Varying Opinions Among the Valentinians Respecting the Deity, Characteristic Raillery."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXIV.—Other Varying Opinions Among the Valentinians Respecting the Deity, Characteristic Raillery." },
  { t = "p", text = "Others of purer mind, mindful of the honour of the Deity, have, for the purpose of freeing him from the discredit of even single wedlock, preferred assigning no sex whatever to Bythus; and therefore very likely they talk of “this deity” in the neuter gender rather than “this god.” Others again, on the other hand, speak of him as both masculine and feminine, so that the worthy chronicler Fenestella must not suppose that an hermaphrodite was only to be found among the good people of Luna." },
]

[[section]]
id = "yet-more-discrepancies-just-now-the-sex"
title = "Yet More Discrepancies. Just Now the Sex of Bythus Was an Object of Dispute; Now His Rank Comes in Question. Absurd Substitutes for Bythus Criticised by Tertullian."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXV.—Yet More Discrepancies. Just Now the Sex of Bythus Was an Object of Dispute; Now His Rank Comes in Question. Absurd Substitutes for Bythus Criticised by Tertullian." },
  { t = "p", text = "There are some who do not claim the first place for Bythus, but only a lower one. They put their Ogdoad in the foremost rank; itself, however, derived from a Tetrad, but under different names. For they put Pro-arche (*Before the Beginning*) first, Anennœtos (*Inconceivable*) second, Arrhetos (*Indescribable*) third, Aoratos (*Invisible*) fourth. Then after Pro-arche they say Arche (*Beginning*) came forth and occupied the first and the fifth place; from Anennœtos came Acataleptos (*Incomprehensible*) in the second and the sixth place; from Arrhetos came Anonomastos (*Nameless*) in the third and the seventh place; from Aoratos[^6919] came Agennetos (*Unbegotten*) in the fourth and the eight place. Now by what method he arranges this, that each of these Æons should be born in two places, and that, too, at such intervals, I prefer to be ignorant of than to be informed. For what can be right in a system which is propounded with such absurd particulars?" },
  { t = "note", id = "6919", text = "Tertullian, however, here gives the Latin synonyme, *Invisibilis*." },
]

[[section]]
id = "less-reprehensible-theories-in-the-heresy-bad"
title = "Less Reprehensible Theories in the Heresy. Bad is the Best of Valentinianism."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXVI.—Less Reprehensible Theories in the Heresy. Bad is the Best of Valentinianism." },
  { t = "p", text = "How much more sensible are they who, rejecting all this tiresome nonsense, have refused to believe that any one Æon has descended from another by steps like these, which are really neither more nor less *Gemonian*;[^6920] but that on a given signal[^6921] the eight-fold emanation, of which we have heard,[^6922] issued all at once from the Father and His Ennœa (*Thought*),[^6923]—that it is, in fact, from His mere motion that they gain their designations. When, as they say, He thought of producing offspring, He on that account gained the name of Father. After producing, because the issue which He produced was true, He received the name of *Truth*. When He wanted Himself to be manifested, He on that account was announced as *Man*. Those, moreover, whom He preconceived in His thought when He produced them, were then designated *the Church*. As man, He uttered His *Word*; and so this *Word* is His first-begotten Son, and to the Word was added *Life*. And by this process the first Ogdoad was completed. However, the whole of this tiresome story is utterly poor and weak." },
  { t = "note", id = "6920", text = "The “Gemonian steps” on the Aventine led to the Tiber, to which the bodies of executed criminals were dragged by hooks, to be cast into the river." },
  { t = "note", id = "6921", text = "Mappa, quod aiunt, missa: a proverbial expression." },
  { t = "note", id = "6922", text = "Istam." },
  { t = "note", id = "6923", text = "See above, ch. vii. p. 506." },
]

[[section]]
id = "other-turgid-and-ridiculous-theories-about-the"
title = "Other Turgid and Ridiculous Theories About the Origin of the Æons and Creation, Stated and Condemned."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXVII.—Other Turgid and Ridiculous Theories About the Origin of the Æons and Creation, Stated and Condemned." },
  { t = "p", text = "Now listen to some other buffooneries[^6924] of a master who is a great swell among them,[^6925] and who has pronounced his *dicta* with an even priestly authority. They run thus: There comes, says he, before all things Pro-arche, the inconceivable, and indescribable, and nameless, which I for my own part call Monotes (*Solitude*). With this was associated another power, to which also I give the name of Henotes (*Unity*). Now, inasmuch as Monotes and Henotes—that is to say, Solitude and Union—were only one being, they produced, and yet not in the way of production,[^6926] the intellectual, innascible, invisible beginning of all things, which human language[^6927] has called Monad (*Solitude*).[^6928] This has inherent in itself a consubstantial force, which it calls Unity[^6929] These powers, accordingly, Solitude or Solitariness, *and* Unity, or Union, propagated all the other emanations of Æons.[^6930] Wonderful distinction, to be sure! Whatever change Union and Unity may undergo, Solitariness and Solitude is profoundly supreme. Whatever designation you give the power, it is one and the same." },
  { t = "note", id = "6924", text = "Oehler gives good reasons for the reading “ingenia circulatoria,” instead of the various readings of other editors." },
  { t = "note", id = "6925", text = "Insignioris apud eos magistri." },
  { t = "note", id = "6926", text = "Non proferentes. Another reading is “non proserentes” (not generating)." },
  { t = "note", id = "6927", text = "Sermo." },
  { t = "note", id = "6928", text = "Or, solitariness." },
  { t = "note", id = "6929", text = "Or, Union." },
  { t = "note", id = "6930", text = "Compare our Irenæus, I. 2, 3. [Vol. I. p. 316.]" },
]

[[section]]
id = "diversity-in-the-opinions-of-secundus-as"
title = "Diversity in the Opinions of Secundus, as Compared with the General Doctrine of Valentinus."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXVIII.—Diversity in the Opinions of Secundus, as Compared with the General Doctrine of Valentinus." },
  { t = "p", text = "Secundus is a trifle more human, as he is briefer: he divides the Ogdoad into a pair of Tetrads, a right hand one and a left hand one, *one* light and *the other* darkness. Only he is unwilling to derive the power which apostatized and fell away[^6931] from any one of the Æons, but from the fruits which issued from their substance." },
  { t = "note", id = "6931", text = "Achamoth." },
]

[[section]]
id = "their-diversity-of-sentiment-affects-the-very"
title = "Their Diversity of Sentiment Affects the Very Central Doctrine of Christianity, Even the Person and Character of the Lord Jesus. This Diversity Vitiates Every Gnostic School."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXIX.—Their Diversity of Sentiment Affects the Very Central Doctrine of Christianity, Even the Person and Character of the Lord Jesus. This Diversity Vitiates Every Gnostic School." },
  { t = "p", text = "Now, concerning even the Lord Jesus, into how great a diversity of opinion are they divided! One party form Him of the blossoms of all the Æons.[^6932] Another party will have it that He is made up only of those ten whom *the Word* and *the Life*[^6933] produced;[^6934] from which circumstance the titles of the Word and the Life were suitably transferred to Him. Others, again, that He rather sprang from the twelve, the offspring of *Man* and *the Church*,[^6935] and therefore, they say, He was designated “Son of man.” Others, moreover, maintain that He was formed by *Christ* and *the Holy Spirit*, who have to provide for the establishment of the universe,[^6936] and that He inherits by right His Father’s appellation. Some there are who have imagined that another origin must be found for the title “Son of man;” for they have had the presumption to call the Father Himself *Man*, by reason of the profound mystery of this title: so that what can you hope for more ample concerning faith in that God, with whom you are now yourself on a par? Such conceits are constantly cropping out[^6937] amongst them, from the redundance of their mother’s seed.[^6938] And so it happens that the doctrines which have grown up amongst the Valentinians have already extended their rank growth to the woods of the Gnostics." },
  { t = "note", id = "6932", text = "See above, ch. xii. p. 510." },
  { t = "note", id = "6933", text = "The Æons *Sermo* and *Vita*." },
  { t = "note", id = "6934", text = "See above, ch. vii. p. 506." },
  { t = "note", id = "6935", text = "See above, ch. viii. p. 507." },
  { t = "note", id = "6936", text = "See above, ch. xiv. p. 511." },
  { t = "note", id = "6937", text = "Superfruticant." },
  { t = "note", id = "6938", text = "Archamoth is referred to." },
]

  { t = "note", id = "1460", text = "The reading which Oehler follows, and which seems to have the best authority, is “verissimus sacerdos Patris, Christus Ipsius,” as in the text. But Rig., whose judgment is generally very sound, prefers, with some others, to read, “verus summus sacerdos Patris Christus Jesus;” which agrees better with the previous allusion to “the mystery of His name withal:” comp. c. ix. above, towards the end." },
  { t = "note", id = "1461", text = "See Zech. iii. “The mystery of His name” refers to the meaning of “Jeshua,” for which see c. ix. above." },
  { t = "note", id = "1462", text = "Comp. John vi. 70 and xiii. 2 (especially in Greek, where the word διάβολος is used in each case)." },
  { t = "note", id = "1463", text = "Or “Josedech,” as Tertullian here writes, and as we find in Hag. i. 1, 12; ii. 2, 4; Zech. vi. 11, and in the LXX." },
  { t = "note", id = "1464", text = "Or, “Jeshua.”" },

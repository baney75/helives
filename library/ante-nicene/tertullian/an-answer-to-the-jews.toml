  { t = "note", id = "1468", text = "Comp. Heb. xiii. 10–13. It is to be noted, however, that all this spitting, etc., formed no part of the divinely ordained ceremony." },
  { t = "note", id = "1469", text = "This appears to be an error. See Lev. vi. 30." },
  { t = "note", id = "1470", text = "Unless Oehler’s “fruerentur” is an error for “fruentur” =\"will enjoy.”" },
  { t = "p", text = "Therefore, since the vaticinations of the first advent obscured it with manifold figures, and debased it with every dishonour, while the second (was foretold as) manifest and wholly worthy of God, it has resulted therefrom, that, by fixing their gaze on that one alone which they could easily understand and believe (that is, the second, which is in honour and glory), they have been (not undeservedly) deceived as to the more obscure—at all events, the more unworthy—that is, the first. And thus to the present moment they affirm that their Christ is not come, because He is not come in majesty; while they are ignorant of[^1471] the fact that He was first to come in humility." },
  { t = "note", id = "1471", text = "Or, “ignore.”" },
  { t = "p", text = "Enough it is, meantime, to have thus far followed the stream downward of the order of Christ’s course, whereby He is proved such as He was habitually announced: in order that, as a result of this harmony of the Divine Scriptures, we may understand; and that the events which used to be predicted as destined to take place after Christ may be believed to have been accomplished as the result of a divine arrangement. For unless He come *after* whom they had to be accomplished, by no means would the events, the future occurrence whereof was predictively assigned to His advent, have come to pass. Therefore, if you see universal nations thenceforth emerging from the profundity of human error to God the Creator and His Christ (which you dare not assert to have not been prophesied, because, albeit you were so to assert, there would forthwith—as we have already premised[^1472]—occur to you the promise of the Father saying, “My Son art Thou; I this day have begotten Thee; ask of Me, and I will give Thee Gentiles *as* Thine heritage, and *as* Thy possession the boundaries of the earth.” Nor will you be able to vindicate, as the subject of that prediction, rather the son of David, Solomon, than Christ, God’s Son; nor “the boundaries of the earth,” as promised rather to David’s son, who reigned within the single land of Judea, than to Christ the Son of God, who has already illumined the whole world[^1473] with the rays of His gospel. In short, again, a throne “unto the age”[^1474] is more suitable to Christ, God’s Son, than to Solomon,—a temporal king, to wit, who reigned over Israel alone. For at the present day nations are invoking Christ which used not to know Him; and peoples at the present day are fleeing in a body to the Christ of whom in days bygone they were ignorant[^1475]), you cannot contend that is future which you see taking place.[^1476] Either deny that these events were prophesied, while they are seen before your eyes; or else have been fulfilled, while you hear them read: or, on the other hand, if you fail to deny each position, they will have their fulfilment in Him with respect to whom they were prophesied." },
  { t = "note", id = "1472", text = "See cc. xi. xii. above." },
  { t = "note", id = "1473", text = "Orbem." },
  { t = "note", id = "1474", text = "Or, “unto eternity.” Comp. 2 Sam. (2 Kings in LXX.) vii. 13; 1 Chron. xvii. 12; Ps. lxxxix. 3, 4, 29, 35, 36, 37 (in LXX. Ps. lxxxviii. 4, 5, 30, 36, 37, 38)." },
  { t = "note", id = "1475", text = "See Isa. lv. 5 (especially in the LXX)." },
  { t = "note", id = "1476", text = "Oehler’s pointing is discarded. The whole passage, from “which you dare not assert” down to “ignorant,” appears to be parenthetical; and I have therefore marked it as such." },

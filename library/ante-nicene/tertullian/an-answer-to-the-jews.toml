[[section]]
id = "of-the-observance-of-the-sabbath"
title = "Of the Observance of the Sabbath."
level = 1
blocks = [
  { t = "p", text = "Chapter IV.—Of the Observance of the Sabbath." },
  { t = "p", text = "It follows, accordingly, that, in so far as the abolition of carnal circumcision and of the old law is demonstrated as having been consummated at its specific times, so also the observance of the Sabbath is demonstrated to have been temporary." },
  { t = "p", text = "For the Jews say, that from the beginning God sanctified the seventh day, by resting on it from all His works which He made; and that thence it was, likewise, that Moses said to the People: “Remember the day of the sabbaths, to sanctify it: every servile work ye shall not do therein, except what pertaineth unto life.”[^1187] Whence we (Christians) understand that *we* still more ought to observe a sabbath from all “servile work”[^1188] always, and not only every seventh day, but through all time. And through this arises the question for us, *what* sabbath God willed us to keep? For the Scriptures point to a sabbath eternal and a sabbath temporal. For Isaiah the prophet says, “*Your* sabbaths my soul hateth;”[^1189] and in another place he says, “*My* sabbaths ye have profaned.”[^1190] Whence we discern that the temporal sabbath is human, and the eternal sabbath is accounted divine; concerning which He predicts through Isaiah: “And there shall be,” He says, “month after month, and day after day, and sabbath after sabbath; and all flesh shall come to adore in Jerusalem, saith the Lord;”[^1191] which we understand to have been fulfilled in the times of Christ, when “all flesh”—that is, every nation—“came to adore in Jerusalem” God the Father, through Jesus Christ His Son, as was predicted through the prophet: “Behold, proselytes through me shall go unto Thee.”[^1192] Thus, therefore, before this temporal sabbath, there was withal an eternal sabbath foreshown and foretold; just as before the carnal circumcision there was withal a spiritual circumcision foreshown. In short, let them teach us, as we have already premised, that Adam observed the sabbath; or that Abel, when offering to God a holy victim, pleased Him by a religious reverence for the sabbath; or that Enoch, when translated, had been a keeper of the sabbath; or that Noah the ark-builder observed, on account of the deluge, an immense sabbath; or that Abraham, in observance of the sabbath, offered Isaac his son; or that Melchizedek in his priesthood received the law of the sabbath." },
  { t = "note", id = "1187", text = "Comp. Gal. v. 1; iv. 8, 9." },
  { t = "note", id = "1188", text = "See Ex. xx. 8–11 and xii. 16 (especially in the LXX.)." },
  { t = "note", id = "1189", text = "Isa. i. 13." },
  { t = "note", id = "1190", text = "This is not said by Isaiah; it is found in substance in Ezek. xxii. 8." },
  { t = "note", id = "1191", text = "Isa. lxvi. 23 in LXX." },
  { t = "note", id = "1192", text = "I am not acquainted with any such passage. Oehler refers to Isa. xlix. in his margin, but gives no verse, and omits to notice this passage of the present treatise in his index." },
  { t = "p", text = "But the Jews are sure to say, that ever since this precept was given through Moses, the observance has been binding. Manifest accordingly it is, that the precept was not eternal nor spiritual, but temporary,[^1193] which would one day cease. In short, so true is it that it is not in the exemption from work of the sabbath—that is, of the seventh day—that the celebration of this solemnity is to consist, that Joshua the son of Nun, at the time that he was reducing the city Jericho by war, stated that he had received from God a precept to order the People that priests should carry the ark of the testament of God seven days, making the circuit of the city; and thus, when the seventh day’s circuit had been performed, the walls of the city would spontaneously fall.[^1194] Which was so done; and when the space of the seventh day was finished, just as was predicted, down fell the walls of the city. Whence it is manifestly shown, that in the number of the seven days there intervened a sabbath-day. For seven days, whencesoever they may have commenced, must necessarily include within them a sabbath-day; on which day not only must the priests have worked, but the city must have been made a prey by the edge of the sword by all the people of Israel. Nor is it doubtful that they “wrought servile work,” when, in obedience to God’s precept, they drave the preys of war. For in the times of the Maccabees, too, they did bravely in fighting on the sabbaths, and routed their foreign foes, and recalled the law of their fathers to the primitive style of life by fighting on the sabbaths.[^1195] Nor should I think it was any other law which they thus vindicated, than the one in which they remembered the existence of the prescript touching “the day of the sabbaths.”[^1196]" },
  { t = "note", id = "1193", text = "Or, “temporal.”" },
  { t = "note", id = "1194", text = "Josh. vi. 1–20." },
  { t = "note", id = "1195", text = "See 1 Macc. ii. 41, etc." },
  { t = "note", id = "1196", text = "See Ex. xx. 8; Deut. v. 12, 15: in LXX." },
  { t = "p", text = "Whence it is manifest that the force of such precepts was temporary, and respected the necessity of present circumstances; and that it was not with a view to its observance in perpetuity that God formerly gave them such a law." },
]

[[section]]
id = "of-sacrifices"
title = "Of Sacrifices."
level = 1
blocks = [
  { t = "p", text = "Chapter V.—Of Sacrifices." },
  { t = "p", text = "So, again, we show that sacrifices of earthly oblations and of spiritual sacrifices[^1197] were predicted; and, moreover, that from the beginning the earthly were foreshown, in the person of Cain, to be those of the “elder son,” that is, of Israel; and the opposite sacrifices demonstrated to be those of the “younger son,” Abel, that is, of *our* people. For the elder, Cain, offered gifts to God from the fruit of the earth; but the younger son, Abel, from the fruit of his ewes. “God had respect unto Abel, and unto his gifts; but unto Cain and unto his gifts He had not respect. And God said unto Cain, Why is thy countenance fallen? hast thou not—if thou offerest indeed aright, but dost not divide aright—sinned? Hold thy peace. For unto thee shalt thy conversion be and he shall lord it over thee. And then Cain said unto Abel his brother, Let us go into the field: and he went away with him thither, and he slew him. And then God said unto Cain, Where is Abel thy brother? And he said, I know not: am I my brother’s keeper? To whom God said, The voice of the blood of thy brother crieth forth unto me from the earth. Wherefore cursed is the earth, which hath opened her mouth to receive the blood of thy brother. Groaning and trembling shalt thou be upon the earth, and every one who shall have found thee shall slay thee.”[^1198] From this proceeding we gather that the twofold sacrifices of “the peoples” were even from the very beginning foreshown. In short, when the sacerdotal law was being drawn up, through Moses, in Leviticus, we find it prescribed to the people of Israel that sacrifices should in no other place be offered to God than in the land of promise; which the Lord God was about to give to “the people” Israel and to their brethren, in order that, on Israel’s introduction thither, there should there be celebrated sacrifices and holocausts, as well for sins as for souls; and nowhere else but in the holy land.[^1199] Why, accordingly, does the Spirit afterwards predict, through the prophets, that it should come to pass that in every place and in every land there should be offered sacrifices to God? as He says through the angel Malachi, one of the twelve prophets: “I will not receive sacrifice from your hands; for from the rising sun unto the setting my Name hath been made famous among all the nations, saith the Lord Almighty: and in every place they offer clean sacrifices to my Name.”[^1200] Again, in the Psalms, David says: “Bring to God, ye countries of the nations”—undoubtedly because “unto every land” the preaching of the apostles had to “go out”[^1201]—“bring to God fame and honour; bring to God the sacrifices of His name: take up[^1202] victims and enter into His courts.”[^1203] For that it is not by earthly sacrifices, but by spiritual, that offering is to be made to God, we thus read, as it is written, An heart contribulate and humbled is a victim for God;”[^1204] and elsewhere, “Sacrifice to God a sacrifice of praise, and render to the Highest thy vows.”[^1205] Thus, accordingly, the spiritual “sacrifices of praise” are pointed to, and “an heart contribulate” is demonstrated an acceptable sacrifice to God. And thus, as carnal sacrifices are understood to be reprobated—of which Isaiah withal speaks, saying, “To what end is the multitude of your sacrifices to me? saith the Lord”[^1206]—so spiritual sacrifices are predicted[^1207] as accepted, as the prophets announce. For, “even if ye shall have brought me,” He says, “the finest wheat flour, it is a vain supplicatory gift: a thing execrable to me;” and again He says, “Your holocausts and sacrifices, and the fat of goats, and blood of bulls, I will not, not even if ye come to be seen by me: for who hath required these things from your hands?”[^1208] for “from the rising sun unto the setting, my Name hath been made famous among all the nations, saith the Lord.”[^1209] But of the spiritual sacrifices He adds, saying, “And in every place they offer clean sacrifices to my Name, saith the Lord.”[^1210]" },
  { t = "note", id = "1197", text = "This tautology is due to the author, not to the translator: “sacrificia…spiritalium sacrificiorum.”" },
  { t = "note", id = "1198", text = "See Gen. iv. 2–14. But it is to be observed that the version given in our author differs widely in some particulars from the Heb. and the LXX." },
  { t = "note", id = "1199", text = "See Lev. xvii. 1–9; Deut. xii. 1–26." },
  { t = "note", id = "1200", text = "See Mal. i. 10, 11, in LXX." },
  { t = "note", id = "1201", text = "Comp. Matt. xxviii. 19, 20, Mark xvi. 15, 16, Luke xxiv. 45–48, with Ps. xix. 4 (xviii. 5 in LXX.), as explained in Rom. x. 18." },
  { t = "note", id = "1202", text = "Tollite = Gr. ἄρατε. Perhaps =\"away with.”" },
  { t = "note", id = "1203", text = "See Ps. xcvi. (xcv. in LXX.) 7, 8; and comp. xxix. (xxviii. in LXX.) 1, 2." },
  { t = "note", id = "1204", text = "See Ps. li. 17 (in LXX. l. 19)." },
  { t = "note", id = "1205", text = "Ps. l. (xlix. in LXX.) 14." },
  { t = "note", id = "1206", text = "Isa. i. 11." },
  { t = "note", id = "1207", text = "Or, “foretold.”" },
  { t = "note", id = "1208", text = "Comp. Isa. i. 11–14, especially in the LXX." },
  { t = "note", id = "1209", text = "See Mal. i. as above." },
  { t = "note", id = "1210", text = "See Mal. i. as above." },
]

[[section]]
id = "of-the-abolition-and-the-abolisher-of"
title = "Of the Abolition and the Abolisher of the Old Law."
level = 1
blocks = [
  { t = "p", text = "Chapter VI.—Of the Abolition and the Abolisher of the Old Law." },
  { t = "p", text = "Therefore, since it is manifest that a sabbath temporal was shown, and a sabbath eternal foretold; a circumcision carnal foretold, and a circumcision spiritual pre-indicated; a law temporal and a law eternal formally declared; sacrifices carnal and sacrifices spiritual foreshown; it follows that, after all these precepts had been given carnally, in time preceding, to the people Israel, there was to supervene a time whereat the precepts of the ancient Law and of the old ceremonies would cease, and the promise[^1211] of the new law, and the recognition of spiritual sacrifices, and the promise of the New Testament, supervene;[^1212] while the light from on high would beam upon us who were sitting in darkness, and were being detained in the shadow of death.[^1213] And so there is incumbent on us a necessity[^1214] binding us, since we have premised that a new law was predicted by the prophets, and that not such as had been already given to their fathers at the time when He led them forth from the land of Egypt,[^1215] to show and prove, on the one hand, that that old Law has ceased, and on the other, that the promised new law is now in operation." },
  { t = "note", id = "1211", text = "Or, “sending forth”—promissio." },
  { t = "note", id = "1212", text = "The tautology is again due to the author." },
  { t = "note", id = "1213", text = "Comp. Luke i. 78, 79, Isa. ix. 1, 2, with Matt. iv. 12–16." },
  { t = "note", id = "1214", text = "Comp. 1 Cor. ix. 16." },
  { t = "note", id = "1215", text = "See ch. iii. above." },
  { t = "p", text = "And, indeed, first we must inquire whether there be expected a giver of the new law, and an heir of the new testament, and a priest of the new sacrifices, and a purger of the new circumcision, and an observer of the eternal sabbath, to suppress the old law, and institute the new testament, and offer the new sacrifices, and repress the ancient ceremonies, and suppress[^1216] the old circumcision together with its own sabbath,[^1217] and announce the new kingdom which is not corruptible. Inquire, I say, we must, whether this giver of the new law, observer of the spiritual sabbath, priest of the eternal sacrifices, eternal ruler of the eternal kingdom, be come or no: that, if he is already come, service may have to be rendered him; if he is not yet come, he may have to be awaited, until by his advent it be manifest that the old Law’s precepts are suppressed, and that the beginnings of the new law ought to arise. And, primarily, we must lay it down that the ancient Law and the prophets could not have ceased, unless He were come who was constantly announced, through the same Law and through the same prophets, as to come." },
  { t = "note", id = "1216", text = "Here again the repetition is the author’s." },
  { t = "note", id = "1217", text = "Cum suo sibi sabbato. Unless the meaning be—which the context seems to forbid—“together with a sabbath of His own:” the Latinity is plainly incorrect." },
]

[[section]]
id = "the-question-whether-christ-be-come-taken"
title = "The Question Whether Christ Be Come Taken Up."
level = 1
blocks = [
  { t = "p", text = "Chapter VII.—The Question Whether Christ Be Come Taken Up." },
  { t = "p", text = "Therefore upon this issue plant we foot to foot, whether the Christ who was constantly announced as to come be already come, or whether His coming be yet a subject of hope. For proof of which question itself, the times likewise must be examined by us when the prophets announced that the Christ would come; that, if we succeed in recognising that He has come within the limits of those times, we may without doubt believe Him to be the very one whose future coming was ever the theme of prophetic song, upon whom *we*—the nations, to wit—were ever announced as destined to believe; and that, when it shall have been agreed that He is come, we may undoubtedly likewise believe that the new law has by Him been given, and not disavow the new testament in Him and through Him drawn up for us. For that Christ was to come we know that even the Jews do not attempt to disprove, inasmuch as it is to His advent that they are directing their hope. Nor need we inquire at more length concerning *that* matter, since in days bygone all the prophets have prophesied of it; as Isaiah: “Thus saith the Lord God to my Christ (the) Lord,[^1218] whose right hand I have holden, that the nations may hear Him: the powers of kings will I burst asunder; I will open before Him the gates, and the cities shall not be closed to Him.” Which very thing we see fulfilled. For whose right hand does God the Father hold but Christ’s, His Son?—whom all nations have heard, that is, whom all nations have believed,—whose preachers, withal, the apostles, are pointed to in the Psalms of David: “Into the universal earth,” says he, “is gone out their sound, and unto the ends of the earth their words.”[^1219] For upon whom else have the universal nations believed, but upon the Christ who is already come? For whom have the nations believed,—Parthians, Medes, Elamites, and they who inhabit Mesopotamia, Armenia, Phrygia, Cappadocia, and they who dwell in Pontus, and Asia, and Pamphylia, tarriers in Egypt, and inhabiters of the region of Africa which is beyond Cyrene, Romans and sojourners, yes, and in Jerusalem Jews,[^1220] and all other nations; as, for instance, by this time, the varied races of the Gætulians, and manifold confines of the Moors, all the limits of the Spains, and the diverse nations of the Gauls, and the haunts of the Britons—inaccessible to the Romans, but subjugated to Christ, and of the Sarmatians, and Dacians, and Germans, and Scythians, and of many remote nations, and of provinces and islands many, to us unknown, and which we can scarce enumerate? In all which places the name of the Christ who is already come reigns, as of Him before whom the gates of all cities have been opened, and to whom none are closed, before whom iron bars have been crumbled, and brazen gates[^1221] opened. Although there be withal a spiritual sense to be affixed to these expressions,—that the hearts of individuals, blockaded in various ways by the devil, are unbarred by the faith of Christ,—still they have been evidently fulfilled, inasmuch as in all these places dwells the “people” of the Name of Christ. For who *could* have reigned *over all nations* but Christ, God’s Son, who was ever announced as destined to reign over all to eternity? For if Solomon “reigned,” why, it was within the confines of Judea merely: “from Beersheba unto Dan” the boundaries of his kingdom are marked.[^1222] If, moreover, Darius “reigned” over the Babylonians and Parthians, he had not power *over all nations*; if Pharaoh, or whoever succeeded him in his hereditary kingdom, over the Egyptians, in that country merely did he possess his kingdom’s dominion; if Nebuchadnezzar with his petty kings, “from India unto Ethiopia” he had his kingdom’s boundaries;[^1223] if Alexander the Macedonian he did not hold more than universal Asia, and other regions, after he had quite conquered them; if the Germans, to this day they are not suffered to cross their own limits; the Britons are shut within the circuit of their own ocean; the nations of the Moors, and the barbarism of the Gætulians, are blockaded by the Romans, lest they exceed the confines of their own regions. What shall I say of the Romans themselves,[^1224] who fortify their own empire with garrisons of their own legions, nor can extend the might of their kingdom beyond these nations? But Christ’s Name is extending everywhere, believed everywhere, worshipped by all the above-enumerated nations, reigning everywhere, adored everywhere, conferred equally everywhere upon all. No king, with Him, finds greater favour, no barbarian lesser joy; no dignities or pedigrees enjoy distinctions of merit; to all He is equal, to all King, to all Judge, to all “God and Lord.”[^1225] Nor would you hesitate to believe what we asseverate, since you see it taking place." },
  { t = "note", id = "1218", text = "The reference is to Isa. xlv. 1. A glance at the LXX. will at once explain the difference between the reading of our author and the genuine reading. One letter—an “ι”—makes all the difference. For Κύρῳ has been read Κυρίῳ. In the Eng. ver. we read “*His Anointed*.”" },
  { t = "note", id = "1219", text = "Ps. xix. 4 (xviii. 5. in LXX.) and Rom. x. 18." },
  { t = "note", id = "1220", text = "See Acts ii. 9, 10; but comp. ver. 5." },
  { t = "note", id = "1221", text = "See Isa. xlv. 1, 2 (especially in Lowth’s version and the LXX.)." },
  { t = "note", id = "1222", text = "See 1 Kings iv. 25. (In the LXX. it is 3 Kings iv. 25; but the verse is omitted in Tischendorf’s text, ed. Lips. 1860, though given in his footnotes there.) The statement in the text differs slightly from Oehler’s reading; where I suspect there is a transposition of a syllable, and that for “in finibus *Judæ* tantum, a *Bersabeæ*,” we ought to read “in finibus *Judææ* tantum, a *Bersabe*.” See *de Jej*. c. ix." },
  { t = "note", id = "1223", text = "See Esth. i. 1; viii. 9." },
  { t = "note", id = "1224", text = "[Dr. Allix thinks these statements define the Empire after Severus, and hence accepts the date we have mentioned, for this treatise.]" },
  { t = "note", id = "1225", text = "Comp. John xx. 28." },
]

[[section]]
id = "of-the-times-of-christ-s-birth"
title = "Of the Times of Christ's Birth and Passion, and of Jerusalem's Destruction."
level = 1
blocks = [
  { t = "p", text = "Chapter VIII.—Of the Times of Christ’s Birth and Passion, and of Jerusalem’s Destruction." },
  { t = "p", text = "Accordingly the times must be inquired into of the predicted and future nativity of the Christ, and of His passion, and of the extermination of the city of Jerusalem, that is, its devastation. For Daniel says, that “both the holy city and the holy place are exterminated together with the coming Leader, and that the pinnacle is destroyed unto ruin.”[^1226] And so the times of the coming Christ, the Leader,[^1227] must be inquired into, which we shall trace in Daniel; and, after computing them, shall prove Him to be come, even on the ground of the times prescribed, and of competent signs and operations of His. Which matters we prove, again, on the ground of the consequences which were ever announced as to follow His advent; in order that we may believe all to have been as well fulfilled as foreseen." },
  { t = "note", id = "1226", text = "See Dan. ix. 26 (especially in the LXX.)." },
  { t = "note", id = "1227", text = "Comp. Isa. lv. 4." },
  { t = "p", text = "In such wise, therefore, did Daniel predict concerning Him, as to show both when and in what time He was to set the nations free; and how, after the passion of the Christ, that city had to be exterminated. For he says thus: “In the first year under Darius, son of Ahasuerus, of the seed of the Medes, who reigned over the kingdom of the Chaldees, I Daniel understood in the books the number of the years.…And while I was yet speaking in my prayer, behold, the man Gabriel, whom I saw in the vision in the beginning, flying; and he touched me, as it were, at the hour of the evening sacrifice, and made me understand, and spake with me, and said, Daniel I am now come out to imbue thee with understanding; in the beginning of thy supplication went out a word. And I am come to announce to thee, because thou art a man of desires;[^1228] and ponder thou on the word, and understand in the vision. Seventy hebdomads have been abridged[^1229] upon thy commonalty, and upon the holy city, until delinquency be made inveterate, and sins sealed, and righteousness obtained by entreaty, and righteousness eternal introduced; and in order that vision and prophet may be sealed, and an holy one of holy ones anointed. And thou shalt know, and thoroughly see, and understand, from the going forth of a word for restoring and rebuilding Jerusalem unto the Christ, the Leader, hebdomads (seven and an half, and[^1230]) lxii and an half: and it shall convert, and shall be built into height and entrenchment, and the times shall be renewed: and after these lxii hebdomads shall the anointing be exterminated, and shall not be; and the city and the holy place shall he exterminate together with the Leader, who is making His advent; and they shall be cut short as in a deluge, until (the) end of a war, which shall be cut short unto ruin. And he shall confirm a testament in many. In one hebdomad and the half of the hebdomad shall be taken away my sacrifice and libation, and in the holy place the execration of devastation, (and[^1231]) until the end of (the) time consummation shall be given with regard to this devastation.”[^1232]" },
  { t = "note", id = "1228", text = "Vir desideriorum; Gr. ἀνὴρ ἐπιθυμιῶν; Eng. ver. “a man greatly beloved.” Elsewhere Tertullian has another rendering—“miserabilis.” See *de Jej.* cc. vii, ix." },
  { t = "note", id = "1229", text = "Or, “abbreviated;” breviatæ sunt; Gr. συνετμήθνσαν. For this rendering, and the interpretations which in ancient and modern days have been founded on it, see G. S. Faber’s Dissert. on the prophecy of the seventy weeks, pp. 5, 6, 109–112. (London, 1811.) The whole work will repay perusal." },
  { t = "note", id = "1230", text = "These words are given, by Oehler and Rig., on the authority of Pamelius. The mss. and early editions are without them." },
  { t = "note", id = "1231", text = "Also supplied by Pamelius." },
  { t = "note", id = "1232", text = "See Dan. ix . 24–27. It seemed best to render with the strictest literality, without regard to anything else; as an idea will thus then be given of the condition of the text, which, as it stands, differs widely, as will be seen, from the Hebrew and also from the LXX., as it stands in the ed. Tisch. Lips. 1860, to which I always adapt my references." },
  { t = "p", text = "Observe we, therefore, the limit,—how, in truth, he predicts that there are to be lxx hebdomads, *within which* if they receive Him, “it shall be built into height and entrenchment, and the times shall be renewed.” But God, foreseeing what was to be—that they will not merely not receive Him, but will both persecute and deliver Him to death—both recapitulated, and said, that in lx and ii and an half of an hebdomad He is born, and an holy one of holy ones is anointed; but that when vii hebdomads[^1233] and an half were fulfilling, He had to suffer, and the holy city had to be exterminated after one and an half hebdomad—whereby namely, the seven and an half hebdomads have been completed. For he says thus: “And the city and the holy place to be exterminated together with the leader who is to come; and they shall be cut short as in a deluge; and he shall destroy the pinnacle unto ruin.”[^1234] Whence, therefore, do we show that the Christ came within the lxii and an half hebdomads? We shall count, moreover, from the first year of Darius, as at this particular time is shown to Daniel this particular vision; for he says, “And understand and conjecture that at the completion of thy word[^1235] I make thee these answers.” Whence we are bound to compute from the first year of Darius, when Daniel saw this vision." },
  { t = "note", id = "1233", text = "Hebdomad*es* is preferred to Oehler’s -*as*, a reading which he follows apparently on slender authority." },
  { t = "note", id = "1234", text = "There is no trace of these last words in Tischendorf’s LXX. here; and only in his footnotes is the “pinnacle” mentioned." },
  { t = "note", id = "1235", text = "Or, “speech.” The reference seems to be to ver. 23, but there is no such statement in Daniel." },
  { t = "p", text = "Let us see, therefore, how the years are filled up until the advent of the Christ:—" },
  { t = "p", text = "For Darius reigned…xviiii[^1236] years (19)." },
  { t = "note", id = "1236", text = "So Oehler; and I print all these numbers uniformly—as in the former part of the present chapter—exactly in accordance with the Latin forms, for the sake of showing how easily, in such calculations, errors may creep in." },
  { t = "p", text = "Artaxerxes reigned…xl and i years (41)." },
  { t = "p", text = "Then King Ochus (who is also called Cyrus) reigned…xxiiii years (24)." },
  { t = "p", text = "Argus…one year." },
  { t = "p", text = "Another Darius, who is also named Melas…xxi years (21)." },
  { t = "p", text = "Alexander the Macedonian…xii years (12)" },
  { t = "p", text = "Then, after Alexander, who had reigned over both Medes and Persians, whom he had reconquered, and had established his kingdom firmly in Alexandria, when withal he called that (city) by his own name;[^1237] after him reigned, (there, in Alexandria,)" },
  { t = "note", id = "1237", text = "Comp. Ps. xlix. 11 (in LXX. Ps. xlviii. 12)." },
  { t = "p", text = "Soter…xxxv years (35)." },
  { t = "p", text = "To whom succeeds Philadelphus, reigning…xxx and viii years (38)." },
  { t = "p", text = "To him succeeds Euergetes…xxv years (25)." },
  { t = "p", text = "Then Philopator…xvii years (17)." },
  { t = "p", text = "After him Epiphanes…xxiiii years (24)." },
  { t = "p", text = "Then another Euergetes…xxviiii years (29)." },
  { t = "p", text = "Then another Soter,…xxxviii years (38)." },
  { t = "p", text = "Ptolemy…xxxvii years (37)." },
  { t = "p", text = "Cleopatra,…xx years v months (20 5–12)." },
  { t = "p", text = "Yet again Cleopatra reigned jointly with Augustus…xiii years (13)." },
  { t = "p", text = "After Cleopatra, Augustus reigned other…xliii years (43)." },
  { t = "p", text = "For all the years of the empire of Augustus were…lvi years (56)." },
  { t = "p", text = "Let us see, moreover, how in the forty-first year of the empire of Augustus, when he has been reigning for xx and viii years after the death of Cleopatra, the Christ is born. (And the same Augustus survived, after Christ is born, xv years; and the remaining times of years to the day of the birth of Christ will bring us to the xl first year, which is the xx and viiith of Augustus after the death of Cleopatra.) There are, (then,) made up cccxxx and vii years, v months: (whence are filled up lxii hebdomads and an half: which make up ccccxxxvii years, vi months:) on the day of the birth of Christ. And (then) “righteousness eternal” was manifested, and “an Holy One of holy ones was anointed”—that is, Christ—and “sealed was vision and prophet,” and “sins” were remitted, which, through faith in the name of Christ, are washed away[^1238] for all who believe on Him. But what does he mean by saying that “vision and prophecy *are sealed*?” That all prophets ever announced of Him that He was to come and had to suffer. Therefore, since the prophecy was fulfilled through His advent, for that reason he said that “vision and prophecy *were sealed*;” inasmuch as He is the signet of all prophets, fulfilling all things which in days bygone they had announced of Him.[^1239] For after the advent of Christ and His passion there is no longer “vision or prophet” to announce Him as to come. In short, if this is not so, let the Jews exhibit, subsequently to Christ, any volumes of prophets, visible miracles wrought by any angels, (such as those) which in bygone days the patriarchs saw until the advent of Christ, who is now come; since which event “sealed is vision and prophecy,” that is, confirmed. And justly does the evangelist[^1240] write, “The law and the prophets (were) until John” the Baptist. For, on Christ’s being baptized, that is, on His sanctifying the waters in His own baptism,[^1241] all the plenitude of bygone spiritual grace-gifts ceased in Christ, sealing as He did all vision and prophecies, which by His advent He fulfilled. Whence most firmly does he assert that His advent “seals visions and prophecy.”" },
  { t = "note", id = "1238", text = "Diluuntur. So Oehler has amended for the reading of the mss. and edd., “tribuuntur.”" },
  { t = "note", id = "1239", text = "Comp. Pusey on Daniel, pp. 178, 179, notes 6, 7, 8, and the passages therein referred to. And for the whole question of the seventy weeks, and of the LXX. version of Daniel, comp. the same book, Lect. iv. and Note E (2d thousand, 1864). See also pp. 376–381 of the same book; and Faber (as above), pp. 293–297." },
  { t = "note", id = "1240", text = "Or rather, our Lord Himself. See Matt. xi. 13; Luke xvi. 16." },
  { t = "note", id = "1241", text = "Comp. the very obscure passage in *de Pu.* c. vi., towards the end, on which this expression appears to cast some light." },
  { t = "p", text = "Accordingly, showing, (as we have done,) both the number of the years, and the time of the lx two and an half fulfilled hebdomads, on completion of which, (we have shown) that Christ is come, that is, has been born, let us see what (mean) other “vii and an half hebdomads,” which have been subdivided in the abscision of[^1242] the former hebdomads; (let us see, namely,) in what event they have been fulfilled:—" },
  { t = "note", id = "1242", text = "Or, “in abscision from.”" },
  { t = "p", text = "For, after Augustus who survived after the birth of Christ, are made up…xv years (15)." },
  { t = "p", text = "To whom succeeded Tiberius Cæsar, and held the empire…xx years, vii months, xxviii days (20 etc.)." },
  { t = "p", text = "(In the fiftieth year of his empire Christ suffered, being about xxx years of age when he suffered.)" },
  { t = "p", text = "Again Caius Cæsar, also called Caligula,…iii years, viii months, xiii days (3 etc.)." },
  { t = "p", text = "Nero Cæsar,…xi years, ix months, xiii days (11 etc.)." },
  { t = "p", text = "Galba…vii months, vi days. (7 etc.)." },
  { t = "p", text = "Otho…iii days." },
  { t = "p", text = "Vitellius,…viii mos., xxvii days (8 mos.)." },
  { t = "p", text = "Vespasian, in the first year of his empire, subdues the Jews in war; and there are made lii years, vi months. For he reigned xi years. And thus, in the day of their storming, the Jews fulfilled the lxx hebdomads predicted in Daniel." },
  { t = "p", text = "Therefore, when these times also were completed, and the Jews subdued, there afterwards ceased in that place “libations and sacrifices,” which thenceforward have not been able to be in that place celebrated; for “the unction,” too,[^1243] was “exterminated” in that place after the passion of Christ. For it had been predicted that the unction *should* be exterminated in that place; as in the Psalms it is prophesied, “They exterminated my hands and feet.”[^1244] And the suffering of this “extermination” was perfected within the times of the lxx hebdomads, under Tiberius Cæsar, in the consulate of Rubellius Geminus and Fufius Geminus, in the month of March, at the times of the passover, on the eighth day before the calends of April,[^1245] on the first day of unleavened bread, on which they slew the lamb at even, just as had been enjoined by Moses.[^1246] Accordingly, all the synagogue of Israel *did* slay Him, saying to Pilate, when he was desirous to dismiss Him, “His blood be upon us, and upon our children;”[^1247] and, “If thou dismiss him, thou art not a friend of Cæsar;”[^1248] in order that all things might be fulfilled which had been written of Him.[^1249]" },
  { t = "note", id = "1243", text = "And, without “unction”—i.e. without a priesthood, the head whereof, or high priest, was always anointed—no “sacrifices” were lawful." },
  { t = "note", id = "1244", text = "See Ps. xxii. 16 (xxi. 17 in LXX.)" },
  { t = "note", id = "1245", text = "i.e., March 25." },
  { t = "note", id = "1246", text = "Comp. Ex. xii. 6 with Mark xiv. 12, Luke xxii. 7." },
  { t = "note", id = "1247", text = "See Matt. xxvii. 24, 25, with John xix. 12 and Acts iii. 13." },
  { t = "note", id = "1248", text = "John xix. 12." },
  { t = "note", id = "1249", text = "Comp. Luke xxiv. 44, etc." },
]

[[section]]
id = "of-the-prophecies-of-the-birth-and"
title = "Of the Prophecies of the Birth and Achievements of Christ."
level = 1
blocks = [
  { t = "p", text = "Chapter IX.—Of the Prophecies of the Birth and Achievements of Christ." },
  { t = "p", text = "Begin we, therefore, to prove that the Birth of Christ was announced by prophets; as Isaiah (*e.g.*,) foretells, “Hear ye, house of David; no petty contest have ye with men, since God is proposing a struggle. Therefore God Himself will give you a sign; Behold, the virgin[^1250] shall conceive, and bear a son, and ye shall call his name Emmanuel”[^1251] (which is, interpreted, “God with us”[^1252]): “butter and honey shall he eat;”[^1253]: “since, ere the child learn to call father or mother, he shall receive the power of Damascus and the spoils of Samaria, in opposition to the king of the Assyrians.”[^1254]" },
  { t = "note", id = "1250", text = "“*A* virgin,” Eng. ver.; ἡ παρθένος, LXX.; “*the* virgin,” Lowth." },
  { t = "note", id = "1251", text = "See Isa. vii. 13, 14." },
  { t = "note", id = "1252", text = "See Matt. i. 23." },
  { t = "note", id = "1253", text = "See Isa vii. 15." },
  { t = "note", id = "1254", text = "See Isa. viii. 4. (All these passages should be read in the LXX.)" },
  { t = "p", text = "Accordingly the Jews say: Let us challenge that prediction of Isaiah, and let us institute a comparison whether, in the case of the Christ who is already come, there be applicable to Him, firstly, the name which Isaiah foretold, and (secondly) the signs of it[^1255] which he announced of Him." },
  { t = "note", id = "1255", text = "i.e., of the predicted name. [Here compare *Against Marcion*, Book III. (vol. vii. Edin. series) Cap. xii. p. 142. See my note (1) on Chapter First; and also Kaye, p. xix.]" },
  { t = "p", text = "Well, then, Isaiah foretells that it behoves Him to be called Emmanuel; and that subsequently He is to take the power of Damascus and the spoils of Samaria, in opposition to the king of the Assyrians. “Now,” say they, “that (Christ) of yours, who is come, neither was called by that name, nor engaged in warfare.” But we, on the contrary, have thought they ought to be admonished to recall to mind *the context* of this passage as well. For subjoined is withal the interpretation of Emmanuel—“God with us”[^1256]—in order that you may regard not the sound only of the name, but the sense too. For the Hebrew sound, which is Emmanuel, has an interpretation, which is, God with us. Inquire, then, whether this speech, “God with us” (which is Emmanuel), be commonly applied to Christ ever since Christ’s light has dawned, and I think you will not deny it. For they who out of Judaism believe in Christ, ever since their believing on Him, do, whenever they shall wish to say[^1257] Emmanuel, signify that God is with us: and thus it is agreed that He who was ever predicted as Emmanuel is already come, because that which Emmanuel signifies is come—that is, “God with us.” Equally are they led by the sound of the name when they so understand “the power of Damascus,” and “the spoils of Samaria,” and “the kingdom of the Assyrians,” as if they portended Christ as a warrior; not observing that Scripture premises, “since, ere the child learn to call father or mother, he shall receive the power of Damascus and the spoils of Samaria, in opposition to the king of the Assyrians.” For the first step is to look at the demonstration of His *age*, to see whether the age there indicated can possibly exhibit the Christ as already a *man*, not to say a *general*. Forsooth, by His babyish cry the infant would summon men to arms, and would give the signal of war not with clarion, but with rattle, and point out the foe, not from His charger’s back or from a rampart, but from the back or neck of His suckler and nurse, and thus subdue Damascus and Samaria in place of the breast. (It is another matter if, among you, infants rush out into battle,—oiled first, I suppose, to dry in the sun, and then armed with satchels and rationed on butter,—who are to know how to lance sooner than how to lacerate the bosom!)[^1258] Certainly, if nature nowhere allows this,—(namely,) to serve as a soldier before developing into manhood, to take “the power of Damascus” before knowing your father,—it follows that the pronouncement is visibly figurative. “But again,” say they, “nature suffers not a ‘virgin’ to be a parent; and yet the prophet must be believed.” And deservedly so; for he bespoke credit for a thing incredible, by saying that it was to be *a sign*. “Therefore,” he says, “shall a sign be given you. Behold, a virgin shall conceive in womb, and bear a son.” But a sign from God, unless it had consisted in some portentous novelty, would not have appeared a sign. In a word, if, when you are anxious to cast any down from (a belief in) this divine prediction, or to convert whoever are simple, you have the audacity to lie, as if the Scripture contained (the announcement), that not “a virgin,” but “a young female,” was to conceive and bring forth; you are refuted even by this fact, that a daily occurrence—the pregnancy and parturition of a young female, namely—cannot possibly seem anything of *a sign*. And the setting before us, then, of a virgin-mother is deservedly believed to be *a sign*; but not equally so a warrior-infant. For there would not in this case again be involved the question of a *sign*; but, the *sign* of a novel birth having been awarded, the next step after the *sign* is, that there is enunciated a different ensuing ordering[^1259] of the infant, who is to eat “honey and butter.” Nor is this, of course, for a *sign*. It is natural to infancy. But that he is to receive[^1260] “the power of Damascus and the spoils of Samaria in opposition to the king of the Assyrians,” this is a wondrous *sign*. Keep to the limit of (the infant’s) *age*, and inquire into the sense of the prediction; nay, rather, repay to truth what you are unwilling to credit her with, and the prophecy becomes intelligible by the relation of its fulfilment. Let those Eastern magi be believed, dowering with gold and incense the infancy of Christ as a king;[^1261] and the infant has received “the power of Damascus” without battle and arms. For, besides the fact that it is known to all that the “power”—for that is the “strength”—of the East is wont to abound in gold and odours, certain it is that the divine Scriptures regard “gold” as constituting the “power” also of all other nations; as it says[^1262] through Zechariah: “And Judah keepeth guard at Jerusalem, and shall amass all the vigour of the surrounding peoples, gold and silver.”[^1263] For of this gift of “gold” David likewise says, “And to Him shall be given of the gold of Arabia;”[^1264] and again, “The kings of the Arabs and Saba shall bring Him gifts.”[^1265] For the East, on the one hand, generally held the magi (to be) kings; and Damascus, on the other hand, used formerly to be reckoned to Arabia before it was transferred into Syrophœnicia on the division of the Syrias: the “power” whereof Christ then “received” in receiving its ensigns,—gold, to wit, and odours. “The spoils,” moreover, “of Samaria” (He received in receiving) the magi themselves, who, on recognising Him, and honouring Him with gifts, and adoring Him on bended knee as Lord and King, on the evidence of the guiding and indicating star, became “the spoils of Samaria,” that is, of idolatry—by believing, namely, on Christ. For (Scripture) denoted idolatry by the name of “Samaria,” Samaria being ignominious on the score of idolatry; for she had at that time revolted from God under King Jeroboam. For this, again, is no novelty to the Divine Scriptures, figuratively to use a transference of *name* grounded on parallelism of *crimes*. For it[^1266] calls your rulers “rulers of Sodom,” and your people the “people of Gomorrha,”[^1267] when those cities had already long been extinct.[^1268] And elsewhere it says, through a prophet, to the people of Israel, “Thy father (was) an Amorite, and thy mother an Hittite;”[^1269] of whose race they were not begotten, but (were called their sons) by reason of their consimilarity in impiety, whom of old (God) had called *His own sons* through Isaiah the prophet: “I have generated and exalted sons.”[^1270] So, too, Egypt is sometimes understood to mean the whole world[^1271] in that prophet, on the count of superstition and malediction.[^1272] So, again, Babylon, in our own John, is a figure of the city Rome, as being equally great and proud of her sway, and triumphant over the saints.[^1273] On this wise, accordingly, (Scripture)[^1274] entitled the magi also with the appellation of “Samaritans,”—“despoiled” (of that) which they had had in common with the Samaritans, as we have said—idolatry in opposition to the Lord. (It[^1275] adds), “in opposition,” moreover, “to the king of the Assyrians,”—in opposition to the devil, who to this hour thinks himself to be reigning, if he detrudes the saints from the religion of God." },
  { t = "note", id = "1256", text = "In Isa. viii. 8, 10, compared with vii. 14 in the Eng. ver. and the LXX., and also Lowth, introductory remarks on ch. viii." },
  { t = "note", id = "1257", text = "Or, “to call him.”" },
  { t = "note", id = "1258", text = "See *adv. Marc*. l. iii. c. xiii., which, with the preceding chapter, should be compared throughout with the chapter before us." },
  { t = "note", id = "1259", text = "Comp. Judg. xiii. 12; Eng. ver. “How shall we *order* the child?”" },
  { t = "note", id = "1260", text = "Or, “accept.”" },
  { t = "note", id = "1261", text = "See Matt. ii. 1–12." },
  { t = "note", id = "1262", text = "Of course he ought to have said, “*they say*.”" },
  { t = "note", id = "1263", text = "Zech. xiv. 14, omitting the last clause." },
  { t = "note", id = "1264", text = "Ps. lxxii. 15 (lxxi. 15 in LXX.): “Sheba” in Eng. ver.; “Arabia” in the “Great Bible” of 1539; and so the LXX." },
  { t = "note", id = "1265", text = "Ps. lxxii. 10, in LXX, and “Great Bible;” “Sheba and Seba,” Eng. ver." },
  { t = "note", id = "1266", text = "Strictly, Tertullian ought to have said “they call,” having above said “Divine scriptures;” as above on the preceding page." },
  { t = "note", id = "1267", text = "Isa. i. 10." },
  { t = "note", id = "1268", text = "See Gen. xix. 23–29." },
  { t = "note", id = "1269", text = "Ezek. xvi. 3, 45." },
  { t = "note", id = "1270", text = "Isa. i. 2, as before." },
  { t = "note", id = "1271", text = "Orbis." },
  { t = "note", id = "1272", text = "Oehler refers to Isa. xix. 1. See, too, Isa. xxx. and xxxi." },
  { t = "note", id = "1273", text = "See Rev. xvii., etc." },
  { t = "note", id = "1274", text = "Or we may supply here [“Isaiah”]." },
  { t = "note", id = "1275", text = "Or, “he.”" },
  { t = "p", text = "Moreover, this our interpretation will be supported while (we find that) elsewhere as well the Scriptures designate Christ a warrior, as we gather from the names of certain weapons, and words of that kind. But by a comparison of the remaining senses the Jews shall be convicted. “Gird thee,” says David, “the sword upon the thigh.”[^1276] But what do you read above concerning the Christ? “Blooming in beauty above the sons of men; grace is outpoured in thy lips.”[^1277] But very absurd it is if he was complimenting on the bloom of his beauty and the grace of his lips, one whom he was girding for war with a sword; of whom he proceeds subjunctively to say, “Outstretch and prosper, advance and reign!” And he has added, “because of thy lenity and justice.”[^1278] Who will ply the sword without practising the contraries to lenity and justice; that is, guile, and asperity, and injustice, proper (of course) to the business of battles? See we, then, whether that which has another action be not another sword,—that is, the Divine word of God, doubly sharpened[^1279] with the two Testaments of the ancient law and the new law; sharpened by the equity of its own wisdom; rendering to each one according to his own action.[^1280] Lawful , then, it was for the Christ of God to be precinct, in the Psalms, without warlike achievements, with the figurative sword of the word of God; to which sword is congruous the predicated “bloom,” together with the “grace of the lips;” with which sword He was then “girt upon the thigh,” in the eye of David, when He was announced as about to come to earth in obedience to God the Father’s decree. “The greatness of thy right hand,” he says, “shall conduct thee”[^1281]—the virtue to wit, of the spiritual grace from which the recognition of Christ is deduced. “Thine arrows,” he says, “are sharp,”[^1282]—God’s everywhere-flying precepts (arrows) threatening the exposure[^1283] of every heart, and carrying compunction and transfixion to each conscience: “peoples shall fall beneath thee,”[^1284]—of course, in adoration. Thus mighty in war and weapon-bearing is Christ; thus will He “receive the spoils,” not of “Samaria” alone, but of all nations as well. Acknowledge that His “spoils” are figurative whose weapons you have learnt to be allegorical. And thus, so far, the Christ who is come was not a warrior, because He was not predicted as such by Isaiah." },
  { t = "note", id = "1276", text = "Ps. xlv. 3, clause 1 (in LXX. Ps. xliv. 4)." },
  { t = "note", id = "1277", text = "See Ps. xlv. 2 (xliv. 3 in LXX.)." },
  { t = "note", id = "1278", text = "Ps. xlv. 4 (xliv. 5 in LXX.)." },
  { t = "note", id = "1279", text = "Comp. Heb. iv. 12; Rev. i. 16; ii. 12; xix. 15, 21; also Eph. vi. 17." },
  { t = "note", id = "1280", text = "Comp. Ps. lxii. 12 (lxi. 13 in LXX.); Rom. ii. 6." },
  { t = "note", id = "1281", text = "See Ps. xlv. 5 (xliv. in LXX.)." },
  { t = "note", id = "1282", text = "Ps. xlv. 5 (xliv. 6 in LXX.)." },
  { t = "note", id = "1283", text = "Traductionem (comp. Heb. iv. 13)." },
  { t = "note", id = "1284", text = "Ps. xlv. 5." },
  { t = "p", text = "“But if the Christ,” say they, “who is believed to be coming is not called Jesus, why is he who is come called Jesus Christ?” Well, each name will meet in the Christ of God, in whom is found likewise the appellation[^1285] Jesus. Learn the habitual character of your error. In the course of the appointing of a successor to Moses, Oshea[^1286] the son of Nun[^1287] is certainly transferred from his pristine name, and begins to be called Jesus.[^1288] Certainly, you say. This we first assert to have been a figure of the future. For, because Jesus Christ was to introduce the second people (which is composed of us nations, lingering deserted in the world[^1289] aforetime) into the land of promise, “flowing with milk and honey”[^1290] (that is, into the possession of eternal life, than which nought is sweeter); and this had to come about, not through Moses (that is, not through the Law’s discipline), but through Joshua (that is, through the new law’s grace), after our circumcision with “a knife of rock”[^1291] (that is, with Christ’s precepts, for Christ is in many ways and figures predicted as a rock[^1292]); therefore the man who was being prepared to act as images of this sacrament was inaugurated under the figure of the Lord’s name, even so as to be named Jesus.[^1293] For He who ever spake to Moses was the Son of God Himself; who, too, was always *seen*.[^1294] For God the Father none ever saw, and lived.[^1295] And accordingly it is agreed that the Son of God Himself spake to Moses, and said to the people, “Behold, I send mine angel before thy”—that is, the people’s—“face, to guard thee on the march, and to introduce thee into the land which I have prepared thee: attend to him, and be not disobedient to him; for he hath not escaped[^1296] thy notice, since my name is upon him.”[^1297] For Joshua was to introduce the people into the land of promise, not Moses. Now He called him an “angel,” on account of the magnitude of the mighty deeds which he was to achieve (which mighty deeds Joshua the son of Nun did, and you yourselves read), and on account of his office of prophet announcing (to wit) the divine will; just as withal the Spirit, speaking in the person of the Father, calls the forerunner of Christ, John, a future “angel,” through the prophet: “Behold, I send mine angel before Thy”—that is, Christ’s—“face, who shall prepare Thy way before Thee.”[^1298] Nor is it a novel practice to the Holy Spirit to call those “angels” whom God has appointed as ministers of His power. For the same John is called not merely an “angel” of Christ, but withal a “lamp” shining before Christ: for David predicts, “I have prepared the lamp for my Christ;”[^1299] and him Christ Himself, coming “to fulfil the prophets,”[^1300] called so to the Jews. “He was,” He says, “the burning and shining lamp;”[^1301] as being he who not merely “prepared His ways in the desert,”[^1302] but withal, by pointing out “the Lamb of God,”[^1303] illumined the minds of men by his heralding, so that they understood Him to be that Lamb whom Moses was wont to announce as destined to suffer. Thus, too, (was the son of Nun called) Joshua, on account of the future mystery[^1304] of his name: for that name (He who spake with Moses) confirmed as His own which Himself had conferred on him, because He had bidden him thenceforth be called, not “angel” nor “Oshea,” but “Joshua.” Thus, therefore, each name is appropriate to the Christ of God—that He should be called Jesus as well (as Christ)." },
  { t = "note", id = "1285", text = "I can find no authority for “appellatus” as a substantive, but such forms are familiar with Tertullian. Or perhaps we may render: “in that He is found to have been likewise called Jesus.”" },
  { t = "note", id = "1286", text = "Auses; Αὐσή in LXX." },
  { t = "note", id = "1287", text = "Nave; Ναυή in LXX." },
  { t = "note", id = "1288", text = "Jehoshua, Joshua, Jeshua, Jesus, are all forms of the same name. But the change from Oshea or Hoshea to Jehoshua appears to have been made when he was sent to spy the land. See Num. xiii. 16 (17 in LXX., who call it a *sur*naming)." },
  { t = "note", id = "1289", text = "If Oehler’s “in sæculo desertæ” is to be retained, this appears to be the construction. But this passage, like others above noted, is but a reproduction of parts of the third book in answer to Marcion; and there the reading is “in sæculi desertis”=\"in the desert places of the world,” or “of heathendom.”" },
  { t = "note", id = "1290", text = "See Ex. iii. 8, and the references there." },
  { t = "note", id = "1291", text = "See Josh. v. 2–9, especially in LXX. Comp. the margin in the Eng. ver. in ver. 2, “flint knives,” and Wordsworth *in loc*., who refers to Ex. iv. 25, for which see ch. iii. above." },
  { t = "note", id = "1292", text = "See especially 1 Cor. x. 4." },
  { t = "note", id = "1293", text = "Or, “Joshua.”" },
  { t = "note", id = "1294", text = "Comp. Num. xii. 5–8." },
  { t = "note", id = "1295", text = "Comp. Ex. xxxiii. 20; John i. 18; xiv. 9; Col. i. 15; Heb. i. 3." },
  { t = "note", id = "1296", text = "Oehler and others read “cela*vit*”; but the correction of Fr. Junius and Rig., “cela*bit*,” is certainly more agreeable to the LXX. and the Eng. ver." },
  { t = "note", id = "1297", text = "Ex. xxiii. 20, 21." },
  { t = "note", id = "1298", text = "Mal. iii. 1: comp. Matt. xi. 10; Mark i. 2; Luke vii. 27." },
  { t = "note", id = "1299", text = "See Ps. cxxxii. 17 (cxxi. 17 in LXX.)." },
  { t = "note", id = "1300", text = "Matt. v. 17, briefly; a very favourite reference with Tertullian." },
  { t = "note", id = "1301", text = "John v. 35, ὁ λύχνος ὁ καιόμενος καὶ φαίνων." },
  { t = "note", id = "1302", text = "Comp. reference 8, p. 232; and Isa. xl. 3, John i. 23." },
  { t = "note", id = "1303", text = "See John i. 29, 36." },
  { t = "note", id = "1304", text = "Sacramentum." },
  { t = "p", text = "And that the virgin of whom it behoved Christ to be born (as we have above mentioned) must derive her lineage of the seed of David, the prophet in subsequent passages evidently asserts. “And there shall be born,” he says, “a rod from the root of Jesse”—which rod is Mary—“and a flower shall ascend from his root: and there shall rest upon him the Spirit of God, the spirit of wisdom and understanding, the spirit of discernment and piety, the spirit of counsel and truth; the spirit of God’s fear shall fill Him.”[^1305] For to none of men was the universal aggregation of spiritual credentials appropriate, except to Christ; paralleled as He is to a “flower” by reason of glory, by reason of grace; but accounted “of the root of Jesse,” whence His origin is to be deduced,—to wit, through Mary.[^1306] For He was from the native soil of Bethlehem, and from the house of David; as, among the Romans, Mary is described in the census, of whom is born Christ.[^1307]" },
  { t = "note", id = "1305", text = "See Isa. xi. 1, 2, especially in LXX." },
  { t = "note", id = "1306", text = "See Luke i. 27." },
  { t = "note", id = "1307", text = "See Luke ii. 1–7." },
  { t = "p", text = "I demand, again—granting that He who was ever predicted by prophets as destined to come out of Jesse’s race, was withal to exhibit all humility, patience, and tranquillity—whether He be come? Equally so (in this case as in the former), the man who is shown to bear that character will be the very Christ who is come. For of Him the prophet says, “A man set in a plague, and knowing how to bear infirmity;” who “was led as a sheep for a victim; and, as a lamb before him who sheareth him, opened not His mouth.”[^1308] If He “neither did contend nor shout, nor was His voice heard abroad,” who “crushed not the bruised reed”—Israel’s faith, who “quenched not the burning flax”[^1309]—that is, the momentary glow of the Gentiles—but made it shine more by the rising of His own light,—He can be none other than He who was predicted. The action, therefore, of the Christ who is come must be examined by being placed side by side with the rule of the Scriptures. For, if I mistake not, we find Him distinguished by a twofold operation,—that of *preaching* and that of *power*. Now, let each count be disposed of summarily. Accordingly, let us work out the order we have set down, teaching that Christ was announced as a *preacher*; as, through Isaiah: “Cry out,” he says, “in vigour, and spare not; lift up, as with a trumpet, thy voice, and announce to my commonalty their crimes, and to the house of Jacob their sins. Me from day to day they seek, and to learn my ways they covet, as a people which hath done righteousness, and hath not forsaken the judgment of God,” and so forth:[^1310] that, moreover, He was to do acts of *power* from the Father: “Behold, our God will deal retributive judgment; Himself will come and save us: then shall the infirm be healed, and the eyes of the blind shall see, and the ears of the deaf shall hear, and the mutes’ tongues shall be loosed, and the lame shall leap as an hart,”[^1311] and so on; which works not even you deny that Christ did, inasmuch as you were wont to say that, “on account of the works ye stoned Him not, but because He did them on the Sabbaths.”[^1312]" },
  { t = "note", id = "1308", text = "See Isa. liii. 3, 7, in LXX.; and comp. Ps. xxxviii. 17 (xxxvii. 18 in LXX.) in the “Great Bible” of 1539." },
  { t = "note", id = "1309", text = "See Isa. xlii. 2, 3, and Matt. xii. 19, 20." },
  { t = "note", id = "1310", text = "See Isa. lviii. 1, 2, especially in LXX." },
  { t = "note", id = "1311", text = "See Isa. xxxv. 4, 5, 6." },
  { t = "note", id = "1312", text = "See John v. 17, 18, compared with x. 31–33." },
]

[[section]]
id = "concerning-the-passion-of-christ-and-its"
title = "Concerning the Passion of Christ, and Its Old Testament Predictions and Adumbrations."
level = 1
blocks = [
  { t = "p", text = "Chapter X.—Concerning the Passion of Christ, and Its Old Testament Predictions and Adumbrations." },
  { t = "p", text = "Concerning the last step, plainly, of His passion you raise a doubt; affirming that the passion of the cross was not predicted with reference to Christ, and urging, besides, that it is not credible that God should have exposed His own Son to that kind of death; because Himself said, “Cursed *is* every one who shall have hung on a tree.”[^1313] But the *reason* of the case antecedently explains the sense of this malediction; for He says in Deuteronomy: “If, moreover, (a man) shall have been (involved) in some sin incurring the judgment of death, and shall die, and ye shall suspend him on a tree, his body shall not remain on the tree, but with burial ye shall bury him on the very day; because cursed by God is every one who shall have been suspended on a tree; and ye shall not defile the land which the Lord thy God shall give thee for (thy) lot.”[^1314] Therefore He did not maledictively adjudge Christ to this passion, but drew a distinction, that whoever, *in any sin*, had incurred the judgment of death, and died suspended on a tree, *he* should be “cursed by God,” because his own sins were the cause of his suspension on the tree. On the other hand, Christ, who spoke not guile from His mouth,[^1315] and who exhibited all righteousness and humility, not only (as we have above recorded it predicted of Him) was not exposed to that kind of death *for his own deserts*, but (was so exposed) in order that what was predicted by the prophets as destined to come upon Him through your means[^1316] might be fulfilled; just as, in the Psalms, the Spirit Himself of Christ was already singing, saying, “They were repaying me evil for good;”[^1317] and, “What I had not seized I was then paying in full;”[^1318] “They exterminated my hands and feet;”[^1319] and, “They put into my drink gall, and in my thirst they slaked me with vinegar;”[^1320] “Upon my vesture they did cast (the) lot;”[^1321] just as the other (outrages) which you were to commit on Him were foretold,—all which He, actually and thoroughly suffering, suffered not for any evil action of His own, but “that the Scriptures from the mouth of the prophets might be fulfilled.”[^1322]" },
  { t = "note", id = "1313", text = "Comp. Deut. xxi. 23 with Gal. iii. 13, with Prof. Lightfoot on the latter passage." },
  { t = "note", id = "1314", text = "Deut. xxi. 22, 23 (especially in the LXX.)." },
  { t = "note", id = "1315", text = "See 1 Pet. ii. 22 with Isa. liii. 9." },
  { t = "note", id = "1316", text = "Oehler’s pointing is disregarded." },
  { t = "note", id = "1317", text = "Ps. xxxv. (xxxiv. in LXX.) 12." },
  { t = "note", id = "1318", text = "Ps. lxix. 4 (lxviii. 5 in LXX.)." },
  { t = "note", id = "1319", text = "Ps. xxii. 16 (xxi. 17 in LXX.)." },
  { t = "note", id = "1320", text = "Ps. lxix. 21 (lxviii. 5 in LXX.)." },
  { t = "note", id = "1321", text = "Ps. xxii. 18 (xxi. 19 in LXX.)." },
  { t = "note", id = "1322", text = "See Matt. xxvi. 56; xxvii. 34, 35; John xix. 23, 24, 28, 32–37." },
  { t = "p", text = "And, of course, it had been meet that the mystery[^1323] of the passion itself should be figuratively set forth in predictions; and the more incredible (that mystery), the more likely to be “a stumbling-stone,”[^1324] if it had been nakedly predicted; and the more magnificent, the more to be *adumbrated*, that the difficulty of its intelligence might seek (help from) the grace of God." },
  { t = "note", id = "1323", text = "Sacramentum." },
  { t = "note", id = "1324", text = "See Rom. ix. 32, 33, with Isa. xxviii. 16; 1 Cor. i. 23; Gal. v. 11." },
  { t = "p", text = "Accordingly, to begin with, Isaac, when led by his father as a victim, and himself bearing his own “wood,”[^1325] was even at that early period pointing to Christ’s death; conceded, as He was, as a victim by the Father; carrying, as He did, the “wood” of His own passion.[^1326]" },
  { t = "note", id = "1325", text = "Lignum = ξύλον; constantly used for “tree.”" },
  { t = "note", id = "1326", text = "Comp. Gen. xxii. 1–10 with John xix. 17." },
  { t = "p", text = "Joseph, again, himself was made a figure of Christ[^1327] in this point alone (to name no more, not to delay my own course), that he suffered persecution at the hands of his brethren, and was sold into Egypt, on account of the favour of God;[^1328] just as Christ was sold by Israel—(and therefore,) “according to the flesh,” by His “brethren”[^1329]—when He is betrayed by Judas.[^1330] For Joseph is withal blest by his father[^1331] after this form: “His glory (is that) of a bull; his horns, the horns of an unicorn; on them shall he toss nations alike unto the very extremity of the earth.” Of course no one-horned rhinoceros was there pointed to, nor any two-horned minotaur. But Christ was therein signified: “bull,” by reason of each of His two characters,—to some fierce, as Judge; to others gentle, as Saviour; whose “horns” were to be the extremities of the *cross*. For even in a ship’s yard—which is part of a *cross*—this is the name by which the extremities are called; while the central pole of the mast is a “unicorn.” By this power, in fact, of the cross, and in this manner horned, He does now, on the one hand, “toss” universal nations through *faith*, wafting them away from earth to heaven; and will one day, on the other, “toss” them through *judgment*, casting them down from heaven to earth." },
  { t = "note", id = "1327", text = "“Chris*tum* figur*atus*” is Oehler’s reading, after the two mss. and the Pamelian ed. of 1579; the rest read “figu*rans*” or “figur*avit.*”" },
  { t = "note", id = "1328", text = "Manifested *e.g.*, in his *two dreams*. See Gen. xxxvii." },
  { t = "note", id = "1329", text = "Comp. Rom. ix. 5." },
  { t = "note", id = "1330", text = "Or, “Judah.”" },
  { t = "note", id = "1331", text = "This is an error. It is not “his father,” Jacob, but Moses, who thus blesses him. See Deut. xxxiii. 17. The same error occurs in *adv. Marc*. 1. iii. c. xxiii." },
  { t = "p", text = "He, again, will be the “bull” elsewhere too in the same scripture.[^1332] When Jacob pronounced a blessing on Simeon and Levi, he prophesies of the scribes and Pharisees; for from them[^1333] is derived their[^1334] origin. For (his blessing) interprets spiritually thus: “Simeon and Levi perfected iniquity out of their sect,”[^1335]—whereby, to wit, they persecuted Christ: “into their counsel come not my soul! and upon their station rest not my heart! because in their indignation they slew men”—that is, prophets—“and in their concupiscence they hamstrung a bull!”[^1336]—that is, Christ, whom—after the slaughter of prophets—they slew, and exhausted their savagery by transfixing His sinews with nails. Else it is idle if, after the murder already committed by them, he upbraids others, and not them, with butchery.[^1337]" },
  { t = "note", id = "1332", text = "Not strictly “the same;” for here the reference *is* to Gen. xlix. 5–7." },
  { t = "note", id = "1333", text = "i.e., Simeon and Levi." },
  { t = "note", id = "1334", text = "i.e., the scribes and Pharisees." },
  { t = "note", id = "1335", text = "Perfecerunt iniquitatem ex sua secta. There seems to be a play on the word “secta” in connection with the outrage committed by Simeon and Levi, as recorded in Gen. xxxiv. 25–31; and for συνετέλεσαν ἀδικίαν ἐξαιρέσεως αὐτῶν (which is the reading of the LXX., ed. Tisch. 3, Lips. 1860), Tertullian’s Latin seems to have read, συνετέλεσαν ἀδικίαν ἐξ αἱρέσεως αὐτῶν." },
  { t = "note", id = "1336", text = "See Gen. xlix. 5–7 in LXX.; and comp. the margin of Eng. ver. on ver. 7, and Wordsworth *in loc*., who incorrectly renders ταῦρον an “ox” here." },
  { t = "note", id = "1337", text = "What the sense of this is it is not easy to see. It appears to have puzzled Pam. and Rig. so effectually that they both, conjecturally and without authority, adopted the reading found in *adv. Marc*. l. iii. c. xviii. (from which book, as usual, the present passage is borrowed), only altering *illis* to *ipsis*." },
  { t = "p", text = "But, to come now to Moses, why, I wonder, did he merely at the time when Joshua was battling against Amalek, pray *sitting* with hands expanded, when, in circumstances so critical, he ought rather, surely, to have commended his prayer by knees bended, and hands beating his breast, and a face prostrate on the ground; except it was that there, where the name of the Lord Jesus was the theme of speech—destined as He was to enter the lists one day singly against the devil—the figure of the *cross* was also necessary, (that figure) through which Jesus was to win the victory?[^1338] Why, again, did the same Moses, after the prohibition of any “likeness of anything,”[^1339] set forth a brazen serpent, placed on a “tree,” in a hanging posture, for a spectacle of healing to Israel, at the time when, after their idolatry,[^1340] they were suffering extermination by serpents, except that in this case he was exhibiting the Lord’s *cross* on which the “serpent” the devil was “made a show of,”[^1341] and, for every one hurt by such snakes—that is, his angels[^1342]—on turning intently from the peccancy of sins to the sacraments of Christ’s *cross*, salvation was outwrought? For he who then gazed upon *that* (*cross*) was freed from the bite of the serpents.[^1343]" },
  { t = "note", id = "1338", text = "See Ex. xvii. 8–16; and comp. Col. ii. 14, 15." },
  { t = "note", id = "1339", text = "Ex. xx. 4." },
  { t = "note", id = "1340", text = "Their sin was “speaking against God and against Moses” (Num. xxi. 4–9)." },
  { t = "note", id = "1341", text = "Comp. Col. ii. 14, 15, as before; also Gen. iii. 1, etc.; 2 Cor. xi. 3; Rev. xii. 9." },
  { t = "note", id = "1342", text = "Comp. 2 Cor. xi. 14, 15; Matt. xxv. 41; Rev. xii. 9." },
  { t = "note", id = "1343", text = "Comp. *de Idol*. c. v.; *adv. Marc*. l. iii. c. xviii." },
  { t = "p", text = "Come, now, if you have read in the utterance of the prophet in the Psalms, “God hath reigned *from the tree*,”[^1344] I wait to hear what you understand thereby; for fear you may perhaps think some carpenter-king[^1345] is signified, and not Christ, who has reigned from that time onward when he overcame the death which ensued from His passion of “the tree.”" },
  { t = "note", id = "1344", text = "A ligno. Oehler refers us to Ps. xcvi. 10 (xcv. 10 in LXX.); but the special words “a ligno” are wanting there, though the text is often quoted by the Fathers." },
  { t = "note", id = "1345", text = "Lignarium aliquem regem. It is remarkable, in connection herewith, that our Lord is not only called by the Jews “*the carpenter’s son*” (Matt. xiii. 55; Luke iv. 22), but “*the carpenter*” (Mark vi. 3)." },
  { t = "p", text = "Similarly, again, Isaiah says: “For a child is born to us, and to us is given a son.”[^1346] What novelty is that, unless he is speaking of the “Son” of God?—and one is born to us the beginning of whose government has been made “on His shoulder.” What king in the world wears the ensign of his power *on his shoulder*, and does not bear either diadem on his head, or else sceptre in his hand, or else some mark of distinctive vesture? But the *novel* “King of ages,” Christ Jesus, alone reared “on His shoulder” His own *novel* glory, and power, and sublimity,—the *cross*, to wit; that, according to the former prophecy, the Lord thenceforth “might reign *from the tree*.” For of this tree likewise it is that God hints, through Jeremiah, that you would say, “Come, let us put *wood*[^1347] *into his bread*, and let us wear him away out of the land of the living; and his name shall no more be remembered.”[^1348] Of course on His *body* that “wood” was put;[^1349] for so Christ has revealed, calling His body “bread,”[^1350] whose body the prophet in bygone days announced under the term “bread.” If you shall still seek for predictions of the Lord’s cross, the twenty-first Psalm will at length be able to satisfy you, containing as it does the whole passion of Christ; singing, as He does, even at so early a date, His own glory.[^1351] “They dug,” He says, “my hands and feet”[^1352]—which is the peculiar atrocity of the cross; and again when He implores the aid of the Father, “Save me,” He says, “out of the mouth of the lion”—of course, of death—“and from the horn of the unicorns my humility,”[^1353]—from the ends, to wit, of the cross, as we have above shown; which cross neither David himself suffered, nor any of the kings of the Jews: that you may not think the passion of some other particular man is here prophesied than His who alone was so signally crucified by the People." },
  { t = "note", id = "1346", text = "See Isa. ix. 6." },
  { t = "note", id = "1347", text = "Lignum." },
  { t = "note", id = "1348", text = "See Jer. xi. 19 (in LXX.)." },
  { t = "note", id = "1349", text = "i.e., when they laid on Him the crossbeam to carry. See John xix. 17." },
  { t = "note", id = "1350", text = "See John vi. *passim*, and the various accounts of the institution of the Holy Supper." },
  { t = "note", id = "1351", text = "It is Ps. xxii. in our Bibles, xxi. in LXX." },
  { t = "note", id = "1352", text = "Ver. 16 (17 in LXX.)." },
  { t = "note", id = "1353", text = "Ps. xxii. 21 (xxi. 22 in LXX., who render it as Tertullian does)." },
  { t = "p", text = "Now, if the hardness of your heart shall persist in rejecting and deriding all these interpretations, we will prove that it may suffice that the *death* of the Christ had been prophesied, in order that, from the fact that the *nature* of the death had not been specified, it may be understood to have been affected by means of the *cross*[^1354] and that the passion of the *cross* is not to be ascribed to any but Him whose *death* was constantly being predicted. For I desire to show, in one utterance of Isaiah, His *death*, and *passion*, and *sepulture*. “By the crimes,” he says, “of my people was He led unto death; and I will give the evil for His sepulture, and the rich for His death, because He did not wickedness, nor was guile found in his mouth; and God willed to redeem His soul from death,”[^1355] and so forth. He says again, moreover: “His sepulture hath been taken away from the midst.”[^1356] For neither was He buried except He were dead, nor was His sepulture removed from the midst except through His resurrection. Finally, he subjoins: “Therefore He shall have many for an heritage, and of many shall He divide spoils:”[^1357] who else (shall so do) but He who “was born,” as we have above shown?—“in return for the fact that His soul was delivered unto death?” For, the *cause* of the favour accorded Him being shown,—in return, to wit, for the injury of *a death* which had to be recompensed,—it is likewise shown that He, destined to attain these rewards *because of* death, was to attain them *after* death—of course after *resurrection*. For that which happened at His passion, that mid-day grew dark, the prophet Amos announces, saying, “And it shall be,” he says, “in that day, saith the Lord, the sun shall set at mid-day, and the day of light shall grow dark over the land: and I will convert your festive days into grief, and all your canticles into lamentation; and I will lay upon your loins sackcloth, and upon every head baldness; and I will make the grief like that for a beloved (son), and them that are with him like a day of mourning.”[^1358] For that you would do thus at the beginning of the first month of your new (years) even Moses prophesied, when he was foretelling that all the community of the sons of Israel was[^1359] to immolate at eventide a lamb, and were to eat[^1360] this solemn sacrifice of this day (that is, of the passover of unleavened bread) with bitterness;” and added that “it was the *passover of the Lord*,”[^1361] that is, the *passion of Christ*. Which prediction was thus also fulfilled, that “on the first day of unleavened bread”[^1362] you slew Christ;[^1363] and (that the prophecies might be fulfilled) the day hasted to make an “eventide,”—that is, to cause darkness, which was made at mid-day; and thus “your festive days God converted into grief, and your canticles into lamentation.” For after the passion of Christ there overtook you even captivity and dispersion, predicted before through the Holy Spirit." },
  { t = "note", id = "1354", text = "i.e., perhaps, because of the extreme ignominy attaching to that death, which prevented its being expressly named." },
  { t = "note", id = "1355", text = "Isa. liii. 8, 9, 10, (in LXX.)." },
  { t = "note", id = "1356", text = "Isa. lvii. 2 (in LXX.)." },
  { t = "note", id = "1357", text = "Isa. liii. 12 (in LXX.). Comp., too, Bp. Lowth. Oehler’s pointing again appears to be faulty." },
  { t = "note", id = "1358", text = "See Amos viii. 9, 10 (especially in the LXX.)." },
  { t = "note", id = "1359", text = "Oehler’s “esset” appears to be a mistake for “esse.”" },
  { t = "note", id = "1360", text = "The change from singular to plural is due to the Latin, not to the translator." },
  { t = "note", id = "1361", text = "See Ex. xii. 1–11." },
  { t = "note", id = "1362", text = "See Matt. xxvi. 17; Mark xiv. 12; Luke xxii. 7; John xviii. 28." },
  { t = "note", id = "1363", text = "Comp. 1 Cor. v. 7." },
]

[[section]]
id = "further-proofs-from-ezekiel-summary-of-the"
title = "Further Proofs, from Ezekiel. Summary of the Prophetic Argument Thus Far."
level = 1
blocks = [
  { t = "p", text = "Chapter XI.—Further Proofs, from Ezekiel. Summary of the Prophetic Argument Thus Far." },
  { t = "p", text = "For, again, it is for these deserts of yours that Ezekiel announces your ruin as about to come: and not only in this age[^1364]—a ruin which has already befallen—but in the “day of retribution,”[^1365] which will be subsequent. From which ruin none will be freed but he who shall have been frontally sealed[^1366] with the passion of the Christ whom you have rejected. For thus it is written: “And the Lord said unto me, Son of man, thou hast seen what the elders of Israel do, each one of them in darkness, each in a hidden bed-chamber: because they have said, The Lord seeth us not; the Lord hath derelinquished the earth. And He said unto me, Turn thee again, and thou shalt see greater enormities which these do. And He introduced me unto the thresholds of the gate of the house of the Lord which looketh unto the north; and, behold, there, women sitting and bewailing Thammuz. And the Lord said unto me, Son of man, hast thou seen? Is the house of Judah *moderate*, to do the enormities which they have done? And yet thou art about to see greater affections of theirs. And He introduced me into the inner shrine of the house of the Lord; and, behold, on the thresholds of the house of the Lord, between the midst of the porch and between the midst of the altar,[^1367] as it were twenty and five men have turned their backs unto the temple of the Lord, and their faces over against the east; these were adoring the sun. And He said unto me, Seest thou, son of man? Are such deeds trifles to the house of Judah, that they should do the enormities which these have done? because they have filled up (the measure of) their impieties, and, behold, *are* themselves, as it were, grimacing; I will deal with mine indignation,[^1368] mine eye shall not spare, neither will I pity; they shall cry out unto mine ears with a loud voice, and I will not hear them, nay, I will not pity. And He cried into mine ears with a loud voice, saying, The vengeance of this city is at hand; and each one had vessels of extermination in his hand. And, behold, six men were coming toward the way of the high gate which was looking toward the north, and each one’s double-axe of dispersion was in his hand: and one man in the midst of them, clothed with a garment reaching to the feet,[^1369] and a girdle of sapphire about his loins: and they entered, and took their stand close to the brazen altar. And the glory of the God of Israel, which was over the house, in the open court of it,[^1370] ascended from the cherubim: and the Lord called the man who was clothed with the garment reaching to the feet, who had upon his loins the girdle; and said unto him, Pass through the midst of Jerusalem, and write the sign Tau[^1371] on the foreheads of the men who groan and grieve over all the enormities which are done in their midst. And while these things were doing, He said unto an hearer,[^1372] Go ye after him into the city, and cut short; and spare not with your eyes, and pity not elder or youth or virgin; and little ones and women slay ye all, that they may be thoroughly wiped away; but all upon whom is the sign Tau approach ye not; and begin with my saints.”[^1373] Now the mystery of this “sign” was in various ways predicted; (a “sign”) in which the foundation of life was forelaid for mankind; (a “sign”) in which the Jews were not to believe: just as Moses beforetime kept on announcing in Exodus,[^1374] saying, “Ye shall be ejected from the land into which ye shall enter; and in those nations ye shall not be able to rest: and there shall be instability of the print[^1375] of thy foot: and God shall give thee a wearying heart, and a pining soul, and failing eyes, that they see not: and thy life shall hang on the tree[^1376] before thine eyes; and thou shalt not trust thy life.”" },
  { t = "note", id = "1364", text = "Sæculo." },
  { t = "note", id = "1365", text = "Comp. Isa. lxi. 2." },
  { t = "note", id = "1366", text = "Or possibly, simply, “sealed”—obsignatus." },
  { t = "note", id = "1367", text = "Inter mediam elam et inter medium altaris: i.e., probably =\"between the porch and the altar,” as the Eng. ver. has." },
  { t = "note", id = "1368", text = "So Oehler points, and Tischendorf in his edition of the LXX. points not very differently. I incline to read: “Because they have filled up the measure of their impieties, and, behold (are) themselves, as it were, grimacing, I will,” etc." },
  { t = "note", id = "1369", text = "Comp. Rev. i. 13." },
  { t = "note", id = "1370", text = "“Quæ fuit super eam” (i.e. super domum) “in subdivali domûs” is Oehler’s reading; but it differs from the LXX." },
  { t = "note", id = "1371", text = "The ms. which Oehler usually follows omits “Tau;” so do the LXX." },
  { t = "note", id = "1372", text = "Et in his dixit ad audientem. But the LXX. reading agrees almost *verbatim* with the Eng. ver." },
  { t = "note", id = "1373", text = "Ezek. viii. 12–ix. 6 (especially in the LXX.). Comp. *adv. Marc.* l. iii. c. xxii. But our author differs considerably even from the LXX." },
  { t = "note", id = "1374", text = "Or rather in Deuteronomy. See xxviii. 65 sqq." },
  { t = "note", id = "1375", text = "Or, “sole.”" },
  { t = "note", id = "1376", text = "In ligno. There are no such words in the LXX. If the words be retained, “*thy life*” will mean Christ, who is called “our Life” in Col. iii. 4. See also John i. 4; xiv. 6; xi. 25. And so, again, “Thou shalt not trust (or believe) *thy life*” would mean, “Thou shalt not believe Christ.”" },
  { t = "p", text = "And so, since prophecy has been fulfilled through His advent—that is, through the nativity, which we have above commemorated, and the passion, which we have evidently explained—that is the reason withal why Daniel said, “Vision and prophet *were sealed*;” because Christ is the “signet” of all prophets, fulfilling all that had in days bygone been announced concerning Him: for, since His advent and personal passion, there is no longer “vision” or “prophet;” whence most emphatically he says that His advent “*seals* vision and prophecy.” And thus, by showing “the number of the years, and the time of the lxii and an half fulfilled hebdomads,” we have proved that at that specified time Christ came, that is, was born; and, (by showing the time) of the “seven and an half hebdomads,” which are subdivided so as to be cut off from the former hebdomads, within which times we have shown Christ to have suffered, and by the consequent conclusion of the “lxx hebdomads,” and the extermination of the city, (we have proved) that “sacrifice and unction” thenceforth cease." },
  { t = "p", text = "Sufficient it is thus far, on these points, to have meantime traced the course of the ordained path of Christ, by which He is proved to be such as He used to be announced, even on the ground of that agreement of Scriptures, which has enabled us to speak out, in opposition to the Jews, on the ground[^1377] of the prejudgment of the major part. For let them not question or deny the writings we produce; that the fact also that things which were foretold as destined to happen *after* Christ are being recognised as fulfilled may make it impossible for them to deny (these writings) to be on a par with divine Scriptures. Else, unless He were come *after* whom the things which were wont to be announced had to be accomplished, would such as have been completed be proved?[^1378]" },
  { t = "note", id = "1377", text = "Or, “in accordance with.”" },
  { t = "note", id = "1378", text = "i.e., Would they have happened? and, *by* happening, have been their own proof?" },
]

[[section]]
id = "further-proofs-from-the-calling-of-the"
title = "Further Proofs from the Calling of the Gentiles."
level = 1
blocks = [
  { t = "p", text = "Chapter XII.—Further Proofs from the Calling of the Gentiles." },
  { t = "p", text = "Look at the universal nations thenceforth emerging from the vortex of human error to the Lord God the Creator and His Christ; and if you dare to deny that this was prophesied, forthwith occurs to you the promise of the Father in the Psalms, which says, “My Son art Thou; to-day have I begotten Thee. Ask of Me, and I will give Thee Gentiles *as* Thine heritage, and *as* Thy possession *the* bounds of the earth.”[^1379] For you will not be able to affirm that “son” to be David rather than Christ; or the “bounds of the earth” to have been promised rather to David, who reigned within the single (country of) Judea, than to Christ, who has already taken captive the whole orb with the faith of His gospel; as He says through Isaiah: “Behold, I have given Thee for a covenant[^1380] of my family, for a light of Gentiles, that Thou mayst open the eyes of the blind”—of course, such as err—“to outloose from bonds the bound”—that is, to free them from sins—“and from the house of prison”—that is, of death—“such as sit in darkness”[^1381]—of ignorance, to wit. And if these blessings accrue through Christ, they will not have been prophesied of another than Him through whom we consider them to have been accomplished.[^1382]" },
  { t = "note", id = "1379", text = "Ps. ii. 7, 8." },
  { t = "note", id = "1380", text = "Dispositionem; Gr. διαθήκην." },
  { t = "note", id = "1381", text = "Isa. xlii. 6, 7, comp. lxi. 1; Luke iv. 14–18." },
  { t = "note", id = "1382", text = "Comp. Luke ii. 25–33." },
]

[[section]]
id = "argument-from-the-destruction-of-jerusalem-and"
title = "Argument from the Destruction of Jerusalem and Desolation of Judea."
level = 1
blocks = [
  { t = "p", text = "Chapter XIII.—Argument from the Destruction of Jerusalem and Desolation of Judea." },
  { t = "p", text = "Therefore, since the sons of Israel affirm that we err in receiving the Christ, who is already come, let us put in a demurrer against them out of the Scriptures themselves, to the effect that the Christ who was the theme of prediction *is* come; albeit by the times of Daniel’s prediction we *have* proved that the Christ is come already who was the theme of announcement. Now it behoved Him to be born in Bethlehem of Judah. For thus it is written in the prophet: “And thou, Bethlehem, are not the least in the leaders of Judah: for out of thee shall issue a Leader who shall feed my People Israel.”[^1383] But if hitherto he has not been born, what “leader” was it who was thus announced as to proceed from the tribe of Judah, out of Bethlehem? For it behoves him to proceed from the tribe of Judah and from Bethlehem. But we perceive that *now* none of the race of Israel has remained in Bethlehem; and (so it has been) ever since the interdict was issued forbidding any one of the Jews to linger in the confines of the very district, in order that this prophetic utterance also should be perfectly fulfilled: “Your land is desert, your cities burnt up by fire,”—that is, (he is foretelling) what *will have happened* to them in time of war “your region strangers shall eat up in your sight, and it shall be desert and subverted by alien peoples.”[^1384] And in another place it is thus said through the prophet: “The King with *His* glory ye shall see,”—that is, Christ, doing deeds of power in the glory of God the Father;[^1385] “and your eyes shall see the land from afar,”[^1386]—which is what you do, being prohibited, in reward of your deserts, since the storming of Jerusalem, to enter into your land; it is permitted you merely to see it with your eyes from afar: “your soul,” he says, “shall meditate terror,”[^1387]—namely, at the time when they suffered the ruin of themselves.[^1388] How, therefore, will a “leader” be born from Judea, and how far will he “proceed from Bethlehem,” as the divine volumes of the prophets do plainly announce; since none at all is left there to this day of (the house of) Israel, of whose stock Christ could be born?" },
  { t = "note", id = "1383", text = "Mic. v. 2; Matt. ii. 3–6. Tertullian’s Latin agrees rather with the Greek of St. Matthew than with the LXX." },
  { t = "note", id = "1384", text = "See Isa. i. 7." },
  { t = "note", id = "1385", text = "Comp. John v. 43; x. 37, 38." },
  { t = "note", id = "1386", text = "Isa. xxxiii. 17." },
  { t = "note", id = "1387", text = "Isa. xxxiii. 18." },
  { t = "note", id = "1388", text = "Comp. the “*failing eyes*” in the passage from Deuteronomy given in c. xi., if “eyes” is to be taken as the subject here. If not, we have another instance of the slipshod writing in which this treatise abounds." },
  { t = "p", text = "Now, if (according to the Jews) He is hitherto not come, when He begins to come whence will He be anointed?[^1389] For the Law enjoined that, in captivity, it was not lawful for the unction of the royal chrism to be compounded.[^1390] But, if there is no longer “unction” *there*[^1391] as Daniel prophesied (for he says, “Unction shall be exterminated”), it follows that *they*[^1392] no longer have it, because neither have they a *temple* where was the “horn”[^1393] from which kings were wont to be anointed. If, then, there is no unction, whence shall be anointed the “leader” who shall be born in Bethlehem? or how shall he proceed “from Bethlehem,” seeing that of the seed of Israel none at all exists in Bethlehem." },
  { t = "note", id = "1389", text = "As His name “Christ” or “Messiah” implies." },
  { t = "note", id = "1390", text = "Comp. Ex. xxx. 22–33." },
  { t = "note", id = "1391", text = "i.e., in Jerusalem or Judea." },
  { t = "note", id = "1392", text = "The Jews." },
  { t = "note", id = "1393", text = "Comp. 1 Kings (3 Kings in LXX.) i. 39, where the Eng. ver. has “*an* horn;” the LXX. τὸ κέρας, “*the* horn;” which at that time, of course, was in David’s tabernacle (2 Sam.—2 Kings in LXX.—vi. 17,) for “temple” there was yet none." },
  { t = "p", text = "A second time, in fact, let us show that Christ is already come, (as foretold) through the prophets, and has suffered, and is already received back in the heavens, and thence is to come accordingly as the predictions prophesied. For, after His advent, we read, according to Daniel, that the city itself had to be exterminated; and we recognise that so it has befallen. For the Scripture says thus, that “the city and the holy place are simultaneously exterminated together with *the leader*,”[^1394]—undoubtedly (that Leader) who was to proceed “from Bethlehem,” and from the tribe of “Judah.” Whence, again, it is manifest that “the city must simultaneously be exterminated” at the time when its “Leader” had to suffer in it, (as foretold) through the Scriptures of the prophets, who say: “I have outstretched my hands the whole day unto a People contumacious and gainsaying Me, who walketh in a way not good, but after their own sins.”[^1395] And in the Psalms, *David* says: “They exterminated my hands and feet: they counted all my bones; they themselves, moreover, contemplated and saw me, and in my thirst slaked me with vinegar.”[^1396] These things *David* did not suffer, so as to seem justly to have spoken of himself; but the Christ who was crucified. Moreover, the “hands and feet,” are not “exterminated,”[^1397] except His who is suspended on a “tree.” Whence, again, David said that “the Lord would reign *from the tree*:”[^1398] for elsewhere, too, the prophet predicts the fruit of this “tree,” saying “The earth hath given her blessings,”[^1399]—of course that virgin-earth, not yet irrigated with rains, nor fertilized by showers, out of which man was of yore first formed, out of which now Christ through the flesh has been born of a virgin; “and *the tree*,”[^1400] he says, “hath brought his fruit,”[^1401]—not that “tree” in paradise which yielded death to the protoplasts, but the “tree” of the passion of Christ, whence life, hanging, was by you not believed![^1402] For this “tree” in a mystery,[^1403] it was of yore wherewith Moses sweetened the bitter water; whence the People, which was perishing of thirst in the desert, drank and revived;[^1404] just as we do, who, drawn out from the calamities of the heathendom[^1405] in which we were tarrying perishing with thirst (that is, deprived of the divine word), drinking, “by the faith which is on Him,”[^1406] the baptismal water of the “tree” of the passion of Christ, have revived,—a faith from which Israel has fallen away, (as foretold) through Jeremiah, who says, “Send, and ask exceedingly whether such things have been done, whether nations will change their gods (and these are not gods!). But My People hath changed their glory: whence no profit shall accrue to them: the heaven turned pale thereat” (and when did it turn pale? undoubtedly when Christ suffered), “and shuddered,” he says, “most exceedingly;”[^1407] and “the sun grew dark at mid-day:”[^1408] (and when did it “shudder exceedingly” except at the passion of Christ, when the earth also trembled to her centre, and the veil of the temple was rent, and the tombs were burst asunder?[^1409] “because these two evils hath My People done; Me,” He says, “they have quite forsaken, the fount of water of life,[^1410] and they have digged for themselves worn-out tanks, which will not be able to contain water.” Undoubtedly, by not receiving Christ, the “fount of water of life,” they have begun to have “worn-out tanks,” that is, synagogues for the use of the “dispersions of the Gentiles,”[^1411] in which the Holy Spirit no longer lingers, as for the time past He was wont to tarry in the temple before the advent of Christ, who is the true temple of God. For, that they should withal suffer this thirst of the Divine Spirit, the prophet Isaiah had said, saying: “Behold, they who serve Me shall eat, but ye shall be hungry; they who serve Me shall drink, but ye shall thirst, and from general tribulation of spirit shall howl: for ye shall transmit your name for a satiety to Mine elect, but you the Lord shall slay; but for them who serve Me shall be named a new name, which shall be blessed in the lands.”[^1412]" },
  { t = "note", id = "1394", text = "Dan. ix. 26." },
  { t = "note", id = "1395", text = "See Isa. lxv. 2; Rom. x. 21." },
  { t = "note", id = "1396", text = "Ps. xxii. 16, 17 (xxi. 17, 18, in LXX.), and lxix. 21 (lxviii. 22 in LXX.)." },
  { t = "note", id = "1397", text = "i.e., displaced, dislocated." },
  { t = "note", id = "1398", text = "See c. x. above." },
  { t = "note", id = "1399", text = "See Ps. lxvii. 6 (lxvi. 7 in LXX.), lxxxv. 12 (lxxxiv. 13 in LXX.)." },
  { t = "note", id = "1400", text = "“Lignum,” as before." },
  { t = "note", id = "1401", text = "See Joel ii. 22." },
  { t = "note", id = "1402", text = "See c. xi. above, and the note there." },
  { t = "note", id = "1403", text = "Sacramento." },
  { t = "note", id = "1404", text = "See Ex. xv. 22–26." },
  { t = "note", id = "1405", text = "Sæculi." },
  { t = "note", id = "1406", text = "See Acts xxvi. 18, *ad fin*." },
  { t = "note", id = "1407", text = "See Jer. ii. 10–12." },
  { t = "note", id = "1408", text = "See Amos viii. 9, as before, in c.x." },
  { t = "note", id = "1409", text = "See Matt. xxvii. 45, 50–52; Mark xv. 33, 37, 38, Luke xxiii. 44, 45." },
  { t = "note", id = "1410", text = "ὑδατος ζωῆς in the LXX. here (ed. Tischendorf, who quotes the Cod. Alex. as reading, however, ὑδατος ζῶντος). Comp. Rev. xxii. 1, 17, and xxi. 6; John vii. 37–39. (The reference, it will be seen, is still to Jer. ii. 10–13; but the writer has mixed up words of Amos therewith.)" },
  { t = "note", id = "1411", text = "Comp. The τὴν διασπορὰν τῶν ῾Ελλήνων of John vii. 35; and see 1 Pet. i. 1." },
  { t = "note", id = "1412", text = "See Isa. lxv. 13–16 in LXX." },
  { t = "p", text = "Again, the mystery of this “tree”[^1413] we read as being celebrated even in the Books of the Reigns. For when the sons of the prophets were cutting “wood”[^1414] with axes on the bank of the river Jordan, the iron flew off and sank in the stream; and so, on Elisha[^1415] the prophet’s coming up, the sons of the prophets beg of him to extract from the stream the iron which had sunk. And accordingly Elisha, having taken “wood,” and cast it into that place where the iron had been submerged, forthwith it rose and swam on the surface,[^1416] and the “wood” sank, which the sons of the prophets recovered.[^1417] Whence they understood that Elijah’s spirit was presently conferred upon him.[^1418] What is more manifest than the mystery[^1419] of this “wood,”—that the obduracy of this world[^1420] had been sunk in the profundity of error, and is freed in baptism by the “wood” of Christ, that is, of His passion; in order that what had formerly perished through the “tree” in Adam, should be restored through the “tree” in Christ?[^1421] while we, of course, who have succeeded to, and occupy, the room of the prophets, at the present day sustain in the world[^1422] that treatment which the prophets always suffered on account of divine religion: for some they stoned, some they banished; more, however, they delivered to mortal slaughter,[^1423]—a fact which they cannot deny.[^1424]" },
  { t = "note", id = "1413", text = "Hujus ligni sacramentum." },
  { t = "note", id = "1414", text = "Lignum." },
  { t = "note", id = "1415", text = "Helisæo. Comp. Luke iv. 27." },
  { t = "note", id = "1416", text = "The careless construction of leaving the nominative “Elisha” with no verb to follow it is due to the original, not to the translator." },
  { t = "note", id = "1417", text = "See 2 Kings vi. 1–7 (4 Kings vi. 1–7 in LXX). It is not said, however, that the wood sank." },
  { t = "note", id = "1418", text = "This conclusion they had drawn before, and are not said to have drawn, consequently, upon this occasion. See 2 Kings (4 Kings in LXX.) ii. 16." },
  { t = "note", id = "1419", text = "Sacramento." },
  { t = "note", id = "1420", text = "“Sæculi,” or perhaps here “heathendom.”" },
  { t = "note", id = "1421", text = "For a similar argument, see Anselm’s *Cur Deus Homo?* l. i. c. iii. *sub fin*." },
  { t = "note", id = "1422", text = "Sæculo." },
  { t = "note", id = "1423", text = "Mortis necem." },
  { t = "note", id = "1424", text = "Comp. Acts vii. 51, 52; Heb. xi. 32–38." },
  { t = "p", text = "This “wood,” again, Isaac the son of Abraham personally carried for his own sacrifice, when God had enjoined that he should be made a victim to Himself. But, because these had been mysteries[^1425] which were being kept for perfect fulfilment in the times of Christ, Isaac, on the one hand, with his “wood,” was reserved, the ram being offered which was caught by the horns in the bramble;[^1426] Christ, on the other hand, in His times, carried His “wood” on His own shoulders, adhering to the horns of the cross, with a thorny crown encircling His head. For Him it behoved to be made a sacrifice on behalf of all Gentiles, who “was led as a sheep for a victim, and, like a lamb voiceless before his shearer, so opened not His mouth” (for He, when Pilate interrogated Him, spake nothing[^1427]); for “in humility His judgment was taken away: His nativity, moreover, who shall declare?” Because no one at all of human beings was conscious of the nativity of Christ at His conception, when as the Virgin Mary was found pregnant by the word of God; and because “His life was to be taken from the land.”[^1428] Why, accordingly, after His resurrection from the dead, which was effected on the third day, did the heavens receive Him back? It was in accordance with a prophecy of Hosea, uttered on this wise: “Before daybreak shall they arise unto Me, saying, Let us go and return unto the Lord our God, because Himself will draw *us* out and free us. After a space of two days, on the third day”[^1429]—which is His glorious resurrection—He received back into the heavens (whence withal the Spirit Himself had come to the Virgin[^1430]) Him whose nativity and passion alike the Jews have failed to acknowledge. Therefore, since the Jews still contend that the Christ is not yet come, whom we have in so many ways approved[^1431] to be come, let the Jews recognise their own fate,—a fate which they were constantly foretold as destined to incur after the advent of the Christ, on account of the impiety with which they despised and slew Him. For first, from the day when, according to the saying of Isaiah, “a man cast forth his abominations of gold and silver, which they made to adore with vain and hurtful (rites),”[^1432]—that is, ever since we Gentiles, with our breast doubly enlightened through Christ’s truth, cast forth (let the Jews see it) our idols,—what follows has likewise been fulfilled. For “the Lord of Sabaoth *hath taken away*, among the Jews from Jerusalem,” among the other things named, “the wise architect” too,[^1433] who builds the church, God’s temple, and the holy city, and the house of the Lord. For thenceforth God’s grace desisted (from working) among them. And “the clouds were commanded not to rain a shower upon the vineyard of Sorek,”[^1434]—the clouds being celestial benefits, which were commanded not to be forthcoming to the house of Israel; for it “had borne *thorns*”—whereof that house of Israel had wrought a crown for Christ—and not “*righteousness*, but a *clamour*,”—the clamour whereby it had extorted His surrender to the cross.[^1435] And thus, the former gifts of grace being withdrawn, “the law and the prophets were until John,”[^1436] and the fishpool of Bethsaida[^1437] until the advent of Christ: thereafter it ceased curatively to remove from Israel infirmities of health; since, as the result of their perseverance in their frenzy, the name of the Lord was through them blasphemed, as it is written: “On your account the name of God is blasphemed among the Gentiles:”[^1438] for it is from them that the infamy (attached to that name) began, and (was propagated during) the interval from Tiberius to Vespasian. And because they had committed these crimes, and had failed to understand that Christ “was to be found”[^1439] in “the time of their visitation,”[^1440] their land has been made “desert, and their cities utterly burnt with fire, while strangers devour their region in their sight: the daughter of Sion is derelict, as a watch-tower in a vineyard, or as a shed in a cucumber garden,”—ever since the time, to wit, when “Israel knew not” the Lord, and “the People understood Him not;” but rather “quite forsook, and provoked unto indignation, the Holy One of Israel.”[^1441] So, again, we find a *conditional* threat of *the sword*: “If ye shall have been unwilling, and shall not have been obedient, the glaive shall eat you up.”[^1442] Whence we prove that *the sword* was Christ, by not hearing whom they perished; who, again, in the Psalm, demands of the Father their dispersion, saying, “Disperse them in Thy power;”[^1443] who, withal, again through Isaiah prays for their *utter burning*. “On My account,” He says, “have these things happened to you; in anxiety shall ye sleep.”[^1444]" },
  { t = "note", id = "1425", text = "Sacramenta." },
  { t = "note", id = "1426", text = "See Gen. xxii. 1–14." },
  { t = "note", id = "1427", text = "See Matt. xxvii. 11–14; Mark xv. 1–5; John xix. 8–12." },
  { t = "note", id = "1428", text = "See Isa. liii. 7, 8." },
  { t = "note", id = "1429", text = "Oehler refers to Hos. vi. 1; add 2 (*ad init*.)." },
  { t = "note", id = "1430", text = "See Luke i. 35." },
  { t = "note", id = "1431", text = "For this sense of the word “approve,” comp. Acts ii. 22, Greek and English, and Phil. i. 10, Greek and English." },
  { t = "note", id = "1432", text = "See Isa. ii. 20." },
  { t = "note", id = "1433", text = "See Isa. iii. 1, 3; and comp. 1 Cor. iii. 10; Eph. ii. 20, 21; 1 Pet. ii. 4–8, and many similar passages." },
  { t = "note", id = "1434", text = "Comp. Isa. v. 2 in LXX. and Lowth." },
  { t = "note", id = "1435", text = "Comp. Isa. v. 6, 7, with Matt. xxvii. 20–25, Mark xv. 8–15, Luke xxiii. 13–25, John xix. 12–16." },
  { t = "note", id = "1436", text = "Matt. xi. 13; Luke xvi. 16." },
  { t = "note", id = "1437", text = "See John v. 1–9; and comp. *de Bapt*. c. v., and the note there." },
  { t = "note", id = "1438", text = "See Isa. lii. 5; Ezek. xxxvi. 20, 23; Rom. ii. 24. (The passage in Isaiah in the LXX. agrees with Rom. ii. 24.)" },
  { t = "note", id = "1439", text = "See Isa. lv. 6, 7." },
  { t = "note", id = "1440", text = "See Luke xix. 41–44." },
  { t = "note", id = "1441", text = "See Isa. i. 7, 8, 4." },
  { t = "note", id = "1442", text = "Isa. i. 20." },
  { t = "note", id = "1443", text = "See Ps. lix. 11 (lviii. 12 in LXX.)" },
  { t = "note", id = "1444", text = "See Isa. l. 11 in LXX." },
  { t = "p", text = "Since, therefore, the Jews were predicted as destined to suffer these calamities *on Christ’s account*, and we find that they *have* suffered them, and see them sent into dispersion and abiding in it, manifest it is that it is on Christ’s account that these things *have* befallen the Jews, the sense of the Scriptures harmonizing with the issue of events and of the order of the times. Or else, if Christ is not yet come, on whose account they were predicted as destined thus to suffer, when He *shall have* come it follows that they *will* thus suffer. And where will then be a daughter of Sion to be derelict, who *now* has no existence? where the cities to be exust, which are already exust and in heaps? where the dispersion of a race which is now in exile? Restore to Judea the condition which Christ is to find; and (then, if you will), contend that some other (Christ) is coming." },
]

[[section]]
id = "conclusion-clue-to-the-error-of-the"
title = "Conclusion. Clue to the Error of the Jews."
level = 1
blocks = [
  { t = "p", text = "Chapter XIV.—Conclusion. Clue to the Error of the Jews." },
  { t = "p", text = "Learn now (over and above the immediate question) the clue to your error. We affirm, *two* characters of the Christ demonstrated by the prophets, and as many *advents* of His forenoted: one, in humility (of course the first), when He has to be led “as a sheep for a victim; and, as a lamb voiceless before the shearer, so He opened not His mouth,” not even in His aspect comely. For “we have announced,” says *the prophet*, “concerning Him, (He is) as a little child, as a root in a thirsty land; and there was not in Him attractiveness or glory. And we saw Him, and He had not attractiveness or grace; but His mien was unhonoured, deficient in comparison of the sons of men,”[^1445] “a man *set* in the plague,[^1446] and knowing how to bear infirmity:” to wit as having been set by the Father “for a stone of offence,”[^1447] and “made a little lower” by Him “than angels,”[^1448] He pronounces Himself “a worm, and not a man, an ignominy of man, and *the* refuse of *the* People.”[^1449] Which evidences of ignobility suit the First Advent, just as those of sublimity do the Second; when He shall be made no longer “a stone of offence nor a rock of scandal,” but “the highest corner-stone,”[^1450] after reprobation (on earth) taken up (into heaven) and raised sublime for the purpose of consummation,[^1451] and that “rock”—so we must admit—which is read of in Daniel as forecut from a mount, which shall crush and crumble the image of secular kingdoms.[^1452] Of which second advent of the same (Christ) Daniel has said: “And, behold, as it were a Son of man, coming with the clouds of the heaven, came unto the Ancient of days, and was present in His sight; and they who were standing by led (Him) unto Him. And there was given Him royal power; and all nations of the earth, according to their race, and all glory, shall serve Him: and His power *is* eternal, which shall not be taken away, and His kingdom *one* which shall not be corrupted.”[^1453] Then, assuredly, is He to have an honourable mien, and a grace not “deficient more than the sons of men;” for (He will then be) “blooming in beauty in comparison with the sons of men.”[^1454] “Grace,” says *the Psalmist*, “hath been outpoured in Thy lips: wherefore God hath blessed Thee unto eternity. Gird Thee Thy sword around Thy thigh, most potent in Thy bloom and beauty!”[^1455] while the Father withal afterwards, after making Him somewhat lower than angels, “crowned Him with glory and honour and subjected all *things* beneath His feet.”[^1456] And then shall they “learn to know Him whom they pierced, and shall beat their breasts tribe by tribe;”[^1457] of course because in days bygone they did *not* know Him when conditioned in the humility of human estate. Jeremiah says: “He is a human being, and who will learn to know Him?”[^1458] because, “His nativity,” says Isaiah, “who shall declare?” So, too, in Zechariah, in His own person, nay, in the very mystery[^1459] of His name withal, the most true Priest of the Father, His own[^1460] Christ, is delineated in a twofold garb with reference to the two advents.[^1461] First, He was clad in “sordid attire,” that is, in the indignity of passible and mortal flesh, when the devil, withal, was opposing himself to Him—the instigator, to wit, of Judas the traitor[^1462]—who even after His baptism had tempted Him. In the next place, He was stripped of His former sordid raiment, and adorned with a garment down to the foot, and with a turban and a clean mitre, that is, (with the garb) of the second advent; since He is demonstrated as having attained “glory and honour.” Nor will you be able to say that the man (there depicted) is “the son of Jozadak,”[^1463] who was never at all clad in a sordid garment, but was always adorned with the sacerdotal garment, nor ever deprived of the sacerdotal function. But the “Jesus”[^1464] there alluded to is Christ, the Priest of God the most high Father; who at His first advent came in humility, in human form, and passible, even up to the period of His passion; being Himself likewise made, through all (stages of suffering) a victim for us all; who after His resurrection was “clad with a garment down to the foot,”[^1465] and named the Priest of God the Father unto eternity.[^1466] So, again, I will make an interpretation of the two goats which were habitually offered on the fast-day.[^1467] Do not they, too, point to each successive stage in the character of the Christ who is already come? A pair, on the one hand, and consimilar (they were), because of the identity of the Lord’s general appearance, inasmuch as He is not to come in some other form, seeing that He has to be recognised by those by whom He was once hurt. But the one of them, begirt with scarlet, amid cursing and universal spitting, and tearing, and piercing, was cast away by the People outside the city into perdition, marked with manifest tokens of Christ’s passion; who, after being begirt with scarlet garment, and subjected to universal spitting, and afflicted with all contumelies, was crucified outside the city.[^1468] The other, however, offered for sins, and given as food *to the priests merely* of the temple,[^1469] gave signal evidences of the second appearance; in so far as, after the expiation of all sins, the priests of the spiritual temple, that is, of the church, were to enjoy[^1470] a spiritual public distribution (as it were) of the Lord’s grace, while all others are fasting from salvation." },

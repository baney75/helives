[[section]]
id = "chapter-1"
title = "Chapter I. Occasion of Writing. Relative Position of Jews and Gentiles Illustrated."
level = 1
blocks = [
  { t = "h", text = "VII." },
  { t = "p", text = "An Answer to the Jews.[^1126]" },
  { t = "note", id = "1126", text = "[This treatise was written while our author was a Catholic. This seems to me the best supported of the theories concerning it. Let us accept Pamelius, for once and date it a.d. 198. Dr. Allix following Baronius, will have it as late as a.d. 208. Neander thinks the work, after the quotation from Isaiah in the beginning of chapter ninth, *is not our author’s*, but was finished by another hand, clumsily annexing what is said on the same chapter of Isaiah in the Third Book against Marcion. It is only slightly varied. Bp. Kaye admits the very striking facts instanced by Neander, in support of this theory, but demolishes, with a word any argument drawn from thence that the genuine work was written after the author’s lapse. This treatise is sufficiently annotated by Thelwall, and covers ground elsewhere gone over in this Series. My own notes are therefore very few.]" },
  { t = "h", text = "[Translated by the Rev. S. Thelwall.]" },
  { t = "p", text = "Chapter I.—Occasion of Writing. Relative Position of Jews and Gentiles Illustrated." },
  { t = "p", text = "It happened very recently a dispute was held between a Christian and a Jewish proselyte. Alternately with contentious cable they each spun out the day until evening. By the opposing din, moreover, of some partisans of the individuals, truth began to be overcast by a sort of cloud. It was therefore our pleasure that that which, owing to the confused noise of disputation, could be less fully elucidated point by point, should be more carefully looked into, and that the pen should determine, for reading purposes, the questions handled." },
  { t = "p", text = "For the occasion, indeed, of claiming Divine grace even for the Gentiles derived a pre-eminent fitness from this fact, that the man who set up to vindicate God’s Law as his own was of the Gentiles, and not a Jew “of the stock of the Israelites.”[^1127] For this fact—that Gentiles are admissible to God’s Law—is enough to prevent Israel from priding himself on the notion that “the Gentiles are accounted as a little drop of a bucket,” or else as “dust out of a threshing-floor:”[^1128] although we have God Himself as an adequate engager and faithful promiser, in that He promised to Abraham that “in his seed should be blest all nations of the earth;”[^1129] and that[^1130] out of the womb of Rebecca “two peoples and two nations were about to proceed,”[^1131]—of course those of the Jews, that is, of Israel; and of the Gentiles, that is ours. Each, then, was called a *people* and a *nation*; lest, from the nuncupative appellation, any should dare to claim for himself the privilege of grace. For God ordained “two peoples and two nations” as about to proceed out of the womb of one woman: nor did grace[^1132] make distinction in the nuncupative appellation, but in the order of birth; to the effect that, which ever was to be prior in proceeding from the womb, should be subjected to “the less,” that is, the posterior. For thus unto Rebecca did God speak: “Two nations are in thy womb, and two peoples shall be divided from thy bowels; and people shall overcome people, and the greater shall serve the less.”[^1133] Accordingly, since the *people* or *nation* of the Jews is anterior in time, and “greater” through the grace of primary favour in the Law, whereas ours is understood to be “less” in the age of times, as having in the last era of the world[^1134] attained the knowledge of divine mercy: beyond doubt, through the edict of the divine utterance, the *prior* and “greater” people—that is, the Jewish—must necessarily serve the “less;” and the “less” people—that is, the Christian—overcome the “greater.” For, withal, according to the memorial records of the divine Scriptures, the *people* of the Jews—that is, the more ancient—quite forsook God, and did degrading service to idols, and, abandoning the Divinity, was surrendered to images; while “the people” said to Aaron, “Make us gods to go before us.”[^1135] And when the gold out of the necklaces of the women and the rings of the men had been wholly smelted by fire, and there had come forth a calf-like head, to this figment Israel with one consent (abandoning God) gave honour, saying, “These are the gods who brought us from the land of Egypt.”[^1136] For thus, in the later times in which kings were governing them, did they again, in conjunction with Jeroboam, worship golden kine, and groves, and enslave themselves to Baal.[^1137] Whence is proved that they have ever been depicted, out of the volume of the divine Scriptures, as guilty of the crime of idolatry; whereas our “less”—that is, posterior—*people*, quitting the idols which formerly it used slavishly to serve, has been converted to the same God from whom Israel, as we have above related, had departed.[^1138] For thus has the “less”—that is, posterior—*people* overcome the “greater people,” while it attains the grace of divine favour, from which Israel has been divorced." },
  { t = "note", id = "1127", text = "Comp. Phil. iii. 5." },
  { t = "note", id = "1128", text = "See Isa. xl. 15: “dust of *the balance*,” Eng. Ver.; ῥοπὴ ζυγοῦ LXX. For the expression “dust out of a threshing-floor,” however, see Ps. i. 4, Dan. ii. 35." },
  { t = "note", id = "1129", text = "See Gen. xxii. 18; and comp. Gal. iii. 16, and the reference in both places." },
  { t = "note", id = "1130", text = "This promise may be said to have been given “to Abraham,” because (of course) he was still living at the time; as we see by comparing Gen. xxi. 5 with xxv. 7 and 26. See, too, Heb. xi. 9." },
  { t = "note", id = "1131", text = "Or, “nor did He make, by grace, a distinction.”" },
  { t = "note", id = "1132", text = "Or, “nor did He make, by grace, a distinction.”" },
  { t = "note", id = "1133", text = "See Gen. xxv. 21–23, especially in the LXX.; and comp. Rom. ix. 10–13." },
  { t = "note", id = "1134", text = "Sæculi." },
  { t = "note", id = "1135", text = "Ex. xxxii. 1, 23; Acts vii. 39, 40." },
  { t = "note", id = "1136", text = "Ex. xxxii. 4: comp. Acts vii. 38–41; 1 Cor. x. 7; Ps. cvi. 19–22." },
  { t = "note", id = "1137", text = "Comp. 1 Kings xii. 25–33; 2 Kings xvii. 7–17 (in LXX. 3 and 4 Kings). The Eng. ver. speaks of “calves;” the LXX. call them “heifers.”" },
  { t = "note", id = "1138", text = "Comp. 1 Thess. i. 9, 10." },
]

[[section]]
id = "the-law-anterior-to-moses"
title = "The Law Anterior to Moses."
level = 1
blocks = [
  { t = "p", text = "Chapter II.—The Law Anterior to Moses." },
  { t = "p", text = "Stand we, therefore, foot to foot, and determine we the sum and substance of the actual question within definite lists." },
  { t = "p", text = "For why should God, the founder of the universe, the Governor of the whole world,[^1139] the Fashioner of humanity, the Sower[^1140] of universal nations be believed to have given a law through Moses to one people, and not be said to have assigned it to all nations? For unless He had given it to all by no means would He have habitually permitted even proselytes out of the nations to have access to it. But—as is congruous with the goodness of God, and with His equity, as the Fashioner of mankind—He gave to all nations the selfsame law, which at definite and stated times He enjoined should be observed, when He willed, and through whom He willed, and as He willed. For in the beginning of the world He gave to Adam himself and Eve a law, that they were not to eat of the fruit of the tree planted in the midst of paradise; but that, if they did contrariwise, by death they were to die.[^1141] Which law had continued enough for them, had it been kept. For in this law given to Adam we recognise in embryo[^1142] all the precepts which afterwards sprouted forth when given through Moses; that is, Thou shalt love the Lord thy God from thy whole heart and out of thy whole soul; Thou shalt love thy neighbour as thyself;[^1143] Thou shalt not kill; Thou shalt not commit adultery; Thou shalt not steal; False witness thou shalt not utter; Honour thy father and mother; and, That which is another’s, shalt thou not covet. For the primordial law was given to Adam and Eve in paradise, as the womb of all the precepts of God. In short, if they had loved the Lord their God, they would not have contravened His precept; if they had habitually loved their neighbour—that is, themselves[^1144]—they would not have believed the persuasion of the serpent, and thus would not have committed murder upon themselves,[^1145] by falling[^1146] from immortality, by contravening God’s precept; from theft also they would have abstained, if they had not stealthily tasted of the fruit of the tree, nor had been anxious to skulk beneath a tree to escape the view of the Lord their God; nor would they have been made partners with the falsehood-asseverating devil, by believing him that they would be “like God;” and thus they would not have offended God either, as their Father, who had fashioned them from clay of the earth, as out of the womb of a mother; if they had not coveted another’s, they would not have tasted of the unlawful fruit." },
  { t = "note", id = "1139", text = "Mundi." },
  { t = "note", id = "1140", text = "Comp. Jer. xxxi. 27 (in LXX. it is xxxviii. 27); Hos. ii. 23; Zech. x. 9; Matt. xiii. 31–43." },
  { t = "note", id = "1141", text = "See Gen. ii. 16, 17; iii. 2, 3." },
  { t = "note", id = "1142", text = "Condita." },
  { t = "note", id = "1143", text = "Deut. vi. 4, 5; Lev. xix. 18; comp. Matt. xxii. 34–40; Mark xii. 28–34; Luke x. 25–28; and for the rest, Ex. xx. 12–17; Deut. v. 16–21; Rom. xiii. 9." },
  { t = "note", id = "1144", text = "Semetipsos. ? Each other." },
  { t = "note", id = "1145", text = "Semetipsos. ? Each other." },
  { t = "note", id = "1146", text = "Excidendo; or, perhaps, “by self-excision,” or “mutual excision.”" },
  { t = "p", text = "Therefore, in this general and primordial law of God, the observance of which, in the case of the tree’s fruit, He had sanctioned, we recognise *en*closed all the precepts specially of the posterior Law, which germinated when *dis*closed at their proper times. For the subsequent superinduction of a law is the work of the same Being who had before premised a precept; since it is His province withal subsequently to train, who had before resolved to form, righteous creatures. For what wonder if He extends a discipline who institutes it? if He advances who begins? In short, before the Law of Moses,[^1147] written in stone-tables, I contend that there was a law unwritten, which was habitually understood naturally, and by the fathers was habitually kept. For whence was Noah “found righteous,”[^1148] if in his case the righteousness of a natural law had not preceded? Whence was Abraham accounted “a friend of God,”[^1149] if not on the ground of equity and righteousness, (in the observance) of a natural law? Whence was Melchizedek named “priest of the most high God,”[^1150] if, before the priesthood of the Levitical law, there were not levites who were wont to offer sacrifices to God? For thus, after the above-mentioned patriarchs, was the Law given to Moses, at that (well-known) time after their exode from Egypt, after the interval and spaces of four hundred years. In fact, it was after Abraham’s “four hundred and thirty years”[^1151] that the Law was given. Whence we understand that God’s law was anterior even to Moses, and was not first (given) in Horeb, nor in Sinai and in the desert, but was more ancient; (existing) first in paradise, subsequently reformed for the patriarchs, and so again for the Jews, at definite periods: so that we are not to give heed to Moses’ Law as to the primitive law, but as to a subsequent, which at a definite period God has set forth to the Gentiles too and, after repeatedly promising so to do through the prophets, has reformed for the better; and has premonished that it should come to pass that, just as “the law was given through Moses”[^1152] at a definite time, so it should be believed to have been temporarily observed and kept. And let us not annul this power which God has, which reforms the law’s precepts answerably to the circumstances of the times, with a view to man’s salvation. In fine, let him who contends that the Sabbath is still to be observed as a balm of salvation, and circumcision on the eighth day because of the threat of death, teach us that, for the time past, righteous men kept the Sabbath, or practised circumcision, and were thus rendered “friends of God.” For if circumcision purges a man since God made Adam uncircumcised, why did He not circumcise him, even after his sinning, if circumcision purges? At all events, in settling him in paradise, He appointed one uncircumcised as colonist of paradise. Therefore, since God originated Adam uncircumcised, and inobservant of the Sabbath, consequently his offspring also, Abel, offering Him sacrifices, uncircumcised and inobservant of the Sabbath, was by Him commended; while He accepted[^1153] what he was offering in simplicity of heart, and reprobated the sacrifice of his brother Cain, who was not rightly dividing what he was offering.[^1154] Noah also, uncircumcised—yes, and inobservant of the Sabbath—God freed from the deluge.[^1155] For Enoch, too, most righteous man, uncircumcised and inobservant of the Sabbath, He translated from this world;[^1156] who did not first taste[^1157] death, in order that, being a candidate for eternal life,[^1158] he might by this time show us that we also may, without the burden of the law of Moses, please God. Melchizedek also, “the priest of the most high God,” uncircumcised and inobservant of the Sabbath, was chosen to the priesthood of God.[^1159] Lot, withal, the brother[^1160] of Abraham, proves that it was for the merits of righteousness, without observance of the law, that he was freed from the conflagration of the Sodomites.[^1161]" },
  { t = "note", id = "1147", text = "Or, “the Law written for Moses in stone-tables.”" },
  { t = "note", id = "1148", text = "Gen. vi. 9; vii. 1; comp. Heb. xi. 7." },
  { t = "note", id = "1149", text = "See Isa. xli. 8; Jas. ii. 23." },
  { t = "note", id = "1150", text = "Gen. xiv. 18, Ps. cx. (cix. in. LXX.) 4; Heb. v. 10, vii. 1–3, 10, 15, 17." },
  { t = "note", id = "1151", text = "Comp. Gen. xv. 13 with Ex. xii. 40–42 and Acts vii. 6." },
  { t = "note", id = "1152", text = "John i. 17." },
  { t = "note", id = "1153", text = "Or, “credited him with.”" },
  { t = "note", id = "1154", text = "Gen. iv. 1–7, especially in the LXX.; comp. Heb. xi. 4." },
  { t = "note", id = "1155", text = "Gen. vi. 18; vii. 23; 2 Pet. ii. 5." },
  { t = "note", id = "1156", text = "See Gen. v. 22, 24; Heb. xi. 5." },
  { t = "note", id = "1157", text = "Or, perhaps, “has not yet tasted.”" },
  { t = "note", id = "1158", text = "Æternitatis candidatus. Comp. *ad Ux*. l. i. c. vii., and note 3 there." },
  { t = "note", id = "1159", text = "See above." },
  { t = "note", id = "1160", text = "i.e., nephew. See Gen. xi. 31; xii. 5." },
  { t = "note", id = "1161", text = "See Gen. xix. 1–29; and comp. 2 Pet. ii. 6–9." },
]

[[section]]
id = "of-circumcision-and-the-supercession-of-the"
title = "Of Circumcision and the Supercession of the Old Law."
level = 1
blocks = [
  { t = "p", text = "Chapter III.—Of Circumcision and the Supercession of the Old Law." },
  { t = "p", text = "But Abraham, (you say,) was circumcised. Yes, but he pleased God before his circumcision;[^1162] nor yet did he observe the Sabbath. For he had “accepted”[^1163] circumcision; but such as was to be for “a sign” of that time, not for a prerogative title to salvation. In fact, subsequent patriarchs were uncircumcised, like Melchizedek, who, uncircumcised, offered to Abraham himself, already circumcised, on his return from battle, bread and wine.[^1164] “But again,” (you say) “the son of Moses would upon one occasion have been choked by an angel, if Zipporah,[^1165] had not circumcised the foreskin of the infant with a pebble; whence, “there is the greatest peril if any fail to circumcise the foreskin of his flesh.” Nay, but if circumcision altogether brought salvation, even Moses himself, in the case of his own son, would not have omitted to circumcise him on the eighth day; whereas it is agreed that Zipporah did it on the journey, at the compulsion of the angel. Consider we, accordingly, that one single infant’s compulsory circumcision cannot have prescribed to every people, and founded, as it were, a law for keeping this precept. For God, foreseeing that He was about to give this circumcision to the people of Israel for “a sign,” not for salvation, urges the circumcision of the son of Moses, their future leader, for this reason; that, since He had begun, through him, to give the People the precept of circumcision, the people should not despise it, from seeing this example (of neglect) already exhibited conspicuously in their leader’s son. For circumcision had to be given; but as “a sign,” whence Israel in the last time would have to be distinguished, when, in accordance with their deserts, they should be prohibited from entering the holy city, as we see through the words of the prophets, saying, “Your land is desert; your cities utterly burnt with fire; your country, in your sight, strangers shall eat up; and, deserted and subverted by strange peoples, the daughter of Zion shall be derelict, like a shed in a vineyard, and like a watchhouse in a cucumber-field, and as it were a city which is being stormed.”[^1166] Why so? Because the subsequent discourse of the prophet reproaches them, saying, “Sons have I begotten and upraised, but they have reprobated me;”[^1167] and again, “And if ye shall have outstretched hands, I will avert my face from you; and if ye shall have multiplied prayers, I will not hear you: for your hands are full of blood;”[^1168] and again, “Woe! sinful nation; a people full of sins; wicked sons; ye have quite forsaken God, and have provoked unto indignation the Holy One of Israel.”[^1169] This, therefore, was God’s foresight,—that of giving circumcision to Israel, for a sign whence they might be distinguished when the time should arrive wherein their above-mentioned deserts should prohibit their admission into Jerusalem: which circumstance, because it was to be, used to be announced; and, because we see it accomplished, is recognised by us. For, as the carnal circumcision, which was temporary, was in wrought for “a sign” in a contumacious people, so the spiritual has been given for salvation to an obedient people; while the prophet Jeremiah says, “Make a renewal for you, and sow not in thorns; be circumcised to God, and circumcise the foreskin of your heart:”[^1170] and in another place he says, “Behold, days shall come, saith the Lord, and I will draw up, for the house of Judah and for the house of Jacob,[^1171] a new testament; not such as I once gave their fathers in the day wherein I led them out from the land of Egypt.”[^1172] Whence we understand that the coming cessation of the former circumcision then given, and the coming procession of a new law (not such as He had already given to the fathers), are announced: just as Isaiah foretold, saying that in the last days the mount of the Lord and the house of God were to be manifest above the tops of the mounts: “And it shall be exalted,” he says, “above the hills; and there shall come over it all nations; and many shall walk, and say, Come, ascend we unto the mount of the Lord, and unto the house of the God of *Jacob*,”[^1173]—not of *Esau*, the former son, but of *Jacob*, the second; that is, of *our* “people,” whose “mount” is Christ, “præcised without concisors’ hands,[^1174] filling every land,” shown in the book of Daniel.[^1175] In short, the coming procession of a new law out of this “house of the God of Jacob” Isaiah in the ensuing words announces, saying, “For from Zion shall go out a law, and the word of the Lord out of Jerusalem, and shall judge among the nations,”—that is, among *us*, who have been called out of the nations,—“and they shall join to beat their glaives into ploughs, and their lances into sickles; and nations shall not take up glaive against nation, and they shall no more learn to fight.”[^1176] Who else, therefore, are understood but *we*, who, fully taught by the new law, observe these practices,—the old law being obliterated, the coming of whose abolition the action itself[^1177] demonstrates? For the wont of the old law was to avenge itself by the vengeance of the glaive, and to pluck out “eye for eye,” and to inflict retaliatory revenge for injury.[^1178] But the new law’s wont was to point to clemency, and to convert to tranquillity the pristine ferocity of “glaives” and “lances,” and to remodel the pristine execution of “war” upon the rivals and foes of the law into the pacific actions of “ploughing” and “tilling” the land.[^1179] Therefore as we have shown above that the coming cessation of the old law and of the carnal circumcision was declared, so, too, the observance of the new law and the spiritual circumcision has shone out into the voluntary obediences[^1180] of peace. For “a people,” he says, “whom I knew not hath served me; in obedience of the ear it hath obeyed me.”[^1181] Prophets made the announcement. But what is the “people” which was ignorant of God, but *ours*, who in days bygone knew not God? and who, in the hearing of the ear, gave heed to Him, but *we*, who, forsaking idols, have been converted to God? For Israel—who *had* been known to God, and who had by Him been “upraised”[^1182] in Egypt, and was transported through the Red Sea, and who in the desert, fed forty years with manna, was wrought to the semblance of eternity, and not contaminated with human passions,[^1183] or fed on this world’s[^1184] meats, but fed on “angel’s loaves”[^1185]—the manna—and sufficiently bound to God by His benefits—forgot his Lord and God, saying to Aaron: “Make us gods, to go before us: for that Moses, who ejected us from the land of Egypt, hath quite forsaken us; and what hath befallen him we know not.” And accordingly we, who “were not the people of God” in days bygone, have been made His people,[^1186] by accepting the new law above mentioned, and the new circumcision before foretold." },
  { t = "note", id = "1162", text = "See Gen. xii.–xv. compared with xvii. and Rom. iv." },
  { t = "note", id = "1163", text = "Acceperat. So Tertullian renders, as it appears to me, the ἔλαβε of St. Paul in Rom. iv. 11. q. v." },
  { t = "note", id = "1164", text = "There is, if the text be genuine, some confusion here. Melchizedek does not appear to have been, in any sense, “subsequent” to Abraham, for he probably was senior to him; and, moreover, Abraham does *not* appear to have been “already circumcised” *carnally* when Melchizedek met him. Comp. Gen. xiv. with Gen. xvii." },
  { t = "note", id = "1165", text = "Tertullian writes Seffora; the LXX. *in loco*, Σεπφώρα Ex. iv. 24–26, where the Eng. ver. says, “the Lord met him,” etc.; the LXX ἄγγελος Κυρίου." },
  { t = "note", id = "1166", text = "Isa. i. 7, 8. See c. xiii. *sub fin*." },
  { t = "note", id = "1167", text = "Again an error; for these words *precede* the others. These are found in Isa. i. 2." },
  { t = "note", id = "1168", text = "Isa. i. 15." },
  { t = "note", id = "1169", text = "Isa. i. 4." },
  { t = "note", id = "1170", text = "Jer. iv. 3, 4. In Eng. ver., “break up your fallow ground;” but comp. *de Pu.* c. vi. *ad init.*" },
  { t = "note", id = "1171", text = "So Tertullian. In Jer. *ibid.* “Israel and…Judah.”" },
  { t = "note", id = "1172", text = "Jer. xxxi. 31, 32 (in LXX. *ibid.* xxxviii. 31, 32); comp. Heb. viii. 8–13." },
  { t = "note", id = "1173", text = "Isa. ii. 2, 3." },
  { t = "note", id = "1174", text = "Perhaps an allusion to Phil. iii. 1, 2." },
  { t = "note", id = "1175", text = "See Dan. ii. 34, 35, 44, 45. See c. xiv. below." },
  { t = "note", id = "1176", text = "Isa. ii. 3, 4." },
  { t = "note", id = "1177", text = "*i.e*., of beating swords into ploughs, etc." },
  { t = "note", id = "1178", text = "Comp. Ex. xxi. 24, 25; Lev. xxiv. 17–22; Deut. xix. 11–21; Matt. v. 38." },
  { t = "note", id = "1179", text = "Especially spiritually. Comp. 1 Cor. iii. 6–9; ix. 9, 10, and similar passages." },
  { t = "note", id = "1180", text = "Obsequia. See *de Pa*. c. iv. note 1." },
  { t = "note", id = "1181", text = "See Ps. xviii. 43, 44 (xvii. 44, 45 in LXX.), where the Eng. ver. has the future; the LXX., like Tertullian, the past. Comp. 2 Sam. (in LXX. 2 Kings) xxii. 44, 45, and Rom. x. 14–17." },
  { t = "note", id = "1182", text = "Comp. Isa. i. 2 as above, and Acts xiii. 17." },
  { t = "note", id = "1183", text = "Sæculi." },
  { t = "note", id = "1184", text = "Or, perhaps, “not affected, as a body, with human sufferings;” in allusion to such passages as Deut. viii. 4; xxix. 5; Neh. ix. 21." },

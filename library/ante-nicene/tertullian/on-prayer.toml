[[section]]
id = "chapter-1"
title = "Chapter I. General Introduction."
level = 1
blocks = [
  { t = "h", text = "III." },
  { t = "h", text = "On Prayer." },
  { t = "h", text = "[Translated by the Rev. S. Thelwall.]" },
  { t = "p", text = "Chapter I.—General Introduction.[^8760]" },
  { t = "note", id = "8760", text = "[After the discipline of Repentance and of Baptism the Laws of Christian Living come into view. Hence this is the logical place for this treatise. See the *Prolegomena* of Muratori and learned annotations, in Routh, *Opuscula* I. p. 173, et sqq. We may date it *circa* a.d. 192. For much of the Primitive Discipline, concerning Prayer, see Bunsen, *Hippol.* III. pp. 88–91, etc.]" },
  { t = "p", text = "The Spirit of God, and the Word of God, and the Reason of God—Word of Reason, and Reason and Spirit of Word—Jesus Christ our Lord, namely, who is both the one and the other,[^8761]—has determined for us, the disciples of the New Testament, a new form of prayer; for in this particular also it was needful that new wine should be laid up in new skins, and a new breadth be sewn to a new garment.[^8762] Besides, whatever had been in bygone days, has either been quite changed, as circumcision; or else supplemented, as the rest of the Law; or else fulfilled, as Prophecy; or else perfected, as faith itself. For the new grace of God has renewed all things from carnal unto spiritual, by superinducing the Gospel, the obliterator of the whole ancient bygone system; in which our Lord Jesus Christ has been approved as the Spirit of God, and the Word of God, and the Reason of God: the Spirit, by which He was mighty; the Word, by which He taught; the Reason, by which He came.[^8763] So the prayer composed by Christ has been composed of three parts. In speech,[^8764] by which *prayer* is enunciated, in spirit, by which alone it prevails, even John had taught his disciples to pray,[^8765] but all John’s doings were laid as groundwork for Christ, until, when “He had increased”—just as the same John used to fore-announce “that it was needful” that “He should increase and himself decrease”[^8766]—the whole work of the forerunner passed over, together with his spirit itself, unto the Lord. Therefore, after what form of words John taught to pray is not extant, because earthly things have given place to heavenly. “He who is from the earth,” says John, “speaketh earthly things; and He who is here from the heavens speaketh those things which He hath seen.”[^8767] And what is the Lord Christ’s—as this method of praying is—*that* is *not* heavenly? And so, blessed *brethren*, let us consider His heavenly wisdom: first, touching the precept of praying secretly, whereby He exacted man’s faith, that he should be confident that the sight and hearing of Almighty God are present beneath roofs, and extend even into the secret place; and required modesty in faith, that it should offer its religious homage to Him alone, whom it believed to see and to hear everywhere. Further, since wisdom succeeded in the following precept, let it in like manner appertain unto faith, and the modesty of faith, that we think not that the Lord must be approached with a train of words, who, we are certain, takes unsolicited foresight for His own. And yet that very brevity—and let this make for the third grade of wisdom—is supported on the substance of a great and blessed interpretation, and is as diffuse in meaning as it is compressed in words. For it has embraced not only the special duties of prayer, be it veneration of God or petition for man, but almost every discourse of the Lord, every record of *His* Discipline; so that, in fact, in the Prayer is comprised an epitome of the whole Gospel." },
  { t = "note", id = "8761", text = "Oehler’s punctuation is followed here. The sentence is difficult, and has perplexed editors and commentators considerably." },
  { t = "note", id = "8762", text = "Matt. ix. 16, 17; Mark ii. 21, 22; Luke v. 36, 37." },
  { t = "note", id = "8763", text = "Routh suggests, “fortase *quâ sensit*,” referring to the *Adv. Praxeam*, c. 5." },
  { t = "note", id = "8764", text = "Sermone." },
  { t = "note", id = "8765", text = "This is Oehler’s punctuation. The edition of Pamelius reads: “So the prayer composed by Christ was composed of three parts: of the speech, by which it is enunciated; of the spirit, by which alone it prevails; of the reason, by which it is taught.” Rigaltius and subsequent editors read, “of the reason, by which it is conceived;” but this last clause is lacking in the mss., and Oehler’s reading appears, as he says, to “have healed the words.” [Oehler’s punctuation must stand; but, the preceding sentence justifies the interpolation of Rigaltius and *heals* more effectually.]" },
  { t = "note", id = "8766", text = "John iii. 30." },
  { t = "note", id = "8767", text = "John iii. 31, 32." },
]

[[section]]
id = "the-first-clause"
title = "The First Clause."
level = 1
blocks = [
  { t = "p", text = "Chapter II.—The First Clause." },
  { t = "p", text = "The prayer begins with a testimony to God, and with the reward of faith, when we say, “Our Father who art in the heavens;” for (in so saying), we at once pray to God, and commend faith, whose reward this appellation is. It is written, “To them who believed on Him He gave power to be called sons of God.”[^8768] However, our Lord very frequently proclaimed God as a Father to us; nay, even gave a precept “that we call no one on earth father, but the Father whom we have in the heavens:”[^8769] and so, in thus praying, we are likewise obeying the precept. Happy they who recognize their Father! This is the reproach that is brought against Israel, to which the Spirit attests heaven and earth, saying, “I have begotten sons, and they have not recognized me.”[^8770] Moreover, in saying “Father,” we also call Him “God.” That appellation is one both of filial duty and of power. Again, in the Father the Son is invoked; “for I,” saith He, “and the Father are One.”[^8771] Nor is even our mother the Church passed by, if, that is, in the Father and the Son is recognized the mother, from whom arises the name both of Father and of Son. In one general term, then, or word, we both honour God, together with His own,[^8772] and are mindful of the precept, and set a mark on such as have forgotten their Father." },
  { t = "note", id = "8768", text = "John i. 12." },
  { t = "note", id = "8769", text = "Matt. xxiii. 9." },
  { t = "note", id = "8770", text = "Isa. i. 2." },
  { t = "note", id = "8771", text = "John x. 30." },
  { t = "note", id = "8772", text = "“i.e., together with the Son and the Holy Spirit” (Oehler); “His Son and His church” (Dodgson)." },
]

[[section]]
id = "the-second-clause"
title = "The Second Clause."
level = 1
blocks = [
  { t = "p", text = "Chapter III.—The Second Clause." },
  { t = "p", text = "The name of “God the Father” had been published to none. Even Moses, who had interrogated Him on that very point, had heard a different name.[^8773] To us it has been revealed in the Son, for the Son is now the Father’s new name. “I am come,” saith He, “in the Father’s name;”[^8774] and again, “Father, glorify Thy name;”[^8775] and more openly, “I have manifested Thy name to men.”[^8776] That *name*, therefore, we pray may “be hallowed.” Not that it is becoming for men to *wish* God *well*, as if there were any other[^8777] by whom He may be wished well, or as if He would suffer unless we do so wish. Plainly, it is universally becoming for God to be *blessed*[^8778] in every place and time, on account of the memory of His benefits ever due from every man. But this petition also serves the turn of a blessing. Otherwise, when is the name of God not “holy,” and “hallowed” through Himself, seeing that of Himself He sanctifies all others—He to whom that surrounding circle of angels cease not to say, “Holy, holy, holy?”[^8779] In like wise, therefore, we too, candidates for angelhood, if we succeed in deserving it, begin even here on earth to learn by heart that strain hereafter to be raised unto God, and the function of future glory. So far, for the glory of God. On the other hand, for our own petition, when we say, “Hallowed be Thy name,” we pray this; that it may be hallowed *in us* who are in Him, as well in all others for whom the grace of God is still waiting;[^8780] that we may obey this precept, too, in “praying for all,”[^8781] even for our personal enemies.[^8782] And therefore with suspended utterance, not saying, “Hallowed be it *in us*,” we say,—“*in all*.”" },
  { t = "note", id = "8773", text = "Ex. iii. 13–16." },
  { t = "note", id = "8774", text = "John v. 43." },
  { t = "note", id = "8775", text = "John xii. 28." },
  { t = "note", id = "8776", text = "John xvii. 6." },
  { t = "note", id = "8777", text = "i.e., “any other *god*.”" },
  { t = "note", id = "8778", text = "Ps. ciii. 22." },
  { t = "note", id = "8779", text = "Isa. vi. 3; Rev. iv. 8." },
  { t = "note", id = "8780", text = "Isa. xxx. 18." },
  { t = "note", id = "8781", text = "1 Tim. ii. 1." },
  { t = "note", id = "8782", text = "Matt. v. 44." },
]

[[section]]
id = "the-third-clause"
title = "The Third Clause."
level = 1
blocks = [
  { t = "p", text = "Chapter IV.—The Third Clause." },
  { t = "p", text = "According to this model,[^8783] we subjoin, “Thy will be done in the heavens and on the earth;”[^8784] not that there is some power withstanding[^8785] to prevent God’s will being done, and we pray for Him the successful achievement of His will; but we pray for His will to be done *in all*. For, by figurative interpretation of *flesh* and *spirit, we* are “heaven” and “earth;” albeit, even if it is to be understood simply, still the sense of the petition is the same, that *in us* God’s will be done on earth, to make it possible, namely, for it to be done also in the heavens. What, moreover, *does* God will, but that we should walk according to His Discipline? We make petition, then, that He supply us with the substance of His will, and the capacity to do it, that we may be saved both in the heavens and on earth; because the sum of His will is the salvation of them whom He has adopted. There is, too, that will of God which the Lord accomplished in preaching, in working, in enduring: for if He Himself proclaimed that He did not His own, but the Father’s will, without doubt those things which He used to do *were* the Father’s will;[^8786] unto which things, as unto exemplars, we are now provoked;[^8787] to preach, to work, to endure even unto death. And we *need* the will of God, that we may be able to fulfil these duties. Again, in saying, “Thy will be done,” we are even wishing well to ourselves, in so far that there is nothing of *evil* in the will of God; even if, proportionably to each one’s deserts, somewhat other[^8788] is imposed on us. So by this expression we premonish our own selves unto patience. The Lord also, when He had wished to demonstrate to us, even in His own flesh, the flesh’s infirmity, by the reality of suffering, said, “Father, remove this Thy cup;” and remembering Himself, *added*, “save that not my will, but Thine be done.”[^8789] Himself *was* the Will and the Power of the Father: and yet, for the demonstration of the patience which was due, He gave Himself up *to* the Father’s Will." },
  { t = "note", id = "8783", text = "Mr. Dodgson renders, “next to this clause;” but the “*forma*” referred to seems, by what Tertullian proceeds to add, to be what he had said above, “not that it becomes us to wish God well,” etc." },
  { t = "note", id = "8784", text = "We learn from this and other places, that the comparative adverb was wanting in some ancient *formulæ* of the Lord’s Prayer. [See Routh, *Opuscula* I. p. 178.]" },
  { t = "note", id = "8785", text = "See note 3." },
  { t = "note", id = "8786", text = "John vi. 38." },
  { t = "note", id = "8787", text = "For this use of the word “provoke,” see Heb. x. 24, Eng. ver." },
  { t = "note", id = "8788", text = "[Something we might think *other* than good.]" },
  { t = "note", id = "8789", text = "Luke xxii. 42." },
]

[[section]]
id = "the-fourth-clause"
title = "The Fourth Clause."
level = 1
blocks = [
  { t = "p", text = "Chapter V.—The Fourth Clause." },
  { t = "p", text = "“Thy kingdom come” has also reference to that whereto “Thy will be done” refers—*in us*, that is. For when does God not reign, in whose hand is the heart of all kings?[^8790] But whatever we wish for ourselves we augur for Him, and *to* Him we attribute what *from* Him we expect. And so, if the *manifestation* of the Lord’s kingdom pertains unto the will of God and unto our anxious expectation, how do some pray for some protraction of the age,[^8791] when the kingdom of God, which we pray may arrive, tends unto the consummation of the age?[^8792] Our wish is, that our reign be hastened, not our servitude protracted. Even if it had not been prescribed in the Prayer that we should ask for the advent of the kingdom, we should, unbidden, have sent forth that cry, hastening toward the realization of our hope. The souls of the martyrs beneath the altar[^8793] cry in jealousy unto the Lord, “How long, Lord, dost Thou not avenge our blood on the inhabitants of the earth?”[^8794] for, of course, their avenging is regulated by[^8795] the end of the age. Nay, Lord, Thy kingdom come with all speed,—the prayer of Christians the confusion of the heathen,[^8796] the exultation of angels, for the sake of which we suffer, nay, rather, for the sake of which we pray!" },
  { t = "note", id = "8790", text = "Prov. xxi. 1." },
  { t = "note", id = "8791", text = "Or, “world,” *sæculo*." },
  { t = "note", id = "8792", text = "Or, “world,” *sæculi*. See Matt. xxiv. 3, especially in the Greek. By “praying for some protraction in the age,” Tertullian appears to refer to some who used to pray that the end might be deferred (Rigalt.)." },
  { t = "note", id = "8793", text = "*altari*." },
  { t = "note", id = "8794", text = "Rev. vi. 10." },
  { t = "note", id = "8795", text = "So Dodgson aptly renders “*dirigitur a*.”" },
  { t = "note", id = "8796", text = "[See *Ad Nationes*, p. 128, *supra*.]" },
]

[[section]]
id = "the-fifth-clause"
title = "The Fifth Clause."
level = 1
blocks = [
  { t = "p", text = "Chapter VI.—The Fifth Clause." },
  { t = "p", text = "But how gracefully has the Divine Wisdom arranged the order of the prayer; so that *after* things heavenly—that is, after the “Name” of God, the “Will” of God, and the “Kingdom” of God—it should give earthly necessities also room for a petition! For the Lord had[^8797] withal issued His edict, “Seek ye first the kingdom, and then even these shall be added:”[^8798] albeit we may rather understand, “Give us this day our daily bread,” *spiritually*. For *Christ* is our Bread; because Christ is Life, and bread is life. “I am,” saith He, “the Bread of Life;”[^8799] and, a little above, “The Bread is the Word of the living God, who came down from the heavens.”[^8800] Then *we find*, too, that His body is reckoned in bread: “This is my body.”[^8801] And so, in petitioning for “daily bread,” we ask for perpetuity in Christ, and indivisibility from His body. But, because that word is admissible in a carnal sense too, it cannot be so used without the religious remembrance withal of spiritual Discipline; for (the Lord) commands that *bread* be prayed for, which is the only *food* necessary for believers; for “all other things the nations seek after.”[^8802] The like lesson He both inculcates by examples, and repeatedly handles in parables, when He says, “Doth a father take away *bread* from his children, and hand it to dogs?”[^8803] and again, “Doth a father give his son a stone when he asks for *bread*?”[^8804] For He *thus* shows what it is that sons expect from their father. Nay, even that nocturnal knocker knocked for “*bread*.”[^8805] Moreover, He justly added, “Give us *this day*,” seeing He had previously said, “Take no careful thought about the morrow, what ye are to eat.”[^8806] To which subject He also adapted the parable of the man who pondered on an enlargement of his barns for his forthcoming fruits, and on seasons of prolonged security; but that very night he dies.[^8807]" },
  { t = "note", id = "8797", text = "This is a slight mistake of Tertullian. The words referred to, “Seek ye first,” etc., do not occur till the *end* of the chapter in which the prayer is found, so that his pluperfect is out of place. [He must have been aware of this: he only gives logical order to the thought which existed in the divine mind. See note 10, p. 682.]" },
  { t = "note", id = "8798", text = "Matt. vi. 33." },
  { t = "note", id = "8799", text = "John vi. 35." },
  { t = "note", id = "8800", text = "John vi. 33." },
  { t = "note", id = "8801", text = "Matt. xxvi. 26." },
  { t = "note", id = "8802", text = "Matt. vi. 32." },
  { t = "note", id = "8803", text = "Tertullian seems to refer to Matt. xv. 26; Mark vii. 27." },
  { t = "note", id = "8804", text = "Matt. vii. 9; Luke xi. 11." },
  { t = "note", id = "8805", text = "Luke xi. 5–9." },
  { t = "note", id = "8806", text = "Matt. vi. 34 and Luke xii. 29 seem to be referred to; but the same remark applies as in note 10 on the preceding page." },
  { t = "note", id = "8807", text = "Luke xii. 16–20." },
]

[[section]]
id = "the-sixth-clause"
title = "The Sixth Clause."
level = 1
blocks = [
  { t = "p", text = "Chapter VII.—The Sixth Clause." },
  { t = "p", text = "It was suitable that, after contemplating the liberality of God,[^8808] we should likewise address His clemency. For what will aliments[^8809] profit us, if we are really *consigned* to them, as it were a bull destined for a victim?[^8810] The Lord knew Himself to be the only guiltless One, and so He teaches that we beg “to have our debts remitted us.” A petition for pardon is a full confession; because he who begs for pardon fully admits his guilt. Thus, too, penitence is demonstrated acceptable to God who desires it rather than the death of the sinner.[^8811] Moreover, *debt* is, in the Scriptures, a figure of *guilt*; because it is equally due to the sentence of judgment, and is exacted by it: nor does it evade the justice of exaction, unless the exaction be remitted, just as the lord remitted to that slave *in the parable* his debt;[^8812] for hither does the scope of the whole parable tend. For the fact withal, that the same servant, after liberated by his lord, does not equally spare his own debtor; and, being on that account impeached before his lord, is made over to the tormentor to pay the uttermost farthing—that is, every guilt, however small: corresponds with our profession that “we also remit to our debtors;” indeed elsewhere, too, in conformity with this Form of Prayer, He saith, “Remit, and it shall be remitted you.”[^8813] And when Peter had put the question whether remission were to be granted to a brother seven times, “Nay,” saith He, “seventy-seven times;”[^8814] in order to remould the Law for the better; because in Genesis *vengeance* was assigned “seven times” in the case of Cain, but in that of Lamech “seventy-seven times.”[^8815]" },
  { t = "note", id = "8808", text = "In the former petition, “Give us this day our daily bread.”" },
  { t = "note", id = "8809", text = "Such as “daily bread.”" },
  { t = "note", id = "8810", text = "That is, if we are just to be fed and fattened by them in *body*, as a bull which is destined for sacrifice is, and then, like him, *slain*—handed over to *death*?" },
  { t = "note", id = "8811", text = "Ex. xviii. 23, 32; xxxiii. 11." },
  { t = "note", id = "8812", text = "Matt. xviii. 21–35." },
  { t = "note", id = "8813", text = "Luke vi. 37." },
  { t = "note", id = "8814", text = "Matt. xviii. 21–22." },
  { t = "note", id = "8815", text = "Gen. iv. 15, 24." },
]

[[section]]
id = "the-seventh-or-final-clause"
title = "The Seventh or Final Clause."
level = 1
blocks = [
  { t = "p", text = "Chapter VIII.—The Seventh or Final Clause." },
  { t = "p", text = "For the completeness of so brief a prayer He added—in order that we should supplicate not touching the remitting merely, but touching the entire averting, of acts of guilt—“Lead us not into temptation:” that is, suffer us not to be led into it, by him (of course) who tempts; but far be the thought that the Lord should seem to tempt,[^8816] as if He either were ignorant of the faith of any, or else were eager to overthrow it. Infirmity[^8817] and malice[^8818] are characteristics of the devil. For *God* had commanded even Abraham to make a sacrifice of his son, for the sake not of tempting, but proving, his faith; in order through him to make an example for that precept of His, whereby He was, by and by, to enjoin that he should hold no pledges of affection dearer than God.[^8819] He Himself, when tempted by the devil, demonstrated who it is that presides over and is the originator of temptation.[^8820] This passage He confirms by subsequent ones, saying, “Pray that ye be not tempted;”[^8821] yet they *were* tempted, (as they showed) by deserting their Lord, because they had given way rather to sleep than prayer.[^8822] The final clause, therefore, is consonant, and interprets the sense of “Lead us not into temptation;” for this *sense* is, “But convey us away from the Evil One.”" },
  { t = "note", id = "8816", text = "See James i. 13." },
  { t = "note", id = "8817", text = "Implied in the one hypothesis—ignorance." },
  { t = "note", id = "8818", text = "Implied in the other—wishing to overthrow faith." },
  { t = "note", id = "8819", text = "i.e. no children even. The reference is apparently to Matt. x. 37 and Luke xiv. 26, with which may be compared Deut. xiii. 6–10 and xxxiii. 9. If Oehler’s reading, which I have followed, be correct, the precept, which is not verbally given till ages after Abraham, is made to have a retrospective force on him." },
  { t = "note", id = "8820", text = "See Matt. iv. 10; Luke iv. 8." },
  { t = "note", id = "8821", text = "Luke xxii. 40; Matt. xxvi. 41; Mark xiv. 31." },
  { t = "note", id = "8822", text = "Routh refers us to *De Bapt.* c. 20, where Tertullian refers to the same event. [Note also his reference to *De Fuga*, cap. ii.]" },
]

[[section]]
id = "recapitulation"
title = "Recapitulation."
level = 1
blocks = [
  { t = "p", text = "Chapter IX.—Recapitulation.[^8823]" },
  { t = "note", id = "8823", text = "Here comes in the Codex Ambrosianus, with the title, “Here begins a treatise of Tertullian of divers necessary things;” and from it are taken the headings of the remaining chapters. (See Oehler and Routh.)" },
  { t = "p", text = "In summaries of so few words, how many utterances of the prophets, the Gospels, the apostles—how many discourses, examples, parables of the Lord, are touched on! How many duties are simultaneously discharged! The honour of God in the “Father;” the testimony of faith in the “Name;” the offering of obedience in the “Will;” the commemoration of hope in the “Kingdom;” the petition for life in the “Bread;” the full acknowledgment of debts in the prayer for their “Forgiveness;” the anxious dread of temptation in the request for “Protection.” What wonder? God alone could teach how he wished Himself prayed to. The religious rite of prayer therefore, ordained by Himself, and animated, even at the moment when it was issuing out of the Divine mouth, by His own Spirit, ascends, by its own prerogative, into heaven, commending to the Father what the Son has taught." },
]

[[section]]
id = "we-may-superadd-prayers-of-our-own"
title = "We May Superadd Prayers of Our Own to the Lord's Prayer."
level = 1
blocks = [
  { t = "p", text = "Chapter X.—We May Superadd Prayers of Our Own to the Lord’s Prayer." },
  { t = "p", text = "Since, however, the Lord, the Foreseer of human necessities,[^8824] said separately, after delivering His Rule of Prayer, “Ask, and ye shall receive;”[^8825] and *since* there are petitions which are made according to the circumstances of each individual; our additional wants have the right—after beginning with the legitimate and customary prayers as a foundation, as it were—of rearing an outer superstructure of petitions, yet with remembrance of *the Master’s* precepts." },
  { t = "note", id = "8824", text = "See Matt. vi. 8." },
  { t = "note", id = "8825", text = "Matt. vii. 7; Luke xi. 9." },
]

[[section]]
id = "when-praying-the-father-you-are-not"
title = "When Praying the Father, You are Not to Be Angry with a Brother."
level = 1
blocks = [
  { t = "p", text = "Chapter XI.—When Praying the Father, You are Not to Be Angry with a Brother." },
  { t = "p", text = "That we may not be as far from the ears of God as we are from His precepts,[^8826] the memory of His precepts paves for our prayers a way unto heaven; of which *precepts* the chief is, that we go not up unto God’s altar[^8827] before we compose whatever of discord or offence we have contracted with our brethren.[^8828] For what sort of deed is it to approach the peace of God[^8829] without peace? the remission of debts[^8830] while you retain them? How will he appease his *Father* who is angry with his *brother*, when from the beginning “all anger” is forbidden us?[^8831] For even Joseph, when dismissing his brethren for the purpose of fetching their father, said, “And be not angry in the way.”[^8832] He warned *us*, to be sure, at that time (for elsewhere our Discipline is called “the Way”[^8833]), that when, set in “the way” of prayer, we go not unto “the Father” with anger. After that, the Lord, “amplifying the Law,”[^8834] openly adds *the prohibition of* anger against a brother to *that of* murder.[^8835] Not even by an evil word does He permit it to be vented.[^8836] Ever if we *must* be angry, our anger must not be maintained beyond sunset, as the apostle admonishes.[^8837] But how rash is it either to pass a day without prayer, while you refuse to make satisfaction to your brother; or else, by perseverance in anger, to lose your prayer?" },
  { t = "note", id = "8826", text = "Oehler divides these two chapters as above. The generally adopted division unites this sentence to the preceding chapter, and begins the new chapter with, “The memory of His precepts;” and perhaps this is the preferable division." },
  { t = "note", id = "8827", text = "*altare*. [Heb. xiii. 10.]" },
  { t = "note", id = "8828", text = "Matt. v. 22, 23." },
  { t = "note", id = "8829", text = "Perhaps there may be an allusion to Phil. iv. 6, 7." },
  { t = "note", id = "8830", text = "See chap. vii. above, and compare Matt. vi. 14, 15." },
  { t = "note", id = "8831", text = "“Ab initio” probably refers to the book of Genesis, the *initium*, or beginning of Scripture, to which he is about to refer. But see likewise Eph. iv. 31, Matt. v. 21, 22. [Gen. iv. 6, 7.]" },
  { t = "note", id = "8832", text = "Gen. xlv. 24: so the LXX." },
  { t = "note", id = "8833", text = "See Acts ix. 2; xix. 9, 23, in the Greek." },
  { t = "note", id = "8834", text = "See Matt. v. 17." },
  { t = "note", id = "8835", text = "Matt. v. 21, 22." },
  { t = "note", id = "8836", text = "Matt. v. 21, 22; 1 Pet. iii. 9, etc." },
  { t = "note", id = "8837", text = "Eph. iv. 26." },
]

[[section]]
id = "we-must-be-free-likewise-from-all"
title = "We Must Be Free Likewise from All Mental Perturbation."
level = 1
blocks = [
  { t = "p", text = "Chapter XII.—We Must Be Free Likewise from All Mental Perturbation." },
  { t = "p", text = "Nor merely from anger, but altogether from *all* perturbation of mind, ought the exercise of prayer to be free, uttered from a spirit such as the Spirit unto whom it is sent. For a defiled spirit cannot be acknowledged by a holy Spirit,[^8838] nor a sad by a joyful,[^8839] nor a fettered by a free.[^8840] No one grants reception to his adversary: no one grants admittance except to his compeer." },
  { t = "note", id = "8838", text = "Eph. iv. 30." },
  { t = "note", id = "8839", text = "John xvii. 14; Rom. xiv. 17." },
  { t = "note", id = "8840", text = "Ps. li. 12." },
]

[[section]]
id = "of-washing-the-hands"
title = "Of Washing the Hands."
level = 1
blocks = [
  { t = "p", text = "Chapter XIII.—Of Washing the Hands." },
  { t = "p", text = "But what reason is there in going to prayer with hands indeed washed, but the spirit foul?—inasmuch as to our hands themselves spiritual purities are necessary, that they may be “lifted up pure”[^8841] from falsehood, from murder, from cruelty, from poisonings,[^8842] from idolatry, and all the other blemishes which, conceived by the spirit, are effected by the operation of the hands. These are the true purities;[^8843] not those which most are superstitiously careful about, taking water at every prayer, even when they are coming from a bath of the whole body. When I was scrupulously making a thorough investigation of this practice, and searching into the reason of it, I ascertained it to be a commemorative act, bearing on the surrender[^8844] of our Lord. We, *however, pray* to the Lord: we do not *surrender* Him; nay, we ought even to set ourselves in opposition to the example of His surrenderer, and not, on that account, wash our hands. Unless any defilement contracted in human intercourse be a conscientious cause *for washing them*, they are otherwise clean enough, which together with our whole body we once washed in Christ.[^8845]" },
  { t = "note", id = "8841", text = "1 Tim. ii. 8." },
  { t = "note", id = "8842", text = "Or, “sorceries.”" },
  { t = "note", id = "8843", text = "See Matt. xv. 10, 11, 17–20; xxiii. 25, 26." },
  { t = "note", id = "8844", text = "By Pilate. See Matt. xxvii. 24. [N. B. *quoad Ritualia*.]" },
  { t = "note", id = "8845", text = "i.e. in baptism." },
]

[[section]]
id = "apostrophe"
title = "Apostrophe."
level = 1
blocks = [
  { t = "p", text = "Chapter XIV.—Apostrophe." },
  { t = "p", text = "Albeit Israel washed daily all his limbs over, yet is he never clean. His *hands*, at all events, are ever unclean, eternally dyed with the blood of the prophets, and of the Lord Himself; and on that account, as being hereditary culprits from their privity to their fathers’ crimes,[^8846] they do not dare even to raise them unto the Lord,[^8847] for fear some Isaiah should cry out,[^8848] for fear Christ should utterly shudder. We, however, not only raise, but even expand them; and, taking our model from the Lord’s passion[^8849] even in prayer we confess[^8850] to Christ." },
  { t = "note", id = "8846", text = "See Matt. xxiii. 31; Luke xi. 48." },
  { t = "note", id = "8847", text = "I do not know Tertullian’s authority for this statement. Certainly Solomon *did* raise *his* hands (1 Kings viii. 54), and David apparently his (see Ps. cxliii. 6; xxviii. 2; lxii. 4, etc.). Compare, too, Ex. xvii. 11, 12. But probably he is speaking only of the Israel of his own day. [Evidently.]" },
  { t = "note", id = "8848", text = "Isa. i. 15." },
  { t = "note", id = "8849", text = "i.e. from the expansion of the hands on the cross." },
  { t = "note", id = "8850", text = "Or, “give praise.”" },
]

[[section]]
id = "of-putting-off-cloaks"
title = "Of Putting Off Cloaks."
level = 1
blocks = [
  { t = "p", text = "Chapter XV.—Of Putting Off Cloaks." },
  { t = "p", text = "But since we have touched on one special point of empty observance,[^8851] it will not be irksome to set our brand likewise on the other points against which the reproach of vanity may deservedly be laid; if, that is, they are observed without the authority of any precept either of the Lord, or else of the apostles. For matters of this kind belong not to religion, but to superstition, being studied, and forced, and of curious rather than rational ceremony;[^8852] deserving of restraint, at all events, even on this ground, that they put us on a level with Gentiles.[^8853] As, *e.g.*, it is the custom of some to make prayer with cloaks doffed, for so do the nations approach their idols; which practice, of course, were its observance becoming, the apostles, who teach concerning the garb of prayer,[^8854] would have comprehended *in their instructions*, unless any think that is was in prayer that Paul had left his cloak with Carpus![^8855] God, forsooth, would not hear cloaked suppliants, who plainly heard the three saints in the Babylonian king’s furnace praying in their trousers and turbans.[^8856]" },
  { t = "note", id = "8851", text = "i.e. the hand-washing." },
  { t = "note", id = "8852", text = "Or, “reasonable service.” See Rom. xii. 1." },
  { t = "note", id = "8853", text = "Or, “Gentile practices.”" },
  { t = "note", id = "8854", text = "See 1 Cor. xi. 3–16." },
  { t = "note", id = "8855", text = "2 Tim. iv. 13." },
  { t = "note", id = "8856", text = "Dan. iii. 21, etc." },
]

[[section]]
id = "of-sitting-after-prayer"
title = "Of Sitting After Prayer."
level = 1
blocks = [
  { t = "p", text = "Chapter XVI.—Of Sitting After Prayer." },
  { t = "p", text = "Again, for the custom which some have of sitting when prayer is ended, I perceive no reason, except that which children give.[^8857] For what if that Hermas,[^8858] whose writing is generally inscribed with the title *The Shepherd*, had, after finishing his prayer, not sat down on his bed, but done some other thing: should we maintain that also as a matter for observance? Of course not. Why, even as it is the sentence, “When I had prayed, and had sat down on my bed,” is simply put with a view to the order of the narration, not as a model of discipline. Else we shall have to pray nowhere except where there is a bed! Nay, whoever sits in a *chair* or on a *bench*, will act contrary to that writing. Further: inasmuch as the nations do the like, in sitting down after adoring their petty images; even on this account the practice deserves to be censured in us, because it is observed in the worship of idols. To this is further added the charge of *irreverence*,—intelligible even to the nations themselves, if they had any sense. If, on the one hand, it is irreverent to sit under the eye, and over against the eye, of him whom you most of all revere and venerate; how much more, on the other hand, is that deed *most* irreligious under the eye of the living God, while the angel of prayer is still *standing by*[^8859] unless we are upbraiding God that prayer has wearied us!" },
  { t = "note", id = "8857", text = "i.e. that they have seen it done; for children imitate anything and everything (Oehler)." },
  { t = "note", id = "8858", text = "[Vol. II. p. 18 (Vision V.), this Series. Also, *Ib.* p. 57, note 2. See Routh’s quotation from Cotelerius, p. 180, in Volume before noted.]" },
  { t = "note", id = "8859", text = "Routh and Oehler (after Rigaltius) refer us to Tob. xii. 12. They also, with Dodgson, refer to Luke i. 11. Perhaps there may be a reference to Rev. viii. 3, 4." },
]

[[section]]
id = "of-elevated-hands"
title = "Of Elevated Hands."
level = 1
blocks = [
  { t = "p", text = "Chapter XVII.—Of Elevated Hands." },
  { t = "p", text = "But we more commend our prayers to God when we pray with modesty and humility, with not even our hands too loftily elevated, but elevated temperately and becomingly; and not even our countenance over-boldly uplifted. For that publican who prayed with humility and dejection not merely in his supplication, but in his countenance too, went his way “more justified” than the shameless Pharisee.[^8860] The sounds of our voice, likewise, should be subdued; else, if we are to be heard for our noise, how large windpipes should we need! But God is the hearer not of the *voice*, but of the *heart*, just as He is its inspector. The demon of the Pythian oracle says:" },
  { t = "note", id = "8860", text = "Luke xviii. 9–14." },
  { t = "p", text = "“And I do understand the mute, and plainly hear the speechless one.”[^8861]" },
  { t = "note", id = "8861", text = "Herod. i. 47." },
  { t = "p", text = "Do the ears of God wait for sound? How, then, could Jonah’s prayer find way out unto heaven from the depth of the whale’s belly, through the entrails of so huge a beast; from the very abysses, through so huge a mass of sea? What superior advantage will they who pray too loudly gain, except that they annoy their neighbours? Nay, by making their petitions audible, what less error do they commit than if they were to pray in public?[^8862]" },
  { t = "note", id = "8862", text = "Which is forbidden, Matt. vi. 5, 6." },
]

[[section]]
id = "of-the-kiss-of-peace"
title = "Of the Kiss of Peace."
level = 1
blocks = [
  { t = "p", text = "Chapter XVIII.—Of the Kiss of Peace." },
  { t = "p", text = "Another custom has now become prevalent. Such as are fasting withhold the kiss of peace, which is the seal of prayer, after prayer made with brethren. But when is peace more to be concluded with brethren than when, at the time of some religious observance,[^8863] our prayer ascends with more acceptability; that they may themselves participate in our observance, and thereby be mollified for transacting with their brother touching their own peace? What prayer is complete if divorced from the “holy kiss?”[^8864] Whom does peace impede when rendering service to his Lord? What kind of sacrifice is that from which men depart without peace? Whatever our prayer be, it will not be better than the observance of the precept by which we are bidden to conceal our fasts;[^8865] for *now*, by abstinence from the kiss, we are known to be fasting. But even if there be some reason *for this practice*, still, lest you offend against this precept, you may perhaps defer your “peace” *at home*, where it is not possible for your fast to be entirely kept secret. But wherever else you can conceal your observance, you ought to remember the precept: thus you may satisfy the requirements of Discipline abroad and of custom at home. So, too, on the day of the passover,[^8866] when the religious observance of a fast is general, and as it were public, we justly forego the kiss, caring nothing to conceal anything which we do in common with all." },
  { t = "note", id = "8863", text = "Such as fasting." },
  { t = "note", id = "8864", text = "See Rom. xvi. 16; 1 Cor. xvi. 20; 2 Cor. xiii. 12; 1 Thess. v. 26; 1 Pet. v. 14. [The sexes apart.]" },
  { t = "note", id = "8865", text = "Matt. vi. 16–18." },
  { t = "note", id = "8866", text = "i.e. “Good Friday,” as it is now generally called." },
]

[[section]]
id = "of-stations"
title = "Of Stations."
level = 1
blocks = [
  { t = "p", text = "Chapter XIX.—Of Stations." },
  { t = "p", text = "Similarly, too, touching the days of Stations,[^8867] most think that they must not be present at the sacrificial prayers, on the ground that the Station must be dissolved by reception of the Lord’s Body. Does, then, the Eucharist cancel a service devoted to God, or bind it more to God? Will not your *Station* be more solemn if you have withal *stood* at God’s *altar*?[^8868] When the Lord’s Body has been received and reserved[^8869] each point is secured, both the participation of the sacrifice and the discharge of duty. If the “Station” has received its name from the example of military life—for we withal are God’s military[^8870]—of course no gladness or sadness chanting to the camp abolishes the “stations” of the soldiers: for gladness will carry out discipline more willingly, sadness more carefully." },
  { t = "note", id = "8867", text = "The word *Statio* seems to have been used in more than one sense in the ancient Church. A passage in the *Shepherd of Hermas*, referred to above (B. iii. Sim. 5), appears to make it =\"fast.”" },
  { t = "note", id = "8868", text = "“Ara,” not “altare.”" },
  { t = "note", id = "8869", text = "For receiving at home apparently, when your *station* is over." },
  { t = "note", id = "8870", text = "See 2 Tim. ii. 1, etc. [See Hermas, Vol. I., p. 33.]" },
]

[[section]]
id = "of-women-s-dress"
title = "Of Women's Dress."
level = 1
blocks = [
  { t = "p", text = "Chapter XX.—Of Women’s Dress." },
  { t = "p", text = "So far, however, as regards the dress of women, the variety of observance compels us—men of no consideration whatever—to treat, presumptuously indeed, after the most holy apostle,[^8871] except in so far as it will not be presumptuously if we treat the subject in accordance with the apostle. Touching modesty of dress and ornamentation, indeed, the prescription of Peter[^8872] likewise is plain, checking as he does with the same mouth, because with the same Spirit, as Paul, the glory of garments, and the pride of gold, and the meretricious elaboration of the hair." },
  { t = "note", id = "8871", text = "See 1 Cor. xi. 1–16; 1 Tim. ii. 9, 10." },
  { t = "note", id = "8872", text = "1 Pet. iii. 1–6." },
]

[[section]]
id = "of-virgins"
title = "Of Virgins."
level = 1
blocks = [
  { t = "p", text = "Chapter XXI.—Of Virgins." },
  { t = "p", text = "But that point which is promiscuously observed throughout the churches, whether virgins ought to be veiled or no, must be treated of. For they who allow to virgins immunity from head-covering, appear to rest on this; that the apostle has not defined “virgins” by name, but “women,”[^8873] as “to be veiled;” nor the sex generally, so as to say “females,” but a *class* of the sex, by saying “women:” for if he had named the sex by saying “females,” he would have made his limit absolute for *every* woman; but while he names one class of the sex, he separates another class by being silent. For, they say, he might either have named “virgins” specially; or generally, by a compendious term, “females.”" },
  { t = "note", id = "8873", text = "1 Cor. xi. 5." },
]

[[section]]
id = "answer-to-the-foregoing-arguments"
title = "Answer to the Foregoing Arguments."
level = 1
blocks = [
  { t = "p", text = "Chapter XXII.—Answer to the Foregoing Arguments." },
  { t = "p", text = "They who make this concession[^8874] ought to reflect on the nature of the word itself—what is the meaning of “woman” from the very first records of the sacred writings. Here they find it to be the *name of the sex*, not a *class of the sex*: if, that is, God gave to Eve, when she had not yet known a man, the surname “woman” and “female”[^8875]—(“female,” whereby the sex generally; “woman,” hereby a class of the sex, is marked).[^8876] So, since at that time the as yet unwedded Eve was called by the word “woman,” that word has been made common even to a virgin.[^8877] Nor is it wonderful that the apostle—guided, of course, by the same Spirit by whom, as all the divine Scripture, so that book Genesis, was drawn up—has used the selfsame word in writing “women,” which, by the example of Eve unwedded, is applicable too to a “virgin.” In fact, all the other passages are in consonance herewith. For even by this very fact, that he has not *named* “virgins” (as he does in another place[^8878] where he is teaching touching marrying), he sufficiently predicates that his remark is made touching *every* woman, and touching *the whole* sex; and that there is no distinction made between a “virgin” *and any other*, while he does not name her at all. For he who elsewhere—namely, where the difference requires—remembers to make the distinction, (moreover, he makes it by designating each species by their appropriate names,) wishes, where he makes *no* distinction (while he does not name each), *no* difference to be understood. What of the fact that in the Greek speech, in which the apostle wrote his letters, it is usual to say, “women” rather than “females;” that is, γυναῖκας (*gunaikas*) rather than θηλείας (*theleias*)? Therefore if that word,[^8879] which by interpretation represents what “female” (*femina*) represents,[^8880] is frequently used *instead* of the name of the sex,[^8881] he has named the *sex* in saying γυναῖκα; but in the *sex* even the *virgin* is embraced. But, withal, the declaration is plain: “*Every* woman,” saith he, “praying and prophesying with head uncovered,[^8882] dishonoureth her own head.”[^8883] What is “*every* woman,” but *woman* of every age, of every rank, of every condition? By saying “every” he excepts nought of womanhood, just as he excepts nought of manhood either from *not* being covered; for just so he says, “*Every man*.”[^8884] As, then, in the masculine sex, under the name of “man” even the “youth” is *forbidden* to be veiled; so, too, in the feminine, under the name of “woman,” even the “virgin” is *bidden* to be veiled. Equally in each sex let the younger age follow the discipline of the elder; or else let the male “virgins,”[^8885] too, be *veiled*, if the female virgins withal are *not* veiled, because *they* are not mentioned by *name*. Let “man” and “youth” be different, if “woman” and “virgin” are different. For indeed it is “on account of the angels”[^8886] that he saith women must be veiled, because on account of “the daughters of men” angels revolted from God.[^8887] Who then, would contend that “*women*” *alone*—that is,[^8888] such as were already wedded and had lost their virginity—were the objects of angelic concupiscence, unless “virgins” are incapable of excelling in beauty and finding lovers? Nay, let us see whether it were not *virgins alone* whom they lusted after; since Scriptures saith “*the daughters* of men;”[^8889] inasmuch as it might have named “*wives* of men,” or “females,” indifferently.[^8890] Likewise, in that it saith, “And they took them to themselves for wives,”[^8891] it does so on this ground, that, of course, such are “received *for wives*” as are devoid of that title. But it would have expressed itself differently concerning such as were *not* thus devoid. And so (they who are named) are devoid as much of *widowhood* as of *virginity*. So completely has *Paul* by naming the sex generally, mingled “daughters” and species together in the genus. Again, while he says that “nature herself,”[^8892] which has assigned hair as a tegument and ornament to women, “teaches that veiling is the duty of females,” has not the same tegument and the same honour of the head been assigned also to virgins? If “it is shameful” for a woman to be shorn it is similarly so to a virgin too. From them, then, to whom is assigned one and the same *law* of the head,[^8893] one and the same *discipline*[^8894] of the head is exacted,—(which extends) even unto those virgins whom their childhood defends,[^8895] for from the first[^8896] *a virgin* was named “female.” This custom,[^8897] in short, even Israel observes; but if *Israel* did *not* observe it, *our* Law,[^8898] amplified and supplemented, would vindicate the addition for itself; let it be excused for imposing the veil on virgins also. Under *our* dispensation, let that age which is ignorant of its sex[^8899] retain the privilege of simplicity. For both Eve and Adam, when it befell them to be “wise,”[^8900] forthwith veiled what they had learnt to know.[^8901] At all events, with regard to those in whom girlhood has changed (into maturity), their age ought to remember its duties as to nature, so also, to discipline; for they are being transferred to the rank of “women” both in their persons and in their functions. No one is a “virgin” from the time when she is capable of marriage; seeing that, in her, age has by that time been wedded to its own husband, that is, to time.[^8902] “But some particular *virgin* has devoted herself to God. From that very moment she both changes the fashion of her hair, and converts all her garb into that of a ‘woman.’” Let her, then, maintain the character wholly, and perform the whole function of a “virgin:” what she conceals[^8903] for the sake of God, let her cover quite over.[^8904] It is our business to entrust to the knowledge of God alone that which the grace of God effects in us, lest we receive from man the reward we hope for from God.[^8905] Why do you denude before God[^8906] what you cover before men?[^8907] Will you be more modest in public than in the church? If *your self-devotion* is a grace of God, and you have received it, “why do you boast,” saith he, “as if you have not received it?”[^8908] Why, by your ostentation of yourself, do you judge others? Is it that, by your boasting, you invite others unto good? Nay, but even you yourself run the risk of losing, if you boast; and you drive others unto the same perils! What is assumed from love of boasting is easily destroyed. Be veiled, virgin, if virgin you are; for you ought to blush. If you are a virgin, shrink from (the gaze of) many eyes. Let no one wonder at your face; let no one perceive your falsehood.[^8909] You do well in falsely assuming the married character, if you veil your head; nay, you do not seem to assume it *falsely*, for you *are* wedded to Christ: to Him you have surrendered your body; act as becomes your Husband’s discipline. If He bids the brides of others to be veiled, His own, of course, much more. “But each individual man[^8910] is not to think that the institution of his predecessor is to be overturned.” Many yield up their own judgment, and its consistency, to the custom of others. Granted that *virgins* be not *compelled* to be veiled, at all events such as *voluntarily are* so should not be prohibited; who, likewise, cannot deny themselves to be virgins,[^8911] content, in the security of a good conscience before God, to damage their own fame.[^8912] Touching such, however, as are betrothed, I can with constancy “above my small measure”[^8913] pronounce and attest that they are to be veiled from that day forth on which they shuddered at the first bodily touch of a man by kiss and hand. For in them everything has been forewedded: their age, through maturity; their flesh, through age; their spirit, through consciousness; their modesty, through the experience of the kiss their hope, through expectation; their mind through volition. And Rebecca is example enough for us, who, when her betrothed had been pointed out, veiled herself for marriage merely on recognition of him.[^8914]" },
  { t = "note", id = "8874", text = "As to the distinction between “women” and “virgins.”" },
  { t = "note", id = "8875", text = "Gen. ii. 23. In the LXX. and in the Eng. ver. there is but the one word “woman.”" },
  { t = "note", id = "8876", text = "These words are regarded by Dr. Routh as spurious, and not without reason. Mr. Dodgson likewise omits them, and refers to *de Virg. Vel.* cc. 4 and 5." },
  { t = "note", id = "8877", text = "In *de Virg. Vel.* 5, Tertullian speaks even more strongly: “And so you have the name, I say not now *common*, but *proper* to a virgin; a name which from the beginning a *virgin* received.”" },
  { t = "note", id = "8878", text = "1 Cor. vii. 34 et seq." },
  { t = "note", id = "8879", text = "γυνή." },
  { t = "note", id = "8880", text = "Mr. Dodgson appears to think that there is some transposition here; and at first sight it may appear so. But when we look more closely, perhaps there is no need to make any difficulty: the stress is rather on the words “by *interpretation*,” which, of course, is a different thing from “*usage*;” and by *interpretation* γυνή appears to come *nearer* to “femina” than to “mulier.”" },
  { t = "note", id = "8881", text = "θηλεῖα." },
  { t = "note", id = "8882", text = "Or, “unveiled.”" },
  { t = "note", id = "8883", text = "1 Cor. xi. 5." },
  { t = "note", id = "8884", text = "1 Cor. xi. 4." },
  { t = "note", id = "8885", text = "For a similar use of the word “virgin,” see Rev. xiv. 4." },
  { t = "note", id = "8886", text = "1 Cor. xi. 10." },
  { t = "note", id = "8887", text = "See Gen. vi. 2 in the LXX., with the *v. l.* ed. Tisch. 1860; and compare Tertullian, *de Idol.* c. 9, and the note there. Mr. Dodgson refers, too, to *de Virg. Vel.* c. 7, where this curious subject is more fully entered into." },
  { t = "note", id = "8888", text = "i.e. according to *their* definition, whom Tertullian is refuting." },
  { t = "note", id = "8889", text = "Gen. iv. 2." },
  { t = "note", id = "8890", text = "i.e. If *married women* had been meant, either word, “uxores” or “feminæ,” could have been used indifferently." },
  { t = "note", id = "8891", text = "Gen. vi. 2." },
  { t = "note", id = "8892", text = "1 Cor. xi. 14." },
  { t = "note", id = "8893", text = "i.e. long hair." },
  { t = "note", id = "8894", text = "i.e. veiling." },
  { t = "note", id = "8895", text = "i.e. “exempts.”" },
  { t = "note", id = "8896", text = "i.e. from her creation." },
  { t = "note", id = "8897", text = "Of the “universal veiling of women.”" },
  { t = "note", id = "8898", text = "i.e. as above, the Sermon on the Mount." },
  { t = "note", id = "8899", text = "i.e. mere infancy." },
  { t = "note", id = "8900", text = "Gen. iii. 6." },
  { t = "note", id = "8901", text = "Gen. ii. 27 (or in the LXX. iii. 1), and iii. 7, 10, 11." },
  { t = "note", id = "8902", text = "Routh refers us to *de Virg. Vel.* c. 11." },
  { t = "note", id = "8903", text = "i.e. the redundance of her hair." },
  { t = "note", id = "8904", text = "i.e. by a veil." },
  { t = "note", id = "8905", text = "i.e. says Oehler, “lest we postpone the eternal favour of God, which we hope for, to the temporal veneration of men; a risk which those virgins seemed likely to run who, when devoted to God, used to go veiled in public, but bareheaded in the church.”" },
  { t = "note", id = "8906", text = "i.e. in church." },
  { t = "note", id = "8907", text = "i.e. in public; see note 27, *supra*." },
  { t = "note", id = "8908", text = "1 Cor. iv. 7." },
  { t = "note", id = "8909", text = "i.e. as Muratori, quoted by Oehler, says, your “pious” (?) fraud in pretending to be married when you are a virgin; because “devoted” virgins used to dress and wear veils like married women, as being regarded as “wedded to Christ.”" },
  { t = "note", id = "8910", text = "i.e. each president of a church, or bishop." },
  { t = "note", id = "8911", text = "i.e. “are known to be such through the chastity of their manner and life” (Oehler)." },
  { t = "note", id = "8912", text = "“By appearing in public as married women, while in heart they are virgins” (Oehler)." },
  { t = "note", id = "8913", text = "Does Tertullian refer to 2 Cor. x. 13? or does “modulus” mean, as Oehler thinks, “my rule?” [It seems to me a very plain reference to the text before mentioned, and to the Apostolic Canon of not exceeding one’s Mission.]" },
  { t = "note", id = "8914", text = "Gen. xxiv. 64, 65." },
]

[[section]]
id = "of-kneeling"
title = "Of Kneeling."
level = 1
blocks = [
  { t = "p", text = "Chapter XXIII.—Of Kneeling." },
  { t = "p", text = "In the matter of *kneeling* also prayer is subject to diversity of observance, through the act of some few who abstain from kneeling on the Sabbath; and since this dissension is particularly on its trial before the churches, the Lord will give His grace that the dissentients may either yield, or else indulge their opinion without offence to others. We, however (just as we have received), only on the day of the Lord’s Resurrection ought to guard not only against kneeling, but every posture and office of solicitude; deferring even our businesses lest we give any place to the devil.[^8915] Similarly, too, in the period of Pentecost; which period we distinguish by the same solemnity of exultation.[^8916] But who would hesitate *every* day to prostrate himself before God, at least in the first prayer with which we enter on the daylight? At fasts, moreover, and Stations, no prayer should be made without kneeling, and the remaining customary marks of humility; for (then)[^8917] we are not only *praying*, but *deprecating*, and making satisfaction to God our Lord.[^8918] Touching *times* of prayer nothing at all has been prescribed, except clearly “to pray at every time and every place.”[^8919]" },
  { t = "note", id = "8915", text = "Eph. iv. 27." },
  { t = "note", id = "8916", text = "i.e. abstaining from kneeling: *kneeling* being more “a posture of solicitude” and of humility; *standing*, of “exultation.”" },
  { t = "note", id = "8917", text = "i.e. at fasts and Stations. [Sabbath = Saturday, *supra*.]" },
  { t = "note", id = "8918", text = "For the meaning of “satisfaction” as used by the Fathers, see Hooker, *Eccl. Pol.* vi. 5." },
  { t = "note", id = "8919", text = "Eph. vi. 18; 1 Thess. v. 17; 1 Tim. ii. 8." },
]

[[section]]
id = "of-place-for-prayer"
title = "Of Place for Prayer."
level = 1
blocks = [
  { t = "p", text = "Chapter XXIV.—Of Place for Prayer." },
  { t = "p", text = "But how “in every place,” since we are prohibited[^8920] (from praying) in public? In every place, he means, which opportunity or even necessity, may have rendered suitable: for that which was done by the apostles[^8921] (who, in gaol, in the audience of the prisoners, “began praying and singing to God”) is not considered to have been done contrary to the precept; nor yet that which was done by Paul,[^8922] who in the ship, in presence of all, “made thanksgiving to God.”[^8923]" },
  { t = "note", id = "8920", text = "Matt. vi. 5, 6, which forbids praying in public." },
  { t = "note", id = "8921", text = "Paul and Silas (Acts xvi. 25)." },
  { t = "note", id = "8922", text = "I have followed Muratori’s reading here." },
  { t = "note", id = "8923", text = "Mr. Dodgson renders “celebrated the Eucharist;” but that rendering appears very doubtful. See Acts xxvii. 35." },
]

[[section]]
id = "of-time-for-prayer"
title = "Of Time for Prayer."
level = 1
blocks = [
  { t = "p", text = "Chapter XXV.—Of Time for Prayer." },
  { t = "p", text = "Touching the *time*, however, the extrinsic[^8924] observance of certain hours will not be unprofitable—those common hours, I mean, which mark the intervals of the day—the third, the sixth, the ninth—which we may find in the Scriptures to have been more solemn than the rest. The first infusion of the Holy Spirit into the congregated disciples took place at “the third hour.”[^8925] Peter, on the day on which he experienced the vision of Universal Community,[^8926] (exhibited) in that small vessel,[^8927] had ascended into the more lofty parts *of the house*, for prayer’s sake “at the sixth hour.”[^8928] The same (apostle) was going into the temple, with John, “at the ninth *hour*,”[^8929] when he restored the paralytic to his health. Albeit these *practices* stand simply without any *precept* for their observance, still it may be granted a good thing to establish some definite presumption, which may both add stringency to the admonition to pray, and may, as it were by a law, tear us out from our businesses unto such a duty; so that—what we read to have been observed by Daniel also,[^8930] in accordance (of course) with Israel’s discipline—we pray at least not less than thrice in the day, debtors as we are to Three—Father, Son, and Holy Spirit: of course, in addition to our regular prayers which are due, without any admonition, on the entrance of light and of night. But, withal, it becomes believers not to take food, and not to go to the bath, before interposing a prayer; for the refreshments and nourishments of the spirit are to be held prior to those of the flesh, and things heavenly prior to things earthly." },
  { t = "note", id = "8924", text = "Mr. Dodgson supposes this word to mean “outward, as contrasted with the inward, ‘praying always.’” Oehler interprets, “ex vita communi.” But perhaps what Tertullian says lower down in the chapter, “albeit they stand *simply without any precept enjoining their observance*,” may give us the true clue to his meaning; so that “extrinsecus” would =\"extrinsic to any direct injunction of our Lord or His apostles.”" },
  { t = "note", id = "8925", text = "Acts ii. 1–4, 14, 15." },
  { t = "note", id = "8926", text = "Communitatis omnis (Oehler). Mr. Dodgson renders, “of every sort of common thing.” Perhaps, as Routh suggests, we should read “omnium.”" },
  { t = "note", id = "8927", text = "Vasculo. But in Acts it is, σκεῦός τι ὡς ὀθόνην μεγάλην [*Small* is here comparatively used, with reference to *Universality* of which it was the symbol.]" },
  { t = "note", id = "8928", text = "Acts x. 9." },
  { t = "note", id = "8929", text = "Acts iii. 1: but the man is not said to have been “paralytic,” but “lame from his mother’s womb.”" },
  { t = "note", id = "8930", text = "Dan. vi. 10; comp. Ps. lv. 17 (in the LXX. it is liv. 18)." },
]

[[section]]
id = "of-the-parting-of-brethren"
title = "Of the Parting of Brethren."
level = 1
blocks = [
  { t = "p", text = "Chapter XXVI.—Of the Parting of Brethren." },
  { t = "p", text = "You will not dismiss a brother who has entered your house without prayer.—“Have you seen,” says *Scripture*, “a brother? you have seen your Lord;”[^8931]—especially “a stranger,” lest perhaps he be “an angel.” But again, when received yourself by brethren, you will not make[^8932] earthly refreshments prior to heavenly, for your faith will forthwith be judged. Or else how will you—according to the precept[^8933]—say, “Peace to this *house*,” unless you exchange mutual peace with them who are *in* the house?" },
  { t = "note", id = "8931", text = "I have ventured to turn the first part of the sentence into a question. What “scripture” this may be, no one knows. [It seems to me a clear reference to Matt. xxv. 38, amplified by the 45th verse, in a way not unusual with our author.] Perhaps, in addition to the passages in Gen. xviii. and Heb. xiii. 2, to which the editors naturally refer, Tertullian may allude to such passages as Mark. ix. 37; Matt. xxv. 40, 45. [Christo in pauperibus.]" },
  { t = "note", id = "8932", text = "I have followed Routh’s conjecture, “feceris” for “fecerit,” which Oehler does not even notice." },
  { t = "note", id = "8933", text = "Luke x. 5." },
]

[[section]]
id = "of-subjoining-a-psalm"
title = "Of Subjoining a Psalm."
level = 1
blocks = [
  { t = "p", text = "Chapter XXVII.—Of Subjoining a Psalm." },
  { t = "p", text = "The more diligent in prayer are wont to subjoin in their prayers the “Hallelujah,”[^8934] and such kind of psalms, in the closes of which the company respond. And, of course, every institution is excellent which, for the extolling and honouring of God, aims unitedly to bring Him enriched prayer as a choice victim.[^8935]" },
  { t = "note", id = "8934", text = "Perhaps “the great Hallelujah,” i.e. the last five psalms." },
  { t = "note", id = "8935", text = "[The author seems to have in mind (Hos. xiv. 2) “the calves of our lips.”]" },
]

[[section]]
id = "of-the-spiritual-victim-which-prayer-is"
title = "Of the Spiritual Victim, Which Prayer is."
level = 1
blocks = [
  { t = "p", text = "Chapter XXVIII.—Of the Spiritual Victim, Which Prayer is." },
  { t = "p", text = "For this is the spiritual victim[^8936] which has abolished the pristine sacrifices. “To what purpose,” saith He, “(bring ye) me the multitude of your sacrifices? I am full of holocausts of rams, and I desire not the fat of rams, and the blood of bulls and of goats. For who hath required these from your hands?”[^8937] What, then, God *has* required the Gospel teaches. “An hour will come,” saith He, “when the true adorers shall adore the Father in spirit and truth. For God is a Spirit, and accordingly requires His adorers to be such.”[^8938] We are the true adorers and the true priests,[^8939] who, praying in spirit,[^8940] sacrifice, in spirit, prayer,—a victim proper and acceptable to God, which assuredly He has required, which He has looked forward to[^8941] for Himself! This *victim*, devoted from the whole heart, fed on faith, tended by truth, entire in innocence, pure in chastity, garlanded with love,[^8942] we ought to escort with the pomp[^8943] of good works, amid psalms and hymns, unto God’s altar,[^8944] to obtain for us all things from God." },
  { t = "note", id = "8936", text = "1 Pet. ii. 5." },
  { t = "note", id = "8937", text = "Isa. i. 11. See the LXX." },
  { t = "note", id = "8938", text = "John iv. 23, 24." },
  { t = "note", id = "8939", text = "Sacerdotes; comp. *de Ex. Cast.* c. 7." },
  { t = "note", id = "8940", text = "1 Cor. xiv. 15; Eph. vi. 18." },
  { t = "note", id = "8941", text = "Or, “provided.”" },
  { t = "note", id = "8942", text = "“*Agape*,” perhaps “the love-feast.”" },
  { t = "note", id = "8943", text = "Or, “procession.”" },
  { t = "note", id = "8944", text = "Altare." },
]

[[section]]
id = "of-the-power-of-prayer"
title = "Of the Power of Prayer."
level = 1
blocks = [
  { t = "p", text = "Chapter XXIX.—Of the Power of Prayer." },
  { t = "p", text = "For what has God, who exacts it *ever* denied[^8945] to prayer coming from “spirit and truth?” How mighty specimens of its efficacy do we read, and hear, and believe! *Old-world* prayer, indeed, used to free from fires,[^8946] and from beasts,[^8947] and from famine;[^8948] and yet it had not (then) received its form from Christ. But how far more amply operative is *Christian* prayer! It does not station the angel of dew in mid-fires,[^8949] nor muzzle lions, nor transfer to the hungry the rustics’ bread;[^8950] it has no delegated grace to avert any sense of suffering;[^8951] but it supplies the suffering, and the feeling, and the grieving, with endurance: it amplifies grace by virtue, that faith may know what she obtains from the Lord, understanding what—for God’s name’s sake—she suffers. But in days gone by, withal prayer used to call down[^8952] plagues, scatter the armies of foes, withhold the wholesome influences of the showers. Now, however, the prayer of righteousness averts all God’s anger, keeps bivouac on behalf of personal enemies, makes supplication on behalf of persecutors. Is it wonder if *it* knows how to extort the *rains* of heaven[^8953]—(prayer) which was *once* able to procure its *fires*?[^8954] Prayer is alone that which vanquishes[^8955] God. But Christ has willed that it be operative for no evil: He had conferred on it all its virtue in the cause of good. And so it knows nothing save how to recall the souls of the departed from the very path of death, to transform the weak, to restore the sick, to purge the possessed, to open prison-bars, to loose the bonds of the innocent. Likewise it washes away faults, repels temptations, extinguishes persecutions, consoles the faint-spirited, cheers the high-spirited, escorts travellers, appeases waves, makes robbers stand aghast, nourishes the poor, governs the rich, upraises the fallen, arrests the falling, confirms the standing. Prayer is the wall of faith: her arms and missiles[^8956] against the foe who keeps watch over us on all sides. And, so never walk we unarmed. By day, be we mindful of Station; by night, of vigil. Under the arms of prayer guard we the standard of our General; await we in prayer the angel’s trump.[^8957] The angels, likewise, all pray; every creature prays; cattle and wild beasts pray and bend their knees; and when they issue from their layers and lairs,[^8958] they look up heavenward with no idle mouth, making their breath vibrate[^8959] after their own manner. Nay, the birds too, rising out of the nest, upraise themselves heavenward, and, instead of hands, expand the cross of their wings, and say somewhat to seem like prayer.[^8960] What more then, touching the office of prayer? Even the Lord Himself prayed; to whom be honour and virtue unto the ages of the ages!" },
  { t = "note", id = "8945", text = "Routh would read, “What *will* God *deny*?”" },
  { t = "note", id = "8946", text = "Dan. iii." },
  { t = "note", id = "8947", text = "Dan. vi." },
  { t = "note", id = "8948", text = "1 Kings xviii.; James v. 17, 18." },
  { t = "note", id = "8949", text = "i.e. “the angel who preserved in the furnace the three youths besprinkled, as it were, with dewy shower” (Muratori quoted by Oehler). [Apocrypha, *The Song*, *etc*., verses 26, 27.]" },
  { t = "note", id = "8950", text = "2 Kings iv. 42–44." },
  { t = "note", id = "8951", text = "i.e. in brief, its *miraculous* operations, as they are called, are suspended in these ways." },
  { t = "note", id = "8952", text = "Or, “inflict.”" },
  { t = "note", id = "8953", text = "See *Apolog.* c. 5 (Oehler)." },
  { t = "note", id = "8954", text = "See 2 Kings i." },
  { t = "note", id = "8955", text = "[A reference to Jacob’s wrestling. Also, probably, to Matt. xi. 12.]" },
  { t = "note", id = "8956", text = "Or, “her armour defensive and offensive.”" },
  { t = "note", id = "8957", text = "1 Cor. xv. 52; 1 Thess. iv. 16." },
  { t = "note", id = "8958", text = "Or, “pens and dens.”" },
  { t = "note", id = "8959", text = "As if in prayer." },
  { t = "note", id = "8960", text = "This beautiful passage should be supplemented by a similar one from St. Bernard: “Nonne et aviculas levat, non onerat pennarum numerositas ipsa? Tolle eas, et reliquum corpus pondere suo fertur ad ima. Sic disciplinam Christi, sic suave jugum, sic onus leve, quo deponimus, eo deprimimur ipsi: quia portat potius quam portatur.” Epistola, ccclxxxv. Bernardi Opp. Tom. i. p. 691. Ed. (Mabillon.) Gaume, Paris, 1839. Bearing the cross uplifts the Christian.]" },
]

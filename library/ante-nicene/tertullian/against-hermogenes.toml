[[section]]
id = "an-appeal-to-the-history-of-creation"
title = "An Appeal to the History of Creation. True Meaning of the Term Beginning, Which the Heretic Curiously Wrests to an Absurd Sense."
level = 1
blocks = [
  { t = "p", text = "Chapter XIX.—An Appeal to the History of Creation. True Meaning of the Term Beginning, Which the Heretic Curiously Wrests to an Absurd Sense." },
  { t = "p", text = "But I shall appeal to the original document[^6316] of Moses, by help of which they on the other side vainly endeavour to prop up their conjectures, with the view, of course, of appearing to have the support of that authority which is indispensable in such an inquiry. They have found their opportunity, as is usual with heretics, in wresting the plain meaning of certain words. For instance the very *beginning*,[^6317] when God made the heaven and the earth, they will construe as if it meant something substantial and embodied,[^6318] to be regarded as Matter. We, however, insist on the proper signification of every word, *and say* that *principium* means beginning,—being a term which is suitable to represent things which begin to exist. For nothing which has come into being is without a beginning, nor can this its commencement be at any other moment than when it begins to have existence. Thus *principium* or beginning, is simply a term of inception, not the name of a substance. Now, inasmuch as the heaven and the earth are the principal works of God, and since, by His making them first, He constituted them in an especial manner the beginning of His creation, before all things else, with good reason does the Scripture preface (its record of creation) with the words, “In the beginning God made the heaven and the earth;”[^6319] just as it would have said, “At last God made the heaven and the earth,” if God had created these after all the rest. Now, if the beginning is a substance, the end must also be material. No doubt, a substantial thing[^6320] may be the beginning of some other thing which may be formed out of it; thus the clay is the beginning of the vessel, and the seed is the beginning of the plant. But when we employ the word beginning in this sense of *origin*, and not in that of *order*, we do not omit to mention also the name of that particular thing which we regard as the origin of the other. On the other hand,[^6321] if we were to make such a statement as this, for example, “In the beginning the potter made a basin or a water-jug,” the word beginning will not here indicate a material substance (for I have not mentioned the clay, which is the beginning *in this sense*, but only the *order* of the work, meaning that the potter made the basin and the jug first, before anything else—intending afterwards to make the rest. It is, then, to the order of the works that the word beginning has reference, not to the origin of their substances. I might also explain this word *beginning* in another way, which would not, however, be inapposite.[^6322] The Greek term for beginning, which is ἀρχή, admits the sense not only of priority of order, but of power as well; whence princes and magistrates are called ἀρχοντες. Therefore in this sense too, *beginning* may be taken for princely authority and power. It was, indeed, in His transcendent authority and power, that God made the heaven and the earth." },
  { t = "note", id = "6316", text = "Originale instrumentum: which may mean “the document which treats of the origin of all things.”" },
  { t = "note", id = "6317", text = "Principium." },
  { t = "note", id = "6318", text = "Corpulentum." },
  { t = "note", id = "6319", text = "Gen. i. 1." },
  { t = "note", id = "6320", text = "Substantivum aliquid." },
  { t = "note", id = "6321", text = "De cetero." },
  { t = "note", id = "6322", text = "Non ab re tamen." },
]

[[section]]
id = "meaning-of-the-phrase-in-the-beginning"
title = "Meaning of the Phrase--In the Beginning. Tertullian Connects It with the Wisdom of God, and Elicits from It the Truth that the Creation Was Not Out of Pre-Existent Matter."
level = 1
blocks = [
  { t = "p", text = "Chapter XX.—Meaning of the Phrase—In the Beginning. Tertullian Connects It with the Wisdom of God, and Elicits from It the Truth that the Creation Was Not Out of Pre-Existent Matter." },
  { t = "p", text = "But in proof that the Greek word means nothing else than beginning, and that *beginning* admits of no other sense than the *initial* one, we have that (Being)[^6323] even acknowledging such a beginning, who says: “The Lord possessed[^6324] me, the beginning of His ways for the creation of His works.”[^6325] For since all things were made by the Wisdom of God, it follows that, when God made both the heaven and the earth *in principio*—that is to say, in the beginning—He made them in His Wisdom. If, indeed, beginning had a *material* signification, the Scripture would not have informed us that God made so and so *in principio*, at the beginning, but rather *ex principio*, of the beginning; for He would not have created *in*, but *of*, matter. When Wisdom, however, was referred to, it was quite right to say, in the beginning. For it was in Wisdom that He made all things at first, because by meditating and arranging His plans therein,[^6326] He had in fact already done (the work of creation); and if He had even intended to create out of matter, He would yet have effected His creation when He previously meditated on it and arranged it in His Wisdom, since It[^6327] was in fact the beginning of His ways: this meditation and arrangement being the primal operation of Wisdom, opening as it does the way to the works by the act of meditation and thought.[^6328] This authority of Scripture I claim for myself even from this circumstance, that whilst it shows me the God who created, and the works He created, it does not in like manner reveal to me the source from which He created. For since in every operation there are three principal things, He who makes, and that which is made, and that of which it is made, there must be three names mentioned in a correct narrative of the operation—the person of the maker the sort of thing which is made,[^6329] *and* the material of which it is formed. If the material is not mentioned, while the work and the maker of the work are both mentioned, it is manifest that He made the work out of nothing. For if He had had anything to operate upon, it would have been mentioned as well as (the other two particulars).[^6330] In conclusion, I will apply the Gospel as a supplementary testimony to the Old Testament. Now in this there is all the greater reason why there should be shown the material (if there were any) out of which God made all things, inasmuch as it is therein plainly revealed by whom He made all things. “In the beginning was the Word”[^6331]—that is, the same beginning, of course, in which God made the heaven and the earth[^6332]—“and the Word was with God, and the Word was God. All things were made by Him, and without Him nothing was made.”[^6333] Now, since we have here clearly told us who the Maker was, that is, God, and what He made, even all things, and through whom He made them, even His Word, would not the order of the narrative have required that the source out of which all things were made by God through the Word should likewise be declared, if they had been in fact made out of anything? What, therefore, did not exist, the Scripture was unable to mention; and by not mentioning it, it has given us a clear proof that there was no such thing: for if there had been, the Scripture would have mentioned it." },
  { t = "note", id = "6323", text = "Illam…quæ." },
  { t = "note", id = "6324", text = "Condidit: “created.”" },
  { t = "note", id = "6325", text = "Prov. viii. 22." },
  { t = "note", id = "6326", text = "In qua: in Wisdom." },
  { t = "note", id = "6327", text = "Wisdom." },
  { t = "note", id = "6328", text = "De cogitatu." },
  { t = "note", id = "6329", text = "Species facti." },
  { t = "note", id = "6330", text = "Proinde." },
  { t = "note", id = "6331", text = "John i. 1." },
  { t = "note", id = "6332", text = "Gen. i. 1." },
  { t = "note", id = "6333", text = "John i. 1–3." },
]

[[section]]
id = "a-retort-of-heresy-answered-that-scripture"
title = "A Retort of Heresy Answered. That Scripture Should in So Many Words Tell Us that the World Was Made of Nothing is Superfluous."
level = 1
blocks = [
  { t = "p", text = "Chapter XXI.—A Retort of Heresy Answered. That Scripture Should in So Many Words Tell Us that the World Was Made of Nothing is Superfluous." },
  { t = "p", text = "But, you will say to me, if you determine that all things were made of nothing, on the ground that it is not told us that anything was made out of pre-existent Matter, take care that it be not contended on the opposite side, that on the same ground all things were made out of Matter, because it is not likewise expressly said that anything was made out of nothing. Some arguments may, of course,[^6334] be thus retorted easily enough; but it does not follow that they are on that account fairly admissible, where there is a diversity in the cause. For I maintain that, even if the Scripture has not expressly declared that all things were made out of nothing—just as it abstains (from saying that they were formed) out of Matter—there was no such pressing need for expressly indicating the creation of all things out of nothing, as there was of their creation out of Matter, if that had been their origin. Because, in the case of what is made out of nothing, the very fact of its not being indicated that it was made of any particular thing shows that it was made of nothing; and there is no danger of its being supposed that it was made of anything, when there is no indication at all of what it was made of. In the case, however, of that which is made out of something, unless the very fact be plainly declared, that it was made out of something, there will be danger, until[^6335] it is shown of what it was made, first of its appearing to be made of nothing, because it is not said of what it was made; and then, should it be of such a nature[^6336] as to have the appearance of having certainly been made of something, there will be a similar risk of its seeming to have been made of a far different material from the proper one, so long as there is an absence of statement of what it was made of. Then, if God had been unable to make all things of nothing, the Scripture could not possibly have added that He had made all things of nothing: (there could have been no room for such a statement,) but it must by all means have informed us that He had made all things out of Matter, since Matter must have been the source; because the one case was quite to be understood,[^6337] if it were not actually stated, whereas the other case would be left in doubt unless it were stated." },
  { t = "note", id = "6334", text = "Plane." },
  { t = "note", id = "6335", text = "Dum ostenditur: which Oehler and Rigalt. construe as “donec ostendatur.” One reading has “dum *non* ostenditur,” “so long as it is not shown.”" },
  { t = "note", id = "6336", text = "Ea conditione." },
  { t = "note", id = "6337", text = "In totum habebat intelligi." },
]

[[section]]
id = "this-conclusion-confirmed-by-the-usage-of"
title = "This Conclusion Confirmed by the Usage of Holy Scripture in Its History of the Creation. Hermogenes in Danger of the Woe Pronounced Against Adding to Scripture."
level = 1
blocks = [
  { t = "p", text = "Chapter XXII.—This Conclusion Confirmed by the Usage of Holy Scripture in Its History of the Creation. Hermogenes in Danger of the Woe Pronounced Against Adding to Scripture." },
  { t = "p", text = "And to such a degree has the Holy Ghost made this the rule of His Scripture, that whenever anything is made out of anything, He mentions both the thing that is made and the thing of which it is made. “Let the earth,” says He, “bring forth grass, the herb yielding seed, and the fruit-tree yielding fruit after its kind, whose seed is in itself, after its kind. And it was so. And the earth brought forth grass, and herb yielding seed after its kind, and the tree yielding fruit, whose seed was in itself, after its kind.”[^6338] And again: “And God said, Let the waters bring forth abundantly the moving creatures that have life, and fowl that may fly above the earth through the firmament of heaven. And it was so. And God created great whales, and every living creature that moveth, which the waters brought forth abundantly, after their kind.”[^6339] Again afterwards: “And God said, Let the earth bring forth the living creature after his kind, cattle, and creeping thing, and beasts of the earth after their kind.”[^6340] If therefore God, when producing other things out of things which had been already made, indicates them by the prophet, and tells us what He has produced from such and such a source[^6341] (although we might ourselves suppose them to be derived from some source or other, short of nothing;[^6342] since there had already been created certain things, from which they might easily seem to have been made); if the Holy Ghost took upon Himself so great a concern for our instruction, that we might know from what everything was produced,[^6343] would He not in like manner have kept us well informed about both the heaven and the earth, by indicating to us what it was that He made them of, if their original consisted of any material substance, so that the more He seemed to have made them of nothing, the less in fact was there as yet made, from which He could appear to have made them? Therefore, just as He shows us the original out of which He drew such things as were derived from a given source, so also with regard to those things of which He does not point out whence He produced them, He confirms (by that silence our assertion) that they were produced out of nothing. “In the beginning,” then, “God made the heaven and the earth.”[^6344] I revere[^6345] the fulness of His Scripture, in which He manifests to me both the Creator and the creation. In the gospel, moreover, I discover a Minister and Witness of the Creator, even His Word.[^6346] But whether all things were made out of any underlying Matter, I have as yet failed anywhere to find. Where such a statement is written, Hermogenes’ shop[^6347] must tell us. If it is nowhere written, then let it fear the *woe* which impends on all who add to or take away from *the written word*.[^6348]" },
  { t = "note", id = "6338", text = "Gen. i. 11, 12." },
  { t = "note", id = "6339", text = "Gen. i. 20, 21." },
  { t = "note", id = "6340", text = "Ver. 24." },
  { t = "note", id = "6341", text = "Quid unde protulerit: properly a double question =\"what was produced, and whence?”" },
  { t = "note", id = "6342", text = "Unde unde…dumne." },
  { t = "note", id = "6343", text = "Quid unde processerit: properly a double question =\"what was produced, and whence?”" },
  { t = "note", id = "6344", text = "Gen. i. 1." },
  { t = "note", id = "6345", text = "Adoro: reverently admire." },
  { t = "note", id = "6346", text = "John i. 3." },
  { t = "note", id = "6347", text = "Officina." },
  { t = "note", id = "6348", text = "Rev. xxii. 18, 19." },
]

[[section]]
id = "hermogenes-pursued-to-another-passage-of-scripture"
title = "Hermogenes Pursued to Another Passage of Scripture. The Absurdity of His Interpretation Exposed."
level = 1
blocks = [
  { t = "p", text = "Chapter XXIII.—Hermogenes Pursued to Another Passage of Scripture. The Absurdity of His Interpretation Exposed." },
  { t = "p", text = "But he draws an argument from the following words, where it is written: “And the earth was without form, and void.”[^6349] For he resolves[^6350] the word *earth* into Matter, because that which is made out of it is the earth. And to the word *was* he gives the same direction, as if it pointed to what had always existed unbegotten and unmade. It was *without form*, moreover, *and* void, because he will have Matter to have existed shapeless and confused, and without the finish of a maker’s hand.[^6351] Now these opinions of his I will refute singly; but first I wish to say to him, by way of general answer: We are of opinion that Matter is pointed at in these terms. But yet does the Scripture intimate that, because Matter was in existence before all, anything of *like* condition[^6352] was even formed out of it? Nothing of the kind. Matter might have had existence, if it so pleased—or rather if Hermogenes so pleased. It might, I say, have existed, and yet God might not have made anything out of it, either as it was unsuitable to Him to have required the aid of anything, or at least because He is not shown to have made anything out of Matter. Its existence must therefore be without a cause, you will say. Oh, no! certainly[^6353] not without cause. For even if the world were not made out of it, yet a heresy has been hatched there from; and a specially impudent one too, because it is not Matter which has produced the heresy, but the heresy has rather made Matter itself." },
  { t = "note", id = "6349", text = "Gen. i. 2." },
  { t = "note", id = "6350", text = "Redigit in." },
  { t = "note", id = "6351", text = "Inconditam: we have combined the two senses of the word." },
  { t = "note", id = "6352", text = "Tale aliquid." },
  { t = "note", id = "6353", text = "Plane: ironical." },
]

[[section]]
id = "earth-does-not-mean-matter-as-hermogenes"
title = "Earth Does Not Mean Matter as Hermogenes Would Have It."
level = 1
blocks = [
  { t = "p", text = "Chapter XXIV.—Earth Does Not Mean Matter as Hermogenes Would Have It." },
  { t = "p", text = "I now return to the several points[^6354] by means of which he thought that Matter was signified. And first I will inquire about the terms. For we read only of one of them, *Earth*; the other, namely *Matter*, we do not meet with. I ask, then, since Matter is not mentioned in Scripture, how the term earth can be applied to it, which marks a substance of another kind? There is all the greater need why mention should also have been made of Matter, if this has acquired the further sense of Earth, in order that I may be sure that Earth is one and the same name as Matter, and so not claim the designation for merely one substance, as the proper name thereof, and by which it is better known; or else be unable (if I should feel the inclination), to apply it to some particular species of Matter, instead, indeed,[^6355] of making it the common term[^6356] of all Matter. For when a proper name does not exist for that thing to which a common term is ascribed, the less apparent[^6357] is the object to which it may be ascribed, *the more* capable will it be of being applied to any other object whatever. Therefore, even supposing that Hermogenes could show us the *name*[^6358] Matter, he is bound to prove to us further, that the same object has the *surname*[^6359] Earth, in order that he may claim for it both designations alike." },
  { t = "note", id = "6354", text = "Articulos." },
  { t = "note", id = "6355", text = "Nec utique." },
  { t = "note", id = "6356", text = "Communicare." },
  { t = "note", id = "6357", text = "We have construed Oehler’s reading: “Quanto non comparet” (*i.e.*, by a frequent ellipse of Tertullian, “quanto *magis* non comparet”). Fr. Junius, however, suspects that instead of “quanto” we should read “quando”: this would produce the sense, “since it is not apparent to what object it may be ascribed,” etc." },
  { t = "note", id = "6358", text = "Nominatam." },
  { t = "note", id = "6359", text = "Cognominatam." },
]

[[section]]
id = "the-assumption-that-there-are-two-earths"
title = "The Assumption that There are Two Earths Mentioned in the History of the Creation, Refuted."
level = 1
blocks = [
  { t = "p", text = "Chapter XXV.—The Assumption that There are Two Earths Mentioned in the History of the Creation, Refuted." },
  { t = "p", text = "He accordingly maintains that there are two earths set before us in the passage in question: one, which God made in the beginning; the other being the Matter of which God made the world, and concerning which it is said, “And the earth was without form, and void.”[^6360] Of course, if I were to ask, to which of the two earths the name *earth* is best suited,[^6361] I shall be told that the earth which was made derived the appellation from that of which it was made, on the ground that it is more likely that the offspring should get its name from the original, than the original from the offspring. This being the case, another question presents itself to us, whether it is right and proper that this earth which God made should have derived its name from that out of which He made it? For I find from Hermogenes and the rest of the *Materialist* heretics,[^6362] that while the one earth was indeed “without form, and void,” this one of ours obtained from God in an equal degree[^6363] both form, and beauty, and symmetry; and therefore that the earth which was created was a different thing from that out of which it was created. Now, having become a different thing, it could not possibly have shared with the other in its name, after it had declined from its condition. If *earth* was the proper name of the (original) Matter, this world of ours, which is not Matter, because it has become another thing, is unfit to bear the name of earth, seeing that that name belongs to something else, and is a stranger to its nature. But (you will tell me) Matter which has undergone creation, that is, our earth, had with its original a community of name no less than of kind. By no means. For although the pitcher is formed out of the clay, I shall no longer call it clay, but a pitcher; so likewise, although *electrum*[^6364] is compounded of gold and silver, I shall yet not call it either gold or silver, but *electrum*. When there is a departure from the nature of any thing, there is likewise a relinquishment of its name—with a propriety which is alike demanded by the designation and the condition. How great a change indeed from the condition of that earth, which is Matter, has come over this earth of ours, is plain even from the fact that the latter has received this testimony to its goodness in Genesis, “And God saw that it was good;”[^6365] while the former, according to Hermogenes, is regarded as the origin and cause of all evils. Lastly, if the one is Earth because the other is, why also is the one not Matter as the other is? Indeed, by this rule both the heaven and all creatures ought to have had the names of *Earth* and *Matter*, since they all consist of Matter. I have said enough touching the designation Earth, by which he will have it that Matter is understood. This, as everybody knows, is the name of one of the elements; for so we are taught by nature first, and afterwards by Scripture, except it be that credence must be given to that Silenus who talked so confidently in the presence of king Midas of another world, according to the account of Theopompus. But the same author informs us that there are also several gods." },
  { t = "note", id = "6360", text = "Gen. i. 2." },
  { t = "note", id = "6361", text = "Quæ cui nomen terræ accommodare debeat. This is literally a double question, asking about the fitness of the name, and to which earth it is best adapted." },
  { t = "note", id = "6362", text = "He means those who have gone wrong on the eternity of *matter*." },
  { t = "note", id = "6363", text = "Proinde." },
  { t = "note", id = "6364", text = "A mixed metal, of the colour of *amber*." },
  { t = "note", id = "6365", text = "Gen. i. 31." },
]

[[section]]
id = "the-method-observed-in-the-history-of"
title = "The Method Observed in the History of the Creation, in Reply to the Perverse Interpretation of Hermogenes."
level = 1
blocks = [
  { t = "p", text = "Chapter XXVI.—The Method Observed in the History of the Creation, in Reply to the Perverse Interpretation of Hermogenes." },
  { t = "p", text = "We, however, have but one God, and but one earth too, which in the beginning God made.[^6366] The Scripture, which at its very outset proposes to run through the order thereof tells us as its first information that it was created; it next proceeds to set forth what sort of earth it was.[^6367] In like manner with respect to the heaven, it informs us first of its creation—“In the beginning God made the heaven:”[^6368] it then goes on to introduce its arrangement; how that God both separated “the water which was below the firmament from that which was above the firmament,”[^6369] and called the firmament heaven,[^6370]—the very thing He had created in the beginning. Similarly it (afterwards) treats of man: “And God created man, in the image of God made He him.”[^6371] It next reveals how He made him: “And (the Lord) God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul.”[^6372] Now this is undoubtedly[^6373] the correct and fitting mode for the narrative. First comes a prefatory statement, then follow the details in full;[^6374] first the subject is named, then it is described.[^6375] How absurd is the other view of the account,[^6376] when even before he[^6377] had premised any mention of his subject, *i.e.* Matter, without even giving us its name, he all on a sudden promulged its form and condition, describing to us its quality before mentioning its existence,—pointing out the figure of the thing formed, *but* concealing its name! But how much more credible is our opinion, which holds that Scripture has only subjoined the arrangement of the subject after it has first duly described its formation and mentioned its name! Indeed, how full and complete[^6378] is the meaning of these words: “In the beginning God created the heaven and the earth; but[^6379] the earth was without form, and void,”[^6380]—the very same earth, no doubt, which God made, and of which the Scripture had been speaking at that very moment.[^6381] For that very “*but*”[^6382] is inserted into the narrative like a clasp,[^6383] (in its function) of a conjunctive particle, to connect *the two sentences indissolubly together*: “*But* the earth.” This word carries back the mind to that earth of which mention had just been made, and binds the sense thereunto.[^6384] Take away this “but,” and the tie is loosened; so much so that the passage, “But the earth was without form, and void,” may then seem to have been meant for any other earth." },
  { t = "note", id = "6366", text = "Gen. i. 1." },
  { t = "note", id = "6367", text = "Qualitatem ejus: unless this means “*how* He made it,” like the “qualiter fecerit” below." },
  { t = "note", id = "6368", text = "Gen. i. 1." },
  { t = "note", id = "6369", text = "Gen. i. 7." },
  { t = "note", id = "6370", text = "Ver. 8." },
  { t = "note", id = "6371", text = "Gen. i. 27." },
  { t = "note", id = "6372", text = "Gen. ii. 7." },
  { t = "note", id = "6373", text = "Utique." },
  { t = "note", id = "6374", text = "Prosequi." },
  { t = "note", id = "6375", text = "Primo præfari, postea prosequi; nominare, deinde describere. This properly is an *abstract* statement, given with Tertullian’s usual terseness: “First you should (‘decet’) give your preface, then follow up with details: first name your subject, then describe it.”" },
  { t = "note", id = "6376", text = "Alioquin." },
  { t = "note", id = "6377", text = "Hermogenes, whose view of the narrative is criticised." },
  { t = "note", id = "6378", text = "Integer." },
  { t = "note", id = "6379", text = "Autem." },
  { t = "note", id = "6380", text = "Gen. i. 1, 2." },
  { t = "note", id = "6381", text = "Cum maxime edixerat." },
  { t = "note", id = "6382", text = "The “autem” of the note just before this." },
  { t = "note", id = "6383", text = "Fibula." },
  { t = "note", id = "6384", text = "Alligat sensum." },
]

[[section]]
id = "some-hair-splitting-use-of-words-in"
title = "Some Hair-Splitting Use of Words in Which His Opponent Had Indulged."
level = 1
blocks = [
  { t = "p", text = "Chapter XXVII.—Some Hair-Splitting Use of Words in Which His Opponent Had Indulged." },
  { t = "p", text = "But you next praise your eyebrows, and toss back your head, and beckon with your finger, in characteristic disdain,[^6385] and say: There is the *was*, looking as if it pointed to an eternal existence,—making its subject, of course, unbegotten and unmade, and on that account worthy of being supposed to be Matter. Well now, for my own part, I shall resort to no affected protestation,[^6386] but simply reply that “*was*” may be predicated of everything—even of a thing which has been created, which was born, which once was not, and which is not *your* Matter. For of everything which has being, from whatever source it has it, whether it has it by a beginning or without a beginning, the word “*was*” will be predicated from the very fact that it exists. To whatever thing the first tense[^6387] of the verb is applicable for *definition*, to the same will be suitable the later form[^6388] of the verb, when it has to descend to *relation*. “Est” (it is) forms the essential part[^6389] of a definition, “erat” (it was) of a relation. Such are the trifles and subtleties of heretics, who wrest and bring into question the simple meaning of the commonest words. A grand question it is, to be sure,[^6390] whether “the earth *was*,” which was made! The real point of discussion is, whether “being without form, and void,” is a state which is more suitable to that which was created, or to that of which it was created, so that the predicate (*was*) may appertain to the same thing to which the subject (*that which was*) also belongs.[^6391]" },
  { t = "note", id = "6385", text = "Implied in the emphatic *tu*." },
  { t = "note", id = "6386", text = "Sine u lo lenocinio pronunciationis." },
  { t = "note", id = "6387", text = "Prima positio: the first inflection perhaps, i.e. *the present tense*." },
  { t = "note", id = "6388", text = "Declinatio: the past tense." },
  { t = "note", id = "6389", text = "Caput." },
  { t = "note", id = "6390", text = "Scilicet." },
  { t = "note", id = "6391", text = "This seems to be the meaning of the obscure passage, “Ut ejusdem sit *Erat* cujus et quod erat.”" },
]

[[section]]
id = "a-curious-inconsistency-in-hermogenes-exposed-certain"
title = "A Curious Inconsistency in Hermogenes Exposed. Certain Expressions in The History of Creation Vindicated in The True Sense."
level = 1
blocks = [
  { t = "p", text = "Chapter XXVIII.—A Curious Inconsistency in Hermogenes Exposed. Certain Expressions in The History of Creation Vindicated in The True Sense." },
  { t = "p", text = "But we shall show not only that this condition[^6392] agreed with this earth of ours, but that it did not agree with that other (insisted on by Hermogenes). For, inasmuch as pure Matter was thus subsistent with God,[^6393] without the interposition indeed of any element at all (because as yet there existed nothing but itself and God), it could not of course have been invisible. Because, although *Hermogenes* contends that darkness was inherent in the substance of Matter, a position which we shall have to meet in its proper place,[^6394] yet darkness is visible even to a human being (for the very fact that there is the darkness is an evident one), much more is it so to God. If indeed it[^6395] had been invisible, its quality would not have been by any means discoverable. How, then, did Hermogenes find out[^6396] that that substance was “without form,” and confused and disordered, which, as being invisible, was not palpable to his senses? If this mystery was revealed to him by God, he ought to give us his proof. I want to know also, whether (the substance in question) could have been described as “void.” That certainly is “void” which is imperfect. Equally certain is it, that nothing can be imperfect but that which is made; it is imperfect when it is not fully made.[^6397] Certainly, you admit. Matter, therefore, which was not made at all, could not have been imperfect; and what was not imperfect was not “void.” Having no beginning, because it was not made, it was also unsusceptible of any void-condition.[^6398] For this void-condition is an accident of beginning. The earth, on the contrary, which was made, was deservedly called “void.” For as soon as it was made, it had the condition of being imperfect, previous to its completion." },
  { t = "note", id = "6392", text = "Habitum." },
  { t = "note", id = "6393", text = "Deo subjacebat." },
  { t = "note", id = "6394", text = "See below, ch. xxx. p. 494." },
  { t = "note", id = "6395", text = "Matter." },
  { t = "note", id = "6396", text = "“Compertus est” is here a deponent verb." },
  { t = "note", id = "6397", text = "Minus factum." },
  { t = "note", id = "6398", text = "Rudimento. Tertullian uses the word “rudis” (unformed) for the scriptural term (“void”); of this word “rudimentum” is the abstract." },
]

[[section]]
id = "the-gradual-development-of-cosmical-order-out"
title = "The Gradual Development of Cosmical Order Out of Chaos in the Creation, Beautifully Stated."
level = 1
blocks = [
  { t = "p", text = "Chapter XXIX.—The Gradual Development of Cosmical Order Out of Chaos in the Creation, Beautifully Stated." },
  { t = "p", text = "God, indeed, consummated all His works in a due order; at first He paled them out,[^6399] as it were, in their unformed elements, and then He arranged them[^6400] in their finished beauty. For He did not all at once inundate light with the splendour of the sun, nor all at once temper darkness with the moon’s assuaging ray.[^6401] The heaven He did not all at once bedeck[^6402] with constellations and stars, nor did He at once fill the seas with their teeming monsters.[^6403] The earth itself He did not endow with its varied fruitfulness all at once; but at first He bestowed upon it being, and then He filled it, that it might not be made in vain.[^6404] For thus says Isaiah: “He created it not in vain; He formed it to be inhabited.”[^6405] Therefore after it was made, and while awaiting its perfect state,[^6406] it was “without form, and void:” “void” indeed, from the very fact that it was without form (as being not yet perfect to the sight, and at the same time unfurnished as yet with its other qualities);[^6407] and “without form,” because it was still covered with waters, as if with the rampart of its fecundating moisture,[^6408] by which is produced our flesh, in a form allied with its own. For to this purport does David say:[^6409] “The earth is the Lord’s, and the fulness thereof; the world, and all that dwell therein: He hath founded it upon the seas, and on the streams hath He established it.”[^6410] It was when the waters were withdrawn into their hollow abysses that the dry land became conspicuous,[^6411] which was hitherto covered with its watery envelope. Then it forthwith becomes “visible,”[^6412] God saying, “Let the water be gathered together into one mass,[^6413] and let the dry land appear.”[^6414] “*Appear*,” says He, not “*be made*.” It had been already made, only in its invisible condition it was then waiting[^6415] to appear. “Dry,” because it was about to become such by its severance from the moisture, but yet “land.” “And God called the dry land *Earth*,”[^6416] not Matter. And so, when it afterwards attains its perfection, it ceases to be accounted void, when God declares, “Let the earth bring forth grass, the herb yielding seed after its kind, and according to its likeness, and the fruit-tree yielding fruit, whose seed is in itself, after its kind.”[^6417] Again: “Let the earth bring forth the living creature after his kind, cattle, and creeping things, and beasts of the earth, after their kind.”[^6418] Thus the divine Scripture accomplished its full order. For to that, which it had at first described as “without form (invisible) and void,” it gave both visibility and completion. Now no other Matter was “without form (invisible) and void.” Henceforth, then, Matter will have to be visible and complete. So that I must[^6419] see Matter, since it has become visible. I must likewise recognize it as a completed thing, so as to be able to gather from it the herb bearing seed, and the tree yielding fruit, and that living creatures, made out of it, may minister to my need. Matter, however, is nowhere,[^6420] but the Earth is here, confessed to my view. I see it, I enjoy it, ever since it ceased to be “without form (invisible), and void.” Concerning it most certainly did Isaiah speak when he said, “Thus saith the Lord that created the heavens, He was the God that formed the earth, and made it.”[^6421] The same earth for certain did He form, which He also made. Now how did He form[^6422] it? Of course by saying, “Let the dry land appear.”[^6423] Why does He command it to appear, if it were not previously invisible? *His purpose was* also, that He might thus prevent His having made it in vain, by rendering it visible, and so fit for use. And thus, throughout, proofs arise to us that this earth which we inhabit is the very same which was both created and formed[^6424] by God, and that none other was “Without form, and void,” than that which had been created and formed. It therefore follows that the sentence, “Now the earth was without form, and void,” applies to that same earth which God mentioned separately along with the heaven.[^6425]" },
  { t = "note", id = "6399", text = "Depalans." },
  { t = "note", id = "6400", text = "Dedicans: “disposed” them." },
  { t = "note", id = "6401", text = "Solatio lunæ: a beautiful expression!" },
  { t = "note", id = "6402", text = "Significavit." },
  { t = "note", id = "6403", text = "Belluis." },
  { t = "note", id = "6404", text = "In vacuum: void." },
  { t = "note", id = "6405", text = "Isa. xlv. 18." },
  { t = "note", id = "6406", text = "Futura etiam perfecta." },
  { t = "note", id = "6407", text = "De reliquo nondum instructa." },
  { t = "note", id = "6408", text = "Genitalis humoris." },
  { t = "note", id = "6409", text = "Canit: “sing,” as the Psalmist." },
  { t = "note", id = "6410", text = "Ps. xxiv. 1." },
  { t = "note", id = "6411", text = "Emicantior." },
  { t = "note", id = "6412", text = "“Visibilis” is here the opposite of the term “invisibilis,” which Tertullian uses for the Scripture phrase “without form.”" },
  { t = "note", id = "6413", text = "In congregatione una." },
  { t = "note", id = "6414", text = "Gen. i. 9." },
  { t = "note", id = "6415", text = "Sustinebat: i.e. expectabat (Oehler)." },
  { t = "note", id = "6416", text = "Gen. i. 10." },
  { t = "note", id = "6417", text = "Ver. 11." },
  { t = "note", id = "6418", text = "Ver. 24." },
  { t = "note", id = "6419", text = "Volo." },
  { t = "note", id = "6420", text = "He means, of course, the theoretic “Matter” of Hermogenes." },
  { t = "note", id = "6421", text = "Isa. xlv. 18." },
  { t = "note", id = "6422", text = "Demonstravit: “make it visible.” Tertullian here all along makes *form* and *visibility* synonymous." },
  { t = "note", id = "6423", text = "Gen. i. 9." },
  { t = "note", id = "6424", text = "Ostensam: “manifested” (see note 10, p. 96.)" },
  { t = "note", id = "6425", text = "Cum cælo separavit: Gen. i. 1." },
]

[[section]]
id = "another-passage-in-the-sacred-history-of"
title = "Another Passage in the Sacred History of the Creation, Released from the Mishandling of Hermogenes."
level = 1
blocks = [
  { t = "p", text = "Chapter XXX.—Another Passage in the Sacred History of the Creation, Released from the Mishandling of Hermogenes." },
  { t = "p", text = "The following words will in like manner apparently corroborate the conjecture of Hermogenes, “And darkness was upon the face of the deep, and the Spirit of God moved upon the face of the water;”[^6426] as if these blended[^6427] substances, presented us with arguments for his massive pile *of Matter*.[^6428] Now, so discriminating an enumeration of certain and distinct elements (as we have in this passage), which severally designates “darkness,” “the deep,” “the Spirit of God,” “the waters,” forbids the inference that anything confused or (from such confusion) uncertain is meant. Still more, when He ascribed to them their own places,[^6429] “darkness *on the face of* the deep,” “the Spirit *upon the face of* the waters,” He repudiated all confusion in the substances; and by demonstrating their separate position,[^6430] He demonstrated also their distinction. Most absurd, indeed, would it be that Matter, which is introduced to our view as “without form,” should have its “formless” condition maintained by so many words indicative of form,[^6431] without any intimation of what that confused body[^6432] is, which must of course be supposed to be unique,[^6433] since it is without form.[^6434] For that which is without form is uniform; but even[^6435] that which is without form, when it is blended together[^6436] from various component parts,[^6437] must necessarily have one outward appearance;[^6438] and it has not any appearance, until it has the one appearance (which comes) from many parts *combined*.[^6439] Now Matter either had those specific parts[^6440] within itself, from the words indicative of which it had to be understood—I mean “darkness,” and “the deep,” and “the Spirit,” and “the waters”—or it had them not. If it had them, how is it introduced as being “without form?”[^6441] If it had them not, how does it become known?[^6442]" },
  { t = "note", id = "6426", text = "Gen. i. 2." },
  { t = "note", id = "6427", text = "Confusæ." },
  { t = "note", id = "6428", text = "Massalis illius molis." },
  { t = "note", id = "6429", text = "Situs." },
  { t = "note", id = "6430", text = "Dispositionem." },
  { t = "note", id = "6431", text = "Tot formarum vocabulis." },
  { t = "note", id = "6432", text = "Corpus confusionis." },
  { t = "note", id = "6433", text = "Unicum." },
  { t = "note", id = "6434", text = "Informe." },
  { t = "note", id = "6435", text = "Autem." },
  { t = "note", id = "6436", text = "Confusum." },
  { t = "note", id = "6437", text = "Ex varietate." },
  { t = "note", id = "6438", text = "Unam speciem." },
  { t = "note", id = "6439", text = "Unam ex multis speciem." },
  { t = "note", id = "6440", text = "Istas species." },
  { t = "note", id = "6441", text = "Non habens formas." },

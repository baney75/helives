[[section]]
id = "chapter-1"
title = "Chapter I. The Opinions of Hermogenes, by the Prescriptive Rule of Antiquity Shown to Be Heretical. Not Derived from Christianity, But from Heathen Philosophy. Some of the Tenets Mentioned."
level = 1
blocks = [
  { t = "h", text = "III." },
  { t = "h", text = "Against Hermogenes." },
  { t = "h", text = "Containing an Argument Against His Opinion that Matter is Eternal." },
  { t = "h", text = "[Translated by Dr. Holmes.]" },
  { t = "p", text = "Chapter I.—The Opinions of Hermogenes, by the Prescriptive Rule of Antiquity Shown to Be Heretical. Not Derived from Christianity, But from Heathen Philosophy. Some of the Tenets Mentioned." },
  { t = "p", text = "We are accustomed, for the purpose of shortening argument,[^6129] to lay down the rule against heretics of the *lateness* of their date.[^6130] For in *as* far as by our rule, priority is given to the truth, which also foretold that there would be heresies, in *so* far must all later opinions be prejudged as heresies, being such as were, by the more ancient rule of truth, predicted as (one day) to happen. Now, the doctrine of Hermogenes has this[^6131] taint of novelty. He is, in short,[^6132] a man *living* in the world at the present time; by his very nature a heretic, and turbulent withal, who mistakes loquacity for eloquence, and supposes impudence to be firmness, and judges it to be the duty of a good conscience to speak ill of individuals.[^6133] Moreover, he despises God’s law in his painting,[^6134] maintaining repeated marriages,[^6135] alleges the law of God in defence of lust,[^6136] *and yet* despises it in respect of his art.[^6137] He falsifies by a twofold process—with his cautery and his pen.[^6138] He is a thorough adulterer, both doctrinally and carnally, since he is rank indeed with the contagion of your marriage-hacks,[^6139] and has also failed in cleaving to the rule of faith as much as the apostle’s own Hermogenes.[^6140] However, never mind the man, when it is his doctrine which I question. He does not appear to acknowledge any other Christ as Lord,[^6141] though he holds Him in a different way; but by this difference in his faith he really makes Him another being,—nay, he takes from Him everything which is God, since he will not have it that He made all things of nothing. For, turning away from Christians to the philosophers, from the Church to the Academy and the Porch, he learned there from the Stoics how to place Matter (on the same level) with the Lord, just as if it too had existed ever both unborn and unmade, having no beginning at all nor end, out of which, according to him,[^6142] the Lord afterwards created all things." },
  { t = "note", id = "6129", text = "Compendii gratia. [The reference here to the *De Præscript.* forbids us to date this tract earlier than 207 a.d. Of this Hermogenes, we only know that he was probably a Carthaginian, a painter, and of a versatile and clever mind.]" },
  { t = "note", id = "6130", text = "This is the criterion prescribed in the *Præscript. Hæret.*xxxi. xxxiv., and often applied by Tertullian. See our *Anti-Marcion*, pp. 272, 345, 470, and *passim*." },
  { t = "note", id = "6131", text = "The *tam* novella is a relative phrase, referring to the fore-mentioned *rule*." },
  { t = "note", id = "6132", text = "Denique." },
  { t = "note", id = "6133", text = "Maldicere singuiis." },
  { t = "note", id = "6134", text = "Probably by painting idols (Rigalt.; and so Neander)." },
  { t = "note", id = "6135", text = "It is uncertain whether Tertullian means to charge Hermogenes with defending *polygamy*, or only *second marriages*, in the phrase *nubit assidue*. Probably the latter, which was offensive to the rigorous Tertullian; and so Neander puts it." },
  { t = "note", id = "6136", text = "Quoting Gen. i. 28, “Be fruitful and multiply” (Rigalt.)." },
  { t = "note", id = "6137", text = "Disregarding the law when it forbids the representation of idols. (Rigalt.)." },
  { t = "note", id = "6138", text = "Et cauterio et stilo. The former instrument was used by the encaustic painters for *burning in* the wax colours into the ground of their pictures (Westropp’s *Handbook of Archæology*, p. 219). Tertullian charges Hermogenes with using his encaustic art to the injury of the scriptures, by practically violating their precepts in his artistic works; and with using his pen (stilus) in corrupting the doctrine thereof by his heresy." },
  { t = "note", id = "6139", text = "By the *nubentium contagium*, Tertullian, in his Montanist rigour, censures those who married more than once." },
  { t = "note", id = "6140", text = "2 Tim. i. 15." },
  { t = "note", id = "6141", text = "Thus differing from Marcion." },
  { t = "note", id = "6142", text = "The force of the subjunctive, ex qua *fecerit*." },
]

[[section]]
id = "hermogenes-after-a-perverse-induction-from-mere"
title = "Hermogenes, After a Perverse Induction from Mere Heretical Assumptions, Concludes that God Created All Things Out of Pre-Existing Matter."
level = 1
blocks = [
  { t = "p", text = "Chapter II.—Hermogenes, After a Perverse Induction from Mere Heretical Assumptions, Concludes that God Created All Things Out of Pre-Existing Matter." },
  { t = "p", text = "Our very bad painter has coloured this his primary shade absolutely without any light, with such arguments as these: He begins with laying down the premiss,[^6143] that the Lord made all things either out of Himself, or out of nothing, or out of something; in order that, after he has shown that it was impossible for Him to have made them either out of Himself or out of nothing, he might thence affirm the residuary proposition that He made them out of something, and therefore that that something was Matter. He could not have made all things, he says, of Himself; because whatever things the Lord made of Himself would have been parts of Himself; but[^6144] He is not dissoluble into parts,[^6145] because, being the Lord, He is indivisible, and unchangeable, and always the same. Besides, if He had made anything out of Himself, it would have been something of Himself. Everything, however, both which was made and which He made must be accounted imperfect, because it was made of a part, and He made it of a part; or if, again, it was a whole which He made, who is a whole Himself, He must in that case have been at once both a whole, and yet not a whole; because it behoved Him to be a whole, that He might produce Himself,[^6146] and yet not a whole, that He might be produced out of Himself.[^6147] But this is a most difficult position. For if He were in existence, He could not be made, for He was in existence already; if, however, he were not in existence He could not make, because He was a nonentity. He *maintains*, moreover, that He who always exists, does not *come into* existence,[^6148] but exists for ever and ever. He accordingly concludes that He made nothing out of Himself, since He never passed into such a condition[^6149] as made it possible for Him to make anything out of Himself. In like manner, he contends that He could not have made all things out of nothing—thus: He defines the Lord as a being who is good, nay, very good, who must will to make things as good and excellent as He is Himself; indeed it were impossible for Him either to will or to make anything which was not good, nay, very good itself. Therefore all things ought to have been made good and excellent by Him, after His own condition. Experience shows,[^6150] however, that things which are even evil were made by Him: not, of course, of His own will and pleasure; because, if it had been of His own will and pleasure, He would be sure to have made nothing unfitting or unworthy of Himself. That, therefore, which He made not of His own will must be understood to have been made from the fault of something, and that is from Matter, without a doubt." },
  { t = "note", id = "6143", text = "Præstruens." },
  { t = "note", id = "6144", text = "Porro." },
  { t = "note", id = "6145", text = "In partes non devenire." },
  { t = "note", id = "6146", text = "Ut faceret semetipsum." },
  { t = "note", id = "6147", text = "Ut fieret de semetipso." },
  { t = "note", id = "6148", text = "Non fieri." },
  { t = "note", id = "6149", text = "Non ejus fieret conditionis." },
  { t = "note", id = "6150", text = "Inveniri." },
]

[[section]]
id = "an-argument-of-hermogenes-the-answer-while"
title = "An Argument of Hermogenes. The Answer: While God is a Title Eternally Applicable to the Divine Being, Lord and Father are Only Relative Appellations, Not Eternally Applicable. An Inconsistency in the Argument of Hermogenes Pointed Out."
level = 1
blocks = [
  { t = "p", text = "Chapter III.—An Argument of Hermogenes. The Answer: While God is a Title Eternally Applicable to the Divine Being, Lord and Father are Only Relative Appellations, Not Eternally Applicable. An Inconsistency in the Argument of Hermogenes Pointed Out." },
  { t = "p", text = "He adds also another point: that as God was always God, there was never a time when God was not also Lord. But[^6151] it was in no way possible for Him to be regarded as always Lord, in the same manner as He had been always God, if there had not been always, in the previous eternity,[^6152] a something of which He could be regarded as evermore the Lord. So he concludes[^6153] that God always had Matter co-existent with Himself as the Lord thereof. Now, this tissue[^6154] of his I shall at once hasten to pull abroad. I have been willing to set it out in form to this length, for the information of those who are unacquainted with the subject, that they may know that his other arguments likewise need only be[^6155] understood to be refuted. We affirm, then, that the name of *God* always existed with Himself and in Himself—but not eternally so the *Lord*. Because the condition of the one is not the same as that of the other. God is the designation of the substance itself, that is, of the Divinity; but Lord is (the name) not of substance, but of power. I *maintain* that the substance existed always with its own name, which is God; *the title* Lord was afterwards added, as the indication indeed[^6156] of something accruing. For from the moment when those things began to exist, over which the power of a Lord was to act, *God*, by the accession of that power, both became Lord and received the name thereof. Because God is in like manner a Father, and He is also a Judge; but He has not always been Father and Judge, merely on the ground of His having always been God. For He could not have been the Father previous to the Son, nor a Judge previous to sin. There was, however, a time when neither sin existed with Him, nor the Son; the former of which was to constitute the Lord a Judge, and the latter a Father. In this way He was not Lord previous to those things of which He was to be the Lord. But He was only to become Lord at some future time: just as He became the Father by the Son, and a Judge by sin, so also did He become Lord by means of those things which He had made, in order that they might serve Him. Do I seem to you to be weaving arguments,[^6157] Hermogenes? How neatly does Scripture lend us its aid,[^6158] when it applies the two titles to Him with a distinction, and reveals them each at its proper time! For (the title) *God*, indeed, which always belonged to Him, it names at the very first: “In the beginning God created the heaven and the earth;”[^6159] and as long as He continued making, one after the other, those things of which He was to be the Lord, it merely mentions God. “And *God* said,” “and *God* made,” “and *God* saw;”[^6160] but nowhere do we yet find the *Lord*. But when He completed the whole creation, and especially man himself, who was destined to understand His sovereignty in a way of special propriety, He then is designated[^6161] Lord. Then also *the Scripture* added the name *Lord*: “And the Lord God, *Deus Dominus*, took the man, whom He had formed;”[^6162] “And the Lord God commanded Adam.”[^6163] Thenceforth He, who was previously God only, is the *Lord*, from the time of His having something of which He might be the Lord. For to Himself He was always God, but to all things was He only then God, when He became also Lord. Therefore, in *as* far as (Hermogenes) shall suppose that Matter was eternal, on the ground that the Lord was eternal, in *so* far will it be evident that nothing existed, because it is plain that the Lord *as such* did not always exist. Now I mean also, on my own part,[^6164] to add a remark for the sake of ignorant persons, of whom Hermogenes is an extreme instance,[^6165] and actually to retort against him his own arguments.[^6166] For when he denies that Matter was born or made, I find that, even on these terms, the title *Lord* is unsuitable to God in respect of Matter, because it must have been free,[^6167] when by not having a beginning it had not an author. The fact of its past existence it owed to no one, so that it could be a subject to no one. Therefore ever since God exercised His power over it, by creating (all things) out of Matter, although it had all along experienced God as its Lord, yet Matter does, after all, demonstrate that God did not exist in the relation of Lord to it,[^6168] although all the while He was really so.[^6169]" },
  { t = "note", id = "6151", text = "Porro." },
  { t = "note", id = "6152", text = "Retro." },
  { t = "note", id = "6153", text = "Itaque." },
  { t = "note", id = "6154", text = "Conjecturam." },
  { t = "note", id = "6155", text = "Tam…quam." },
  { t = "note", id = "6156", text = "Scilicet." },
  { t = "note", id = "6157", text = "Argumentari: in the sense of *argutari*." },
  { t = "note", id = "6158", text = "Naviter nobis patrocinatur." },
  { t = "note", id = "6159", text = "Gen. i. 1." },
  { t = "note", id = "6160", text = "Gen. i. 3, etc." },
  { t = "note", id = "6161", text = "Cognominatur: as if by way of *surname*, Deus *Dominus*." },
  { t = "note", id = "6162", text = "Gen. ii. 15." },
  { t = "note", id = "6163", text = "Gen. ii. 16." },
  { t = "note", id = "6164", text = "Et ego." },
  { t = "note", id = "6165", text = "Extrema linea. Rhenanus sees in this phrase a slur against Hermogenes, who was an artist. Tertullian, I suppose, meant that Hermogenes was extremely ignorant." },
  { t = "note", id = "6166", text = "Experimenta." },
  { t = "note", id = "6167", text = "Libera: and so not a possible *subject* for the Lordship of God." },
  { t = "note", id = "6168", text = "Matter having, by the hypothesis, been *independent of God*, and so incapable of giving Him any title to Lordship." },
  { t = "note", id = "6169", text = "Fuit hoc utique. In Hermogenes’ own opinion, which is thus shown to have been contradictory to itself, and so absurd." },
]

[[section]]
id = "hermogenes-gives-divine-attributes-to-matter-and"
title = "Hermogenes Gives Divine Attributes to Matter, and So Makes Two Gods."
level = 1
blocks = [
  { t = "p", text = "Chapter IV.—Hermogenes Gives Divine Attributes to Matter, and So Makes Two Gods." },
  { t = "p", text = "At this point, then, I shall begin to treat of Matter, how that, (according to Hermogenes,)[^6170] God compares it with Himself as equally unborn, equally unmade, equally eternal, set forth as being without a beginning, without an end. For what other estimate[^6171] of God is there than eternity? What other condition has eternity than to have ever existed, and to exist yet for evermore by virtue of its privilege of having neither beginning nor end? Now, since this is the property of God, it will belong to God alone, whose property it is—of course[^6172] on this ground, that if it can be ascribed to any other being, it will no longer be the property of God, but will belong, along with Him, to that being also to which it is ascribed. For “although there be that are called gods” in name, “whether in heaven or in earth, yet to us there is but one God the Father, of whom are all things;”[^6173] whence the greater reason why, in our view,[^6174] that which is the property[^6175] of God ought to be regarded as pertaining to God alone, and why (as I have already said) that should cease to be such a property, when it is shared by another being. Now, since He is God, it must necessarily be a unique mark of this quality,[^6176] that it be confined to One. Else, what will be unique and singular, if that is not which has nothing equal to it? What will be principal, if that is not which is above all things, before all things, and from which all things proceed? By possessing these He is God alone, and by His sole possession of them He is One. If another also shared in the possession, there would then be as many gods as there were possessors of these attributes of God. Hermogenes, therefore, introduces two gods: he introduces Matter as God’s equal. God, however, must be One, because that is God which is supreme; but nothing else can be supreme than that which is unique; and that cannot possibly be unique which has anything equal to it; and Matter will be equal with God when it is held to be[^6177] eternal." },
  { t = "note", id = "6170", text = "Quod, with the subjunctive comparet." },
  { t = "note", id = "6171", text = "Census." },
  { t = "note", id = "6172", text = "Scilicet." },
  { t = "note", id = "6173", text = "1 Cor. viii. 5." },
  { t = "note", id = "6174", text = "Apud nos." },
  { t = "note", id = "6175", text = "The property of being eternal." },
  { t = "note", id = "6176", text = "Unicum sit necesse est." },
  { t = "note", id = "6177", text = "Censetur." },
]

[[section]]
id = "hermogenes-coquets-with-his-own-argument-as"
title = "Hermogenes Coquets with His Own Argument, as If Rather Afraid of It. After Investing Matter with Divine Qualities, He Tries to Make It Somehow Inferior to God."
level = 1
blocks = [
  { t = "p", text = "Chapter V.—Hermogenes Coquets with His Own Argument, as If Rather Afraid of It. After Investing Matter with Divine Qualities, He Tries to Make It Somehow Inferior to God." },
  { t = "p", text = "But God is God, and Matter is Matter. As if a mere difference in their names prevented equality,[^6178] when an identity of condition is claimed for them! Grant that their nature is different; assume, too, that their form is not identical,—what matters it so long as their absolute state have but one mode?[^6179] God is unborn; is not Matter also unborn? God ever exists; is not Matter, too, ever existent? Both are without beginning; both are without end; both are the authors of the universe—both He who created it, and the Matter of which He made it. For it is impossible that Matter should not be regarded as the author[^6180] of all things, when the universe is composed of it. What answer will he give? Will he say that Matter is not then comparable with God as soon as[^6181] it has something belonging to God; since, by not having total (divinity), it cannot correspond to the whole extent of the comparison? But what more has he reserved for God, that he should not seem to have accorded to Matter the full amount of the Deity?[^6182] He says in reply, that even though this is the prerogative of Matter, both the authority and the substance of God must remain intact, by virtue of which He is regarded as the sole and prime Author, as well as the Lord of all things. Truth, however, maintains the unity of God in such a way as to insist that whatever belongs to God Himself belongs to Him alone. For so will it belong to Himself if it belong to Him alone; and therefore it will be impossible that another god should be admitted, when it is permitted to no other being to possess anything of God. Well, then, you say, we ourselves at that rate possess nothing of God. But indeed we do, and shall continue to do—only it is from Him that we receive it, and not from ourselves. For we shall be even gods, if we, shall deserve to be among those of whom He declared, “I have said, Ye are gods,”[^6183] and, “God standeth in the congregation of the gods.”[^6184] But this comes of His own grace, not from any property in us, because it is He alone who can make gods. The property of Matter, however, he[^6185] makes to be that which it has in common with God. Otherwise, if it received from God the property which belongs to God,—I mean its attribute[^6186] of eternity—one might then even suppose that it both possesses an attribute in common with God, and yet at the same time is not God. But what inconsistency is it for him[^6187] to allow that there is a conjoint possession of an attribute with God, and also to wish that what he does not refuse to Matter should be, after all, the exclusive privilege of God!" },
  { t = "note", id = "6178", text = "Comparationi." },
  { t = "note", id = "6179", text = "Ratio." },
  { t = "note", id = "6180", text = "Auctrix." },
  { t = "note", id = "6181", text = "Statim si." },
  { t = "note", id = "6182", text = "Totum Dei." },
  { t = "note", id = "6183", text = "Ps. lxxxii. 6." },
  { t = "note", id = "6184", text = "Ver. 1." },
  { t = "note", id = "6185", text = "Hermogenes." },
  { t = "note", id = "6186", text = "Ordinem: or course." },
  { t = "note", id = "6187", text = "Quale autem est: “how comes it to pass that.”" },
]

[[section]]
id = "the-shifts-to-which-hermogenes-is-reduced"
title = "The Shifts to Which Hermogenes is Reduced, Who Deifies Matter, and Yet is Unwilling to Hold Him Equal with the Divine Creator."
level = 1
blocks = [
  { t = "p", text = "Chapter VI.—The Shifts to Which Hermogenes is Reduced, Who Deifies Matter, and Yet is Unwilling to Hold Him Equal with the Divine Creator." },
  { t = "p", text = "He declares that God’s attribute is still safe to Him, of being the only God, and the First, and the Author of all things, and the Lord of all things, and being incomparable to any—qualities which he straightway ascribes to Matter also. He is God, to be sure. God shall also attest the same; but He has also sworn sometimes by Himself, that there is no other God like Him.[^6188] Hermogenes, however, will make Him a liar. For Matter will be such a God as He—being unmade, unborn, without beginning, and without end. God will say, “I am the first!”[^6189] Yet how is He the first, when Matter is co-eternal with Him? Between co-eternals and contemporaries there is no sequence of rank.[^6190] Is then, Matter also the first? “I,” says the Lord, “have stretched out the heavens alone.”[^6191] But indeed He was not alone, when that likewise stretched them out, of which He made the expanse. When he asserts the position that Matter was *eternal*, without any encroachment on the condition of God, let him see to it that we do not in ridicule turn the tables on him, that God similarly was eternal without any encroachment on the condition of Matter—the condition of Both being still common to Them. The position, therefore, remains unimpugned[^6192] both in the case of Matter, that it did itself exist, only along with God; and that God existed alone, but with Matter. It also was first with God, as God, too, was first with it; it, however, is not comparable with God, as God, too, is not to be compared with it; with God also it was the Author (of all things), and with God their Sovereign. In this way *he proposes that God* has something, and yet not the whole, of Matter. For Him, accordingly, Hermogenes has reserved nothing which he had not equally conferred on Matter, so that it is not Matter which is compared with God, but rather God who is compared with Matter. Now, inasmuch as those qualities which we claim as peculiar to God—to have always existed, without a beginning, without an end, and to have been the First, and Alone, and the Author of all things—are also compatible to Matter, I want to know what property Matter possesses different and alien from God, and hereby special to itself, by reason of which it is incapable of being compared with God? That Being, in which occur[^6193] all the properties of God, is sufficiently predetermined without any further comparison." },
  { t = "note", id = "6188", text = "Isa. xlv. 23." },
  { t = "note", id = "6189", text = "Isa. xli. 4; xliv. 6; xlviii. 12." },
  { t = "note", id = "6190", text = "Ordo." },
  { t = "note", id = "6191", text = "Isa. xliv. 24." },
  { t = "note", id = "6192", text = "Salvum ergo erit." },
  { t = "note", id = "6193", text = "Recensentur." },
]

[[section]]
id = "hermogenes-held-to-his-theory-in-order"
title = "Hermogenes Held to His Theory in Order that Its Absurdity May Be Exposed on His Own Principles."
level = 1
blocks = [
  { t = "p", text = "Chapter VII.—Hermogenes Held to His Theory in Order that Its Absurdity May Be Exposed on His Own Principles." },
  { t = "p", text = "When he contends that matter is less than God, and inferior to Him, and therefore diverse from Him, and for the same reason not a fit subject of comparison with Him, who is a greater and superior Being, I meet him with this prescription, that what is eternal and unborn is incapable of any diminution and inferiority, because it is simply this which makes even God to be as great as He is, inferior and subject to none—nay, greater and higher than all. For, just as all things which are born, or which come to an end, and are therefore not eternal, do, by reason of their exposure at once to an end and a beginning, admit of qualities which are repugnant to God—I mean diminution and inferiority, because they are born and made—so likewise God, for this very reason, is unsusceptible of these accidents, because He is absolutely unborn,[^6194] and also unmade. And yet such also is the condition of Matter.[^6195] Therefore, of the two Beings which are eternal, as being unborn and unmade—God and Matter—by reason of the identical mode of their common condition (both of them equally possessing that which admits neither of diminution nor subjection—that is, the attribute of eternity), we affirm that neither of them is less or greater than the other, neither of them is inferior or superior to the other; but that they both stand on a par in greatness, on a par in sublimity, *and* on the same level of that complete and perfect felicity of which eternity is reckoned to consist. Now we must not resemble the heathen in our opinions; for they, when constrained to acknowledge God, insist on having other deities below Him. The Divinity, however, has no degrees, because it is unique; and if it shall be found in Matter—as being equally unborn and unmade and eternal—it must be resident in both alike,[^6196] because in no case can it be inferior to itself. In what way, then, will Hermogenes have the courage to draw distinctions; and thus to subject matter to God, an eternal to the Eternal, an unborn to the Unborn, an author to the Author? seeing that it dares to say, I also am the first; I too am before all things; and I am that from which all things proceed; equal we have been, together we have been—both alike without beginning, without end; both alike without an Author, without a God.[^6197] What God, then, is He who subjects me to a contemporaneous, co-eternal power? If it be He who is called God, then I myself, too, have my own (divine) name. Either I am God, or He is Matter, because we both are that which neither of us is. Do you suppose, therefore, that he[^6198] has not made Matter equal with God, although, forsooth, he pretends it to be inferior to Him?" },
  { t = "note", id = "6194", text = "Nec natus omnino." },
  { t = "note", id = "6195", text = "Of course, according to Hermogenes, whom Tertullian refutes with an *argumentum ad hominem*." },
  { t = "note", id = "6196", text = "Aderit utrobique." },
  { t = "note", id = "6197", text = "That is, having no God superior to themselves." },
  { t = "note", id = "6198", text = "Hermogenes." },
]

[[section]]
id = "on-his-own-principles-hermogenes-makes-matter"
title = "On His Own Principles, Hermogenes Makes Matter, on the Whole, Superior to God."
level = 1
blocks = [
  { t = "p", text = "Chapter VIII.—On His Own Principles, Hermogenes Makes Matter, on the Whole, Superior to God." },
  { t = "p", text = "Nay more,[^6199] he even prefers Matter to God, and rather subjects God to it, when he will have it that God made all things out of Matter. For if He drew His resources from it[^6200] for the creation of the world, Matter is already found to be the superior, inasmuch as it furnished Him with the means of effecting His works; and God is thereby clearly subjected to Matter, of which the substance was indispensable to Him. For there is no one but requires that which he makes use of;[^6201] no one but is subject to the thing which he requires, for the very purpose of being able to make use of it. So, again, there is no one who, from using what belongs to another, is not inferior to him of whose property he makes use; and there is no one who imparts[^6202] of his own for another’s use, who is not in this respect superior to him to whose use he lends his property. On this principle,[^6203] Matter itself, no doubt,[^6204] was not in want of God, but rather lent itself to God, who was in want of it—rich and abundant and liberal as it was—to one who was, I suppose, too small, and too weak, and too unskilful, to form what He willed out of nothing. A grand service, verily,[^6205] did it confer on God in giving Him means at the present time whereby He might be known to be God, and be called Almighty—only that He is no longer Almighty, since He is not powerful enough for this, to produce all things out of nothing. To be sure,[^6206] Matter bestowed somewhat on itself also—even to get its own self acknowledged with God as God’s co-equal, nay more, as His helper; only there is this drawback, that Hermogenes is the only man that has found out this fact, besides the philosophers—those patriarchs of all heresy.[^6207] For the prophets knew nothing about it, nor the apostles thus far, nor, I suppose, even Christ." },
  { t = "note", id = "6199", text = "Atquin etiam." },
  { t = "note", id = "6200", text = "Ex illa usus est." },
  { t = "note", id = "6201", text = "De cujus utitur." },
  { t = "note", id = "6202", text = "Præstat." },
  { t = "note", id = "6203", text = "Itaque." },
  { t = "note", id = "6204", text = "Quidem." },
  { t = "note", id = "6205", text = "Revera." },
  { t = "note", id = "6206", text = "Sane." },
  { t = "note", id = "6207", text = "They are so deemed in the *de Præscript. Hæret.* c. vii." },
]

[[section]]
id = "sundry-inevitable-but-intolerable-conclusions-from-the"
title = "Sundry Inevitable But Intolerable Conclusions from the Principles of Hermogenes."
level = 1
blocks = [
  { t = "p", text = "Chapter IX.—Sundry Inevitable But Intolerable Conclusions from the Principles of Hermogenes." },
  { t = "p", text = "He cannot say that it was as its Lord that God employed Matter for His creative works, for He could not have been the Lord of a substance which was co-equal with Himself. Well, but perhaps it was a title derived from the will of another,[^6208] which he enjoyed—a precarious holding, and not a lordship,[^6209] and *that* to such a degree, that[^6210] although Matter was evil, He yet endured to make use of an evil substance, owing, of course, to the restraint of His own limited power,[^6211] which made Him impotent to create out of nothing, not in consequence of His power; for if, as God, He had at all possessed power over Matter which He knew to be evil, He would first have converted it into good—as its Lord and the good God—that so He might have a good thing to make use of, instead of a bad one. But being undoubtedly good, only not the Lord withal, He, by using such power[^6212] as He possessed, showed the necessity He was under of yielding to the condition of Matter, which He would have amended if He had been its Lord. Now this is the answer which must be given to Hermogenes when he maintains that it was by virtue of His Lordship that God used Matter—even of His non-possession of any right to it, on the ground, of course, of His not having Himself made it. Evil then, on your terms,[^6213] must proceed from *God* Himself, since He is—I will not say the Author of evil, because He did not form it, but—the permitter thereof, as having dominion over it.[^6214] If indeed Matter shall prove not even to belong to God at all, as being evil, it follows,[^6215] that when He made use of what belonged to another, He used it either on a precarious title[^6216] because He was in need of it, or else by violent possession because He was stronger than it. For by three methods is the property of others obtained,—by right, by permission, by violence; in other words, by lordship, by a title derived from the will of another,[^6217] by force. Now, as lordship is out of the question, Hermogenes must choose which (of the other methods) is suitable to God. Did He, then, make all things out of Matter, by permission, or by force? But, in truth, would not God have more wisely determined that nothing at all should be created, than that it should be created by the mere sufferance of another, or by violence, and that, too, with[^6218] a substance which was evil?" },
  { t = "note", id = "6208", text = "We have rather paraphrased the word “precario”—“obtained by prayer.” [See p. 456.]" },
  { t = "note", id = "6209", text = "Domino: opposed to “precario.”" },
  { t = "note", id = "6210", text = "Ideo…ut." },
  { t = "note", id = "6211", text = "Mediocritatis." },
  { t = "note", id = "6212", text = "Tali: i.e. potestate." },
  { t = "note", id = "6213", text = "Jam ergo: introducing an *argumentum ad hominem* against Hermogenes." },
  { t = "note", id = "6214", text = "Quia dominator." },
  { t = "note", id = "6215", text = "Ergo." },
  { t = "note", id = "6216", text = "Aut precario: “as having begged for it.”" },
  { t = "note", id = "6217", text = "Precario: See above, note 2, p. 482." },
  { t = "note", id = "6218", text = "*De* is often in Tertullian the sign of an instrumental noun." },
]

[[section]]
id = "to-what-straits-hermogenes-absurdly-reduces-the"
title = "To What Straits Hermogenes Absurdly Reduces the Divine Being. He Does Nothing Short of Making Him the Author of Evil."
level = 1
blocks = [
  { t = "p", text = "Chapter X.—To What Straits Hermogenes Absurdly Reduces the Divine Being. He Does Nothing Short of Making Him the Author of Evil." },
  { t = "p", text = "Even if Matter had been the perfection of good,[^6219] would it not have been equally indecorous in Him to have thought of the property of another, however good, (to effect His purpose by the help of it)? It was, therefore, absurd enough for Him, in the interest of His own glory, to have created the world in such a way as to betray His own obligation to a substance which belonged to another—and that even not good. Was He then, asks (Hermogenes), to make all things out of nothing, that so evil things themselves might be attributed to His will? Great, in all conscience,[^6220] must be the blindness of our heretics which leaves them to argue in such a way that they either insist on the belief of another God supremely good, on the ground of their thinking the Creator to be the author of evil, or else they set up Matter with the Creator, in order that they may derive evil from Matter, not from the Creator. And yet there is absolutely no god at all that is free from such a doubtful plight, so as to be able to avoid the appearance even of being the author of evil, whosoever he is that—I will not say, indeed, has made, but still—has permitted evil to be made by some author or other, and from some source or other. Hermogenes, therefore, ought to be told[^6221] at once, although we postpone to another place our distinction concerning the mode of evil,[^6222] that even he has effected no result by this device of his.[^6223] For observe how God is found to be, if not the Author of, yet at any rate the conniver at,[^6224] evil, inasmuch as He, with all His extreme goodness, endured evil in Matter before He created the world, although, as being good, and the enemy of evil, He ought to have corrected it. For He either was able to correct it, but was unwilling; or else was willing, but being a weak God, was not able. If He was able and yet unwilling, He was Himself evil, as having favoured evil; and thus He now opens Himself to the charge of evil, because even if He did not create it yet still, since it would not be existing if He had been against its existence, He must Himself have then caused it to exist, when He refused to will its non-existence. And what is more shameful than this? When He willed that to be which He was Himself unwilling to create, He acted in fact against His very self,[^6225] inasmuch as He was both willing that that should exist which He was unwilling to make, and unwilling to make that which He was willing should exist. As if what He willed was good, and at the same time what he refused to be the Maker of was evil. What He judged to be evil by not creating it, He also proclaimed to be good by permitting it to exist. By bearing with evil as a good instead of rather extirpating it, He proved Himself to be the promoter thereof; criminally,[^6226] if through His own will—disgracefully, if through necessity. God must either be the servant of evil or the friend thereof, since He held converse with evil in Matter—nay, more, effected His works out of the evil thereof." },
  { t = "note", id = "6219", text = "Optima." },
  { t = "note", id = "6220", text = "Bona fide." },
  { t = "note", id = "6221", text = "Audiat." },
  { t = "note", id = "6222", text = "De mali ratione." },
  { t = "note", id = "6223", text = "Hac sua injectione. See our *Anti-Marcion*, iv. i., for this word, p. 345." },
  { t = "note", id = "6224", text = "Assentator. Fr. Junius suggests “adsectator” of the stronger meaning “promoter;” nor does Oehler object." },
  { t = "note", id = "6225", text = "Adversum semetipsum." },
  { t = "note", id = "6226", text = "Male: in reference to His alleged complicity with *evil*." },
]

[[section]]
id = "hermogenes-makes-great-efforts-to-remove-evil"
title = "Hermogenes Makes Great Efforts to Remove Evil from God to Matter. How He Fails to Do This Consistently with His Own Argument."
level = 1
blocks = [
  { t = "p", text = "Chapter XI.—Hermogenes Makes Great Efforts to Remove Evil from God to Matter. How He Fails to Do This Consistently with His Own Argument." },
  { t = "p", text = "But, after all,[^6227] by what proofs does Hermogenes persuade us that Matter is evil? For it will be impossible for him not to call that evil to which he imputes evil. Now we lay down this principle,[^6228] that what is eternal cannot possibly admit of diminution and subjection, so as to be considered inferior to another co-eternal Being. So that we now affirm that evil is not even compatible with it,[^6229] since it is incapable of subjection, from the fact that it cannot in any wise be subject to any, because it is eternal. But inasmuch as, on other grounds,[^6230] it is evident what is eternal as God is the highest good, whereby also He alone is good—as being eternal, and therefore good—as being God, how can evil be inherent in Matter, which (since it is eternal) must needs be believed to be the highest good? Else if that which is eternal prove to be also capable of evil, this (evil) will be able to be also believed of God to His prejudice;[^6231] so that it is without adequate reason that he has been so anxious[^6232] to remove evil from God; since evil must be compatible with an eternal Being, even by being made compatible with Matter, *as Hermogenes makes it*. But, as the argument now stands,[^6233] since what is eternal can be deemed evil, the evil must prove to be invincible and insuperable, as being eternal; and in that case[^6234] it will be in vain that we labour “to put away evil from the midst of us;”[^6235] in that case, moreover, God vainly gives us such a command and precept; nay more, in vain has God appointed any judgment at all, when He means, indeed,[^6236] to inflict punishment with injustice. But if, on the other hand, there is to be an end of evil, when the chief thereof, the devil, shall “go away into the fire which God hath prepared for him and his angels”[^6237]—having been first “cast into the bottomless pit;”[^6238] when likewise “the manifestation of the children of God”[^6239] shall have “delivered the creature”[^6240] from evil, which had been “made subject to vanity;”[^6241] when the cattle restored in the innocence and integrity of their nature[^6242] shall be at peace[^6243] with the beasts of the field, when also little children shall play with serpents;[^6244] when the Father shall have put beneath the feet of His Son His enemies,[^6245] as being the workers of evil,—if in this way an *end* is compatible with evil, it must follow of necessity that a *beginning* is also compatible with it; and Matter will turn out to have a beginning, by virtue of its having also an end. For whatever things are set to the account of evil,[^6246] have a compatibility with the condition of evil." },
  { t = "note", id = "6227", text = "Et tamen." },
  { t = "note", id = "6228", text = "Definimus." },
  { t = "note", id = "6229", text = "Competere illi." },
  { t = "note", id = "6230", text = "Alias." },
  { t = "note", id = "6231", text = "Et in Deum credi." },
  { t = "note", id = "6232", text = "Gestivit." },
  { t = "note", id = "6233", text = "Jam vero." },
  { t = "note", id = "6234", text = "Tum." },
  { t = "note", id = "6235", text = "1 Cor. v. 13." },
  { t = "note", id = "6236", text = "Utique: with a touch of irony, in the *argumentum ad hominem*." },
  { t = "note", id = "6237", text = "Matt. xxv. 41." },
  { t = "note", id = "6238", text = "Rev. xx. 3." },
  { t = "note", id = "6239", text = "Rom. viii. 19." },
  { t = "note", id = "6240", text = "Rom. viii. 21." },
  { t = "note", id = "6241", text = "Rom. viii. 20." },
  { t = "note", id = "6242", text = "Conditionis: “creation.”" },
  { t = "note", id = "6243", text = "Condixerint." },
  { t = "note", id = "6244", text = "Isa. xi. 6." },
  { t = "note", id = "6245", text = "Ps. cx. 1." },

[[section]]
id = "statement-of-the-true-doctrine-concerning-matter"
title = "Statement of the True Doctrine Concerning Matter. Its Relation to God's Creation of the World."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXIII.—Statement of the True Doctrine Concerning Matter. Its Relation to God’s Creation of the World." },
  { t = "p", text = "But although Hermogenes finds it amongst his own colourable pretences[^6482] (for it was not in his power to discover it in the Scriptures of God), it is enough for us, both that it is certain that all things were made by God, and that there is no certainty whatever that they were made out of Matter. And even if Matter had *previously* existed, we must have believed that it had been really made by God, since we maintained (no less) when we held the rule of faith to be,[^6483] that nothing except God was uncreated.[^6484] Up to this point there is room for controversy, until Matter is brought to the test of the Scriptures, and fails to make good its case.[^6485] The conclusion of the whole is this: I find that there was nothing made, except out of nothing; because that which I find was made, I know did not *once* exist. Whatever[^6486] was made out of something, has its origin in something made: for instance, out of the ground was made the grass, and the fruit, and the cattle, and the form of man himself; so from the waters were produced the animals which swim and fly. The original fabrics[^6487] out of which such creatures were produced I may call their *materials*,[^6488] but then even these were created by God." },
  { t = "note", id = "6482", text = "Colores. See our “Anti-Marcion,” p. 217, *Edin*., where the word *pretension* should stand instead of *precedent*." },
  { t = "note", id = "6483", text = "Præscribentes." },
  { t = "note", id = "6484", text = "Innatum: see above, note 12." },
  { t = "note", id = "6485", text = "Donec ad Scripturas provocata deficiat exibitio materiæ." },
  { t = "note", id = "6486", text = "Etiamsi quid." },
  { t = "note", id = "6487", text = "Origines." },
  { t = "note", id = "6488", text = "Materias. There is a point in this use of the plural of the controverted term *materia*." },
]

[[section]]
id = "a-presumption-that-all-things-were-created"
title = "A Presumption that All Things Were Created by God Out of Nothing Afforded by the Ultimate Reduction of All Things to Nothing. Scriptures Proving This Reduction Vindicated from Hermogenes' Charge of Being Merely Figurative."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXIV.—A Presumption that All Things Were Created by God Out of Nothing Afforded by the Ultimate Reduction of All Things to Nothing. Scriptures Proving This Reduction Vindicated from Hermogenes’ Charge of Being Merely Figurative." },
  { t = "p", text = "Besides,[^6489] the belief that everything was made from nothing will be impressed upon us by that ultimate dispensation of God which will bring back all things to nothing. For “the very heaven shall be rolled together as a scroll;”[^6490] nay, it shall come to nothing along with the earth itself, with which it was made in the beginning. “Heaven and earth shall pass away,”[^6491] says He. “The first heaven and the first earth passed away,”[^6492] “and there was found no place for them,”[^6493] because, of course, that which comes to an end loses locality. In like manner David says, “The heavens, the works of Thine hands, shall themselves perish. For even as a vesture shall He change them, and they shall be changed.”[^6494] Now to be changed is to fall from that primitive state which they lose whilst undergoing the change. “And the stars too shall fall from heaven, even as a fig-tree casteth her green figs[^6495] when she is shaken of a mighty wind.”[^6496] “The mountains shall melt like wax at the presence of the Lord;”[^6497] that is, “when He riseth to shake terribly the earth.”[^6498] “But I will dry up the pools;”[^6499] and “they shall seek water, and they shall find none.”[^6500] Even “the sea shall be no more.”[^6501] Now if any person should go so far as to suppose that all these passages ought to be spiritually interpreted, he will yet be unable to deprive them of the true accomplishment of those issues which must come to pass just as they have been written. For all figures of speech necessarily arise out of real things, not out of chimerical ones; because nothing is capable of imparting anything of its own for a similitude, except it actually be that very thing which it imparts in the similitude. I return therefore to the principle[^6502] which defines that all things which have come from nothing shall return at last to nothing. For God would not have made any perishable thing out of what was eternal, that is to say, out of Matter; neither out of greater things would He have created inferior ones, to whose character it would be more agreeable to produce greater things out of inferior ones,—in other words, what is eternal out of what is perishable. This is the promise He makes even to our flesh, and it has been His will to deposit within us this pledge of His own virtue and power, in order that we may believe that He has actually[^6503] awakened the universe out of nothing, as if it had been steeped in death,[^6504] in the sense, of course, of its previous non-existence for the purpose of its coming into existence.[^6505]" },
  { t = "note", id = "6489", text = "Ceterum." },
  { t = "note", id = "6490", text = "Isa. xxxiv. 4; Matt. xxiv. 29; 2 Pet. iii. 10; Rev. vi. 14." },
  { t = "note", id = "6491", text = "Matt. xxiv. 35." },
  { t = "note", id = "6492", text = "Rev. xxi. 1." },
  { t = "note", id = "6493", text = "Rev. xx. 11." },
  { t = "note", id = "6494", text = "Ps. cii. 25, 26." },
  { t = "note", id = "6495", text = "Acerba sua “grossos suos” (Rigalt.). So our marginal reading." },
  { t = "note", id = "6496", text = "Rev. vi. 13." },
  { t = "note", id = "6497", text = "Ps. xcvii. 5." },
  { t = "note", id = "6498", text = "Isa. ii. 19." },
  { t = "note", id = "6499", text = "Isa. xlii. 15." },
  { t = "note", id = "6500", text = "Isa. xli. 17." },
  { t = "note", id = "6501", text = "Etiam mare hactenus, Rev. xxi. 1." },
  { t = "note", id = "6502", text = "Causam." },
  { t = "note", id = "6503", text = "Etiam." },
  { t = "note", id = "6504", text = "Emortuam." },
  { t = "note", id = "6505", text = "In hoc, ut esset. Contrasted with the “non erat” of the previous sentence, this must be the meaning, as if it were “ut fieret.”" },
]

[[section]]
id = "contradictory-propositions-advanced-by-hermogenes-respecting-matter"
title = "Contradictory Propositions Advanced by Hermogenes Respecting Matter and Its Qualities."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXV.—Contradictory Propositions Advanced by Hermogenes Respecting Matter and Its Qualities." },
  { t = "p", text = "As regards all other points touching Matter, although there is no necessity why we should treat of them (for our first point was the manifest proof of its existence), we must for all that pursue our discussion just as if it did exist, in order that its non-existence may be the more apparent, when these other points concerning it prove inconsistent with each other, and in order at the same time that Hermogenes may acknowledge his own contradictory positions. Matter, says he, at first sight seems to us to be incorporeal; but when examined by *the light of* right reason, it is found to be neither corporeal nor incorporeal. What is this right reason of yours,[^6506] which declares nothing right, that is, nothing certain? For, if I mistake not, everything must of necessity be either corporeal or incorporeal (although I may for the moment[^6507] allow that there is a certain incorporeality in even substantial things,[^6508] although their very substance is the body of particular things); at all events, after the corporeal and the incorporeal there is no third *state*. But if it be contended[^6509] that there is a third state discovered by this right reason of Hermogenes, which makes Matter neither corporeal nor incorporeal, (I ask,) Where is it? what sort of thing is it? what is it called? what is its description? what is it understood to be? This only has his reason declared, that Matter is neither corporeal nor incorporeal." },
  { t = "note", id = "6506", text = "Ista." },
  { t = "note", id = "6507", text = "Interim." },
  { t = "note", id = "6508", text = "De substantiis duntaxat." },
  { t = "note", id = "6509", text = "Age nunc sit: “But grant that there is this third state.”" },
]

[[section]]
id = "other-absurd-theories-respecting-matter-and-its"
title = "Other Absurd Theories Respecting Matter and Its Incidents Exposed in an Ironical Strain. Motion in Matter. Hermogenes' Conceits Respecting It."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXVI.—Other Absurd Theories Respecting Matter and Its Incidents Exposed in an Ironical Strain. Motion in Matter. Hermogenes’ Conceits Respecting It." },
  { t = "p", text = "But see what a contradiction he next advances[^6510] (or perhaps some *other* reason[^6511] occurs to him), when he declares that Matter partly corporeal and partly incorporeal. Then must Matter be considered (to embrace) both conditions, in order that it may not have either? For it will be corporeal, and incorporeal in spite of[^6512] the declaration of that antithesis,[^6513] which is plainly above giving any reason for its opinion, just as that “other reason” also was. Now, by the corporeal part of Matter, he means that of which bodies are created; but by the incorporeal part *of Matter*, he means its uncreated[^6514] motion. If, says he, *Matter* were simply a body, there would appear to be in it nothing incorporeal, that is, (no) motion; if, on the other hand, it had been wholly incorporeal no body could be formed out of it. What a peculiarly right[^6515] reason have we here! Only if you make your sketches as right as you make your reason, Hermogenes, no painter would be more stupid[^6516] than yourself. For who is going to allow you to reckon *motion* as a moiety of *Matter*, seeing that it is not a substantial thing, because it is not corporeal, but an accident (if indeed it be even that) of a substance and a body? Just as action[^6517] is, and impulsion, just as a slip is, or a fall, so is motion. When anything moves even of itself, its motion is the result of impulse;[^6518] but certainly it is no part of its substance in your sense,[^6519] when you make motion the incorporeal part of matter. All things, indeed,[^6520] have motion—either of themselves as animals, or of others as inanimate things; but yet we should not say that either a man or a stone was both corporeal and incorporeal because they had both a body and motion: *we should say* rather that all things have one form of simple[^6521] corporeality, which is the essential quality[^6522] of substance. If any incorporeal *incidents* accrue to them, as actions, or passions, or functions,[^6523] or desires, we do not reckon these parts as of the things. How then does he contrive to assign an *integral* portion of Matter to *motion*, which does not pertain to substance, but to a certain condition[^6524] of substance? Is not this incontrovertible?[^6525] Suppose you had taken it into your head[^6526] to represent matter as immoveable, would then the immobility seem to you to be a moiety of its form? *Certainly not*. Neither, in like manner, could motion. But I shall be at liberty to speak of motion elsewhere.[^6527]" },
  { t = "note", id = "6510", text = "Subicit." },
  { t = "note", id = "6511", text = "Other than “*the right reason*” above named." },
  { t = "note", id = "6512", text = "Adversus." },
  { t = "note", id = "6513", text = "The original, “Adversus renuntiationem reciprocationis illius,” is an obscure expression. Oehler, who gives this reading in his edition, after the *editio princeps*, renders the term “reciprocationis” by the phrase “negative conversion” of the proposition that Matter is corporeal and incorporeal (*q.d.* “Matter is neither corporeal nor incorporeal”). Instead, however, of the reading “reciprocationis,” Oehler would gladly read “rectæ rationis,” after most of the editions. He thinks that this allusion to “the right reason,” of which Hermogenes boasted, and of which the absurd conclusion is exposed in the context, very well suits the sarcastic style of Tertullian. If this, the general reading, be adopted, we must render the whole clause this: “For it will be corporeal and incorporeal, in spite of the declaration of that *right reason* (of Hermogenes), which is plainly enough above giving any reason,” etc. etc." },
  { t = "note", id = "6514", text = "Inconditum. See above ch. xviii., in the middle. Notwithstanding the absurdity of Hermogenes idea, it is impossible to translate this word *irregular* as it has been proposed to do by Genoude." },
  { t = "note", id = "6515", text = "Rectior." },
  { t = "note", id = "6516", text = "Bardior." },
  { t = "note", id = "6517", text = "Actus: being driven." },
  { t = "note", id = "6518", text = "Actus ejus est motus." },
  { t = "note", id = "6519", text = "Sicut tu." },
  { t = "note", id = "6520", text = "Denique." },
  { t = "note", id = "6521", text = "Solius." },
  { t = "note", id = "6522", text = "Res." },
  { t = "note", id = "6523", text = "Officia." },
  { t = "note", id = "6524", text = "Habitum." },
  { t = "note", id = "6525", text = "Quid enim?" },
  { t = "note", id = "6526", text = "Si placuisset tibi." },
  { t = "note", id = "6527", text = "See below, ch. xli., p. 500." },
]

[[section]]
id = "ironical-dilemmas-respecting-matter-and-sundry-moral"
title = "Ironical Dilemmas Respecting Matter, and Sundry Moral Qualities Fancifully Attributed to It."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXVII.—Ironical Dilemmas Respecting Matter, and Sundry Moral Qualities Fancifully Attributed to It." },
  { t = "p", text = "I see now that you are coming back again to that reason, which has been in the habit of declaring to you nothing in the way of certainty. For just as you introduce to our notice Matter as being neither corporeal nor incorporeal, so you allege of it that it is neither good nor evil; and you say, whilst arguing further on it in the same strain: “If it were good, seeing that it had ever been so, it would not require the arrangement of itself by God;[^6528] if it were naturally evil, it would not have admitted of a change[^6529] for the better, nor would God have ever applied to such a nature any attempt at arrangement of it, for His labour would have been in vain.” Such are your words, which it would have been well if you had remembered in other passages also, so as to have avoided any contradiction of them. As, however, we have already treated to some extent of this ambiguity of good and evil touching Matter, I will now reply to the only proposition and argument of yours which we have before us. I shall not stop to repeat my opinion, that it was your bounden duty to have said for certain that Matter was either good or bad, or in some third condition; but (I must observe) that you have not here even kept to the statement which you chose to make before. Indeed, you retract what you declared—that Matter is neither good nor evil; because you imply that it is evil when you say, “If it were good, it would not require to be set in order by God;” so again, when you add, “If it were naturally evil, it would not admit of any change for the better,” you seem to intimate[^6530] that it is good. And so you attribute to it a close relation[^6531] to good and evil, although you declared it neither good nor evil. With a view, however, to refute the argument whereby you thought you were going to clinch your proposition, I here contend: If Matter had always been good, why should it not have *still* wanted a change for the better? Does that which is good never desire, never wish, never feel able to advance, so as to change its good for a better? And in like manner, if *Matter* had been by nature evil, why might it not have been changed by God as the more powerful Being, as able to convert the nature of stones into children of Abraham?[^6532] Surely by such means you not only compare the Lord with Matter, but you even put Him below[^6533] it, since you affirm that[^6534] the nature of Matter could not possibly be brought under control by Him, and trained to something better. But although you are here disinclined to allow that Matter is by nature evil, yet in another passage you will deny having made such an admission.[^6535]" },
  { t = "note", id = "6528", text = "Compositionem Dei." },
  { t = "note", id = "6529", text = "Non accepisset translationem." },
  { t = "note", id = "6530", text = "Subostendis." },
  { t = "note", id = "6531", text = "Affinem." },
  { t = "note", id = "6532", text = "Matt. iii. 9." },
  { t = "note", id = "6533", text = "Subicis." },
  { t = "note", id = "6534", text = "This is the force of the subjunctive verb." },
  { t = "note", id = "6535", text = "Te confessum." },
]

[[section]]
id = "other-speculations-of-hermogenes-about-matter-and"
title = "Other Speculations of Hermogenes, About Matter and Some of Its Adjuncts, Shown to Be Absurd. For Instance, Its Alleged Infinity."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXIII.—Other Speculations of Hermogenes, About Matter and Some of Its Adjuncts, Shown to Be Absurd. For Instance, Its Alleged Infinity." },
  { t = "p", text = "My observations touching the *site*[^6536] of Matter, as also concerning its *mode*[^6537] have one and the same object in view—to meet and refute your perverse positions. You put Matter below God, and thus, of course, you assign a place to it below God. Therefore Matter is local.[^6538] Now, if it is local, it is within locality; if within locality, it is bounded[^6539] by the place within which it is; if it is bounded, it has an outline,[^6540] which (painter as you are in your special vocation) you know is the boundary to every object susceptible of outline. Matter, therefore, cannot be infinite, which, since it is in space, is bounded by space; and being thus determinable by space, it is susceptible of an outline. You, however, make it infinite, when you say: “It is on this account infinite, because it is always existent.” And if any of your disciples should choose to meet us by declaring your meaning to be that Matter is infinite in time, not in its corporeal mass,[^6541] still what follows will show that (you mean) corporeal infinity *to be an attribute of Matter*, that it is in respect of bulk immense and uncircumscribed. “Wherefore,” say you, “it is not fabricated as a whole, but *in* its parts.”[^6542] In bulk, therefore, is it infinite, not in time. And you contradict yourself[^6543] when you make *Matter* infinite in bulk, and at the same time ascribe place to it, including it within space and local outline. But yet at the same time I cannot tell why God should not have entirely formed it,[^6544] unless it be because He was either impotent or envious. I want therefore to know the moiety of that which was not wholly formed (by God), in order that I may understand what kind of thing the entirety was. It was only right that God should have made it known as a model of antiquity,[^6545] to set off the glory of His work." },
  { t = "note", id = "6536", text = "De situ." },
  { t = "note", id = "6537", text = "Oehler here restores the reading “quod et de *modo*,” instead of “de *motu*,” for which Pamelius contends. Oehler has the mss. on his side, and Fr. Junius, who interprets “*modo*” here to mean “mass or quantity.” Pamelius wishes to suit the passage to the preceding context (see ch. xxxvi.); Junius thinks it is meant rather to refer to what follows, by which it is confirmed." },
  { t = "note", id = "6538", text = "In loco." },
  { t = "note", id = "6539", text = "Determinatur." },
  { t = "note", id = "6540", text = "Lineam extremam." },
  { t = "note", id = "6541", text = "Modo corporis: or “bulk.”" },
  { t = "note", id = "6542", text = "Nec tota fabricatur, sed partes ejus. This perhaps means: “It is not its entirety, but its parts, which are used in creation.”" },
  { t = "note", id = "6543", text = "Obduceris: here a verb of the middle voice." },
  { t = "note", id = "6544", text = "In reference to the opinion above mentioned, “Matter is not fabricated as whole, but in parts.”" },
  { t = "note", id = "6545", text = "Ut exemplarium antiquitatis." },
]

[[section]]
id = "these-latter-speculations-shown-to-be-contradictory"
title = "These Latter Speculations Shown to Be Contradictory to the First Principles Respecting Matter, Formerly Laid Down by Hermogenes."
level = 1
blocks = [
  { t = "p", text = "Chapter XXXIX.—These Latter Speculations Shown to Be Contradictory to the First Principles Respecting Matter, Formerly Laid Down by Hermogenes." },
  { t = "p", text = "Well, now, since it seems to you to be the correcter thing,[^6546] let Matter be circumscribed[^6547] by means of changes and displacements; let it also be capable of comprehension, since (as you say) it is used as material by God,[^6548] on the ground of its being convertible, mutable, and separable. For its changes, you say, show it to be inseparable. And here you have swerved from your own lines[^6549] which you prescribed respecting the person of God when you laid down the rule that God made it not out of His own self, because it was not possible for Him to become divided[^6550] seeing that He is eternal and abiding for ever, and therefore unchangeable and indivisible. Since Matter too is estimated by the same eternity, having neither beginning nor end, it will be unsusceptible of division, of change, for the same reason that God also is. Since it is associated with Him in the joint possession of eternity, it must needs share with Him also the powers, the laws, and the conditions of eternity. In like manner, when you say, “All things simultaneously throughout the universe[^6551] possess portions of it,[^6552] that so the whole may be ascertained from[^6553] its parts,” you of course mean to indicate those parts which were produced out of it, and which are now visible to us. How then is this possession (of Matter) by all things throughout the universe effected—that is, of course, from the very beginning[^6554]—when the things which are now visible to us are different in their condition[^6555] from what they were in the beginning?" },
  { t = "note", id = "6546", text = "Rectius." },
  { t = "note", id = "6547", text = "Definitiva." },
  { t = "note", id = "6548", text = "Ut quæ fabricatur, inquis, a Deo." },
  { t = "note", id = "6549", text = "Lineis. Tertullian often refers to Hermogenes’ profession of painting." },
  { t = "note", id = "6550", text = "In partes venire." },
  { t = "note", id = "6551", text = "Omnia ex omnibus." },
  { t = "note", id = "6552", text = "i.e. of Matter." },
  { t = "note", id = "6553", text = "Dinoscatur ex." },
  { t = "note", id = "6554", text = "Utique ex pristinis." },
  { t = "note", id = "6555", text = "Aliter habeant." },
]

[[section]]
id = "shapeless-matter-an-incongruous-origin-for-god"
title = "Shapeless Matter an Incongruous Origin for God's Beautiful Cosmos. Hermogenes Does Not Mend His Argument by Supposing that Only a Portion of Matter Was Used in the Creation."
level = 1
blocks = [
  { t = "p", text = "Chapter XL.—Shapeless Matter an Incongruous Origin for God’s Beautiful Cosmos. Hermogenes Does Not Mend His Argument by Supposing that Only a Portion of Matter Was Used in the Creation." },
  { t = "p", text = "You say that Matter was reformed for the better[^6556]—from a worse condition, of course; and *thus* you would make the better a copy of the worse. Everything was in confusion, but now it is reduced to order; and would you also say, that out of order, disorder is produced? No one thing is the exact mirror[^6557] of another thing; that is to say, it is not its co-equal. Nobody ever found himself in a barber’s looking-glass look like an ass[^6558] instead of a man; unless it be he who supposes that unformed and shapeless Matter answers to Matter which is now arranged and beautified in the fabric of the world. What is there now that is without form in the world, what was there once that was formed[^6559] in Matter, that the world is the mirror of Matter? Since the world is known among the Greeks by a term denoting *ornament*,[^6560] how can it present the image of unadorned[^6561] Matter, in such a way that you can say the whole is known by its parts? To that whole will certainly belong even the *portion* which has not yet become formed; and you have already declared that the whole *of Matter* was not used as material *in the creation*.[^6562] It follows, then, that this rude, and confused, and unarranged portion cannot be recognized in the polished, and distinct and well-arranged *parts of creation*, which indeed can hardly with propriety be called parts of Matter, since they have quitted[^6563] its condition, by being separated from it in the transformation they have undergone." },
  { t = "note", id = "6556", text = "In melius reformatam." },
  { t = "note", id = "6557", text = "Speculum." },
  { t = "note", id = "6558", text = "Mulus." },
  { t = "note", id = "6559", text = "Speciatum: εἰδοποιηθέν, “arranged in specific forms.”" },
  { t = "note", id = "6560", text = "Κόσμος." },
  { t = "note", id = "6561", text = "Inornatæ: *unfurnished* with forms of beauty." },
  { t = "note", id = "6562", text = "Non totam eam fabricatam." },
  { t = "note", id = "6563", text = "Recesserunt a forma ejus." },
]

[[section]]
id = "sundry-quotations-from-hermogenes-now-uncertain-and"
title = "Sundry Quotations from Hermogenes. Now Uncertain and Vague are His Speculations Respecting Motion in Matter, and the Material Qualities of Good and Evil."
level = 1
blocks = [
  { t = "p", text = "Chapter XLI.—Sundry Quotations from Hermogenes. Now Uncertain and Vague are His Speculations Respecting Motion in Matter, and the Material Qualities of Good and Evil." },
  { t = "p", text = "I come back to the point of *motion*,[^6564] that I may show how slippery you are at every step. Motion in Matter was disordered, and confused, and turbulent. This is why you apply to it the comparison of a boiler of hot water surging over. Now how is it, that in another passage another sort of motion is affirmed by you? For when you want to represent Matter as neither good nor evil, you say: “Matter, which is the substratum (of creation)[^6565] possessing as it does motion in an equable impulse,[^6566] tends in no very great degree either to good or to evil.” Now if it had this equable impulse, it could not be turbulent, nor be like the boiling water of the caldron; it would rather be even and regular, oscillating indeed of its own accord between good and evil, but yet not prone or tending to either side. It would swing, as the phrase is, in a just and exact balance. Now this is not unrest; this is not turbulence or inconstancy;[^6567] but rather the regularity, and evenness, and exactitude of a motion, inclining to neither side. If it oscillated this way and that way, and inclined rather to one particular side, it would plainly in that case merit the reproach of unevenness, and inequality, and turbulence. Moreover, although the motion *of Matter* was not prone either to good or to evil, it would still, of course, oscillate between good and evil; so that from this circumstance too it is obvious that Matter is contained within certain limits,[^6568] because its motion, while prone to neither good nor evil, since it had no natural bent either way, oscillated from either between both, and therefore was contained within the limits of the two. But you, in fact, place both good and evil in a local habitation,[^6569] when you assert that motion in Matter inclined to neither of them. For Matter which was local,[^6570] when inclining neither hither nor thither, inclined not to the places in which good and evil were. But when you assign locality to good and evil, you make them corporeal by making them local, since those things which have local space must needs first have bodily substance. In fact,[^6571] incorporeal things could not have any locality of their own except in a body, when they have access to a body.[^6572] But when Matter inclined not to good and evil, it was as corporeal or local *essences* that it did not incline to them. You err, therefore, when you will have it that good and evil are substances. For you make substances of the things to which you assign locality;[^6573] but you assign locality when you keep motion in Matter poised equally distant from both sides.[^6574]" },
  { t = "note", id = "6564", text = "From which he has digressed since ch. xxxvi., p. 497." },
  { t = "note", id = "6565", text = "Subjacens materia." },
  { t = "note", id = "6566", text = "Æqualis momenti motum." },
  { t = "note", id = "6567", text = "Passivitas." },
  { t = "note", id = "6568", text = "Determinabilem." },
  { t = "note", id = "6569", text = "In loco facis: “you localise.”" },
  { t = "note", id = "6570", text = "In loco." },
  { t = "note", id = "6571", text = "Denique." },
  { t = "note", id = "6572", text = "Cum corpori accedunt: or, “when they are added to a body.”" },
  { t = "note", id = "6573", text = "Loca: “places;” one to each." },
  { t = "note", id = "6574", text = "Cum ab utraque regione suspendis: equally far from good and evil." },
]

[[section]]
id = "further-exposure-of-inconsistencies-in-the-opinions"
title = "Further Exposure of Inconsistencies in the Opinions of Hermogenes Respecting the Divine Qualities of Matter."
level = 1
blocks = [
  { t = "p", text = "Chapter XLII.—Further Exposure of Inconsistencies in the Opinions of Hermogenes Respecting the Divine Qualities of Matter." },
  { t = "p", text = "You have thrown out all your views loosely and at random,[^6575] in order that it might not be apparent, by too close a proximity, how contrary they are to one another. I, however, mean to gather them together and compare them. You allege that motion in Matter is without regularity,[^6576] and you go on to say that Matter aims at a shapeless condition, and then, in another passage, that it desires to be set in order by God. Does that, then, which affects to be without form, want to be put into shape? Or does that which wants to be put into shape, affect to be without form? You are unwilling that God should seem to be equal to Matter; and then again you say that it has a common condition[^6577] with God. “For it is impossible,” you say, “if it has nothing in common with God, that it can be set in order by Him.” But if it had anything in common with God, it did not want to be set in order,[^6578] being, forsooth, a part of the Deity through a community of condition; or else even God was susceptible of being set in order[^6579] by Matter, by His having Himself something in common with it. And now you herein subject God to necessity, since there was in Matter something on account of which He gave it form. You make it, however, a common attribute of both of them, that they set themselves in motion by themselves, and that they are ever in motion. What less do you ascribe to Matter than to God? There will be found all through a fellowship of divinity in this freedom and perpetuity of motion." },
  { t = "note", id = "6575", text = "Dispersisti omnia." },
  { t = "note", id = "6576", text = "Inconditum." },
  { t = "note", id = "6577", text = "“Communionem.”" },
  { t = "note", id = "6578", text = "Ornari: “to be adorned.”" },
  { t = "note", id = "6579", text = "Ornari: “to be adorned.”" },
  { t = "p", text = "Only in God motion is regular,[^6580] in Matter irregular.[^6581] In both, however, there is equally the attribute of Deity—both alike having free and eternal motion. At the same time, you assign more to Matter, to which belonged the privilege of thus moving itself in a way not allowed to God." },
  { t = "note", id = "6580", text = "Composite." },
  { t = "note", id = "6581", text = "Incondite." },
]

[[section]]
id = "other-discrepancies-exposed-and-refuted-respecting-the"
title = "Other Discrepancies Exposed and Refuted Respecting the Evil in Matter Being Changed to Good."
level = 1
blocks = [
  { t = "p", text = "Chapter XLIII.—Other Discrepancies Exposed and Refuted Respecting the Evil in Matter Being Changed to Good." },
  { t = "p", text = "On the subject of motion I would make this further remark. Following the *simile* of the boiling caldron, you say that motion in Matter, before it was regulated, was confused,[^6582] restless, incomprehensible by reason of excess in the commotion.[^6583] Then again you go on to say, “But it waited for the regulation[^6584] of God, and kept its irregular motion incomprehensible, owing to the tardiness of its irregular motion.” Just before you ascribe commotion, here tardiness, to motion. Now observe how many slips you make respecting the nature of Matter. In a former passage[^6585] you say, “If Matter were naturally evil, it would not have admitted of a change for the better; nor would God have ever applied to it any attempt at arrangement, for His labour would have been in vain.” You therefore concluded your two opinions, that Matter was not by nature evil, and that its nature was incapable of being changed by God; and then, forgetting them, you afterwards drew this inference: “But when it received adjustment from God, and was reduced to order,[^6586] it relinquished its nature.” Now, inasmuch as it was transformed to good, it was of course transformed from evil; and if by God’s setting it in order it relinquished[^6587] the nature of evil, it follows that its nature came to an end;[^6588] now its nature was evil before the adjustment, but after the transformation it might have relinquished that nature." },
  { t = "note", id = "6582", text = "Concretus." },
  { t = "note", id = "6583", text = "Certaminis." },
  { t = "note", id = "6584", text = "Compositionem: “arrangement.”" },
  { t = "note", id = "6585", text = "See above, ch. xxxvii. p. 498." },
  { t = "note", id = "6586", text = "Ornata." },
  { t = "note", id = "6587", text = "Cessavit a." },
  { t = "note", id = "6588", text = "Cessavit." },
]

[[section]]
id = "curious-views-respecting-god-s-method-of"
title = "Curious Views Respecting God's Method of Working with Matter Exposed. Discrepancies in the Heretic's Opinion About God's Local Relation to Matter."
level = 1
blocks = [
  { t = "p", text = "Chapter XLIV.—Curious Views Respecting God’s Method of Working with Matter Exposed. Discrepancies in the Heretic’s Opinion About God’s Local Relation to Matter." },
  { t = "p", text = "But it remains that I should show also how you make God work. You are plainly enough at variance with the philosophers; but neither are you in accord with the prophets. The Stoics maintain that God pervaded Matter, just as honey the honeycomb. You, however, affirm that it is not by pervading Matter that God makes the world, but simply by appearing, and approaching it, just as beauty affects[^6589] a thing by simply appearing, and a loadstone by approaching it. Now what similarity is there in God forming the world, and beauty wounding a soul, or a magnet attracting iron? For even if God appeared to Matter, He yet did not wound it, as beauty does the soul; if, again, He approached it, He yet did not cohere to it, as the magnet does to the iron. Suppose, however, that your examples are suitable ones. Then, of course,[^6590] it was by appearing and approaching to Matter that God made the world, and He made it when He appeared and when He approached to it. Therefore, since He had not made it before then,[^6591] He had neither appeared nor approached to it. Now, by whom can it be believed that God had not appeared to Matter—of the same nature as it even was owing to its eternity? Or that He had been at a distance from it—even He whom we believe to be existent everywhere, and everywhere apparent; whose praises all things chant, even inanimate things and things incorporeal, according to (the prophet) Daniel?[^6592] How immense the place, where God kept Himself so far aloof from Matter as to have neither appeared nor approached to it before the creation of the world! I suppose He journeyed to it from a long distance, as soon as He wished to appear and approach to it." },
  { t = "note", id = "6589", text = "Facit quid decor." },
  { t = "note", id = "6590", text = "Certe." },
  { t = "note", id = "6591", text = "Retro." },
  { t = "note", id = "6592", text = "Dan. iii. 21." },
]

[[section]]
id = "conclusion-contrast-between-the-statements-of-hermogenes"
title = "Conclusion. Contrast Between the Statements of Hermogenes and the Testimony of Holy Scripture Respecting the Creation. Creation Out of Nothing, Not Out of Matter."
level = 1
blocks = [
  { t = "p", text = "Chapter XLV.—Conclusion. Contrast Between the Statements of Hermogenes and the Testimony of Holy Scripture Respecting the Creation. Creation Out of Nothing, Not Out of Matter." },
  { t = "p", text = "But it is not thus that the prophets and the apostles have told us that the world was made by God merely appearing and approaching Matter. They did not even mention any Matter, but (said) that Wisdom was first set up, the beginning of His ways, for His works.[^6593] Then that the Word was produced, “through whom all things were made, and without whom nothing was made.”[^6594] Indeed, “by the Word of the Lord were the heavens made, and all their hosts by the breath of His mouth.”[^6595] He is the Lord’s right hand,[^6596] indeed His two hands, by which He worked and constructed *the universe*. “For,” says He, “the heavens are the works of Thine hands,”[^6597] wherewith “He hath meted out the heaven, and the earth with a span.”[^6598] Do not be willing so to cover God with flattery, as to contend that He produced by His mere appearance and simple approach so many vast substances, instead of rather forming them by His own energies. For this is proved by Jeremiah when he says, “God hath made the earth by His power, He hath established the world by His wisdom, and hath stretched out the heaven by His understanding.”[^6599] These are the energies by the stress of which He made this universe.[^6600] His glory is greater if He laboured. At length on the seventh day He rested from His works. Both one and the other were after His manner. If, on the contrary,[^6601] He made this world simply by appearing and approaching it, did He, on the completion of His work, cease to appear and approach it any more. Nay rather,[^6602] God began to appear more conspicuously and to be everywhere accessible[^6603] from the time when the world was made. You see, therefore, how all things consist by the operation of that God who “made the earth by His power, who established the world by His wisdom, and stretched out the heaven by His understanding;” not appearing merely, nor approaching, but applying the almighty efforts of His mind, His wisdom, His power, His understanding, His word, His Spirit, His might. Now these things were not necessary to Him, if He had been perfect by simply appearing and approaching. They are, however, His “invisible things,” which, according to the apostle, “are from the creation of the world clearly seen by the things that are made;”[^6604] *they are no parts* of a nondescript[^6605] Matter, but they are the sensible[^6606] evidences of Himself. “For who hath known the mind of the Lord,”[^6607] of which (the apostle) exclaims: “O the depth of the riches both of His wisdom and knowledge! how unsearchable are His judgments, and His ways past finding out!”[^6608] Now what clearer truth do these words indicate, than that all things were made out of nothing? They are incapable of being found out or investigated, except by God alone. Otherwise, if they were traceable or discoverable in Matter, they would be capable of investigation. Therefore, in *as* far as it has become evident that Matter had no prior existence (even from this circumstance, that it is impossible[^6609] for it to have had such an existence as is assigned to it), in *so* far is it proved that all things were made by God out of nothing. It must be admitted, however,[^6610] that Hermogenes, by describing for Matter a condition like his own—irregular, confused, turbulent, of a doubtful and precipate and fervid impulse—has displayed a specimen of his own art, and painted his own portrait." },
  { t = "note", id = "6593", text = "Prov. viii. 22, 23." },
  { t = "note", id = "6594", text = "John i. 3." },
  { t = "note", id = "6595", text = "Spiritu Ipsius: “by His Spirit.” See Ps. xxxiii. 6." },
  { t = "note", id = "6596", text = "Isa. xlviii. 13." },
  { t = "note", id = "6597", text = "Ps. cii. 25." },
  { t = "note", id = "6598", text = "Isa. xl. 12 and xlviii. 13." },
  { t = "note", id = "6599", text = "Jer. li. 15." },
  { t = "note", id = "6600", text = "Ps. lxiv. 7." },
  { t = "note", id = "6601", text = "Aut si." },
  { t = "note", id = "6602", text = "Atquin." },
  { t = "note", id = "6603", text = "Ubique conveniri." },
  { t = "note", id = "6604", text = "Rom. i. 20." },
  { t = "note", id = "6605", text = "Nescio quæ." },
  { t = "note", id = "6606", text = "Sensualia." },
  { t = "note", id = "6607", text = "Rom. xi. 34." },
  { t = "note", id = "6608", text = "Ver. 33." },
  { t = "note", id = "6609", text = "Nec competat." },
  { t = "note", id = "6610", text = "Nisi quod." },
]

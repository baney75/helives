[[section]]
id = "the-mode-of-controversy-changed-the-premisses"
title = "The Mode of Controversy Changed. The Premisses of Hermogenes Accepted, in Order to Show into What Confusion They Lead Him."
level = 1
blocks = [
  { t = "p", text = "Chapter XII.—The Mode of Controversy Changed. The Premisses of Hermogenes Accepted, in Order to Show into What Confusion They Lead Him." },
  { t = "p", text = "Come now, let us suppose Matter to be evil, nay, very evil, by *nature* of course, just as we believe God to be good, even very good, in like manner by *nature*. Now nature must be regarded as sure and fixed, just as persistently fixed in evil in the case of Matter, as immoveable and unchangeable in good in the case of God. Because, as is evident,[^6247] if nature admits of change from evil to good in Matter, it can be changed from good to evil in God. Here some man will say, Then will “children not be raised up to Abraham from the stones?”[^6248] Will “generations of vipers not bring forth the fruit of repentance?”[^6249] And “children of wrath” fail to become sons of peace, if nature be unchangeable? Your reference to such examples as these, my friend,[^6250] is a thoughtless[^6251] one. For things which owe their existence to birth such as stones and vipers and human beings—are not apposite to the case of Matter, which is unborn; since their nature, by possessing a beginning, may have also a termination. But bear in mind[^6252] that Matter has once for all been determined to be eternal, as being unmade, unborn, and therefore supposably of an unchangeable and incorruptible nature; and this from the very opinion of Hermogenes himself, which he alleges against us when he denies that God was able to make (anything) of Himself, on the ground that what is eternal is incapable of change, because it would lose—so the opinion runs[^6253]—what it once was, in becoming by the change that which it was not, if it were not eternal. But as for the Lord, who is also eternal, (he maintained) that He could not be anything else than what He always is. Well, then, I will adopt this definite opinion of his, and by means thereof refute him. I blame Matter with a like censure, because out of it, evil though it be—nay, very evil—good things have been created, nay, “very good” ones: “And God saw that they were good, and God blessed them”[^6254]—because, of course, of their very great goodness; certainly not because they were evil, or very evil. Change is therefore admissible in Matter; and this being the case, it has lost its condition of eternity; in short,[^6255] its beauty is decayed in death.[^6256] Eternity, however, cannot be lost, because it cannot be eternity, except by reason of its immunity from loss. For the same reason also it is incapable of change, inasmuch as, since it is eternity, it can by no means be changed." },
  { t = "note", id = "6247", text = "Scilicet." },
  { t = "note", id = "6248", text = "Matt. iii. 9." },
  { t = "note", id = "6249", text = "Verses 7, 8." },
  { t = "note", id = "6250", text = "O homo." },
  { t = "note", id = "6251", text = "Temere." },
  { t = "note", id = "6252", text = "Tene." },
  { t = "note", id = "6253", text = "Scilicet." },
  { t = "note", id = "6254", text = "Gen. i. 21, 22." },
  { t = "note", id = "6255", text = "Denique." },
  { t = "note", id = "6256", text = "That is, of course, by its own natural law." },
]

[[section]]
id = "another-ground-of-hermogenes-that-matter-has"
title = "Another Ground of Hermogenes that Matter Has Some Good in It. Its Absurdity."
level = 1
blocks = [
  { t = "p", text = "Chapter XIII.—Another Ground of Hermogenes that Matter Has Some Good in It. Its Absurdity." },
  { t = "p", text = "Here the question will arise How creatures were made good out of it,[^6257] which were formed without any change at all?[^6258] How occurs the seed of what is good, nay, very good, in that which is evil, nay, very evil? Surely a good tree does not produce evil fruit,[^6259] since there is no God who is not good; nor does an evil tree yield good fruit, since there is not Matter except what is very evil. Or if we were to grant him that there is some germ of good *in it*, then there will be no longer a uniform nature (pervading it), that is to say, one which is evil throughout; but instead thereof (we now encounter) a double nature, partly good and partly evil; and again the question will arise, whether, in a subject which is good and evil, there could possibly have been found a harmony for light and darkness, for sweet and bitter? So again, if qualities so utterly diverse as good and evil have been able to unite together,[^6260] and have imparted to Matter a double nature, productive of both kinds of fruit, then no longer will absolutely[^6261] good things be imputable to God, just as evil things are not ascribed to Him, but both qualities will appertain to Matter, since they are derived from the property of Matter. At this rate, we shall owe to God neither gratitude for good things, nor grudge[^6262] for evil ones, because He has produced no work of His own proper character.[^6263] From which circumstance will arise the clear proof that He has been subservient to Matter." },
  { t = "note", id = "6257", text = "Matter." },
  { t = "note", id = "6258", text = "i.e. in their nature, Matter being evil, and they good, on the hypothesis." },
  { t = "note", id = "6259", text = "Matt. vii. 18." },
  { t = "note", id = "6260", text = "Concurrisse." },
  { t = "note", id = "6261", text = "Ipsa." },
  { t = "note", id = "6262", text = "Invidiam." },
  { t = "note", id = "6263", text = "Ingenio." },
]

[[section]]
id = "tertullian-pushes-his-opponent-into-a-dilemma"
title = "Tertullian Pushes His Opponent into a Dilemma."
level = 1
blocks = [
  { t = "p", text = "Chapter XIV.—Tertullian Pushes His Opponent into a Dilemma." },
  { t = "p", text = "Now, if it be also argued, that although Matter may have afforded Him the opportunity, it was still His own will which led Him to the creation of good creatures, as having detected[^6264] what was good in matter—although this, too, be a discreditable supposition[^6265]—yet, at any rate, when He produces evil likewise out of the same (Matter), He is a servant to Matter, since, of course,[^6266] it is not of His own accord that He produces this too, having nothing else that He can do than to effect creation out of an evil *stock*[^6267]—unwillingly, no doubt, as being good; of necessity, too, as being unwilling; and as an act of servitude, because from necessity. Which, then, is the worthier thought, that He created evil things of necessity, or of His own accord? Because it was indeed of necessity that He created them, if out of Matter; of His own accord, if out of nothing. For you are now labouring in vain when you try to avoid making God the Author of evil things; because, since He made all things of Matter, they will have to be ascribed to Himself, who made them, just because[^6268] He made them. Plainly the interest of the question, whence He made all things, identifies itself with (the question), whether He made all things out of nothing; and it matters not whence He made all things, so that He made all things thence, whence most glory accrued to Him.[^6269] Now, more glory accrued to Him from a creation of His own will than from one of necessity; in other words, from a creation out of nothing, than from one out of Matter. It is more worthy to believe that God is free, even as the Author of evil, than that He is a slave. Power, whatever it be, is more suited to Him than infirmity.[^6270] If we thus even admit that matter had nothing good in it, but that the Lord produced whatever good He did produce of His own power, then some other questions will with equal reason arise. First, since there was no good at all in Matter, *it is clear* that good was not made of Matter, on the express ground indeed that Matter did not possess it. Next, if *good was* not *made* of Matter, it must then have been made of God; if not of God, then it must have been made of nothing.—For this is the alternative, on Hermogenes’ own showing.[^6271]" },
  { t = "note", id = "6264", text = "Nactus." },
  { t = "note", id = "6265", text = "Turpe." },
  { t = "note", id = "6266", text = "Utique." },
  { t = "note", id = "6267", text = "Ex malo." },
  { t = "note", id = "6268", text = "Proinde quatenus." },
  { t = "note", id = "6269", text = "We subjoin the original of this sentence: “Plane sic interest unde fecerit ac si de nihilo fecisset, nec interest uned fecerit, ut inde fecerit unde eum magis decuit.”" },
  { t = "note", id = "6270", text = "Pusillitas." },
  { t = "note", id = "6271", text = "Secundum Hermogenis dispositionem." },
]

[[section]]
id = "the-truth-that-god-made-all-things"
title = "The Truth, that God Made All Things from Nothing, Rescued from the Opponent's Flounderings."
level = 1
blocks = [
  { t = "p", text = "Chapter XV.—The Truth, that God Made All Things from Nothing, Rescued from the Opponent’s Flounderings." },
  { t = "p", text = "Now, if good was neither produced out of matter, since it was not in it, evil as it was, nor out of God, since, according to the position of Hermogenes, nothing could have been produced out of god, it will be found that good was created out of nothing, inasmuch as it was formed of none—neither of Matter nor of God. And if good was formed out of nothing, why not evil too? Nay, if anything was formed out of nothing, why not all things? Unless indeed it be that the divine might was insufficient for the production of *all* things, though it produced a something out of nothing. Or else if good proceeded from evil matter, since it issued neither from nothing nor from God, it will follow that it must have proceeded from the conversion of Matter contrary to that unchangeable attribute which has been claimed for *it*, *as* an eternal being.[^6272] Thus, in regard to the source whence good derived its existence, Hermogenes will now have to deny the possibility of such. But still it is necessary that (good) should proceed from some one of those sources from which he has denied the very possibility of its having been derived. Now if evil be denied to be of nothing for the purpose of denying it to be the work of God, from whose will there would be too much appearance of its being derived, and be alleged to proceed from Matter, that it may be the property of that very thing of whose substance it is assumed to be made, even here also, as I have said, God will have to be regarded as the Author of evil; because, whereas it had been His duty[^6273] to produce all good things out of Matter, or rather good things simply, by His identical attribute of power and will, He did yet *not only* not produce all good things, but even (some) evil things—of course, either willing that the evil should exist if He was able to cause their non-existence, or not being strong enough to effect that all things should be good, if being desirous of that result, He failed in the accomplishment thereof; since there can be no difference whether it were by weakness or by will, that the Lord proved to be the Author of evil. Else what was the reason that, after creating good things, as if Himself good, He should have also produced evil things, as if He failed in His goodness, since He did not confine Himself to the production of things which were simply consistent with Himself? What necessity was there, after the production of His proper work, for His troubling Himself about Matter also by producing evil likewise, in order to secure His being alone acknowledged as good from His good, and at the same time[^6274] to prevent Matter being regarded as evil from (created) evil? Good would have flourished much better if evil had not blown upon it. For Hermogenes himself explodes the arguments of sundry persons who contend that evil things were necessary to impart lustre to the good, which must be understood from their contrasts. This, therefore, was not the ground for the production of evil; but if some other reason must be sought for the introduction thereof, why could it not have been introduced even from nothing,[^6275] since the very same reason would exculpate the Lord from the reproach of being thought the author of evil, which now excuses *the existence of* evil things, when He produces them out of Matter? And if there is this excuse, then the question is completely[^6276] shut up in a corner, where they are unwilling to find it, who, without examining into the reason itself of evil, or distinguishing how they should either attribute it to God or separate it from God, do in fact expose God to many most unworthy calumnies.[^6277]" },
  { t = "note", id = "6272", text = "Contra denegatam æterni conversationem. Literally, “Contrary to that convertibility of an eternal nature which has been denied (by Hermogenes) to be possible.” It will be obvious why we have, in connection with the preceding clause preferred the equivalent rendering of our text. For the denial of Hermogenes, which Tertullian refers to, see above, chap. xii. p. 484." },
  { t = "note", id = "6273", text = "Debuisset protulisse." },
  { t = "note", id = "6274", text = "This clumsy expedient to save the character of both God and Matter was one of the weaknesses of Hermogenes’ system." },
  { t = "note", id = "6275", text = "Cur non et ex nihilo potuerit induci?" },
  { t = "note", id = "6276", text = "Ubique et undique." },
  { t = "note", id = "6277", text = "Destructionibus. “Ruin of character” is the true idea of this strong term." },
]

[[section]]
id = "a-series-of-dilemmas-they-show-that"
title = "A Series of Dilemmas. They Show that Hermogenes Cannot Escape from the Orthodox Conclusion."
level = 1
blocks = [
  { t = "p", text = "Chapter XVI.—A Series of Dilemmas. They Show that Hermogenes Cannot Escape from the Orthodox Conclusion." },
  { t = "p", text = "On the very threshold,[^6278] then, of this doctrine,[^6279] which I shall probably have to treat of elsewhere, I distinctly lay it down as my position, that both good and evil must be ascribed either to God, who made them out of Matter; or to Matter itself, out of which He made them; or both one and the other to both of them together,[^6280] because they are bound together—both He who created, and that out of which He created; or (lastly) one to One and the other to the Other,[^6281] because after Matter and God there is not a third. Now if both should prove to belong *to God*, God evidently will be the author of evil; but God, as being good, cannot be the author of evil. Again, if both are ascribed *to Matter*, Matter will evidently be the very mother of good,[^6282] but inasmuch as Matter is wholly evil, it cannot be the mother of good. But if both one and the other should be thought to belong to Both together, then in this case also Matter will be comparable with God; and both will be equal, being on equal terms allied to evil as well as to good. Matter, however, ought not to be compared with God, in order that it may not make two gods. If, (lastly,) one be ascribed to One, and the other to the Other—that is to say, let the good be God’s, and the evil belong to Matter—then, on the one hand, evil must not be ascribed to God, nor, on the other hand, good to Matter. And God, moreover, by making both good things and evil things out of Matter, creates *them* along with it. This being the case, I cannot tell how Hermogenes[^6283] is to escape from my conclusion; for he supposes that God cannot be the author of evil, in what way soever He created evil out of Matter, whether it was of His own will, or of necessity, or from the reason (of the case). If, however, He is the author of evil, who was the actual Creator, Matter being simply associated *with Him* by reason of its furnishing Him with substance,[^6284] you now do away with the cause[^6285] of *your* introducing Matter. For it is not the less *true*, that it is by means of Matter that God shows Himself the author of evil, although Matter has been assumed *by you* expressly to prevent God’s seeming to be the author of evil. Matter being therefore excluded, since the cause of it is excluded, it remains that God without doubt, must have made all things out of nothing. Whether evil things were amongst them we shall see, when it shall be made clear what are evil things, and whether those things are evil which you at present deem to be so. For it is more worthy of God that He produced even these of His own will, by producing them out of nothing, than from the predetermination of another,[^6286] (which must have been the case) if He had produced them out of Matter. It is liberty, not necessity, which suits the character of God. I would much rather that He should have even willed to create evil of Himself, than that He should have lacked ability to hinder its creation." },
  { t = "note", id = "6278", text = "Præstructione. The notion is of the *foundation* of an edifice: here =\"preliminary remarks” (see our *Anti-Marcion*, v. 5, p. 438)." },
  { t = "note", id = "6279", text = "Articuli." },
  { t = "note", id = "6280", text = "Utrumque utrique." },
  { t = "note", id = "6281", text = "Alterum alteri." },
  { t = "note", id = "6282", text = "Boni matrix." },
  { t = "note", id = "6283", text = "The usual reading is “Hermogenes.” Rigaltius, however, reads “Hermogenis,” of which Oehler approves; so as to make Tertullian say, “I cannot tell how I can avoid the opinion of Hermogenes, who,” etc. etc." },
  { t = "note", id = "6284", text = "Per substantiæ suggestum." },
  { t = "note", id = "6285", text = "Excusas jam causam. Hermogenes held that Matter was eternal, to exclude God from the authorship of evil. This *causa* of Matter he was now illogically evading. Excusare = ex, causa, “to cancel the cause.”" },
  { t = "note", id = "6286", text = "De præjudicio alieno." },
]

[[section]]
id = "the-truth-of-god-s-work-in"
title = "The Truth of God's Work in Creation. You Cannot Depart in the Least from It, Without Landing Yourself in an Absurdity."
level = 1
blocks = [
  { t = "p", text = "Chapter XVII.—The Truth of God’s Work in Creation. You Cannot Depart in the Least from It, Without Landing Yourself in an Absurdity." },
  { t = "p", text = "This rule is required by the nature of the One-only God,[^6287] who is One-only in no other way than as the sole God; and in no other way sole, than as having nothing else (co-existent) with Him. So also He will be first, because all things are after Him; and all things are after Him, because all things are by Him; and all things are by Him, because they are of nothing: so that reason coincides with the Scripture, which says: “Who hath known the mind of the Lord? or who hath been His counsellor? or with whom took He counsel? or who hath shown to Him the way of wisdom and knowledge? Who hath first given to Him, and it shall be recompensed to him again?”[^6288] Surely none! Because there was present with Him no power, no material, no nature which belonged to any other than Himself. But if it was with some (portion of Matter)[^6289] that He effected His creation, He must have received from that (Matter) itself both the design and the treatment of its order as being “the way of wisdom and knowledge.” For He had to operate conformably with the quality of the thing, and according to the nature of Matter, not according to His own will in consequence of which He must have made[^6290] even evil things suitably to the nature not of Himself, but of Matter." },
  { t = "note", id = "6287", text = "Unici Dei." },
  { t = "note", id = "6288", text = "Rom. xi. 34, 35; comp. Isa. xl. 14." },
  { t = "note", id = "6289", text = "De aliquo." },
  { t = "note", id = "6290", text = "Adeo ut fecerit." },
]

[[section]]
id = "an-eulogy-on-the-wisdom-and-word"
title = "An Eulogy on the Wisdom and Word of God, by Which God Made All Things of Nothing."
level = 1
blocks = [
  { t = "p", text = "Chapter XVIII.—An Eulogy on the Wisdom and Word of God, by Which God Made All Things of Nothing." },
  { t = "p", text = "If any material was necessary to God in the creation of the world, as Hermogenes supposed, God had a far nobler and more suitable one in His own wisdom[^6291]—one which was not to be gauged by the writings of[^6292] philosophers, but to be learnt from the words or prophets. This alone, indeed, knew the mind of the Lord. For “who knoweth the things of God, and the things in God, but the Spirit, which is in Him?”[^6293] Now His wisdom is that Spirit. This was His counsellor, the very way of His wisdom and knowledge.[^6294] Of this He made all things, making them through It, and making them with It. “When He prepared the heavens,” so says (the Scripture[^6295]), “I was present with Him; and when He strengthened above the winds the lofty clouds, and when He secured the fountains[^6296] which are under the heaven, I was present, compacting these things[^6297] along with Him. I was He[^6298] in whom He took delight; moreover, I daily rejoiced in His presence: for He rejoiced when He had finished the world, and amongst the sons of men did He show forth His pleasure.”[^6299] Now, who would not rather approve of[^6300] this as the fountain and origin of all things—of this as, in very deed, the Matter of all Matter, not liable to any end,[^6301] not diverse in condition, not restless in motion, not ungraceful in form, but natural, and proper, and duly proportioned, and beautiful, such truly as even God might well have required, who requires His own and not another’s? Indeed, as soon as He perceived It to be necessary for His creation of the world, He immediately creates It, and generates It in Himself. “The Lord,” says the Scripture, “possessed[^6302] me, the beginning of His ways for the creation of His works. Before the worlds He founded me; before He made the earth, before the mountains were settled in their places; moreover, before the hills He generated me, and prior to the depths was I begotten.”[^6303] Let Hermogenes then confess that the very Wisdom of God is declared to be born and created, for the especial reason that we should not suppose that there is any other being than God alone who is unbegotten and uncreated. For if that, which from its being inherent in the Lord[^6304] was of Him and in Him, was yet not without a beginning,—I mean[^6305] His wisdom, which was then born and created, when in the thought of God It began to assume motion[^6306] for the arrangement of His creative works,—how much more impossible[^6307] is it that anything should have been without a beginning which was extrinsic to the Lord![^6308] But if this same Wisdom is the Word of God, in the capacity[^6309] of Wisdom, and (as being He) without whom nothing was made, just as also (nothing) was set in order without Wisdom, how can it be that anything, except the Father, should be older, and on this account indeed nobler, than the Son of God, the only-begotten and first-begotten Word? Not to say that[^6310] what is unbegotten is stronger than that which is born, and what is not made more powerful than that which is made. Because that which did not require a Maker to give it existence, will be much more elevated in rank than that which had an author to bring it into being. On this principle, then,[^6311] if evil is indeed unbegotten, whilst the Son of God is begotten (“for,” says God, “my heart hath emitted my most excellent Word”[^6312]), I am not quite sure that evil may not be introduced by good, the stronger by the weak, in the same way as the unbegotten is by the begotten. Therefore on this ground Hermogenes puts Matter even before God, by putting it before the Son. Because the Son is the Word, and “the Word is God,”[^6313] and “I and my Father are one.”[^6314] But after all, perhaps,[^6315] the Son will patiently enough submit to having that preferred before Him which (by Hermogenes), is made equal to the Father!" },
  { t = "note", id = "6291", text = "Sophiam suam scilicet." },
  { t = "note", id = "6292", text = "Apud." },
  { t = "note", id = "6293", text = "1 Cor. ii. 11." },
  { t = "note", id = "6294", text = "Isa. xl. 14." },
  { t = "note", id = "6295", text = "Or the “inquit” may indicate the very words of “Wisdom.”" },
  { t = "note", id = "6296", text = "Fontes. Although Oehler prefers Junius’ reading “montes,” he yet retains “fontes,” because Tertullian (in ch. xxxii. below) has the unmistakable reading “fontes” in a like connection." },
  { t = "note", id = "6297", text = "Compingens." },
  { t = "note", id = "6298", text = "Ad quem: the expression is masculine." },
  { t = "note", id = "6299", text = "Prov. viii. 27–31." },
  { t = "note", id = "6300", text = "Commendet." },
  { t = "note", id = "6301", text = "“Non fini subditam” is Oehler’s better reading than the old “sibi subditam.”" },
  { t = "note", id = "6302", text = "Condidit: created." },
  { t = "note", id = "6303", text = "See Prov. viii." },
  { t = "note", id = "6304", text = "Intra Dominum." },
  { t = "note", id = "6305", text = "Scilicet." },
  { t = "note", id = "6306", text = "Cœpti agitari." },
  { t = "note", id = "6307", text = "Multo magis non capit." },
  { t = "note", id = "6308", text = "Extra Dominum." },
  { t = "note", id = "6309", text = "Sensu." },
  { t = "note", id = "6310", text = "Nedum." },
  { t = "note", id = "6311", text = "Proinde." },
  { t = "note", id = "6312", text = "On this version of Ps. xlv. 1., and its application by Tertullian, see our *Anti-Marcion* (p. 299, note 5)." },
  { t = "note", id = "6313", text = "John i. 1." },

[[section]]
id = "introduction"
title = "Introduction."
level = 1
blocks = [
  { t = "h", text = "Melito, the Philosopher." },
  { t = "p", text = "[a.d. 160–170–177.] Melito[^3540] may have been the immediate successor of the “angel” (or “apostle”) of the church of Sardis, to whom our Great High Priest addressed one of the apocalyptic messages. He was an “Apostolic Father” in point of fact; he very probably knew the blessed Polycarp and his disciple Irenæus. He is justly revered for the diligence with which he sought out the evidence which, in his day, established the Canon of the Old Testament, then just complete." },
  { t = "note", id = "3540", text = "Routh, *R. S*., vol. i. p. 113. And see Westcott, *Canon*, p. 245." },
  { t = "p", text = "In the following fragments we find him called Bishop of Sardis, Bishop of Attica, and Bishop of Ittica. He is also introduced to us as “the Philosopher,” and we shall find him styled “the Eunuch” by Polycrates. It is supposed that he had made himself a cœlebs “for the kingdom of heaven’s sake,” without mistaking our Lord’s intent, as did Origen. He was not a monk, but accepted a single estate to be the more free and single-eyed in the Master’s service. From the encyclopedic erudition of Lightfoot we glean some particulars, as follows:—" },
  { t = "p", text = "1. I have adopted his date, as Lightfoot gives it,—that is, the period of his writings,—under the Antonines. The improbability of seventy years in the episcopate is reason enough for rejecting the idea that he was himself the “angel of the church of Sardis,” to whom our Lord sent the terrible rebuke." },
  { t = "p", text = "2. His silence concerning persecutions under Vespasian, Trojan, and Antoninus Pius cannot be pleaded to exempt them from this stain, against positive evidence to the contrary." },
  { t = "p", text = "3. A coincidence with Ignatius to the Ephesians[^3541] will be noted hereafter." },
  { t = "note", id = "3541", text = "Lightfoot, *A. F*., vol. ii. p. 48." },
  { t = "p", text = "4. Melito, with Claudius Apollinaris and even Polycrates, may have been personally acquainted with Ignatius;[^3542] of course, one with another. These lived not far from Smyrna; Asia Minor was, in the first century, the focus of Christian activity." },
  { t = "note", id = "3542", text = "*Ib*., vol. i. p. 428." },
  { t = "p", text = "5. We know of his visit to the East from his own account, preserved by Eusebius. The Christians of proconsular Asia were accustomed to such journeys. Even Clement of Alexandria may have met him, as he seems to have met Tatian and Theodotus.[^3543]" },
  { t = "note", id = "3543", text = "Vol. ii. (*Stromata*) p. 301, this series." },
  { t = "p", text = "6. Melito vouches for the rescript of Hadrian,[^3544] but his supposed reference to the edict of Antoninus does not bear close scrutiny as warrant for its authenticity.[^3545]" },
  { t = "note", id = "3544", text = "Vol. i. p. 186, this series." },
  { t = "note", id = "3545", text = "Lightfoot, *A. F*., vol. i. p. 468." },
  { t = "p", text = "7. The Apology of our author was addressed to Aurelius in his mid-career as a sovereign, about a.d. 170. Justin, Melito, Athenagoras, and Theophilus all tell the same sad story of imperial cruelty. Even when Justin wrote to Antoninus, Marcus was supreme in the councils of the elder emperor.[^3546]" },
  { t = "note", id = "3546", text = "Lightfoot, *A. F*., vol. ii." },
  { t = "p", text = "8. He became a martyr, probably under Marcus Aurelius, *circa* a.d. 177;[^3547] some eminent critics have even dated his Apology as late as this." },
  { t = "note", id = "3547", text = "*Ibid*., pp. 446, 494." },
]

[[section]]
id = "part-1"
title = "Part I. A Discourse Which Was in the Presence of Antoninus Cæsar, and He Exhorted The Said Cæsar to Acquaint Himself with God, and Showed to Him the Way of Truth."
level = 1
blocks = [
  { t = "p", text = "A Discourse Which Was in the Presence of Antoninus Cæsar, and He Exhorted[^3548] The Said Cæsar to Acquaint Himself with God, and Showed to Him the Way of Truth." },
  { t = "note", id = "3548", text = "“Which was *delivered* in the presence…and *in which* etc.” This appears to be the sense intended, and is that given by M. Renan: “Sermo qui factus est.” Cureton renders, “Who was in the presence, etc.,” and supposes that Melito first saw and conversed with the emperor, and afterwards wrote this discourse. Melito speaks of it more than once as written. This view, however, does not dispose of that fact that Melito is here affirmed to have “exhorted (lit., *said to*) Cæsar, etc.” It was clearly meant to be understood that the discourse, or *speech*, was spoken: the references to writing merely show that it was written, either before or after the delivery." },
  { t = "p", text = "He began to speak as follows:—" },
  { t = "p", text = "“It is not easy,” said Melito, “speedily to bring into the right way the man who has a long time previously been held fast by error. It may, however, be effected: for, when a man turns away ever so little from error, the mention of the truth is acceptable to him. For, just as when the cloud breaks ever so little there comes fair weather, even so, when a man turns toward God, the thick cloud of error which deprived him of true vision is quickly withdrawn from before him. For error, like disease[^3549] and sleep, long holds fast those who come under its influence;[^3550] but truth uses the word as a goad, and smites the slumberers, and awakens them; and when they are awake they look at the truth, and also understand it: they hear, and distinguish that which is from that which is not. For there are men who call iniquity righteousness: they think, for example, that it is righteousness for a man to err with the many. But I, for my part, affirm that it is not a good excuse *for error* that a man errs with the many. For, if one man only sin,[^3551] his sin is great: how much greater will be the sin when many sin *together!*" },
  { t = "note", id = "3549", text = "Cureton: “passion.” The word *** takes both meanings." },
  { t = "note", id = "3550", text = "Lit. “sojourn beneath it.”" },
  { t = "note", id = "3551", text = "Cureton: “act foolishly.”" },
  { t = "p", text = "“Now, the sin of which I speak is this: when a man abandons that which really exists, and serves that which does not really exist. There ‘is’ that which really exists, and it is called God. He, *I say*, really exists, and by His power doth everything subsist. This being is in no sense made, nor did He ever come into being; but He has existed from eternity, and will *continue to* exist for ever and ever. He changeth not, while everything *else* changes. No eye[^3552] can see Him, nor thought apprehend Him, nor language describe Him; and those who love Him speak of Him thus: ‘Father, and God of Truth.’" },
  { t = "note", id = "3552", text = "Lit. “sight.”" },
  { t = "p", text = "“If, therefore, a man forsake the light, and say that there is another God, it is plain from what he himself says that it is some created thing which he calls God. For, if a man call fire God, it is not God, because it is fire; and, if a man call water God, it is not God, because it is water; and, if *he so call* this earth on which we tread, or these heavens which are seen by us, or the sun, or the moon, or some one of these stars which run their course without ceasing by *Divine* command, and do not speed along by their own will, *neither are these gods;* and, if a man call gold and silver gods, are not these objects things which we use as we please? and, if *he so call* those pieces of wood which we burn, or those stones which we break, how can these things be gods? For, lo! they are *for* the use of man. How can ‘they’ escape the commission of great sin, who in their speech change the great God into those things which, so long as they continue, continue by *Divine* command?" },
  { t = "p", text = "“But, notwithstanding this, I say that so long as a man does not hear, and *so* does not discern or understand that there is a Lord over these creatures, he is not perhaps to be blamed: because no one finds fault with a blind man though he walk ever so badly. For, in the same manner *as the blind, so* men also, when they were seeking after God, stumbled upon stones and blocks of wood; and such of them as were rich stumbled upon gold and silver, and were prevented by their stumblings from *finding* that which they were seeking after. But, now that a voice has been heard through all the earth,[^3553] *declaring* that there is a God of truth, and there has been given to every man an eye wherewith to see, those persons are without excuse who are ashamed of *incurring the censure of* their former companions in error, and yet desire to walk in the right way. For those who are ashamed to be saved must of necessity perish. I therefore counsel them to open their eyes and see: for, lo! light is given abundantly[^3554] to us all to see thereby; and if, when light has arisen upon us, any one close his eyes so as not to see, into the ditch he must go.[^3555] But why is a man ashamed of *the censure of* those who have been in error along with himself? Rather does it behove him to persuade them to follow in his steps; and, if they should not be persuaded by him, *then* to disengage himself from their society. For there are some men who are unable to rise from their mother earth, and therefore also do they make them gods from the earth their mother; and they are condemned by the judgments of truth, forasmuch as they apply the name *of Him* who is unchangeable to those objects which are subject to change, and shrink not from calling those things gods which have been made by the hands of man, and dare to make an image of God whom they have not seen." },
  { t = "note", id = "3553", text = "Comp. Rom. x. 18." },
  { t = "note", id = "3554", text = "Cureton: “light without envy.” But the expression resembles the Gk. ἀφθόνως, ungrudgingly, without stint." },
  { t = "note", id = "3555", text = "Lit. “to the ditch is his way.” Comp. Matt. xv. 14." },
  { t = "p", text = "“But I *have to* remark further, that the Sibyl[^3556] also has said concerning them that it is the images of deceased kings that they worship. And this is easy to understand: for, lo! even now they worship and honour the images of those of Cæsarean rank[^3557] more than their former *gods*; for from those their former gods both *pecuniary* tribute and produce accrue to Cæsar, as to one who is greater than they. On this account, those who despise them, and *so* cause Cæsar’s revenue to fall short, are put to death. But to the treasury of other kings also it is appointed how much the worshippers in various places shall pay, and how many vesselfuls[^3558] of water from the sea they shall supply. Such is the wickedness of the world—of those who worship and fear that which has no sensation. Many of them, too, who are crafty, either for the sake of gain, or for vainglory, or for dominion over the multitude, both themselves worship, and incite those who are destitute of understanding to worship, that which has no sensation." },
  { t = "note", id = "3556", text = "See vol. i. p. 280, this series, where the following lines are quoted by Justin Martyr from the *Sibylline Oracles*:— “But we have strayed from the Immortal’s ways, And worship with a dull and senseless mind Idols, the workmanship of our own hands, And images and figures of dead men.”" },
  { t = "note", id = "3557", text = "Cureton: “those belonging to the Cæsars.” But the Cæsars themselves are clearly meant." },
  { t = "note", id = "3558", text = "Cureton: “sacks full.” The first word is used of a leathern pouch or wallet, as in Luke x. 4 (Peshito) for πήρα." },
  { t = "p", text = "“I will further write and show, as far as my ability goes, how and for what causes images were made to kings and tyrants, and *how* they came to be regarded[^3559] as gods. The people of Argos made images to Hercules, because he belonged to their city, and was strong, and by his valour slew noxious beasts, and more especially because they were afraid of him. For he was subject to no control, and carried off the wives of many: for his lust was great, like that of Zuradi the Persian, his friend. Again, the people of Acte worshipped Dionysus,[^3560] a king, because he had recently[^3561] planted the vine in their country. The Egyptians worshipped Joseph the Hebrew, who was called Serapis, because he supplied them with corn during the years of famine. The Athenians worshipped Athene, the daughter of Zeus, king of the island of Crete, because she built the town of Athens, and made Ericthippus her son king there, whom she had by adultery with Hephæstus, a blacksmith, son of a wife of her father. She was, too, always courting the society of Hercules, because he was her brother on her father’s side. For Zeus the king became enamoured of Alcmene, the wife of Electryon, who was from Argos, and committed adultery with her, and she gave birth to Hercules. The people of Phœnicia worshipped Balthi,[^3562] queen of Cyprus, because she fell in love with Tamuz, son of Cuthar king of the Phœnicians, and left her own kingdom and came and dwelt in Gebal, a fortress of the Phœnicians, and at the same time made all the Cyprians subject to King Cuthar. Also, before Tamuz she had fallen in love with Ares, and committed adultery with him; and Hephæstus, her husband, caught her, and his jealousy was roused against her, and he came and killed Tamuz in Mount Lebanon, as he was hunting[^3563] wild boars; and from that time Balthi remained in Gebal, and she died in the city of Aphiki,[^3564] where Tamuz was buried. The Elamites worshipped Nuh, daughter of the king of Elam: when the enemy had carried her captive, her father made for her an image and a temple in Shushan, a royal residence which is in Elam. The Syrians worshipped Athi, a Hadibite, who sent the daughter of Belat, a person skilled in medicine, and she healed Simi, the daughter of Hadad king of Syria; and some time afterwards, when Hadad himself had the leprosy upon him, Athi entreated Elisha the Hebrew, and he came and healed him of his leprosy. The people of Mesopotamia also worshipped Cuthbi, a Hebrew woman, because she delivered Bakru, the paternal *king*[^3565] of Edessa, from his enemies. With respect to Nebo, who is *worshipped* in Mabug, why should I write to you? For, lo! all the priests who are in Mabug know that it is the image of Orpheus, a Thracian Magus. Hadran, again, is the image of Zaradusht, a Persian Magus. For both of these Magi practised magic at a well which was in a wood in Mabug, in which was an unclean spirit, and it assaulted and disputed the passage of every one who passed by in all that country in which the town of Mabug is situated; and these Magi, in accordance with what was a mystery in their Magian system, bade Simi, the daughter of Hadad, to draw water from the sea and pour it into the well, so that the spirit should not come up and commit assault. In like manner, the rest of mankind made images to their kings and worshipped them; of which matter I will not write further." },
  { t = "note", id = "3559", text = "Lit., “they became.”" },
  { t = "note", id = "3560", text = "Cureton, without necessity, reads the word “Dionysius.”" },
  { t = "note", id = "3561", text = "Cureton renders “originally.” But comp. Judith iv. 3, where the same word answers to προσφάτως." },
  { t = "note", id = "3562", text = "Venus." },
  { t = "note", id = "3563", text = "Cureton’s conjecture of *** or *** for *** has been adopted." },
  { t = "note", id = "3564", text = "Some have identified it with Aphek, Josh. xix. 30. The rites observed here were specially abominable." },
  { t = "note", id = "3565", text = "Cureton: “the patrician.” Dr. Payne Smith, *Thes. Syr. s.v*., regards the word as equivalent to πατὴρ τῆς πόλεως, *pater civitatis*, “a title of honour found in the Byzantine writers,” and is inclined to think it a term belonging to the dialect of Edessa. A similar use of the same adjective is quoted from Buxtorf, *Lex. Chald. Talm*., p. 12: “אַבַּיי cognomen R. Nachmanis, qui a celebritate familiæ sic cognominatus est, quasi *Patritius*.” This view appears to be supported by the similar use of an adjective for a substantive above: “*persons* of Cæsarean rank,” or “Cæsars.”" },
  { t = "p", text = "“But thou, a *person of* liberal mind, and familiar with the truth, if thou wilt *properly* consider these matters, commune with thine own self;[^3566] and, though they should clothe thee in the garb of a woman, remember that thou art a man. Believe in Him who is in reality God, and to Him lay open thy mind, and to Him commit thy soul, and He is able to give thee immortal life for ever, for everything is possible to Him;[^3567] and let all other things be esteemed by thee just as they are—images as images, and sculptures as sculptures; and let not that which is only made be put by thee in the place of Him who is not made, but let Him, the ever-living God, be constantly present to thy mind.[^3568] For thy mind itself is His likeness: for it too is invisible and impalpable,[^3569] and not to be represented by any form, yet by its will is the whole bodily frame moved. Know, therefore, that, if thou constantly serve Him who is immoveable, even He exists for ever, so thou also, when thou shalt have put off this *body*, which is visible and corruptible, shall stand before Him for ever, endowed with life and knowledge, and thy works shall be to thee wealth inexhaustible and possessions unfailing. And know that the chief of thy good works is this: that thou know God, and serve Him. Know, too, that He asketh not anything of thee: He needeth not anything." },
  { t = "note", id = "3566", text = "Lit., “be (or, get to be) with thyself.” Cureton: “enter into thyself.” The meaning appears to be, “think for thyself.”" },
  { t = "note", id = "3567", text = "Cureton: “Everything cometh through His hands.” It should rather be, “*into* His hands,” i.e., “He has power to do everything.” See note 7, p. 725." },
  { t = "note", id = "3568", text = "Lit., “be running in thy mind.”" },
  { t = "note", id = "3569", text = "The text has ***, which M. Renan derives from the root *** and translates “*commovetur*.” This, although correct in grammar, does not suit the sense. The grammars recognise the form as a possible Eshtaphel of ***, “*tangere*,” but it is not found in actual use. Dr. Payne Smith thinks the right reading to be ***, which gives the required sense." },
  { t = "p", text = "“Who is this God? He who is Himself truth, and His word truth. And what is truth? That which is not fashioned, nor made, nor represented by art: that is, which has never been brought into existence, and is *on that account* called truth.[^3570] If, therefore, a man worship that which is made with hands, it is not the truth that he worships, nor yet the word of truth." },
  { t = "note", id = "3570", text = "Or, “that which is fixed and invariable.” There seems to be a reference to the derivation of *** (truth) from ***, *firmus* (*stabilis*) *fuit*. Cureton has strangely mistranslated ***, by “that which, without having been brought into existence, does exist.” The first *** is nothing but the sign of emphatic denial which is frequently appended to ***, and *** is the infinitive of emphasis belonging to the second ***." },
  { t = "p", text = "“I have very much to say on this subject; but I feel ashamed for those who do not understand that they are superior to the work of their own hands, nor perceive how they give gold to the artists that they may make for them gods, and give them silver for their adornment and honour, and move their riches about from place to place, and *then* worship them. And what infamy can be greater than this, that a man should worship his riches, and forsake Him who bestowed those riches upon him? and that he should revile man, yet worship the image of man; and slay a beast, yet worship the likeness of a beast? This also is evident, that it is the workmanship of their fellowmen that they worship: for they do not worship the treasures[^3571] while they are laid by in the bag, but when the artists have fashioned images out of them they worship them; neither do they worship the gold or the silver considered as property,[^3572] but when the gravers have sculptured them then they worship them. Senseless man! what addition has been made to thy gold, that now thou worshippest it? If it is because it has been made to resemble a winged animal, why dost thou not worship the winged animal *itself?* And if because it has been made like a beast of prey, lo! the beast of prey itself is before thee. And if it is the workmanship itself that pleases thee, let the workmanship of God please thee, who made all things, and in His own likeness made the workmen, who strive to do like Him, but resemble Him not." },
  { t = "note", id = "3571", text = "Cureton: “materials.” The printed text has *** “drugs.” The correct reading, there can hardly be a doubt, is ***." },
  { t = "note", id = "3572", text = "Lit., “the property of the gold or silver,” if the word *** is rightly taken. Although no such derivative of *** is found in the lexicons, the form is possible from the Palel of that verb: e.g. *** from ***. See Hoffmann, *Gram. Syr*., sec. 87, 19." },
  { t = "p", text = "“But perhaps thou wilt say: How is it that God did not so make me that I should serve Him, and not images? In speaking thus, thou art seeking to become an idle instrument, and not a living man. For God made thee as perfect as it seemed good to Him. He has given thee a mind endowed with freedom; He has set before thee objects in great number, that thou on thy part mayest distinguish *the nature of* each thing and choose for thyself that which is good; He has set before thee the heavens, and placed in them the stars; He has set before thee the sun and the moon, and they too every day run their course therein; He has set before thee the multitude of waters, and restrained them by His word; He has set before thee the wide earth, which remains at rest, and continues before thee without variation:[^3573] yet, lest thou shouldst suppose that of its own nature it *so* continues, He makes it also to quake when He pleaseth; He has set before thee the clouds, which by *His* command bring water from above and satisfy the earth—that from hence thou mayest understand that He who puts these things in motion is superior to them all, and mayest accept *thankfully* the goodness of Him who has given thee a mind whereby to distinguish these things from one another." },
  { t = "note", id = "3573", text = "Lit. “in one fashion.”" },
  { t = "p", text = "“Wherefore I counsel thee to know thyself, and to know God. For understand how that there is within thee that which is called the soul—by it the eye seeth, by it the ear heareth, by it the mouth speaketh; and how it makes use of the whole body; and *how*, whenever He pleaseth to remove the soul from the body, this falleth *to decay* and perisheth. From this, therefore, which exists within thyself and is invisible, understand how God also moveth the whole by His power, like the body; *and* that, whenever it pleases Him to withdraw His power, the whole world also, like the body, will fall *to decay* and perish." },
  { t = "p", text = "“But why this world was made, and why it passes away, and why the body exists, and why it falls *to decay*, and why it continues, thou canst not know until thou hast raised thy head from this sleep in which thou art sunk, and hast opened thine eyes and seen that God is One, the Lord of all, and hast come to serve Him with all thy heart. Then will He grant thee to know His will: for every one that is severed from the knowledge of the living God is dead and buried *even while* in his body. Therefore *is it that* thou dost wallow on the ground before demons and shadows, and askest vain petitions from that which has not anything to give. But thou, stand thou up from among those who are lying on the earth and caressing stones, and giving their substance as food for the fire, and offering their raiment to idols, and, while *themselves* possessed of senses, are bent on serving that which has no sensation; and offer thou for thy imperishable soul petitions *for that* which decayeth not, to God who suffers no decay—and thy freedom will be at once apparent; and be thou careful of it,[^3574] and give thanks to God who made thee, and gave thee the mind of the free, that thou mightest shape thy conduct even as thou wilt. He hath set before thee all these things, and showeth thee that, if thou follow after evil, thou shalt be condemned for thy evil deeds; but that, if after goodness, thou shalt receive from Him abundant good,[^3575] together with immortal life for ever." },
  { t = "note", id = "3574", text = "Or, “of what pertains to it.”" },
  { t = "note", id = "3575", text = "Lit. “many good things.”" },
  { t = "p", text = "“There is, therefore, nothing to hinder thee from changing thy evil manner of life, because thou art a free man; or from seeking and finding out who is the Lord of all; or from serving Him with all thy heart: because with Him there is no reluctance to give the knowledge of Himself to those that seek it, according to the measure of their capacity to know Him." },
  { t = "p", text = "“Let it be thy first care not to deceive thyself. For, if thou sayest of that which is not God: This is God, thou deceivest thyself, and sinnest before the God of truth. Thou fool! is that God which is *bought and* sold? Is that God which is in want? Is that God which must be watched over? How buyest thou him as a slave, and servest him as a master? How askest thou of him, as of one that is rich, to give to thee, and thyself givest to him as to one that is poor? How dost thou expect of him that he will make thee victorious in battle? for, lo! when thy enemies have conquered thee, they strip him likewise." },
  { t = "p", text = "“Perhaps one who is a king may say: I cannot behave myself aright, because I am a king; it becomes me to do the will of the many. He who speaks thus really deserves to be laughed at: for why should not the king himself lead the way[^3576] to all good things, and persuade the people under his rule to behave with purity, and to know God in truth, and in his own person set before them the patterns of all things excellent—since thus it becomes him to do? For it is a shameful thing that a king, however badly he may conduct himself, should *yet* judge and condemn those who do amiss." },
  { t = "note", id = "3576", text = "Lit. “be the beginner.”" },
  { t = "p", text = "“My opinion is this: that in ‘this’ way a kingdom may be governed in peace—when the sovereign is acquainted with the God of truth, and is withheld by fear of Him from doing wrong[^3577] to those who are his subjects, and judges everything with equity, as one who knows that he himself also will be judged before God; while, at the same time, those who are under his rule[^3578] are withheld by the fear of God from doing wrong to their sovereign, and are restrained by *the same* fear from doing wrong to one another. By this knowledge of God and fear of Him all evil may be removed from the realm. For, if the sovereign abstain from doing wrong to those who are under his rule, and they abstain from doing wrong to him and to each other, it is evident that the whole country will dwell in peace. Many blessings, too, will be *enjoyed* there, because amongst them all the name of God will be glorified. For what blessing is greater than this, that a sovereign should deliver the people that are under his rule from error, and by this good deed render himself pleasing to God? For from error arise all those evils *from which kingdoms suffer;* but the greatest of all errors is this: when a man is ignorant of God, and in God’s stead worships that which is not God." },
  { t = "note", id = "3577", text = "Cureton is probably right in so taking the words, although the construction is not quite the same as in the similar sentence a little below. If so, for *** we must read ***." },
  { t = "note", id = "3578", text = "Lit. “hand.”" },
  { t = "p", text = "“There are, however, persons who say: It is for the honour of God that we make the image: in order, that is, that we may worship the God who is concealed from our view. But they are unaware that God is in every country, and in every place, and is never absent, and that there is not anything done and He knoweth it not. Yet thou, despicable man! within whom He is, and without whom He is, and above whom He is, hast nevertheless gone and bought thee wood from the carpenter’s, and it is carved and made into an image insulting to God.[^3579] To this thou offerest sacrifice, and knowest not that the all-seeing eye seeth thee, and that the word of truth reproves thee, and says to thee: How can the unseen God be sculptured? Nay, it is the likeness of thyself that thou makest and worshippest. Because the wood has been sculptured, hast thou not the insight to perceive that it is *still* wood, or *that the stone* is *still* stone? The gold also the workman[^3580] taketh according to its weight in the balance. And when thou hast had it made[^3581] *into an image*, why dost thou weigh it? Therefore thou art a lover of gold, and not a lover of God. And art thou not ashamed, perchance it be deficient, to demand of the maker of it why he has stolen some of it? Though thou hast eyes, dose thou not see? And though thou hast intelligence,[^3582] dose thou not understand? Why dost thou wallow on the ground, and offer supplication to things which are without sense? Fear Him who shaketh the earth, and maketh the heavens to revolve, and smiteth the sea, and removeth the mountain from its place—Him who can make Himself like a fire, and consume all things; and, if thou be not able to clear thyself of guilt, yet add not to thy sins; and, if thou be not able to know God, yet doubt not[^3583] that He exists." },
  { t = "note", id = "3579", text = "Lit. “into an insult of God.” So M. Renan, “in opprobrium Dei.” Cureton, admitting that this may be the sense, renders, “an abomination of God,” and refers to the circumstance that in Scripture an idol is frequently so spoken of. But *** is not used in such passages (it is either ***, or, less frequently, ***), nor does it appear ever to have the meaning which Cureton assigns to it." },
  { t = "note", id = "3580", text = "Lit. “he.”" },
  { t = "note", id = "3581", text = "Lit. “hast made it.”" },
  { t = "note", id = "3582", text = "Lit. “heart.”" },
  { t = "note", id = "3583", text = "Lit. “be of opinion.”" },
  { t = "p", text = "“Again, there are persons who say: Whatsoever our fathers have bequeathed to us, *that* we reverence. Therefore, of course, it is, that those whose fathers have bequeathed them poverty strive to become rich! and those whose fathers did not instruct them, desire to be instructed, and to learn that which their fathers knew not! And why, forsooth, do the children of the blind see, and the children of the lame walk? Nay, it is not well for a man to follow *his* predecessors, *if they be* those whose course was evil; but *rather* that we should turn from that path of theirs, lest that which befell *our* predecessors should bring disaster upon us also. Wherefore, inquire whether thy father’s course was good: and, *if so*, do thou also follow in his steps; but, if thy father’s course was very evil, let thine be good, and so let it be with thy children after thee.[^3584] Be grieved also for thy father because his course is evil, so long as thy grief may avail to help him. But, as for thy children, speak to them thus: There is a God, the Father of all, who never came into being, neither was ever made, and by whose will all things subsist. He also made the luminaries, that His works may see one another; and He conceals Himself in His power from all His works: for it is not permitted to any being subject to change to see Him who changes not. But such as are mindful *of His words*, and are admitted into that covenant which is unchangeable, ‘they’ see God—so far as it is possible for them to see Him. These also will have power to escape destruction, when the flood of fire comes upon all the world. For there was once a flood and a wind,[^3585] and the great[^3586] men were swept away by a violent blast from the north, but the just were left, for a demonstration of the truth. Again, at another time there was a flood of water, and all men and animals perished in the multitude of waters, but the just were preserved in an ark of wood by the command of God. So also will it be at the last time: there shall be a flood of fire, and the earth shall be burnt up, together with its mountains; and mankind shall be burnt up, along with the idols which they have made, and the carved images which they have worshipped; and the sea shall be burnt up, together with its islands; but the just shall be preserved from wrath, like as *were* their fellows of the ark from the waters of the deluge. And then shall those who have not known God, and those who have made them idols, bemoan themselves, when they shall see those idols of theirs being burnt up, together with themselves, and nothing shall be found to help them." },
  { t = "note", id = "3584", text = "This seems preferable to Cureton’s, “and let thy children also follow after thee.” Had this been the meaning, probably the verb *** would have been used, as in the preceding sentence, not ***." },
  { t = "note", id = "3585", text = "So the Sibylline oracle, as quoted by Cureton in the Greek:— “And, when he would the starry steep of heaven Ascend, the Sire Immortal did his works With mighty blasts assail: forthwith the winds Hurled prostrate from its height the towering pile, And bitter strife among the builders roused.”" },
  { t = "note", id = "3586", text = "Lit. “chosen.” The same expression, except that the similar *** is used for ***, occurs Sap. Sol. xiv. 6, as a translation of ὑπερηφάνων γιγάντων, *gigantes superbi*. See *Thes. Syr*., *s.v*. ***." },
  { t = "p", text = "“When thou, Antoninus[^3587] Cæsar, shall become acquainted with these things, and thy children also with thee, *then* wilt thou bequeath to them an inheritance for ever which fadeth not away, and thou wilt deliver thy soul, and the souls of thy children also, from that which shall come upon the whole earth in the judgment of truth *and* of righteousness. For, according as thou hast acknowledged Him here, *so* will He acknowledge thee there; and, if thou account Him here superfluous, He will not account thee one of those who have known Him and confessed Him." },
  { t = "note", id = "3587", text = "The ms. has “Antonius.”" },
  { t = "p", text = "“These *may* suffice thy Majesty; and, if they be *too* many, yet deign to accept them.”[^3588]" },
  { t = "note", id = "3588", text = "Cureton, for the last clause, gives “as thou wilt,” remarking that the sense is obscure. The literal rendering is, “if thou wilt,” the consequent clause being unexpressed. “If you please, accept them,” seems what is meant." },
  { t = "p", text = "*Here* endeth Melito." },
]

[[section]]
id = "part-2"
title = "Part II. From the Discourse on Soul and Body."
level = 1
blocks = [
  { t = "p", text = "From the Discourse on Soul and Body.[^3589]" },
  { t = "note", id = "3589", text = "By Melito, bishop of Sardis." },
  { t = "p", text = "For this reason did the Father send His Son from heaven without a bodily form, that, when He should put on a body by means of the Virgin’s womb, and be born man, He might save man, and gather together those members of His which death had scattered when he divided man." },
  { t = "p", text = "*And further on:*—The earth shook, and its foundations trembled; the sun fled away, and the elements turned back, and the day was changed *into night:* for they could not endure *the sight of* their Lord hanging on a tree. The *whole* creation was amazed, marvelling and saying, “What new mystery, then, is this? The Judge is judged, and holds his peace; the Invisible One is seen, and is not ashamed; the Incomprehensible is laid hold upon, and is not indignant; the Illimitable is circumscribed, and doth not resist; the Impossible suffereth, and doth not avenge; the Immortal dieth, and answereth not a word; the Celestial is laid in the grave, and endureth! What new mystery is this?” The *whole* creation, *I say*, was astonished; but, when our Lord arose from the place of the dead, and trampled death under foot, and bound the strong one, and set man free, then did the whole creation see clearly that for man’s sake the Judge was condemned, and the Invisible was seen, and the Illimitable was circumscribed, and the Impassible suffered, and the Immortal died, and the Celestial was laid in the gave. For our Lord, when He was born man, was condemned in order that He might show mercy, was bound in order that He might loose, was seized in order that He might release, suffered in order that He might feel compassion,[^3590] died in order that He might give life, was laid in the grave that He might raise *from the dead*.[^3591]" },
  { t = "note", id = "3590", text = "*** seems to be the true reading, not the *** of the printed ms." },
  { t = "note", id = "3591", text = "[Such passages sustain the testimony of Jerome and others, that this venerable and learned Father was an eloquent preacher.]" },
]

[[section]]
id = "part-3"
title = "Part III. From the Discourse on the Cross."
level = 1
blocks = [
  { t = "p", text = "From the Discourse on the Cross.[^3592]" },
  { t = "note", id = "3592", text = "By the same." },
  { t = "p", text = "On these accounts He came to us; on these accounts, though He was incorporeal, He formed for Himself a body after our fashion,[^3593]—appearing as a sheep, yet still remaining the Shepherd; being esteemed a servant, yet not renouncing the Sonship; being carried *in the womb* of Mary, yet arrayed in *the nature of* His Father; treading upon the earth, yet filling heaven; appearing as an infant, yet not discarding the eternity of His nature; being invested with a body, yet not circumscribing the unmixed simplicity of His Godhead; being esteemed poor, yet not divested of His riches; needing sustenance inasmuch as He was man, yet not ceasing to feed the entire world inasmuch as He is God; putting on the likeness of a servant, yet not impairing[^3594] the likeness of His Father. He sustained every character[^3595] *belonging to Him* in an immutable nature: He was standing before Pilate, and *at the same time* was sitting with His Father; He was nailed upon the tree, and *yet* was the Lord of all things." },
  { t = "note", id = "3593", text = "Or “wove—a body from our material.”" },
  { t = "note", id = "3594", text = "Lit. “changing.”" },
  { t = "note", id = "3595", text = "Lit. “He was everything.”" },
]

[[section]]
id = "part-4"
title = "Part IV. On Faith."
level = 1
blocks = [
  { t = "p", text = "On Faith.[^3596]" },
  { t = "note", id = "3596", text = "Of Melito the bishop." },
  { t = "p", text = "We have collected together *extracts* from the Law and the Prophets relating to those things which have been declared concerning our Lord Jesus Christ, that we may prove to your love that this *Being* is perfect reason, the Word of God; He who was begotten before the light; He who is Creator together with the Father; He who is the Fashioner of man; He who is all in all; He who among the patriarchs is Patriarch; He who in the law is the Law; among the priests, Chief Priest; among kings, the Ruler; among prophets, the Prophet; among the angels, Archangel; in the voice *of the preacher*, the Word; among spirits, the Spirit; in the Father, the Son; in God, God; King for ever and ever. For this is He who was pilot to Noah; He who was guide to Abraham; He who was bound with Isaac; He who was in exile with Jacob; He who was sold with Joseph; He who was captain of the host with Moses; He who was the divider of the inheritance with Jesus the son of Nun; He who in David and the prophets announced His own sufferings; He who put on a bodily form in the Virgin; He who was born in Bethlehem; He who was wrapped in swaddling-clothes in the manger; He who was seen by the shepherds; He who was glorified by the angels; He who was worshipped by the Magi; He who was pointed out by John; He who gathered together the apostles; He who preached the kingdom; He who cured the lame; He who gave light to the blind; He who raised the dead; He who appeared in the temple; He who was not believed on by the people; He who was betrayed by Judas; He who was apprehended by the priests; He who was condemned by Pilate; He who was pierced in the flesh; He who was hanged on the tree; He who was buried in the earth; He who rose from the place of the dead; He who appeared to the apostles; He who was carried up to heaven; He who is seated at the right hand of the Father; He who is the repose of those that are departed; the recoverer of those that are lost; the light of those that are in darkness; the deliverer of those that are captive; the guide of those that go astray; the asylum of the afflicted; the bridegroom of the Church; the charioteer of the cherubim; the captain of the angels; God who is from God; the Son who is from the Father; Jesus Christ the King for evermore. Amen." },
]

[[section]]
id = "part-5"
title = "Part V."
level = 1
blocks = [
  { t = "p", text = "[^3597] This is He who took a bodily form in the Virgin, and was hanged upon the tree, and was buried within the earth, and suffered not dissolution; He who rose from the place of the dead, and raised up men from the earth—from the grave below to the height of heaven. This is the Lamb that was slain; this is the Lamb that opened not His mouth.[^3598] This is He who was born of Mary, fair sheep *of the fold*. This is He that was taken from the flock, and was led to the slaughter, and was slain in the evening, and was buried at night; He who had no bone of Him broken on the tree; He who suffered not dissolution within the earth; He who rose from the place of the dead, and raised up the race of Adam from the grave below, This is He who was put to death. And where was He put to death? In the midst of Jerusalem. By whom? By Israel: because He cured their lame, and cleansed their lepers, and gave light to their blind, and raised their dead! This was the cause of His death. Thou, *O Israel*, wast giving commands, and He was being crucified; thou wast rejoicing, and He was being buried; thou wast reclining on a soft couch, and He was watching in the grave and the shroud.[^3599] O Israel, transgressor of the law, why hast thou committed this new iniquity, subjecting the Lord to new sufferings—thine own Lord, Him who fashioned thee, Him who made thee, Him who honoured thee, who called thee Israel? But thou hast not been found to be Israel: for thou hast not seen God, nor understood the Lord. Thou hast not known, O Israel, that this was the first-born of God, who was begotten before the sun, who made the light to shine forth, who lighted up the day, who separated the darkness, who fixed the first foundations, who poised the earth, who collected the ocean, who stretched out the firmament, who adorned the world. Bitter *were* thy nails, and sharp; bitter thy tongue, which thou didst whet; bitter *was* Judas, to whom thou gavest hire; bitter thy false witnesses, whom thou stirredst up; bitter thy gall, which thou preparedst; bitter thy vinegar, which thou madest; bitter thy hands, filled with blood. Thou slewest thy Lord, and He was lifted up upon the tree; and an inscription was fixed *above*, to show who He was that was slain. And who was this? (that which we shall not say is *too* shocking *to hear*, and that which we shall say is very dreadful: nevertheless hearken, and tremble.) *It was* He because of whom the earth quaked. He that hung up the earth *in space* was *Himself* hanged up; He that fixed the heavens was fixed *with nails;* He that bore up the earth was borne up on a tree; the Lord *of all* was subjected to ignominy in a naked body—God put to death! the King of Israel slain with Israel’s right hand! Alas for the new wickedness of the new murder! The Lord was exposed with naked body: He was not deemed worthy even of covering; and, in order that He might not be seen, the luminaries turned away, and the day became darkened[^3600] because they slew God, who hung naked on the tree. It was not the body of our Lord that the luminaries covered with darkness when they set,[^3601] but the eyes of men. For, because the people quaked not, the earth quaked; because they were not affrighted, the earth was affrighted. Thou smotest thy Lord: thou also hast been smitten upon the earth. And thou indeed liest dead; but He is risen from the place of the dead, and ascended to the height of heaven, having suffered for the sake of those who suffer, and having been bound for the sake of Adam’s race which was imprisoned, and having been judged for the sake of him who was condemned, and having been buried for the sake of him who was buried." },
  { t = "note", id = "3597", text = "By Melito, bishop of Attica. [Of this epigraph, which becomes Ittica below, I have never seen a sufficient explanation.]" },
  { t = "note", id = "3598", text = "Lit. “the Lamb without voice.”" },
  { t = "note", id = "3599", text = "The Greek γλωσσόκομον." },
  { t = "note", id = "3600", text = "[For Phlegon’s testimony, see references, vol. vii. p. 257. But note Lightfoot, *Ap. F*., part ii. vol. i. p. 512; his remark on Origen, *Celsus*, vol. iv. p. 437, this series.]" },
  { t = "note", id = "3601", text = "This is the rendering of ***; but Cureton has “fled,” as though he read ***." },
  { t = "p", text = "*And further on:*—This is He who made the heaven and the earth, and in the beginning, together with the Father, fashioned man; who was announced by means of the law and the prophets; who put on a bodily form in the Virgin; who was hanged upon the tree; who was buried in the earth; who rose from the place of the dead, and ascended to the height of heaven, and sitteth on the right hand of the Father." },
]

[[section]]
id = "part-6"
title = "Part VI."
level = 1
blocks = [
  { t = "p", text = "VI.[^3602]" },
  { t = "note", id = "3602", text = "By the holy Melito, bishop of the city of Ittica. [For Melito, in Lightfoot’s *Apost. Fathers*, consult part ii. vol. i. pp. 133, 328, 428, 443–446, 468–469, 494. See Lardner, *Credib*., vol. ii. 157, etc.; Westcott, *Canon*, p. 246. See Polycrates, *infra*; on which consult Schaff, *History*, etc., vol. ii. p. 736. Above all, see Routh, *R. S*., tom. i. pp. 113–153.]" },
  { t = "p", text = "He that bore up the earth was borne up on a tree. The Lord was subjected to ignominy with naked body—God put to death, the King of Israel slain!" },
]

[[section]]
id = "fragment-1"
title = "Fragment I. From the Work on the Passover."
level = 1
blocks = [
  { t = "h", text = "Fragments.[^3603]" },
  { t = "note", id = "3603", text = "The following Fragments of Melito are translated from the Greek, except No. IX., which is taken from the Latin." },
  { t = "h", text = "I." },
  { t = "p", text = "From the Work on the Passover.[^3604]" },
  { t = "note", id = "3604", text = "In Eusebius, *Hist. Eccl*., iv. 26. [Melito wrote two books on the Paschal and one *On the Lord’s Day* (ὁ περὶ κυριακῆς λόγος), according to Eusebius. But is this *On the Lord’s Day* other than one of the books on the Paschal? It may be doubted. Routh refers us to Barnabas. See vol. i. cap. 15, note 7, p. 147, this series. See also Dionysius of Corinth, *infra*.]" },
  { t = "p", text = "When Servilius Paulus was proconsul of Asia, at the time that Sagaris[^3605] suffered martyrdom, there arose a great controversy at Laodicea concerning *the time of the celebration of* the Passover, which on that occasion had happened to fall at the proper season;[^3606] and this *treatise* was *then* written.[^3607]" },
  { t = "note", id = "3605", text = "He was bishop of Laodicea, and suffered martyrdom during the persecution under M. Aurelius Antonius.—Migne." },
  { t = "note", id = "3606", text = "The churches of Asia Minor kept Easter on the fourteenth day from the new moon, whatever day of the week that might be; and hence were called *Quartodecimans*. Other churches, chiefly those of the West, kept it on the Sunday following the day of the Jewish passover. In the case here referred to, the 14th of the month occurred on the Sunday in question." },
  { t = "note", id = "3607", text = "Migne, not so naturally, punctuates otherwise, and renders, “which had happened *then* to fall at the proper season, and on that occasion this *treatise* was written.”" },
]

[[section]]
id = "fragment-2"
title = "Fragment II. From the Apology Addressed to Marcus Aurelius Antoninus."
level = 1
blocks = [
  { t = "p", text = "From the Apology Addressed to Marcus Aurelius Antoninus.[^3608]" },
  { t = "note", id = "3608", text = "In Eusebius, *Hist. Eccl*., *l. c*." },
  { t = "p", text = "For the race of the pious is now persecuted in a way contrary to all precedent, being harassed by a new kind of edicts[^3609] everywhere in Asia. For unblushing informers, and such as are greedy of other men’s goods, taking occasion from the orders *issued*, carry on their robbery without any disguise, plundering of their property night and day those who are guilty of no wrong." },
  { t = "note", id = "3609", text = "Migne thinks that by these are meant the orders given by magistrates of cities on their own authority, in distinction from those which issued from emperors or governors of provinces." },
  { t = "p", text = "If these proceedings take place at thy bidding,[^3610] well and good.[^3611] For a just sovereign will never take unjust measures; and we, on our part, gladly accept the honour of such a death. This request only we present to thee, that thou wouldst first of all examine for thyself into the behaviour of these *reputed* agents of so much strife, and then come to a just decision as to whether they merit death and punishment, or deserve to live in safety and quiet. But if, on the contrary, it shall turn out that this measure, and this new sort of command, which it would be unbecoming to employ even against barbarian foemen, do not proceed from thee, then all the more do we entreat thee not to leave us thus exposed to the spoliation of the populace." },
  { t = "note", id = "3610", text = "The reference must be to private letters: for in any of the leading cities of Asia a mandate of the emperor would have been made public before the proconsul proceeded to execute it.—Migne." },
  { t = "note", id = "3611", text = "῎Εστω καλῶς γενόμενον seems to be here used in the sense of καλῶς alone. The correctness of Migne’s translation, *recte atque ordine facta sunto*, is open to doubt." },
  { t = "p", text = "For the philosophy current with us flourished in the first instance among barbarians;[^3612] and, when it afterwards sprang up among the nations under thy rule, during the distinguished reign of thy ancestor Augustus, it proved to be a blessing of most happy omen to thy empire. For from that time the Roman power has risen to greatness and splendour. To this power thou hast succeeded as the much desired[^3613] possessor; and such shalt thou continue, together with thy son,[^3614] if thou protect that philosophy which has grown up with thy empire, and which took its rise with Augustus; to which also thy *more recent* ancestors paid honour, along with the other religions *prevailing in the empire*. A very strong proof, moreover, that it was for good that the system we profess came to prevail at the same time that the empire of such happy commencement was established, is this—that ever since the reign of Augustus nothing untoward has happened; but, on the contrary, everything has contributed to the splendour and renown *of the empire*, in accordance with the devout wishes[^3615] of all. Nero and Domitian alone of all *the emperors*, imposed upon by certain calumniators, have cared to bring any impeachment against our doctrines. They, too, are the source from which it has happened that the lying slanders on those who profess them have, in consequence of the senseless habit which prevails *of taking things on hear*say, flowed down to our own times.[^3616] But the course which they in their ignorance pursued was set aside by thy pious progenitors, who frequently and in many instances rebuked by their rescripts[^3617] those who dared to set on foot any hostilities against them. It appears, for example, that thy grandfather Adrian wrote, among others, to Fundanus, the proconsul then in charge of the government of Asia. Thy father, too, when thou thyself wast associated with him[^3618] in the administration of the empire, wrote to the cities, forbidding them to take any measures adverse to us: among the rest to the people of Larissa, and of Thessalonica, and of Athens, and, *in short*, to all the Greeks. And as regards thyself, seeing that thy sentiments respecting the Christians[^3619] are not only the same as theirs, but even much more generous and wise, we are the more persuaded that thou wilt do all that we ask of thee." },
  { t = "note", id = "3612", text = "The Jews. Porphyry calls the doctrines of the Christians βάρβαρον τόλμημα. See Euseb., *Hist. Eccl*., vi. 19.—Migne." },
  { t = "note", id = "3613", text = "Εὐκταῖος." },
  { t = "note", id = "3614", text = "Commodus, who hence appears to have been not yet associated with his father in the empire.—Migne." },
  { t = "note", id = "3615", text = "Εὐχάς." },
  { t = "note", id = "3616", text = "’Αφ᾽ ὧν καὶ τὸ τῆς συκοφαντίας ἀλόγῳ συνηθείᾳ περὶ τοῦς τοιούτους ῥυῆναι συμβέβηκε ψεῦδος." },
  { t = "note", id = "3617", text = "᾽Εγγράφως." },
  { t = "note", id = "3618", text = "The reading of Valesius, σοῦ τὰ πάντα συνδιοικοῦντος αὐτῷ, is here adopted." },
  { t = "note", id = "3619", text = "Περὶ τούτων." },
]

[[section]]
id = "fragment-3"
title = "Fragment III. From the Same Apology."
level = 1
blocks = [
  { t = "p", text = "From the Same Apology.[^3620]" },
  { t = "note", id = "3620", text = "In the *Chronicon Alexandrinum*." },
  { t = "p", text = "We are not those who pay homage to stones, that are without sensation; but of the only God, who is before all and over all, and, moreover, we are worshippers of His Christ, who is veritably God the Word[^3621] *existing* before all time." },
  { t = "note", id = "3621", text = "῎Οντως Θεοῦ Λόγου." },
]

[[section]]
id = "fragment-4"
title = "Fragment IV. From the Book of Extracts."
level = 1
blocks = [
  { t = "p", text = "From the Book of Extracts.[^3622]" },
  { t = "note", id = "3622", text = "In Eusebius, *l. c*." },
  { t = "p", text = "Melito to his brother Onesimus, greeting:—" },
  { t = "p", text = "As you have often, prompted by your regard for the word *of God*, expressed a wish to have some extracts made from the Law and the Prophets concerning the Saviour, and concerning our faith in general, and have desired, moreover, to obtain an accurate account of the Ancient Books, as regards their number and their arrangement, I have striven to the best of my ability to perform this task: well knowing your zeal for the faith, and your eagerness to become acquainted with the Word, and especially because *I am assured that*, through your yearning after God, you esteem these things beyond all things else, engaged as you are in a struggle for eternal salvation." },
  { t = "p", text = "I accordingly proceeded to the East, and went to the very spot where *the things in question* were preached and took place; and, having made myself accurately acquainted with the books of the Old Testament, I have set them down below, and herewith send you *the list*. Their names are as follows:—" },
  { t = "p", text = "The five *books* of Moses—Genesis, Exodus, Leviticus, Numbers, Deuteronomy; Joshua,[^3623] Judges, Ruth, the four *books* of Kings, the two of Chronicles, the *book of the* Psalms of David, the Proverbs of Solomon, also called *the Book of* Wisdom, Ecclesiastes, the Song of Songs, Job, *the books of* the prophets Isaiah, Jeremiah, of the twelve contained in a single book, Daniel, Ezekiel, Esdras. From these I have made my extracts, dividing them into six books." },
  { t = "note", id = "3623", text = "᾽Ιησοῦς Ναυῆ." },
]

[[section]]
id = "fragment-5"
title = "Fragment V. From the Catena on Genesis."
level = 1
blocks = [
  { t = "p", text = "From the Catena on Genesis.[^3624]" },
  { t = "note", id = "3624", text = "From Melito of Sardis." },
  { t = "p", text = "In place of Isaac the just, a ram appeared for slaughter, in order that Isaac might be liberated from *his* bonds. The slaughter of this *animal* redeemed Isaac *from death*. In like manner, the Lord, being slain, saved us; being bound, He loosed us; being sacrificed, He redeemed us…" },
  { t = "p", text = "For the Lord was a lamb, like the ram which Abraham saw caught in the bush Sabec.[^3625] But this bush represented the cross, and that place Jerusalem, and the lamb the Lord bound for slaughter." },
  { t = "note", id = "3625", text = "The Hebrew word סְבָךְ thicket, is not found as a proper name." },
  { t = "p", text = "For as a ram was He bound, says he concerning our Lord Jesus Christ, and as a lamb was He shorn, and as a sheep was He led to the slaughter, and as a lamb was He crucified; and He carried the cross[^3626] on His shoulders when He was led up *to the hill* to be slain, as was Isaac by his father. But Christ suffered, and Isaac did not suffer: for he was *but* a type of Him who should suffer. Yet, even when serving *only* for a type of Christ, he smote men with astonishment and fear." },
  { t = "note", id = "3626", text = "Τὸ ξύλον." },
  { t = "p", text = "For a new mystery was presented to view,—a son led by his father to a mountain to be slain, whose feet he bound together, and laid him on the wood of the sacrifice, preparing with care[^3627] whatever was necessary to his immolation. Isaac on his part is silent, bound like a ram, not opening his mouth, nor uttering a sound with his voice. For, not fearing the knife, nor quailing before the fire, nor troubled by *the prospect of* suffering, he sustained bravely *the character of* the type of the Lord. Accordingly there lies Isaac before us, with his feet bound like a ram, his father standing by, with the knife all bare in his hand, not shrinking from shedding the blood of his son." },
  { t = "note", id = "3627", text = "Μετὰ σπουδῆς. Migne: *Cum festinatione*." },
]

[[section]]
id = "fragment-6"
title = "Fragment VI. Two Scholia on Genesis XXII. 13."
level = 1
blocks = [
  { t = "p", text = "Two Scholia on Genesis XXII. 13.[^3628]" },
  { t = "note", id = "3628", text = "In the edition of the LXX. published by Card. Caraffe, 1581." },
  { t = "p", text = "The Syriac and the Hebrew use the word “suspended,”[^3629] as more clearly typifying the cross." },
  { t = "note", id = "3629", text = "κρεμάμενος. The Hebrew is נאחז, the Syriac ***, both meaning simply “caught.”" },
  { t = "p", text = "The word Sabek[^3630] some have rendered *remission*,[^3631] others *upright*,[^3632] as if the meaning, agreeing with the popular belief, were—a goat walking erect up to a bush, and there standing erect caught by his horns, so as to be a plain type of the cross. For this reason it is not translated, because the single Hebrew word signifies in other languages[^3633] many things. To those, however, who ask it is proper to give an answer, and to say that Sabek denotes *lifted up*.[^3634]" },
  { t = "note", id = "3630", text = "See note on the fragment just before." },
  { t = "note", id = "3631", text = "ἀφεσις." },
  { t = "note", id = "3632", text = "ὄρθιος." },
  { t = "note", id = "3633", text = "Lit. “when translated.”" },
  { t = "note", id = "3634", text = "ἐπηρμένος." },
]

[[section]]
id = "fragment-7"
title = "Fragment VII. On the Nature of Christ."
level = 1
blocks = [
  { t = "p", text = "On the Nature of Christ.[^3635]" },
  { t = "note", id = "3635", text = "In Anastasius of Sinai, *The Guide*, ch. 13." },
  { t = "p", text = "For there is no need, to persons of intelligence, to attempt to prove, from the deeds of Christ subsequent to His baptism, that His soul and His body, His human nature[^3636] like ours, were real, and no phantom of the imagination. For the deeds done by Christ after His baptism, and especially His miracles, gave indication and assurance to the world of the Deity hidden in His flesh. For, being at once both God and perfect man likewise, He gave us sure indications of His two natures:[^3637] of His Deity, by His miracles during the three years that elapsed after His baptism; of His humanity, during the thirty *similar* periods which preceded His baptism, in which, by reason of His low estate[^3638] as regards the flesh, He concealed the signs of His Deity, although He was the true God existing before all ages." },
  { t = "note", id = "3636", text = "Or, according to Migne’s punctuation, “His soul, and the body of His human nature.” The words are, τὸ ἀληθὲς καὶ ἀφάνταστον τῆς ψυχῆς αὐτοῦ καὶ τοῦ σώματος τῆς καθ᾽ ἡμᾶς ἀνθρωπινῆς φύσεως." },
  { t = "note", id = "3637", text = "Οὐσίας. [Comp. note 13, *infra*.]" },
  { t = "note", id = "3638", text = "Τὸ ἀτέλες." },
]

[[section]]
id = "fragment-8"
title = "Fragment VIII. From the Oration on Our Lord's Passion."
level = 1
blocks = [
  { t = "p", text = "From the Oration on Our Lord’s Passion.[^3639]" },
  { t = "note", id = "3639", text = "Anastasius, *Guide*, ch. 12." },
  { t = "p", text = "God has suffered from the right hand of Israel.[^3640]" },
  { t = "note", id = "3640", text = "[῾Ο Θεος πεπονθεν ὑπὸ δεξίας ᾽Ισραηλίτιδος. Compare Tatian, vol. ii. p. 71, note 2; also Origen, vol. iv. p. 480, note 4, this series. And see Routh, *R. S*., i. p. 148. So “God put to death,” p. 757, *supra*.]" },
]

[[section]]
id = "fragment-9"
title = "Fragment IX. From 'The Key.'"
level = 1
blocks = [
  { t = "p", text = "[^3641] *Head of the Lord*—*His* simple Divinity; because He is the Beginning and Creator of all things: in Daniel.[^3642]" },
  { t = "note", id = "3641", text = "From *The Key*." },
  { t = "note", id = "3642", text = "Dan. vii. 9, 13, 22." },
  { t = "p", text = "*The white hair of the Lord*, because He is “the Ancient of Days:” as above." },
  { t = "p", text = "*The eyes of the Lord*—the Divine inspection: because He sees all things. Like that in the apostle: For all things are naked and open in His eyes.”[^3643]" },
  { t = "note", id = "3643", text = "Heb. iv. 13." },
  { t = "p", text = "*The eyelids of the Lord*—hidden spiritual mysteries in the Divine precepts. In the Psalm: “His eyelids question, that is prove, the children of men.”[^3644]" },
  { t = "note", id = "3644", text = "Ps. xi. 4." },
  { t = "p", text = "*The smelling of the Lord*—His delight in the prayers or works of the saints. In Genesis: “And the Lord smelled an odour of sweetness.”[^3645]" },
  { t = "note", id = "3645", text = "Gen. viii. 21." },
  { t = "p", text = "*The mouth of the Lord*—His Son, or word *addressed* to men. In the prophet, “The mouth of the Lord hath spoken;”[^3646] and elsewhere, “They provoked His mouth to anger.”[^3647]" },
  { t = "note", id = "3646", text = "Isa. i. 20." },
  { t = "note", id = "3647", text = "Lam. i. 18." },
  { t = "p", text = "*The tongue of the Lord*—His Holy Spirit. In the Psalm: “My tongue is a pen.”[^3648]" },
  { t = "note", id = "3648", text = "Ps. xlv. 1." },
  { t = "p", text = "*The face of the Lord*—His manifestation. In Exodus, “My face shall go before thee;”[^3649] and in the prophet, “The face of the Lord divided them.”[^3650]" },
  { t = "note", id = "3649", text = "Ex. xxxiii. 14." },
  { t = "note", id = "3650", text = "Lam. iv. 16." },
  { t = "p", text = "*The word of the Lord*—*His* Son. In the Psalm: “My heart hath uttered a good word.”[^3651]" },
  { t = "note", id = "3651", text = "Ps. xlv. 1." },
  { t = "p", text = "*The arm of the Lord*—*His* Son, by whom He hath wrought all His works. In the prophet Isaiah: “And to whom is the arm of the Lord revealed?”[^3652]" },
  { t = "note", id = "3652", text = "Isa. liii. 1." },
  { t = "p", text = "*The right hand of the Lord*—that is, *His* Son; as also above in the Psalm: “The right hand of the Lord hath done valiantly.”[^3653]" },
  { t = "note", id = "3653", text = "Ps. cxviii. 16." },
  { t = "p", text = "*The right hand of the Lord*—*electio omnis*. As in Deuteronomy: “In His right hand *is* a fiery law.”[^3654]" },
  { t = "note", id = "3654", text = "Deut. xxxiii. 2." },
  { t = "p", text = "*The wings of the Lord*—Divine protection. In the Psalm: “In the shadow of Thy wings will I hope.”[^3655]" },
  { t = "note", id = "3655", text = "Ps. lvii. 1." },
  { t = "p", text = "*The shoulder of the Lord*—the Divine power, by which He condescends to carry the feeble. In Deuteronomy: “He took them up, and put them on His shoulders.”[^3656]" },
  { t = "note", id = "3656", text = "Deut. xxxiii. 12." },
  { t = "p", text = "*The hand of the Lord*—Divine operation. In the prophet: “Have not my hands made all these things?”[^3657]" },
  { t = "note", id = "3657", text = "Isa. lxvi. 2." },
  { t = "p", text = "*The finger of the Lord*—the Holy Spirit, by whose operation the tables of the law in Exodus are said to have been written;[^3658] and in the Gospel: “If I by the finger of God cast out demons”[^3659]" },
  { t = "note", id = "3658", text = "Ex. xxxiv. 1." },
  { t = "note", id = "3659", text = "Luke xi. 20." },
  { t = "p", text = "*The fingers of the Lord*—The lawgiver Moses, or the prophets. In the Psalm: “I will regard the heavens,” that is, the books of the Law and the Prophets, “the works of Thy fingers.”[^3660]" },
  { t = "note", id = "3660", text = "Ps. viii. 3." },
  { t = "p", text = "*The wisdom of the Lord*—*His Son*. In the apostle: “Christ the power of God, and the wisdom of God;”[^3661] and in Solomon: “The wisdom of the Lord reacheth from one end to the other mightily.”[^3662]" },
  { t = "note", id = "3661", text = "1 Cor. i. 24." },
  { t = "note", id = "3662", text = "Sap. viii. 1." },
  { t = "p", text = "*The womb of the Lord*—the hidden recess of Deity out of which He brought forth His Son. In the Psalm: “Out of the womb, before Lucifer, have I borne Thee.”[^3663]" },
  { t = "note", id = "3663", text = "Ps. cx. 3." },
  { t = "p", text = "*The feet of the Lord*—His immoveableness and eternity. In the Psalm: “And thick darkness was under His feet.”[^3664]" },
  { t = "note", id = "3664", text = "Ps. xviii. 9." },
  { t = "p", text = "*The throne of the Lord*—angels, or saints, or simply sovereign dominion.[^3665] In the Psalm: “Thy throne, O God, is for ever and ever.”[^3666]" },
  { t = "note", id = "3665", text = "Ipsa regnandi potestas." },
  { t = "note", id = "3666", text = "Ps. xlv. 6; comp. Ps. v., xxix." },
  { t = "p", text = "*Seat*—the same as above, angels or saints, because the Lord sits upon these. In the Psalm: “The Lord sat upon His holy seat.”[^3667]" },
  { t = "note", id = "3667", text = "Ps. xlvii. 8." },
  { t = "p", text = "*The descent of the Lord*—His visitation of men. As in Micah: “Behold, the Lord shall come forth from His place; He shall come down trampling under foot the ends of the earth.”[^3668] Likewise in a bad sense. In Genesis: “The Lord came down to see the tower.”[^3669]" },
  { t = "note", id = "3668", text = "Mic. i. 3." },
  { t = "note", id = "3669", text = "Gen. xi. 3." },
  { t = "p", text = "*The ascent of the Lord*—the raising up of man, who is taken from earth to heaven. In the Psalm: “Who ascendeth above the heaven of heavens to the east.”[^3670]" },
  { t = "note", id = "3670", text = "Ps. lxviii. 33." },
  { t = "p", text = "*The standing of the Lord*—the patience of the Deity, by which He bears with sinners that they may come to repentance. As in Habakkuk: “He stood and measured the earth;[^3671] and in the Gospel: “Jesus stood, and bade him be called,”[^3672] that is, the blind man." },
  { t = "note", id = "3671", text = "Hab. iii. 6." },
  { t = "note", id = "3672", text = "Mark x. 49." },
  { t = "p", text = "*The transition of the Lord*—His assumption of our flesh, through which by His birth, His death, His resurrection, His ascent into heaven, He made transitions, so to say. In the Song of Songs: “Behold, He cometh, leaping upon the mountains, bounding over the hills.”[^3673]" },
  { t = "note", id = "3673", text = "Cant. Cant. ii. 8." },
  { t = "p", text = "*The going*[^3674] *of the Lord*—His coming or visitation. In the Psalm." },
  { t = "note", id = "3674", text = "Gressus." },
  { t = "p", text = "*The way of the Lord*—the operation of the Deity. As in Job, in speaking of the devil: “He is the beginning of the ways of the Lord.”[^3675]" },
  { t = "note", id = "3675", text = "Job xl. 19." },
  { t = "p", text = "Again: *The ways of the Lord*—His precepts. In Hosea: “For the ways of the Lord are straight, and the just shall walk in them.”[^3676]" },
  { t = "note", id = "3676", text = "Hos. xiv. 10." },
  { t = "p", text = "*The footsteps of the Lord*—the signs of *His* secret operations. As in the Psalm: “And Thy footsteps shall not be known.”[^3677]" },
  { t = "note", id = "3677", text = "Ps. lxxvii. 19." },
  { t = "p", text = "*The knowledge of the Lord*—that which makes men to know Him. To Abraham *He says: “*Now I know that thou fearest the Lord;”[^3678] that is, I have made thee to know." },
  { t = "note", id = "3678", text = "Gen. xxii. 12." },
  { t = "p", text = "*The ignorance of God*[^3679]is His disapproval. In the Gospel: “I know you not.”[^3680]" },
  { t = "note", id = "3679", text = "Nescire Dei." },
  { t = "note", id = "3680", text = "Luke xiii. 25." },
  { t = "p", text = "*The remembrance of God*—His mercy, by which He rejects and has mercy on whom He will. So in Genesis: “The Lord remembered Noah;”[^3681] and in another passage: “The Lord hath remembered His people.”[^3682]" },
  { t = "note", id = "3681", text = "Gen. viii. 1." },
  { t = "note", id = "3682", text = "Esther x. 12." },
  { t = "p", text = "*The repentance of the Lord*—*His* change of procedure.[^3683] As in the book of Kings: “It repented me that I have made Saul king.”[^3684]" },
  { t = "note", id = "3683", text = "Rerum mutatio." },
  { t = "note", id = "3684", text = "1 Sam. xv. 11." },
  { t = "p", text = "*The anger and wrath of the Lord*—the vengeance of the Deity upon sinners, when He bears with them with a view to punishment, does not *at once* judge them according to *strict* equity. As in the Psalm: “In His anger and in His wrath will He trouble them.”[^3685]" },
  { t = "note", id = "3685", text = "Ps. ii. 5." },
  { t = "p", text = "*The sleeping of the Lord*—when, in the thoughts of some, His faithfulness is not sufficiently wakeful. In the Psalm: “Awake, why sleepest Thou, O Lord?”[^3686]" },
  { t = "note", id = "3686", text = "Ps. xliv. 23." },
  { t = "p", text = "*The watches of the Lord*—in the guardianship of His elect He is always at hand by the presence of *His* Deity. In the Psalm: “Lo! He will not slumber nor sleep.”[^3687]" },
  { t = "note", id = "3687", text = "Ps. cxxi. 4." },
  { t = "p", text = "*The sitting of the Lord*—His ruling. In the Psalm: “The Lord sitteth upon His holy seat.”[^3688]" },
  { t = "note", id = "3688", text = "Ps. xlvii. 8." },
  { t = "p", text = "*The footstool of the Lord*—man assumed by the Word; or His saints, as some think. In the Psalm: “Worship ye His footstool, for it is holy.”" },
  { t = "p", text = "*The walking of the Lord*—the delight of the Deity in the walks of His elect. In the prophet: “I will walk in them, and will be their Lord.”[^3689]" },
  { t = "note", id = "3689", text = "Ezek. xxxvii. 27." },
  { t = "p", text = "*The trumpet of the Lord*—His mighty voice. In the apostle: “At the command, and at the voice of the archangel, and at the trumpet of God, shall He descend from heaven.”[^3690]" },
  { t = "note", id = "3690", text = "1 Thess. iv. 15. [The above has been shown to have no claim to be the work of Melito. It is a compilation of the sixth century, in all probability.]" },
]

[[section]]
id = "translator-s-biographical-notice"
title = "Translator's Biographical Notice."
level = 1
blocks = [
  { t = "h", text = "Theognostus of Alexandria." },
  { t = "h", text = "Translator’s Biographical Notice." },
  { t = "p", text = "[a.d. 260. I can add nothing but conjectures to the following:] Of this Theognostus we have no account by either Eusebius or Jerome. Athanasius, however, mentions him more than once with honour. Thus he speaks of him as ἀνὴρ λόγιος, an *eloquent* or learned man.[^1242] And again as Θεόγνωστος ὁ θαυμάσιος καὶ σπουδαῖος, the admirable and zealous Theognostus.[^1243] He seems to have belonged to the Catechetical school of Alexandria, and to have flourished there in the latter half of the third century, probably about a.d. 260. That he was a disciple of Origen, or at least a devoted student of his works, is clear from Photius.[^1244] He wrote a work in seven books, the title of which is thus given by Photius:[^1245] *The Outlines of the blessed Theognostus, the exegete of Alexandria*. Dodwell and others are of opinion that by this term *exegete*,[^1246] is meant the presidency of the Catechetical school and the privilege of public teaching; and that the title, *Outlines*,[^1247] was taken from Clement, his predecessor in office. According to Photius, the work was on this plan. The first book treated of God the Father, as the maker of the universe; the second, of the necessary existence of the Son; the third, of the Holy Spirit; the fourth, of angels and demons; the fifth and sixth, of the incarnation of God; while the seventh bore the title, *On God’s Creation*.[^1248] Photius has much to say in condemnation of Thegnostus, who, however, has been vindicated by Bull[^1249] and Prudentius Maranus.[^1250] Gregory of Nyssa has also charged him with holding the same error as Eunomius on the subject of the Son’s relation to the work of creation.[^1251] He is adduced, however, by Athanasius as a defender of the Homoüsian doctrine." },
  { t = "note", id = "1242", text = "*De Decret. Nic. Syn*., 25, Works, vol. i. part i. p. 230." },
  { t = "note", id = "1243", text = "Epist. 4, to Serapion, sec. 9, vol. i. part ii. p. 702." },
  { t = "note", id = "1244", text = "*Bibl*., cod. 106." },
  { t = "note", id = "1245", text = "τοῦ μακαρίου Θεογνώστου ᾽Αλεξανδρέως καὶ ἐξηγητοῦ ὑποτυπώσες." },
  { t = "note", id = "1246", text = "ἐξηγητοῦ." },
  { t = "note", id = "1247", text = "ὑποτυπώσεις." },
  { t = "note", id = "1248", text = "*De Dei Creatione*." },
  { t = "note", id = "1249", text = "*Defens. fid. Nic*., sec. ii. chap. 10. [Bull always vindicates where he can do so, on the principle of justice, for which I have contended on p. v. (prefatory) of vol. iv.]" },
  { t = "note", id = "1250", text = "*Divinit I. C*., iv. 24." },
  { t = "note", id = "1251", text = "Book iii., *against Eunomius*." },
]

[[section]]
id = "part-1"
title = "Part I."
level = 1
blocks = [
  { t = "h", text = "From His Seven Books of Hypotyposes or Outlines." },
  { t = "p", text = "I.[^1252]" },
  { t = "note", id = "1252", text = "From book ii. In Athanasius, *On the Decrees of the Nicene Council*, sec. xxv. From the edition BB., Paris, 1698, vol. i. part i. p. 230. Athanasius introduces this fragment in the following terms:—Learn then, ye Christ-opposing Arians, that Theognostus, a man of learning, did not decline to use the expression “*of the substance*” (ἐκ τῆς οὐσίας). For, writing of the Son in the second book of his *Outlines*, he has spoken thus: *The substance of the Son*.—Tr." },
  { t = "p", text = "The substance[^1253] of the Son is not a substance devised extraneously,[^1254] nor is it one introduced out of nothing;[^1255] but it was born of the substance of the Father, as the reflection of light or as the steam of water. For the reflection is not the sun itself, and the steam is not the water itself, nor yet again is it anything alien; *neither is He Himself the Father, nor is He alien, but He is*[^1256] an emanation[^1257] from the substance of the Father, this substance of the Father suffering the while no partition. For as the sun remains the same and suffers no diminution from the rays that are poured out by it, so neither did the substance of the Father undergo any change in having the Son as an image of itself." },
  { t = "note", id = "1253", text = "οὐσία." },
  { t = "note", id = "1254", text = "ἔξωθεν ἐφευρεθεῖσα." },
  { t = "note", id = "1255", text = "ἐκ μὴ ὄντων ἐπεισήχθη." },
  { t = "note", id = "1256", text = "The words in italics were inserted by Routh from a Catena on the Epistle to the Hebrews, where they are ascribed to Theognostus: “He Himself” is the Son." },
  { t = "note", id = "1257", text = "ἀπόῤῥοια." },
]

[[section]]
id = "part-2"
title = "Part II."
level = 1
blocks = [
  { t = "p", text = "[^1258] Theognostus, moreover, himself adds words to this effect: He who has offended against the first term[^1259] and the second, may be judged to deserve smaller punishment; but he who has also despised the third, can no longer find pardon. For by the first term and the second, he says, is meant the teaching concerning the Father and the Son; but by the third is meant the doctrine committed to us with respect to the perfection[^1260] and the partaking of the Spirit. And with the view of confirming this, he adduces the word spoken by the Saviour to the disciples: “I have yet many things to say unto you, but ye cannot bear them now. But when the Holy Spirit is come, He will teach you.”[^1261]" },
  { t = "note", id = "1258", text = "In Athanasius, Epist. 4, to Serapion, sec. 11, vol. i. part ii. p. 703." },
  { t = "note", id = "1259", text = "ὅρον." },
  { t = "note", id = "1260", text = "τελειώσει. [i.e., making the disciples τέλειοι. James i. 4.]" },
  { t = "note", id = "1261", text = "John xvi. 12, 13." },
]

[[section]]
id = "part-3"
title = "Part III."
level = 1
blocks = [
  { t = "p", text = "[^1262] Then he says again: As the Saviour converses with those not yet able to receive what is perfect,[^1263] condescending to their littleness, while the Holy Spirit communes with the perfected, and yet we could never say on that account that the teaching of the Spirit is superior to the teaching of the Son, but only that the Son condescends to the imperfect, while the Spirit is the seal of the perfected; even so it is not on account of the superiority of the Spirit over the Son that the blasphemy against the Spirit is a sin excluding impunity and pardon, but because for the imperfect there is pardon, while for those who have tasted the heavenly gift,[^1264] and been made perfect, there remains no plea or prayer for pardon." },
  { t = "note", id = "1262", text = "From Athanasius, as above, p. 155." },
  { t = "note", id = "1263", text = "τὰ τέλεια." },
  { t = "note", id = "1264", text = "Heb. vi. 4. [Compare Matt. xii. 31.]" },
]

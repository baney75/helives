[[section]]
id = "translator-s-biographical-notice"
title = "Translator's Biographical Notice."
level = 1
blocks = [
  { t = "h", text = "Malchion." },
  { t = "h", text = "Translator’s Biographical Notice." },
  { t = "p", text = "[a.d. 270.] Eusebius[^1388] speaks of Malchion as a man accomplished in other branches of learning[^1389] and well-versed in Greek letters in particular, and as holding the presidency of the Sophists’ school at Antioch. Jerome[^1390] says that he taught rhetoric most successfully in the same city. Nor was it only that he excelled in secular erudition; but for the earnest sincerity of his Christian faith he obtained the dignity of presbyter in the church of that place, as Eusebius also tells us. He took part in the Synod of Antioch, which Eusebius calls the final council, and which Gallandi and others call the *second*, in opposition to Pearson, who holds that there was but one council at Antioch. This synod met apparently about a.d. 269, and dealt with Paul of Samosata, who had introduced the heresy of Artemon into the church of Antioch; and Eusebius says that Malchion was the only one who, in the discussion which took place there with the arch-heretic, and which was taken down by stenographers who were present, was able to detect the subtle and crafty sentiments of the man. Paul’s real opinions being thus unveiled, after he had baffled the acuteness of his ecclesiastical judges for some time, he was at length convicted; and the discussion was published, and a synodical epistle was sent on the subject to Dionysius, bishop of Rome, and to Maximus of Alexandria, and to all the provinces, which, according to Jerome (*De vir. illustr*., ch. 71), was written by Malchion, and of which we have extracts in Eusebius.[^1391]" },
  { t = "note", id = "1388", text = "*Hist. Eccles*., vii. 29." },
  { t = "note", id = "1389", text = "ἀνὴρ τά τε ἄλλα λόγιος." },
  { t = "note", id = "1390", text = "*De viris illustr*., ch. 71." },
  { t = "note", id = "1391", text = "In Eusebius, vii. 30. [Elucidation I., p. 172.]" },
]

[[section]]
id = "section-1"
title = "Section I. The Epistle Written by Malchion, In Name of the Synod of Antioch, Against Paul of Samosata."
level = 1
blocks = [
  { t = "p", text = "To Dionysius and Maximus, and to all our fellows in the ministry throughout the world, both bishops and presbyters and deacons, and to the whole Catholic Church under heaven, Helenus and Hymenæus and Theophilus and Theotecnus and Maximus, Proclus, Nicomas, and Ælianus, and Paul and Bolanus and Protogenes and Hierax and Eutychius and Theodorus and Malchion and Lucius, and all the others who are with us, dwelling in the neighbouring cities and nations, both bishops and presbyters and deacons, together with the churches of God, send greeting to our brethren beloved in the Lord." },
  { t = "p", text = "1. After some few introductory words, they proceed thus:—We wrote to many of the bishops, even those who live at a distance, and exhorted them to give their help in relieving us from this deadly doctrine; among these, we addressed, for instance, Dionysius, the bishop of Alexandria, and Firmilian of Cappadocia, those men of blessed name. Of these, the one wrote to Antioch without even deigning to honour the leader in this error by addressing him; nor did he write to him in his own name, but to the whole district,[^1392] of which letter we have also subjoined a copy. And Firmilian, who came twice in person, condemned the innovations in doctrine, as we who were present know and bear witness, and as many others know as well as we. But when he (Paul) promised to give up these opinions, he believed him; and hoping that, without any reproach to the Word, the matter would be rightly settled, he postponed his decision; in which action, however, he was deceived by that denier of his God and Lord, and betrayer of the faith which he formerly held. And now Firmilian was minded to cross to Antioch; and he came as far as Tarsus, as having already made trial of the man’s infidel[^1393] iniquity. But when we had just assembled, and were calling for him and waiting for his arrival, his end came upon him." },
  { t = "note", id = "1392", text = "παροικίᾳ [= jurisdiction. See p. 163, note 3, *supra.*]" },
  { t = "note", id = "1393", text = "ἀρνησιθέου ." },
  { t = "p", text = "2. After other matters again, they tell us in the following terms of what manner of life he was:—But there is no need of judging his actions when he was outside (the Church), when he revolted from the faith and turned aside to spurious and illegitimate doctrines. Nor need we say any thing of such matters as this, that, whereas he was formerly poor and beggarly, having neither inherited a single possession from his fathers, nor acquired any property by art or by any trade, he has now come to have excessive wealth by his deeds of iniquity and sacrilege, and by those means by which he despoils and concusses the brethren, casting the injured unfairly in their suit,[^1394] and promising to help them for a price, yet deceiving them all the while and to their loss, taking advantage of the readiness of those in difficulties to give in order to get deliverance from what troubled them, and thus supposing that gain is godliness.[^1395] Neither need I say any thing about his pride and the haughtiness with which he assumed worldly dignities, and his wishing to be styled procurator[^1396] rather than bishop, and his strutting through the market-places, and reading letters and reciting them[^1397] as he walked in public, and his being escorted by multitudes of people going before him and following him; so that he brought ill-will and hatred on the faith by his haughty demeanour and by the arrogance of his heart. Nor shall I say any thing of the quackery which he practises in the ecclesiastical assemblies, in the way of courting popularity and making a great parade, and astounding by such arts the minds of the less sophisticated; nor of his setting up for himself a lofty tribunal and throne, so unlike a disciple of Christ; nor of his having a secretum[^1398] and calling it by that name, after the manner of the rulers of this world; nor of his striking his thigh with his hand and beating the tribunal with his feet; nor of his censuring and insulting those who did not applaud him nor shake their handkerchiefs,[^1399] as is done in the theatres, nor bawl out and leap about after the manner of his partisans, both male and female, who were such disorderly listeners to him, but chose to hear reverently and modestly as in the house of God; nor of his unseemly and violent attacks in the congregation upon the expounders of the Word who have already departed this life, and his magnifying of himself, not like a bishop, but like a sophist and juggler; nor of his putting a stop to the psalms sung in honour of our Lord Jesus Christ, as the recent compositions of recent men, and preparing women to sing psalms in honour of himself in the midst of the Church. in the great day of the Paschal festival, which choristers one might shudder to hear. And besides, he acted on those bishops and presbyters, who fawned upon him in the neighbouring districts and cities, to advance the like opinions in their discourses to their people." },
  { t = "note", id = "1394", text = "καταβραβεύων, perhaps = \"receiving\" bribes from." },
  { t = "note", id = "1395", text = "1 Tim. vi. 5." },
  { t = "note", id = "1396", text = "δουκηνάριος, the name given under the Emperors to those procurators who received 200 sestertia of annual salary." },
  { t = "note", id = "1397", text = "ὑπαγορεύων. [Letters, e.g., from Zenobia.]" },
  { t = "note", id = "1398", text = "σήκρητον (from the Latin *secerno*, to separate) was the name given to the elevated place, railed in and curtained, where the magistrate sat to decide cases." },
  { t = "note", id = "1399", text = "κατασείουσι ταῖς ὀθόναις, alluding to the custom of shaking the *oraria* or linen handkerchiefs as a token of applause. [Elucid. II.]" },
  { t = "p", text = "3. For we may say, to anticipate a little what we intend to write below, that he does not wish to acknowledge that the Son of God came down from heaven. And this is a statement which shall not be made to depend on simple assertion; for it is proved abundantly by those memoranda which we sent you, and not least by that passage in which he says that Jesus Christ is from below. And they who sing his praise and eulogise him among the people, declare that their impious teacher has come down as an angel from heaven. And such utterances the haughty man does not check, but is present even when they are made. And then again there are these women—these adopted sisters,[^1400] as the people of Antioch call them—who are kept by him and by the presbyters and deacons with him, whose incurable sins in this and other matters, though he is cognisant of them, and has convicted them, he connives at concealing, with the view of keeping the men subservient to himself, and preventing them, by fear for their own position, from daring to accuse him in the matter of his impious words and deeds. Besides this, he has made his followers rich, and for that he is loved and admired by those who set their hearts on these things. But why should we write of these things? For, beloved, we know that the bishop and all the clergy[^1401] ought to be an example in all good works to the people. Nor are we ignorant of the fact that many have fallen away through introducing these women into their houses, while others have fallen under suspicion. So that, even although one should admit that he has been doing nothing disgraceful in this matter, yet he ought at least to have avoided the suspicion that springs out of such a course of conduct, lest perchance some might be offended, or find inducement to imitate him. For how, then, should any one censure another, or warn him to beware of yielding to greater familiarity with a woman, lest perchance he might slip, as it is written:[^1402] if, although he has dismissed one, he has still retained two with him, and these in the bloom of their youth, and of fair countenance; and if when he goes away he takes them with him; and all this, too, while he indulges in luxury and surfeiting?" },
  { t = "note", id = "1400", text = "συνεισάκτους γυναῖκας, priests’-housekeepers. See Lange on Nicephorus vi. 30, and B. Rhenanus on Rufinus, vii. The third canon of the Nicene Council in the Codex Corbeiensis has this title, *De subintroductis id est adoptivis sororibus. Of the subintroduced, that is, the adopted sisters.*See also on the abuse, Jerome, in the *Epistle to Eustochius.* They appear also to have been called *commanentes* and *agapetæ.* See the note of Valesius in Migne. [Vol. ii. p. 47, and (same vol.) Elucidation II. p. 57.]" },
  { t = "note", id = "1401", text = "ἱερατεῖον." },
  { t = "note", id = "1402", text = "Referring either to Proverbs vi. or to Ecclesiasticus xxv." },
  { t = "p", text = "4. And on account of these things all are groaning and lamenting with themselves; yet they have such a dread of his tyranny and power that they cannot venture on accusing him. And of these things, as we have said already, one might take account in the case of a man who held Catholic sentiments and belonged to our own number; but as to one who has betrayed[^1403] the mystery (of the faith), and who swaggers[^1404] with the abominable heresy of Artemas,—for why should we hesitate to disclose his father?—we consider it unnecessary to exact of him an account for these things." },
  { t = "note", id = "1403", text = "ἐξορχησάμενον, danced away." },
  { t = "note", id = "1404", text = "ἐμπομπεύοντα." },
  { t = "p", text = "5. *Then at the close of the epistle they add the following words*:—We have been compelled, therefore, to excommunicate this man, who thus opposeth God Himself, and refuses submission, and to appoint in his place another bishop for the Church Catholic, and that, as we trust, by the providence of God—namely, the son of Demetrianus, a man of blessed memory, and one who presided over the same Church with distinction in former times, Domnus by name, a man endowed with all the noble qualities which become a bishop. And this fact we have communicated to you in order that ye may write him, and receive letters of communion[^1405] from him. And that other may write to Artemas, if it please him; and those who think with Artemas may hold communion with him, if they are so minded." },
  { t = "note", id = "1405", text = "κοινωνικὰ γράμματα. On this Valesius gives the following note:—The Latins call these *litteræ communicatoriæ*, the use of which is of very ancient date in the Church. They called the same also *formatæ*, as Augustine witnesses in Epistle 163. There were, moreover, two kinds of them. For there were some which were given to the clergy and laity when about to travel, that they might be admitted to communion by foreign bishops. And there were others which bishops were in the way of sending to other bishops, and which they in turn received from others, for the purpose of attesting their inter-communion; of which sort the Synod speaks here. These were usually sent by recently-ordained bishops soon after their ordination. Augustine, Epistle 162; Cyprian, in the Epistle to Cornelius, p. 320; and the Synodical Epistle of the Council of Sardica, appear to refer to these, though they may refer also to the *formatæ.* [Vol. i. p. 12, n. 9.]" },
]

[[section]]
id = "section-2"
title = "Section II. Fragments Apparently of the Same Epistle of the Synod of Antioch."
level = 1
blocks = [
  { t = "h", text = "To Wit, of that Part of It Which It is Agreed that Eusebius Left Unnoticed.[^1406]" },
  { t = "note", id = "1406", text = "In *Leontius of Byzantium, contra Nestor.*, book iii., towards the end." },
  { t = "p", text = "He says, therefore, in the commentaries (they speak of Paul), that he maintains the dignity of wisdom." },
  { t = "p", text = "And thereafter:" },
  { t = "p", text = "If, however, he had been united[^1407] according to formation and generation, this is what befalls the man. *And again*: For that wisdom, as we believe, was not congenerate[^1408] with humanity substantially, but qualitatively.[^1409]" },
  { t = "note", id = "1407", text = "*Copulatus erat.*" },
  { t = "note", id = "1408", text = "*Congeneratum.*" },
  { t = "note", id = "1409", text = "*Secundum qualitatem.*" },
  { t = "p", text = "And thereafter:" },
  { t = "p", text = "In what respect, moreover, does he mean to allege that the formation[^1410] of Christ is different and diverse from ours, when we hold that, in this one thing of prime consequence, His constitution differs from ours, to wit, that what in us is the interior man, is in Him the Word.[^1411]" },
  { t = "note", id = "1410", text = "*Formationem.*" },
  { t = "note", id = "1411", text = "We say, that as the exterior and the interior man are one person, so God the Word and humanity have been assumed as one person, a thing which Paul denies.—Can." },
  { t = "p", text = "And thereafter:" },
  { t = "p", text = "If he means to allege that Wisdom dwells in Him as in no other, this expresses indeed the same mode of inhabitation, though it makes it excel in respect of measure and multitude; He being supposed to derive a superior knowledge from the Wisdom, say for example, twice as large as others, or any other number of times as large; or, again, it may be less than twice as large a knowledge as others have. This, however, the catholic and ecclesiastical canons disallow, and hold rather that other men indeed received of Wisdom as an inspiration from without, which, though with them, is distinct from them;[^1412] but that Wisdom in verity came of itself substantially into His body by Mary." },
  { t = "note", id = "1412", text = "*Alia est apud ipos.*" },
  { t = "p", text = "And after other matters:" },
  { t = "p", text = "And they hold that there are not two Sons. But if Jesus Christ is the Son of God, and if Wisdom also is the Son of God; and if the Wisdom is one thing and Jesus Christ another, there are two Sons." },
  { t = "p", text = "And thereafter:" },
  { t = "p", text = "Moreover understand (Paul would say) the union with Wisdom in a different sense, namely as being one according to instruction and participation;[^1413] but not as if it were formed according to the substance in the body." },
  { t = "note", id = "1413", text = "*Secundum disciplinam et participationem.* Paul of Samosata used to say that the humanity was united with the Wisdom as instruction (*disciplina*) is united with the learner by participation.—Can. [See Hooker, book v. cap. 52, sec. 4.]" },
  { t = "p", text = "And after other matters:" },
  { t = "p", text = "Neither was the God who bore the human body and had assumed it, without knowledge[^1414] of human affections[^1415] in the first instance;[^1416] nor was the human body without knowledge, in the first instance, of divine operations in him in whom He (the God) was, and by whom He wrought these operations. He was formed, in the first instance, as man in the womb; and, in the second instance,[^1417] the God also was in the womb, united essentially with the human,[^1418] that is to say, His substance being wedded with the man." },
  { t = "note", id = "1414", text = "*Expers.*" },
  { t = "note", id = "1415", text = "*Passionum*, sufferings." },
  { t = "note", id = "1416", text = "*Principaliter.*" },
  { t = "note", id = "1417", text = "*Secundario*, i.e., κατὰ δεύτερον λόγον.—Turrian." },
  { t = "note", id = "1418", text = "συνουσιωμένος τῷ ἀνθρωπίνῳ." },
]

[[section]]
id = "section-3"
title = "Section III. From the Acts of the Disputation Conducted by Malchion Against Paul of Samosata."
level = 1
blocks = [
  { t = "p", text = "[^1419] The compound is surely made up of the simple elements,[^1420] even as in the instance of Jesus Christ, who was made one (person), constituted by God the Word, and a human body which is of the seed of David, and who subsists without having any manner of division between the two, but in unity. You, however, appear to me to decline to admit a constitution[^1421] after this fashion: to the effect that there is not in this person, the Son of God according to substance, but only the Wisdom according to participation. For you made this assertion, that the Wisdom bears dispensing, and therefore cannot be compounded;[^1422] and you do not consider that the divine Wisdom remained undiminished, even as it was before it evacuated itself;[^1423] and thus in this self-evacuation, which it took upon itself in compassion (for us), it continued undiminished and unchangeable. And this assertion you also make, that the Wisdom dwelt in Him, just as we also dwell in houses, the one in the other,[^1424] and yet not as if we formed a part of the house, or the house a part of us." },
  { t = "note", id = "1419", text = "In Petrus Diaconus, *De Incarnat. ad Fulgentium*, ch. 6. Among the works of Fulgentius, Epistle 16." },
  { t = "note", id = "1420", text = "*Ex simplicibus fit certe compositum.*" },
  { t = "note", id = "1421", text = "*Compositionem.*" },
  { t = "note", id = "1422", text = "*Quia sapientia dispendium patiatur et ideo composita esse non possit*—the sense intended being perhaps just that Paul alleged that the divine Wisdom admitted of being dispensed or imparted to another, but not of being substantially united with him.—Tr." },
  { t = "note", id = "1423", text = "*Exinanisset.*" },
  { t = "note", id = "1424", text = "Some read *alter in altero*, others *alter in altera.*" },
]

[[section]]
id = "section-4"
title = "Section IV. A Point in the Same Disputation."
level = 1
blocks = [
  { t = "p", text = "[^1425] Did I not say before that you do not admit that the only-begotten Son, who is from all eternity before every creature, was made substantially existent[^1426] in the whole person of the Saviour;[^1427] that is to say, was united *with Him* according to substance?" },
  { t = "note", id = "1425", text = "From the same *Acts* in Leontius, as above." },
  { t = "note", id = "1426", text = "οὐσιῶσθαι." },
  { t = "note", id = "1427", text = "*In toto Salvatore.*" },
]

[[section]]
id = "elucidations"
title = "Elucidations."
level = 1
blocks = [
  { t = "h", text = "I." },
  { t = "h", text = "(The epistle written by Malchion, p. 169.)" },
  { t = "p", text = "Malchion, though a presbyter of Antioch, reflects the teaching of Alexandria, and illustrates its far-reaching influence. Firmilian, presiding at the Council of Antioch, was a pupil of Origen; and Dionysius was felt in the council, though unable to be present. Malchion and Firmilian, therefore, vindicate the real mind of Origen, though speaking in language matured and guarded. This council was, providentially, a rehearsal for Nicæa." },
  { t = "h", text = "II." },
  { t = "h", text = "(Putting a stop to psalms, etc., p. 170.)" },
  { t = "p", text = "Coleridge notes this, with an amusing comment on *Paulus Samosatenus*,[^1428] and refers to Pliny’s letter, of which see vol. v. p. 604, this series. Jeremy Taylor, from whom Coleridge quotes, gives the passage of our author as follows: “Psalmos et cantus qui ad Dom. nostri J. C. honorem decantari solent, tanquam recentiores et a viris recentioris memoriæ editos, exploserit” (*Works*, ii. p. 281, ed. Bohn, 1844). Observe what Coleridge says elsewhere[^1429] on errors attributed to Origen: “Never was a great man so misunderstood as Origen.” He adds: “The *caro noumenon* was what Origen meant by Christ’s ‘flesh consubstantial with His Godhead.’”" },
  { t = "note", id = "1428", text = "*Notes on English Divines*, vol. i. p. 199." },
  { t = "note", id = "1429", text = "*Ibid*., p. 313." },
]

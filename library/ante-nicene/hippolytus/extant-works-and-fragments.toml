[[section]]
id = "the-discourse-on-the-holy-theophany"
title = "The Discourse on the Holy Theophany."
level = 2
blocks = [
  { t = "p", text = "1. Good, yea, very good, are all the works of our God and Saviour—all of them that eye seeth and mind perceiveth, all that reason interprets and hand handles, all that intellect comprehends and human nature understands. For what richer beauty can there be than that of the circle[^1782] of heaven? And what form of more blooming fairness than that of earth’s surface? And what is there swifter in the course than the chariot of the sun? And what more graceful car than the lunar orb?[^1783] And what work more wonderful than the compact mosaic of the stars?[^1784] And what more productive of supplies than the seasonable winds? And what more spotless mirror than the light of day? And what creature more excellent than man? Very good, then, are all the works of our God and Saviour. And what more requisite gift, again, is there than the element[^1785] of water? For with water all things are washed and nourished, and cleansed and bedewed. Water bears the earth, water produces the dew, water exhilarates the vine; water matures the corn in the ear, water ripens the grapecluster, water softens the olive, water sweetens the palm-date, water reddens the rose and decks the violet, water makes the lily bloom with its brilliant cups. And why should I speak at length? Without the element of water, none of the present order of things can subsist. So necessary is the element of water; for the other elements[^1786] took their places beneath the highest vault of the heavens, but the nature of water obtained a seat also above the heavens. And to this the prophet himself is a witness, when he exclaims, “Praise the Lord, ye heavens of heavens, and the water that is above the heavens.”[^1787]" },
  { t = "note", id = "1782", text = "δίσκου." },
  { t = "note", id = "1783", text = "σεληνιακοῦ στοιχείου." },
  { t = "note", id = "1784", text = "πολυπηγήτου τῶν ἄστρων μουσίου." },
  { t = "note", id = "1785", text = "φύσεως." },
  { t = "note", id = "1786", text = "στοιχεῖα." },
  { t = "note", id = "1787", text = "Ps. cxlviii. 4. [Pindar (῞Αριστον μὲν ὕδωρ, *Olymp*., i. 1), is expounded and then transcended.]" },
  { t = "p", text = "2. Nor is this the only thing that proves the dignity[^1788] of the water. But there is also that which is more honourable than all—the fact that Christ, the Maker of all, came down as the rain,[^1789] and was known as a spring,[^1790] and diffused Himself as a river,[^1791] and was baptized in the Jordan.[^1792] For you have just heard how Jesus came to John, and was baptized by him in the Jordan. Oh things strange beyond compare! How should the boundless River[^1793] that makes glad the city of God have been dipped in a little water! The illimitable Spring that bears life to all men, and has no end, was covered by poor and temporary waters! He who is present everywhere, and absent nowhere—who is incomprehensible to angels and invisible to men—comes to the baptism according to His own good pleasure. When you hear these things, beloved, take them not as if spoken literally, but accept them as presented in a figure.[^1794] Whence also the Lord was not unnoticed by the watery element in what He did in secret, in the kindness of His condescension to man. “For the waters saw Him, and were afraid.”[^1795] They well-nigh broke from their place, and burst away from their boundary. Hence the prophet, having this in his view many generations ago, puts the question, “What aileth thee, O sea, that thou fleddest; and thou, Jordan, that thou wast driven back?”[^1796] And they in reply said, We have seen the Creator of all things in the “form of a servant,”[^1797] and being ignorant of the mystery of the economy, we were lashed with fear." },
  { t = "note", id = "1788", text = "ἀξιοπιστίαν." },
  { t = "note", id = "1789", text = "Hos. vi. 3." },
  { t = "note", id = "1790", text = "John iv. 14." },
  { t = "note", id = "1791", text = "John vii. 38." },
  { t = "note", id = "1792", text = "Matt. iii. 13." },
  { t = "note", id = "1793", text = "Ps. xlvi. 4." },
  { t = "note", id = "1794", text = "Economically." },
  { t = "note", id = "1795", text = "Ps. lxxvii. 16." },
  { t = "note", id = "1796", text = "Ps. cxiv. 5." },
  { t = "note", id = "1797", text = "Phil. ii. 7." },
  { t = "p", text = "3. But we, who know the economy, adore His mercy, because He hath come to save and not to judge the world. Wherefore John, the forerunner of the Lord, who before knew not this mystery, on learning that He is Lord in truth, cried out, and spake to those who came to be baptized of him, “O generation of vipers,”[^1798] why look ye so earnestly at me? “I am not the Christ;”[^1799] I am the servant, and not the lord; I am the subject, and not the king; I am the sheep, and not the shepherd; I am a man, and not God. By my birth I loosed the barrenness of my mother; I did not make virginity barren.[^1800] I was brought up from beneath; I did not come down from above. I bound the tongue of my father;[^1801] I did not unfold divine grace. I was known by my mother, and I was not announced by a star.[^1802] I am worthless, and the least; but “after me there comes One who is before me”[^1803]—after me, indeed, in time, but before me by reason of the inaccessible and unutterable light of divinity. “There comes One mightier than I, whose shoes I am not worthy to bear: He shall baptize you with the Holy Ghost, and with fire.”[^1804] I am subject to authority, but He has authority in Himself. I am bound by sins, but He is the Remover of sins. I apply[^1805] the law, but He bringeth grace to light. I teach as a slave, but He judgeth as the Master. I have the earth as my couch, but He possesses heaven. I baptize with the baptism of repentance, but He confers the gift of adoption: “He shall baptize you with the Holy Ghost, and with fire.” Why give ye attention to me? I am not the Christ." },
  { t = "note", id = "1798", text = "Matt. iii. 7." },
  { t = "note", id = "1799", text = "John i. 20." },
  { t = "note", id = "1800", text = "οὐ παρθενίαν ἐστείρωσα. So Gregory Thaumaturgus, *Sancta Theophania*, p. 106, edit. Vossii: “Thou, when born of the Virgin Mary,…didst not loose her virginity; but didst preserve it, and gifted her with the name of mother.”" },
  { t = "note", id = "1801", text = "Luke i. 20." },
  { t = "note", id = "1802", text = "Matt. ii. 9." },
  { t = "note", id = "1803", text = "John i. 27." },
  { t = "note", id = "1804", text = "Matt. iii. 11." },
  { t = "note", id = "1805", text = "παράπτω." },
  { t = "p", text = "4. As John says these things to the multitude, and as the people watch in eager expectation of seeing some strange spectacle with their bodily eyes, and the devil[^1806] is struck with amazement at such a testimony from John, lo, the Lord appears, plain, solitary, uncovered,[^1807] without escort,[^1808] having on Him the body of man like a garment, and hiding the dignity of the Divinity, that He may elude the snares of the dragon. And not only did He approach John as Lord without royal retinue; but even like a mere man, and one involved in sin, He bent His head to be baptized by John. Wherefore John, on seeing so great a humbling of Himself, was struck with astonishment at the affair, and began to prevent Him, saying, as ye have just heard, “I have need to be baptized of Thee, and comest Thou to me?”[^1809] What doest Thou, O Lord? Thou teachest things not according to rule.[^1810] I have preached one thing (regarding Thee), and Thou performest another; the devil has heard one thing, and perceives another. Baptize me with the fire of Divinity; why waitest Thou for water? Enlighten me with the Spirit; why dost Thou attend upon a creature? Baptize me, the Baptist, that Thy pre-eminence may be known. I, O Lord, baptize with the baptism of repentance, and I cannot baptize those who come to me unless they first confess fully their sins. Be it so then that I baptize Thee, what hast Thou to confess? Thou art the Remover of sins, and wilt Thou be baptized with the baptism of repentance? Though I should venture to baptize Thee, the Jordan dares not to come near Thee. “I have need to be baptized of Thee, and comest Thou to me?”" },
  { t = "note", id = "1806", text = "It was a common opinion among the ancient theologians that the devil was ignorant of the mystery of the economy, founding on such passages as Matt. iv. 3, 1 Cor. ii. 8. (Fabricius.) [See Ignatius, vol. i. p. 57, this series.]" },
  { t = "note", id = "1807", text = "γυμνός." },
  { t = "note", id = "1808", text = "ἀπροστάτευτος." },
  { t = "note", id = "1809", text = "Matt. iii. 14." },
  { t = "note", id = "1810", text = "ἀκανόνιστα δογματίζεις." },
  { t = "p", text = "5. And what saith the Lord to him? “Suffer it to be so now, for thus it becometh us to fulfil all righteousness.”[^1811] “Suffer it to be so now,” John; thou art not wiser than I. Thou seest as man; I foreknow as God. It becomes me to do this first, and thus to teach. I engage in nothing unbecoming, for I am invested with honour. Dost thou marvel, O John, that I am not come in my dignity? The purple robe of kings suits not one in private station, but military splendour suits a king: am I come to a prince, and not to a friend? “Suffer it to be so now for thus it becometh us to fulfil all righteousness:” I am the Fulfiller of the law; I seek to leave nothing wanting to its whole fulfilment, that so after me Paul may exclaim, “Christ is the fulfilling of the law for righteousness to every one that believeth.”[^1812] “Suffer it to be so now, for thus it becometh us to fulfil all righteousness.” Baptize me, John, in order that no one may despise baptism. I am baptized by thee, the servant, that no one among kings or dignitaries may scorn to be baptized by the hand of a poor priest. Suffer me to go down into the Jordan, in order that they may hear my Father’s testimony, and recognise the power of the Son. “Suffer it to be so now, for thus it becometh us to fulfil all righteousness.” Then at length John suffers Him. “And Jesus, when He was baptized, went up straightway out of the water: and the heavens were opened unto Him; and, lo, the Spirit of God descended like a dove, and rested upon Him. And a voice (came) from heaven, saying, This is my beloved Son, in whom I am well pleased.”[^1813]" },
  { t = "note", id = "1811", text = "Matt. iii. 15." },
  { t = "note", id = "1812", text = "Rom. x. 4." },
  { t = "note", id = "1813", text = "Matt. iii. 16, 17." },
  { t = "p", text = "6. Do you see, beloved, how many and how great blessings we would have lost, if the Lord had yielded to the exhortation of John, and declined baptism? For the heavens were shut before this; the region above was inaccessible. We would in that case descend to the lower parts, but we would not ascend to the upper. But was it only that the Lord was baptized? He also renewed the old man, and committed to him again the sceptre of adoption. For straightway “the heavens were opened to Him.” A reconciliation took place of the visible with the invisible; the celestial orders were filled with joy; the diseases of earth were healed; secret things were made known; those at enmity were restored to amity. For you have heard the word of the evangelist, saying, “The heavens were opened to Him,” on account of three wonders. For when Christ the Bridegroom was baptized, it was meet that the bridal-chamber of heaven should open its brilliant gates. And in like manner also, when the Holy Spirit descended in the form of a dove, and the Father’s voice spread everywhere, it was meet that “the gates of heaven should be lifted up.”[^1814] “And, lo, the heavens were opened to Him; and a voice was heard, saying, This is my beloved Son, in whom I am well pleased.”" },
  { t = "note", id = "1814", text = "Ps. xxiv. 7." },
  { t = "p", text = "7. The beloved generates love, and the light immaterial the light inaccessible.[^1815] “This is my beloved Son,” He who, being manifested on earth and yet unseparated from the Father’s bosom, was manifested, and yet did not appear.[^1816] For the appearing is a different thing, since in appearance the baptizer here is superior to the baptized. For this reason did the Father send down the Holy Spirit from heaven upon Him who was baptized. For as in the ark of Noah the love of God toward man is signified by the dove, so also now the Spirit, descending in the form of a dove, bearing as it were the fruit of the olive, rested on Him to whom the witness was borne. For what reason? That the faithfulness of the Father’s voice might be made known, and that the prophetic utterance of a long time past might be ratified. And what utterance is this? “The voice of the Lord (is) on the waters, the God of glory thundered; the Lord (is) upon many waters.”[^1817] And what voice? “This is my beloved Son, in whom I am well pleased.” This is He who is named the son of Joseph, and (who is) according to the divine essence my Only-begotten. “This is my beloved Son”—He who is hungry, and yet maintains myriads; who is weary, and yet gives rest to the weary; who has not where to lay His head,[^1818] and yet bears up all things in His hand; who suffers, and yet heals sufferings; who is smitten,[^1819] and yet confers liberty on the world;[^1820] who is pierced in the side,[^1821] and yet repairs the side of Adam.[^1822]" },
  { t = "note", id = "1815", text = "φῶς ἄϋλον γεννᾷ φῶς ἀπρόσιτον. The Son is called “Light of Light” in the *Discourse against Noetus*, ch. x. [See p. 227 *supra*.] In φῶς ἀπρόσιτον the reference is to 1 Tim. vi. 16." },
  { t = "note", id = "1816", text = "ἐπεφάνη οὐκ ἐφάνη. See Dorner’s *Doctrine of the Person of Christ*, div. i. vol. ii. p. 97 (Clark)." },
  { t = "note", id = "1817", text = "Ps. xxix. 3." },
  { t = "note", id = "1818", text = "Luke ix. 5. [Compare the *Paradoxes*, attributed to Bacon, in his *Works*, vol. xiv. p. 143; also the *Appendix*, pp. 139–142.]" },
  { t = "note", id = "1819", text = "ῥαπιζόμενος, referring to the slap in the process of manumitting slaves." },
  { t = "note", id = "1820", text = "Heb. i. 3." },
  { t = "note", id = "1821", text = "Matt. xxvi. 67. [From which proceeds His Church.]" },
  { t = "note", id = "1822", text = "That is, the sin introduced by Eve, who was formed by God out of Adam’s side. (Fabricius.)" },
  { t = "p", text = "8. But give me now your best attention, I pray you, for I wish to go back to the fountain of life, and to view the fountain that gushes with healing. The Father of immortality sent the immortal Son and Word into the world, who came to man in order to wash him with water and the Spirit; and He, begetting us again to incorruption of soul and body, breathed into us the breath (spirit) of life, and endued us with an incorruptible panoply. If, therefore, man has become immortal, he will also be God.[^1823] And if he is made God by water and the Holy Spirit after the regeneration of the laver[^1824] he is found to be also joint-heir with Christ[^1825] after the resurrection from the dead. Wherefore I preach to this effect: Come, all ye kindreds of the nations, to the immortality of the baptism. I bring good tidings of life to you who tarry in the darkness of ignorance. Come into liberty from slavery, into a kingdom from tyranny, into incorruption from corruption. And how, saith one, shall we come? How? By water and the Holy Ghost. This is the water in conjunction with the Spirit, by which paradise is watered, by which the earth is enriched, by which plants grow, by which animals multiply, and (to sum up the whole in a single word) by which man is begotten again and endued with life, in which also Christ was baptized, and in which the Spirit descended in the form of a dove." },
  { t = "note", id = "1823", text = "ἔσται καὶ Θεός, referring probably to 2 Pet. i. 4, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, “that by these ye might be partakers of the divine nature.” [See vol. iii. p. 317, note 11. Tertullian anticipates the language of the “Athanasian Confession,”—“taking the manhood into God;” applicable, through Christ, to our redeemed humanity. Eph. ii. 6; Rev. iii. 21.]" },
  { t = "note", id = "1824", text = "κολυμβήθρας." },
  { t = "note", id = "1825", text = "Rom. viii. 17." },
  { t = "p", text = "9. This is the Spirit that at the beginning “moved upon the face of the waters;”[^1826] by whom the world moves; by whom creation consists, and all things have life; who also wrought mightily in the prophets,[^1827] and descended in flight upon Christ.[^1828] This is the Spirit that was given to the apostles in the form of fiery tongues.[^1829] This is the Spirit that David sought when he said, “Create in me a clean heart, O God, and renew a right spirit within me.”[^1830] Of this Spirit Gabriel also spoke to the Virgin, “The Holy Ghost shall come upon thee, and the power of the Highest shall overshadow thee.”[^1831] By this Spirit Peter spake that blessed word, “Thou art the Christ, the Son of the living God.”[^1832] By this Spirit the rock of the Church was stablished.[^1833] This is the Spirit, the Comforter, that is sent because of thee,[^1834] that He may show thee to be the Son[^1835] of God." },
  { t = "note", id = "1826", text = "Gen. i. 2." },
  { t = "note", id = "1827", text = "Acts xxviii. 25." },
  { t = "note", id = "1828", text = "Matt. iii. 16." },
  { t = "note", id = "1829", text = "Acts ii. 3." },
  { t = "note", id = "1830", text = "Ps. li. 10." },
  { t = "note", id = "1831", text = "Luke i. 35." },
  { t = "note", id = "1832", text = "Matt. xvi. 16." },
  { t = "note", id = "1833", text = "Matt. xvi. 18." },
  { t = "note", id = "1834", text = "John xvi. 26." },
  { t = "note", id = "1835", text = "τέκνον." },
  { t = "p", text = "10. Come then, be begotten again, O man, into the adoption of God. And how? says one. If thou practisest adultery no more, and committest not murder, and servest not idols; if thou art not overmastered by pleasure; if thou dost not suffer the feeling of pride to rule thee; if thou cleanest off the filthiness of impurity, and puttest off the burden of sin; if thou castest off the armour of the devil, and puttest on the breastplate of faith, even as Isaiah saith, “Wash you, and seek judgment, relieve the oppressed, judge the fatherless, and plead for the widow. And come and let us reason together, saith the Lord. Though your sins be as scarlet, I shall make them white as snow; and though they be like crimson, I shall make them white as wool. And if ye be willing, and hear my voice, ye shall eat the good of the land.”[^1836] Do you see, beloved, how the prophet spake beforetime of the purifying power of baptism? For he who comes down in faith to the laver of regeneration, and renounces the devil, and joins himself to Christ; who denies the enemy, and makes the confession that Christ is God; who puts off the bondage, and puts on the adoption,—he comes up from the baptism brilliant as the sun,[^1837] flashing forth the beams of righteousness, and, which is indeed the chief thing, he returns a son of God and joint-heir with Christ. To Him be the glory and the power, together with His most holy, and good, and quickening Spirit, now and ever, and to all the ages of the ages. Amen." },
  { t = "note", id = "1836", text = "Isa. i. 16–19." },
  { t = "note", id = "1837", text = "This seems to refer to what the poets sing as to the sun rising out of the waves of ocean. (Fabricius.) [Note, this is not said of such as Simon Magus, but of one who *puts off the bondage*, i.e., of corruption. Our author’s *perorations* are habitually sublime.]" },
]

[[section]]
id = "fragments-of-discourses-or-homilies"
title = "Fragments of Discourses or Homilies."
level = 2
blocks = [
  { t = "p", text = "I.[^1838]" },
  { t = "note", id = "1838", text = "From a Discourse on the Resurrection, in Anastasius Sinaita, Hodegus, p. 350. This treatise is mentioned in the list of his works given on the statue, and also by Jerome, Sophronius, Nicephorus, Honorius, etc." },
  { t = "h", level = 3, text = "From the Discourse of Hippolytus, Bishop of Rome, on the Resurrection and Incorruption." },
  { t = "p", text = "Men, he says, “in the resurrection will be like the angels of God,”[^1839] to wit, in incorruption, and immortality, and incapacity of loss.[^1840] For the incorruptible nature is not the subject of generation;[^1841] it grows not, sleeps not, hungers not, thirsts not, is not wearied, suffers not, dies not, is not pierced by nails and spear, sweats not, drops not with blood. Of such kind are the natures of the angels and of souls released from the body. For both these are of another kind, and different from these creatures of our world, which are visible and perishing." },
  { t = "note", id = "1839", text = "Matt. xxii. 30." },
  { t = "note", id = "1840", text = "ἀρευσίᾳ." },
  { t = "note", id = "1841", text = "γεννᾶται." },
  { t = "h", text = "Section II. From the Discourse of St. Hippolytus, Bishop and Martyr, on the Divine Nature." },
  { t = "p", text = "II.[^1842]" },
  { t = "note", id = "1842", text = "From the Discourse on the Theology or the Doctrine of Christ’s Divine Nature, extant in the *Acts of the Lateran Council*, under Martinus 1., ann. 649, secret. v. p. 287, vol. vii. edit. Veneto-Labb." },
  { t = "h", level = 3, text = "From the Discourse of St. Hippolytus, Bishop and Martyr, on the Divine Nature.[^1843]" },
  { t = "note", id = "1843", text = "περὶ θεολογίας." },
  { t = "p", text = "God is capable of willing, but not of not willing[^1844] for that pertains only to one that changes and makes choice;[^1845] for things that are being made follow the eternal will of God, by which also things that are made abide sustained." },
  { t = "note", id = "1844", text = "οὐ τὸ μὴ θέλειν." },
  { t = "note", id = "1845", text = "τρεπτοῦ καὶ προαιρετοῦ." },
  { t = "h", level = 3, text = "III.[^1846]" },
  { t = "note", id = "1846", text = "From a Homily on the Lord’s Paschal Supper, *ibid*., p. 293." },
  { t = "h", level = 3, text = "St. Hippolytus, Bishop and Martyr, in his Homily on the Paschal Supper." },
  { t = "p", text = "He was altogether[^1847] in all, and everywhere; and though He filleth the universe up to all the principalities of the air, He stripped Himself again. And for a brief space He cries that the cup might pass from Him, with a view to show truly that He was also man.[^1848] But remembering, too, the purpose for which He was sent, He fulfils the dispensation (economy) for which He was sent, and exclaims, “Father, not my will,”[^1849] and, “The spirit is willing, but the flesh is weak.”[^1850]" },
  { t = "note", id = "1847", text = "ὅλος." },
  { t = "note", id = "1848", text = "καὶ ἄνθρωπος, *also* man. See Grabe, Bull’s *Defens. Fid. Nic*., p. 103." },
  { t = "note", id = "1849", text = "Luke xxii. 42." },
  { t = "note", id = "1850", text = "Matt. xxvi. 41." },
  { t = "h", level = 3, text = "IV.[^1851]" },
  { t = "note", id = "1851", text = "From a Discourse on Elkanah and Hannah. In Theodoret, Dial. I., bearing the title “Unchangeable” (ἄτρεπτος); *Works*, vol. iv. p. 36." },
  { t = "p", text = "1. Take me, O Samuel, the heifer brought to Bethlehem, in order to show the king begotten of David, and him who is anointed to be king and priest by the Father." },
  { t = "p", text = "2. Tell me, O blessed Mary, what that was that was conceived by thee in the womb, and what that was that was born by thee in thy virgin matrix. For it was the first-born Word of God that descended to thee from heaven, and was formed as a first-born man in the womb, in order that the first-born Word of God might be shown to be united with a first-born man." },
  { t = "p", text = "3. And in the second (form),—to wit, by the prophets, as by Samuel, calling back and delivering the people from the slavery of the aliens. And in the third (form), that in which He was incarnate, taking to Himself humanity from the Virgin, in which character also He saw the city, and wept over it." },
  { t = "h", level = 3, text = "V.[^1852]" },
  { t = "note", id = "1852", text = "From the same Discourse. From Theodoret’s Second Dialogue, bearing the title “Unmixed,” ἀσύγχυτος; *Works*, vol. iv. p. 88." },
  { t = "p", text = "And for this reason three seasons of the year prefigured the Saviour Himself, so that He should fulfil the mysteries prophesied of Him. In the Passover season, so as to exhibit Himself as one destined to be sacrificed like a sheep, and to prove Himself the true Paschal-lamb, even as the apostle says, “Even Christ,” who is God, “our passover was sacrificed for us.”[^1853] And at Pentecost so as to presignify the kingdom of heaven as He Himself first ascended to heaven and brought man as a gift to God.[^1854]" },
  { t = "note", id = "1853", text = "1 Cor. v. 7." },
  { t = "note", id = "1854", text = "[Man’s nature was never before in heaven. John iii. 13; Acts ii. 34.]" },
  { t = "h", level = 3, text = "VI.[^1855]" },
  { t = "note", id = "1855", text = "From an Oration on “The Lord is my Shepherd.” In Theodoret, Dial. I. p. 36." },
  { t = "p", text = "And an ark of imperishable wood was the Saviour Himself. For by this was signified the imperishable and incorruptible tabernacle (of His body), which engendered no corruption of sin. For the man who has sinned also has this confession to make: “My wounds stank, and were corrupt, because of my foolishness.”[^1856] But the Lord was without sin, being of imperishable wood in respect of His humanity,—that is to say, being of the Virgin and the Holy Spirit, covered, as it were, within and without with the purest gold of the Word of God." },
  { t = "note", id = "1856", text = "Ps. xxxviii. 5." },
  { t = "h", level = 3, text = "VII.[^1857]" },
  { t = "note", id = "1857", text = "From a Discourse on the “Great Song” [i.e., Ps. xc. See Bunsen, i. p. 285. Some suppose it Ps. cxix.] In Theodoret, Dial. II. pp. 88, 89." },
  { t = "p", text = "1. He who rescued from the lowest hell the first-formed man of earth when he was lost and bound with the chains of death; He who came down from above, and raised the earthy on high;[^1858] He who became the evangelist of the dead, and the redeemer of the souls, and the resurrection of the buried,—He was constituted the helper of vanquished man, being made like him Himself, (so that) the first-born Word acquainted Himself with the first-formed Adam in the Virgin; He who is spiritual sought out the earthy in the womb; He who is the ever-living One sought out him who, through disobedience, is subject to death; He who is heavenly called the terrene to the things that are above; He who is the nobly-born sought, by means of His own subjection, to declare the slave free; He transformed the man into adamant who was dissolved into dust and made the food of the serpent, and declared Him who hung on the tree to be Lord over the conqueror, and thus through the tree He is found victor." },
  { t = "note", id = "1858", text = "τὸν κάτω εἰς τὰ ἄνω. [See p. 238, note 17, *supra*.]" },
  { t = "p", text = "2. For they who know not now the Son of God incarnate, shall know in Him who comes as Judge in glory, Him who is now despised in the body of His humiliation." },
  { t = "p", text = "3. And the apostles, when they came to the sepulchre on the third day, did not find the body of Jesus; just as the children of Israel went up the mount and sought for the tomb of Moses, but did not find it." },
  { t = "h", level = 3, text = "VIII.[^1859]" },
  { t = "note", id = "1859", text = "From a Discourse on the beginning of Isaiah. In Theodoret, Dial. I. p. 36." },
  { t = "p", text = "Under the figure of Egypt he described the world; and under things made with hands, idolatry; and under the earthquake, the subversion, and dissolution of the earth itself. And he represented the Lord the Word as a light cloud, the purest tabernacle, enthroned on which our Lord Jesus Christ entered into this life in order to subvert error." },
  { t = "h", text = "Section IX." },
  { t = "p", text = "IX.[^1860]" },
  { t = "note", id = "1860", text = "From a second Oration on Daniel. In the tractate of Eustratius, a presbyter of the Church of Constantinople, “Against those who allege that souls, as soon as they are released from the body, cease to act,” ch. xix., as edited by Allatius in his work on the *Continuous Harmony of the Western and the Eastern Church on the Dogma of Purgatory*, p. 492. [Conf. Macaire, *Theol. Orthod.*, ii. p. 725.]" },
  { t = "p", text = "Now Hippolytus, the martyr and bishop of [the Province of] Rome, in his second discourse on Daniel, speaks thus:—" },
  { t = "p", text = "Then indeed Azarias, standing along with the others, made their acknowledgments to God with song and prayer in the midst of the furnace. Beginning thus with His holy and glorious and honourable name, they came to the works of the Lord themselves, and named first of all those of heaven, and glorified Him, saying, “Bless the Lord, all ye works of the Lord.” Then they passed to the sons of men, and taking up their hymn in order, they then named the spirits [that people Tartarus[^1861] beneath the earth,] and the souls of the righteous, in order that they might praise God together with them." },
  { t = "note", id = "1861", text = "[Nothing of this in the hymn: hence my brackets.]" },
  { t = "h", level = 3, text = "X.[^1862]" },
  { t = "note", id = "1862", text = "From an Oration on the Distribution of Talents. In Theodoret, Dial. II. p. 88." },
  { t = "p", text = "Now a person might say that these men, and those who hold a different opinion, are yet near neighbours, being involved in like error. For those men, indeed, either profess that Christ came into our life a mere man, and deny the talent of His divinity, or else, acknowledging Him to be God, they deny, on the other hand, His humanity, and teach that His appearances to those who saw Him as man were illusory, inasmuch as He did not bear with Him true manhood, but was rather a kind of phantom manifestation. Of this class are, for example, Marcion and Valentinus, and the Gnostics, who sunder the Word from the flesh, and thus set aside the one talent, viz., the incarnation." },
  { t = "h", level = 3, text = "XI.[^1863]" },
  { t = "note", id = "1863", text = "From a Discourse on “The two Robbers.” In Theodoret’s Third Dialogue, bearing the title “Impassible” (ἀπαθὴς), p. 156." },
  { t = "p", text = "1. The body of the Lord presented both these to the world, the sacred blood and the holy water." },
  { t = "p", text = "2. And His body, though dead after the manner of man, possesses in it great power of life. For streams which flow not from dead bodies flowed forth from Him, viz., blood and water; in order that we might know what power for life is held by the virtue that dwelt in His body, so as that it appears not to be dead like others, and is able to shed forth for us the springs of life." },
  { t = "p", text = "3. And not a bone of the Holy Lamb is broken, this figure showing us that suffering toucheth not His strength. For the bones are the strength of the body." },
]

[[section]]
id = "fragments-from-other-writings-of-hippolytus"
title = "Fragments from Other Writings of Hippolytus."
level = 2
blocks = [
  { t = "h", level = 3, text = "[^1864] I." },
  { t = "note", id = "1864", text = "Preserved by the author of the *Chronicon Paschale*, ex ed. Cangii, p. 6." },
  { t = "p", text = "Now Hippolytus, a martyr for piety, who was bishop of the place called Portus, near Rome, in his book *Against all Heresies*, wrote in these terms:—" },
  { t = "p", text = "I perceive, then, that the matter is one of contention. For he[^1865] speaks thus: Christ kept the supper, then, on that day, and then suffered; whence it is needful that I, too, should keep it in the same manner as the Lord did. But he has fallen into error by not perceiving that at the time when Christ suffered He did not eat the passover of the law.[^1866] For He was the passover that had been of old proclaimed, and that was fulfilled on that determinate day." },
  { t = "note", id = "1865", text = "i.e., the opponent of Hippolytus, one of the forerunners of the Quartodecimans." },
  { t = "note", id = "1866", text = "[For *pro & con* see *Speaker’s Com*., note to Matt. xxvi.]" },
  { t = "h", level = 3, text = "II." },
  { t = "h", level = 3, text = "From the same." },
  { t = "p", text = "And again the same (authority), in the first book of his treatise on the Holy Supper, speaks thus:—" },
  { t = "p", text = "Now that neither in the first nor in the last there was anything false is evident; for he who said of old, “I will not any more eat the passover,”[^1867] probably partook of supper before the passover. But the passover He did not eat, but He suffered; for it was not the time for Him to eat." },
  { t = "note", id = "1867", text = "Luke xxii. 16." },
  { t = "h", level = 3, text = "III.[^1868]" },
  { t = "note", id = "1868", text = "From a Letter of Hippolytus to a certain queen. In Theodoret’s Dial. II., bearing the title “Unmixed” (ἀσύγχυτος), and Dial. III., entitled “Impassible” (ἀπαθης) [pp. 238–239 *supra*]." },
  { t = "p", text = "Hippolytus, Bishop and Martyr, in a letter to a certain queen.[^1869]" },
  { t = "note", id = "1869", text = "On the question as to who this queen was, see Stephen le Moyne, in notes to the *Varia Sacra*, pp. 1103, 1112. In the marble monument mention is made of a letter of Hippolytus to Severina. [Bunsen decides that she was only a princess, a daughter of Alexander Severus. See his *Hippolytus*, i. p. 276.]" },
  { t = "p", text = "1. He calls Him, then, “the first-fruits of them that sleep,”[^1870] as the “first-begotten of the dead.”[^1871] For He, having risen, and being desirous to show that that same (body) had been raised which had also died, when His disciples were in doubt, called Thomas to Him, and said, “Reach hither; handle me, and see: for a spirit hath not bone and flesh, as ye see me have.”[^1872]" },
  { t = "note", id = "1870", text = "1 Cor. xv. 20." },
  { t = "note", id = "1871", text = "Col. i. 18." },
  { t = "note", id = "1872", text = "John xx. 27; Luke xxiv. 39." },
  { t = "p", text = "2. In calling Him *the first-fruits*, he testified to that which we have said, viz., that the Saviour, taking to Himself the flesh out of the same lump, raised this same flesh, and made it the first-fruits of the flesh of the righteous, in order that all we who have believed in the hope of the Risen One may have the resurrection in expectation." },
  { t = "h", level = 3, text = "The story of a maiden of Corinth, and a certain Magistrianus." },
  { t = "h", level = 3, text = "The account given by Hippolytus, the friend of the apostles.[^1873]" },
  { t = "note", id = "1873", text = "Extract in Palladius, *Historia Lausiaca*, chap. cxlviii.; Gallandi, *Biblioth*., ii. 513." },
  { t = "p", text = "In another little book bearing the name of Hippolytus, the friend of the apostles, I found a story of the following nature:—" },
  { t = "p", text = "There lived a certain most noble and beautiful maiden[^1874] in the city of Corinth, in the careful exercise of a virtuous life. At that time some persons falsely charged her before the judge there, who was a Greek, with cursing the times, and the princes, and the images. Now those who trafficked in such things, brought her beauty under the notice of the impious judge, who lusted after women. And he gladly received the accusation with his equine ears and lascivious thoughts. And when she was brought before the bloodstained (judge), he was driven still more frantic with profligate passion. But when, after bringing every device to bear upon her, the profane than could not gain over this woman of God, he subjected the noble maiden to various outrages. And when he failed in these too, and was unable to seduce her from her confession of Christ, the cruel judge became furious against her, and gave her over to a punishment of the following nature: Placing the chaste maiden in a brothel, he charged the manager, saying, Take this woman, and bring me three nummi by her every day. And the man, exacting the money from her by her dishonour, gave her up to any who sought her in the brothel. And when the women-hunters knew that, they came to the brothel, and, paying the price put upon their iniquity, sought to seduce her. But this most honourable maiden, taking counsel with herself to deceive them, called them to her, and earnestly besought them, saying: I have a certain ulceration of the *pudenda*, which has an extremely hateful stench; and I am afraid that ye might come to hate me on account of the abominable sore. Grant me therefore a few days, and then ye may have me even for nothing. With these words the blessed maiden gained over the profligates, and dismissed them for a time.[^1875] And with most fitting prayers she importuned God, and with contrite supplications she sought to turn Him to compassion. God, therefore, who knew her thoughts, and understood how the chaste maiden was distressed in heart for her purity, gave ear to her; and the Guardian of the safety of all men in those days interposed with His arrangements in the following manner:—" },
  { t = "note", id = "1874", text = "Nicephorus also mentions her in his *Hist. Eccl*., vii. 13." },
  { t = "note", id = "1875", text = "[On the morality of this, see vol. ii. pp. 538, 556.]" },
  { t = "h", level = 3, text = "Of a certain person Magistrianus.[^1876]" },
  { t = "note", id = "1876", text = "From the same, chap. cxlix." },
  { t = "p", text = "There was a certain young man, Magistrianus,[^1877] comely in his personal appearance, and of a pious mind, whom God had inspired with such a burning spiritual zeal, that he despised even death itself. He, coming under the guise of profligacy, goes in, when the evening was far gone, to the fellow who kept the women, and pays him five nummi, and says to him, Permit me to spend this night with this damsel. Entering then with her into the private apartment, he says to her, Rise, save thyself. And taking off her garments, and dressing her in his own attire, his night-gown, his cloak, and all the habiliments of a man, he says to her, Wrap yourself up with the top of your cloak, and go out; and doing so, and signing herself entirely with the mystery of the cross, she went forth uncorrupted from that place, and was preserved perfectly stainless by the grace of Christ, and by the instrumentality of the young man, who by his own blood delivered her from dishonour. And on the following day the matter became known, and Magistrianus was brought before the infuriated judge. And when the cruel tyrant had examined the noble champion of Christ, and had learned all, he ordered him to be thrown to the wild beasts,—that in this, too, the honour-hating demon might be put to shame. For, whereas he thought to involve the noble youth in an unhallowed punishment, he exhibited him as a double martyr for Christ, inasmuch as he had both striven nobly for his own immortal soul, and persevered manfully in labours also in behalf of that noble and blessed maiden. Wherefore also he was deemed worthy of double honour with Christ, and of the illustrious and blessed crowns by His goodness." },
  { t = "note", id = "1877", text = "Nicephorus gives this story also, *Hist. Eccl.*, vii. 13." },
]

[[section]]
id = "elucidation"
title = "Elucidation."
level = 2
blocks = [
  { t = "p", text = "The conduct of Father Abraham, although not approved of by Inspiration, but simply recorded (Gen. xxvi. 7), gave early Christians an opinion that the wicked may be justly foiled, by equivocation and deception, for the preservation of innocence or the life of the innocent. In such case the person deceived, they might argue, is not injured, but benefited (Gen. xxvi. 10), being saved from committing violence and murder. The Corinthian maiden was accustomed to be veiled (as Tertullian intimates), and was taught alike to cherish her own purity and to have no share in affording occasion of sin to others. See vol. iv. pp. 32, 33. Let us call this narrative “The Story of Corinthia and Magistrianus.”" },
]

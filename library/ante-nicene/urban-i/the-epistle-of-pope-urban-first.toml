[[section]]
id = "preface"
title = "Preface."
level = 1
blocks = [
  { t = "h", text = "The Epistle of Pope Urban First.[^2762]" },
  { t = "note", id = "2762", text = "Urban was the successor of Callistus. The letter ascribed to him is one of the pseudo-Isidorian forgeries." },
  { t = "h", text = "To All Christians." },
  { t = "p", text = "*Of the church’s receiving only the property of the faithful, and not the price of the same, as in the times of the apostles; and as to why elevated seats should be prepared in the churches for the bishops; and as to the fact that no one should have intercourse with those whom the bishops excommunicate, and that no one should receive those whom they have cast out in any manner whatever.*[^2763]" },
  { t = "note", id = "2763", text = "Mansi, *Concil. Collect*., i. p. 748." },
  { t = "p", text = "Urban, bishop, to all Christians, in sanctification of the spirit, in obedience and sprinkling of the blood of Jesus Christ our Lord, greeting." },
  { t = "p", text = "It becomes all Christians, most dearly beloved, to imitate Him whose name they have received. “What doth it profit, my brethren,” says the Apostle James, “though a man say he hath faith, and have not works?”[^2764] “My brethren, be not many masters, knowing that ye receive (*sumitis*) the greater condemnation; for in many things we offend all.”[^2765] “Let him who is a wise man, and endued with knowledge among you, show out of a good conversation his works with meekness of wisdom.”[^2766]" },
  { t = "note", id = "2764", text = "Jas ii. 14." },
  { t = "note", id = "2765", text = "Jas. iii. 1, 2." },
  { t = "note", id = "2766", text = "Jas. iii. 13." },
]

[[section]]
id = "part-1"
title = "Part I. Of the life in common, and of the reason why the Church has begun to hold property."
level = 1
blocks = [
  { t = "p", text = "We know that you are not ignorant of the fact that hitherto the principle of living with all things in common has been in vigorous operation among good Christians, and is still so by the grace of God; and most of all among those who have been chosen to the lot of the Lord, that is to say, the clergy, even as we read in the Acts of the Apostles: “And the multitude of them that believed were of one heart and of one soul: neither said any of them that ought of the things which he possessed was his own; but they had all things common. And with great power gave the apostles witness of the resurrection of Jesus Christ: and great grace was upon them all. Neither was there any among them that lacked: for as many as were possessors of lands or houses sold them, and brought the prices of the things that were sold, and laid them down at the apostles’ feet: and distribution was made unto every man according as he had need. And Joseph, who by the apostles was surnamed Barnabas (which is, being interpreted, the son of consolation), a Levite, and of the country of Cyprus, having land, sold it, and brought the money, and laid it at the apostles’ feet;”[^2767] and so forth. Accordingly, as the chief priests and others, and the Levites, and the rest of the faithful, perceived that it might be of more advantage if they handed over to the churches over which the bishops presided the heritages and fields which they were in the way of selling, inasmuch as they might furnish a larger and better maintenance for the faithful who hold the common faith, not only in present but also in future times, out of the revenues of such property than out of the money for which they might at once be sold, they began to consign to the mother churches the property and lands which they were wont to sell, and got into the manner of living on the revenues of these." },
  { t = "note", id = "2767", text = "Acts iv. 32–37." },
]

[[section]]
id = "part-2"
title = "Part II. Of the persons by whom, and the uses for which, ecclesiastical property should be managed, and of the invaders thereof."
level = 1
blocks = [
  { t = "p", text = "The property, moreover, in the possession of the several parishes was left in the hands of the bishops, who hold the place of the apostles; and it is so to this day, and ought to be so in all future time. And out of those possessions the bishops and the faithful as their stewards ought to furnish to all who wish to enter the life in common all necessaries as they best can, so that none may be found in want among them. For the possessions of the faithful are also called oblations, because they are offered to the Lord. They ought not therefore to be turned to any other uses than those of the Church, and in behoof of Christian brethren before mentioned, and of the poor; for they are the offerings of the faithful, and they are redemption moneys for sins (*pretia peccatorum*), and the patrimony of the poor, and are given over to the Lord for the purpose already named. But if any one act otherwise (which may God forbid), let him take care lest he meet the condemnation of Ananias and Sapphira, and be found guilty of sacrilege, as those were who lied as to the price of the property designated, of whom we read thus in the before-cited passage of the Acts of the Apostles: “But a certain man named Ananias, with Sapphira his wife, sold land (*agrum*), and kept back part of the price, his wife also being privy to it, and brought a certain part, and laid it at the apostles’ feet. But Peter said to Ananias, Why hath Satan tempted (*tentavit*) thine heart to lie to the Holy Ghost, and to keep back part of the price of the land? Whilst it remained, was it not thine own? and after it was sold, was it not in thine own power? Why hast thou conceived this thing in thine heart? Thou hast not lied unto men, but unto the Lord. And Ananias, hearing these words, fell down, and gave up the ghost. And great fear came on all them that heard *these things*. And the young men arose, and removed him (*amoverunt*), and carried him out, and buried him. And it was about the space of three hours after, when his wife, not knowing what was done, came in. And Peter answered unto her, and said, Tell me whether ye sold the land for so much? And she said, Yea, for so much. Then Peter said unto her, How is it that ye have agreed together to tempt the Spirit of the Lord? Behold, the feet of them which have buried thy husband are at the door, and shall carry thee out. Then fell she down straightway at his feet, and yielded up the ghost. And the young men came in, and found her dead, and, carrying her forth, buried her by her husband. And great fear came upon all the Church, and upon as many as heard these things.”[^2768] These things, brethren, are carefully to be guarded against, and greatly to be feared. For the property of the Church, not being like personal, but like common property, and property offered to the Lord, is to be dispensed with the deepest fear, in the spirit of faithfulness, and for no other objects than the above-named, lest those should incur the guilt of sacrilege who divert it from the hands to which it was consigned, and lest they should come under the punishment and death of Ananias and Sapphira, and lest (which is yet worse) they should become anathema maranatha, and lest, though their body may not fall dead like that of Ananias and Sapphira, their soul, which is nobler than the body, should fall dead, and be cut off from the company of the faithful, and sink into the depths of the pit. Wherefore all must give heed to this matter, and watch in faithfulness, and avert the dishonour of such usurpation, lest possessions dedicated to the uses of things secret (or sacred) and heavenly be spoiled by any parties invading them. And if any one do so, then, after the sharp vengeance which is due to such a crime, and which is justly to be carried out against the sacrilegious, let him be condemned to perpetual infamy, and cast into prison or consigned to life-long exile. For, according to the apostle,[^2769] we ought to deliver such a man to Satan, that the spirit may be saved in the day of the Lord." },
  { t = "note", id = "2768", text = "Acts v. 1–11." },
  { t = "note", id = "2769", text = "1 Cor. v. 5." },
]

[[section]]
id = "part-3"
title = "Part III. As to any one's attempting to take from the Church the right of holding property."
level = 1
blocks = [
  { t = "p", text = "By the increase, therefore, and the mode of life which have been mentioned, the churches over which the bishops preside have grown so greatly with the help of the Lord, and the greater part of them are now in possession of so much property, that among them there is not a man who, selecting the life in common, is kept in poverty; but such an one receives all necessaries from the bishop and his ministers. Therefore, if any one in modern or in future time shall rise up and attempt to divert that property, let him be smitten with the judgment which has been already mentioned." },
]

[[section]]
id = "part-4"
title = "Part IV. Of the seats of the bishops."
level = 1
blocks = [
  { t = "p", text = "Furthermore, as to the fact that in the churches of the bishops there are found elevated seats set up and prepared like a throne, they show by these that the power of inspection and of judging, and the authority to loose and bind, are given to them by the Lord. Whence the Saviour Himself says in the Gospel, “Whatsoever ye shall bind on earth shall be bound in heaven; and whatsoever ye shall loose on earth shall be loosed in heaven.”[^2770] And elsewhere: “Receive ye the Holy Ghost. Whose soever sins ye remit, are remitted unto them; and whose soever sins ye retain, they are retained.”[^2771]" },
  { t = "note", id = "2770", text = "Matt. xviii. 18." },
  { t = "note", id = "2771", text = "John xx. 22, 23." },
]

[[section]]
id = "part-5"
title = "Part V. That no one should have intercourse with those with whom the bishop has no intercourse, or receive those whom he rejects."
level = 1
blocks = [
  { t = "p", text = "These things, then, we have set before you, most dearly beloved, in order that ye may understand the power of your bishops, and give reverence to God in them, and love them as your own souls; and in order that ye may have no communication with those with whom they have none, and that ye may not receive those whom they have cast out. For the judgment of a bishop is greatly to be feared, although he may bind one unjustly, which, however, he ought to guard against with the utmost care." },
]

[[section]]
id = "part-6"
title = "Part VI. Of the engagement made in baptism, and of those who have given themselves to the life in common."
level = 1
blocks = [
  { t = "p", text = "And in exhorting you, we also admonish all who have embraced the faith of Christ, and who have taken from Christ the name of Christian, that ye make your Christianity vain in no respect, but keep stedfastly the engagement which ye took upon yourselves in baptism, so that ye may be found not reprobate, but worthy in His presence. And if any one of you has entered the life which has all things common, and has taken the vow to hold no private property, let him see to it that he make not his promise vain, but let him keep with all faithfulness this engagement which he has made to the Lord, so that he may acquire for himself not damnation, but a reward; for it is better for a man not to take a vow at all than not to discharge to the best of his ability the vow that he has made. For they who have made a vow, or taken on them the faith, and have not kept their vow, or have carried out their life in things evil, are punished more severely than those who have carried out their life without a vow, or have died without faith, but not without doing good works. For to this end have we received a reasonable mind by the gift of nature, and the renewal also of the second birth, that, according to the apostle, we may discern (*sapiamus*) rather things above, and not things on the earth;[^2772] for the wisdom of this world is foolishness with God.[^2773] For to what, most dearly beloved, does the wisdom of this world urge us, but to seek things that are hurtful, and to love things that are to perish, and to neglect things that are healthful, and to esteem as of no value things that are lasting? It commends the love of money, of which it is said, The love of money is the root of all evil;[^2774] and which has this evil in especial, that while it obtrudes the transitory, it hides from view the eternal; and while it looks on things that are outside, it does not look in upon things that lurk within; and while it seeks after strange things, it is an evil that makes itself strange to him who does it.[^2775] Behold, to what does the wisdom of this world urge a man? To live in pleasures. Whence it is said: A widow that liveth in pleasure, is dead while she liveth.[^2776] It urges a man to feed the flesh with the softest delights, with sins, and vices, and flames, to press the soul with intemperance in food and wine, and to check the life of the spirit, and to put into his enemy’s hand the sword to be used against himself. Behold, what is the counsel which the wisdom of this world gives? That those who are good should choose rather to be evil, and that in error of mind they should be zealous to be sinners, and should not bethink themselves of that terrible voice of God, when the wicked shall be burned up like grass.[^2777]" },
  { t = "note", id = "2772", text = "Col. iii. 2." },
  { t = "note", id = "2773", text = "1 Cor. iii. 19." },
  { t = "note", id = "2774", text = "1 Tim. vi. 10." },
  { t = "note", id = "2775", text = "“Sectatori,” for which read “factori.”" },
  { t = "note", id = "2776", text = "1 Tim. v. 6." },
  { t = "note", id = "2777", text = "Ps. xcii. 7." },
]

[[section]]
id = "part-7"
title = "Part VII. Of the imposition of the bishop's hand."
level = 1
blocks = [
  { t = "p", text = "For all the faithful ought to receive the Holy Spirit after baptism by imposition of the hand of the bishops, so that they may be found to be Christians fully; because when the Holy Spirit is shed upon them, the believing heart is enlarged for prudence and stedfastness. We receive of the Holy Spirit in order that we may be made spiritual; for the natural man receiveth not the things of the Spirit of God.[^2778] We receive of the Holy Spirit in order that we may be wise to discern between good and evil, to love the just, and to loathe the unjust, so as to withstand malice and pride, and resist luxury and divers allurements, and impure and unworthy lust. We receive of the Holy Spirit in order that, fired with the love of life and the ardour of glory, we may be able to raise our mind from things earthly to things heavenly and divine.—Given on the Nones of September,—that is, on the fifth day of the same month, in the consulship of the most illustrious Antonine and Alexander." },
  { t = "note", id = "2778", text = "1 Cor. ii. 14." },
]

[[section]]
id = "quadratus-bishop-of-athens"
title = "Quadratus, Bishop of Athens."
level = 1
blocks = [
  { t = "h", text = "Remains of the Second and Third Centuries." },
  { t = "h", text = "Quadratus, Bishop of Athens.[^3530]" },
  { t = "note", id = "3530", text = "But see Lightfoot, *A. F*., part ii. vol. i. p. 524." },
  { t = "p", text = "[a.d. 126.] Quadratus[^3531] is spoken of by Eusebius as a “man of understanding and of Apostolic faith.” And he celebrates Aristides as a man of similar character. These were the earliest apologists; both addressed their writings to Hadrian, and they were extant and valued in the churches in the time of Eusebius." },
  { t = "note", id = "3531", text = "On Quadratus and Aristides, consult Routh, *R. S*., p. 71; also Westcott, *On the Canon*, p. 92." },
  { t = "p", text = "From the Apology for the Christian Religion.[^3532]" },
  { t = "note", id = "3532", text = "In Eusebius, *Hist. Eccl*., iv. 3." },
  { t = "p", text = "Our Saviour’s works, moreover, were always present: for they were real, *consisting of* those who had been healed of their diseases, those who had been raised from the dead; who were not only seen whilst they were being healed and raised up, but were *afterwards* constantly present. Nor did they remain only during the sojourn of the Saviour *on earth*, but also a considerable time after His departure; and, indeed, some of them have survived even down to our own times.[^3533]" },
  { t = "note", id = "3533", text = "[Westcott supposes the *Diognetus* of Mathetes (vol. i. p. 23) may be the work of Quadratus; *Canon*, p. 96.]" },
]

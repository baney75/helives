[[section]]
id = "testimony-xii-that-we-must-not-swear"
title = "Testimony XII. That we must not swear."
level = 2
blocks = [
  { t = "p", text = "12. That we must not swear." },
  { t = "p", text = "In Solomon: “A man that sweareth much shall be filled with iniquity, and the plague shall not depart from his house; and if he swear vainly, he shall not be justified.”[^4265] Of this same matter, according to Matthew: “(Again, ye have heard that it was said to them of old, Thou shalt not swear falsely, but shalt perform unto the Lord thine oaths.) I say unto you, Swear not at all: (neither by heaven, because it is God’s throne; nor by the earth, because it is His footstool; nor by Jerusalem, because it is the city of the great King; neither shalt thou swear by thy head, because thou canst not make one hair white or black.) But let your discourse be, Yea, yea; Nay, nay: (for whatever is fuller than these is of evil.”)[^4266] Of this same thing in Exodus: “Thou shalt not take the name of the Lord thy God in vain.”[^4267]" },
  { t = "note", id = "4265", text = "Ecclus. xxiii. 11. From some ancient text the Oxford edition adds here, “Et si frustra juraverit dupliciter punietur”—“and if he swear with no purpose, he shall be punished doubly.”" },
  { t = "note", id = "4266", text = "Matt. v. 34–37. All these passages are wanting in the Oxford text; [also in ed. Paris, 1574]." },
  { t = "note", id = "4267", text = "Ex. xx. 7. [Compare old Paris ed. on this section.]" },
]

[[section]]
id = "testimony-xiii-that-we-must-not-curse"
title = "Testimony XIII. That we must not curse."
level = 2
blocks = [
  { t = "p", text = "13. That we must not curse." },
  { t = "p", text = "In Exodus: “Thou shalt not curse nor speak ill of the ruler of thy people.”[^4268] Also in the thirty-third Psalm: “Who is the man who desires life, and loveth to see good days? Restrain thy tongue from evil, and thy lips that they speak no guile.”[^4269] Of this same thing in Leviticus: “And the Lord spoke to Moses, saying, Bring forth him who hath cursed abroad outside the camp; and all who heard him shall place their hands upon his head, and all the assembly of the children of Israel shall stone him.”[^4270] Of this same thing in Paul’s Epistle to the Ephesians: “Let no evil discourse proceed out of your mouth, but that which is good for the edification of faith, that it may give grace to the hearers.”[^4271] Of this same thing to the Romans: “Blessing, and not cursing.”[^4272] Of this same thing in the Gospel according to Matthew: “He who shall say to his brother, Thou fool! shall be liable to the Gehenna of fire.”[^4273] Of this same matter, according to the same Matthew: “But I say unto you, That every idle word which men shall speak, they shall give account for it in the day of judgment. For by thy words thou shalt be justified, and by thy words thou shalt be condemned.”[^4274]" },
  { t = "note", id = "4268", text = "Ex. xxii. 28." },
  { t = "note", id = "4269", text = "Ps. xxxiv. 12, 13." },
  { t = "note", id = "4270", text = "Lev. xxiv. 13, 14." },
  { t = "note", id = "4271", text = "Eph. iv. 29." },
  { t = "note", id = "4272", text = "Rom. xii. 14." },
  { t = "note", id = "4273", text = "Matt. v. 22." },
  { t = "note", id = "4274", text = "Matt. xii. 36, 37." },
]

[[section]]
id = "testimony-xiv-that-we-must-never-murmur"
title = "Testimony XIV. That we must never murmur, but bless God concerning all things that happen."
level = 2
blocks = [
  { t = "p", text = "14. That we must never murmur, but bless God concerning all things that happen." },
  { t = "p", text = "In Job: “Say some word against the Lord, and die. But he, looking upon her, said, Thou speakest as one of the foolish women. If we have received good things from the Lord’s hand, why shall we not endure evil things? In all these things which happened unto him, Job sinned not with his lips in the sight of the Lord.”[^4275] Also in the same place: “Hast thou regarded my servant Job? for there is none like unto him in the earth: a man without complaint: a true worshipper of God, restraining himself from all evil.”[^4276] Of the same thing in the thirty-third Psalm: “I will bless the Lord at all times: His praise shall ever be in my mouth.”[^4277] Of this same thing in Numbers: “Let their murmuring cease from me, and they shall not die.”[^4278] Of this same thing in the Acts of the Apostles: “But about the middle of the night Paul and Silas prayed and gave thanks to God, and the prisoners heard them.”[^4279] Also in the Epistle of Paul to the Philippians: “But doing all things for love, without murmurings and revilings,[^4280] that ye may be without complaint, and spotless sons of God.”[^4281]" },
  { t = "note", id = "4275", text = "Job ii. 9, 10." },
  { t = "note", id = "4276", text = "Job i. 8." },
  { t = "note", id = "4277", text = "Ps. xxxiv. 1." },
  { t = "note", id = "4278", text = "Num. xvii. 10." },
  { t = "note", id = "4279", text = "Acts xvi. 25." },
  { t = "note", id = "4280", text = "Reputationibus; possibly “complainings.”" },
  { t = "note", id = "4281", text = "Phil. ii. 14, 15." },
]

[[section]]
id = "testimony-xv-that-men-are-tried-by"
title = "Testimony XV. That men are tried by God for this purpose, that they may be proved."
level = 2
blocks = [
  { t = "p", text = "15. That men are tried by God for this purpose, that they may be proved." },
  { t = "p", text = "In Genesis: “And God, tempted Abraham, and said to him, Take thy only son whom thou lovest, Isaac, and go into the high land, and offer him there as a burnt-offering on one of the mountains of which I will tell thee.”[^4282] Of this same thing in Deuteronomy: “The Lord your God proveth you, that He may know if ye love the Lord your God with all your heart, and with all your soul.”[^4283] Of this same thing in the Wisdom of Solomon: “Although in the sight of men they suffered torments, their hope is full of immortality; and having been in few things distressed, yet in many things they shall be happily ordered, because God tried them, and found them worthy of Himself. As gold in the furnace He proved them, and as a burnt-offering He received them. And in their time there shall be respect of them; they shall judge the nations, and shall rule over the people; and their Lord shall reign for ever.”[^4284] Of this same thing in the Maccabees: “Was not Abraham found faithful in temptation, and it was accounted unto him for righteousness?”[^4285]" },
  { t = "note", id = "4282", text = "Gen. xxii. 1, 2." },
  { t = "note", id = "4283", text = "Deut. xiii. 3." },
  { t = "note", id = "4284", text = "Wisd. iii. 4–8." },
  { t = "note", id = "4285", text = "1 Macc. ii. 52." },
]

[[section]]
id = "testimony-xvi-of-the-benefits-of-martyrdom"
title = "Testimony XVI. Of the benefits of martyrdom."
level = 2
blocks = [
  { t = "p", text = "16. Of the benefits of martyrdom." },
  { t = "p", text = "In the Proverbs of Solomon: “The faithful martyr delivers his soul from evils.”[^4286] Also in the same place: “Then shall the righteous stand in great boldness against them who have afflicted them, and who took away their labours. When they see them, they shall be disturbed with a horrible fear; and they shall wonder at the suddenness of their unhoped-for salvation, saying among themselves, repenting and groaning with distress of spirit, These are they whom some time we had in derision, and in the likeness of a proverb; we fools counted their life madness, and their end without honour. How are they reckoned among the children of God, and their lot among the saints! Therefore we have wandered from the way of truth, and the light of righteousness has not shined upon us, and the sun has not risen upon us. We have been wearied in the way of iniquity and of perdition, and we have walked through difficult solitudes; but we have not known the way of the Lord. What hath pride profited us? or what hath the boasting of riches brought to us? All these things have passed away as a shadow.”[^4287] Of this same thing in the cxvth Psalm: “Precious in the sight of the Lord is the death of His saints.”[^4288] Also in the cxxvth Psalm: “They who sow in tears shall reap in joy. Walking they walked, and wept as they cast their seeds; but coming they shall come in joy, raising up their laps.”[^4289] Of this same thing in the Gospel according to John: “He who loveth his life shall lose it; and he that hateth his life in this world shall find it to life eternal.”[^4290] Also in the same place: “But when they shall deliver you up, take no thought what ye shall speak; for it is not ye who speak, but the Spirit of your Father which speaketh in you.”[^4291] Also in the same place: “The hour shall come, that every one that killeth you shall think he doeth service to God; but they shall do this also because they have not known the Father nor me.”[^4292] Of this same matter, according to Matthew: “Blessed are they which shall suffer persecution for righteousness’ sake; for theirs is the kingdom of heaven.”[^4293] Also in the same place: “Fear not them which kill the body, but are not able to kill the soul; but rather fear Him which is able to kill the soul and body in Gehenna.”[^4294] Also in the same place: “Whosoever shall confess me before men, him also will I confess before my Father which is in heaven; but he who shall deny me before men, him also will I deny before my Father which is in heaven. And he that shall endure to the end, the same shall be saved.”[^4295] Of this same thing, according to Luke: “Blessed shall ye be when men shall hate you, and shall separate you (from their company), and shall drive you out, and shall speak evil of your name, as wicked, for the Son of man’s sake. Rejoice in that day, and exult; for, lo, your reward is great in heaven.”[^4296] Also in the same place: “Verily I say unto you, There is no man that leaveth house, or parents, or brethren, or wife, or children, for the sake of the kingdom of God, and does not receive seven times as much in this present time, but in the world to come life everlasting.”[^4297] Of this same thing in the Apocalypse: “And when he had opened the fifth seal, I saw under the altar of God the souls of them that were slain on account of the word of God and His testimony. And they cried with a loud voice, saying, How long, O Lord, holy and true, dost Thou not judge and avenge our blood on them that dwell on the earth? And unto every one of them were given white robes; and it was said to them, that they should rest still for a short time, until the number of their fellow-servants, and of their brethren, should be fulfilled, and they who shall afterwards be slain, after their example.”[^4298] Also in the same place: “After these things I saw a great crowd, which no one among them could number, from every nation, and from every tribe, and from every people and tongue, standing before the throne and before the Lamb; and they were clothed with white robes, and palms were in their hands. And they said with a loud voice, Salvation to our God, that sitteth upon the throne, and to the Lamb. And one of the elders answered and said to me, What are these which are clothed with white robes? who are they, and whence have they come? And I said unto him, My lord, thou knowest. And he said unto me, These are they who have come out of great tribulation, and have washed their robes, and made them white in the blood of the Lamb. Therefore they are before the throne of God, and serve Him day and night in His temple; and He who sitteth upon the throne shall dwell among them. They shall neither hunger nor thirst ever; and neither shall the sun fall upon them, nor shall they suffer any heat: for the Lamb who is in the midst of the throne shall protect them, and shall lead them to the fountains of the waters of life; and God shall wipe away every tear from their eyes.”[^4299] Also in the same place: “He who shall overcome I will give him to eat of the tree of life, which is in the paradise of my God.”[^4300] Also in the same place: “Be thou faithful even unto death, and I will give thee a crown of life.”[^4301] Also in the same place: “Blessed shall they be who shall watch, and shall keep their garments, lest they walk naked, and they see their shame.”[^4302] Of this same thing, Paul in the second Epistle to Timothy: “I am now offered up, and the time of my assumption is at hand. I have fought a good fight, I have finished my course, I have kept the faith. There now remains for me a crown of righteousness, which the Lord, the righteous Judge, will give me in that day; and not only to me, but to all also who love His appearing.”[^4303] Of this same thing to the Romans: “We are the sons of God: but if sons and heirs of God, we are also joint-heirs with Christ; if we suffer together, that we may also be magnified together.”[^4304] Of this same thing in the cxviiith Psalm: “Blessed are they who are undefiled in the way, and walk in the law of the Lord. Blessed are they who search into His testimonies.”[^4305]" },
  { t = "note", id = "4286", text = "Prov. xiv. 25." },
  { t = "note", id = "4287", text = "Wisd. v. 1–9." },
  { t = "note", id = "4288", text = "Ps. cxvi. 5." },
  { t = "note", id = "4289", text = "Ps. cxxvi. 5, 6." },
  { t = "note", id = "4290", text = "John xii. 25." },
  { t = "note", id = "4291", text = "Matt. x. 19, 20." },
  { t = "note", id = "4292", text = "John xvi. 2, 3." },
  { t = "note", id = "4293", text = "Matt. v. 10." },
  { t = "note", id = "4294", text = "Matt. x. 28." },
  { t = "note", id = "4295", text = "Matt. x. 32, 33." },
  { t = "note", id = "4296", text = "Luke vi. 22, 23." },
  { t = "note", id = "4297", text = "Luke xviii. 29, 30." },
  { t = "note", id = "4298", text = "Rev. vi. 9–11." },
  { t = "note", id = "4299", text = "Rev. vii. 9–17." },
  { t = "note", id = "4300", text = "Rev. ii. 7." },
  { t = "note", id = "4301", text = "Rev. ii. 10." },
  { t = "note", id = "4302", text = "Rev. xvi. 15." },
  { t = "note", id = "4303", text = "2 Tim. iv. 6–8." },
  { t = "note", id = "4304", text = "Rom. viii. 16, 17." },
  { t = "note", id = "4305", text = "Ps. cxix. 1, 2." },
]

[[section]]
id = "testimony-xvii-that-what-we-suffer-in"
title = "Testimony XVII. That what we suffer in this world is of less account than is the reward which is promised."
level = 2
blocks = [
  { t = "p", text = "17. That what we suffer in this world is of less account than is the reward which is promised." },
  { t = "p", text = "In the Epistle of Paul to the Romans: “The sufferings of this present time are not worthy of comparison with the glory that is to come after, which shall be revealed in us.”[^4306] Of this same thing in the Maccabees: “O Lord, who hast the holy knowledge, it is manifest that while I might be delivered from death, I am suffering most cruel pains of body, being beaten with whips; yet in spirit I suffer these things willingly, because of the fear of thine own self.”[^4307] Also in the same place: “Thou indeed, being powerless, destroyest us out of this present life; but the King of the world shall raise us up who have died for His laws into the eternal resurrection of life.”[^4308] Also in the same place: “It is better that, given up to death by men, we should expect hope from God to be raised again by Him. For there shall be no resurrection to life for thee.”[^4309] Also in the same place: “Having power among men, although thou art corruptible, thou doest what thou wilt. But think not that our race is forsaken of God. Sustain, and see how His great power will torment thee and thy seed.”[^4310] Also in the same place: Do not err without cause; for we suffer these things on our own accounts, as sinners against our God. But think not thou that thou shalt be unpunished, having undertaken to fight against God.”[^4311]" },
  { t = "note", id = "4306", text = "Rom. viii. 18." },
  { t = "note", id = "4307", text = "2 Macc. vi. 30." },
  { t = "note", id = "4308", text = "2 Macc. vii. 9." },
  { t = "note", id = "4309", text = "2 Macc. vii. 14." },
  { t = "note", id = "4310", text = "2 Macc. vii. 16, 17." },
  { t = "note", id = "4311", text = "2 Macc. vii. 18, 19." },
]

[[section]]
id = "testimony-xviii-that-nothing-is-to-be"
title = "Testimony XVIII. That nothing is to be preferred to the love of God and Christ."
level = 2
blocks = [
  { t = "p", text = "18. That nothing is to be preferred to the love of God and Christ." },
  { t = "p", text = "In Deuteronomy: “Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy might.”[^4312] Also in the Gospel according to Matthew: “He that loveth father or mother above me, is not worthy of me; and he that loveth son or daughter above me, is not worthy of me; and he that taketh not up his cross and followeth me, is not my disciple.”[^4313] Also in the Epistle of Paul to the Romans: “Who shall separate us from the love of Christ? shall tribulation, or distress, or persecution, or famine, or nakedness, or peril, or sword? As it is written, Because for thy sake we are killed all the day long, we are counted as sheep for the slaughter. But in all these things we are more than conquerors for His sake who loved us.”[^4314]" },
  { t = "note", id = "4312", text = "Deut. vi. 5." },
  { t = "note", id = "4313", text = "Matt. x. 37, 38." },
  { t = "note", id = "4314", text = "Rom. viii. 35–37." },
]

[[section]]
id = "testimony-xix-that-we-are-not-to"
title = "Testimony XIX. That we are not to obey our own will, but the will of God."
level = 2
blocks = [
  { t = "p", text = "19. That we are not to obey our own will, but the will of God." },
  { t = "p", text = "In the Gospel according to John: “I came not down from heaven to do mine own will, but the will of Him that sent me.”[^4315] Of this same matter, according to Matthew: “Father, if it be possible, let this cup pass from me; nevertheless, not what I will, but what Thou wilt.”[^4316] Also in the daily prayer: “Thy will be done, as in heaven, so in earth.”[^4317] Also according to Matthew: “Not every one who saith unto me, Lord, Lord, shall enter into the kingdom of heaven; but he who doeth the will of my Father which is in heaven, he shall enter into the kingdom of heaven.”[^4318] Also according to Luke: “But that servant which knoweth his Lord’s will, and obeyed not His will, shall be beaten with many stripes.”[^4319] In the Epistle of John: “But he that doeth the will of God abideth for ever, even as He Himself also abideth for ever.”[^4320]" },
  { t = "note", id = "4315", text = "John vi. 38." },
  { t = "note", id = "4316", text = "Matt. xxvi. 39." },
  { t = "note", id = "4317", text = "Matt. vi. 10." },
  { t = "note", id = "4318", text = "Matt. vii. 21." },
  { t = "note", id = "4319", text = "Luke xii. 47." },
  { t = "note", id = "4320", text = "1 John ii. 17." },
]

[[section]]
id = "testimony-xx-that-the-foundation-and-strength"
title = "Testimony XX. That the foundation and strength of hope and faith is fear."
level = 2
blocks = [
  { t = "p", text = "20. That the foundation and strength of hope and faith is fear." },
  { t = "p", text = "In the cxth Psalm: “The fear of the Lord is the beginning of wisdom.”[^4321] Of the same thing in the Wisdom of Solomon: “The beginning of wisdom is to fear God.”[^4322] Also in the Proverbs of the same: “Blessed is the man who reverences all things with fear.”[^4323] Of the same thing in Isaiah: “And upon whom else will I look, except upon him that is lowly and peaceful, and that trembleth at my words?”[^4324] Of this same thing in Genesis: “And the angel of the Lord called him from heaven, and said unto him, Abraham, Abraham: and he said, Here am I. And he said, Lay not thine hand upon the lad, neither do anything unto him: for now I know that thou fearest thy God, and hast not spared thy beloved son for my sake.”[^4325] Also in the second Psalm: “Serve the Lord in fear, and rejoice unto Him in trembling.”[^4326] Also in Deuteronomy, the word of God to Moses: “Call the people together to me, and let them hear my words, that they may learn to fear me all the days that they themselves shall live upon the earth.”[^4327] Also in Jeremiah: “Behold, the days come, saith the Lord, that I will perfect upon the house of Israel, and in the house of Judah, a new covenant: not according to the covenant that I had ordered with their fathers in the day when I laid hold of their hand to bring them out of the land of Egypt; because they have not abode in my covenant, and I have been unmindful of them, saith the Lord; because this is the covenant which I will ordain for the house of Israel; After those days, saith the Lord, I will give my law, and will write it in their mind and I will be to them for a God, and they shall be to me for a people. And they shall not teach every man his brother, saying, Know the Lord: because all shall know me, from the least even to the greatest of them: because I will be favourable to their iniquities, and their sins I will not remember any more. If the heaven should be lifted up on high, saith the Lord, and if the earth should be made low from beneath, yet I will not cast away the people of Israel, saith the Lord, for all the things which they have done. Behold, I will gather them together from every land in which I have scattered them in anger, and in my fury, and in great indignation; and I will grind them down into that place, and I will leave them in fear; and they shall be to me for a people, and I will be to them for a God: and I will give them another way, and another heart, that they may fear me all their days in prosperity with their children: and I will perfect for them an everlasting covenant, which I will not turn away after them; and I will put my fear into their heart, that they may not depart from me: and I will visit upon them to do them good, and to plant them in their land in faith, and with all the heart, and with all the mind.”[^4328] Also in the Apocalypse: “And the four and twenty elders which sit on their thrones in the sight (of God), fell upon their faces, and worshipped God, saying, We give Thee thanks, O Lord God omnipotent, which art and which wast; because Thou hast taken Thy great power, and hast reigned. And the nations were angry, and Thy wrath is come, and the time in which it should be judged concerning the dead, and the reward should be given to Thy servants the prophets, and the saints that fear Thy name, small and great; and to disperse those who have corrupted the earth.”[^4329] Also in the same place: “And I saw another angel flying through the midst of the heaven, having the everlasting Gospel to preach to those who dwell upon the earth, and to all the nations, and tribes, and tongues, and peoples, saying with a loud voice, Fear God, and give Him honour, because the hour of His judgment is come; and adore Him who made the heaven, and the earth, and the sea, and the fountains of waters.”[^4330] Also in the same place: “And I saw as it were a sea of glass mingled with fire; and the beasts were feeding with His lambs;[^4331] and the number of His name a hundred and forty and four, standing upon the sea of glass, having the harps of God; and they sing the song of Moses, the servant of God, and the song of the Lamb, saying, Great and marvellous are Thy works, O Lord God Almighty; just and true are Thy ways, Thou King of the nations. Who would not fear Thee, and give honour to Thy name? for Thou only art holy: and because all nations shall come and worship in Thy sight, because Thy righteousnesses have been made manifest.”[^4332] Also in Daniel: “There was a man dwelling in Babylon whose name was Joachim; and he took a wife by name Susanna, the daughter of Helchias, a very beautiful woman, and one that feared the Lord. And her parents were righteous, and taught their daughter according to the law of Moses.”[^4333] Moreover, in Daniel: “And we are lowly this day in all the earth because of our sins, and there is not at this time any prince, or prophet, or leader, or burnt-offering, or oblation, or sacrifice, or incense, or place to sacrifice before Thee, and to find mercy from Thee. And yet in the soul and spirit of lowliness let us be accepted as the burnt-offerings of rams and bulls, and as it were many thousands of lambs which are fattest. If our offering may be made in Thy presence this day, their power shall be consumed, for they shall not be ashamed who put their trust in Thee. And now we follow with our whole heart, and we fear and seek Thy face. Give us not over unto reproach, but do with us according to Thy tranquillity, and according to the multitude of Thy mercy deliver us.”[^4334] Also in the same place: “And the king exceedingly rejoiced, and commanded Daniel to be taken up out of the den of lions; and the lions had done him no hurt, because he trusted and had believed in his God. And the king commanded, and they brought those men who had accused Daniel; and they cast them in the den of lions, and their wives and their children. And before they had reached the pavement of the den they were seized by the lions, and they brake all their bones in pieces. Then Darius the king wrote, To all peoples, tribes, and languages which are in my kingdom, peace be unto you from my face. I decree and ordain that all those who are in my kingdom shall fear and tremble before the most high God whom Daniel serves, because He is the God who liveth and abideth for ever, and His kingdom shall not pass away, and His dominion goeth on for ever; and He alone doeth signs, and prodigies, and marvellous things in the heaven and the earth, who snatched Daniel from the den of lions.”[^4335] Also in Micah: “Wherewith shall I approach the Lord, and lay hold upon Him? in sacrifices, in burnt-offerings, in calves of a year old? Does the Lord favour and receive me with thousands of fat goats? or shall I give my first-fruits of unrighteousness, the fruit of my belly, the sin of my soul? It is told thee, O man, what is good; or what else the Lord doth require, save that thou shouldst do judgment and justice, and love mercy, and be ready to go with the Lord thy God. The voice of the Lord shall be invoked in the city, and He will save those who fear His name.”[^4336] Also in Micah: “Feed Thy people with Thy rod, the sheep of Thine inheritance; and pluck up those who dwell separately in the midst of Carmel. They shall prepare Bashan and Gilead according to the days of the age; and according to the days of their going forth from the land of Egypt I will show them wonderful things. The nations shall see, and be confounded at all their might; and they shall place their hand upon their mouth. Their ears shall be deafened, and they shall lick the dust as do serpents. Dragging the earth, they shall be disturbed, and they shall lick the dust: in their end they shall be afraid towards the Lord their God, and they shall fear because of Thee. Who is a God as Thou art, raising up unrighteousness, and passing over impiety?”[^4337] And in Nahum: “The mountains were moved at Him, and the hills trembled; and the earth was laid bare before His face, and all who dwell therein. From the face of His anger who shall bear it, and who withstandeth in the fury of His soul? His rage causes the beginnings to flow, and the rocks were melted by Him. The Lord is good to those who sustain Him in the day of affliction, and knoweth those who fear Him.”[^4338] Also in Haggai: “And Zerubbabel the son of Salathiel, of the tribe of Judah, and Jesus the son of Josedech, the high priest, and all who remained of the people, obeyed the voice of the Lord their God, because the Lord sent him to them, and the people feared from the face of God.”[^4339] Also in Malachi: “The covenant was with life and peace; and I gave to them the fear to fear me from the face of my name.”[^4340] Also in the thirty-third Psalm: “Fear the Lord, all ye His saints: for there is no want to them that fear Him.”[^4341] Also in the eighteenth Psalm: “The fear of the Lord is chaste, abiding for ever.”[^4342]" },
  { t = "note", id = "4321", text = "Ps. cxi. 10. [Tertull., vol. iii. 264.]" },
  { t = "note", id = "4322", text = "Ecclus. i. 14." },
  { t = "note", id = "4323", text = "Prov. xxviii. 14." },
  { t = "note", id = "4324", text = "Isa. lxvi. 2." },
  { t = "note", id = "4325", text = "Gen. xxii. 11, 12." },
  { t = "note", id = "4326", text = "Ps. ii. 11. The whole of the remainder of this section, except the two concluding quotations from the Psalms, is wanting in many editions." },
  { t = "note", id = "4327", text = "Deut. iv. 10." },
  { t = "note", id = "4328", text = "Jer. xxxi. 31–41." },
  { t = "note", id = "4329", text = "Rev. xi. 16, 17." },
  { t = "note", id = "4330", text = "Rev. xiv. 16, 17." },
  { t = "note", id = "4331", text = "There is considerable departure here from the Apocalyptic text, for which it is not easy to account. [But this is an interesting fact as bearing upon the question of an original African version made from a family of mss. now extinct.]" },
  { t = "note", id = "4332", text = "Rev. xv. 2–4." },
  { t = "note", id = "4333", text = "Hist. of Susannah 1–3." },
  { t = "note", id = "4334", text = "Song of the Three Children 14–19." },
  { t = "note", id = "4335", text = "Dan. vi. 24–28." },
  { t = "note", id = "4336", text = "Mic. vi. 6–9." },
  { t = "note", id = "4337", text = "Mic. vii. 14–18." },

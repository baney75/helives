[[section]]
id = "testimony-ii-in-works-and-alms-even"
title = "Testimony II. In works and alms, even if by smallness of power less be done, that the will itself is sufficient."
level = 2
blocks = [
  { t = "p", text = "2. In works and alms, even if by smallness of power less be done, that the will itself is sufficient." },
  { t = "p", text = "In the second Epistle of Paul to the Corinthians: “If there be a ready will, it is acceptable according to what a man hath, not according to that which he hath not; nor let there be to others a mitigation, but to you a burdening.[^4183]" },
  { t = "note", id = "4183", text = "2 Cor. viii. 12, 13." },
]

[[section]]
id = "testimony-iii-that-charity-and-brotherly-affection"
title = "Testimony III. That charity and brotherly affection are to be religiously and stedfastly practised."
level = 2
blocks = [
  { t = "p", text = "3. That charity and brotherly affection are to be religiously and stedfastly practised." },
  { t = "p", text = "In Malachi: “Hath not one God created us? Is there not one Father of us all? Why have ye certainly deserted every one his brother?”[^4184] Of this same thing according to John: “Peace I leave with you, my peace I give unto you.”[^4185] Also in the same place: “This is my commandment, That ye love one another, even as I have loved you. Greater love than this has no man, than that one should lay down his life for his friends.”[^4186] Also in the same place: “Blessed are the peacemakers, for they shall be called the sons of God.”[^4187] Also in the same place: “Verily I say unto you, That if two of you shall agree on earth concerning everything, whatever you shall ask it shall be given you from my Father which is in heaven. For wherever two or three are gathered together in my name, I am with them.”[^4188] Of this same thing in the first Epistle to the Corinthians: “And I indeed, brethren, could not speak unto you as to spiritual, but as to carnal, as to babes in Christ. I have given you milk for drink, not meat: for while ye were yet little ye were not able to bear it, neither now are ye able. For ye are still carnal: for where there are in you emulation, and strife, and dissensions, are ye not carnal, and walk after man?”[^4189] Likewise in the same place: “And if I should have all faith, so that I can remove mountains, but have not charity, I am nothing. And if I should distribute all my goods for food, and if I should deliver up my body to be burned, but have not charity, I avail nothing. Charity is great-souled; charity is kind; charity envieth not; charity dealeth not falsely; is not puffed up; is not irritated; thinketh not evil; rejoiceth not in injustice, but rejoiceth in the truth. It loveth all things, believeth all things, hopeth all things, beareth all things. Charity shall never fail.”[^4190] Of this same thing to the Galatians: “Thou shalt love thy neighbour as thyself. But if ye bite and accuse one another, see that ye be not consumed one of another.”[^4191] Of this same thing in the Epistle of John: “In this appear the children of God and the children of the devil. Whosoever is not righteous is not of God, and he who loveth not his brother. For he who hateth his brother is a murderer; and ye know that no murderer hath eternal life abiding in him.”[^4192] Also in the same place: “If any one shall say that he loves God, and hates his brother, he is a liar: for he who loveth not his brother whom he seeth, how can he love God whom he seeth not?”[^4193] Of this same thing in the Acts of the Apostles: “But the multitude of them that had believed acted with one soul and mind: nor was there among them any distinction, neither did they esteem as their own anything of the possessions that they had; but all things were common to them.”[^4194] Of this same thing in the Gospel according to Matthew: If thou wouldest offer thy gift at the altar, and there rememberest that thy brother hath ought against thee; leave thou thy gift before the altar, and go; first be reconciled to thy brother, and then come and offer thy gift at the altar.”[^4195] Also in the Epistle of John: “God is love and he that dwelleth in love dwelleth in God, and God in him.”[^4196] Also in the same place: “He who saith he is in the light, and hateth his brother, is a liar, and walketh in darkness even until now.”[^4197]" },
  { t = "note", id = "4184", text = "Mal. ii. 10." },
  { t = "note", id = "4185", text = "John xiv. 27." },
  { t = "note", id = "4186", text = "John xv. 12, 13." },
  { t = "note", id = "4187", text = "Matt. v. 9." },
  { t = "note", id = "4188", text = "Matt. xviii. 19, 20." },
  { t = "note", id = "4189", text = "1 Cor. iii. 1–3." },
  { t = "note", id = "4190", text = "1 Cor. xiii. 2–8." },
  { t = "note", id = "4191", text = "Gal. v. 14, 15." },
  { t = "note", id = "4192", text = "1 John iii. 10, 15." },
  { t = "note", id = "4193", text = "1 John iv. 20." },
  { t = "note", id = "4194", text = "Acts iv. 32." },
  { t = "note", id = "4195", text = "Matt. v. 23, 24. [I think this harmonizes with Heb. xiii. 10.]" },
  { t = "note", id = "4196", text = "1 John iv. 16." },
  { t = "note", id = "4197", text = "1 John ii. 9." },
]

[[section]]
id = "testimony-iv-that-we-must-boast-in"
title = "Testimony IV. That we must boast in nothing, since nothing is our own."
level = 2
blocks = [
  { t = "p", text = "4. That we must boast in nothing, since nothing is our own." },
  { t = "p", text = "In the Gospel according to John: “No one can receive anything, except it were given him from heaven.”[^4198] Also in the first Epistle of Paul to the Corinthians: “For what hast thou that thou hast not received? But if thou hast received it, why boastest thou, as if thou hadst not received it?”[^4199] Also in the first of Kings: “Boast not, neither speak lofty things, and let not great speeches proceed out of your mouth, for the Lord is a God of knowledge.”[^4200] Also in the same place: “The bow of the mighty men has been made weak, and the weak are girt about with strength.”[^4201] Of this same thing in the Maccabees: “It is just to be subjected to God, and that a mortal should not think things equal to God.”[^4202] Also in the same place: “And fear not the words of a man that is a sinner, because his glory shall be filth and worms. Today he shall be lifted up, and to-morrow he shall not be found; because he is turned into his earth, and his thought has perished.”[^4203]" },
  { t = "note", id = "4198", text = "John iii. 27." },
  { t = "note", id = "4199", text = "1 Cor. iv. 7." },
  { t = "note", id = "4200", text = "1 Sam. ii. 3, 4." },
  { t = "note", id = "4201", text = "1 Sam. ii. 3, 4." },
  { t = "note", id = "4202", text = "2 Macc. ix. 12." },
  { t = "note", id = "4203", text = "1 Macc. ii. 62, 63." },
]

[[section]]
id = "testimony-v-that-humility-and-quietness-are"
title = "Testimony V. That humility and quietness are to be maintained in all things."
level = 2
blocks = [
  { t = "p", text = "5. That humility and quietness are to be maintained in all things." },
  { t = "p", text = "In Isaiah: “Thus saith the Lord God, The heaven is my throne, and the earth is the stool of my feet. What seat will ye build for me, or what is the place for my rest? For all those things hath my hand made, and all those things are mine. And upon whom else will I look, except upon the lowly and quiet man, and him that trembleth at my words?”[^4204] On this same thing in the Gospel according to Matthew: “Blessed are the meek, for they shall inherit the earth.”[^4205] Of this same thing, too, according to Luke: “He that shall be least among you all, the same shall be great.”[^4206] Also in the same place: “Whosoever exalteth himself shall be made low, and whosoever abaseth himself shall be exalted.”[^4207] Of this same thing to the Romans: “Be not high-minded, but fear; for if God spared not the natural branches, (take heed) lest He also spare not thee.”[^4208] Of this same thing in the thirty-third Psalm: “And He shall save the lowly in spirit.”[^4209] Also to the Romans: “Render to all what is due: tribute to whom tribute is due, custom to whom custom, fear to whom fear, honour to whom honour; owe no man anything, except to love another.”[^4210] Also in the Gospel according to Matthew: “They love the first place of reclining at feasts, and the chief seat in the synagogues, and salutations in the market, and to be called of men Rabbi. But call not ye Rabbi, for One is your Master.”[^4211] Also in the Gospel according to John: “The servant is not greater than his lord, nor the apostle greater than He that sent himself. If ye know these things, blessed shall ye be if ye shall do them.”[^4212] Also in the eighty-first Psalm: “Do justice to the poor and lowly.”[^4213]" },
  { t = "note", id = "4204", text = "Isa. lxvi. 1, 2." },
  { t = "note", id = "4205", text = "Matt. v. 5." },
  { t = "note", id = "4206", text = "Luke ix. 48." },
  { t = "note", id = "4207", text = "Luke xiv. 11." },
  { t = "note", id = "4208", text = "Rom. xi. 20, 21." },
  { t = "note", id = "4209", text = "Ps. xxxiv. 18." },
  { t = "note", id = "4210", text = "Rom. xiii. 7, 8." },
  { t = "note", id = "4211", text = "Matt. xxiii. 6–8." },
  { t = "note", id = "4212", text = "John xiii. 16, 17." },
  { t = "note", id = "4213", text = "Ps. lxxxii. 3." },
]

[[section]]
id = "testimony-vi-that-all-good-and-righteous"
title = "Testimony VI. That all good and righteous men suffer more, but ought to endure because they are proved."
level = 2
blocks = [
  { t = "p", text = "6. That all good and righteous men suffer more, but ought to endure because they are proved." },
  { t = "p", text = "In Solomon: “The furnace proveth the vessels of the potter, and the trial of tribulation righteous men.”[^4214] Also in the fiftieth Psalm: “The sacrifice to God is a contrite spirit; a contrite and humbled heart God will not despise.”[^4215] Also in the thirty-third Psalm: “God is nearest to them that are contrite in heart, and He will save the lowly in spirit.”[^4216] Also in the same place: “Many are the afflictions of the righteous, but out of them all the Lord will deliver them.”[^4217] Of this same matter in Job: “Naked came I out of my mother’s womb, naked also shall I go under the earth: the Lord gave, and the Lord hath taken away: as it hath pleased the Lord, so it is done; blessed be the name of the Lord. In all these things which happened to him Job sinned in nothing with his lips in the sight of the Lord.”[^4218] Concerning this same thing in the Gospel according to Matthew: “Blessed are they that mourn, for they shall be comforted.”[^4219] Also according to John: “These things have I spoken unto you, that in me ye may have peace. But in the world ye shall have affliction; but have confidence, for I have overcome the world.”[^4220] Concerning this same thing in the second Epistle to the Corinthians: “There was given to me a thorn in the flesh, a messenger of Satan to buffet me, that I should not be exalted. For which thing I thrice besought the Lord, that it should depart from me. And He said unto me, My grace is sufficient for thee; for strength is perfected in weakness.”[^4221] Concerning this same thing to the Romans: “We glory in hope of the glory of God. And not only so, but we also glory in afflictions: knowing that affliction worketh patience; and patience, experience; and experience, hope: and hope does not confound; because the love of God is infused in our hearts by the Holy Spirit, which is given unto us.”[^4222] On this same subject, according to Matthew: “How broad and spacious is the way which leadeth unto death, and many there are who go in thereby: how straight and narrow is the way that leadeth to life, and few there are that find it!”[^4223] Of this same thing in Tobias: “Where are thy righteousnesses? behold what thou sufferest.”[^4224] Also in the Wisdom of Solomon: “In the places of the wicked the righteous groan; but at their ruin the righteous will abound.”[^4225]" },
  { t = "note", id = "4214", text = "Ecclus. xxvii. 5." },
  { t = "note", id = "4215", text = "Ps. li. 17." },
  { t = "note", id = "4216", text = "Ps. xxxiv. 18." },
  { t = "note", id = "4217", text = "Ps. xxxiv. 19." },
  { t = "note", id = "4218", text = "Job i. 21, 22." },
  { t = "note", id = "4219", text = "Matt. v. 4." },
  { t = "note", id = "4220", text = "John xvi. 33." },
  { t = "note", id = "4221", text = "2 Cor. xii. 7–9." },
  { t = "note", id = "4222", text = "Rom. v. 2–5." },
  { t = "note", id = "4223", text = "Matt. vii. 13, 14." },
  { t = "note", id = "4224", text = "Tob. ii. 14." },
  { t = "note", id = "4225", text = "Prov. xxviii. 28." },
]

[[section]]
id = "testimony-vii-that-we-must-not-grieve"
title = "Testimony VII. That we must not grieve the Holy Spirit, whom we have received."
level = 2
blocks = [
  { t = "p", text = "7. That we must not grieve the Holy Spirit, whom we have received." },
  { t = "p", text = "Paul the apostle to the Ephesians: “Grieve not the Holy Spirit of God, in which ye were sealed in the day of redemption. Let all bitterness, and wrath, and indignation, and clamour, and blasphemy, be taken away from you.”[^4226]" },
  { t = "note", id = "4226", text = "Eph. iv. 30, 31. [For the *sealing*, see Acts xix. 6, Heb. vi. 2.]" },
]

[[section]]
id = "testimony-viii-that-anger-must-be-overcome"
title = "Testimony VIII. That anger must be overcome, lest it constrain us to sin."
level = 2
blocks = [
  { t = "p", text = "8. That anger must be overcome, lest it constrain us to sin." },
  { t = "p", text = "In Solomon in the Proverbs: “Better is a patient man than a strong man; for he who restrains his anger is better than he who taketh a city.”[^4227] Also in the same place: “The imprudent man declareth his anger on the same day, but the crafty man hideth away his dishonour.”[^4228] Of this same thing to the Ephesians: “Be ye angry, and sin not. Let not the sun set upon your wrath.”[^4229] Also in the Gospel according to Matthew: “Ye have heard that it was said by the ancients, Thou shalt not kill; and whoever shall kill shall be guilty of the judgment. But I say unto you, That every one who is angry with his brother without cause shall be guilty of the judgment.”[^4230]" },
  { t = "note", id = "4227", text = "Prov. xvi. 32." },
  { t = "note", id = "4228", text = "Prov. xii. 16." },
  { t = "note", id = "4229", text = "Eph. iv. 16." },
  { t = "note", id = "4230", text = "Matt. v. 21, 22." },
]

[[section]]
id = "testimony-ix-that-brethren-ought-to-support"
title = "Testimony IX. That brethren ought to support one another."
level = 2
blocks = [
  { t = "p", text = "9. That brethren ought to support one another." },
  { t = "p", text = "To the Galatians: “Each one having others in consideration, lest ye also should be tempted. Bear ye one another’s burdens, and so ye shall fulfil the law of Christ.”[^4231]" },
  { t = "note", id = "4231", text = "Gal. vi. 1, 2." },
]

[[section]]
id = "testimony-x-that-we-must-trust-in"
title = "Testimony X. That we must trust in God only, and in Him we must glory."
level = 2
blocks = [
  { t = "p", text = "10. That we must trust in God only, and in Him we must glory." },
  { t = "p", text = "In Jeremiah: “Let not the wise man glory in his wisdom, neither let the strong man glory in his strength, nor let the rich man glory in his riches; but let him that glorieth glory in this, that he understands and knows that I am the Lord, who do mercy, and judgment, and righteousness upon the earth, because in them is my pleasure, saith the Lord.”[^4232] Of the same thing in the fifty-fourth Psalm: “In the Lord have I hoped; I will not fear what man can do unto me.”[^4233] Also in the same place: “To none but God alone is my soul subjected.”[^4234] Also in the cxviith Psalm: “I will not fear what man can do unto me; the Lord is my helper.”[^4235] Also in the same place: “It is good to trust in the Lord rather than to trust in man; it is good to hope in the Lord rather than to hope in princes.”[^4236] Of this same thing in Daniel: “But Shadrach, Meshach, and Abednego answered and said to king Nebuchadnezzar, O king, there is no need to answer thee concerning this word. For God, whom we serve, is able to deliver us from the furnace of burning fire; and He will deliver us from thine hand, O king. And if not, be it known unto thee that we serve not thy gods, and we adore not the golden image which thou hast set up.”[^4237] Likewise in Jeremiah: “Cursed is the man who hath hope in man; and blessed is the man who trusts in the Lord, and his hope shall be in God.”[^4238] Concerning this same thing in Deuteronomy: “Thou shalt worship the Lord thy God, and Him only shalt thou serve.”[^4239] Of this same thing to the Romans: “And they worshipped and served the creature, forsaking the Creator. Wherefore also God gave them up to ignominious passions.”[^4240] Of this thing also in John: “Greater is He who is in you than he who is in this world.”[^4241]" },
  { t = "note", id = "4232", text = "Jer. ix. 23, 24." },
  { t = "note", id = "4233", text = "Ps. lvi. 11." },
  { t = "note", id = "4234", text = "Ps. lxii. 1." },
  { t = "note", id = "4235", text = "Ps. cxviii. 6." },
  { t = "note", id = "4236", text = "Ps. cxviii. 8." },
  { t = "note", id = "4237", text = "Dan. iii. 16–18." },
  { t = "note", id = "4238", text = "Jer. xvii. 5–7." },
  { t = "note", id = "4239", text = "Deut. vi. 13." },
  { t = "note", id = "4240", text = "Rom. i. 25, 26." },
  { t = "note", id = "4241", text = "1 John iv. 4." },
]

[[section]]
id = "testimony-xi-that-he-who-has-attained"
title = "Testimony XI. That he who has attained to trust, having put off the former man, ought to regard only celestial and spiritual things, and to give no heed to the world which he has already renounced."
level = 2
blocks = [
  { t = "p", text = "11. That he who has attained to trust, having put off the former man, ought to regard only celestial and spiritual things, and to give no heed to the world which he has already renounced." },
  { t = "p", text = "In Isaiah: “Seek ye the Lord; and when ye have found Him, call upon Him. But when He hath come near unto you, let the wicked forsake his ways, and the unrighteous man his thoughts: and let him be turned unto the Lord, and he shall obtain mercy, because He will plentifully pardon your sins.”[^4242] Of this same thing in Solomon: “I have seen all the works which are done under the sun; and, lo, all are vanity.”[^4243] Of this same thing in Exodus: “But thus shall ye eat it; your loins girt, and your shoes on your feet, and your staves in your hands: and ye shall eat it in haste, for it is the Lord’s passover.”[^4244] Of this same thing in the Gospel according to Matthew: “Take no thought, saying, What shall we eat? or, What shall we drink? or, Wherewith shall we be clothed? for these things the nations seek after. But your Father knoweth that ye have need of all these things. Seek first the kingdom of God, and His righteousness; and all these things shall be added unto you.”[^4245] Likewise in the same place: “Think not for the morrow, for the morrow shall take thought for itself. Sufficient unto the day is its own evil.”[^4246] Likewise in the same place: “No one looking back, and putting his hands to the plough, is fit for the kingdom of God.”[^4247] Also in the same place: “Behold the fowls of the heaven: for they sow not, nor reap, nor gather into barns; and your heavenly Father feedeth them. Are not ye of more value than they?”[^4248] Concerning this same thing, according to Luke: “Let your loins be girded, and your lamps burning; and ye like unto men that wait for their lord, when he cometh from the wedding; that, when he cometh and knocketh, they may open to him. Blessed are those servants, whom their lord, when he cometh, shall find watching.”[^4249] Of this same thing in Matthew: “The foxes have holes, and the birds of the heaven have nests; but the Son of man hath not where He may lay His head.”[^4250] Also in the same place: “Whoso forsaketh not all that he hath, cannot be my disciple.”[^4251] Of this same thing in the first to the Corinthians: “Ye are not your own, for ye are bought with a great price. Glorify and bear God in your body.”[^4252] Also in the same place: “The time is limited. It remaineth, therefore, that both they who have wives be as though they have them not, and they who lament as they that lament not, and they that rejoice as they that rejoice not, and they who buy as they that buy not, and they who possess as they who possess not, and they who use this world as they that use it not; for the fashion of this world passeth away.”[^4253] Also in the same place: “The first man is of the clay of the earth, the second man from heaven. As he is of the clay, such also are they who are of the clay; and as is the heavenly, such also are the heavenly. Even as we have borne the image of him who is of the clay, let us bear His image also who is from heaven.”[^4254] Of this same matter to the Philippians: “All seek their own, and not those things which are Christ’s; whose end is destruction, whose god is their belly, and their glory is to their confusion, who mind earthly things. For our conversation is in heaven, whence also we expect the Saviour, our Lord Jesus Christ, who shall transform the body of our humiliation conformed to the body of His glory.”[^4255] Of this very matter to Galatians: “But be it far from me to boast, except in the cross of our Lord Jesus Christ, by whom the world is crucified unto me, and I unto the world.”[^4256] Concerning this same thing to Timothy: “No man that warreth for God bindeth himself with worldly annoyances, that he may please Him to whom he hath approved himself. But and if a man should contend, he will not be crowned unless he fight lawfully.”[^4257] Of this same thing to the Colossians: “If ye be dead with Christ from the elements of the world, why still, as if living in the world, do ye follow vain things?”[^4258] Also concerning this same thing: “If ye have risen together with Christ, seek those things which are above, where Christ is sitting on the right hand of God. Give heed to the things that are above, not to those things which are on the earth; for ye are dead, and your life is hidden with Christ in God. But when Christ your life shall appear, then shall ye also appear with Him in glory.”[^4259] Of this same thing to the Ephesians: Put off the old man of the former conversation, who is corrupted, according to the lusts of deceit. But be ye renewed in the spirit of your mind, and put on the new man, him who according to God is ordained in righteousness, and holiness, and truth.”[^4260] Of this same thing in the Epistle of Peter: “As strangers and pilgrims, abstain from fleshly lusts, which war against the soul; but having a good conversation among the Gentiles, that while they detract from you as if from evildoers, yet, beholding your good works, they may magnify God.”[^4261] Of this same thing in the Epistle of John: “He who saith he abideth in Christ, ought himself also to walk even as He walked.”[^4262] Also in the same place: “Love not the world, neither the things that are in the world. If any man loveth the world, the love of the Father is not in him. Because everything which is in the world is lust of the flesh, and lust of the eyes, and the ambition of this world, which is not of the Father, but of the lust of this world. And the world shall pass away with its lust. But he that doeth the will of God abideth for ever, even as God abideth for ever.”[^4263] Also in the first Epistle of Paul to the Corinthians: “Purge out the old leaven, that ye may be a new dough, as ye are unleavened. For also Christ our passover is sacrificed. Therefore let us celebrate the feast, not in the old leaven, nor in the leaven of malice and wickedness, but in the unleavened bread of sincerity and truth.”[^4264]" },
  { t = "note", id = "4242", text = "Isa. lv. 6, 7." },
  { t = "note", id = "4243", text = "Eccles. i. 14." },
  { t = "note", id = "4244", text = "Ex. xii. 11." },

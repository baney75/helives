[[section]]
id = "preface"
title = "Preface."
level = 1
blocks = [
  { t = "h", text = "Treatise XII.[^3812]" },
  { t = "note", id = "3812", text = "[Addressed to Quirinus, and dated a.d. 248.]" },
  { t = "h", text = "Three Books of Testimonies Against the Jews." },
  { t = "p", text = "Cyprian to his son Quirinus, greeting. It was necessary, my beloved son, that I should obey your spiritual desire, which asked with most urgent petition for those divine teachings wherewith the Lord has condescended to teach and instruct us by the Holy Scriptures, that, being led away from the darkness of error, and enlightened by His pure and shining light, we may keep the way of life through the saving sacraments. And indeed, as you have asked, so has this discourse been arranged by me; and this treatise has been ordered in an abridged compendium, so that I should not scatter what was written in too diffuse an abundance, but, as far as my poor memory suggested, might collect all that was necessary in selected and connected heads, under which I may seem, not so much to have treated the subject, as to have afforded material for others to treat it. Moreover, to readers also, brevity of the same kind is of very great advantage, in that a treatise of too great length dissipates the understanding and perception of the reader, while a tenacious memory keeps that which is read in a more exact compendium. But I have comprised in my undertaking two books of equally moderate length: one wherein I have endeavoured to show that the Jews, according to what had before been foretold, had departed from God, and had lost God’s favour, which had been given them in past time, and had been promised them for the future; while the Christians had succeeded to their place, deserving well of the Lord by faith, and coming out of all nations and from the whole world. The second book likewise contains the sacrament of Christ, that He has come who was announced according to the Scriptures, and has done and perfected all those things whereby He was foretold as being able to be perceived and known.[^3813] And these things may be of advantage to you meanwhile, as you read, for forming the first lineaments of your faith. More strength will be given you, and the intelligence of the heart will be effected more and more, as you examine more fully the Scriptures, old and new, and read through the complete volumes of the spiritual books.[^3814] For now we have filled a small measure from the divine fountains, which in the meantime we would send to you. You will be able to drink more plentifully, and to be more abundantly satisfied, if you also will approach to drink together with us at the same springs of the divine fulness.[^3815] I bid you, beloved son, always heartily farewell." },
  { t = "note", id = "3813", text = "This sentence is otherwise read, “whereby it may be perceived and known that it is He Himself who was foretold.”" },
  { t = "note", id = "3814", text = "[P. 227, note 3, *supra*. I cannot but note repeatedly how absolutely the primitive Fathers relied on the Holy Scriptures, and commended a Berean use of them. Acts xvii. 11.]" },
  { t = "note", id = "3815", text = "[The canon assumed to be universally known.]" },
]

[[section]]
id = "book-1"
title = "Book I."
level = 1
blocks = [
  { t = "h", text = "Heads." },
  { t = "h", text = "*First Book.*" },
  { t = "h", text = "Heads." },
  { t = "p", text = "1. That the Jews have fallen under the heavy wrath of God, because they have departed from the Lord, and have followed idols." },
  { t = "p", text = "2. Also because they did not believe the prophets, and put them to death." },
  { t = "p", text = "3. That it was previously foretold that they would neither know the Lord, nor understand nor receive Him." },
  { t = "p", text = "4. That the Jews would not understand the Holy Scriptures, but that they would be intelligible in the last times, after Christ had come." },
  { t = "p", text = "5. That the Jews could understand nothing of the Scriptures unless they first believed on Christ." },
  { t = "p", text = "6. That they would lose Jerusalem, and leave the land which they had received." },
  { t = "p", text = "7. That they would also lose the Light of the Lord." },
  { t = "p", text = "8. That the first circumcision of the flesh was made void, and a second circumcision of the spirit was promised instead." },
  { t = "p", text = "9. That the former law, which was given by Moses, was about to cease." },
  { t = "p", text = "10. That a new law was to be given." },
  { t = "p", text = "11. That another dispensation and a new covenant was to be given." },
  { t = "p", text = "12. That the old baptism was to cease, and a new one was to begin." },
  { t = "p", text = "13. That the old yoke was to be made void, and a new yoke was to be given." },
  { t = "p", text = "14. That the old pastors were to cease, and new ones to begin." },
  { t = "p", text = "15. That Christ should be God’s house and temple, and that the old temple should pass away, and a new one should begin." },
  { t = "p", text = "16. That the old sacrifice should be made void, and a new one should be celebrated." },
  { t = "p", text = "17. That the old priesthood should cease, and a new priest should come who should be for ever." },
  { t = "p", text = "18. That another prophet, such as Moses, was promised, to wit, who should give a new testament, and who was rather to be listened to." },
  { t = "p", text = "19. That two peoples were foretold, the elder and the younger; that is, the ancient people of the Jews, and the new one which should be of us." },
  { t = "p", text = "20. That the Church, which had previously been barren, should have more sons from among the Gentiles than the synagogue had had before." },
  { t = "p", text = "21. That the Gentiles should rather believe in Christ." },
  { t = "p", text = "22. That the Jews should lose the bread and the cup of Christ, and all His grace; while we should receive them, and that the new name of Christians should be blessed in the earth." },
  { t = "p", text = "23. That rather the Gentiles than the Jews should attain to the kingdom of heaven." },
  { t = "p", text = "24. That by this alone the Jews could obtain pardon of their sins, if they wash away the blood of Christ slain in His baptism, and, passing over into the Church, should obey His precepts.[^3816]" },
  { t = "note", id = "3816", text = "[These twenty-four propositions are specially worthy of the consideration of the young theologian who would clearly comprehend the Old Law and the New as St. Paul has expounded them in his Epistle to the Romans, and elsewhere.]" },
]

[[section]]
id = "testimony-i-that-the-jews-have-fallen"
title = "Testimony I. That the Jews have fallen under the heavy wrath of God because they have forsaken the Lord, and have followed idols."
level = 2
blocks = [
  { t = "h", text = "Testimonies." },
  { t = "p", text = "1. That the Jews have fallen under the heavy wrath of God because they have forsaken the Lord, and have followed idols." },
  { t = "p", text = "In Exodus the people said to Aaron: “Arise and make us gods which shall go before us: because as for this man Moses, who brought us out of Egypt, we know not what has become of him.”[^3817] In the same place also Moses says to the Lord: “O Lord, I pray thee, this people have sinned a great sin. They have made to themselves gods of gold and silver. And now, if thou wilt forgive them their sin, forgive; but if not, blot me out of the book which Thou hast written. And the Lord said unto Moses, If any one hath sinned against me, him will I blot out of my book.”[^3818] Likewise in Deuteronomy: They sacrificed unto demons, and not unto God.”[^3819] In the book of Judges too: “And the children of Israel did evil in the sight of the Lord God of their fathers, who brought them out of the land of Egypt, and followed the gods of the peoples that were round about them, and offended the Lord, and forsook God, and served Baal.”[^3820] Also in the same place: “And the children of Israel added again to do evil[^3821] in the sight of the Lord, and served Baal and the gods of the strangers, and forsook the Lord, and served Him not.”[^3822] In Malachi: “Judah is forsaken, and has become an abomination in Israel and in Jerusalem, because Judah has profaned the holiness of the Lord in those things wherein He hath loved, and courted strange gods. The Lord will cut off the man who doeth this, and he shall be made base in the tabernacles of Jacob.”[^3823]" },
  { t = "note", id = "3817", text = "Ex. xxxii. 1." },
  { t = "note", id = "3818", text = "Ex. xxxii. 31–33." },
  { t = "note", id = "3819", text = "Deut. xxxii. 17." },
  { t = "note", id = "3820", text = "Judg. ii. 11–13." },
  { t = "note", id = "3821", text = "“And again they did evil.”" },
  { t = "note", id = "3822", text = "Judg. iv. 1." },
  { t = "note", id = "3823", text = "Mal. ii. 11." },
]

[[section]]
id = "testimony-ii-also-because-they-did-not"
title = "Testimony II. Also because they did not believe the prophets, and put them to death."
level = 2
blocks = [
  { t = "p", text = "2. Also because they did not believe the prophets, and put them to death." },
  { t = "p", text = "In Jeremiah the Lord says: “I have sent unto I you my servants the prophets. Before the daylight I sent them (and ye heard me not, and did not listen with your ears), saying, Let every one of you be converted from his evil way, and from your most wicked desires; and ye shall dwell in that land which I have given you and your fathers for ever and ever.”[^3824] And again:[^3825] “Go not after other gods, to serve them, and do not worship them; and provoke me not to anger in the works of your hands to scatter you abroad; and ye have not hearkened unto me.”[^3826] Also in the third book of the Kings, Elias saith unto the Lord: “In being jealous I have been jealous for the Lord God Almighty; because the children of Israel have forsaken Thee, have demolished Thine altars, and have slain Thy prophets with the sword; and I have remained solitary, and they seek my life, to take it away from me.”[^3827] In Ezra also: “They have fallen away from Thee, and have cast Thy law behind their backs, and have killed Thy prophets which testified against them that they should return to Thee.”[^3828]" },
  { t = "note", id = "3824", text = "Jer. vii. 25; xxv. 4." },
  { t = "note", id = "3825", text = "The words “and again” are sometimes omitted; and sometimes read “Moreover, in the same place.”" },
  { t = "note", id = "3826", text = "Jer. xxv. 6, 7." },
  { t = "note", id = "3827", text = "1 Kings xix. 10." },
  { t = "note", id = "3828", text = "Neh. ix. 26." },
]

[[section]]
id = "testimony-iii-that-it-was-previously-foretold"
title = "Testimony III. That it was previously foretold that they would neither know the Lord, nor understand, nor receive Him."
level = 2
blocks = [
  { t = "p", text = "3. That it was previously foretold that they would neither know the Lord, nor understand, nor receive Him." },
  { t = "p", text = "In Isaiah: “Hear, O heaven, and give ear, O earth: for the Lord hath spoken; I have begotten and brought up children, but they have rejected me. The ox knoweth his owner, and the ass his master’s crib: but Israel hath not known me, and my people hath not perceived me. Ah sinful nation, a people filled with sins, a wicked seed, corrupting children: ye have forsaken the Lord, and have sent that Holy One of Israel into anger.”[^3829] In the same also the Lord says: “Go and tell this people, Ye shall hear with the ear, and shall not understand; and seeing, ye shall see, and shall not perceive. For the heart of this people hath waxed gross, and they hardly hear with their ears, and they have shut up their eyes, lest haply they should see with their eyes, and hear with their ears, and understand with their heart, and should return, and I should heal them.”[^3830] Also in Jeremiah the Lord says: “They have forsaken me, the fountain of living water, and have dug for themselves worn-out cisterns, which could not hold water.”[^3831] Moreover, in the same: “Behold, the word of the Lord has become unto them a reproach, and they do not wish for it.”[^3832] Again in the same the Lord says: “The kite knoweth his time, the turtle, and the swallow;[^3833] the sparrows of the field keep the time of their coming in; but my people doth not know the judgment of the Lord. How say ye, We are wise, and the law of the Lord is with us? The false measurement[^3834] has been made vain; the scribes are confounded; the wise men have trembled, and been taken, because they have rejected the word of the Lord.”[^3835] In Solomon also: “Evil men seek me, and shall not find me; for they held wisdom in hatred and did not receive the word of the Lord.”[^3836] Also in the twenty-seventh Psalm: “Render to them their deserving, because they have not perceived in the works of the Lord.”[^3837] Also in the eighty-first Psalm: “They have not known, neither have they understood; they shall walk on in darkness.”[^3838] In the Gospel, too, according to John: “He came unto His own, and His own received Him not. As many as received Him, to them gave He power to become the sons of God who believe on His name.”[^3839]" },
  { t = "note", id = "3829", text = "Isa. i. 2–4." },
  { t = "note", id = "3830", text = "Isa. vi. 9, 10." },
  { t = "note", id = "3831", text = "Jer. ii. 13." },
  { t = "note", id = "3832", text = "Jer. vi. 10." },
  { t = "note", id = "3833", text = "According to the Oxford edition: “The turtle and the swallow knoweth its time,” etc." },
  { t = "note", id = "3834", text = "Six ancient authorities have “your measurement.”" },
  { t = "note", id = "3835", text = "Jer. viii. 7–9." },
  { t = "note", id = "3836", text = "Prov. i. 28, 29." },
  { t = "note", id = "3837", text = "Ps. xxviii. 4, 5." },
  { t = "note", id = "3838", text = "Ps. lxxxii. 5." },
  { t = "note", id = "3839", text = "John i. 11, 12." },
]

[[section]]
id = "testimony-iv-that-the-jews-would-not"
title = "Testimony IV. That the Jews would not understand the Holy Scriptures, but that they would be intelligible in the last times, after that Christ had come."
level = 2
blocks = [
  { t = "p", text = "4. That the Jews would not understand the Holy Scriptures, but that they would be intelligible in the last times, after that Christ had come." },
  { t = "p", text = "In Isaiah: “And all these words shall be unto you as the words of a book that is sealed, which, if you shall give to a man that knoweth letters to read, he shall say, I cannot read, for it is sealed. But in that day the deaf shall hear the words of the book, and they who are in darkness and in a cloud; the eyes of the blind shall see.”[^3840] Also in Jeremiah: “In the last of the days ye shall know those things.”[^3841] In Daniel, moreover: “Secure the words, and seal the book until the time of consummation, until many learn, and knowledge is fulfilled, because when there shall be a dispersion they shall know all these things.”[^3842] Likewise in the first Epistle of Paul to the Corinthians: “Brethren, I would not that ye should be ignorant, that all our fathers were under the cloud.”[^3843] Also in the second Epistle to the Corinthians: “Their minds are blinded even unto this day, by this same veil which is taken away in Christ, while this same veil remains in the reading of the Old Testament, which is not unveiled, because it is made void in Christ; and even to this day, if at any time Moses is read, the veil is upon their heart. But by and by, when they shall be turned unto the Lord, the veil shall be taken away.”[^3844] In the Gospel, the Lord after His resurrection says: “These are the words which I spake unto you while I was yet with you, that all things must be fulfilled which are written in the law of Moses, and in the prophets, and in the Psalms, concerning me. Then opened He their understanding, that they might understand the Scriptures; and said unto them, That thus it is written, and thus it behoved Christ to suffer, and to rise again from the dead the third day; and that repentance and remission of sins should be preached in His name even among all nations.”[^3845]" },
  { t = "note", id = "3840", text = "Isa. xxix. 11–18." },
  { t = "note", id = "3841", text = "Jer. xxiii. 20." },
  { t = "note", id = "3842", text = "Dan. xii. 4–7." },
  { t = "note", id = "3843", text = "1 Cor. x. 1." },
  { t = "note", id = "3844", text = "2 Cor. iii. 14–16. There is a singular confusion in the reading of this quotation. The translator has followed Migne’s text." },
  { t = "note", id = "3845", text = "Luke xxiv. 44–47." },
]

[[section]]
id = "testimony-v-that-the-jews-could-understand"
title = "Testimony V. That the Jews could understand nothing of the Scriptures unless they first believed in Christ."
level = 2
blocks = [
  { t = "p", text = "5. That the Jews could understand nothing of the Scriptures unless they first believed in Christ." },
  { t = "p", text = "In Isaiah: “And if ye will not believe, neither will ye understand.”[^3846] Also the Lord in the Gospel: “For if ye believe not that I am He, ye shall die in your sins.”[^3847] Moreover, that righteousness should subsist by faith, and that in it was life, was predicted in Habakkuk: “Now the just shall live by faith of me.”[^3848] Hence Abraham, the father of the nations, believed; in Genesis: “Abraham believed in God, and it was counted unto him for righteousness.”[^3849] In like manner, Paul to the Galatians: “Abraham believed in God, and it was counted unto him for righteousness. Ye know, therefore, that they which are of faith, the same are children of Abraham. But the Scripture, foreseeing that God justifieth the heathens by faith, foretold to Abraham that all nations should be blessed in him. Therefore they who are of faith are blessed[^3850] with faithful Abraham.”[^3851]" },
  { t = "note", id = "3846", text = "Isa. vii. 9." },
  { t = "note", id = "3847", text = "John viii. 24." },
  { t = "note", id = "3848", text = "Hab. ii. 4." },
  { t = "note", id = "3849", text = "Gen. xv. 6." },
  { t = "note", id = "3850", text = "The Burgundian codex reads, “are justified.”" },
  { t = "note", id = "3851", text = "Gal. iii. 6–9." },
]

[[section]]
id = "testimony-vi-that-the-jews-should-lose"
title = "Testimony VI. That the Jews should lose Jerusalem, and should leave the land which they had received."
level = 2
blocks = [
  { t = "p", text = "6. That the Jews should lose Jerusalem, and should leave the land which they had received." },
  { t = "p", text = "In Isaiah: “Your country is desolate, your cities are burned with fire: your land, strangers shall devour it in your sight; and the daughter of Zion shall be left deserted, and overthrown by foreign peoples, as a cottage in a vineyard, and as a keeper’s lodge in a garden of cucumbers, as a city which is besieged. And unless the Lord of Sabaoth had left us a seed, we should have been as Sodoma, and we should have been like unto Gomorrah.”[^3852] Also in the Gospel the Lord says: “Jerusalem, Jerusalem, that killest the prophets, and stonest them that are sent unto thee, how often would I have gathered thy children as a hen gathereth her chickens under her wings, and thou wouldst not! Behold, your house shall be left unto you desolate.”[^3853]" },
  { t = "note", id = "3852", text = "Isa. i. 7–9." },
  { t = "note", id = "3853", text = "Matt. xxiii. 37, 38." },
]

[[section]]
id = "testimony-vii-also-that-they-should-lose"
title = "Testimony VII. Also that they should lose the Light of the Lord."
level = 2
blocks = [
  { t = "p", text = "7. Also that they should lose the Light of the Lord." },
  { t = "p", text = "In Isaiah: “Come ye, and let us walk in the light of the Lord. For He hath sent away His people, the house of Israel.”[^3854] In His Gospel also, according to John: “That was the true light which lighteth every man that cometh into this world. He was in this world, and the world was made by Him, and the world knew Him not.”[^3855] Moreover, in the same place: “He that believeth not is judged already, because he hath not believed in the name of the only begotten Son of God. And this is the judgment, that light is come into the world, and men loved darkness rather than light.”[^3856]" },
  { t = "note", id = "3854", text = "Isa. ii. 5, 6." },
  { t = "note", id = "3855", text = "John i. 9, 10." },
  { t = "note", id = "3856", text = "John iii. 18, 19." },
]

[[section]]
id = "testimony-viii-that-the-first-circumcision-of"
title = "Testimony VIII. That the first circumcision of the flesh is made void, and the second circumcision of the spirit is promised instead."
level = 2
blocks = [
  { t = "p", text = "8. That the first circumcision of the flesh is made void, and the second circumcision of the spirit is promised instead." },
  { t = "p", text = "In Jeremiah: “Thus saith the Lord to the men of Judah, and to them who inhabit Jerusalem, Renew newness among you, and do not sow among thorns: circumcise yourselves to your God, and circumcise the foreskin of your heart; lest my anger go forth like fire, and burn you up, and there be none to extinguish it.”[^3857] Also Moses says: “In the last days God will circumcise thy heart, and the heart of thy seed, to love the Lord thy God.”[^3858] Also in Jesus the son of Nave: “And the Lord said unto Jesus, Make thee small knives of stone, very sharp, and set about to circumcise the children of Israel for the second time.”[^3859] Paul also, to the Colossians: “Ye are circumcised with the circumcision not made with hands in the putting off of the flesh, but with the circumcision of Christ.”[^3860] Also, because Adam was first made by God uncircumcised, and righteous Abel, and Enoch, who pleased God and was translated; and Noah, who, when the world and men were perishing on account of transgressions, was chosen alone, that in him the human race might be preserved; and Melchizedek, the priest according to whose order Christ was promised. Then, because that sign did not avail women,[^3861] but all are sealed by the sign of the Lord." },
  { t = "note", id = "3857", text = "Jer. iv. 3, 4." },
  { t = "note", id = "3858", text = "Deut. xxx. 6." },
  { t = "note", id = "3859", text = "Josh. v. 2." },
  { t = "note", id = "3860", text = "Col. ii. 11." },
  { t = "note", id = "3861", text = "This appears to be the natural reading, but it rests on slight authority; the better accredited reading being “seminis” for “feminis.”" },
]

[[section]]
id = "testimony-ix-that-the-former-law-which"
title = "Testimony IX. That the former law which was given by Moses was to cease."
level = 2
blocks = [
  { t = "p", text = "9. That the former law which was given by Moses was to cease." },
  { t = "p", text = "In Isaiah: “Then shall they be manifest who seal the law, that they may not learn; and he shall say, I wait upon the Lord, who turneth away His face from the house of Jacob, and I shall trust in Him.”[^3862] In the Gospel also: “All the prophets and the law prophesied until John.”[^3863]" },
  { t = "note", id = "3862", text = "Isa. viii. 16, 17." },
  { t = "note", id = "3863", text = "Matt. xi. 13." },
]

[[section]]
id = "testimony-x-that-a-new-law-was"
title = "Testimony X. That a new law was to be given."
level = 2
blocks = [
  { t = "p", text = "10. That a new law was to be given." },
  { t = "p", text = "In Micah: “For the law shall go forth out of Sion, and the word of the Lord from Jerusalem. And He shall judge among many peoples, and He shall subdue and uncover strong nations.”[^3864] Also in Isaiah: “For from Sion shall go forth the law, and the word of the Lord from Jerusalem; and He shall judge among the nations.”[^3865] Likewise in the Gospel according to Matthew: “And behold a voice out of the cloud, saying, This is my beloved Son, in whom I am well pleased; hear ye Him.”[^3866]" },
  { t = "note", id = "3864", text = "Mic. iv. 2, 3." },
  { t = "note", id = "3865", text = "Isa. ii. 3, 4." },
  { t = "note", id = "3866", text = "Matt. xvii. 5." },
]

[[section]]
id = "testimony-xi-that-another-dispensation-and-a"
title = "Testimony XI. That another dispensation and a new covenant was to be given."
level = 2
blocks = [
  { t = "p", text = "11. That another dispensation and a new covenant was to be given." },
  { t = "p", text = "In Jeremiah: “Behold, the days come, saith the Lord, and I will complete for the house of Israel, and for the house of Judah, a new testament, not according to the testament which I ordered with their fathers in that day in which I took hold of their hands to bring them out of the land of Egypt, because they remained not in my testament, and I disregarded them, saith the Lord: Because this is the testament which I will establish with the house of Israel after those days, saith the Lord: I will give them my laws, and into their minds I will write them; and I will be to them for a God, and they shall be to me for a people; and they shall not teach every man his brother, saying, Know the Lord: for all shall know me, from the least even to the greatest of them: for I will be merciful to their iniquities, and will no more be mindful of their sins.”[^3867]" },
  { t = "note", id = "3867", text = "Jer. xxxi. 31–34." },
]

[[section]]
id = "testimony-xii-that-the-old-baptism-should"
title = "Testimony XII. That the old baptism should cease, and a new one should begin."
level = 2
blocks = [
  { t = "p", text = "12. That the old baptism should cease, and a new one should begin." },
  { t = "p", text = "In Isaiah: “Therefore remember ye not the former things, neither reconsider the ancient things. Behold, I make new the things which shall now arise, and ye shall know it; and I will make in the desert a way, and rivers in a dry place, to give drink to my chosen race, my people whom I acquired, that they should show forth my praises.”[^3868] In the same also: “If they thirst, He will lead them through the deserts; He will bring forth water from the rock; the rock shall be cloven, and the water shall flow: and my people shall drink.”[^3869] Moreover, in the Gospel according to Matthew, John says: “I indeed baptize you with water unto repentance: but He that cometh after me is mightier than I, whose shoes I am not worthy to bear; He shall baptize you with the Holy Ghost, and with fire.”[^3870] Also according to John: “Except a man be born of water, and of the Spirit, he cannot enter into the kingdom of God. For that which is born of the flesh is flesh, and that which is born of the Spirit is spirit.”[^3871]" },
  { t = "note", id = "3868", text = "Isa. xliii. 18–21." },
  { t = "note", id = "3869", text = "Isa. xlviii. 21." },
  { t = "note", id = "3870", text = "Matt. iii. 11." },
  { t = "note", id = "3871", text = "John iii. 5, 6." },
]

[[section]]
id = "testimony-xiii-that-the-old-yoke-should"
title = "Testimony XIII. That the old yoke should be made void, and a new yoke should be given."
level = 2
blocks = [
  { t = "p", text = "13. That the old yoke should be made void, and a new yoke should be given." },
  { t = "p", text = "In the second Psalm: “For what purpose have the heathen raged, and the people imagined vain things? The kings of the earth stood up, and the rulers have gathered together against the Lord, and against His Christ. Let us break their bonds asunder, and cast away their yoke from us.”[^3872] Likewise in the Gospel according to Matthew, the Lord says: “Come unto me, all ye that labour and are burdened, and I will cause you to rest. Take my yoke upon you, and learn of me; for I am meek and lowly in heart: and ye shall find rest unto your souls. For my yoke is excellent, and my burden is light.”[^3873] In Jeremiah: “In that day I will shatter the yoke from their neck, and will burst their fetters; and they shall not labour for others, but they shall labour for the Lord God; and I will raise up David a king unto them.”[^3874]" },
  { t = "note", id = "3872", text = "Ps. ii. 1–3." },
  { t = "note", id = "3873", text = "Matt. xi. 28–30." },
  { t = "note", id = "3874", text = "Jer. xxx. 8, 9." },
]

[[section]]
id = "testimony-xiv-that-the-old-pastors-should"
title = "Testimony XIV. That the old pastors should cease and new ones begin."
level = 2
blocks = [
  { t = "p", text = "14. That the old pastors should cease and new ones begin." },
  { t = "p", text = "In Ezekiel: “Wherefore thus saith the Lord, Behold, I am above the shepherds; and I will require my sheep from their hands, and I will turn them away from feeding my sheep; and they shall feed them no more, and I will deliver my sheep from their mouth, and I will feed them with judgment.”[^3875] In Jeremiah the Lord says: “And I will give you shepherds according to my own heart, and they shall feed you with the food of discipline.”[^3876] In Jeremiah, moreover: “Hear the word of the Lord, ye nations, and tell it to the islands which are afar off. Say, He that scattereth Israel will gather him, and will keep him as a shepherd his flock: for the Lord hath redeemed Jacob, and taken him out from the hand of him that was stronger than he.”[^3877]" },
  { t = "note", id = "3875", text = "Ezek. xxxiv. 10–16." },
  { t = "note", id = "3876", text = "Jer. iii. 15." },
  { t = "note", id = "3877", text = "Jer. xxxi. 10, 11." },
]

[[section]]
id = "testimony-xv-that-christ-should-be-the"
title = "Testimony XV. That Christ should be the house and temple of God, and that the old temple should cease, and the new one should begin."
level = 2
blocks = [
  { t = "p", text = "15. That Christ should be the house and temple of God, and that the old temple should cease, and the new one should begin." },
  { t = "p", text = "In the second book of Kings: “And the word of the Lord came to Nathan, saying, Go and tell my servant David, Thus saith the Lord, Thou shalt not build me an house to dwell in; but it shall be, when thy days shall be fulfilled, and thou shalt sleep with thy fathers, I will raise up thy seed after thee, which shall come from thy bowels, and I will make ready his kingdom. He shall build me an house in my name, and I will raise up his throne for ever; and I will be to him for a father, and he shall be to me for a son: and his house shall obtain confidence, and his kingdom for evermore in my sight.”[^3878] Also in the Gospel the Lord says: “There shall not be left in the temple one stone upon another that shall not be thrown down.”[^3879] And “After three days another shall be raised up without hands.”[^3880]" },
  { t = "note", id = "3878", text = "2 Sam. vii. 4, 5, 12–16." },
  { t = "note", id = "3879", text = "Matt. xxiv. 2." },
  { t = "note", id = "3880", text = "John ii. 19; Mark xiv. 58." },
]

[[section]]
id = "testimony-xvi-that-the-ancient-sacrifice-should"
title = "Testimony XVI. That the ancient sacrifice should be made void, and a new one should be celebrated."
level = 2
blocks = [
  { t = "p", text = "16. That the ancient sacrifice should be made void, and a new one should be celebrated." },
  { t = "p", text = "In Isaiah: “For what purpose to me is the multitude of your sacrifices? saith the Lord: I am full; I will not have the burnt sacrifices of rams, and fat of lambs, and blood of bulls and goats. For who hath required these things from your hands?”[^3881] Also in the forty-ninth Psalm: “I will not eat the flesh of bulls, nor drink the blood of goats. Offer to God the sacrifice of praise, and pay your vows to the Most High. Call upon me in the day of trouble, and I will deliver thee: and thou shalt glorify me.”[^3882] In the same Psalm, moreover: “The sacrifice of praise shall glorify me: therein is the way in which I will show him the salvation of God.”[^3883] In the fourth Psalm too: “Sacrifice the sacrifice of righteousness, and hope in the Lord.”[^3884] Likewise in Malachi: “I have no pleasure concerning you, saith the Lord, and I will not have an accepted offering from your hands. Because from the rising of the sun, even unto the going down of the same, my name is glorified among the Gentiles; and in every place odours of incense are offered to my name, and a pure sacrifice, because great is my name among the nations, saith the Lord.”[^3885]" },
  { t = "note", id = "3881", text = "Isa. i. 11, 12." },
  { t = "note", id = "3882", text = "Ps. l. 13–15." },
  { t = "note", id = "3883", text = "Ps. l. 23." },
  { t = "note", id = "3884", text = "Ps. iv. 5." },
  { t = "note", id = "3885", text = "Mal. i. 10, 11. [P. 251, note 1, *supra*. The oblation of Melchizedek. Gen. xiv. 18. The Oxford translator adds, “with the incense of pious prayers.” See Justin, vol. i. p. 215, cap. xli., and Irenæus, vol. i. p. 484.]" },
]

[[section]]
id = "testimony-xvii-that-the-old-priesthood-should"
title = "Testimony XVII. That the old priesthood should cease, and a new priest should come, who should be for ever."
level = 2
blocks = [
  { t = "p", text = "17. That the old priesthood should cease, and a new priest should come, who should be for ever." },
  { t = "p", text = "In the cixth Psalm: “Before the morning star I begat thee. The Lord hath sworn, and He will not repent, Thou art a priest for ever, after the order of Melchizedek.”[^3886] Also in the first book of Kings, God says to the priest Eli: “And I will raise up to me a faithful priest, who shall do all things which are in my heart: and I will build him a sure house; and he shall pass in the presence of my anointed ones for all days. And it shall be, whosoever shall remain in thine house, shall come to worship for an obolus of money, and for one loaf of bread.”[^3887]" },
  { t = "note", id = "3886", text = "Ps. cx. 3." },
  { t = "note", id = "3887", text = "1 Sam. ii. 35, 36." },
]

[[section]]
id = "testimony-xviii-that-another-prophet-such-as"
title = "Testimony XVIII. That another Prophet such as Moses was promised, to wit, one who should give a new testament, and who rather ought to be heard."
level = 2
blocks = [
  { t = "p", text = "18. That another Prophet such as Moses was promised, to wit, one who should give a new testament, and who rather ought to be heard." },
  { t = "p", text = "In Deuteronomy God said to Moses: “And the Lord said to me, A Prophet will I raise up to them from among their brethren, such as thee, and I will give my word in His mouth; and He shall speak unto them that which I shall command Him. And whosoever shall not hear whatsoever things that Prophet shall speak in my name, I will avenge it.”[^3888] Concerning whom also Christ says in the Gospel according to John: “Search the Scriptures, in which ye think ye have eternal life. These are they which set forth testimony concerning me; and ye will not come to me, that ye might have life. Do not think that I accuse you to the Father: there is one that accuseth you, even Moses, on whom ye hope. For if ye had believed Moses, ye would also believe me: for he wrote of me. But if ye believe not his writings, how shall ye believe my words?”[^3889]" },
  { t = "note", id = "3888", text = "Deut. xviii. 18, 19." },
  { t = "note", id = "3889", text = "John v. 39, 40, 45–47." },
]

[[section]]
id = "testimony-xix-that-two-peoples-were-foretold"
title = "Testimony XIX. That two peoples were foretold, the elder and the younger; that is, the old people of the Jews, and the new one which should consist of us."
level = 2
blocks = [
  { t = "p", text = "19. That two peoples were foretold, the elder and the younger; that is, the old people of the Jews, and the new one which should consist of us." },
  { t = "p", text = "In Genesis: “And the Lord said unto Rebekah, Two nations are in thy womb, and two peoples shall be separated from thy belly; and the one people shall overcome the other people; and the elder shall serve the younger.”[^3890] Also in Hosea: “I will call them my people that are not my people, and her beloved that was not beloved. For it shall be, in that place in which it shall be called not my people, they shall be called the sons of the living God.”[^3891]" },
  { t = "note", id = "3890", text = "Gen. xxv. 23." },
  { t = "note", id = "3891", text = "Hos. ii. 23; i. 10." },
]

[[section]]
id = "testimony-xx-that-the-church-which-before"
title = "Testimony XX. That the Church which before had been barren should have more children from among the Gentiles than what the synagogue had had before."
level = 2
blocks = [
  { t = "p", text = "20. That the Church which before had been barren should have more children from among the Gentiles than what the synagogue had had before." },
  { t = "p", text = "In Isaiah: “Rejoice, thou barren, that barest not; and break forth and cry, thou that travailest not: because many more are the children of the desolate one than of her who hath an husband. For the Lord hath said, Enlarge the place of thy tabernacle, and of thy curtains, and fasten them: spare not, make long thy measures, and strengthen thy stakes: stretch forth yet to thy right hand and to thy left hand; and thy seed shall possess the nations, and shall inhabit the deserted cities. Fear not; because thou shalt overcome: nor be afraid because thou art cursed; for thou shalt forget thy eternal confusion.”[^3892] Thus also to Abraham, when his former son was born of a bond-woman, Sarah remained long barren; and late in old age bare her son Isaac, of promise, who was the type of Christ. Thus also Jacob received two wives: the elder Leah, with weak eyes, a type of the synagogue; the younger the beautiful Rachel, a type of the Church, who also remained long barren, and afterwards brought forth Joseph, who also was himself a type of Christ. And in the first of Kings it is said that Elkanah had two wives: Peninnah, with her sons; and Hannah, barren, from whom is born Samuel, not according to the order of generation, but according to the mercy and promise of God, when she had prayed in the temple; and Samuel being born, was a type of Christ. Also in the first book of Kings: “The barren hath borne seven and she that had many children has grown weak.”[^3893] But the seven children are the seven churches. Whence also Paul wrote to seven churches; and the Apocalypse sets forth seven churches, that the number seven may be preserved; as the seven days in which God made the world; as the seven angels who stand and go in and out before the face of God, as Raphael the angel says in Tobit; and the sevenfold lamp in the tabernacle of witness; and the seven eyes of God, which keep watch over the world; and the stone with seven eyes, as Zechariah says; and the seven spirits; and the seven candlesticks in the Apocalypse; and the seven pillars upon which Wisdom hath builded her house in Solomon." },
  { t = "note", id = "3892", text = "Isa. liv. 1–4." },
  { t = "note", id = "3893", text = "1 Sam. ii. 5. [Compare Treatise xi. p. 503, *supra*.]" },
]

[[section]]
id = "testimony-xxi-that-the-gentiles-should-rather"
title = "Testimony XXI. That the Gentiles should rather believe in Christ."
level = 2
blocks = [
  { t = "p", text = "21. That the Gentiles should rather believe in Christ." },
  { t = "p", text = "In Genesis: “And the Lord God said unto Abraham, Go out from thy country, and from thy kindred, and from thy father’s house, and go into that land which I shall show thee: and I will make of thee a great nation, and I will bless thee, and I will magnify thy name; and thou shalt be blessed: and I will bless him that blesseth thee, and I will curse him that curseth thee: and in thee shall all the tribes of the earth be blessed.”[^3894] On this same point in Genesis: “And Isaac blessed Jacob.[^3895] Behold, the smell of my son is as the smell of a plentiful field which the Lord hath blessed: and God give thee of the dew of heaven, and of the fertility of the earth, abundance of corn, and wine, and oil: and peoples shall obey thee, and princes shall worship thee: and thou shalt be lord over thy brother, and the sons of thy father shall worship thee; and he that curseth thee shall be cursed, and he that blesseth thee shall be blessed.”[^3896] On this matter too in Genesis: “But when Joseph saw that his father placed his right hand on the head of Ephraim, it seemed displeasing to him: and Joseph laid hold of his father’s hand, to lift it from the head of Ephraim on to the head of Manasseh. Moreover, Joseph said unto his father, Not so, my father: this is my first-born; place thy right hand upon his head. But he would not, and said, I know it, my son, I know it: and he also shall be a people, and he shall be exalted; but his younger brother shall be greater than he, and his seed shall become a multitude of nations.”[^3897] Moreover in Genesis: “Judah, thy brethren shall praise thee: thine hand shall be upon the back of thine enemies; the sons of thy father shall worship thee. Judah is a lion’s whelp: from the slender twig,[^3898] my son, thou hast ascended: thou layedst down and sleepedst as a lion, and as a lion’s whelp. Who shall stir him up? There shalt not fail a prince from Judah, and a leader from his loins, until those things entrusted to him shall come; and he is the hope of the nations: binding his foal unto the vine, and his ass’s colt unto the branch of the vine;[^3899] he shall wash his garments in wine, and his clothing in the blood of the grape: terrible are his eyes with wine, and his teeth are whiter than milk.”[^3900] Hence in Numbers it is written concerning our people: “Behold, the people shall rise up as a lion-like people.”[^3901] In Deuteronomy: “Ye Gentiles shall be for the head; but this unbelieving people shall be for the tail.”[^3902] Also in Jeremiah: “Hear the sound of the trumpet. And they said, We will not hear: for this cause the nations shall hear, and they who shall feed their cattle among them.”[^3903] In the seventeenth Psalm: “Thou shalt establish me the head of the nations: a people whom I have not known have served me: at the hearing of the ear they have obeyed me.”[^3904] Concerning this very thing the Lord says in Jeremiah: “Before I formed thee in the belly, I knew thee; and before thou wentest forth from the womb, I sanctified thee, and established thee as a prophet among the nations.”[^3905] Also in Isaiah: “Behold, I have manifested him for a witness to the nations, a prince and a commander to the peoples.”[^3906] Also in the same: “Nations which have not known Thee shall call upon Thee; and peoples which were ignorant of Thee shall flee to Thee.”[^3907] In the same, moreover: “And in that day there shall be a root of Jesse, which shall rise to rule in all the nations; in Him shall the Gentiles hope: and His rest shall be honour.”[^3908] In the same again: “The land of Zebulon, and the land of Nephtalim, by the way of the sea, and ye others who inhabit the maritime places, and beyond Jordan[^3909] of the nations. People that walk in darkness, behold ye a great light; ye who dwell in the region of the shadow of death, the light shall shine upon you.”[^3910] Also in the same: “Thus saith the Lord God to Christ my Lord, whose right hand I hold, that the nations may hear Him; and I will break asunder the strength of kings, I will open before Him gates; and cities shall not be shut.”[^3911] Also in the same: “I come to gather together all nations and tongues; and they shall come, and see my glory. And I will send out over them a standard, and I will send those that are preserved among them to the nations which are afar off, which have not heard my name nor seen my glory; and they shall declare my glory to the nations.”[^3912] Also in the same: “And in all these things they are not converted; therefore He shall lift up a standard to the nations which are afar, and He will draw them from the end of the earth.”[^3913] Also in the same: “Those who had not been told of Him shall see, and they who have not heard shall understand.”[^3914] Also in the same: “I have been made manifest to those who seek me not: I have been formal of those who asked not after me. I said, Lo, here am I, to a nation that has not called upon my name.”[^3915] Of this same thing, in the Acts of the Apostles, Paul says: “It was necessary that the word of God should first be shown to you; but since ye put it from you, and judged yourselves unworthy of eternal life, lo, we turn to the Gentiles: for thus said the Lord by the Scriptures, Behold, I have set Thee a light among the nations, that Thou shouldest be for salvation even to the ends of the earth.”[^3916]" },
  { t = "note", id = "3894", text = "Gen. xi. 1–3." },
  { t = "note", id = "3895", text = "The quotation in the Oxford edition begins from this point." },
  { t = "note", id = "3896", text = "Gen. xxvii. 27–29." },
  { t = "note", id = "3897", text = "Gen. xlviii. 17–19. The whole of this quotation is wanting in more than one codex." },
  { t = "note", id = "3898", text = "“Frutice.” The Oxford translator has here, without any authority as it appears, from the text, adopted the reading of the Vulgate, “ad prædam.” Cyprian has used the LXX., reading apparently, ἐκ βλαστοῦ. The Hebrew מִטֶּרֶף gives a colour to either reading. See Gesenius, *Lex. in voce* מֶרֶף. [Elucidation X.]" },
  { t = "note", id = "3899", text = "Original, “ad cilicium;” LXX. τῆ ἕλικι, “the tendril of the vine;” Oxford trans. “the choice vine.”" },
  { t = "note", id = "3900", text = "Gen. xlix. 8–12." },
  { t = "note", id = "3901", text = "Num. xxiii. 14." },
  { t = "note", id = "3902", text = "Deut. xxviii. 44." },
  { t = "note", id = "3903", text = "Jer. vi. 18." },
  { t = "note", id = "3904", text = "Ps. xviii. 43, 44." },
  { t = "note", id = "3905", text = "Jer. i. 5." },
  { t = "note", id = "3906", text = "Isa. lv. 4." },
  { t = "note", id = "3907", text = "Isa. lv. 5." },
  { t = "note", id = "3908", text = "Isa. xi. 10." },
  { t = "note", id = "3909", text = "Oxford edition adds “Galilee.”" },
  { t = "note", id = "3910", text = "Isa. ix. 1, 2." },
  { t = "note", id = "3911", text = "Isa. xlv. 1." },
  { t = "note", id = "3912", text = "Isa. lxvi. 18, 19." },
  { t = "note", id = "3913", text = "Isa. v. 25, 26." },
  { t = "note", id = "3914", text = "Isa. lii. 15." },
  { t = "note", id = "3915", text = "Isa. lxv. 1." },
  { t = "note", id = "3916", text = "Acts xiii. 46, 47." },
]

[[section]]
id = "testimony-xxii-that-the-jews-would-lose"
title = "Testimony XXII. That the Jews would lose while we should receive the bread and the cup of Christ and all His grace, and that the new name of Christians should be blessed in the earth."
level = 2
blocks = [
  { t = "p", text = "22. That the Jews would lose while we should receive the bread and the cup of Christ and all His grace, and that the new name of Christians should be blessed in the earth." },
  { t = "p", text = "In Isaiah: “Thus saith the Lord, Behold, they who serve me shall eat, but ye shall be hungry: behold, they who serve me shall drink, but ye shall be thirsty:[^3917] behold, they who serve me shall rejoice, but ye shall be confounded; the Lord shall slay you. But to those who serve me a new name shall be named, which shall be blessed in the earth.”[^3918] Also in the same place: “Therefore shall He lift up an ensign to the nations which are afar off, and He will draw them from the end of the earth; and, behold, they shall come swiftly with lightness; they shall not hunger nor thirst.”[^3919] Also in the same place: “Behold, therefore, the Ruler, the Lord of Sabaoth, shall take away from Judah and from Jerusalem the healthy man and the strong man, the strength of bread and the strength of water.”[^3920] Likewise in the thirty-third Psalm: “O taste and see how sweet is the Lord. Blessed is the man that hopeth in Him. Fear the Lord God, all ye His saints: for there is no want to them that fear Him. Rich men have wanted and have hungered; but they who seek the Lord shall never want any good thing.”[^3921] Moreover, in the Gospel according to John, the Lord says: “I am the bread of life: he that cometh to me shall not hunger, and he that trusteth in me shall never thirst.”[^3922] Likewise He saith in that place: “If any one thirst, let him come and drink. He that believeth on me, as the Scripture saith, out of his belly shall flow rivers of living water.”[^3923] Moreover, He says in the same place: “Except ye eat the flesh of the Son of man, and drink His blood, ye shall have no life in you.”[^3924]" },
  { t = "note", id = "3917", text = "This second clause, “Behold, they who serve me shall drink,” is wanting in some editions." },
  { t = "note", id = "3918", text = "Isa. lxv. 13–15." },
  { t = "note", id = "3919", text = "Isa. v. 26, 27." },
  { t = "note", id = "3920", text = "Isa. iii. 1, 2." },
  { t = "note", id = "3921", text = "Ps. xxxiv. 8–10." },
  { t = "note", id = "3922", text = "John vi. 35." },
  { t = "note", id = "3923", text = "John vii. 37, 38." },
  { t = "note", id = "3924", text = "John vi. 53." },
]

[[section]]
id = "testimony-xxiii-that-the-gentiles-rather-than"
title = "Testimony XXIII. That the Gentiles rather than the Jews attain to the kingdom of heaven."
level = 2
blocks = [
  { t = "p", text = "23. That the Gentiles rather than the Jews attain to the kingdom of heaven." },
  { t = "p", text = "In the Gospel the Lord says: “Many shall come from the east and from the west, and shall lie down with Abraham, and Isaac, and Jacob, in the kingdom of heaven; but the children of the kingdom shall go out into outer darkness: there shall be weeping and gnashing of teeth.”[^3925]" },
  { t = "note", id = "3925", text = "Matt. viii. 11, 12." },
]

[[section]]
id = "testimony-xxiv-that-by-this-alone-the"
title = "Testimony XXIV. That by this alone the Jews can receive pardon of their sins, if they wash away the blood of Christ slain, in His baptism, and, passing over into His Church, obey His precepts."
level = 2
blocks = [
  { t = "p", text = "24. That by this alone the Jews can receive pardon of their sins, if they wash away the blood of Christ slain, in His baptism, and, passing over into His Church, obey His precepts." },
  { t = "p", text = "In Isaiah the Lord says: “Now I will not release your sins. When ye stretch forth your hands, I will turn away my face from you; and if ye multiply prayers, I will not hear you: for your hands are full of blood. Wash you, make you clean; take away the wickedness from your souls from the sight of mine eyes; cease from your wickedness; learn to do good; seek judgment; keep him who suffers wrong; judge for the orphan, and justify the widow. And come, let us reason together, saith the Lord: and although your sins be as scarlet, I will whiten[^3926] them as snow; and although they were as crimson, I will whiten[^3927] them as wool. And if ye be willing and listen to me, ye shall eat of the good of the land; but if ye be unwilling, and will not hear me, the sword shall consume you; for the mouth of the Lord hath spoken these things.”[^3928]" },
  { t = "note", id = "3926", text = "“Exalbabo.”" },
  { t = "note", id = "3927", text = "“Inalbabo.”" },
  { t = "note", id = "3928", text = "Isa. i. 15–20." },
]

[[section]]
id = "book-2"
title = "Book II."
level = 1
blocks = [
  { t = "h", text = "Heads." },
  { t = "h", text = "*Second Book.*" },
  { t = "h", text = "Heads." },
  { t = "p", text = "1. That Christ is the First-born, and that He is the Wisdom of God, by whom all things were made." },
  { t = "p", text = "2. That Christ is the Wisdom of God; and about the sacrament of His incarnation, and passion, and cup, and altar, and the apostles who were sent and preached." },
  { t = "p", text = "3. That Christ also is Himself the Word of God." },
  { t = "p", text = "4. That the same Christ is God’s hand and arm." },
  { t = "p", text = "5. That the same is Angel and God." },
  { t = "p", text = "6. That Christ is God." },
  { t = "p", text = "7. That Christ our God should come as the Illuminator and Saviour of the human race." },
  { t = "p", text = "8. That although from the beginning He had been Son of God, He had yet to be begotten again according to the flesh." },
  { t = "p", text = "9. That this should be the sign of His nativity, that He should be born of a virgin—man and God—Son of man and of God." },
  { t = "p", text = "10. That Christ is man and God, compounded of either nature, that He might be a mediator between us and the Father." },
  { t = "p", text = "11. That He was to be born of the seed of David after the flesh." },
  { t = "p", text = "12. That He should be born in Bethlehem." },
  { t = "p", text = "13. That He should come in lowly condition on His first advent." },
  { t = "p", text = "14. That He was the righteous One whom the Jews should put to death." },
  { t = "p", text = "15. That He was called a Sheep and a Lamb who would have to be slain, and concerning the sacrament of the passion." },
  { t = "p", text = "16. That He is also called a Stone." },
  { t = "p", text = "17. That subsequently that stone should become a mountain, and should fill the whole earth." },
  { t = "p", text = "18. That in the last times the same mountain should be manifested, upon which the Gentiles should come, and on which the righteous should go up." },
  { t = "p", text = "19. That He is the Bridegroom, having the Church as His bride, from whom children should be spiritually born." },
  { t = "p", text = "20. That the Jews should fasten Him to the Cross." },
  { t = "p", text = "21. That in the passion and the sign of the cross is all virtue and power." },
  { t = "p", text = "22. That in this sign of the cross is salvation for all who are marked on their foreheads." },
  { t = "p", text = "23. That at mid-day, during His passion, there should be darkness." },
  { t = "p", text = "24. That He should not be overcome of death, nor should remain in hell." },
  { t = "p", text = "25. That He should rise again from hell on the third day." },
  { t = "p", text = "26. That when He had risen, He should receive from His Father all power, and His power should be eternal." },
  { t = "p", text = "27. That it is impossible to attain to God the Father, except through the Son Jesus Christ." },
  { t = "p", text = "28. That He is to come as a Judge." },
  { t = "p", text = "29. That He is to reign as a King for ever." },
  { t = "p", text = "30. That He is both Judge and King." },
]

[[section]]
id = "that-christ-is-the-first-born-and"
title = "That Christ is the First-born, and that He is the Wisdom of God, by whom all things were made."
level = 2
blocks = [
  { t = "h", text = "Testimonies." },
  { t = "p", text = "1. That Christ is the First-born, and that He is the Wisdom of God, by whom all things were made." },
  { t = "p", text = "In Solomon in the Proverbs: “The Lord established[^3929] me in the beginning of His ways, into His works: before the world He founded me. In the beginning, before He made the earth, and before He appointed the abysses, before the fountains of waters gushed forth, before the mountains were settled, before all the hills, the Lord begot me. He made the countries, and the uninhabitable places, and the uninhabitable bounds under heaven. When He prepared the heaven, I was present with Him; and when He set apart His seat. When He made the strong clouds above the winds, and when He placed the strengthened fountains under heaven, when He made the mighty foundations of the earth, I was by His side, ordering them: I was He in whom He delighted: moreover, I daily rejoiced before His face in all time, when He rejoiced in the perfected earth.”[^3930] Also in the same in Ecclesiasticus: “I went forth out of the mouth of the Most High, first-born before every creature: I made the unwearying light to rise in the heavens, and I covered the whole earth with a cloud: I dwelt in the high places, and my throne in the pillar of the cloud: I compassed the circle of heaven, and I penetrated into the depth of the abyss, and I walked on the waves of the sea, and I stood in all the earth; and in every people and in every nation I had the pre-eminence, and by my own strength I have trodden the hearts of all the excellent and the humble: in me is all hope of life and virtue: pass over to me, all ye who desire me.”[^3931] Also in the eighty-eighth Psalm: “And I will establish Him as my first-born, the highest among the kings of the earth. I will keep my mercy for Him for ever, and my faithful covenant for Him; and I will establish his seed for ever and ever. If his children forsake my law, and walk not in my judgments; if they profane my judgments, and do not observe my precepts, I will visit their wickednesses with a rod, and their sins with scourges; but my mercy will I not scatter away from them.”[^3932] Also in the Gospel according to John, the Lord says: “And this is life eternal, that they should know Thee, the only and true God, and Jesus Christ, whom Thou hast sent. I have glorified Thee on the earth: I have finished the work which Thou gavest me to do. And now, do Thou glorify me with Thyself, with the glory which I had with Thee before the world was made.”[^3933] Also Paul to the Colossians: “Who is the image of the invisible God, and the first-born of every creature.”[^3934] Also in the same place: “The first-born from the dead, that He might in all things become the holder of the pre-eminence.”[^3935] In the Apocalypse too: “I am Alpha and Omega, the beginning and the end. I will give unto Him that is thirsting from the fountain of the water of life freely.”[^3936] That He also is both the wisdom and the power of God, Paul proves in his first Epistle to the Corinthians. “Because the Jews require a sign, and the Greeks seek after wisdom: but we preach Christ crucified, to the Jews indeed a stumbling-block, and to the Gentiles foolishness; but to them that are called, both Jews and Greeks, Christ the power of God and the wisdom of God.”[^3937]" },
  { t = "note", id = "3929", text = "[Condidit. Bull, *Opp*., v. p. 515. ἐκτήσατο, Jerome; ἔκτισε, *alii*. See Justin, vol. i. p. 264; Athenagoras, vol. ii. p. 133; Clement, *ib*., p. 194; and see note, Oxford translation. See Irenæus, vol. i. p. 488.]" },
  { t = "note", id = "3930", text = "Prov. viii. 22–31." },
  { t = "note", id = "3931", text = "Ecclus. xxiv. 3–7." },
  { t = "note", id = "3932", text = "Ps. lxxxix. 27–33." },
  { t = "note", id = "3933", text = "John xvii. 3–5." },
  { t = "note", id = "3934", text = "Col. i. 15." },
  { t = "note", id = "3935", text = "Col. i. 18." },
  { t = "note", id = "3936", text = "Rev. xxi. 6." },
  { t = "note", id = "3937", text = "1 Cor. i. 22–24." },
]

[[section]]
id = "that-christ-is-the-wisdom-of-god"
title = "That Christ is the Wisdom of God; and concerning the sacrament of His incarnation and of His passion, and cup and altar; and of the apostles who were sent, and preached."
level = 2
blocks = [
  { t = "p", text = "2. That Christ is the Wisdom of God; and concerning the sacrament of His incarnation and of His passion, and cup and altar; and of the apostles who were sent, and preached." },
  { t = "p", text = "In Solomon in the Proverbs: “Wisdom hath builded herself an house, and she has placed under it seven pillars; she has slain her victims; she hath mingled her wine in the goblet, and hath made ready her table,[^3938] and hath sent her servants, calling with a loud announcement to the cup, saying, Let him who is foolish turn to me: and to them that want understanding she has said, Come, eat of my loaves, and drink the wine which I have mingled for you. Forsake foolishness, and seek wisdom, and correct knowledge by understanding.”[^3939]" },
  { t = "note", id = "3938", text = "[The house = the Church; the seven pillars = Isa. xi. 2, 3; her table = the Lord’s table; her cup = the sacrament of the Blood; her loaves = of the Body. Then her servants = preachers. So old authors.]" },
  { t = "note", id = "3939", text = "Prov. ix. 1–6." },
]

[[section]]
id = "that-the-same-christ-is-the-word"
title = "That the same Christ is the Word of God."
level = 2
blocks = [
  { t = "p", text = "3. That the same Christ is the Word of God." },
  { t = "p", text = "In the forty-fourth Psalm: “My heart hath breathed out a good Word. I tell my works to the King.”[^3940] Also in the thirty-second Psalm: “By the Word of God were the heavens made fast; and all their strength by the breath of His mouth.”[^3941] Also in Isaiah: “A Word completing and shortening in righteousness, because a shortened word will God make in the whole earth.”[^3942] Also in the cvith Psalm: “He sent His Word, and healed them.”[^3943] Moreover, in the Gospel according to John: “In the beginning was the Word, and the Word was with God, and God was the Word. The same was in the beginning with God. All things were made by Him, and without Him was nothing made that was made. In Him was life; and the life was the light of men. And the light shineth in darkness; and the darkness comprehended it not.”[^3944] Also in the Apocalypse: “And I saw the heaven opened, and lo, a white horse; and he who sate upon him was called Faithful and True, judging rightly and justly; and He made war. And He was covered with a garment sprinkled with blood; and His name is called the Word of God.”[^3945]" },
  { t = "note", id = "3940", text = "Ps. xlv. 1. [דָּבָר מוֹב, *Hebrew*. λογόν, *Sept.* Verbum, *Vulg*. Matter, *Eng*. and *Angl. Psalter*.]" },
  { t = "note", id = "3941", text = "Ps. xxxiii. 6." },
  { t = "note", id = "3942", text = "Isa. x. 23." },
  { t = "note", id = "3943", text = "Ps. cvii. 20." },
  { t = "note", id = "3944", text = "John i. 1–5." },
  { t = "note", id = "3945", text = "Rev. xix. 11–13." },
]

[[section]]
id = "that-christ-is-the-hand-and-arm"
title = "That Christ is the Hand and Arm of God."
level = 2
blocks = [
  { t = "p", text = "4. That Christ is the Hand and Arm of God.[^3946]" },
  { t = "note", id = "3946", text = "[Hence the Spirit, “the finger of God.” Luke xi. 20.]" },
  { t = "p", text = "In Isaiah: “Is God’s Hand not strong to save? or has He made His ear heavy, that He cannot hear? But your sins separate between you and God; and on account of your sins He turns His face away from you, that He may not pity. For your hands are defiled with blood, and your fingers with sins. Moreover, your lips have spoken wickedness, and your tongue meditates unrighteousness. No one speaketh truth, nor is there true judgment: they trust in vanity, and speak emptiness, who conceive sorrow, and bring forth wickedness.”[^3947] Also in the same place: “Lord, who hath believed our report? and to whom is the Arm of God revealed?”[^3948] Also in the same: “Thus saith the Lord, Heaven is my throne, and the earth is the support of my feet. What house will ye build unto me? or what is the place for my rest? For all these things hath mine hand made.”[^3949] Also in the same: “O Lord God, Thine Arm is high, and they knew it not; but when they know it, they shall be confounded.”[^3950] Also in the same: “The Lord hath revealed His Arm, that holy Arm, in the sight of all nations; all nations, even the ends of the earth, shall see salvation from God.”[^3951] Also in the same place: “Behold, I have made thee as the wheels of a thrashing chariot, new and turned back upon themselves;”[^3952] and thou shalt thrash the mountains, and shalt beat the hills small, and shalt make them as chaff, and shall winnow them; and the wind shall seize them, and the whirlwind shall scatter them: but thou shalt rejoice in the saints of Israel; and the poor and needy shall exult. For they shall seek water, and there shall be none. For their tongue shall be dry for thirst. I the Lord God, I the God of Israel, will hear them, and will not forsake them; but I will open rivers in the mountains, and fountains in the midst of the fields. I will make the wildernesses watery groves, and a thirsty land into watercourses. I will establish in the land of drought the cedar-tree and the box-tree, and the myrtle and the cypress, and the elm[^3953] and the poplar, that they may see and acknowledge, and know and believe together, that the Hand of the Lord hath done these things, and the Holy One of Israel hath shown them.”[^3954]" },
  { t = "note", id = "3947", text = "Isa. lix. 1–4." },
  { t = "note", id = "3948", text = "Isa. liii. 1." },
  { t = "note", id = "3949", text = "Isa. lxvi. 1, 2." },
  { t = "note", id = "3950", text = "Isa. xxvi. 11." },
  { t = "note", id = "3951", text = "Isa. lii. 10." },
  { t = "note", id = "3952", text = "Original: “Rotas vehiculi triturantis novas in se retornatas.” The Oxford edition reads the three last words, “in serras formatas:” and the translator gives, “the wheels of a thrashing instrument made with new teeth.”" },
  { t = "note", id = "3953", text = "Some editions omit “and the elm.”" },
  { t = "note", id = "3954", text = "Isa. xli. 15–20. [Irenæus, vol. i. p. 487. “Word and Wisdom = hands.”]" },
]

[[section]]
id = "that-christ-is-at-once-angel-and"
title = "That Christ is at once Angel and God."
level = 2
blocks = [
  { t = "p", text = "5. That Christ is at once Angel and God.[^3955]" },
  { t = "note", id = "3955", text = "[i.e., the Jehovah-Angel. See Tertullian, vol. iii. p. 335.]" },
  { t = "p", text = "In Genesis, to Abraham: “And the Angel of the Lord called him from heaven, and said unto him, Abraham, Abraham! And he said, Here am I. And He said, Lay not thine hand upon the lad, neither do thou anything unto him. For now I know that thou fearest thy God, and hast not spared thy son, thy beloved son, for my sake.”[^3956] Also in the same place, to Jacob: “And the Angel of the Lord spake unto me in dreams, I am God, whom thou sawest in the place of God[^3957] where thou anointedst me a pillar of stone, and vowedst to me a vow.”[^3958] Also in Exodus: “But God went before them by day indeed in a pillar of cloud, to show them the way; and by night in a pillar of fire.”[^3959] And afterwards, in the same place: “And the Angel of God moved forward, which went before the army of the children of Israel.”[^3960] Also in the same place: “Lo, I send my Angel before thy face, to keep thee in the way, that He may lead thee into the land which I have prepared for thee. Observe Him, and obey Him, and be not disobedient to Him, and He will not be wanting to thee. For my Name is in Him.”[^3961] Whence He Himself says in the Gospel: “I came in the name of my Father, and ye received me not. When another shall come in his own name, him ye will receive.”[^3962] And again in the cxviith Psalm: “Blessed is He who cometh in the name of the Lord.”[^3963] Also in Malachi: “My covenant of life and peace was with Levi;[^3964] and I gave him fear, that he should fear me, that he should go from the face of my name. The law of truth was in his mouth, and unrighteousness was not found in his lips. In the peace of the tongue correcting, he walked with us, and turned many away from unrighteousness. Because the lips of the priests shall keep knowledge, and they shall seek the law at His mouth; for He is the Angel of the Almighty.”[^3965]" },
  { t = "note", id = "3956", text = "Gen. xxii. 11, 12." },
  { t = "note", id = "3957", text = "*Scil*. “Beth-el,” “the house of God.”" },
  { t = "note", id = "3958", text = "Gen. xxxi. 13." },
  { t = "note", id = "3959", text = "Ex. xiii. 21." },
  { t = "note", id = "3960", text = "Ex. xiv. 19." },
  { t = "note", id = "3961", text = "Ex. xxiii. 20, 21. [See Tertullian, vol. iii. p. 335, a valuable passage. De Maistre has something to say on this, quite to the purpose. See Bull *passim*: e.g., vol. v. pp. 21–26, 33, 40; 745–760.]" },
  { t = "note", id = "3962", text = "John v. 43." },
  { t = "note", id = "3963", text = "Ps. cxviii. 26." },
  { t = "note", id = "3964", text = "Otherwise, “My covenant was with life and peace.”" },
  { t = "note", id = "3965", text = "Mal. ii. 5–7." },
]

[[section]]
id = "that-christ-is-god"
title = "That Christ is God."
level = 2
blocks = [
  { t = "p", text = "6. That Christ is God." },
  { t = "p", text = "In Genesis: “And God said unto Jacob, Arise, and go up to the place of Bethel, and dwell there; and make there an altar to that God who appeared unto thee when thou fleddest from the face of thy brother Esau.”[^3966] Also in Isaiah: “Thus saith the Lord, the God of Sabaoth, Egypt is wearied; and the merchandise of the Ethiopians, and the tall men of the Sabeans, shall pass over unto Thee, and shall be Thy servants; and shall walk after Thee bound with chains; and shall worship Thee, and shall pray to Thee, because God is in Thee, and there is no other God beside Thee. For Thou art God, and we knew it not, O God of Israel, our Saviour. They shall all be confounded and fear who oppose Thee, and shall fall into confusion.”[^3967] Likewise in the same: “The voice of one crying in the wilderness, Prepare ye the way of the Lord, make straight the paths of our God. Every channel shall be filled up, and every mountain and hill shall be made low, and all crooked places shall be made straight, and rough places plain; and the glory of the Lord shall be seen, and all flesh shall see the salvation of God, because the Lord hath spoken it.”[^3968] Moreover, in Jeremiah: This is our God, and no other shall be esteemed beside Him, who hath found all the way of knowledge, and hath given it to Jacob His son, and to Israel His beloved. After this He was seen upon earth, and He conversed with men.”[^3969] Also in Zechariah God says: “And they shall cross over through the narrow sea, and they shall smite the waves in the sea, and they shall dry up all the depths of the rivers; and all the haughtiness of the Assyrians shall be confounded, and the sceptre of Egypt shall be taken away. And I will strengthen them in the Lord their God, and in His name shall they glory, saith the Lord.”[^3970] Moreover, in Hosea the Lord saith: “I will not do according to the anger of mine indignation, I will not allow Ephraim to be destroyed: for I am God, and there is not a holy man in thee: and I will not enter into the city; I will go after God.”[^3971] Also in the forty-fourth Psalm: “Thy throne, O God, is for ever and ever: the sceptre of righteousness is the sceptre of Thy kingdom. Thou hast loved righteousness, and hated iniquity: wherefore God, Thy God, hath anointed Thee with the oil of gladness above Thy fellows.”[^3972] So, too, in the forty-fifth Psalm: “Be still, and know that I am God. I will be exalted among the nations, and I will be exalted in the earth.”[^3973] Also in the eighty-first Psalm: “They have not known, neither have they understood: they will walk on in darkness.”[^3974] Also in the sixty-seventh Psalm: “Sing unto God, sing praises unto His name: make a way for Him who goeth up into the west: God is His name.”[^3975] Also in the Gospel according to John: “In the beginning was the Word, and the Word was with God, and God was the Word.”[^3976] Also in the same: “The Lord said to Thomas, Reach hither thy finger, and behold my hands: and be not faithless, but believing. Thomas answered and said unto Him, My Lord and my God. Jesus saith unto him, Because thou hast seen me, thou hast believed: blessed are they who have not seen, and yet have believed.”[^3977] Also Paul to the Romans: “I could wish that I myself were accursed from Christ for my brethren and my kindred according to the flesh: who are Israelites: whose are the adoption, and the glory, and the covenant, and the appointment of the law, and the service (of God), and the promises; whose are the fathers, of whom, according to the flesh, Christ came, who is God over all, blessed for evermore.”[^3978] Also in the Apocalypse: “I am Alpha and Omega, the beginning and the end: I will give to him that is athirst, of the fountain of living water freely. He that overcometh shall possess these things, and their inheritance; and I will be his God, and he shall be my son.”[^3979] Also in the eighty-first Psalm: “God stood in the congregation of gods, and judging gods in the midst.”[^3980] And again in the same place: “I have said, Ye are gods; and ye are all the children of the Highest: but ye shall die like men.”[^3981] But if they who have been righteous, and have obeyed the divine precepts, may be called gods, how much more is Christ, the Son of God, God! Thus He Himself says in the Gospel according to John: “Is it not written in the law, that I said, Ye are gods? If He called them gods to whom the word of God was given, and the Scripture cannot be relaxed, do ye say to Him whom the Father hath sanctified and sent into the world, that thou blasphemest, because I said, I am the Son of God? But if I do not the works of my Father, believe me not; but if I do, and ye will not believe me, believe the works, and know that the Father is in me, and I in Him.”[^3982] Also in the Gospel according to Matthew: “And ye shall call His name Emmanuel, which is, being interpreted, God with us.”[^3983]" },
  { t = "note", id = "3966", text = "Gen. xxxv. 1." },
  { t = "note", id = "3967", text = "Isa. xlv. 14–16." },
  { t = "note", id = "3968", text = "Isa. xl. 3–5." },
  { t = "note", id = "3969", text = "Baruch iii. 35–37." },
  { t = "note", id = "3970", text = "Zech. x. 11, 12." },
  { t = "note", id = "3971", text = "Hos. xi. 9, 10." },
  { t = "note", id = "3972", text = "Ps. xlv. 6, 7." },
  { t = "note", id = "3973", text = "Ps. xlv. 10." },
  { t = "note", id = "3974", text = "Ps. lxxxii. 5." },
  { t = "note", id = "3975", text = "Ps. lxviii. 4." },
  { t = "note", id = "3976", text = "John i. 1." },
  { t = "note", id = "3977", text = "John xx. 27–29." },
  { t = "note", id = "3978", text = "Rom. ix. 3–5." },
  { t = "note", id = "3979", text = "Rev. xxi. 6, 7." },
  { t = "note", id = "3980", text = "Ps. lxxxii. 1." },
  { t = "note", id = "3981", text = "Ps. lxxxii. 6, 7." },
  { t = "note", id = "3982", text = "John x. 34–38." },
  { t = "note", id = "3983", text = "Matt. i. 23." },
]

[[section]]
id = "that-christ-our-god-should-come-the"
title = "That Christ our God should come, the Enlightener and Saviour of the human race."
level = 2
blocks = [
  { t = "p", text = "7. That Christ our God should come, the Enlightener and Saviour of the human race." },
  { t = "p", text = "In Isaiah: “Be comforted, ye weakened hands; and ye weak knees, be strengthened. Ye who are of a timorous heart, fear not. Our God will recompense judgment, He Himself will come, and will save us. Then shall be opened the eyes of the blind, and the ears of the deaf shall hear. Then the lame man shall leap as a stag, and the tongue of the dumb shall be intelligible; because in the wilderness the water is broken forth, and the stream in the thirsty land.”[^3984] Also in that place: “Not an elder nor an angel, but the Lord Himself shall deliver them; because He shall love them, and shall spare them, and He Himself shall redeem them.”[^3985] Also in the same place: “I the Lord God have called Thee in righteousness, that I may hold Thine hand, and I will comfort Thee; and I have given Thee for a covenant of my people, for a light of the nations; to open the eyes of the blind, to bring forth them that are bound from chains, and those who sit in darkness from the prison-house. I am the Lord God, that is my name. I will not give my glory to another, nor my powers to graven images.”[^3986] Also in the twenty-fourth Psalm: “Show me Thy ways, O Lord, and teach me Thy paths, and lead me unto Thy truth, and teach me; for Thou art the God of my salvation.”[^3987] Whence, in the Gospel according to John, the Lord says: “I am the light of the world. He that will follow me shall not walk in darkness, but shall have the light of life.”[^3988] Moreover, in that according to Matthew, the angel Gabriel says to Joseph: “Joseph, thou son of David, fear not to take unto thee Mary thy wife. For that which shall be born to her is of the Holy Ghost. And she shall bring forth a son, and thou shalt call His name Jesus; for He shall save His people from their sins.”[^3989] Also in that according to Luke: “And Zacharias was filled with the Holy Ghost, and prophesied, saying, Blessed be the Lord God of Israel, who hath foreseen redemption for His people, and hath raised up an horn of salvation for us in the house of His servant David.”[^3990] Also in the same place, the angel said to the shepherds: “Fear not; for, behold, I bring you tidings that unto you is born this day in the city of David a Saviour, which is Christ Jesus.”[^3991]" },
  { t = "note", id = "3984", text = "Isa. xxxv. 3–6." },
  { t = "note", id = "3985", text = "Isa. lxiii. 9." },
  { t = "note", id = "3986", text = "Isa. xlii. 6–8." },
  { t = "note", id = "3987", text = "Ps. xxv. 4, 5." },
  { t = "note", id = "3988", text = "John viii. 12." },
  { t = "note", id = "3989", text = "Matt. i. 20, 21." },
  { t = "note", id = "3990", text = "Luke i. 67–69." },
  { t = "note", id = "3991", text = "Luke ii. 10, 11." },
]

[[section]]
id = "that-although-from-the-beginning-he-had"
title = "That although from the beginning He had been the Son of God, yet He had to be begotten again according to the flesh."
level = 2
blocks = [
  { t = "p", text = "8. That although from the beginning He had been the Son of God, yet He had to be begotten again according to the flesh." },
  { t = "p", text = "In the second Psalm: “The Lord said unto me, Thou art my Son; this day have I begotten Thee. Ask of me, and I will give Thee the nations for Thine inheritance, and the bounds of the earth for Thy possession.”[^3992] Also in the Gospel according to Luke: “And it came to pass, when Elisabeth heard the salutation of Mary, the babe leaped in her womb; and she was filled with the Holy Ghost, and she cried out with a loud voice, and said, Blessed art thou among women, and blessed is the fruit of thy womb. And whence does this happen to me, that the mother of my Lord should come to me?”[^3993] Also Paul to the Galatians: “But when the fulness of the time was come, God sent His Son, born of a woman.”[^3994] Also in the Epistle of John: “Every spirit which confesses that Jesus Christ is come in the flesh is of God. But whosoever denies that He is come in the flesh is not of God, but is of the spirit of Antichrist.”[^3995]" },
  { t = "note", id = "3992", text = "Ps. ii. 7, 8." },
  { t = "note", id = "3993", text = "Luke i. 41–43." },
  { t = "note", id = "3994", text = "Gal. iv. 4." },
  { t = "note", id = "3995", text = "1 John iv. 2, 3." },
]

[[section]]
id = "that-this-should-be-the-sign-of"
title = "That this should be the sign of His nativity, that He should be born of a virgin--man and God--a son of man and a Son of God."
level = 2
blocks = [
  { t = "p", text = "9. That this should be the sign of His nativity, that He should be born of a virgin—man and God—a son of man and a Son of God." },
  { t = "p", text = "In Isaiah: “And the Lord went on to speak to Ahaz, saying, Ask thee a sign from the Lord thy God, in the height above and in the depth below. And Ahaz said, I will not ask, and I will not tempt the Lord my God. And He said, Hear ye, therefore, O house of David: it is no trifling contest unto you with men, since God supplies the struggle. On this account God Himself will give you a sign. Behold, a virgin shall conceive, and shall bear a son, and ye shall call His name Emmanuel. Butter and honey shall He eat; before that He knows to prefer the evil, He shall exchange the good.”[^3996] This seed God had foretold would proceed from the woman that should trample on the head of the devil. In Genesis: “Then God said unto the serpent, Because thou hast done this, cursed art thou from every kind of the beasts of the earth. Upon thy breast and thy belly shalt thou crawl, and earth shall be thy food all the days of thy life. And I will place enmity between thee and the woman and her seed. He shall regard thy head, and thou shalt watch his heel.”[^3997]" },
  { t = "note", id = "3996", text = "Isa. vii. 10–15. The ordinary reading here is, “before He knows, to refuse the evil and to choose the good.” The reading in the text, however, is more authentic." },
  { t = "note", id = "3997", text = "Gen. iii. 14, 15." },
]

[[section]]
id = "that-christ-is-both-man-and-god"
title = "That Christ is both man and God, compounded of both natures, that He might be a Mediator between us and the Father."
level = 2
blocks = [
  { t = "p", text = "10. That Christ is both man and God, compounded of both natures, that He might be a Mediator between us and the Father." },
  { t = "p", text = "In Jeremiah: “And He is man, and who shall know Him?”[^3998] Also in Numbers: “A Star shall arise out of Jacob, and a man shall rise up from Israel.”[^3999] Also in the same place: “A Man shall go forth out of his seed,[^4000] and shall rule over many nations; and His kingdom shall be exalted as Gog,[^4001] and His kingdom shall be increased; and God brought Him forth out of Egypt. His glory is as of the unicorn, and He shall eat the nations of His enemies, and shall take out the marrow of their fatnesses, and will pierce His enemy with His arrows. He couched and lay down as a lion, and as a lion’s whelp. Who shall raise Him up? Blessed are they who bless Thee, and cursed are they who curse Thee.”[^4002] Also in Isaiah: “The Spirit of the Lord is upon me; on account whereof He hath anointed me: He hath sent me to tell good tidings to the poor; to heal the bruised in heart, to preach deliverance to the captives, and sight to the blind, to proclaim the acceptable year of the Lord, and the day of retribution.”[^4003] Whence, in the Gospel according to Luke, Gabriel says to Mary: “And the angel, answering, said to her, The Holy Ghost shall come upon thee, and the power of the Highest shall overshadow thee. Wherefore that holy thing which is born of thee shall be called the Son of God.”[^4004] Also in the first Epistle of Paul to the Corinthians: “The first man is of the mud[^4005] of the earth; the second man is from heaven. As was he from the soil, such are they also that are of the earth; and as is the heavenly, such also are the heavenly. As we have borne the image of him who is of the earth, let us also bear the image of Him who is from heaven.”[^4006]" },
  { t = "note", id = "3998", text = "Jer. xvii. 9." },
  { t = "note", id = "3999", text = "Num. xxiv. 17." },
  { t = "note", id = "4000", text = "[Here the English (*q*. *v*.) gives the more literal reading, which the Septuagint treats as a proverb, unfolding its sense. “Water from the bucket” seems to have signified the same as our low proverb “a chip from the block,” hence = a Son from the Father. Num. xxiv. 7.]" },
  { t = "note", id = "4001", text = "The Oxford translator follows the English version, and reads, “over Agag.”" },
  { t = "note", id = "4002", text = "Num. xxiv. 7–9." },
  { t = "note", id = "4003", text = "Isa. lxi. 1, 2." },
  { t = "note", id = "4004", text = "Luke i. 35." },
  { t = "note", id = "4005", text = "“Limo.”" },
  { t = "note", id = "4006", text = "1 Cor. xv. 47–49." },
]

[[section]]
id = "that-christ-was-to-be-born-of"
title = "That Christ was to be born of the seed of David, according to the flesh."
level = 2
blocks = [
  { t = "p", text = "11. That Christ was to be born of the seed of David, according to the flesh." },
  { t = "p", text = "In the second of Kings: “And the word of the Lord came to Nathan, saying, Go and tell my servant David, Thus saith the Lord, Thou shalt not build me an house to dwell in; but it shall come to pass, when thy days shall be fulfilled, and thou shalt sleep with thy fathers, I will raise up thy seed after thee who shall come from thy loins, and I will establish His kingdom. He shall build me a house in my name, and I will set up His throne for ever; and I will be to Him a Father, and He shall be to me a Son; and His house shall obtain confidence, and His kingdom for ever in my sight.”[^4007] Also in Isaiah: “And a rod shall go forth of the root of Jesse, and a flower shall go up from his root; and the Spirit of the Lord shall rest upon Him, the spirit of wisdom and of understanding, the spirit of counsel and might, the spirit of knowledge and piety; and the spirit of the fear of the Lord shall fill Him.”[^4008] Also in the cxxxist Psalm: “God hath sworn the truth unto David himself, and He has not repudiated it; of the fruit of thy belly will I set upon my throne.”[^4009] Also in the Gospel according to Luke: “And the angel said unto her, Fear not, Mary. For thou hast found favour before God. Behold, thou shalt conceive, and shalt bring forth a son, and shalt call His name Jesus. The same shall be great, and He shall be called the Son of the Highest; and the Lord God shall give Him the throne of His father David, and He shall reign over the house of Jacob for ever, and of His kingdom there shall be no end.”[^4010] Also in the Apocalypse: “And I saw in the right hand of God, who sate on the throne, a book written within, and on the back sealed with seven seals; and I saw a strong angel proclaiming with a loud voice, Who is worthy to receive the book, and to open its seals? Nor was there any one either in heaven or upon the earth, or under the earth, who was able to open the book, nor even to look into it. And I wept much because nobody was found worthy to open the book, nor to look into it. And one of the elders said unto me, Weep not; behold, the Lion of the tribe of Judah, the Root of David, hath prevailed to open the book, and to loose its seven seals.”[^4011]" },
  { t = "note", id = "4007", text = "2 Sam. vii. 5, 12–16." },
  { t = "note", id = "4008", text = "Isa. xi. 1–3." },
  { t = "note", id = "4009", text = "Ps. cxxxii. 11." },
  { t = "note", id = "4010", text = "Luke i. 30–33." },
  { t = "note", id = "4011", text = "Rev. v. 1–5." },
]

[[section]]
id = "that-christ-should-be-born-in-bethlehem"
title = "That Christ should be born in Bethlehem."
level = 2
blocks = [
  { t = "p", text = "12. That Christ should be born in Bethlehem." },
  { t = "p", text = "In Micah: “And thou, Bethlehem, house of Ephrata, art not little, that thou shouldst be appointed among the thousands of Judah. Out of thee shall He come forth to me, that He may be a prince in Israel, and His goings forth from the beginning from the days of old.”[^4012] Also in the Gospel: “And when Jesus was born in Bethlehem of Judah, in the days of Herod the king, behold, Magi came from the east to Jerusalem, saying, Where is He that is born King of the Jews? For we have seen His star in the east, and we have come with gifts to worship Him.”[^4013]" },
  { t = "note", id = "4012", text = "Mic. v. 2." },
  { t = "note", id = "4013", text = "Matt. ii. 1, 2." },
]

[[section]]
id = "that-christ-was-to-come-in-low"
title = "That Christ was to come in low estate in His first advent."
level = 2
blocks = [
  { t = "p", text = "13. That Christ was to come in low estate in His first advent." },
  { t = "p", text = "In Isaiah: “Lord, who hath believed our report, and to whom is the Arm of the Lord revealed? We have declared in His presence as children, as a root in a thirsty ground. There is no form nor glory in Him; and we saw Him, and He had no form nor beauty; but His form was without honour, and lacking beyond other men. He was a man set in a plague, and knowing how to bear weakness; because His face was turned away, He was dishonoured, and was not accounted of. He bears our sins, and grieves for us; and we thought that He was in grief, and in wounding, and in affliction; but He was wounded for our transgressions, and He was weakened[^4014] for our sins. The discipline of our peace was upon Him, and with His bruise we are healed. We all like sheep have gone astray; man has gone out of his way. And God has delivered Him for our sins; and He, because He was afflicted, opened not His mouth.”[^4015] Also in the same: “I am not rebellious, nor do I contradict. I gave my back to the stripes, and my cheeks to the palms of the hands. Moreover, I did not turn away my face from the foulness of spitting, and God was my helper.”[^4016] Also in the same: “He shall not cry, nor will any one hear His voice in the streets. He shall not break a bruised reed, and a smoking flax He shall not extinguish; but He shall bring forth judgment in truth. He shall shine forth, and shall not be shaken, until He set judgment in the earth, and in His name shall the nations trust.”[^4017] Also in the twenty-first Psalm: “But I am a worm, and no man; the accursed of man, and the casting away of the people. All they who saw me despised me, and spoke within their lips, and moved their head. He hoped in the Lord, let Him deliver him; let Him save him, since he will have Him.”[^4018] Also in that place: “My strength is dried up like a potsherd, and my tongue is glued to my jaws.”[^4019] Also in Zechariah: “And the Lord showed me Jesus, that great priest, standing before the face of the Angel of the Lord, and the devil was standing at his right hand to oppose him. And Jesus was clothed in filthy garments, and he stood before the face of the Angel Himself; and He answered and said to them who were standing before His face, saying, Take away his filthy garments from him. And he said to him, Behold, I have taken away thine iniquities. And put upon him a priestly garment,[^4020] and set a fair mitre[^4021] upon his head.”[^4022] Also Paul to the Philippians: “Who, being established in the form of God, thought it not robbery that He was equal with God, but emptied Himself, taking the form of a servant, and was made in the likeness of men; and being found in fashion as a man, He humbled Himself, becoming obedient even unto death, even the death of the cross. Wherefore also God exalted Him, and gave Him a name which is above every name, that in the name[^4023] of Jesus every knee should bow, of things in heaven, of things in earth, and of infernal things, and every tongue should confess that Jesus Christ is Lord in the glory of God the Father.”[^4024]" },
  { t = "note", id = "4014", text = "“Infirmatus;” Oxford transl. “bruised.”" },
  { t = "note", id = "4015", text = "Isa. liii. 1–7. [See p. 516, *supra*.]" },
  { t = "note", id = "4016", text = "Isa. l. 5–7." },
  { t = "note", id = "4017", text = "Isa. xlii. 2–4." },
  { t = "note", id = "4018", text = "Ps. xxii. 6–8." },
  { t = "note", id = "4019", text = "Ps. xxii. 15." },
  { t = "note", id = "4020", text = "“Poderem,” “a long priestly robe reaching to the heels” (Migne’s *Lexicon*). The Oxford translation gives the meaning “an alb,” which also is given in Migne." },
  { t = "note", id = "4021", text = "Cidarim, the head-dress for the Jewish high priest." },
  { t = "note", id = "4022", text = "Zech. iii. 1, 3, 5." },
  { t = "note", id = "4023", text = "“*In* nomine;” Oxford translator, “at the name,” following the Eng. ver. But see the Greek, ἐν τῷ ὀνόματι." },
  { t = "note", id = "4024", text = "Phil. ii. 6–11." },
]

[[section]]
id = "that-he-is-the-righteous-one-whom"
title = "That He is the righteous One whom the Jews should put to death."
level = 2
blocks = [
  { t = "p", text = "14. That He is the righteous One whom the Jews should put to death." },
  { t = "p", text = "In the Wisdom of Solomon: “Let us lay hold of the righteous, because He is disagreeable to us, and is contrary to our works, and reproacheth us with our transgressions of the law.[^4025] He professeth that He has the knowledge of God, and calls Himself the Son of God; He has become to us an exposure of our thoughts; He is grievous unto us even to look upon, because His life is unlike to others, and His ways are changed. We are esteemed by Him as frivolous, and He restraineth Himself from our ways, as if from uncleanness; and He extols the last end of the righteous, and boasts that He has God for His Father. Let us see, then, if His words are true, and let us try what will come to Him. Let us interrogate Him with reproach and torture, that we may know His reverence and prove His patience. Let us condemn Him with a most shameful death. These things they considered, and erred. For their maliciousness hath blinded them, and they knew not the sacraments of God.”[^4026] Also in Isaiah: “See ye how the righteous perisheth, and no man understandeth; and righteous men are taken away, and no man regardeth. For the righteous man is taken away from the face of unrighteousness, and his burial shall be in peace.”[^4027] Concerning this very thing it was before foretold in Exodus: “Thou shalt not slay the innocent and the righteous.”[^4028] Also in the Gospel: “Judas, led by penitence, said to the priests and elders, I have sinned, in that I have betrayed the innocent blood.”[^4029]" },
  { t = "note", id = "4025", text = "The Oxford translation here inserts from the Apocrypha, without authority even for its text, “and objecteth to us the transgressions of the law.”" },
  { t = "note", id = "4026", text = "Wisd. ii. 12–22." },
  { t = "note", id = "4027", text = "Isa. lvii. 1, 2. [Justin, vol. i. 203.]" },
  { t = "note", id = "4028", text = "Ex. xxiii. 7." },
  { t = "note", id = "4029", text = "Matt. xxvii. 3, 4." },
]

[[section]]
id = "that-christ-is-called-a-sheep-and"
title = "That Christ is called a sheep and a lamb who was to be slain, and concerning the sacrament (mystery) of the passion."
level = 2
blocks = [
  { t = "p", text = "15. That Christ is called a sheep and a lamb who was to be slain, and concerning the sacrament (mystery) of the passion." },
  { t = "p", text = "In Isaiah: “He was led as a sheep to the slaughter, and as a lamb before his shearer is dumb, so He opened not His mouth. In His humiliation His judgment was taken away: who shall relate His nativity? Because His life shall be taken away from the earth. By the transgressions of my people He was led to death; and I will give the wicked for His burial, and the rich themselves for His death; because He did no wickedness, nor deceits with His mouth. Wherefore He shall gain many, and shall divide the spoils of the strong; because His soul was delivered up to death, and He was counted among transgressors. And He bare the sins of many, and was delivered for their offences.”[^4030] Also in Jeremiah: “Lord, give me knowledge, and I shall know it: then I saw their meditations. I was led like a lamb without malice to the slaughter; against me they devised a device, saying, Come, let us cast the tree into His bread,[^4031] and let us erase His life from the earth, and His name shall no more be a remembrance.”[^4032] Also in Exodus God said to Moses: “Let them take to themselves each man a sheep, through the houses of the tribes, a sheep without blemish, perfect, male, of a year old it shall be to you. Ye shall take it from the lambs and from the goats, and all the congregation of the synagogue of the children of Israel shall kill it in the evening; and they shall take of its blood, and shall place it upon the two posts,[^4033] and upon the threshold in the houses, in the very houses in which they shall eat it. And they shall eat the flesh on the same night, roasted with fire; and they shall eat unleavened bread with bitter herbs.[^4034] Ye shall not eat of them raw nor dressed in water, but roasted with fire; the head with the feet and the inward parts. Ye shall leave nothing of them to the morning; and ye shall not break a bone of it. But what of it shall be left to the morning shall be burnt with fire. But thus ye shall eat it; your loins girt, and your sandals on your feet, and your staff in your hands; and ye shall eat it in haste: for it is the Lord’s passover.”[^4035] Also in the Apocalypse: “And I saw in the midst of the throne, and of the four living creatures, and in the midst of the elders, a Lamb standing as if slain, having seven horns and seven eyes, which are the seven spirits of God sent forth throughout all the earth. And He came and took the book from the right hand of God, who sate on the throne. And when He had taken the book, the four living creatures and the four and twenty elders cast themselves before the Lamb, having every one of them harps and golden cups[^4036] full of odours of supplications, which are the prayers of the saints; and they sang a new song, saying, Worthy art Thou, O Lord, to take the book, and to open its seals: for Thou wast slain, and hast redeemed us with Thy blood from every tribe, and tongue, and people, and nation; and Thou hast made us a kingdom unto our God, and hast made us priests, and they shall reign upon the earth.”[^4037] Also in the Gospel: “On the next day John saw Jesus coming to him, and saith, Behold the Lamb of God, and behold Him that taketh away the sins of the world!”[^4038]" },
  { t = "note", id = "4030", text = "Isa. liii. 7–9, 12." },
  { t = "note", id = "4031", text = "[Tertull., iii. p. 166. Note also “the *mystery* of the passion.”]" },
  { t = "note", id = "4032", text = "Jer. xi. 18, 19." },
  { t = "note", id = "4033", text = "Migne’s reading differs considerably from this, and is as follows: “They shall take from the lambs and the goats of its blood, and shall place it upon the two posts,” etc." },
  { t = "note", id = "4034", text = "Erasmus reads for “picridibus,” “lactucis agrestibus,” wild lettuces." },
  { t = "note", id = "4035", text = "Ex. xii. 3–12." },
  { t = "note", id = "4036", text = "“Pateras.”" },
  { t = "note", id = "4037", text = "Rev. v. 6–10." },
  { t = "note", id = "4038", text = "John i. 29." },
]

[[section]]
id = "that-christ-also-is-called-a-stone"
title = "That Christ also is called a Stone."
level = 2
blocks = [
  { t = "p", text = "16. That Christ also is called a Stone." },
  { t = "p", text = "In Isaiah: “Thus saith the Lord, Behold, I place on the foundations of Sion a precious stone, elect, chief, a corner stone, honourable; and he who trusteth in Him shall not be confounded.”[^4039] Also in the cxviith Psalm: “The stone which the builders rejected, the same is become the head of the corner. This is done by the Lord, and it is wonderful in our eyes. This is the day which the Lord hath made; let us rejoice and be glad in it. O Lord, save therefore, O Lord, direct therefore. Blessed is He who cometh in the name of the Lord.”[^4040] Also in Zechariah: “Behold, I bring forth my servant. The Orient is his name, because the stone which I have placed before the face of Jesus; upon that one stone are seven eyes.”[^4041] Also in Deuteronomy: “And thou shalt write upon the stone all this law, very plainly.”[^4042] Also in Jesus the son of Nave: “And he took a great stone, and placed it there before the Lord; and Jesus said unto the people, Behold, this stone shall be to you for a testimony, because it hath heard all the things which were spoken by the Lord, which He hath spoken to you to-day; and it shall be for a testimony to you in the last of the days, when ye shall have departed from your God.”[^4043] Also in the Acts of the Apostles, Peter: “Ye princes of the people, and elders of Israel, hearken: Behold, we are this day interrogated by you about the good deed done to the impotent man, by means of which he is made whole. Be it known unto you all, and to all the people of Israel, that in the name of Jesus Christ of Nazareth, whom ye have crucified, whom God hath raised up from the dead, by Him he stands whole in your presence, but by none other. This is the stone which was despised by you builders, which has become the head of the corner. For there is no other name given to men under heaven in which we must be saved.”[^4044] This is the stone in Genesis, which Jacob places at his head, because the head of the man is Christ; and as he slept he saw a ladder reaching to heaven, on which the Lord was placed, and angels were ascending and descending.[^4045] And this stone he designating Christ consecrated and anointed with the sacrament of unction. This is the stone in Exodus upon which Moses sate on the top of a hill when Jesus the son of Nave fought against Amalek; and by the sacrament of the stone, and the stedfastness of his sitting, Amalek was overcome by Jesus, that is, the devil was overcome by Christ. This is the great stone in the first book of Kings, upon which was placed the ark of the covenant when the oxen brought it back in the cart, sent back and returned by the strangers. Also, this is the stone in the first book of Kings, with which David smote the forehead of Goliath and slew him; signifying that the devil and his servants are thereby thrown down—that part of the head, namely, being conquered[^4046] which they have not had sealed. And by this seal we also are always safe and live. This is the stone which, when Israel had conquered the aliens, Samuel set up and called its name Ebenezer; that is, the stone that helpeth." },
  { t = "note", id = "4039", text = "Isa. xxviii. 16. [See Tertull., “stumbling-stone,” vol. iii. p. 165.]" },
  { t = "note", id = "4040", text = "Ps. cxviii. 21–26." },
  { t = "note", id = "4041", text = "Zech. iii. 8, 9." },
  { t = "note", id = "4042", text = "Deut. xxvii. 8." },
  { t = "note", id = "4043", text = "Josh. xxiv. 26, 27." },
  { t = "note", id = "4044", text = "Acts iv. 8–12." },
  { t = "note", id = "4045", text = "[The *anointing* of this stone gave it the name of *Messiah* in our author’s account; and this interpretation gives great dignity to Jacob’s dying reference to Him, Gen. xlix. 24.] The Oxford edition omits “and descending.”" },
  { t = "note", id = "4046", text = "The Oxford edition reads, “conquered, that is, in that part of the head.”" },
]

[[section]]
id = "that-afterwards-this-stone-should-become-a"
title = "That afterwards this Stone should become a mountain, and should fill the whole earth."
level = 2
blocks = [
  { t = "p", text = "17. That afterwards this Stone should become a mountain, and should fill the whole earth." },
  { t = "p", text = "In Daniel: “And behold a very great image; and the aspect of this image was fearful, and it stood erect before thee; whose head was of fine gold, its breast and arms were silver, its belly and thighs were of brass, and its feet were partly indeed of iron, and partly of clay, until that a stone was cut[^4047] out of the mountain, without the hands of those that should cut it, and struck the image upon the feet of iron and clay, and brake them into small fragments. And the iron, and the clay, and the brass, and the silver, and the gold, was made altogether; and they became small as chaff, or dust in the threshing-floor in summer; and the wind blew them away, so that nothing remained of them. And the stone which struck the image became a great mountain, and filled the whole earth.”[^4048]" },
  { t = "note", id = "4047", text = "[Hippolytus, p. 209, *supra*.]" },
  { t = "note", id = "4048", text = "Dan. ii. 31–35." },
]

[[section]]
id = "that-in-the-last-times-the-same"
title = "That in the last times the same mountain should be manifested, and upon it the Gentiles should come, and on it all the righteous should go up."
level = 2
blocks = [
  { t = "p", text = "18. That in the last times the same mountain should be manifested, and upon it the Gentiles should come, and on it all the righteous should go up." },
  { t = "p", text = "In Isaiah: “In the last times the mountain of the Lord shall be revealed, and the house of God upon the tops of the mountains; and it shall be exalted above the hills, and all nations shall come upon it, and many shall walk and say, Come, and let us go up into the mountain of the Lord, and into the house of the God of Jacob; and He will tell us His way, and we will walk in it. For from Sion shall proceed the law, and the word of the Lord from Jerusalem; and He shall judge among the nations, and shall rebuke much people; and they shall beat their swords into ploughshares, and their spears into pruning-hooks, and they shall no more learn to fight.”[^4049] Also in the twenty-third Psalm: “Who shall ascend into the hill of the Lord, or who shall stand in His holy place? He that is innocent in his hands, and of a clean heart; who hath not received his life in vanity, and hath not sworn craftily to his neighbour. He shall receive the blessing from the Lord, and mercy[^4050] from the God that saveth him. This is the generation of those who seek Him, that seek the face of the God of Jacob.”[^4051]" },
  { t = "note", id = "4049", text = "Isa. ii. 2–4." },
  { t = "note", id = "4050", text = "“Misericordiam.”" },
  { t = "note", id = "4051", text = "Ps. xxiv. 3–6." },
]

[[section]]
id = "that-christ-is-the-bridegroom-having-the"
title = "That Christ is the Bridegroom, having the Church as His bride, from which spiritual children were to be born."
level = 2
blocks = [
  { t = "p", text = "19. That Christ is the Bridegroom, having the Church as His bride, from which spiritual children were to be born." },
  { t = "p", text = "In Joel: “Blow with the trumpet in Sion; sanctify a fast, and call a healing; assemble the people, sanctify the Church, gather the elders, collect the little ones that suck the breast; let the Bridegroom go forth of His chamber, and the bride out of her closet.”[^4052] Also in Jeremiah: “And I will take away from the cities of Judah, and from the streets of Jerusalem, the voice of the joyous, and the voice of the glad; the voice of the bridegroom, and the voice of the bride.”[^4053] Also in the eighteenth Psalm: “And he is as a bridegroom going forth from his chamber; he exulted as a giant to run his course. From the height of heaven is his going forth, and his circuit even to the end of it; and there is nothing which is hid from his heat.”[^4054] Also in the Apocalypse: “Come, I will show thee the new bride, the Lamb’s wife. And he took me in the Spirit to a great mountain, and he showed me the holy city Jerusalem descending out of heaven from God, having the glory of God.”[^4055] Also in the Gospel according to John: “Ye are my witnesses, that I said to them who were sent from Jerusalem to me, that I am not the Christ, but that I am sent before Him. For he who has the bride is the bridegroom; but the friend of the bridegroom is he who standeth and heareth him with joy, and rejoiceth because of the voice of the bridegroom.”[^4056] The mystery of this matter was shown in Jesus the son of Nave, when he was bidden to put his shoes from off him, doubtless because he himself was not the bridegroom. For it was in the law, that whoever should refuse marriage should put off his shoe, but that he should be shod who was to be the bridegroom: “And it happened, when Jesus was in Jericho, he looked around with his eyes, and saw a man standing before his face, and holding a javelin[^4057] in his hand, and said, Art thou for us or for our enemies? And he said, I am the leader of the host of the Lord; now draw near. And Jesus fell on his face to the earth, and said to him, Lord, what dost Thou command unto Thy servant. And the leader of the Lord’s host said, Loose thy shoe from thy feet, for the place whereon thou standest is holy ground.”[^4058] Also, in Exodus, Moses is bidden to put off his shoe, because he, too, was not the bridegroom: “And there appeared unto him the angel of the Lord in a flame of fire out of a bush; and he saw that the bush burned with fire, but the bush was not consumed. And Moses said, I will pass over and see this great sight, why the bush is not consumed. But when He saw that he drew near to see, the Lord God called him from the bush, saying, Moses, Moses. And he said, What is it? And He said, Draw not nigh hither, unless thou hast loosed thy shoe from off thy feet; for the place on which thou standest is holy ground. And He said unto him, I am the God of thy father, the God of Abraham, and the God of Isaac, and the God of Jacob.”[^4059] This was also made plain in the Gospel according to John: “And John answered them, I indeed baptize with water, but there standeth One in the midst of you whom ye know not: He it is of whom I said, The man that cometh after me is made before me, the latchet of whose shoe I am not worthy to unloose.”[^4060] Also according to Luke: “Let your loins be girt, and your lamps burning, and ye like to men that wait for their master when he shall come from the wedding, that when he cometh and knocketh, they may open unto him. Blessed are those servants whom their Lord, when He cometh, shall find watching.”[^4061] Also in the Apocalypse: “The Lord God omnipotent reigneth: let us be glad and rejoice, and let us give to Him the honour of glory; for the marriage of the Lamb is come, and His wife hath made herself ready.”[^4062]" },
  { t = "note", id = "4052", text = "Joel ii. 15, 16." },
  { t = "note", id = "4053", text = "Jer. xvi. 9." },
  { t = "note", id = "4054", text = "Ps. xix. 5, 6." },
  { t = "note", id = "4055", text = "Rev. xxi. 9–11." },

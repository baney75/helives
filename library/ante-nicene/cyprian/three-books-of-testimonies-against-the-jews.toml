[[section]]
id = "that-the-jews-would-fasten-christ-to"
title = "That the Jews would fasten Christ to the cross."
level = 2
blocks = [
  { t = "p", text = "20. That the Jews would fasten Christ to the cross." },
  { t = "p", text = "In Isaiah: “I have spread out my hands all day to a people disobedient and contradicting me, who walk in ways that are not good, but after their own sins.”[^4063] Also in Jeremiah: “Come, let us cast the tree into His bread, and let us blot out His life from the earth.”[^4064] Also in Deuteronomy: “And Thy life shall be hanging (in doubt) before Thine eyes; and Thou shalt fear day and night, and shalt not trust to Thy life.”[^4065] Also in the twenty-first Psalm: “They tore my hands and my feet;[^4066] they numbered all my bones. And they gazed upon me, and saw me, and divided my garments among them, and upon my vesture they cast a lot. But Thou, O Lord, remove not Thy help far from me; attend unto my help. Deliver my soul from the sword, and my only one from the paw[^4067] of the dog. Save me from the mouth of the lion, and my lowliness from the horns of the unicorns. I will declare Thy name unto my brethren; in the midst of the Church I will praise Thee.”[^4068] Also in the cxviiith Psalm: “Pierce my flesh with nails through fear of Thee.”[^4069] Also in the cxlth Psalm: “The lifting up of my hands is an evening sacrifice.”[^4070] Of which sacrifice Sophonias said: “Fear from the presence of the Lord God, since His day is near, because the Lord hath prepared His sacrifice, He hath sanctified His elect.”[^4071] Also in Zechariah: “And they shall look upon me, whom they have pierced.”[^4072] Also in the eighty-seventh Psalm: “I have called unto Thee, O Lord, the whole day; I have stretched out my hands unto Thee.”[^4073] Also in Numbers: “Not as a man is God suspended, nor as the son of man does He suffer threats.”[^4074] Whence in the Gospel the Lord says: “As Moses lifted up the serpent in the wilderness, even so must the Son of man be lifted up, that whosoever believeth in the Son may have life eternal.”[^4075]" },
  { t = "note", id = "4063", text = "Isa. lxv. 2. [So Justin, vol. i. pp. 179 and 206. But compare Isa. xxv. 11, a remarkable simile.]" },
  { t = "note", id = "4064", text = "Jer. xi. 19." },
  { t = "note", id = "4065", text = "Deut. xxviii. 66." },
  { t = "note", id = "4066", text = "[This is one of the passages corrupted by the Jews since the crucifixion. See Pearson, *On the Creed*, p. 534. All his notes on “crucified” are most precious.]" },
  { t = "note", id = "4067", text = "“Manu.”" },
  { t = "note", id = "4068", text = "Ps. xxii. 16–22." },
  { t = "note", id = "4069", text = "Ps. cxix. 120." },
  { t = "note", id = "4070", text = "Ps. cxli. 2." },
  { t = "note", id = "4071", text = "Zeph. i. 7." },
  { t = "note", id = "4072", text = "Zech. xii. 10." },
  { t = "note", id = "4073", text = "Ps. lxxxviii. 9." },
  { t = "note", id = "4074", text = "Num. xxiii. 19." },
  { t = "note", id = "4075", text = "John iii. 14, 15." },
]

[[section]]
id = "that-in-the-passion-and-the-sign"
title = "That in the passion and the sign of the cross is all virtue and power."
level = 2
blocks = [
  { t = "p", text = "21. That in the passion and the sign of the cross is all virtue and power." },
  { t = "p", text = "In Habakkuk: “His virtue covered the heavens, and the earth is full of His praise, and His splendour shall be as the light; there shall be horns in His hands. And there the virtue of His glory was established, and He founded His strong love. Before His face shall go the Word, and shall go forth unto the plains according to His steps.”[^4076] In Isaiah also: “Behold, unto us a child is born, and to us a Son is given, upon whose shoulders shall be government; and His name shall be called the Messenger of a mighty thought.”[^4077] By this sign of the cross also Amalek was conquered by Jesus through Moses. In Exodus Moses said to Jesus: “Choose thee out men, and go forth, and order yourselves with Amalek until the morrow. Behold, I will stand on the top of the hill, and the rod of God in mine hand. And it came to pass, when Moses lifted up his hands, Israel prevailed; but when Moses had let down his hands, Amalek waxed strong. But the hands of Moses were heavy; and they took a stone, and placed it under him, and he sat upon it and Aaron and Hur held up his hands, on the one side and on the other side; and the hands of Moses were made steady even to the setting of the sun. And Jesus routed Amalek and all his people. And the Lord said unto Moses, Write this, that it may be a memorial in a book, and tell it unto the ears of Jesus, that I may utterly destroy the memory of Amalek from under heaven.”[^4078]" },
  { t = "note", id = "4076", text = "Hab. iii. 3–5." },
  { t = "note", id = "4077", text = "Isa. ix. 6." },
  { t = "note", id = "4078", text = "Ex. xvii. 9–14." },
]

[[section]]
id = "that-in-this-sign-of-the-cross"
title = "That in this sign of the Cross is salvation for all people who are marked on their foreheads."
level = 2
blocks = [
  { t = "p", text = "22. That in this sign of the Cross is salvation for all people who are marked on their foreheads.[^4079]" },
  { t = "note", id = "4079", text = "[i.e., baptized; but probably after immersion this symbolic ceremony was already in use.]" },
  { t = "p", text = "In Ezekiel the Lord says: “Pass through the midst of Jerusalem, and thou shalt mark the sign upon the men’s foreheads, who groan and grieve for the iniquities which are done in the midst of them.”[^4080] Also in the same place: “Go and smite, and do not spare your eyes. Have no pity on the old man, and the youth, and the virgin, and slay little children and women, that they may be utterly destroyed. But ye shall not touch any one upon whom the sign is written, and begin with my holy places themselves.”[^4081] Also in Exodus God says to Moses: “And there shall be blood for a sign to you upon the houses wherein ye shall be; and I will look on the blood, and will protect you. And there shall not be in you the plague of wasting when I shall smite the land of Egypt.”[^4082] Also in the Apocalypse: “And I saw[^4083] a Lamb standing on Mount Sion, and with Him a hundred and forty and four thousand; and they had His name and the name of His Father written on their foreheads.”[^4084] Also in the same place: “I am Alpha and Omega, the first and the last, the beginning and the end. Blessed are they that do His commandments, that they may have power over the tree of life.”[^4085]" },
  { t = "note", id = "4080", text = "Ezek. ix. 4." },
  { t = "note", id = "4081", text = "Ezek. ix. 4–6." },
  { t = "note", id = "4082", text = "Ex. xii. 13." },
  { t = "note", id = "4083", text = "“And behold,” Oxford text." },
  { t = "note", id = "4084", text = "Rev. xiv. 1." },
  { t = "note", id = "4085", text = "Rev. xxii. 13, 14." },
]

[[section]]
id = "that-at-mid-day-in-his-passion"
title = "That at mid-day in His passion there should be darkness."
level = 2
blocks = [
  { t = "p", text = "23. That at mid-day in His passion there should be darkness." },
  { t = "p", text = "In Amos: “And it shall come to pass in that day, saith the Lord, the sun shall set at noonday, and the day of light shall be darkened; and I will turn your feast-days into grief, and all your songs into lamentation.”[^4086] Also in Jeremiah: “She is frightened that hath borne children, and her soul hath grown weary. Her sun hath gone down while as yet it was mid-day; she hath been confounded and accursed: I will give the rest of them to the sword in the sight of their enemies.”[^4087] Also in the Gospel: “Now from the sixth hour there was darkness over all the earth even to the ninth hour.”[^4088]" },
  { t = "note", id = "4086", text = "Amos viii. 9, 10. [Lardner, *Credib*., vol. vii. pp. 107–124.]" },
  { t = "note", id = "4087", text = "Jer. xv. 9. [I admire Lardner’s caution: possibly he carries it too far.]" },
  { t = "note", id = "4088", text = "Matt. xxvii. 45. [See vol. iii. p. 58.]" },
]

[[section]]
id = "that-he-was-not-to-be-overcome"
title = "That He was not to be overcome of death, nor should remain in Hades."
level = 2
blocks = [
  { t = "p", text = "24. That He was not to be overcome of death, nor should remain in Hades." },
  { t = "p", text = "In the twenty-ninth Psalm: “O Lord, Thou hast brought back my soul from hell.”[^4089] Also in the fifteenth Psalm: “Thou wilt not leave my soul in hell, neither wilt Thou suffer Thine Holy One to see corruption.”[^4090] Also in the third Psalm: “I laid me down and slept, and rose up again, because the Lord helped me.”[^4091] Also according to John: “No man taketh away my life from me; but I lay it down of myself. I have the power of laying it down, and I have the power of taking it again. For this commandment I have received from my Father.”[^4092]" },
  { t = "note", id = "4089", text = "Ps. xxx. 3." },
  { t = "note", id = "4090", text = "Ps. xvi. 10." },
  { t = "note", id = "4091", text = "Ps. iii. 5." },
  { t = "note", id = "4092", text = "John x. 18." },
]

[[section]]
id = "that-he-should-rise-again-from-the"
title = "That He should rise again from the dead on the third day."
level = 2
blocks = [
  { t = "p", text = "25. That He should rise again from the dead on the third day." },
  { t = "p", text = "In Hosea: “After two days He will revive us; we shall rise again on the third day.”[^4093] Also in Exodus: “And the Lord said unto Moses, Go down and testify to the people, and sanctify them to-day and to-morrow; and let them wash their garments, and let them be prepared against the day after to-morrow. For on the third day the Lord will come down on Mount Sinai.”[^4094] Also in the Gospel: “A wicked and adulterous generation seeketh after a sign; and there shall no sign be given unto it but the sign of the prophet Jonas: for as Jonas was in the whale’s belly three days and three nights, so shall the Son of man be three days and three nights in the heart of the earth.”[^4095]" },
  { t = "note", id = "4093", text = "Hos. vi. 2." },
  { t = "note", id = "4094", text = "Ex. xix. 10, 11." },
  { t = "note", id = "4095", text = "Matt. xii. 39, 40." },
]

[[section]]
id = "that-after-he-had-risen-again-he"
title = "That after He had risen again He should receive from His Father all power, and His power should be everlasting."
level = 2
blocks = [
  { t = "p", text = "26. That after He had risen again He should receive from His Father all power, and His power should be everlasting." },
  { t = "p", text = "In Daniel: “I saw in a vision by night, and behold as it were the Son of man, coming in the clouds of heaven, came even to the Ancient of days, and stood in His sight. And they who stood beside Him brought Him before Him: and to Him was given a royal power, and all the kings of the earth by their generation, and all glory obeying Him: and His power is eternal, which shall not be taken away, and His kingdom shall not be destroyed.”[^4096] Also in Isaiah: “Now will I arise, saith the Lord; now will I be glorified, now will I be exalted, now ye shall see, now ye shall understand, now ye shall be confounded. Vain will be the strength of your spirit: the fire shall consume you.”[^4097] Also in the cixth Psalm: “The Lord said unto my Lord, Sit Thou on my right hand, until I make Thine enemies the footstool of Thy feet. God will send the rod of Thy power out of Sion, and Thou shalt rule in the midst of Thine enemies.”[^4098] Also in the Apocalypse: “And I turned and looked to see the voice which spake with me. And I saw seven golden candlesticks, and in the midst of the candlesticks one like unto the Son of man, clothed with a long garment,[^4099] and He was girt about the paps with a golden girdle. And His head and His hairs were white as wool or snow, and His eyes as a flame of fire, and His feet like to fine brass from a furnace of fire, and His voice like the sound of many waters. And He had in His right hand seven stars: and out of His mouth went a sharp two-edged sword; and His face shone as the sun in his might. And when I saw Him, I fell at His feet as dead. And He laid His right hand upon me, and said, Fear not; I am the first and the last, and He that liveth and was dead; and, lo, I am living for evermore[^4100] and I have the keys of death and of hell.”[^4101] Likewise in the Gospel, the Lord after His resurrection says to His disciples: “All power is given unto me in heaven and in earth. Go therefore and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost, teaching them to observe all things whatsoever I have commanded you.”[^4102]" },
  { t = "note", id = "4096", text = "Dan. vii. 13, 14." },
  { t = "note", id = "4097", text = "Isa. xxxiii. 10, 11." },
  { t = "note", id = "4098", text = "Ps. cx. 1, 2." },
  { t = "note", id = "4099", text = "“Podere.”" },
  { t = "note", id = "4100", text = "One codex reads here, “living in the assembly of the saints.”" },
  { t = "note", id = "4101", text = "Rev. i. 12–18." },
  { t = "note", id = "4102", text = "Matt. xxviii. 18–20." },
]

[[section]]
id = "that-it-is-impossible-to-attain-to"
title = "That it is impossible to attain to God the Father, except by His Son Jesus Christ."
level = 2
blocks = [
  { t = "p", text = "27. That it is impossible to attain to God the Father, except by His Son Jesus Christ." },
  { t = "p", text = "In the Gospel: “I am the way, and the truth, and the life: no one cometh to the Father but by me.”[^4103] Also in the same place: “I am the door: by me if any man shall enter in, he shall be saved.”[^4104] Also in the same place: “Many prophets and righteous men have desired to see the things which ye see, and have not seen them; and to hear those things which ye hear, and have not heard them.”[^4105] Also in the same place: “He that believeth on the Son hath eternal life: he that is not obedient in word to the Son hath not life; but the wrath of God shall abide upon him.”[^4106] Also Paul to the Ephesians: “And when He had come, He preached peace to you, to those which are afar off, and peace to those which are near, because through Him we both have access in one Spirit unto the Father.”[^4107] Also to the Romans: “For all have sinned, and fail of the glory of God; but they are justified by His gift and grace, through the redemption which is in Christ Jesus.”[^4108] Also in the Epistle of Peter the apostle: “Christ hath died once for our sins, the just for the unjust, that He might present us to God.”[^4109] Also in the same place: “For in this also was it preached to them that are dead, that they might be raised again.”[^4110] Also in the Epistle of John: “Whosoever denieth the Son, the same also hath not the Father. He that confesseth the Son, hath both the Son and the Father.”[^4111]" },
  { t = "note", id = "4103", text = "John xiv. 6." },
  { t = "note", id = "4104", text = "John x. 9." },
  { t = "note", id = "4105", text = "Matt. xiii. 17." },
  { t = "note", id = "4106", text = "John iii. 36." },
  { t = "note", id = "4107", text = "Eph. ii. 17, 18." },
  { t = "note", id = "4108", text = "Rom. iii. 23, 24." },
  { t = "note", id = "4109", text = "1 Pet. iii. 18." },
  { t = "note", id = "4110", text = "1 Pet. iv. 6." },
  { t = "note", id = "4111", text = "1 John ii. 23." },
]

[[section]]
id = "that-jesus-christ-shall-come-as-a"
title = "That Jesus Christ shall come as a Judge."
level = 2
blocks = [
  { t = "p", text = "28. That Jesus Christ shall come as a Judge." },
  { t = "p", text = "In Malachi: “Behold, the day of the Lord cometh, burning as an oven; and all the aliens and all the wicked shall be as stubble; and the day that cometh shall burn them up, saith the Lord.”[^4112] Also in the forty-ninth (or fiftieth) Psalm: “God the Lord of gods hath spoken, and called the earth. From the rising of the sun even to the going down thereof, out of Sion is the beauty of His glory. God shall come manifestly, our God, and shall not keep silence. A fire shall burn before Him, and round about Him shall be a great storm. He hath called the heaven above, and the earth, that He may separate His people. Gather together His saints unto Him, those who arrange His covenant with sacrifices. And the heavens shall announce His righteousness, for God is the judge.”[^4113] Also in Isaiah: “The Lord God of strength shall go forth, and shall break war in pieces: He shall stir up contest, and shall cry over His enemies with strength. I have been silent; shall I always be silent?”[^4114] Also in the sixty-seventh Psalm: “Let God arise, and let His enemies be scattered: and let those who hate Him flee from His face. As smoke vanisheth, let them vanish: as wax melteth from the face of fire, thus let the sinners perish from the face of God. And let the righteous be glad and rejoice in the sight of God: and let them be glad with joyfulness. Sing unto God, sing praises unto His name: make a way to Him who goeth up into the west. God is His name. They shall be put to confusion from the face of Him who is the Father of the orphans, and the Judge of the widows. God is in His holy place: God, who maketh men to dwell with one mind in an house, bringing forth them that are bound with might, and equally those who provoke unto anger, who dwell in the sepulchres: God, when Thou wentest forth in the sight of Thy people, in passing into the desert.”[^4115] Also in the eighty-first Psalm: “Arise, O God; judge the earth: for Thou wilt exterminate among all nations.”[^4116] Also in the Gospel according to Matthew: “What have we to do with Thee, Thou Son of David? why art Thou come hither to punish us before the time?”[^4117] Likewise according to John: “The Father judgeth nothing, but hath given all judgment to the Son, that all may honour the Son as they honour the Father. He that honoureth not the Son, honoureth not the Father who hath sent Him.”[^4118] So too in the second Epistle of Paul to the Corinthians: “We must all appear before the judgment-seat of Christ, that every one may bear the things proper to his body, according to those things which he hath done, whether they be good or evil.”[^4119]" },
  { t = "note", id = "4112", text = "Mal. iv. 1." },
  { t = "note", id = "4113", text = "Ps. l. 1–6." },
  { t = "note", id = "4114", text = "Isa. xiii. 13, 14." },
  { t = "note", id = "4115", text = "Ps. lxviii. 1–7." },
  { t = "note", id = "4116", text = "Ps. lxxxii. 8." },
  { t = "note", id = "4117", text = "Matt. viii. 29." },
  { t = "note", id = "4118", text = "John v. 22, 23." },
  { t = "note", id = "4119", text = "2 Cor. v. 10." },
]

[[section]]
id = "that-he-will-reign-as-a-king"
title = "That He will reign as a King for ever."
level = 2
blocks = [
  { t = "p", text = "29. That He will reign as a King for ever." },
  { t = "p", text = "In Zechariah: “Tell ye the daughter of Zion, Behold, thy King cometh unto thee: just, and having salvation; meek, sitting upon an ass that hath not been tamed.”[^4120] Also in Isaiah: “Who will declare to you that eternal place? He that walketh in righteousness, and holdeth back his hands from gifts; stopping his ears that he may not hear the judgment of blood; and closing his eyes, that he may not see unrighteousness: this man shall dwell in the lofty cavern of the strong rock; bread shall be given him, and his water shall be sure. Ye shall see the King with glory.”[^4121] Likewise in Malachi: “I am a great King, saith the Lord, and my name is illustrious among the nations.”[^4122] Also in the second Psalm: “But I am established as a King by Him upon His holy hill of Zion, announcing His empire.”[^4123] Also in the twenty-first Psalm: “All the ends of the world shall be reminded, and shall turn to the Lord: and all the countries of the nations shall worship in Thy sight. For the kingdom is the Lord’s: and He shall rule over all nations.”[^4124] Also in the twenty-third Psalm: “Lift up your gates, ye princes; and be ye lifted up, ye everlasting doors; and the King of glory shall come in. Who is this King of glory? The Lord strong and mighty, the Lord strong in battle. Lift up your gates, O ye princes; and be ye lifted up, ye everlasting doors; and the King of glory shall come in. Who is this King of glory? The Lord of hosts, He is the King of glory.”[^4125] Also in the forty-fourth Psalm: “My heart hath breathed forth a good discourse:[^4126] I tell my works to the king: my tongue is the pen of a writer intelligently writing. Thou art lovely in beauty above the children of men: grace is shed forth on Thy lips, because God hath blessed Thee for ever. Be girt with Thy sword on Thy thigh, O most mighty. To Thy honour and to Thy beauty both attend, and direct Thyself, and reign, because of truth, and meekness, and righteousness.”[^4127] Also in the fifth Psalm: “My King, and my God, because unto Thee will I pray. O Lord, in the morning Thou shalt hear my voice; in the morning I will stand before Thee, and will contemplate Thee.”[^4128] Also in the ninety-sixth Psalm: “The Lord hath reigned; let the earth rejoice; let the many isles be glad.”[^4129] Moreover, in the forty-fourth Psalm: “The queen stood at thy right hand in a golden garment; she is clothed in many colours. Hear, O daughter, and see, and incline thine ear, and forget thy people and thy father’s house; for the King hath desired thy beauty, for He is thy Lord God.”[^4130] Also in the seventy-third Psalm: “But God is our King before the world; He hath wrought salvation in the midst of the earth.”[^4131] Also in the Gospel according to Matthew: “And when Jesus was born in Bethlehem of Judah in the days of Herod the king, behold, Magi from the east came to Jerusalem, saying, Where is He who is born King of the Jews? for we have seen His star in the east, and have come to worship Him.”[^4132] Also, according to John, Jesus said: “My kingdom is not of this world. If my kingdom were of this world, my servants would be in trouble, that I should not be delivered to the Jews; but now is my kingdom not from hence. Pilate said, Art thou a king, then? Jesus answered, Thou sayest that I am a king. For this cause I was born, and for this cause I am come into the world, that I might bear testimony to the truth. Every one that is of the truth heareth my voice.”[^4133]" },
  { t = "note", id = "4120", text = "Zech. ix. 9." },
  { t = "note", id = "4121", text = "Isa. xxxiii. 14–17." },
  { t = "note", id = "4122", text = "Mal. i. 14." },
  { t = "note", id = "4123", text = "Ps. ii. 6." },
  { t = "note", id = "4124", text = "Ps. xxii. 27, 28." },
  { t = "note", id = "4125", text = "Ps. xxiv. 7–10." },
  { t = "note", id = "4126", text = "[i.e., rather “a good Word.” See p. 516, *supra*.]" },
  { t = "note", id = "4127", text = "Ps. xlv. 1–4." },
  { t = "note", id = "4128", text = "Ps. v. 2, 3." },
  { t = "note", id = "4129", text = "Ps. xcvii. 1." },
  { t = "note", id = "4130", text = "Ps. xlv. 9–11." },
  { t = "note", id = "4131", text = "Ps. lxxiv. 12." },
  { t = "note", id = "4132", text = "Matt. ii. 1, 2." },
  { t = "note", id = "4133", text = "John i. 36, 37." },
]

[[section]]
id = "that-he-himself-is-both-judge-and"
title = "That He Himself is both Judge and King."
level = 2
blocks = [
  { t = "p", text = "30. That He Himself is both Judge and King." },
  { t = "p", text = "In the seventy-first Psalm: “O God, give Thy judgment to the king, and Thy righteousness to the king’s son, to judge Thy people in righteousness.”[^4134] Also in the Apocalypse: “And I saw the heaven opened, and behold a white horse; and He who sate upon him was called Faithful and True; and He judgeth justice and righteousness, and maketh war. And His eyes were, as it were, a flame of fire, and upon His head were many crowns; and He bare a name written that was known to none other than Himself: and He was clothed with a garment sprinkled with blood, and His name is called the Word of God. And the armies which are in heaven followed Him on white horses, clothed in linen white and clean. And out of His mouth went forth a sword with two edges, that with it He should smite the nations, which He shall shepherd[^4135] with a rod of iron; and He shall tread the winepress of the wrath of God Almighty. Also He has on His garment and on His thigh the name written, King of kings, and Lord of lords.”[^4136] Likewise in the Gospel: “When the Son of man shall come in His glory, and all the angels with Him, then He shall sit in the throne of His glory; and all nations shall be gathered together before Him, and He shall separate them one from another, even as a shepherd separates the sheep from the goats; and He shall place the sheep at His right hand, but the goats at His left hand. Then shall the King say unto them who shall be at His right hand, Come, ye blessed of my Father, receive the kingdom which is prepared for you from the beginning of the world: for I was hungry, and ye gave me to eat: I was thirsty, and ye gave me to drink: I was a stranger, and ye received me: naked, and ye clothed me: sick, and ye visited me: I was in prison, and ye came unto me. Then shall the righteous answer, and say unto Him, Lord, when saw we Thee hungry, and fed Thee? thirsty, and gave Thee to drink? And when saw we Thee a stranger, and received Thee? naked, and clothed Thee? And when saw we Thee sick, and in prison, and came unto Thee? And the King, answering, shall say unto them, Verily I say unto you, In as far as ye have done it to the least of these my brethren, ye have done it unto me. Then shall He say unto them who shall be on His left hand, Depart from me, ye cursed, into everlasting fire, which my Father hath prepared[^4137] for the devil and his angels: for I have been hungry, and ye gave me not to eat: I have been thirsty, and ye gave me not to drink: I was a stranger, and ye received me not: naked, and ye clothed me not: sick, and in prison, and ye visited me not. Then shall they also answer and say, Lord, when saw we Thee hungry, or thirsty, or a stranger, or naked, or sick, or in prison, and have not ministered unto Thee? And He shall answer unto them, Verily I say unto you, Inasmuch as ye have not done it to one of the least of these, ye have not done it unto me. And these shall go away into everlasting burning, but the righteous into life eternal.”[^4138]" },
  { t = "note", id = "4134", text = "Ps. lxxii. 1, 2." },
  { t = "note", id = "4135", text = "The words “which He shall feed,” or“ shepherd,” are wanting in the Apocalypse; and they are not found in many authorities." },
  { t = "note", id = "4136", text = "Rev. xix. 11–16." },
  { t = "note", id = "4137", text = "[Said to be in the old *Itala*, as in some Greek mss. So Irenæus, vol. i. p. 524.]" },
  { t = "note", id = "4138", text = "Matt. xxv. 31–46." },
]

[[section]]
id = "book-3"
title = "Book III."
level = 1
blocks = [
  { t = "h", text = "Preface." },
  { t = "h", text = "*Third Book.*" },
  { t = "p", text = "Cyprian to his son Quirinus,[^4139] greeting. Of your faith and devotion which you manifest to the Lord God, beloved son, you asked me to gather out for your instruction from the Holy Scriptures some heads bearing upon the religious teaching of our school;[^4140] seeking for a succinct course of sacred reading, so that your mind, surrendered to God, might not be wearied with long or numerous volumes of books, but, instructed with a summary of heavenly precepts, might have a wholesome and large compendium for nourishing its memory. And because I owe you a plentiful and loving obedience, I have done what you wished. I have laboured for once, that you might not always labour.[^4141] Therefore, as much as my small ability could embrace, I have collected certain precepts of the Lord, and divine teachings, which may be easy and useful to the readers, in that a few things digested into a short space are both quickly read through, and are frequently repeated. I bid you, beloved son, ever heartily farewell." },
  { t = "note", id = "4139", text = "[Whom he had probably baptized. Elucidation XI.]" },
  { t = "note", id = "4140", text = "[Whom he had probably baptized. Elucidation XI.]" },
  { t = "note", id = "4141", text = "[May the American editor of these volumes venture to trust that he has in some degree lightened the labours of those who come after him: “laboravi semel ne tu semper laborares.”]" },
]

[[section]]
id = "heads"
title = "Heads."
level = 2
blocks = [
  { t = "p", text = "[^4142] 1. On the benefit of good works and mercy." },
  { t = "note", id = "4142", text = "[Six-score precepts to be compared with the heathen maxims and morals with which they so generally conflict. See Elucidation XII.]" },
  { t = "p", text = "2. In works and alms, even if by smallness of power less be done, that the will itself is enough." },
  { t = "p", text = "3. That charity and brotherly love must be religiously and stedfastly practised." },
  { t = "p", text = "4. That we must boast in nothing, since nothing is our own." },
  { t = "p", text = "5. That humility and quietness is to be maintained in all things." },
  { t = "p", text = "6. That all good and righteous men suffer more, but ought to endure because they are proved." },
  { t = "p", text = "7. That we must not grieve the Holy Spirit whom we have received." },
  { t = "p", text = "8. That anger must be overcome, lest it constrain us to sin." },
  { t = "p", text = "9. That brethren ought to sustain one another." },
  { t = "p", text = "10. That we must trust in God only, and in Him we must glory." },
  { t = "p", text = "11. That he who has attained to faith, having put off the former man, ought to regard only celestial and spiritual things, and to give no heed to the world which he has already renounced." },
  { t = "p", text = "12. That we must not swear." },
  { t = "p", text = "13. That we are not to curse." },
  { t = "p", text = "14. That we must never murmur, but bless God concerning all things that happen." },
  { t = "p", text = "15. That men are tried by God for this purpose, that they may be proved." },
  { t = "p", text = "16. Of the benefit of martyrdom." },
  { t = "p", text = "17. That what we suffer in this world is of less account than is the reward which is promised." },
  { t = "p", text = "18. That nothing must be preferred to the love of God and of Christ." },
  { t = "p", text = "19. That we must not obey our own will, but that of God." },
  { t = "p", text = "20. That the foundation and strength of hope and faith is fear." },
  { t = "p", text = "21. That we must not rashly judge of another." },
  { t = "p", text = "22. That when we have received a wrong, we must remit and forgive it." },
  { t = "p", text = "23. That evil is not to be returned for evil." },
  { t = "p", text = "24. That it is impossible to attain to the Father but by Christ." },
  { t = "p", text = "25. That unless a man have been baptized and born again, he cannot attain to the kingdom of God." },
  { t = "p", text = "26. That it is of small account to be baptized and to receive the Eucharist, unless one profits by it both in deeds and works." },
  { t = "p", text = "27. That even a baptized person loses the grace which he has attained, unless he keep innocency." },
  { t = "p", text = "28. That remission cannot in the Church be granted unto him who has sinned against God." },
  { t = "p", text = "29. That it was before predicted concerning the hatred of the Name." },
  { t = "p", text = "30. That what any one has vowed to God, he must quickly pay." },
  { t = "p", text = "31. That he who does not believe is judged already." },
  { t = "p", text = "32. Of the benefit of virginity and of continency." },
  { t = "p", text = "33. That the Father judgeth nothing, but the Son; and the Father is not honoured by him by whom the Son is not honoured." },
  { t = "p", text = "34. That the believer ought not to live like the Gentiles." },
  { t = "p", text = "35. That God is patient for this end, that we may repent of our sin and be reformed." },
  { t = "p", text = "36. That a woman ought not to be adorned in a worldly manner." },
  { t = "p", text = "37. That the believer ought not to be punished for other offences but for the name he bears only." },
  { t = "p", text = "38. That the servant of God ought to be innocent, lest he fall into secular punishment." },
  { t = "p", text = "39. That the example of living is given to us in Christ." },
  { t = "p", text = "40. That we must not labour boastfully or noisily." },
  { t = "p", text = "41. That we must not speak foolishly and offensively." },
  { t = "p", text = "42. That faith is of advantage altogether, and that we can do as much as we believe." },
  { t = "p", text = "43. That he who truly believes can immediately obtain." },
  { t = "p", text = "44. That the believers who differ among themselves ought not to refer to a Gentile judge." },
  { t = "p", text = "45. That hope is of future things, and therefore that faith concerning those things which are promised ought to be patient." },
  { t = "p", text = "46. That a woman ought to be silent in the church." },
  { t = "p", text = "47. That it arises from our fault and our desert that we suffer, and do not perceive God’s help in everything." },
  { t = "p", text = "48. That we must not take usury." },
  { t = "p", text = "49. That even our enemies are to be loved." },
  { t = "p", text = "50. That the sacrament of the faith must not be profaned." },
  { t = "p", text = "51. That no one should be uplifted in his doing." },
  { t = "p", text = "52. That the liberty of believing or of not believing is placed in free choice." },
  { t = "p", text = "53. That the secrets of God cannot be seen through, and therefore that our faith ought to be simple." },
  { t = "p", text = "54. That none is without filth and without sin." },
  { t = "p", text = "55. That we must not please men, but God." },
  { t = "p", text = "56. That nothing that is done is hidden from God." },
  { t = "p", text = "57. That the believer is amended and reserved." },
  { t = "p", text = "58. That no one should be made sad by death, since in living is labour and peril, in dying peace and the certainty of resurrection." },
  { t = "p", text = "59. Of the idols which the Gentiles think gods." },
  { t = "p", text = "60. That too great lust of food is not to be desired." },
  { t = "p", text = "61. That the lust of possessing, and money, are not to be desired." },
  { t = "p", text = "62. That marriage is not to be contracted with Gentiles." },
  { t = "p", text = "63. That the sin of fornication is grievous." },
  { t = "p", text = "64. What are those carnal things which beget death, and what are the spiritual things which lead to life." },
  { t = "p", text = "65. That all sins are put away in baptism." },
  { t = "p", text = "66. That the discipline of God is to be observed in Church precepts." },
  { t = "p", text = "67. That it was foretold that men would despise sound discipline." },
  { t = "p", text = "68. That we must depart from him who lives irregularly and contrary to discipline." },
  { t = "p", text = "69. That the kingdom of God is not in the wisdom of the world, nor in eloquence, but in the faith of the cross and in virtue of conversation." },
  { t = "p", text = "70. That we must obey parents." },
  { t = "p", text = "71. And that fathers ought not to be bitter against their children." },
  { t = "p", text = "72. That servants, when they believe, ought the more to be obedient to their fleshly masters." },
  { t = "p", text = "73. Likewise that masters ought to be more gentle." },
  { t = "p", text = "74. That every widow that is approved ought to be honoured." },
  { t = "p", text = "75. That every person ought to have care rather of his own people, and especially of believers." },
  { t = "p", text = "76. That one who is older must not rashly be accused." },
  { t = "p", text = "77. That the sinner is to be publicly reproved." },
  { t = "p", text = "78. That we must not speak with heretics." },
  { t = "p", text = "79. That innocency asks with confidence, and obtains." },
  { t = "p", text = "80. That the devil has no power against man unless God have allowed it." },
  { t = "p", text = "81. That wages be quickly paid to the hireling." },
  { t = "p", text = "82. That divination must not be used." },
  { t = "p", text = "83. That a tuft of hair[^4143] is not to be worn on the head." },
  { t = "note", id = "4143", text = "“Cirrum in capite non habendum.” “Cirrus” means “a tuft of hair,” or a curl or lovelock. [But compare Clement, vol. ii. p. 286 (and the note, on the chrism), for the more probable meaning.]" },
  { t = "p", text = "84. That the beard must not be plucked." },
  { t = "p", text = "85. That we must rise when a bishop or a presbyter comes." },
  { t = "p", text = "86. That a schism must not be made, even although he who withdraws should remain in one faith and in the same tradition." },
  { t = "p", text = "87. That believers ought to be simple with prudence." },
  { t = "p", text = "88. That a brother must not be deceived." },
  { t = "p", text = "89. That the end of the world comes suddenly." },
  { t = "p", text = "90. That a wife must not depart from her husband; or if she departs, she must remain unmarried." },
  { t = "p", text = "91. That every one is tempted so much as he is able to bear." },
  { t = "p", text = "92. That not everything is to be done which is lawful." },
  { t = "p", text = "93. That it was foretold that heresies would arise." },
  { t = "p", text = "94. That the Eucharist is to be received with fear and honour." },
  { t = "p", text = "95. That we are to live with the good, but to avoid the evil." },
  { t = "p", text = "96. That we must labour with deeds, not with words." },
  { t = "p", text = "97. That we must hasten to faith and to attainment.[^4144]" },
  { t = "note", id = "4144", text = "*Scil*. “of baptism,” Oxford transl." },
  { t = "p", text = "98. That the catechumen ought to sin no more." },
  { t = "p", text = "99. That judgment will be in accordance with the terms, before the law, of equity; after Moses, of the law." },
  { t = "p", text = "100. That the grace of God ought to be gratuitous." },
  { t = "p", text = "101. That the Holy Spirit has often appeared in fire." },
  { t = "p", text = "102. That all good men ought willingly to hear rebuke." },
  { t = "p", text = "103. That we must abstain from much speaking." },
  { t = "p", text = "104. That we must not lie." },
  { t = "p", text = "105. That they are frequently to be corrected who do wrong in domestic service." },
  { t = "p", text = "106. That when a wrong is received, patience is to be maintained, and that vengeance is to be left to God." },
  { t = "p", text = "107. That we must not use detraction." },
  { t = "p", text = "108. That we must not lay snares against our neighbour." },
  { t = "p", text = "109. That the sick are to be visited." },
  { t = "p", text = "110. That tale-bearers are accursed." },
  { t = "p", text = "111. That the sacrifices of evil men are not acceptable." },
  { t = "p", text = "112. That those are more severely judged who in this world have more power." },
  { t = "p", text = "113. That widows and orphans ought to be protected." },
  { t = "p", text = "114. That while one is in the flesh, he ought to make confession." },
  { t = "p", text = "115. That flattery is pernicious." },
  { t = "p", text = "116. That God is more loved by him who has had many sins forgiven in baptism." },
  { t = "p", text = "117. That there is a strong conflict to be waged against the devil, and that therefore we ought to stand bravely, that we may be able to conquer." },
  { t = "p", text = "118. Of Antichrist, that he will come as a man." },
  { t = "p", text = "119. That the yoke of the law was heavy, which is cast off by us; and that the Lord’s yoke is light, which is taken up by us." },
  { t = "p", text = "120. That we are to be urgent in prayers." },
]

[[section]]
id = "testimony-i-of-the-benefit-of-good"
title = "Testimony I. Of the benefit of good works and mercy."
level = 2
blocks = [
  { t = "h", text = "Testimonies." },
  { t = "p", text = "1. Of the benefit of good works and mercy." },
  { t = "p", text = "In Isaiah: “Cry aloud,” saith He, “and spare not; lift up thy voice like a trumpet; tell my people their sins, and the house of Jacob their wickednesses. They seek me from day to day, and desire to know my ways, as a people which did righteousness, and did not forsake the judgment of God. They ask of me now a righteous judgment, and desire to approach to God, saying, What! because we have fasted, and Thou hast not seen: we have humiliated our souls, and Thou hast not known. For in the days of fasting are found your own wills; for either ye torment those who are subjected to you, or ye fast for strifes and judgments, or ye strike your neighbours with fists. For what do you fast unto me, that to-day your voice should be heard in clamour? This fast I have not chosen, save that a man should humble his soul. And if thou shalt bend thy neck like a ring, and spread under thee sackcloth and ashes, neither thus shall it be called an acceptable fast. Not such a fast have I chosen, saith the Lord; but loose every knot of unrighteousness, let go the chokings of impotent engagements.[^4145] Send away the harassed into rest, and scatter every unrighteous contract. Break thy bread to the hungry, and bring the houseless poor into thy dwelling. If thou seest the naked, clothe him; and despise not them of thy own seed in thy house. Then shall thy seasonable light break forth, and thy garments shall quickly arise; and righteousness shall go before thee: and the glory of God shall surround thee. Then thou shalt cry out, and God shall hear thee; while thou art yet speaking, He shall say, Here I am.”[^4146] Concerning this same thing in Job: “I have preserved the needy from the hand of the mighty; and I have helped the orphan, to whom there was no helper. The mouth of the widow blessed me, since I was the eye of the blind; I was also the foot of the lame, and the father of the weak.”[^4147] Of this same matter in Tobit: “And I said to Tobias, My son, go and bring whatever poor man thou shalt find out of our brethren, who still has God in mind with his whole heart. Bring him hither, and he shall eat my dinner together with me. Behold, I attend thee, my son, until thou come.”[^4148] Also in the same place: “All the days of thy life, my son, keep God in mind, and transgress not His precepts. Do justice all the days of thy life, and do not walk in the way of unrighteousness; because if thou act truly, there will be respect of thy works. Give alms of thy substance, and turn not thy face from any poor man. So shall it come to pass that the face of God shall not be turned away from thee. Even as thou hast, my son, so do: if thou hast abundant substance, give the more alms therefrom; if thou hast little, communicate even of that little. And do not fear when thou givest alms: thou layest up for thyself a good reward against the day of need; because alms delivereth from death, and does not suffer to go into darkness. Alms is a good office for all who do it in the sight of the most high God.”[^4149] On this same subject in Solomon in Proverbs: “He that hath pity on the poor lendeth unto the Lord.”[^4150] Also in the same place: “He that giveth to the poor shall never want; but he who turns away his eye shall be in much penury.”[^4151] Also in the same place: “Sins are purged away by alms-giving and faith.”[^4152] Again, in the same place: “If thine enemy hunger, feed him; and if he thirst, give him to drink: for by doing this thou shalt scatter live coals upon his head.”[^4153] Again, in the same place: “As water extinguishes fire, so alms-giving extinguishes sin.”[^4154] In the same in Proverbs: “Say not, Go away, and return, to-morrow I will give; when you can do good immediately. For thou knowest not what may happen on the coming day.”[^4155] Also in the same place: “He who stoppeth his ears that he may not hear the weak, shall himself call upon God, and there shall be none to hear him.”[^4156] Also in the same place: “He who has his conversation without reproach in righteousness, leaves blessed children.”[^4157] In the same in Ecclesiasticus: “My son, if thou hast, do good by thyself, and present worthy offerings to God; remember that death delayeth not.”[^4158] Also in the same place: “Shut up alms in the heart of the poor, and this will entreat for thee from all evil.”[^4159] Concerning this thing in the thirty-sixth Psalm, that mercy is beneficial also to one’s posterity: “I have been young, and I have also grown old; and I have not seen the righteous forsaken, nor his seed begging their bread. The whole day he is merciful, and lendeth; and his seed is in blessing.”[^4160] Of this same thing in the fortieth Psalm: “Blessed is he who considereth over the poor and needy: in the evil day God will deliver him.”[^4161] Also in the cxith Psalm: “He hath distributed, he hath given to the poor; his righteousness shall remain from generation to generation.”[^4162] Of this same thing in Hosea: “I desire mercy rather than sacrifice, and the knowledge of God more than whole burnt-offerings.”[^4163] Of this same thing also in the Gospel according to Matthew: “Blessed are they who hunger and thirst after righteousness: for they shall be satisfied.”[^4164] Also in the same place: “Blessed are the merciful: for they shall obtain mercy.”[^4165] Also in the same place: “Lay up for yourselves treasures in heaven, where neither moth nor rust doth corrupt, and where thieves do not dig through and steal: for where your treasure is, there will your heart be also.”[^4166] Also in the same place: “The kingdom of heaven is like unto a merchantman seeking goodly pearls: and when he hath found a precious pearl, he went away and sold all that he had, and bought it.”[^4167] That even a small work is of advantage, also in the same place: “And whoever shall give to drink to one of the least of these a cup of cold water in the name of a disciple, verily I say unto you, His reward shall not perish.”[^4168] That alms are to be denied to none, also in the same place: “Give to every one that asketh thee; and from him who would wish to borrow, be not turned away.”[^4169] Also in the same place: “If thou wilt enter into life, keep the commandments. He saith, Which? Jesus saith unto him, Thou shalt not kill, Thou shalt not commit adultery, Thou shalt not bear false witness, Honour thy father and mother: and, Thou shalt love thy neighbour as thyself. The young man saith unto Him, All these things have I observed: what lack I yet? Jesus saith unto him, If thou wilt be perfect, go and sell all that thou hast, and give to the poor, and thou shalt have treasure in heaven; and come, follow me.”[^4170] Also in the same place: “When the Son of man shall come in His majesty, and all the angels with Him, then He shall sit on the throne of His glory: and all nations shall be gathered together before Him; and He shall separate them one from another, even as a shepherd separates the sheep from the goats: and He shall place the sheep on the right hand, but the goats on the left hand. Then shall the King say unto them that are on His right hand, Come, ye blessed of my Father, receive the kingdom prepared for you from the beginning of the world. For I was hungry, and ye gave me to eat: I was thirsty, and ye gave me to drink: I was a stranger, and ye took me in: naked, and ye clothed me: I was sick, and ye visited me: I was in prison, and ye came unto me. Then shall the righteous answer Him, and say, Lord, when saw we Thee[^4171] a stranger, and took Thee in: naked, and clothed Thee? And when saw we Thee sick, and in prison, and came to Thee? And the King, answering, shall say unto them, Verily I say unto you, Inasmuch as ye did it to one of the least of these my brethren, ye did it unto me. Then shall He say unto them who are on His left hand, Depart from me, ye cursed, into everlasting fire, which my Father hath prepared for the devil and his angels: for I was hungry, and ye gave me not to eat: I was thirsty, and ye gave me not to drink: I was a stranger, and ye took me not in: I was naked, and ye clothed me not: sick, and in prison, and ye visited me not. Then shall they also answer, and say, Lord, when saw we Thee hungry, or thirsty, or a stranger, or naked, or sick, or in prison, and did not minister unto Thee? And He shall answer them, Verily I say unto you, Inasmuch as ye did it not to one of the least of these, ye did it not unto me. And these shall go away into everlasting burning: but the righteous into life eternal.”[^4172] Concerning this same matter in the Gospel according to Luke: “Sell your possessions, and give alms.”[^4173] Also in the same place: “He who made that which is within, made that which is without also. But give alms, and, behold, all things are pure unto you.”[^4174] Also in the same place: “Behold, the half of my substance I give to the poor; and if I have defrauded any one of anything, I restore him fourfold. And Jesus said unto him, that salvation has this day been wrought for this house, since he also is a son of Abraham.”[^4175] Of this same thing also in the second Epistle to the Corinthians: “Let your abundance supply their want, that their abundance also may be the supplement of your want, that there may be equality: as it is written, He who had much had not excess; and he who had little had no lack.”[^4176] Also in the same place: “He who soweth sparingly shall reap also sparingly; and he who soweth in blessing shall reap also of blessing. But let every one do as he has proposed in his heart: not as if sorrowfully, or of necessity: for God loveth a cheerful giver.”[^4177] Also in the same place: “As it is written, He hath dispersed abroad; he hath given to the poor: his righteousness remaineth for ever.”[^4178] Likewise in the same place: “Now he who ministereth seed to the sower, shall both supply bread to be eaten, and shall multiply your seed, and shall increase the growth of the fruits of your righteousness: that in all things ye may be made rich.”[^4179] Also in the same place: “The administration of this service has not only supplied that which is lacking to the saints, but has abounded by much giving of thanks unto God.”[^4180] Of this same matter in the Epistle of John: “Whoso hath this world’s substance, and seeth his brother desiring, and shutteth up his bowels from him, how dwelleth the love of God in him?”[^4181] Of this same thing in the Gospel according to Luke: “When thou makest a dinner or a supper, call not thy friends, nor brethren, nor neighbours, nor the rich; lest haply they also invite thee again, and a recompense be made thee. But when thou makest a banquet, call the poor, the weak, the blind, and lame: and thou shalt be blessed; because they have not the means of rewarding thee: but thou shalt be recompensed in the resurrection of the just.”[^4182]" },
  { t = "note", id = "4145", text = "“Impotentium commerciorum.”" },
  { t = "note", id = "4146", text = "Isa. lviii. 1–9." },
  { t = "note", id = "4147", text = "Job xxix. 12, 13, 15, 16." },
  { t = "note", id = "4148", text = "Tob. ii. 2." },

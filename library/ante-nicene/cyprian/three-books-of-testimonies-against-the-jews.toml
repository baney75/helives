[[section]]
id = "testimony-xxi-that-we-must-not-rashly"
title = "Testimony XXI. That we must not rashly judge of another."
level = 2
blocks = [
  { t = "p", text = "21. That we must not rashly judge of another." },
  { t = "p", text = "In the Gospel according to Luke: “Judge not, that ye be not judged: condemn not, that ye be not condemned.”[^4343] Of this same subject to the Romans: “Who art thou that judgest another man’s servant? to his own master he standeth or falleth. But he shall stand; for God is able to make him stand.”[^4344] And again: “Wherefore thou art without excuse, O every man that judgest: for in that in which thou judgest another, thou condemnest thyself; for thou doest the same things which thou judgest. But dost thou hope, who judgest those who do evil, and doest the same, that thou thyself shalt escape the judgment of God?”[^4345] Also in the first Epistle of Paul to the Corinthians: “And let him that thinketh he standeth take heed lest he fall.”[^4346] And again: “If any man thinketh that he knoweth anything, he knoweth not yet in what manner he ought to know.”[^4347]" },
  { t = "note", id = "4343", text = "Luke vi. 37." },
  { t = "note", id = "4344", text = "Rom. xiv. 4." },
  { t = "note", id = "4345", text = "Rom. ii. 1–3." },
  { t = "note", id = "4346", text = "1 Cor. x. 12." },
  { t = "note", id = "4347", text = "1 Cor. viii. 2." },
]

[[section]]
id = "testimony-xxii-that-when-we-have-received"
title = "Testimony XXII. That when we have received a wrong, we must remit and forgive it."
level = 2
blocks = [
  { t = "p", text = "22. That when we have received a wrong, we must remit and forgive it." },
  { t = "p", text = "In the Gospel, in the daily prayer: “Forgive us our debts, even as we forgive our debtors.”[^4348] Also according to Mark: “And when ye stand for prayer, forgive, if ye have ought against any one; that also your Father who is in heaven may forgive you your sins. But if ye do not forgive, neither will your Father which is in heaven forgive you your sins.”[^4349] Also in the same place: “In what measure ye mete, in that shall it be measured to you again.”[^4350]" },
  { t = "note", id = "4348", text = "Matt. vi. 12." },
  { t = "note", id = "4349", text = "Matt. xi. 25, 26." },
  { t = "note", id = "4350", text = "Mark iv. 24." },
]

[[section]]
id = "testimony-xxiii-that-evil-is-not-to"
title = "Testimony XXIII. That evil is not to be returned for evil."
level = 2
blocks = [
  { t = "p", text = "23. That evil is not to be returned for evil." },
  { t = "p", text = "In the Epistle of Paul to the Romans: “Rendering to no man evil for evil.”[^4351] Also in the same place: “Not to be overcome of evil, but overcome evil with good.”[^4352] Of this same thing in the Apocalypse: “And He said unto me, Seal not the words of the prophecy of this book; because now the time is at hand. And let those who persist in hurting, hurt: and let him who is filthy, be filthy still: but let the righteous do still more righteousness: and in like manner, let him that is holy do still more holiness. Behold, I come quickly; and my reward is with me, to render to every man according to his deeds.”[^4353]" },
  { t = "note", id = "4351", text = "Rom. xii. 17." },
  { t = "note", id = "4352", text = "Rom. xii. 21." },
  { t = "note", id = "4353", text = "Rev. xxii. 10–12." },
]

[[section]]
id = "testimony-xxiv-that-it-is-impossible-to"
title = "Testimony XXIV. That it is impossible to attain to the Father but by His Son Jesus Christ."
level = 2
blocks = [
  { t = "p", text = "24. That it is impossible to attain to the Father but by His Son Jesus Christ." },
  { t = "p", text = "In the Gospel according to John: “I am the way, the truth, and the life: no man cometh unto the Father, but by me.”[^4354] Also in the same place: “I am the door: by me if any man enter in, he shall be saved.”[^4355]" },
  { t = "note", id = "4354", text = "John xiv. 6." },
  { t = "note", id = "4355", text = "John x. 9." },
]

[[section]]
id = "testimony-xxv-that-unless-a-man-have"
title = "Testimony XXV. That unless a man have been baptized and born again, he cannot attain unto the kingdom of God."
level = 2
blocks = [
  { t = "p", text = "25. That unless a man have been baptized and born again, he cannot attain unto the kingdom of God." },
  { t = "p", text = "In the Gospel according to John: “Except a man be born again of water and the Spirit, he cannot enter into the kingdom of God. For that which is born of the flesh is flesh; and that which is born of the Spirit is spirit.”[^4356] Also in the same place: “Unless ye eat the flesh of the Son of man, and drink His blood, ye shall not have life in you.”[^4357]" },
  { t = "note", id = "4356", text = "John iii. 5, 6." },
  { t = "note", id = "4357", text = "John vi. 53." },
]

[[section]]
id = "testimony-xxvi-that-it-is-of-small"
title = "Testimony XXVI. That it is of small account to be baptized and to receive the Eucharist, unless one profit by it both in deeds and works."
level = 2
blocks = [
  { t = "p", text = "26. That it is of small account to be baptized and to receive the Eucharist, unless one profit by it both in deeds and works." },
  { t = "p", text = "In the first Epistle of Paul to the Corinthians: “Know ye not, that they which run in a race run indeed all, although one receiveth the prize? So run, that ye may obtain. And those indeed that they may receive a corruptible crown, but we an incorruptible.”[^4358] In the Gospel according to Matthew: “Every tree that bringeth not forth good fruit shall be cut down, and cast into the fire.”[^4359] Also in the same place: “Many shall say unto me in that day, Lord, Lord, have we not prophesied in Thy name, and in Thy name have cast out devils, and in Thy name have done great works? And then shall I say to them, I never knew you; depart from me, ye who work iniquity.”[^4360] Also in the same place: “Let your light shine before men, that they may see your good works, and glorify your Father which is in heaven.”[^4361] Also Paul to the Philippians: “Shine as lights in the world.”[^4362]" },
  { t = "note", id = "4358", text = "1 Cor. ix. 24, 25." },
  { t = "note", id = "4359", text = "Matt. iii. 10." },
  { t = "note", id = "4360", text = "Matt. vii. 22, 23." },
  { t = "note", id = "4361", text = "Matt. v. 16." },
  { t = "note", id = "4362", text = "Phil. ii. 15." },
]

[[section]]
id = "testimony-xxvii-that-even-a-baptized-person"
title = "Testimony XXVII. That even a baptized person loses the grace that he has attained, unless he keep innocency."
level = 2
blocks = [
  { t = "p", text = "27. That even a baptized person loses the grace that he has attained, unless he keep innocency." },
  { t = "p", text = "In the Gospel according to John: “Lo, thou art made whole: sin no more, lest a worse thing happen unto thee.”[^4363] Also in the first Epistle of Paul to the Corinthians: “Know ye not that ye are the temple of God, and the Spirit of God abideth in you? If any one violate the temple of God, him will God destroy.”[^4364] Of this same thing in the Chronicles: “God is with you, while ye are with Him: if ye forsake Him, He will forsake you.”[^4365]" },
  { t = "note", id = "4363", text = "John v. 14." },
  { t = "note", id = "4364", text = "1 Cor. iii. 16, 17." },
  { t = "note", id = "4365", text = "2 Chron. xv. 2." },
]

[[section]]
id = "testimony-xxviii-that-remission-cannot-in-the"
title = "Testimony XXVIII. That remission cannot in the Church be granted unto him who has sinned against God (i.e., the Holy Ghost)."
level = 2
blocks = [
  { t = "p", text = "28. That remission cannot in the Church be granted unto him who has sinned against God (i.e., the Holy Ghost)." },
  { t = "p", text = "In the Gospel according to Matthew: “Whosoever shall say a word against the Son of man, it shall be forgiven him; but whosoever shall speak against the Holy Ghost, it shall not be forgiven him, neither in this world nor in the world to come.”[^4366] Also according to Mark: “All sins shall be forgiven, and blasphemies, to the sons of men; but whoever shall blaspheme against the Holy Ghost, it shall not be forgiven him, but he shall be guilty of eternal sin.”[^4367] Of this same thing in the first book of Kings: “If a man sin by offending against a man, they shall pray the Lord for him; but if a man sin against God, who shall pray for him?”[^4368]" },
  { t = "note", id = "4366", text = "Matt. xii. 32." },
  { t = "note", id = "4367", text = "Mark iii. 28, 29." },
  { t = "note", id = "4368", text = "1 Sam. ii. 25. [i.e., he regards this text as expounded by the preceding words of Christ. Compare 1 John v. 16.]" },
]

[[section]]
id = "testimony-xxix-that-it-was-before-predicted"
title = "Testimony XXIX. That it was before predicted, concerning the hatred of the Name."
level = 2
blocks = [
  { t = "p", text = "29. That it was before predicted, concerning the hatred of the Name," },
  { t = "p", text = "In the Gospel according to Luke: “And ye shall be hated of all men for my name’s sake.”[^4369] Also according to John: “If the world hate you, know ye that it first hated me. If ye were of the world, the world would love what would be its own: but because ye are not of the world, and I have chosen you out of the world, therefore the world hateth you. Remember the word which I said unto you, The servant is not greater than his lord. If they have persecuted me, they will also persecute you.”[^4370] Also in Baruch:[^4371] “For the time shall come, and ye shall seek me, both ye and those who shall be after you, to hear the word of wisdom and of understanding; and ye shall not find me. But the nations shall desire to see the wise man, and it shall not happen to them; not because the wisdom of this world shall be wanting, or shall fail to the earth; but neither shall the word of the law be wanting to the world. For wisdom shall be in a few who watch, and are silent and quiet, and who hold converse with one another; because some shall dread them, and shall fear them as evil. But some do not believe the word of the law of the Highest. But some who are amazed in their countenance will not believe; and they also who contradict will believe, and will be contrary to and hindering the spirit of truth. Moreover, others will be wise to the spirit of error, and declaring the edicts, as if of the Highest and the Strong One. Moreover, others are *possessors of faith*.[^4372] Others are mighty and strong in the faith of the Highest, and hateful to the stranger.”" },
  { t = "note", id = "4369", text = "Luke xxi. 17." },
  { t = "note", id = "4370", text = "John xv. 18–20." },
  { t = "note", id = "4371", text = "The whole of this quotation, as it is called, from Baruch, is wanting in all codices but two. It is remarkable, as finding no place in any text of Scripture, nor in any translation, whether Greek or Latin." },
  { t = "note", id = "4372", text = "Personales fidei. This, like many other expressions in this strange passage, gives no clue to a meaning." },
]

[[section]]
id = "testimony-xxx-that-what-any-one-has"
title = "Testimony XXX. That what any one has vowed to God, he must quickly repay."
level = 2
blocks = [
  { t = "p", text = "30. That what any one has vowed to God, he must quickly repay." },
  { t = "p", text = "In Solomon: “According as thou hast vowed a vow to God, delay not to pay it.”[^4373] Concerning this same thing in Deuteronomy: “But if thou hast vowed a vow to the Lord thy God, thou shalt not delay to pay it: because the Lord thy God inquiring shall seek it of thee; and it shall be for a sin. Thou shalt observe those things that shall go forth out of thy lips, and shalt perform the gift which thou hast spoken with thy mouth.”[^4374] Of this same matter in the forty-ninth Psalm: “Sacrifice to God the sacrifice of praise, and pay thy vows to the Most High. Call upon me in the day of trouble, and I will deliver thee, and thou shalt glorify me.”[^4375] Of this same thing in the Acts of the Apostles: “Why hath Satan filled thine heart, that thou shouldst lie to the Holy Ghost, when thy estate was in thine own power? Thou hast not lied unto men, but unto God.”[^4376] Also in Jeremiah: “Cursed is he who doeth the work of God negligently.”[^4377]" },
  { t = "note", id = "4373", text = "Eccles. v. 4." },
  { t = "note", id = "4374", text = "Deut. xxiii. 21–23." },
  { t = "note", id = "4375", text = "Ps. l. 14, 15." },
  { t = "note", id = "4376", text = "Acts v. 3, 4." },
  { t = "note", id = "4377", text = "Jer. xlviii. 10." },
]

[[section]]
id = "testimony-xxxi-that-he-who-does-not"
title = "Testimony XXXI. That he who does not believe is judged already."
level = 2
blocks = [
  { t = "p", text = "31. That he who does not believe is judged already." },
  { t = "p", text = "In the Gospel according to John: “He that believeth not is already judged, because he hath not believed in the name of the only[^4378] Son of God. And this is the judgment, that light has come into the world, and men have loved darkness rather than light.”[^4379] Of this also in the first Psalm: “Therefore the ungodly shall not rise up in judgment, nor sinners in the council of the righteous.”[^4380]" },
  { t = "note", id = "4378", text = "*Unice*; but some read *unigeniti*, “only-begotten.”" },
  { t = "note", id = "4379", text = "John iii. 18, 19." },
  { t = "note", id = "4380", text = "Ps. i. 5." },
]

[[section]]
id = "testimony-xxxii-of-the-benefit-of-virginity"
title = "Testimony XXXII. Of the benefit of virginity and of continency."
level = 2
blocks = [
  { t = "p", text = "32. Of the benefit of virginity and of continency.[^4381]" },
  { t = "note", id = "4381", text = "[This section is confined to Scripture, and goes not beyond the word of the Divine Wisdom, as do some of the Fathers.]" },
  { t = "p", text = "In Genesis: “Multiplying I will multiply thy sorrows and thy groanings, and in sorrow shalt thou bring forth children; and thy turning shall be to thy husband, and he shall rule over thee.”[^4382] Of this same thing in the Gospel according to Matthew: “All men do not receive the word, but they to whom it is given: for there are some eunuchs who were born so from their mother’s womb, and there are eunuchs who have been constrained by men, and there are eunuchs who have made themselves eunuchs for the kingdom of heaven’s sake. He who can receive it, let him receive it.”[^4383] Also according to Luke: “The children of this world beget, and are begotten. But they who have been considered worthy of that world, and the resurrection from the dead, do not marry, nor are married: for neither shall they begin to die: for they are equal to the angels of God, since they are the children of the resurrection. But, that the dead rise again, Moses intimates when he says in the bush, The Lord, the God of Abraham, and the God of Isaac, and the God of Jacob. He is not the God of the dead, but of the living: for all live unto Him.”[^4384] Also in the first Epistle of Paul to the Corinthians: “It is good for a man not to touch a woman. But, on account of fornication, let every man have his own wife, and every woman have her own husband. Let the husband render what is due to the wife, and similarly the wife to the husband. The wife hath not power over her own body, but the husband. And in like manner, the husband hath not power over his own body, but the wife. Defraud not one the other, except by agreement for a time, that ye may have leisure for prayer; and again return to the same point, lest Satan tempt you on account of your incontinency. This I say by way of allowance, not by way of command. But I wish that all men should be even as I am. But every one has his proper gift from God; one in one way, but another in another way.”[^4385] Also in the same place: “An unmarried man thinks of those things which are the Lord’s, in what way he may please God; but he who has contracted marriage thinks of those things that are of this world, in what way he may please his wife. Thus also, both the woman and the unmarried virgin thinketh of those things which are the Lord’s, that she may be holy both in body and in spirit; but she that hath married thinks of those things which are of this world, in what way she may please her husband.”[^4386] Also in Exodus, when the Lord had commanded Moses that he should sanctify the people for the third day, he sanctified them, and added: “Be ye ready, for three days ye shall not approach to women.”[^4387] Also in the first book of Kings: “And the priest answered to David, and said, There are no profane loaves in my hand, except one sacred loaf. If the young men have been kept back from women, they shall eat.”[^4388] Also in the Apocalypse: “These are they who have not defiled themselves with women, for they have continued virgins; these are they who follow the Lamb whithersoever He shall go.”[^4389]" },
  { t = "note", id = "4382", text = "Gen. iii. 16." },
  { t = "note", id = "4383", text = "Matt. xix. 11, 12." },
  { t = "note", id = "4384", text = "Luke xx. 34–38." },
  { t = "note", id = "4385", text = "1 Cor. vii. 1–7." },
  { t = "note", id = "4386", text = "1 Cor. vii. 32–34." },
  { t = "note", id = "4387", text = "Ex. xix. 15." },
  { t = "note", id = "4388", text = "1 Sam. xxi. 4." },
  { t = "note", id = "4389", text = "Rev. xiv. 4." },
]

[[section]]
id = "testimony-xxxiii-that-the-father-judgeth-nothing"
title = "Testimony XXXIII. That the Father judgeth nothing, but the Son; and that the Father is not glorified by him by whom the Son is not glorified."
level = 2
blocks = [
  { t = "p", text = "33. That the Father judgeth nothing, but the Son; and that the Father is not glorified by him by whom the Son is not glorified." },
  { t = "p", text = "In the Gospel according to John: “The Father judgeth nothing, but hath given all judgment unto the Son, that all may honour the Son as they honour the Father. He who honoureth not the Son, honoureth not the Father who hath sent Him.”[^4390] Also in the seventy-first Psalm: “O God, give the king Thy judgment, and Thy righteousness to the king’s son, to judge Thy people in righteousness.”[^4391] Also in Genesis: “And the Lord rained upon Sodom and Gomorrah sulphur, and fire from heaven from the Lord.”[^4392]" },
  { t = "note", id = "4390", text = "John v. 22, 23." },
  { t = "note", id = "4391", text = "Ps. lxxii. 1, 2." },
  { t = "note", id = "4392", text = "Gen. xix. 24." },
]

[[section]]
id = "testimony-xxxiv-that-the-believer-ought-not"
title = "Testimony XXXIV. That the believer ought not to live like the Gentile."
level = 2
blocks = [
  { t = "p", text = "34. That the believer ought not to live like the Gentile." },
  { t = "p", text = "In Jeremiah: “Thus saith the Lord, Walk ye not according to the way of the Gentiles.”[^4393] Of this same thing, that one ought to separate himself from the Gentiles, lest he should be a companion of their sin, and become a partaker of their penalty, in the Apocalypse: “And I heard another voice from heaven, saying, Go forth from her, my people, lest thou be partaker of her crimes, and lest thou be stricken with her plagues; because her crimes have reached even to heaven, and the Lord God hath remembered her iniquities. Therefore He hath returned unto her double, and in the cup which she hath mixed double is mingled for her; and in how much she hath glorified herself and possessed of delights, in so much is given unto her both torment and grief. For in her heart she says, I am a queen, and cannot be a widow, nor shall I see sorrow. Therefore in one hour her plagues shall come on her, death, grief, and famine; and she shall be burned with fire, because the Lord God is strong who shall judge her. And the kings of the earth shall weep and lament themselves for her, who have committed fornication with her, and have been conversant in her sins.”[^4394] Also in Isaiah: “Go forth from the midst of them, ye who bear the vessels of the Lord.”[^4395]" },
  { t = "note", id = "4393", text = "Jer. x. 2." },
  { t = "note", id = "4394", text = "Rev. xviii. 4–9. The Oxford text reads “deliciis” instead of “delictis,”—making the last clause, “and have walked in delicacies.”" },
  { t = "note", id = "4395", text = "Isa. lii. 11." },
]

[[section]]
id = "testimony-xxxv-that-god-is-patient-for"
title = "Testimony XXXV. That God is patient for this end, that we may repent of our sin, and be reformed."
level = 2
blocks = [
  { t = "p", text = "35. That God is patient for this end, that we may repent of our sin, and be reformed." },
  { t = "p", text = "In Solomon, in Ecclesiasticus: “Say not, I have sinned, and what sorrow hath happened to me? For the Highest is a patient repayer.”[^4396] Also Paul to the Romans: “Or despisest thou the riches of His goodness, and forbearance, and patience, not knowing that the goodness of God leadeth thee to repentance? But, according to thy hardness and impenitent heart, thou treasurest up to thyself wrath in the day of wrath and of revelation of the just judgment of God, who will render to every man according to his deeds.”[^4397]" },
  { t = "note", id = "4396", text = "Ecclus. v. 4." },
  { t = "note", id = "4397", text = "Rom. ii. 4–6." },
]

[[section]]
id = "testimony-xxxvi-that-a-woman-ought-not"
title = "Testimony XXXVI. That a woman ought not to be adorned in a worldly fashion."
level = 2
blocks = [
  { t = "p", text = "36. That a woman ought not to be adorned in a worldly fashion." },
  { t = "p", text = "In the Apocalypse: “And there came one of the seven angels having vials, and approached me, saying, Come, I will show thee the condemnation of the great whore, who sitteth upon many waters, with whom the kings of the earth have committed fornication. And I saw a woman who sate upon a beast. And that woman was clothed with a purple and scarlet robe; and she was adorned with gold, and precious stones, and pearls, holding a golden cup in her hand full of curses, and impurity, and fornication of the whole earth.”[^4398] Also to Timothy: “Let your women be such as adorn themselves with shamefacedness and modesty, not with twisted hair, nor with gold, nor with pearls, or precious garments, but as becometh women professing chastity, with a good conversation.”[^4399] Of this same thing in the Epistle of Peter to the people at Pontus: “Let there be in a woman not the outward adorning of ornament, or of gold, or of apparel, but the adorning of the heart.”[^4400] Also in Genesis: “Thamar covered herself with a cloak, and adorned herself; and when Judah beheld her, she appeared to him to be a harlot.”[^4401]" },
  { t = "note", id = "4398", text = "Rev. xvii. 1–4." },
  { t = "note", id = "4399", text = "1 Tim. ii. 9, 10." },
  { t = "note", id = "4400", text = "1 Pet. iii. 4. [This limitation to “Pontus” is curious.]" },
  { t = "note", id = "4401", text = "Gen. xxxviii. 14, 15." },
]

[[section]]
id = "testimony-xxxvii-that-the-believer-ought-not"
title = "Testimony XXXVII. That the believer ought not to be punished for other offences, except for the name he bears."
level = 2
blocks = [
  { t = "p", text = "37. That the believer ought not to be punished for other offences, except for the name he bears." },
  { t = "p", text = "In the Epistle of Peter to them of Pontus: “Nor let any of you suffer as a thief, or a murderer, or as an evil-doer, or as a minder of other people’s business,[^4402] but as a Christian.”[^4403]" },
  { t = "note", id = "4402", text = "[Gr. ὡς ἀλλοτριοεπίσκοπος; a strange expression. This is St. Paul’s canon (Greek) of jurisdiction, which he expounds, 2 Cor. x. 13, 14. Comp. Gal. ii. 9. Showing, by the way, the limits of Peter’s jurisdiction, “measure,” or μετρόν τοῦ κανόνος. Note 15, p. 544, *supra*.]" },
  { t = "note", id = "4403", text = "1 Pet. iv. 15, 16." },
]

[[section]]
id = "testimony-xxxviii-that-the-servant-of-god"
title = "Testimony XXXVIII. That the servant of God ought to be innocent, lest he fall into secular punishment."
level = 2
blocks = [
  { t = "p", text = "38. That the servant of God ought to be innocent, lest he fall into secular punishment." },
  { t = "p", text = "In the Epistle of Paul to the Romans: “Wilt thou not be afraid of the power? Do that which is good, and thou shalt have praise of it.”[^4404]" },
  { t = "note", id = "4404", text = "Rom. xiii. 3." },
]

[[section]]
id = "testimony-xxxix-that-there-is-given-to"
title = "Testimony XXXIX. That there is given to us an example of living in Christ."
level = 2
blocks = [
  { t = "p", text = "39. That there is given to us an example of living in Christ." },
  { t = "p", text = "In the Epistle of Peter to them of Pontus: “For Christ suffered for us, leaving you an example, that ye may follow His steps; who did no sin, neither was guile found in His mouth; who, when He was reviled, reviled not again; when He suffered, threatened not, but gave Himself up to him that judgeth unrighteously.”[^4405] Also Paul to the Philippians: “Who, being appointed in the figure of God, thought it not robbery that He was equal with God; but emptied Himself, taking the form of a servant, He was made in the likeness of man, and was found in fashion as a man. He humbled Himself, becoming obedient even unto death, and the death of the cross. For which cause also God hath exalted Him, and hath given Him a name, that it may be above every name, that in the name of Jesus every knee should be bowed, of things heavenly, and earthly, and infernal; and that every tongue should confess that the Lord Jesus Christ is in glory of God the Father.”[^4406] Of this same thing in the Gospel according to John: “If I have washed your feet, being your Master and Lord, ye also ought to wash the feet of others. For I have given you an example, that as I have done, ye also should do to others.”[^4407]" },
  { t = "note", id = "4405", text = "1 Pet. ii. 21–23." },
  { t = "note", id = "4406", text = "Phil. ii. 6–11." },
  { t = "note", id = "4407", text = "John xiii. 14, 15." },
]

[[section]]
id = "testimony-xl-that-we-must-not-labour"
title = "Testimony XL. That we must not labour noisily nor boastfully."
level = 2
blocks = [
  { t = "p", text = "40. That we must not labour noisily nor boastfully." },
  { t = "p", text = "In the Gospel according to Matthew: “Let not thy left hand know what thy right hand doeth, that thine alms may be in secret; and thy Father, which seeth in secret, shall render to thee.”[^4408] Also in the same place: “When thou doest an alms, do not sound a trumpet before thee, as the hypocrites do in the streets and in the synagogues, that they may be glorified of men. Verily I say unto you, They have fulfilled their reward.”[^4409]" },
  { t = "note", id = "4408", text = "Matt. vi. 3, 4." },
  { t = "note", id = "4409", text = "Matt. vi. 2." },
]

[[section]]
id = "testimony-xli-that-we-must-not-speak"
title = "Testimony XLI. That we must not speak foolishly and offensively."
level = 2
blocks = [
  { t = "p", text = "41. That we must not speak foolishly and offensively." },
  { t = "p", text = "In Paul’s Epistle to the Ephesians: “Foolish speaking and scurrility, which are not fitting for the occasion, let them not be even named among you.”[^4410]" },
  { t = "note", id = "4410", text = "Eph. v. 4." },
]

[[section]]
id = "testimony-xlii-that-faith-is-of-advantage"
title = "Testimony XLII. That faith is of advantage altogether, and that we can do as much as we believe."
level = 2
blocks = [
  { t = "p", text = "42. That faith is of advantage altogether, and that we can do as much as we believe." },
  { t = "p", text = "In Genesis: “And Abraham believed God, and it was counted unto him for righteousness.”[^4411] Also in Isaiah: “And if ye do not believe, neither shall ye understand.”[^4412] Also in the Gospel according to Matthew: “O thou of little faith, wherefore didst thou doubt?”[^4413] Also in the same place: “If you have faith as a grain of mustard seed, ye shall say to this mountain, Pass over from here to that place, and it shall pass over; and nothing shall be impossible unto you.”[^4414] Also according to Mark: “All things whatsoever ye pray and ask for, believe that ye shall receive them, and they shall be yours.”[^4415] Also in the same place: “All things are possible to him that believeth.”[^4416] In Habakkuk: “But the righteous liveth by my faith.”[^4417] Also in Daniel: “Ananias, Azarias, and Misael, trusting in God, were delivered from the fiery flame.”" },
  { t = "note", id = "4411", text = "Gen. xv. 6." },
  { t = "note", id = "4412", text = "Isa. vii. 9." },
  { t = "note", id = "4413", text = "Matt. xiv. 31." },
  { t = "note", id = "4414", text = "Matt. xvii. 20." },
  { t = "note", id = "4415", text = "Mark xi. 24." },
  { t = "note", id = "4416", text = "Mark ix. 22." },
  { t = "note", id = "4417", text = "Hab. ii. 4." },
]

[[section]]
id = "testimony-xliii-that-he-who-believes-can"
title = "Testimony XLIII. That he who believes can immediately obtain (i.e., pardon and peace)."
level = 2
blocks = [
  { t = "p", text = "43. That he who believes can immediately obtain (i.e., pardon and peace)." },
  { t = "p", text = "In the Acts of the Apostles: “Lo, here is water; what is there which hinders me from being baptized? Then said Philip, If thou believest with all thine heart, thou mayest.”[^4418]" },
  { t = "note", id = "4418", text = "Acts viii. 36, 37." },
]

[[section]]
id = "testimony-xliv-that-believers-who-differ-among"
title = "Testimony XLIV. That believers who differ among themselves ought not to refer to a Gentile judge."
level = 2
blocks = [
  { t = "p", text = "44. That believers who differ among themselves ought not to refer to a Gentile judge.[^4419]" },
  { t = "note", id = "4419", text = "[The oath on the Bible in our courts, and other Christian forms, are important in Christian morals, as bearing upon our right to seek redress at the law, while it is *Christian* law.]" },
  { t = "p", text = "In the first Epistle of Paul to the Corinthians: “Dares any of you, having a matter against another, to discuss it among the unrighteous, and not among the saints? Know ye not that the saints shall judge this world?”[^4420] And again: “Now indeed there is altogether a fault among you, because ye have judgments one against another. Wherefore do ye not rather suffer injury? or wherefore are ye not rather defrauded? But ye do wrong, and defraud, and this your brethren. Know ye not that the unrighteous shall not obtain the kingdom of God?”[^4421]" },
  { t = "note", id = "4420", text = "1 Cor. vi. 1, 2." },
  { t = "note", id = "4421", text = "1 Cor. vi. 7–9." },
]

[[section]]
id = "testimony-xlv-that-hope-is-of-future"
title = "Testimony XLV. That hope is of future things, and therefore that our faith concerning those things which are promised ought to be patient."
level = 2
blocks = [
  { t = "p", text = "45. That hope is of future things, and therefore that our faith concerning those things which are promised ought to be patient." },
  { t = "p", text = "In the Epistle of Paul to the Romans: “We are saved by hope. But hope that is seen is not hope; for what a man seeth, why doth he hope for? But if we hope for what we see not, we hope[^4422] for it in patience.”[^4423]" },
  { t = "note", id = "4422", text = "Some read“ exspectamus,” “we wait for it.”" },
  { t = "note", id = "4423", text = "Rom. viii. 24, 25." },
]

[[section]]
id = "testimony-xlvi-that-a-woman-ought-to"
title = "Testimony XLVI. That a woman ought to be silent in the church."
level = 2
blocks = [
  { t = "p", text = "46. That a woman ought to be silent in the church." },
  { t = "p", text = "In the first Epistle of Paul to the Corinthians: “Let women be silent in the church. But if any wish to learn anything, let them ask their husbands at home.”[^4424] Also to Timothy: “Let a woman learn with silence, in all subjection. But I permit not a woman to teach, nor to be set over the man, but to be in silence. For Adam was first formed, then Eve; and Adam was not seduced, but the woman was seduced.”[^4425]" },
  { t = "note", id = "4424", text = "1 Cor. xiv. 34, 35. [Women might have spiritual gifts, like the daughters of Philip, Acts xxi. 9; but even such are here forbidden to use them in the public worship of the Church.]" },
  { t = "note", id = "4425", text = "1 Tim. ii. 11–14." },
]

[[section]]
id = "testimony-xlvii-that-it-arises-from-our"
title = "Testimony XLVII. That it arises from our fault and our desert that we suffer, and do not perceive God's help in everything."
level = 2
blocks = [
  { t = "p", text = "47. That it arises from our fault and our desert that we suffer, and do not perceive God’s help in everything." },
  { t = "p", text = "In Hosea: “Hear ye the word of the Lord, ye children of Israel: because judgment is from the Lord against the inhabitants of the earth, because there is neither mercy nor truth, nor acknowledgment of God upon the earth; but cursing, and lying, and slaughter, and theft, and adultery is scattered abroad upon the earth: they mingle blood to blood. Therefore the land shall mourn, with all its inhabitants, with the beasts of the field, with the creeping things of the earth, with the birds of heaven; and the fishes of the sea shall fail: so that no man may judge, no man may refute.”[^4426] Of this same thing in Isaiah: “Is not the Lord’s hand strong to save, or has He weighed down His ear that He may not hear? But your sins separate between you and God; and on account of your iniquities He turns away His face from you, lest He should pity. For your hands are polluted with blood, and your fingers with sins; and your lips have spoken wickedness, and your tongue devises unrighteousness. No one speaks true things, neither is judgment true. They trust in vanity, and speak emptiness, who conceive sorrow, and bring forth wickedness.”[^4427] Also in Zephaniah: “In failing, let it fail from the face of the earth, saith the Lord. Let man fail, and cattle; let the birds of heaven fail, and the fishes of the sea; and I will take away the unrighteous from the face of the earth.”[^4428]" },
  { t = "note", id = "4426", text = "Hos. iv. 1–4." },
  { t = "note", id = "4427", text = "Isa. lix. 1–4." },
  { t = "note", id = "4428", text = "Zeph. i. 2, 3." },
]

[[section]]
id = "testimony-xlviii-that-we-must-not-take"
title = "Testimony XLVIII. That we must not take usury."
level = 2
blocks = [
  { t = "p", text = "48. That we must not take usury." },
  { t = "p", text = "In the thirteenth Psalm:[^4429] “He that hath not given his money upon usury, and has not received gifts concerning the innocent. He who doeth these things shall not be moved for ever.”[^4430] Also in Ezekiel: “But the man who will be righteous, shall not oppress a man, and shall return the pledge of the debtor, and shall not commit rapine, and shall give his bread to the hungry, and shall cover the naked, and shall not give his money for usury.”[^4431] Also in Deuteronomy: “Thou shalt not lend to thy brother with usury of money, and with usury of victuals.”[^4432]" },
  { t = "note", id = "4429", text = "The Oxford edition has “the fourteenth.” [Elucidation XIII.]" },
  { t = "note", id = "4430", text = "Ps. xv. 6." },
  { t = "note", id = "4431", text = "Ezek. xviii. 7, 8." },
  { t = "note", id = "4432", text = "Deut. xxiii. 19." },
]

[[section]]
id = "testimony-xlix-that-even-our-enemies-must"
title = "Testimony XLIX. That even our enemies must be loved."
level = 2
blocks = [
  { t = "p", text = "49. That even our enemies must be loved." },
  { t = "p", text = "In the Gospel according to Luke: “If ye love those who love you, what thank have ye? For even sinners love those who love them.”[^4433] Also according to Matthew: “Love your enemies, and pray for those who persecute you, that ye may be the children of your Father who is in heaven, who maketh His sun to rise upon the good and the evil, and giveth rain upon the righteous and the unrighteous.”[^4434]" },
  { t = "note", id = "4433", text = "Luke vi. 32." },
  { t = "note", id = "4434", text = "Matt. v. 44, 45." },
]

[[section]]
id = "testimony-l-that-the-sacrament-of-faith"
title = "Testimony L. That the sacrament of faith must not be profaned."
level = 2
blocks = [
  { t = "p", text = "50. That the sacrament of faith must not be profaned." },
  { t = "p", text = "In Solomon, in the Proverbs: “Say not anything in the ears of a foolish man; lest, when he hears it, he may mock at thy wise words.”[^4435] Also in the Gospel according to Matthew: “Give not that which is holy to dogs; neither cast ye your pearls before the swine, lest perchance they trample them down with their feet, and turn again and crush you.”[^4436]" },
  { t = "note", id = "4435", text = "Prov. xxiii. 9." },
  { t = "note", id = "4436", text = "Matt. vii. 6." },
]

[[section]]
id = "testimony-li-that-no-one-should-be"
title = "Testimony LI. That no one should be uplifted in his labour."
level = 2
blocks = [
  { t = "p", text = "51. That no one should be uplifted in his labour.[^4437]" },
  { t = "note", id = "4437", text = "[Hab. i. 16; Ps. cxxxi. 1.]" },
  { t = "p", text = "In Solomon, in Ecclesiasticus: “Extol not thyself in doing thy work.”[^4438] Also in the Gospel according to Luke: “Which of you, having a servant ploughing, or a shepherd, says to him when he cometh from the field, Pass forward and recline? But he says to him, Make ready somewhat that I may sup, and gird thyself, and minister to me, until I eat and drink; and afterwards thou shalt eat and drink? Does he thank that servant because he has done what was commanded him? So also ye, when ye shall have done that which is commanded you, say, We are unprofitable servants; we have done what we had to do.”[^4439]" },
  { t = "note", id = "4438", text = "Ecclus. x. 26." },
  { t = "note", id = "4439", text = "Luke xvii. 7–10." },
]

[[section]]
id = "testimony-lii-that-the-liberty-of-believing"
title = "Testimony LII. That the liberty of believing or of not believing is placed in free choice."
level = 2
blocks = [
  { t = "p", text = "52. That the liberty of believing or of not believing is placed in free choice." },
  { t = "p", text = "In Deuteronomy: “Lo, I have set before thy face life and death, good and evil. Choose for thyself life, that thou mayest live.”[^4440] Also in Isaiah: “And if ye be willing, and hear me, ye shall eat the good of the land. But if ye be unwilling, and will not hear me, the sword shall consume you. For the mouth of the Lord hath spoken these things.”[^4441] Also in the Gospel according to Luke: “The kingdom of God is within you.”[^4442]" },
  { t = "note", id = "4440", text = "Deut. xiii. 19." },
  { t = "note", id = "4441", text = "Isa. i. 19." },
  { t = "note", id = "4442", text = "Luke xvii. 21." },
]

[[section]]
id = "testimony-liii-that-the-secrets-of-god"
title = "Testimony LIII. That the secrets of God cannot be seen through, and therefore that our faith ought to be simple."
level = 2
blocks = [
  { t = "p", text = "53. That the secrets of God cannot be seen through, and therefore that our faith ought to be simple.[^4443]" },
  { t = "note", id = "4443", text = "[The aphoristic force of these “heads” is often striking in the original; e.g., “Dei arcana perspici non posse, et ideo fidem nostram simplicem esse debere.”]" },
  { t = "p", text = "In the first Epistle of Paul to the Corinthians: “We see now through the glass in an enigma, but then with face to face. Now I know partly; but then I shall know even as also I am known.”[^4444] Also in Solomon, in Wisdom: “And in simplicity of heart seek Him.”[^4445] Also in the same: “He who walketh with simplicity, walketh trustfully.”[^4446] Also in the same: “Seek not things higher than thyself, and look not into things stronger than thyself.”[^4447] Also in Solomon: “Be not excessively righteous, and do not reason more than is required.”[^4448] Also in Isaiah: “Woe unto them who are convicted in themselves.”[^4449] Also in the Maccabees: “Daniel in his simplicity was delivered from the mouth of the lions.”[^4450] Also in the Epistle of Paul to the Romans: “Oh the depth of the riches of the wisdom and knowledge of God! How incomprehensible are His judgments, and how unsearchable are His ways! For who has known the mind of the Lord? or who has been His counsellor? or who has first given to Him, and it shall be recompensed to him again? Because from Him, and through Him, and in Him, are all things: to Him be glory for ever and ever.”[^4451] Also to Timothy: “But foolish and unlearned questions avoid, knowing that they generate strifes. But the servant of God ought not to strive, but to be gentle towards all men.”[^4452]" },
  { t = "note", id = "4444", text = "1 Cor. xiii. 12." },
  { t = "note", id = "4445", text = "Wisd. i. 1." },
  { t = "note", id = "4446", text = "Prov. x. 9." },
  { t = "note", id = "4447", text = "Eccles. iii. 21." },
  { t = "note", id = "4448", text = "Ecclus. vii. 17." },
  { t = "note", id = "4449", text = "Isa. xxix. 15." },
  { t = "note", id = "4450", text = "1 Macc. ii. 60." },
  { t = "note", id = "4451", text = "Rom. xi. 33–36." },
  { t = "note", id = "4452", text = "2 Tim. ii. 23, 24." },
]

[[section]]
id = "testimony-liv-that-no-one-is-without"
title = "Testimony LIV. That no one is without filth and without sin."
level = 2
blocks = [
  { t = "p", text = "54. That no one is without filth and without sin." },
  { t = "p", text = "In Job: “For who is pure from filth? Not one; even if his life be of one day on the earth.”[^4453] Also in the fiftieth Psalm: “Behold, I was conceived in iniquities, and in sins hath my mother conceived me.”[^4454] Also in the Epistle of John: “If we say that we have no sin, we deceive ourselves, and the truth is not in us.”[^4455]" },
  { t = "note", id = "4453", text = "Job xiv. 4, 5." },
  { t = "note", id = "4454", text = "Ps. li. 5." },
  { t = "note", id = "4455", text = "1 John i. 8." },
]

[[section]]
id = "testimony-lv-that-we-must-not-please"
title = "Testimony LV. That we must not please men, but God."
level = 2
blocks = [
  { t = "p", text = "55. That we must not please men, but God." },
  { t = "p", text = "In the fifty-second Psalm: “They that please men are confounded, because God hath made them nothing.”[^4456] Also in the Epistle of Paul to the Galatians: “If I wished to please men, I should not be the servant of Christ.”[^4457]" },
  { t = "note", id = "4456", text = "Ps. liii. 5." },
  { t = "note", id = "4457", text = "Gal. i. 10." },
]

[[section]]
id = "testimony-lvi-that-nothing-that-is-done"
title = "Testimony LVI. That nothing that is done is hidden from God."
level = 2
blocks = [
  { t = "p", text = "56. That nothing that is done is hidden from God." },
  { t = "p", text = "In the Wisdom of Solomon: “In every place the eyes of God look upon the good and evil.”[^4458] Also in Jeremiah: “I am a God at hand, and not a God afar off. If a man should be hidden in the secret place, shall I not therefore see him? Do not I fill heaven and earth? saith the Lord.”[^4459] Also in the first of Kings: “Man looketh on the face, but God on the heart.”[^4460] Also in the Apocalypse: “And all the churches shall know that I am the searcher of the reins and heart; and I will give to every one of you according to his works.”[^4461] Also in the eighteenth Psalm: “Who understands his faults? Cleanse Thou me from my secret sins, O Lord.”[^4462] Also in the second Epistle of Paul to the Corinthians: “We must all be manifested before the tribunal of Christ, that every one may bear again the things which belong to his own body, according to what he hath done, whether good or evil.”[^4463]" },
  { t = "note", id = "4458", text = "Prov. xv. 3." },
  { t = "note", id = "4459", text = "Jer. xxiii. 23, 24." },
  { t = "note", id = "4460", text = "1 Sam. xvi. 7." },
  { t = "note", id = "4461", text = "Rev. ii. 23." },
  { t = "note", id = "4462", text = "Ps. xix. 12." },
  { t = "note", id = "4463", text = "2 Cor. v. 10." },
]

[[section]]
id = "testimony-lvii-that-the-believer-is-amended"
title = "Testimony LVII. That the believer is amended and reserved."
level = 2
blocks = [
  { t = "p", text = "57. That the believer is amended and reserved." },
  { t = "p", text = "In the cxviith Psalm: “The Lord amending hath amended me, and hath not delivered me to death.”[^4464] Also in the eighty-eighth Psalm: “I will visit their transgressions with a rod, and their sins with scourges. But my mercy will I not scatter away from them.”[^4465] Also in Malachi: “And He shall sit melting and purifying, as it were, gold and silver; and He shall purify the sons of Levi.”[^4466] Also in the Gospel: “Thou shalt not go out thence until thou pay the uttermost farthing.”[^4467]" },
  { t = "note", id = "4464", text = "Ps. cxviii. 18." },
  { t = "note", id = "4465", text = "Ps. lxxxix. 32, 33." },
  { t = "note", id = "4466", text = "Mal. iii. 3." },
  { t = "note", id = "4467", text = "Matt. v. 26." },
]

[[section]]
id = "testimony-lviii-that-no-one-should-be"
title = "Testimony LVIII. That no one should be made sad by death; since in living is labour and peril, in dying peace and the certainty of resurrection."
level = 2
blocks = [
  { t = "p", text = "58. That no one should be made sad by death; since in living is labour and peril, in dying peace and the certainty of resurrection." },
  { t = "p", text = "In Genesis: “Then said the Lord to Adam, Because thou hast hearkened to the voice of thy wife, and hast eaten of that tree of which alone I commanded thee that thou shouldest not eat, cursed shall be the ground in all thy works; in sadness and groaning shalt thou eat of it all the days of thy life: thorns and thistles shall it cast forth to thee; and thou shalt eat the herb of the field in the sweat of thy brow. Thou shalt eat thy bread until thou return unto the earth from which also thou wast taken; because earth thou art, and to earth thou shalt go.”[^4468] Also in the same place: “And Enoch pleased God, and was not found afterwards: because God translated him.”[^4469] And in Isaiah: “All flesh is grass, and all the glory of it as the flower of grass. The grass withered, and the flower hath fallen away; but the word of the Lord abideth for ever.”[^4470] In Ezekiel: “They say, Our bones are become dry, our hope hath perished: we have expired. Therefore prophesy, and say, Thus saith the Lord, Behold, I open your monuments, and I will bring you forth from your monuments, and I will bring you into the land of Israel; and I will put my Spirit upon you, and ye shall live; and I will place you into your land: and ye shall know that I the Lord have spoken, and will do it, saith the Lord.”[^4471] Also in the Wisdom of Solomon: “He was taken away, lest wickedness should change his understanding; for his soul was pleasing to God.”[^4472] Also in the eighty-third Psalm: “How beloved[^4473] are thy dwellings, Thou Lord of hosts? My soul desires and hastes to the courts of God.”[^4474] And in the Epistle of Paul to the Thessalonians: “But we would not that you should be ignorant, brethren, concerning those who sleep, that ye sorrow not as others which have no hope. For if we believe that Jesus died and rose again, so also them which have fallen asleep in Jesus will God bring with Him.”[^4475] Also in the first Epistle to the Corinthians: “Thou fool, that which thou sowest is not quickened except it have first died.”[^4476] And again: “Star differeth from star in glory: so also the resurrection. The body is sown in corruption, it rises without corruption; it is sown in ignominy, it rises again in glory; it is sown in weakness, it rises again in power; it is sown an animal body, it rises again a spiritual body.”[^4477] And again: “For this corruptible must put on incorruption, and this mortal put on immortality. But when this corruptible shall have put on incorruption, and this mortal shall have put on immortality, then shall come to pass the word that is written, Death is absorbed into striving. Where, O death, is thy sting? Where, O death, is thy striving?”[^4478] Also in the Gospel according to John: “Father, I will that those whom Thou hast given me be with me where I shall be, and may see my glory which Thou hast given me before the foundation of the world.”[^4479] Also according to Luke: “Now lettest Thou Thy servant depart in peace, O Lord, according to the word; for mine eyes have seen Thy salvation.”[^4480] Also according to John: “If ye loved me, ye would rejoice because I go to the Father; for the Father is greater than I.”[^4481]" },
  { t = "note", id = "4468", text = "Gen. iii. 17–19." },
  { t = "note", id = "4469", text = "Gen. v. 24." },
  { t = "note", id = "4470", text = "Isa. xl. 6, 7." },
  { t = "note", id = "4471", text = "Ezek. xxxvii. 11–14." },
  { t = "note", id = "4472", text = "Wisd. iv. 11, 14." },
  { t = "note", id = "4473", text = "Some read “amabiles,” “amiable.”" },
  { t = "note", id = "4474", text = "Ps. lxxxiv. 1, 2." },
  { t = "note", id = "4475", text = "1 Thess. iv. 13, 14." },
  { t = "note", id = "4476", text = "1 Cor. xv. 36." },
  { t = "note", id = "4477", text = "1 Cor. xv. 41–44." },
  { t = "note", id = "4478", text = "1 Cor. xv. 53–55." },
  { t = "note", id = "4479", text = "John xvii. 24." },
  { t = "note", id = "4480", text = "Luke ii. 29, 30." },
  { t = "note", id = "4481", text = "John xiv. 28." },
]

[[section]]
id = "testimony-lix-of-the-idols-which-the"
title = "Testimony LIX. Of the idols which the Gentiles think to be gods."
level = 2
blocks = [
  { t = "p", text = "59. Of the idols which the Gentiles think to be gods." },
  { t = "p", text = "In the Wisdom of Solomon: “All the idols of the nations they counted gods, which neither have the use of their eyes for seeing, nor their nostrils to receive breath, nor their ears for hearing, nor the fingers on their hands for handling; but their feet also are slow to walk. For man made them; and he who has borrowed his breath, he fashioned them. But no man will be able to fashion a god like to himself. For since he is mortal, he fashioneth a dead thing with wicked hands. But he himself is better than they whom he worships, since he indeed lived, but they never.”[^4482] On this same matter: “Neither have they who have regarded the works known who was the artificer, but have thought that either fire, or wind, or the rapid air, or the circle of the stars, or the abundant water, or the sun and moon, were the gods that rule over the world; and if, on account of the beauty of these, they have thought thus, let them know how much more beautiful than these is the Lord; or if they have admired their powers and operations, let them perceive from these very things that He who has established these mighty things is stronger than they.”[^4483] Also in the cxxxivth Psalm: “The idols of the nations are silver and gold, the work of men’s hands. They have a mouth, and speak not; they have eyes, and see not; they have ears, and hear not; and neither is there any breath in their mouth. Let them who make them become like unto them, and all those who trust in them.”[^4484] Also in the ninety-fifth Psalm: “All the gods of the nations are demons, but the Lord made the heavens.”[^4485] Also in Exodus: “Ye shall not make unto yourselves gods of silver nor of gold.”[^4486] And again: “Thou shalt not make to thyself an idol, nor the likeness of any thing.”[^4487] Also in Jeremiah: “Thus saith the Lord, Walk not according to the ways of the heathen; for they fear those things in their own persons, because the lawful things of the heathen are vain. Wood cut out from the forest is made the work of the carpenter, and melted silver and gold are beautifully arranged: they strengthen them with hammers and nails, and they shall not be moved, for they are fixed. The silver is brought from Tharsis, the gold comes from Moab. All things are the works of the artificers; they will clothe it with blue and purple; lifting them, they will carry them, because they will not go forward. Be not afraid of them, because they do no evil, neither is there good in them. Say thus, The gods that have not made the heaven and the earth perish from the earth, and from under this heaven. The heaven hath trembled at this, and hath shuddered much more vehemently, saith the Lord. These evil things hath my people done. They have forsaken the fountain of living water, and have dug out for themselves worn-out wells, which could not hold water. Thy love hath smitten thee, and thy wickedness shall accuse thee. And know and see that it shall be a bitter thing for thee that thou hast forsaken me, saith the Lord thy God, and thou hast not hoped in me, saith thy Lord. Because of old time thou hast resented my yoke, and hast broken thy bonds, and hast said, I will not serve, but I will go upon every lofty mountain, and upon every high hill, and upon every shady tree: there I will be confounded with fornication. To the wood and to the stone they have said, Thou art my father; and to the stone, Thou hast begotten me: and they turned to me their back, and not their face.”[^4488] In Isaiah: “The dragon hath fallen or is dissolved; their carved works have become as beasts and cattle. Labouring and hungry, and without strength, ye shall bear them bound upon your neck as a heavy burden.”[^4489] And again: “Gathered together, they shall not be able to be saved from war; but they themselves have been led captive with thee.”[^4490] And again: “To whom have ye likened me? See and understand that ye err in your heart, who lavish gold out of the bag, and weigh silver in the balance, bringing it up to the weight. The workmen have made with their hand the things made; and, bowing themselves, they have adored it, and have raised it on their shoulders: and thus they walked. But if they should place them down, they will abide in their place, and will not be moved; and they will not hear those who cry unto them: they will not save them from evils.”[^4491] Also in Jeremiah: “The Lord, who made heaven and earth, in strength hath ordered the world, in His wisdom hath stretched forth the heaven, and the multitude of the waters in the heaven. He hath brought out the clouds from the end of the earth, the lightnings in the clouds; and He hath brought forth the winds from His treasures. Every man is made foolish by his knowledge, every artificer is confounded by his graven images; because he hath molten a falsehood: there is no breath in them. The works shut up in them are made vain; in the time of their consideration they shall perish.”[^4492] And in the Apocalypse: “And the sixth angel sounded with his trumpet. And I heard one of the four corners of the golden ark, which is in the presence of God, saying to the sixth angel who had the trumpet, Loose the four angels which are bound upon the great river Euphrates. And the four angels were loosed, which were prepared for an hour, and a day, and a month, and a year, to slay the third part of men; and the number of the army of the horsemen was two hundred thousand of thousand: I heard the number of them. And then I saw the horses in the vision, and those that sate upon them, having breastplates of fire, and of hyacinth, and of sulphur: and the heads of the horses (as the heads of lions); and out of their mouth went fire, and smoke, and sulphur. By these three plagues the third part of men was slain, by the fire, and the smoke, and the sulphur which went forth from their mouth, and is in their tails: for their tails were like unto eels; for they had heads, and with them they do mischief. And the rest of the men who were not slain by these plagues, nor repented of the works of the deeds of their hands, that they should not worship demons and idols, that is, images of gold, and of silver, and of brass, and of stone, and of wood, which can neither see nor walk, repented not also of their murders.”[^4493] Also in the same place: “And the third angel followed them, saying with a loud voice, If any man worship the beast and his image, and hath received his mark in his forehead or upon his hand, the same shall drink of the wine of His wrath, and shall be punished with fire and sulphur, under the eyes of the holy angels, and under the eyes of the Lamb; and the smoke of their torments shall ascend up for ever and ever.”[^4494]" },
  { t = "note", id = "4482", text = "Wisd. xv. 15–17." },
  { t = "note", id = "4483", text = "Wisd. xiii. 1–4." },
  { t = "note", id = "4484", text = "Ps. cxxxv. 16–18." },
  { t = "note", id = "4485", text = "Ps. xcvi. 5." },
  { t = "note", id = "4486", text = "Ex. xx. 23." },
  { t = "note", id = "4487", text = "Ex. xx. 4. This section closes here, according to the Oxford text. The Leipzic edition continues as in the above reading." },
  { t = "note", id = "4488", text = "Jer. x. 2–5, 9, 11; ii. 12, 13, 19, 20, 27." },
  { t = "note", id = "4489", text = "Isa. xlvi. 1, 2, 5." },
  { t = "note", id = "4490", text = "Migne refers this to Jer. li. 15–18, but there is nothing corresponding to it in the passage." },
  { t = "note", id = "4491", text = "Isa. xlvi. 6, 7." },
  { t = "note", id = "4492", text = "Jer. li. 16–19." },
  { t = "note", id = "4493", text = "Rev. ix. 1, 13–21." },
  { t = "note", id = "4494", text = "Rev. xiv. 9–11." },
]

[[section]]
id = "testimony-lx-that-too-great-lust-of"
title = "Testimony LX. That too great lust of food is not to be desired."
level = 2
blocks = [
  { t = "p", text = "60. That too great lust of food is not to be desired." },
  { t = "p", text = "In Isaiah: “Let us eat and drink, for to-morrow we shall die. This sin shall not be remitted to you even until ye die.”[^4495] Also in Exodus: “And the people sate down to eat and drink, and rose up to play.”[^4496] Paul, in the first to the Corinthians: “Meat commendeth us not to God; neither if we eat shall we abound, nor if we eat not shall we want.”[^4497] And again: “When ye come together to eat, wait one for another. If any is hungry, let him eat at home, that ye may not come together for judgment.”[^4498] Also to the Romans: “The kingdom of God is not meat and drink, but righteousness, and peace, and joy in the Holy Ghost.”[^4499] In the Gospel according to John: “I have meat which ye know not of. My meat is, that I should do His will who sent me, and should finish His work.”[^4500]" },
  { t = "note", id = "4495", text = "Isa. xxii. 13, 14." },
  { t = "note", id = "4496", text = "Ex. xxxii. 6." },
  { t = "note", id = "4497", text = "1 Cor. viii. 8." },
  { t = "note", id = "4498", text = "1 Cor. xi. 33." },
  { t = "note", id = "4499", text = "Rom. xiv. 17." },
  { t = "note", id = "4500", text = "John iv. 32, 34." },
]

[[section]]
id = "testimony-lxi-that-the-lust-of-possessing"
title = "Testimony LXI. That the lust of possessing, and money, are not to be sought for."
level = 2
blocks = [
  { t = "p", text = "61. That the lust of possessing, and money, are not to be sought for." },
  { t = "p", text = "In Solomon, in Ecclesiasticus: “He that loveth silver shall not be satisfied with silver.”[^4501] Also in Proverbs: “He who holdeth back the corn is cursed among the people; but blessing is on the head of him that communicateth it.”[^4502] Also in Isaiah: “Woe unto them who join house to house, and lay field to field, that they may take away something from their neighbour. Will ye dwell alone upon the earth?”[^4503] Also in Zephaniah: “They shall build houses, and shall not dwell in them; and they shall appoint vineyards, and shall not drink the wine of them, because the day of the Lord is near.”[^4504] Also in the Gospel according to Luke: “For what does it profit a man to make a gain of the whole world, but that he should lose himself?”[^4505] And again: “But the Lord said unto him, Thou fool, this night thy soul is required of thee. Whose, then, shall those things be which thou hast provided?”[^4506] And again: “Remember that thou hast received thy good things in this life, and likewise Lazarus evil things. But now he is besought, and thou grievest.”[^4507] And in the Acts of the Apostles: “But Peter said unto him, Silver and gold indeed I have not; but what I have I give unto you: In the name of Jesus Christ of Nazareth, rise up and walk. And, taking hold of his right hand, he lifted him up.”[^4508] Also in the first to Timothy: “We brought nothing into this world, but neither can we take anything away. Therefore, having maintenance and clothing, let us with these be content. But they who will become rich fall into temptation and a snare, and many and hurtful lusts, which drown man in perdition and destruction. For the root of all evils is covetousness, which some coveting, have made shipwreck from the faith, and have plunged themselves in many sorrows.”[^4509]" },
  { t = "note", id = "4501", text = "Eccles. v. 10." },
  { t = "note", id = "4502", text = "Prov. xi. 26." },
  { t = "note", id = "4503", text = "Isa. v. 8." },
  { t = "note", id = "4504", text = "Zeph. i. 13, 14." },
  { t = "note", id = "4505", text = "Luke ix. 25." },
  { t = "note", id = "4506", text = "Luke xii. 20." },
  { t = "note", id = "4507", text = "Luke xvi. 25." },
  { t = "note", id = "4508", text = "Acts iii. 6." },
  { t = "note", id = "4509", text = "1 Tim. vi. 7–10." },
]

[[section]]
id = "testimony-lxii-that-marriage-is-not-to"
title = "Testimony LXII. That marriage is not to be contracted with Gentiles."
level = 2
blocks = [
  { t = "p", text = "62. That marriage is not to be contracted with Gentiles." },
  { t = "p", text = "In Tobias: “Take a wife from the seed of thy parents, and take not a strange woman who is not of the tribe of thy parents.”[^4510] Also in Genesis, Abraham sends his servant to take from his seed Rebecca, for his son Isaac. Also in Esdras, it was not sufficient for God when the Jews were laid waste, unless they forsook their foreign wives, with the children also whom they had begotten of them. Also in the first Epistle of Paul to the Corinthians: “The woman is bound so long as her husband liveth; but if he die, she is freed to marry whom she will, only in the Lord. But she will be happier if she abide thus.”[^4511] And again: “Know ye not that your bodies are the members of Christ? Shall I take the members of Christ, and make them the members of an harlot? Far be it from me. Or know ye not that he who is joined together with an harlot is one body? for two shall be in one flesh. But he who is joined to the Lord is one spirit.”[^4512] Also in the second to the Corinthians: “Be not joined together with unbelievers. For what participation is there between righteousness and unrighteousness? or what communication hath light with darkness?”[^4513] Also concerning Solomon in the third book of Kings: “And foreign wives turned away his heart after their gods.”[^4514]" },
  { t = "note", id = "4510", text = "Tob. iv. 12." },
  { t = "note", id = "4511", text = "1 Cor. vii. 39, 40." },
  { t = "note", id = "4512", text = "1 Cor. vi. 15–17." },
  { t = "note", id = "4513", text = "2 Cor. vi. 14." },
  { t = "note", id = "4514", text = "1 Kings xi. 4. [Surely this principle is important in teaching fathers and mothers how to guard the social relations of children.]" },
]

[[section]]
id = "testimony-lxiii-that-the-sin-of-fornication"
title = "Testimony LXIII. That the sin of fornication is grievous."
level = 2
blocks = [
  { t = "p", text = "63. That the sin of fornication is grievous." },
  { t = "p", text = "In the first Epistle of Paul to the Corinthians: “Every sin whatsoever a man doeth is outside the body; but he who committeth fornication sinneth against his own body. Ye are not your own, for ye are bought with a great price. Glorify and bear the Lord in your body.”[^4515]" },
  { t = "note", id = "4515", text = "1 Cor. vi. 18–20." },
]

[[section]]
id = "testimony-lxiv-what-are-those-carnal-things"
title = "Testimony LXIV. What are those carnal things which beget death, and what are the spiritual things which lead to life."
level = 2
blocks = [
  { t = "p", text = "64. What are those carnal things which beget death, and what are the spiritual things which lead to life." },
  { t = "p", text = "Paul to the Galatians: “The flesh lusteth against the Spirit, and the Spirit against the flesh: for these are contrary the one to the other, that ye cannot do even those things which ye wish. But the deeds of the flesh are manifest, which are: adulteries, fornications, impurities, filthiness, idolatries, sorceries, murders, hatreds, strifes, emulations, animosities, provocations, hatreds, dissensions, heresies, envyings, drunkenness, revellings, and such like: with respect to which I declare, that they who do such things shall not possess the kingdom of God. But the fruit of the Spirit is charity, joy, peace, magnanimity, goodness, faith, gentleness, continency, chastity. For they who are Christ’s have crucified their flesh, with its vices and lusts.”[^4516]" },
  { t = "note", id = "4516", text = "Gal. v. 17–24." },
]

[[section]]
id = "testimony-lxv-that-all-sins-are-put"
title = "Testimony LXV. That all sins are put away in baptism."
level = 2
blocks = [
  { t = "p", text = "65. That all sins are put away in baptism." },
  { t = "p", text = "In the first Epistle of Paul to the Corinthians: “Neither fornicators, nor those who serve idols, nor adulterers, nor effeminate, nor the lusters after mankind, nor thieves, nor cheaters, nor drunkards, nor revilers, nor robbers, shall obtain the kingdom of God. And these things indeed ye were: but ye are washed, but ye are sanctified in the name of our Lord Jesus Christ, and in the Spirit of our God.”[^4517]" },
  { t = "note", id = "4517", text = "1 Cor. vi. 9–11." },
]

[[section]]
id = "testimony-lxvi-that-the-discipline-of-god"
title = "Testimony LXVI. That the discipline of God is to be observed in Church precepts."
level = 2
blocks = [
  { t = "p", text = "66. That the discipline of God is to be observed in Church precepts." },
  { t = "p", text = "In Jeremiah: “And I will give to you shepherds according to my own heart; and they shall feed the sheep, feeding them with discipline.”[^4518] Also in Solomon, in the Proverbs: “My son neglect not the discipline of God, nor fail when rebuked by Him. For whom God loveth, He rebuketh.”[^4519] Also in the second Psalm: “Keep discipline, lest perchance the Lord should be angry, and ye perish from the right way, when His anger shall burn up quickly against you. Blessed are all they who trust in Him.”[^4520] Also in the forty-ninth Psalm: “But to the sinner saith God, For what dost thou set forth my judgments, and takest my covenant into thy mouth? But thou hatest discipline, and hast cast my words behind thee.”[^4521] Also in the Wisdom of Solomon: “He who casteth away discipline is miserable.”[^4522]" },
  { t = "note", id = "4518", text = "Jer. iii. 15." },
  { t = "note", id = "4519", text = "Prov. iii. 11, 12." },
  { t = "note", id = "4520", text = "Ps. ii. 12." },
  { t = "note", id = "4521", text = "Ps. l. 16." },
  { t = "note", id = "4522", text = "Wisd. iii. 11." },
]

[[section]]
id = "testimony-lxvii-that-it-was-foretold-that"
title = "Testimony LXVII. That it was foretold that men should despise sound discipline."
level = 2
blocks = [
  { t = "p", text = "67. That it was foretold that men should despise sound discipline." },
  { t = "p", text = "Paul, in the second to Timothy: “There will be a time when they will not endure sound doctrine; but according to their own lusts will heap to themselves teachers itching in hearing, tickling their ears; and shall turn away their hearing indeed from the truth, but they shall be converted unto fables.”[^4523]" },
  { t = "note", id = "4523", text = "2 Tim. iv. 3, 4." },
]

[[section]]
id = "testimony-lxviii-that-we-must-depart-from"
title = "Testimony LXVIII. That we must depart from him who lives irregularly and contrary to discipline."
level = 2
blocks = [
  { t = "p", text = "68. That we must depart from him who lives irregularly and contrary to discipline." },
  { t = "p", text = "Paul to the Thessalonians: “But we have commanded you, in the name of Jesus Christ, that ye depart from all brethren who walk disorderly, and not according to the tradition which they have received from us.”[^4524] Also in the forty-ninth Psalm: “If thou sawest a thief, at once thou rannest with him, and placedst thy portion with the adulterers.”[^4525]" },
  { t = "note", id = "4524", text = "2 Thess. iii. 6. [A very noteworthy safeguard of apostolic ordinances; but mark the charity with which it is softened, 2 Thess. iii. 14, 15. Compare also cap. ii. 15.]" },
  { t = "note", id = "4525", text = "Ps. l. 28." },
]

[[section]]
id = "testimony-lxix-that-the-kingdom-of-god"
title = "Testimony LXIX. That the kingdom of God is not in the wisdom of the world, nor in eloquence, but in the faith of the cross, and in virtue of conversation."
level = 2
blocks = [
  { t = "p", text = "69. That the kingdom of God is not in the wisdom of the world, nor in eloquence, but in the faith of the cross, and in virtue of conversation." },
  { t = "p", text = "In the first Epistle of Paul to the Corinthians: “Christ sent me to preach, not in wisdom of discourse, lest the cross of Christ should become of no effect. For the word of the cross is foolishness to those who perish; but to those who are saved it is the power of God. For it is written, I will destroy the wisdom of the wise, and I will reprove the prudence of the prudent. Where is the wise? where is the scribe? where is the disputer of this world? Hath not God made foolish the wisdom of this world? Since indeed, in the wisdom of God, the world by wisdom knew not God, it pleased God by the foolishness of preaching to save them that believe. Because the Jews desire signs, and the Greeks seek for wisdom: but we preach Christ crucified, to the Jews indeed a stumbling-block, and to the Gentiles foolishness; but to them that are called, Jews and Greeks, Christ the power of God, and the wisdom of God.”[^4526] And again: “Let no man deceive himself. If any man think that he is wise among you, let him become a fool to this world, that he may be wise. For the wisdom of this world is foolishness with God. For it is written, Thou shalt rebuke the wise in their own craftiness.”[^4527] And again: “The Lord knoweth the thoughts of the wise, that they are foolish.”[^4528]" },
  { t = "note", id = "4526", text = "1 Cor. i. 17–24." },
  { t = "note", id = "4527", text = "1 Cor. iii. 18–20." },
  { t = "note", id = "4528", text = "Ps. xciii. 11." },
]

[[section]]
id = "testimony-lxx-that-we-must-obey-parents"
title = "Testimony LXX. That we must obey parents."
level = 2
blocks = [
  { t = "p", text = "70. That we must obey parents." },
  { t = "p", text = "In the Epistle of Paul to the Ephesians: “Children, be obedient to your parents: for this is right. Honour thy father and thy mother (which is the first command with promise), that it may be well with thee, and thou mayest be long-lived on the earth.”[^4529]" },
  { t = "note", id = "4529", text = "Eph. vi. 1–3." },
]

[[section]]
id = "testimony-lxxi-and-that-fathers-also-should"
title = "Testimony LXXI. And that fathers also should not be harsh in respect of their children."
level = 2
blocks = [
  { t = "p", text = "71. And that fathers also should not be harsh in respect of their children." },
  { t = "p", text = "Also in the same place: “And, ye fathers, drive not your children to wrath: but nourish them in the discipline and rebuke of the Lord.”[^4530]" },
  { t = "note", id = "4530", text = "Eph. vi. 4." },
]

[[section]]
id = "testimony-lxxii-that-servants-when-they-have"
title = "Testimony LXXII. That servants, when they have believed, ought to serve their carnal masters the better."
level = 2
blocks = [
  { t = "p", text = "72. That servants, when they have believed, ought to serve their carnal masters the better." },
  { t = "p", text = "In the Epistle of Paul to the Ephesians: “Servants, obey your fleshly masters with fear and trembling, and in simplicity of your heart, as to Christ; not serving for the eye, as if you were pleasing men; but as servants of God.”[^4531]" },
  { t = "note", id = "4531", text = "Eph. vi. 5, 6." },
]

[[section]]
id = "testimony-lxxiii-moreover-that-masters-should-be"
title = "Testimony LXXIII. Moreover, that masters should be the more gentle."
level = 2
blocks = [
  { t = "p", text = "73. Moreover, that masters should be the more gentle." },
  { t = "p", text = "Also in the same place: “And, ye masters, do the same things to them, forbearing anger: knowing that both your Master and theirs is in heaven; and there is no choice of persons with Him.”[^4532]" },
  { t = "note", id = "4532", text = "Eph. vi. 9." },
]

[[section]]
id = "testimony-lxxiv-that-all-widows-that-are"
title = "Testimony LXXIV. That all widows that are approved are to be held in honour."
level = 2
blocks = [
  { t = "p", text = "74. That all widows that are approved are to be held in honour." },
  { t = "p", text = "In the first Epistle of Paul to Timothy: “Honour widows which are truly widows. But the widow that is wanton, is dead while she liveth.”[^4533] And again: “But the younger widows pass by: for when they shall be wanton in Christ, they wish to marry; having judgment, because they have cast off their first faith.”[^4534]" },
  { t = "note", id = "4533", text = "1 Tim. v. 3, 6." },
  { t = "note", id = "4534", text = "1 Tim. v. 11, 12." },
]

[[section]]
id = "testimony-lxxv-that-every-person-ought-to"
title = "Testimony LXXV. That every person ought to have care rather of his own people, and especially of believers."
level = 2
blocks = [
  { t = "p", text = "75. That every person ought to have care rather of his own people, and especially of believers." },
  { t = "p", text = "The apostle in his first Epistle to Timothy: “But if any take not care of his own, and especially of those of his own household, he denies the faith, and is worse than an infidel.”[^4535] Of this same thing in Isaiah: “If thou shalt see the naked, clothe him; and despise not those who are of the household of thine own seed.”[^4536] Of which members of the household it is said in the Gospel: “If they have called the master of the house Beelzebub, how much rather them of his household!”[^4537]" },
  { t = "note", id = "4535", text = "1 Tim. v. 8." },
  { t = "note", id = "4536", text = "Isa. lviii. 7." },
  { t = "note", id = "4537", text = "Matt. x. 25." },
]

[[section]]
id = "testimony-lxxvi-that-an-elder-must-not"
title = "Testimony LXXVI. That an elder must not be rashly accused."
level = 2
blocks = [
  { t = "p", text = "76. That an elder must not be rashly accused." },
  { t = "p", text = "In the first to Timothy: “Against an elder receive not an accusation.”[^4538]" },
  { t = "note", id = "4538", text = "1 Tim. v. 19." },
]

[[section]]
id = "testimony-lxxvii-that-the-sinner-must-be"
title = "Testimony LXXVII. That the sinner must be publicly reproved."
level = 2
blocks = [
  { t = "p", text = "77. That the sinner must be publicly reproved." },
  { t = "p", text = "In the first Epistle of Paul to Timothy: “Rebuke them that sin in the presence of all, that others also may be afraid.”[^4539]" },
  { t = "note", id = "4539", text = "1 Tim. v. 20." },
]

[[section]]
id = "testimony-lxxviii-that-we-must-not-speak"
title = "Testimony LXXVIII. That we must not speak with heretics."
level = 2
blocks = [
  { t = "p", text = "78. That we must not speak with heretics." },
  { t = "p", text = "To Titus: “A man that is an heretic, after one rebuke avoid; knowing that one of such sort is perverted, and sinneth, and is by his own self condemned.”[^4540] Of this same thing in the Epistle of John: “They went out from among us, but they were not of us; for if they had been of us, they would doubtless have remained with us.”[^4541] Also in the second to Timothy: “Their word doth creep as a canker.”[^4542]" },
  { t = "note", id = "4540", text = "Tit. iii. 10, 11." },
  { t = "note", id = "4541", text = "1 John ii. 19." },
  { t = "note", id = "4542", text = "2 Tim. ii. 17." },
]

[[section]]
id = "testimony-lxxix-that-innocency-asks-with-confidence"
title = "Testimony LXXIX. That innocency asks with confidence, and obtains."
level = 2
blocks = [
  { t = "p", text = "79. That innocency asks with confidence, and obtains." },
  { t = "p", text = "In the Epistle of John: “If our heart blame us not, we have confidence towards God; and whatever we ask, we shall receive from Him.”[^4543] Also in the Gospel according to Matthew: “Blessed are they of a pure heart, for they shall see God.”[^4544] Also in the twenty-third Psalm: “Who shall ascend into the hill of the Lord? or who shall stand in His holy place? The innocent in hands and of a pure heart.”[^4545]" },
  { t = "note", id = "4543", text = "1 John ii. 21, 22." },
  { t = "note", id = "4544", text = "Matt. v. 8." },
  { t = "note", id = "4545", text = "Ps. xxiv. 3, 4." },
]

[[section]]
id = "testimony-lxxx-that-the-devil-has-no"
title = "Testimony LXXX. That the devil has no power against man unless God have allowed it."
level = 2
blocks = [
  { t = "p", text = "80. That the devil has no power against man unless God have allowed it." },
  { t = "p", text = "In the Gospel according to John: “Jesus said, Thou couldest have no power against me, unless it were given thee from above.”[^4546] Also in the third of Kings: “And God stirred up Satan against Solomon himself.”[^4547] Also in Job, first of all God permitted, and then it was allowed to the devil; and in the Gospel, the Lord first permitted, by saying to Judas, “What thou doest, do quickly.”[^4548] Also in Solomon, in the Proverbs: “The heart of the king is in God’s hand.”[^4549]" },
  { t = "note", id = "4546", text = "John xix. 11." },
  { t = "note", id = "4547", text = "1 Kings xi. 23." },
  { t = "note", id = "4548", text = "John xiii. 27." },
  { t = "note", id = "4549", text = "Prov. xxi. 1." },
]

[[section]]
id = "testimony-lxxxi-that-wages-be-quickly-paid"
title = "Testimony LXXXI. That wages be quickly paid to the hireling."
level = 2
blocks = [
  { t = "p", text = "81. That wages be quickly paid to the hireling." },
  { t = "p", text = "In Leviticus: “The wages of thy hireling shall not sleep with thee until the morning.”[^4550]" },
  { t = "note", id = "4550", text = "Lev. xix. 13." },
]

[[section]]
id = "testimony-lxxxii-that-divination-must-not-be"
title = "Testimony LXXXII. That divination must not be used."
level = 2
blocks = [
  { t = "p", text = "82. That divination must not be used." },
  { t = "p", text = "In Deuteronomy: “Do not use omens nor auguries.”[^4551]" },
  { t = "note", id = "4551", text = "Deut. xviii. 10." },
]

[[section]]
id = "testimony-lxxxiii-that-a-tuft-of-hair"
title = "Testimony LXXXIII. That a tuft of hair is not to be worn on the head."
level = 2
blocks = [
  { t = "p", text = "83. That a tuft of hair is not to be worn on the head." },
  { t = "p", text = "In Leviticus: “Ye shall not make a tuft from the hair of your head.”[^4552]" },
  { t = "note", id = "4552", text = "Lev. xix. 27. [See p. 530, *supra*, the note and reference.]" },
]

[[section]]
id = "testimony-lxxxiv-that-the-beard-must-not"
title = "Testimony LXXXIV. That the beard must not be plucked."
level = 2
blocks = [
  { t = "p", text = "84. That the beard must not be plucked." },
  { t = "p", text = "“Ye shall not deface the figure of your beard.”[^4553]" },
  { t = "note", id = "4553", text = "Lev. xix. 27. [Compare Clement, vol. ii. p. 280, this series.]" },
]

[[section]]
id = "testimony-lxxxv-that-we-must-rise-when"
title = "Testimony LXXXV. That we must rise when a bishop or a presbyter comes."
level = 2
blocks = [
  { t = "p", text = "85. That we must rise when a bishop or a presbyter comes." },
  { t = "p", text = "In Leviticus: “Thou shalt rise up before the face of the elder, and shall honour the person of the presbyter.”[^4554]" },
  { t = "note", id = "4554", text = "Lev. xix. 32." },
]

[[section]]
id = "testimony-lxxxvi-that-a-schism-must-not"
title = "Testimony LXXXVI. That a schism must not be made, even although he who withdraws should remain in one faith, and in the same tradition."
level = 2
blocks = [
  { t = "p", text = "86. That a schism must not be made, even although he who withdraws should remain in one faith, and in the same tradition." },
  { t = "p", text = "In Ecclesiasticus, in Solomon: “He that cleaveth firewood shall be endangered by it if the iron shall fall off.”[^4555] Also in Exodus: “In one house shall it be eaten: ye shall not cast forth the flesh abroad out of the house.”[^4556] Also in the cxxxiid Psalm: “Behold how good and how pleasant a thing it is that brethren should dwell in unity!”[^4557] Also in the Gospel according to Matthew: “He that is not with me is against me; and he that gathereth not with me scattereth.”[^4558] Also in the first Epistle of Paul to the Corinthians: “But I beseech you, brethren, by the name of our Lord Jesus Christ, that ye all say the same thing, and that there be no schisms among you; but that ye be all joined together in the same mind and in the same opinion.”[^4559] Also in the sixty-seventh Psalm: “God, who maketh men to dwell with one mind in a house.”[^4560]" },
  { t = "note", id = "4555", text = "Eccles. x. 9." },
  { t = "note", id = "4556", text = "Ex. xii. 4." },
  { t = "note", id = "4557", text = "Ps. cxxxiii. 1." },
  { t = "note", id = "4558", text = "Matt. xii. 30." },
  { t = "note", id = "4559", text = "1 Cor. i. 10." },
  { t = "note", id = "4560", text = "Ps. lxviii. 6. [So Vulgate and Anglican Psalter.]" },
]

[[section]]
id = "testimony-lxxxvii-that-believers-ought-to-be"
title = "Testimony LXXXVII. That believers ought to be simple, with prudence."
level = 2
blocks = [
  { t = "p", text = "87. That believers ought to be simple, with prudence." },
  { t = "p", text = "In the Gospel according to Matthew: “Be ye prudent as serpents, and simple as doves.”[^4561] And again: “Ye are the salt of the earth. But if the salt have lost his savour, in what shall it be salted? It is good for nothing, but to be cast out abroad, and to be trodden under foot of men.”[^4562]" },
  { t = "note", id = "4561", text = "Matt. x. 16." },
  { t = "note", id = "4562", text = "Matt. v. 13." },
]

[[section]]
id = "testimony-lxxxviii-that-a-brother-must-not"
title = "Testimony LXXXVIII. That a brother must not be deceived."
level = 2
blocks = [
  { t = "p", text = "88. That a brother must not be deceived." },
  { t = "p", text = "In the first Epistle of Paul to the Thessalonians: “That a man do not deceive his brother in a matter, because God is the avenger for all these.”[^4563]" },
  { t = "note", id = "4563", text = "1 Thess. iv. 6." },
]

[[section]]
id = "testimony-lxxxix-that-the-end-of-the"
title = "Testimony LXXXIX. That the end of the world comes suddenly."
level = 2
blocks = [
  { t = "p", text = "89. That the end of the world comes suddenly." },
  { t = "p", text = "The apostle says: “The day of the Lord shall so come as a thief in the night. When they shall say, Peace and security, then on them shall come sudden destruction.”[^4564] Also in the Acts of the Apostles: “No one can know the times or the seasons which the Father has placed in His own power.”[^4565]" },
  { t = "note", id = "4564", text = "1 Thess. v. 2, 3." },
  { t = "note", id = "4565", text = "Acts i. 7." },
]

[[section]]
id = "testimony-xc-that-a-wife-must-not"
title = "Testimony XC. That a wife must not depart from her husband; or if she should depart, she must remain unmarried."
level = 2
blocks = [
  { t = "p", text = "90. That a wife must not depart from her husband; or if she should depart, she must remain unmarried." },
  { t = "p", text = "In the first Epistle of Paul to the Corinthians: “But to them that are married I command, yet not I, but the Lord, that the wife should not be separated from her husband; but if she should depart, that she remain unmarried or be reconciled to her husband: and that the husband should not put away his wife.”[^4566]" },
  { t = "note", id = "4566", text = "1 Cor. vii. 10, 11." },
]

[[section]]
id = "testimony-xci-that-every-one-is-tempted"
title = "Testimony XCI. That every one is tempted so much as he is able to bear."
level = 2
blocks = [
  { t = "p", text = "91. That every one is tempted so much as he is able to bear." },
  { t = "p", text = "In the first Epistle of Paul to the Corinthians: “No temptation shall take you, except such is human. But God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it.”[^4567]" },
  { t = "note", id = "4567", text = "1 Cor. x. 13." },
]

[[section]]
id = "testimony-xcii-that-not-everything-is-to"
title = "Testimony XCII. That not everything is to be done which is lawful."
level = 2
blocks = [
  { t = "p", text = "92. That not everything is to be done which is lawful." },
  { t = "p", text = "Paul, in the first Epistle to the Corinthians: “All things are lawful, but all things are not expedient: all things are lawful, but all things edify not.”[^4568]" },
  { t = "note", id = "4568", text = "1 Cor. x. 23." },
]

[[section]]
id = "testimony-xciii-that-it-was-foretold-that"
title = "Testimony XCIII. That it was foretold that heresies would arise."
level = 2
blocks = [
  { t = "p", text = "93. That it was foretold that heresies would arise." },
  { t = "p", text = "In the first epistle of Paul to the Corinthians: “Heresies must needs be, in order that they which are approved may be made manifest among you.”[^4569]" },
  { t = "note", id = "4569", text = "1 Cor. xi. 19." },
]

[[section]]
id = "testimony-xciv-that-the-eucharist-is-to"
title = "Testimony XCIV. That the Eucharist is to be received with fear and honour."
level = 2
blocks = [
  { t = "p", text = "94. That the Eucharist is to be received with fear and honour.[^4570]" },
  { t = "note", id = "4570", text = "[Note, not to be worshipped, but received.]" },
  { t = "p", text = "In Leviticus: “But whatever soul shall eat of the flesh of the sacrifice of salvation, which is the Lord’s, and his uncleanness is still upon him, that soul shall perish from his people.”[^4571] Also in the first to the Corinthians: “Whosoever shall eat the bread or drink the cup of the Lord unworthily, shall be guilty of the body and blood of the Lord.”[^4572]" },
  { t = "note", id = "4571", text = "Lev. vii. 20." },
  { t = "note", id = "4572", text = "1 Cor. xi. 27." },
]

[[section]]
id = "testimony-xcv-that-we-are-to-live"
title = "Testimony XCV. That we are to live with the good, but to avoid the evil."
level = 2
blocks = [
  { t = "p", text = "95. That we are to live with the good, but to avoid the evil." },
  { t = "p", text = "In Solomon, in the Proverbs: “Bring not the impious man into the habitation of the righteous.”[^4573] Also in the same, in Ecclesiasticus: “Let righteous men be thy guests.”[^4574] And again: “The faithful friend is a medicine of life and of immortality.”[^4575] Also in the same place: “Be thou far from the man who has the power to slay, and thou shalt not suspect fear.”[^4576] Also in the same place: “Blessed is he who findeth a true friend, and who speaketh righteousness to the listening ear.”[^4577] Also in the same place: “Hedge thine ears with thorns, and hear not a wicked tongue.”[^4578] Also in the seventeenth Psalm: “With the righteous Thou shalt be justified; and with the innocent man Thou shalt be innocent; and with the froward man Thou shalt be froward.”[^4579] Also in the first Epistle of Paul to the Corinthians: “Evil communications corrupt good dispositions.”[^4580]" },
  { t = "note", id = "4573", text = "Prov. xxiv. 15." },
  { t = "note", id = "4574", text = "Ecclus. ix. 16." },
  { t = "note", id = "4575", text = "Ecclus. vi. 16." },
  { t = "note", id = "4576", text = "Ecclus. ix. 13." },
  { t = "note", id = "4577", text = "Ecclus. xxv. 9." },
  { t = "note", id = "4578", text = "Ecclus. xxviii. 24." },
  { t = "note", id = "4579", text = "Ps. xviii. 25, 26." },
  { t = "note", id = "4580", text = "1 Cor. xv. 33." },
]

[[section]]
id = "testimony-xcvi-that-we-must-labour-not"
title = "Testimony XCVI. That we must labour not with words, but with deeds."
level = 2
blocks = [
  { t = "p", text = "96. That we must labour not with words, but with deeds." },
  { t = "p", text = "In Solomon, in Ecclesiasticus: “Be not hasty in thy tongue, and in thy deeds useless and remiss.”[^4581] And Paul, in the first to the Corinthians: “The kingdom of God is not in word, but in power.”[^4582] Also to the Romans: “Not the hearers of the law are righteous before God, but the doers of the law shall be justified.”[^4583] Also in the Gospel according to Matthew: “He who shall do and teach so, shall be called greatest in the kingdom of heaven.”[^4584] Also in the same place: “Every one who heareth my words, and doeth them, I will liken him to a wise man who built his house upon a rock. The rain descended, the floods came, the winds blew, and beat upon that house, and it fell not: for it was founded upon a rock. And every one who heareth my words, and doeth them not, I will liken him to the foolish man, who built his house upon the sand. The rain descended, the floods came, the winds blew, and beat upon that house; and it fell: and its ruin became great.”[^4585]" },
  { t = "note", id = "4581", text = "Ecclus. iv. 29." },
  { t = "note", id = "4582", text = "1 Cor. iv. 20." },
  { t = "note", id = "4583", text = "Rom. ii. 13." },
  { t = "note", id = "4584", text = "Matt. v. 19." },
  { t = "note", id = "4585", text = "Matt. vii. 24–27." },
]

[[section]]
id = "testimony-xcvii-that-we-must-hasten-to"
title = "Testimony XCVII. That we must hasten to faith and to attainment."
level = 2
blocks = [
  { t = "p", text = "97. That we must hasten to faith and to attainment." },
  { t = "p", text = "In Solomon, in Ecclesiasticus: “Delay not to be converted to God, and do not put off from day to day; for His anger cometh suddenly.”[^4586]" },
  { t = "note", id = "4586", text = "Ecclus. v. 7." },
]

[[section]]
id = "testimony-xcviii-that-the-catechumen-ought-now"
title = "Testimony XCVIII. That the catechumen ought now no longer to sin."
level = 2
blocks = [
  { t = "p", text = "98. That the catechumen ought now no longer to sin.[^4587]" },
  { t = "note", id = "4587", text = "[Converts preparing for baptism. Apostolical Constitutions, and Bunsen’s *Hippolytus*, vol. iii. pp. 3–24.]" },
  { t = "p", text = "In the Epistle of Paul to the Romans: “Let us do evil until the good things come; whose condemnation is just.”[^4588]" },
  { t = "note", id = "4588", text = "Rom. iii. 8." },
]

[[section]]
id = "testimony-xcix-that-judgment-will-be-according"
title = "Testimony XCIX. That judgment will be according to the times, either of equity before the law, or of law after Moses."
level = 2
blocks = [
  { t = "p", text = "99. That judgment will be according to the times, either of equity before the law, or of law after Moses." },
  { t = "p", text = "Paul to the Romans: “As many as have sinned without law, shall perish without law; and as many as have sinned in the law, shall be judged also by the law.”[^4589]" },
  { t = "note", id = "4589", text = "Rom. ii. 12." },
]

[[section]]
id = "testimony-c-that-the-grace-of-god"
title = "Testimony C. That the grace of God ought to be without price."
level = 2
blocks = [
  { t = "p", text = "100. That the grace of God ought to be without price." },
  { t = "p", text = "In the Acts of the Apostles: “Thy money be in perdition with thyself, because thou hast thought that the grace of God is possessed by money.”[^4590] Also in the Gospel: “Freely ye have received, freely give.”[^4591] Also in the same place: “Ye have made my Father’s house a house of merchandise; and ye have made the house of prayer a den of thieves.”[^4592] Also in Isaiah: “Ye who thirst, go to the water, and as many as have not money: go, and buy, and drink without money.”[^4593] Also in the Apocalypse: “I am Alpha and Omega, the beginning and the end. I will give to him that thirsteth from the fountain of the water of life freely. He who shall overcome shall possess these things, and their inheritance; and I will be his God, and he shall be my son.”[^4594]" },
  { t = "note", id = "4590", text = "Acts viii. 20." },
  { t = "note", id = "4591", text = "Matt. x. 8." },
  { t = "note", id = "4592", text = "Matt. xxi. 13. The latter clause of this quotation is omitted by the Oxford editor." },
  { t = "note", id = "4593", text = "Isa. lv. 1." },
  { t = "note", id = "4594", text = "Rev. xxi. 6, 7." },
]

[[section]]
id = "testimony-ci-that-the-holy-spirit-has"
title = "Testimony CI. That the Holy Spirit has frequently appeared in fire."
level = 2
blocks = [
  { t = "p", text = "101. That the Holy Spirit has frequently appeared in fire." },
  { t = "p", text = "In Exodus: “And the whole of Mount Sinai smoked, because God had come down upon it in fire.”[^4595] Also in the Acts of the Apostles: “And suddenly there was made a sound from heaven, as if a vehement blast were borne along, and it filled the whole of that place in which they were sitting. And there appeared to them cloven tongues as if of fire, which also settled upon each of them; and they were all filled with the Holy Ghost.”[^4596] Also in the sacrifices, whatsoever God accounted accepted, fire descended from heaven, which consumed what was sacrificed. In Exodus: “The angel of the Lord appeared in a flame of fire from the bush.”[^4597]" },
  { t = "note", id = "4595", text = "Ex. xix. 18." },
  { t = "note", id = "4596", text = "Acts ii. 2–4." },
  { t = "note", id = "4597", text = "Ex. iii. 2." },
]

[[section]]
id = "testimony-cii-that-all-good-men-ought"
title = "Testimony CII. That all good men ought willingly to hear rebuke."
level = 2
blocks = [
  { t = "p", text = "102. That all good men ought willingly to hear rebuke." },
  { t = "p", text = "In Solomon, in the Proverbs: “He who reproveth a wicked man shall be hated by him. Rebuke a wise man, and he will love you.”[^4598]" },
  { t = "note", id = "4598", text = "Prov. ix. 8." },
]

[[section]]
id = "testimony-ciii-that-we-must-abstain-from"
title = "Testimony CIII. That we must abstain from much speaking."
level = 2
blocks = [
  { t = "p", text = "103. That we must abstain from much speaking." },
  { t = "p", text = "In Solomon: “Out of much speaking thou shalt not escape sin; but sparing thy lips, thou shalt be wise.”[^4599]" },
  { t = "note", id = "4599", text = "Prov. x. 19." },
]

[[section]]
id = "testimony-civ-that-we-must-not-lie"
title = "Testimony CIV. That we must not lie."
level = 2
blocks = [
  { t = "p", text = "104. That we must not lie." },
  { t = "p", text = "“Lying lips are an abomination to the Lord.”[^4600]" },
  { t = "note", id = "4600", text = "Prov. xii. 22." },
]

[[section]]
id = "testimony-cv-that-they-are-frequently-to"
title = "Testimony CV. That they are frequently to be corrected who do wrong in domestic duty."
level = 2
blocks = [
  { t = "p", text = "105. That they are frequently to be corrected who do wrong in domestic duty." },
  { t = "p", text = "In Solomon: “He who spareth the rod, hateth his son.”[^4601] And again: “Do not cease from correcting the child.”[^4602]" },
  { t = "note", id = "4601", text = "Prov. xiii. 24." },
  { t = "note", id = "4602", text = "Prov. xix. 18." },
]

[[section]]
id = "testimony-cvi-that-when-a-wrong-is"
title = "Testimony CVI. That when a wrong is received, patience is to be maintained, and vengeance to be left to God."
level = 2
blocks = [
  { t = "p", text = "106. That when a wrong is received, patience is to be maintained, and vengeance to be left to God." },
  { t = "p", text = "“Say not, I will avenge me of mine enemy; but wait for the Lord, that He may be thy help.”[^4603] Also elsewhere: “To me belongeth vengeance; I will repay, saith the Lord.”[^4604] Also in Zephaniah: “Wait on me, saith the Lord, in the day of my rising again to witness; because my judgment is to the congregations of the Gentiles, that I may take kings, and pour out upon them my anger.”[^4605]" },
  { t = "note", id = "4603", text = "Lev. xix. 18." },
  { t = "note", id = "4604", text = "Deut. xxxii. 35." },
  { t = "note", id = "4605", text = "Zeph. iii. 8." },
]

[[section]]
id = "testimony-cvii-that-we-must-not-use"
title = "Testimony CVII. That we must not use detraction."
level = 2
blocks = [
  { t = "p", text = "107. That we must not use detraction." },
  { t = "p", text = "In Solomon, in the Proverbs: “Love not to detract, lest thou be taken away.”[^4606] Also in the forty-ninth Psalm: “Thou sattest, and spakest against thy brother; and against the son of thy mother thou placedst a stumbling-block.”[^4607] Also in the Epistle of Paul to the Colossians:[^4608] “To speak ill of no man, nor to be litigious.”[^4609]" },
  { t = "note", id = "4606", text = "Prov. xx. 13 (LXX.)." },
  { t = "note", id = "4607", text = "Ps. l. 20." },
  { t = "note", id = "4608", text = "Oxford edition, “to Titus.”" },
  { t = "note", id = "4609", text = "Tit. iii. 2." },
]

[[section]]
id = "testimony-cviii-that-we-must-not-lay"
title = "Testimony CVIII. That we must not lay snares against our neighbour."
level = 2
blocks = [
  { t = "p", text = "108. That we must not lay snares against our neighbour." },
  { t = "p", text = "In Solomon, in the Proverbs: “He who diggeth a pit for his neighbour, himself shall fall into it.”[^4610]" },
  { t = "note", id = "4610", text = "Prov. xxvi. 27." },
]

[[section]]
id = "testimony-cix-that-the-sick-are-to"
title = "Testimony CIX. That the sick are to be visited."
level = 2
blocks = [
  { t = "p", text = "109. That the sick are to be visited.[^4611]" },
  { t = "note", id = "4611", text = "[Elucidation XII. See p. 528, *supra.*]" },
  { t = "p", text = "In Solomon, in Ecclesiasticus: “Be not slack to visit the sick man; for from these things thou shalt be strengthened in love.”[^4612] Also in the Gospel: “I was sick, and ye visited me; I was in prison, and ye came unto me.”[^4613]" },
  { t = "note", id = "4612", text = "Ecclus. vii. 39." },
  { t = "note", id = "4613", text = "Matt. xxv. 36." },
]

[[section]]
id = "testimony-cx-that-tale-bearers-are-accursed"
title = "Testimony CX. That tale-bearers are accursed."
level = 2
blocks = [
  { t = "p", text = "110. That tale-bearers are accursed." },
  { t = "p", text = "In Ecclesiasticus, in Solomon: “The talebearer and the double-tongued is accursed; for he will disturb many who have peace.”[^4614]" },
  { t = "note", id = "4614", text = "Ecclus. xxviii. 15." },
]

[[section]]
id = "testimony-cxi-that-the-sacrifices-of-the"
title = "Testimony CXI. That the sacrifices of the wicked are not acceptable."
level = 2
blocks = [
  { t = "p", text = "111. That the sacrifices of the wicked are not acceptable." },
  { t = "p", text = "In the same: “The Highest approveth not the gifts of the unrighteous.”[^4615]" },
  { t = "note", id = "4615", text = "Ecclus. xxxiv. 19." },
]

[[section]]
id = "testimony-cxii-that-those-are-more-severely"
title = "Testimony CXII. That those are more severely judged, who in this world have had more power."
level = 2
blocks = [
  { t = "p", text = "112. That those are more severely judged, who in this world have had more power." },
  { t = "p", text = "In Solomon: “The hardest judgment shall be made on those who govern. For to a mean man mercy is granted; but the powerful shall suffer torments mightily.”[^4616] Also in the second Psalm: “And now, ye kings, understand; be amended, ye who judge the earth.”[^4617]" },
  { t = "note", id = "4616", text = "Wisd. vi. 6." },
  { t = "note", id = "4617", text = "Ps. ii. 10." },
]

[[section]]
id = "testimony-cxiii-that-the-widow-and-orphans"
title = "Testimony CXIII. That the widow and orphans ought to be protected."
level = 2
blocks = [
  { t = "p", text = "113. That the widow and orphans ought to be protected." },
  { t = "p", text = "In Solomon: “Be merciful to the orphans as a father, and as a husband to their mother; and thou shalt be the son of the Highest if thou shalt obey.”[^4618] Also in Exodus: “Ye shall not afflict any widow and orphan. But if ye afflict them, and they cry out and call unto me, I will hear their cryings, and will be angry in mind against you; and I will destroy you with the sword, and your wives shall be widows, and your children orphans.”[^4619] Also in Isaiah: “Judge for the fatherless, and justify the widow; and come let us reason, saith the Lord.”[^4620] Also in Job: “I have preserved the poor man from the hand of the mighty, and I have helped the fatherless who had no helper: the mouth of the widow hath blessed me.”[^4621] Also in the sixty-seventh Psalm: “The Father of the orphans, and the Judge of the widows.”[^4622]" },
  { t = "note", id = "4618", text = "Ecclus. iv. 10." },
  { t = "note", id = "4619", text = "Ex. xxii. 22–24." },
  { t = "note", id = "4620", text = "Isa. i. 17, 18." },
  { t = "note", id = "4621", text = "Job xxix. 12, 13." },
  { t = "note", id = "4622", text = "Ps. lxviii. 5." },
]

[[section]]
id = "testimony-cxiv-that-one-ought-to-make"
title = "Testimony CXIV. That one ought to make confession while he is in the flesh."
level = 2
blocks = [
  { t = "p", text = "114. That one ought to make confession while he is in the flesh." },
  { t = "p", text = "In the fifth Psalm: “But in the grave who will confess unto Thee?”[^4623] Also in the twenty-ninth Psalm: “Shall the dust make confession to Thee?”[^4624] Also elsewhere that confession is to be made: “I would rather have the repentance of the sinner than his death.”[^4625] Also in Jeremiah: “Thus saith the Lord, Shall not he that falleth arise? or shall not he that is turned away be converted?”[^4626]" },
  { t = "note", id = "4623", text = "Ps. vi. 5. [Here, as often, the grave is represented as enjoying a temporary victory, for the flesh is no longer capable of worship. Not till the whole man is restored comes 1 Cor. xv. 54, 55.]" },
  { t = "note", id = "4624", text = "Ps. xxx. 9." },
  { t = "note", id = "4625", text = "Ezek. xxxiii. 11." },
  { t = "note", id = "4626", text = "Jer. viii. 4." },
]

[[section]]
id = "testimony-cxv-that-flattery-is-pernicious"
title = "Testimony CXV. That flattery is pernicious."
level = 2
blocks = [
  { t = "p", text = "115. That flattery is pernicious." },
  { t = "p", text = "In Isaiah: “They who call you blessed, lead you into error, and trouble the paths of your feet.”[^4627]" },
  { t = "note", id = "4627", text = "Isa. iii. 12." },
]

[[section]]
id = "testimony-cxvi-that-god-is-more-loved"
title = "Testimony CXVI. That God is more loved by him who has had many sins forgiven in baptism."
level = 2
blocks = [
  { t = "p", text = "116. That God is more loved by him who has had many sins forgiven in baptism." },
  { t = "p", text = "In the Gospel according to Luke: “To whom much is forgiven, he loveth much; and to whom little is forgiven, the same loveth little.”[^4628]" },
  { t = "note", id = "4628", text = "Luke vii. 47." },
]

[[section]]
id = "testimony-cxvii-that-there-is-a-strong"
title = "Testimony CXVII. That there is a strong conflict to be waged against the devil, and that therefore we ought to stand bravely, that we may be able to conquer."
level = 2
blocks = [
  { t = "p", text = "117. That there is a strong conflict to be waged against the devil, and that therefore we ought to stand bravely, that we may be able to conquer." },
  { t = "p", text = "In the Epistle of Paul to the Ephesians: “Our wrestle is not against flesh and blood, but against the powers and princes of this world, and of this darkness; against the spiritual things of wickedness in the heavenly places. Because of this, put on the whole armour of God, that ye may be able to resist in the most evil day; that when ye have accomplished all, ye may stand, having your loins girt in the truth of the Gospel, putting on the breastplate of righteousness, and having your feet shod with the preparation of the Gospel of peace; in all things taking the shield of faith, in which ye may extinguish all the fiery darts of the most wicked one; and take the helmet of salvation, and the sword of the Spirit, which is the word of God.”[^4629]" },
  { t = "note", id = "4629", text = "Eph. vi. 12–17." },
]

[[section]]
id = "testimony-cxviii-also-of-antichrist-that-he"
title = "Testimony CXVIII. Also of Antichrist, that he will come as a man."
level = 2
blocks = [
  { t = "p", text = "118. Also of Antichrist, that he will come as a man." },
  { t = "p", text = "In Isaiah: “This is the man who arouseth the earth, who disturbeth kings, who maketh the whole earth a desert.”[^4630]" },
  { t = "note", id = "4630", text = "Isa. xiv. 16." },
]

[[section]]
id = "testimony-cxix-that-the-yoke-of-the"
title = "Testimony CXIX. That the yoke of the law was heavy, which is cast off by us, and that the Lord's yoke is easy, which is taken up by us."
level = 2
blocks = [
  { t = "p", text = "119. That the yoke of the law was heavy, which is cast off by us, and that the Lord’s yoke is easy, which is taken up by us." },
  { t = "p", text = "In the second Psalm: “Wherefore have the heathen been in tumult, and the peoples meditated vain things? The kings of the earth have stood up, and their princes have been gathered together against the Lord, and against His Christ. Let us break their bonds asunder, and cast away from us their yoke.”[^4631] Also in the Gospel according to Matthew: “Come unto me, ye who labour and are burdened, and I will make you to rest. Take my yoke upon you, and learn of me: for I am meek and lowly of heart,[^4632] and ye shall find rest for your souls. For my yoke is good, and my burden is light.”[^4633] Also in the Acts of the Apostles: “It seemed good to the Holy Ghost, and to us, to impose upon you no other burden than those things which are of necessity, that you should abstain from idolatries, from shedding of blood, and from fornication. And whatsoever you would not to be done unto you, do not to others.”[^4634]" },
  { t = "note", id = "4631", text = "Ps. ii. 1–3." },
  { t = "note", id = "4632", text = "In one codex, from this point all the rest is wanting." },
  { t = "note", id = "4633", text = "Matt. xi. 28–30." },
  { t = "note", id = "4634", text = "Acts xv. 28, 29." },
]

[[section]]
id = "testimony-cxx-that-we-are-to-be"
title = "Testimony CXX. That we are to be urgent in prayers."
level = 2
blocks = [
  { t = "p", text = "120. That we are to be urgent in prayers." },
  { t = "p", text = "In the Epistle of Paul to the Colossians: “Be instant in prayer, and watch therein.”[^4635] Also in the first Psalm: “But in the law of the Lord is his will, and in His law will he meditate day and night.”[^4636]" },
  { t = "note", id = "4635", text = "Col. iv. 2." },
  { t = "note", id = "4636", text = "Ps. i. 2. The Oxford edition continues: “Likewise in Solomon; ‘Be not hindered from praying ever, and delay not unto death to be justified; for the repayment of the Lord abideth for ever.’” [In a day when there were few Bibles, and no printed books, no concordances, and no published collections of this sort, reflect on the value of this treatise to a young believer, and on the labour of his pastor in making it.]" },
]

[[section]]
id = "elucidations"
title = "Elucidations."
level = 1
blocks = [
  { t = "h", text = "I." },
  { t = "h", text = "(On the unity of the Church, p. 421.)" },
  { t = "p", text = "The epistles have already been elucidated as the best exposition of this treatise. Little need be added. But, to illustrate the bearings of this treatise upon the history of Christian unity, we need only refer to the manner in which the subject was treated as soon as the papacy was created by Nicholas I. Thus, he astounded the Greeks by his consummate audacity (a.d. 860) in the matter of the disputed succession in Constantinople.[^4637] “*It is our will*,” he says, “that Ignatius should appear before our envoys,” etc. He declares it the rule of the Fathers, that, “without the consent of the Roman See and the Roman pontiff, nothing should be decided.” Also, he affirms, “The Creator of all things has established the Princedom of the Divine Power, which He granted to His chosen apostles. He has firmly established it on the firm faith of the Prince of the Apostles,—that is to say, Peter,—to whom he pre-eminently granted the first See,” etc. He was now speaking on the strength of the forged Decretals, to which he appeals, and which he succeeded in making law for the West. He thus created the lasting schism with the Easterns, who had never heard the like before his time." },
  { t = "note", id = "4637", text = "For the Ultramontane side, consult the *Histoire de Photius*, etc., par M. l’Abbé Jager, p. 41, ed. Paris, 1854. For the Greeks, *La Papauté Schismatique*, etc., par M. l’Abbé Guettée (pp. 286, 288, etc.), Paris, 1863." },
  { t = "p", text = "Obviously, therefore, had Cyprian entertained such ideas, his treatise could never have been written; for it is a masterly exposition of a curious point, viz., the fact that (1) the Apostle Peter received the first grant alone, and yet (2) all the apostles received precisely the same; while (1) Peter had thus a primacy of honour, but (2) in no respect any power or authority over his brethren. On these admitted facts he constructs his theory of unity, expounding by it the actual state of the Church’s constitution. Peter’s memory he honours, but without any less reverence for all the apostolic Sees, which over and over again he maintains to be of equal authority and sanctity. That the Church was founded on Stephen any more than on the Bishop of Carthage, he never imagines; for it is one thing to allow that a bishop has succeeded an apostle at the place of his last labours, and quite another to assume that therefore such a bishop is virtually the apostle himself. Yet this assumption is the ground of all Roman doctrine on this point.[^4638]" },
  { t = "note", id = "4638", text = "“Whatever is said in commendation of St. Peter is at once transferred to the occupant of the papacy, as if *pasce oves meas* had been said to Pius IX.” Burgon, *Letters from Rome*, p. 411, ed. 1862." },
  { t = "p", text = "Had such been Cyprian’s idea, his *Treatise on Unity* must have proceeded thus: (1) “Our Lord said to Peter only, I will give unto thee the keys; (2) to the rest of the apostles He gave only an inferior and subject authority; (3) to the successor of Peter, therefore, at Rome, all other bishops and churches must be subject; for (4) in this subjection the law of unity consists; and (5) if even all the other apostles were alive to this day, they would be subject to Stephen, as Prince of the Apostles, or would be rebels against Christ.”" },
  { t = "p", text = "Compare this treatise of Cyprian, then, with any authorized treatise on the subject proceeding from modern Rome, and it will be seen that the two systems are irreconcilable. Thus, in few words, says the Confession[^4639] of Pius IV.: “I acknowledge the Holy Catholic Apostolic *Roman* Church for the mother and mistress of all churches; and I promise true obedience to the Bishop of Rome, successor to St. Peter, Prince of the Apostles, and Vicar of Jesus Christ.” This is the voice of Italy in the ninth century; but Cyprian speaks for Œcumenical Christendom in the third, and the two systems are as contrary as darkness and light." },
  { t = "note", id = "4639", text = "*Compendium Ritualis Romani*, etc., Baltimori, 1842, p. 195." },
  { t = "h", text = "II." },
  { t = "h", text = "(Falsifying of the text, p. 422.)" },
  { t = "p", text = "Cyprian is often innocently quoted by Romanist controvertists against the very principles of Cyprian himself, of his life and his writings. This is due to the fact that they have in their hands vitiated and interpolated copies. Thus, take a famous passage as follows:—" },
  { t = "h", text = "Cyprian." },
  { t = "p", text = "Loquitur Dominus ad Petrum, Ego tibi dico Tu es Petrus, etc.(a)" },
  { t = "p", text = "Super unum(b) ædificat ecclesiam." },
  { t = "p", text = "Hoc erant utique et cæteri apostoli quot fuit Petrus, qui consortio præditi et honoris et potestatis, sed exordium ab unitate proficisitur,(c) ut(d) Christi ecclesia(e) una monstretur.(f)" },
  { t = "p", text = "Qui Ecclesiæ resistitur et resistit,(g) in ecclesia se esse confidit?" },
  { t = "h", text = "Interpolated." },
  { t = "p", text = "(a) Et iterum eidem, post ressurectionem suam dicit, Pasce oves meas." },
  { t = "p", text = "(b) Super *illum* unum…et illi pascendas mandat oves suas." },
  { t = "p", text = "(c) Et primatus Petro datur." },
  { t = "p", text = "(d) Una." },
  { t = "p", text = "(e) Et cathedra." },
  { t = "p", text = "(f) Et pastores sunt omnes et grex unus ostenditur, qui ab apostolis omnibus, unanimi consensione pascatur, etc." },
  { t = "p", text = "(g) Qui cathedram Petri, super quem fundata est ecclesia deserit, etc." },
  { t = "p", text = "This is but a specimen of the way in which Cyprian has been “doctored,” in order to bring him into a shape capable of being misinterpreted. But you will say where is the proof of such interpolations? The greatly celebrated Benedictine edition reads as the interpolated column does, and who would not credit Baluzius? Now note, Baluzius rejected these interpolations and others; but, dying (a.d. 1718) with his work unfinished, the completion of the task was assigned to a nameless monk, who confesses that he corrupted the work of Baluzius, or rather glories in the exploit.[^4640] “Nay, further,” he says, “it was necessary to alter not a few things in the notes of Baluzius; and more would have been altered if *it could have been done conveniently*.” Yet the edition came forth, and passes as the genuine work of the erudite Baluzius himself." },
  { t = "note", id = "4640", text = "Burgon, *Letters from Rome*, p. 417." },
  { t = "p", text = "An edition of this treatise, with valuable annotations, appeared (a.d. 1852) from the press of Burlington, N.J., under the very creditable editorship of Professor Hyde, who was soon after called to depart this life. It exhibits the interpolations, and gives a useful catalogue of codices and of editions. Though its typographical execution is imperfect, I know not where so much condensed information on the subject is to be had at so little cost.[^4641] I am grateful for the real advantage I derived from it on its first appearance." },
  { t = "note", id = "4641", text = "Th. C. Cypriani *de Unitate Ecclesiæ* ad optimorum librorum fidem expressa, cum variis lectionibus, ad notationibus Fellii, Baluzii, etc., instructa. Curante M. F. Hyde, M.A., etc., Burlingtoniæ, MDCCCLII." },
  { t = "h", text = "III." },
  { t = "h", text = "(If ye do not forgive, etc., p. 454.)" },
  { t = "p", text = "The Jewish liturgies contained the petitions of the Lord’s Prayer essentially; but our divine Lord framed this comprehensive and sublime compend, and gave it to His children for ever, with His own seal upon it in the exceptional petition which imparts to it the impress of His own cross and passion. In the Gospel of St. Matthew[^4642] we find our Master commenting on the fifth petition in a very striking manner, as if it were the essence of the whole prayer; and, indeed, it is so, regarded as its evangelical feature, i.e., something added to the law in the spirit of the Atonement. As such, it surprised the apostles; and He who knew their thoughts instantly anticipated their inquiries: “For if ye forgive men,” etc." },
  { t = "note", id = "4642", text = "Cap. vi. 14." },
  { t = "p", text = "From the criticism of a very able editorial hand,[^4643] I feel it a privilege to insert the following valuable comments:—" },
  { t = "note", id = "4643", text = "*New York Independent*, April 25, 1878." },
  { t = "p", text = "“The petitions of the Lord’s Prayer, as is well known, are to be found for the most part in the Talmud and Jewish liturgies. In the latter we have frequently the phrases, ‘our Father, our King,’ ‘our Father, Father of mercies,’ and ‘our Father that art in heaven.’ The third petition in the *Shemone esre* is, ‘Let us hallow the Name in the world as it is hallowed in the high heaven. We will hallow Thee, and Thy praise, O God, shall not leave our mouth for ever and ever; since Thou, O God, art a great and holy King. Praised be Thou, O Lord, thou holy God. Thou art holy, and Thy name is holy, and holy men praise Thee everlastingly every day.’ The ineffable name of God represented all His attributes, and is consequently frequently substituted for Him. The end of the first petition in the Kaddish prayer runs thus: ‘May He extend His kingdom in your days, and in those of the whole house of Israel very soon.’ In Berakhoth (29 *b*) we have, ‘What is a short prayer? Rabbi Eliezer said, “Thy will be done in heaven, and peace of heart be unto those who fear Thee on earth.”’ The same tract gives another prayer: ‘The needs of Thy people Israel are many, but its discernment is small. Do Thou, O everlasting One, our God, give to each man what he needs for his support, and what his body wants; but do what seemeth Thee good.’ In the Mekhilta we read that Rabbi Eliezer of Modin, near Jerusalem, said: ‘Whosoever has enough for the day to eat, and says, What shall I eat to-morrow? is of little faith.’ This passage seems to illustrate the meaning of the Greek ἐπιούσιον. The third petition in the *Shemone esre* runs: ‘Forgive us, O our Father, for we have sinned; forgive us, O our King, for we have transgressed: since Thou art He that forgiveth and pardoneth.’ In reference to this the Midrash Shemoth (par. 31) states, ‘There is no creature who does not owe thanks to the Lord; but He is pitiful and long-suffering, and remitteth old debts.’ The daily morning prayer of the Jews contains this petition: ‘Lead us not into the power of sin, of transgression and crime, of temptation and shame. Let not passion have dominion over us, and keep us far from wicked men and evil company.’ In one of the prayers composed in Aramaic for the rabbis and leading men of the Jewish community, the passage occurs, ‘Defend and deliver them from all evil, and from all evil hap,’ which may be compared with the petition, ‘Deliver us from evil.’ The Doxology at the end of the Lord’s Prayer has equally Jewish parallels. Thus, one of the daily evening prayers concludes with the words, ‘For Thine is the kingdom;’ i.e., God alone is ruler of the world. The words ‘the power and the glory’ seem to come from 1 Chron. xxix. 11, which is quoted in the Talmud; and the Mishna Berakhoth (ix. 5) states, ‘In the temple all blessings did not end with “Amen,” but with the words “for ever and ever.”’ When the heretics multiplied, however, there was only one world; so the concluding formula became ‘from everlasting to everlasting.’”" },
  { t = "h", text = "IV." },
  { t = "h", text = "(Lift up your hearts, p. 455.)" },
  { t = "p", text = "It is demonstrated by Sir William Palmer that the *Sursum Corda* is of a date to which no history runneth contrary, and is to be found in all the primitive liturgies of whatever family. For a very early example of its use, I must refer to the Alexandrian liturgy cited by Bunsen;[^4644] and, in short, I beg to refer the reader to all the resources of the fourth volume of his *Hippolytus*. Little as I can approve of the magisterial air with which Dr. Bunsen undertakes to decide all questions, and little as I sympathize with his abnormal religion, which seems to coincide with that of no existing church or sect in the world, I feel grateful for his industry in collecting materials, and am always interested in the ingenuity with which he works them into his theories. Although he possesses some touchstone unknown to the rest of mankind, by which he reaches and utters pontifical decisions as to what is genuine and what is corrupt, I must record my doubts as to many of his facts, and my dissent from most of his inferences. But, unwilling to refer to Anglican authorities on points so much disputed, I cordially turn to the learned Chevalier, and to the treasures he has collected. See the Greek forms on p. 335 of his fourth volume, followed by the preface on p. 336, and the *Tersanctus* on p. 337: ῝Αγιος, ἅγιος, ἅγιος, κύριε Σαβαώθ, κ.τ.λ" },
  { t = "note", id = "4644", text = "*Hippolytus*, vol. iv. p. 161." },
  { t = "h", text = "V." },
  { t = "h", text = "(To pray and give thanks, p. 457.)" },
  { t = "p", text = "Here comes into view that reference of the apostle[^4645] to the usages of the primitive assemblies: “How shall he that occupieth the room of the unlearned say *Amen* at thy giving of thanks.” Though Cyprian omits the final *Amen* from his express commentary, it is to be noted that our Lord makes it virtually part of this prayer, by His precept (John xvi. 23, 24), to ask in His name. Now, He makes this word *Amen* one of His own names[^4646] in the Apocalypse; throwing back a new character upon His frequent use of it, especially in St. John’s Gospel, and giving it as a sort of appropriation of 2 Cor. i. 20, when He calls Himself “The Amen, the faithful and true Witness.” He thus makes it infinitely dear to Christians.[^4647] As in the Jewish usages,[^4648] with which the disciples were familiar, it was a matter of course, we may suppose they added *Amen* in reciting this prayer, but not with their subsequent knowledge that it implies the merits, and claims the mediation, of the Great Intercessor. Rev. v. 8; viii. 3, 4; St. John xvii. 8." },
  { t = "note", id = "4645", text = "1 Cor. xiv. 16." },
  { t = "note", id = "4646", text = "Rev. iii. 14." },
  { t = "note", id = "4647", text = "Note a striking use of it, as a name of Christ, by Commodian, vol. iv. 43, p. 211." },
  { t = "note", id = "4648", text = "Num. v. 22; Deut. xxvii. 15; 1 Kings i. 36; 1 Chron. xvi. 36; Jer. xxviii. 6; in the Psalms*passim*." },
  { t = "p", text = "Tertullian[^4649] refers to the responsive “Hallelujah” as “enriched prayer,” and the *Amen* usually accompanied this ejaculation." },
  { t = "note", id = "4649", text = "Vol. iii. cap. xxvii. p. 690, this series." },
  { t = "h", text = "VI." },
  { t = "h", text = "(Its failing estate, p. 458.)" },
  { t = "p", text = "Hippolytus[^4650] foresaw the democratic age into which the feudal era of iron should pass, corroding in the toes by contact with the miry clay of the despised *plebs*, “the seed of men.” No lasting strength was to be imparted to imperialism by the *plébiscite* (Dan. ii. 43); and the prophet might almost be supposed to have the epoch of *dynamite* in his sight, as he speaks of the unwillingness of the people to cleave to the effete system of empire. Now, then, if “the failing estate” of the world was apparent in the days of Philip and Decius, how much more in our own! Sixteen human lives span the gulf of time between us and them, for we have many centenarians among us; and with the Lord “a thousand years are as one day.” Compare 2 Pet. iii. 9. And, putting such Scriptures together, is it not clear that “the last time” (i.e., the last of the seven *times* of the Gentiles) is drawing to its close? The *three and a half* times of Daniel extend to the convulsive epoch of Mohammed; the second moiety (of the seven) to our own age. See Faber, *Sacred Calendar,*[^4651] vol. i. cap. iii. pp. 308, 309, etc." },
  { t = "note", id = "4650", text = "P. 178." },
  { t = "note", id = "4651", text = "A most instructive work, though I by no means accept his theories in full." },
  { t = "h", text = "VII." },
  { t = "h", text = "(Peter, upon whom, etc., p. 486.)" },
  { t = "p", text = "Launoi, the eminent Gallican, found but *seventeen* of the Fathers and Doctors of the Church (among whom he reckons “Fathers” down to the twelfth century) who understand St. Peter to be “the rock,” and he cites *forty* of the contrary opinion.[^4652] Yet of the “seventeen,” most of them speak only rhetorically, and with justifiable freedom. I have often done the same myself, on the principle which the same apostle applies to *all* Christians: “Ye also as lively *stones*,”[^4653] etc. But it is quite noteworthy that the Council of Trent itself momentarily adopts the prevailing patristic and therefore the Catholic interpretation, speaking of the Nicene Creed:[^4654] “In quo omnes qui fidem Christi profitentur necessario conveniunt, ac *fundamentum* firmum et *unicum*, contra quod portæ inferi nunquam prævalebunt (Matt. xvi. 18).” Thus, *the faith* of Peter is confessed the only foundation, in a direct exposition of the text so often quoted with another intent. In spite of all this, the Creed of Pius IV. was enjoined as soon as that council closed; and every member of the late Vatican Council was made to profess the same verbally before any other business was undertaken. Now, even this spurious creed forced them to swear concerning the Holy Scriptures, “I will never take and interpret them otherwise than according to the *unanimous consent* of the Fathers.” Obviously, according to this rule, there is no Catholic doctrine on the subject; much less any Catholic teaching to the effect that the modern bishops of Rome are “the rock,” as really as St. Peter himself." },
  { t = "note", id = "4652", text = "Guettée, p. 143, ed. New York." },
  { t = "note", id = "4653", text = "Compare *Peshito Syriac*, where *Cephas* is the very word applied to all believers. Ed. Trostii, 1621." },
  { t = "note", id = "4654", text = "Richter, *Canones et Decreta*, etc., p. 10, ed. Lipsiæ, 1853." },
  { t = "h", text = "VIII." },
  { t = "h", text = "(The Eucharist carried in it, p. 488.)" },
  { t = "p", text = "The modern usage of the Latin churches is for the priest to put the wafer into the communicant’s mouth, an ordinance dating no farther back than a.d. 880. A new doctrine having been forged, and faith in the *corporal* presence of Christ being forced upon the conscience, a change of ceremonial followed, which indicates the novelty of the idea. Contrast the teaching of St. Cyril of Jerusalem,[^4655] informing his catechumens how they should receive, as follows:—" },
  { t = "note", id = "4655", text = "a.d. 348." },
  { t = "p", text = "“Approaching, therefore, come not with thy wrists extended, or thy fingers open; but make thy left hand a sort of cushion for thy right, which is about to receive the King. And having hollowed thy palm, receive the Body of Christ, saying after it, *Amen*.” “*Not discerning* the Lord’s body,” etc., is the language of Scripture; but, had the apostles taught transubstantiation, this could not be said, for everybody can discern the host when it is uplifted. The Lord’s Body is therefore discerned *by faith*, and so taken and received." },
  { t = "h", text = "IX." },
  { t = "h", text = "(Which should be greatest, p. 493.)" },
  { t = "p", text = "How differently our Lord must have settled this inquiry had He given the supremacy to one of the Apostles, or had He designed the supremacy of any single pastor to be perpetual in His Church! “Who should be greatest?” ask this question of any Romanist theologian, and he answers, in the words of the Creed of Pius IV., “the Bishop of Rome, successor to St. Peter, Prince of the Apostles, and Vicar of Christ.” But why was no such answer given by our Lord? And why does St. Peter know nothing of it when he says, “The elders who are among you I exhort, who am also an elder…feed the flock of God, taking the oversight…not as being lords over God’s heritage,” etc. So also in the Council of Jerusalem, how humbly he sits under the presidency of James,[^4656] and again how cheerfully he permits the apostles to send him forth, and “give him mission” to Samaria![^4657] St. Paul, moreover, who was “not a whit behind the chiefest of the Apostles,”[^4658] overrules him, and reforms his judgment.[^4659]" },
  { t = "note", id = "4656", text = "Acts xv. 13." },
  { t = "note", id = "4657", text = "Acts viii. 14." },
  { t = "note", id = "4658", text = "See Barrow, *Works*, vol. iii. p. 95, ed. New York, 1845." },
  { t = "note", id = "4659", text = "Gal. ii. 11–14." },
  { t = "p", text = "If I have forborne in these notes to refer frequently to the Treatise of Bishop Sage, who often elucidates our author in a very learned manner, it is because he is almost wholly a controvertist, and therefore not to my purpose in this work. For his *Cyprian*,[^4660] however, I entertain a sincere respect; and, as it might seem otherwise should I omit all reference to that work, I place its title in the footnote. Profoundly do I feel what another Scottish Doctor[^4661] has beautifully said, “It is a loss, even to those that oppose errors and divisions, that they are forced to be busied that way.”" },
  { t = "note", id = "4660", text = "*The Principles of the Cyprianic Age*, etc., a.d. 1695. Reprinted, Edinburgh, 1846." },
  { t = "note", id = "4661", text = "Leighton, *On St. Peter*, i. 2, *Works*, i. p. 30, London, 1870." },
  { t = "h", text = "X." },
  { t = "h", text = "(From the slender twig, my son, thou hast ascended, p. 513.)" },
  { t = "p", text = "The text of Cyprian[^4662] is: “Catulus leonis Juda, de *frutice* fili mi ascendisti, recubans obdormisti velut leo, et velut catulus leonis.” Now, with this compare the comment of Calmet, citing the Septuagint (ἐκ βλαστοῦ = *e germine*), and rendering by metaphrase, “*e medio plantarum*, sive herbarum germinantium, ascendisti.”" },
  { t = "note", id = "4662", text = "Ed. Paris, 1574." },
  { t = "p", text = "Here, then, we have the idea precisely equivalent to Jer. xlix. 19: “Ecce *quasi leo ascendet* de superbia Jordanis.” The lion is recumbent among the sprouting twigs (*frutice*, or foliage) of the Jordan’s banks in the springtime. The swelling of the river, which the melting of snows from Lebanon causes to overflow, rouses the reposing creature; and he goes up into the mountains. But Cyprian had in hand the old African,[^4663] which seems to follow the LXX., and St. Jerome’s vulgate did not; and this word *frutice* animates Cyprian’s poetic genius. Its springtide imagery corresponding with Easter,[^4664] he *reads into it* all the New Testament fulfilment: “Thou layedst down and sleepedst as a lion, and as a lion’s whelp—*but, from the shooting of the first verdure in spring, thou hast gone up on high*—thou hast ascended.” “Quis excitabit illum” is separated from this in the Paris text, and in the Septuagint, which the Old Latin followed, and so I have pointed it, though the Edinburgh reads: “and as a lion’s whelp; who shall stir him up?”" },
  { t = "note", id = "4663", text = "Scrivener, *Introduction*, etc., p. 302, ed. 1874." },
  { t = "note", id = "4664", text = "Jordan overflows its banks at the time of the passover, Josh. iii. 15; v. 10, 11." },
  { t = "h", text = "XI." },
  { t = "h", text = "(Third Book…religious teaching of our school, p. 528.)" },
  { t = "p", text = "Quirinus, Cyprian’s “son” in the Gospel, seems to me to have been a catechumen of the *competent* class, i.e., preparing for baptism at Easter; or possibly of the higher sort, preparing for the first communion. Many tokens lead me to surmise that he may have been of Jewish birth; and, if so, he was probably baptized *Quirinus* after St. Luke ii. 2, as St. Paul borrowed his Roman name from Sergius Paulus.[^4665] The use of the word *secta*, here rendered “school,” suggests to me that the Vulgate got it (and so our English version) out of the old African Latin in Acts xxviii. 22. If Quirinus was a Hebrew, there is a playful irony in Cyprian’s use of the word in expounding the pure morality of “the *sect*” everywhere spoken against." },
  { t = "note", id = "4665", text = "Acts xiii. 7–9." },
  { t = "p", text = "Origen’s treatise *Against Celsus* shows how cunningly the adversaries of the Gospel could assume a Jewish position against it;[^4666] and the first two books of that work are designed to establish a perfect harmony between the Old Testament and the New, proving Christ to be the substance and sum of both. Cyprian may have foreseen the perils menacing the Church from the school of Plotinus, already rising, and which soon sent forth the venomous Porphyry. He was but a presbyter when he wrote this excellent defence of the faith; and his earnest pastoral care for his pupil is shown by his addition of a third book, entirely practical. The catechetical system of St. Luke’s day[^4667] had become a developed feature of the Church (St. Cyril’s lectures in the succeeding century show how it was further expanded), and it also illustrates the purity of her moral teaching. Our author harmonizes faith and works, and presents her simple scriptural precepts in marked contrast with the putrid casuistry[^4668] which Pascal exposes, and which grew up in the West with the enforcement of auricular confession by Innocent III., a.d. 1215. The theory of transubstantiation was also made a dogma at the same time, and operated, with the other, to the total extinguishment of the primitive discipline and worship. The withholding of the chalice in the Holy Communion followed, a.d. 1415." },
  { t = "note", id = "4666", text = "Vol. iv. p. 462." },
  { t = "note", id = "4667", text = "Luke i. 4. Greek." },
  { t = "note", id = "4668", text = "See that very useful little publication of the S. P. C. K., Dr. Littledale’s *Plain Reasons against Joining the Church of Rome*, pp. 18 and 205." },
  { t = "h", text = "XII." },
  { t = "h", text = "(Good works and mercy, p. 528.)" },
  { t = "p", text = "Clement was able to remind the heathen, half a century before,[^4669] that Christ had “*already* made the universe an ocean of blessings.” Here we have the moral canons of Christianity reflecting the Light of the World, and they show us how practically it operated. As I have noted, the first Christian hospital was founded (a.d. 350) by Ephraem Syrus. His example was followed by St. Basil, who also founded another for lepers. The founding of hostels as refuges for travellers was an institution of the Nicene period. “In the time of Chrysostom,” says one not too well disposed towards the Gospel,[^4670] “the church of Antioch supported three thousand widows and virgins, besides strangers and sick. Legacies for the poor became common; and it was not infrequent for men and women who desired to live a life of especial sanctity, and especially for priests who attained the episcopacy, as a first act, to bestow their properties in charity. A Christian, it was maintained, should devote at least one-tenth of his profits to the poor. A priest named Thalasius collected blind beggars in an asylum on the banks of the Euphrates. A merchant named Apollinus founded on Mount Nitria a gratuitous dispensary.”" },
  { t = "note", id = "4669", text = "See vol. ii. p. 202, note 5." },
  { t = "note", id = "4670", text = "Lecky, *History of European Morals*, vol. ii. p. 86, ed. New York, 1872. See vol. ii. p. 202, note 5." },
  { t = "p", text = "So here our author’s canons enforce (1) works of mercy; (2) almsdeeds; (3) brotherly love; (4) mutual support; (5) forgiveness of injuries; (6) the example of Christ’s holy living; (7) forbearance; (8) suppression of idle talk; (9) love of enemies; (10) abhorrence of usury, (11) and avarice, (12) and carnal impurity: also, (13) obedience to parents; (14) parental love; (15) consideration of servants; (16) respect for the aged; (17) moderation, even in use of things lawful; (18) control of the tongue; (19) abstinence from detraction; (20) to visit the sick; (21) care of widows and orphans; (22) not to flatter; (23) to practise the Golden Rule; and (24) to abstain from bloodshed. In short, we have here the outgrowth of the Sermon on the Mount, and of St. Paul’s epitome, “Whatsoever things are true,” etc.[^4671]" },
  { t = "note", id = "4671", text = "Phil. iv. 8." },
  { t = "h", text = "XIII." },
  { t = "h", text = "(In the thirteenth Psalm, p. 546.)" },
  { t = "p", text = "The note says that the Oxford edition gives it as the *fourteenth*, while in our English Bibles it is the *fifteenth*. As I find that some of the readers of these works are puzzled by such confusions, I note *retrospectively*, as well as for future reference, the origin of such apparent blunders." },
  { t = "p", text = "1. Our English version follows the Hebrew numbering, which is reputed the most accurate. By that a psalm is cited in the New Testament as if the numbering itself were important, and the product of inspired wisdom.[^4672]" },
  { t = "note", id = "4672", text = "Acts xiii. 33." },
  { t = "p", text = "2. But the Greek Psalter differs from the Hebrew; Psalms ix. and Psalms x. being made into one, as confessedly their material suggests. The Seventy joined also Psalms cxiv. and Psalms cxv. But they divided Psalms cxvi., and also Psalms cxlvii." },
  { t = "p", text = "3. The Vulgate Latin follows the LXX.; and our Ante-Nicene Fathers usually quote the Septuagint, or else the Old Latin, by which the Vulgate was probably governed. In the Vulgate, also, the Hebrew prefaces are often numbered as if they were verses, which is another source of confusion." },
  { t = "p", text = "4. By the fusion of Psalms ix. and Psalms x., our Psalms xv. becomes the Psalms xiv., and so the Vulgate gives it; and the Oxford translators follow that." },
  { t = "p", text = "5. But our text says “Psalms xiii.,” and for this it is not easy to account. The Oxford editors regard it as a mere corruption of the text, and change it accordingly." },
]

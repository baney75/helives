[[section]]
id = "introductory-notice"
title = "Introductory Notice"
level = 1
blocks = [
  { t = "h", text = "to" },
  { t = "h", text = "the Early Liturgies." },
  { t = "p", text = "It is in curious contrast with the work of Brett and others like-minded that we have in these Edinburgh translations a reflection from the minds of divines who are unused to liturgies, and who have no interest in their elucidation. For the mere reader this is not an advantage; but the student who goes to the originals will find that it affords at times no inconsiderable help. These translations are “inartificially drawn,” as the lawyers say. They are so much Greek and Latin rendered grammatically by competent scholars, who have no theories to sustain, and who are equally devoid of technique and of a disposition to exhibit it for the support of preconceptions. Not infrequently one gets a new view of certain stereotyped expressions from the way in which they are here handled. The liturgiologist finds his researches freshened by etymologies he had hardly thought of, here literally rendered. Of course, these are mere specimens, and no one can use them for argument, except by comparison with the Greek, or the Latin of Renaudot, or the originals in Syriac or Coptic; but they will prove very useful in many ways. The whole science is in its infancy; and we have no specimen of a primitive liturgy unless it be the Clementine, so called. The specimens here given are like cloth of gold (Ps. xlv. 13), moth-eaten and patched, and spangled over with tinsel; and the true artist has only the one object in view,—to restore it, that is, to the king’s daughter, as it was aforetime." },
  { t = "p", text = "The following is the announcement of the Messrs. Clark in the Edinburgh edition: “The Liturgy of St. James has been translated by William Macdonald, M.A.; that of the Evangelist Mark by George Ross Merry, B.A.; and that of the Holy Apostles by Dr. Donaldson.”" },
  { t = "p", text = "It will be observed that the translations are given in the Edinburgh series with hardly a line of comment, and with no editorial helps to the reader whatever. These have been scantily supplied, here and there, where the case seemed to require some elucidation; and in a few instances I have ventured to reduce a word or two in the rendering to liturgical phraseology." },
  { t = "p", text = "The interest which has recently been awakened in liturgiology, and which exists among the learned so generally, will justify me in stating somewhat at large the considerations which are prerequisites to an intelligent study of these compilations. I shall not depart from my rule, nor formulate my personal convictions; but I must indicate sources of information not mentioned by the Edinburgh editors, only remarking, that, while they have cited the learned and excellent Dr. Neale, with others who advance untenable claims in some instances, I shall refer to writers of a more moderate school, such as have taken a less narrow and more historic view of the whole matter. By claiming too much, and by reading their own ideas back into the ancient exemplars, many good and learned men have overdone their argument, and confused scriptural simplicity with the artificial systems of post-Nicene ages. Earnest and worthy of respect as they are, I must therefore prefer a class of writers who breathe the spirit of the ante-Nicene Fathers as better elucidating the primitive epoch and its principles, alike in doctrine and worship." },
  { t = "p", text = "Hippolytus, in a few terse sentences, has pointed out the epoch of David, in its vast import, as the dawning of Christianity itself.[^4021] More elaborately, a recent writer of great erudition has expounded the same historic fact, and given us the pivot of Hebrew history on which turns the whole system of that “goodly fellowship of prophets” who heralded the Sun of righteousness as successive constellations rise before the day. The learned Dean Payne-Smith, more minutely than Hippolytus, identifies Samuel, the master of David, as the great instrument of God in shaping the institutions of Moses to be a prelude to the Advent; in other words, transforming a local and tribal religion into that of Catholicity. The value of the Dean’s condensed and luminous elaboration of this cardinal truth can hardly be overstated." },
  { t = "note", id = "4021", text = "Vol. v. note 2, p. 170." },
  { t = "p", text = "But, to go behind even the Dean’s stand-point, we shall better comprehend the era of which, under God, Samuel was the author, by noting the immense importance of that specific Mosaic ordinance which not only made it possible, but which proves that an all-wise prolepsis governed the whole law of Moses. We generally conceive of the Mosaic system as one of unlimited hecatombs and burnt-offerings. On the contrary, it was a system restricting and limiting the unsystematized primeval institution of sacrifice, which had done its work by passing into the universal religions and rituals of Gentilism.[^4022] When the seminal idea of expiation, atonement, and the blood of innocence as a propitiation for guilt, was communicated to all the families of the earth, the Mosaic institutions limited sacrifices for the faithful, and localized them with marvellous significance. Previously the faithful everywhere had imitated the sacrifices of their fathers, Noah and Abraham, who reared their altars everywhere, as Job also did,—wherever they dwelt or sojourned. Now mark the first step towards a more spiritual worship, based, nevertheless, on the fundamental principle of sacrifice. Moses ordains as follows:—" },
  { t = "note", id = "4022", text = "Vol. vi. p. 542, Elucidation VI." },
  { t = "p", text = "1. “When ye go over Jordan, and dwell in the land which the Lord your God giveth you,…then there shall be a place which the Lord your God shall choose to cause His name to dwell there; thither shall ye bring all that I command you, your burnt-offerings,” etc.[^4023]" },
  { t = "note", id = "4023", text = "Deut. xii. 6." },
  { t = "p", text = "2. “Take heed to thyself that thou offer not thy burnt-offerings in every place that thou seest; but in the place which the Lord shall choose in one of the tribes, there thou shalt offer thy burnt-offerings, and there thou shalt do all that I command thee.”[^4024]" },
  { t = "note", id = "4024", text = "Deut. xii. 24." },
  { t = "p", text = "3. “If the place which the Lord thy God hath chosen to put His name there, be too far from thee” [i.e., for frequent sacrifices; observe, nevertheless, the law as to the sanctity of blood in thy common use of meats, and forbear to sacrifice, till the opportunity comes], “only thy holy things which thou hast, and thy vows, thou shalt take, and go unto the place which the Lord shall choose; and thou shalt offer thy burnt-offerings, the flesh and the blood, upon the altar of the Lord thy God.”[^4025]" },
  { t = "note", id = "4025", text = "Deut. xii. 21, xiv. 24." },
  { t = "p", text = "4. “Three times in a year shall all thy males appear before the Lord thy God, in the place which He shall choose.”[^4026]" },
  { t = "note", id = "4026", text = "Exod. xxiii. 17; Deut. xvi. 16." },
  { t = "p", text = "5. “Thou mayest not sacrifice The Passover within any of thy gates;…but at the place which the Lord thy God shall choose to place His name in, there thou shalt sacrifice the Passover.”" },
  { t = "p", text = "Note, further, that all this provision and prevision was part of the great Messianic system, which reached its crisis in the time of David, as prophetic of “the Son of David.”" },
  { t = "p", text = "It was the office of Samuel to take the Mosaic ordinances just there, and to shape them for the advent of the Lamb of God, for His sacrifice upon Calvary, and for the setting-up of His universal kingdom." },
  { t = "p", text = "The Institutions of Samuel, therefore, were in essence institutions for the Gospel-day, and they were completed by the anointing of David as king, and by his prophetic mission to provide the Psalter (of which more, by and by); then the Ark came out of curtains, and the Lord chose and appointed the place of which Moses had spoken,—none other than the spot where Abraham had rehearsed in type the Sacrifice and Resurrection of Christ, according as it was written:[^4027] “Jehovah-Jireh…in the mount of the Lord it shall be seen.” Thus, all sacrifice acceptable to God was shown to have reference to the Paschal Lamb, who on that mount of the Lord should be sacrificed, and rise again, as was accomplished in a figure aforetime.[^4028]" },
  { t = "note", id = "4027", text = "Gen. xxii. 14." },
  { t = "note", id = "4028", text = "Heb. xi. 19." },
  { t = "p", text = "And next, the Psalmist commemorates the putting away of the migratory Tabernacle, and the rest of the Ark of the Covenant in the place designed for the grand accomplishment of redemption (“the sure mercies of David”), as follows:[^4029]—" },
  { t = "note", id = "4029", text = "Ps. lxxviii. 67–69." },
  { t = "p", text = "“He refused the tabernacle of Joseph, and chose not the tribe of Ephraim: but chose the tribe of Judah, the Mount Zion which He loved. And He built His sanctuary like high palaces, like the earth which He hath established for ever.”" },
  { t = "p", text = "Thus, localized sacrifice was made to designate the spot where the one propitiatory sacrifice should be offered, “for the sins of the whole world;” and that spot in turn interpreted the great canon of redemption,[^4030]—" },
  { t = "note", id = "4030", text = "Heb. ix. 22." },
  { t = "q", text = "“Without shedding of blood is no remission:”" },
  { t = "p", text = "and all this, being accomplished in the Messiah, passed away for ever. The veil of the Temple was rent when Jesus cried, “It is finished.”" },
  { t = "p", text = "And now let us note the “Institutions of Samuel.” The localizing of the Temple-worship made way for the clearer revelation of spiritual sacrifices: the Temple itself was to be supplied with an expository liturgy. Moreover, a liturgical system, revolving about the central worship of the Temple, was to be brought to every man’s door by the establishment of the synagogue for the villages of Israel.[^4031] The synagogue-worship became, therefore, the education and preparation of the faithful for the simple and spiritual worship of the new law. This our Lord Himself expounded in the grand Catholicity of His words to the outcast Samaritans:—" },
  { t = "note", id = "4031", text = "Ps. lxxxiii. 12, lxxiv. 6." },
  { t = "q", text = "“The hour cometh, when ye shall neither in this mountain, nor yet at Jerusalem, worship the Father.…But the hour cometh, and now is, when the true worshippers shall worship the Father in spirit and in truth,”[^4032] etc." },
  { t = "note", id = "4032", text = "John iv. 21–23." },
  { t = "p", text = "We have seen that the hour promised by Malachi was supposed by the Ante-Nicene Fathers to be here intended: “My name shall be great among the Gentiles; and in every place incense shall be offered unto My name, and a pure offering.”[^4033]" },
  { t = "note", id = "4033", text = "Mal. i. 11." },
  { t = "p", text = "The student of this series must have observed that the primitive writers were universally impressed with these principles,[^4034] and they are essential to the study of the liturgies here introduced into the series by the Edinburgh editors. For other purposes, expounding the prophetic system, on a text of St. Peter, Dean Payne-Smith has incidentally elucidated these ideas so fully, and with such originality, that I leave the student to consult his pages,[^4035] with only the following important hints to those who may fail to see them:—" },
  { t = "note", id = "4034", text = "This series passim; but, e.g., vol. i. pp. 138, 482, and v. p. 290, note 8." },
  { t = "note", id = "4035", text = "As above mentioned in his work on Prophecy. See p. 530." },
  { t = "p", text = "1. We find the prophet Samuel instituting “Schools of the Prophets,” out of which grew the synagogue system supplying the Rabbinical education to Israel, and furnishing chiefs to the synagogues. See Acts iii. 24; and compare 1 Sam. x. 5, xix. 20, and 1 Chron. ix. 22.[^4036]" },
  { t = "note", id = "4036", text = "See also Cruden on the word “school” in his Concordance" },
  { t = "p", text = "2. We find the institution of choral worship and the chanting of hymns—e.g., of Moses and Miriam, and Hannah (Samuel’s mother)—in full operation under Samuel." },
  { t = "p", text = "3. We find David at this juncture inspired, as “the sweet singer of Israel,” to supply the Psalter, which in divers arrangements has continued among Christians to be the marrow of public worship “in every place,” and throughout the world." },
  { t = "p", text = "4. The reading of the law and the prophets was now set in order; and not only was the Temple supplied with teachers, but also the villages in every tribe.[^4037]" },
  { t = "note", id = "4037", text = "Dean Smith, Prophecy, etc., p. 124." },
  { t = "p", text = "5. Thus the Christian Church was provided with a system of worship from the hour of its institution,[^4038] the synaxis succeeding the synagogue; the “ministration of the word” being enriched by Gospels and Epistles, by psalms and hymns and spiritual songs, and by “the prayers” (based upon the Shemone esre)[^4039] which now began to be composed and multiplied in the churches. Touching “free prayer” as exemplified in the first ages, see St. Cyprian’s Epistles more especially:[^4040] “Let us pray for the lapsed,” etc." },
  { t = "note", id = "4038", text = "Acts i. 4 (Greek), 14, ii. 1, 42, iv. 24." },
  { t = "note", id = "4039", text = "Vol. v. Elucidation III. p. 559." },
  { t = "note", id = "4040", text = "Ibid., Elucidation VI. p. 412." },
  { t = "p", text = "6. It is most significant, that, as St. Paul was not present at the institution of the Lord’s Supper, he was, nevertheless, “not behind the chiefest of the Apostles,” even in this. He also “received” the whole knowledge of the institution, and became, in so far, the author of an original Gospel in his details of Christ’s great oblation of Himself. Hereupon, he adds the sacrificial expositions[^4041] of the Epistle to the Hebrews, and “delivered the ordinances” to every church[^4042] (κατὰ τάξιν), providing for order and decorum in divine offices." },
  { t = "note", id = "4041", text = "See Field, Epistle to the Hebrews, London, Rivingtons, 1882." },
  { t = "note", id = "4042", text = "1 Cor. vii. 17, xi. 2, 25, 33, etc., xiv. 34–40." },
  { t = "p", text = "This he seems to have done as “Liturge” and “Hierurge,” or evangelical priest,[^4043] “ministering in sacrifice[^4044] the Gospel of God,” etc." },
  { t = "note", id = "4043", text = "See vol. v. p. 409." },
  { t = "note", id = "4044", text = "Revised Version of 1881." },
  { t = "p", text = "Compare, then, with the Scriptures, Justin Martyr’s account of the early worship of Christians; and after consulting the (so-called) “Clementine Liturgy,”[^4045] the student will be qualified to form an enlightened judgment upon the primitive and the interpolated elements of the following liturgies. For we must bear in mind that they are reflected from mss., not one of which has any claim to represent the Ante-Nicene period. To purify them, therefore, by Scripture, and the truly primitive testimonies of this series, is a task yet remaining to be accomplished, and one which may well invoke the most conscientious and patient labours of the most learned in the land." },
  { t = "note", id = "4045", text = "See Apostolic Constitutions, p. 489, supra." },
  { t = "p", text = "Here follows the Edinburgh Introductory Notice:—" },
  { t = "p", text = "The word Liturgy has a special meaning as applied to the following documents. It denotes the service used in the celebration of the Eucharist." },
  { t = "p", text = "Various liturgies have come down to us from antiquity; and their age, authorship, and genuineness have been matter of keen discussion. In our own country two writers on this subject stand specially prominent: the Rev. William Palmer, M.A., who in his Origines Liturgicæ[^4046] gave a dissertation on Primitive Liturgies; and the Rev. J. Mason Neale, who devoted a large portion of his life to liturgies, edited four of them in his Tetralogia Liturgica,[^4047] five of them in his Liturgies of St. Mark, St. James, St. Clement, St. Chrysostom, and St. Basil,[^4048] and discussed them in a masterly manner in several works, but especially in his General Introduction to a History of the Holy Eastern Church[^4049]" },
  { t = "note", id = "4046", text = "Oxford, 1832." },
  { t = "note", id = "4047", text = "London, 1849." },
  { t = "note", id = "4048", text = "Second ed. London, 1868." },
  { t = "note", id = "4049", text = "London, 1850." },
  { t = "p", text = "Ancient liturgies are generally divided into four families,—the Liturgy of the Jerusalem Church,[^4050] adopted throughout the East; the Alexandrian,[^4051] used in Egypt and the neighbouring countries; and the Roman and Gallican Liturgies. To these Neale has added a fifth, the Liturgy of Persia or Edessa." },
  { t = "note", id = "4050", text = "[Or of St. James, so called.]" },
  { t = "note", id = "4051", text = "[Called the Liturgy of St. Mark.]" },
  { t = "p", text = "There is also a liturgy not included in any of these families—the Clementine. It seems never to have been used in any public service. It forms part of the eighth book of the Apostolical Constitutions.[^4052]" },
  { t = "note", id = "4052", text = "[It is most valuable, and indicates the usages of a period near the age of Justin Martyr. It is typical of an original from which the Liturgy of St. James itself is derived. It was probably used in Gaul, if not also in Rome.]" },
  { t = "p", text = "The age ascribed to these documents depends very much on the temperament and inclination of the inquirer. Those who have great reverence for them think that they must have had an apostolic origin, that they contain the apostolic form, first handed down by tradition, and then committed to writing, but they allow that there is a certain amount of interpolation and addition of a date later than the Nicene Council. Such words as “consubstantial” and “mother of God” bear indisputable witness to this. Others think that there is no real historical proof of their early existence at all,—that they all belong to a late date, and bear evident marks of having been written long after the age of the apostles.[^4053]" },
  { t = "note", id = "4053", text = "[A fair view of their origin is to be found in Sir William Palmer’s Origines Liturgicæ, Oxford, 1832.]" },
  { t = "p", text = "There can scarcely be a doubt that they were not committed to writing till a comparatively late day. Those who think that their origin was apostolic allow this. “The period,” says Palmer,[^4054] “when liturgies were first committed to writing is uncertain, and has been the subject of some controversy. Le Brun contends that no liturgy was written till the fifth century; but his arguments seem quite insufficient to prove this, and he is accordingly opposed by Muratori and other eminent ritualists. It seems certain, on the other hand, that the liturgy of the Apostolical Constitutions was written at the end of the third or beginning of the fourth century; and there is no reason to deny that others may have been written about the same time, or not long after.”" },
  { t = "note", id = "4054", text = "Origines Liturgicæ, p. 11." },
  { t = "p", text = "Neale[^4055] sums up the results of his study in the following words: “I shall content myself therefore with assuming, (1) that these liturgies, though not composed by the Apostles whose names they bear, were the legitimate development of their unwritten tradition respecting the Christian Sacrifice; the words, probably, in the most important parts, the general tenor in all portions, descending unchanged from the apostolic authors. (2) That the Liturgy of St. James is of earlier date, as to its main fabric, than a.d. 200; that the Clementine Office is at least not later than 260; that the Liturgy of St. Mark is nearly coeval with that of St. James; while those of St. Basil and St. Chrysostom are to be referred respectively to the saints by whom they purport to be composed. In all these cases, several manifest insertions and additions do not alter the truth of the general statement.”" },
  { t = "note", id = "4055", text = "General Introduction to the History of the Holy Eastern Church, p. 319." },
  { t = "p", text = "1. The Roman Liturgy. The first writer who is supposed to allude to a Roman Liturgy is Innocentius, in the beginning of the fifth century; but it may well be doubted whether his words refer to any liturgy now extant.[^4056] Some have attributed the authorship of the Roman Liturgy to Leo the Great, who was made bishop of Rome in a.d. 451; some to Gelasius, who was made bishop of Rome in a.d. 492; and some to Gregory the First, who was made bishop of Rome in a.d. 590. Such being the opinions of those who have given most study to the subject, we have not deemed it necessary to translate it, though Probst, in his Liturgie der drei ersten christlichen Jahrhunderte,[^4057] probably out of affection for his own Church, has given it a place beside the Clementine and those of St. James and St. Mark." },
  { t = "note", id = "4056", text = "[If Justin Martyr describes the liturgy used in Rome, when he lived there under the Antonines, then it was nearly identical with the “Clementine,” and had reached them from the East. See vol. i. p. 185, this series.]" },
  { t = "note", id = "4057", text = "Tübingen, 1870." },
  { t = "p", text = "2. The Gallican has still less claim to antiquity. In fact, Daniel marks it among the spurious.[^4058] Mabillon tries to prove that three ecclesiastics had a share in the authorship of this liturgy: Musæus, presbyter of Marseilles, who died after the middle of the fifth century; Sidonius, bishop of Auvergne, who died a.d. 494; and Hilary, bishop of Poictiers, who died a.d. 366.[^4059] Palmer strives to show with great ingenuity that it is not improbable that the Gallican Liturgy may have been originally derived from St. John; but his arguments are merely conjectures." },
  { t = "note", id = "4058", text = "νόθοι. Codex Liturgicus, vol. iv. p. 35, note." },
  { t = "note", id = "4059", text = "Palmer, vol. i. p. 144." },
  { t = "p", text = "3. The Liturgy of St. James, the Liturgy of the Church of Jerusalem. Asseman, Zaccaria, Dr. Brett, Palmer, Trollope, and Neale, think that the main structure of this liturgy is the work of St. James, while they admit that it contains some evident interpolations. Leo Allatius, Bona, Bellarmine, Baronius, and some others, think that the whole is the genuine production of the apostle. Cave, Fabricius, Dupin, Le Nourry, Basnage, Tillemont, and many others, think that it is entirely destitute of any claim to an apostolic origin, and that it belongs to a much later age.[^4060]" },
  { t = "note", id = "4060", text = "[Here the weight of authorities is clearly on this side.]" },
  { t = "p", text = "“From the Liturgy of St. James,” says Neale, “are derived, on the one hand, the forty Syro-Jacobite offices: on the other, the Cæsarean office, or Liturgy of St. Basil, with its offshoots; that of St. Chrysostom, and the Armeno-Gregorian.”[^4061]" },
  { t = "note", id = "4061", text = "General Introd., p. 317." },
  { t = "p", text = "There are only two manuscripts of the Greek Liturgy of St. James,—one of the tenth, the other of the twelfth century,—with fragments of a third.[^4062] The first edition appeared at Rome in 1526. In more recent times it has been edited by Rev. W. Trollope, M.A.,[^4063] Neale in the two works mentioned above, and Daniel in his Codex Liturgicus Bishop Rattray edited the Anaphora,[^4064] and attempted to separate the original from the interpolations, “though,” says Neale, “the supposed restoration is unsatisfactory enough.” Bunsen, in his Analecta Ante-Nicæna,[^4065] has tried to restore the Anaphora to the state in which it may have been in the fourth century, “as far as was possible—*quantum fieri potuit* ”" },
  { t = "note", id = "4062", text = "[Palmer gives proof of its currency at an early period in some details. O. S., vol. i. p. 42.]" },
  { t = "note", id = "4063", text = "Edinburgh, T. & T. Clark, 1848." },
  { t = "note", id = "4064", text = "London, 1744." },
  { t = "note", id = "4065", text = "Vol. iii. [Grabe also attempted this.]" },
  { t = "p", text = "4. The Liturgy of St. Mark, the liturgy of the church of Alexandria. The same difference of opinion exists in regard to the age and genuineness of this liturgy as we found existing in regard to that of St. James, and the same scholars occupy the same relative position." },
  { t = "p", text = "The offshoots from St. Mark’s Liturgy are St. Basil, St. Cyril, and St. Gregory, and the Ethiopic Canon or Liturgy of All Apostles. In regard to the Liturgy of St. Cyril, Neale says that it is “to all intents and purposes the same as that of St. Mark; and it seems highly probable that the Liturgy of St. Mark came, as we have it now, from the hands of St. Cyril, or, to use the expression of Abu’lberkat, that Cyril ‘perfected’ it.”[^4066]" },
  { t = "note", id = "4066", text = "General Introd., p. 324. [From the poverty of ms. authority, we can only form a judgment by comparison with the Clementine and with other more fully represented originals.]" },
  { t = "p", text = "There is only one manuscript of the Liturgy of St. Mark, probably belonging to the twelfth century. The first edition appeared at Paris in 1583. The liturgy is given in Renaudot’s Liturgiarum Orientalium Collectio, tom. i. pp. 120–148,[^4067] in Neale’s two works, and in Daniel’s Codex Liturgicus" },
  { t = "note", id = "4067", text = "Editio secunda correctior. Francofurti ad Moenum, 1847." },
  { t = "p", text = "5. The Liturgy of the Apostles Adæus and Maris. This liturgy has been brought prominently forward by Neale, who says: “It is generally passed over as of very inferior importance, and Renaudot alone seems to have been prepared to acknowledge in some degree its great antiquity.”[^4068] He thinks that it is “one of the earliest, and perhaps the very earliest, of the many formularies of the Christian Sacrifice.”[^4069] It is one of the three Nestorian liturgies, the other two being that of Nestorius and that of Theodore the interpreter." },
  { t = "note", id = "4068", text = "General Introd., p. 319." },
  { t = "note", id = "4069", text = "Ibid., p. 323." },
  { t = "p", text = "A Latin translation of it is given in Renaudot’s Collectio,[^4070] which is reprinted in Daniel’s Codex Liturgicus It is from this version that our translation is made. Several prayers and hymns are indicated only by the initial words, and the rubrical directions are probably of a much later date than the text." },
  { t = "note", id = "4070", text = "Tom. ii. pp. 578–592, ed. sec." },
  { t = "p", text = "The Liturgies are divided into two parts,—the part before “Lift we up our hearts,” and the part after this. The first is termed the Proanaphoral Part, the second the Anaphora." },
  { t = "p", text = "Trollope describes what he conceives to be the form of worship in the early Church, thus:[^4071] “The service of this day divided itself into two parts; at the latter of which, called in the Eastern churches *Liturgia mystica*, and in the Western *Missa* *fidelium*, none but perfect and approved Christians were allowed to be present. To the *Missa Catechumenorum*, or that part of the service which preceded the prayers peculiar to communicants only, not only believers, but Gentiles, were admitted, in the hope that some might possibly become converts to the faith. After the Psalms and Lessons with which the service commenced, as on ordinary occasions, a section from the Acts of the Apostles or the Epistles was read; after which the deacon or presbyter read the Gospel. Then followed an exhortation from one or more of the presbyters; and the bishop or president delivered a Homily or Sermon, explanatory, it should seem, of the Scripture which had been read, and exciting the people to an imitation of the virtues therein exemplified. When the preacher had concluded his discourse with a doxology in praise of the Holy Trinity, a deacon made proclamation for all infidels and non-communicants to withdraw; then came the dismissal of the several classes of catechumens, energumens, competents, and penitents, after the prayers for each respectively, as on ordinary days; and the *Missa fidelium* commenced. This office consisted of two parts, essentially distinct: viz., of prayers for the faithful, and for mankind in general, introductory to the Oblation; and the Anaphora or Oblation itself. The introductory part varied considerably in the formularies of different churches; but in the Anaphora all the existing liturgies so closely agree, in substance at least, if not in words, that they can only be reasonably referred to the same common origin.[^4072] Their arrangement, indeed, is not always the same; but the following essential points belong, without exception, to them all:—1. The Kiss of Peace; 2. The form beginning, Lift up your hearts; 3. The Hymn, Therefore with angels, etc.; 4. Commemoration of the words of Institution; 5. The Oblation; 6. Prayer of Consecration; 7. Prayers for the Church on Earth; 8. Prayers for the Dead; 9. The Lord’s Prayer; 10. Breaking of the Bread; 11. Communion.”" },
  { t = "note", id = "4071", text = "Introduction, p. 11." },
  { t = "note", id = "4072", text = "[Hence the value of these liturgies is to be sought in the points of their agreement and their comparative concord with the Clementine.]" },
  { t = "p", text = "Neale gives a more minute account of the different parts of the service. He divides the Proanaphoral portion into parts in the following manner:[^4073]—" },
  { t = "note", id = "4073", text = "General Introduction, p. 359." },
  { t = "p", text = "“Liturgy (or Missa) of the Catechumens. | I. | The Preparatory Prayers." },
  { t = "p", text = "II. | The Initial Hymn or Introit." },
  { t = "p", text = "III. | The Little Entrance." },
  { t = "p", text = "IV. | The Trisagion." },
  { t = "p", text = "V. | The Lections." },
  { t = "p", text = "VI. | The Prayers after the Gospel, and expulsion of the Catechumen." },
  { t = "p", text = "“Liturgy (or Missa) of the Faithful. | I. | The Prayers for the Faithful." },
  { t = "p", text = "II. | The Great Entrance." },
  { t = "p", text = "III. | The Offertory." },
  { t = "p", text = "IV. | The Kiss of Peace." },
  { t = "p", text = "V. | The Creed.”" },
  { t = "p", text = "The Anaphora he divides into four parts in the following manner:[^4074]—" },
  { t = "note", id = "4074", text = "Ibid., p. 463." },
  { t = "p", text = "“The great Eucharistic Prayer. | I. | The Preface." },
  { t = "p", text = "II. | The Prayer of the Triumphal Hymn." },
  { t = "p", text = "III. | The Triumphal Hymn." },
  { t = "p", text = "IV. | Commemoration of Our Lord’s Life." },
  { t = "p", text = "V. | Commemoration of Institution." },
  { t = "p", text = "“The Consecration. | VI. | Words of Institution of the Bread." },
  { t = "p", text = "VII. | Words of Institution of the Wine." },
  { t = "p", text = "VIII. | Oblation of the Body and Blood." },
  { t = "p", text = "IX. | Introductory Prayer for the Descent of the Holy Ghost." },
  { t = "p", text = "X. | Prayer for the Sanctification of Elements." },
  { t = "p", text = "“The great Intercessory Prayer. | XI. | General Intercession for Quick and Dead." },
  { t = "p", text = "XII. | Prayer before the Lord’s Prayer." },
  { t = "p", text = "XIII. | The Lord’s Prayer." },
  { t = "p", text = "XIV. | The Embolismus." },
  { t = "p", text = "“The Communion. | XV. | The Prayer of Inclination." },
  { t = "p", text = "XVI. | The Holy Things for Holy Persons." },
  { t = "p", text = "XVII. | The Fraction." },
  { t = "p", text = "XVII. | The Confession." },
  { t = "p", text = "XIX. | The Communion." },
  { t = "p", text = "XX. | The Antidoron: and Prayers of Thanksgiving.”" },
  { t = "p", text = "The whole subject is discussed by Mr. Neale with extraordinary minuteness, fulness of detail, and perfect mastery of his subject; and to his work we refer those who wish to prosecute the study of the subject.[^4075]" },
  { t = "note", id = "4075", text = "[A very fair reviewal of Neale’s theoretical statements may be found in Hammond’s Liturgies, Eastern and Western, Oxford, 1878.]" },
  { t = "h", text = "General Note by the American Editor." },
  { t = "p", text = "I Have found a few less noted works most useful in my own studies, which began with Palmer’s Origines on their first publication, followed up by Brett, and then by Renaudot. The publications of Drs. Neale and Littledale are sufficiently referred to elsewhere; and I purposely omit the mention of many purely Anglican authorities, as well as costly works from other European sources." },
  { t = "p", text = "1. Freeman’s Principles of Divine Service, etc.[^4076] A work of incomparable utility to those who would comprehend the Jewish ritual and its preparations for Christian worship." },
  { t = "note", id = "4076", text = "Oxford, Parker, 1855." },
  { t = "p", text = "2. Badger’s Nestorians and their Rituals[^4077]" },
  { t = "note", id = "4077", text = "London, Masters, 1852." },
  { t = "p", text = "3. Warren’s Liturgy and Ritual of the Celtic Church;[^4078] replete with information hitherto inaccessible." },
  { t = "note", id = "4078", text = "Oxford, University Press, 1881." },
  { t = "p", text = "4. Scudamore’s Notitia Eucharistica;[^4079] Anglican, but full of general information." },
  { t = "note", id = "4079", text = "London, Rivingtons, 1872." },
  { t = "p", text = "5. Trevor’s Catholic Doctrine of Sacrifice, etc.;[^4080] a candid and learned study of this subject, and free from fanatical or visionary conceptions." },
  { t = "note", id = "4080", text = "Oxford, Parker, 1876." },
  { t = "p", text = "6. Hammond’s Liturgies, etc.,[^4081] elsewhere spoken of." },
  { t = "note", id = "4081", text = "Oxford, University Press, 1878. Also Ancient Liturgy of Antioch, Oxford, 1879." },
  { t = "p", text = "7. Burbidge, Liturgies and Offices,[^4082] of which I have only lately discovered the value." },
  { t = "note", id = "4082", text = "London, Bells, 1885." },
  { t = "p", text = "8. Field’s Apostolic Liturgy and the Ep. to the Hebrews;[^4083] open to some objections, but full of valuable and suggestive information." },
  { t = "note", id = "4083", text = "London, Rivingtons, 1882." },
  { t = "p", text = "9. Pfaffius, Christ. Math. His invaluable Dissertatio de Oblatione, etc.[^4084] A high Lutheran authority of great learning." },
  { t = "note", id = "4084", text = "The Hague, Scheurler, 1715. Let me give the title of this rare book more fully, thus: S. Irenæi Fragmenta Anecdota, etc., quæ illustravit, denique Liturgia Græca Jo. Ern. Grabii, et dissertatione de præjudiciis theologicis auxit Christoph. Matth. Pfaffius Of whom see Lardner, Credib., i. 17. See vol. i. p. 574, note 5." },
  { t = "p", text = "10. Marriott’s Testimony of the Catacombs;[^4085] learned and instructive." },
  { t = "note", id = "4085", text = "London, Hatchards, 1870. Valuable for its study of the “Autun Inscription.”" },
]

[[section]]
id = "the-divine-liturgy-of-james-the-holy"
title = "The Divine Liturgy of James the Holy Apostle and Brother of the Lord"
level = 1
blocks = [
  { t = "h", text = "EARLY LITURGIES.[^4086]" },
  { t = "note", id = "4086", text = "[This title is misleading, as we have no copies of the originals of these liturgies, and they are encrusted with the ideas of later ages. I shall distinguish between the interpolations legitimately made by councils and the manifest corruptions which contradict Scripture and ancient authors. N.B.: I print the deacon’s parts as such.]" },
  { t = "h", text = "The Divine Liturgy of James the Holy Apostle and Brother of the Lord." },
  { t = "h", text = "i." },
  { t = "h", text = "The Priest.[^4087]" },
  { t = "note", id = "4087", text = "[*A Lavabo*: he prepares himself by the prayer for purification." },
  { t = "p", text = "I O Sovereign Lord our God, contemn me not, defiled with a multitude of sins: for, behold, I have come to this Thy divine and heavenly mystery, not as being worthy; but looking only to Thy goodness, I direct my voice to Thee: God be merciful to me, a sinner; I have sinned against Heaven, and before Thee, and am unworthy to come into the presence of this Thy holy and spiritual table, upon which Thy only-begotten Son, and our Lord Jesus Christ, is mystically set forth as a sacrifice for me, a sinner, and stained with every spot. Wherefore I present to Thee this supplication and thanksgiving, that Thy Spirit the Comforter may be sent down upon me, strengthening and fitting me for this service; and count me worthy to make known without condemnation the word, delivered from Thee by me to the people, in Christ Jesus our Lord, with whom Thou art blessed, together with Thy all-holy, and good, and quickening, and consubstantial[^4088] Spirit, now and ever, and to all eternity. Amen." },
  { t = "note", id = "4088", text = "[Here is a token of theological but legitimate interpolation.]" },
  { t = "h", text = "Prayer of the standing beside the altar." },
  { t = "p", text = "II Glory to the Father, and to the Son, and to the Holy Spirit, the triune light of the Godhead, which is unity subsisting in trinity, divided, yet indivisible: for the Trinity is the one God Almighty, whose glory the heavens declare, and the earth His dominion, and the sea His might, and every sentient and intellectual creature at all times proclaims His majesty: for all glory becomes Him, and honour and might, greatness and magnificence, now and ever, and to all eternity. Amen." },
  { t = "h", text = "Prayer of the incense at the beginning.[^4089]" },
  { t = "note", id = "4089", text = "[On the lawful and unlawful additions to these additions to these liturgies, see Hickes' Christian Priesthood (Oxford, 1847), p. 151.]" },
  { t = "p", text = "III Sovereign Lord Jesus Christ, O Word of God, who didst freely offer Thyself a blameless sacrifice upon the cross to God even the Father, the coal of double nature, that didst touch the lips of the prophet with the tongs, and didst take away his sins, touch also the hearts of us sinners, and purify us from every stain, and present us holy beside Thy holy altar, that we may offer Thee a sacrifice of praise: and accept from us, Thy unprofitable servants, this incense as an odour of a sweet smell, and make fragrant the evil odour of our soul and body, and purify us with the sanctifying power of Thy all-holy Spirit: for Thou alone art holy, who sanctifiest, and art communicated to the faithful; and glory becomes Thee, with Thy eternal Father, and Thy all-holy, and good, and quickening Spirit, now and ever, and to all eternity. Amen." },
  { t = "h", text = "Prayer of the commencement." },
  { t = "p", text = "IV O beneficent King eternal, and Creator of the universe, receive Thy Church, coming unto Thee through Thy Christ: fulfil to each what is profitable; lead all to perfection, and make us perfectly worthy of the grace of Thy sanctification, gathering us together within Thy holy Church, which Thou hast purchased by the precious blood of Thy only-begotten Son, and our Lord and Saviour Jesus Christ, with whom Thou art blessed and glorified, together with Thy all-holy, and good, and quickening Spirit, now and ever, and to all eternity. Amen." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "V Let us again pray to the Lord." },
  { t = "h", text = "The Priest, prayer of the incense at the entrance of the congregation." },
  { t = "p", text = "God, who didst accept the gifts of Abel, the sacrifice of Noah and of Abram, the incense of Aaron and of Zacharias, accept also from the hand of us sinners this incense for an odour of a sweet smell, and for remission of our sins, and those of all Thy people; for blessed art Thou, and glory becomes Thee, the Father, and the Son, and the Holy Spirit, now and ever." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Sir, pronounce the blessing.[^4090]" },
  { t = "note", id = "4090", text = "This is addressed to the priest. Some translate, “O Lord, bless us.” [This latter is the more primitive idea.]" },
  { t = "h", text = "The Priest prays." },
  { t = "p", text = "Our Lord and God, Jesus Christ, who through exceeding goodness and love not to be restrained wast crucified, and didst not refuse to be pierced by the spear and nails; who didst provide this mysterious and awful service as an everlasting memorial for us perpetually: bless Thy ministry in Christ the God, and bless our entrance, and fully complete the presentation of this our service by Thy unutterable compassion, now and ever, and to all eternity. Amen." },
  { t = "h", text = "The responsive prayer from the Deacon." },
  { t = "p", text = "VI. The Lord bless us, and make us worthy seraphically to offer gifts, and to sing the oft-sung hymn of the divine Trisagion, by the fulness and exceeding abundance of all the perfection of holiness, now and ever." },
  { t = "h", text = "Then the Deacon begins to sing in the entrance.[^4091]" },
  { t = "note", id = "4091", text = "[The Lesser Entrance with the Holy Gospels.]" },
  { t = "p", text = "Thou who art the only-begotten Son and Word of God, immortal; who didst submit for our salvation to become flesh of the holy God-mother,[^4092] and ever-virgin Mary; who didst immutably become man and wast crucified, O Christ our God, and didst by Thy death tread death underfoot; who art one of the Holy Trinity glorified together with the Father and the Holy Spirit, save us." },
  { t = "note", id = "4092", text = "[The *Theotoce* or *Deipara* Of course, added after the Council of Chalcedon.]" },
  { t = "h", text = "The Priest says this prayer from the gates to the altar." },
  { t = "p", text = "VII God Almighty, Lord great in glory, who hast given to us an entrance into the Holy of Holies, through the sojourning among men of Thy only-begotten Son, our Lord, and God, and Saviour Jesus Christ, we supplicate and invoke Thy goodness, since we are fearful and trembling when about to stand at Thy holy altar; send forth upon us, O God, Thy good grace, and sanctify our souls, and bodies, and spirits, and turn our thoughts to piety, in order that with a pure conscience we may bring unto Thee gifts, offerings, and fruits for the remission of our transgressions, and for the propitiation of all Thy people, by the grace and mercies and loving-kindness of Thy only-begotten Son, with whom Thou art blessed to all eternity. Amen." },
  { t = "h", text = "After the approach to the altar, the Priest says:—" },
  { t = "p", text = "VIII. Peace be to all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And to thy spirit." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "The Lord bless us all, and sanctify us for the entrance and celebration of the divine and pure mysteries, giving rest to the blessed souls among the good and just, by His grace and loving-kindness, now and ever, and to all eternity. Amen." },
  { t = "h", text = "Then the Deacon says the bidding prayer.[^4093]" },
  { t = "note", id = "4093", text = "[See a specimen of the unlimited capacity for extension of these prayers, in vol. v. p. 412, Elucidation VI., this series.]" },
  { t = "p", text = "IX. In peace let us beseech the Lord." },
  { t = "p", text = "For the peace that is from above, and for God’s love to man, and for the salvation of our souls, let us beseech the Lord." },
  { t = "p", text = "For the peace of the whole world, for the unity of all the holy churches of God, let us beseech the Lord." },
  { t = "p", text = "For the remission of our sins, and forgiveness of our transgressions, and for our deliverance from all tribulation, wrath, danger, and distress, and from the uprising of our enemies, let us beseech the Lord." },
  { t = "h", text = "Then the Singers sing the Trisagion Hymn." },
  { t = "p", text = "Holy God, holy mighty, holy immortal, have mercy upon us." },
  { t = "h", text = "Then the Priest prays, bowing." },
  { t = "p", text = "X. O compassionate and merciful, long-suffering, and very gracious and true God, look from Thy prepared dwelling-place, and hear us Thy suppliants, and deliver us from every temptation of the devil and of man; withhold not Thy aid from us, nor bring on us chastisements too heavy for our strength: for we are unable to overcome what is opposed to us; but Thou art able, Lord, to save us from everything that is against us. Save us, O God, from the difficulties of this world, according to Thy goodness, in order that, having drawn nigh with a pure conscience to Thy holy altar, we may send up to Thee without condemnation the blessed hymn Trisagion, together with the heavenly powers, and that, having performed the service, well pleasing to Thee and divine, we may be counted worthy of eternal life." },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "Because Thou art holy, Lord our God, and dwellest and abidest in holy places, we send up the praise and the hymn Trisagion to Thee, the Father, and the Son, and the Holy Spirit, now and ever, and to all eternity." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "XI. Peace be to all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And to thy spirit." },
  { t = "h", text = "The Singers." },
  { t = "p", text = "Alleluia." },
  { t = "p", text = "Then there are read in order[^4094] the holy oracles of the Old Testament, and of the prophets; and the incarnation of the Son of God is set forth, and His sufferings and resurrection from the dead, His ascension into heaven, and His second appearing with glory; and this takes place daily in the holy and divine service.[^4095]" },
  { t = "note", id = "4094", text = "[At great length. Cf. Justin Martyr, vol. i. p. 186, this series.]" },
  { t = "note", id = "4095", text = "[The reading of the Scriptures in the common tongue is a very precious part of the daily offices in the East.]" },
  { t = "h", text = "After the reading and instruction the Deacon says:—" },
  { t = "p", text = "XII. Let us all say, Lord, be merciful.[^4096]" },
  { t = "note", id = "4096", text = "[Frequent Amens are to be supposed.]" },
  { t = "p", text = "Lord Almighty, the God of our fathers;" },
  { t = "p", text = "We beseech Thee, hear us." },
  { t = "p", text = "For the peace which is from above, and for the salvation of our souls;" },
  { t = "p", text = "Let us beseech the Lord." },
  { t = "p", text = "For the peace of the whole world, and the unity of all the holy churches of God;" },
  { t = "p", text = "Let us beseech the Lord." },
  { t = "p", text = "For the salvation and help of all the Christ-loving people;" },
  { t = "p", text = "We beseech Thee, hear us." },
  { t = "p", text = "For our deliverance from all tribulation, wrath, danger, distress, from captivity, bitter death, and from our iniquities;" },
  { t = "p", text = "We beseech Thee, hear us." },
  { t = "p", text = "For the people standing round, and waiting for the rich and plenteous mercy that is from Thee;" },
  { t = "p", text = "We beseech Thee, be merciful and gracious." },
  { t = "p", text = "Save Thy people, O Lord, and bless Thine inheritance." },
  { t = "p", text = "Visit Thy world in mercy and compassion." },
  { t = "p", text = "Exalt the horn of Christians by the power of the precious and quickening cross." },
  { t = "p", text = "We beseech Thee, most merciful Lord, hear us praying to Thee, and have mercy upon us." },
  { t = "h", text = "The People (thrice)." },
  { t = "p", text = "Lord, have mercy upon us." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "XIII. For the remission of our sins, and forgiveness of our transgressions, and for our deliverance from all tribulation, wrath, danger, and distress, let us beseech the Lord." },
  { t = "p", text = "Let us all entreat from the Lord, that we may pass the whole day, perfect, holy, peaceful, and without sin." },
  { t = "p", text = "Let us entreat from the Lord a messenger of peace, a faithful guide, a guardian of our souls and bodies." },
  { t = "p", text = "Let us entreat from the Lord forgiveness and remission of our sins and transgressions." },
  { t = "p", text = "Let us entreat from the Lord the things which are good and proper for our souls, and peace for the world." },
  { t = "p", text = "Let us entreat from the Lord, that we may spend the remaining period of our life in peace and health." },
  { t = "p", text = "Let us entreat that the close of our lives may be Christian, without pain and without shame, and a good plea at the dread and awful judgment-seat of Christ." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "XIV. For Thou art the gospel and the light, Saviour and keeper of our souls and bodies, God, and Thy only-begotten Son, and Thy all-holy Spirit, now and ever." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen.[^4097]" },
  { t = "note", id = "4097", text = "[Here there is an evident interpolation, not Mariolatrous, yet not primitive, as follows:]— The Priest. Commemorating with all the holy and just, our all-holy, pure, most glorious Lady, the God-mother, and ever-virgin Mary, let us devote ourselves, and one another, and our whole life, to Christ our God. The People. To Thee, Lord." },
  { t = "h", text = "The Priest" },
  { t = "p", text = "God, who hast taught us Thy divine and saving oracles, enlighten the souls of us sinners for the comprehension of the things which have been before spoken, so that we may not only be seen to be hearers of spiritual things, but also doers of good deeds, striving after guileless faith, blameless life, and pure conversation." },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "In Christ Jesus our Lord, with whom Thou art blessed, together with Thy all-holy, good, and quickening Spirit, now and always, and for ever." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "XV. Peace be to all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And to Thy spirit." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Let us bow our heads to the Lord." },
  { t = "h", text = "The People." },
  { t = "p", text = "To Thee, Lord." },
  { t = "h", text = "The Priest prays, saying:—" },
  { t = "p", text = "O Sovereign giver of life, and provider of good things, who didst give to mankind the blessed hope of eternal life, our Lord Jesus Christ, count us worthy in holiness, and perfect this Thy divine service to the enjoyment of future blessedness." },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "So that, guarded by Thy power at all times, and led into the light of truth, we may send up the praise and the thanksgiving to Thee, the Father, the Son, and the Holy Spirit, now and ever." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "XVI. Let none remain of the catechumens, none of the unbaptized, none of those who are unable to join with us in prayer. Look at one another.[^4098] The door." },
  { t = "note", id = "4098", text = "[So as to be sure no enemy was among the faithful.]" },
  { t = "p", text = "All erect:[^4099] let us again pray to the Lord." },
  { t = "note", id = "4099", text = "These clauses are elliptical. After “prayer” supply “remain;” the door is for “shut the door;” and “all erect,” for “stand all erect.”" },
  { t = "h", text = "II[^4100]" },
  { t = "note", id = "4100", text = "[Here begins the Liturgy of the Faithful.]" },
  { t = "h", text = "The Priest says the prayer of incense." },
  { t = "p", text = "Sovereign Almighty, King of Glory, who knowest all things before their creation, manifest Thyself to us calling upon Thee at this holy hour, and redeem us from the shame of our transgressions; cleanse our mind and our thoughts from impure desires, from worldly deceit, from all influence of the devil; and accept from the hands of us sinners this incense, as Thou didst accept the offering of Abel, and Noah, and Aaron, and Samuel, and of all Thy saints, guarding us from everything evil, and preserving us for continually pleasing, and worshipping, and glorifying Thee, the Father, and Thy only-begotten Son, and Thy all-holy Spirit, now and always, and for ever." },
  { t = "h", text = "And the Readers begin the Cherubic Hymn." },
  { t = "p", text = "Let all mortal flesh be silent, and stand with fear and trembling, and meditate nothing earthly within itself:—" },
  { t = "p", text = "For the King of kings and Lord of lords, Christ our God, comes forward to be sacrificed, and to be given for food to the faithful; and the bands of angels go before Him with every power and dominion, the many-eyed cherubim, and the six-winged seraphim, covering their faces, and crying aloud the hymn, Alleluia, Alleluia, Alleluia." },
  { t = "p", text = "The Priest, bringing in the holy gifts,[^4101] says this prayer:—" },
  { t = "note", id = "4101", text = "[Here is the Great Entrance, or bringing-in of the unconsecrated elements. It has a symbolical meaning (Heb. i. 6) now forgotten; and here, instead of the glorified Christ, no doubt the superstitious do adore bread and wine in ignorance.]" },
  { t = "p", text = "XVII. O God, our God, who didst send forth the heavenly bread, the food of the whole world, our Lord Jesus Christ, to be a Saviour, and Redeemer, and Benefactor, blessing and sanctifying us, do Thou Thyself bless this offering, and graciously receive it to Thy altar above the skies:" },
  { t = "p", text = "Remember in Thy goodness and love those who have brought it, and those for whom they have brought it, and preserve us without condemnation in the service of Thy divine mysteries: for hollowed and glorified is Thy all-honoured and great name, Father, and Son, and Holy Spirit, now and ever, and to all eternity." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Peace be to all." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Sir, pronounce the blessing." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Blessed be God, who blesseth and sanctifieth us all at the presentation of the divine and pure mysteries, and giveth rest to the blessed souls among the holy and just, now and always, and to all eternity." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "XVIII Let us attend in wisdom." },
  { t = "h", text = "The Priest begins." },
  { t = "p", text = "I believe in one God, Father Almighty, Maker of heaven and earth, and in one Lord Jesus Christ, the Son of God: and the rest of the Creed." },
  { t = "h", text = "Then he prays, bowing his neck." },
  { t = "p", text = "XIX. God and Sovereign of all, make us, who are unworthy, worthy of this hour, lover of mankind; that being pure from all deceit and all hypocrisy, we may be united with one another by the bond of peace and love, being confirmed by the sanctification of Thy divine knowledge through Thine only-begotten Son, our Lord and Saviour Jesus Christ, with whom Thou art blessed, together with Thy all-holy, and good, and quickening Spirit, now and ever, and to all eternity. Amen." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "XX. Let us stand well, let us stand reverently, let us stand in the fear of God, and with compunction of heart. In peace let us pray to the Lord." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "For God of peace, mercy, love, compassion, and loving-kindness art Thou, and Thine only-begotten Son, and Thine all-holy Spirit, now and ever." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Peace be to all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And to thy spirit." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Let us salute one another with an holy kiss.[^4102] Let us bow our heads to the Lord." },
  { t = "note", id = "4102", text = "[The sexes sat apart, the salutations of each confined to its own: an apostolic feature. 1 Pet. v. 14 et alibi; and see Clementine, p. 486, supra. [Note that beautiful tribute of Augustine to the purity of primitive rites, “Honesta utrinsque sexus discretione,” Civ. Dei, lib. ii. cap. xxviii. p. 77, ed. Migne.] See vol. ii. 291 and iii. 686, this series.]" },
  { t = "h", text = "The Priest bows, saying this prayer:—" },
  { t = "p", text = "XXI. Only Lord and merciful God, on those who are bowing their necks before Thy holy altar, and seeking the spiritual gifts that come from Thee, send forth Thy good grace; and bless us all with every spiritual blessing, that cannot be taken from us, Thou, who dwellest on high, and hast regard unto things that are lowly." },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "For worthy of praise and worship and most glorious is Thy all-holy name, Father and Son and Holy Spirit, now and always, and to all eternity." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Sir, pronounce the blessing." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "The Lord will bless us, and minister with us all by His grace and loving-kindness." },
  { t = "h", text = "And again." },
  { t = "p", text = "The Lord will bless us, and make us worthy to stand at His holy altar, at all times, now and always, and for ever." },
  { t = "h", text = "And again." },
  { t = "p", text = "Blessed be God, who blesseth and sanctifieth us all in our attendance upon, and service of, His pure mysteries, now and always, and for ever." },
  { t = "h", text = "The Deacon makes the Universal Litany." },
  { t = "p", text = "XXII In peace let us pray to the Lord." },
  { t = "h", text = "The People." },
  { t = "p", text = "O Lord, have mercy." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Save us, have mercy upon us, pity and keep us, O God, by Thy grace." },
  { t = "p", text = "For the peace that is from above, and the loving-kindness of God, and the salvation of our souls;" },
  { t = "p", text = "Let us beseech the Lord." },
  { t = "p", text = "For the peace of the whole world, and the unity of all the holy churches of God;" },
  { t = "p", text = "Let us beseech the Lord." },
  { t = "p", text = "For those who bear fruit, and labour honourably in the holy churches of God; for those who remember the poor, the widows and the orphans, the strangers and needy ones; and for those who have requested us to mention them in our prayers;" },
  { t = "p", text = "Let us beseech the Lord." },
  { t = "p", text = "For those who are in old age and infirmity, for the sick and suffering, and those who are troubled by unclean spirits, for their speedy cure from God and their salvation;" },
  { t = "p", text = "Let us beseech the Lord." },
  { t = "p", text = "For those who are passing their days in virginity, and celibacy, and discipline, and for those in holy matrimony; and for the holy fathers and brethren agonizing in mountains,[^4103] and dens, and caves of the earth;" },
  { t = "note", id = "4103", text = "[A token of the Ante-Nicene age, though some think of the later asceticism.]" },
  { t = "p", text = "Let us beseech the Lord." },
  { t = "p", text = "For Christians sailing, travelling, living among strangers, and for our brethren in captivity, in exile, in prison, and in bitter slavery, their peaceful return;" },
  { t = "p", text = "Let us beseech the Lord." },
  { t = "p", text = "For the remission of our sins, and forgiveness of our transgressions, and for our deliverance from all tribulation, wrath, danger, and constraint, and uprising against us of enemies;" },
  { t = "p", text = "Let us beseech the Lord." },
  { t = "p", text = "For favourable weather, peaceful showers, beneficent dews, abundance of fruits, the perfect close of a good season, and for the crown of the year;" },
  { t = "p", text = "Let us beseech the Lord." },
  { t = "p", text = "For our fathers and brethren present, and praying with us in this holy hour, and at every season, their zeal, labour, and earnestness;" },
  { t = "p", text = "Let us beseech the Lord." },
  { t = "p", text = "For every Christian soul in tribulation and distress, and needing the mercy and succour of God; for the return of the erring, the health of the sick, the deliverance of the captives, the rest of the fathers and brethren that have fallen asleep aforetime;" },
  { t = "p", text = "Let us beseech the Lord." },
  { t = "p", text = "For the hearing and acceptance of our prayer before God, and the sending down on us His rich mercies and compassion." },
  { t = "p", text = "Let us beseech the Lord.[^4104]" },
  { t = "note", id = "4104", text = "[Here an interpolation as follows: “Let us commemorate our all-holy, pure, most glorious, blessed lady, God-mother, and ever-virgin Mary, and all the holy and just, that we may all find mercy through their prayers and intercessions.” On which, and like interpolations (the Clementine free from all this), see Scudamore, p. 381.]" },
  { t = "p", text = "And for the offered, precious, heavenly, unutterable, pure, glorious, dread, awful, divine gifts, and the salvation of the priest who stands by and offers them;" },
  { t = "p", text = "Let us offer supplication to God the Lord." },
  { t = "h", text = "The People." },
  { t = "p", text = "O Lord, have mercy." },
  { t = "h", text = "(Thrice.)" },
  { t = "p", text = "Then the Priest makes the sign of the cross on the gifts,[^4105] and, standing, speaks separately thus:—" },
  { t = "note", id = "4105", text = "[Strongly censured by Hickes as a superstitious innovation (p. 153), with other evils introduced after the pseudo-Council of Nice a.d. 787, of which this is the least.]" },
  { t = "p", text = "XXIII Glory to God in the highest, and on earth peace, good-will among men, etc." },
  { t = "h", text = "(Thrice.)" },
  { t = "p", text = "Lord, Thou wilt open my lips, and my mouth shall show forth Thy praise." },
  { t = "h", text = "(Thrice.)" },
  { t = "p", text = "Let my mouth be filled with Thy praise, O Lord, that I may tell of Thy glory, of Thy majesty, all the day." },
  { t = "h", text = "(Thrice.)" },
  { t = "p", text = "Of the Father. Amen. And of the Son. Amen. And of the Holy Spirit. Amen. Now and always, and to all eternity. Amen." },
  { t = "h", text = "And bowing to this side and to that,[^4106] he says:" },
  { t = "note", id = "4106", text = "[The Gospel and the Epistle sides.]" },
  { t = "p", text = "XXIV. Magnify the Lord with me, and let us exalt His name together." },
  { t = "h", text = "And they answer, bowing:—" },
  { t = "p", text = "The Holy Ghost shall come upon thee, and the power of the Highest shall overshadow thee.[^4108]" },
  { t = "note", id = "4108", text = "[“And Mary said, My soul doth magnify,” etc.]" },
  { t = "h", text = "Then the Priest, at great length:—" },
  { t = "p", text = "O Sovereign Lord, who hast visited us in compassion and mercies, and hast freely given to us, Thy humble and sinful and unworthy servants, boldness to stand at Thy holy altar, and to offer to Thee this dread and bloodless sacrifice for our sins, and for the errors of the people, look upon me Thy unprofitable servant, and blot out my transgressions for Thy compassion’s sake; and purify my lips and heart from all pollution of flesh and spirit; and remove from me every shameful and foolish thought, and fit me by the power of Thy all-holy Spirit for this service; and receive me graciously by Thy goodness as I draw nigh to Thy altar." },
  { t = "p", text = "And be pleased, O Lord, that these gifts brought by our hands may be acceptable, stooping to my weakness; and cast me not away from Thy presence, and abhor not my unworthiness; but pity me according to Thy great mercy, and according to the multitude of Thy mercies pass by my transgressions, that, having come before Thy glory without condemnation, I may be counted worthy of the protection of Thy only-begotten Son, and of the illumination of Thy all-holy Spirit, that I may not be as a slave of sin cast out, but as Thy servant may find grace and mercy and forgiveness of sins before Thee, both in the world that now is and in that which is to come." },
  { t = "p", text = "I beseech Thee, Almighty Sovereign, all-powerful Lord, hear my prayer; for Thou art He who workest all in all, and we all seek in all things the help and succour that come from Thee and Thy only-begotten Son, and the good and quickening and consubstantial Spirit, now and ever." },
  { t = "p", text = "XXV. O God, who through Thy great and unspeakable love didst send forth Thy only-begotten Son into the world, in order that He might turn back the lost sheep, turn not away us sinners, laying hold of Thee by this dread and bloodless sacrifice; for we trust not in our own righteousness, but in Thy good mercy, by which Thou purchasest our race." },
  { t = "p", text = "We entreat and beseech Thy goodness that it may not be for condemnation to Thy people that this mystery for salvation has been administered by us, but for remission of sins, for renewal of souls and bodies, for the well-pleasing of Thee, God and Father, in the mercy and love of Thy only-begotten Son, with whom Thou art blessed, together with Thy all-holy and good and quickening Spirit, now and always, and for ever.[^4109]" },
  { t = "note", id = "4109", text = "[In such places Amens are to be supposed.]" },
  { t = "p", text = "XXVI. O Lord God, who didst create us, and bring us into life, who hast shown to us ways to salvation, who hast granted to us a revelation of heavenly mysteries, and hast appointed us to this ministry in the power of Thy all-holy Spirit, grant, O Sovereign, that we may become servants of Thy new testament, ministers of Thy pure mysteries, and receive us as we draw near to Thy holy altar, according to the greatness of Thy mercy, that we may become worthy of offering to Thee gifts and sacrifices for our transgressions and for those of the people; and grant to us, O Lord, with all fear and a pure conscience to offer to Thee this spiritual and bloodless sacrifice, and graciously receiving it unto Thy holy and spiritual altar above the skies for an odour of a sweet spiritual smell, send down in answer on us the grace of Thy all-holy Spirit." },
  { t = "p", text = "And, O God, look upon us, and have regard to this our reasonable service, and accept it, as Thou didst accept the gifts of Abel, the sacrifices of Noah, the priestly offices of Moses and Aaron, the peace-offerings of Samuel, the repentance of David, the incense of Zacharias. As Thou didst accept from the hand of Thy apostles this true service, so accept also in Thy goodness from the hands of us sinners these offered gifts; and grant that our offering may be acceptable, sanctified by the Holy Spirit, as a propitiation[^4110] for our transgressions and the errors of the people; and for the rest of the souls[^4111] that have fallen asleep aforetime; that we also, Thy humble, sinful, and unworthy servants, being counted worthy without guile to serve Thy holy altar, may receive the reward of faithful and wise stewards, and may find grace and mercy in the terrible day of Thy just and good retribution." },
  { t = "note", id = "4110", text = "[Propitiation, not expiation.]" },
  { t = "note", id = "4111", text = "[See vol. v. pp. 222–223.]" },
  { t = "h", text = "Prayer of the veil.[^4112]" },
  { t = "note", id = "4112", text = "[See Field on “the meaning of the veil,” p. 294, where he differs from authors who make it a late innovation; also pp. 448, 449.]" },
  { t = "p", text = "XXVII. We thank Thee, O Lord our God, that Thou hast given us boldness for the entrance of Thy holy places, which Thou hast renewed to us as a new and living way through the veil of the flesh[^4113] of Thy Christ. We therefore, being counted worthy to enter into the place of the tabernacle of Thy glory, and to be within the veil, and to behold the Holy of Holies, cast ourselves down before Thy goodness:" },
  { t = "note", id = "4113", text = "[This great primitive thought has been frittered away by references to the veil covering the oblation.]" },
  { t = "p", text = "Lord, have mercy on us: since we are full of fear and trembling, when about to stand at Thy holy altar, and to offer this dread and bloodless sacrifice for our own sins and for the errors of the people:[^4114] send forth, O God, Thy good grace, and sanctify our souls, and bodies, and spirits; and turn our thoughts to holiness, that with a pure conscience we may bring to Thee a peace-offering, the sacrifice of praise:" },
  { t = "note", id = "4114", text = "[Based on Heb. v. 1–3.]" },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "By the mercy and loving-kindness of Thy only-begotten Son, with whom Thou art blessed, together with Thy all-holy, and good, and quickening Spirit, now and always:" },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Peace be to all." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Let us stand reverently, let us stand in the fear of God, and with contrition: let us attend to the holy communion service, to offer peace to God." },
  { t = "h", text = "The People." },
  { t = "p", text = "The offering of peace, the sacrifice of praise." },
  { t = "h", text = "The Priest [A veil is now withdrawn from the oblation of bread and wine.]" },
  { t = "p", text = "And, uncovering the veils that darkly invest in symbol[^4115] this sacred ceremonial, do Thou reveal it clearly to us: fill our intellectual vision with absolute light, and having purified our poverty from every pollution of flesh and spirit, make it worthy of this dread and awful approach: for Thou art an all-merciful and gracious God, and we send up the praise and the thanksgiving to Thee, Father, Son, and Holy Spirit, now, and always, and for ever." },
  { t = "note", id = "4115", text = "[See more on the veil in Field, p. 492.]" },
  { t = "h", text = "III." },
  { t = "h", text = "The Anaphora." },
  { t = "h", text = "Then he says aloud:—" },
  { t = "p", text = "XXVIII. The love of the Lord and Father, the grace of the Lord and Son, and the fellowship and the gift of the Holy Spirit, be with us all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And with thy spirit." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Let us lift up our minds and our hearts.[^4116]" },
  { t = "note", id = "4116", text = "[The *Sursum corda*, found in all liturgies.]" },
  { t = "h", text = "The People." },
  { t = "p", text = "It is becoming and right." },
  { t = "h", text = "Then the Priest prays." },
  { t = "p", text = "Verily it is becoming and right, proper and due to praise Thee, to sing of Thee, to bless Thee, to worship Thee, to glorify Thee, to give Thee thanks, Maker of every creature visible and invisible, the treasure of eternal good things, the fountain of life and immortality, God and Lord of all:" },
  { t = "p", text = "Whom the heavens of heavens praise, and all the host of them; the sun, and the moon, and all the choir of the stars; earth, sea, and all that is in them; Jerusalem, the heavenly assembly, and church of the first-born that are written in heaven; spirits of just men and of prophets; souls of martyrs and of apostles; angels, archangels, thrones, dominions, principalities, and authorities, and dread powers; and the many-eyed cherubim, and the six-winged seraphim, which cover their faces with two wings, their feet with two, and with two they fly, crying one to another with unresting lips, with unceasing praises:" },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "With loud voice singing the victorious hymn of Thy majestic glory, crying aloud, praising, shouting, and saying:—" },
  { t = "h", text = "The People." },
  { t = "p", text = "Holy, holy, holy, O Lord of Sabaoth, the heaven and the earth are full of Thy glory. Hosanna in the highest; blessed is He that cometh in the name of the Lord. Hosanna in the highest.[^4117]" },
  { t = "note", id = "4117", text = "[See Hammond’s Lit. of Antioch, etc., p. 15, note 29.]" },
  { t = "h", text = "The Priest, making the sign of the cross[^4118] on the gifts, says:—" },
  { t = "note", id = "4118", text = "[Compare the Clementine, p. 488; and note differences.]" },
  { t = "p", text = "XXIX. Holy art Thou, King of eternity, and Lord and giver of all holiness; holy also Thy only-begotten Son, our Lord Jesus Christ, by whom Thou hast made all things; holy also Thy Holy Spirit, which searches all things, even Thy deep things, O God: holy art Thou, almighty, all-powerful, good, dread, merciful, most compassionate to Thy creatures; who didst make man from earth after Thine own image and likeness; who didst give him the joy of paradise; and when he transgressed Thy commandment, and fell away, didst not disregard nor desert him, O Good One, but didst chasten him as at merciful father, call him by the law, instruct him by the prophets; and afterwards didst send forth Thine only-begotten Son Himself, our Lord Jesus Christ, into the world, that He by His coming might renew and restore Thy image;" },
  { t = "p", text = "Who, having descended from heaven, and become flesh of the Holy Spirit and Virgin Godmother[^4119] Mary, and having sojourned among men, fulfilled the dispensation for the salvation of our race; and being about to endure His voluntary and life-giving death by the cross, He the sinless for us the sinners, in the night in which He was betrayed, nay, rather delivered Himself up for the life and salvation of the world," },
  { t = "note", id = "4119", text = "[A token of Post-Nicene origin. Vol. v. p. 259, Elucid. I.]" },
  { t = "h", text = "Then the Priest holds the bread in his hand, and says:—" },
  { t = "p", text = "XXX. Having taken the bread in His holy and pure and blameless and immortal hands, lifting up His eyes to heaven, and showing it to Thee, His God and Father, He gave thanks, and hallowed, and brake, and gave it to us,[^4120] His disciples and apostles, saying:—" },
  { t = "note", id = "4120", text = "[Supposed by some to be a relic of the original formula as the Apostles delivered it. On the synaxis, see vol. v. p. 259. Elucid. II.]." },
  { t = "h", text = "The Deacons say:[^4121]" },
  { t = "note", id = "4121", text = "[These abrupt interjections of the deacon are made while the priest proceeds. This logically follows what the priest subjoins.]" },
  { t = "p", text = "For the remission of sins and life everlasting." },
  { t = "h", text = "Then he says aloud:—" },
  { t = "p", text = "Take, eat: this is my body, broken for you, and given for remission of sins." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "Then he takes the cup, and says:—" },
  { t = "p", text = "In like manner, after supper, He took the cup, and having mixed wine and water, lifting up His eyes to heaven, and presenting it to Thee, His God and Father, He gave thanks, and hollowed and blessed it, and filled it with the Holy Spirit, and gave it to us His disciples, saying, Drink ye all of it; this is my blood of the new testament shed for you and many, and distributed for the remission of sins." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "This do in remembrance of me; for as often as ye eat this bread, and drink this cup, ye do show forth the Lord’s death, and confess His resurrection, till He come." },
  { t = "h", text = "The Deacons say:—" },
  { t = "p", text = "We believe and confess:" },
  { t = "h", text = "The People." },
  { t = "p", text = "We show forth Thy death, O Lord, and confess Thy resurrection." },
  { t = "h", text = "The Priest (Oblation)." },
  { t = "p", text = "XXXI. Remembering, therefore, His life-giving sufferings, His saving cross, His death and His burial, and resurrection from the dead on the third day, and His ascension into heaven, and sitting at the right hand of Thee, our God and Father, and His second glorious and awful appearing, when He shall come with glory to judge the quick and the dead, and render to every one according to His works; even we, sinful men, offer unto Thee, O Lord, this dread and bloodless sacrifice, praying that Thou wilt not deal with us after our sins, nor reward us according to our iniquities;" },
  { t = "p", text = "But that Thou, according to Thy mercy and Thy unspeakable loving-kindness, passing by and blotting out the handwriting against us Thy suppliants, wilt grant to us Thy heavenly and eternal gifts (which eye hath not seen, and ear hath not heard, and which have not entered into the heart of man[^4122]) that thou hast prepared, O God, for those who love Thee; and reject not, O loving Lord, the people for my sake, or for my sin’s sake:" },
  { t = "note", id = "4122", text = "To conceive. [A feeble interpolation in the Edinburgh edition.]" },
  { t = "h", text = "Then he says, thrice:—" },
  { t = "p", text = "For Thy people and Thy Church supplicate Thee." },
  { t = "h", text = "The People." },
  { t = "p", text = "Have mercy on us, O Lord our God, Father Almighty." },
  { t = "h", text = "Again the Priest says (Invocation):—" },
  { t = "p", text = "XXXII. Have mercy upon us, O God Almighty." },
  { t = "p", text = "Have mercy upon us, O God our Saviour." },
  { t = "p", text = "Have mercy upon us, O God, according to Thy great mercy, and send forth on us, and on these offered gifts, Thy all-holy Spirit." },
  { t = "h", text = "Then, bowing his neck, he says:—" },
  { t = "p", text = "The sovereign and quickening Spirit, that sits upon the throne with Thee, our God and Father, and with Thy only-begotten Son, reigning with Thee; the consubstantial[^4123] and co-eternal; that spoke in the law and in the prophets, and in Thy New Testament; that descended in the form of a dove on our Lord Jesus Christ at the river Jordan, and abode on Him; that descended on Thy apostles in the form of tongues of fire in the upper room of the holy and glorious Zion on the day of Pentecost: this Thine all-holy Spirit, send down, O Lord, upon us, and upon these offered holy gifts;" },
  { t = "note", id = "4123", text = "[Post-Nicene, but legitimate.]" },
  { t = "h", text = "And rising up, he says aloud:—" },
  { t = "p", text = "That coming, by His holy and good and glorious appearing, He may sanctify this bread, and make it the holy body of Thy Christ.[^4124]" },
  { t = "note", id = "4124", text = "[Understood mystically and spiritually down to a late period, even in the West. See Ratramni De Corpore et Sanguine, Oxon., 1838. Note the inference as to time of sanctification.]" },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "And this cup the precious blood of Thy Christ." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest by himself standing." },
  { t = "p", text = "XXXIII. That they may be to all that partake of them for remission of sins, and for life everlasting, for the sanctification of souls and of bodies, for bearing the fruit of good works, for the stablishing of Thy Holy Catholic Church, which Thou hast founded on the Rock of Faith,[^4125] that the gates of hell may not prevail against it; delivering it from all heresy and scandals, and from those who work iniquity, keeping it till the fulness of the time." },
  { t = "note", id = "4125", text = "[See vol. v. Elucidation VII. p. 561.]" },
  { t = "h", text = "And having bowed, he says:—" },
  { t = "p", text = "XXXIV. We present them to Thee also, O Lord, for the holy places, which Thou hast glorified by the divine appearing of Thy Christ, and by the visitation of Thy all-holy Spirit; especially for the glorious Zion, the mother of all the churches;[^4126] and for Thy Holy, Catholic, and Apostolic Church throughout the world: even now, O Lord, bestow upon her the rich gifts of Thy all-holy Spirit." },
  { t = "note", id = "4126", text = "[An honorary title conceded to Jerusalem by the Second General Council: τη̑ς δέ γε μητρὸς ἁπασω̑ν τω̑ ν ἐκκλησιω̑ν.]" },
  { t = "p", text = "Remember also, O Lord, our holy fathers and brethren in it, and the bishops in all the world, who rightly divide the word of Thy truth." },
  { t = "p", text = "Remember also, O Lord, every city and country, and those of the true faith dwelling in them, their peace and security." },
  { t = "p", text = "Remember, O Lord, Christians sailing, travelling, sojourning in strange lands; our fathers and brethren, who are in bonds, prison, captivity, and exile; who are in mines, and under torture, and in bitter slavery. Remember, O Lord, the sick and afflicted, and those troubled by unclean spirits, their speedy healing from Thee, O God, and their salvation." },
  { t = "p", text = "Remember, O Lord, every Christian soul in affliction and distress, needing Thy mercy and succour, O God; and the return of the erring." },
  { t = "p", text = "Remember, O Lord, our fathers and brethren, toiling hard, and ministering unto us, for Thy holy name’s sake." },
  { t = "p", text = "Remember all, O Lord, for good: have mercy on all, O Lord, be reconciled to us all: give peace to the multitudes of Thy people: put away scandals: bring wars to an end: make the uprising of heresies to cease: grant Thy peace and Thy love to us, O God our Saviour, the hope of all the ends of the earth." },
  { t = "p", text = "Remember, O Lord, favourable weather, peaceful showers, beneficent dews, abundance of fruits, and to crown the year with Thy goodness; for the eyes of all wait on Thee, and Thou givest their food in due season: thou openest Thy hand, and fillest every living thing with gladness." },
  { t = "p", text = "Remember, O Lord, those who bear fruit, and labour honourably in the holy[^4127] of Thy Church; and those who forget not the poor, the widows, the orphans, the strangers, and the needy; and all who have desired us to remember them in our prayers." },
  { t = "note", id = "4127", text = "Services. [Otherwise, “who do good works in Thy holy churches.”]" },
  { t = "p", text = "Moreover, O Lord, be pleased to remember those who have brought these offerings this day to Thy holy altar, and for what each one has brought them or with what mind, and those persons who have just now been mentioned to Thee." },
  { t = "p", text = "Remember, O Lord, according to the multitude of Thy mercy and compassion, me also, Thy humble and unprofitable servant; and the deacons who surround Thy holy altar, and graciously give them a blameless life, keep their ministry undefiled, and purchase for them a good degree, that we may find mercy and grace, with all the saints that have been well pleasing to Thee since the world began, to generation and generation—grandsires, sires, patriarchs, prophets, apostles, martyrs, confessors, teachers, saints, and every just spirit made perfect in the faith of Thy Christ." },
  { t = "p", text = "XXXV.[^4128] Hail, Mary, highly favoured: the Lord is with Thee; blessed art thou among women, and blessed the fruit of thy womb, for thou didst bear the Saviour of our souls.[^4129]" },
  { t = "note", id = "4128", text = "[The Angelical Salutation is here an evident interpolation, marring the grand unities of the liturgy.]" },
  { t = "note", id = "4129", text = "[I place in a note what follows:]— Then the Priest says aloud:— Hail in the highest, our all-holy, pure, most blessed, glorious lady, the God-mother and ever-virgin Mary. The Singers. Verily it is becoming to bless Thee, the God-bearing, the ever-blessed, and all-blameless, and mother of our God, more honourable than the cherubim, and incomparably more glorious than the seraphim: thee, who didst bear with purity God the Word, thee the true God-mother, we magnify. And again they sing:— In thee, highly favoured, all creation rejoices, the host of angels, and the race of men; hallowed temple, and spiritual paradise, pride of virgins, of whom God was made flesh and our God, who was before eternity, became a little child: for He made Thy womb His throne, and Thy bowels more capacious than the heavens. In thee, O highly favoured one, all creation rejoices: glory unto thee." },
  { t = "h", text = "The Deacons." },
  { t = "p", text = "XXXVI. Remember us, O Lord God." },
  { t = "h", text = "The Priest, bowing, says:—" },
  { t = "p", text = "Remember, O Lord God, the spirits and all flesh, of whom we have made mention, and of whom we have not made mention, who are of the true faith, from righteous Abel unto this day: unto them do Thou give rest there in the land of the living, in Thy kingdom, in the joy of paradise, in the bosom of Abraham, and of Isaac, and of Jacob, our holy fathers; whence pain, and grief, and lamentation have fled: there the light of Thy countenance looks upon them, and enlightens them for ever.[^4130]" },
  { t = "note", id = "4130", text = "[A prayer entirely corresponding with the primitive ideas. See vol. vi. p. 488, and elucidation, p. 541.]" },
  { t = "p", text = "Make the end of our lives Christian, acceptable, blameless, and peaceful, O Lord, gathering us together, O Lord, under the feet of Thine elect, when Thou wilt, and as Thou wilt; only without shame and transgressions, through Thy only-begotten Son, our Lord and God and Saviour Jesus Christ: for He is the only sinless one who hath appeared on the earth." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "And let us pray:—" },
  { t = "p", text = "For the peace and establishing of the whole world, and of the holy churches of God, and for the purposes for which each one made his offering, or according to the desire he has: and for the people standing round, and for all men, and all women:" },
  { t = "h", text = "The People." },
  { t = "p", text = "And for all men and all women. (Amen.)" },
  { t = "h", text = "The Priest says aloud:—" },
  { t = "p", text = "Wherefore, both to them and to us, do Thou in Thy goodness and love:" },
  { t = "h", text = "The People." },
  { t = "p", text = "Forgive, remit, pardon, O God, our transgressions, voluntary and involuntary: in deed and in word: in knowledge and in ignorance: by night and by day: in thought and intent: in Thy goodness and love, forgive us them all." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Through the grace and compassion and love of Thy only-begotten Son, with whom Thou art blessed and glorified, together with the all-holy, and good, and quickening Spirit, now and ever, and to all eternity." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "XXXVII. Peace be to all:" },
  { t = "h", text = "The People." },
  { t = "p", text = "And to thy spirit." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Again, and continually, in peace let us pray to the Lord." },
  { t = "p", text = "For the gifts to the Lord God presented and sanctified, precious, heavenly, unspeakable, pure, glorious, dread, awful, divine;" },
  { t = "p", text = "Let us pray." },
  { t = "p", text = "That the Lord our God, having graciously received them to His altar that is holy and above the heavens, rational and spiritual, for the odour of a sweet spiritual savour, may send down in answer upon us the divine grace and the gift of the all-holy Spirit;" },
  { t = "p", text = "Let us pray." },
  { t = "p", text = "Having prayed for the unity of the faith, and the communion of His all-holy and adorable Spirit;" },
  { t = "p", text = "Let us commend ourselves and one another, and our whole life, to Christ our God:" },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest prays." },
  { t = "p", text = "XXXVIII. God and Father of our Lord and God and Saviour Jesus Christ, the glorious Lord, the blessed essence, the bounteous goodness, the God and Sovereign of all, who art blessed to all eternity, who sittest upon the cherubim, and art glorified by the seraphim, before whom stand thousand thousands and ten thousand times ten thousand hosts of angels and archangels: Thou hast accepted the gifts, offerings, and fruits brought unto Thee as an odour of a sweet spiritual smell, and hast been pleased to sanctify them, and make them perfect, O good One, by the grace of Thy Christ, and by the presence of Thy all-holy Spirit." },
  { t = "p", text = "Sanctify also, O Lord, our souls, and bodies, and spirits, and touch our understandings, and search our consciences, and cast out from us every evil imagination, every impure feeling, every base desire, every unbecoming thought, all envy, and vanity, and hypocrisy, all lying, all deceit, every worldly affection, all covetousness, all vainglory, all indifference, all vice, all passion, all anger, all malice, all blasphemy, every motion of the flesh and spirit that is not in accordance with Thy holy will:" },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "And count us worthy, O loving Lord, with boldness, without condemnation, in a pure heart, with a contrite spirit, with unshamed face, with sanctified lips, to dare to call upon Thee, the holy God, Father in heaven, and to say," },
  { t = "h", text = "The People." },
  { t = "p", text = "Our Father, which art in heaven: hollowed be Thy name; and so on to the doxology." },
  { t = "p", text = "The Priest, bowing, says (the Embolism[^4131]):—" },
  { t = "note", id = "4131", text = "[In all early liturgies always following the Lord’s Prayer, to accentuate the petition against the evil one. It hurls back his “fiery darts,” as it were; whence this name.]" },
  { t = "p", text = "And lead us not into temptation, Lord, Lord of Hosts, who knowest our frailty, but deliver us from the evil one and his works, and from all his malice and craftiness, for the sake of Thy holy name, which has been placed upon our humility:" },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "For Thine is the kingdom, the power, and the glory, Father, Son, and Holy Spirit, now and for ever." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "XXXIX. Peace be to all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And to thy spirit." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Let us bow our heads to the Lord." },
  { t = "h", text = "The People." },
  { t = "p", text = "To Thee, O Lord." },
  { t = "h", text = "The Priest prays, speaking thus:—" },
  { t = "p", text = "To Thee, O Lord, we Thy servants have bowed our heads before Thy holy altar, waiting for the rich mercies that are from Thee." },
  { t = "p", text = "Send forth upon us, O Lord, Thy plenteous grace and Thy blessing; and sanctify our souls, bodies, and spirits, that we may become worthy communicants and partakers of Thy holy mysteries, to the forgiveness of sins and life everlasting:" },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "For adorable and glorified art Thou, our God, and Thy only-begotten Son, and Thy all-holy Spirit, now and ever." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest says aloud:—" },
  { t = "p", text = "And the grace and the mercies of the holy and consubstantial, and uncreated, and adorable Trinity, shall be with us all.[^4132]" },
  { t = "note", id = "4132", text = "[Duplicated, with other parts, in the Greek copies.]" },
  { t = "h", text = "The People." },
  { t = "p", text = "And with thy spirit." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "In the fear of God, let us attend." },
  { t = "h", text = "The Priest says secretly:—[^4133]" },
  { t = "note", id = "4133", text = "[The taking-up of the gifts is here erroneously introduced in the Edinburgh edition.]" },
  { t = "p", text = "O holy Lord, that abidest in holy places, sanctify us by the word of Thy grace, and by the visitation of Thy all-holy Spirit: for Thou, O Lord, hast said, Ye will be holy, for I am holy. O Lord our God, incomprehensible Word of God, one in substance with the Father and the Holy Spirit, co-eternal and indivisible, accept the pure hymn, in Thy holy and bloodless sacrifices; with the cherubim, and seraphim, and from me, a sinful man, crying and saying:—" },
  { t = "h", text = "He takes up the gifts and saith aloud:—" },
  { t = "p", text = "XL. The holy things unto holy." },
  { t = "h", text = "The People." },
  { t = "p", text = "One only is holy, one Lord Jesus Christ, to the glory of God the Father, to whom be glory to all eternity." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "XLI. For the remission of our sins, and the propitiation of our souls, and for every soul in tribulation and distress, needing the mercy and succour of God, and for the return of the erring, the healing of the sick, the deliverance of the captives, the rest of our fathers and brethren who have fallen asleep aforetime;" },
  { t = "p", text = "Let us all say fervently, Lord, have mercy:" },
  { t = "h", text = "The People (twelve times)." },
  { t = "p", text = "Lord, have mercy.[^4134]" },
  { t = "note", id = "4134", text = "[The publican’s prayer, adapted to the Christian worship: ἰλάσθητί μοι, is the plea for mercy through propitiation. Luke xviii. 13.]" },
  { t = "p", text = "Then the Priest breaks the bread, and holds the half in his right hand, and the half in his left, and dips that in his right hand in the chalice, saying:—" },
  { t = "p", text = "The union of the all-holy body and precious blood of our Lord and God and Saviour, Jesus Christ." },
  { t = "p", text = "Then he makes the sign of the cross on that in his left hand: then with that which has been signed the other half: then forthwith he begins to divide, and before all to give to each chalice a single piece, saying:—" },
  { t = "p", text = "It has been made one, and sanctified, and perfected, in the name of the Father, and of the Son, and of the Holy Spirit, now and ever." },
  { t = "h", text = "And when he makes the sign of the cross on the bread, he says:—" },
  { t = "p", text = "Behold the Lamb of God, the Son of the Father, that taketh away the sin of the world, sacrificed for the life and salvation of the world." },
  { t = "h", text = "And when he gives a single piece to each chalice he says:—" },
  { t = "p", text = "A holy portion of Christ, full of grace and truth, of the Father, and of the Holy Spirit, to whom be the glory and the power to all eternity." },
  { t = "h", text = "Then he begins to divide, and to say:—" },
  { t = "p", text = "XLII. The Lord is my Shepherd, I shall not want. In green pastures, and so on.[^4135]" },
  { t = "note", id = "4135", text = "Ps. xxiii." },
  { t = "h", text = "Then," },
  { t = "p", text = "I will bless the Lord at all times, and so on.[^4136]" },
  { t = "note", id = "4136", text = "Ps. xxxiv." },
  { t = "h", text = "Then," },
  { t = "p", text = "I will extol Thee, my God, O King, and so on.[^4137]" },
  { t = "note", id = "4137", text = "Ps. cxlv." },
  { t = "h", text = "Then," },
  { t = "p", text = "O praise the Lord, all ye nations, and so on.[^4138]" },
  { t = "note", id = "4138", text = "Ps. cxvii." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Sir, pronounce the blessing." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "The Lord will bless us, and keep us without condemnation for the communion of His pure gifts, now and always, and for ever." },
  { t = "h", text = "And when they have filled,[^4139] the Deacon says:—" },
  { t = "note", id = "4139", text = "[Here the chalice is filled for participation.]" },
  { t = "p", text = "Sir, pronounce the blessing." },
  { t = "h", text = "The Priest says:—" },
  { t = "p", text = "The Lord will bless us, and make us worthy with the pure touchings of our fingers to take the live coal, and place it upon the mouths of the faithful for the purification and renewal of their souls and bodies, now and always." },
  { t = "h", text = "Then," },
  { t = "p", text = "O taste and see that the Lord is good; who is parted and not divided; distributed to the faithful and not expended; for the remission of sins, and the life everlasting; now and always, and for ever." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "In the peace of Christ, let us sing:" },
  { t = "h", text = "The Singers." },
  { t = "p", text = "O taste and see that the Lord is good." },
  { t = "h", text = "The Priest says the prayer before the communion." },
  { t = "p", text = "O Lord our God, the heavenly bread, the life of the universe, I have sinned against Heaven, and before Thee, and am not worthy to partake of Thy pure mysteries; but as a merciful God, make me worthy by Thy grace, without condemnation to partake of Thy holy body and precious blood, for the remission of sins, and life everlasting.[^4140]" },
  { t = "note", id = "4140", text = "[Here the presbyter receives.]" },
  { t = "p", text = "XLIII. Then he distributes to the clergy; and when the deacons take the disks[^4141] and the chalices for distribution to the people, the Deacon, who takes the first disk, says:—" },
  { t = "note", id = "4141", text = "Or patens." },
  { t = "p", text = "Sir, pronounce the blessing." },
  { t = "h", text = "The Priest replies:—" },
  { t = "p", text = "Glory to God who has sanctified and is sanctifying us all." },
  { t = "h", text = "The Deacon says:—" },
  { t = "p", text = "Be Thou exalted, O God, over the heavens, and Thy glory over all the earth, and Thy kingdom endureth to all eternity.[^4142]" },
  { t = "note", id = "4142", text = "[Here are difficulties explained by Drs. Neale and Littledale in their Translation, etc., p. 60.]" },
  { t = "h", text = "And when the Deacon is about to put it on the side-table[^4143] the Priest says:—" },
  { t = "note", id = "4143", text = "[The side-table or credence.]" },
  { t = "p", text = "Blessed be the name of the Lord our God for ever." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "In the fear of God, and in faith and love, draw nigh." },
  { t = "h", text = "The People." },
  { t = "p", text = "Blessed is He that cometh in the name of the Lord.[^4144]" },
  { t = "note", id = "4144", text = "[Here the laity are communicated.]" },
  { t = "h", text = "And again, when he sets down the disk upon the side-table, he says:—" },
  { t = "p", text = "Sir, pronounce the blessing." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Save Thy people, O God, and bless Thine inheritance." },
  { t = "h", text = "The Priest again.[^4145]" },
  { t = "note", id = "4145", text = "[Compare Neale’s Tetralogia Liturgica, p. 192.]" },
  { t = "p", text = "Glory to our God, who has sanctified us all." },
  { t = "h", text = "And when he has put the chalice back on the holy table, the Priest says:—" },
  { t = "p", text = "Blessed be the name of the Lord to all eternity." },
  { t = "h", text = "The Deacons and the People say:—" },
  { t = "p", text = "Fill our mouths with Thy praise, O Lord, and fill our lips with joy, that we may sing of Thy glory, of Thy greatness all the day." },
  { t = "h", text = "And again:—" },
  { t = "p", text = "We render thanks to Thee, Christ our God, that Thou hast made us worthy to partake of Thy body and blood, for the remission of sins, and for life everlasting. Do Thou, in Thy goodness and love, keep us, we pray Thee, without condemnation." },
  { t = "h", text = "The prayer of incense at the last entrance." },
  { t = "p", text = "XLIV. We render thanks to Thee, the Saviour and God of all, for all the good things Thou hast given us, and for the participation of Thy holy and pure mysteries, and we offer to Thee this incense, praying: Keep us under the shadow of Thy wings, and count us worthy till our last breath to partake of Thy holy rites for the sanctification of our souls and bodies, for the inheritance of the kingdom of heaven: for Thou, O God, art our sanctification, and we send up praise and thanksgiving to Thee, Father, Son, and Holy Spirit." },
  { t = "h", text = "The Deacon begins in the entrance." },
  { t = "p", text = "Glory to Thee, glory to Thee, glory to Thee, O Christ the King, only-begotten Word of the Father, that Thou hast counted us, Thy sinful and unworthy servants, worthy to enjoy thy pure mysteries for the remission of sins, and for life everlasting: glory to Thee.[^4146]" },
  { t = "note", id = "4146", text = "[Here are confusions; but see Neale and Littledale, p. 62, note 20.]" },
  { t = "h", text = "And when he has made the entrance, the Deacon begins to speak thus:—" },
  { t = "p", text = "XLV. Again and again, and at all times, in peace, let us beseech the Lord." },
  { t = "p", text = "That the participation of His Holy rites may be to us for the turning away from every wicked thing, for our support on the journey to life everlasting, for the communion and gift of the Holy Spirit;" },
  { t = "p", text = "Let us pray." },
  { t = "h", text = "The Priest prays." },
  { t = "p", text = "Commemorating our all-holy, pure, most glorious, blessed Lady, the God-Mother and Ever-Virgin Mary,[^4147] and all the saints that have been well-pleasing to Thee since the world began, let us devote ourselves, and one another, and our whole life, to Christ our God:" },
  { t = "note", id = "4147", text = "[Interpolated, but not Mariolatrous; the *Theotoce* is commemorated, not adored.]" },
  { t = "h", text = "The People." },
  { t = "p", text = "To Thee, O Lord." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "XLVI. O God, who through Thy great and unspeakable love didst condescend to the weakness of Thy servants, and hast counted us worthy to partake of this heavenly table, condemn not us sinners for the participation of Thy pure mysteries; but keep us, O good One, in the sanctification of Thy Holy Spirit, that being made holy, we may find part and inheritance with all Thy saints that have been well-pleasing to Thee since the world began, in the light of Thy countenance, through the mercy of Thy only-begotten Son, our Lord and God and Saviour Jesus Christ, with whom Thou art blessed, together with Thy all-holy, and good, and quickening Spirit: for blessed and glorified is Thy all-precious and glorious name, Father, Son, and Holy Spirit, now and ever, and to all eternity." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Peace be to all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And to thy spirit." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "XLVII. Let us bow our heads to the Lord." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "O God, great and marvellous, look upon Thy servants, for we have bowed our heads to Thee. Stretch forth Thy hand, strong and full of blessings, and bless Thy people. Keep Thine inheritance, that always and at all times we may glorify Thee, our only living and true God, the holy and consubstantial[^4148] Trinity, Father, Son, and Holy Ghost, now and ever, and to all eternity." },
  { t = "note", id = "4148", text = "[A legitimate addition, according to the primitive laws.]" },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "For unto Thee is becoming and is due praise from us all, and honour, and adoration, and thanksgiving, Father, Son, and Holy Spirit, now and ever." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "XLVIII. In the peace of Christ let us sing:" },
  { t = "h", text = "And again he says:—" },
  { t = "p", text = "In the peace of Christ let us go on:" },
  { t = "h", text = "The People." },
  { t = "p", text = "In the name of the Lord. Sir, pronounce the blessing.[^4149]" },
  { t = "note", id = "4149", text = "[Which must here be given.]" },
  { t = "h", text = "Dismission prayer, spoken by the Deacon." },
  { t = "p", text = "Going on from glory to glory, we praise Thee, the Saviour of our souls. Glory to Father, and Son, and Holy Spirit now and ever, and to all eternity. We praise Thee, the Saviour of our souls." },
  { t = "h", text = "The Priest says a prayer from the altar to the sacristy." },
  { t = "p", text = "XLIX. Going on from strength to strength, and having fulfilled all the divine service in Thy temple, even now we beseech Thee, O Lord our God, make us worthy of perfect loving-kindness; make straight our path: root us in Thy fear, and make us worthy of the heavenly kingdom, in Christ Jesus our Lord, with whom Thou art blessed, together with Thy all-holy, and good, and quickening Spirit, now and always, and for ever." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "L. Again and again, and at all times, in peace let us beseech the Lord." },
  { t = "h", text = "Prayer said in the sacristy after the dismissal." },
  { t = "p", text = "Thou hast given unto us, O Lord, sanctification in the communion of the all-holy body and precious blood of Thy only-begotten Son, our Lord Jesus Christ; give unto us also the grace of Thy good Spirit, and keep us blameless in the faith, lead us unto perfect adoption and redemption, and to the coming joys of eternity; for Thou art our sanctification and light, O God, and Thy only-begotten Son, and Thy all-holy Spirit, now and ever, and to all eternity. Amen." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "In the peace of Christ let us keep watch." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Blessed is God, who blesseth and sanctifieth through the communion of the holy, and quickening, and pure mysteries, now and ever, and to all eternity. Amen." },
  { t = "h", text = "Then the prayer of propitiation." },
  { t = "p", text = "O Lord Jesus Christ, Son of the living God, Lamb and Shepherd, who takest away the sin of the world, who didst freely forgive their debt to the two debtors, and gavest remission of her sins to the woman that was a sinner, who gavest healing to the paralytic, with the remission of his sins; forgive, remit, pardon, O God, our offences, voluntary and involuntary, in knowledge and in ignorance, by transgression and by disobedience, which Thy all-holy Spirit knows better than Thy servants do:" },
  { t = "p", text = "And if men, carnal and dwelling in this world, have in aught erred from Thy commandments, either moved by the devil, whether in word or in deed, or if they have come under a curse, or by reason of some special vow, I entreat and beseech Thy unspeakable loving-kindness, that they may be set free from their word, and released from the oath and the special vow, according to Thy goodness." },
  { t = "p", text = "Verily, O Sovereign Lord, hear my supplication on behalf of Thy servants, and do Thou pass by all their errors, remembering them no more; forgive them every transgression, voluntary and involuntary; deliver them from everlasting punishment: for Thou art He that hast commanded us, saying, Whatsoever things ye bind upon earth, shall be bound in heaven; and whatsoever things ye loose upon earth, shall be loosed in heaven: for, thou art our God, a God able to pity, and to save and to forgive sins; and glory is due unto Thee, with the eternal Father, and the quickening Spirit, now and ever, and to all eternity. Amen." },
]

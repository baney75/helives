[[section]]
id = "introductory-notice"
title = "Introductory Notice."
level = 1
blocks = [
  { t = "h", text = "to" },
  { t = "h", text = "Memoirs of Edessa and Other Syriac Documents." },
  { t = "p", text = "The *Syriac Documents* here subjoined are to be regarded as interesting relics of the primitive ages, but neither wholly genuine nor in details authentic. They have been interpolated and corrupted so as to reflect, in some particulars, ideas wholly repugnant to those of Christian antiquity, and which first received currency in the period of the Iconoclastic controversy.[^2888] Yet the pages of Eusebius bear witness to the Edessene legends as of very early origin, and it is reasonable to suppose that they rest on some inquiries made by the contemporary Abgar concerning the great Prophet who had appeared in Galilee. The visit of the Wise Men from the East, and the history of Naaman the Syrian, lend antecedent probability to the idea that such inquiries may have been made. The mission of Thaddæus seems a historical fact; and if he found Abgar predisposed to believe, and familiar with the story of the Christ, the growth of the whole fable is sufficiently accounted for. Let me quote Wake in the Preliminary Discourse to his *Apostolic Fathers*. He says:[^2889] “That both the intercourse reported by Eusebius between our Saviour and this prince (Abgarus), and the report of the picture being brought to him, have been received as a matter of unquestionable truth in those parts, the authority of Gregorius Abulpharagius[^2890] will not suffer us to doubt.…But Gelasius[^2891] pronounced the epistle of our Saviour to be apocryphal.…Natalis Alexander judges both it and the reply of Abgar *supposititious*; and Dupin, after him, yet more solidly convicts it of such manifest errors as may satisfy all considering persons that Eusebius and Ephraem were too easy of belief in this particular, and did not sufficiently examine into it.”[^2892]" },
  { t = "note", id = "2888", text = "Had the early Christians used icons,—i.e., pictures in their churches,—the churches themselves would everywhere have been visible proof against the Council of Frankfort and all who condemned icons. Sculptured images are not icons, technically." },
  { t = "note", id = "2889", text = "Abridged." },
  { t = "note", id = "2890", text = "Jacobite primate, died 1286." },
  { t = "note", id = "2891", text = "Bishop of Rome a.d. 492–496." },
  { t = "note", id = "2892", text = "Wake, *Apostolic Fathers*, p. 4." },
  { t = "p", text = "But I cannot do better than refer the inquirer to Jones’ work *On the Canon*,[^2893] where, even in early youth, I found the whole matter, and the story of the portrait of our Saviour, attractive reading. I owe to that work my initiation into the study of what I am now endeavouring to elucidate, in some degree, for others. I subjoin the words of Lardner,[^2894] in concluding his candid examination of the matter, as follows: “The whole history is the fiction of some Christian at Edessa, in the time of Eusebius or not long before. The people of Edessa were then generally Christians; and they valued themselves upon it, and were willing to do themselves the honour of a very early conversion to the Christian faith. By some one of them, or more united together, this history was formed, *and was so far* received by Eusebius as to be thought by him *not improper* to be inserted in his *Ecclesiastical History*.”" },
  { t = "note", id = "2893", text = "Vol. ii. pp. 1–31." },
  { t = "note", id = "2894", text = "*Credib*., vi. 605." },
  { t = "p", text = "I conclude that Eusebius was led to put some confidence in it by the *antecedent probability* to which I have referred, favouring the idea that some knowledge of Christ had penetrated the mind and heart of Abgar even in our Saviour’s lifetime. This idea receives some countenance from the fact recorded by St. Matthew:[^2895] “His fame went *throughout all Syria*; and they brought unto Him all sick people that were taken with divers diseases,” etc." },
  { t = "note", id = "2895", text = "Cap. iv. 24." },
  { t = "p", text = "The remarks I have quoted from the learned will sufficiently prepare the reader for the other *Syriac Documents* which follow these *Edessene Memoirs*, as I find it convenient to call them." },
  { t = "p", text = "Here follows the Introductory Notice by the translator:—" },
  { t = "p", text = "These Documents were selected by the late Dr. Cureton, from manuscripts acquired by the British Museum from the Nitrian Monastery in Lower Egypt, of which the first portion arrived in 1841, the second in 1843, and a third in 1847. The preparation of them for publication occupied the closing days of his life. It is to be regretted that his death occurred before he was able to write a preface: the more so because, to use the words of Dr. W. Wright, the editor of the posthumous work, “he had studied the questions connected with this volume for years and from every point of view.” In a note occurring in the preface to his *Festal Letters of Athanasius*,[^2896] he says: “I have found among the Syriac mss. in the British Museum a considerable portion of the original Aramaic document which Eusebius cites as preserved in the archives of Edessa, and various passages from it quoted by several authors, with other testimonies which seem to be sufficient to establish the fact of the early conversion of the inhabitants of that city, and among them of the king himself, although his successors afterwards relapsed into paganism. These, together with accounts of the martyrdom of some of the first bishops of that city, forming a most interesting accession to our knowledge of the early propagation of Christianity in the East down to about a.d. 300, I have already transcribed, and hope to publish.” “He was himself firmly persuaded,” adds Dr. Wright, “of the genuineness of the Epistles attributed to Abgar, king of Edessa, and our Lord: an opinion which he shared with such illustrious scholars as Baronius, Tillemont, Cave, R. Mountague (Bishop of Norwich), and Grabe.”" },
  { t = "note", id = "2896", text = "P. xxiii." },
  { t = "p", text = "Without attempting here to decide what degree of historical value belongs to these Documents, it may be proper to observe that the several matters contained in them are so far distinct from one another that they do not necessarily stand or fall together. Such matters are: the celebrated Epistles, the conversion of King Abgar Uchomo, the visit of Thaddæus, and the early prevalence of Christianity at Edessa. With regard to the letters said to have passed between Abgar and our Lord, it seems sufficient, without referring to the internal evidence, to remark, with Lardner and Neander, that it is inconceivable how anything written by Christ should have remained down to the time of Eusebius unknown to the rest of the world[^2897] The conversion of Abgar is a distinct matter of inquiry. But on this again, doubt, to say the least, is cast by the statement that Abgar Bar Manu, who reigned between the years 160 and 170 a.d., is the first king of Edessa on whose coins the usual symbols of the Baal-worship of the country are wanting, these being replaced in his case by the sign of the Cross.[^2898] If this refers to a complete series of the coins of Edessa, the evidence afforded must be considered very strong. For although, to take a parallel instance, “we seek in vain for Christian emblems on the coinage of Constantine, the first Christian emperor,”[^2899] this may readily be accounted for by his preference of military distinction to the humbler honours conferred by his new faith, whilst it does not appear that *anti*-Christian emblems are found, and on the coins of his son and successor Christian emblems do make their appearance. The other two subjects referred to do not lie under the same suspicion. There is nothing in the nature of the case to disprove the visit of Thaddæus (or Addæus)—nothing improbable in the fact itself, whatever judgment may be formed of the details of it presented to us here. If, however, the visit of Thaddæus also should have to be ranked among apocryphal stories, this would not affect the remaining point—that with which we are chiefly concerned in these Documents. “It is certain,” says Neander, “that Christianity was early diffused in this country.” How early, is not so certain. But the evidence furnished by the later portions of these Documents, which there is nothing to contradict and much to confirm, proves that early in the second century Christianity had already made many converts there. The martyrdoms of Sharbil and Barsamya are said to have occurred a.d. 113,[^2900] the year in which Trajan conquered the Parthian kingdom, of which Edessa was a part; and, whilst the pagan element was plainly predominant, we find the Christians sufficiently numerous to have a bishop and presbyters and deacons. This sufficiently falls in with the proof already adduced of the conversion of even a king of Edessa about fifty years later." },
  { t = "note", id = "2897", text = "*Hist. of the Church*, vol. i. p. 109 (Foreign Theol. Lib.)." },
  { t = "note", id = "2898", text = "Bayer, *Historia Edessena e nummis illustrata*, l. iii. p. 173." },
  { t = "note", id = "2899", text = "Humphreys’ *Coin-Collector’s Manual*, p. 364." },
  { t = "note", id = "2900", text = "It should have been 115." },
  { t = "p", text = "To the Documents which are presumably of the ante-Nicene age, Dr. Cureton added two Metrical Homilies by Jacob of Serug, who lived in the next century. But, as they are so closely connected with the most interesting portions of the rest, the martyrdoms, and are besides of considerable merit as compositions, the decision of the editors to insert them will, it is presumed, be approved by most readers. The two supplemental portions, one from the Latin of Simeon Metaphrastes, and the other from Le Vaillant de Florival’s French translation of Moses of Chorene, have also been inserted." },
  { t = "p", text = "The translation of the Syriac portions, although made with Dr. Cureton’s version constantly in sight, may fairly be considered as independent. The only matter in which his authority has been relied on is—in the case of proper names, the supply of the necessary vowels,—for the text is vowelless. And even to this, one exception occurs, in the *Martyrdom of Barsamya*, where “Evaristus” has been adopted instead of his “Erastus.” In regard to the sense, it has been frequently found necessary to differ from him, while a style somewhat freer, though, it is hoped, not less faithful, has been employed. The Metrical Homilies also have been arranged so as to present the appearance of poetry. The results of Dr. Wright’s collation of the text with the mss. have also contributed to the greater correctness of the work." },
  { t = "p", text = "The translator desires very thankfully to acknowledge his obligations to Dr. R. Payne Smith, Regius Professor of Divinity in the University of Oxford,[^2901] the progress of whose *Thesaurus Syriacus* is regarded with so much satisfaction and hope, for his kindness in furnishing much valuable information respecting matters on which the lexicons are silent." },
  { t = "note", id = "2901", text = "Now Dean of Canterbury." },
  { t = "p", text = "The notes marked Tr. are by the translator. The others, where the contrary is not indicated, are, at least in substance, Dr. Cureton’s: though their citation does not always imply approval.[^2902]" },
  { t = "note", id = "2902", text = "The translator takes the opportunity of correcting the error by which the preparation of Tatian’s work in vol. iii. of the Edinburgh Series was ascribed to him. The credit of it is due in the first instance to his lamented friend Mr. J. E. Ryland, at whose request, and subsequently by that of the editors, he undertook to correct the manuscript, but was soon obliged by other engagements to relinquish the task. [The correction was duly made in this series. See vol. ii. pp. 59, 61.]" },
]

[[section]]
id = "the-story-concerning-the-king-of-edessa"
title = "The Story Concerning the King of Edessa."
level = 1
blocks = [
  { t = "h", text = "Ancient Syriac Documents" },
  { t = "h", text = "Relating to the Earliest Establishment of Christianity in Edessa and the Neighbouring Countries." },
  { t = "p", text = "*From the History of the Church.*[^2903]" },
  { t = "note", id = "2903", text = "By Eusebius of Cæsarea.—Tr. The ms. from which this extract from Eusebius is taken is numbered 14,639, fol. 15 b. It is described in Cureton’s *Corpus Ignatianum*, p. 350." },
  { t = "p", text = "The Story[^2904] Concerning the King of Edessa.[^2905]" },
  { t = "note", id = "2904", text = "Book I. chapter the thirteenth.—Tr." },
  { t = "note", id = "2905", text = "Properly *Urrhoi*, or *Orrhoi* (***). It seems probable that the word is connected with *Osrhoene*, the name of the province in which Edessa held an important place, the correct form of which is supposed to be Orrhoene. The name Edessa (***) occurs only once in these Documents, viz., in the “*Acts of Sharbil*,” *sub init*.—Tr." },
  { t = "p", text = "Now the story relating to Thaddæus was on this wise:—" },
  { t = "p", text = "While the Godhead of our Saviour and Lord Jesus Christ was proclaimed among all men by reason of the astonishing mighty-works which He wrought, and myriads, even from countries remote from the land of Judæa, who were afflicted with sicknesses and diseases of every kind, were coming to Him in the hope of being healed, King Abgar[^2906] also, who was renowned among the nations on the east of the Euphrates for his valour, had his body wasting away with a grievous disease, such as there is no cure for among men. And when he heard and was informed of the name of Jesus, and about the mighty works which He did,—for every one alike bore witness concerning Him,—he sent a letter of request by a man belonging to him,[^2907] and besought Him to come and heal him of his disease." },
  { t = "note", id = "2906", text = "“By this title all the toparchs of Edessa were called, just as the Roman emperors were called Cæsars, the kings of Egypt Pharaohs or Ptolemies, the kings of Syria Antiochi.” Assem., *Bibl. Or*., vol. i. p. 261. Assemani adds: “Abgar in Syriac means *lame*.” Moses of Chorene, however, with more probability, derives it from the Armenian *Avag-aïr*, “grand homme, à cause de sa grande mansuétude et de sa sagesse, et de plus, à cause de sa taille.” See below the extract from his *History of Armenia*, book ii. ch. 26." },
  { t = "note", id = "2907", text = "Eusebius has δι᾽ ἐπιστοληφόρου. See note on ταχυδρόμου , on next page.—Tr." },
  { t = "p", text = "But our Saviour at the time that he asked Him did not comply with his request. Yet He deigned to give him[^2908] a letter *in reply:* for He promised him that He would send one of His disciples, and heal his sicknesses, and give salvation[^2909] to him and to all who were connected with him.[^2910] Nor did He delay to fulfil His promise to him: but after He was risen from the place of the dead, and was received into heaven, Thomas[^2911] the apostle, one of the twelve, as by an impulse from God, sent Thaddæus,[^2912] who was himself also numbered among the seventy[^2913] disciples of Christ, to Edessa, to be a preacher and proclaimer of the teaching of Christ; and the promise of Christ was through him fulfilled." },
  { t = "note", id = "2908", text = "Lit. “deemed him worthy of.”—Tr." },
  { t = "note", id = "2909", text = "Gr. σωτηρίαν: and so the Syriac word, meaning “life,” is generally to be translated in this collection.—Tr." },
  { t = "note", id = "2910", text = "Syr. “near to him;” Gr. τῶν προσηκόντων." },
  { t = "note", id = "2911", text = "His real name was Judas Thomas: see p. 8." },
  { t = "note", id = "2912", text = "The name is taken from Eusebius, but in the original Syriac treatises, which follow, he is called Addæus." },
  { t = "note", id = "2913", text = "In *The Teaching of the Apostles* he is said to have been one of the “seventy two apostles.” His name, like that of Thomas, seems to have been the very common one, Judas." },
  { t = "p", text = "Thou hast in writing the evidence of these things, which is taken from the Book of Records[^2914] which was at Edessa: for at that time the kingdom was still standing.[^2915] In the documents, then, which were there, in which was contained whatever was done by those of old down to the time of Abgar, these things also are found preserved down to the present hour. There is, however, nothing to prevent our hearing the very letters themselves, which have been taken by us[^2916] from the archives, and are in words to this effect, translated from Aramaic into Greek." },
  { t = "note", id = "2914", text = "These were kept in the archives of the kingdom, which were transferred by Abgar from Nisibis to Edessa when he made it the capital of his dominions. See Moses Chor. B. ii. ch. 27, *infra*. The archives appear to have been still kept at Edessa in a.d. 550. [Compare this fact with Tertullian’s statement, vol. iii. p. 164.]" },
  { t = "note", id = "2915", text = "The kingdom of Edessa was brought to an end and entirely subjected to the Romans in a.d. 217 or 218." },
  { t = "note", id = "2916", text = "The extract from the archives was probably made by Sextus Julius Africanus, and copied by Eusebius from his *Chronographia*." },
  { t = "p", text = "Copy of the letter which was written by King[^2917] Abgar to Jesus, and sent to Him by the hand of Hananias,[^2918] the Tabularius,[^2919] to Jerusalem:—" },
  { t = "note", id = "2917", text = "Gr. τόπαρχος." },
  { t = "note", id = "2918", text = "Called Hanan in the original Syriac document; and so in Moses Chor.; Eusebius has ᾽Ανανίας, which is copied here." },
  { t = "note", id = "2919", text = "Gr. ταχυδρόμου. But the post held by Hananias must have been one of more dignity than that of a *courier*. He was probably a Secretary of State. In *The Acts of Addæus* (*infra*) he is called, in connection with the name Tabularius, a *sharir*, or confidential servant. It would seem that Tabularius has been confounded with Tabellarius, a letter-carrier.—Tr." },
  { t = "p", text = "“Abgar the Black,[^2920] sovereign[^2921] of the country, to Jesus, the good Saviour, who has appeared in the country of Jerusalem: Peace. I have heard about Thee,[^2922] and about the healing which is wrought by Thy hands without drugs and roots. For, as it is reported, Thou makest the blind to see, and the lame to walk; and Thou cleansest the lepers, and Thou castest out unclean spirits and demons, and Thou healest those who are tormented with lingering diseases, and Thou raisest the dead. And when I heard all these things about Thee, I settled in my mind one of two things: either that Thou art God, who hast come down from heaven, and doest these things or that Thou art the Son of God, and doest these things. On this account, therefore, I have written to beg of Thee that Thou wouldest weary Thyself to come to me, and heal this disease which I have. For I have also heard that the Jews murmur against Thee, and wish to do Thee harm. But I have a city, small and beautiful, which is sufficient for two.”" },
  { t = "note", id = "2920", text = "Or “Abgar Uchomo.” The epithet was peculiar to this King Abgar. He was the fourteenth king: the eleventh was called Abgar Sumoco, or “the Red.” The occasion of the name “Black” is doubtful: it can hardly have arisen from the fact that Abgar was suffering, as Cedrenus asserts, from the black leprosy.—Tr." },
  { t = "note", id = "2921", text = "“Head,” or “chief.”—Tr." },
  { t = "note", id = "2922", text = "Comp. Matt. iv. 24; “And His fame went throughout all Syria,” etc. See also Moses Chor. B. ii. c. 30." },
  { t = "p", text = "Copy of those things which were written[^2923] by Jesus by the hand of Hananias, the Tabularius, to Abgar, sovereign of the country:—" },
  { t = "note", id = "2923", text = "Gr. ἀντιγραφέντα, “written in reply.”" },
  { t = "p", text = "“Blessed is he that hath believed in me, not having seen me. For it is written[^2924] concerning me, that those who see me will not believe in me, and that those will believe who have not seen me, and will be saved. But touching that which thou hast written to me, that I should come to thee—it is meet that I should finish here all that for the sake of which I have been sent and, after I have finished it, then I shall be taken up to Him that sent me; and, when I have been taken up, I will send to thee one of my disciples, that he may heal thy disease, and give salvation to thee and to those who are with thee.”" },
  { t = "note", id = "2924", text = "[John ix. 39, and xx. 29, 31; Hab. i. 5; with Isa. lii. 15, liii. 1.]" },
  { t = "p", text = "To these letters, moreover, is appended the following also in the Aramaic tongue:—" },
  { t = "p", text = "“After Jesus was ascended, Judas Thomas sent to him Thaddæus the apostle, one of the Seventy. And, when he was come, he lodged with Tobias, son of Tobias. And, when the news about him was heard, they made it known to Abgar: “The apostle of Jesus is come hither, as He sent thee word.” Thaddæus, moreover, began to heal every disease and sickness by the power of God, so that all men were amazed. And, when Abgar heard the great and marvellous cures which he wrought, he bethought himself that he was the person about whom Jesus had sent him word and said to him: When I have been taken up, I will send to thee one of my disciples, that he may heal thy disease. So he sent and called Tobias, with whom he was lodging, and said to him: I have heard that a mighty man has come, and has entered in and taken up his lodging in thy house: bring him up, therefore, to me. And when Tobias came to Thaddæus he said to him: Abgar the king has sent and called me, and commanded me to bring thee up to him, that thou mayest heal him. And Thaddæus said: I will go up, because to him have I been sent with power. Tobias therefore rose up early the next day, and took Thaddæus, and came to Abgar." },
  { t = "p", text = "“Now, when they were come up, his princes happened to be standing[^2925] there. And immediately, as he was entering in, a great vision appeared to Abgar on the countenance of Thaddæus the apostle. And, when Abgar saw Thaddæus, he prostrated himself before him.[^2926] And astonishment seized upon all who were standing there: for they had not themselves seen that vision, which appeared to Abgar alone. And he proceeded to ask Thaddæus: Art thou in truth the disciple of Jesus the Son of God, who said to me, I will send to thee one of my disciples, that he may heal thee and give thee salvation? And Thaddæus answered and said: Because thou hast mightily[^2927] believed on Him that sent me, therefore have I been sent to thee; and again, if thou shalt believe on Him, thou shalt have the requests of thy heart. And Abgar said to him: In such wise have I believed on Him, that I have even desired to take an army and extirpate those Jews who crucified Him; were it not that I was restrained by reason of the dominion of the Romans.[^2928] And Thaddæus said: Our Lord has fulfilled the will of His Father; and, having fulfilled it, has been taken up to His Father. Abgar said to him: I too have believed in Him and in His Father. And[^2929] Thaddæus said: Therefore do I lay my hand upon thee in His name. And when he had done this, immediately he was healed of his sickness and of the disease which he had. And Abgar marvelled, because, like as he had heard concerning Jesus, so he saw in deeds by the hand of Thaddæus His disciple: since without drugs and roots he healed him; and not him only, but also Abdu,[^2930] son of Abdu, who had the gout: for he too went in, and fell at his feet,[^2931] and when he prayed over him he was healed. And many other people of their city did he heal, and he did great works, and preached the word of God." },
  { t = "note", id = "2925", text = "Cureton, “were assembled and standing;” nearly as Euseb.: παρόντων καὶ ἑστώτων. But in 2 Sam. xx. 1, the only reference given by Castel for the word *** is used for the Heb. נקרא, “he chanced.”—Tr." },
  { t = "note", id = "2926", text = "***, like the προσεκύνησε of Eusebius, may be rendered “worshipped.”—Tr." },
  { t = "note", id = "2927", text = "***; Gr. μεγάλως, lit. “greatly;” C. “nobly.” But nothing more than *intensity* is necessarily denoted by either word. Compare, for the Syriac, Ps. cxix. 107, 167; Dan. ii. 12.—Tr." },
  { t = "note", id = "2928", text = "Compare the letters of Abgar and Tiberius, *infra*." },
  { t = "note", id = "2929", text = "In another piece, *The Teaching of Addæus*, i.e., Thaddæus, we have a portion of the original Syriac from which Eusebius’ translation was made. The only portions that correspond are: in the present piece, from this place to “—accept that of others,” near the end; and, in the following one, from the beginning to “—that which is not ours.” Some of the variations are worthy of notice." },
  { t = "note", id = "2930", text = "See note 9, p. 657, *infra*." },
  { t = "note", id = "2931", text = "This answers sufficiently well to the Greek: ὁς καὶ αὐτὸς προσελθὼν ὑπὸ τοὺς πόδας αὐτοῦ ἔπεσεν; but, as the original Syriac, p. 12, reads “he too brought his feet to him, and he laid his hands upon them and healed him,” the Greek translation must have been at fault. For *brought* read *presented*.—Tr." },
  { t = "p", text = "“After these things Abgar said to him: Thou, Thaddæus, doest these things by the power of God; we also marvel at them. But in addition to all these things I beg of thee to relate to me the story about the coming of Christ, and in what manner it was; and about His power, and by what power He wrought those things of which I have heard." },
  { t = "p", text = "“And Thaddæus said: For the present I will be silent;[^2932] but, because I have been sent to preach the word of God, assemble me tomorrow all the people of thy city, and I will preach before them, and sow amongst them the word of life; and *will tell them* about the coming of Christ, how it took place; and about His mission,[^2933] for what purpose he was sent by His Father; and about His power and His deeds, and about the mysteries which He spake in the world, and by what power He wrought these things, and about His new preaching,[^2934] and about His abasement and His humiliation, and how He humbled and emptied and abased Himself, and was crucified, and descended to Hades,[^2935] and broke through the enclosure[^2936] which had never been broken through *before*, and raised up the dead, and descended alone, and ascended with a great multitude to His Father.[^2937]" },
  { t = "note", id = "2932", text = "The original Syriac has “I will not hold my peace from declaring this.”" },
  { t = "note", id = "2933", text = "So Euseb. The orig. Syr. has “His sender.”" },
  { t = "note", id = "2934", text = "The orig. Syr. has “the certitude of His preaching.” The error seems to have arisen from the Greek translator confounding *** with ***. More probably with ***, “newness (of his preaching),” which was freely translated by him (περὶ) τῆς καινῆς αὐτοῦ κηρύξεως; and this, again, was by the Syrian re-translator rendered literally, as in the text. The word *certitude* (above) may be rendered *unerring truth*. —Tr." },
  { t = "note", id = "2935", text = "Or “Sheol,” as in Hebrew. The orig. Syr. gives “the place of the dead.”" },
  { t = "note", id = "2936", text = "Eph. ii. 14." },
  { t = "note", id = "2937", text = "Comp. Matt. xxvii. 52." },
  { t = "p", text = "“Abgar, therefore, commanded that in the morning all the people of his city should assemble, and hear the preaching of Thaddæus. And afterwards he commanded gold and silver to be given to him; but he received it not, and said: If we have forsaken that which was our own, how shall we accept that of others?”" },
  { t = "p", text = "These things were done in the year 340.[^2938]" },
  { t = "note", id = "2938", text = "Valesius says that the Edessenes commenced their era with the 117th Olympiad, the first year of the reign of Seleucus. The year 340 corresponds, therefore, with the fifteenth year of Tiberius. It should be the *beginning* of the 117th Olympiad.—Tr." },
  { t = "p", text = "In order, moreover, that these things may not have been translated to no purpose word for word from the Aramaic into Greek, they are placed in their order of time here." },
  { t = "p", text = "*Here* endeth the first book." },
]

[[section]]
id = "the-divine-liturgy-of-the-holy-apostle"
title = "The Divine Liturgy of the Holy Apostle and Evangelist Mark, The Disciple of the Holy Peter."
level = 1
blocks = [
  { t = "h", text = "[^4150][^4151] The Priest." },
  { t = "note", id = "4150", text = "[The only authority for this valuable relic is a single codex of the twelfth century, i.e., the Codex Rossanensis, found at Rossano, in Calabria. It was deposited in the Basilian monastery at Rome, and first published a.d. 1583, at Paris. See Hammond, pp. xlv., li.]" },
  { t = "note", id = "4151", text = "[Elucidation I.]" },
  { t = "p", text = "I. Peace be to all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And to thy spirit." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Pray." },
  { t = "h", text = "The People." },
  { t = "p", text = "Lord, have mercy; Lord, have mercy; Lord, have mercy." },
  { t = "h", text = "The Priest prays secretly:[^4153]" },
  { t = "note", id = "4153", text = "[i e., μυστικω̑ς = arcane.—Hederic.]" },
  { t = "p", text = "We give Thee thanks, yea, more than thanks, O Lord our God, the Father of our Lord and God and Saviour Jesus Christ, for all Thy goodness at all times and in all places, because Thou hast shielded, rescued, helped, and guided us all the days of our lives, and brought us unto this hour, permitting us again to stand before Thee in Thy holy place, that we may implore forgiveness of our sins and propitiation to all Thy people. We pray and beseech Thee, merciful God, to grant in Thy goodness that we may spend this holy day[^4154] and all the time of our lives without sin, in fulness of joy, health, safety, holiness, and reverence of Thee. But all envy, all fear, all temptation, all the influence of Satan, all the snares of wicked men, do Thou, O Lord, drive away from us, and from Thy Holy Catholic and Apostolic Church. Bestow upon us, O Lord, what is good and meet. Whatever sin we commit in thought, word, or deed, do Thou in Thy goodness and mercy be pleased to pardon. Leave us not, O Lord, while we hope in Thee; nor lead us into temptation, but deliver us from the evil one and from his works, through the grace, mercy, and love of Thine only-begotten Son." },
  { t = "note", id = "4154", text = "[This implies that the Eucharist was not (originally) celebrated every day, as a rule. See Justin Martyr, vol. i. note 1, p. 186.]" },
  { t = "h", text = "(In a loud voice.)" },
  { t = "p", text = "Through whom and with whom be glory and power to Thee, in Thy most holy, good, and life-giving Spirit, now, henceforth, and for evermore." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "II. Peace be to all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And to thy spirit." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Pray for the king.[^4155]" },
  { t = "note", id = "4155", text = "Rather “for the emperor,” says Renaudot; and the word βασιλεύς will stand this meaning." },
  { t = "h", text = "The People." },
  { t = "p", text = "Lord, have mercy;[^4156] Lord, have mercy; Lord, have mercy." },
  { t = "note", id = "4156", text = "The (κύριε ἐλέησον) Kyrie Eleëson.]" },
  { t = "h", text = "The Priest prays." },
  { t = "p", text = "O God, Sovereign Lord, the Father of our Lord and God and Saviour Jesus Christ, we pray and beseech Thee to grant that our king may enjoy peace, and be just and brave. Subdue under him, O God, all his adversaries and enemies. Gird on thy shield and armour, and rise to his aid. Give him the victory, O God, that his heart may be set on peace and the praise of Thy holy name, that we too[^4157] in his peaceful reign[^4158] may spend a calm and tranquil life in all reverence and godly fear, through the grace, mercy, and love of Thine only-begotten Son:" },
  { t = "note", id = "4157", text = "[According to 1 Tim. ii. 2.]" },
  { t = "note", id = "4158", text = "[Suits the first years of Diocletian.]" },
  { t = "h", text = "(In a loud voice.)" },
  { t = "p", text = "Through whom and with whom be glory and power to Thee, with Thy most holy, good, and life-giving Spirit, now, henceforth, and for evermore." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "III. Peace be to all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And to thy spirit." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Pray for the papas[^4159] and the bishop." },
  { t = "note", id = "4159", text = "The Patriarch of Alexandria is meant. The word πάπας was used at first to designate all bishops; but its application gradually became more restricted, and so here the Patriarch of Alexandria is called πάπας, as being superior to the bishops of his patriarchate. [See vol. v. p. 154, and vol. vi., Introd.]" },
  { t = "h", text = "The People." },
  { t = "p", text = "Lord, have mercy; Lord, have mercy; Lord, have mercy." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "O Sovereign and Almighty God, the Father of our Lord, God, and Saviour Jesus Christ, we pray and beseech Thee to defend in Thy good mercy our most holy and blessed high priest our Father in God Δ, and our most reverend Bishop Δ. Preserve them for us through many years in peace, while they according to Thy holy and blessed will fulfil the sacred priesthood committed to their care, and dispense aright the word of truth; with all the orthodox bishops, elders, deacons, sub-deacons, readers, singers, and laity, with the entire body of the Holy and only Catholic Church. Graciously bestow upon them peace, health, and salvation. The prayers they offer up for us, and we for them, do Thou, O Lord, receive at Thy holy, heavenly, and reasonable altar. But all the enemies of Thy Holy Church put Thou speedily under their feet, through the grace, mercy, and love of Thine only-begotten Son:" },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "Through whom and with whom be glory and power to Thee, with Thy all-holy, good, and life-giving Spirit, now, henceforth, and for evermore." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "IV. Peace be to all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And to thy spirit." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Stand[^4160] and pray." },
  { t = "note", id = "4160", text = "[See vol. iii. p. 689, this series.]" },
  { t = "h", text = "The People." },
  { t = "p", text = "Lord have mercy (thrice)." },
  { t = "p", text = "The Priest offers up the prayer of entrance,[^4161] and for incense." },
  { t = "note", id = "4161", text = "This is the Little Entrance. [The priest and deacon come from the prothesis bearing the Gospels. See p. 538, supra.]" },
  { t = "h", text = "The Priest." },
  { t = "p", text = "O Sovereign Lord our God, who hast chosen the lamp of the twelve apostles with its twelve lights, and hast sent them forth to proclaim throughout the whole world and teach the Gospel of Thy kingdom, and to heal sickness and every weakness among the people, and hast breathed upon their faces and said unto them, Receive the Holy Spirit the Comforter: whosesoever sins ye remit, they are remitted unto them; and whosesoever sins ye retain, they are retained: Breathe also Thy Holy Spirit upon us Thy servants, who, standing around, are about to enter on Thy holy service,[^4162] upon the bishops, elders, deacons, readers, singers, and laity, with the entire body of the Holy Catholic and Apostolic Church." },
  { t = "note", id = "4162", text = "[Bestowing what is meet.] The text here is defective. Some suppose that a sentence has been lost." },
  { t = "p", text = "From the curse and execration, from condemnation, imprisonment, and banishment, and from the portion of the adversary;" },
  { t = "p", text = "O Lord, deliver us." },
  { t = "p", text = "Purify our lives and cleanse our hearts from all pollution and from all wickedness, that with pure heart and conscience we may offer to Thee this incense for a sweet-smelling savour, and for the remission of our sins and the sins of all Thy people, through the grace, mercy, and love of Thine only-begotten Son:" },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "Through whom and with whom be the glory and the power to Thee, with Thy all-holy, good, and life-giving Spirit, now, henceforth, and for evermore." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "V. Stand." },
  { t = "h", text = "They sing:—" },
  { t = "p", text = "Only-begotten Son and Word,[^4163] etc." },
  { t = "note", id = "4163", text = "Given in full in chap. vi. of the Liturgy of James, p. 538, supra. [It is so worded that it must be dated later than the Council of Ephesus, a.d. 431.]" },
  { t = "h", text = "The Gospel is carried in, and the Deacon says:—" },
  { t = "p", text = "Let us pray." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Peace be to all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And to thy spirit." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Let us pray." },
  { t = "h", text = "The People." },
  { t = "p", text = "Lord, have mercy." },
  { t = "h", text = "The Priest says the prayer of the Trisagion." },
  { t = "p", text = "O Sovereign Lord Christ Jesus, the co-eternal Word of the eternal Father, who wast made in all things like as we are, but without sin, for the salvation of our race; who hast sent forth Thy holy disciples and apostles to proclaim and teach the Gospel of Thy kingdom, and to heal all disease, all sickness among Thy people, be pleased now, O Lord, to send forth Thy light and Thy truth. Enlighten the eyes of our minds, that we may understand Thy divine oracles. Fit us to become hearers, and not only hearers, but doers of Thy word, that we, becoming fruitful, and yielding good fruit from thirty to an hundred fold, may be deemed worthy of the kingdom of heaven." },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "Let Thy mercy speedily overtake us, O Lord. For Thou art the bringer of good tidings, the Saviour and Guardian of our souls and bodies; and we offer glory, thanks, and the *Trisagion* to Thee, the Father, Son, and Holy Ghost, now, henceforth, and for evermore." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen. Holy God, holy mighty, holy immortal. Holy, holy, holy,[^4164] etc." },
  { t = "note", id = "4164", text = "[The *Trisagion* is found in all the liturgies, which proves a common source and original.]" },
  { t = "h", text = "VI. After the Trisagion the Priest makes the sign of the cross over the people, and says:—" },
  { t = "p", text = "Peace be to all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And to thy spirit." },
  { t = "p", text = "Then follow the Let us attend;[^4165] The Apostle and Prologue of the Hallelujah.[^4166] The Deacons, after a prescribed form, say:—" },
  { t = "note", id = "4165", text = "πρόσχωμεν." },
  { t = "note", id = "4166", text = "[The Apostle means that the Epistle is read, and there is a prayer said (μυστικω̑ς), followed by the outburst of Hallelujah.]" },
  { t = "p", text = "Lord, bless us.[^4167]" },
  { t = "note", id = "4167", text = "See note 1, p. 538. [“Sir, bless us” (in ordinary renderings) is a Western form.]" },
  { t = "h", text = "The Priest says:—" },
  { t = "p", text = "May the Lord[^4168] in His mercy bless and help us, now, henceforth, and for evermore." },
  { t = "note", id = "4168", text = "[Here, the deacon’s words having been correctly given, the blessing of the priests shows the force of his expression.]" },
  { t = "p", text = "The Priest, before the Gospel is read, offers incense,[^4169] and says:—" },
  { t = "note", id = "4169", text = "[I have frequently noted the Ante-Nicene ignorance of this rite among Christians, in order to illustrate these later usages as without apostolic warrant. See Irenaus, note 9, p. 484.]" },
  { t = "p", text = "Accept at Thy holy, heavenly, and reasonable altar, O Lord, the incense we offer in presence of Thy sacred glory. Send down upon us in return the grace of Thy Holy Spirit, for Thou art blessed, and let Thy glory encircle us." },
  { t = "h", text = "VII. The Deacon, when he is about to read the Gospel, says:—" },
  { t = "p", text = "Lord, bless us." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "May the Lord, who is the blessed God, bless and strengthen us, and make us hearers of His holy Gospel, now, henceforth, and for evermore. Amen." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Stand and let us hear the holy Gospel." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Peace be to all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And to thy spirit." },
  { t = "h", text = "VIII. The Deacon reads the Gospel, and the Priest says the prayer of the Collect.[^4170]" },
  { t = "note", id = "4170", text = "τὴν συνάπτην." },
  { t = "p", text = "Look down in mercy and compassion, O Lord, and heal the sick among Thy people." },
  { t = "p", text = "May all our brethren who have gone or who are about to go abroad, safely reach their destination in due season." },
  { t = "p", text = "Send down the gracious rain upon the thirsty lands, and make the rivers[^4171] flow in full stream, according to Thy grace." },
  { t = "note", id = "4171", text = "[The waters of the river, rather, with reference to the Nile.]" },
  { t = "p", text = "The fruits of the land do Thou, O Lord, fill with seed and make ripe for the harvest." },
  { t = "p", text = "In peace, courage, justice, and tranquillity preserve the kingdom of Thy servant, whom Thou hast deemed worthy to reign over this land." },
  { t = "p", text = "From evil days, from famine and pestilence, from the assault of barbarians, defend, O Lord, this Christ-loving city, lowly and worthy of Thy compassion, as Thou didst spare Nineveh of old." },
  { t = "p", text = "For Thou art full of mercy and compassion, and rememberest not the iniquities of men against them." },
  { t = "p", text = "Thou hast said through Thy prophet Isaiah,—I will defend this city, to save it for mine own sake, and for my servant David’s sake." },
  { t = "p", text = "Wherefore we pray and beseech Thee to defend in Thy good mercy this city, for the sake of the martyr and evangelist Mark, who has shown us the way of salvation through the grace, mercy, and love of Thine only-begotten Son." },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "Through whom and with whom be glory and power to Thee, with Thy all-holy, good, and life-giving Spirit." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "IX. Begin." },
  { t = "h", text = "Then they say the verse.[^4172] The Deacon says—The three.[^4173]" },
  { t = "note", id = "4172", text = "[The anthem probably.]" },
  { t = "note", id = "4173", text = "Probably by the three are meant three prayers. [See Hammond, note 1, p. 177.]" },
  { t = "h", text = "The Priest." },
  { t = "p", text = "O Sovereign and Almighty God, the Father of our Lord Jesus Christ, we pray and beseech Thee to fill our hearts with the peace of heaven, and to bestow moreover the peace of this life. Preserve for us through many years our most holy and blessed Papas Δ,[^4174] and our most pious Bishop Δ, while they, according to Thy holy and blessed will, peacefully fulfil the holy priesthood committed to their care, and dispense aright the word of truth, with all the orthodox bishops, elders, deacons, sub-deacons,[^4175] readers, singers, with the entire body of the holy Catholic and Apostolic Church. Bless our meetings, O Lord. Grant that we may hold them without let or hindrance, according to Thy holy will. Be pleased to give to us, and Thy servants after us for ever, houses of praise and prayer. Rise, O Lord, and let Thine enemies be scattered. Let all who hate Thy holy name be put to flight. Bless Thy faithful and orthodox people. Multiply them by thousands and tens of thousands. Let no deadly sin prevail against them, or against Thy holy people, through the grace, mercy, and love of Thine only-begotten Son." },
  { t = "note", id = "4174", text = "Patriarch." },
  { t = "note", id = "4175", text = "[Vol. v. p. 417, Elucidation XIV.]" },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "Through whom and with whom be glory and power to Thee, with Thy all-holy, good, and life-giving Spirit." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Peace be to all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And to thy spirit." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Take care that none of the catechumens[^4176]—" },
  { t = "note", id = "4176", text = "Some such word as remain is intentionally omitted. [See p. 540, supra.]" },
  { t = "h", text = "II." },
  { t = "h", text = "Then they sing the Cherubic hymn.[^4177]" },
  { t = "note", id = "4177", text = "[See p. 540, supra.]" },
  { t = "h", text = "X. The Priest offers incense at the entrance,[^4178] and prays:—" },
  { t = "note", id = "4178", text = "The Great Entrance; p. 540, supra.]" },
  { t = "p", text = "O Lord our God, who lackest nothing, accept this incense offered by an unworthy hand, and deem us all worthy of Thy blessing, for Thou art our sanctification, and we ascribe glory to Thee." },
  { t = "h", text = "The holy things are carried to the altar, and the Priest prays thus:—" },
  { t = "p", text = "O holy, highest, awe-inspiring God, who dwellest among the saints, sanctify us, and deem us worthy of Thy reverend priesthood. Bring us to Thy precious altar with a good conscience, and cleanse our hearts from all pollution. Drive away from us all unholy thoughts, and sanctify our souls and minds. Grant that, with reverence of Thee, we may perform the service of our holy fathers, and propitiate Thy presence through all time; for Thou art He who blesseth and sanctifieth all things, and to Thee we ascribe glory and thanks." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "XI. Salute one another." },
  { t = "h", text = "The Priest says the prayer of salutation." },
  { t = "p", text = "O Sovereign and Almighty Lord, look down from heaven on Thy Church, on all Thy people, and on all Thy flock. Save us all, Thy unworthy servants, the sheep of Thy fold. Give us Thy peace, Thy help, and Thy love, and send to us the gift of Thy Holy Spirit, that with a pure heart and a good conscience we may salute one another with an holy kiss, without hypocrisy, and with no hostile purpose, but guileless and pure in one spirit, in the bond of peace and love, one body and one spirit, in one faith, even as we have been called in one hope of our calling, that we may all meet in the divine and boundless love, in Christ Jesus our Lord, with whom Thou art blessed." },
  { t = "h", text = "Then the Priest offers the incense, and says:—" },
  { t = "p", text = "The incense is offered to Thy name. Let it ascend, we implore Thee, from the hands of Thy poor and sinful servants to Thy heavenly altar for a sweet-smelling savour, and the propitiation of all Thy people. For all glory, honour, adoration, and thanks are due unto Thee, the Father, Son, and Holy Ghost, now, henceforth, and for evermore. Amen." },
  { t = "h", text = "After the Salutation,[^4179] the Deacon in a loud voice says:—" },
  { t = "note", id = "4179", text = "[See p. 541 , supra.]" },
  { t = "p", text = "XII. Stand and make the offering duly.[^4180]" },
  { t = "note", id = "4180", text = "[i.e., in due order; in your turn.]" },
  { t = "h", text = "*The Priest*, making the sign of the cross over the disks and chalices, says in a loud voice (the Nicene Creed):—" },
  { t = "p", text = "I believe in one God, etc." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Stand for prayer." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Peace be to all." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Pray for those who present the offering." },
  { t = "h", text = "The Priest says the prayer of the Oblation.[^4181]" },
  { t = "note", id = "4181", text = "τη̑ς προθἐσεως." },
  { t = "p", text = "O Sovereign Lord, Christ Jesus the Word, who art equal in power with the Father and the Holy Spirit, the great high priest; the bread that came down from heaven, and saved our souls from ruin; who gavest Thyself, a spotless Lamb, for the life of the world.…" },
  { t = "p", text = "We pray and beseech Thee, O Lord, in Thy mercy, to let Thy presence rest upon this bread and these chalices[^4182] on the all-holy table, while angels, archangels, and Thy holy priests stand round and minister for Thy glory and the renewing of our souls, through the grace, mercy, and love of Thine only-begotten Son, through whom and with whom be glory and power to Thee." },
  { t = "note", id = "4182", text = "[ὲπι τὸν ἄρτον του̑τον καὶ ἐπὶ τὰ ποτήρια ταυ̑τα. Most note-worthy language in this place.]" },
  { t = "h", text = "And when the People say," },
  { t = "p", text = "And from the Holy Spirit was He made flesh;" },
  { t = "h", text = "The Priest makes the sign of the cross,[^4183] and says:—" },
  { t = "note", id = "4183", text = "[Two after the Creed and one before.]" },
  { t = "p", text = "And was crucified for us." },
  { t = "h", text = "The Priest makes the sign of the cross again,[^4184] and says:—" },
  { t = "note", id = "4184", text = "[Two after the Creed and one before.]" },
  { t = "p", text = "And to the Holy Spirit." },
  { t = "h", text = "III." },
  { t = "p", text = "XIII.[^4185] In like manner also, as after the Creed,[^4186] he makes the sign of the cross upon the People, and says aloud:—" },
  { t = "note", id = "4185", text = "[The Anaphora.]" },
  { t = "note", id = "4186", text = "[I have supposed the adverb ὣσπερ (as) in this place for obvious reasons. It is implied in the text.]" },
  { t = "p", text = "The Lord be with all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And with thy spirit." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Let us lift up our hearts." },
  { t = "h", text = "The People." },
  { t = "p", text = "We lift them up to the Lord." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Let us give thanks to the Lord." },
  { t = "h", text = "The People." },
  { t = "p", text = "It is meet and right.[^4187]" },
  { t = "note", id = "4187", text = "[See p. 543, supra. Here the Edinburgh inserts: “The Deacon.…”]" },
  { t = "h", text = "The Priest begins the Anaphoral prayer." },
  { t = "p", text = "O Lord God, Sovereign and Almighty Father, truly it is meet and right, holy and becoming, and good for our souls, to praise, bless, and thank Thee; to make open confession to Thee by day and night with voice, lips, and heart without ceasing;" },
  { t = "p", text = "To Thee who hast made the heaven, and all that is therein; the earth, and all that is therein; The sea, fountains, rivers, lakes, and all that is therein;" },
  { t = "p", text = "To Thee who, after Thine own image and likeness, hast made man, upon whom Thou didst also bestow the joys of Paradise;" },
  { t = "p", text = "And when he trespassed against Thee, Thou didst neither neglect nor forsake him, good Lord," },
  { t = "p", text = "But didst recall him by Thy law, instruct him by Thy prophets, restore and renew him by this awful, life-giving, and heavenly mystery." },
  { t = "p", text = "And all this Thou hast done by Thy Wisdom and the Light of truth, Thine only-begotten Son, our Lord, God, and Saviour Jesus Christ, Through whom, thanking Thee with Him and the Holy Spirit," },
  { t = "p", text = "We offer this reasonable and bloodless sacrifice, which all nations, from the rising to the setting of the sun, from the north and the south, present to Thee, O Lord; for great is Thy name among all peoples, and in all places are incense, sacrifice, and oblation offered to Thy holy name.[^4188]" },
  { t = "note", id = "4188", text = "[The reference to Mal. i. 11, always noteworthy. Vol. i. p. 484.]" },
  { t = "p", text = "XIV. We pray and beseech Thee, O lover of men, O good Lord,[^4189] remember in Thy good mercy the Holy and only Catholic and Apostolic Church throughout the whole world, and all Thy people, and all the sheep of this fold.[^4190] Vouchsafe to the hearts of all of us the peace of heaven, but grant us also the peace of this life." },
  { t = "note", id = "4189", text = "[Here I supply an omission, in italics.]" },
  { t = "note", id = "4190", text = "[και πάντων τω̑ν ποιμνίων σου John x. 16.]" },
  { t = "p", text = "Guide and direct in all peace the king,[^4191] army, magistrates, councils,[^4192] peoples, and neighbourhoods, and all our outgoings and incomings." },
  { t = "note", id = "4191", text = "Or emperor. [See p. 551, notes 5, 7.]" },
  { t = "note", id = "4192", text = "βουλάς, senates." },
  { t = "p", text = "O King of Peace, grant us Thy peace in unity and love. May we be Thine, O Lord; for we know no other God but Thee, and name no other name but Thine. Give life unto the souls of all of us, and let no deadly sin prevail against us, or against all Thy people." },
  { t = "p", text = "Look down in mercy and compassion, O Lord, and heal the sick among Thy people. Deliver them and us, O Lord, from sickness and disease, and drive away the spirit of weakness." },
  { t = "p", text = "Raise up those who have been long afflicted, and heal those who are vexed with unclean spirits." },
  { t = "p", text = "Have mercy on all who are in prison, or in mines, or on trial, or condemned, or in exile, or crushed by cruel bondage or tribute. Deliver them, O Lord, for Thou art our God, who settest the captives free; who raisest up the downtrodden; who givest hope to the hopeless, and help to the helpless; who liftest up the fallen; who givest refuge to the shipwrecked, and vengeance to the oppressed." },
  { t = "p", text = "Pity, relieve, and restore every Christian soul that is afflicted or wandering." },
  { t = "p", text = "But do Thou, O Lord, the physician of our souls and bodies, the guardian of all flesh, look down, and by Thy saving power heal all the diseases of soul and body." },
  { t = "p", text = "Guide and prosper our brethren who have gone or who are about to go abroad. Whether they travel by land, or river, or lake, by public road, or in whatever way journeying, bring them everywhere to a safe and tranquil haven. Be pleased to be with them by land and sea, and restore them in health and joy to joyful and healthful homes." },
  { t = "p", text = "Ever defend, O Lord, our journey through this life from trouble and storm." },
  { t = "p", text = "Send down rich and copious showers on the dry and thirsty lands." },
  { t = "p", text = "Gladden and revive the face of the earth, that it may spring forth and rejoice in the raindrops." },
  { t = "p", text = "Make the waters of the river flow in full stream." },
  { t = "p", text = "Gladden and revive the face of the earth with the swelling waters." },
  { t = "p", text = "Fill all the channels of the streams, and multiply the fruits of the earth." },
  { t = "p", text = "Bless, O Lord, the fruits of the earth, and keep them safe and unharmed. Fill them with seed, and make them ripe for the harvest." },
  { t = "p", text = "Bless even now, O Lord, Thy yearly crown of blessing for the sake of the poor of Thy people, the widow, the orphan, and the stranger, and for the sake of all of us who have our hope in Thee and call upon Thy holy name; for the eyes of all are upon Thee, and Thou givest them bread in due season." },
  { t = "p", text = "O Thou who givest food to all flesh, fill our hearts with joy and gladness, that at all times, having all sufficiency, we may abound to every good work in Christ Jesus our Lord." },
  { t = "p", text = "O King of kings and Lord of lords, defend the kingdom of Thy servant, our orthodox and Christ-loving sovereign,[^4193] whom Thou hast deemed worthy to reign over this land in peace, courage, and justice." },
  { t = "note", id = "4193", text = "[Evidently after Constantine.]" },
  { t = "p", text = "Subdue under him, O Lord, every enemy and adversary, whether at home or abroad. Gird on Thy shield and armour, and rise to his aid. Draw Thy sword, and help him to fight against them that persecute him. Shield him in the day of battle, and grant that the fruit of his loins may sit upon his throne." },
  { t = "p", text = "Be kind to him, O Lord, for the sake of Thy Holy and Apostolic Church, and all Thy Christ-loving people, that we too in his peaceful reign may live a calm and tranquil life, in all reverence and godliness." },
  { t = "p", text = "O Lord our God, give peace to the souls of our fathers and brethren who have fallen asleep in Jesus, remembering our forefathers of old, our fathers, patriarchs, prophets, apostles, martyrs, confessors, bishops, and the souls of all the holy and just men who have died in the Lord." },
  { t = "p", text = "Especially remember those whose memory we this day celebrate, and our holy father Mark,[^4194] the apostle and evangelist, who has shown us the way of salvation.[^4195]" },
  { t = "note", id = "4194", text = "[Elucid. II. Such passages indicate, of course, how St. Mark’s name came to be given to this liturgy. Here is interpolated:]— Hail! thou art highly favoured; the Lord is with thee; blessed art thou among women, and blessed is the fruit of thy womb, because thou hast brought forth the Saviour of our souls. Aloud. Especially remember our all-holy, pure, and blessed Lady, Mary the Virgin Mother of God." },
  { t = "note", id = "4195", text = "[Hammond’s note is important, p. 182; and see Elucid. II.]" },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Lord, bless us." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "The Lord will bless thee in His grace, now, henceforth, and for evermore." },
  { t = "h", text = "The Deacon reads the record of the dead.[^4196]" },
  { t = "note", id = "4196", text = "τὰ δίπτυχα. [See the note of Hammond, Glossary, p. 378.]" },
  { t = "h", text = "The Priest bows and prays." },
  { t = "p", text = "XV. Give peace, O Sovereign Lord our God, to the souls of all who dwell in the tabernacles of Thy saints. Graciously bestow upon them in Thy kingdom Thy promised blessing, which eye hath not seen, and ear hath not heard, nor has it entered into the heart of man what Thou, O God, hast prepared for those who love Thy holy name. Give peace to their souls, and deem them worthy of the kingdom of heaven.[^4197]" },
  { t = "note", id = "4197", text = "[See Burbidge, p. 34 and passim to p. 253.]" },
  { t = "p", text = "Grant that we may end our lives as Christians, acceptable unto Thee and without sin, and be pleased to give us part and lot with all Thy saints." },
  { t = "p", text = "Accept, O God, by Thy ministering archangels at Thy holy, heavenly, and reasonable altar in the spacious heavens, the thank-offerings of those who offer sacrifice and oblation, and of those who desire to offer much or little, in secret or openly, but have it not to give." },
  { t = "p", text = "Accept the thank-offerings of those who have presented them this day, as Thou didst accept the gifts of Thy righteous Abel:" },
  { t = "h", text = "The Priest offers incense, and says:[^4198]—" },
  { t = "note", id = "4198", text = "[Burbidge, p. 185.]" },
  { t = "p", text = "As Thou didst accept the sacrifice of our father Abraham, the incense of Zacharias, the alms of Cornelius, and the widow’s two mites, accept also the thank-offerings of these, and give them for the things of time the things of eternity, and for the things of earth the things of heaven. Defend, O Lord, our most holy and blessed Papas[^4199] Δ, whom Thou hast fore-ordained to rule over Thy Holy Catholic and Apostolic Church, and our most pious Bishop Δ, that they through many years of peace may, according to Thy holy and blessed will, fulfil the sacred priesthood committed to their care, and dispense aright the word of truth." },
  { t = "note", id = "4199", text = "The Patriarch." },
  { t = "p", text = "Remember the orthodox bishops everywhere, the elders, deacons, sub-deacons, readers, singers, monks,[^4200] virgins, widows, and laity." },
  { t = "note", id = "4200", text = "[Subsequent to Antony Vol. vi. p. 279.]" },
  { t = "p", text = "Remember, O Lord, the holy city[^4201] of our God, Jesus Christ; and the imperial city;[^4202] and this city of ours, and all cities and all lands, and the peace and safety of those who dwell therein in the orthodox faith of Christ." },
  { t = "note", id = "4201", text = "[Jerusalem: a token of antiquity.]" },
  { t = "note", id = "4202", text = "[Rome, no doubt.]" },
  { t = "p", text = "Be mindful, O Lord, of the return of the back-sliding, and of every Christian soul that is afflicted and oppressed, and in need of Thy divine mercy and help." },
  { t = "p", text = "Be mindful, O Lord, of our brethren in captivity. Grant that they may find mercy and compassion with those who have led them captive." },
  { t = "p", text = "Be mindful also of us, O Lord, Thy sinful and unworthy servants, and blot out our sins in Thy goodness and mercy." },
  { t = "p", text = "Be mindful also of me, Thy lowly, sinful, and unworthy servant, and in Thy mercy blot out my sins. Be with us, O Lord, who minister unto Thy holy name." },
  { t = "p", text = "Bless our meetings, O Lord." },
  { t = "p", text = "Utterly uproot idolatry from the world.[^4203]" },
  { t = "note", id = "4203", text = "[Agrees with the partial triumphs of a.d. 325.]" },
  { t = "p", text = "Crush under our feet Satan, and all his wicked influence." },
  { t = "p", text = "Humble now, as at all times, the enemies of Thy Church." },
  { t = "p", text = "Lay bare their pride." },
  { t = "p", text = "Speedily show them their weakness." },
  { t = "p", text = "Bring to naught the wicked plots they contrive against us." },
  { t = "p", text = "Arise, O Lord, and let Thine enemies be scattered, and let all who hate Thy holy name be put to flight." },
  { t = "p", text = "Do Thou bless a thousand times ten thousand Thy faithful and orthodox people while they do Thy holy will." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Let those who are seated stand." },
  { t = "h", text = "The Priest says the following prayer:—" },
  { t = "p", text = "Deliver the captive; rescue the distressed feed the hungry; comfort the faint-hearted, convert the erring; enlighten the darkened; raise the fallen; confirm the wavering; heal the sick; and guide them all, good Lord, into the way of salvation, and into Thy sacred fold. Deliver us from our iniquities; protect and defend us at all times." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Turn to the east." },
  { t = "h", text = "The Priest bows and prays." },
  { t = "p", text = "For Thou art far above all principality, and power, and might, and dominion, and every name that is named, not only in this world, but in that which is to come. Round Thee stand ten thousand times ten thousand, and thousands of thousands of holy angels and hosts of archangels; and Thy two most honoured creatures, the many-eyed cherubim and the six-winged seraphim. With twain they cover their faces, and with twain they cover their feet, and with twain they do fly; and they cry one to another for ever with the voice of praise, and glorify Thee, O Lord, singing aloud the triumphal and thrice-holy[^4204] hymn to Thy great glory:—" },
  { t = "note", id = "4204", text = "The Trisagion." },
  { t = "p", text = "Holy, holy, holy, Lord God of Sabaoth. Heaven and earth are full of Thy glory." },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "Thou dost ever sanctify all men; but with all who glorify Thee, receive also, O Sovereign Lord, our sanctification, who with them celebrate Thy praise, and say:—" },
  { t = "h", text = "The People." },
  { t = "p", text = "Holy, holy, holy Lord." },
  { t = "h", text = "The Priest makes the sign of the cross over the sacred mysteries." },
  { t = "p", text = "XVI. For truly heaven and earth are full of Thy glory, through the manifestation of our Lord and God and Saviour Jesus Christ. Fill, O God, this sacrifice with Thy blessing, through the inspiration of Thy all-holy Spirit. For the Lord Himself, our God and universal King, Christ Jesus, reclining at meat the same night on which He delivered Himself up for our sins and died in the flesh for all, took bread in His holy, pure, and immaculate hands, and lifting His eyes to His Father, our God, and the God of all, gave thanks; and when He had blessed, hallowed, and broken the bread, gave it to His holy and blessed disciples and apostles, saying:—" },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "Take, eat." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Pray earnestly." },
  { t = "h", text = "The Priest (aloud)." },
  { t = "p", text = "For this is my body, which is broken for you, and divided for the remission of sins." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest prays." },
  { t = "p", text = "After the same manner also, when He had supped, He took the cup of wine mingled with water, and lifting His eyes to Thee, His Father, our God, and the God of all, gave thanks; and when He had blessed and filled it with the Holy Spirit, gave it to His holy and blessed disciples and apostles, saying:—" },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "Drink ye all of it." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Pray earnestly again." },
  { t = "h", text = "The Priest (aloud)." },
  { t = "p", text = "For this is my blood of the new testament which is shed for you and for many, and distributed among you for the remission of sins." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest prays thus:—" },
  { t = "p", text = "This do ye in remembrance of me; for as often as ye eat this bread and drink this cup, ye do show forth my death and acknowledge my resurrection and ascension until I come. O Sovereign and Almighty Lord, King of heaven, while we show forth[^4205] the death of Thine only-begotten Son, our Lord, God, and Saviour Jesus Christ, and acknowledge His blessed resurrection from the dead on the third day, we do also openly declare His ascension into heaven, and His sitting on the right hand of Thee, God and Father, and await His second terrible and dreadful coming, in which He will come to judge righteously the quick and the dead, and to render to each man according to his works." },
  { t = "note", id = "4205", text = "[The Oblation, κατ' ἐξοχὴν ]" },
  { t = "p", text = "XVII. O Lord our God, we have placed before Thee what is Thine from Thine own mercies. We pray and beseech Thee, O good and merciful God, to send down from Thy holy heaven, from the mansion Thou hast prepared, and from Thine infinite bosom, the Paraclete Himself,[^4206] holy, powerful, and life-giving, the Spirit of truth, who spoke in the law, the apostles, and prophets; who is everywhere present, and filleth all things, freely working sanctification in whom He will with Thy good pleasure; one in His nature; manifold in His working; the fountain of divine blessing; of like substance[^4207] with Thee, and proceeding from Thee; sitting with Thee on the throne of Thy kingdom, and with Thine only-begotten Son, our Lord and God and Saviour Jesus Christ. Send down upon us also and upon this bread and upon these chalices Thy Holy Spirit, that by His all-powerful and divine influence He may sanctify and consecrate them, and make this bread the body.[^4208]" },
  { t = "note", id = "4206", text = "[The Invocation.]" },
  { t = "note", id = "4207", text = "[On all this, see Hammond, notes 1 and 2, p. 187.]" },
  { t = "note", id = "4208", text = "[The Invocation.]" },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest (aloud)." },
  { t = "p", text = "And this cup the blood of the new testament, of the very Lord, and God, and Saviour, and universal King Christ Jesus." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Deacons, come down." },
  { t = "h", text = "The Priest (aloud)." },
  { t = "p", text = "That to all of us who partake thereof they may tend unto faith, sobriety, healing, temperance, sanctification, the renewal of soul, body, and spirit, participation in the blessedness of eternal life and immortality, the glory of Thy most holy name, and the remission of sins, that Thy most holy, precious, and glorious name may be praised and glorified in this as in all things." },
  { t = "h", text = "The People." },
  { t = "p", text = "As it was and is." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "XVIII. Peace be to all." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Pray." },
  { t = "h", text = "The Priest prays in secret." },
  { t = "p", text = "O God of light, Father of life, Author of grace, Creator of worlds, Founder of knowledge, Giver of wisdom, Treasure of holiness, Teacher of pure prayers, Benefactor of our souls, who givest to the faint-hearted who put their trust in Thee those things into which the angels desire to look: O Sovereign Lord, who hast brought us up from the depths of darkness to light, who hast given us life from death, who hast graciously bestowed upon us freedom from slavery, who hast scattered the darkness of sin within us, through the presence of Thine only-begotten Son, do Thou now also, through the visitation of Thy all-holy Spirit, enlighten the eyes of our understanding, that we may partake without fear of condemnation of this heavenly and immortal food, and sanctify us wholly in soul, body, and spirit, that with Thy holy disciples and apostles we may say this prayer to Thee: Our Father who art in heaven, etc." },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "And grant, O Sovereign Lord, in Thy mercy, that we with freedom of speech, without fear of condemnation, with pure heart and enlightened soul, with face that is not ashamed, and with hollowed lips, may venture to call upon Thee, the holy God who art in heaven, as our Father, and say:—" },
  { t = "h", text = "The People." },
  { t = "p", text = "Our Father who art in heaven, etc." },
  { t = "h", text = "The Priest prays:[^4209]—" },
  { t = "note", id = "4209", text = "[The Embolisms = ejaculations.]" },
  { t = "p", text = "Verily, Lord, Lord, lead us not into temptation, but deliver us from evil; for Thy abundant mercy showeth that we through our great infirmity are unable to resist it. Grant that we may find a way whereby we may be able to withstand temptation; for Thou hast given us power to tread upon serpents, and scorpions, and all the power of the enemy." },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "For Thine is the kingdom and power." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "XIX. Peace be to all." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Bow your heads to Jesus.[^4210]" },
  { t = "note", id = "4210", text = "[Phil. ii. 10. See Hammond, note 1, p. 48.]" },
  { t = "h", text = "The People." },
  { t = "p", text = "Thou, Lord." },
  { t = "h", text = "The Priest prays." },
  { t = "p", text = "O Sovereign and Almighty Lord,[^4211] who sittest upon the cherubim, and art glorified by the seraphim; who hast made the heaven out of waters, and adorned it with choirs of stars; who hast placed an unbodied host of angels in the highest heavens to sing Thy praise for ever; before Thee have we bowed our souls and bodies in token of our bondage. We beseech Thee to repel the dark assaults of sin from our understanding, and to gladden our minds with the divine radiance of Thy Holy Spirit, that, filled with the knowledge of Thee, we may worthily partake of the mercies set before us, the pure body and precious blood of Thine only-begotten Son, our Lord and God and Saviour Jesus Christ. Pardon all our sins in Thy abundant and unsearchable goodness, through the grace, mercy, and love of Thine only-begotten Son:[^4212]" },
  { t = "note", id = "4211", text = "[Prayer of Humble Access.]" },
  { t = "note", id = "4212", text = "[Compare Hammond, p. 79.]" },
  { t = "h", text = "(Aloud.)" },
  { t = "p", text = "Through whom and with whom be glory and power to Thee, with the all-holy, good, and life-giving Spirit." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "XX. Peace be to all." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "With the fear of God." },
  { t = "h", text = "The Priest prays." },
  { t = "p", text = "O holy, highest, awe-inspiring God, who dwellest among the saints, sanctify us by the word of Thy grace and by the inspiration of Thy all-holy Spirit; for Thou hast said, O Lord our God, Be ye holy; for I am holy. O Word of God, past finding out, consubstantial[^4213] and co-eternal with the Father and the Holy Spirit, and sharer of their sovereignty, accept the pure song which cherubim and seraphim, and the unworthy lips of Thy sinful and unworthy servant, sing aloud." },
  { t = "note", id = "4213", text = "[Post-Nicene.]" },
  { t = "h", text = "The People." },
  { t = "p", text = "Lord, have mercy; Lord, have mercy; Lord, have mercy." },
  { t = "h", text = "The Priest (aloud)." },
  { t = "p", text = "Holy things for the holy.[^4214]" },
  { t = "note", id = "4214", text = "[Elucidation III.]" },
  { t = "h", text = "The People." },
  { t = "p", text = "One Father holy, one Son holy, one Spirit holy, in the unity of the Holy Spirit. Amen.[^4215]" },
  { t = "note", id = "4215", text = "Perhaps the Triad is meant at note 10, p. 553.]" },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "For salvation and help." },
  { t = "h", text = "The Priest makes the sign of the cross upon the people, and saith in a loud voice:—" },
  { t = "p", text = "The Lord be with all." },
  { t = "h", text = "The Priest breaks the bread, and saith:—" },
  { t = "p", text = "Praise ye God." },
  { t = "h", text = "The Priest divides it among those present, and saith:—" },
  { t = "p", text = "The Lord will bless and help you through His great mercy." },
  { t = "h", text = "The Priest says:—" },
  { t = "p", text = "Command." },
  { t = "h", text = "The Clergy say:—" },
  { t = "p", text = "The Holy Spirit commands and sanctifies." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Lo, they are sanctified and consecrated." },
  { t = "h", text = "The Clergy." },
  { t = "p", text = "One holy[^4216] Father, etc. (thrice)." },
  { t = "note", id = "4216", text = "[See p. 567, infra.]" },
  { t = "h", text = "The Priest says:—" },
  { t = "p", text = "The Lord be with all." },
  { t = "h", text = "The Clergy." },
  { t = "p", text = "And with thy spirit." },
  { t = "h", text = "The Priest says:—" },
  { t = "p", text = "The Lord Himself hath blessed it." },
  { t = "h", text = "The Priest partakes, and prays." },
  { t = "p", text = "According to Thy loving-kindness,[^4217] etc." },
  { t = "note", id = "4217", text = "[Ps. xlii.]" },
  { t = "h", text = "Or," },
  { t = "p", text = "As the hart panteth after the water-brooks,[^4218] etc." },
  { t = "note", id = "4218", text = "[Ps. xlii. 1.]" },
  { t = "h", text = "When he gives the bread to the clergy, he says:—" },
  { t = "p", text = "The holy body." },
  { t = "h", text = "And when he gives the chalice, he says:—" },
  { t = "p", text = "The precious blood of our Lord, and God, and Saviour." },
  { t = "h", text = "IV." },
  { t = "h", text = "After the service is completed, the Deacon says:—" },
  { t = "p", text = "XXI. Stand for prayer.[^4219]" },
  { t = "note", id = "4219", text = "[Post-Communion.]" },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Peace be to all." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Pray." },
  { t = "h", text = "The Priest says the prayer of thanksgiving." },
  { t = "p", text = "O Sovereign Lord our God, we thank Thee that we have partaken of Thy holy, pure, immortal, and heavenly mysteries, which Thou hast given for our good, and for the sanctification and salvation of our souls and bodies. We pray and beseech Thee, O Lord, to grant in Thy good mercy, that by partaking of the holy body and precious blood of Thine only-begotten Son, we may have faith that is not ashamed, love that is unfeigned, fulness of holiness, power to eschew evil and keep Thy commandments, provision for eternal life, and an acceptable defence before the awful tribunal of Thy Christ:" },
  { t = "h", text = "In a loud voice." },
  { t = "p", text = "Through whom and with whom be glory and power to Thee, with Thy all-holy, good, and life-giving Spirit." },
  { t = "h", text = "The Priest then turns to the people, and says:—" },
  { t = "p", text = "XXII. O mightiest King, co-eternal with the Father, who by Thy might hast vanquished hell and trodden death under foot, who hast bound the strong man, and by Thy miraculous power and the enlightening radiance of Thy unspeakable Godhead hast raised Adam from the tomb, send forth Thy invisible right hand, which is full of blessing, and bless us all." },
  { t = "p", text = "Pity us, O Lord, and strengthen us by Thy divine power." },
  { t = "p", text = "Take away from us the sinful and wicked influence of carnal desire." },
  { t = "p", text = "Let the light shine into our souls, and dispel the surrounding darkness of sin." },
  { t = "p", text = "Unite us to the all-blessed assembly that is well-pleasing unto Thee; for through Thee and with Thee, all praise, honour, power, adoration, and thanksgiving are due unto the Father and the Holy Spirit, now, henceforth, and for evermore." },
  { t = "h", text = "The Deacon." },
  { t = "p", text = "Depart in peace:" },
  { t = "h", text = "The People." },
  { t = "p", text = "In the name of the Lord." },
  { t = "h", text = "The Priest (aloud)." },
  { t = "p", text = "XXIII. The love of God the Father; the grace of the Son, our Lord Jesus Christ; the communion and gift of the All-holy Spirit, be with us all, now, henceforth, and for evermore." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen. Blessed be the name of the Lord." },
  { t = "h", text = "The Priest prays in the sacristy, and says:—" },
  { t = "p", text = "O Lord, Thou hast given us sanctification by partaking of the all-holy body and precious blood of Thine only-begotten Son; give us the grace and gift of the All-holy Spirit. Enable us to lead blameless lives; and guide us unto the perfect redemption, and adoption, and the everlasting joys of the world to come. For Thou art our sanctification, and we ascribe glory unto Thee, the Father, and the Son, and the All-holy Spirit, now, henceforth, and for evermore." },
  { t = "h", text = "The People." },
  { t = "p", text = "Amen." },
  { t = "h", text = "The Priest." },
  { t = "p", text = "Peace be to all." },
  { t = "h", text = "The People." },
  { t = "p", text = "And to thy spirit." },
  { t = "h", text = "The Priest dismisses them, and says:—" },
  { t = "p", text = "May God bless, who blesseth and sanctifieth, who defendeth and preserveth us all through the partaking of His holy mysteries; and who is blessed for ever. Amen." },
]

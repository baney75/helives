[[section]]
id = "part-1"
title = "Part I. Of the blessed Addæus the apostle. From his teaching which he gave in Edessa before Abgar the King and the assembly of the city."
level = 1
blocks = [
  { t = "h", text = "Ancient Syriac Documents." },
  { t = "h", text = "Extracts from Various Books Concerning Abgar the King and Addæus the Apostle." },
  { t = "h", text = "I." },
  { t = "p", text = "*Of the blessed Addæus the apostle. From his teaching which he gave in Edessa before Abgar the King and the assembly of the city.*[^2944]" },
  { t = "note", id = "2944", text = "Taken from Cod. Add. 14,535, fol. i." },
  { t = "p", text = "And, when he had entered the sepulchre, he was raised to life again, and came forth from the sepulchre with many. And those who were guarding the sepulchre saw not how He came forth from the sepulchre; but the watchers from on high—they were the proclaimers and announcers of His resurrection. For, had He not willed, He had not died, because He is Lord of death, the exit from *this life*; nor, had it not pleased Him, would He have put on a body, inasmuch as He is Himself the framer of the body. For that will which led Him to stoop to be born of the Virgin, likewise caused Him further to descend to the suffering of death.—*And a little after* (*we read*): For, although His appearance was that of men, yet His power, and His knowledge, and his authority, were those of God." },
]

[[section]]
id = "part-2"
title = "Part II. From the teaching of Addæus the apostle, which was spoken in the city of Edessa."
level = 1
blocks = [
  { t = "p", text = "*From the teaching of Addæus the apostle, which was spoken in the city of Edessa.*[^2945]" },
  { t = "note", id = "2945", text = "From Cod. Add. 12,155, fol. 53 vers." },
  { t = "p", text = "Ye know that I said unto you, that none of the souls which go forth out of the bodies of men are under *the power of* death, but that they all live and continue to exist, and that there are for them mansions and an abode of rest. For the reasoning *power* of the soul does not cease, nor the knowledge, because it is the image of the immortal God. For it is not without perceptions, after the manner of the bodily frame, which has no perception of that corruption which has acquired dominion over it. Recompense, however, and reward it will not receive apart from its bodily form, because what it experiences belongs not to itself alone, but to the bodily form also in which it dwelt for a time. But the disobedient, who have not known God, will then repent without avail." },
]

[[section]]
id = "part-3"
title = "Part III. From the epistle of Addæus the apostle, which he spake in the city of Edessa."
level = 1
blocks = [
  { t = "p", text = "*From the epistle of Addæus the apostle, which he spake in the city of Edessa.*[^2946]" },
  { t = "note", id = "2946", text = "From Cod. Add. 17,193, fol. 36. See *Teaching of Addæus*, p. 657, *infra*." },
  { t = "p", text = "Give heed to this ministry which ye hold, and with fear and trembling continue ye in it, and minister every day. Minister ye not in it with neglectful habits, but with the discreetness of faith. And let not the praises of Christ cease out of your mouth, and let not any sense of weariness come over you at the season of prayers. Give heed to the verity which ye hold, and to the teaching of the truth which ye have received, and to the teaching of salvation which I commit to you. Because before the tribunal of Christ will it be required of you, when He maketh reckoning with the pastors and overseers, and when He shall take His money from the traders with the usury of what they have taught.[^2947] For He is the Son of a King, and goeth to receive a kingdom, and He will return and come and make a resuscitation to life of all men." },
  { t = "note", id = "2947", text = "Or “of the doctrines.”—Tr." },
]

[[section]]
id = "part-4"
title = "Part IV."
level = 1
blocks = [
  { t = "p", text = "Addæus[^2948] preached at Edessa and in Mesopotamia (he was from Paneus[^2949]) in the days of Abgar the king. And, when he was among the Zophenians, Severus the son of Abgar sent and slew him at Agel Hasna, as also a young man his disciple." },
  { t = "note", id = "2948", text = "Extracts iv. and v. are from Cod. Add. 14,601, fol. 164, written apparently in the eighth century." },
  { t = "note", id = "2949", text = "i.e., Paneas.—Tr." },
]

[[section]]
id = "part-5"
title = "Part V."
level = 1
blocks = [
  { t = "p", text = "71. and Narcissus.[^2950] For they did not suffer that selection of the Seventy-two to be wanting, as likewise neither that of the Twelve. This *man* was of the Seventy-two: perhaps he was a disciple of Addæus the apostle." },
  { t = "note", id = "2950", text = "Extracts iv. and v. are from Cod. Add. 14,601, fol. 164, written apparently in the eighth century." },
]

[[section]]
id = "part-6"
title = "Part VI. From the departure of Marath Mary from the world, and the birth and childhood of our Lord Jesus Christ. Book the Second."
level = 1
blocks = [
  { t = "p", text = "*From the departure*[^2951] *of Marath*[^2952] *Mary from the world, and the birth and childhood of our Lord Jesus Christ. Book the Second.*" },
  { t = "note", id = "2951", text = "From Cod. Add. 16,484, fol. 19. It consists of an apocryphal work on the Virgin, of the fifth or sixth century." },
  { t = "note", id = "2952", text = "i.e., “My Lady” or “Madam” (= mea domina): it is the feminine form of “Mar.”—Tr." },
  { t = "p", text = "In the year three hundred and forty-five, in the month of the latter Tishrin,[^2953] Marath Mary went out from her house, and went to the sepulchre of Christ: because every day she used to go and weep there. But the Jews immediately after the death of Christ seized the sepulchre, and heaped great stones at the door of it. And over the sepulchre and Golgotha they set guards, and commanded them that, if any one should go and pray at the sepulchre or at Golgotha, he should immediately be put to death. And the Jews took away the cross of our Lord, and those two other crosses, and that spear with which our Saviour was struck, and those nails which they drove into His hands and into His feet, and those robes of mockery in which He had been clad; and they hid them: lest, as they said, any one of the kings or of the chief persons should come and inquire concerning the putting to death of Christ." },
  { t = "note", id = "2953", text = "Beginning with the new moon of October. The *former Tishrin* was the month immediately preceding.—Tr." },
  { t = "p", text = "And the guards went in and said to the priests: Mary cometh in the evening and in the morning, and prayeth there. And there was a commotion in Jerusalem on account of Marath Mary. And the priests went to the judge, and said to him: My lord, send and command Mary that she go not to pray at the sepulchre and at Golgotha. And while they were deliberating, lo! letters came from Abgar, the king of the city of Edessa, to Sabina the procurator[^2954] who had been appointed by Tiberius the emperor, and as far as the river Euphrates the procurator Sabina had authority. And, because Addæus the apostle, one of the seventy-two apostles, had gone down and built a church at Edessa, and had cured the disease with which Abgar the king was afflicted—for Abgar the king loved Jesus Christ, and was constantly inquiring about Him; and, when Christ was put to death and Abgar the king heard that the Jews had slain Him on the cross, he was much displeased; and Abgar arose and rode and came as far as the river Euphrates, because he wished to go up against Jerusalem and lay it waste; and, when Abgar came and was arrived at the river Euphrates, he deliberated in his mind: If I pass over, there will be enmity between me and Tiberius the emperor. And Abgar wrote letters and sent them to Sabina the procurator, and Sabina sent them to Tiberius the emperor. In this manner did Abgar write to Tiberius the emperor:—" },
  { t = "note", id = "2954", text = "The Greek ἐπίτροπος is used.—Tr." },
  { t = "p", text = "“From Abgar, the king of the city of Edessa. Much peace to thy Majesty, our lord Tiberius! In order that thy Majesty may not be offended with me, I have not passed over the river Euphrates: for I have been wishing to go up against Jerusalem and lay her waste, forasmuch as she has slain Christ, a skilful healer. But do thou, as a great sovereign who hast authority over all the earth and over us, send and do me judgment on the people of Jerusalem. For be it known to thy Majesty that I desire that thou wilt do me judgment on the crucifiers.”" },
  { t = "p", text = "And Sabina received the letters, and sent them to Tiberius the emperor. And, when he had read them, Tiberius the emperor was greatly incensed, and he desired to destroy and slay all the Jews. And the people of Jerusalem heard it and were alarmed. And the priests went to the governor, and said to him: My lord, send and command Mary that she go not to pray at the sepulchre and Golgotha. The judge said to the priests: Go ye yourselves, and give her what command and what caution ye please." },
]

[[section]]
id = "part-7"
title = "Part VII. From the homily composed by the holy Mar Jacob, the teacher, on the fall of idols."
level = 1
blocks = [
  { t = "p", text = "*From the homily composed by the holy Mar Jacob, the teacher, on the fall of idols.*[^2955]" },
  { t = "note", id = "2955", text = "From Cod. Add. 14,624, apparently written in the ninth century." },
  { t = "p", text = "To Edessa he made his journey, and found in it a great work:" },
  { t = "p", text = "For the king was become a labourer for the church, and was building it." },
  { t = "p", text = "The apostle Addæus stood in it like a builder," },
  { t = "p", text = "And King Abgar laid aside his diadem and builded with him." },
  { t = "p", text = "When apostle and king concurred the one with the other," },
  { t = "p", text = "What idol must not fall before them?" },
  { t = "p", text = "Satan fled to the land of Babylon from the disciples," },
  { t = "p", text = "And the tale of the crucifixion had got before him to the country of the Chaldeans." },
  { t = "p", text = "He said, when they were making sport of the signs of the Zodiac, that he was nothing." },
]

[[section]]
id = "part-8"
title = "Part VIII. From the homily about the town of Antioch."
level = 1
blocks = [
  { t = "p", text = "*From the homily about the town of Antioch.*[^2956]" },
  { t = "note", id = "2956", text = "From Cod. Add. 14,590, of the eighth or ninth century." },
  { t = "p", text = "To Simon was allotted Rome,[^2957] and to John Ephesus; to Thomas India, and to Addæus the country of the Assyrians.[^2958] And, when they were sent each one of them to the district which had been allotted to him, they devoted themselves[^2959] to bring the *several* countries to discipleship." },
  { t = "note", id = "2957", text = "[A note of the Middle Age. The reverse is taught in the Scriptures, but even Hebrew Christians slurred the name of Paul.]" },
  { t = "note", id = "2958", text = "This is probably the correct reading: the printed text means “among the Assyrians.”—Tr." },
  { t = "note", id = "2959", text = "Lit. “set their faces.”—Tr." },
]

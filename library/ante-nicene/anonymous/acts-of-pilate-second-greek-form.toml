[[section]]
id = "prologue"
title = "Prologue."
level = 1
blocks = [
  { t = "h", text = "*Second Greek Form.*" },
  { t = "p", text = "A narrative about the suffering of our Lord Jesus Christ, and His holy resurrection." },
  { t = "p", text = "Written by a Jew, Æneas by name, and translated out of the Hebrew tongue into the Romaic language by Nicodemus, a Roman toparch." },
  { t = "p", text = "After the dissolution of the kingdom of the Hebrews, four hundred years having run their course, and the Hebrews also coming at last under the kingdom of the Romans, and the king of the Romans appointing them a king; when Tiberius Cæsar at last swayed the Roman sceptre, in the eighteenth year of his reign,[^1872] he appointed as king of Judæa, Herod, the son of the Herod who had formerly slaughtered the infants in Bethlehem, and he made Pilate procurator in Jerusalem; when Annas and Caiaphas held the high-priesthood of Jerusalem, Nicodemus, a Roman toparch, having summoned a Jew, Æneas by name, asked him to write an account of the things done in Jerusalem about Christ in the times of Annas and Caiaphas. The Jew accordingly did this, and delivered it to Nicodemus; and he, again, translated it from the Hebrew writing into the Romaic language. And the account is as follows:—" },
  { t = "note", id = "1872", text = "[Compare the first Greek form, prologue and footnote.—R.]" },
]

[[section]]
id = "chapter-1"
title = "Chapter 1."
level = 1
blocks = [
  { t = "p", text = "Chapter 1." },
  { t = "p", text = "Our Lord Jesus Christ having wrought in Judæa many and great and extraordinary miracles, and on account of this being hated by the Hebrews, while Pilate was procurator in Jerusalem, and Annas and Caiaphas high priests, there came of the Jews to the chief priests, Judas, Levi, Nephthalim, Alexander, Syrus, and many others, speaking against Christ. And these chief priests sent them away to say these things to Pilate also. And they went away, and said to him: A man walks about in this city whose father is called Joseph, and his mother Mary; and he calls himself king and Son of God; and being a Jew, he overturns the Scriptures, and does away with the Sabbath. Pilate then asked, in order to learn from them in what manner he did away with the Sabbath. And they answered, saying: He cures the sick on the Sabbath. Pilate says: If he makes the sick whole, he does no evil. They say to him: If he effected the cures properly, small would be the evil; but by using magic he does these things, and by having the demons on his side. Pilate says: To cure a person that is ill is not a diabolic work, but a grace from God." },
  { t = "p", text = "The Hebrews said: We beseech your highness to summon him, in order that thou mayst make accurate inquiry into what we say. Pilate therefore, throwing off his cloak, gave it to one of his officers,[^1873] saying: Go away, and show this to Jesus, and say to him, Pilate the procurator calls thee to come before him. The officer accordingly went away, and finding Jesus, summoned Him, having unfolded on the ground also Pilate’s mantle, and urged Him to walk upon it. And the Hebrews, seeing this, and being greatly enraged, came to Pilate, murmuring against him, how he had deemed Jesus worthy of so great honour." },
  { t = "note", id = "1873", text = "One ms. inserts: by name Rachaab, the messenger." },
  { t = "p", text = "And he, having inquired of the officer who had been sent how he had done so, the officer answered: When thou didst send me to the Jew Alexander, I came upon Jesus entering the gate of the city, sitting upon an ass. And I saw that the Hebrews spread their garments in the way, and the ass walked upon the garments; and others cut branches, and they went forth to meet him, and cried out, Hosanna in the highest! Thus, therefore, it was necessary for me also to do." },
  { t = "p", text = "The Jews, hearing these words, said to him: How didst thou, being a Roman, know what was said by the Hebrews? The officer answered: I asked one of the Hebrews, and he told me these things. Pilate said: What means Hosanna? The Jews said: Save us, O Lord. Pilate answered: Since you confess that your children said so, how now do you bring charges, and say against Jesus what you do say? The Jews were silent, and had nothing to answer.[^1874]" },
  { t = "note", id = "1874", text = "Instead of these four sections, ms. C has a minute account of the suicide of Judas, of which the following specimen may be given:—And he went home to make a halter to hang himself, and he found his wife roasting a cock on the coals. And he says to her: Rise, wife, and get a rope ready for me; for I mean to hang myself, as I deserve. And his wife said to him: Why do you speak like that? And Judas says: Know in truth that I unjustly betrayed my master, etc., and that he is going to rise on the third day; and woe to us! And his wife says: Do not speak or think in that way. It is just as likely as that this cock roasting on the coals will crow, that Jesus will rise, as you say. No sooner said than the cock flapped his wings, and crew thrice. This decided Judas, and he immediately made the halter, and hanged himself. [Themss. of the “Second Greek Form” are designated by Tischendorf (*Evang. Apocry*., pp. lxxii., lxxiii.) as follows: A, a Venice ms., comparatively recent; B., a Paris ms. of the fifteenth century; C. a Venice ms. of the same century.—R.]" },
  { t = "p", text = "Now, as Jesus was coming to Pilate, the soldiers of Pilate adored Him. And others also were standing before Pilate holding standards. And as Jesus was coming, the standards also bowed down, and adored Him. As Pilate, therefore, was wondering at what had happened, the Jews said to him: My lord, it was not the standards that adored Jesus, but the soldiers who were holding them carelessly." },
  { t = "p", text = "Pilate says to the ruler of the synagogue: Choose twelve powerful men, and give them the standards, so that they may hold them firmly. And this having taken place, Pilate ordered the officer to take Jesus outside, and bring Him in again. And as He was coming in, the standards again bowed down, and adored Him. Pilate therefore wondered greatly. But the Jews said: He is a magician, and through that he does these things." },
]

[[section]]
id = "chapter-2"
title = "Chapter 2."
level = 1
blocks = [
  { t = "p", text = "Chapter 2." },
  { t = "p", text = "Pilate says to Jesus: Hearest thou what these testify against thee, and answerest thou not?[^1875] And Jesus answered and said: Every man has power to speak either good or bad, as he wishes; these also, therefore, having power, say what they wish.[^1876]" },
  { t = "note", id = "1875", text = "Matt. xxvii. 13, 14." },
  { t = "note", id = "1876", text = "Comp. John xix. 11." },
  { t = "p", text = "The Jews said to Him: What have we to say about thee? First, that thou wast begotten from sin; second, that on account of thee, when thou wast born, the infants[^1877] were murdered; third, that thy father and thy mother fled into Egypt, because they had no confidence in the people." },
  { t = "note", id = "1877", text = "ms. A, 14,000 infants; B, 44,000 infants." },
  { t = "p", text = "To these the Jews who were there present, God-fearing men, answered and said: We say that his birth is not from sin; for we know that Joseph received into keeping his mother Mary, according to the practice of betrothal. Pilate said: Consequently you lie who say that his birth is from sin. They say again to Pilate: All the people testify that he is a magician. The God-fearing Jews answered and said: We also were at the betrothal of his mother, and we are Jews, and know all his daily life; but that he is a magician, that we do not know. And the Jews that thus said were these: Lazarus, Astharius, Antonius, James, Zaras, Samuel, Isaac, Phinees, Crispus, Dagrippus, Amese, and Judas." },
  { t = "p", text = "Pilate therefore says to them: By the life of Cæsar, I wish you to swear whether the birth of this man is without sin. They answered: Our law lays down that we are to swear not at all, because an oath is great sin. Notwithstanding, by the life of Cæsar we swear that his birth is without sin; and if we lie, order us all to be beheaded. And when they had thus spoken, the Jews that were bringing the charge answered Pilate, and said: And dost thou believe these twelve single Jews more than all the multitude and us, who know for certain that he is a magician and blasphemer, and that he names himself Son of God?" },
  { t = "p", text = "Then Pilate ordered them all to go forth out of the prætorium except the said twelve alone. And when this had been done, Pilate says to them privately: As to this man, it appears that from envy and madness the Jews wish to murder him: for of one thing—that he does away with the Sabbath—they accuse him; but he then does a good work, because he cures the sick. For this, sentence of death is not upon the man. The twelve also say to him: Assuredly, my lord, it is so." },
]

[[section]]
id = "chapter-3"
title = "Chapter 3."
level = 1
blocks = [
  { t = "p", text = "Chapter 3." },
  { t = "p", text = "Pilate therefore went outside in rage and anger, and says to Annas and Caiaphas, and to the crowd who brought Jesus: I take the sun to witness that I find no fault in this man. The crowd answered: If he were not a sorcerer, and a magician, and a blasphemer, we should not have brought him to your highness. Pilate said: Try him yourselves; and since you have a law, do as your law says. The Jews said: Our law permits to put no man to death.[^1878] Pilate says: If you are unwilling to put him to death, how much more am I!" },
  { t = "note", id = "1878", text = "John xix. 6, 7." },
  { t = "p", text = "Then Pilate returned to the palace, and says to Jesus: Tell me, art thou the king of the Jews? Jesus answered: Dost thou say this, or have the other Jews said this to thee, that thou mightst question me? Pilate said: Thou dost not think that I am a Hebrew? I am not a Hebrew. Thy people and the chief priests have delivered thee into my hands; and tell me if thou art king of the Jews? Jesus answered: My kingdom is not of this world; for if my kingdom were in this world, my soldiers would not be unconcerned at my being seized: wherefore my kingdom is not in this world. Pilate says: But art thou a king? Jesus said: Thou hast said: for this was I born, to bear witness to the truth; and if any one be a man of the truth, he believes my word, and does it. Pilate says: What is the truth?[^1879] Jesus answered: The truth is from the heavens. Pilate says: On earth, then, is there no truth? Christ says: I am the truth; and how is the truth judged on earth by those that have earthly power!" },
  { t = "note", id = "1879", text = "John xviii. 33–38." },
]

[[section]]
id = "chapter-4"
title = "Chapter 4."
level = 1
blocks = [
  { t = "p", text = "Chapter 4." },
  { t = "p", text = "Pilate therefore, leaving Christ alone, went outside, and says to the Jews: I find no fault in this man. The Jews answered: Let us tell your highness what he said. He said, I am able to destroy the temple of God, and in three days to build it. Pilate says: And what temple did he say that he was to destroy? The Hebrews say: The temple of Solomon, which Solomon built in forty-six years.[^1880]" },
  { t = "note", id = "1880", text = "Comp. John ii. 20." },
  { t = "p", text = "Pilate says privately to the chief priests and the scribes and the Pharisees: I entreat you, do nothing evil against this man; for if you do evil against him, you will do unjustly: for it is not just that such a man should die, who has done great good to many men. They said to Pilate: If, my lord, he who has dishonoured Cæsar is worthy of death, how much more this *man* who dishonours God!" },
  { t = "p", text = "Then Pilate dismissed them, and they all went outside. Thereupon he says to Jesus: What dost thou wish that I shall do to thee? Jesus says to Pilate: Do to me as is determined. Pilate says: How is it determined? Jesus answered: Moses and the prophets wrote about me being crucified, and rising again. The Hebrews, hearing *this*, said to Pilate: Why do you seek to hear a greater insult out of him against God? Pilate says: These words are not an insult against God, since they are written in the books of the prophets. The Hebrews said: Our Scripture says, If a man offend against a man, that is to say, if he insult him, he is worthy to receive forty strokes with a rod; but if any one insult God, to be stoned.[^1881]" },
  { t = "note", id = "1881", text = "Deut. xxv. 3; Lev. xxiv. 16." },
  { t = "p", text = "Then came a messenger from Procle, the wife of Pilate, to him; and the message said: Take care that thou do not agree that any evil should happen to Jesus the good man; because during this night I have seen fearful dreams on account of him.[^1882] And Pilate spoke to the Hebrews, saying: If you hold as insult against God the words which you declare Jesus to have spoken, take and judge him yourselves according to your law.[^1883] The Jews said to Pilate: We wish that you should crucify him. Pilate says: This is not good." },
  { t = "note", id = "1882", text = "Matt. xxvii. 19." },
  { t = "note", id = "1883", text = "John xviii. 31." },
  { t = "p", text = "And Pilate, turning towards the people, saw many weeping, and said: To me it seems that it is not the wish of all the people that this man should die. The priests and the scribes say: We on this account have brought all the people, that thou mightst have full conviction that all wish his death. Pilate says: For what evil hath he done? The Hebrews said: He says that he is a king, and the Son of God." },
]

[[section]]
id = "chapter-5"
title = "Chapter 5."
level = 1
blocks = [
  { t = "p", text = "Chapter 5." },
  { t = "p", text = "A God-fearing Jew, therefore, Nicodemus by name, stood up in the midst, and said to Pilate: I entreat your highness to permit me to say a few words. Say on, said Pilate. Nicodemus says: I, being present in the synagogue, said to the priests, and the Levites, and the scribes, and the people, What have you to say against this man? This man does many miracles, such as man has never yet done nor will do. Let him go, therefore; and if indeed what he does be from God, it will stand; but if from man, it will be destroyed.[^1884] Just as happened also when God sent Moses into Egypt, and Pharoah king of Egypt told him to do a miracle, and he did it. Then Pharoah had also two magicians, Jannes and Jambres; and they also did miracles by the use of magic art, but not such as Moses did.[^1885] And the Egyptians held these magicians to be gods; but because they were not from God, what they did was destroyed. This Jesus, then, raised up Lazarus, and he is alive. On this account I entreat thee, my lord, by no means to allow this man to be put to death." },
  { t = "note", id = "1884", text = "Comp. Acts v. 38." },
  { t = "note", id = "1885", text = "Ex. vii. 10–14." },
  { t = "p", text = "The Hebrews were enraged against Nicodemus, and said: Mayst thou receive the truth of Jesus, and have a portion with him. Nicodemus says: Amen, amen; be it to me as you say." },
]

[[section]]
id = "chapter-6"
title = "Chapter 6."
level = 1
blocks = [
  { t = "p", text = "Chapter 6." },
  { t = "p", text = "And when Nicodemus had thus spoken, another Hebrew rose up, and said to Pilate: I beg of thee, my lord Pilate, hear me also. Pilate answered: Say what thou wishest. The Hebrew says: I lay sick in bed thirty-eight years; and when he saw me he was grieved, and said to me, Rise, take up thy couch, and go into thine house. And while he was saying the word to me, I rose and walked about. The Hebrews say: Ask him on what day of the week this happened. He says: On Sabbath.[^1886] The Jews said: And consequently we say truly, that he does not keep the Sabbath." },
  { t = "note", id = "1886", text = "John v. 5–9." },
  { t = "p", text = "Another, again, standing in the midst, said: I was born blind; and as Jesus was going along the road, I cried to him, saying, Have mercy upon me, Lord, thou son of David. And he took clay, and anointed mine eyes; and straightway I received my sight.[^1887] Another said: I was crooked; and seeing him, I cried, Have mercy upon me, O Lord. And he took me by the hand, and I was immediately raised.[^1888] Another said: I was a leper, and he healed me merely by a word.[^1889]" },
  { t = "note", id = "1887", text = "John ix. 6, 7." },
  { t = "note", id = "1888", text = "Comp. Acts iii. 7." },
  { t = "note", id = "1889", text = "Luke xvii. 11–19." },
]

[[section]]
id = "chapter-7"
title = "Chapter 7."
level = 1
blocks = [
  { t = "p", text = "Chapter 7." },
  { t = "p", text = "There was found there also a woman named Veronica, and she said: Twelve years I was in an issue of blood, and I only touched the edge of his garment, and directly I was cured.[^1890] The Jews say: Our law does not admit the testimony of a woman.[^1891]" },
  { t = "note", id = "1890", text = "Matt. ix. 20–22." },
  { t = "note", id = "1891", text = "See note 9, p. 419." },
]

[[section]]
id = "chapter-8"
title = "Chapter 8."
level = 1
blocks = [
  { t = "p", text = "Chapter 8." },
  { t = "p", text = "Other men cried: This man is a prophet, and the demons are afraid of him. Pilate says: And how were the demons not at all thus afraid of your parents also? They say: We do not know. Others, again, said: Lazarus, after having been four days in the tomb, he raised by a single word.[^1892] Pilate therefore, hearing of the raising of Lazarus, was afraid, and said to the people: Why do you wish to shed the blood of a just man?" },
  { t = "note", id = "1892", text = "John xi. 43." },
]

[[section]]
id = "chapter-9"
title = "Chapter 9."
level = 1
blocks = [
  { t = "p", text = "Chapter 9." },
  { t = "p", text = "Then he summoned Nicodemus and the twelve God-fearing Jews, and said to them: What do you say that I should do? because the people are in commotion. They say: We do not know: do as thou wilt; but what the people do, they do unjustly, in order to kill him. Pilate again went outside, and said to the people: You know that in the feasts of unleavened bread it is customary that I free on your account one of the criminals kept in custody. I have, then, one malefactor in the prison, a robber named Barabbas. I have also Jesus, who has never done any evil. Which of the two, then, do you wish that I release to you? The people answered: Release to us Barabbas. Pilate says: What then shall I do with Jesus? They say: Let him be crucified.[^1893] Again, others of them cried out: If thou release Jesus, thou art no friend of Cæsar,[^1894] because he calls himself Son of God, and king. And if thou free him, he becomes a king, and will take Cæsar’s kingdom." },
  { t = "note", id = "1893", text = "Matt. xxvii. 15–18, 21–23." },
  { t = "note", id = "1894", text = "John xix. 12." },
  { t = "p", text = "Pilate therefore was enraged, and said: Always has your nation been devilish[^1895] and unbelieving; and ever have you been adversaries to your benefactors. The Hebrews say: And who were our benefactors? Pilate says: God, who freed you out of the hand of Pharaoh, and brought you through the Red Sea as upon dry land, and fed you with quails, and gave you water to drink out of the dry rock, and who gave you a law which, denying God you broke; and if Moses had not stood and entreated God, you would have perished by a bitter death. All these, then, you have forgotten. Thus also, even now, you say that I do not at all love Cæsar, but hate him, and wish to plot against his kingdom." },
  { t = "note", id = "1895", text = "Or, slanderous." },
  { t = "p", text = "And having thus spoken, Pilate rose up from the throne with anger, wishing to flee from them. The Jews therefore cried out, saying: We wish Cæsar to be king over us, not Jesus, because Jesus received gifts[^1896] from the Magi. And Herod also heard this—that there was going to be a king—and wished to put him to death, and for this purpose sent and put to death all the infants that were in Bethlehem. And on this account also his father Joseph and his mother fled from fear of him into Egypt.[^1897]" },
  { t = "note", id = "1896", text = "The word here, χάρισμα, is used in the New Testament only of gifts and graces bestowed by God, and specially of the miraculous gifts imparted to the early Christians by the Holy Ghost. The word in Matt. ii. 11 is δῶρα." },
  { t = "note", id = "1897", text = "Matt. ii. 14–16. [The writer seems to identify Herod the Great and Herod Antipas.—R.]" },
  { t = "p", text = "So then Pilate, hearing *this*, silenced all the people, and said: This, then, is the Jesus whom Herod then sought that he might put him to death? They say to him: Yes. Pilate therefore, having ascertained that he was of the jurisdiction of Herod, as being derived of the race of the Jews, sent Jesus to him. And Herod, seeing Him, rejoiced greatly, because he had been long desiring to see Him, hearing of the miracles which He did. He put on Him, therefore, white garments. Then he began to question Him. But Jesus did not give him an answer. And Herod, wishing to see also some miracle or other done by Jesus, and not seeing it, and also because He did not answer him a single word, sent Him back again to Pilate.[^1898] Pilate, seeing this, ordered his officers to bring water. Washing, then, his hands with the water, he said to the people: I am innocent of the blood of this good man. See you to it, that he is unjustly put to death, since neither I have found a fault in him, nor Herod; for because of this he has sent him back again to me. The Jews said: His blood be upon us, and upon our children.[^1899]" },
  { t = "note", id = "1898", text = "Luke xxiii. 6–11. [The only passage directly interpolated into Luke’s narrative is “as being derived of the race of the Jews.” A curious blunder of the compiler!—R.]" },
  { t = "note", id = "1899", text = "Matt. xxvii. 25." },
  { t = "p", text = "Then Pilate sat down upon his throne to pass sentence. He gave order, therefore, and Jesus came before him. And they brought a crown of thorns, and put it on His head, and a reed into His right hand.[^1900] Then he passed sentence, and said to Him: Thy nation says, and testifies against thee, that thou wishest to be a king. Therefore I decree that they shall beat thee first with a rod forty strokes, as the laws of the kings decree, and that they shall mock thee; and finally, that they shall crucify thee." },
  { t = "note", id = "1900", text = "John xix. 2, 3; Matt. xxvii. 29." },
]

[[section]]
id = "chapter-10"
title = "Chapter 10."
level = 1
blocks = [
  { t = "p", text = "Chapter 10." },
  { t = "p", text = "The sentence to this effect, then, having been passed by Pilate, the Jews began to strike Jesus, some with rods, others with *their* hands, others with *their* feet; some also spat in His face. Immediately, therefore, they got ready the cross, and gave it to Him, and flew to take the road. And thus going along, bearing also the cross, He came as far as the gate of the city of Jerusalem. But as He, from the many blows and the weight of the cross, was unable to walk, the Jews, out of the eager desire they had to crucify Him as quickly as possible, took the cross from Him, and gave it to a man that met them, Simon by name, who had also two sons, Alexander and Rufus. And he was from the city of Cyrene.[^1901] They gave the cross, then, to him, not because they pitied Jesus, and wished to lighten Him of the weight, but because they eagerly desired, as has been said, to put Him to death more speedily." },
  { t = "note", id = "1901", text = "Mark xv. 21." },
  { t = "p", text = "Of His disciples, therefore, John followed Him there. Then he came fleeing to the mother of God,[^1902] and said to her: Where hast thou been, that thou hast not come to see what has happened? She answered: What is it that has happened? John says: Know that the Jews have laid hold of my Master, and are taking Him away to crucify Him. Hearing this, His mother cried out with a loud voice, saying: My son, my son, what evil then hast thou done, that[^1903] they are taking thee away to crucify thee? And she rose up as if blinded,[^1904] and goes along the road weeping. And women followed her—Martha, and Mary Magdalene, and Salome, and other virgins. And John also was with her. When, therefore, they came to the multitude of the crowd, the mother of God says to John: Where is my son? John says: Seest thou Him bearing the crown of thorns, and having His hands bound? And the mother of God, hearing this, and seeing Him, fainted, and fell backwards to the ground, and lay a considerable time. And the women, as many as followed her, stood round her, and wept. And as soon as she revived and rose up, she cried out with a loud voice: My Lord, my son, where has the beauty of thy form sunk? how shall I endure to see thee suffering such things? And thus saying, she tore her face with her nails, and beat her breast. Where are they gone, said she, the good deeds which thou didst in Judæa? What evil hast thou done to the Jews? The Jews, then, seeing her thus lamenting and crying, came and drove her from the road; but she would not flee, but remained, saying: Kill me first, ye lawless Jews." },
  { t = "note", id = "1902", text = "Θεοτόκος— a word used several times by Athanasius (died 373), e.g., in Orat. iii. *Contra Arianos*, c. 14 and 29. The refusal of Nestorius to give this epithet to Mary was the commencement, in 428, of the long struggle between the rival sees of Constantinople and Alexandria. See Haag, *Histoire des Dogmes Chrétiens*, i. 190. The paragraphs about the Θεοτόκος in this chapter are interpolations." },
  { t = "note", id = "1903", text = "Lit., and." },
  { t = "note", id = "1904", text = "Lit., darkened." },
  { t = "p", text = "Then they got safe to the place called Cranium, which was paved with stone;[^1905] and there the Jews set up the cross. Then they stripped Jesus, and the soldiers took His garments, and divided them among themselves; and they put on Him a tattered robe of scarlet, and raised Him, and drew Him up on the cross at the sixth hour of the day. After this they brought also two robbers, the one on His right, the other on His left." },
  { t = "note", id = "1905", text = "A mistaken reference to John xix. 13." },
  { t = "p", text = "Then the mother of God, standing and looking, cried out with a loud voice, saying: My son! my son! And Jesus, turning to her, and seeing John near her, and weeping with the rest of the women, said: Behold thy son! Then He says also to John: Behold thy mother![^1906] And she wept much, saying: For this I weep, my son, because thou sufferest unjustly, because the lawless Jews have delivered thee to a bitter death. Without thee, my son, what will become of me? How shall I live without thee? What sort of life shall I spend? Where are thy disciples, who boasted that they would die with thee? Where those healed by thee? How has no one been found to help thee? And looking to the cross, she said: Bend down, O cross, that I may embrace and kiss my son, whom I suckled at these breasts after a strange manner, as not having known man. Bend down, O cross; I wish to throw my arms round my son. Bend down, O cross, that I may bid farewell to my son like a mother. The Jews, hearing these words, came forward, and drove to a distance both her and the women and John." },
  { t = "note", id = "1906", text = "John xix. 26, 27." },
  { t = "p", text = "Then Jesus cried out with a loud voice, saying: Father, let not this sin stand against them; for they know not what they do.[^1907] Then He says: I thirst. And immediately there ran one of the soldiers, and took a sponge, and filled it with gall and vinegar mixed, and put it on a reed, and gave Jesus to drink. And having tasted it, He would not drink it.[^1908] And the Jews standing and looking on laughed at Him, and said: If thou truly sayst that thou art the Son of God, come down from the cross, and immediately, that we may believe in thee. Others said mocking: Others he saved, others he cured, and he healed the sick, the paralytic, the lepers, the demoniacs, the blind, the lame, the dead; and himself he cannot cure.[^1909]" },
  { t = "note", id = "1907", text = "Luke xxiii. 34; cf. Acts vii. 60." },
  { t = "note", id = "1908", text = "John xix. 28; Matt. xxvii. 48." },
  { t = "note", id = "1909", text = "Comp. Matt. xxvii. 40–42." },
  { t = "p", text = "In the same manner also, the robber crucified on His left hand said to Him: If thou art the Son of God, come down and save both thyself and us. His name was Gistas. And he that was crucified on the right, Dysmas by name, reproved that robber, saying: O wretched and miserable man, dost thou not fear God? We suffer the due punishment of what we have done; but this man has done no evil at all. And turning to Jesus, he says to Him: Lord, when Thou shalt reign do not forget me. And He said to him: To-day, I tell thee truth, I shall have thee in paradise with me.[^1910]" },
  { t = "note", id = "1910", text = "Luke xxiii. 39–43. ms. C here inserts the early history of the robber Dysmas. [See note 3, p. 426.—R.]" },
]

[[section]]
id = "chapter-11"
title = "Chapter 11."
level = 1
blocks = [
  { t = "p", text = "Chapter 11." },
  { t = "p", text = "Then Jesus, crying out with a loud voice, Father, into Thy hands I shall commit my spirit, breathed His last.[^1911] And immediately one could see the rocks rent: for there was an earthquake over all the earth; and from the earthquake being violent and great, the rocks also were rent. And the tombs of the dead were opened, and the curtain of the temple was rent, and there was darkness from the sixth hour till the ninth. And from all these things that had happened the Jews were afraid, and said: Certainly this was a just man. And Longinus, the centurion who stood by, said: Truly this was a son of God. Others coming and seeing Him, beat their breasts from fear, and again turned back.[^1912]" },
  { t = "note", id = "1911", text = "Luke xxiii. 46." },
  { t = "note", id = "1912", text = "Comp. Luke xxiii. 44–49." },
  { t = "p", text = "And the centurion having perceived all these so great miracles, went away and reported them to Pilate. And when he heard, he wondered and was astonished, and from his fear and grief would neither eat nor drink that day. And he sent notice, and all the Sanhedrin came to him as soon as the darkness was past; and he said to the people: You know how the sun has been darkened; you know how the curtain has been rent. Certainly I did well in being by no means willing to put to death the good man. And the malefactors said to Pilate: This darkness is an eclipse of the sun, such as has happened also at other times. Then they say to him: We hold the feast of unleavened bread to-morrow; and we entreat thee, since the crucified are still breathing, that their bones be broken, and that they be brought down. Pilate said: It shall be so. He therefore sent soldiers, and they found the two robbers yet breathing, and they broke their legs; but finding Jesus dead, they did not touch Him at all, except that a soldier speared Him in the right side, and immediately there came forth blood and water.[^1913]" },
  { t = "note", id = "1913", text = "John xix. 31–34." },
  { t = "p", text = "And as the *day of the* preparation[^1914] was drawing towards evening, Joseph, a man well-born and rich, a God-fearing Jew, finding Nicodemus, whose sentiments his foregoing speech had shown, says to him: I know that thou didst love Jesus when living, and didst gladly hear his words, and I saw thee fighting with the Jews on his account. If, then, it seem good to thee, let us go to Pilate, and beg the body of Jesus for burial, because it is a great sin for him to lie unburied. I am afraid, said Nicodemus, lest Pilate should be enraged, and some evil should befall me. But if thou wilt go alone, and beg the dead, and take him, then will I also go with thee, and help thee to do everything necessary for the burial. Nicodemus having thus spoken, Joseph directed his eyes to heaven, and prayed that he might not fail in his request; and he went away to Pilate, and having saluted him, sat down. Then he says to him: I entreat thee, my lord, not to be angry with me, if I shall ask anything contrary to what seems good to your highness. And he said: And what is it that thou askest? Joseph says: Jesus, the good man whom through hatred the Jews have taken away to crucify, him I entreat that thou give me for burial. Pilate says: And what has happened, that we should deliver to be honoured again the dead body of him against whom evidence of sorcery was brought by his nation, and who was in suspicion of taking the kingdom of Cæsar, and so was given up by us to death? And Joseph, weeping and in great grief, fell at the feet of Pilate, saying: My lord, let no hatred fall upon a dead man; for all the evil that a man has done should perish with him in his death. And I know your highness, how eager thou wast that Jesus should not be crucified, and how much thou saidst to the Jews on his behalf, now in entreaty and again in anger, and at last how thou didst wash thy hands, and declare that thou wouldst by no means take part with those who wished him to be put to death; for all which *reasons* I entreat thee not to refuse my request. Pilate, therefore, seeing Joseph thus lying, and supplicating, and weeping, raised him up, and said: Go, I grant thee this dead man; take him, and do whatever thou wilt." },
  { t = "note", id = "1914", text = "[Or simply, “the Preparation;” comp. Matt. xxvii. 62, and elsewhere, in the Rev. Vers.—R.]" },
  { t = "p", text = "And then Joseph, having thanked Pilate, and kissed his hands and his garments, went forth, rejoicing indeed in heart as having obtained his desire, but carrying tears in his eyes. Thus also, though grieved, he was glad. Accordingly he goes away to Nicodemus, and discloses to him all that had happened. Then, having bought myrrh and aloes a hundred pounds, and a new tomb,[^1915] they, along with the mother of God and Mary Magdalene and Salome, along with John, and the rest of the women, did what was customary for the body with white linen, and placed it in the tomb.[^1916]" },
  { t = "note", id = "1915", text = "Comp. Matt. xxvii. 60." },
  { t = "note", id = "1916", text = "John xix. 38–42." },
  { t = "p", text = "And the mother of God said, weeping: How am I not to lament thee, my son? How should I not tear my face with my nails? This is that, my son, which Symeon the elder foretold to me when I brought thee, an infant of forty days old, into the temple. This is the sword which now goes through my soul.[^1917] Who shall put a stop to my tears, my sweetest son? No one at all except thyself alone, if, as thou saidst, thou shalt rise again in three days." },
  { t = "note", id = "1917", text = "Luke ii. 35." },
  { t = "p", text = "Mary Magdalene said, weeping: Hear, O peoples, tribes, and tongues, and learn to what death the lawless Jews have delivered him who did them ten thousand good deeds. Hear, and be astonished. Who will let these things be heard by all the world? I shall go alone to Rome, to the Cæsar. I shall show him what evil Pilate hath done in obeying the lawless Jews. Likewise also, Joseph lamented, saying: Ah, me! sweetest Jesus, most excellent of men, if indeed it be proper to call thee man, who hast wrought such miracles as no man has ever done. How shall I enshroud thee? How shall I entomb thee? There should now have been here those whom thou fedst with a few loaves; for thus should I not have seemed to fail in what is due." },
  { t = "p", text = "Then Joseph, along with Nicodemus, went home; and likewise also the mother of God, with the women, John[^1918] also being present with them." },
  { t = "note", id = "1918", text = "It is to be observed that John’s Gospel is much more frequently quoted in this book than any of the others." },
]

[[section]]
id = "chapter-12"
title = "Chapter 12."
level = 1
blocks = [
  { t = "p", text = "Chapter 12." },
  { t = "p", text = "When the Jews were made acquainted with these things done by Joseph and Nicodemus, they were greatly stirred up against them. And the chief priests Annas and Caiaphas sent for Joseph, and said: Why hast thou done this service to Jesus? Joseph says: I know that Jesus was a man just, and true, and good in all respects; and I know also that you, through hatred, managed to murder him: and therefore I buried him. Then the high priests were enraged, and laid hold of Joseph, and threw him into prison, and said to him: If we had not to-morrow the feast of unleavened bread, tomorrow also should we have put thee, like him, to death; but being kept in the meantime, early in the morning of the Lord’s day[^1919] thou shalt be given up to death. Thus they spoke, and affixed their seal to the prison, having secured it by fastenings of all sorts." },
  { t = "note", id = "1919", text = "Observe the anachronism." },
  { t = "p", text = "Thus, therefore, when the Preparation was ended, early on the Sabbath the Jews went away to Pilate, and said to him: My lord, that deceiver said, that after three days he should rise again. Lest, therefore, his disciples should steal him by night, and lead the people astray by such deceit, order his tomb to be guarded. Pilate therefore, upon this, gave them five hundred soldiers, who also sat round the sepulchre so as to guard it, after having put seals upon the stone of the tomb.[^1920]" },
  { t = "note", id = "1920", text = "Matt. xxvii. 62–66." },
  { t = "p", text = "The Lord’s day, then, having dawned, the chief priests, along with the Jews, called a council, and sent to take Joseph out of the prison, in order to put him to death. But having opened it, they found him not. And they were astonished at this—how, with the doors shut, and the bolts safe, and the seals unbroken, Joseph had disappeared." },
]

[[section]]
id = "chapter-13"
title = "Chapter 13."
level = 1
blocks = [
  { t = "p", text = "Chapter 13." },
  { t = "p", text = "And upon this there came up one of the soldiers guarding the tomb, and he said in the synagogue: Learn that Jesus has risen. The Jews say: How? And he said: First there was an earthquake; then an angel of the Lord, clothed with lightning, came from heaven, and rolled the stone from the tomb, and sat upon it. And from fear of him, all of us soldiers became as dead, and were able neither to flee nor speak. And we heard the angels saying to the women who came there to see the tomb: Be not you afraid, for I know that you seek Jesus. He is not here, but is risen, as He told you before. Bend down and see the tomb where His body lay; but go and tell His disciples that He is risen from the dead, and let them go into Galilee, for there shall they find Him. For this reason I tell you this first.[^1921]" },
  { t = "note", id = "1921", text = "Matt. xxviii. 1–8." },
  { t = "p", text = "The Jews say to the soldiers: What sort of women were they who came to the tomb? and why did you not lay hold of them? The soldiers say: From the fear and the mere sight of the angel, we were able neither to speak nor move. The Jews said: As the God of Israel liveth, we do not believe a word you say. The soldiers say: Jesus did so great wonders, and you believed not, and are you going to believe us? You say truly that God liveth; and certainly he whom you crucified truly liveth. But we have heard that you had Joseph shut up in the prison, and that you afterwards opened the doors, and did not find him. Do you then present Joseph, and so we also shall present Jesus. The Jews say: Joseph, that fled from the prison, you will find in Arimathæa, his own country. And the soldiers say: Go you too into Galilee, and you will find Jesus, as the angel said to the women." },
  { t = "p", text = "At these *words* the Jews were afraid, and said to the soldiers: See that you tell this story to nobody, or all will believe in Jesus. And for this reason they gave them also much money. And the soldiers said: We are afraid lest by any chance Pilate hear that we have taken money, and he will kill us. And the Jews said: Take it; and we pledge ourselves that we shall speak to Pilate in your defence. Only say that you were asleep, and in your slumber the disciples of Jesus came and stole him from the tomb. The soldiers therefore took the money, and said as they were bid. And up to this day this same lying tale is told among the Jews.[^1922]" },
  { t = "note", id = "1922", text = "Matt. xxviii. 11–15." },
]

[[section]]
id = "chapter-14"
title = "Chapter 14."
level = 1
blocks = [
  { t = "p", text = "Chapter 14." },
  { t = "p", text = "And a few days after there came from Galilee to Jerusalem three men. One of them was a priest, by name Phinees; the second a Levite, by name Aggai; and the third a soldier, by name Adas. These came to the chief priests, and said to them and to the people: Jesus, whom you crucified, we have seen in Galilee with his eleven disciples upon the Mount of Olives, teaching them, and saying, Go into all the world, and proclaim the good news; and whosoever will believe and be baptized shall be saved; but whosoever will not believe shall be condemned. And having thus spoken, he went up into heaven.[^1923] And both we and many others of the five hundred[^1924] besides were looking on." },
  { t = "note", id = "1923", text = "Mark xvi. 16." },
  { t = "note", id = "1924", text = "1 Cor. xv. 6." },
  { t = "p", text = "And when the chief priests and the Jews heard these things, they said to these three: Give glory to the God of Israel, and repent of these lies that you have told. They answered: As the God of our fathers Abraham, Isaac, and Jacob liveth, we do not lie, but tell you the truth. Then the high priest spoke, and they brought the old *covenant* of the Hebrews out of the temple, and he made them swear, and giving them also money, he sent them into another place, in order that they might not proclaim in Jerusalem the resurrection of Christ." },
  { t = "p", text = "And when these stories had been heard by all the people, the crowd came together into the temple, and there was a great commotion. For many said: Jesus has risen from the dead, as we hear, and why did you crucify him? And Annas and Caiaphas said: Do not believe, ye Jews, what the soldiers say; and do not believe that they saw an angel coming down from heaven. For we have given money to the soldiers, in order that they should not tell such tales to any one; and thus also have the disciples of Jesus given them money, in order that they should say that Jesus has risen from the dead." },
]

[[section]]
id = "chapter-15"
title = "Chapter 15."
level = 1
blocks = [
  { t = "p", text = "Chapter 15." },
  { t = "p", text = "Nicodemus says: O children of the inhabitants of Jerusalem, the prophet Helias went up into the height of heaven with a fiery chariot, and it is nothing incredible if Jesus too has risen; for the prophet Helias was a prototype of Jesus, in order that you, hearing that Jesus has risen, might not disbelieve. I therefore say and advise, that it is befitting that we send soldiers into Galilee, to that place where these men testify that they saw him with his disciples, in order that they may go round about and find him, and that thus we may ask pardon of him for the evil which we have done to him. This proposal pleased them; and they chose soldiers, and sent them away into Galilee. And Jesus indeed they did not find; but they found Joseph in Arimathæa." },
  { t = "p", text = "When, therefore, the soldiers had returned, the chief priests, having ascertained that Joseph was found, brought the people together, and said: What shall we do to get Joseph to come to us? After deliberating, therefore, they wrote to him a letter to the following effect:—O father Joseph, peace *be* to thee and all thy house, and thy friends! We know that we have offended against God, and against thee His servant. On account of this, we entreat thee to come here to us thy children. For we have wondered much how thou didst escape from the prison, and we say in truth that we had an evil design against thee. But God, seeing that our designs against thee were unjust, has delivered thee out of our hands. But come to us, for thou art the honour of our people." },
  { t = "p", text = "This letter the Jews sent to Arimathæa, with seven soldiers, friends of Joseph. And they went away and found him; and having respectfully saluted him, as they had been ordered, they gave him the letter. And after receiving it and reading it, he glorified God, and embraced the soldiers; and having set a table, ate and drank with them during all the day and the night." },
  { t = "p", text = "And on the following day he set out with them to Jerusalem; and the people came forth to meet him, and embraced him. And Nicodemus received him into his own house. And the day after, Annas and Caiaphas, the chief priests, having summoned him to the temple, said to him: Give glory to the God of Israel, and tell us the truth. For we know that thou didst bury Jesus; and on this account we laid hold of thee, and locked thee up in the prison. Thereafter, when we sought to bring thee out to be put to death, we did not find thee, and we were greatly astonished and afraid. Moreover, we prayed to God that we might find thee, and ask thee. Tell us therefore the truth." },
  { t = "p", text = "Joseph said to them: In the evening of the Preparation, when you secured me in prison, I fell a-praying throughout the whole night, and throughout the whole day of the Sabbath. And at midnight I see the prison-house that four angels lifted it up,[^1925] holding it by the four corners. And Jesus came in like lightning, and I fell to the ground from fear. Taking hold of me, therefore, by the hand, he raised me, saying, Fear not, Joseph. Thereafter, embracing me, he kissed me, and said, Turn thyself, and see who I am. Turning myself, therefore, and looking, I said, My lord, I know not who thou art. He says, I am Jesus, whom thou didst bury the day before yesterday. I say to him, Show me the tomb, and then I shall believe. He took me, therefore, by the hand, and led me away to the tomb, which had been opened. And seeing the linen and the napkin, and recognising him, I said, Blessed is he that cometh in the name of the Lord;[^1926] and I adored him. Then taking me by the hand, and accompanied by the angels, he brought me to my house in Arimathæa, and said to me, Sit here for forty days; for I go to my disciples, in order that I may enable them fully to proclaim my resurrection." },
  { t = "note", id = "1925", text = "ἐσίκωσαν, which should be ἐσήκωσαν, is a modern Greek word, the aorist of σηκόνω." },
  { t = "note", id = "1926", text = "Ps. cxviii. 26; Matt. xxi. 9." },
]

[[section]]
id = "chapter-16"
title = "Chapter 16."
level = 1
blocks = [
  { t = "p", text = "Chapter 16." },
  { t = "p", text = "When Joseph had thus spoken, the chief priests cried out to the people: We know that Jesus had a father and mother; how can we believe that he is the Christ? One of the Levites answered and said: I know the family of Jesus, noble-minded men,[^1927] great servants of God, and receiving tithes from the people of the Jews. And I know also Symeon the elder, that he received him when he was an infant, and said to him: Now thou sendest away Thy servant, O Lord." },
  { t = "note", id = "1927", text = "Or, literally, men of good family." },
  { t = "p", text = "The Jews said: Let us now find the three men that saw him on the Mount of Olives, that we may question them, and learn the truth more accurately. They found them, and brought them before all, and made them swear to tell the truth. And they said: As the God of Israel liveth, we saw Jesus alive on the Mount of Olives, and going up into heaven." },
  { t = "p", text = "Then Annas and Caiaphas took the three apart, one by one, and questioned them singly in private. They agreed with one another, therefore, and gave, even the three, one account. The chief priests answered, saying: Our Scripture says that every word shall be established by two or three witnesses.[^1928] Joseph, then, has confessed that he, along with Nicodemus, attended to his body, and buried him, and how it is the truth that he has risen.[^1929]" },
  { t = "note", id = "1928", text = "Deut. xix. 15; Matt. xviii. 16." },
  { t = "note", id = "1929", text = "This last clause would be better as a question: And how is it the truth that he has risen?" },
]

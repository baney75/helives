id = "rhodon"
title = "Rhodon."
level = 1
blocks = [
  { t = "p", text = "[^3717] [a.d. 180.] This Rhodon[^3718] was supposed by St. Jerome to have been the author of the work against the Cataphrygians, ascribed to Asterius Urbanus more probably.[^3719] Eusebius[^3720] gives us the fragment from his work against Marcion, addressed to Callistion, which is here translated. He tells us that he was a pupil of Tatian, and expresses an intention of furnishing original solutions of Scriptural problems stated by Tatian,[^3721] and by that author explained in a manner apparently unsatisfactory. He also appears to have written against the blasphemous Apelles,[^3722] whose *Hexaëmeron* was an attempt to refute Moses; but whether he also fulfilled his promise concerning an ᾽Επίλυσις of Tatian’s Problems (or Questions), seems doubtful. Routh has devoted to the fragment here translated six pages of notes,[^3723] which he subjoins to the Greek text (of Eusebius) and a Latin version of the same." },
  { t = "note", id = "3717", text = "In Eusebius, *Hist. Eccl*., v. 13." },
  { t = "note", id = "3718", text = "Or Rhodo." },
  { t = "note", id = "3719", text = "Vol. vii. pp. 333–338, this series, where I neglected to insert a reference to Routh, *Rel. Sac*., vol. ii. pp. 183–217." },
  { t = "note", id = "3720", text = "*H. E*., book v. cap. 13." },
  { t = "note", id = "3721", text = "Vol. ii. p. 62, this series." },
  { t = "note", id = "3722", text = "See Origen, vol. iv. p. 567, this series." },
  { t = "note", id = "3723", text = "*Rel. Sac*., vol. i. pp. 437–446." },
  { t = "p", text = "Wherefore also they[^3724] disagree among themselves, maintaining as they do an opinion which has no consistency with itself. For one of their herd, Apelles, who prides himself on the strictness of his life,[^3725] and on his age, admits that there is *only* one first principle,[^3726] yet says that the prophecies *have come* from an opposing spirit, in which opinion he is influenced by the responses of a soothsaying[^3727] maid named Philumene. But others, among whom are Potitus and Basilicus, like Marcion[^3728] himself, introduce two first principles. These men, following the Pontic wolf, and not being able to discover any more than he the division of things, have had to recourse to rash assertion, and declared the existence of two first principles simply and without proof. Others of them, again, drifting *from bad* to worse, assume not two only, but even three natures. Of these men the leader and champion is Syneros, as those who adopt his teaching say.…" },
  { t = "note", id = "3724", text = "The Marcionites." },
  { t = "note", id = "3725", text = "Πολιτείᾳ. See Migne’s note." },
  { t = "note", id = "3726", text = "᾽Αρχήν. [See vol. vii. p. 365, this series.]" },
  { t = "note", id = "3727", text = "Δαιμονώσης." },
  { t = "note", id = "3728", text = "Some copies have “Marcion *the sailor*,” and so Tertullian (*de Præscriptionibus*) speaks of him. [Vol. iii. cap. 30, p. 257, this series.]" },
  { t = "p", text = "For the old man Apelles entered into conversation with us, and was convicted of uttering many false opinions. For example, he asserted that men should on no account examine into their creed,[^3729] but that every one ought to continue to the last in the belief he has once adopted. For he declared that those who had rested their hope on the Crucified One would be saved, provided only they were found living in the practice of good works. But the most perplexing of all the doctrines laid down by him was, as we have remarked before, what he said concerning God: for he affirmed that there was *only* one first principle, precisely as our own faith teaches.…" },
  { t = "note", id = "3729", text = "Τὸν λόγον." },
  { t = "p", text = "On asking him, “Where do you get proof of this? or how are you able to assert that there is *only* one first principle? tell us,”—he said that the prophecies refuted themselves, because they had uttered nothing at all that was true: for that they were discordant and false, and self-contradictory. As to the question, “How does it appear that there is *only* one first principle?” he said he could not tell, only he was impelled to that belief. On my thereupon conjuring him to speak the truth, he solemnly declared that he was expressing his real sentiments; and that he did not know “how” there could be one uncreated God, but that he believed the fact. Here I burst into laughter and rebuked him, because he professed to be a teacher, and yet was unable to confirm *by arguments* what he taught." },
]

[[section]]
id = "chapter-5-2"
title = "Chapter V. Appendix. The Civil and Military Government of Egypt in the Lifetime of Athanasius."
level = 1
blocks = [
  { t = "p", text = "The name Egypt in the fourth century was applied firstly to the ‘diocese’ or group of provinces governed by the Præfectus Ægypti or ‘Præfectus Augustalis,’ secondly to the Delta or Ægyptus Propria, one of the provinces of which the diocese was made up. These provinces (Ammian. Marc. XXII. xvi.) were originally three in number: Egypt proper, Libya, and the Thebais. During our period they became five, firstly by the separation of the Eastern Delta from Egypt proper under the name of Augustamnica in 341 (*infr*. pp. 130, 504, note 17a); secondly by the subdivision of Libya (at an uncertain date) into Hither Libya (Libya ‘Inferior,’ or ‘Siccior’), and the Pentapolis or Libya Superior of which Ptolemais was the capital. At a later date still the Heptanomis was separated from ‘Ægyptus’ under the name of Arcadia, given in honour of the Emperor Arcadius. These then are the six provinces which make up ‘Egypt’ in the *Notilia* (shortly after a.d. 400). Each province, with the exception of Augustamnica, whose governor enjoyed the title of ‘corrector,’ was under a præses (ἡγούμενος): not one of the six was of consular rank. This regulation was due to the peculiar constitution of the diocese or province of Egypt in the wider sense. At the head of this latter, and subordinate in rank, though scarcely second in dignity, to the Comes Orientis, was the Prefect of Egypt, who enjoyed an exceptional position among the greater provincial officers. He appears to have been, at least in practice, directly under the Præfectus Prætorio per Orientem, the supreme civil representative of ‘Augustus’ throughout the Eastern Empire. The title Præfectus had in fact a different history as applied to the Prefect of the East and the Prefect of Egypt respectively. As applied to the latter, it was as old as Augustus. The importance of Egypt, mainly but not solely as a granary of Rome, had led the politic heir of Julius Cæsar to ensure its complete and peculiar dependence on the emperor. For this object, its government was committed to a nominee of the emperor, who must be not a Senator but an Eques only; i.e. he must never have held one of the great offices of state from Consul to quæstor. No one of senatorial rank was to be permitted to set foot in Egypt. (For the prerogatives of the præfectus Ægypti under Augustus see Tacitus *Ann*. xii. 60. also Ulp. *Digest*. I. xvii.). This arrangement survived the various vicissitudes of Egypt in the third century, and even the reorganisation of the Empire by Diocletian. Egypt was severed off between 365 and 386 from the Eastern ‘Diocese’ (Sievers, p. 117, appealing to Mommsen in *Abhandl. der Berliner Akad*. 1862). Upon the above facts was founded the (perhaps merely popular) title ‘Augustalis’ which we find already applied to the Prefect of Egypt about a.d. 350 (*infr*. p. 143, cf. p. 93 note). But Sievers (*ubi supr*.), following Mommsen, contends that there is reason to think that the dignity of ‘Augustal’ Prefect was officially created about a.d. 367. This view cannot be adequately discussed here, but it rests only in part upon the series of governors furnished by the *Festal Index*." },
  { t = "p", text = "From that document we learn that the prefect of ‘Egypt’ in the wider sense in almost every case held also the office of ‘governor’ of Egypt in the narrower sense. The exceptions noted by Sievers (§14) are in most cases based on the errors of Larsow. But in 365 Flavianus is ‘governor’ only, next year ‘Prefect’ also: his successors Proclianus and Tatianus are each ‘governor’ only (366–7), but the latter is Prefect in 368, and ‘governor’ only in 369–70, as also is Palladius, 370–371, who is yet succeeded by Olympius as ‘Prefect.’ These variations may be due merely to careless use of language, or possibly to some change about the time referred to." },
  { t = "p", text = "The list of prefects of Egypt is fuller than any that exists for a Roman province over so long a period, and on the whole it is in the highest degree trustworthy. But there are one or two drawbacks to take account of. Firstly, there are the discrepancies between the *Index* iii., vi., vii., and the headings to the corresponding letters (see notes). Also, the heading to Letter x. presupposes a change of governor in the previous year of which the Index tells us nothing. Again, a letter of Julian’s (No. 23) is addressed to a ‘Hermogenes, governor of Egypt’ for whom it is difficult to find room in the following list at the date required (end of 361, when Gerontius was prefect). Julianus, uncle of the Emperor, if not disguised under the name Italicianus (see below), possibly ruled Egypt (Jul. *Ep*. 11), as Comes Orientis, which office he held in 362. On the other hand the Olympus of *Index* xxxiv., and the Ecdikius of Julian, *Epp*. 6, 50, and *Cod. Theod*. xv. i. 8, are probably one and the same (Sievers, p. 124)." },
  { t = "p", text = "The Military command of Egypt was now in the hand of the ‘dux,’ who had the disposal of the troops in Egypt proper; those of Libya and of the Thebais were, at any rate later on, entrusted to separate ‘duces.’ In the *Notitia*, while the two latter ‘duces’ remain, the Dux Ægypti is replaced by a higher official, entitled the ‘Comes Rei Militaris per Ægyptum.’ But this belongs to a later date. In the time of Athanasius ‘Counts’ appear in Egypt only as extraordinary or special commissioners whose authority is exercised concurrently with that of the Dux, as, e.g., Count Heraclianus or Heraclius (*infr*. pp. 290, 292), whose commission runs parallel with the command of the new ‘dux’ Sebastianus; and Count Asterius (p. 289), who was in Egypt when Felicissimus was ‘Duke.’" },
  { t = "p", text = "We now give a list of the governors and dukes of Egypt, with references to the *Festal Index*: these must also be supplemented by the general index to this volume:—" },
  { t = "p", text = "(1) *Prefect and Governor.*" },
  { t = "p", text = "328, 329. Septimius Zenius (*Index* i., Heading i.)." },

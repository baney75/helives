  { t = "p", text = "(2) *Dux Ægypti.*" },
  { t = "p", text = "Our materials for this list are very scanty, but we can verify the following:—" },
  { t = "p", text = "340 and 345. Balacius or Valacius (pp. 219, 273, &c.)." },
  { t = "p", text = "350. Felicissimus (p. 289)." },
  { t = "p", text = "356. (Jan. and Feb.) Syrianus (*Index* xxviii., &c.)." },
  { t = "p", text = "356. (Apparently after Midsummer, cf. p. 292 with 290.) Sebastianus (‘successor of Syrianus,’ *Ep*. *Ammon*. 21); he remains till after 358 (cf. Siev. p. 125 for references to letters of Libanius)." },
  { t = "p", text = "360. Artemius (‘succ. of Sebastianus,’ *ib., Index* xxxii., Letter 53. note 1)." },
  { t = "p", text = "365, 366. Victorinus (ch. v. §3, k)." },
  { t = "p", text = "367, 368. Traianus (*Index* xxxix., Sievers, pp. 146, *sq.*)." },
  { t = "p", text = "On the matters dealt with in this appendix, consult Mommsen, *Provinces* (Eng. Tra.), ii., pp. 233, 246; the *Notitia* (ed. Panciroli, Genev., 1623, Böcking, Bonn, 1839–1853, Seeck, Berlin, 1876); Gibbon, ch. xvii.; Marquardt, *Röm. Staats-verwaltung*, vol. i.; and Kuhn, *Die städtische, &c., Verfassung des R. Reiches*, vol. ii.; also Sievers on the *Hist. Aceph*. (*supr*. ch. i., §3)." },
  { t = "p", text = "On the Egyptian bishoprics, see, in addition to Le Quien, a Coptic list of sees in De Rougé, *Géographie de la Basse-Egypte*, Paris, 1891, which came out too late to be used for this volume." },

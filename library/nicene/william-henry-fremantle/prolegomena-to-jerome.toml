[[section]]
id = "translator-s-preface"
title = "Translator's Preface."
level = 1
blocks = [
  { t = "p", text = "The grounds on which certain works of Jerome have been selected, as most important, for translation in this edition, while others have been omitted, are given in the Prolegomena (p. xvii–xviii)." },
  { t = "p", text = "The first draught of the translation was prepared by my coadjutors and former pupils, Mr. G. Lewis and Mr. W. G. Martley, who also added most of the notes; but I have gone minutely through every part, correcting, adding, and at times re-writing, both in the ms. and in the proof, and I have composed the Prolegomena and Indices." },
  { t = "p", text = "I have endeavoured to make the work useful not to the theologian alone, but also to the historical student. The general reader will find interest and even entertainment in the parts of the work referred to in the Index under such headings as “Pictures of Contemporary Life,” “Proverbs,” “Stories” and “Quotations,” or by looking at the Letters to which special attention is called in the Prolegomena at p. xviii. The Table of Contents also, in which a short description is given of the purport of each Letter, will help each class of readers to select the parts suitable to them. Finally, the Life of Jerome included in the Prolegomena, though closely compressed, has been furnished with copious references, which will make it a key to the whole work. It is only to be regretted that, through the impossibility of including Jerome’s work on Illustrious Men and his controversy with Rufinus in the present volume, it is necessary to send the reader for a few of the most important facts to Vol. iii of this Series." },
  { t = "p", text = "I can hardly expect that, in a work which has been carried through amidst many pressing engagements, which has been printed two thousand miles away, and of which I have had only a single proof to correct, I have been able to avoid all mistakes. But I hope that no inaccuracies have crept in of sufficient magnitude to mar the usefulness of the work. I have felt the responsibility of making the first translation of Jerome into English, especially as a translation once made acts as a hindrance to those who might wish to attempt the same task. But I trust that the present work may be found to be not altogether an unworthy presentment of the great Latin church-writer to the English-speaking world." },
  { t = "p", text = "W. H. Fremantle." },
  { t = "p", text = "Canterbury, *November*, 1892." },
]

[[section]]
id = "chapter-1"
title = "Chapter I. Introductory."
level = 1
blocks = [
  { t = "h", text = "Prolegomena to Jerome." },
  { t = "h", text = "I.—Introductory." },
  { t = "p", text = "St. Jerome’s importance lies in the facts: (1) That he was the author of the Vulgate Translation of the Bible into Latin, (2) That he bore the chief part in introducing the ascetic life into Western Europe, (3) That his writings more than those of any of the Fathers bring before us the general as well as the ecclesiastical life of his time. It was a time of special interest, the last age of the old Greco-Roman civilization, the beginning of an altered world. It included the reigns of Julian (361–63), Valens (364–78), Valentinian (364–75), Gratian (375–83), Theodosius (379–95) and his sons, the definitive establishment of orthodox Christianity in the Empire, and the sack of Rome by Alaric (410). It was the age of the great Fathers, of Ambrose and Augustine in the West, of Basil, the Gregories, and Chrysostom in the East. With several of these Jerome was brought into personal contact; of Ambrose he often speaks in his writings (Apol. i. 2, iii. 14, in this series Vol. iii., pp. 484 and 526; also this Vol., pp. 74 and 496, Pref. to Origen and S. Luke; and the Pref. to Didymus on the Holy Spirit, quoted in Rufinus’ Apology, ii. 24, 43, Vol. iii. of this series, pp. 470 and 480; also On Illust. Men, c. 124, Vol. iii. 383; see also Index—Ambrose); with Augustin he carried on an important correspondence (see Table of Contents); he studied under Gregory Nazianzen (80, 93; see also Illust. Men, c. 117, Vol. iii. 382) at the time of the Council at Constantinople, 381; he was acquainted with Gregory of Nyssa (Illust. Men, c. 128, Vol. iii. 338); he translated the diatribe of Theophilus of Alexandria against Chrysostom (214, 215). He ranks as one of the four Doctors of the Latin Church, and his influence was the most lasting; for, though he was not a great original thinker like Augustin, nor a champion like Ambrose, nor an organiser and spreader of Christianity like Gregory, his influence outlasted theirs. Their influence in the Middle Ages was confined to a comparatively small circle; but the monastic institutions which he introduced, the value for relics and sacred places which he defended, the deference which he showed for Episcopal authority, especially that of the Roman Pontiff, were the chief features of the Christian system for a thousand years; his Vulgate was the Bible of Western Christendom till the Reformation. To the theologian he is interesting rather for what he records than for any contribution of his own to the science; but to the historian his vivid descriptions of persons and things at an important though melancholy epoch of the world are of inestimable value." },
]

[[section]]
id = "chapter-2"
title = "Chapter II. Contemporary History."
level = 1
blocks = [
  { t = "p", text = "The references in this Section, where numbers alone are given, are to the date A. D." },
  { t = "p", text = "It seems desirable to prefix to this Introduction some account of the times of St. Jerome. General and ecclesiastical history must not be kept too far apart." },
  { t = "p", text = "Jerome was born in the troubled times which followed the death of Constantine (337), and before Constantius became sole Emperor (353). He was still a schoolboy during the reign of Julian (361–63), and when he heard of his death. During his student life at Rome, Jovian and Valentinian were Emperors, and at Treves, where he next sojourned, the latter Emperor held his court. His first letter refers to a scene in which Ambrose, then Prefect of Liguria, seems to have taken part (370), and his settlement at Aquileia synchronises with the law of Valentinian restraining legacies to the clergy (370). He went to the East in the year of the death of Athanasius (373), and during his stay in the desert and at Antioch (374-80) occurred the death of Valentinian, the defeat and death of his brother Valens in the battle of Adrianople, the elevation of Theodosius to the purple, and the call of Gregory Nazianzen to Constantinople. He was ordained by Paulinus, one of the three Bishops of Antioch, and studied under Apollinaris, thus touching on both the chief points for which the Council of Constantinople was called (381). At that Council he was probably present, being, as stated above, a disciple of its president, Gregory Nazianzen. He was present also at the Western Council held the next year in Rome under Pope Damasus, whose trusted counsellor he became (pp. 233, 255). His later life, spent at Bethlehem (386–420), witnessed the division of the Empire between the sons of Theodosius, the fall of the Prefect Rufinus (p. 174), to whom Jerome had been denounced, the triumph of Stilicho and his death (at which he weakly rejoiced, p. 237), Alaric’s sack of Rome (410) and his death, the revolt of Heraclian, the marriage of Alaric’s successor, Adolphus, with the Emperor’s sister, Galla Placidia, and the death of Arcadius (408); in ecclesiastical matters, it witnessed the rise of Chrysostom (398) and his exile (403) and death (407), the condemnation of Origenism (400), and the Pelagian controversy (415). It is of this period that we are now to give a sketch." },
  { t = "p", text = "The Emperor Constantius “may be dismissed,” says Gibbon, “with the remark that he inherited the defects without the abilities of his father.” He died in Cilicia on November 3, 361; he had been stained in his youth by the blood of nine of his near relatives; he had fallen early under the dominion of the eunuchs of his palace; and he had done little for the defence of the empire. In ecclesiastical matters he had favoured the Arian cause, and had banished the orthodox Bishops of the principal sees, and had visited Athanasius of Alexandria with his especial displeasure. His jealousy of his cousin Julian, who had risen to fame by his just and vigorous administration and by his victories over the Germans, led him into acts which provoked the legions of Gaul and caused them to hail Julian as their Emperor. His overtures of peace were rejected by Constantius; he marched rapidly toward Constantinople, and Constantius, leaving the Persian war in which he was engaged, turned westward to meet him. The death of Constantius saved the world from civil war." },
  { t = "p", text = "Julian’s accession was hailed by all who felt the need of a strong ruler; and his first measures were just and tolerant. He recalled from exile the Bishops whom Constantius had banished; his private life was virtuous, and his love of learning endeared him to some of the best of his subjects. But his contempt of Christianity made him first impatient and then a persecutor. He forbade Christians, or Galileans as he called them, to teach in the schools, or to follow the learned professions; he restored Paganism, though it was observed that the Paganism he introduced was in many ways modified by Christian influence; and he favoured the Jews and wished them to rebuild their temple at Jerusalem. What the result of his retrogressive policy would have been it is hard to say. He died in a skirmish in the Persian war, on June 26, 363." },
  { t = "p", text = "Jovian, who succeeded him, was a Christian; and his election showed that the anti- Christian policy of Julian had been without effect. He proclaimed a complete toleration, but died before reaching Constantinople, only six months after his election." },
  { t = "p", text = "Valentinian, his successor, was an orthodox Christian, his brother Valens, whom he associated with himself, an Arian. Valentinian established his court at Treves, and successfully kept back the barbarians. Thither in 366 Jerome went for a time, and he describes the curious customs of the tribes whom he saw there (Against Jovinian, ii. 7, p. 394). The Emperors proclaimed toleration, which extended even to the celebration of the Eleusinian mysteries. But their inquisitorial and cruel treatment of all suspected of magic arts had a repressive effect upon learning. Their foundation of schools and endowment of physicians for the poorer citizens show that the hopes of social improvement were not extinguished. Yet the state of society in Rome and in other large cities, as given at this time by Ammianus Marcellinus (cxiv. 6, xxviii. 4. See Gibbon, iv. 77. Ed. Milman & Smith), reveals to us the causes of the fall of Rome." },
  { t = "p", text = "In the reign of Valentinian many ecclesiastical events of great importance took place. The election of Damasus to the Popedom in 366, when the rival factions of Damasus and Ursinus filled the whole city with their conflict, and churches were stormed and strewed with the slain, showed how important the Bishopric of Rome had become. “If you would make me Pope, perhaps I might become a Christian,” said Prætextatus, the worshipper of the old gods, to Damasus, who wished to convert him (see p. 428). The law of Valentinian forbidding legacies to be made to the clergy shows also their wealth and deterioration (p. 92). But this reign produced some of the greatest Bishops and leaders whom the Church has known. Athanasius died in 373. Ambrose became Bishop of Milan in 374. Basil was Bishop of Cæsarea in Cappadocia from 370 to 379." },
  { t = "p", text = "Meanwhile, the reign of Valens in the East was unsuccessful, and ended in a great disaster. The Visigoths, and Ostrogoths, or Gruthungi, pressed by the Huns, implored permission to cross the Danube from their settlements in Dacia and to be allowed to cultivate the waste lands of Thrace and Asia Minor. This was conceded to them; but they were ill treated and cajoled, and at last asserted their rights by force; and the Emperor, who attacked them near Adrianople, was defeated and slain, and his army destroyed (378). The Goths were now a formidable force within the Empire. It was in the year before the death of Valens (377) that Stridon, the birth-place of Jerome, was destroyed." },
  { t = "p", text = "Valentinian had died in 375, leaving two sons, Gratian, an accomplished youth of eighteen, who became Emperor of Gaul and the West, and Valentinian II., then a child, who was nominal Emperor of Italy and the central provinces, and who, with his mother Justina, had his residence at Milan. Gratian distinguished himself by his conduct of several expeditions against the German tribes beyond the Rhine, and, upon the death of his uncle Valens, nominated Theodosius to be Emperor of the East. But he afterwards yielded to idleness and frivolous pleasure, and in 383 was murdered by the agents of the usurper Maximus." },
  { t = "p", text = "Theodosius, the son of the elder Theodosius, who had recovered Britain and Africa for the Empire, but had on a false accusation been put to death at Carthage, was called to the Empire from his retirement in Spain. He showed himself a great and capable ruler. He took the Goths in detail and gradually dispossessed them. He put down the usurper Maximus (383), and on the death of the young Valentinian (392) fought against the usurper Eugenius, and became sole Emperor (394) in the year before his death. He reformed the laws, enacting the Theodosian Code. In his reign Paganism was finally suppressed. He caused a vote to be taken in the Roman Senate for the establishment of Christian worship and the suppression of Paganism. He destroyed the temples—the destruction of the Serapeum at Alexandria in 389 being the most notable instance of this—and supported Ambrose in his vehement efforts for the suppression of Paganism. Though he loyally befriended the Empress Justina, who was an Arian, and her young son Valentinian II., he did not support their demand for the toleration of Arian worship at Milan which Ambrose had denied to them, and he suppressed Arianism throughout the Empire. To settle the doctrinal disputes raised by the teaching of Apollinaris, Bishop of the Syrian Laodicæa, who held that the Logos in Christ supplied the place of the human soul, and the disputed succession at Antioch, where the Episcopal throne was claimed by the Arian Vitalis, the Trinitarian but Arian-ordained Meletius, and Paulinus the champion of the uncompromising orthodoxy of the West, he summoned the Council of Constantinople, which met in 381. The President of the Council was Gregory Nazianzen, who had come to Constantinople in 379, and, partly through his own eloquence and other great powers, partly through the influence of Theodosius, had won his way from the position of minister of a single church, the Anastasis, to the Episcopal throne. The Egyptian Bishops opposed him and vainly endeavoured to foist in the Cynic Maximus into his place. The Council did not succeed in settling the dispute at Antioch, but they maintained the Nicene creed, and added to it all the articles after “I believe in the Holy Ghost.” The Council held at Rome in the following year (382), to which Jerome went with Epiphanius, Bishop of Cyprus, and Paulinus of Antioch (p. 255), contradicted that of Constantinople on the subject of the succession at Antioch, but agreed with it on the creed. Gregory Nazianzen soon after the Council resigned the Bishopric of Constantinople, and Damasus, Bishop of Rome, died in 384." },
  { t = "p", text = "Theodosius was, like Henry II. of England, liable to violent accesses of passion. When the people of Antioch rose in insurrection in 387, and destroyed the busts of the Emperor, he gave an order that the city should be razed and reduced to the rank of a village, from which sentence he was only deterred by the entreaties of the Governor of the city and its Bishop, John Chrysostom. When a similar rising took place at Thessalonica in 390, he was not similarly appeased, but ordered that the people when summoned to the theatre should be massacred by his soldiers, and seven thousand men, women and children were thus put to death. Ambrose, on Theodosius’ coming to Milan, refused to admit him to the communion of the Church till he had undergone five months of penance and showed his repentance for his crime." },
  { t = "p", text = "On the death of the young Valentinian in 391, Eugenius the rhetorician usurped the throne of the West. Justina fled to the court of Theodosius, who, after long preparations, marched against Eugenius, and defeated him at Aquileia in 394. Theodosius, however, did not long survive his rival. After this last success he gave himself up to ease and self-indulgence, and died 395." },
  { t = "p", text = "The Empire was divided between the sons of Theodosius. Arcadius, who became Emperor of the East, was eighteen years of age, and Honorius, fourteen. Both were weak characters, ill suited to cope with the growing dangers of the Empire. Arcadius married Eudoxia, a woman of a worldly and violent disposition. Honorius married the daughter of Stilicho, the great semi-barbarian general, who was his cousin, having married Serena, the daughter of Honorius, brother to the great Theodosius. Arcadius’ minister, Rufinus, became so unbearable in his rapacity (see Jerome’s allusion to him, p. 447) that a tumult was raised against him and he was put to death (395). Honorius removed his court to Ravenna, among the pine forests of which he was more secure from invasion; and, so long as he was under the guidance of Stilicho, was able to live in security." },
  { t = "p", text = "John Chrysostom became Bishop of Constantinople in 398, and by his sermons and ascetic discipline exerted a large influence. But intrigues were raised against him by Theophilus of Alexandria on account of his reception of the Long Monks, whom Theophilus had banished in his zeal against Origenism. And the Empress Eudoxia, whom his plain speaking had offended, endeavoured to work his ruin. He was banished, after having been once brought back to the capital by the entreaties of the people, in 404, and died in 407, having continued to exercise his influence over the Church generally from his exile at Comana in Pontus. His remains were brought to Constantinople thirty years later, and were welcomed by Theodosius II. and his consort Eudocia with tears of repentance for the fault of their predecessors. Arcadius died in 408, leaving as his heir the young Theodosius, then but seven years old. His daughter Pulcheria and the Prefect Anthemius administered the Empire successfully; the Huns, who had entered the Roman territory and encamped in Thrace, were persuaded to withdraw, and the Eastern Empire enjoyed peace during the remainder of the reign of Theodosius II." },
  { t = "p", text = "Turning to ecclesiastical affairs, we find a certain calm settling down upon the Church after the Council of Constantinople, and an unwillingness to reopen the subjects of strife. Men used the name of heretic rather as something to frighten their opponents, and sought to identify opinions which they disliked with the Arianism of the past, which all alike condemned. There were much fewer Councils of Bishops and no General Council for fifty years (Ephesus, 431). But other subjects of dispute arose, the Christian community being saturated with Greek contentiousness. The first of these related to Origenism. The works of the great and original church teacher of Alexandria of the third century (~254) had been little studied for above a hundred years, when a new interest in them arose both in the East and the West. The earnest study of Scripture which led to the formation of the Vulgate, or translation from the original into the vulgar tongue of the Latin world, led to a wish to consult the greatest textual writer and interpreter of Scripture who had as yet appeared; and those who learned from his Bible work to admire him were led also to study his doctrinal views. It happened to Origen, as to many modern teachers, that his name came to be identified with one or two prominent doctrines; and, as men speak of Calvinism or Erastianism or Hegelianism, so they spoke of Origenism. The doctrines which they connected with Origen were taken from his most important work, the Περὶ ᾽Αρχῶν, “on First Principles.” They were mainly (1) his expressions relating to the subordination of the Son to the Father, and (2) his eschatology. As to the first of these, they took isolated expressions, such as, “The Son does not see the Father,” or, “the Son is darkness in comparison with the Father,” and they spoke of him as the father of Arius; as to the second, they fastened upon his speculative ideas, that the coming of men’s souls into this world was a fall from a previous state of being; that men may rise into an angelic state; that the material body is destined to pass away; and that in the consummation of all things all spiritual beings, including the fallen angels, will be schooled into obedience, so that the universe may be brought back into harmony. Men were incapable of entering into the general system of Origen, and still more of understanding his historical position. The Pope Anastasius who condemned him in 404 says plainly that he knows neither who Origen was nor when he lived (see Vol. iii. 433); and they consequently took his tenets in an absolute sense, and thought of him as denying the divinity of Christ, or the condemnation of the wicked, or the resurrection of the body. His views were most widely spread in Egypt, where the contrary tendency of Anthropomorphism, that is, the conception of God as the subject of human properties and passions, was also widely prevalent. Theophilus, Bishop of Alexandria, at first was generally favourable to Origen, as was also Jerome; but, through various causes, not unmixed with personal feeling, he turned against Origenism in a fanatical and persecuting temper. He procured the condemnation of Origenism by the Bishops of Egypt, Syria, and Cyprus, and also by those of Rome and Italy; and he pursued those who had fled from his persecution to Constantinople, and branded Chrysostom, who had receive them, as a heretic. In all this he was aided by Jerome, who translated his missives into Latin (see Letters 86 to 100, 113 and 114). But the whole matter was transacted without any Council being called; the Bishops were taken as speaking the general sentiment, and their decisions were reinforced by a decree of the Emperors (400)." },
  { t = "p", text = "The second controversy (which also was disposed of without any General Council) was that of Pelagianism. Pelagius and Cælestius, monks of Britain, had come to Rome in 409, and maintained the doctrine of Free Will and the possibility of a man living without sin, against the Augustinian doctrine of Grace, which asserted the helplessness of man and issued in absolute predestinarianism. They passed into Africa with the crowds who were escaping from Alaric’s invasion, and there confronted the influence of Augustin. Condemned by a Council at Carthage in 413, they passed into Palestine, and procured recognition from Councils held at Jerusalem and Diospolis in 415, notwithstanding the presence of Orosius, Augustin’s friend, and the accusations of the Gaulish Bishops, Heros and Lazarus. Jerome was invited to write against them (pp. 272, 279), and their followers rose against him and burnt his monasteries (p. 280, Augustin De Gest. Pel. c. 66), after which they visited Ephesus and Rome, and were at first received by the Pope Zosimus; and several Bishops, of whom the chief was Julian of Eclana, espoused their cause. But Augustin’s influence prevailed in the West, while in the East little interest was taken in a controversy which was humanistic rather than strictly theological, and men’s minds were being drawn to the questions of Christology, which led to the Nestorian controversy and the Council of Ephesus (431)." },
  { t = "p", text = "The forces of the barbarians, which in the reign of Valens had threatened Constantinople, were diverted to the West in the reign of the sons of Theodosius. Those who remained within the boundaries of the Empire imbibed something of Roman civilisation, and, in many cases, became servants of Rome; and, as the subjects of the Empire withdrew through love of luxury from military duties, the power of the barbarians enlisted as mercenaries increased. Alaric, who now rose to power, occupied an ambiguous position. He marched with his Gothic army into Greece (396), and, being a Christian, thought himself justified in plundering the historic fanes of the old religion. He was attacked by Stilicho near the Isthmus of Corinth, and defeated, but he contrived to transport his army across the gulf and to take possession of Epiris (397), and the ministers of Arcadius thought it prudent to make peace with him. In 398 he became at once Master-General of Illyricum and King of the Visigoths; and, his rights not being respected by the Emperor of the West, he invaded the North of Italy. He was vanquished by Stilicho in the battles of Pollentia and Verona (403); but the conqueror, who well knew the increasing weakness of Rome, made peace with Alaric and acknowledged his official position. Alaric retreated for a time, but another barbarian invader, Radagaisus or Radaghast, with a mixed host of Vandals, Suevi, and Burgundians, forced his way to Florence. He was there met by Stilicho who gained over him his last great victory on the heights of Fiesole (406). The policy of conciliation adopted by Stilicho might have converted Alaric and his Goths into the guards of the Empire; but his action was disowned, and he was treated as a traitor and put to death in 408. Then Alaric advanced to the attack upon Rome. He was induced by fair promises to raise the siege; but, finding that no faith could be placed in the court of Ravenna, he renewed the siege, and took the city on August 26, 410. The only redeeming feature in the terrible destruction which ensued was the respect of the Goths for the Christian religion. They spared the clergy and the churches and those who had taken refuge in them; and even the rich plate and ornaments of divine worship were held sacred from their rapacity. But the knell of Roman greatness had been sounded, and the end of the Empire was near at hand. Alaric on leaving Rome ravaged Italy. He marched to Rhegium, the flames of which Rufinus saw from the opposite coast while he wrote his Commentary on the Book of Numbers (Vol. iii. p. 568); but his attempt to cross into Sicily was frustrated by a storm, and he himself died before the year of the sack of Rome had closed. His successor, Adolphus, made peace with Rome, and dared to ask for the hand of Galla Placidia, the sister of Honorius. The King of the Goths was accepted as the brother-in-law of the Roman Emperor." },
  { t = "p", text = "The Empire of the West might now be compared to a ship heaving to and fro in a troubled sea, encompassed by enemies and without captain or rudder. Britain had revolted in 409. From 409 to 413 Gaul was a prey to revolutions, and the usurper Constantine was with difficulty overcome by the Roman General Constantius, only to be followed by fresh usurpers, Jovinus, Sebastian, and Attalus. The Count Heraclian dared to invade Rome itself in 413, though defeat and death were the penalty. One by one the provinces of the Empire passed into the hands of the barbarians. The Goths settled in Aquitaine and in Spain; the Vandals turned down into Africa; the Burgundians settled in the East and North of France, and the Franks in the centre. The ruin of the Empire of the West was practically consummated at the time of Jerome’s death in 419, though sixty years of disaster and disgrace intervened before its final extinction." },
  { t = "p", text = "Meanwhile the distressed condition of Italy had driven large numbers of persons, especially of the clergy and the upper classes of society, to take refuge in the East, so as almost to justify Thierry’s designation of the movement as an emigration to the Holy Land. Jerome and his friends received this tide of fugitives at Bethlehem, and corresponded with those left behind; and thus the evils of the time made the Solitary of the East the chief Doctor of the West." },
]

[[section]]
id = "chapter-3"
title = "Chapter III. Life of Jerome."
level = 1
blocks = [
  { t = "p", text = "The figures in parentheses, when not otherwise indicated, refer to the pages in this volume." },
  { t = "p", text = "For a full account of the Life, the translator must refer to an article (Hieronymus) written by him in Smith and Wace’s *Dictionary of Christian Biography*. A shorter statement may suffice here, since the chief sources of information are contained in this volume, and to these reference will be continually made." },
  { t = "p", text = "*Childhood and Youth*. A.D. 345. Jerome was born at Stridon, near Aquileia, but in Pannonia, a place which was partially destroyed in the Gothic invasion of 377 (On Illustrious Men, 135, Vol. iii. p. 304). Jerome’s own property, however, remained, though in a ruinous state, in 397 (140). His father Eusebius (Ill. Men, as above) and his mother were Catholic Christians (492), but he was not baptised in infancy. The family was moderately wealthy, possessing houses (140) and slaves (Apol. i. 30, Vol. iii. p. 498), and was intimate with the richer family from which sprang Bonosus, Jerome’s foster brother and friend (6). The parents were living in 373 when Jerome first went to the East (35), but probably died at the destruction of Stridon. He had a brother, Paulinian, twenty years his junior (140, 173), and we read of a sister (8, 9), and an aunt named Castorina (13)." },
  { t = "p", text = "He received a good education, but declares that he was an idle boy (Vol. iii. 498). He was at a grammar school when the Emperor Julian died (Comm. on Habakkuk iii. 14) and soon after went to Rome with his friend Bonosus (6), where he studied rhetoric (at that time the all-embracing pursuit) under Ælius Donatus (Vol. iii. 491), and frequented 363 the law-courts (Comm. on Gal., ii. 13)." },
  { t = "p", text = "363–66. He fell into sin (9, 15, 78), but was drawn into the company of young Christians who on Sundays visited the tombs of the martyrs in the Catacombs (Com. on Ezek., ch. 40, v. 5), and is believed to have been baptised by the Pope Liberius in 366 (20). He was already a keen student, though as yet having little knowledge of Greek (Rufinus Apol. ii. 9, Vol. iii. p. 464), and had begun the acquisition of a library (35)." },
  { t = "p", text = "366–70. From Rome Jerome went with Bonosus to Gaul, passing, however, through Northern Italy, where they made acquaintance with Rufinus, probably at his native place, Concordia (Ep. v. 2, comp. with iii. 3, pp. 7, 11). He stayed at Treves (7), and travelled in its neighbourhood (394), and copied mss., and wrote a mystical Commentary on Obadiah (401)." },
  { t = "p", text = "*Aquileia*. Returning probably by Vercellæ (1) to Italy he was for three years at Aquileia, where he entered definitively upon the twin pursuits of his life, Scriptural study and the fostering of asceticism." },
  { t = "p", text = "370–73. A society of congenial minds gathered round him, comprising Rufinus, Bonosus, Heliodorus (afterwards Bishop of Altinum), Chromatius (afterwards Bishop of Aquileia), and his brother Eusebius, and the Archdeacon Jovinus, the monk Chrysogonus, the sub-deacon Niceas, Innocentius, and Hylas, the freedman of the wealthy but ascetic Roman lady, Melania, together with Evagrius (afterwards Bishop of Antioch), who had come to Italy with Eusebius, Bishop of Vercellæ, on his return from exile. For the mention of these in various parts of Jerome’s works, the Index must be consulted. These ascetics did not form a monastery. There were as yet no Orders or Rules. The vow was merely a “purpose” (*propositum*) which each privately took on himself and the terms of which each man freely prescribed. The Greek word *Monachus* (Monk) was used, but only implied living a single or separate life. Some were hermits (5, 9, 247), some lived in cities (121, 250). Jovinian was a monk, though antiascetic (378); Heliodorus (91) and John of Jerusalem (174) were monks, though Bishops. Some members of the ascetic society at Aquileia may have resided in the same house; but there was no cenobitic discipline. Jerome visited Stridon and the neighbouring town of Æmona (12), and perhaps resided at his native place for a time, but he complains of the worldliness of the people of his native town and of the opposition of their Bishop, Lupicinus (8 n. 10). The friends at Aquileia were united in the closest friendship." },
  { t = "p", text = "373. Rufinus’ baptism (7, Ruf. Ap. i. 4, Vol. iii. 436) and the writing of Jerome's first letter on “the woman seven times struck with the axe” are the only incidents which have come down to us of this period. We only know that the society was broken up by some event which Jerome speaks of as “a sudden storm,” and “a monstrous rending asunder” (5)." },
  { t = "p", text = "Jerome determined on going to the East with Evagrius and Heliodorus; Innocentius, Niceas, and Hylas accompanied him (1, 5, 6, 10). Chromatius, Eusebius, and Jovinus remained in Italy. Bonosus retired to an island in the Adriatic, where he lived the life of a hermit (5, 9). Rufinus went to Egypt and subsequently to Palestine in the company of Melania (6, 7). Jerome and his companions travelled through Thrace, Pontus, Bithynia, Galatia, at the capital of which (Ancyra) he appears to have stayed (497), Cappadocia, and Cilicia, to Antioch, their haven of rest (5). But they did not long remain together. Heliodorus made a journey to Jerusalem, where he was the guest of Florentius (6)." },
  { t = "p", text = "374. Jerome was in ill health, and at length, in the middle of Lent (36), fell into a fever of which he nearly died. To this illness belongs his anti-Ciceronian dream (36, Apol. ii. 6, Vol. iii. 462), which finally determined him to abandon secular learning and devote himself to sacred studies. The successive deaths of Innocentius and Hylas left Jerome alone with Evagrius, at whose country house he fell in with the ancient hermit Malchus (315), and was encouraged by him in the ascetic tendency. He hoped to see Rufinus, wrote to him through Florentius (4, 6), but he did not come; and he determined to embrace the life of solitude. Heliodorus had some thought of accompanying him, but, to Jerome’s great chagrin) felt the call to pastoral work to be the stronger, and returned to Italy (8, 13, 123)." },
  { t = "p", text = "*The Desert*. 374–379. Jerome spent the next five years in the Desert of Chalcis, to the east of Antioch (7). It was peopled by hermits who, though living apart for most purposes, were under some kind of authority (4, 21). Jerome wrote to their head, Theodosius, begging to be admitted into their company (4). His life while in the desert was one of rigorous penance, of tears and groans alternating with spiritual ecstasy, and of temptations from the haunting memories of Roman life (24, 25); he lived in a cell or cavern; he earned his daily bread, and was clad in sackcloth (21, 24), but he was not wholly cut off from converse with men. He saw Evagrius frequently (7, 8); he wrote and received letters and books (7, 11); he learned Hebrew from a converted Jew (Ep. xviii. 10), and copied and translated the Gospel according to the Hebrews (Ill. Men, 2, 3, Vol. iii. 362), and his brother solitaries he found only too accessible (Ep. xvii. 3). Towards the close of his sojourn he became involved in the controversies then agitating the Church at Antioch, where Arian Vitalis, the orthodox but Arian-ordained Meletius, and the Western Paulinus disputed the possession of the bishopric (20). Jerome found himself beset with demands for a confession of faith in terms strange to his Western education (19, 20). He appealed to Pope Damasus for advice (19, 20); but he and his friends found his position intolerable. They would rather, he says, live among wild beasts than among Christians such as those about them. In the autumn of 378 he wrote to Marcus, then head of the eremite community, to say that he only begged for the “hospitality of the desert” for a few months: in the spring he would be gone (21)." },
  { t = "p", text = "379. Accordingly, in the spring of 379 he came to Antioch and attached himself to the party of Paulinus, the Western and orthodox Bishop, who ordained him presbyter, though he then and always afterwards declined the active ministry (446). He pursued his studies under the celebrated Apollinarius of Laodicæa, though not accepting his views (176), and wrote his “Dialogue against the Luciferians” (319–334)." },
  { t = "p", text = "*Constantinople*. 380. The next year Jerome went, with his Bishop, Paulinus, to Constantinople, and was there during the Second General Council, at which the views of his teacher, Apollinarius, were condemned, and sentence was passed in the cause of his Bishop. He placed himself under the teaching of Gregory Nazianzen (80, 93, 357; Ill. Men, 117), and became acquainted with Gregory of Nyssa (Ill. Men, 128); he translated the Chronicle of Eusebius and dedicated it to Vincentius and Gallienus, the former of whom became henceforward his companion (483, 444–446); he imbibed his admiration for Origen, translating his Homilies on Jeremiah and Ezekiel, and writing to Damasus on the meaning given by Origen to the Seraphim in Is. vi. (22)." },
  { t = "p", text = "381. These literary labours were carried on under the disadvantage of a weakness of the eyes, from which he henceforward constantly suffered. But there is in his writings not a single reference to the Council of Constantinople, and only cursory references to that held the next year at Rome, in which he was certainly called to take part (233; Ruf. Epil. to Pamph., Vol. iii. 426, 513)." },
  { t = "p", text = "*Rome*. 382–5. He went to Rome with his Bishop, Paulinus, and with Epiphanius, Bishop of Salamis in Cyprus. At the Council which was there held he was present as a learned man whose help the Pope required. There is no ground for the notion that he became his official secretary. But for the two main objects of Jerome’s life his sojourn in Rome presented great opportunities. Damasus thoroughly appreciated his eminence as a biblical scholar. He constantly sent him questions, the replies to which form short exegetical treatises, such as those reckoned among Jerome’s letters on the word Hosanna and the Prodigal Son. It was also for Pope Damasus that he undertook a revised version of the Psalms, a version which was used in the Roman Church for more than eleven centuries (492, 494), and also a revised version of the New Testament, the preface to which is of much critical value (487, 488; see also p. 357, where a whole clause in 1 Cor. vii. 35 is said to have been omitted in the old version because of the difficulty of translation). He further began the collation of the various texts of the LXX. and the other Greek versions of the Old Testament, and began to form the convictions which afterwards led to his translation direct from the Hebrew (484). These biblical studies made him acquainted with the works of Origen, and he conceived a great and almost passionate admiration for that “brazen-hearted” (Chalchenterus) worker and teacher of the Church (46), and he permitted himself to use expressions too indiscriminate in praise of him and too contemptuous towards his adversaries, which were afterwards thrown in his teeth (Ruf. Ap. ii. 14, Vol. iii. 467)." },
  { t = "p", text = "For the promotion of asceticism he found in Rome a congenial soil. Epiphanius, him- self the pupil of the hermits Hesychias and Hilarion (Sozom. vi. 32, Vol. ii. 369, 370), was the guest of the noble and wealthy lady Paula, the heiress of the Æmilian race (196), who was already disposed to the ascetic life. To the circle of her family and friends Jerome was soon admitted, and she became his devoted disciple and friend during the remainder of her life (Letter cviii.). Her son, Toxotius, and her daughters, Blesilla, the young widow (47–49), Paulina, the wife of Jerome’s friend, the ascetic Senator Pammachius (135), and Julia Eustochium (196), each in special ways affected the life of Jerome. Her friends, Marcella and Principia (253), Asella (42, 58), Lea (42), Furia and Titiana, Marcellina and Felicitas (60) and Fabiola, all of them belonging to the highest Roman families, formed a circle of renuntiants who sought refuge in the ascetic life from the wastefulness and immorality of those of their own quality. Marcella’s house on the Aventine was their meeting place (41, 58). There they prayed and sang psalms in the Hebrew, which they had learned for the purpose (210), and read the Scriptures under the guidance of their teacher (41, 255), who wrote for them many of his expository letters, whose ascetic writings they committed to memory, and whose private letters to them (Letters xxiii.–xlvi.) reveal the various phases of the new Roman and Christian life. These are concentrated in the Treatise on the Preservation of Virginity which he addressed to Eustochium (Letter xxii.). This period also produced the first of Jerome’s controversial treatises, that against Helvidius on the perpetual virginity of Mary (334–346)." },
  { t = "p", text = "384–5. This congenial scene of activity and friendship was broken up by the death of Damasus. The new Pope, Siricius, to whom many had thought of Jerome as a rival (59), was without sympathy for him: he had offended almost every class of the community by his unrestrained satire (Letters xxii., xl., liv., etc.): he had awakened suspicion by his over praise of Origen (46); and at the funeral of Blesilla, whose end was believed to have been hastened by the hard life enjoined upon her, the fury of the people was excited against Jerome and the cry was raised “The monks to the Tiber!” (53). He felt that he was vainly trying to “sing the Lord’s song in a strange land” (60) and he resolved to leave Rome for ever and to seek a retreat in Palestine. His departure in August and the feelings excited by it are described in a passage in his Apology against Rufinus (Ap. iii. 22, Vol. iii. 530) and in his letter to Asella (Letter xlv.) written at the moment of his embarkation at Ostia." },
  { t = "p", text = "385–6. Jerome sailed with Vincentius and with his brother Paulinian (Vol. iii. 530 as above) direct to Antioch. Paula and Eustochium, leaving the other members of their family, went to Cyprus to see Epiphanius; and the two parties united at Antioch (198). Thence they passed through Palestine and Jerusalem, on to Egypt, where they visited the abode of the monks of Nitria (202) and became acquainted with Didymus, “the blind seer” of Alexandria (176): and they returned to Palestine in the autumn of 386, and settled at Bethlehem for the remainder of their lives." },
  { t = "p", text = "*Bethlehem, First Period*. Jerome’s life at Bethlehem lasted thirty-four years. A monastery was built, of which he was the head, and a convent for women over which Paula and Eustochium successively presided (206), a church where all assembled (206, 292), and a hospice for pilgrims who came to visit the holy places from all parts of the world (140). These institutions were supported by the wealth of Paula until, through the profusion of her charities, she was so impoverished that she rather depended on Jerome and his brother, who sold the remains of their family property for their support (140). He lived in a cell, surrounded by his library, to which he constantly made additions (Ruf. Ap. ii. 8 (2), Vol. iii. 464). He lived on bread and vegetables (165), and speaks of his life as one of repentance and prayer (446), but no special austerities are mentioned in his writings, and he did not think piety increased by the absence of cleanliness (33, 34). He never officiated in the services (83), but was much absorbed in the cares (140) and discipline (Letter cxlvii.) of the monastery, and by the crowds of monks who came from all parts of the world (64, 65, 500). Sulpicius Severus (Dial. i. 8) tells us that when he was with him towards the close of his life, he had the charge of the parish of Bethlehem; and the presbyters associated with him certainly prepared candidates for baptism (446); but his call, as he often confesses, was not to the pastorate, but to the study (Letter cxii.). He had youths to whom he taught Latin classics (Ruf. Apol. ii. 8 (2), Vol. iii. 465); and he expounded the Scriptures daily to the brethren in the monastery (Apol. ii. 124, Vol. iii. 515). Sulpicius speaks of him as always reading or writing, never resting day or night. Translations, commentaries, controversial works, letters dealing with important subjects, flowed constantly from his pen, while the notes passing between him and Paula and Eustochium were without number (Ill. Men, 135, Vol. iii. 384), and every thing that he wrote was caught up by friends or by enemies and published (79). He worked amidst great distractions, not merely from the cares of the monasteries and the hospice, but from the need of entertaining persons of distinction, like Fabiola (161), from all parts of the world (153, 287, 161); from the need of replying to the letters brought by messengers from the most distant countries for those who sought advice of the renowned teacher (Letters cxvi.–cxxx.); from prolonged illnesses (188, 215); at times from poverty; from the panic of barbarian invasions (161, 252), and from the attacks of his enemies, who in the year 417 burned his monasteries (281, 282)." },
  { t = "p", text = "He spared no pains nor expense in the production of his works. He perfected his knowledge of Hebrew by the aid of a Jew who came to him like Nicodemus by night (176); he also learned Chaldee (493); and for special parts of his Bible work he obtained special aid from a distance (491, 494), obtaining funds, when his own had failed, from his old friends Chromatius and Heliodorus (492)." },
  { t = "p", text = "386–92. The list of his works during the first six years of his residence at Bethlehem comprises the completion of the Commentary on Ecclesiastes, and the translation of Didymus on the Holy Spirit; the Commentaries on Ephesians and Galatians, Titus and Philemon (498); a revision of the version of the New Testament begun in Rome; a Treatise on Psalms x.–xvi., and Translation of Origen on St. Luke and the Psalms; the Book on the Names of Hebrew Places, mainly translated from Eusebius; the Book of Hebrew Proper Names and that of Hebrew Questions on Genesis; the revision of his translation of the LXX., involving a comparison of Origen’s Hexapla; a considerable part of the Vulgate; the Lives of the hermits Malchus and Hilarion; and the Catalogue of Illustrious Church Writers. The only letter preserved to us of this period is that written in the name of Paula and Eustochium to invite Marcella to come to Palestine (60)." },
  { t = "p", text = "*Bethlehem, Second Period*. 392–405. The second period of Jerome’s stay at Bethlehem is the period of his most conspicuous activity, which was partly employed in the salutary work of finishing the Vulgate and in writing letters which rank among the finest of his compositions, but largely also in controversies, in which the worst parts of his character and influence are brought into prominence." },
  { t = "p", text = "395, 398 and 404–5, 394–97. There were also great external hindrances to his work: the panic arising from the invasion of the Huns, on account of which the inmates of the monasteries had to leave their homes and prepare to embark at Joppa (161); there were long periods of ill health; and there was the quarrel with the Bishop of Jerusalem which led to a kind of excommunication of the monks of Bethlehem (446, 447)." },
  { t = "p", text = "The letters of this second period are those numbered 47 to 116. They comprise those to Nepotianus, nephew of Heliodorus, on the duties of the pastorate (89–96); that to Heliodorus, on the death of his nephew (123–131); that to Paulinus, the Roman Senator, afterwards Bishop of Nola, on his poem in praise of Theodosius, and on the study of Scripture (96–102); that to Furia, on the maintenance of widowhood (102–109); that to the Spanish noble Lucinius, who had sent scribes to copy Jerome’s works (151–154), and to his widow Theodora (154, 155); those to Abigaus, a blind Spanish presbyter (156, 157), and to Salvina, widow of Nebridius, and closely connected with the Emperor Theodosius (163–168); that to Amandus, the Roman presbyter, on a difficult case of conscience (149–151); the letter to Oceanus, defending the second marriage of a Spanish Bishop (141–146); the letter to Læta, wife of Toxotius, son of Paula, on the education of her infant daughter (189–195); and those gems of his writings, the sketches of the lives (Epitaphia) of Fabiola (157–163) and of Paula (195–212)." },
  { t = "p", text = "*The Vulgate*. 391–403. The work of Jerome’s life, the Vulgate version of the Scriptures, was completed in this period. The version which bore the name of Vulgate, the popular or vernacular version, in his day (44, 487–488) was a loose translation of the LXX., of which almost every copy varied from every other. His first effort, therefore, was to translate, or to revise the existing translations, from a correct version of the LXX. And this revised version he used in his familiar expositions, in the monastery (Apol. ii. 24, Vol. iii. 515), though a great part of it was lost even in his lifetime (280), and all that now remains of it is Job, the Psalms, and the Preface to the Books of Solomon (494). But even the most correct text of the LXX., as he saw at once, was insufficient. In Origen’s Hexapla the versions of Theodotion, Aquila, and Symmachus were given, together with two others called Quinta and Sexta, in parallel columns with the LXX. These constantly differed; and the only mode of deciding between them was by going back to the Hebrew—“Hebraica Veritas,” as he constantly terms it (80, 486, 494)." },
  { t = "p", text = "392. Accordingly, he set himself at once, in his settlement at Bethlehem, to the preliminary labours required for this task; and in the sketch of his works in the Catalogue (Vol. iii. 384; On Ill. Men, 135) he says: The New Testament I have restored according to the Greek original; the Old I have translated in accordance with the Hebrew.”" },
  { t = "p", text = "393. But no portion was as yet published. In the following year he published the prophets (80) and sent other portions of his Old Testament version to Marcella at Rome, keeping the rest shut up in his closet (80), and awaiting the judgment of his friends on the portions submitted to them. He purposed from the first to publish the whole, as we see from what he calls his “helmeted preface” to the Books of Samuel and of Kings (489). But it was published in fragments, according as he had leisure to give it a final revision, or according as other circumstances were favourable. The series of Prefaces (487–494) shows that some parts were written or revised in great haste (492, 494), some parts extorted from him by the importunity of his friends (488; see Apol. ii. 25, in Vol. iii. 515); that he was subjected to severe censures and misunderstanding, as to which he was extremely sensitive; that at times he so shrank from publicity that he wished his friends only to read it privately; that he was often, especially in the later portions, dependent on his friends for the provision of the copyists (492, 494). The order of publication can be traced. The Books of Samuel and of the Kings came first, then Job and the Prophets, Ezra and Nehemiah, and the Book of Genesis. Thus far he had proceeded in the year 393 when a break of three years occurred through external hindrances, of which the panic of the invasion of the Huns was the chief." },
  { t = "p", text = "395. He then, at the entreaty of Chromatius and Heliodorus (492), completed the Books of Solomon, intending to proceed systematically to the end." },
  { t = "p", text = "398. But illness intervened, after which he states that the first eight books were still wanting in the copies made for the Spaniard Lucinius (153);" },
  { t = "p", text = "403. nor was the publication resumed till five years later, when the remaining books from Exodus to Ruth and the Book of Esther were brought out (489, 491)." },
  { t = "p", text = "404. The whole was then collected, by others rather than by himself, and gradually superseded all other Latin versions, and, coupled with the version of the New Testament previously made, became the received, or Vulgate, edition of the Bible." },
  { t = "p", text = "393–404. The second period of Jerome’s stay at Bethlehem is the period of his great controversies. These are no less than six in number. (1) That with Jovinian on ascetic practices. (2) That with the Origenists, in which he worked with Theophilus of Alexandria and the Western Bishops. (3) That with John, Bishop of Jerusalem. (4) That with Rufinus. (5) That with Vigilantius. (6) That with Augustin. These may be described somewhat cursorily, the reader being referred for a more detailed statement of them to the Letters and Treatises themselves and to the notices prefixed to them." },
  { t = "p", text = "(1) *Jovinian*. Jovinian was a Roman monk or, rather, solitary (for many took private monastic vows without entering any order or monastery) who had perceived the danger of degrading the ordinary Christian life which lurked in the profession of asceticism. He was not, to judge by Jerome’s quotations from him (347), a man of superior ability; but there are no apparent grounds for the imputations which Jerome throws upon his character. He put off the monastic dress, and lived like other men; and, though he refused to marry, maintained his right as a Christian to do so. He argued that the conditions of virginity, marriage, and widowhood were equal in God’s sight, provided men lived in faith and piety; and that eating and fasting were indifferent if men gave God thanks. He seems to have had some influence, and it is stated that some who had made vows of virginity were led through his teaching marry. Certainly his views were condemned by the Pope Siricius, by Ambrose, and by Augustin." },
  { t = "p", text = "393. He published a book in Rome, maintaining these opinions, and others of a more speculative character, which was sent to Jerome, and was at once answered by him in his treatise “Against Jovinian” (346–416). The more speculative matters he deals with calmly; but the anti-ascetic views he treats with violence and contempt. “These are the hissings of the old serpent; by these the dragon expelled man from Paradise.” His intemperateness, which threw contempt upon marriage, was severely blamed by his friends at Rome, who tried to stop the publication (79; see also Ruf. Apol. ii. 44, Vol. iii. 480); but he only replied by renewed expressions of derision, and, several years later, when he has occasion to refer to Jovinian, he says, “This man, after being condemned by the authority of the Roman Church, amidst his feasts of pheasants and swine’s flesh, I will not say gave up, but belched out, his life” (417)." },
  { t = "p", text = "(2) *Origenism*. 393–403. The second great controversy in which Jerome was engaged at this period relates to Origenism, about which a great controversy had arisen at Alexandria, leading to its condemnation by the Bishops of Palestine and Cyprus in the East, and by the Pope and the Bishop of Milan and others in the West." },
  { t = "p", text = "The great church teacher of Alexandria in the third century was but little known in the West. Anastasius the Pope, in the year 399, declared that he neither knew who he was nor what he had written (Vol. iii. 433). Jerome, who had made acquaintance with his writings during his first sojourn in the East, conceived a strong admiration for him; he did not, indeed, accept all his views, as may be seen from the first letter in which he alludes to him (22); but on his coming to Rome he did all in his power to make him known. He was invited by Damasus to translate some of his works (485); and when he found ignorant condemnations passed upon him he praised him with his usual vehemence and without discrimination, even eulogizing the Πεπὶ ᾽Αρχῶν on which the subsequent controversy mainly turned (46; Ruf. Ap. ii. 13, Vol. iii. 467). He had also quoted without blame in his Commentary on the Ephesians statements such as those relating to the pre-existence of human souls and possible restoration of Satan (Ruf. Apol. i. 448, 454). But it was rather a literary enthusiasm and an admiration of original genius than an express consent to Origen’s system. His calm judgment in later years was, that his literary services to the Church were inestimable, but that his doctrinal views were to be read with the greatest caution, and that those specially impugned were heretical (176, 177, 238, 244). It must be allowed, however, that he appears in his earlier stage as the vehement panegyrist of Origen (46, 48), and in his later stage as his equally vehement condemner; and also that this change seems less the effect of conviction than of a fear of the imputation of heresy (Apol. iii. 33, Vol. iii. 535)." },
  { t = "p", text = "The monks in the deserts near Alexandria were divided, some holding Origenistic views, and some those of an opposite tendency and verging upon Anthropomorphism. Theophilus, the Bishop of Alexandria, at first sided with the Origenists, but afterwards turned against them, and became their relentless persecutor. During his former phase he was appealed to by John, Bishop of Jerusalem, in his controversy with Epiphanius and Jerome (427), and took his part so vehemently that he sent his confidant Isidore to Jerusalem, nominally to inquire, but really to crush out all opposition, as he stated in a letter to John (444). This letter fell into the hands of Jerome and his friends, and the intentions of Theophilus were frustrated. A period of suspicious silence followed (134); but when Theophilus had undergone his change he found a ready instrument in Jerome, who threw himself eagerly into the conflict (182–184), translated the encyclicals of Theophilus (185, 186, 189) which led to the condemnation of Origen in the East, and even his diatribe against St. John Chrysostom for receiving Isidore and his brethren, whom Theophilus now treated as his enemies (214). Jerome also, through his friends Pammachius, Marcella, and Eusebius (186, 256), procured the condemnation of Origen in the West." },
  { t = "p", text = "(3) *John of Jerusalem*. The controversy with John of Jerusalem forms an episode in the more general controversy. John had been trained among the Origenistic ascetics, Epiphanius among the anti-Origenists. Jerome appears to have undergone no change in his sentiments as to Origen during the first period of his stay at Bethlehem [see his Preface to the Book of Hebrew Questions (486, 487) written in 388], and was on good terms with the Bishop of Jerusalem and with Rufinus, who was then living on the Mount of Olives." },
  { t = "p", text = "393. But at the beginning of the second period a certain Aterbius came to Jerusalem and spread suspicion and alarm of heresy. Jerome, perhaps weakly, “gave him satisfaction” as to his faith (Apol. iii. 33, Vol. iii. 535), while by John and Rufinus he was treated as a busybody (*id*.). This produced the first estrangement, which was greatly increased by the visit of Epiphanius in the following year. The scenes which followed may be read in Jerome’s treatise, “Against John of Jerusalem” (430) and in Epiphanius’ letter translated by Jerome (83–85). Epiphanius was popular at Jerusalem, and after a scene in the church, in which he preached against Origenism and John against Anthropomorphism, a breach was made between the two prelates. Epiphanius came to stay at Bethlehem, and spoke of John as well nigh a heretic. John spoke of Epiphanius as “that old tard” (430). The monks of Bethlehem took part with Epiphanius; and he, to prevent their being deprived of clerical ministration by Bishop John, ordained Jerome’s brother Paulinian at his monastery of Ad in the diocese of Eleutheropolis. He was then only thirty years old, and was ordained against his will, and with the employment of force and even gagging (83). Epiphanius, returning to Cyprus, wrote to John a letter explaining his conduct (83–89) which was translated by Jerome, but which did little to allay the strife. John placed the monasteries, at least partially, under an interdict (446–447), and appealed to Rome and to Alexandria, and afterwards to Rufinus, the Pretorian Prefect at Constantinople (174, 447). Theophilus at first took John’s side vehemently; but the mission of his confidant Isidore miscarried (444, 445), and after some time his views of the situation changed and he made peace with Jerome and his friends." },
  { t = "p", text = "397 or 398. John also was appeased; and Jerome, who had written a long and bitter account of the controversy in his treatise to Pammachius “Against John of Jerusalem” (424–447), seems suddenly to have let the whole matter drop; the treatise was not finished and was not published, and we read of the strife no more." },
  { t = "p", text = "(4) Rufinus. 398–404. The quarrel with Jerome’s early friend Rufinus did not, like that with John pass away. Jerome had deeply loved Rufinus (4) and highly respected Melania in early days (5, 7, 53). He had spoken of Rufinus in his Chronicle for the year 378 as “insignis monachus” (Ruf. Ap. ii. 25, 26, Vol. iii. 471); we do not read of any estrangement till some years after his return to Palestine." },
  { t = "p", text = "392. We do not, indeed, find the warm affection which we should expect in two intimate friends who meet after a long separation; and it is possible that Jerome’s omission of Rufinus’ name from his Catalogue of Church Writers may indicate a coolness on one side which was resented on the other. But they admit that their friendship remained (Ruf. Ap. ii. 8 (2), vol. iii. 465), and that there was frequent intercourse between the monks of Bethlehem and those of the Mount of Olives (*id*.)." },
  { t = "p", text = "393–394. The visit of Aterbius (Ap. iii. 33, Vol. iii. 535) and that of Epiphanius mark the time of estrangement. Rufinus was with Bishop John in the scenes in the Church of the Resurrection, and is mentioned in Epiphanius’ letter as a presbyter as to whose views he is paternally anxious (84-87). In the quarrel between John and Jerome Rufinus took decidedly the Bishop’s side (84, 430, compared with 250). Jerome’s mind grew full of suspicion, so that he even imputed to him that he had bribed some one in the monastery at Bethlehem to steal from the lodgings of Fabiola his translation of the letter of Epiphanius to John (Ap. iii. 4, Vol. iii. 521)." },
  { t = "p", text = "397. But when Rufinus was leaving Palestine, friendship was restored. They partook together of the Eucharist, and joined hands (Ap. iii. 33, Vol. iii. 535), and Jerome accompanied his friend some way upon his journey; but the reconciliation was short-lived. When in Rome, Rufinus prefixed to a translation of Origen’s Περὶ ᾽Αρχῶν a preface (168–170) which referred in laudatory terms to Jerome as his forerunner in this work, thus seeming to expose Jerome to the suspicions and condemnation which might be expected to fall on one who undertook such a work. This work was sent to Jerome by his friends Pammachius and Oceanus (175), together with a Preface written by Rufinus to a translation of the Apology for Origen by Pamphilus the Martyr. They spoke of the alarm excited at Rome by the translation of the Περὶ ᾽Αρχῶν, and their suspicions that the translation was so made as to veil the heresies contained in the original work; they begged that Jerome would translate the work as it stood in the original, and pointed out that his own reputation for orthodoxy was at stake (175). Jerome at once complied. He sent to them a literal translation of Origen’s work together with a letter describing the relation in which he had stood and still stood to Origen: he admired him as a biblical scholar, but had never accepted him as a dogmatic teacher (176, 177). He at the same time wrote a letter to Rufinus, couched in friendly terms, but remonstrating with him for the use he had made of his name (170). This letter, having been sent to Jerome’s friends at Rome, was kept back by them (Ap. i. 12, Vol. iii. 489) and not delivered to Rufinus, and thus the quarrel, which might have been allayed, became irreparable." },
  { t = "p", text = "401–404. The further progress of the dispute is described in the notice prefixed to the Apologies of Jerome and Rufinus (Vol. iii. 434–5, 482, 518). It may suffice here to say that this disgraceful and unseemly wrangle between two well-known Christian teachers, conducted publicly before the whole Church, and breeding a hatred which Jerome continued to express even after Rufinus’ death (498, 500) has only one redeeming feature to the historian, namely, that it brings to our knowledge many instructive facts which would otherwise have lain hid." },
  { t = "p", text = "396. (5) *Vigilantius*. The controversy with Vigilantius consists only of Jerome’s letter to him (131–133) and the treatise “against Vigilantius” (417–423). He had been originally introduced to Jerome by Paulinus, Bishop of Nola, who spoke of him in high terms (123). No questions arose between them during his stay at Bethlehem. He even spoke of Jerome at times with extravagant praise (132). But he appears to have had some connection with Rufinus (Ap. iii. 19, Vol. iii. 529), and Jerome accused him afterwards of having conveyed some mss. into the monastery at Bethlehem, probably from that on the Mount of Olives (Apol. iii. 5, 19, Vol. iii. 521, 529). Jerome afterwards heard a report that Vigilantius had written and spoken against him in various places (131), and had accused him of Origenism. To this his letter is a reply. The anti-ascetic writings of Vigilantius to which Jerome’s treatise is a reply have not come down to us. Gennadius (de Script. Eccl. 35) says that he was an ignorant man, but polished in words. But, whatever his ability or literary power, he was one of the few who were able to judge rightly of the ascetic and superstitious practices by which Christianity was being overlaid; and it is on this point that Jerome is most violent and contemptuous in his treatment of him. The notices prefixed to the Letter (131) and Treatise (417) will complete this statement." },
  { t = "p", text = "394–404. (6) *Augustin*. The remaining controversy of this period is that with St. Augustin. The two men had at an earlier time had some friendly relations, and Alypius, Augustin’s friend, had stayed with Jerome at Bethlehem. But Augustin, then coadjutor Bishop of Hippo, in a letter to Jerome (112), found fault with some of his statements in his Commentary on the Galatians, to which, no doubt, his attention had been called by Alypius. Jerome had maintained that the scene in Gal. ii. in which St. Paul rebukes St. Peter for inconsistent compliances with Judaism, was a merely feigned dispute, arranged between the two Apostles in order to make the truth clear to the members of the Church. Augustin objects that this is practically imputing falsehood to the Apostles. He touched upon other points, such as the translation of Scripture and the doctrine of marriage, in a manner savouring of assumption, considering the high position of Jerome, who was also eight years his senior. Through a strange series of misadventures, which illustrate the difficulty of communications at that epoch, this letter was never delivered to Jerome till nine years after it was written. It fell into the hands of persons who copied it, and became known in the West. Jerome heard casually that it had been seen among his works in an island in the Adriatic. It appeared as if Augustin had wished to gain credit by attacking a well-known man behind his back. And this suspicion was hardly allayed by a second letter from Augustin, which partially explained what had occurred (140), or by a third, in which, in answer to a letter from Jerome sending some of his works and warning his correspondent that, if it came to blows, the result might be like that described in Virgil, where the old Entellus strikes down young Dares, Augustin criticises both severely and ignorantly Jerome’s great work of translating the Hebrew Scriptures. Jerome’s patience begins to fail (189). “Send me your original letter,” he says, “signed by your own hand, or else cease to attack me.” And he comments in his turn somewhat sharply on some of Augustin’s interpretations of the Psalms. It was only on the receipt of Augustin’s reply to this letter (214), couched in terms of deep respect, and deprecating any ill feeling between Christian friends, such as had arisen in the case of Rufinus, that Jerome finally answered the original letter, written ten years before, and received a letter which completely restored friendship. Henceforward they are at one. Letters pass freely between them; Augustin consults Jerome on the difficult question of the origin of souls (272, 283), and foregoes the expression of Traducianism, to which he is inclined, in deference to Jerome’s objections; and he consults him on the Pelagian question, and sends Orosius to sit at his feet. Jerome recognises that each has his proper gift, and gives a plenary adherence to all that Augustin teaches. Alypius, their original link, is joined with Augustin in the address of Jerome’s last letter to him (282); Paula, the grand-daughter of Jerome’s chief friend, is called by him the granddaughter of Augustin; and through this unity the families of Paula and Melania, which had been severed by the adherence of the one to Jerome and the other to Rufinus, are reunited by the coming of Pinianus and his wife, the younger Melania, from the church of Hippo to the convent at Bethlehem. The letters from which this episode is drawn are incorporated into the volume containing works of Augustin, and are not reprinted here. But no life of Jerome, however limited or unpretending, would be satisfactory without some account of the relations of the two great doctors of Latin Christianity." },
  { t = "p", text = "*Bethlehem, Third Period*. 405–420. The last period of Jerome’s life was passed in the midst of privations, the loss of friends, and frequent illnesses. Paula had died. Jerome was poor (500, 214, 215) and often weak (498, 500). His eyesight failed (*id*.). He had enemies around him (261, 262) and in the high places of the Empire (237, 499). The barbarians were sweeping across the Empire (237, 500), some, like the Isaurians, threatening the North of Palestine (214) and even penetrating at one time to Southern Syria and Egypt (*id*.), while the main stream, after devastating Jerome’s native Dalmatia, passed on under Alaric to the sack of Rome." },
  { t = "p", text = "410. Fugitives from Rome and Italy crowded to Bethlehem, adding greatly to Jerome’s labours (499, 500). It seemed as the end of the world were at hand (260). In the sack of Rome Pammachius and Marcella died (257, 500). Eustochium followed them eight years later. The controversy with the Pelagians led to the burning of the monasteries at Bethlehem, probably also to renewed estrangement of his Bishop, John of Jerusalem, and his successor Praylus." },
  { t = "p", text = "417. But he continued his work with no abatement of ardour or vigour, as may be seen from the Prefaces to his later Commentaries (500, 501). He had still friends about him, Pinianus, Albina, Melania, and the younger Paula (Ep. cxliii.); a few survivors even in Rome, Oceanus and the younger Fabiola (252, 253); and men in many lands who honoured and consulted him, as is seen by his letters; and, above all, the friendship of Augustin. The letters of this period take a wider range than those going before, Jerome’s fame being now world-wide; their addresses embrace Dalmatia (220), Gaul (215), Rome (252, 253), and Africa (260, 261). Their contents will be best estimated from the notices prefixed to them; but we may mark as specially important the ascetic letter to Rusticus, on the solitary life (244), to Ageruchia, and those on perseverance in widowhood (230), and to Demetrias on the preservation of virginity (260–272), which contain vivid pictures of the life (233) and events (236, 237) of the time, and of the sack of Rome (237, 257); the Memoir, addressed to Principia, of Marcella, who died from her ill treatment in that great day of doom (253); the letter to Evangelus (288) containing Jerome’s view of the origin and mutual relations of the three orders of the Ministry; and that to Sabinianus, the lapsed Deacon, who had introduced disorder into the monasteries at Bethlehem (289–295)." },
  { t = "p", text = "*Pelagianism*. The only great controversy of this period is the Pelagian, in which Jerome seems to have engaged rather at the instance of others than on his own initiative. He shows some mildness in dealing with the Pelagians, and wishes more to win than to condemn them (449, 499); his temperament was not such as to incline him, like Augustin, to take an attitude of vehement hostility to the Pelagian tenets." },
  { t = "p", text = "414–418. But Orosius came from North Africa, where the Council of Carthage had lately been held; and when, the next year, Pelagius and Cælestius came to Palestine, and Councils were held, first at Jerusalem under Bishop John, who was favourable to the reception of Pelagius, and subsequently at Diospolis, Palestine became the centre of the controversy." },
  { t = "p", text = "416. Augustin from Africa and Ctesiphon from Rome appealed to him (272, 280); both Orosius and Pelagius quoted his words as making for them; and at length Jerome himself felt compelled to take the pen. He resorted in this his last controversial work, as in his first against the Luciferians, to the form of dialogue. The argument must be praised for its moderation, though it must be confessed that this is gained at the expense of liveliness; it was impossible for Jerome, as a “Synergist,” or believer in the co-operation of the human will with the divine, to throw himself into the fray with the eagerness of a convinced Predestinarian. But he does not scruple to brand Pelagius as a heretic; and to a heretic he would show no mercy (449). His treatise, notwithstanding its fine drawn argument, made him at once the leader of the orthodox party in the East, and the target for the enmity of their adversaries." },
  { t = "p", text = "416–7. A crowd of Pelagian monks attacked the monasteries, slew some of their inmates, and burned or threw down the buildings, the tower in which Jerome had taken refuge alone escaping (Aug. de Gestis Pelag. 66). This violence, however, was checked by a strong letter from Pope Innocentius (280, 281) to Bishop John, who died soon after; and Jerome, to whom the Pope wrote at the same time (280), speaks of Augustin’s cause as triumphant (282), and of Pelagius, like another Catiline, having left the country, though Jerusalem remains in the hands of some hostile power which he speaks of under the name of Nebuchadnezzar (282). It cannot be said, however, that Jerome’s arguments produced much effect in the East. He was withstood by Theodore of Mopsuestia (see Migne’s Jerome, ii. 807–14) as “saying that men sin by nature, not by will”; and from the West also a treatise opposing his views was sent to him (282) by Annianus, a deacon of Celeda, to which he was never able to reply." },
  { t = "p", text = "His Bible work during these last fifteen years consisted entirely of Commentaries on the Prophets. Those on the Minor Prophets were finished in 406; that on Daniel in 407; that on Isaiah in 408–10; that on Ezekiel in 410–14. That on Jeremiah up to ch. xxxii. occupied the remaining years. The Prefaces to these Commentaries (499–501) are full of interest, recording the sack of Rome (499, 500), the death of Rufinus (498, 500), and the rise of Pelagianism, while the Commentary on Ezekiel itself (Book ix.) speaks of the occupation of Rome by Heraclian. His failing health and eyesight (498, 500), the Pelagian Controversy, the other trials above mentioned (499) and the care of the monasteries and pilgrims (500, 501), increased by the death of Eustochium in 418, shortened his time for work, and his Commentary on Jeremiah was cut short at ch. xxxii. by his last illness. Yet his last work is full of energy and of his old controversial vigour." },
  { t = "p", text = "The last year of his life is believed to have been occupied by a long illness, in which he was tended by the younger Paula and Melania. The Chronicle of Prosper of Aquitaine gives September 20, 420, as the day of his death. Many legends sprung up around his memory. His remains are said to have been transferred from the place where they were buried beside those of Paula and Eustochium, near the grotto of the Nativity, to the Church of Santa Maria Maggiore at Rome, and miracles to have been wrought at his tomb. His descriptions of hermit life in the desert no doubt gave rise to the tradition that he was always attended by a lion, as represented in painting and sculpture, especially in the well-known painting of Albert Dürer. With such traditions a historical work must not be burdened." },
]

[[section]]
id = "chapter-4"
title = "Chapter IV. The Writings of Jerome."
level = 1
blocks = [
  { t = "p", text = "The following is a list of the writings arranged under various heads, and showing the date of composition and the place held by each in the Edition of Vallarsi, the eleven volumes of which will be found in Migne’s Patrologia, vols. xxii. to xxx. The references are to the volumes of Jerome’s works (i.–xi.) in that edition." },
  { t = "p", text = "I. Bible translations:" },
  { t = "p", text = "(1) From the Hebrew.—The Vulgate of the Old Testament, written at Bethlehem, begun 391, finished 404, vol. ix." },
  { t = "p", text = "(2) From the Septuagint.—The Psalms as used at Rome, written in Rome, 383, and the Psalms as used in Gaul, written at Bethlehem about 388. These two are in parallel columns in vol. x. The Gallican Psaltery is collated with the Hebrew, and shows by obeli (†) the parts which are in the LXX. and not in the Hebrew, and by asterisks (*) the parts which are in the Hebrew and not in the Greek." },
  { t = "p", text = "The Book of Job, forming a part of the translation of the LXX. made between 386 and 392 at Bethlehem, the rest of which was lost (Ep. 134), vol. x." },
  { t = "p", text = "(3) From the Chaldee.—The Books of Tobit and Judith, Bethlehem, 398, vol. x." },
  { t = "p", text = "(4) From the Greek.—The Vulgate version of the New Testament made at Rome between 382 and 385. The preface is only to the Gospels, but Jerome speaks of and quotes from his version of the other part also (De Vir. Ill. 135; Ep. 71 and 27), vol. x." },
  { t = "p", text = "II. Commentaries:" },
  { t = "p", text = "(1) Original.—Ecclesiastes, vol. iii., Bethlehem, 388; Isaiah, vol. iv., Bethlehem, 410; Jeremiah i.–xxxii., 41, vol. iv., Bethlehem, 419; Ezekiel, vol. v., Bethlehem, 410–14; Daniel, vol. v., Bethlehem, 407; the Minor Prophets, vol. vi., Bethlehem, at various times between 391 and 406; Matthew, vol. vii., Bethlehem, 398; Galatians, Ephesians, Titus, Philemon, vol. vii, Bethlehem, 388." },
  { t = "p", text = "(2) Translated from Origen.—Homilies on Jeremiah and Ezekiel, vol. v., Bethlehem, 381; on Luke, vol. vii., Bethlehem, 389; Canticles, vol. iii., Rome and Bethlehem, 385–87." },
  { t = "p", text = "There is also a Commentary on Job, and a specimen of one on the Psalms, attributed to Jerome, vol. vii., and the translation of Origen’s Homilies on Isaiah, also attributed to him, vol. iv." },
  { t = "p", text = "Books illustrative of Scripture:" },
  { t = "p", text = "(1) Book of Hebrew names, or Glossary of Proper Names in the Old Testament, Bethlehem, 388, vol. iii. 1." },
  { t = "p", text = "(2) Book of Questions on Genesis, Bethlehem, 388, vol. iii. 301." },
  { t = "p", text = "(3) A translation of Eusebius’ book on the sites and names of Hebrew places, Bethlehem, 388, vol. iii. 321." },
  { t = "p", text = "(4) Translation of Didymus on the Holy Spirit, Rome and Bethlehem, 385–87, vol. ii. 105." },
  { t = "p", text = "IV. Books on Church History and Controversy (all in vol. ii.):" },
  { t = "p", text = "(1) Book of Illustrious Men, or Catalogue of Ecclesiastical Writers, Bethlehem, 392." },
  { t = "p", text = "(2) Dialogue with a Luciferian, Antioch, 379." },
  { t = "p", text = "(3) Lives of the Hermits: Paulus, Desert, 374; Malchus and Hilarion, Bethlehem, 390." },
  { t = "p", text = "(4) Translation of the Rule of Pachomius, Bethlehem, 404." },
  { t = "p", text = "(5) Books of ascetic controversy, against Helvidius, Rome, 304; against Jovinian, Bethlehem, 393; against Vigilantius, Bethlehem, 406." },
  { t = "p", text = "(6) Books of personal controversy, against John, Bishop of Jerusalem, Bethlehem, 397 or 398; against Rufinus, i. and ii. 402, iii. 404." },
  { t = "p", text = "(7) Dialogue with a Pelagian, Bethlehem, 416." },
  { t = "p", text = "V. General History:" },
  { t = "p", text = "Translation of the Chronicle of Eusebius, with Jerome’s additions, vol. viii., Constantinople, 382." },
  { t = "p", text = "VI. Personal:" },
  { t = "p", text = "The series of letters, vol. i. Ep. i., Aquileia, 311; 2–4, Antioch, 374; 5–17, Desert 374–79; 18, Constantinople, 381; 19–45, Rome, 382–85; 46–148, Bethlehem, 386–418." },
  { t = "p", text = "The works attributed to Jerome, but not genuine, which are given in Vallarsi’s edition are: A breviary, commentary, and preface on the Psalms, vol. vii.; some Greek fragment and a lexicon of Hebrew names; the names of places in the Acts; the ten names of God; the benedictions of the patriarchs; the ten temptations in the desert; a commentary on the Song of Deborah; Hebrew Questions in Kings and Chronicles; an exposition of Job, vol. iii.; three letters in vol. i., and fifty-one in vol. xi., together with several miscellaneous writings in vol. xi. most of which are by Pelagius." },
  { t = "p", text = "*Bibliography*.—The writings of Jerome were, on the whole, well preserved, owing to the great honour in which he was held, in the Middle Ages. Considering the number of the mss., the variations are not numerous. The Editio Princeps of the Letters and a few of the Treatises appeared in Rome in 1470, and another almost contemporaneous with this in Maintz (Schöffer), after which they were reprinted in Venice (1476), Rome (1479), Parma (1480), Nürenberg (1485), and in several other places. The Editio Princeps of the Commentaries appeared in Nürenberg in 1477, and was several times reprinted in other places; that of the Translation of Origen’s Homilies on St. Luke, etc., in Basle, 1475; that of the Lives of the Hermits in Nürenberg, 1476, and of the Chronicle at Milan in 1475." },
  { t = "p", text = "But the true Editio Princeps, containing Jerome’s works as a whole, is that of Erasmus (Basle, 1516–20), who bestowed on it his great critical power, aided by his strong admiration for Jerome. He was assisted by Œcolampadius and other scholars. This held its ground till 1560, when an edition appeared by Marianus Victorius, afterwards Bishop of Rieti (Rome, Paulus Manutius), which enlarged the notes and corrected the text of Erasmus, but, like him, included many spurious writings. This edition was dedicated to Pius V. and Gregory XIII., and was the favourite edition of the Roman Church. In 1684 appeared the edition of Tribbechovius of Gotha (Frankfort and Leipzig) which embodied the emendations of critics up to that date, and was published at the expense of the Protestant Frederick, Duke of Saxony. In 1693 came the Benedictine edition of Martianay and Pouget (Paris), which gave the original text of the Vulgate and a new, though still very imperfect arrangement of the Letters and Treatises. But all previous editions were thrown into the shade by that of Dominic Vallarsi the learned priest of Verona (folio ed., Verona, 1734–42; quarto, Venice, 1766–72). In this edition the Treatises are separated from the Letters, and both Letters and Treatises are arranged in order of time, the dates and the process by which they are arrived at being clearly given. I have only in one or two instances found reason to alter Vallarsi’s dates. The explanatory notes, however, are not as complete as might be wished, and the references are often wrong or imperfect. This edition is reprinted by Migne, who marks the pages of it in large print in the text, and most modern writers refer to it alone, as has been done in this volume." },
  { t = "p", text = "*Literature*.—Three short Lives of Jerome, composed in the Middle Ages by unknown authors (one of which was falsely attributed to Gennadius), are given by Vallarsi in his Prolegomena (vol. i. 175–214); one of these is said by Zockler to be by Sebastian of Monte Cassino. Another, written in the fourteenth century by John Andreas of Bologna, was printed at Basle in 1514; and a work by Lasserré was published at Paris in 1530, with a curious title, “La Vie de Monseigneur Sainct Hierome,” with “La Vie de Madame Saincte Paule”; and later works belonging to the uncritical region of thought were published later in Madrid by Bonadies in 1595, and by Cermellus in Ferrara (1648), the latter entirely made up of quotations from Jerome’s writings." },
  { t = "p", text = "Meanwhile the critical faculty had been aroused. Erasmus and Marianus Victorius prefixed Lives of Jerome to their editions of his works in 1516 and 1565; and Baronius in his Annals and Du Pin in his *Bibliotheque des Auteurs Ecclésiastiques* (1686) brought to light additional facts. Martianay at the close of his edition of Jerome’s works published a *Life*, embodying many records of Jerome from the Fathers, but with many mistakes of chronology, some of which were rectified by Tillemont in his painstaking *Mémoires* (Paris, 1707) and by Ceillier in his *Histoire des Auteurs Ecclésiastiques* (Paris, 1742). The work of Sebastiano Dolci (Ancona, 1750) is entirely taken from Jerome’s own writings." },
  { t = "p", text = "But in reference to the Life as to the Writings of Jerome a new epoch was made by Vallarsi in the Preface and the Life prefixed to his Edition of Jerome. Though somewhat dry, it is thoroughly trustworthy, and in Migne’s edition more accessible than any other to those who read Latin. The Bollandist Stilling (Acta Sanctorum, vol. viii., Antwerp, 1762), is less occupied with additions to our knowledge of the man and his works than with the honouring of the Saint. The work of the learned Dane, Engelstoft (1797), gives a more comprehensive estimate of Jerome’s historical position than any of his predecessors. The account of Jerome in Schrökh’s Ecclesiastical History (1786) and the articles of Cölln in Ersch and Grüber’s Encyclopädie and of Hagenbach in Herzog’s Real-Encyclopädie are excellent. In French we have the account of Jerome’s ascetic influence in Montalembert’s *Monks of the West* (Paris, 1861); and the *Histoire de St. Jérome* by Collombet (Paris, 1844) is useful in the appreciation of the personal and archæological part of the subject, though accepting with uncritical partisanship the polemical attitude of Jerome. We may add for English readers the articles Hieronymus in the *Dictionaries of Greek and Roman Biography* and *of Christian Biography*." },
  { t = "p", text = "Our own generation has produced two excellent works: that of Dr. Otto Zöckler, *Hieronymus*, *Sein Leben und Werken* (Gotha, Perthes, 1865), and that of Amédée Thierry, *Saint Jérome*, *la Société chrétienne à Rome et l’émigration romaine en terre sainte* (Paris, 1867, originally published in the *Revue des Deux Mondes*). The former is a lucid, impartial, and comprehensive account of Jerome’s Life and Writings; the latter, a series of very vivid and interesting sketches of Jerome himself, his friends and his times, which, though generally accurate, is occasionally swayed from truth by imagination, and at times is betrayed by sympathy with the modern Roman Catholic system into mistakes of judgment. Both these writers give copious and enlightening extracts from Jerome’s writings in the original; but the value of those of Thierry is lessened by the references being to the ill-arranged edition of Martianay instead of that of Vallarsi." },
  { t = "p", text = "It will be sufficiently obvious why it has been impossible to include all the works of Jerome in the present translation, but a few explanations may be desirable." },
  { t = "p", text = "An exact translation of the Vulgate would serve no good purpose; and, if made, would naturally form part of a series designed to illustrate the criticism of the Scriptures." },
  { t = "p", text = "The Commentaries and works illustrative of the Scriptures would by themselves form two volumes of equal size with the present. Though they contain much that is interesting—the opinions of various writers, such as Origen, Apollinarius, Gregory Nazianzen, or Didymus, a few celebrated passages, such as that which caused the controversy between Jerome and Augustin, and a few remarkable allusions to historical events, such as the capture of Rome by Heraclian—the general tenour of them is hardly of sufficient importance to justify the labour of translation or the bulk and expense of the additional volumes. An exception might be made in favour of the Book on the Site and Names of Hebrew Places; but this is a work of Eusebius rather than Jerome (see pp. 485, 486 and Prolegomena to Eusebius, Vol. i. of this series); and it was necessary to confine the Translation of Jerome to a single volume, with the exception of the Book *On Illustrious Men* and the *Apology against Rufinus*, which will be found in Vol. iii. of this Series." },
  { t = "p", text = "The Chronicle of Eusebius would, if translated at all, find its place in the works of Eusebius." },
  { t = "p", text = "The Books on Church History and Controversy are given in full." },
  { t = "p", text = "Of the Letters, which, excepting the Vulgate, form the most important legacy of Jerome to posterity, all those which have a personal or a historical interest have been translated. The only omissions are (1) the exegetical letters, to which what has been said of the Commentaries applies; (2) the letters to Augustin, which will be found in Vol. i. of the first series of this Library, annexed to the letters of Augustin to which they are replies; and (3) the encyclicals and letters of Theophilus, which have been summarised." },
  { t = "p", text = "For a separate statement of the works which are given in this volume the reader will naturally consult the table of contents; and, for a more detailed account of the books themselves, the introductions prefixed to each." },
]

[[section]]
id = "chapter-5"
title = "Chapter V. Estimate of the Scope and Value of Jerome's Writings."
level = 1
blocks = [
  { t = "p", text = "*General*. The writings of Jerome must be estimated not merely by their intrinsic merits, but by his historical position and influence. It has already been pointed out that he stands at the close of the old Græco-Roman civilisation: the last Roman poet of any repute, Claudian, and the last Roman historian, Ammianus Marcellinus, died before him. Augustin survived him, but the other great Fathers, both in the East and in the West, had passed away before him. The sack of Rome by Alaric (410) and its capture by Heraclian (413) took place in his lifetime, and the Empire of the West fell in the next thirty years. Communication between East and West had become rarer and mutual knowledge less. Eusebius knew no Latin, Ambrose no Greek; Rufinus, though a second-rate scholar, was welcomed in Italy on his return from the East in 397 as capable of imparting to the Latins the treasures of the Greek Church writers. The general enfeeblement of the human mind, which remains one of the problems of history, had set in. The new age of Christendom which was struggling to the birth was subject to the influence of Jerome more than to that of any of the Fathers." },
  { t = "p", text = "*Secular Learning*. As regards general learning, indeed, it was impossible that any legacy should descend from him. He had systematically disparaged it (35-36, 498), though making use and even a parade of it (101, 114, 149, 178); and had defended himself by disingenuous pleas from the charge of acquiring it after his mature convictions were formed (Apol. i. 30, 31, Vol. iii. 498–499). His influence, therefore, would but increase the deep ignorance of literature which now settled upon mankind till the times of the Renaissance. His style indeed, is excellent, correct, and well balanced, full of animation and of happy phrases (see Index—Proverbs), and passing from one subject to another with great versatility. It is contrasted by Erasmus with the barbarisms of the Schoolmen, as that of the Christian Cicero. But it has also Cicero’s faults, especially his diffuseness. His Latinity is remarkably pure, and with the exception of the frequent use of the infinitive to express a purpose, and of a few words of late-Latin like *confortare*, we are hardly aware in reading him that we are 400 years away from the Augustan Age. His mastery of style is the more remarkable because he wrote nothing but a few letters and a very poor Commentary till about his thirty-fifth year." },
  { t = "p", text = "*Letters*. His letters gain their special charm from being so personal. He himself, his correspondents, and the scenes in which they moved, are made to live before our eyes. See especially his descriptions of Roman life in the Epistles to Eustochium (Ep. xxii.), to Paula on the death of Blesilla (Ep. xxxix.), to Læta (Ep. cvii.) on the education of her child, and Ageruchia (Ep. cxxiii.); his account of the lives of Fabiola (Ep. lxxvii.), of Paula (Ep. cviii.), and of Marcella (Ep. cxxvii.); his description of the clerical life in his letter to Nepotian (Ep. lii.), and of the monastic life in his letters to Rusticus (Ep. cxxv.) and to Sabinian (Ep. cxlvii.); his letters of spiritual counsel to a mother and daughter (Ep. cxvii.), to Julianus (Ep. cxviii.), and to Rusticus (Ep. cxxii.), and of hermit life in his letter to Eustochium (Ep. xxii., pp. 24–25); his satirical description of Onasus (Ep. xl.), Rufinus (p. 250), and Vigilantius (p. 417); his enthusiastic delight in the Holy Land in the letter written by him to Paula and Eustochium inviting Marcella to join them (Ep. xlvi). Other characteristic and celebrated letters are those to Asella (xlv.) on his leaving Rome; to Pammachius (lvii.) on the best method of translation, which shows the liberties taken by translators in his time; to Oceanus (lxix.) in defence of a second marriage contracted by a Spanish Bishop, the first having been before baptism; to Magnus (lxx.), indicating his use of secular literature, and showing the great range of his knowledge; to Lucinius (lxxi.) on the copying of his works; to Avitus (cxxiv.) on the book of Origen, Περὶ ᾽Αρχῶν; to Demetrias (cxxx.) on the maintenance of virginity; to Ctesiphon (cxxxiii.) on the Pelagian controversy. (See also Index, words Stories and Pictures of Contemporary Life.)" },
  { t = "p", text = "*Publication*. Two circumstances conduced to the vividness and importance of this series of letters. One of these is the fact that no distinct line separated private documents from those designed for publication. In the Catalogue of his works (De Vir. Ill. 135)1 he says: “Of the Letters to Paula and Eustochium, the number is infinite: I write them every day.” And, when he became celebrated, he says (79) that whatever he wrote was at once laid hold of and published, alike by friends and enemies. We have therefore frequently his most confidential utterances; while on the other hand his letters frequently pass into treatises, and he turns to address others than those to whom he is writing (59, 273, 274). But the process of publication was precarious; so that between Letters xlvi. and xlvii. there is a gap of seven years (386–93) without any letter. The other circumstance is the difficulty of communication, which made letters rare and induced greater care in their composition. Both these circumstances are well illustrated by the early correspondence of Jerome with Augustin. Augustin wrote from Hippo in Africa a long and important letter to Jerome (Ep. lvi.) in the year 394, which did not reach Jerome at Bethlehem for nearly ten years. It was committed to a presbyter named Profuturus to carry to Jerome; but he, being elected to a bishopric before he started, turned back, and soon afterwards died. The letter was neither forwarded to Jerome nor returned to Augustin; but it was copied by others and became known in the West, while its somewhat severe criticisms were unknown to Jerome himself. After a time Augustin became aware by a short letter of introduction written by Jerome to a friend that his first letter had miscarried, and he wrote a second (Ep. lxvii.) much in the same strain; but Paulus, to whom it was entrusted, alleging his fear of the sea, failed to go to Bethlehem; and a copy of the letter was found a year or two afterwards by a friend of Jerome’s bound up with some of Augustin’s treatises in an island of the Adriatic. Jerome on hearing of this was naturally incensed; and it was not till the year 404 that he received an authentic copy of both letters direct from Augustin, and was able to return an answer. His answer, however, and a knowledge of his views are fuller than they might have been had personal communication been easier." },
  { t = "p", text = "*Knowledge*. His knowledge was vast and many-sided [See especially the enumeration of Christian writers who used Pagan literature (149–151), the curious stories about marriage gathered from all ages (383–386), the descriptions of various kinds of food and medicines (392–394) and the account of Pythagoras and his doctrines (Apol. iii., 39, 40, in this Series, Vol. iii. 538)], but it was rather the curiosity of the monks of a later day than the temper of the philosopher or the historian. He was well acquainted with the history and literature of Rome and of Greece; he translated the Chronicle of Eusebius; he speaks of the various routes to India (245), of the Brahmans (97, 193, 397), of the custom of Suttee (381), and of Buddha (380). But he is quite uncritical; he makes no correction of the faults of the Chronicle, and his own additions to it reveal his credulity. He was deeply affected by the sack of Rome, and recurs to it again and again; but his reflections upon this and similar events hardly go beyond those of a mediæval chronicler. He is a recluse, and has no thought of the general interests of mankind." },
  { t = "p", text = "*Church History*. This lack of criticism and of general interests combined with lack of time to prevent his making any considerable contribution to church history. That he had some faculties for this is shown by several passages in his Dialogue with a Luciferian (328–331) and his Catalogue of Ecclesiastical Writers (On Illustrious Men, Vol. iii. 361–384). But his conception of church history is shown by his declaration (315) that he intended the Lives of Malchus and Hilarion as part of a series, which when completed would have formed an ecclesiastical history. Such a history would have been nothing more than a prolix edition of Rufinus’ History of the Monks. Jerome’s value to the church historian is quite of another kind; it lies in the illustration of contemporary life furnished by his own life and letters and by the controversies in which he was engaged." },
  { t = "p", text = "*Theology*. These controversies bring us to consider Jerome’s position as a theologian. Here he is admittedly weak. He had no real interest in the subject. The first of his letters which deals with theology, that written from the Desert to Pope Damasus, points out clearly the difficulty raised by the difference of phraseology of East and West, the Eastern speaking of one Essence and three Substances, the Western, of one Substance and three Persons. But he makes no attempt to grasp the reality lying behind these expressions, and merely asks not to have the Eastern terms forced on his acceptance, while he professes in the most absolute terms his submission to the decision of the Bishop of Rome. This lack of genuine theological interest best explains his conduct in relation to Origen, his extravagant laudation of him at one time (46), his violent condemnation at another (187). He was carried away by Origen’s genius and industry in the department of biblical criticism and exegesis in which he was himself absorbed, and though in his earlier discussion of the Vision of Isaiah (22), which touched the doctrine of the Trinity, he had put aside Origen’s view that the Seraphim were the Son and the Spirit as wrongly expressing their relation to the Father, the doctrinal question was feebly present to his thoughts, and he repeated Origen’s exposition without blame as to the pre-existence of souls and the restoration of Satan (Ruf. Apol. ii. 13, Vol. iii. 467). When the subject of Origen’s orthodoxy was raised at a later time, he was unaware of any inconsistency when he fell in with the general condemnation of his doctrine. So with regard to Eusebius of Cæsarea. In the Preface to the translation of his Book on the Site and Names of Hebrew Places (485), he is “vir admirabilis”; in his controversy with Rufinus, Eusebius is nothing but a heretic. In his controversy with Augustin as to the quarrel between St. Peter and St. Paul in Gal. ii., which he interpreted as fictitious and pre-arranged with a view to bring out St. Paul’s solution of the question about the Gentile converts, he was manifestly in the wrong, and eventually seems to have felt this, yet as one who was silenced rather than convinced. At a later period he says to Augustin (Ep. cxxxiv.), “If the heretics see that we hold divergent opinions they will say calumniously that this is a result of hatred, whereas it is my firm resolution to love you, to look up to you, to defer to you with admiration, and to defend your opinions as my own.” His dread of heresy may be gathered from passage in the Anti-Pelagian Dialogue (i. 28) in which he expressly declares that, while sin can be forgiven, heresy, as being impiety, is subject to the threat: “They that forsake the Lord shall be consumed.” It is true that in his Catalogue he shows wider sympathies, and defends himself in writing to Augustin for the admission into it of men like Philo Judæus and Seneca. But this, though it might have led him to the larger views of the heathen world held by Origen and Clement, did not prevent his condemning to eternal torments even the most virtuous of the heathen. He tells Marcella, a Roman lady (41–42), that one object he has in writing to her is to instruct her that the consul-elect Vettius Agorius Prætextatus, who was known as a model of public and domestic virtue, and who had then recently died, is in Tartarus, while their friend Lea, who had died the same day, is in heaven." },
  { t = "p", text = "The lack of deep theological conviction is shown in his Dialogue against the Pelagians, where it is evident that he is far from that original and deep view of human corruption which Augustin maintained; indeed, he appears at times to be arguing against his own side, when he says (471) that, “Till the end we are subject to sin; not,” (as the opponent falsely imputes to him) “through the fault of our nature and constitution, but through frailty and the mutability of the human will, which varies from moment to moment”—a sentence which might be taken as expressing the doctrine of Pelagius himself. It is evident that in these cases he is swayed not so much by the force of truth as by the authority of certain powerful Bishops and the wish to maintain his orthodox reputation. In his other controversies, with Helvidius, Jovinian, John, Bishop of Jerusalem, Vigilantius, and Rufinus, his method is take for granted the opinion current among the Christians of his day, and to support it by copious (sometimes excessive) quotations from Scripture, and by arguments sometimes well chosen and acutely maintained, as in the book against Helvidius (339), sometimes of the most frivolous character, as in that against Vigilantius (422). In the three last of these controversies the opposition is embittered by personal feeling, and Jerome hardly places any restraint on the contempt and hatred which it engenders." },
  { t = "p", text = "In his criticisms on Scripture, however, he has a freer judgment, as when he says (337): Whether you think that Moses wrote the Pentateuch, or that Ezra re-edited it, in either case I make no objection;” or (349) that it was the Book of Deuteronomy which was found in the Temple in the reign of Josiah; or contrasts “the flickering flame of the Apostles” with the brightness of the lamp of Christ” (468). There are three points especially on which Jerome reached an independent conviction, and maintained it courageously. (1) He made a clear distinction between the Old Testament Canon and the Apocrypha (194, 491, 492, 493) and this although he records the fact that the Nicene Council had placed the Book of Judith in the Canon (494). For this he is justly commemorated in the Articles of the Church of England (Art. 6). (2) He maintains the essential identity of Bishops and Presbyters (288) and the development of the Episcopal out of the Presbyteral office (288, 289), in the face of the rapid tendency to the extreme exaltation of the Episcopate (92). (3) In the great work of his life, the composition of the Vulgate, he showed a clear and matured conviction, and a noble tenacity, unshaken either by popular clamour (490) or authority like that Augustin (189)." },
  { t = "p", text = "A few words may here be said on the asceticism which Jerome so eagerly promoted. If we ask how it was that he embraced it so fervently as to read it into almost every line of the Scriptures, we can only answer that it was part of the spirit of the time. Jerome had not the elevation of mind which might have enabled him to exercise a judgment upon the current which was bearing him away, or the higher critical power which would distinguish between what was in the Scriptures and what he brought to them. His habit of mind was to accept his general principles from some kind of church authority, which was partly that of the Bishops, partly the general drift of the sentiment of the Christians of his day; and having accepted them, to advocate them vehemently and without discrimination. Jerome could indeed exercise a certain moderation, even in matters of asceticism (246, 267). But his general attitude is that which disdained the common joys of life, which thought of eating, drinking, clothing or lodging, and most of all marriage, as physical indulgences which should suppressed as far as possible, rather than as the means of a noble social intercourse; and dread of impurity haunts him to such an extent as to entirely vitiate his view of society, and to cause him to disparage, and all but forbid, the married relation (29, 384, etc.). His view of monasticism in its inner principles is seen in his treatises against Helvidius, Jovinian, and Vigilantius. The reader may be specially referred to a passage in the last-named treatise, p. 423. If we ask the further question, how the tendency arose which so completely swayed him, we can only attribute it to the state of Roman society in the fourth and fifth centuries, which laid earnest men open to influences already working in other parts of the world. Jerome knew of the Brahmans and the Gymnosophists of India (97, 193, 397), and he several times mentions Buddha (380) as an example of asceticism. But students of Buddhism have failed to trace any direct filiation between the asceticism of the East and the West.[^1] The existence of Essenes in Palestine and the Therapeutæ in Egypt, and the unquestionable fact that Christian asceticism originated in Egypt, make some connection with the East probable; and the system of Manes, though at once repudiated, may have exerted some subtle influence. Certain states of the human mind seem all-pervasive, like the causes of diseases which spring up at once in many different places; and principles like those of asceticism maybe communicated through chance conversations or commercial intercourse when the soil is prepared for their reception." },
  { t = "note", id = "1", text = "See a remarkable article on “The New Testament and Buddhism,” by Professor Estlin Carpenter, in the *Nineteenth Century* for July, 1879." },
  { t = "p", text = "But it seems better to look to the social and political state of the world as the predisposing cause of monasticism. Even in the East it is thought that the miserable conditions of practical life have been the main cause of a religion of despair; and the decline and fall of the Roman Empire in the fourth and fifth centuries offered similar causes in abundance. The grace which is completely absent from the great Christian writers of that epoch is hope. Such hope as is found even in the Civitas Dei of Augustin is entirely that of the world to come. The world before them seemed hopelessly corrupt. The descriptions of private morals given by Jerome are borne out by Ammianus Marcellinus; the failure of public spirit and military valour was equally conspicuous; and Gratian and Stilicho appear on the scene only to be murdered. When the crash of Alaric’s sack of Rome shook the existing world, no one realised that a new Christian world was coming, and the flight which Jerome witnessed of thousands of citizens from the sinking city to the mountains of Palestine was but one symptom of the despair which made them, to use Jerome's words, “quit the most frequented cities that in the fields and solitude they might mourn for sin and draw down on themselves the compassion of Christ” (446)." },
  { t = "p", text = "As an illustrator of Scripture, Jerome did much, and in some respects excellent work. The Book of Hebrew Names was no doubt of much use in the ages in which men were ignorant of Hebrew, although it has the clumsy arrangement of a separate glossary for each book of the Bible; it is very faulty and uncritical; there is no explanation, for instance, of Lehi in Judges, or of Engedi or Ichabod in 1 Samuel, or of Bethabara or Bethany in John, and the meanings given to words are extremely uncritical and sometimes absurd. Cherubim is said to mean a multitude of knowledge; Jezebel, “flowing with blood, a litter, a dung heap”; and Laodicæa, “the tribe beloved of the Lord, or, they have been in vomiting.” It is worthless now except as showing the state of knowledge of the fourth century A.D., and that of the author of the Vulgate." },
  { t = "p", text = "The Book of the Site and Names of Hebrew Places belongs rather to Eusebius than to Jerome, being translated from Eusebius, though with some additions. An account of it is given in the Prolegomena to Eusebius. The arrangement of this book is, like the former, very inconvenient, the names under each letter being placed in separate groups in the order of the books of Scripture in which they occur: for instance, under the letter A we have first the names in Genesis, then those in Exodus, and so on. But there is less room here for what is fanciful, and the testimony of men who lived in Palestine in the fourth and fifth centuries is of great value still to the student of sacred topography. When the places are outside the writer’s knowledge, credulity is apt to creep in, as when the author tells us that in Ararat portions of the ark are still to be found." },
  { t = "p", text = "The Book of Hebrew Questions on Genesis is simply a set of notes on passages where the reference to the Hebrew text gives a different reading from that of the LXX., which was received as authoritative up to Jerome’s day. For instance, in Gen. xlvi. 26, the LXX. says that Joseph’s descendants born in Egypt were nine, the Hebrew, two. Jerome accounts for the discrepancy by the supposition that the LXX. added in the sons of Ephraim and Manasseh, who were subsequently born in Egypt, and who in the LXX. are enumerated just before. Jerome states in the preface his intention to compose a similar set of notes to each book of the Old Testament, but he was never able to go beyond Genesis. What he gives us is of considerable interest and value, so that it is a matter of regret that he could not go further." },
  { t = "p", text = "As a commentator, Jerome’s fault is a lack of independence; his merit lies in giving fully the opinions of others which we might otherwise not have known. This he considers, as seen in his controversy with Rufinus, the principal task of a commentator (Apol. i. 16, Vol. iii. 491). In the passages there at issue, he states the most incongruous interpretations without criticising them, and Rufinus can hardly be blamed for suggesting that he is sometimes expressing his own opinion under that of “another.” In matters of ordinary interpretation his judgment is good. But fanciful ideas are apt to intrude, as when, in the Commentary on Ecclesiastes, the city delivered by the poor wise man is made to mean the individual delivered from Satan by the better man within him, or the Church delivered from the hosts of darkness by Christ. When an occasion for the introduction of asceticism occurs, Jerome never hesitates at any process, however absurd, which will draw the passage to a sanction of his peculiar views (Against Jovin. i. 30, p. 368). We should have been glad, had space permitted, to have given a specimen of his better style of exposition, but it was found necessary to suppress this." },
  { t = "p", text = "It is as a translator of Scripture that Jerome is best known. His Vulgate was made at the right moment and by the right man. The Latin language was still living, although Latin civilisation was dying; and Jerome was a master of it. It is only to be regretted that he did not give fuller scope to his literary power in his translation of Scripture. In his letter to Pammachius on the best method of translation (114), he advocates great freedom of treatment, even such as amounts to paraphrase, and even to the insertion of sentences congruous to the sense of the author. He takes the fact that the quotations in the New Testament from the Old often present discrepancies in words and sense as justifying similar discrepancies in a translation. He does not, however, appear in dealing with ordinary books to have used this license in any extreme way; and his translations, without departing from correctness, read as good literary composition. But from the operation of his rules of translation he expressly excepts the Scriptures. “In other books,” he says (113), “my effort is not to express word by word, but meaning by meaning; but in the Holy Scriptures even the order of the words has a secret meaning” (et ordo verborum mysterium est). He even says (80): “A version made for the use of the Church, even though it may possess a literary charm, ought to disguise and avoid it as far as possible.” This belief in a secret meaning in the words and their order as apart from the sense goes far to injure the Vulgate translation. His principles, indeed, are excellent, namely, (1) never to swerve needlessly from the original; (2) to avoid solecisms; (3) even by the admission of solecisms, to give the true sense. But it is evident that they must be vitiated by the supposition of a hidden sense in the arrangement of the words; and the result is a style which frequently deprives a passage of its proper elegance, and the pleasure which it should give to the reader, and a too frequent introduction of solecisms and abandonment of the attempt to make sense of a passage. It also gives an air of saintly unreality to many parts of the Scriptures and thus to produce confusion. The merits of the translation are also very various, as was the time which Jerome bestowed on the different parts. The Books of Solomon, for instance, he translated very rapidly (492), the Book of Tobit in a single day (494). For some parts he trusted to his own knowledge, for others he obtained aid at great cost of money and trouble (Preface to Job and to Tobit, 491, 494). But, while we thus go behind the scenes, we must not fail to look at the completed work as a whole. It was wrought out with noble perseverance and unflinching purpose amidst many discouragements. It was highly prized even in Jerome’s lifetime, so that he is able to record that a large part of the Old Testament was translated into Greek from his version by his friend Sophronius, and was read in the Eastern Churches (492). After his death it won its way to become the Vulgate or common version of Western Christendom; it was the Bible of the Middle Ages; and in the year 1546 (eleven centuries after its author’s death) was pronounced by the Council of Trent to be the only true version, and alone authorised to be printed." },
  { t = "p", text = "A few personal details must be given to illustrate his method of composition and his surroundings. Nothing is known of his personal appearance. His health was weak, and he had several long illnesses, especially in the years 398, 404, and in the last year of his life. His eyes began to fail during his stay at Constantinople in 380–382, and he usually employed an amanuensis; but he still wrote at times, and what he wrote was more polished than what he dictated. “In the one case I constantly turn the stylus; in the other, whatever words come into my mouth I heap together in my rapid utterance” (Ep. lxxiv. 6). He composed with great rapidity, and dictated at times as much as one thousand lines in a day (Comm. on Ephes., Book ii. Preface). He often, especially when in weak health, lay on a couch (Ep. lxxiv. 6), taking down one volume after another to aid in the composition of his Commentaries. And he often sat late into the night [his book against Vigilantius was “the lucubration of a single night” (423)], the days being occupied in business of various kinds, as stated above—the monasteries, the entertainment of strangers, the teaching of boys, the exposition of Scripture to his brethren in the monastery, and, according to Sulpicius Severus, the charge of the parish of Bethlehem. As has been mentioned above, he was interrupted again and again by illness, and on several occasions was in alarm from the threatened invasions of the Huns and Isaurians, and at the end of his life from the violent adherents of Pelagius. He also suffered from poverty, and his friends one by one were taken from him. But he persevered against all obstacles; and his latest works, the Anti-Pelagian Dialogue and the Commentary on Jeremiah, show little if any diminution of power." },
]

[[section]]
id = "chapter-6"
title = "Chapter VI. Character and Influence of Jerome."
level = 1
blocks = [
  { t = "p", text = "This Introduction must be concluded with a few words on the character and influence of Jerome, which are taken from the article upon him in the *Dictionary of Christian Biography*. He was vain and unable to bear rivals, extremely sensitive as to the estimation in which he was held by his contemporaries, and especially by the Bishops; passionate and resentful, but at times becoming suddenly placable; scornful and violent in controversy; kind to the weak and the poor; respectful in his dealings with women; entirely without avarice; extraordinarily diligent in work, and nobly tenacious of the main objects to which he devoted his life. There was, however, something of monkish cowardice in his asceticism, and his influence was not felt by the strong." },
  { t = "p", text = "His influence grew through his life and increased after his death. If we may use a scriptural phrase which has sometimes been applied to such influence, “He lived and reigned for a thousand years.” His writings contain the whole spirit of the Church of the Middle Ages, its monasticism, its contrast of sacred things with profane, its credulity and superstition, its value for relics, its subjection to hierarchical authority, its dread of heresy, its passion for pilgrimages. To the society which was thus in a great measure formed by him, his Bible was the greatest boon which could have been given. But he founded no school and had no inspiring power; there was no courage or width of view in his spiritual legacy such as could break through the fatal circle of bondage to received authority which was closing round mankind. As Thierry says in the last words of his work on St. Jerome, “There is no continuation of his work; a few more letters of Augustin and Paulinus, and night falls over the West.”" },
]


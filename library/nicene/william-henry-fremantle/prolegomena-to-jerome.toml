  { t = "p", text = "388. Commentary on Galatians, Ephesians, Titus, Philemon. | 382. Altar of Victory in Roman Senate removed." },
  { t = "p", text = "388. Book of Hebrew Names. | 383. Death of Gratian. Maximus Emperor." },
  { t = "p", text = "388. Questions on Genesis. | 384. Treaty with Persia. | 384. Death of Damasus (December)." },
  { t = "p", text = "388. Translation of Eusebius on Sites and Names of Hebrew Places. | 385. Theophilus, Bishop of Alexandria, succeeds Timothy." },
  { t = "p", text = "385. Siricius Pope." },
  { t = "p", text = "388. Translation of Didymus on the Holy Spirit. | 386. John succeeds Cyril as Bishop of Jerusalem." },
  { t = "p", text = "386. Execution of Priscillian for heresy at Treves." },
  { t = "p", text = "389. Translation of Origen on St. Luke. | 387. Sedition of Antioch." },
  { t = "p", text = "390. Lives of Malchus and Hilarion, hermits. | 388. Death of Maximus. Valentinian II. Emperor." },
  { t = "p", text = "389. Temple of Serapis destroyed." },
  { t = "p", text = "391. Vulgate version of Old Testament begun. | 390. Massacre of Thessalonica. Penance of Theodosius. | 390. Death of Gregory Nazianzen." },
  { t = "p", text = "392. Aterbius at Jerusalem. | 392. Book of Illustrious Men. | 391. Death of Valentinian II. Eugenius usurper." },
  { t = "p", text = "392. Laws of Theodosius against Paganism." },
  { t = "p", text = "392. Epiphanius visits Jerusalem. Schism between Jerome and John of Jerusalem, till 397. | 392. Commentary on Nahum, Micah, Zephaniah, Haggai, Habakkuk. | 394. Defeat of Eugenius. Theodosius sole Emperor." },
  { t = "p", text = "393. Books against Jovinian. | 394. Death of Theodosius. Arcadius (æt. 18) Emperor of the East; Honorius (æt. 14) of the West. Stilicho Minister and General in the West. Death of Rufinus the Prefect at Constantinople. | 395. Augustin, Bishop of Hippo." },
  { t = "p", text = "394. Beginning of controversy with Augustin." },
  { t = "p", text = "395. Jerome denounced to the Emperor." },
  { t = "p", text = "395. The Huns invade Northern Syria. | 396. Alaric invades Greece." },
  { t = "p", text = "395. Oceanus and Fabiola at Bethlehem. | 397. Alaric conquered by Stilicho in Arcadia. | 397. Death of Ambrose. Simplicianus, Bishop of Milan." },
  { t = "p", text = "397. Theophilus of Alexandria turns against Origenism. Rufinus reconciled to Jerome and returns to Italy. | 397. Commentary on Jonah. | 398. Death of Gildo in Africa. Alaric Master-General of Illyricum and King of the Visigoths. | 398. Chrysostom, Bishop of Constantinople." },
  { t = "p", text = "398. Pope Siricius dies. Anastasius Pope." },
  { t = "p", text = "397. Book against John, Bishop of Jerusalem. | 399. Fall of Eutropius." },
  { t = "p", text = "398. Jerome suffers from a long illness. | 398. Commentary on St. Matthew. | 400. Gainas, conspirator, defeated and slain. | 400. Origenism condemned by Bishops of Alexandria, Rome, and Milan, and by the Emperors." },
  { t = "p", text = "401–4. Controversy between Jerome and Rufinus. | 400. (August 15). Simplicianus dies. Venerius, Bishop of Millan." },
  { t = "p", text = "402. Against Rufinus, Books i. and ii. | 402. Pope Anastasius dies. Innocentius Pope." },
  { t = "p", text = "403. Commentary on Obadiah. | 402. Death of Epiphanius." },
  { t = "p", text = "403. Stilicho defeats Alaric at Pollentia and Verona." },
  { t = "p", text = "404. Triumph of Honorius. Last gladiatorial shows. | 404. Exile of Chrysostom to Cucusus." },
  { t = "p", text = "404. Death of Paula. | 404. Translation of the acetic rule of Pachomius. | 404. Emperor’s court at Ravenna. | 404. Gladiatorial shows at Rome ended by the sacrifice of Telemachus, the monk." },
  { t = "p", text = "404. Close of controversy with Augustin. | 404. Against Rufinus, Book iii. | 404. Death of the Empress Eudoxia." },
  { t = "p", text = "404–5. Jerome ill for several months." },
  { t = "p", text = "405. Northern Palestine invaded by Isaurians. | 406. Stilicho defeats Radagaisus at Fæsulæ, and negotiates with Alaric." },
  { t = "p", text = "406. Commentary on Zachariah, Malachi, Hosea, Joel, Amos—concluding Minor Prophets. | 407. Gaul overrun by barbarians. | 407. Death of Chrysostom at Comana." },
  { t = "p", text = "407. Constantine usurps power in Britain and Gaul." },
  { t = "p", text = "406. Book against Vigilantius. | 408. Rome besieged by Alaric, and ransomed." },
  { t = "p", text = "408. Disgrace and death of Stilicho." },
  { t = "p", text = "407. Commentary on Daniel. | 408. Death of Arcadius. Theodosius II. Emperor. Pulcheria Regent." },
  { t = "p", text = "410. Death of Rufinus. | 410. Commentary on Isaiah. | 409. Revolt of Britain. | 409. Pelagius at Rome." },
  { t = "p", text = "412. Cœlestius condemned at Carthage. | 410. Sack of Rome by Alaric. Death of Alaric." },
  { t = "p", text = "413. Pelagius in Palestine. | 410. Egypt, Phœnicia, etc. threatened by barbarians (Ep. cxxvi.)." },
  { t = "p", text = "414. Orosius sent by Augustin to Jerome. | 414. Commentary on Ezekiel. | 411. Death of Constantine and other usurpers. Victories of Roman General Constantius. | 411. Dispute between Catholic and Donatist Bishops at Carthage. Persecution of Donatists by the Civil Power." },
  { t = "p", text = "414. Pinianus and Melania at Jerusalem. | 412. Death of Theophilus, Bishop of Alexandria." },
  { t = "p", text = "415. Synod at Jerusalem admits Pelagius. | 413. Expedition and death of Heraclian, Count of Africa." },
  { t = "p", text = "417. Monasteries of Bethlehem burnt by adherents of Pelagius. | 414. Adolphus, successor of Alaric, marries Galla Placidia." },
  { t = "p", text = "415. Goths established in Aquitaine and Spain. | 415. Schism at Antioch healed. Alexander sole Bishop." },
  { t = "p", text = "416. Dialogue against the Pelagians. | 415. Council of Diospolis (Lydda) accepts Pelagius." },
  { t = "p", text = "418. Death of Eustochium. | 418–19. Commentary on Jeremiah. | 417. Pope Innocentius dies. Zosimus Pope." },
  { t = "p", text = "420. Jerome dies (September 20) at Bethlehem. | 417. Death of John, Bishop of Jerusalem. Succeeded by Praylus." },
]

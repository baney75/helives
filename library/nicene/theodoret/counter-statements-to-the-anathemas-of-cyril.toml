  { t = "note", id = "215", text = "John x. 5, 26" },
  { t = "note", id = "216", text = "1 Cor. ii. 12" },
  { t = "p", text = "*Against X.*—The unchangeable nature was not changed into nature of flesh, but assumed human nature and set it over the common high priests, as the blessed Paul teaches in the words, “For every high priest taken from among men is ordained for men in things pertaining to God, that he may offer both gifts and sacrifices for sins: who can have compassion on the ignorant and on them that are out of the way; for that he himself also is encompassed with infirmity. And by reason hereof he ought, as for the people so also for himself.”[^217] And a little further on interpreting this he says, “As was Aaron so also was the Christ.”[^218] Then pointing out the infirmity of the assumed nature he says, “Who in the days of His flesh, when He had offered up prayers and supplication with strong crying and tears unto Him that was able to save Him from death, and was heard for His godly fear, though He was a son yet learned obedience by the things that He suffered: and having been made perfect He became unto all that obey Him the author of eternal salvation; named of God a high priest of the order of Melchisedec.”[^219] Who then is He who was perfected by toils of virtue and who was not perfect by nature? Who is He who learnt obedience by experience, and before his experience was ignorant of it? Who is it that lived with godly fear and offered supplication with strong crying and tears, not able to save Himself but appealing to Him that is able to save Him and asking for release from death? Not God the Word, the impassible, the immortal, the incorporeal, whose memory is joy and release from tears, “For he has wiped away tears from off all faces,”[^220] and again the prophet says, “I remembered God and was glad,”[^221] Who crowneth them that live in godly fear, “Who knoweth all things before they be,”[^222] “Who hath all things that the Father hath;”[^223] Who is the unchangeable image of the Father,[^224] “Who sheweth the Father in himself.”[^225] It is on the contrary that which was assumed by Him of the seed of David, mortal, passible, and afraid of death; although this itself afterwards destroyed the power of death through union with the God who had assumed it;[^226] which walked through all righteousness and said to John, “Suffer it to be so now for thus it becometh us to fulfil all righteousness.”[^227] This took the name of the priesthood of Melchisedec, for it put on infirmity of nature;—not the Almighty God the Word. Wherefore also, a little before, the blessed Paul said, “We have not a high priest which cannot be touched with the feeling of our infirmities, but was in all points tempted like as we are yet without sin.”[^228] It was the nature taken from us for our sakes which experienced our feelings without sin, not He that on account of our salvation assumed it. And in the beginning of this part of his subject he teaches us in the words “Consider the apostle and high priest of our profession, Jesus, who was faithful to Him that appointed Him as also Moses was faithful in all His house.”[^229] But no one holding the right faith would call the unmade the uncreate, God the Word coeternal with the Father, a creature; but on the contrary, Him of David’s seed Who being free from all sin was made our high priest and victim, after Himself offering Himself on our behalf to God having in Himself the Word, God of God, united to Himself and inseparably conjoined." },
  { t = "note", id = "217", text = "Hebrews v. 1–3" },
  { t = "note", id = "218", text = "Hebrews v. 4, 5" },
  { t = "note", id = "219", text = "Hebrews v. 7, 10" },
  { t = "note", id = "220", text = "Isaiah xxv. 8" },

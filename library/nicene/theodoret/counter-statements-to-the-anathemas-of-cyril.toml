  { t = "note", id = "228", text = "Heb. iv. 15" },
  { t = "note", id = "229", text = "Heb. iii. 1–2" },
  { t = "p", text = "*Against XI.*—In my opinion he appears to give heed to the truth, in order that, by concealing his unsound views by it, he may not be detected in asserting the same dogmas as the heretics. But nothing is stronger than truth, which by its own rays uncovers the darkness of falsehood. By the aid of its illumination we shall make his heterodox belief plain. In the first place he has nowhere made mention of intelligent flesh, nor confessed that the assumed man was perfect, but everywhere in accordance with the teaching of Apollinarius he speaks of flesh. Secondly, after introducing the conception of the mixture under other terms, he brings it into his arguments; for there he clearly states the flesh of the Lord to be soulless. For, he says, if any one states that the flesh of the Lord is not proper flesh of the very Word who is of God the Father, but that it is of another beside Him, let him be anathema. Hence it is plain that he does not confess God the Word to have assumed a soul, but only flesh, and that He Himself stands to the flesh in place of soul. We on the contrary assert that the flesh of the Lord having in it life[^230] was life-giving and reasonable, on account of the life-giving Godhead united to it. And he himself unwillingly confesses the difference between the two natures, speaking of flesh, and “God the Word” and calling it “His own flesh.” Therefore God the Word was not changed into nature of flesh, but has His own flesh, the assumed nature, and has made it life-giving by the union." },
  { t = "note", id = "230", text = "᾽ἐμψυχον" },
  { t = "p", text = "*Against XII.*—Passion is proper to the passible; the impassible is above passions. It was then the form of the servant that suffered, the form of God of course dwelling with it, and permitting it to suffer on account of the salvation brought forth of the sufferings, and making the sufferings its own on account of the union. Therefore it was not the Christ[^231] who suffered, but the man assumed of us by God. Wherefore also the blessed Isaiah exclaims in his prophecy, “A man of sorrows and acquainted with grief.”[^232] And the Lord Christ Himself said to the Jews, “Why seek ye to kill me, a man that hath told you the truth?”[^233] But what is threatened with death is not the very life, but he that hath a mortal nature. And giving this lesson in another place the Lord said to the Jews, “Destroy this temple, and in three days I will raise it up.”[^234] Therefore what was destroyed was the (temple descended) from David, and, after its destruction, it was raised up by the only begotten Word of God impassibly begotten of the Father before the ages." },
  { t = "note", id = "231", text = "For “the Christ” we might expect here “the Word,” for that the Christ suffered is the plain statement of Scripture (1 Pet. ii. 21). But Theodoret uses the name Christ of the eternal word, e.g. *de Providentia* x. 661. “When you hear Christ mentioned, understand the only begotten Son the Word, begotten of His Father before the ages, clad in human nature.”" },
  { t = "note", id = "232", text = "Is. liii. 3" },
  { t = "note", id = "233", text = "John vii. 19. d. viii. 40" },

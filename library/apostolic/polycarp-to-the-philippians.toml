[[section]]
id = "introductory-note-to-the-epistle-of-polycarp"
title = "Introductory Note to the Epistle of Polycarp to the Philippians"
level = 1
blocks = [
  { t = "p", text = "[a.d. 65–100–155.] The Epistle of Polycarp is usually made a sort of preface to those of Ignatius, for reasons which will be obvious to the reader. Yet he was born later, and lived to a much later period. They seem to have been friends from the days of their common pupilage under St. John; and there is nothing improbable in the conjecture of Usher, that he was the “angel of the church in Smyrna,” to whom the Master says, “Be thou faithful unto death, and I will give thee a crown of life.” His pupil Irenæus gives us one of the very few portraits of an apostolic man which are to be found in antiquity, in a few sentences which are a picture: “I could describe the very place in which the blessed Polycarp sat and taught; his going out and coming in; the whole tenor of his life; his personal appearance; how he would speak of the conversations he had held with John and with others who had seen the Lord. How did he make mention of their words and of whatever he had heard from them respecting the Lord.” Thus he unconsciously tantalizes our reverent curiosity. Alas! that such conversations were not written for our learning. But there is a wise Providence in what is withheld, as well as in the inestimable treasures we have received." },
  { t = "p", text = "Irenæus will tell us more concerning him, his visit to Rome, his rebuke of Marcion, and incidental anecdotes, all which are instructive. The expression which he applied to Marcion is found in this Epistle. Other facts of interest are found in the Martyrdom, which follows in these pages. His death, in extreme old age under the first of the Antonines, has been variously dated; but we may accept the date we have given, as rendered probable by that of the Paschal question, which he so lovingly settled with Anicetus, Bishop of Rome." },
  { t = "p", text = "The Epistle to the Philippians is the more interesting as denoting the state of that beloved church, the firstborn of European churches, and so greatly endeared to St. Paul. It abounds in practical wisdom, and is rich in Scripture and Scriptural allusions. It reflects the spirit of St. John, alike in its lamb-like and its aquiline features: he is as loving as the beloved disciple himself when he speaks of Christ and his church, but “the son of thunder” is echoed in his rebukes of threatened corruptions in faith and morals. Nothing can be more clear than his view of the doctrines of grace; but he writes like the disciple of St. John, though in perfect harmony with St. Paul’s hymn-like eulogy of Christian love." },
  { t = "p", text = "The following is the original Introductory Notice:—" },
  { t = "p", text = "The authenticity of the following Epistle can on no fair grounds be questioned. It is abundantly established by external testimony, and is also supported by the internal evidence. Irenæus says (*Adv. Hær.*, iii. 3): “There is extant an Epistle of Polycarp written to the Philippians, most satisfactory, from which those that have a mind to do so may learn the character of his faith,” etc. This passage is embodied by Eusebius in his *Ecclesiastical History* (iv. 14); and in another place the same writer refers to the Epistle before us as an undoubted production of Polycarp (*Hist. Eccl.*, iii. 36). Other ancient testimonies might easily be added, but are superfluous, inasmuch as there is a general consent among scholars at the present day that we have in this letter an authentic production of the renowned Bishop of Smyrna." },
  { t = "p", text = "Of Polycarp’s life little is known, but that little is highly interesting. Irenæus was his disciple, and tells us that “Polycarp was instructed by the apostles, and was brought into contact with many who had seen Christ” (*Adv. Hær.*, iii. 3; Euseb. *Hist. Eccl.*, iv. 14). There is also a very graphic account given of Polycarp by Irenæus in his Epistle to Florinus, to which the reader is referred. It has been preserved by Eusebius (*Hist. Eccl.*, v. 20)." },
  { t = "p", text = "The Epistle before us is not perfect in any of the Greek mss. which contain it. But the chapters wanting in Greek are contained in an ancient Latin version. While there is no ground for supposing, as some have done, that the whole Epistle is spurious, there seems considerable force in the arguments by which many others have sought to prove chap. xiii. to be an interpolation." },
  { t = "p", text = "The date of the Epistle cannot be satisfactorily determined. It depends on the conclusion we reach as to some points, very difficult and obscure, connected with that account of the martyrdom of Polycarp which has come down to us. We shall not, however, probably be far wrong if we fix it about the middle of the second century." },
]

[[section]]
id = "epistle-to-the-philippians"
title = "Epistle to the Philippians"
level = 1
blocks = [
  { t = "p", text = "[^337] Polycarp, and the presbyters[^338] with him, to the Church of God sojourning at Philippi: Mercy to you, and peace from God Almighty, and from the Lord Jesus Christ, our Saviour, be multiplied." },
  { t = "note", id = "337", text = "The title of this Epistle in most of the mss. is, “The Epistle of St. Polycarp, Bishop of Smyrna, and holy martyr, to the Philippians.”" },
  { t = "note", id = "338", text = "Or, “Polycarp, and those who with him are presbyters.”" },
]

[[section]]
id = "chapter-1"
title = "Chapter I.—Praise of the Philippians."
level = 1
blocks = [
  { t = "p", text = "I have greatly rejoiced with you in our Lord Jesus Christ, because ye have followed the example[^339] of true love [as displayed by God], and have accompanied, as became you, those who were bound in chains, the fitting ornaments of saints, and which are indeed the diadems of the true elect of God and our Lord; and because the strong root of your faith, spoken of in days[^340] long gone by, endureth even until now, and bringeth forth fruit to our Lord Jesus Christ, who for our sins suffered even unto death, [but] “whom God raised from the dead, having loosed the bands of the grave.”[^341] “In whom, though now ye see Him not, ye believe, and believing, rejoice with joy unspeakable and full of glory;”[^342] into which joy many desire to enter, knowing that “by grace ye are saved, not of works,”[^343] but by the will of God through Jesus Christ." },
  { t = "note", id = "339", text = "Literally, “ye have received the patterns of true love.”" },
  { t = "note", id = "340", text = "Phil. i. 5." },
  { t = "note", id = "341", text = "Acts ii. 24. Literally, “having loosed the pains of Hades.”" },
  { t = "note", id = "342", text = "1 Pet. i. 8." },
  { t = "note", id = "343", text = "Eph. ii. 8, 9." },
]

[[section]]
id = "chapter-2"
title = "Chapter II.—An exhortation to virtue."
level = 1
blocks = [
  { t = "p", text = "“Wherefore, girding up your loins,”[^344] “serve the Lord in fear”[^345] and truth, as those who have forsaken the vain, empty talk and error of the multitude, and “believed in Him who raised up our Lord Jesus Christ from the dead, and gave Him glory,”[^346] and a throne at His right hand. To Him all things[^347] in heaven and on earth are subject. Him every spirit serves. He comes as the Judge of the living and the dead.[^348] His blood will God require of those who do not believe in Him.[^349] But He who raised Him up from the dead will raise[^350] up us also, if we do His will, and walk in His commandments, and love what He loved, keeping ourselves from all unrighteousness, covetousness, love of money, evil speaking, false witness; “not rendering evil for evil, or railing for railing,”[^351] or blow for blow, or cursing for cursing, but being mindful of what the Lord said in His teaching: “Judge not, that ye be not judged;[^352] forgive, and it shall be forgiven unto you;[^353] be merciful, that ye may obtain mercy;[^354] with what measure ye mete, it shall be measured to you again;”[^355] and once more, “Blessed are the poor, and those that are persecuted for righteousness’ sake, for theirs is the kingdom of God.”[^356]" },
  { t = "note", id = "344", text = "Comp. 1 Pet. i. 13; Eph. vi. 14." },
  { t = "note", id = "345", text = "Ps. ii. 11." },
  { t = "note", id = "346", text = "1 Pet. i. 21." },
  { t = "note", id = "347", text = "Comp. 1 Pet. iii. 22; Phil. ii. 10." },
  { t = "note", id = "348", text = "Comp. Acts xvii. 31." },
  { t = "note", id = "349", text = "Or, “who do not obey him.”" },
  { t = "note", id = "350", text = "Comp 1 Cor. vi. 14; 2 Cor. iv. 14; Rom. viii. 11." },
  { t = "note", id = "351", text = "1 Pet. iii. 9." },
  { t = "note", id = "352", text = "Matt. vii. 1." },
  { t = "note", id = "353", text = "Matt. vi. 12, 14; Luke vi. 37." },
  { t = "note", id = "354", text = "Luke vi. 36." },
  { t = "note", id = "355", text = "Matt. vii. 2; Luke vi. 38." },
  { t = "note", id = "356", text = "Matt. v. 3, 10; Luke vi. 20." },
]

[[section]]
id = "chapter-3"
title = "Chapter III.—Expressions of personal unworthiness."
level = 1
blocks = [
  { t = "p", text = "These things, brethren, I write to you concerning righteousness, not because I take anything upon myself, but because ye have invited me to do so. For neither I, nor any other such one, can come up to the wisdom[^357] of the blessed and glorified Paul. He, when among you, accurately and stedfastly taught the word of truth in the presence of those who were then alive. And when absent from you, he wrote you a letter,[^358] which, if you carefully study, you will find to be the means of building you up in that faith which has been given you, and which, being followed by hope, and preceded by love towards God, and Christ, and our neighbour, “is the mother of us all.”[^359] For if any one be inwardly possessed of these graces, he hath fulfilled the command of righteousness, since he that hath love is far from all sin." },
  { t = "note", id = "357", text = "Comp. 2 Pet. iii. 15." },
  { t = "note", id = "358", text = "The form is *plural*, but one Epistle is probably meant. [So, even in English, “letters” may be classically used for a single letter, as we say “by these presents.” But even we might speak of St. Paul as having written his Epistles *to us*; so the Epistles to Thessalonica and Corinth might more naturally still be referred to here]." },
  { t = "note", id = "359", text = "Comp. Gal. iv. 26." },
]

[[section]]
id = "chapter-4"
title = "Chapter IV.—Various exhortations."
level = 1
blocks = [
  { t = "p", text = "“But the love of money is the root of all evils.”[^360] Knowing, therefore, that “as we brought nothing into the world, so we can carry nothing out,”[^361] let us arm ourselves with the armour of righteousness;[^362] and let us teach, first of all, ourselves to walk in the commandments of the Lord. Next, [teach] your wives [to walk] in the faith given to them, and in love and purity tenderly loving their own husbands in all truth, and loving all [others] equally in all chastity; and to train up their children in the knowledge and fear of God. Teach the widows to be discreet as respects the faith of the Lord, praying continually[^363] for all, being far from all slandering, evil-speaking, false-witnessing, love of money, and every kind of evil; knowing that they are the altar[^364] of God, that He clearly perceives all things, and that nothing is hid from Him, neither reasonings, nor reflections, nor any one of the secret things of the heart." },
  { t = "note", id = "360", text = "1 Tim. vi. 10." },
  { t = "note", id = "361", text = "1 Tim. vi. 7." },
  { t = "note", id = "362", text = "Comp. Eph. vi. 11." },
  { t = "note", id = "363", text = "Comp. 1 Thess. v. 17." },
  { t = "note", id = "364", text = "Some here read, “altars.”" },
]

[[section]]
id = "chapter-5"
title = "Chapter V.—The duties of deacons, youths, and virgins."
level = 1
blocks = [
  { t = "p", text = "Knowing, then, that “God is not mocked,”[^365] we ought to walk worthy of His commandment and glory. In like manner should the deacons be blameless before the face of His righteousness, as being the servants of God and Christ,[^366] and not of men. They must not be slanderers, double-tongued,[^367] or lovers of money, but temperate in all things, compassionate, industrious, walking according to the truth of the Lord, who was the servant[^368] of all. If we please Him in this present world, we shall receive also the future world, according as He has promised to us that He will raise us again from the dead, and that if we live[^369] worthily of Him, “we shall also reign together with Him,”[^370] provided only we believe. In like manner, let the young men also be blameless in all things, being especially careful to preserve purity, and keeping themselves in, as with a bridle, from every kind of evil. For it is well that they should be cut off from[^371] the lusts that are in the world, since “every lust warreth against the spirit;”[^372] and “neither fornicators, nor effeminate, nor abusers of themselves with mankind, shall inherit the kingdom of God,”[^373] nor those who do things inconsistent and unbecoming. Wherefore, it is needful to abstain from all these things, being subject to the presbyters and deacons, as unto God and Christ. The virgins also must walk in a blameless and pure conscience." },
  { t = "note", id = "365", text = "Gal. vi. 7." },
  { t = "note", id = "366", text = "Some read, “God in Christ.”" },
  { t = "note", id = "367", text = "Comp. 1 Tim. iii. 8." },
  { t = "note", id = "368", text = "Comp. Matt. xx. 28." },
  { t = "note", id = "369", text = "Πολιτευσώμεθα, referring to the whole conduct; comp. Phil. i. 27." },
  { t = "note", id = "370", text = "2 Tim. ii. 12." },
  { t = "note", id = "371", text = "Some read, ἀνακύπτεσθαι, “to emerge from.” [So Chevallier, but not Wake nor Jacobson. See the note of latter, *ad loc*.]" },
  { t = "note", id = "372", text = "1 Pet. ii. 11." },
  { t = "note", id = "373", text = "1 Cor. vi. 9, 10." },
]

[[section]]
id = "chapter-6"
title = "Chapter VI.—The duties of presbyters and others."
level = 1
blocks = [
  { t = "p", text = "And let the presbyters be compassionate and merciful to all, bringing back those that wander, visiting all the sick, and not neglecting the widow, the orphan, or the poor, but always “providing for that which is becoming in the sight of God and man;”[^374] abstaining from all wrath, respect of persons, and unjust judgment; keeping far off from all covetousness, not quickly crediting [an evil report] against any one, not severe in judgment, as knowing that we are all under a debt of sin. If then we entreat the Lord to forgive us, we ought also ourselves to forgive;[^375] for we are before the eyes of our Lord and God, and “we must all appear at the judgment-seat of Christ, and must every one give an account of himself.”[^376] Let us then serve Him in fear, and with all reverence, even as He Himself has commanded us, and as the apostles who preached the Gospel unto us, and the prophets who proclaimed beforehand the coming of the Lord [have alike taught us]. Let us be zealous in the pursuit of that which is good, keeping ourselves from causes of offence, from false brethren, and from those who in hypocrisy bear the name of the Lord, and draw away vain men into error." },
  { t = "note", id = "374", text = "Rom. xii. 17; 2 Cor. viii. 31." },
  { t = "note", id = "375", text = "Matt. vi. 12–14." },
  { t = "note", id = "376", text = "Rom. xiv. 10–12; 2 Cor. v. 10." },
]

[[section]]
id = "chapter-7"
title = "Chapter VII.—Avoid the Docetæ, and persevere in fasting and prayer."
level = 1
blocks = [
  { t = "p", text = "“For whosoever does not confess that Jesus Christ has come in the flesh, is antichrist;”[^377] and whosoever does not confess the testimony of the cross,[^378] is of the devil; and whosoever perverts the oracles of the Lord to his own lusts, and says that there is neither a resurrection nor a judgment, he is the first-born of Satan.[^379] Wherefore, forsaking the vanity of many, and their false doctrines, let us return to the word which has been handed down to us from[^380] the beginning; “watching unto prayer,”[^381] and persevering in fasting; beseeching in our supplications the all-seeing God “not to lead us into temptation,”[^382] as the Lord has said: “The spirit truly is willing, but the flesh is weak.”[^383]" },
  { t = "note", id = "377", text = "1 John iv. 3." },
  { t = "note", id = "378", text = "Literally, “the martyrdom of the cross,” which some render, “His suffering on the cross.”" },
  { t = "note", id = "379", text = "[The original, perhaps, of Eusebius (*Hist.* iv. cap. 14). It became a common-place expression in the Church.]" },
  { t = "note", id = "380", text = "Comp. Jude 3." },
  { t = "note", id = "381", text = "1 Pet. iv. 7." },
  { t = "note", id = "382", text = "Matt. vi. 13; Matt. xxvi. 41." },
  { t = "note", id = "383", text = "Matt. xxvi. 41; Mark xiv. 38." },
]

[[section]]
id = "chapter-8"
title = "Chapter VIII.—Persevere in hope and patience."
level = 1
blocks = [
  { t = "p", text = "Let us then continually persevere in our hope, and the earnest of our righteousness, which is Jesus Christ, “who bore our sins in His own body on the tree,”[^384] “who did no sin, neither was guile found in His mouth,”[^385] but endured all things for us, that we might live in Him.[^386] Let us then be imitators of His patience; and if we suffer[^387] for His name’s sake, let us glorify Him.[^388] For He has set us this example[^389] in Himself, and we have believed that such is the case." },
  { t = "note", id = "384", text = "1 Pet. ii. 24." },
  { t = "note", id = "385", text = "1 Pet. ii. 22." },
  { t = "note", id = "386", text = "Comp. 1 John iv. 9." },
  { t = "note", id = "387", text = "Comp. Acts v. 41; 1 Pet. iv. 16." },
  { t = "note", id = "388", text = "Some read, “we glorify Him.”" },
  { t = "note", id = "389", text = "Comp. 1 Pet. ii. 21." },
]

[[section]]
id = "chapter-9"
title = "Chapter IX.—Patience inculcated."
level = 1
blocks = [
  { t = "p", text = "I exhort you all, therefore, to yield obedience to the word of righteousness, and to exercise all patience, such as ye have seen [set] before your eyes, not only in the case of the blessed Ignatius, and Zosimus, and Rufus, but also in others among yourselves, and in Paul himself, and the rest of the apostles. [This do] in the assurance that all these have not run[^390] in vain, but in faith and righteousness, and that they are [now] in their due place in the presence of the Lord, with whom also they suffered. For they loved not this present world, but Him who died for us, and for our sakes was raised again by God from the dead." },
  { t = "note", id = "390", text = "Comp. Phil. ii. 16; Gal. ii. 2." },
]

[[section]]
id = "chapter-10"
title = "Chapter X.—Exhortation to the practice of virtue."
level = 1
blocks = [
  { t = "p", text = "[^391] Stand fast, therefore, in these things, and follow the example of the Lord, being firm and unchangeable in the faith, loving the brotherhood,[^392] and being attached to one another, joined together in the truth, exhibiting the meekness of the Lord in your intercourse with one another, and despising no one. When you can do good, defer it not, because “alms delivers from death.”[^393] Be all of you subject one to another[^394] “having your conduct blameless among the Gentiles,”[^395] that ye may both receive praise for your good works, and the Lord may not be blasphemed through you. But woe to him by whom the name of the Lord is blasphemed![^396] Teach, therefore, sobriety to all, and manifest it also in your own conduct." },
  { t = "note", id = "391", text = "This and the two following chapters are preserved only in a Latin version. [See Jacobson, *ad loc*.]" },
  { t = "note", id = "392", text = "Comp. 1 Pet. ii. 17." },
  { t = "note", id = "393", text = "Tobit iv. 10, Tobit xii. 9." },
  { t = "note", id = "394", text = "Comp. 1 Pet. v. 5." },
  { t = "note", id = "395", text = "1 Pet. ii. 12." },
  { t = "note", id = "396", text = "Isa. lii. 5." },
]

[[section]]
id = "chapter-11"
title = "Chapter XI.—Expression of grief on account of Valens."
level = 1
blocks = [
  { t = "p", text = "I am greatly grieved for Valens, who was once a presbyter among you, because he so little understands the place that was given him [in the Church]. I exhort you, therefore, that ye abstain from covetousness,[^397] and that ye be chaste and truthful. “Abstain from every form of evil.”[^398] For if a man cannot govern himself in such matters, how shall he enjoin them on others? If a man does not keep himself from covetousness,[^399] he shall be defiled by idolatry, and shall be judged as one of the heathen. But who of us are ignorant of the judgment of the Lord? “Do we not know that the saints shall judge the world?”[^400] as Paul teaches. But I have neither seen nor heard of any such thing among you, in the midst of whom the blessed Paul laboured, and who are commended[^401] in the beginning of his Epistle. For he boasts of you in all those Churches which alone then knew the Lord; but we [of Smyrna] had not yet known Him. I am deeply grieved, therefore, brethren, for him (Valens) and his wife; to whom may the Lord grant true repentance! And be ye then moderate in regard to this matter, and “do not count such as enemies,”[^402] but call them back as suffering and straying members, that ye may save your whole body. For by so acting ye shall edify yourselves.[^403]" },
  { t = "note", id = "397", text = "Some think that *incontinence* on the part of the Valens and his wife is referred to. [For many reasons I am glad the translators have preferred the reading πλεονεξίας. The next word, *chaste*, sufficiently rebukes the example of Valens. For once I venture not to coincide with Jacobson’s comment.]" },
  { t = "note", id = "398", text = "1 Thess. v. 22." },
  { t = "note", id = "399", text = "Some think that *incontinence* on the part of the Valens and his wife is referred to. [For many reasons I am glad the translators have preferred the reading πλεονεξίας. The next word, *chaste*, sufficiently rebukes the example of Valens. For once I venture not to coincide with Jacobson’s comment.]" },
  { t = "note", id = "400", text = "1 Cor. vi. 2." },
  { t = "note", id = "401", text = "Some read, “named;” comp. Phil. i. 5." },
  { t = "note", id = "402", text = "2 Thess. iii. 15." },
  { t = "note", id = "403", text = "Comp. 1 Cor. xii. 26." },
]

[[section]]
id = "chapter-12"
title = "Chapter XII.—Exhortation to various graces."
level = 1
blocks = [
  { t = "p", text = "For I trust that ye are well versed in the Sacred Scriptures, and that nothing is hid from you; but to me this privilege is not yet granted.[^404] It is declared then in these Scriptures, “Be ye angry, and sin not,”[^405] and, “Let not the sun go down upon your wrath.”[^406] Happy is he who remembers[^407] this, which I believe to be the case with you. But may the God and Father of our Lord Jesus Christ, and Jesus Christ Himself, who is the Son of God, and our everlasting High Priest, build you up in faith and truth, and in all meekness, gentleness, patience, long-suffering, forbearance, and purity; and may He bestow on you a lot and portion among His saints, and on us with you, and on all that are under heaven, who shall believe in our Lord Jesus Christ, and in His Father, who “raised Him from the dead.”[^408] Pray for all the saints. Pray also for kings,[^409] and potentates, and princes, and for those that persecute and hate you,[^410] and for the enemies of the cross, that your fruit may be manifest to all, and that ye may be perfect in Him." },
  { t = "note", id = "404", text = "This passage is very obscure. Some render it as follows: “But at present it is not granted unto me to practise that which is written, Be ye angry,” etc." },
  { t = "note", id = "405", text = "Ps. iv. 5." },
  { t = "note", id = "406", text = "Eph. iv. 26." },
  { t = "note", id = "407", text = "Some read, “believes.”" },
  { t = "note", id = "408", text = "Gal. i. 1." },
  { t = "note", id = "409", text = "Comp. 1 Tim. ii. 2." },
  { t = "note", id = "410", text = "Matt. v. 44." },
]

[[section]]
id = "chapter-13"
title = "Chapter XIII.—Concerning the transmission of epistles."
level = 1
blocks = [
  { t = "p", text = "Both you and Ignatius[^411] wrote to me, that if any one went [from this] into Syria, he should carry your letter[^412] with him; which request I will attend to if I find a fitting opportunity, either personally, or through some other acting for me, that your desire may be fulfilled. The Epistles of Ignatius written by him[^413] to us, and all the rest [of his Epistles] which we have by us, we have sent to you, as you requested. They are subjoined to this Epistle, and by them ye may be greatly profited; for they treat of faith and patience, and all things that tend to edification in our Lord. Any[^414] more certain information you may have obtained respecting both Ignatius himself, and those that were[^415] with him, have the goodness to make known[^416] to us." },
  { t = "note", id = "411", text = "Comp. Ep. of Ignatius to Polycarp, chap. viii." },
  { t = "note", id = "412", text = "Or, “letters.”" },
  { t = "note", id = "413", text = "Reference is here made to the two letters of Ignatius, one to Polycarp himself, and the other to the church at Smyrna." },
  { t = "note", id = "414", text = "Henceforth, to the end, we have only the Latin version." },
  { t = "note", id = "415", text = "The Latin version reads “are,” which has been corrected as above." },
  { t = "note", id = "416", text = "Polycarp was aware of the death of Ignatius (chap. ix.), but was as yet apparently ignorant of the circumstances attending it. [Who can fail to be touched by these affectionate yet entirely calm expressions as to his martyred friend and brother? Martyrdom was the habitual end of Christ’s soldiers, and Polycarp expected his own; hence his restrained and temperate words of interest.]" },
]

[[section]]
id = "chapter-14"
title = "Chapter XIV.—Conclusion."
level = 1
blocks = [
  { t = "p", text = "These things I have written to you by Crescens, whom up to the present[^417] time I have recommended unto you, and do now recommend. For he has acted blamelessly among us, and I believe also among you. Moreover, ye will hold his sister in esteem when she comes to you. Be ye safe in the Lord Jesus Christ. Grace be with you all.[^418] Amen." },
  { t = "note", id = "417", text = "Some read, “in this present Epistle.”" },
  { t = "note", id = "418", text = "Others read, “and in favour with all yours.”" },
]

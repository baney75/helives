  { t = "note", id = "1559", text = "Cod. Sin., at first hand, has “slew them,” but is corrected as above." },
  { t = "note", id = "1560", text = "The meaning is here very obscure, but the above rendering and punctuation seem preferable to any other." },
  { t = "note", id = "1561", text = "Cod. Sin., with several other mss., leaves out “new.”" },
  { t = "note", id = "1562", text = "Jer. iv. 3. Cod. Sin. has “God” instead of “Lord.”" },
  { t = "note", id = "1563", text = "Deut. x. 16." },
  { t = "note", id = "1564", text = "This contrast seems to be marked in the original. Cod. Sin. has, “Behold, receive again.”" },
  { t = "note", id = "1565", text = "Jer. ix. 25, 26." },
  { t = "note", id = "1566", text = "Dressel and Hilgenfeld read, “their covenant,” as does Cod. Sin.; we have followed Hefele." },
  { t = "note", id = "1567", text = "Cod. Sin. has “children of love,” omitting “richly,” and inserting it before “looking forward.”" },
  { t = "note", id = "1568", text = "Literally, “doctrines.”" },
  { t = "note", id = "1569", text = "Not found in Scripture: but comp. Gen. xvii. 26, 27, Gen. xiv. 14." },
  { t = "note", id = "1570", text = "Cod. Sin. inserts, “and then making a pause.”" },
  { t = "note", id = "1571", text = "This sentence is altogether omitted by inadvertence in Cod. Sin." },
  { t = "note", id = "1572", text = "Some mss. here read, “and further:” the above is the reading in Cod. Sin., and is also that of Hefele." },
  { t = "note", id = "1573", text = "This is rendered in the Latin, “the more profound gift,” referring, as it does, to the *Gnosis* of the initiated. The same word is used in chap. i." },
  { t = "note", id = "1574", text = "Literally, “has learned a more germane (or genuine) word from me,” being an idle vaunt on account of the ingenuity in interpreting Scripture he has just displayed." },
]

[[section]]
id = "chapter-10"
title = "Chapter X.—Spiritual significance of the precepts of Moses respecting different kinds of food."
level = 1
blocks = [
  { t = "p", text = "Now, wherefore did Moses say, “Thou shalt not eat the swine, nor the eagle, nor the hawk, nor the raven, nor any fish which is not possessed of scales?”[^1575] He embraced three doctrines in his mind [in doing so]. Moreover, the Lord saith to them in Deuteronomy, “And I will establish my ordinances among this people.”[^1576] Is there then not a command of God [that] they should not eat [these things]? There is, but Moses spoke with a spiritual reference.[^1577] For this reason he named the swine, as much as to say, “Thou shalt not join thyself to men who resemble swine.” For when they live in pleasure, they forget their Lord; but when they come to want, they acknowledge the Lord. And [in like manner] the swine, when it has eaten, does not recognize its master; but when hungry it cries out, and on receiving food is quiet again. “Neither shalt thou eat,” says he “the eagle, nor the hawk, nor the kite, nor the raven.” “Thou shalt not join thyself,” he means, “to such men as know not how to procure food for themselves by labour and sweat, but seize on that of others in their iniquity, and although wearing an aspect of simplicity, are on the watch to plunder others.”[^1578] So these birds, while they sit idle, inquire how they may devour the flesh of others, proving themselves pests [to all] by their wickedness. “And thou shalt not eat,” he says, “the lamprey, or the polypus, or the cuttlefish.” He means, “Thou shalt not join thyself or be like to such men as are ungodly to the end, and are condemned[^1579] to death.” In like manner as those fishes, above accursed, float in the deep, not swimming [on the surface] like the rest, but make their abode in the mud which lies at the bottom. Moreover, “Thou shall not,” he says, “eat the hare.” Wherefore? “Thou shall not be a corrupter of boys, nor like unto such.”[^1580] Because the hare multiplies, year by year, the places of its conception; for as many years as it lives so many[^1581] it has. Moreover, “Thou shall not eat the hyena.” He means, “Thou shall not be an adulterer, nor a corrupter, nor be like to them that are such.” Wherefore? Because that animal annually changes its sex, and is at one time male, and at another female. Moreover, he has rightly detested the weasel. For he means, “Thou shalt not be like to those whom we hear of as committing wickedness with the mouth,[^1582] on account of their uncleanness; nor shall thou be joined to those impure women who commit iniquity with the mouth. For this animal conceives by the mouth.” Moses then issued[^1583] three doctrines concerning meats with a spiritual significance; but they received them according to fleshly desire, as if he had merely spoken of [literal] meats. David, however, comprehends the knowledge of the three doctrines, and speaks in like manner: “Blessed is the man who hath not walked in the counsel of the ungodly,”[^1584] even as the fishes [referred to] go in darkness to the depths [of the sea]; “and hath not stood in the way of sinners,” even as those who profess to fear the Lord, but go astray like swine; “and hath not sat in the seat of scorners,”[^1585] even as those birds that lie in wait for prey. Take a full and firm grasp of this spiritual[^1586] knowledge. But Moses says still further, “Ye shall eat every animal that is cloven-footed and ruminant.” What does he mean? [The ruminant animal denotes him] who, on receiving food, recognizes Him that nourishes him, and being satisfied by Him,[^1587] is visibly made glad. Well spake [Moses], having respect to the commandment. What, then, does he mean? That we ought to join ourselves to those that fear the Lord, those who meditate in their heart on the commandment which they have received, those who both utter the judgments of the Lord and observe them, those who know that meditation is a work of gladness, and who ruminate[^1588] upon the word of the Lord. But what means the cloven-footed? That the righteous man also walks in this world, yet looks forward to the holy state[^1589] [to come]. Behold how well Moses legislated. But how was it possible for them to understand or comprehend these things? We then, rightly understanding his commandments,[^1590] explain them as the Lord intended. For this purpose He circumcised our ears and our hearts, that we might understand these things." },
  { t = "note", id = "1575", text = "Cod. Sin. has “portion,” corrected, however, as above. See Lev. xi. and Deut. xiv." },
  { t = "note", id = "1576", text = "Deut. iv. 1." },
  { t = "note", id = "1577", text = "Literally, “in spirit.”" },
  { t = "note", id = "1578", text = "Cod. Sin. inserts, “and gaze about for some way of escape on account of their greediness, even as these birds alone do not procure food for themselves (by labour), but sitting idle, seek to devour the flesh of others.” The text as above seems preferable: Hilgenfeld, however, follows the Greek." },
  { t = "note", id = "1579", text = "Cod. Sin. has, “condemned already.”" },
  { t = "note", id = "1580", text = "Dressel has a note upon this passage, in which he refers the words we have rendered, “corrupters of boys,” to those who by their dissolute lives waste their fortunes, and so entail destruction on their children; but this does not appear satisfactory. Comp. Clem. Alex. *Pædag.* ii. 10." },
  { t = "note", id = "1581", text = "We have left τρύπας untranslated. [Cavities, i.e., of conception]." },
  { t = "note", id = "1582", text = "Cod. Sin. has, “with the body through uncleanness,” and so again in the last clause." },
  { t = "note", id = "1583", text = "Cod. Sin. inserts, “having received.”" },
  { t = "note", id = "1584", text = "Ps. i. 1." },
  { t = "note", id = "1585", text = "Literally, “of the pestilent.”" },
  { t = "note", id = "1586", text = "Cod. Sin. reads, “perfectly,” instead of “perfect,” as do most mss.; but, according to Dressel, we should read, “have a perfect knowledge concerning the food.” Hilgenfeld follows the Greek." },
  { t = "note", id = "1587", text = "Or, “resting upon Him.”" },
  { t = "note", id = "1588", text = "Cod. Sin. here has the singular, “one who ruminates.”" },
  { t = "note", id = "1589", text = "Literally, “holy age.”" },
  { t = "note", id = "1590", text = "Cod. Sin. inserts again, “rightly.”" },
]

[[section]]
id = "chapter-11"
title = "Chapter XI.—Baptism and the cross prefigured in the Old Testament."
level = 1
blocks = [
  { t = "p", text = "Let us further inquire whether the Lord took any care to foreshadow the water [of baptism] and the cross. Concerning the water, indeed, it is written, in reference to the Israelites, that they should not receive that baptism which leads to the remission of sins, but should procure[^1591] another for themselves. The prophet therefore declares, “Be astonished, O heaven, and let the earth tremble[^1592] at this, because this people hath committed two great evils: they have forsaken Me, a living fountain, and have hewn out for themselves broken cisterns.[^1593] Is my holy hill Zion a desolate rock? For ye shall be as the fledglings of a bird, which fly away when the nest is removed.”[^1594] And again saith the prophet, “I will go before thee and make level the mountains, and will break the brazen gates, and bruise in pieces the iron bars; and I will give thee the secret,[^1595] hidden, invisible treasures, that they may know that I am the Lord God.”[^1596] And “He shall dwell in a lofty cave of the strong rock.”[^1597] Furthermore, what saith He in reference to the Son? “His water is sure;[^1598] ye shall see the King in His glory, and your soul shall meditate on the fear of the Lord.”[^1599] And again He saith in another prophet, “The man who doeth these things shall be like a tree planted by the courses of waters, which shall yield its fruit in due season; and his leaf shall not fade, and all that he doeth shall prosper. Not so are the ungodly, not so, but even as chaff, which the wind sweeps away from the face of the earth. Therefore the ungodly shall not stand in judgment, nor sinners in the counsel of the just; for the Lord knoweth the way of the righteous, but the way of the ungodly shall perish.”[^1600] Mark how He has described at once both the water and the cross. For these words imply, Blessed are they who, placing their trust in the cross, have gone down into the water; for, says He, they shall receive their reward in due time: then He declares, I will recompense them. But now He saith,[^1601] “Their leaves shall not fade.” This meaneth, that every word which proceedeth out of your mouth in faith and love shall tend to bring conversion and hope to many. Again, another prophet saith, “And the land of Jacob shall be extolled above every land.”[^1602] This meaneth the vessel of His Spirit, which He shall glorify. Further, what says He? “And there was a river flowing on the right, and from it arose beautiful trees; and whosoever shall eat of them shall live for ever.”[^1603] This meaneth,[^1604] that we indeed descend into the water full of sins and defilement, but come up, bearing fruit in our heart, having the fear [of God] and trust in Jesus in our spirit. “And whosoever shall eat of these shall live for ever,” This meaneth: Whosoever, He declares, shall hear thee speaking, and believe, shall live for ever." },
  { t = "note", id = "1591", text = "Literally, “should build.”" },
  { t = "note", id = "1592", text = "Cod. Sin. has, “confine still more,” corrected to “tremble still more.”" },
  { t = "note", id = "1593", text = "Cod. Sin. has, “have dug a pit of death.” See Jer. ii. 12, 13." },
  { t = "note", id = "1594", text = "Comp. Isa. xvi. 1, 2." },
  { t = "note", id = "1595", text = "Literally, “dark.” Cod. Sin. has, “of darkness.”" },
  { t = "note", id = "1596", text = "Isa. xlv. 2, 3." },
  { t = "note", id = "1597", text = "Isa. xxxiii. 16. Cod. Sin. has, “thou shalt dwell.”" },
  { t = "note", id = "1598", text = "Cod. Sin. entirely omits the question given above, and joins “the water is sure” to the former sentence." },
  { t = "note", id = "1599", text = "Isa. xxxiii. 16–18." },
  { t = "note", id = "1600", text = "Ps. i. 3–6." },
  { t = "note", id = "1601", text = "Cod. Sin. has, “what meaneth?”" },
  { t = "note", id = "1602", text = "Zeph. iii. 19." },
  { t = "note", id = "1603", text = "Ezek. xlvii. 12." },
  { t = "note", id = "1604", text = "Omitted in Cod. Sin." },
]

[[section]]
id = "chapter-12"
title = "Chapter XII.—The cross of Christ frequently announced in the Old Testament."
level = 1
blocks = [
  { t = "p", text = "In like manner He points to the cross of Christ in another prophet, who saith,[^1605] “And when shall these things be accomplished? And the Lord saith, When a tree shall be bent down, and again arise, and when blood shall flow out of wood.”[^1606] Here again you have an intimation concerning the cross, and Him who should be crucified. Yet again He speaks of this[^1607] in Moses, when Israel was attacked by strangers. And that He might remind them, when assailed, that it was on account of their sins they were delivered to death, the Spirit speaks to the heart of Moses, that he should make a figure of the cross,[^1608] and of Him about to suffer thereon; for unless they put their trust in Him, they shall be overcome for ever. Moses therefore placed one weapon above another in the midst of the hill,[^1609] and standing upon it, so as to be higher than all the people, he stretched forth his hands,[^1610] and thus again Israel acquired the mastery. But when again he let down his hands, they were again destroyed. For what reason? That they might know that they could not be saved unless they put their trust in Him.[^1611] And in another prophet He declares, “All day long I have stretched forth My hands to an unbelieving people, and one that gainsays My righteous way.”[^1612] And again Moses makes a type of Jesus, [signifying] that it was necessary for Him to suffer, [and also] that He would be the author of life[^1613] [to others], whom they believed to have destroyed on the cross[^1614] when Israel was falling. For since transgression was committed by Eve through means of the serpent, [the Lord] brought it to pass that every [kind of] serpents bit them, and they died,[^1615] that He might convince them, that on account of their transgression they were given over to the straits of death. Moreover Moses, when he commanded, “Ye shall not have any graven or molten [image] for your God,”[^1616] did so that he might reveal a type of Jesus. Moses then makes a brazen serpent, and places it upon a beam,[^1617] and by proclamation assembles the people. When, therefore, they were come together, they besought Moses that he would offer sacrifice[^1618] in their behalf, and pray for their recovery. And Moses spake unto them, saying, “When any one of you is bitten, let him come to the serpent placed on the pole; and let him hope and believe, that even though dead, it is able to give him life, and immediately he shall be restored.”[^1619] And they did so. Thou hast in this also [an indication of] the glory of Jesus; for in Him and to Him are all things.[^1620] What, again, says Moses to Jesus (Joshua) the son of Nave, when he gave him[^1621] this name, as being a prophet, with this view only, that all the people might hear that the Father would reveal all things concerning His Son Jesus to the son[^1622] of Nave? This name then being given him when he sent him to spy out the land, he said, “Take a book into thy hands, and write what the Lord declares, that the Son of God will in the last days cut off from the roots all the house of Amalek.”[^1623] Behold again: Jesus who was manifested, both by type and in the flesh,[^1624] is not the Son of man, but the Son of God. Since, therefore, they were to say that Christ was the son[^1625] of David, fearing and understanding the error of the wicked, he saith, “The Lord said unto my Lord, Sit at My right hand, until I make Thine enemies Thy footstool.”[^1626] And again, thus saith Isaiah, “The Lord said to Christ,[^1627] my Lord, whose right hand I have holden,[^1628] that the nations should yield obedience before Him; and I will break in pieces the strength of kings.”[^1629] Behold how David calleth Him Lord and the Son of God." },
  { t = "note", id = "1605", text = "Cod. Sin. refers this to *God*, and not to the prophet." },
  { t = "note", id = "1606", text = "From some unknown apocryphal book. Hilgenfeld compares Hab. ii. 11." },
  { t = "note", id = "1607", text = "Cod. Sin. reads, “He speaks to Moses.”" },
  { t = "note", id = "1608", text = "Cod. Sin. omits “and.”" },
  { t = "note", id = "1609", text = "Cod. Sin. reads πυγμῆς, which must here be translated “heap” or “mass.” According to Hilgenfeld, however, πυγμή is here equivalent to πυγμαχία, “a fight.” The meaning would then be, that “Moses piled weapon upon weapon in the midst of the *battle*,” instead of “hill” (πήγης), as above." },
  { t = "note", id = "1610", text = "Thus standing in the form of a cross." },
  { t = "note", id = "1611", text = "Or, as some read, “in the cross.”" },
  { t = "note", id = "1612", text = "Isa. lxv. 2." },
  { t = "note", id = "1613", text = "Cod. Sin. has, “and He shall make him alive.”" },
  { t = "note", id = "1614", text = "Literally, “the sign.”" },
  { t = "note", id = "1615", text = "Comp. Num. xxi. 6–9; John iii. 14–18." },
  { t = "note", id = "1616", text = "Deut. xxvii. 15. Cod. Sin. reads, “molten or graven.”" },
  { t = "note", id = "1617", text = "Instead of ἐν δοκῷ, “on a beam,” Cod. Sin. with other mss. has ἐνδόξως, “manifestly,” which is adopted by Hilgenfeld." },
  { t = "note", id = "1618", text = "Cod. Sin. simply reads, “offer supplication.”" },
  { t = "note", id = "1619", text = "Num. xxi. 9." },
  { t = "note", id = "1620", text = "Comp. Col. i. 16." },
  { t = "note", id = "1621", text = "Cod. Sin. has the imperative, “Put on him;” but it is connected as above." },
  { t = "note", id = "1622", text = "Cod. Sin. closes the sentence with *Jesus*, and inserts, “Moses said therefore to Jesus.”" },
  { t = "note", id = "1623", text = "Ex. xvii. 14." },
  { t = "note", id = "1624", text = "Comp. 1 Tim. iii. 16." },
  { t = "note", id = "1625", text = "That is, merely human: a reference is supposed to the Ebionites." },
  { t = "note", id = "1626", text = "Ps. cx. 1; Matt. xxii. 43–45." },
  { t = "note", id = "1627", text = "Cod. Sin. corrects “to Cyrus,” as LXX." },
  { t = "note", id = "1628", text = "Cod. Sin. has, “he has taken hold.”" },
  { t = "note", id = "1629", text = "Isa. xlv. 1." },
]

[[section]]
id = "chapter-13"
title = "Chapter XIII.—Christians, and not Jews, the heirs of the covenant."
level = 1
blocks = [
  { t = "p", text = "But let us see if this people[^1630] is the heir, or the former, and if the covenant belongs to us or to them. Hear ye now what the Scripture saith concerning the people. Isaac prayed for Rebecca his wife, because she was barren; and she conceived.[^1631] Furthermore also, Rebecca went forth to inquire of the Lord; and the Lord said to her, “Two nations are in thy womb, and two peoples in thy belly; and the one people shall surpass the other, and the elder shall serve the younger.”[^1632] You ought to understand who was Isaac, who Rebecca, and concerning what persons He declared that this people should be greater than that. And in another prophecy Jacob speaks more clearly to his son Joseph, saying, “Behold, the Lord hath not deprived me of thy presence; bring thy sons to me, that I may bless them.”[^1633] And he brought Manasseh and Ephraim, desiring that Manasseh[^1634] should be blessed, because he was the elder. With this view Joseph led him to the right hand of his father Jacob. But Jacob saw in spirit the type of the people to arise afterwards. And what says [the Scripture]? And Jacob changed the direction of his hands, and laid his right hand upon the head of Ephraim, the second and younger, and blessed him. And Joseph said to Jacob, “Transfer thy right hand to the head of Manasseh,[^1635] for he is my first-born son.”[^1636] And Jacob said, “I know it, my son, I know it; but the elder shall serve the younger: yet he also shall be blessed.”[^1637] Ye see on whom he laid[^1638] [his hands], that this people should be first, and heir of the covenant. If then, still further, the same thing was intimated through Abraham, we reach the perfection of our knowledge. What, then, says He to Abraham? “Because thou hast believed,[^1639] it is imputed to thee for righteousness: behold, I have made thee the father of those nations who believe in the Lord while in [a state of] uncircumcision.”[^1640]" },
  { t = "note", id = "1630", text = "That is, “Christians.”" },
  { t = "note", id = "1631", text = "Gen. xxv. 21." },
  { t = "note", id = "1632", text = "Gen. xxv. 23." },
  { t = "note", id = "1633", text = "Gen. xlviii. 11, 9." },
  { t = "note", id = "1634", text = "Cod. Sin. reads each time “Ephraim,” by a manifest mistake, instead of Manasseh." },
  { t = "note", id = "1635", text = "Cod. Sin. reads each time “Ephraim,” by a manifest mistake, instead of Manasseh." },
  { t = "note", id = "1636", text = "Gen. xlviii. 18." },
  { t = "note", id = "1637", text = "Gen. xlviii. 19." },
  { t = "note", id = "1638", text = "Or, “of whom he willed.”" },
  { t = "note", id = "1639", text = "Cod. Sin. has, “when alone believing,” and is followed by Hilgenfeld to this effect: “What, then, says He to Abraham, when, alone believing, he was placed in righteousness? Behold,” etc." },
  { t = "note", id = "1640", text = "Gen. xv. 6, Gen. xvii. 5; comp. Rom. iv. 3." },
]

[[section]]
id = "chapter-14"
title = "Chapter XIV.—The Lord hath given us the testament which Moses received and broke."
level = 1
blocks = [
  { t = "p", text = "Yes [it is even so]; but let us inquire if the Lord has really given that testament which He swore to the fathers that He would give[^1641] to the people. He did give it; but they were not worthy to receive it, on account of their sins. For the prophet declares, “And Moses was fasting forty days and forty nights on Mount Sinai, that he might receive the testament of the Lord for the people.”[^1642] And he received from the Lord[^1643] two tables, written in the spirit by the finger of the hand of the Lord. And Moses having received them, carried them down to give to the people. And the Lord said to Moses, “Moses, Moses, go down quickly; for thy people hath sinned, whom thou didst bring out of the land of Egypt.”[^1644] And Moses understood that they had again[^1645] made molten images; and he threw the tables out of his hands, and the tables of the testament of the Lord were broken. Moses then received it, but they proved themselves unworthy. Learn now how *we* have received it. Moses, as a servant,[^1646] received it; but the Lord himself, having suffered in our behalf, hath given it to us, that we should be the people of inheritance. But He was manifested, in order that they might be perfected in their iniquities, and that we, being constituted heirs through Him,[^1647] might receive the testament of the Lord Jesus, who was prepared for this end, that by His personal manifestation, redeeming our hearts (which were already wasted by death, and given over to the iniquity of error) from darkness, He might by His word enter into a covenant with us. For it is written how the Father, about to redeem[^1648] us from darkness, commanded Him to prepare[^1649] a holy people for Himself. The prophet therefore declares, “I, the Lord Thy God, have called Thee in righteousness, and will hold Thy hand, and will strengthen Thee; and I have given Thee for a covenant to the people, for a light to the nations, to open the eyes of the blind, and to bring forth from fetters them that are bound, and those that sit in darkness out of the prison-house.”[^1650] Ye perceive,[^1651] then, whence we have been redeemed. And again, the prophet says, “Behold, I have appointed Thee as a light to the nations, that Thou mightest be for salvation even to the ends of the earth, saith the Lord God that redeemeth thee.”[^1652] And again, the prophet saith, “The Spirit of the Lord is upon me; because He hath anointed me to preach the Gospel to the humble: He hath sent me to heal the broken-hearted, to proclaim deliverance to the captives, and recovery of sight to the blind; to announce the acceptable year of the Lord, and the day of recompense; to comfort all that mourn.”[^1653]" },
  { t = "note", id = "1641", text = "Cod. Sin. absurdly repeats “to give.”" },
  { t = "note", id = "1642", text = "Ex. xxiv. 18." },
  { t = "note", id = "1643", text = "Ex. xxxi. 18." },
  { t = "note", id = "1644", text = "Ex. xxxii. 7; Deut. ix. 12." },
  { t = "note", id = "1645", text = "Cod. Sin. reads, “for themselves.”" },
  { t = "note", id = "1646", text = "Comp. Heb. iii. 5." },
  { t = "note", id = "1647", text = "Cod. Sin. and other mss. read, “through Him who inherited.”" },
  { t = "note", id = "1648", text = "Cod. Sin. refers this to Christ." },
  { t = "note", id = "1649", text = "Cod. Sin. reads, “be prepared.” Hilgenfeld follows Cod. Sin. so far, and reads, “For it is written how the Father commanded Him who was to redeem us from darkness (αὐτῷ—λυτρωσάμενος) to prepare a holy people for Himself.”" },
  { t = "note", id = "1650", text = "Isa. xlii. 6, 7." },
  { t = "note", id = "1651", text = "Cod. Sin. has, “we know.”" },
  { t = "note", id = "1652", text = "Isa. xlix. 6. The text of Cod. Sin., and of the other mss., is here in great confusion: we have followed that given by Hefele." },
  { t = "note", id = "1653", text = "Isa. lxi. 1, 2." },
]

[[section]]
id = "chapter-15"
title = "Chapter XV.—The false and the true Sabbath."
level = 1
blocks = [
  { t = "p", text = "Further,[^1654] also, it is written concerning the Sabbath in the Decalogue which [the Lord] spoke, face to face, to Moses on Mount Sinai, “And sanctify ye the Sabbath of the Lord with clean hands and a pure heart.”[^1655] And He says in another place, “If my sons keep the Sabbath, then will I cause my mercy to rest upon them.”[^1656] The Sabbath is mentioned at the beginning of the creation [thus]: “And God made in six days the works of His hands, and made an end on the seventh day, and rested on it, and sanctified it.”[^1657] Attend, my children, to the meaning of this expression, “He finished in six days.” This implieth that the Lord will finish all things in six thousand years, for a day is[^1658] with Him a thousand years. And He Himself testifieth,[^1659] saying, “Behold, to-day[^1660] will be as a thousand years.”[^1661] Therefore, my children, in six days, that is, in six thousand years, all things will be finished. “And He rested on the seventh day.” This meaneth: when His Son, coming [again], shall destroy the time of the wicked man,[^1662] and judge the ungodly, and change the sun, and the moon,[^1663] and the stars, then shall He truly rest on the seventh day. Moreover, He says, “Thou shalt sanctify it with pure hands and a pure heart.” If, therefore, any one can now sanctify the day which God hath sanctified, except he is pure in heart in all things,[^1664] we are deceived.[^1665] Behold, therefore:[^1666] certainly then one properly resting sanctifies it, when we ourselves, having received the promise, wickedness no longer existing, and all things having been made new by the Lord, shall be able to work righteousness.[^1667] Then we shall be able to sanctify it, having been first sanctified ourselves.[^1668] Further, He says to them, “Your new moons and your Sabbaths I cannot endure.”[^1669] Ye perceive how He speaks: Your present Sabbaths are not acceptable to Me, but that is which I have made, [namely this,] when, giving rest to all things, I shall make a beginning of the eighth day, that is, a beginning of another world. Wherefore, also, we keep the eighth day with joyfulness, the day also on which Jesus rose again from the dead.[^1670] And[^1671] when He had manifested Himself, He ascended into the heavens." },
  { t = "note", id = "1654", text = "Cod. Sin. reads “because,” but this is corrected to “moreover.”" },
  { t = "note", id = "1655", text = "Ex. xx. 8; Deut. v. 12." },
  { t = "note", id = "1656", text = "Jer. xvii. 24, 25." },
  { t = "note", id = "1657", text = "Gen. ii. 2. The Hebrew text is here followed, the Septuagint reading “sixth” instead of “seventh.”" },
  { t = "note", id = "1658", text = "Cod. Sin. reads “signifies.”" },
  { t = "note", id = "1659", text = "Cod. Sin. adds, “to me.”" },
  { t = "note", id = "1660", text = "Cod. Sin. reads, “The day of the Lord shall be as a thousand years.”" },
  { t = "note", id = "1661", text = "Ps. xc. 4; 2 Pet. iii. 8." },
  { t = "note", id = "1662", text = "Cod. Sin. seems properly to omit “of the wicked man.”" },
  { t = "note", id = "1663", text = "Cod. Sin. places *stars* before *moon*." },
  { t = "note", id = "1664", text = "Cod. Sin. reads “again,” but is corrected as above." },
  { t = "note", id = "1665", text = "The meaning is, “If the Sabbaths of the Jews were the true Sabbath, we should have been deceived by God, who demands pure hands and a pure heart.”—Hefele." },
  { t = "note", id = "1666", text = "Cod. Sin. has, “But if not.” Hilgenfeld’s text of this confused passage reads as follows: “Who then can sanctify the day which God has sanctified, except the man who is of a pure heart? We are deceived (or mistaken) in all things. Behold, therefore,” etc." },
  { t = "note", id = "1667", text = "Cod. Sin. reads, “resting aright, we shall sanctify it, having been justified, and received the promise, iniquity no longer existing, but all things having been made new by the Lord.”" },
  { t = "note", id = "1668", text = "Cod. Sin. reads, “Shall we not then?”" },
  { t = "note", id = "1669", text = "Isa. i. 13." },
  { t = "note", id = "1670", text = "“Barnabas here bears testimony to the observance of the Lord’s Day in early times.”—Hefele." },
  { t = "note", id = "1671", text = "We here follow the punctuation of Dressel: Hefele places only a comma between the clauses, and inclines to think that the writer implies that the ascension of Christ took place on the first day of the week." },
]

[[section]]
id = "chapter-16"
title = "Chapter XVI.—The spiritual temple of God."
level = 1
blocks = [
  { t = "p", text = "Moreover, I will also tell you concerning the temple, how the wretched [Jews], wandering in error, trusted not in God Himself, but in the temple, as being the house of God. For almost after the manner of the Gentiles they worshipped Him in the temple.[^1672] But learn how the Lord speaks, when abolishing it: “Who hath meted out heaven with a span, and the earth with his palm? Have not I?”[^1673] “Thus saith the Lord, Heaven is My throne, and the earth My footstool: what kind of house will ye build to Me, or what is the place of My rest?”[^1674] Ye perceive that their hope is vain. Moreover, He again says, “Behold, they who have cast down this temple, even they shall build it up again.”[^1675] It has so happened.[^1676] For through their going to war, it was destroyed by their enemies; and now they, as the servants of their enemies, shall rebuild it. Again, it was revealed that the city and the temple and the people of Israel were to be given up. For the Scripture saith, “And it shall come to pass in the last days, that the Lord will deliver up the sheep of His pasture, and their sheep-fold and tower, to destruction.”[^1677] And it so happened as the Lord had spoken. Let us inquire, then, if there still is a temple of God. There is—where He himself declared He would make and finish it. For it is written, “And it shall come to pass, when the week is completed, the temple of God shall be built in glory in the name of the Lord.”[^1678] I find, therefore, that a temple does exist. Learn, then, how it shall be built in the name of the Lord. Before we believed in God, the habitation of our heart was corrupt and weak, as being indeed like a temple made with hands. For it was full of idolatry, and was a habitation of demons, through our doing such things as were opposed to [the will of] God. But it shall be built, observe ye, in the name of the Lord, in order that the temple of the Lord may be built in glory. How? Learn [as follows]. Having received the forgiveness of sins, and placed our trust in the name of the Lord, we have become new creatures, formed again from the beginning. Wherefore in our habitation God truly dwells in us. How? His word of faith; His calling[^1679] of promise; the wisdom of the statutes; the commands of the doctrine; He himself prophesying in us; He himself dwelling in us; opening to us who were enslaved by death the doors of the temple, that is, the mouth; and by giving us repentance introduced us into the incorruptible temple.[^1680] He then, who wishes to be saved, looks not to man,[^1681] but to Him who dwelleth in him, and speaketh in him, amazed at never having either heard him utter such words with his mouth, nor himself having ever desired to hear them.[^1682] This is the spiritual temple built for the Lord." },
  { t = "note", id = "1672", text = "That is, “they worshipped the temple instead of Him.”" },
  { t = "note", id = "1673", text = "Isa. xl. 12." },
  { t = "note", id = "1674", text = "Isa. lxvi. 1." },
  { t = "note", id = "1675", text = "Comp. Isa. xlix. 17 (Sept.)." },
  { t = "note", id = "1676", text = "Cod. Sin. omits this." },
  { t = "note", id = "1677", text = "Comp. Isa. v., Jer. xxv.; but the words do not occur in Scripture." },
  { t = "note", id = "1678", text = "Dan. ix. 24–27; Hag. ii. 10." },
  { t = "note", id = "1679", text = "Cod. Sin. reads, “the calling.”" },
  { t = "note", id = "1680", text = "Cod. Sin. gives the clauses of this sentence separately, each occupying a line." },
  { t = "note", id = "1681", text = "That is, the man who is engaged in preaching the Gospel." },
  { t = "note", id = "1682", text = "Such is the punctuation adopted by Hefele, Dressel, and Hilgenfeld." },
]

[[section]]
id = "chapter-17"
title = "Chapter XVII.—Conclusion of the first part of the epistle."
level = 1
blocks = [
  { t = "p", text = "As far as was possible, and could be done with perspicuity, I cherish the hope that, according to my desire, I have omitted none[^1683] of those things at present [demanding consideration], which bear upon your salvation. For if I should write to you about things future,[^1684] ye would not understand, because such knowledge is hid in parables. These things then are so." },
  { t = "note", id = "1683", text = "Cod. Sin. reads, “my soul hopes that it has not omitted anything.”" },
  { t = "note", id = "1684", text = "Cod. Sin., “about things present or future.” Hilgenfeld’s text of this passage is as follows: “My mind and soul hopes that, according to my desire, I have omitted none of the things that pertain to salvation. For if I should write to you about things present or future,” etc. Hefele gives the text as above, and understands the meaning to be, “points bearing on the *present* argument.”" },
]

[[section]]
id = "chapter-18"
title = "Chapter XVIII.—Second part of the epistle. The two ways."
level = 1
blocks = [
  { t = "p", text = "But let us now pass to another sort of knowledge and doctrine. There are two ways of doctrine and authority, the one of light, and the other of darkness. But there is a great difference between these two ways. For over one are stationed the light-bringing angels of God, but over the other the angels[^1685] of Satan. And He indeed (i.e., God) is Lord for ever and ever, but he (i.e., Satan) is prince of the time[^1686] of iniquity." },
  { t = "note", id = "1685", text = "Comp. 2 Cor. xii. 7." },
  { t = "note", id = "1686", text = "Cod. Sin. reads, “of the present time of iniquity.”" },
]

[[section]]
id = "chapter-19"
title = "Chapter XIX.—The way of light."
level = 1
blocks = [
  { t = "p", text = "The way of light, then, is as follows. If any one desires to travel to the appointed place, he must be zealous in his works. The knowledge, therefore, which is given to us for the purpose of walking in this way, is the following. Thou shalt love Him that created thee:[^1687] thou shalt glorify Him that redeemed thee from death. Thou shalt be simple in heart, and rich in spirit. Thou shalt not join thyself to those who walk in the way of death. Thou shalt hate doing what is unpleasing to God: thou shalt hate all hypocrisy. Thou shalt not forsake the commandments of the Lord. Thou shalt not exalt thyself, but shalt be of a lowly mind.[^1688] Thou shalt not take glory to thyself. Thou shalt not take evil counsel against thy neighbour. Thou shalt not allow over-boldness to enter into thy soul.[^1689] Thou shalt not commit fornication: thou shalt not commit adultery: thou shalt not be a corrupter of youth. Thou shalt not let the word of God issue from thy lips with any kind of impurity.[^1690] Thou shalt not accept persons when thou reprovest any one for transgression. Thou shalt be meek: thou shalt be peaceable. Thou shalt tremble at the words which thou hearest.[^1691] Thou shalt not be mindful of evil against thy brother. Thou shalt not be of doubtful mind[^1692] as to whether a thing shall be or not. Thou shalt not take the name[^1693] of the Lord in vain. Thou shalt love thy neighbour more than thine own soul.[^1694] Thou shalt not slay the child by procuring abortion; nor, again, shalt thou destroy it after it is born. Thou shalt not withdraw thy hand from thy son, or from thy daughter, but from their infancy thou shalt teach them the fear of the Lord.[^1695] Thou shalt not covet what is thy neighbour’s, nor shalt thou be avaricious. Thou shalt not be joined in soul with the haughty, but thou shalt be reckoned with the righteous and lowly. Receive thou as good things the trials[^1696] which come upon thee.[^1697] Thou shalt not be of double mind or of double tongue,[^1698] for a double tongue is a snare of death. Thou shalt be subject[^1699] to the Lord, and to [other] masters as the image of God, with modesty and fear. Thou shalt not issue orders with bitterness to thy maidservant or thy man-servant, who trust in the same [God[^1700]], lest thou shouldst not[^1701] reverence that God who is above both; for He came to call men not according to their outward appearance,[^1702] but according as the Spirit had prepared them.[^1703] Thou shalt communicate in all things with thy neighbour; thou shalt not call[^1704] things thine own; for if ye are partakers in common of things which are incorruptible,[^1705] how much more [should you be] of those things which are corruptible![^1706] Thou shalt not be hasty with thy tongue, for the mouth is a snare of death. As far as possible, thou shalt be pure in thy soul. Do not be ready to stretch forth thy hands to take, whilst thou contractest them to give. Thou shalt love, as the apple of thine eye, every one that speaketh to thee the word of the Lord. Thou shalt remember the day of judgment, night and day. Thou shalt seek out every day the faces of the saints,[^1707] either by word examining them, and going to exhort them, and meditating how to save a soul by the word,[^1708] or by thy hands thou shalt labour for the redemption of thy sins. Thou shalt not hesitate to give, nor murmur when thou givest. “Give to every one that asketh thee,”[^1709] and thou shalt know who is the good Recompenser of the reward. Thou shalt preserve what thou hast received [in charge], neither adding to it nor taking from it. To the last thou shalt hate the wicked[^1710] [one].[^1711] Thou shalt judge righteously. Thou shalt not make a schism, but thou shalt pacify those that contend by bringing them together. Thou shalt confess thy sins. Thou shalt not go to prayer with an evil conscience. This is the way of light.[^1712]" },
  { t = "note", id = "1687", text = "Cod. Sin. inserts, “Thou shalt fear Him that formed thee.”" },
  { t = "note", id = "1688", text = "Cod. Sin. adds, “in all things.”" },
  { t = "note", id = "1689", text = "Literally, “shalt not give insolence to thy soul.”" },
  { t = "note", id = "1690", text = "“That is, while proclaiming the Gospel, thou shalt not in any way be of corrupt morals.”—Hefele." },
  { t = "note", id = "1691", text = "Isa. lxvi. 2. All the preceding clauses are given in Cod. Sin. in distinct lines." },
  { t = "note", id = "1692", text = "Comp. Jas. i. 8." },
  { t = "note", id = "1693", text = "Cod. Sin. has “thy name,” but this is corrected as above." },
  { t = "note", id = "1694", text = "Cod. Sin. corrects to, “as thine own soul.”" },
  { t = "note", id = "1695", text = "Cod. Sin. has, “of God.”" },
  { t = "note", id = "1696", text = "“Difficulties,” or “troubles.”" },
  { t = "note", id = "1697", text = "Cod. Sin. adds, “knowing that without God nothing happens.”" },
  { t = "note", id = "1698", text = "Cod. Sin. has, “talkative,” and omits the following clause." },
  { t = "note", id = "1699", text = "Cod. Sin. has, “Thou shalt be subject (ὑποταγήσῃ— untouched by the corrector) to masters as a type of God.”" },
  { t = "note", id = "1700", text = "Inserted in Cod. Sin." },
  { t = "note", id = "1701", text = "Cod. Sin. has, “they should not.”" },
  { t = "note", id = "1702", text = "Comp. Eph. vi. 9." },
  { t = "note", id = "1703", text = "Comp. Rom. viii. 29, 30." },
  { t = "note", id = "1704", text = "Cod. Sin. has, “and not call.”" },
  { t = "note", id = "1705", text = "Cod. Sin. has, “in that which is incorruptible.”" },
  { t = "note", id = "1706", text = "Cod. Sin. has, “in things that are subject to death,” but is corrected as above." },
  { t = "note", id = "1707", text = "Or, “the persons of the saints.” Cod. Sin. omits this clause, but it is added by the corrector." },
  { t = "note", id = "1708", text = "The text is here confused in all the editions; we have followed that of Dressel. Cod. Sin. is defective. Hilgenfeld’s text reads, “Thou shalt seek out every day the faces of the saints, either labouring by word and going to exhort them, and meditating to save a soul by the word, or by thy hands thou shalt labour for the redemption of thy sins”—almost identical with that given above." },
  { t = "note", id = "1709", text = "Cod. Sin. omits this quotation from Matt. v. 42 or Luke vi. 30, but it is added by a corrector." },
  { t = "note", id = "1710", text = "Cod. Sin. has, “hate evil.”" },
  { t = "note", id = "1711", text = "Cod. Sin. inserts “and.”" },
  { t = "note", id = "1712", text = "Cod. Sin. omits this clause: it is inserted by a corrector." },
]

[[section]]
id = "chapter-20"
title = "Chapter XX.—The way of darkness."
level = 1
blocks = [
  { t = "p", text = "But the way of darkness[^1713] is crooked, and full of cursing; for it is the way of eternal[^1714] death with punishment, in which way are the things that destroy the soul, viz., idolatry, over-confidence, the arrogance of power, hypocrisy, double-heartedness, adultery, murder, rapine, haughtiness, transgression,[^1715] deceit, malice, self-sufficiency, poisoning, magic, avarice,[^1716] want of the fear of God. [In this way, too,] are those who persecute the good, those who hate truth, those who love falsehood, those who know not the reward of righteousness, those who cleave not to that which is good, those who attend not with just judgment to the widow and orphan, those who watch not to the fear of God, [but incline] to wickedness, from whom meekness and patience are far off; persons who love vanity, follow after a reward, pity not the needy, labour not in aid of him who is overcome with toil; who are prone to evil-speaking, who know not Him that made them, who are murderers of children, destroyers of the workmanship of God; who turn away him that is in want, who oppress the afflicted, who are advocates of the rich, who are unjust judges of the poor, and who are in every respect transgressors." },
  { t = "note", id = "1713", text = "Literally, “of the Black One.”" },
  { t = "note", id = "1714", text = "Cod. Sin. joins “eternal” with *way*, instead of *death*." },
  { t = "note", id = "1715", text = "Cod. Sin. reads “transgressions.”" },
  { t = "note", id = "1716", text = "Cod. Sin. omits “magic, avarice.”" },
]

[[section]]
id = "chapter-21"
title = "Chapter XXI.—Conclusion."
level = 1
blocks = [
  { t = "p", text = "It is well, therefore,[^1717] that he who has learned the judgments of the Lord, as many as have been written, should walk in them. For he who keepeth these shall be glorified in the kingdom of God; but he who chooseth other things[^1718] shall be destroyed with his works. On this account there will be a resurrection,[^1719] on this account a retribution. I beseech you who are superiors, if you will receive any counsel of my good-will, have among yourselves those to whom you may show kindness: do not forsake them. For the day is at hand on which all things shall perish with the evil [one]. The Lord is near, and His reward. Again, and yet again, I beseech you: be good lawgivers[^1720] to one another; continue faithful counsellors of one another; take away from among you all hypocrisy. And may God, who ruleth over all the world, give to you wisdom, intelligence, understanding, knowledge of His judgments,[^1721] with patience. And be ye[^1722] taught of God, inquiring diligently what the Lord asks from you; and do it that ye maybe safe in the day of judgment.[^1723] And if you have any remembrance of what is good, be mindful of me, meditating on these things, in order that both my desire and watchfulness may result in some good. I beseech you, entreating this as a favour. While yet you are in this fair vessel,[^1724] do not fail in any one of those things,[^1725] but unceasingly seek after them, and fulfil every commandment; for these things are worthy.[^1726] Wherefore I have been the more earnest to write to you, as my ability served,[^1727] that I might cheer you. Farewell, ye children of love and peace. The Lord of glory and of all grace be with your spirit. Amen.[^1728]" },
  { t = "note", id = "1717", text = "Cod. Sin. omits “therefore.”" },
  { t = "note", id = "1718", text = "The things condemned in the previous chapter." },
  { t = "note", id = "1719", text = "Cod. Sin. has “resurrections,” but is corrected as above." },
  { t = "note", id = "1720", text = "Cod. Sin. has, “lawgivers of good things.”" },
  { t = "note", id = "1721", text = "Cod. Sin. omits the preposition." },
  { t = "note", id = "1722", text = "Cod. Sin. omits this." },
  { t = "note", id = "1723", text = "Cod. Sin. reads, “that ye may be found in the day of judgment,” which Hilgenfeld adopts." },
  { t = "note", id = "1724", text = "Literally, “While yet the good vessel is with you,” i.e., as long as you are in the body." },
  { t = "note", id = "1725", text = "Cod. Sin. reads, “fail not in any one of yourselves,” which is adopted by Hilgenfeld." },
  { t = "note", id = "1726", text = "Corrected in Cod. Sin. to, “it is worthy.”" },
  { t = "note", id = "1727", text = "Cod. Sin. omits this clause, but it is inserted by the corrector." },
  { t = "note", id = "1728", text = "Cod. Sin. omits “Amen,” and adds at the close, “Epistle of Barnabas.”" },
]

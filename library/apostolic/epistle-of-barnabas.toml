[[section]]
id = "chapter-7"
title = "Chapter VII.—Fasting, and the goat sent away, were types of Christ."
level = 1
blocks = [
  { t = "p", text = "Understand, then, ye children of gladness, that the good Lord has foreshown all things to us, that we might know to whom we ought for everything to render thanksgiving and praise. If therefore the Son of God, who is Lord [of all things], and who will judge the living and the dead, suffered, that His stroke might give us life, let us believe that the Son of God could not have suffered except for our sakes. Moreover, when fixed to the cross, He had given Him to drink vinegar and gall. Hearken how the priests of the people[^1527] gave previous indications of this. His commandment having been written, the Lord enjoined, that whosoever did not keep the fast should be put to death, because He also Himself was to offer in sacrifice for our sins the vessel of the Spirit, in order that the type established in Isaac when he was offered upon the altar might be fully accomplished. What, then, says He in the prophet? “And let them eat of the goat which is offered, with fasting, for all their sins.”[^1528] Attend carefully: “And let all the priests alone eat the inwards, unwashed with vinegar.” Wherefore? Because to me, who am to offer my flesh for the sins of my new people, ye are to give gall with vinegar to drink: eat ye alone, while the people fast and mourn in sackcloth and ashes. [These things were done] that He might show that it was necessary for Him to suffer for them.[^1529] How,[^1530] then, ran the commandment? Give your attention. Take two goats of goodly aspect, and similar to each other, and offer them. And let the priest take one as a burnt-offering for sins.[^1531] And what should they do with the other? “Accursed,” says He, “is the one.” Mark how the type of Jesus[^1532] now comes out. “And all of you spit upon it, and pierce it, and encircle its head with scarlet wool, and thus let it be driven into the wilderness.” And when all this has been done, he who bears the goat brings it into the desert, and takes the wool off from it, and places that upon a shrub which is called *Rachia*,[^1533] of which also we are accustomed to eat the fruits[^1534] when we find them in the field. Of this[^1535] kind of shrub alone the fruits are sweet. Why then, again, is this? Give good heed. [You see] “one upon the altar, and the other accursed;” and why [do you behold] the one that is accursed crowned? Because they shall see Him then in that day having a scarlet robe about his body down to his feet; and they shall say, Is not this He whom we once despised, and pierced, and mocked, and crucified? Truly this is[^1536] He who then declared Himself to be the Son of God. For how like is He to Him![^1537] With a view to this, [He required] the goats to be of goodly aspect, and similar, that, when they see Him then coming, they may be amazed by the likeness of the goat. Behold, then,[^1538] the type of Jesus who was to suffer. But why is it that they place the wool in the midst of thorns? It is a type of Jesus set before the view of the Church. [They[^1539] place the wool among thorns], that any one who wishes to bear it away may find it necessary to suffer much, because the thorn is formidable, and thus obtain it only as the result of suffering. Thus also, says He, “Those who wish to behold Me, and lay hold of My kingdom, must through tribulation and suffering obtain Me.”[^1540]" },
  { t = "note", id = "1527", text = "Cod. Sin. reads “temple,” which is adopted by Hilgenfeld." },
  { t = "note", id = "1528", text = "Not to be found in Scripture, as is the case also with what follows. Hefele remarks, that “certain false traditions respecting the Jewish rites seem to have prevailed among the Christians of the second century, of which Barnabas here adopts some, as do Justin (*Dial. c. Try.* 40) and Tertullian (*adv. Jud.* 14; *adv. Marc.* iii. 7).”" },
  { t = "note", id = "1529", text = "Cod. Sin. has “by them.”" },
  { t = "note", id = "1530", text = "Cod. Sin. reads, “what commanded He?”" },
  { t = "note", id = "1531", text = "Cod. Sin. reads, “one as a burnt-offering, and one for sins.”" },
  { t = "note", id = "1532", text = "Cod. Sin. reads, “type of God,” but it has been corrected to “Jesus.”" },
  { t = "note", id = "1533", text = "In Cod. Sin. we find “*Rachel*.” The orthography is doubtful, but there is little question that a kind of bramble-bush is intended." },
  { t = "note", id = "1534", text = "Thus the Latin interprets: others render “shoots.”" },
  { t = "note", id = "1535", text = "Cod. Sin. has “thus” instead of “this.”" },
  { t = "note", id = "1536", text = "Literally, “was.”" },
  { t = "note", id = "1537", text = "The text is here in great confusion, though the meaning is plain. Dressel reads, “For how are they alike, and why [does He enjoin] that the goats should be good and alike?” The Cod. Sin. reads, “How is He like Him? For this that,” etc." },
  { t = "note", id = "1538", text = "Cod. Sin. here inserts “the goat.”" },
  { t = "note", id = "1539", text = "Cod. Sin. reads, “for as he who … so, says he,” etc." },
  { t = "note", id = "1540", text = "Comp. Acts xiv. 22." },
]

[[section]]
id = "chapter-8"
title = "Chapter VIII.—The red heifer a type of Christ."
level = 1
blocks = [
  { t = "p", text = "Now what do you suppose this to be a type of, that a command was given to Israel, that men of the greatest wickedness[^1541] should offer a heifer, and slay and burn it, and, that then boys should take the ashes, and put these into vessels, and bind round a stick[^1542] purple wool along with hyssop, and that thus the boys should sprinkle the people, one by one, in order that they might be purified from their sins? Consider how He speaks to you with simplicity. The calf[^1543] is Jesus: the sinful men offering it are those who led Him to the slaughter. But now the men are no longer guilty, are no longer regarded as sinners.[^1544] And the boys that sprinkle are those that have proclaimed to us the remission of sins and purification of heart. To these He gave authority to preach the Gospel, being twelve in number, corresponding to the twelve tribes[^1545] of Israel. But why are there three boys that sprinkle? To correspond[^1546] to Abraham, and Isaac, and Jacob, because these were great with God. And why was the wool [placed] upon the wood? Because by wood Jesus holds His kingdom, so that [through the cross] those believing on Him shall live for ever. But why was hyssop joined with the wool? Because in His kingdom the days will be evil and polluted in which we shall be saved, [and] because he who suffers in body is cured through the cleansing[^1547] efficacy of hyssop. And on this account the things which stand thus are clear to us, but obscure to them because they did not hear the voice of the Lord." },
  { t = "note", id = "1541", text = "Literally, “men in whom sins are perfect.” Of this, and much more that follows, no mention is made in Scripture." },
  { t = "note", id = "1542", text = "Cod. Sin. has “upon sticks,” and adds, “Behold again the type of the cross, both the scarlet wool and the hyssop,”—adopted by Hilgenfeld." },
  { t = "note", id = "1543", text = "Cod. Sin. has, “the law is Christ Jesus,” corrected to the above." },
  { t = "note", id = "1544", text = "The Greek text is, “then no longer [sinful] men, no longer the glory of sinners,” which Dressel defends and Hilgenfeld adopts, but which is surely corrupt." },
  { t = "note", id = "1545", text = "Literally, “in witness of the tribes.”" },
  { t = "note", id = "1546", text = "“In witness of.”" },
  { t = "note", id = "1547", text = "Thus the sense seems to require, and thus Dressel translates, though it is difficult to extract such a meaning from the Greek text." },
]

[[section]]
id = "chapter-9"
title = "Chapter IX.—The spiritual meaning of circumcision."
level = 1
blocks = [
  { t = "p", text = "He speaks moreover concerning our ears, how He hath circumcised both them and our heart. The Lord saith in the prophet, “In the hearing of the ear they obeyed me.”[^1548] And again He saith, “By hearing, those shall hear who are afar off; they shall know what I have done.”[^1549] And, “Be ye circumcised in your hearts, saith the Lord.”[^1550] And again He says, “Hear, O Israel, for these things saith the Lord thy God.”[^1551] And once more the Spirit of the Lord proclaims, “Who is he that wishes to live for ever? By hearing let him hear the voice of my servant.”[^1552] And again He saith, “Hear, O heaven, and give ear, O earth, for God[^1553] hath spoken.”[^1554] These are in proof.[^1555] And again He saith, “Hear the word of the Lord, ye rulers of this people.”[^1556] And again He saith, “Hear, ye children, the voice of one crying in the wilderness.”[^1557] Therefore He hath circumcised our ears, that we might hear His word and believe, for the circumcision in which they trusted is abolished.[^1558] For He declared that circumcision was not of the flesh, but they transgressed because an evil angel deluded them.[^1559] He saith to them, “These things saith the Lord your God”—(here[^1560] I find a new[^1561] commandment)—“Sow not among thorns, but circumcise yourselves to the Lord.”[^1562] And why speaks He thus: “Circumcise the stubbornness of your heart, and harden not your neck?”[^1563] And again: “Behold, saith the Lord, all the nations are uncircumcised[^1564] in the flesh, but this people are uncircumcised in heart.”[^1565] But thou wilt say, “Yea, verily the people are circumcised for a seal.” But so also is every Syrian and Arab, and all the priests of idols: are these then also within the bond of His covenant?[^1566] Yea, the Egyptians also practise circumcision. Learn then, my children, concerning all things richly,[^1567] that Abraham, the first who enjoined circumcision, looking forward in spirit to Jesus, practised that rite, having received the mysteries[^1568] of the three letters. For [the Scripture] saith, “And Abraham circumcised ten, and eight, and three hundred men of his household.”[^1569] What, then, was the knowledge given to him in this? Learn the eighteen first, and then the three hundred.[^1570] The ten and the eight are thus denoted—Ten by Ι, and Eight by Η.[^1571] You have [the initials of the, name of] Jesus. And because[^1572] the cross was to express the grace [of our redemption] by the letter Τ, he says also, “Three Hundred.” He signifies, therefore, Jesus by two letters, and the cross by one. He knows this, who has put within us the engrafted[^1573] gift of His doctrine. No one has been admitted by me to a more excellent piece of knowledge[^1574] than this, but I know that ye are worthy." },
  { t = "note", id = "1548", text = "Ps. xviii. 44." },
  { t = "note", id = "1549", text = "Isa. xxxiii. 13." },
  { t = "note", id = "1550", text = "Jer. iv. 4." },
  { t = "note", id = "1551", text = "Jer. vii. 2." },
  { t = "note", id = "1552", text = "Ps. xxxiv. 11–13. The first clause of this sentence is wanting in Cod. Sin." },
  { t = "note", id = "1553", text = "Cod. Sin. has “Lord.”" },
  { t = "note", id = "1554", text = "Isa. i. 2." },
  { t = "note", id = "1555", text = "In proof of the spiritual meaning of circumcision; but Hilgenfeld joins the words to the preceding sentence." },
  { t = "note", id = "1556", text = "Isa. i. 10." },
  { t = "note", id = "1557", text = "Cod. Sin. reads, “it is the voice,” corrected, however, as above." },

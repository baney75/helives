[[section]]
id = "chapter-1"
title = "Chapter I.—After the salutation, the writer declares that he would communicate to his brethren something of that which he had himself received."
level = 1
blocks = [
  { t = "p", text = "All hail, ye sons and daughters, in the name of our Lord[^1445] Jesus Christ, who loved us in peace." },
  { t = "note", id = "1445", text = "The Cod. Sin. has simply, “the Lord.”" },
  { t = "p", text = "Seeing that the divine fruits[^1446] of righteousness abound among you, I rejoice exceedingly and above measure in your happy and honoured spirits, because ye have with such effect received the engrafted[^1447] spiritual gift. Wherefore also I inwardly rejoice the more, hoping to be saved, because I truly perceive in you the Spirit poured forth from the rich Lord[^1448] of love. Your greatly desired appearance has thus filled me with astonishment over you.[^1449] I am therefore persuaded of this, and fully convinced in my own mind, that since I began to speak among you I understand many things, because the Lord hath accompanied me in the way of righteousness. I am also on this account bound[^1450] by the strictest obligation to love you above my own soul, because great are the faith and love dwelling in you, while you hope for the life which He has promised.[^1451] Considering this, therefore, that if I should take the trouble to communicate to you some portion of what I have myself received, it will prove to me a sufficient reward that I minister to such spirits, I have hastened briefly to write unto you, in order that, along with your faith, ye might have perfect knowledge. The doctrines of the Lord, then, are three:[^1452] the hope of life, the beginning and the completion of it. For the Lord hath made known to us by the prophets both the things which are past and present, giving us also the first-fruits of the knowledge[^1453] of things to come, which things as we see accomplished, one by one, we ought with the greater richness of faith[^1454] and elevation of spirit to draw near to Him with reverence.[^1455] I then, not as your teacher, but as one of yourselves, will set forth a few things by which in present circumstances ye may be rendered the more joyful." },
  { t = "note", id = "1446", text = "Literally, “the judgments of God being great and rich towards you;” but, as Hefele remarks, δικαίωμα seems here to have the meaning of *righteousness*, as in Rom. v. 18." },
  { t = "note", id = "1447", text = "This appears to be the meaning of the Greek, and is confirmed by the ancient Latin version. Hilgenfeld, however, following Cod. Sin., reads “thus,” instead of “because,” and separates the clauses." },
  { t = "note", id = "1448", text = "The Latin reads, “spirit infused into you from the honourable fountain of God.”" },
  { t = "note", id = "1449", text = "This sentence is entirely omitted in the Latin." },
  { t = "note", id = "1450", text = "The Latin text is here quite different, and seems evidently corrupt. We have followed the Cod. Sin., as does Hilgenfeld." },
  { t = "note", id = "1451", text = "Literally, “in the hope of His life.”" },
  { t = "note", id = "1452", text = "The Greek is here totally unintelligible: it seems impossible either to punctuate or construe it. We may attempt to represent it as follows: “The doctrines of the Lord, then, are three: Life, Faith, and Hope, our beginning and end; and Righteousness, the beginning and the end of judgment; Love and Joy and the Testimony of gladness for works of righteousness.” We have followed the ancient Latin text, which Hilgenfeld also adopts, though Weitzäcker and others prefer the Greek." },
  { t = "note", id = "1453", text = "Instead of “knowledge” (γνώσεως), Cod. Sin. has “taste” (γεύσεως)." },
  { t = "note", id = "1454", text = "Literally, “we ought more richly and loftily to approach His fear.”" },
  { t = "note", id = "1455", text = "Instead of, “to Him with fear,” the reading of Cod. Sin., the Latin has, “to His altar,” which Hilgenfeld adopts." },
]

[[section]]
id = "chapter-2"
title = "Chapter II.—The Jewish sacrifices are now abolished."
level = 1
blocks = [
  { t = "p", text = "Since, therefore, the days are evil, and Satan[^1456] possesses the power of this world, we ought to give heed to ourselves, and diligently inquire into the ordinances of the Lord. Fear and patience, then, are helpers of our faith; and long-suffering and continence are things which fight on our side. While these remain pure in what respects the Lord, Wisdom, Understanding, Science, and Knowledge rejoice along with them.[^1457] For He hath revealed to us by all the prophets that He needs neither sacrifices, nor burnt-offerings, nor oblations, saying thus, “What is the multitude of your sacrifices unto Me, saith the Lord? I am full of burnt-offerings, and desire not the fat of lambs, and the blood of bulls and goats, not when ye come to appear before Me: for who hath required these things at your hands? Tread no more My courts, not though ye bring with you fine flour. Incense is a vain abomination unto Me, and your new moons and sabbaths I cannot endure.”[^1458] He has therefore abolished these things, that the new law of our Lord Jesus Christ, which is without the yoke of necessity, might have a human oblation.[^1459] And again He says to them, “Did I command your fathers, when they went out from the land of Egypt, to offer unto Me burnt-offerings and sacrifices? But this rather I commanded them, Let no one of you cherish any evil in his heart against his neighbour, and love not an oath of falsehood.”[^1460] We ought therefore, being possessed of understanding, to perceive the gracious intention of our Father; for He speaks to us, desirous that we, not[^1461] going astray like them, should ask how we may approach Him. To us, then, He declares, “A sacrifice [pleasing] to God is a broken spirit; a smell of sweet savour to the Lord is a heart that glorifieth Him that made it.”[^1462] We ought therefore, brethren, carefully to inquire concerning our salvation, lest the wicked one, having made his entrance by deceit, should hurl[^1463] us forth from our [true] life." },
  { t = "note", id = "1456", text = "The Latin text is literally, “the adversary;” the Greek has, “and he that worketh possesseth power;” Hilgenfeld reads, “he that worketh against,” the idea expressed above being intended." },
  { t = "note", id = "1457", text = "Or, “while these things continue, those which respect the Lord rejoice in purity along with them—Wisdom,” etc." },
  { t = "note", id = "1458", text = "Isa. i. 11–14, from the Sept., as is the case throughout. We have given the quotation as it stands in Cod. Sin." },
  { t = "note", id = "1459", text = "Thus in the Latin. The Greek reads, “might not have a man-made oblation.” The Latin text seems preferable, implying that, instead of the outward sacrifices of the law, there is now required a dedication of *man himself*. Hilgenfeld follows the Greek." },
  { t = "note", id = "1460", text = "Jer. vii. 22; Zech. viii. 17." },
  { t = "note", id = "1461", text = "So the Greek. Hilgenfeld, with the Latin, omits “not.”" },
  { t = "note", id = "1462", text = "Ps. li. 19. There is nothing in Scripture corresponding to the last clause." },
  { t = "note", id = "1463", text = "Literally, “sling us out.”" },
]

[[section]]
id = "chapter-3"
title = "Chapter III.—The fasts of the Jews are not true fasts, nor acceptable to God."
level = 1
blocks = [
  { t = "p", text = "He says then to them again concerning these things, “Why do ye fast to Me as on this day, saith the Lord, that your voice should be heard with a cry? I have not chosen this fast, saith the Lord, that a man should humble his soul. Nor, though ye bend your neck like a ring, and put upon you sackcloth and ashes, will ye call it an acceptable fast.”[^1464] To us He saith, “Behold, this is the fast that I have chosen, saith the Lord, not that a man should humble his soul, but that he should loose every band of iniquity, untie the fastenings of harsh agreements, restore to liberty them that are bruised, tear in pieces every unjust engagement, feed the hungry with thy bread, clothe the naked when thou seest him, bring the homeless into thy house, not despise the humble if thou behold him, and not [turn away] from the members of thine own family. Then shall thy dawn break forth, and thy healing shall quickly spring up, and righteousness shall go forth before thee, and the glory of God shall encompass thee; and then thou shalt call, and God shall hear thee; whilst thou art yet speaking, He shall say, Behold, I am with thee; if thou take away from thee the chain [binding others], and the stretching forth of the hands[^1465] [to swear falsely], and words of murmuring, and give cheerfully thy bread to the hungry, and show compassion to the soul that has been humbled.”[^1466] To this end, therefore, brethren, He is long-suffering, foreseeing how the people whom He has prepared shall with guilelessness believe in His Beloved. For He revealed all these things to us beforehand, that we should not rush forward as rash acceptors of their laws.[^1467]" },
  { t = "note", id = "1464", text = "Isa. lviii. 4, 5." },
  { t = "note", id = "1465", text = "The original here is χειροτονίαν, from the LXX. Hefele remarks, that it may refer to the stretching forth of the hands, either to swear falsely, or to mock and insult one’s neighbour." },
  { t = "note", id = "1466", text = "Isa. lviii. 6–10." },
  { t = "note", id = "1467", text = "The Greek is here unintelligible: the Latin has, “that we should not rush on, as if proselytes to their law.”" },
]

[[section]]
id = "chapter-4"
title = "Chapter IV.—Antichrist is at hand: let us therefore avoid Jewish errors."
level = 1
blocks = [
  { t = "p", text = "It therefore behoves us, who inquire much concerning events at hand,[^1468] to search diligently into those things which are able to save us. Let us then utterly flee from all the works of iniquity, lest these should take hold of us; and let us hate the error of the present time, that we may set our love on the world to come: let us not give loose reins to our soul, that it should have power to run with sinners and the wicked, lest we become like them. The final stumbling-block (or source of danger) approaches, concerning which it is written, as Enoch[^1469] says, “For for this end the Lord has cut short the times and the days, that His Beloved may hasten; and He will come to the inheritance.” And the prophet also speaks thus: “Ten kingdoms shall reign upon the earth, and a little king shall rise up after them, who shall subdue under one three of the kings.”[^1470] In like manner Daniel says concerning the same, “And I beheld the fourth beast, wicked and powerful, and more savage than all the beasts of the earth, and how from it sprang up ten horns, and out of them a little budding horn, and how it subdued under one three of the great horns.”[^1471] Ye ought therefore to understand. And this also I further beg of you, as being one of you, and loving you both individually and collectively more than my own soul, to take heed now to yourselves, and not to be like some, adding largely to your sins, and saying, “The covenant is both theirs and ours.”[^1472] But they thus finally lost it, after Moses had already received it. For the Scripture saith, “And Moses was fasting in the mount forty days and forty nights, and received the covenant from the Lord, tables of stone written with the finger of the hand of the Lord;”[^1473] but turning away to idols, they lost it. For the Lord speaks thus to Moses: “Moses go down quickly; for the people whom thou hast brought out of the land of Egypt have transgressed.”[^1474] And Moses understood [the meaning of God], and cast the two tables out of his hands; and their covenant was broken, in order that the covenant of the beloved Jesus might be sealed upon our heart, in the hope which flows from believing in Him.[^1475] Now, being desirous to write many things to you, not as your teacher, but as becometh one who loves you, I have taken care not to fail to write to you from what I myself possess, with a view to your purification.[^1476] We take earnest[^1477] heed in these last days; for the whole [past] time of your faith will profit you nothing, unless now in this wicked time we also withstand coming sources of danger, as becometh the sons of God. That the Black One[^1478] may find no means of entrance, let us flee from every vanity, let us utterly hate the works of the way of wickedness. Do not, by retiring apart, live a solitary life, as if you were already [fully] justified; but coming together in one place, make common inquiry concerning what tends to your general welfare. For the Scripture saith, “Woe to them who are wise to themselves, and prudent in their own sight!”[^1479] Let us be spiritually-minded: let us be a perfect temple to God. As much as in us lies, let us meditate upon the fear of God, and let us keep His commandments, that we may rejoice in His ordinances. The Lord will judge the world without respect of persons. Each will receive as he has done: if he is righteous, his righteousness will precede him; if he is wicked, the reward of wickedness is before him. Take heed, lest resting at our ease, as those who are the called [of God], we should fall asleep in our sins, and the wicked prince, acquiring power over us, should thrust us away from the kingdom of the Lord. And all the more attend to this, my brethren, when ye reflect and behold, that after so great signs and wonders were wrought in Israel, they were thus [at length] abandoned. Let us beware lest we be found [fulfilling that saying], as it is written, “Many are called, but few are chosen.”[^1480]" },
  { t = "note", id = "1468", text = "Or it might be rendered, “things present.” Cotelerius reads, “de his instantibus.”" },
  { t = "note", id = "1469", text = "The Latin reads, “Daniel” instead of “Enoch;” comp. Dan. ix. 24–27." },
  { t = "note", id = "1470", text = "Dan. vii. 24, very loosely quoted." },
  { t = "note", id = "1471", text = "Dan. vii. 7, 8, also very inaccurately cited." },
  { t = "note", id = "1472", text = "We here follow the Latin text in preference to the Greek, which reads merely, “the covenant is ours.” What follows seems to show the correctness of the Latin, as the author proceeds to deny that the Jews had any further interest in the promises." },
  { t = "note", id = "1473", text = "Ex. xxxi. 18, Ex. xxxiv. 28." },
  { t = "note", id = "1474", text = "Ex. xxxii. 7; Deut. ix. 12." },
  { t = "note", id = "1475", text = "Literally, “in hope of His faith.”" },
  { t = "note", id = "1476", text = "The Greek is here incorrect and unintelligible; and as the Latin omits the clause, our translation is merely conjectural. Hilgenfeld’s text, if we give a somewhat peculiar meaning to ἐλλιπεῖν, may be translated: “but as it is becoming in one who loves you not to fail in giving you what we have, I, though the very offscouring of you, have been eager to write to you.”" },
  { t = "note", id = "1477", text = "So the Cod. Sin. Hilgenfeld reads, with the Latin, “let us take.”" },
  { t = "note", id = "1478", text = "The Latin here departs entirely from the Greek text, and quotes as a saying of “the Son of God” the following precept, nowhere to be found in the New Testament: “Let us resist all iniquity, and hold it in hatred.” Hilgenfeld joins this clause to the former sentence." },
  { t = "note", id = "1479", text = "Isa. v. 21." },
  { t = "note", id = "1480", text = "An exact quotation from Matt. xx. 16 or Matt. xxii. 14. It is worthy of notice that this is the first example in the writings of the Fathers of a citation from any book of the New Testament, preceded by the authoritative formula, “it is written.”" },
]

[[section]]
id = "chapter-5"
title = "Chapter V.—The new covenant, founded on the sufferings of Christ, tends to our salvation, but to the Jews’ destruction."
level = 1
blocks = [
  { t = "p", text = "For to this end the Lord endured to deliver up His flesh to corruption, that we might be sanctified through the remission of sins, which is effected by His blood of sprinkling. For it is written concerning Him, partly with reference to Israel, and partly to us; and [the Scripture] saith thus: “He was wounded for our transgressions, and bruised for our iniquities: with His stripes we are healed. He was brought as a sheep to the slaughter, and as a lamb which is dumb before its shearer.”[^1481] Therefore we ought to be deeply grateful to the Lord, because He has both made known to us things that are past, and hath given us wisdom concerning things present, and hath not left us without understanding in regard to things which are to come. Now, the Scripture saith, “Not unjustly are nets spread out for birds.”[^1482] This means that the man perishes justly, who, having a knowledge of the way of righteousness, rushes off into the way of darkness. And further, my brethren: if the Lord endured to suffer for our soul, He being Lord of all the world, to whom God said at the foundation of the world, “Let us make man after our image, and after our likeness,”[^1483] understand how it was that He endured to suffer at the hand of men. The prophets, having obtained grace from Him, prophesied concerning Him. And He (since it behoved Him to appear in flesh), that He might abolish death, and reveal the resurrection from the dead, endured [what and as He did], in order that He might fulfil the promise made unto the fathers, and by preparing a new people for Himself, might show, while He dwelt on earth, that He, when He has raised mankind, will also judge them. Moreover, teaching Israel, and doing so great miracles and signs, He preached [the truth] to him, and greatly loved him. But when He chose His own apostles who were to preach His Gospel, [He did so from among those] who were sinners above all sin, that He might show He came “not to call the righteous, but sinners to repentance.”[^1484] Then He manifested Himself to be the Son of God. For if He had not come in the flesh, how could men have been saved by beholding Him?[^1485] Since looking upon the sun which is to cease to exist, and is the work of His hands, their eyes are not able to bear his rays. The Son of God therefore came in the flesh with this view, that He might bring to a head the sum of their sins who had persecuted His prophets[^1486] to the death. For this purpose, then, He endured. For God saith, “The stroke of his flesh is from them;”[^1487] and[^1488] “when I shall smite the Shepherd, then the sheep of the flock shall be scattered.”[^1489] He himself willed thus to suffer, for it was necessary that He should suffer on the tree. For says he who prophesies regarding Him, “Spare my soul from the sword,[^1490] fasten my flesh with nails; for the assemblies of the wicked have risen up against me.”[^1491] And again he says, “Behold, I have given my back to scourges, and my cheeks to strokes, and I have set my countenance as a firm rock.”[^1492]" },
  { t = "note", id = "1481", text = "Isa. liii. 5, 7." },
  { t = "note", id = "1482", text = "Prov. i. 17, from the LXX, which has mistaken the meaning." },
  { t = "note", id = "1483", text = "Gen. i. 26." },
  { t = "note", id = "1484", text = "Matt. ix. 13; Mark ii. 17; Luke v. 32." },
  { t = "note", id = "1485", text = "The Cod. Sin. reads, “neither would men have been saved by seeing Him.”" },
  { t = "note", id = "1486", text = "Cod. Sin. has, “their prophets,” but the corrector has changed it as above." },
  { t = "note", id = "1487", text = "A very loose reference to Isa. liii. 8." },
  { t = "note", id = "1488", text = "Cod. Sin. omits “and,” and reads, “when they smite their own shepherd, then the sheep of the pasture shall be scattered and fail.”" },
  { t = "note", id = "1489", text = "Zech. xiii. 7." },
  { t = "note", id = "1490", text = "Cod. Sin. inserts “and.”" },
  { t = "note", id = "1491", text = "These are inaccurate and confused quotations from Ps. xxii. 16, 20, and Ps. cxix. 120." },
  { t = "note", id = "1492", text = "Isa. l. 6, 7." },
]

[[section]]
id = "chapter-6"
title = "Chapter VI.—The sufferings of Christ, and the new covenant, were announced by the prophets."
level = 1
blocks = [
  { t = "p", text = "When, therefore, He has fulfilled the commandment, what saith He? “Who is he that will contend with Me? let him oppose Me: or who is he that will enter into judgment with Me? let him draw near to the servant of the Lord.”[^1493] “Woe unto you, for ye shall all wax old, like a garment, and the moth shall eat you up.”[^1494] And again the prophet says, “Since[^1495] as a mighty stone He is laid for crushing, behold I cast down for the foundations of Zion a stone, precious, elect, a corner-stone, honourable.” Next, what says He? “And he who shall trust[^1496] in it shall live for ever.” Is our hope, then, upon a stone? Far from it. But [the language is used] inasmuch as He laid his flesh [as a foundation] with power; for He says, “And He placed me as a firm rock.”[^1497] And the prophet says again, “The stone which the builders rejected, the same has become the head of the corner.”[^1498] And again he says, “This is the great and wonderful day which the Lord hath made.”[^1499] I write the more simply unto you, that ye may understand. I am the off-scouring of your love.[^1500] What, then, again says the prophet? “The assembly of the wicked surrounded me; they encompassed me as bees do a honeycomb,”[^1501] and “upon my garment they cast lots.”[^1502] Since, therefore, He was about to be manifested and to suffer in the flesh, His suffering was foreshown. For the prophet speaks against Israel, “Woe to their soul, because they have counselled an evil counsel against themselves,[^1503] saying, Let us bind the just one, because he is displeasing to us.”[^1504] And Moses also says to them,[^1505] “Behold these things, saith the Lord God: Enter into the good land which the Lord swore [to give] to Abraham, and Isaac, and Jacob, and inherit ye it, a land flowing with milk and honey.”[^1506] What, then, says Knowledge?[^1507] Learn: “Trust,” she says, “in Him who is to be manifested to you in the flesh—that is, Jesus.” For man is earth in a suffering state, for the formation of Adam was from the face of the earth. What, then, meaneth this: “into the good land, a land flowing with milk and honey?” Blessed be our Lord, who has placed in us wisdom and understanding of secret things. For the prophet says, “Who shall understand the parable of the Lord, except him who is wise and prudent, and who loves his Lord?”[^1508] Since, therefore, having renewed us by the remission of our sins, He hath made us after another pattern, [it is His purpose] that we should possess the soul of children, inasmuch as He has created us anew by His Spirit.[^1509] For the Scripture says concerning us, while He speaks to the Son, “Let Us make man after Our image, and after Our likeness; and let them have dominion over the beasts of the earth, and the fowls of heaven, and the fishes of the sea.”[^1510] And the Lord said, on beholding the fair creature[^1511] man, “Increase, and multiply, and replenish the earth.”[^1512] These things [were spoken] to the Son. Again, I will show thee how, in respect to us,[^1513] He has accomplished a second fashioning in these last days. The Lord says, “Behold, I will make[^1514] the last like the first.”[^1515] In reference to this, then, the prophet proclaimed, “Enter ye into the land flowing with milk and honey, and have dominion over it.”[^1516] Behold, therefore, we have been refashioned, as again He says in another prophet, “Behold, saith the Lord, I will take away from these, that is, from those whom the Spirit of the Lord foresaw, their stony hearts, and I will put hearts of flesh within them,”[^1517] because He[^1518] was to be manifested in flesh, and to sojourn among us. For, my brethren, the habitation of our heart is a holy temple to the Lord.[^1519] For again saith the Lord, “And wherewith shall I appear before the Lord my God, and be glorified?”[^1520] He says,[^1521] “I will confess to thee in the Church in the midst[^1522] of my brethren; and I will praise thee in the midst of the assembly of the saints.”[^1523] We, then, are they whom He has led into the good land. What, then, mean milk and honey? This, that as the infant is kept alive first by honey, and then by milk, so also we, being quickened and kept alive by the faith of the promise and by the word, shall live ruling over the earth. But He said above,[^1524] “Let them increase, and rule over the fishes.”[^1525] Who then is able to govern the beasts, or the fishes, or the fowls of heaven? For we ought to perceive that to govern implies authority, so that one should command and rule. If, therefore, this does not exist at present, yet still He has promised it to us. When? When we ourselves also have been made perfect [so as] to become heirs of the covenant of the Lord.[^1526]" },

[[section]]
id = "introductory-notice"
title = "Introductory Notice"
level = 1
blocks = [
  { t = "h", text = "to the Homily Known as" },
  { t = "h", text = "the Second Epistle of Clement." },
  { t = "p", text = "It is gratifying that our series is marked by tokens of critical progress, and not less cheering tokens of scientific research. The clearing-up of much that has perplexed us about Hermas; the Bryennios discovery; and, not least, the completion of this fragment, which has long been a scandal to patristic inquiry,—are surely such tokens. They enrich the reader with definite ideas on many collateral subjects. May they not stimulate American scholarship and American affluence to fresh enterprises of the same character for the advancement of learning, and the glory of the world’s Redeemer and Illuminator?" },
  { t = "p", text = "The very early date to which this homily is now assigned makes its slightest allusions to the New-Testament canon of very great importance. I have ventured to indicate a few such, even where they may be mere allusions, not textual quotations: as, e.g., on p. 517, at notes 20 and 22, slight indications of a reference to the Second Epistle of St. Peter and to the Apocalypse.[^3838]" },
  { t = "note", id = "3838", text = "If this reference to 2 Pet. iii. 9 be probable, it is one of the earliest testimonies to the genuine character of that Epistle. The true Clement has two references to the same (pp. 8 and 11, vol. i., this series), and Justin also (vol. i. p. 240) is credited with a similar reference to 2 Peter and the Apocalypse. See Lardner, Credib., vol. ii. p. 123 et seq." },
  { t = "p", text = "I shall have occasion to refer to this work in the elucidation of the Liturgies which are to follow. If it be, as Bishop Lightfoot supposes, a homily of the second century, it may lend important retrospective aid to the student of these volumes in other particulars; but, having entrusted this interesting relic to the editorial care of a most competent scholar, I shall not presume to anticipate his judgment in any matter." },
]

[[section]]
id = "introductory-notice-by-professor-m-b-riddle"
title = "Introductory Notice by Professor M. B. Riddle, D.D."
level = 1
blocks = [
  { t = "h", text = "section 1.—text." },
  { t = "p", text = "In this volume, pp. 372–376, will be found a brief account of the Codex discovered by Bryennios, now Metropolitan of Nicomedia. It remains in the library of the Jerusalem Monastery of the Holy Sepulchre at Constantinople. While the publication of the Greek text of the Teaching awakened unusual interest, the recovery of that document has not been the only valuable result of this important discovery. The Codex, as was speedily known, contains the only complete copy of the Greek text of the two Epistles of Clement. The lacunæ previously existing in the genuine Epistle were not extensive; but, as now appears, the Alexandrian manuscript contains only three-fifths of the second Epistle. The entire Greek text of both Epistles was given to the public by Bryennios[^3839] in 1875." },
  { t = "note", id = "3839", text = "The full title of his edition, in English form, is as follows: “The two Epistles of our holy father Clement Bishop of Rome to the Corinthians; from a manuscript in the Library of the Most Holy Sepulchre in Fanar of Constantinople; now for the first time published complete, with prolegomena and notes, by Philotheos Bryennios, Metropolitan of Serræ. Constantinople, 1875.”" },
  { t = "p", text = "This at once led to a revision of some recent editions, notably those of Hilgenfeld,[^3840] and of Gebhardt and Harnack.[^3841] Many monographs soon appeared. But the discovery of a new (Syriac) source for the text in 1876, while not affecting the general problem, gave to patristic scholars more abundant critical material. Bishop Lightfoot’s Appendix[^3842] contains the most convenient and accessible collation of this material, as well as the most clear statements on all points affected by the two discoveries. The Syriac manuscript, containing a version of the two Epistles of Clement, was purchased by the Cambridge University Library in 1876, from the collection of “the late Oriental scholar M. Jules Mohl of Paris” (Lightfoot). It embraces the entire New Testament, except the Apocalypse, in the Harkleian recension of the Philoxenian (or later) Syriac version; but the scribe has inserted the two Epistles of Clement (entire) between the Catholic and Pauline Epistles. The value of the manuscript for New-Testament criticism is great, and the phenomena it presents interesting, as bearing on the discussion of the New-Testament canon; but the paucity of sources for the text of the Clementine Epistles gives special importance to the discovery of a version of these writings so soon after the recovery of the entire Greek text. A discussion of the textual questions is forbidden by the limits of this Introductory Notice, but a few points may be stated:—" },
  { t = "note", id = "3840", text = "Novum Test. extra canonem receptum (2d ed., Leipzig, 1876). Pp. xliv.-xlix., 69–106, contain prolegomena, text, and notes, 2 Clement." },
  { t = "note", id = "3841", text = "Patrum Apost. Opera, 2d ed., Leipzig, 1876." },
  { t = "note", id = "3842", text = "St. Clement of Rome An Appendix containing the newly recovered portions, with introductions, notes, and translations. London, 1877. The original volume, London, 1869." },
  { t = "p", text = "1. A comparison of the three authorities (the Alexandrian, the Constantinopolitan, and the Syriac), in the parts they in common contain, shows that the first is most trustworthy, and that the Syriac is usually more correct than the Constantinopolitan." },
  { t = "p", text = "2. Hence, in the recovered portions, the authority of the Syriac is very valuable in correcting the obvious blunders of the Greek copy. This should teach caution in accepting the text of the Teaching, where the same Greek manuscript is our only authority." },
  { t = "p", text = "3. The genuine Epistle of Clement, which stands next in age to the canonical books of the New Testament, now stands next in accuracy of text also. Doubt in regard to textual questions decreases as the critical material increases." },
  { t = "h", text = "section 2.—place and date of composition; author." },
  { t = "p", text = "The recovery of the entire text of the Second Epistle settles the question as to the purpose of the work. As was previously surmised, it is a homily (comp. chaps. xvii., xix., xx.); moreover, it was “read” by the author at public worship after the Scripture lesson (see Chap. xix). But as to place, date, and author, there is still diversity of opinion. The three questions are closely related. The view of Bishop Lightfoot seems, on the whole, most tenable. He regards the homily as of Corinthian origin, delivered, in all probability, between a. d. 120 and 140, but the work of an unknown author, who seems to have been one of the presbyters of the church,—possibly the bishop. The allusions to the athletic games are in favour of Corinth. On this theory the title is thus accounted for: The genuine Epistle of Clement was addressed to the Corinthians, and read in the church of that city from time to time. This homily was probably read in the same manner, and at length united in a manuscript copy with the other. Each was “to the Corinthians:” hence it was gradually inferred that both were Epistles of Clement. Of this succession or movement Lightfoot finds some indications in the manuscript authorities." },
  { t = "p", text = "The internal evidence of an early date has been increased by the discovery of the concluding portion, but there is nothing to determine the exact time of composition. The distinction made in Chap. xiv. between the Old and New Testaments, as well as the use of the Gospel of the Egyptians (at the close of chap. xii.), taken in connection with the unmistakeable citations of New-Testament passages as of Divine authority, point to the first half of the second century as the probable period. The absence of all direct opposition to Gnosticism points to an origin within the same limits. All these considerations make against the view of Hilgenfeld, who attributes the homily to Clement of Alexandria, thus assigning it to the latter half of the second century." },
  { t = "p", text = "In regard to the author, nothing further is learned from the newly recovered portion, except the fact that he was a preacher. Even this does not determine his ecclesiastical position, since at that early date much freedom of utterance was permitted in Christian assemblies. It is, however, very probable that the author was a presbyter; and it is not improbable that he was the chief presbyter, or local bishop." },
  { t = "p", text = "The homily is still attributed to a person named Clement, but there are three theories as to what Clement. (1) Bryennios stands almost alone in claiming that the document is the work of Clemens Romanus. The internal evidence against this view was quite sufficient before the full text of the two Epistles was known; now it is to be regarded as abundantly conclusive. Even the English version of the two writings will suggest to the intelligent reader the points of difference. (2) As intimated above, Hilgenfeld regards Clement of Alexandria as the author; but this places the homily too late. Moreover, the writings of the Alexandrian Father stand immensely above this feeble, commonplace, and chaotic production. Even the citation from the Gospel of the Egyptians, common to both,[^3843] is differently used by the two authors; Clement of Alexandria opposing the interpretation favoured in this homily, as well as objecting to the authority of that apocryphal Gospel. Hilgenfeld’s argument from the word φιλοσοφει̑ν in chap. xix., is invalidated by the improbability of that reading; see note in loco. (3) The most plausible view, as Bishop Lightfoot admits, is that of Harnack. He assigns the homily to a third Clement, referred to, as he supposes, in the Shepherd of Hermas,[^3844] and living somewhat later than Clement of Rome. In favour of this may be urged: some similarity to the Shepherd of Hermas, the probability that at the date of the later writing Clement of Rome was not living, and the easy explanation it affords of the traditional title. But, while a third Clement may have lived at Rome, we have no evidence other than the doubtful hint in the Shepherd. The allusion in that work seems far more appropriate to the well-known Clement of Rome. The argument from the later date of the Shepherd proves very little; not only is the date uncertain, but the visions are placed quite early. The editor of this series, while accepting a. d. 160 as the probable date of the Shepherd, regards it as a compilation, introducing “Hermas and Clement to identify the times which are idealized in his allegory.”[^3845] The view of Bishop Lightfoot, therefore, seems to be the safest." },
  { t = "note", id = "3843", text = "See chap. xii., and Clem. Alex., Stromata, iii. 13, vol. ii. p. 398." },
  { t = "note", id = "3844", text = "See Vision II. 4, vol. ii. p. 12." },
  { t = "note", id = "3845", text = "See vol. ii. p. 4; and comp. Lightfoot, Appendix, pp. 316, 317." },
  { t = "h", text = "section 3.—character and contents." },
  { t = "p", text = "The style of the homily is poor. It abounds in connectives, which link unconnected ideas; its thought is feeble, its theology peculiar though not false, its arrangement confused. While it furnishes some historical data for practical theology, it is, in homiletical method and matter, in sharp contrast with the Apostolic writings and with the homilies of Origen. Though referring to Scripture, it has none of the virtues of the expository discourse; though hortatory in tone, it has little of the unity and directness of better sermons of that class. Its chief excellence is its brevity." },
  { t = "p", text = "It is difficult to make an analysis of the contents. The theme is the duty of fulfilling the commands of Christ." },
  { t = "p", text = "(1) This obedience is the true confession of Christ, answering to the greatness of His salvation; mainly in chaps. i.-iv." },
  { t = "p", text = "(2) Thus the Christian shows his opposition to the world; chaps. v.-viii." },
  { t = "p", text = "(3) This obedience will be rewarded in the future world; chaps. ix.-xvii." },
  { t = "p", text = "(4) The conclusion: the preacher’s confession (xviii.), justification of his exhortation (xix.); concluding word of consolation, with doxology (xx.). But the treatment is not strictly logical, nor are the parts clearly distinguished." },
  { t = "p", text = "The theology shows no traces of heresy, nor does it sharply oppose any false doctrinal views. It lacks the dogmatic precision of a later age, but emphasizes rigid views of the relation of the sexes. “Repentance and good works seem to be the main articles of its creed. Of regeneration there seems to be no definite idea: to be called is the same as to be saved. The Church is pre-existent; the kingdom of God is in the future; no worth is left to this world or to the life in it. The principal argument urged in favour of standing firm in faith is the good issue of it in the next life” (C. J. H. Ropes)." },
  { t = "p", text = "The hints given in regard to public worship agree with the famous description of Justin Martyr,[^3846] and there are indications that the early freedom of exhortation had not yet disappeared. Bishop Lightfoot aptly concludes his dissertation with these words: “the homily itself, as a literary work, is almost worthless. As the earliest example of its kind, however, and as the product of an important age of which we possess only the scantiest remains, it has the highest value. Nor will its intellectual poverty blind us to its true grandeur, as an example of the lofty moral earnestness and the triumphant faith which subdued a reluctant world, and laid it prostrate at the foot of the cross.”[^3847]" },
  { t = "note", id = "3846", text = "First Apology, ch. lxvii. (vol. i. p. 186)." },
  { t = "note", id = "3847", text = "St. Clement, Appendix, p. 317." },
  { t = "h", text = "section 4.—the version in this volume." },
  { t = "p", text = "Greater unity would have been secured by a new translation of the entire work. Since, however, this was not possible, the aim of the editor has been to give the reader, as far as practicable, the benefit of the light shed upon the whole by the recently discovered authorities. The portion already translated in the Edinburgh volume has been supplied with critical annotations, and a few exegetical points have been treated. The recent editions of the Greek text have, of course, been consulted. The newly recovered portion has been re-translated. Bishop Lightfoot’s version is so excellent that the temptation to use it was very great. It has, of course, influenced the editor in many places. But the following version differs from it mainly in two respects: (1) An effort has been made to preserve the verbal correspondences between the language of the homily and that of the New Testament: hence the English word used in the Revised Version as an equivalent of a Greek term is given here as a similar equivalent. (2) The view of the Greek tenses indicated in Lightfoot’s renderings does not always accord with that of the editor." },
  { t = "p", text = "It may be added, that Professor C. J. H. Ropes of Bangor, Me., kindly sent, for use in the preparation of the Epistle for this volume, his manuscript translation and notes. These have been very helpful, and are entitled to this acknowledgment. It will be found that the American translation is less paraphrastic than the Edinburgh. The new portions, both text and notes, have been printed without brackets when they are the work of the editor. The rare additions of the general editor are always bracketed, that the reader may readily recognise to whom the literary responsibility in each case properly belongs." },
  { t = "p", text = "The following is the Edinburgh Introductory Notice:—" },
  { t = "p", text = "The first certain reference which is made by any early writer to this so-called Epistle of Clement is found in these words of Eusebius (Hist. Eccl., iii. 38): “We must know that there is also a second Epistle of Clement. But we do not regard it as being equally notable with the former, since we know of none of the ancients that have made use of it.” Several critics in modern times have endeavoured to vindicate the authenticity of this Epistle. But it is now generally regarded as one of the many writings which have been falsely ascribed to Clement. Besides the want of external evidence, indicated even by Eusebius in the above extract, the diversity of style clearly points to a different writer from that of the first Epistle. A commonly accepted opinion among critics at the present day is, that this is not an Epistle at all, but a fragment of one of the many homilies falsely ascribed to Clement. There can be no doubt, however, that in the catalogue of writings contained in the Alexandrian ms. it is both styled an Epistle, and, as well as the other which accompanies it, is attributed to Clement. As the ms. is certainly not later than the fifth century, the opinion referred to must by that time have taken firm root in the Church; but in the face of internal evidence, and in want of all earlier testimony, such a fact goes but a small way to establish its authenticity." },
]

[[section]]
id = "the-homily"
title = "The Homily"
level = 1
blocks = [
  { t = "h", text = "[^3848] Chap. i.—we ought to think highly of christ." },
  { t = "note", id = "3848", text = "No title, not even a letter, is preserved in the ms. [In C (= ms. at Constantinople found by Bryennios) the title is Κλήμεντος πρὸς Κορινθίους B’, corresponding to that of the First Epistle. In S (= Syriac ms. at Cambridge) there is a subscription to the First Epistle ascribing it to Clement, then these words: “Of the same the second Epistle to the Corinthians.” At the close this subscription occurs: “Here endeth the Second Epistle of Clement to the Corinthians.”—R.]" },
  { t = "p", text = "Brethren, it is fitting that you should think of Jesus Christ as of God,—as the Judge of the living and the dead. And it does not become us[^3849] to think lightly[^3850] of our salvation; for if we think little[^3851] of Him, we shall also hope but to obtain little from Him. And those of us[^3852] who hear carelessly of these things, as if they were of small importance, commit sin, not knowing whence we have been called, and by whom, and to what place, and how much Jesus Christ submitted to suffer for our sakes. What return, then, shall we make to Him? or what fruit that shall be worthy of that which He has given to us? For,[^3853] indeed, how great are the benefits[^3854] which we owe to Him! He has graciously given us light; as a Father, He has called us sons; He has saved us when we were ready to perish. What praise, then, shall we give to Him, or what return shall we make for the things which we have received?[^3855] We were deficient[^3856] in understanding, worshipping stones and wood, and gold, and silver, and brass, the works of men’s hand;[^3857] and our whole life was nothing else than death. Involved in blindness, and with such darkness[^3858] before our eyes, we have received sight, and through His will have laid aside that cloud by which we were enveloped. For He had compassion on us, and mercifully saved us, observing the many errors in which we were entangled, as well as the destruction to which we were exposed,[^3859] and that we had[^3860] no hope of salvation except it came to us from Him. For He called us when we were not,[^3861] and willed that out of nothing we should attain a real existence.[^3862]" },
  { t = "note", id = "3849", text = "[C has here, and in many other places, ὑμᾶς instead of ἡμᾶς. This substitution of the second person plural is one of its marked peculiarities.—R.]" },
  { t = "note", id = "3850", text = "[Literally, “little things;” Lightfoot, “mean things.”—R.]" },
  { t = "note", id = "3851", text = "[Literally, “little things;” Lightfoot, “mean things.”—R.]" },
  { t = "note", id = "3852", text = "[Lightfoot follows the Syriac, and renders: “And they that listen, as concerning mean things, do wrong; and we ourselves do wrong, not knowing,” etc. But the briefer reading of the Greek mss. is *lectio difficilior* —R.]" },
  { t = "note", id = "3853", text = "[Only S has γάρ. A has δέ, which the Edinburgh translators have rendered “for.” So twice in chap. iii.—R.]" },
  { t = "note", id = "3854", text = "Literally, “holy things.”" },
  { t = "note", id = "3855", text = "Comp. Ps. cxvi. 12." },
  { t = "note", id = "3856", text = "Literally, “lame.”" },
  { t = "note", id = "3857", text = "Literally “of men.” [Compare Arnobius, vol. vi. p. 423.]" },
  { t = "note", id = "3858", text = "Literally, “being full of such darkness in our sight.”" },
  { t = "note", id = "3859", text = "Literally, “having beheld in us much error and destruction.”" },
  { t = "note", id = "3860", text = "[C, S (apparently), and recent editors have ἕχοντας, “even when we had,” instead of ἕχοντες (A), as above paraphrased.—R.]" },
  { t = "note", id = "3861", text = "Comp. Hos. ii. 23; Rom. iv. 17, ix. 25." },
  { t = "note", id = "3862", text = "Literally, “willed us from not being to be.” [Comp. n. 4, p. 365.]" },
  { t = "h", text = "Chap. ii.—the church, formerly barren, is now fruitful." },
  { t = "p", text = "“Rejoice, thou barren that bearest not; break forth and cry, thou that travailest not; for she that is desolate hath many more children than she that hath an husband.”[^3863] In that He said, “Rejoice, thou barren that bearest not,” He referred to us, for our Church was barren before that children were given to her. But when He said, “Cry out, thou that travailest not,” He means this, that we should sincerely offer up our prayers to God, and should not, like women in travail, show signs of weakness.[^3864] And in that He said, “For she that is desolate hath many more children than she that hath an husband,” He means that[^3865] our people seemed to be outcast from God, but now, through believing, have become more numerous than those who are reckoned to possess God.[^3866] And another Scripture saith, “I came not to call the righteous, but sinners.”[^3867] This means that those who are perishing must be saved. For it is indeed a great and admirable thing to establish, not the things which are standing, but these that are falling. Thus also did Christ desire[^3868] to save the things which were perishing,[^3869] and has saved many by coming and calling us when hastening to destruction.[^3870]" },
  { t = "note", id = "3863", text = "Isa. liv. 1; Gal. iv. 27. [R. V., “the husband.”—R.]" },
  { t = "note", id = "3864", text = "Some render, “should not cry out, like women in travail.” The text is doubtful. [Lightfoot: “Let us not, like women in travail, grow weary of offering up our prayers with simplicity to God.”—R.]" },
  { t = "note", id = "3865", text = "[ἐπει, “since;” hence Lightfoot renders, “He so spake, because.”—R.]" },
  { t = "note", id = "3866", text = "It has been remarked that the writer here implies he was a Gentile." },
  { t = "note", id = "3867", text = "Matt. ix, 13; Luke v. 32. [The briefer form given above is that of the correct text in Matthew and Mark (ii. 17), not Luke.—R.]" },
  { t = "note", id = "3868", text = "[ἠθέλησε, “willed.”—R.] [Noteworthy. 2 Pet. iii. 9.]" },
  { t = "note", id = "3869", text = "Comp. Matt. xviii. 11. [Luke xix. 10.—R.]" },
  { t = "note", id = "3870", text = "Literally, “already perishing.” [Rev. iii. 2.]" },
  { t = "h", text = "Chap. iii.—the duty of confessing christ." },
  { t = "p", text = "Since, then, He has displayed so great mercy towards us, and especially in this respect, that we who are living should not offer sacrifices to gods that are dead, or pay them worship, but should attain through Him to the knowledge of the true Father,[^3871] whereby shall we show that we do indeed know Him,[^3872] but by not denying Him through whom this knowledge has been attained? For He Himself declares,[^3873] “Whosoever shall confess Me before men, him will I confess before My Father.”[^3874] This, then, is our reward if we shall confess Him by whom we have been saved. But in what way shall we confess Him? By doing what He says, and not transgressing His commandments, and by honouring Him not with our lips only, but with all our heart and all our mind.[^3875] For he says[^3876] in Isaiah, “This people honoureth Me with their lips, but their heart is far from Me.”[^3877]" },
  { t = "note", id = "3871", text = "[Literally, “the Father of the truth.” The best editions have a period here.—R.]" },
  { t = "note", id = "3872", text = "Literally, “what is the knowledge which is towards Him.” [C, with Bryennios. Hilgenfeld reads τη̑ς ἀληθείας, “what is the knowledge of the truth,” instead of ἡ πρὸς αὐτόν, A, S, Lightfoot, and earlier editors.—R.]" },
  { t = "note", id = "3873", text = "[λέγει δὲ καὶ αυτός, “Yea, He Himself saith,” Lightfoot.—R.]" },
  { t = "note", id = "3874", text = "Matt. x. 32." },
  { t = "note", id = "3875", text = "Comp. Matt. xxii. 37." },
  { t = "note", id = "3876", text = "[“Now He saith also.”—R.]" },
  { t = "note", id = "3877", text = "Isa. xxix. 13." },
  { t = "h", text = "Chap. iv.—true confession of christ." },
  { t = "p", text = "Let us, then, not only call Him Lord, for that will not save us. For He saith, “Not every one that saith to Me, Lord, Lord, shall be saved, but he that worketh righteousness.”[^3878] Wherefore, brethren, let us confess Him by[^3879] our works, by loving one another, by not committing adultery, or speaking evil of one another, or cherishing envy; but being continent, compassionate, and good. We ought also to sympathize with one another, and not be avaricious. By such[^3880] works let us confess Him,[^3881] and not by those that are of an opposite kind. And it is not fitting that we should fear men, but rather God. For this reason, if we should do such wicked things, the Lord hath said, “Even though ye were gathered together to Me[^3882] in My very bosom, yet if ye were not to keep My commandments, I would cast you off, and say unto you, Depart from Me; I know you not whence ye are, ye workers of iniquity.”[^3883]" },
  { t = "note", id = "3878", text = "Matt. vii. 21, loosely quoted." },
  { t = "note", id = "3879", text = "[Literally, “in.”—R.]" },
  { t = "note", id = "3880", text = "[A defect in A was thus supplied, but “these” is now accepted; so C, S.—R.]" },
  { t = "note", id = "3881", text = "Some read “God.” [“Him” is correct.—R.]" },
  { t = "note", id = "3882", text = "Or, “with Me.” [This is the more exact rendering of μετ' ἐμου̑.—R.]" },
  { t = "note", id = "3883", text = "The first part of this sentence is not found in Scripture; for the second, comp. Matt. vii. 23, Luke xiii. 27. [The first part is not even identified as a citation from an apocryphal book.—R.]" },
  { t = "h", text = "Chap. v.—this world should be despised." },
  { t = "p", text = "Wherefore, brethren, leaving willingly our sojourn in this present world, let us do the will of Him that called us, and not fear to depart out of this world. For the Lord saith, “Ye shall be as lambs in the midst of wolves.”[^3884] And Peter answered and said unto Him,[^3885] “What, then, if the wolves shall tear in pieces the lambs?” Jesus said unto Peter, “The lambs have no cause after they are dead to fear[^3886] the wolves; and in like manner, fear not ye them that kill you, and can do nothing more unto you; but fear Him who, after you are dead, has power over both soul and body to cast them into hell-fire.”[^3887] And consider,[^3888] brethren, that the sojourning in the flesh in this world is but brief and transient, but the promise of Christ is great and wonderful, even the rest of the kingdom to come, and of life everlasting.[^3889] By what course of conduct, then, shall we attain these things, but by leading a holy and righteous life, and by deeming these worldly things as not belonging to us, and not fixing our desires upon them? For if we desire to possess them, we fall away from the path of righteousness.[^3890]" },
  { t = "note", id = "3884", text = "Matt. x. 16." },
  { t = "note", id = "3885", text = "No such conversation is recorded in Scripture. [Comp. note 13.—R.]" },
  { t = "note", id = "3886", text = "Or, “Let not the lambs fear.”" },
  { t = "note", id = "3887", text = "Matt. x. 28; Luke xii. 4, 5." },
  { t = "note", id = "3888", text = "Or, “know.”" },
  { t = "note", id = "3889", text = "The text and translation are here doubtful. [All doubt has been removed; the above rendering is substantially correct.—R.]" },
  { t = "note", id = "3890", text = "[More exactly, “the righteous path,” τη̑ς ὁδοῦ τη̑ς δικαίας.—R.]" },
  { t = "h", text = "Chap. vi.—the present and future worlds are enemies to each other." },
  { t = "p", text = "Now the Lord declares, “No servant can serve two masters.”[^3891] If we desire, then, to Serve both God and mammon, it will be unprofitable for us. “For what will it profit if a man gain the whole world, and lose his own soul?”[^3892] This world and the next are two enemies. The one urges to[^3893] adultery and corruption, avarice and deceit; the other bids farewell to these things. We cannot therefore be the friends of both; and it behoves us, by renouncing the one, to make sure[^3894] of the other. Let us reckon[^3895] that it is better to hate the things present, since they are trifling, and transient, and corruptible; and to love those which are to come, as being good and incorruptible. For if we do the will of Christ, we shall find rest; otherwise, nothing shall deliver us from eternal punishment, if we disobey His commandments. For thus also saith the Scripture in Ezekiel, “If Noah, Job, and Daniel should rise up, they should not deliver their children in captivity.”[^3896] Now, if men so eminently righteous[^3897] are not able by their righteousness to deliver their children, how can we hope to[^3898] enter into the royal residence[^3899] of God unless we keep our baptism holy and undefiled? Or who shall be our advocate, unless we be found possessed of works of holiness and righteousness?[^3900]" },
  { t = "note", id = "3891", text = "Matt. vi. 24; Luke xvi. 13." },
  { t = "note", id = "3892", text = "Matt. xvi. 26. [The citation is not exactly according to any evangelist. Literally, “For what advantage is it, if any one gain the whole (Comits ‘whole’) world, but forfeit his life,” or “soul.”—R.]" },
  { t = "note", id = "3893", text = "Literally, “speaks of.” [So Lightfoot.—R]." },
  { t = "note", id = "3894", text = "Or, “enjoy.” [Lightfoot: “but must bid farewell to the one and hold companionship with the other;” thus preserving the correspondence with the preceding sentence.—R.]" },
  { t = "note", id = "3895", text = "The ms. has, “we reckon.” [So C and S, but Lightfoot retains the subjunctive.—R.]" },
  { t = "note", id = "3896", text = "Ezek. xiv. 14, 20." },
  { t = "note", id = "3897", text = "[Literally, “But if even such righteous men.”—R.]" },
  { t = "note", id = "3898", text = "Literally, “with what confidence shall we.”" },
  { t = "note", id = "3899", text = "Wake translates “kingdom,” as if the reading had been βασιλείαν; but the ms. has βασίλειον, “palace.” [Lightfoot gives the former rendering, though accepting βασίλειον.—R.]" },
  { t = "note", id = "3900", text = "[Literally, “holy and righteous works.”—R.]" },
  { t = "h", text = "Chap. vii.—we must strive in order to be crowned." },
  { t = "p", text = "Wherefore, then, my brethren, let us struggle[^3901] with all earnestness, knowing that the contest is in our case close at hand, and that many undertake long voyages to strive for a corruptible reward;[^3902] yet all are not crowned, but those only that have laboured hard and striven gloriously. Let us therefore so strive, that we may all be crowned. Let us run the straight[^3903] course, even the race that is incorruptible; and let us in great numbers set out[^3904] for it, and strive that we may be crowned. And should we not all be able to obtain the crown, let us at least come near to it. We must remember[^3905] that he who strives in the corruptible contest, if he be found acting unfairly,[^3906] is taken away and scourged, and cast forth from the lists. What then think ye? If one does anything unseemly in the incorruptible contest, what shall he have to bear? For of those who do not preserve the seal[^3907] unbroken, the Scripture saith,[^3908] “Their worm shall not die, and their fire shall not be quenched, and they shall be a spectacle to all flesh.”[^3909]" },
  { t = "note", id = "3901", text = "[ἀγωνισωμεθα, “let us strive,” as in the games.—R.]" },
  { t = "note", id = "3902", text = "Literally, “that many set sail for corruptible contests,” referring probably to the concourse at the Isthmian games." },
  { t = "note", id = "3903", text = "Or, “Let us place before us.” [The latter rendering is that of the reading found in A and C, and now accepted by many editors (θω̑μεν); but Lightfoot adheres to θέωμεν (so S), and holds the former reading to be a corruption.—R.]" },
  { t = "note", id = "3904", text = "Or, “set sail.”" },
  { t = "note", id = "3905", text = "Literally, “know.”" },
  { t = "note", id = "3906", text = "Literally “if he be found corrupting.”" },
  { t = "note", id = "3907", text = "Baptism is probably meant. [See Eph. i. 13 and Acts xix. 6.]" },
  { t = "note", id = "3908", text = "[Or, “He saith;” “unbroken” is not necessary.—R.]" },
  { t = "note", id = "3909", text = "Isa. lxvi. 24." },
  { t = "h", text = "Chap. viii.—the necessity of repentance while we are on earth." },
  { t = "p", text = "As long, therefore, as we are upon earth, let us practice repentance, for we are as clay in the hand of the artificer. For as the potter, if he make a vessel, and it be distorted or broken in his hands, fashions it over again; but if he have before this cast it into the furnace of fire, can no longer find any help for it: so let us also, while we are in this world, repent with our whole heart of the evil deeds we have done in the flesh, that we may be saved by the Lord, while we have yet an opportunity of repentance. For after we have gone out of the world, no further power of confessing or repenting will there belong to us. Wherefore, brethren, by doing the will of the Father, and keeping the flesh holy, and observing the commandments of the Lord, we shall obtain eternal life. For the Lord saith in the Gospel, “If ye have not kept that which was small, who will commit to you the great? For I say unto you, that he that is faithful in that which is least, is faithful also in much.”[^3910] This, then, is what He means: “Keep the flesh holy and the seal undefiled, that ye[^3911] may receive eternal life.”[^3912]" },
  { t = "note", id = "3910", text = "Comp. Luke xvi. 10–12." },
  { t = "note", id = "3911", text = "ms. has “we,” which is corrected by all editors as above. [The newly discovered authorities have the second person; most recent editors, however, adopt the first person, as *lectio difficilior*. So Lightfoot; but Hilgenfeld restores ἀπολάβητε in his second edition.—R.]" },
  { t = "note", id = "3912", text = "Some have thought this a quotation from an unknown apocryphal book, but it seems rather an explanation of the preceding words." },
  { t = "h", text = "Chap. ix.—we shall be judged in the flesh." },
  { t = "p", text = "And let no one of you say that this very flesh shall not be judged, nor rise again. Consider ye[^3913] in what state ye were saved, in what ye received sight,[^3914] if not while ye were in this flesh. We must therefore preserve the flesh as the temple of God. For as ye were called in the flesh, ye shall also come to be judged in the flesh. As Christ[^3915] the Lord who saved us, though He was first a Spirit,[^3916] became flesh, and thus called us, so shall we also receive the reward in this flesh. Let us therefore love one another, that we may all attain to the kingdom of God. While we have an opportunity of being healed, let us yield ourselves to God that healeth us, and give to Him a recompense. Of what sort? Repentance out of a sincere heart; for He knows all things beforehand, and is acquainted with what is in our hearts. Let us therefore give Him praise,[^3917] not with the mouth only, but also with the heart, that He may accept us as sons. For the Lord has said, “Those are My brethren who do the will of My Father.”[^3918]" },
  { t = "note", id = "3913", text = "[Editors differ as to the punctuation. Lightfoot: “Understand ye. In what were ye saved? In what did ye recover your sight? if ye were not in the flesh.” Hilgenfeld puts a comma after γνω̑τε (understand ye), and a period after ἐσώθητε (saved).—R.]" },
  { t = "note", id = "3914", text = "Literally, “looked up.” [Both senses of ἀναβλέπειν occur in New Testament.—R.]" },
  { t = "note", id = "3915", text = "The ms. has εἷς, “one,” which Wake follows, but it seems clearly a mistake for ὡς. [Lightfoot reads ει, with a Syriac fragment; both C and S have εἷς—R.]" },
  { t = "note", id = "3916", text = "[C has here the curious reading λόγος instead of πνευ̑μα, but all editors retain the latter.—R.]" },
  { t = "note", id = "3917", text = "[A reads “eternal,” and C, S, “praise;” Lightfoot and others combine the two, “eternal praise,”—R.]" },
  { t = "note", id = "3918", text = "Matt. xii. 50." },
  { t = "h", text = "Chap. x.—vice is to be forsaken, and virtue followed." },
  { t = "p", text = "Wherefore, my brethren, let us do the will of the Father who called us, that we may live; and let us earnestly[^3919] follow after virtue, but forsake every wicked tendency[^3920] which would lead into transgression; and flee from ungodliness, lest evils overtake us. For if we are diligent in doing good, peace will follow us. On this account, such men cannot find it, i.e., peace, as are[^3921] influenced by human terrors, and prefer rather present enjoyment to the promise which shall afterwards be fulfilled. For they know not what torment present enjoyment incurs, or what felicity is involved in the future promise. And if, indeed, they themselves only did such things, it would be the more tolerable; but now they persist in imbuing innocent souls with their pernicious doctrines,[^3922] not knowing that they shall receive a double condemnation, both they and those that hear them." },
  { t = "note", id = "3919", text = "Literally, “rather.”" },
  { t = "note", id = "3920", text = "Literally, “malice, as it were, the precursor of our sins.” Some deem the text corrupt." },
  { t = "note", id = "3921", text = "Literally, according to the ms., “it is not possible that a man should find it who are”—the passage being evidently corrupt. [The evidence of C and S does not clear up the difficulty here, the reading of these authorities being substantially that of A. Lightfoot renders: “For for this cause is a man unable to attain happiness, seeing that they call in the fears of men,” etc. Hilgenfeld (2d ed.) assumes here a considerable gap in all the authorities, and inserts two paragraphs, cited in other authors as from Clement. The first and longer passage is from John of Damascus, and it may be accounted for as a loose citation from chap. xx. in the recovered portion of this Epistle. The other is from pseudo-Justin (Questions to the Orthodox, 74) This was formerly assigned by both Hilgenfeld and Lightfoot (against Harnack) to the First Epistle of Clement, lviii., in that portion wanting in A. But the recovered chapters (lviii.-lxiii.) contain, according to C and S, no such passage. Lightfoot thinks the reference in pseudo-Justin is to chap. xvi. of this homily, and that the mention of the Sibyl in the same author is not necessarily part of the citation from Clement. Comp. Lightfoot, pp. 308, 447, 448, 458, 459, and Hilgenfeld, 2d ed., pp. xlviii., 77.—R.]" },
  { t = "note", id = "3922", text = "[Lightfoot, more literally, “but now they continue teaching evil to innocent souls.”—R.]" },
  { t = "h", text = "Chap. xi.—we ought to serve god, trusting in his promises." },
  { t = "p", text = "Let us therefore serve God with a pure heart, and we shall be righteous; but if we do not serve Him, because we believe not the promise of God, we shall be miserable. For the prophetic word also declares, “Wretched are those of a double mind, and who doubt in their heart, who say, All these things have we heard even in the times of our fathers; but though we have waited day by day, we have seen none of them accomplished. Ye fools! compare yourselves to a tree; take, for instance, the vine. First of all it sheds its leaves, then the bud appears; after that the sour grape, and then the fully-ripened fruit. So, likewise, my people have borne disturbances and afflictions, but afterwards shall they receive their good things.”[^3923] Wherefore, my brethren, let us not be of a double mind, but let us hope and endure, that we also may obtain the reward. For He is faithful who has promised that He will bestow on every one a reward according to his works. If, therefore, we shall do righteousness in the sight of God, we shall enter into His kingdom, and shall receive the promises, “which ear hath not heard, nor eye seen, neither have entered into the heart of man.”[^3924]" },
  { t = "note", id = "3923", text = "The same words occur in Clement’s first epistle, chap. xxiii." },
  { t = "note", id = "3924", text = "1 Cor. ii. 9." },
  { t = "h", text = "Chap. xii.—we are constantly to look for the kingdom of god." },
  { t = "p", text = "Let us expect, therefore, hour by hour, the kingdom of God in love and righteousness, since we know not the day of the appearing of God. For the Lord Himself, being asked by one when His kingdom would come, replied, “When two shall be one, and that which is without as that which is within, and the male with the female, neither male nor female.”[^3925] Now, two are one when we speak the truth one to another, and there is unfeignedly one soul in two bodies. And “that which is without as that which is within” meaneth this: He calls the soul “that which is within,” and the body “that which is without.” As, then, thy body is visible to sight, so also let thy soul be manifest by good works. And “the male with the female, neither male nor female,” this[^3926] …" },
  { t = "note", id = "3925", text = "These words are quoted (Clem. Alex., Strom., iii. 9, 13) from the Gospel according to the Egyptians, no longer extant." },
  { t = "note", id = "3926", text = "Thus ends the ms., but what followed will be found in Clem. Alex. as just cited." },
  { t = "p", text = "[The newly recovered portion follows: ][^3927]—" },
  { t = "note", id = "3927", text = "For details respecting the version here given, see Introductory Notice, pp. 514, 515." },
  { t = "p", text = "… meaneth,[^3928] that a brother seeing a sister should think nothing[^3929] about her as of a female, nor she[^3930] think anything about him as of a male. If ye do these things, saith He,[^3931] the kingdom of my Father shall come." },
  { t = "note", id = "3928", text = "Or, more correctly, both here and above, “by this He meaneth.”" },
  { t = "note", id = "3929", text = "All editors read οὐδὲν φρονη̑, but C has φρονει̑ which is ungrammatical. In this clause, after ἵνα we would expect μηδέν; but as Lightfoot suggests, οὐδὲν may be combined as a substantive idea with θηλυκόν; comp. the use of οὐ with participles." },
  { t = "note", id = "3930", text = "For μηδέ (so C) Gebhardt would substitute μηδ' ἥδε, while S supplies in full, *quum soror videbit fratrem*, an obvious interpretament." },
  { t = "note", id = "3931", text = "This seems to be an explanation of the saying above referred to, and not a citation; similar cases occur in the homily." },
  { t = "h", text = "Chap. xiii.—disobedience causeth god’s name to be blasphemed.[^3932]" },
  { t = "note", id = "3932", text = "The headings to the chapters have been supplied by the editor, but in so rambling a discourse they are in some cases necessarily unsatisfactory." },
  { t = "p", text = "Therefore, brethren,[^3933] let us now at length repent; let us be sober unto what is good; for we are full of much folly and wickedness. Let us blot out from us our former sins, and repenting from the soul let us be saved; and let us not become[^3934] men-pleasers, nor let us desire to please only one another,[^3935] but also the men that are without, by our righteousness, that the Name[^3936] be not blasphemed on account of us.[^3937] For the Lord also saith “Continually[^3938] My name is blasphemed among all the Gentiles,”[^3939] and again, “Woe[^3940] to him on account of whom My name is blasphemed.” Wherein is it blasphemed? In your not doing what I desire.[^3941] For the Gentiles, when they hear from our mouth the oracles of God,[^3942] marvel at them as beautiful and great; afterwards, when they have learned that our works are not worthy of the words we speak, they then turn themselves to blasphemy, saying that it is some fable and delusion. For when they hear from us that God saith,[^3943] “There is no thank unto you, if ye love them that love you; but there is thank unto you, if ye love your enemies and them that hate you;”[^3944] when they hear these things, they marvel at the excellency of the goodness; but when they see that we not only do not love them that hate us, but not even them that love us, they laugh us to scorn, and the Name is blasphemed." },
  { t = "note", id = "3933", text = "Hilgenfeld reads μου instead of οὗν; so S apparently. The chapters are usually introduced with οὗν (nine times) or ὤστε (five times)." },
  { t = "note", id = "3934", text = "γινώμεθα; Lightfoot, “be found.”" },
  { t = "note", id = "3935", text = "Literally, “ourselves,” ἑαυτοι̑ς; but the reciprocal sense is common in Hellenistic Greek, and is here required by the context." },
  { t = "note", id = "3936", text = "Comp. Acts v. 41, where the correct text omits αὺτου̑. The Revised Version properly capitalizes “Name” in that passage." },
  { t = "note", id = "3937", text = "C here, and in many other cases, reads ὑμα̑ς; comparison of mss. shows that it is a correction of the scribe." },
  { t = "note", id = "3938", text = "Lightfoot renders διὰ παντός, “every way;” but the temporal sense is common in Hellenistic Greek, and here required by the Hebrew." },
  { t = "note", id = "3939", text = "Isa. lii. 5, with πασι̑ν inserted." },
  { t = "note", id = "3940", text = "Lightfoot reads, καὶ πάλιν Οὐαί, following the Syriac. C has καὶ Διό. There is difficulty in identifying this second quotation: comp. Ezek. xxxvi. 20–23. Lightfoot thinks it probable that the preacher used two different forms of Isa. lii. 5." },
  { t = "note", id = "3941", text = "This sentence is not part of the citation, but an explanation, the words being used as if spoken by God. The Syriac text seeks to avoid this difficulty by reading, “by our not doing what we say.”" },
  { t = "note", id = "3942", text = "Here τὰ λόγια του̑ Θεου̑ is used of the Scriptures, and with distinct reference to the New Testament; see next note." },
  { t = "note", id = "3943", text = "In view of the connection, this must mean “God in His oracles;” a significant testimony to the early belief in the inspiration of the Gospels." },
  { t = "note", id = "3944", text = "Luke vi. 27, 32, freely combined; comp. Matt. v. 44, 46. The use of χάρις υἠμιν shows that the quotation is from the former Gospel." },
  { t = "h", text = "Chap. xiv.—the living church is the body of christ." },
  { t = "p", text = "Wherefore,[^3945] brethren, if we do the will of God our father, we shall be of the first Church, that is, spiritual, that hath been created before the sun and moon;[^3946] but if we do not the will of the Lord, we shall be of the scripture that saith, “My house was made a den of robbers.”[^3947] So then let us choose to be of the Church of life,[^3948] that we may be saved. I do not, however, suppose ye are ignorant that the living Church is the body of Christ;[^3949] for the scripture saith, “God made man, male and female.”[^3950] the male is Christ, the female is the Church. And the Books[^3951] and the Apostles plainly declare[^3952] that the Church is not of the present, but from the beginning.[^3953] For she was spiritual, as our Jesus also was, but was manifested in the last days that He[^3954] might save us. Now the Church, being spiritual, was manifested in the flesh of Christ, thus signifying to us that, if any of us keep[^3955] her in the flesh and do not corrupt her, he shall receive her again[^3956] in the Holy Spirit: for this flesh is the copy of the spirit. No one then who corrupts the copy, shall partake of the original.[^3957] This then is what He meaneth, “Keep the flesh,[^3958] that ye may partake of the spirit.” But if we say that the flesh is the church and the spirit Christ,[^3959] then he that hath shamefully used the flesh hath shamefully used the Church. Such a one then shall not partake of the spirit, which is Christ. Such life and incorruption this flesh[^3960] can partake of, when the Holy Spirit is joined to it. No one can utter or speak “what the lord hath prepared” for his elect.[^3961]" },
  { t = "note", id = "3945", text = "ὤστε, as at the beginning of chs. vii., x." },
  { t = "note", id = "3946", text = "Comp. Ps. lxxii. (LXX. lxxi.) 5, 17." },
  { t = "note", id = "3947", text = "Jer. vii. 11. Comp. Matt. xii. 13; Mark xi. 17; Luke xix. 46." },
  { t = "note", id = "3948", text = "Harnack says, “The Jewish synagogue is the church of death.” Lightfoot, more correctly, accepts a contrast “between mere external membership in the visible body and spiritual communion in the celestial counterpart.”" },
  { t = "note", id = "3949", text = "Comp. Eph. i. 23 and many similar passages." },
  { t = "note", id = "3950", text = "Gen. i. 27; comp. Eph. v. 31-33." },
  { t = "note", id = "3951", text = "The reference is here is probably to the Old-Testament “books,” while the term “Apostles” may mean the New Testament in whole or part. The more direct reference probably is to Genesis and Ephesians." },
  { t = "note", id = "3952", text = "Lightfoot inserts in brackets λέγουσιν, δῆλον, rendering as above. Hilgenfield suggests φασὶν οἴδατε, “Ye know that the books, etc., say that.” Byrennios joins this sentence to the preceding, taking the whole as dependent on ἀγνοεῖν. Ropes renders accordingly, making a parenthesis from “for the Scripture” to “the Church.” In any case a verb of saying must be supplied, as in the Syriac." },
  { t = "note", id = "3953", text = "ἄνωθεν has a local and a temporal sense; the latter is obviously preferable here." },
  { t = "note", id = "3954", text = "“Jesus” is the subject of the latter part of the sentence." },
  { t = "note", id = "3955", text = "“Keep her pure;” comp. chap. viii. Lightfoot renders τηρεῖν, “guard,” here and elsewhere." },
  { t = "note", id = "3956", text = "The verb corresponds with that rendered “partake” in what follows." },
  { t = "note", id = "3957", text = "“Copy,” ἀντίτυπος, ἀντίτυπον. Comp. Heb. ix. 24; 1 Pet. iii. 21. Our use of “antitype” is different. The antithesis here is αὐθεντικόν, the original, or archetype. This mystical interpretation has a Platonic basis." },
  { t = "note", id = "3958", text = "Comp. the close of chap. viii." },
  { t = "note", id = "3959", text = "Lightfoot calls attention to the confusion of metaphors; but there is also evidence of that false exegesis which made “flesh” and “spirit” equivalent to “body” and “soul,”—an error which always leads to further mistakes." },
  { t = "note", id = "3960", text = "Here the word “flesh” is used in an ambiguous sense." },
  { t = "note", id = "3961", text = "1 Cor. ii. 9." },
  { t = "h", text = "Chap. xv.—faith and love the proper return to god." },
  { t = "p", text = "Now I do not think I have given you any light counsel concerning self-control,[^3962] which if any one do he will not repent of it, but will save both himself and me who counselled him. For it is no light reward to turn again a wandering and perishing soul that it may be saved.[^3963] For this is the recompense[^3964] we have to return to God who created us, if he that speaketh and heareth both speaketh and heareth with faith and love. Let us therefore abide in the things which we believed, righteous and holy, that with boldness we may ask of God who saith, “While thou art yet speaking, I will say, Lo, I am here.”[^3965] For this saying is the sign of a great promise; for the Lord saith of Himself that He is more ready to give than he that asketh to ask.[^3967] Being therefore partakers of so great kindness, let us not be envious of one another[^3968] in the obtaining of so many good things. For as great as is the pleasure which these sayings have for them that have done them, so great is the condemnation they have for them that have been disobedient." },
  { t = "note", id = "3962", text = "περὶ ἐγκρατείας, “temperance” in the wide New-Testament sense. Lightfoot, “continence;” in these days the prominent danger was from libidinous sins." },
  { t = "note", id = "3963", text = "Comp. Jas. v. 19, 20, with which our passage has many verbal correspondences." },
  { t = "note", id = "3964", text = "“A favorite word with our author, especially in this connection.”—Lightfoot." },
  { t = "note", id = "3965", text = "Isa. lviii. 9, LXX." },
  { t = "note", id = "3967", text = "είς τὸ διδόναι του̑ αίτου̑ντος; the sense of the elliptical construction is obviously as above." },
  { t = "note", id = "3968", text = "ἑαυτοι̑ς. Here again in the reciprocal sense; comp. chap. xiii." },
  { t = "h", text = "Chap. xvi.—the excellence of almsgiving." },
  { t = "p", text = "Wherefore, brethren, having received no small occasion[^3969] for repentance, while we have the opportunity,[^3971] let us turn unto God that called us, while we still have Him as One that receiveth us. For if we renounce[^3972] these enjoyments and conquer our soul in not doing these its evil desires, we shall partake of the mercy of Jesus. But ye know that the day of judgment even now “cometh as a burning oven,”[^3974] and some “of the heavens shall melt,” and all the earth shall be as lead melting on the fire,[^3976] and then the hidden and open works of men shall appear. Almsgiving therefore is a good thing, as repentance from sin; fasting is better than prayer, but almsgiving than both;[^3978] “but love covereth a multitude of sins.”[^3980] But prayer out of a good conscience delivereth from death. Blessed is every one that is found full of these; for alms-giving lighteneth the burden of sin.[^3982]" },
  { t = "note", id = "3969", text = "ἀφορμὴν λαβόντες, as in Rom. vii. 8, 11." },
  { t = "note", id = "3971", text = "καιρὸν ἔχοντες, “seeing that we have time” (Lightfoot). But “opportunity” is more exact." },
  { t = "note", id = "3972", text = "ἀποταξώμεθα, “bid farewell to;” comp. chap. vi." },
  { t = "note", id = "3974", text = "Comp. Mal. iv. 1." },
  { t = "note", id = "3976", text = "Comp. Isa. xxxiv. 4, which resembles the former clause, and 2 Pet. iii. 7, 10, where the same figures occur. The text seems to be corrupt: τινες (“some”) is sustained by both the Greek and the Syriac, but this limitation is so peculiar as to awaken suspicion; still, the notion of several heavens might have been in the author’s mind." },
  { t = "note", id = "3978", text = "Comp. Tobit xii. 8, 9; but the position given to almsgiving seems to be contradicted by the next sentence. Lightfoot seems to suspect a corruption of text here also, but in the early Church there was often an undue emphasis placed upon almsgiving." },
  { t = "note", id = "3980", text = "1 Pet. iv. 8. Comp. Prov. x. 12; Jas. v. 20." },
  { t = "note", id = "3982", text = "Literally, “becometh a lightener (κούφισμα) of sin;” comp. Ecclus. iii. 30." },
  { t = "h", text = "Chap. xvii.—the danger of impenitence." },
  { t = "p", text = "Let us therefore repent from the whole heart, that no one of us perish by the way. For if we have commandments that we should also practice this,[^3983] to draw away men from idols and instruct them, how much more ought a soul already knowing God not to perish! Let us therefore assist one another that we may also lead up those weak as to what is good,[^3984] in order that all may be saved; and let us convert and admonish one another.[^3985]And let us not think to give heed and believe now only, while we are admonished by the presbyters, but also when we have returned home,[^3987]remembering the commandments[^3989] of the Lord; and let us not be dragged away by worldly lusts, but coming[^3990] more frequently let us attempt to make advances in the commandments of the Lord, that all being of the same mind[^3991] we may be gathered together unto life. For the Lord said, “I come to gather together all the nations, tribes, and tongues.”[^3992] This He speaketh of the day of His appearing, when He shall come and redeem us, each one according to his works.[^3993] And the unbelievers “shall see His glory,” and strength; and they shall think it strange when they see the sovereignty[^3994] of the world in Jesus, saying, Woe unto us, Thou wast He,[^3995] and we did not know and did not believe, and we did not obey the presbyters when they declared unto us concerning our salvation. And “their worm dieth not, and their fire is not quenched, and they shall be for a spectacle unto all flesh.”[^3996] He speaketh of that day of judgment, when they shall see those among us[^3997] that have been ungodly and acted deceitfully with the commandments of Jesus Christ. But the righteous who have done well and endured torments and hated the enjoyments of the soul, when they shall behold those that have gone astray and denied Jesus through their words or through their works, how that they are punished with grievous torments in unquenchable fire, shall be giving glory to God, saying, There will be hope for him that hath served God with his whole heart." },
  { t = "note", id = "3983", text = "Lightfoot, with Syriac, reads ἵνα καὶ του̑το πράσσωμεν. Comits ἵνα, and reads πράσσομεν, “If we have commandments and practise this.”" },
  { t = "note", id = "3984", text = "Here Lightfoot thinks a verb has probably fallen out of the text." },
  { t = "note", id = "3985", text = "Bryennios thus connects: “in order that all may be saved, and may convert,” etc." },
  { t = "note", id = "3987", text = "“This clearly shows that the work before us is a sermon delivered in church” (Lightfoot). The preacher is himself one of “the presbyters;” comp. chap. xix. It is possible, but cannot be proven, that he was the head of the presbyters, the parochial bishop." },
  { t = "note", id = "3989", text = "ἐνταλμάτων, not the technical word for the commandments of the Decalogue (ἐντολαι)." },
  { t = "note", id = "3990", text = "Syriac, “praying,” which Lightfoot thinks may be correct; but προσερχόμενοι might very easily be mistaken for προσευχόμενοι. The former means coming in worship: comp. Heb. x. 1, 22." },
  { t = "note", id = "3991", text = "2 Cor. xiii. 11; Phil. ii. 2." },
  { t = "note", id = "3992", text = "Isa. lxvi. 18. But “tribes” is inserted; comp. Dan. iii. 7. The phrase “shall see His glory” is from the passage in Isaiah, The language seems to be put into the mouth of Christ by the preacher." },
  { t = "note", id = "3993", text = "This implies various degrees of reward among these redeemed." },
  { t = "note", id = "3994", text = "τὸ βασίλειον; not exactly “the kingdom,” rather “the kingly rule.” ἐν τῷ 'Ιησου̑ is rightly explained by Lightfoot, “in the hands, in the power, of Jesus;” ξενισθήσονται is rendered above “shall think it strange,” as in 1 Pet. iv. 4, 12." },
  { t = "note", id = "3995", text = "“He” is properly supplied as frequently in the Gospels. There seems to be a reminiscence of John viii. 24 and similar passages." },
  { t = "note", id = "3996", text = "Isa. lxvi. 24; comp. chap. vii. above." },
  { t = "note", id = "3997", text = "C reads ὑμιν, as often, for ἡμι̑ν, Syriac, accepted by all editors." },
  { t = "h", text = "Chap. xviii.—the preacher confesseth his own sinfulness." },
  { t = "p", text = "Let us also become of the number of them that give thanks, that have served God, and not of the ungodly that are judged. For I myself also, being an utter sinner,[^3999] and not yet escaped from temptation, but still being in the midst of the engines[^4000] of the devil, give diligence to follow after righteousness, that I may have strength to come even near it,[^4001] fearing the judgment to come." },
  { t = "note", id = "3999", text = "πανθαμαρτολός; occurring only here; but a similar word, παρθαμάρτητος, occurs in the Teaching, v. 2, Apostolical Constitutions, vii. 18, and Barnabas, xx." },
  { t = "note", id = "4000", text = "τοι̑ς ὀργάνοις; comp. Ignat., Rom., iv., Ante-Nicene Fathers, i. p. 75, where the word is rendered “instruments,” and applied to the teeth of the wild beasts in the amphitheatre. Here Lightfoot renders “engines,” regarding the metaphor as military." },
  { t = "note", id = "4001", text = "The phrase κἂν ἑγγὺς αυἠτη̑ς implies a doubt of attaining the aim, in accord with the tone of humility which obtains in this chapter." },
  { t = "h", text = "Chap. xix.—he justifieth his exhortation." },
  { t = "p", text = "Wherefore, brethren and sisters,[^4002] after the God of truth hath been heard,[^4003] I read to you an entreaty[^4004] that ye may give heed to the things that are written, in order that ye may save both yourselves and him that readeth among you. For as a reward I ask of you that ye repent with the whole heart, thus giving to yourselves salvation and life. For by doing this we shall set a goal[^4005] for all the young who are minded to labour[^4006] on behalf of piety and the goodness of God. And let us not, unwise ones that we are, be affronted and sore displeased, whenever some one admonisheth and turneth us from iniquity unto righteousness. For sometimes while we are practising evil things we do not perceive it on account of the double-mindedness and unbelief that is in our breasts, and we are “darkened in our understanding”[^4007] by our vain lusts. Let us then practice righteousness that we may be saved unto the end. Blessed are they that obey these ordinances. Even if for a little time they suffer evil in the world,[^4008] they shall enjoy the immortal fruit of the resurrection. Let not then the godly man be grieved, if he be wretched in the times that now are; a blessed time waits for him. He, living again above with the fathers, shall be joyful for an eternity without grief." },
  { t = "note", id = "4002", text = "Comp. the opening sentence of Barnabas, “Sons and daughters,” Ante-Nicene Fathers, i. p. 137; see also chap. xx." },
  { t = "note", id = "4003", text = "If any doubt remained as to the character of this writing, it would be removed by this sentence. The passage is elliptical, μετὰ τὸν θεὸν τῆς ἀλνθείας, but there is no doubt as to the meaning. The Scripture was read, and listening to it was regarded as hearing the voice of God, whose words of truth were read. Then followed the sermon or exhortation; comp. Justin, First Apology, chap. lxvii. (vol. i. p. 186). That lessons from some at least of the New Testament were included at the date of this homily, seems quite certain; comp. the references to the New Testament in chaps. ii., iii., iv., and elsewhere. It is here implied that this homily was written and “read.”" },
  { t = "note", id = "4004", text = "The word ἒντευζις, here used, means intercession, or supplication, to God (comp. 1 Tim. ii. 1, iv. 5) in early Christian literature: but the classical sense is “entreaty:” so in the opening sentence of Justin, First Apology (vol. i. p. 163, where it is rendered “petition”)." },
  { t = "note", id = "4005", text = "Lightfoot, with Syriac and most editors, reads σκοπόν; but C has κόπον, so Bryennios." },
  { t = "note", id = "4006", text = "C had originally φιλοσοφει̑ν (accepted by Hilgenfeld), but was corrected to φιλοπονει̑ν. The latter is confirmed by the Syriac, and now generally accepted, though Hilgenfeld uses the other reading to support his view that Clement of Alexandria was the author." },
  { t = "note", id = "4007", text = "Eph. iv. 18." },
  { t = "note", id = "4008", text = "C inserts τούτω; so Bryennios, Hilgenfeld, and others. Lightfoot omits, with Syriac. The punctuation above given is that of Bryennios and Lightfoot. Hilgenfeld joins this clause with what precedes." },
  { t = "h", text = "Chap. xx.—concluding word of consolation. doxology." },
  { t = "p", text = "But neither let it trouble your understanding, that we see the unrighteous having riches and the servants of God straitened. Let us therefore, brethren and sisters, be believing: we are striving in the contest[^4009] of the living God, we are exercised by the present life, in order that we may be crowned by that to come. No one of the righteous received fruit speedily, but awaiteth it. For if God gave shortly the recompense of the righteous, straightway we would be exercising ourselves in business, not in godliness; for we would seem to be righteous, while pursuing not what is godly but what is gainful. And on this account Divine judgment surprised a spirit that was not righteous, and loaded it with chains.[^4010]" },
  { t = "note", id = "4009", text = "πει̑ραν ἀθλου̑μεν; the construction is classical, and the figure common in all Greek literature." },
  { t = "note", id = "4010", text = "The verbs here are aorists, and have been rendered by the English past tense; the present participle (μὴ ὂν δίκαιον) describing the character of the “spirit” must, according to English usage, conform to the main verbs. Lightfoot says, “The aorist here has its common gnomic sense;” and he therefore interprets the passage as a general statement: “Sordid motives bring their own punishment in a judicial blindness.” But this gnomic sense of the aorist is not common. C reads δεσμός, which yields this sense: “and a chain weighed upon him.” Hilgenfeld refers the passage to those Christians who suffered persecution for other causes than those of righteousness. Harnack thinks the author has in mind Satan, as the prince of avarice, and regards him as already loaded with chains. If the aorist is taken in its usual sense, this is the preferable explanation; but the meaning is obscure." },
  { t = "p", text = "To the only God invisible,[^4011] the Father of truth, who sent forth to us the Saviour and Prince of incorruption,[^4012] through whom also He manifested to us the truth and the heavenly life, to Him be the glory for ever and ever. Amen.[^4013]" },
  { t = "note", id = "4011", text = "1 Tim. i. 17." },
  { t = "note", id = "4012", text = "Acts iii. 15, v. 31; comp. Heb. ii. 10." },
  { t = "note", id = "4013", text = "The doxology is interesting, as indicating the early custom of thus closing a homily. The practice, fitting in itself, naturally followed the examples in the Epistles." },
]

[[section]]
id = "epistle-to-polycarp-shorter-and-longer-versions"
title = "Epistle to Polycarp: Shorter and Longer Versions"
level = 1
blocks = [
  { t = "p", text = "*Ignatius, who is also called Theophorus, to Polycarp, Bishop of the Church of the Smyrnæans, or rather, who has, as his own bishop, God the Father, and the Lord Jesus Christ: [wishes] abundance of happiness.*" },
  { t = "p", text = "*Ignatius, bishop of Antioch, and a witness for Jesus Christ, to Polycarp, Bishop of the Church of the Smyrnæans, or rather, who has, as his own bishop, God the Father, and Jesus Christ: [wishes] abundance of happiness.*" },
]

[[section]]
id = "chapter-1"
title = "Chapter I.—Commendation and exhortation."
level = 1
blocks = [
  { t = "p", text = "Having obtained good proof that thy mind is fixed in God as upon an immoveable rock, I loudly glorify [His name] that I have been thought worthy [to behold] thy blameless face,[^1063] which may I ever enjoy in God! I entreat thee, by the grace with which thou art clothed, to press forward in thy course, and to exhort all that they may be saved. Maintain thy position with all care, both in the flesh and spirit. Have a regard to preserve unity, than which nothing is better. Bear with all, even as the Lord does with thee. Support[^1064] all in love, as also thou doest. Give thyself to prayer without ceasing.[^1065] Implore additional understanding to what thou already hast. Be watchful, possessing a sleepless spirit. Speak to every man separately, as God enables thee.[^1066] Bear the infirmities of all, as being a perfect athlete [in the Christian life]: where the labour is great, the gain is all the more." },
  { t = "note", id = "1063", text = "i.e., to make personal acquaintance with one esteemed so highly." },
  { t = "note", id = "1064", text = "Or, “tolerate.”" },
  { t = "note", id = "1065", text = "Comp. 1 Thess. v. 17." },
  { t = "note", id = "1066", text = "Some read, “according to thy practice.”" },
  { t = "p", text = "Having obtained good proof that thy mind is fixed in God as upon an immoveable rock, I loudly glorify [His name] that I have been thought worthy to behold thy blameless face,[^1067] which may I ever enjoy in God! I entreat thee, by the grace with which thou art clothed, to press forward in thy course, and to exhort all that they may be saved. Maintain thy position with all care, both in the flesh and spirit. Have a regard to preserve unity, than which nothing is better. Bear with all even as the Lord does with thee. Support[^1068] all in love, as also thou doest. Give thyself to prayer without ceasing.[^1069] Implore additional understanding to what thou already hast. Be watchful, possessing a sleepless spirit. Speak to every man separately, as God enables thee.[^1070] Bear the infirmities of all, as being a perfect athlete [in the Christian life], even as does the Lord of all. For says [the Scripture], “He Himself took our infirmities, and bare our sicknesses.”[^1071] Where the labour is great, the gain is all the more." },
  { t = "note", id = "1067", text = "i.e., to make personal acquaintance with one esteemed so highly." },
  { t = "note", id = "1068", text = "Or, “tolerate.”" },
  { t = "note", id = "1069", text = "Comp. 1 Thess. v. 17." },
  { t = "note", id = "1070", text = "Some read, “according to thy practice.”" },
  { t = "note", id = "1071", text = "Matt. viii. 17." },
]

[[section]]
id = "chapter-2"
title = "Chapter II.—Exhortations."
level = 1
blocks = [
  { t = "p", text = "If thou lovest the good disciples, no thanks are due to thee on that account; but rather seek by meekness to subdue the more troublesome. Every kind of wound is not healed with the same plaster. Mitigate violent attacks [of disease] by gentle applications.[^1072] Be in all things “wise as a serpent, and harmless as a dove.”[^1073] For this purpose thou art composed of both flesh and spirit, that thou mayest deal tenderly[^1074] with those [evils] that present themselves visibly before thee. And as respects those that are not seen,[^1075] pray that [God] would reveal them unto thee, in order that thou mayest be wanting in nothing, but mayest abound in every gift. The times call for thee, as pilots do for the winds, and as one tossed with tempest seeks for the haven, so that both thou [and those under thy care] may attain to God. Be sober as an athlete of God: the prize set before thee is immortality and eternal life, of which thou art also persuaded. In all things may my soul be for thine,[^1076] and my bonds also, which thou hast loved." },
  { t = "note", id = "1072", text = "Literally, “paroxysms by embrocations.”" },
  { t = "note", id = "1073", text = "Matt. x. 16." },
  { t = "note", id = "1074", text = "Literally, “flatter.”" },
  { t = "note", id = "1075", text = "Some refer this to the mysteries of God and others to things yet future." },
  { t = "note", id = "1076", text = "Comp. Epistle of Ignatius to the Ephesians, chap. xxi., etc." },
  { t = "p", text = "If thou lovest the good disciples, no thanks are due to thee on that account; but rather seek by meekness to subdue the more troublesome. Every kind of wound is not healed with the same plaster. Mitigate violent attacks [of disease] by gentle applications.[^1077] Be in all things “wise as a serpent, and harmless always as a dove.”[^1078] For this purpose thou art composed of both soul and body, art both fleshly and spiritual, that thou mayest correct those [evils] that present themselves visibly before thee; and as respects those that are not seen, mayest pray that these should be revealed to thee, so that thou mayest be wanting in nothing, but mayest abound in every gift. The times call upon thee to pray. For as the wind aids the pilot of a ship, and as havens are advantageous for safety to a tempest-tossed vessel, so is also prayer to thee, in order that thou mayest attain to God. Be sober as an athlete of God, whose will is immortality and eternal life; of which thou art also persuaded. In all things may my soul be for thine,[^1079] and my bonds also, which thou hast loved." },
  { t = "note", id = "1077", text = "Literally, “paroxysms by embrocations.”" },
  { t = "note", id = "1078", text = "Matt. x. 16." },
  { t = "note", id = "1079", text = "Comp. Epistle of Ignatius to the Ephesians, chap. xxi., etc." },
]

[[section]]
id = "chapter-3"
title = "Chapter III.—Exhortations."
level = 1
blocks = [
  { t = "p", text = "Let not those who seem worthy of credit, but teach strange doctrines,[^1080] fill thee with apprehension. Stand firm, as does an anvil which is beaten. It is the part of a noble[^1081] athlete to be wounded, and yet to conquer. And especially, we ought to bear all things for the sake of God, that He also may bear with us. Be ever becoming more zealous than what thou art. Weigh carefully the times. Look for Him who is above all time, eternal and invisible, yet who became visible for our sakes; impalpable and impassible, yet who became passible on our account; and who in every kind of way suffered for our sakes." },
  { t = "note", id = "1080", text = "Comp. 1 Tim. i. 3, 1 Tim. vi. 3." },
  { t = "note", id = "1081", text = "Literally, “great.”" },
  { t = "p", text = "Let not those who seem worthy of credit, but teach strange doctrines,[^1082] fill thee with apprehension. Stand firm, as does an anvil which is beaten. It is the part of a noble[^1083] athlete to be wounded, and yet to conquer. And especially we ought to bear all things for the sake of God, that He also may bear with us, and bring us into His kingdom. Add more and more to thy diligence; run thy race with increasing energy; weigh carefully the times. Whilst thou art here, be a conqueror; for here is the course, and there are the crowns. Look for Christ, the Son of God; who was before time, yet appeared in time; who was invisible by nature, yet visible in the flesh; who was impalpable, and could not be touched, as being without a body, but for our sakes became such, might be touched and handled in the body; who was impassible as God, but became passible for our sakes as man; and who in every kind of way suffered for our sakes." },
  { t = "note", id = "1082", text = "Comp. 1 Tim. i. 3, 1 Tim. vi. 3." },
  { t = "note", id = "1083", text = "Literally, “great.”" },
]

[[section]]
id = "chapter-4"
title = "Chapter IV.—Exhortations."
level = 1
blocks = [
  { t = "p", text = "Let not widows be neglected. Be thou, after the Lord, their protector[^1084] and friend. Let nothing be done without thy consent; neither do thou anything without the approval of God, which indeed thou dost not, inasmuch as thou art stedfast. Let your assembling together be of frequent[^1085] occurrence: seek after all by name.[^1086] Do not despise either male or female slaves, yet neither let them be puffed up with conceit, but rather let them submit themselves[^1087] the more, for the glory of God, that they may obtain from God a better liberty. Let them not long to be set free [from slavery] at the public expense, that they be not found slaves to their own desires." },
  { t = "note", id = "1084", text = "The word in the original (φροντιστής) denotes one who *thinks* or *cares* for another." },
  { t = "note", id = "1085", text = "Some refer the words to more *frequent* meetings, and others to these meetings being more numerous; no comparison is necessarily implied." },
  { t = "note", id = "1086", text = "i.e., so as to bring them out to the public assembly." },
  { t = "note", id = "1087", text = "Or, “act the part of slaves.”" },
  { t = "p", text = "Let not the widows be neglected. Be thou, after the Lord, their protector and friend. Let nothing be done without thy consent; neither do thou anything without the approval of God, which indeed thou doest not. Be thou stedfast. Let your assembling together be of frequent[^1088] occurrence: seek after all by name.[^1089] Do not despise either male or female slaves, yet neither let them be puffed up with conceit, but rather let them submit themselves[^1090] the more, for the glory of God, that they may obtain from God a better liberty. Let them not wish to be set free [from slavery] at the public expense, that they be not found slaves to their own desires." },
  { t = "note", id = "1088", text = "Some refer the words to more *frequent* meetings, and others to these meetings being more numerous; no comparison is necessarily implied." },
  { t = "note", id = "1089", text = "i.e., so as to bring them out to the public assembly." },
  { t = "note", id = "1090", text = "Or, “act the part of slaves.”" },
]

[[section]]
id = "chapter-5"
title = "Chapter V.—The duties of husbands and wives."
level = 1
blocks = [
  { t = "p", text = "Flee evil arts; but all the more discourse in public regarding them.[^1091] Speak to my sisters, that they love the Lord, and be satisfied with their husbands both in the flesh and spirit. In like manner also, exhort my brethren, in the name of Jesus Christ, that they love their wives, even as the Lord the Church.[^1092] If any one can continue in a state of purity,[^1093] to the honour of Him who is Lord of the flesh,[^1094] let him so remain without boasting. If he begins to boast, he is undone; and if he reckon himself greater than the bishop, he is ruined. But it becomes both men and women who marry, to form their union with the approval of the bishop, that their marriage may be according to God, and not after their own lust. Let all things be done to the honour of God.[^1095]" },
  { t = "note", id = "1091", text = "Some insert μή, and render, “rather do not even speak of them.”" },
  { t = "note", id = "1092", text = "Eph. v. 25." },
  { t = "note", id = "1093", text = "i.e., in celibacy." },
  { t = "note", id = "1094", text = "Some render, “to the honour of the flesh of the Lord,” as in the longer recension." },
  { t = "note", id = "1095", text = "Comp. 1 Cor. x. 31." },
  { t = "p", text = "Flee evil arts; but all the more discourse in public regarding them. Speak to my sisters, that they love the Lord, and be satisfied with their husbands both in the flesh and spirit. In like manner also, exhort my brethren, in the name of Jesus Christ, that they love their wives, even as the Lord the Church. If any one can continue in a state of purity,[^1096] to the honour of the flesh of the Lord, let him so remain without boasting. If he shall boast, he is undone; and if he seeks to be more prominent[^1097] than the bishop, he is ruined. But it becomes both men and women who marry, to form their union with the approval of the bishop, that their marriage may be according to the Lord, and not after their own lust. Let all things be done to the honour of God.[^1098]" },
  { t = "note", id = "1096", text = "i.e., in celibacy." },
  { t = "note", id = "1097", text = "Literally, “if he be known beyond the bishop.”" },
  { t = "note", id = "1098", text = "Comp. 1 Cor. x. 31." },
]

[[section]]
id = "chapter-6"
title = "Chapter VI.—The duties of the Christian flock."
level = 1
blocks = [
  { t = "p", text = "Give ye[^1099] heed to the bishop, that God also may give heed to you. My soul be for theirs[^1100] that are submissive to the bishop, to the presbyters, and to the deacons, and may my portion be along with them in God! Labour together with one another; strive in company together; run together; suffer together; sleep together; and awake together, as the stewards, and associates,[^1101] and servants of God. Please ye Him under whom ye fight, and from whom ye receive your wages. Let none of you be found a deserter. Let your baptism endure as your arms; your faith as your helmet; your love as your spear; your patience as a complete panoply. Let your works be the charge[^1102] assigned to you, that ye may receive a worthy recompense. Be long-suffering, therefore, with one another, in meekness, as God is towards you. May I have joy of you for ever![^1103]" },
  { t = "note", id = "1099", text = "As this Epistle, though sent to the bishop, was meant to be read to the people, Ignatius here directly addresses them." },
  { t = "note", id = "1100", text = "Comp. chap. ii. etc." },
  { t = "note", id = "1101", text = "Or, “assessors.”" },
  { t = "note", id = "1102", text = "A military reference, simply implying the idea of faithful effort leading to future reward." },
  { t = "note", id = "1103", text = "Comp. Ignatius’ Epistle to the Ephesians, chap. ii." },
  { t = "p", text = "Give ye[^1104] heed to the bishop, that God also may give heed to you. My soul be for theirs[^1105] that are submissive to the bishop, to the presbytery, and to the deacons: may I have my portion with them from God! Labour together with one another; strive in company together; run together; suffer together; sleep together; and awake together, as the stewards, and associates,[^1106] and servants of God. Please ye Him under whom ye fight, and from whom ye shall receive your wages. Let none of you be found a deserter. Let your baptism endure as your arms; your faith as your helmet; your love as your spear; your patience as a complete panoply. Let your works be the charge assigned to you, that you may obtain for them a most worthy[^1107] recompense. Be long-suffering, therefore, with one another, in meekness, and God shall be so with you. May I have joy of you for ever![^1108]" },
  { t = "note", id = "1104", text = "As this Epistle, though sent to the bishop, was meant to be read to the people, Ignatius here directly addresses them." },
  { t = "note", id = "1105", text = "Comp. chap. ii. etc." },
  { t = "note", id = "1106", text = "Or, “assessors.”" },
  { t = "note", id = "1107", text = "Literally, “worthy of God.”" },
  { t = "note", id = "1108", text = "Comp. Ignatius’ Epistle to the Ephesians, chap. ii." },
]

[[section]]
id = "chapter-7"
title = "Chapter VII.—Request that Polycarp would send a messenger to Antioch."
level = 1
blocks = [
  { t = "p", text = "Seeing that the Church which is at Antioch in Syria is, as report has informed me, at peace, through your prayers, I also am the more encouraged, resting without anxiety in God,[^1109] if indeed by means of suffering I may attain to God, so that, through your prayers, I may be found a disciple [of Christ].[^1110] It is fitting, O Polycarp, most blessed in God, to assemble a very solemn[^1111] council, and to elect one whom you greatly love, and know to be a man of activity, who may be designated the messenger of God;[^1112] and to bestow on him this honour that he may go into Syria, and glorify your ever active love to the praise of Christ. A Christian has not power over himself, but must always be ready for[^1113] the service of God. Now, this work is both God’s and yours, when ye shall have completed it to His glory.[^1114] For I trust that, through grace, ye are prepared for every good work pertaining to God. Knowing, therefore, your energetic love of the truth, I have exhorted you by this brief Epistle." },
  { t = "note", id = "1109", text = "Literally, “in freedom from care of God.”" },
  { t = "note", id = "1110", text = "Some read, “in the resurrection.”" },
  { t = "note", id = "1111", text = "Literally, “most befitting God.”" },
  { t = "note", id = "1112", text = "Literally, “God-runner.”" },
  { t = "note", id = "1113", text = "Literally, “at leisure for.”" },
  { t = "note", id = "1114", text = "Literally, “to Him.”" },
  { t = "p", text = "Seeing that the Church which is at Antioch in Syria is, as report has informed me, at peace, through your prayers, I also am the more encouraged, resting without anxiety in God,[^1115] if indeed by means of suffering I may attain to God, so that, through your prayers, I may be found a disciple [of Christ]. It is fitting, O Polycarp, most blessed in God, to assemble a very solemn[^1116] council, and to elect one whom you greatly love, and know to be a man of activity, who may be designated the messenger of God;[^1117] and to bestow on him the honour of going into Syria, so that, going into Syria, he may glorify your ever active love to the praise of God. A Christian has not power over himself, but must always be ready for[^1118] the service of God. Now, this work is both God’s and yours, when ye shall have completed it. For I trust that, through grace, ye are prepared for every good work pertaining to God. Knowing your energetic love of the truth, I have exhorted you by this brief Epistle." },
  { t = "note", id = "1115", text = "Literally, “in freedom from care of God.”" },
  { t = "note", id = "1116", text = "Literally, “most befitting God.”" },
  { t = "note", id = "1117", text = "Literally, “God-runner.”" },
  { t = "note", id = "1118", text = "Literally, “at leisure for.”" },
]

[[section]]
id = "chapter-8"
title = "Chapter VIII.—Let other churches also send to Antioch."
level = 1
blocks = [
  { t = "p", text = "Inasmuch as I have not been able to write to all the Churches, because I must suddenly sail from Troas to Neapolis, as the will[^1119] [of the emperor] enjoins, [I beg that] thou, as being acquainted with the purpose[^1120] of God, wilt write to the adjacent Churches, that they also may act in like manner, such as are able to do so sending messengers,[^1121] and the others transmitting letters through those persons who are sent by thee, that thou[^1122] mayest be glorified by a work[^1123] which shall be remembered for ever, as indeed thou art worthy to be. I salute all by name, and in particular the wife of Epitropus, with all her house and children. I salute Attalus, my beloved. I salute him who shall be deemed worthy to go [from you] into Syria. Grace shall be with him for ever, and with Polycarp that sends him. I pray for your happiness for ever in our God, Jesus Christ, by whom continue ye in the unity and under the protection of God,[^1124] I salute Alce, my dearly beloved.[^1125] Fare ye well in the Lord." },
  { t = "note", id = "1119", text = "Some suppose the reference to be to the soldiers, or perhaps to God Himself." },
  { t = "note", id = "1120", text = "Or, “as possessed of the judgment.”" },
  { t = "note", id = "1121", text = "Literally, “men on foot.”" },
  { t = "note", id = "1122", text = "Some have the plural “ye” here." },
  { t = "note", id = "1123", text = "Literally, “an eternal work.”" },
  { t = "note", id = "1124", text = "Some propose to read, “and of the bishop.”" },
  { t = "note", id = "1125", text = "Literally, “name desired by me.”" },
  { t = "p", text = "Inasmuch, therefore, as I have not been able to write to all Churches, because I must suddenly sail from Troas to Neapolis, as the will[^1126] [of the emperor] enjoins, [I beg that] thou, as being acquainted with the purpose[^1127] of God, wilt write to the adjacent Churches, that they also may act in like manner, such as are able to do so sending messenger, and the others transmitting letters through those persons who are sent by thee, that thou mayest be glorified by a work[^1128] which shall be remembered for ever, as indeed thou art worthy to be. I salute all by name, and in particular the wife of Epitropus, with all her house and children. I salute Attalus, my beloved. I salute him who shall be deemed worthy to go [from you] into Syria. Grace shall be with him for ever, and with Polycarp that sends him. I pray for your happiness for ever in our God, Jesus Christ, by whom continue ye in the unity and under the protection of God. I salute Alce, my dearly beloved.[^1129] Amen. Grace [be with you]. Fare ye well in the Lord." },
  { t = "note", id = "1126", text = "Some suppose the reference to be to the soldiers, or perhaps to God Himself." },
  { t = "note", id = "1127", text = "Or, “as possessed of the judgment.”" },
  { t = "note", id = "1128", text = "Literally, “an eternal work.”" },
  { t = "note", id = "1129", text = "Literally, “name desired by me.”" },
]

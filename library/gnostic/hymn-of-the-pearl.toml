[work]
id = "hymn-of-the-pearl"
title = "The Hymn of the Robe of Glory (The Hymn of the Pearl)"
short_title = "Hymn of the Pearl"
author = "gnostic-anonymous"
collection = "gnostic"
order = 2
date = "2nd to 3rd century (preserved in the Syriac Acts of Thomas)"
language = "Syriac"
translator = "G. R. S. Mead"
edition = "G. R. S. Mead, The Hymn of the Robe of Glory, Echoes from the Gnosis, Vol. X (London and Benares: Theosophical Publishing Society, 1908), pp. 15-29"
source_url = "https://archive.org/details/MeadGRSEchoesFromTheGnosisVolXTheHymnOfTheRobeOfGlory1908"
source_sha256 = "34cbba328d2ba6e01cf5b5c1e287244facb77f21dd6f9c99df83d6ed8153093b"
retrieved = "2026-11-21"
license = "Public domain"
license_basis = "Published 1908 (London); published before 1931, so in the public domain in the United States"
words = 1416
summary = "A Syriac poem embedded in the Acts of Thomas: a king's son sent down to Egypt to win a pearl from a serpent forgets his mission until a letter from his father wakes him. Gnostic readers took it as an allegory of the soul; it is a historical document of a movement the early church rejected."

[[section]]
id = "the-hymn"
title = "The Hymn"
level = 1
blocks = [
  { t = "h", text = "I." },
  { t = "q", text = "When, a quite little child, I was dwelling" },
  { t = "q", text = "In the House of my Father’s Kingdom," },
  { t = "q", text = "And in the wealth and the glories" },
  { t = "q", text = "Of my Up-bringers I was delighting," },
  { t = "q", text = "From the East, our Home, my Parents" },
  { t = "q", text = "Forth-sent me with journey-provision." },
  { t = "q", text = "Indeed from the wealth of our Treasure," },
  { t = "q", text = "They bound up for me a load." },
  { t = "q", text = "Large was it, yet was it so light" },
  { t = "q", text = "That all alone I could bear it." },
  { t = "h", text = "II." },
  { t = "q", text = "Gold from the Land of Gīlān," },
  { t = "q", text = "Silver from Ganzāk the Great," },
  { t = "q", text = "Chalcedonies of India," },
  { t = "q", text = "Iris-hued [Opals?] from Kūshān." },
  { t = "q", text = "They girt me with Adamant [also]" },
  { t = "q", text = "That hath power to cut even iron." },
  { t = "q", text = "My Glorious Robe they took off me" },
  { t = "q", text = "Which in their love they had wrought me," },
  { t = "q", text = "And my Purple Mantle [also]" },
  { t = "q", text = "Which was woven to match with my stature." },
  { t = "h", text = "III." },
  { t = "q", text = "And with me They [then] made a compact;" },
  { t = "q", text = "In my heart wrote it, not to forget it:" },
  { t = "q", text = "“If thou goest down into Egypt," },
  { t = "q", indent = 1, text = "And thence thou bring’st the one Pearl—" },
  { t = "q", text = "“[The Pearl] that lies in the Sea," },
  { t = "q", indent = 1, text = "Hard by the loud-breathing Serpent,—" },
  { t = "q", text = "“[Then] shalt Thou put on thy Robe" },
  { t = "q", indent = 1, text = "And thy Mantle that goeth upon it," },
  { t = "q", text = "“And with thy Brother, Our Second," },
  { t = "q", text = "Shalt thou be Heir in our Kingdom.”" },
  { t = "h", text = "IV." },
  { t = "q", text = "I left the East and went down" },
  { t = "q", text = "With two Couriers [with me];" },
  { t = "q", text = "For the way was hard and dangerous," },
  { t = "q", text = "For I was young to tread it." },
  { t = "q", text = "I traversed the borders of Maishān," },
  { t = "q", text = "The mart of the Eastern merchants," },
  { t = "q", text = "And I reached the Land of Bābel," },
  { t = "q", text = "And entered the walls of Sarbūg." },
  { t = "q", text = "Down further I went into Egypt;" },
  { t = "q", text = "And from me parted my escorts." },
  { t = "h", text = "V." },
  { t = "q", text = "Straightway I went to the Serpent;" },
  { t = "q", text = "Near to his lodging I settled," },
  { t = "q", text = "To take away my Pearl" },
  { t = "q", text = "While he should sleep and should slumber." },
  { t = "q", text = "Lone was I there, yea, all lonely;" },
  { t = "q", text = "To my fellow-lodgers a stranger." },
  { t = "q", text = "However I saw there a noble," },
  { t = "q", text = "From out of the Dawn-land my kinsman," },
  { t = "q", text = "A young man fair and well favoured," },
  { t = "q", text = "Son of Grandees; he came and he joined me." },
  { t = "h", text = "VI." },
  { t = "q", text = "I made him my chosen companion," },
  { t = "q", text = "A comrade, for sharing my wares with." },
  { t = "q", text = "He warned me against the Egyptians," },
  { t = "q", text = "’Gainst mixing with the unclean ones." },
  { t = "q", text = "For I had clothed me as they were," },
  { t = "q", text = "That they might not guess I had come" },
  { t = "q", text = "From afar to take off the Pearl," },
  { t = "q", text = "And so rouse the Serpent against me." },
  { t = "h", text = "VII." },
  { t = "q", text = "But from some occasion or other" },
  { t = "q", text = "They learned I was not of their country." },
  { t = "q", text = "With their wiles they made my acquaintance;" },
  { t = "q", text = "Yea, they gave me their victuals to eat." },
  { t = "q", text = "I forgot that I was a King’s son," },
  { t = "q", text = "And became a slave to their king." },
  { t = "q", text = "I forgot all concerning the Pearl" },
  { t = "q", text = "For which my Parents had sent me;" },
  { t = "q", text = "And from the weight of their victuals" },
  { t = "q", text = "I sank down into a deep sleep." },
  { t = "h", text = "VIII." },
  { t = "q", text = "All this that now was befalling," },
  { t = "q", text = "My Parents perceived and were anxious." },
  { t = "q", text = "It was then proclaimed in our Kingdom," },
  { t = "q", text = "That all should speed to our Gate—" },
  { t = "q", text = "Kings and Chieftains of Parthia," },
  { t = "q", text = "And of the East all the Princes." },
  { t = "q", text = "And this is the counsel they came to:" },
  { t = "q", text = "I should not be left down in Egypt." },
  { t = "q", text = "And for me they wrote out a Letter;" },
  { t = "q", text = "And to it each Noble his Name set:" },
  { t = "h", text = "IX." },
  { t = "q", text = "“From Us—King of Kings, thy Father," },
  { t = "q", indent = 1, text = "And thy Mother, Queen of the Dawn-land," },
  { t = "q", text = "“And from Our Second, thy Brother—" },
  { t = "q", indent = 1, text = "To thee, Son, down in Egypt," },
  { t = "q", indent = 2, text = "Our Greeting!" },
  { t = "q", text = "“Up and arise from thy sleep," },
  { t = "q", indent = 1, text = "Give ear to the words of Our Letter!" },
  { t = "q", text = "“Remember that thou art a King’s son;" },
  { t = "q", indent = 1, text = "See whom thou hast served in thy slavedom." },
  { t = "q", text = "“Bethink thyself of the Pearl" },
  { t = "q", indent = 1, text = "For which thou didst journey to Egypt." },
  { t = "h", text = "X." },
  { t = "q", text = "“Remember thy Glorious Robe," },
  { t = "q", indent = 1, text = "Thy Splendid Mantle remember," },
  { t = "q", text = "“To put on and wear as adornment," },
  { t = "q", indent = 1, text = "When thy Name may be read in the Book of the Heroes," },
  { t = "q", text = "“And with Our Successor, thy Brother," },
  { t = "q", indent = 1, text = "Thou mayest be Heir in Our Kingdom.”" },
  { t = "q", text = "My Letter was [surely] a Letter" },
  { t = "q", text = "The King had sealed up with His Right Hand," },
  { t = "q", text = "’Gainst the Children of Bābel, the wicked," },
  { t = "q", text = "The tyrannical Daimons of Sarbūg." },
  { t = "h", text = "XI." },
  { t = "q", text = "It flew in the form of the Eagle," },
  { t = "q", text = "Of all the winged tribes the king-bird;" },
  { t = "q", text = "It flew and alighted beside me," },
  { t = "q", text = "And turned into speech altogether." },
  { t = "q", text = "At its voice and the sound of its winging," },
  { t = "q", text = "I waked and arose from my deep sleep." },
  { t = "q", text = "Unto me I took it and kissed it;" },
  { t = "q", text = "I loosed its seal and I read it." },
  { t = "q", text = "E’en as it stood in my heart writ," },
  { t = "q", text = "The words of my Letter were written." },
  { t = "h", text = "XII." },
  { t = "q", text = "I remembered that I was a King’s son," },
  { t = "q", text = "And my rank did long for its nature." },
  { t = "q", text = "I bethought me again of the Pearl," },
  { t = "q", text = "For which I was sent down to Egypt." },
  { t = "q", text = "And I began [then] to charm him," },
  { t = "q", text = "The terrible loud-breathing Serpent." },
  { t = "q", text = "I lulled him to sleep and to slumber," },
  { t = "q", text = "Chanting o’er him the Name of my Father," },
  { t = "q", text = "The Name of our Second, [my Brother]," },
  { t = "q", text = "And [Name] of my Mother, the East-Queen." },
  { t = "h", text = "XIII." },
  { t = "q", text = "And [thereon] I snatched up the Pearl," },
  { t = "q", text = "And turned to the House of my Father." },
  { t = "q", text = "Their filthy and unclean garments" },
  { t = "q", text = "I stripped off and left in their country." },
  { t = "q", text = "To the way that I came I betook me," },
  { t = "q", text = "To the Light of our Home, to the Dawn-land." },
  { t = "q", text = "On the road I found [there] before me" },
  { t = "q", text = "My Letter that had aroused me—" },
  { t = "q", text = "As with its voice it had roused me," },
  { t = "q", text = "So now with its light it did lead me—" },
  { t = "h", text = "XIV." },
  { t = "q", text = "On fabric of silk, in letters of red [?]," },
  { t = "q", text = "With shining appearance before me [?]," },
  { t = "q", text = "Encouraging me with its guidance," },
  { t = "q", text = "With its love it was drawing me onward." },
  { t = "q", text = "I went forth; through Sarbūg I passed;" },
  { t = "q", text = "I left Bābel-land on my left hand;" },
  { t = "q", text = "And I reached unto Maishān the Great," },
  { t = "q", text = "The meeting-place of the merchants," },
  { t = "q", text = "That lieth hard by the Sea-shore." },
  { t = "h", text = "XV." },
  { t = "q", text = "My Glorious Robe that I’d stripped off," },
  { t = "q", text = "And my Mantle with which it was covered," },
  { t = "q", text = "Down from the Heights of Hyrcānia," },
  { t = "q", text = "Thither my Parents did send me," },
  { t = "q", text = "By the hands of their Treasure-dispensers" },
  { t = "q", text = "Who trustworthy were with it trusted." },
  { t = "q", text = "Without my recalling its fashion,—" },
  { t = "q", text = "In the House of my Father my childhood had left it,—" },
  { t = "q", text = "At once, as soon as I saw it," },
  { t = "q", text = "The Glory looked like my own self." },
  { t = "h", text = "XVI." },
  { t = "q", text = "I saw it all in all of me," },
  { t = "q", text = "And saw me all in [all of] it,—" },
  { t = "q", text = "That we were twain in distinction," },
  { t = "q", text = "And yet again one in one likeness." },
  { t = "q", text = "I saw, too, the Treasurers also," },
  { t = "q", text = "Who unto me had down-brought it," },
  { t = "q", text = "Were twain [and yet] of one likeness;" },
  { t = "q", text = "For one Sign of the King was upon them—" },
  { t = "q", text = "Who through them restored me the Glory," },
  { t = "q", text = "The Pledge of my Kingship [?]." },
  { t = "h", text = "XVII." },
  { t = "q", text = "The Glorious Robe all-bespangled" },
  { t = "q", text = "With sparkling splendour of colours;" },
  { t = "q", text = "With Gold and also with Beryls," },
  { t = "q", text = "Chalcedonies, iris-hued [Opals?]," },
  { t = "q", text = "With Sards of varying colours." },
  { t = "q", text = "To match its grandeur [?], moreover, it had been completed:" },
  { t = "q", text = "With adamantine jewels" },
  { t = "q", text = "All of its seams were off-fastened." },
  { t = "q", text = "[Moreover] the King of Kings’ Image" },
  { t = "q", text = "Was depicted entirely all o’er it;" },
  { t = "q", text = "And as with Sapphires above" },
  { t = "q", text = "Was it wrought in a motley of colour." },
  { t = "h", text = "XVIII." },
  { t = "q", text = "I saw that moreover all o’er it" },
  { t = "q", text = "The motions of Gnosis abounding;" },
  { t = "q", text = "I saw it further was making" },
  { t = "q", text = "Ready as though for to speak." },
  { t = "q", text = "I heard the sound of its Music" },
  { t = "q", text = "Which it whispered as it descended [?]:" },
  { t = "q", text = "“Behold him the active in deeds!" },
  { t = "q", indent = 1, text = "For whom I was reared with my Father;" },
  { t = "q", text = "“I too have felt in myself" },
  { t = "q", indent = 1, text = "How that with his works waxed my stature.”" },
  { t = "h", text = "XIX." },
  { t = "q", text = "And [now] with its Kingly motions" },
  { t = "q", text = "Was it pouring itself out towards me," },
  { t = "q", text = "And made haste in the hands of its Givers," },
  { t = "q", text = "That I might [take and] receive it." },
  { t = "q", text = "And me, too, my love urged forward" },
  { t = "q", text = "To run for to meet it, to take it." },
  { t = "q", text = "And I stretched myself forth to receive it;" },
  { t = "q", text = "With its beauty of colour I decked me," },
  { t = "q", text = "And my Mantle of sparkling colours" },
  { t = "q", text = "I wrapped entirely all o’er me." },
  { t = "h", text = "XX." },
  { t = "q", text = "I clothed me therewith, and ascended" },
  { t = "q", text = "To the Gate of Greeting and Homage." },
  { t = "q", text = "I bowed my head and did homage" },
  { t = "q", text = "To the Glory of Him who had sent it," },
  { t = "q", text = "Whose commands I [now] had accomplished," },
  { t = "q", text = "And who had, too, done what He’d promised." },
  { t = "q", text = "[And there] at the Gate of His House-sons" },
  { t = "q", text = "I mingled myself with His Princes;" },
  { t = "q", text = "For He had received me with gladness," },
  { t = "q", text = "And I was with Him in His Kingdom;" },
  { t = "h", text = "XXI." },
  { t = "q", text = "To whom the whole of His Servants" },
  { t = "q", text = "With sweet-sounding voices sing praises." },
  { t = "q", text = "∗ ∗ ∗ ∗ ∗" },
  { t = "q", text = "He had promised that with him to the Court" },
  { t = "q", text = "Of the King of Kings I should speed," },
  { t = "q", text = "And taking with me my Pearl" },
  { t = "q", text = "Should with him be seen by our King." },
]

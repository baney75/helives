[work]
id = "2-enoch"
title = "2 Enoch, or the Book of the Secrets of Enoch"
short_title = "2 Enoch"
author = "pseudepigrapha-anonymous"
collection = "pseudepigrapha"
order = 3
date = "1st century AD (Charles dates it between 1 BC and AD 50)"
language = "Old Church Slavonic, from a lost Greek original"
translator = "N. Forbes and R. H. Charles"
edition = "The Book of the Secrets of Enoch, recension A, translated by N. Forbes and R. H. Charles, in The Apocrypha and Pseudepigrapha of the Old Testament in English, edited by R. H. Charles, vol. 2 (Oxford: Clarendon Press, 1913), pages 425 to 469"
source_url = "https://archive.sacred-texts.com/bib/fbe/index.htm"
source_sha256 = "6550962efdc413fb7560d5d798d96750ebf79e29885d9d75f35409ab13345d33"
retrieved = "2026-11-21"
license = "Public domain"
license_basis = "The Apocrypha and Pseudepigrapha of the Old Testament in English, vol. 2, published in Oxford by the Clarendon Press in 1913; in the public domain in the United States because it was published before 1931. The words follow the 1926 reprint in The Forgotten Books of Eden (New York: Alpha House, 1926), also published before 1931; verse numbers rebuilt and wording checked against two archive.org scans of the 1913 printing (apocryphapseudep0002unse, apocryphapseudep0002rhch_w1w3)."
words = 12329
summary = "A Jewish apocalypse preserved only in Slavonic, in which Enoch is taken up through the heavens, is shown the creation and the order of the world, and returns to teach his sons before he is taken away. This text follows one recension, the longer one (APOT's recension A); the shorter recension is not included. It is outside every Jewish and Christian canon and is kept here for history and study. It is not Scripture."

[[section]]
id = "1"
title = "Chapter 1"
level = 1
blocks = [
  { t = "p", text = "There was a wise man, a great artificer, and the Lord conceived love for him and received him, that he should behold the uppermost dwellings and be an eye-witness of the wise and great and inconceivable and immutable realm of God Almighty, of the very wonderful and glorious and bright and many-eyed station of the Lord's servants, and of the inaccessible throne of the Lord, and of the degrees and manifestations of the incorporeal hosts, and of the ineffable ministration of the multitude of the elements, and of the various apparition and inexpressible singing of the host of Cherubim, and of the boundless light." },
  { t = "v", n = 1, text = "At that time, he said, when my 165th year was completed, I begat my son Mathusal. After this too I lived two hundred years and completed of all the years of my life three hundred and sixty-five years." },
  { t = "v", n = 2, text = "On the first day of the first month I was in my house alone and was resting on my couch and slept." },
  { t = "v", n = 3, text = "And when I was asleep, great distress came up into my heart, and I was weeping with my eyes in sleep, and I could not understand what this distress was, or what would happen to me." },
  { t = "v", n = 4, text = "And there appeared to me two men, exceeding big, so that I never saw such on earth;" },
  { t = "v", n = 5, text = "their faces were shining like the sun, their eyes too were like a burning light, and from their lips was fire coming forth with clothing and singing of various kinds in appearance purple, their wings were brighter than gold, their hands whiter than snow. They were standing at the head of my couch and began to call me by my name." },
  { t = "v", n = 6, text = "And I arose from my sleep and saw clearly those two men standing in front of me." },
  { t = "v", n = 7, text = "And I saluted them and was seized with fear and the appearance of my face was changed from terror," },
  { t = "v", n = 8, text = "and those men said to me: 'Have courage, Enoch, do not fear; the eternal God sent us to thee, and lo! thou shalt to-day ascend with us into heaven," },
  { t = "v", n = 9, text = "and thou shalt tell thy sons and all thy household all that they shall do without thee on earth in thy house, and let no one seek thee till the Lord return thee to them." },
  { t = "v", n = 10, text = "And I made haste to obey them and went out from my house, and made to the doors, as it was ordered me, and summoned my sons Mathusal and Regim and Gaidad and made known to them all the marvels those men had told me." },
]

[[section]]
id = "2"
title = "Chapter 2"
level = 1
blocks = [
  { t = "h", level = 3, text = "The Instruction. How Enoch instructed his sons." },
  { t = "v", n = 1, text = "Listen to me, my children, I know not whither I go, or what will befall me;" },
  { t = "v", n = 2, text = "now therefore, my children, I tell you: turn not from God before the face of the vain, who made not Heaven and earth, for these shall perish and those who worship them," },
  { t = "v", n = 3, text = "and may the Lord make confident your hearts in the fear of him." },
  { t = "v", n = 4, text = "And now, my children, let no one think to seek me, until the Lord return me to you." },
]

[[section]]
id = "3"
title = "Chapter 3"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of Enoch's assumption; how the angels took him into the first heaven." },
  { t = "v", n = 1, text = "It came to pass, when Enoch had told his sons, that the angels took him on to their wings and bore him up on to the first heaven and placed him on the clouds." },
  { t = "v", n = 2, text = "And there I looked, and again I looked higher, and saw the ether, and" },
  { t = "v", n = 3, text = "they placed me on the first heaven and showed me a very great Sea, greater than the earthly sea." },
]

[[section]]
id = "4"
title = "Chapter 4"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of the Angels ruling the stars." },
  { t = "v", n = 1, text = "They brought before my face the elders and rulers of the stellar orders, and showed me two hundred angels, who rule the stars and their services to the heavens," },
  { t = "v", n = 2, text = "and fly with their wings and come round all those who sail." },
]

[[section]]
id = "5"
title = "Chapter 5"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of how the Angels keep the store-houses of the snow." },
  { t = "v", n = 1, text = "And here I looked down and saw the treasure-houses of the snow, and the angels who keep their terrible store-houses," },
  { t = "v", n = 2, text = "and the clouds whence they come out and into which they go." },
]

[[section]]
id = "6"
title = "Chapter 6"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of the dew and of the olive-oil, and various flowers." },
  { t = "v", n = 1, text = "They showed me the treasure-house of the dew, like oil of the olive, and the appearance of its form, as of all the flowers of the earth; further many angels guarding the treasure-houses of these things, and how they are made to shut and open." },
]

[[section]]
id = "7"
title = "Chapter 7"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of how Enoch was taken on to the second heaven." },
  { t = "v", n = 1, text = "And those men took me and led me up on to the second heaven, and showed me darkness, greater than earthly darkness, and there I saw prisoners hanging, watched, awaiting the great and boundless judgement," },
  { t = "v", n = 2, text = "and these angels were dark-looking, more than earthly darkness, and incessantly making weeping through all hours. And I said to the men who were with me: '" },
  { t = "v", n = 3, text = "Wherefore are these incessantly tortured?' they answered me: 'These are God's apostates, who obeyed not God's commands, but took counsel with their own will, and turned away with their prince, who also is fastened on the fifth heaven.'" },
  { t = "v", n = 4, text = "And I felt great pity for them, and they saluted me, and said to me: 'Man of God, pray for us to the Lord';" },
  { t = "v", n = 5, text = "and I answered them: 'Who am I, a mortal man, that I should pray for angels? who knoweth whither I go, or what will befall me? or who will pray for me?'" },
]

[[section]]
id = "8"
title = "Chapter 8"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of the assumption of Enoch to the third heaven." },
  { t = "v", n = 1, text = "And those men took me thence, and led me up on to the third heaven, and placed me there; and I looked downwards, and saw the produce of these places, such as has never been known for goodness." },
  { t = "v", n = 2, text = "And I saw all the sweet-flowering trees and beheld their fruits, which were sweet-smelling, and all the foods borne by them bubbling with fragrant exhalation." },
  { t = "v", n = 3, text = "And in the midst of the trees that of life, in that place whereon the Lord rests, when he goes up into paradise; and this tree is of ineffable goodness and fragrance," },
  { t = "v", n = 4, text = "and adorned more than every existing thing; and on all sides it is in form gold-looking and vermilion and fire-like and covers all, and it has produce from all fruits. Its root is in the garden at the earth's end." },
  { t = "v", n = 5, text = "And paradise is between corruptibility and incorruptibility. And two springs come out which send forth honey and milk, and their springs send forth oil and wine, and they separate into four parts, and go round with quiet course," },
  { t = "v", n = 6, text = "and go down into the PARADISE OF EDEN, between corruptibility and in corruptibility. And thence they go forth along the earth, and have a revolution to their circle even as other elements." },
  { t = "v", n = 7, text = "And here there is no unfruitful tree, and every place is blessed." },
  { t = "v", n = 8, text = "And there are three hundred angels very bright, who keep the garden, and with incessant sweet singing and never-silent voices serve the Lord throughout all days and hours. And I said: 'How very sweet is this place,' and those men said to me:" },
]

[[section]]
id = "9"
title = "Chapter 9"
level = 1
blocks = [
  { t = "h", level = 3, text = "The showing to Enoch of the place of the righteous and compassionate." },
  { t = "v", n = 1, text = "This place, O Enoch, is prepared for the righteous, who endure all manner of offence from those that exasperate their souls, who avert their eyes from iniquity, and make righteous judgement, and give bread to the hungering, and cover the naked with clothing, and raise up the fallen, and help injured orphans, and who walk without fault before the face of the Lord, and serve him alone, and for them is prepared this place for eternal inheritance." },
]

[[section]]
id = "10"
title = "Chapter 10"
level = 1
blocks = [
  { t = "h", level = 3, text = "Here they showed Enoch the terrible place and various tortures." },
  { t = "v", n = 1, text = "And those two men led me up on to the Northern side, and showed me there a very terrible place," },
  { t = "v", n = 2, text = "and there were all manner of tortures in that place: cruel darkness and unillumined gloom, and there is no light there, but murky fire constantly flameth aloft, and there is a fiery river coming forth, and that whole place is everywhere fire, and everywhere there is frost and ice," },
  { t = "v", n = 3, text = "thirst and shivering, while the bonds are very cruel, and the angels fearful and merciless, bearing angry weapons, merciless torture, and I said: '" },
  { t = "v", n = 4, text = "Woe, woe, how very terrible is this place.' And those men said to me: This place, O Enoch, is prepared for those who dishonour God, who on earth practise sin against nature, which is child-corruption after the sodomitic fashion, magic-making, enchantments and devilish witchcrafts, and who boast of their wicked deeds," },
  { t = "v", n = 5, text = "stealing, lies, calumnies, envy, rancour, fornication, murder, and who, accursed, steal the souls of men, who, seeing the poor take away their goods and themselves wax rich, injuring them for other men's goods; who being able to satisfy the empty, made the hungering to die; being able to clothe, stripped the naked;" },
  { t = "v", n = 6, text = "and who knew not their creator, and bowed down to soulless (sc. lifeless) Gods, who cannot see nor hear, vain gods, who also built hewn images and bow down to unclean handiwork, for all these is prepared this place amongst these, for eternal inheritance." },
]

[[section]]
id = "11"
title = "Chapter 11"
level = 1
blocks = [
  { t = "h", level = 3, text = "Here they took Enoch up on to the fourth heaven where is the course of sun and moon." },
  { t = "v", n = 1, text = "Those men took me, and led me up on to the fourth heaven, and showed me all the successive goings, and all the rays of the light of sun and moon." },
  { t = "v", n = 2, text = "And I measured their goings and compared their light, and saw that the sun's light is greater than the moon's. Its circle and the wheels on which it goes always, like a wind going past with very marvellous speed, and day and night it has no rest." },
  { t = "v", n = 3, text = "Its passage and return are accompanied by four great stars, and each star has under it a thousand stars, to the right of the sun's wheel, and by four to the left, each having under it a thousand stars, altogether eight thousand, issuing with the sun continually." },
  { t = "v", n = 4, text = "And by day fifteen myriads of angels attend it, and by night a thousand. And six-winged ones issue with the angels before the sun's wheel into the fiery flames," },
  { t = "v", n = 5, text = "and a hundred angels kindle the sun and set it alight." },
]

[[section]]
id = "12"
title = "Chapter 12"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of the very marvellous elements of the sun." },
  { t = "v", n = 1, text = "And I looked and saw other flying elements of the sun, whose names are Phoenixes and Chalkydri, marvellous and wonderful, with feet and tails in the form of a lion, and a crocodile's head, their appearance is empurpled, like the rainbow; their size is nine hundred measures," },
  { t = "v", n = 2, text = "their wings are like those of angels, each has twelve, and they attend and accompany the sun, bearing heat and dew, as it is ordered them from God." },
  { t = "v", n = 3, text = "Thus the sun revolves and goes, and rises under the heaven, and its course goes under the earth with the light of its rays incessantly." },
]

[[section]]
id = "13"
title = "Chapter 13"
level = 1
blocks = [
  { t = "h", level = 3, text = "The angels took Enoch and placed him in the east at the sun's gates." },
  { t = "v", n = 1, text = "Those men bore me away to the east, and placed me at the sun's gates, where the sun goes forth according to the regulation of the seasons and the circuit of the months of the whole year, and the number of the hours day and night," },
  { t = "v", n = 2, text = "And I saw six gates open, each gate having sixty-one stadia and a quarter of one stadium, and I measured them truly, and understood their size to be so much, through which the sun goes forth, and goes to the west, and is made even," },
  { t = "v", n = 4, text = "and rises throughout all the months, and turns back again from the six gates according to the succession of the seasons;" },
  { t = "v", n = 5, text = "thus the period of the whole year is finished after the returns of the four seasons," },
]

[[section]]
id = "14"
title = "Chapter 14"
level = 1
blocks = [
  { t = "h", level = 3, text = "They took Enoch to the West." },
  { t = "v", n = 1, text = "And again those men led me away to the western parts, and showed me six great gates open corresponding to the Eastern gates, opposite to where the sun sets, according to the number of the days three hundred and sixty-five and a quarter." },
  { t = "v", n = 2, text = "Thus again it goes down to the western gates, and draws away its light, the greatness of its brightness, under the earth; for since the crown of its shining is in heaven with the Lord," },
  { t = "v", n = 3, text = "and guarded by four hundred angels, while the sun goes round on wheel under the earth, and stands seven great hours in night, and spends half its course under the earth, when it comes to the eastern approach in the eighth hour of the night, it brings its lights, and the crown of shining, and the sun flames forth more than fire." },
]

[[section]]
id = "15"
title = "Chapter 15"
level = 1
blocks = [
  { t = "h", level = 3, text = "The elements of the sun, the Phoenixes and Chalkydri broke into song." },
  { t = "v", n = 1, text = "Then the elements of the sun, called Phoenixes and Chalkydri break into song, therefore every bird flutters with its wings, rejoicing at the giver of light, and they broke into song at the command of the Lord." },
  { t = "v", n = 2, text = "The giver of light comes to give brightness to the whole world, and the morning guard takes shape, which is the rays of the sun, and the sun of the earth goes out, and receives its brightness to light up the whole face of the earth," },
  { t = "v", n = 3, text = "and they showed me this calculation of the sun's going. And the gates which it enters, these are the great gates of the computation of the hours of the year;" },
  { t = "v", n = 4, text = "for this reason the sun is a great creation, whose circuit lasts twenty-eight years, and begins again from the beginning." },
]

[[section]]
id = "16"
title = "Chapter 16"
level = 1
blocks = [
  { t = "h", level = 3, text = "They took Enoch and again placed him in the east at the course of the moon." },
  { t = "v", n = 1, text = "Those men showed me the other course, that of the moon, twelve great gates, crowned from west to east, by which the moon goes in and out of the customary times." },
  { t = "v", n = 2, text = "It goes in at the first gate to the western places of the sun, by the first gates with thirty-one days exactly, by the second gates with thirty-one days exactly, by the third with thirty days exactly, by the fourth with thirty days exactly, by the fifth with thirty-one days exactly, by the sixth with thirty-one days exactly, by the seventh with thirty days exactly, by the eighth with thirty-one days perfectly, by the ninth with thirty-one days exactly, by the tenth with thirty days perfectly, by the eleventh with thirty-one days exactly, by the twelfth with twenty-eight days exactly." },
  { t = "v", n = 3, text = "And it goes through the western gates in the order and number of the eastern," },
  { t = "v", n = 4, text = "and accomplishes the three hundred and sixty-five and a quarter days of the solar year," },
  { t = "v", n = 5, text = "while the lunar year has three hundred and fifty-four, and there are wanting to it twelve days of the solar circle, which are the lunar epacts of the whole year. [Thus, too, the great circle contains five hundred and thirty-two years.]" },
  { t = "v", n = 6, text = "The quarter of a day is omitted for three years, the fourth fulfils it exactly. Therefore they are taken outside of heaven for three years and are not added to the number of days, because they change the time of the years to two new months towards completion, to two others towards diminution." },
  { t = "v", n = 7, text = "And when the western gates are finished, it returns and goes to the eastern to the lights, and goes thus day and night about the heavenly circles, lower than all circles, swifter than the heavenly winds, and spirits and elements and angels flying; each angel has six wings." },
  { t = "v", n = 8, text = "It has a sevenfold course in nineteen years." },
]

[[section]]
id = "17"
title = "Chapter 17"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of the singings of the angels, which it is impossible to describe." },
  { t = "v", n = 1, text = "In the midst of the heavens I saw armed soldiers, serving the Lord, with tympana and organs, with incessant voice, with sweet voice, with sweet and incessant voice and various singing, which it is impossible to describe, and which astonishes every mind, so wonderful and marvellous is the singing of those angels, and I was delighted listening to it." },
]

[[section]]
id = "18"
title = "Chapter 18"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of the taking of Enoch on to the fifth heaven." },
  { t = "v", n = 1, text = "The men took me on to the fifth heaven and placed me, and there I saw many and countless soldiers, called Grigori, of human appearance, and their size was greater than that of great giants" },
  { t = "v", n = 2, text = "and their faces withered, and the silence of their mouths perpetual, and there was no service on the fifth heaven, and I said to the men who were with me: Wherefore are these very withered and their faces melancholy, and their mouths silent, and wherefore is there no service on this heaven?" },
  { t = "v", n = 3, text = "And they said to me: These are the Grigori, who with their prince Satanail rejected the Lord of light," },
  { t = "v", n = 4, text = "and after them are those who are held in great darkness on the second heaven, and three of them went down on to earth from the Lord's throne, to the place Ermon, and broke through their vows on the shoulder of the hill Ermon and saw the daughters of men how good they are, and took to themselves wives," },
  { t = "v", n = 5, text = "and befouled the earth with their deeds, who in all times of their age made lawlessness and mixing, and giants are born and marvellous big men and great enmity." },
  { t = "v", n = 6, text = "And therefore God judged them with great judgement, and they weep for their brethren and they will be punished on the Lord's great day." },
  { t = "v", n = 7, text = "And I said to the Grigori: 'I saw your brethren and their works, and their great torments, and I prayed for them, but the Lord has condemned them to be under earth till heaven and earth shall end for ever.'" },
  { t = "v", n = 8, text = "And I said: 'Wherefore do you wait, brethren, and do not serve before the Lord's face, and have not put your services before the Lord's face, lest you anger your Lord utterly?'" },
  { t = "v", n = 9, text = "And they listened to my admonition, and spoke to the four ranks in heaven, and lo! as I stood with those two men four trumpets trumpeted together with great voice, and the Grigori broke into song with one voice, and their voice went up before the Lord pitifully and affectingly." },
]

[[section]]
id = "19"
title = "Chapter 19"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of the taking of Enoch on to the sixth heaven." },
  { t = "v", n = 1, text = "And thence those men took me and bore me up on to the sixth heaven, and there I saw seven bands of angels, very bright and very glorious, and their faces shining more than the sun's shining, glistening, and there is no difference in their faces, or behaviour, or manner of dress;" },
  { t = "v", n = 2, text = "and these make the orders, and learn the goings of the stars, and the alteration of the moon, or revolution of the sun, and the good government of the world." },
  { t = "v", n = 3, text = "And when they see evil-doing they make commandments and instruction, and sweet and loud singing, and all songs of praise. These are the archangels who are above angels," },
  { t = "v", n = 4, text = "measure all life in heaven and on earth, and the angels who are appointed over seasons and years, the angels who are over rivers and sea, and who are over the fruits of the earth, and the angels who are over every grass, giving food to all, to every living thing," },
  { t = "v", n = 5, text = "and the angels who write all the souls of men, and all their deeds, and their lives before the Lord's face;" },
  { t = "v", n = 6, text = "in their midst are six Phoenixes and six Cherubim and six six-winged ones continually with one voice singing one voice, and it is not possible to describe their singing, and they rejoice before the Lord at his footstool." },
]

[[section]]
id = "20"
title = "Chapter 20"
level = 1
blocks = [
  { t = "h", level = 3, text = "Hence they took Enoch into the Seventh Heaven." },
  { t = "v", n = 1, text = "And those two men lifted me up thence on to the seventh Heaven, and I saw there a very great light, and fiery troops of great archangels, incorporeal forces, and dominions, orders and governments, cherubim and seraphim, thrones and many-eyed ones, nine regiments, the Ioanit stations of light, and I became afraid, and began to tremble with great terror," },
  { t = "v", n = 2, text = "and those men took me, and led me after them, and said to me: 'Have courage, Enoch, do not fear,'" },
  { t = "v", n = 3, text = "and showed me the Lord from afar, sitting on His very high throne. For what is there on the tenth heaven, since the Lord dwells here? On the tenth heaven is God, in the Hebrew tongue he is called Aravat. And all the heavenly troops would come and stand on the ten steps according to their rank, and would bow down to the Lord," },
  { t = "v", n = 4, text = "and would again go to their places in joy and felicity, singing songs in the boundless light with small and tender voices, gloriously serving him." },
]

[[section]]
id = "21"
title = "Chapter 21"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of how the angels here left Enoch, at the end of the seventh Heaven, and went away from him unseen." },
  { t = "v", n = 1, text = "And the cherubim and seraphim standing about the throne, the six-winged and many-eyed ones do not depart, standing before the Lord's face doing his will, and cover his whole throne, singing with gentle voice before the Lord's face: 'Holy, holy, holy, Lord Ruler of Sabaoth, heavens and earth are full of Thy glory.'" },
  { t = "v", n = 2, text = "When I saw all these things, those men said to me: 'Enoch, thus far is it commanded us to journey with thee,' and those men went away from me and thereupon I saw them not. And I remained alone at the end of the seventh heaven and became afraid, and fell on my face and said to myself: 'Woe is me, what has befallen me?'" },
  { t = "v", n = 3, text = "And the Lord sent one of his glorious ones, the archangel Gabriel, and he said to me: 'Have courage, Enoch, do not fear, arise before the Lord's face into eternity, arise, come with me,'" },
  { t = "v", n = 4, text = "and I answered him, and said in myself: 'My Lord, my soul is departed from me, from terror and trembling,' and I called to the men who led me up to this place, on them I relied, and it is with them I go before the Lord's face." },
  { t = "v", n = 5, text = "And Gabriel caught me up, as a leaf caught up by the wind, and placed me before the Lord's face." },
  { t = "v", n = 6, text = "And I saw the eighth Heaven, which is called in the Hebrew tongue Muzaloth, changer of the seasons, of drought, and of wet, and of the twelve signs of the zodiac, which are above the seventh Heaven. And I saw the ninth Heaven, which is called in Hebrew Kuchavim, where are the heavenly homes of the twelve signs of the zodiac." },
]

[[section]]
id = "22"
title = "Chapter 22"
level = 1
blocks = [
  { t = "h", level = 3, text = "In the tenth Heaven the archangel Michael led Enoch to before the Lord's face." },
  { t = "v", n = 1, text = "On the tenth Heaven, Aravoth, I saw the appearance of the Lord's face, like iron made to glow in fire, and brought out, emitting sparks, and it burns. Thus I saw the Lord's face, but the Lord's face is ineffable, marvellous and very awful, and very, very terrible." },
  { t = "v", n = 2, text = "And who am I to tell of the Lord's unspeakable being, and of his very wonderful face? And I cannot tell the quantity of his many instructions, and various voices, the Lord's throne very great and not made with hands, nor the quantity of those standing round him, troops of cherubim and seraphim," },
  { t = "v", n = 3, text = "nor their incessant singing, nor his immutable beauty, and who shall tell of the ineffable greatness of his glory?" },
  { t = "v", n = 4, text = "And I fell prone and bowed down to the Lord," },
  { t = "v", n = 5, text = "and the Lord with his lips said to me: 'Have courage, Enoch, do not fear, arise and stand before my face into eternity.'" },
  { t = "v", n = 6, text = "And the archistratege Michael lifted me up, and led me to before the Lord's face. And the Lord said to his servants tempting them: 'Let Enoch stand before my face into eternity,'" },
  { t = "v", n = 7, text = "and the glorious ones bowed down to the Lord, and said: 'Let Enoch go according to Thy word.'" },
  { t = "v", n = 8, text = "And the Lord said to Michael: 'Go and take Enoch from out his earthly garments, and anoint him with my sweet ointment, and put him into the garments of My glory.'" },
  { t = "v", n = 9, text = "And Michael did thus, as the Lord told him. He anointed me, and dressed me, and the appearance of that ointment is more than the great light, and his ointment is like sweet dew, and its smell mild, shining like the sun's ray," },
  { t = "v", n = 10, text = "and I looked at myself, and was like one of his glorious ones." },
  { t = "v", n = 11, text = "And the Lord summoned one of his archangels by name Pravuil, whose knowledge was quicker in wisdom than the other archangels, who wrote all the deeds of the Lord;" },
  { t = "v", n = 12, text = "and the Lord said to Pravuil: 'Bring out the books from my store-houses, and a reed of quick-writing, and give it to Enoch, and deliver to him the choice and comforting books out of thy hand.'" },
]

[[section]]
id = "23"
title = "Chapter 23"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of Enoch's writing, how he wrote his wonderful journeyings and the heavenly apparitions and himself wrote three hundred and sixty-six books." },
  { t = "v", n = 1, text = "And he was telling me all the works of heaven, earth and sea, and all the elements, their passages and goings, and the thunderings of the thunders, the sun and moon, the goings and changes of the stars, the seasons, years, days, and hours, the risings of the wind, the numbers of the angels," },
  { t = "v", n = 2, text = "and the formation of their songs, and all human things, the tongue of every human song and life, the commandments, instructions, and sweet-voiced singings, and all things that it is fitting to learn. And Pravuil told me: 'All the things that I have told thee, we have written." },
  { t = "v", n = 4, text = "Sit and write all the souls of mankind, however many of them are born, and the places prepared for them to eternity;" },
  { t = "v", n = 5, text = "for all souls are prepared to eternity, before the formation of the world.'" },
  { t = "v", n = 6, text = "And all double thirty days and thirty nights, and I wrote out all things exactly, and wrote three hundred and sixty-six books." },
]

[[section]]
id = "24"
title = "Chapter 24"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of the great secrets of God, which God revealed and told to Enoch, and spoke with him face to face." },
  { t = "v", n = 1, text = "And the Lord summoned me, and said to me: 'Enoch, sit down on my left with Gabriel.' And I bowed down to the Lord, and the Lord spoke to me:" },
  { t = "v", n = 2, text = "Enoch, beloved, all thou seest, all things that are standing finished I tell to thee even before the very beginning, all that I created from non-being, and visible things from invisible." },
  { t = "v", n = 3, text = "Hear, Enoch, and take in these my words, for not to My angels have I told my secret, and I have not told them their rise, nor my endless realm, nor have they understood my creating, which I tell thee to-day." },
  { t = "v", n = 4, text = "For before all things were visible, I alone used to go about in the invisible things, like the sun from east to west, and from west to east." },
  { t = "v", n = 5, text = "But even the sun has peace in itself, while I found no peace, because I was creating all things, and I conceived the thought of placing foundations, and of creating visible creation." },
]

[[section]]
id = "25"
title = "Chapter 25"
level = 1
blocks = [
  { t = "h", level = 3, text = "God relates to Enoch, how out of the very lowest darkness comes down the visible and invisible." },
  { t = "v", n = 1, text = "I commanded in the very lowest parts, that visible things should come down from invisible, and Adoil came down very great, and I beheld him, and lo! he had a belly of great light." },
  { t = "v", n = 2, text = "And I said to him: 'Become undone, Adoil, and let the visible come out of thee.'" },
  { t = "v", n = 3, text = "And he came undone, and a great light came out. And I was in the midst of the great light, and as there is born light from light, there came forth a great age, and showed all creation, which I had thought to create. And I saw that it was good." },
  { t = "v", n = 4, text = "And I placed for myself a throne, and took my seat on it, and said to the light: 'Go thou up higher and fix thyself high above the throne, and be a foundation to the highest things.'" },
  { t = "v", n = 5, text = "And above the light there is nothing else, and then I bent up and looked up from my throne." },
]

[[section]]
id = "26"
title = "Chapter 26"
level = 1
blocks = [
  { t = "h", level = 3, text = "God summons from the very lowest a second time that Archas, heavy and very red should come forth." },
  { t = "v", n = 1, text = "And I summoned the very lowest a second time, and said: 'Let Archas come forth hard,' and he came forth hard from the invisible. And Archas came forth, hard, heavy, and very red." },
  { t = "v", n = 2, text = "And I said: 'Be opened, Archas, and let there be born from thee,' and he came undone, an age came forth, very great and very dark, bearing the creation of all lower things," },
  { t = "v", n = 3, text = "and I saw that it was good and said to him: 'Go thou down below, and make thyself firm, and be for a foundation for the lower things,' and it happened and he went down and fixed himself, and became the foundation for the lower things, and below the darkness there is nothing else." },
]

[[section]]
id = "27"
title = "Chapter 27"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of how God founded the water, and surrounded it with light, and established on it seven islands." },
  { t = "v", n = 1, text = "And I commanded that there should be taken from light and darkness," },
  { t = "v", n = 2, text = "and I said: 'Be thick,' and it became thus and I spread it out with the light, and it became water, and I spread it out over the darkness, below the light," },
  { t = "v", n = 3, text = "and then I made firm the waters, that is to say the bottomless, and I made foundation of light around the water, and created seven circles from inside, and imaged it (sc. the water) like crystal wet and dry, that is to say like glass, and the circumcession of the waters and the other elements, and I showed each one of them its road, and the seven stars each one of them in its heaven, that they go thus, and I saw that it was good." },
  { t = "v", n = 4, text = "And I separated between light and between darkness, that is to say in the midst of the water hither and thither, and I said to the light, that it should be the day, and to the darkness, that it should be the night, and there was evening and there was morning the first day." },
]

[[section]]
id = "28"
title = "Chapter 28"
level = 1
blocks = [
  { t = "h", level = 3, text = "The week in which God showed Enoch all his wisdom and power, throughout all the seven days, how he created all the heavenly and earthly forces and all moving things even down to man." },
  { t = "v", n = 1, text = "And then I made firm the heavenly circle, and made that the lower water which is under heaven collect itself together, into one whole, and that the chaos become dry, and it became so." },
  { t = "v", n = 2, text = "Out of the waves I created rock hard and big, and from the rock I piled up the dry, and the dry I called earth," },
  { t = "v", n = 3, text = "and the midst of the earth I called abyss, that is to say the bottomless," },
  { t = "v", n = 4, text = "I collected the sea in one place and bound it together with a yoke. And I said to the sea: 'Behold I give thee thy eternal limits, and thou shalt not break loose from thy component parts.' Thus I made fast the firmament." },
  { t = "v", n = 5, text = "This day I called me the first-created." },
]

[[section]]
id = "29"
title = "Chapter 29"
level = 1
blocks = [
  { t = "v", n = 1, text = "Then it became evening, and then again morning, and it was the second day. [Monday is the first day.]" },
  { t = "h", level = 3, text = "The fiery Essence." },
  { t = "v", n = 1, cont = true, text = "And for all the heavenly troops I imaged the image and essence of fire, and my eye looked at the very hard, firm rock, and from the gleam of my eye the lightning received its wonderful nature," },
  { t = "v", n = 2, text = "which is both fire in water and water in fire, and one does not put out the other, nor does the one dry up the other, therefore the lightning is brighter than the sun, softer than water and firmer than hard rock." },
  { t = "v", n = 3, text = "And from the rock I cut off a great fire, and from the fire I created the orders of the incorporeal ten troops of angels, and their weapons are fiery and their raiment a burning flame, and I commanded that each one should stand in his order." },
  { t = "h", level = 3, text = "Here Satanail with his angels was thrown down from the height." },
  { t = "v", n = 4, text = "And one from out the order of angels, having turned away with the order that was under him, conceived an impossible thought, to place his throne higher than the clouds above the earth, that he might become equal in rank to my power." },
  { t = "v", n = 5, text = "And I threw him out from the height with his angels, and he was flying in the air continuously above the bottomless." },
]

[[section]]
id = "30"
title = "Chapter 30"
level = 1
blocks = [
  { t = "v", n = 1, text = "And then I created all the heavens, and the third day was. [Tuesday]. On the third day I commanded the earth to make grow great and fruitful trees, and hills, and seed to sow, and I planted Paradise, and enclosed it, and placed as armed guardians flaming angels, and thus I created renewal." },
  { t = "v", n = 2, text = "Then came evening, and came morning the fourth day. [Wednesday]. On the fourth day I commanded that there should be great lights on the heavenly circles." },
  { t = "v", n = 3, text = "On the first uppermost circle I placed the stars, Kruno, and on the second Aphrodit, on the third Aris," },
  { t = "v", n = 4, text = "on the fifth Zeus, on the sixth Ermis, on the seventh lesser the moon, and adorned it with the lesser stars." },
  { t = "v", n = 5, text = "And on the lower I placed the sun for the illumination of day, and the moon and stars for the illumination of night." },
  { t = "v", n = 6, text = "The sun that it should go according to each animal (sc. signs of the zodiac), twelve, and I appointed the succession of the months and their names and lives, their thunderings, and their hour-markings, how they should succeed." },
  { t = "v", n = 7, text = "Then evening came and morning came the fifth day. [Thursday]. On the fifth day I commanded the sea, that it should bring forth fishes, and feathered birds of many varieties, and all animals creeping over the earth, going forth over the earth on four legs, and soaring in the air, male sex and female, and every soul breathing the spirit of life." },
  { t = "v", n = 8, text = "And there came evening, and there came morning the sixth day. [Friday]. On the sixth day I commanded my wisdom to create man from seven consistencies: one, his flesh from the earth; two, his blood from the dew; three, his eyes from the sun; four, his bones from stone; five, his intelligence from the swiftness of the angels and from cloud; six, his veins and his hair from the grass of the earth; seven, his soul from my breath and from the wind." },
  { t = "v", n = 9, text = "And I gave him seven natures: to the flesh hearing, the eyes for sight, to the soul smell, the veins for touch, the blood for taste, the bones for endurance, to the intelligence sweetness (sc. enjoyment)." },
  { t = "v", n = 10, text = "I conceived a cunning saying to say, I created man from invisible and from visible nature, of both are his death and life and image, he knows speech like some created thing, small in greatness and again great in smallness," },
  { t = "v", n = 11, text = "and I placed him on earth, a second angel, honourable, great and glorious," },
  { t = "v", n = 12, text = "and I appointed him as ruler to rule on earth and to have my wisdom, and there was none like him of earth of all my existing creatures." },
  { t = "v", n = 13, text = "And I appointed him a name, from the four component parts, from east, from west, from south, from north," },
  { t = "v", n = 14, text = "and I appointed for him four special stars, and I called his name Adam," },
  { t = "v", n = 15, text = "and showed him the two ways, the light and the darkness, and I told him: 'This is good, and that bad,' that I should learn whether he has love towards me, or hatred, that it be clear which in his race love me." },
  { t = "v", n = 16, text = "For I have seen his nature, but he has not seen his own nature, therefore through not seeing he will sin worse, and I said 'After sin what is there but death?'" },
  { t = "v", n = 17, text = "And I put sleep into him and he fell asleep. And I took from him a rib, and created him a wife," },
  { t = "v", n = 18, text = "that death should come to him by his wife, and I took his last word and called her name mother, that is to say, Eva." },
]

[[section]]
id = "31"
title = "Chapter 31"
level = 1
blocks = [
  { t = "h", level = 3, text = "God gives over paradise to Adam, and gives him a command to see the heavens opened, and that he should see the angels singing the song of victory." },
  { t = "v", n = 1, text = "Adam has life on earth, and I created a garden in Eden in the east, that he should observe the testament and keep the command." },
  { t = "v", n = 2, text = "I made the heavens open to him, that he should see the angels singing the song of victory, and the gloomless light." },
  { t = "v", n = 3, text = "And he was continuously in paradise, and the devil understood that I want to create another world, because Adam was lord on earth, to rule and control it." },
  { t = "v", n = 4, text = "The devil is the evil spirit of the lower places, as a fugitive he made, he made Sotona from the heavens as his name was Satomail," },
  { t = "v", n = 5, text = "thus he became different from the angels, but his nature did not change his intelligence as far as his understanding of righteous and sinful things." },
  { t = "v", n = 6, text = "And he understood his condemnation and the sin which he had sinned before, therefore he conceived thought against Adam, in such form he entered and seduced Eva, but did not touch Adam." },
  { t = "v", n = 7, text = "But I cursed ignorance, but what I had blessed previously, those I did not curse, I cursed not man," },
  { t = "v", n = 8, text = "nor the earth, nor other creatures, but man's evil fruit, and his works." },
]

[[section]]
id = "32"
title = "Chapter 32"
level = 1
blocks = [
  { t = "h", level = 3, text = "After Adam's sin God sends him away into the earth 'whence I took thee,' but does not wish to ruin him for all years to come." },
  { t = "v", n = 1, text = "I said to him: 'Earth thou art, and into the earth whence I took thee thou shalt go, and I will not ruin thee, but send thee whence I took thee. Then I can again take thee at My second coming! And I blessed all my creatures visible and invisible. And Adam was five and half hours in paradise." },
  { t = "v", n = 2, text = "And I blessed the seventh day, which is the Sabbath, on which he rested from all his works." },
]

[[section]]
id = "33"
title = "Chapter 33"
level = 1
blocks = [
  { t = "h", level = 3, text = "God shows Enoch the age of this world, its existence of seven thousand years, and the eighth thousand is the end, neither years, nor months, nor weeks, nor days." },
  { t = "v", n = 1, text = "And I appointed the eighth day also, that the eighth day should be the first-created after my work," },
  { t = "v", n = 2, text = "and that the first seven revolve in the form of the seventh thousand, and that at the beginning of the eighth thousand there should be a time of not-counting, endless, with neither years nor months nor weeks nor days nor hours." },
  { t = "v", n = 3, text = "And now, Enoch, all that I have told thee, all that thou hast understood, all that thou hast seen of heavenly things, all that thou hast seen on earth, and all that I have written in books by my great wisdom, all these things I have devised and created from the uppermost foundation to the lower and to the end," },
  { t = "v", n = 4, text = "and there is no counsellor nor inheritor to my creations. I am self-eternal, not made with hands, and without change. My thought is my counsellor, my wisdom and my word are made, and my eyes observe all things how they stand here and tremble with terror. If I turn away my face, then all things will be destroyed." },
  { t = "v", n = 5, text = "And apply thy mind, Enoch, and know him who is speaking to thee, and take thou the books which thou thyself hast written." },
  { t = "v", n = 6, text = "And I give thee Samuil and Raguil, who led thee up, and the books, and go down to earth, and tell thy sons all that I have told thee, and all that thou hast seen, from the lower heaven up to my throne, and all the troops." },
  { t = "v", n = 7, text = "For I created all forces, and there is none that resisteth me or that does not subject himself to me. For all subject themselves to my monarchy, and labour for my sole rule." },
  { t = "v", n = 8, text = "Give them the books of the handwriting, and they will read them and will know me for the creator of all things, and will understand how there is no other God but me." },
  { t = "v", n = 9, text = "And let them distribute the books of thy handwriting—children to children, generation to generation, nations to nations." },
  { t = "v", n = 10, text = "And I will give thee, Enoch, my intercessor, the archistratege Michael, for the handwritings of thy fathers Adam, Seth, Enos, Cainan, Mahaleleel, and Jared thy father." },
]

[[section]]
id = "34"
title = "Chapter 34"
level = 1
blocks = [
  { t = "h", level = 3, text = "God convicts the idolaters and sodomitic fornicators, and therefore brings down a deluge upon them." },
  { t = "v", n = 1, text = "They have rejected my commandments and my yoke, worthless seed has come up, not fearing God, and they would not bow down to me, but have begun to bow down to vain gods, and denied my unity," },
  { t = "v", n = 2, text = "and have laden the whole earth with untruths, offences, abominable lecheries namely one with another, and all manner of other unclean wickednesses, which are disgusting to relate." },
  { t = "v", n = 3, text = "And therefore I will bring down a deluge upon the earth and will destroy all men, and the whole earth will crumble together into great darkness." },
]

[[section]]
id = "35"
title = "Chapter 35"
level = 1
blocks = [
  { t = "h", level = 3, text = "God leaves one righteous man of Enoch's tribe with his whole house, who did God's pleasure according to his will." },
  { t = "v", n = 1, text = "Behold from their seed shall arise another generation, much afterwards, but of them many will be very insatiate." },
  { t = "v", n = 2, text = "He who raises that generation, shall reveal to them the books of thy handwriting, of thy fathers, to them to whom he must point out the guardianship of the world, to the faithful men and workers of my pleasure, who do not acknowledge my name in vain." },
  { t = "v", n = 3, text = "And they shall tell another generation, and those others having read shall be glorified thereafter, more than the first." },
]

[[section]]
id = "36"
title = "Chapter 36"
level = 1
blocks = [
  { t = "h", level = 3, text = "God commanded Enoch to live on earth thirty days, to give instruction to his sons and to his children's children. After thirty days he was again taken on to heaven." },
  { t = "v", n = 1, text = "Now, Enoch, I give thee the term. of thirty days to spend in thy house, and tell thy sons and all thy household, that all may hear from my face what is told them by thee, that they may read and understand, how there is no other God but me. And that they may always keep my commandments, and begin to read and take in the books of thy handwriting." },
  { t = "v", n = 2, text = "And after thirty days I shall send my angel for thee, and he will take thee from earth and from thy sons to me." },
]

[[section]]
id = "37"
title = "Chapter 37"
level = 1
blocks = [
  { t = "h", level = 3, text = "Here God summons an angel." },
  { t = "v", n = 1, text = "And the Lord called up one of the older angels, terrible and menacing, and placed him by me, in appearance white as snow, and his hands like ice, having the appearance of great frost, and he froze my face, because I could not endure the terror of the Lord, just as it is not possible to endure a stove's fire and the sun's heat, and the frost of the air." },
  { t = "v", n = 2, text = "And the Lord said to me: 'Enoch, if thy face be not frozen here, no man will be able to behold thy face.'" },
]

[[section]]
id = "38"
title = "Chapter 38"
level = 1
blocks = [
  { t = "h", level = 3, text = "Mathusal continued to have hope and to await his father Enoch at his couch day and night." },
  { t = "v", n = 1, text = "And the Lord said to those men who first led me up: 'Let Enoch go down on to earth with you, and await him till the determined day.'" },
  { t = "v", n = 2, text = "And they placed me by night on my couch." },
  { t = "v", n = 3, text = "And Mathusal expecting my coming, keeping watch by day and by night at my couch, was filled with awe when he heard my coming, and I told him, 'Let all my household come together, that I tell them everything.'" },
]

[[section]]
id = "39"
title = "Chapter 39"
level = 1
blocks = [
  { t = "h", level = 3, text = "Enoch's pitiful admonition to his sons with weeping and great lamentation, as he spoke to them." },
  { t = "v", n = 1, text = "Oh my children, my beloved ones, hear the admonition of your father, as much as is according to the Lord's will." },
  { t = "v", n = 2, text = "I have been let come to you to-day, and announce to you, not from my lips, but from the Lord's lips, all that is and was and all that is now, and all that will be till judgement-day." },
  { t = "v", n = 3, text = "For the Lord has let me come to you, you hear therefore the words of my lips, of a man made big for you, but I am one who has seen the Lord's face, like iron made to glow from fire it sends forth sparks and burns," },
  { t = "v", n = 4, text = "You look now upon my eyes, the eyes of a man big with meaning for you, but I have seen the Lord's eyes, shining like the sun's rays and filling the eyes of man with awe." },
  { t = "v", n = 5, text = "You see now, my children, the right hand of a man that helps you, but I have seen the Lord's right hand filling heaven as he helped me." },
  { t = "v", n = 6, text = "You see the compass of my work like your own, but I have seen the Lord's limitless and perfect compass, which has no end." },
  { t = "v", n = 7, text = "You hear the words of my lips, as I heard the words of the Lord, like great thunder incessantly with hurling of clouds." },
  { t = "v", n = 8, text = "And now, my children, hear the discourses of the father of the earth, how fearful and awful it is to come before the face of the ruler of the earth, how much more terrible and awful it is to come before the face of the ruler of heaven, the controller of quick and dead, and of the heavenly troops. Who can endure that endless pain?" },
]

[[section]]
id = "40"
title = "Chapter 40"
level = 1
blocks = [
  { t = "h", level = 3, text = "Enoch admonishes his children truly of all things from the Lord's lips, how he saw and heard and wrote down." },
  { t = "v", n = 1, text = "And now, my children, I know all things, for this is from the Lord's lips, and this my eyes have seen, from beginning to end." },
  { t = "v", n = 2, text = "I know all things, and have written all things into books, the heavens and their end, and their plenitude, and all the armies and their marchings. I have measured and described the stars, the great countless multitude of them." },
  { t = "v", n = 3, text = "What man has seen their revolutions, and their entrances? For not even the angels see their number, while I have written all their names." },
  { t = "v", n = 4, text = "And I measured the sun's circle, and measured its rays, counted the hours, I wrote down too all' things that go over the earth I have written the things that are nourished, and all seed sown and unsown, which the earth produces and all plants, and every grass and every flower, and their sweet smells, and their names," },
  { t = "v", n = 8, text = "and the dwelling-places of the clouds, and their composition, and their wings, and how they bear rain and raindrops." },
  { t = "v", n = 9, text = "And I investigated all things, and wrote the road of the thunder and of the lightning, and they showed me the keys and their guardians, their rise, the way they go; it is let out in measure (sc. gently) by a chain, lest by a heavy chain and violence it hurl down the angry clouds and destroy all things on earth." },
  { t = "v", n = 10, text = "I wrote the treasure-houses of the snow, and the store-houses of the cold and the frosty airs, and I observed their season's key-holder, he fills the clouds with them, and does not exhaust their treasure-houses." },
  { t = "v", n = 11, text = "And I wrote the resting-places of the winds and observed and saw how their key-holders bear weighing-scales and measures; first, they put them in one weighing-scale, then in the other the weights and let them out according to measure cunningly over the whole earth, lest by heavy breathing they make the earth to rock." },
  { t = "v", n = 12, text = "And I measured out the whole earth, its mountains, and all hills, fields, trees, stones, rivers, all existing things I wrote down, the height from earth to the seventh heaven, and downwards to the very lowest hell, and the judgement-place, and the very great, open and weeping hell." },
  { t = "v", n = 13, text = "And I saw how the prisoners are in pain, expecting the limitless judgement. And I wrote down all those being judged by the judge, and all their judgements (sc. sentences) and all their works." },
]

[[section]]
id = "41"
title = "Chapter 41"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of how Enoch lamented Adam's sin." },
  { t = "v", n = 1, text = "And I saw all forefathers from all time with Adam and Eva, and I sighed and broke into tears and said of the ruin of their dishonour: 'Woe is me for my infirmity and for that of my forefathers,' and thought in my, heart and said:" },
  { t = "v", n = 2, text = "'Blessed is the man who has not been born or who has been born and shall not sin before the Lord's face, that he come not into this place, nor bring the yoke of this place!" },
]

[[section]]
id = "42"
title = "Chapter 42"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of how Enoch saw the key-holders and guards of the gates of hell standing." },
  { t = "v", n = 1, text = "Saw the key-holders and guards of the gates of hell standing, like great serpents, and their faces like extinguished lamps, and their eyes of fire, their sharp teeth," },
  { t = "v", n = 14, text = "and I saw all the Lord's works, how they are right, while the works of man are some good, and others bad, and in their works are known those who lie evilly." },
]

[[section]]
id = "43"
title = "Chapter 43"
level = 1
blocks = [
  { t = "h", level = 3, text = "Enoch shows his children how he measured and wrote out God's judgements." },
  { t = "v", n = 1, text = "I, my children, measured and wrote out every work and every measure and every righteous judgement." },
  { t = "v", n = 2, text = "As one year is more honourable than another, so is one man more honourable than another, some for great possessions, some for wisdom of heart, some for particular intellect, some for cunning, one for silence of lip, another for cleanliness, one for strength, another for comeliness, one for youth, another for sharp wit, one for shape of body, another for sensibility," },
  { t = "v", n = 3, text = "let it be heard everywhere, but there is none better than he who fears God, he shall be more glorious in time to come." },
]

[[section]]
id = "44"
title = "Chapter 44"
level = 1
blocks = [
  { t = "h", level = 3, text = "Enoch instructs his sons, that they revile not the face of man, small or great." },
  { t = "v", n = 1, text = "The Lord with his hands having created man, in the likeness of his own face, the Lord made him small and great. Whoever reviles the ruler's face, and abhors the Lord's face, has despised the Lord's face," },
  { t = "v", n = 2, text = "and he who vents anger on any man without injury, the Lord's great anger will cut him down," },
  { t = "v", n = 3, text = "he who spits on the face of man reproachfully, will be cut down at the Lord's great judgement." },
  { t = "v", n = 4, text = "Blessed is the man who does not direct his heart with malice against any man, and helps the injured and condemned, and raises the broken down," },
  { t = "v", n = 5, text = "and shall do charity to the needy, because on the day of the great judgement every weight, every measure and every makeweight will be as in the market, that is to say they are hung on scales and stand in the market, and every one shall learn his own measure, and according to his measure shall take his reward." },
]

[[section]]
id = "45"
title = "Chapter 45"
level = 1
blocks = [
  { t = "h", level = 3, text = "God shows how he does not want from men sacrifices, nor burnt-offerings, but pure and contrite hearts." },
  { t = "v", n = 1, text = "Whoever hastens to make offering before the Lord's face, the Lord for his part will hasten that offering by granting of his work." },
  { t = "v", n = 2, text = "But whoever increases his lamp before the Lord's face and make not true judgement, the Lord will not increase his treasure in the realm of the highest." },
  { t = "v", n = 3, text = "When the Lord demands bread, or candles, or flesh (sc. cattle), or any other sacrifice, then that is nothing; but God demands pure hearts, and with all that only tests the heart of man." },
]

[[section]]
id = "46"
title = "Chapter 46"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of how an earthly ruler does not accept from man abominable and unclean gifts, then how much more does God abominate unclean gifts, but sends them away with wrath and does not accept his gifts." },
  { t = "v", n = 1, text = "Hear, my people, and take in the words of my lips. If any one bring any gifts to an earthly ruler, and have disloyal thoughts in his heart, and the ruler know this, will he not be angry with him, and not refuse his gifts, and not give him over to judgement?" },
  { t = "v", n = 2, text = "Or if one man make himself appear good to another by deceit of tongue, but have evil in his heart, then will not the other understand the treachery of his heart, and himself be condemned, since his untruth was plain to all?" },
  { t = "v", n = 3, text = "And when the Lord shall send a great light, then there will be judgement for the just and the unjust, and there no one shall escape notice." },
]

[[section]]
id = "47"
title = "Chapter 47"
level = 1
blocks = [
  { t = "h", level = 3, text = "Enoch instructs his sons from God's lips, and hands them the handwriting of this book." },
  { t = "v", n = 1, text = "And now, my children, lay thought on your hearts, mark well the words of your father, which are all come to you from the Lord's lips." },
  { t = "v", n = 2, text = "Take these books of your father's handwriting and read them. For the books are many, and in them you will learn all the Lord's works, all that has been from the beginning of creation, and will be till the end of time." },
  { t = "v", n = 3, text = "And if you will observe my handwriting, you will not sin against the Lord; because there is no other except the Lord, neither in heaven, nor in earth, nor in the very lowest places, nor in the one foundation." },
  { t = "v", n = 4, text = "The Lord has placed the foundations in the unknown, and has spread forth heavens visible and invisible; he fixed the earth on the waters, and created countless creatures," },
  { t = "v", n = 5, text = "and who has counted the water and the foundation of the unfixed, or the dust of the earth, or the sand of the sea, or the drops of the rain, or the morning dew, or the wind's breathings? Who has filled earth and sea, and the indissoluble winter? I cut the stars out of fire, and decorated heaven, and put it in their midst." },
]

[[section]]
id = "48"
title = "Chapter 48"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of the sun's passage along the seven circles." },
  { t = "v", n = 1, text = "That the sun go along the seven heavenly circles, which are the, appointment of one hundred and eighty-two thrones," },
  { t = "v", n = 2, text = "that it go down on a short day, and again one hundred and eighty-two, that it go down on a big day, and he has two thrones on which he rests, revolving hither and thither above the thrones of the months, from the seventeenth day of the month Tsivan it goes down to the month Thevan, from the seventeenth of Thevad it goes up." },
  { t = "v", n = 3, text = "And thus it goes close to the earth, then the earth is glad and makes grow its fruit, and when it goes away, then the earth is sad, and trees and all fruits have no florescence." },
  { t = "v", n = 4, text = "All this he measured, with good measurement of hours, and fixed a measure by his wisdom, of the visible and the invisible." },
  { t = "v", n = 5, text = "From the invisible he made all things visible, himself being invisible." },
  { t = "v", n = 6, text = "Thus I make known to you, my children, and distribute the books to your children, into all your generations," },
  { t = "v", n = 7, text = "and amongst the nations who shall have the sense to fear God, let them receive them, and may they come to love them more than any food or earthly sweets, and read them and apply themselves to them." },
  { t = "v", n = 8, text = "And those who understand not the Lord, who fear not God, who accept not, but reject, who do not receive them (sc. the books), a terrible judgement awaits these." },
  { t = "v", n = 9, text = "Blessed is the man who shall bear their yoke and shall drag them along, for he shall be released on the day of the great judgement." },
]

[[section]]
id = "49"
title = "Chapter 49"
level = 1
blocks = [
  { t = "h", level = 3, text = "Enoch instructs his sons not to swear either by heaven or earth, and shows God's promise, even in the mother's womb." },
  { t = "v", n = 1, text = "I swear to you, my children, but I swear not by any oath, neither by heaven nor by earth, nor by any other creature which God created. The Lord said: 'There is no oath in me, nor injustice, but truth.' If there is no truth in men, let them swear by the words 'yea, yea,' or else, 'nay, nay!" },
  { t = "v", n = 2, text = "And I swear to you, yea, yea, that there has been no man in his mother's womb, but that already before, even to each one there is a place prepared for the repose of that soul, and a measure fixed how much it is intended that a man be tried in this world. Yea, children, deceive not yourselves, for there has been previously prepared a place for every soul of man." },
]

[[section]]
id = "50"
title = "Chapter 50"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of how none born on earth can remain hidden nor his work remain concealed, but he (sc. God) bids us be meek, to endure attack and insult, and not to offend widows and orphans." },
  { t = "v", n = 1, text = "I have put everyman's work in writing and none born on earth can remain hidden nor his works remain concealed." },
  { t = "v", n = 2, text = "I see all things. Now therefore, my children, in patience and meekness spend the number of your days, that you inherit endless life." },
  { t = "v", n = 3, text = "Endure for the sake of the Lord every wound, every injury, every evil word and attack." },
  { t = "v", n = 4, text = "If ill-requitals befall you, return them not either to neighbour or enemy, because the Lord will return them for you and be your avenger on the day of great judgement, that there be no avenging here among men." },
  { t = "v", n = 5, text = "Whoever of you spends gold or silver for his brother's sake, he will receive ample treasure in the world to come. Injure not widows nor orphans nor strangers, lest God's wrath come upon you." },
]

[[section]]
id = "51"
title = "Chapter 51"
level = 1
blocks = [
  { t = "h", level = 3, text = "Enoch instructs his sons, that they hide not treasures in the earth, but bids them give alms to the poor." },
  { t = "v", n = 1, text = "Stretch out your hands to the poor according to your strength." },
  { t = "v", n = 2, text = "Hide not your silver in the earth. Help the faithful man in affliction, and affliction will not find you in the time of your trouble." },
  { t = "v", n = 3, text = "And every grievous and cruel yoke that come upon you bear all for the sake of the Lord, and thus you will find your reward in the day of judgement." },
  { t = "v", n = 4, text = "It is good to go morning, midday, and evening into the Lord's dwelling, for the glory of your creator." },
  { t = "v", n = 5, text = "Because every breathing thing glorifies him, and every creature visible and invisible returns him praise." },
]

[[section]]
id = "52"
title = "Chapter 52"
level = 1
blocks = [
  { t = "h", level = 3, text = "God instructs his faithful. how they are to praise his name." },
  { t = "v", n = 1, text = "Blessed is the man who opens his lips in praise of God of Sabaoth and praises the Lord with his heart." },
  { t = "v", n = 2, text = "Cursed every man who opens his lips for the bringing into contempt and calumny of his neighbour, because he brings God into contempt." },
  { t = "v", n = 3, text = "Blessed is he who opens his lips blessing and praising God." },
  { t = "v", n = 4, text = "Cursed is he before the Lord all the days of his life, who opens his lips to curse and abuse." },
  { t = "v", n = 5, text = "Blessed is he who blesses all the Lord's works." },
  { t = "v", n = 6, text = "Cursed is he who brings the Lord's creation into contempt." },
  { t = "v", n = 7, text = "Blessed is he who looks down and raises the fallen." },
  { t = "v", n = 8, text = "Cursed is he who looks to and is eager for the destruction of what is not his." },
  { t = "v", n = 9, text = "Blessed is he who keeps the foundations of his fathers made firm from the beginning." },
  { t = "v", n = 10, text = "Cursed is he who perverts the decrees of his forefathers." },
  { t = "v", n = 11, text = "Blessed is he who implants peace and love." },
  { t = "v", n = 12, text = "Cursed is he who disturbs those that love their neighbours." },
  { t = "v", n = 13, text = "Blessed is he who speaks with humble tongue and heart to all." },
  { t = "v", n = 14, text = "Cursed is he who speaks peace with his. tongue, while in his heart there is no peace but a sword." },
  { t = "v", n = 15, text = "For all these things will be laid bare in the weighing-scales and in the books, on the day of the great judgement." },
]

[[section]]
id = "53"
title = "Chapter 53"
level = 1
blocks = [
  { t = "h", level = 3, text = "[Let us not say: 'Our father is before God, he will stand forward for us on the day of judgement,' for there father cannot help son, nor yet son father.]" },
  { t = "v", n = 1, text = "And now, my children, do not say: 'Our father is standing before God, and is praying for our sins,' for there is there no helper of any man who has sinned." },
  { t = "v", n = 2, text = "You see how I wrote all works of every man, before his creation, all that is done amongst all men for all time," },
  { t = "v", n = 3, text = "and none can tell or relate my handwriting, because the Lord sees all the imaginings of man, how they are vain, where they lie in the treasure-houses of the heart." },
  { t = "v", n = 4, text = "And now, my children, mark well all the words of your father, that I tell you, lest you regret, saying: 'Why did our father not tell us?'" },
]

[[section]]
id = "54"
title = "Chapter 54"
level = 1
blocks = [
  { t = "h", level = 3, text = "Enoch instructs his sons, that they should hand the books to others also." },
  { t = "v", n = 1, text = "At that time, not understanding this let these books which I have given you be for an inheritance of your peace. Hand them to all who want them, and instruct them, that they may see the Lord's very great and marvellous works." },
]

[[section]]
id = "55"
title = "Chapter 55"
level = 1
blocks = [
  { t = "h", level = 3, text = "Here Enoch shows his sons, telling them with tears: 'My children, the hour has approached for me to go up on to heaven; behold, the angels are standing before me.'" },
  { t = "v", n = 1, text = "My children, behold, the day of my term and the time have approached. For the angels who shall go with me are standing before me and urge me to my departure from you; they are standing here on earth, awaiting what has been told them." },
  { t = "v", n = 2, text = "For to-morrow I shall go up on to heaven, to the uppermost Jerusalem to my eternal inheritance." },
  { t = "v", n = 3, text = "Therefore I bid you do before the Lord's face all his good pleasure." },
]

[[section]]
id = "56"
title = "Chapter 56"
level = 1
blocks = [
  { t = "h", level = 3, text = "Methosalam asks of his father blessing, that he (sc. Methosalam) may make him (sc. Enoch) food to eat." },
  { t = "v", n = 1, text = "Methosalam having answered his father Enoch, said: 'What is agreeable to thy eyes, father, that I may make before thy face, that thou mayst bless our dwellings, and thy sons, and that thy people may be made glorious through thee, and then that thou mayst depart thus, as the Lord said?," },
  { t = "v", n = 2, text = "Enoch answered to his son Methosalam and said: 'Hear, child, from the time when the Lord anointed me with the ointment of his glory, there has been no food in me, and my soul remembers not earthly enjoyment, neither do I want anything earthly!" },
]

[[section]]
id = "57"
title = "Chapter 57"
level = 1
blocks = [
  { t = "h", level = 3, text = "Enoch bade his son Methosalam. to summon all his brethren." },
  { t = "v", n = 1, text = "My child Methosalam, summon all thy brethren and all your household and the elders of the people, that I may talk to them and depart, as is planned for me.'" },
  { t = "v", n = 2, text = "And Methosalam made haste, and summoned his brethren, Regim, Riman, Uchan, Chermion, Gaidad, and all the elders of the people before the face of his father Enoch; and he blessed them, and said to them:" },
]

[[section]]
id = "58"
title = "Chapter 58"
level = 1
blocks = [
  { t = "h", level = 3, text = "Enoch's instruction to his sons." },
  { t = "v", n = 1, text = "Listen to me, my children, to-day. In those days when the Lord came down on to earth for Adam's sake, and visited all his creatures, which he created himself, after all these he created Adam," },
  { t = "v", n = 2, text = "and the Lord called all the beasts of the earth, all the reptiles, and all the birds that soar in the air, and brought them all before the face of our father Adam. And Adam gave the names to all things living on earth." },
  { t = "v", n = 3, text = "And the Lord appointed him ruler over all, and subjected to him all things under his hands, and made them dumb and made them dull that they be commanded of man, and be in subjection and obedience to him. Thus also the Lord created every man lord over all his possessions." },
  { t = "v", n = 4, text = "The Lord will not judge a single soul of beast for man's sake, but adjudges the souls of men to their beasts in this world;" },
  { t = "v", n = 5, text = "for men have a special place. And as every soul of man is according to number, similarly beasts will not perish," },
  { t = "v", n = 6, text = "nor all souls of beasts which the Lord created, till the great judgement, and they will accuse man, if he feed them ill." },
]

[[section]]
id = "59"
title = "Chapter 59"
level = 1
blocks = [
  { t = "h", level = 3, text = "Enoch instructs his sons wherefore they may not touch beef because of what comes from it." },
  { t = "v", n = 1, text = "Whoever defiles the soul of beasts, defiles his own soul." },
  { t = "v", n = 2, text = "For man brings clean animals to make sacrifice for sin, that he may have cure of his soul. And if they bring for sacrifice clean animals, and birds, man has cure, he cures his soul." },
  { t = "v", n = 3, text = "All is given you for food, bind it by the four feet, that is to make good the cure, he cures his soul." },
  { t = "v", n = 4, text = "But whoever kills beast without wounds, kills his own soul and defiles his own flesh." },
  { t = "v", n = 5, text = "And he who does any beast any injury whatsoever, in secret, it is evil practice, and he defiles his own soul." },
]

[[section]]
id = "60"
title = "Chapter 60"
level = 1
blocks = [
  { t = "v", n = 1, text = "He who does injury to soul of man, does injury to his own soul, and there is no cure for his flesh, nor pardon for all time." },
  { t = "h", level = 3, text = "How it is not fitting to kill man neither by weapon nor by tongue." },
  { t = "v", n = 2, text = "He who works the killing of a man's soul, kills his own soul, and kills his own body, and there is no cure for him for all time." },
  { t = "v", n = 3, text = "He who puts a man in any snare, shall stick in it himself, and there is no cure for him for all time." },
  { t = "v", n = 4, text = "He who puts a man in any vessel, his retribution will not be wanting at the great judgement for all time." },
  { t = "v", n = 5, text = "He who works crookedly or speaks evil against any soul, will not make justice for himself for all time." },
]

[[section]]
id = "61"
title = "Chapter 61"
level = 1
blocks = [
  { t = "h", level = 3, text = "Enoch instructs his sons to keep themselves from injustice and often to stretch forth hands to the poor, to give a share of their labours." },
  { t = "v", n = 1, text = "And now, my children, keep your hearts from every injustice, which the Lord hates. Just as a man asks (sc. something) for his own soul from God," },
  { t = "v", n = 2, text = "so let him do to every living soul, because I know all things, how in the great time (sc. to come) are many mansions prepared for men, good for the good, and bad for the bad, without number many." },
  { t = "v", n = 3, text = "Blessed are those who enter the good houses, for in the bad (sc. houses) there is no peace.nor return (sc. from them)." },
  { t = "v", n = 4, text = "Hear, my children, small and great! When man puts a good thought in his heart, brings gifts from his labours before the Lord's face and his hands made them not, then the Lord will turn away his face from the labour of his hand, and he (sc. man) cannot find the labour of his hands." },
  { t = "v", n = 5, text = "And if his hands made it, but his heart murmur, and his heart cease not making murmur incessantly, he has not any advantage." },
]

[[section]]
id = "62"
title = "Chapter 62"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of how it is fitting to bring one's gift with faith, because there is no repentance after death." },
  { t = "v", n = 1, text = "Blessed is the man who in his patience brings his gifts with faith before the Lord's face, because he will find forgiveness of sins." },
  { t = "v", n = 2, text = "But if he take back his words before the time, there is no repentance for him; and if the time pass and he do not of his own will what is promised, there is no repentance after death." },
  { t = "v", n = 3, text = "Because every work which man does before the time, is all deceit before men, and sin before God." },
]

[[section]]
id = "63"
title = "Chapter 63"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of how not to despise the poor, but to share with them equally, lest thou be murmured against before God." },
  { t = "v", n = 1, text = "When man clothes the naked and fills the hungry, he will find reward from God." },
  { t = "v", n = 2, text = "But if his heart murmur, he commits a double evil: ruin of himself and of that which he gives; and for him there will be no finding of reward on account of that." },
  { t = "v", n = 3, text = "And if his own heart is filled with his food and his own flesh (sc. clothed) with his clothing he commits contempt, and will forfeit all his endurance of poverty, and will not find reward of his good deeds." },
  { t = "v", n = 4, text = "Every proud and magniloquent man is hateful to the Lord, and every false speech, clothed in untruth; it will be cut with the blade of the sword of death, and thrown into the fire, and shall burn for all time.'" },
]

[[section]]
id = "64"
title = "Chapter 64"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of how the Lord calls up Enoch, and people took counsel to go and kiss him at the place called Achuzan." },
  { t = "v", n = 1, text = "When Enoch had spoken these words to his sons, all people far and near heard how the Lord was calling Enoch. They took counsel together: 'Let us go and kiss Enoch'" },
  { t = "v", n = 2, text = "and two thousand men came together and came to the place Achuzan where Enoch was, and his sons." },
  { t = "v", n = 3, text = "And the elders of the people, the whole assembly, came and bowed down and began to kiss Enoch and said to him: 'Our father Enoch, be thou blessed of the Lord, the eternal ruler," },
  { t = "v", n = 4, text = "and now bless thy sons and all the people, that we may be glorified to-day before thy face." },
  { t = "v", n = 5, text = "For thou shalt be glorified before the Lord's face for all time, since the Lord chose thee, rather than all men on earth, and designated thee writer of all his creation, visible and invisible, and redeemer of the sins of man, and helper of thy household.'" },
]

[[section]]
id = "65"
title = "Chapter 65"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of Enoch's instruction of his sons." },
  { t = "v", n = 1, text = "And Enoch answered all his people saying: 'Hear, my children, before that all creatures were created, the Lord created the visible and invisible things." },
  { t = "v", n = 2, text = "And as much time as there was and went past, understand that after all that he created man in the likeness of his own form, and put into him eyes to see, and ears to hear, and heart to reflect, and intellect wherewith to deliberate." },
  { t = "v", n = 3, text = "And the Lord saw all man's works, and created all his creatures, and divided time, from time he fixed the years, and from the years he appointed the months, and from the months he appointed the days, and of days he appointed seven." },
  { t = "v", n = 4, text = "And in those he appointed the hours, measured them out exactly, that man might reflect on time and count years, months, and hours, their alternation, beginning, and end, and that he might count his own life, from the beginning until death, and reflect on his sin and write his work bad and good;" },
  { t = "v", n = 5, text = "because no work is hidden before the Lord, that every man might know his works and never transgress all his commandments, and keep my handwriting from generation to generation." },
  { t = "v", n = 6, text = "When all creation visible and invisible, as the Lord created it, shall end, then every man goes to the great judgement," },
  { t = "v", n = 7, text = "and then all time shall perish, and the years, and thenceforward there will be neither months nor days nor hours, they will be stuck together and will not be counted." },
  { t = "v", n = 8, text = "There will be one aeon, and all the righteous who shall escape the Lord's great judgement, shall be collected in the great aeon, for the righteous the great aeon will begin, and they will live eternally," },
  { t = "v", n = 9, text = "and then too there will be amongst them neither labour, nor sickness, nor humiliation, nor anxiety, nor need, nor violence, nor night, nor darkness, but. great light." },
  { t = "v", n = 10, text = "And they shall have a great indestructible wall, and a paradise bright and incorruptible, for all corruptible things shall pass away, and there will be eternal life." },
]

[[section]]
id = "66"
title = "Chapter 66"
level = 1
blocks = [
  { t = "h", level = 3, text = "Enoch instructs his sons and all the elders of the people, how they are to walk with terror and trembling before the Lord, and serve him alone and not bow down to idols, but to God, who created heaven and earth and. every creature, and to his image." },
  { t = "v", n = 1, text = "And now, my children, keep your souls from all injustice, such as the Lord hates. Walk before his face with terror and trembling and serve him alone." },
  { t = "v", n = 2, text = "Bow down to the true God, not to dumb idols, but bow down to his picture, and bring all just offerings before the Lord's face. The Lord hates what is unjust." },
  { t = "v", n = 3, text = "For the Lord sees all things; when man takes thought in his heart, then he counsels the intellects, and every thought is always before the Lord, who made firm the earth and put all creatures on it." },
  { t = "v", n = 4, text = "If you look to heaven, the Lord is there; if you take thought of the sea's deep and all the under-earth, the Lord is there." },
  { t = "v", n = 5, text = "For the Lord created all things. Bow not down to things made by man, leaving the Lord of all creation, because no work can remain hidden before the Lord's face." },
  { t = "v", n = 6, text = "Walk, my children, in long-suffering, in meekness, honesty, in provocation, in grief, in faith and in truth, in reliance on promises, in illness, in abuse, in wounds, in temptation, in nakedness, in privation, loving one another, till you go out from this age of ills, that you become inheritors of endless time." },
  { t = "v", n = 7, text = "Blessed are the just who shall escape the great judgement, for they shall shine forth more than the sun sevenfold," },
  { t = "v", n = 8, text = "for in this world the seventh part is taken off from all, light, darkness, food, enjoyment, sorrow, paradise, torture, fire, frost, and other things; he put all down in writing, that you might read and understand.'" },
]

[[section]]
id = "67"
title = "Chapter 67"
level = 1
blocks = [
  { t = "h", level = 3, text = "The Lord let out darkness on to earth and covered the people and Enoch, and he was taken up on high, and light came again in the heaven." },
  { t = "v", n = 1, text = "When Enoch had talked to the people, the Lord sent out darkness on to the earth, and there was darkness, and it covered those men standing and talking with Enoch," },
  { t = "v", n = 2, text = "and they took Enoch up on to the highest heaven, where the Lord is; and he received him and placed him before his face, and the darkness went off from the earth, and light came again." },
  { t = "v", n = 3, text = "And the people saw and understood not how Enoch had been taken, and glorified God, and found a roll in which was traced 'the invisible God'; and all went to their homes." },
]

[[section]]
id = "68"
title = "Chapter 68"
level = 1
blocks = [
  { t = "v", n = 1, text = "Enoch was born on the sixth day of the month Tsivan, and lived three hundred and sixty-five years. He was taken up to heaven on the first day of the month Tsivan and remained in heaven sixty days." },
  { t = "v", n = 2, text = "He wrote all these signs of all creation, which the Lord created, and wrote three hundred and sixty-six books," },
  { t = "v", n = 3, text = "and handed them over to his sons and remained on earth thirty days, and was again taken up to heaven on the sixth day of the month Tsivan, on the very day and hour when he was born." },
  { t = "v", n = 4, text = "As every man's nature in this life is dark, so are also his conception, birth, and departure from this life. At what hour he was conceived, at that hour he was born, and at that hour too he died." },
  { t = "v", n = 5, text = "Methosalam and his brethren, all the sons of Enoch, made haste, and erected an altar at the place called Achuzan, whence and where Enoch had been taken up to heaven." },
  { t = "v", n = 6, text = "And they took sacrificial oxen and summoned all people and sacrificed the sacrifice before the Lord's face." },
  { t = "v", n = 7, text = "All people, the elders of the people and the whole assembly came to the feast and brought gifts to the sons of Enoch. And they made a great feast, rejoicing and making merry three days, praising God, who had given them such a sign through Enoch, who had found favour with him, and that they should hand it on to their sons from generation to generation, from age to age. Amen." },
]

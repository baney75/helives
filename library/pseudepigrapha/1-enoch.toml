[work]
id = "1-enoch"
title = "The Book of Enoch"
short_title = "1 Enoch"
author = "pseudepigrapha-anonymous"
collection = "pseudepigrapha"
order = 1
date = "3rd to 1st century BC (Charles dates its parts from before 170 BC to about 64 BC)"
language = "Ge'ez (Ethiopic), from Aramaic and Hebrew originals; Greek fragments"
translator = "R. H. Charles"
edition = "The Book of Enoch, translated by R. H. Charles, with an introduction by W. O. E. Oesterley (London: SPCK, 1917), Translations of Early Documents, Series I"
source_url = "https://archive.sacred-texts.com/bib/boe/index.htm"
source_sha256 = "9c1007f98ea7286f93eae6c93b0a499c37db4dc8c7b1f68808d3f55b159462bc"
retrieved = "2026-11-21"
license = "Public domain"
license_basis = "Published in London by the Society for Promoting Christian Knowledge in 1917; in the public domain in the United States because it was published before 1931. Text checked against the archive.org scan of the 1917 printing (bookofenoch0000unse)."
words = 38050
summary = "An ancient Jewish apocalypse, written in parts between the third and first centuries BC, that tells of Enoch's visions of the fallen Watchers, the judgment and the Messiah. It is quoted in Jude 14 and 15, was read by many early Christians, and is canonical in the Ethiopian Orthodox Tewahedo Church, but it is outside the Protestant and Catholic canons. It is not Scripture."

[[section]]
id = "abbreviations"
title = "Abbreviations, Brackets and Symbols"
level = 1
blocks = [
  { t = "p", text = "E denotes the Ethiopic Version." },
  { t = "p", text = "Gs denotes the fragments of the Greek Version preserved In Syncellus: in the case of 8b-9b there are two forms of the text, Gs1 Gs2." },
  { t = "p", text = "Gg denotes the large fragment of the Greek Version discovered at Akhmîm, and deposited in the Gizeh Museum, Cairo." },
  { t = "p", text = "The following brackets are used in the translation of 1 Enoch:" },
  { t = "p", text = "⌈ ⌉. The use of these brackets means that the words so enclosed are found in Gg but not In E." },
  { t = "p", text = "⌈⌈ ⌉⌉. The use of these brackets means that the words so enclosed are found in E but not in Gg or Gs." },
  { t = "p", text = "〈 〉. The use of these brackets means that the words so enclosed are restored." },
  { t = "p", text = "[ ] The use of these brackets means that the words so enclosed are interpolations." },
  { t = "p", text = "( ). The use of these brackets means that the words so enclosed are supplied by the editor." },
  { t = "p", text = "The use of **thick type** denotes that the words so printed are emended." },
  { t = "p", text = "† † corruption in the text." },
  { t = "p", text = ". . . = some words which have been lost." },
]

[[section]]
id = "1"
title = "Chapter 1"
level = 1
blocks = [
  { t = "h", level = 2, text = "BOOK OF ENOCH I-XXXVI" },
  { t = "h", level = 3, text = "I-V. Parable of Enoch on the Future Lot of the Wicked and the Righteous" },
  { t = "v", n = 1, p = true, text = "The words of the blessing of Enoch, wherewith he blessed the elect ⌈⌈and⌉⌉ righteous, who will be living in the day of tribulation, when all the wicked ⌈⌈and godless⌉⌉ are to be removed." },
  { t = "v", n = 2, text = "And he took up his parable and said—Enoch a righteous man, whose eyes were opened by God, saw the vision of the Holy One in the heavens, ⌈which⌉ the angels showed me, and from them I heard everything, and from them I understood as I saw, but not for this generation, but for a remote one which is for to come." },
  { t = "v", n = 3, text = "Concerning the elect I said, and took up my parable concerning them:" },
  { t = "v", n = 3, indent = 1, p = true, cont = true, text = "The Holy Great One will come forth from His dwelling," },
  { t = "v", n = 4, indent = 1, text = "And the eternal God will tread upon the earth, (even) on Mount Sinai," },
  { t = "v", n = 4, indent = 1, cont = true, text = "⌈And appear from His camp⌉" },
  { t = "v", n = 4, indent = 1, cont = true, text = "And appear in the strength of His might from the heaven of heavens." },
  { t = "v", n = 5, indent = 1, p = true, text = "And all shall be smitten with fear" },
  { t = "v", n = 5, indent = 1, cont = true, text = "And the Watchers shall quake," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And great fear and trembling shall seize them unto the ends of the earth." },
  { t = "v", n = 6, indent = 1, p = true, text = "And the high mountains shall be shaken," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And the high hills shall be made low," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And shall melt like wax before the flame" },
  { t = "v", n = 7, indent = 1, p = true, text = "And the earth shall be ⌈wholly⌉ rent in sunder," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And all that is upon the earth shall perish," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And there shall be a judgement upon all (men)." },
  { t = "v", n = 8, indent = 1, p = true, text = "But with the righteous He will make peace." },
  { t = "v", n = 8, indent = 1, p = true, cont = true, text = "And will protect the elect," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And mercy shall be upon them." },
  { t = "v", n = 8, indent = 1, p = true, cont = true, text = "And they shall all belong to God," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And they shall be prospered," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And they shall ⌈all⌉ be blessed." },
  { t = "v", n = 8, indent = 1, p = true, cont = true, text = "⌈And He will help them all⌉," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And light shall appear unto them," },
  { t = "v", n = 8, indent = 1, cont = true, text = "⌈And He will make peace with them⌉." },
  { t = "v", n = 9, indent = 1, p = true, text = "And behold! He cometh with ten thousands of ⌈His⌉ holy ones" },
  { t = "v", n = 9, indent = 1, cont = true, text = "To execute judgement upon all," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And to destroy ⌈all⌉ the ungodly:" },
  { t = "v", n = 9, indent = 1, p = true, cont = true, text = "And to convict all flesh" },
  { t = "v", n = 9, indent = 1, cont = true, text = "Of all the works ⌈of their ungodliness⌉ which they have ungodly committed," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And of all the hard things which ungodly sinners ⌈have spoken⌉ against Him." },
]

[[section]]
id = "2"
title = "Chapter 2"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Observe ye everything that takes place in the heaven, how they do not change their orbits, ⌈and⌉ the luminaries which are in the heaven, how they all rise and set in order each in its season, and transgress not against their appointed order." },
  { t = "v", n = 2, text = "Behold ye the earth, and give heed to the things which take place upon it from first to last, ⌈how **steadfast** they are⌉, how ⌈none of the things upon earth⌉ change, ⌈but⌉ all the works of God appear ⌈to you⌉." },
  { t = "v", n = 3, text = "Behold the summer and the winter, ⌈⌈how the whole earth is filled with water, and clouds and dew and rain lie upon it⌉⌉." },
]

[[section]]
id = "3"
title = "Chapter 3"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Observe and see how (in the winter) all the trees ⌈⌈seem as though they had withered and shed all their leaves, except fourteen trees, which do not lose their foliage but retain the old foliage from two to three years till the new comes." },
]

[[section]]
id = "4"
title = "Chapter 4"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And again, observe ye the days of summer how the sun is above the earth over against it. And you seek shade and shelter by reason of the heat of the sun, and the earth also burns with glowing heat, and so you cannot tread on the earth, or on a rock by reason of its heat." },
]

[[section]]
id = "5"
title = "Chapter 5"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Observe ⌈⌈ye⌉⌉ how the trees cover themselves with green leaves and bear fruit: wherefore give ye heed ⌈and know⌉ with regard to all ⌈His works⌉, and recognize how He that liveth for ever hath made them so." },
  { t = "v", n = 2, p = true, text = "And ⌈all⌉ His works go on ⌈thus⌉ from year to year for ever, and all the tasks ⌈which⌉ they accomplish for Him, and ⌈their tasks⌉ change not, but according as ⌈⌈God⌉⌉ hath ordained so is it done." },
  { t = "v", n = 3, p = true, text = "And behold how the sea and the rivers in like manner accomplish and ⌈change not⌉ their tasks ⌈from His commandments⌉." },
  { t = "v", n = 4, indent = 1, p = true, text = "But ye—ye have not been steadfast, nor done the commandments of the Lord," },
  { t = "v", n = 4, indent = 1, cont = true, text = "But ye have turned away and spoken proud and hard words" },
  { t = "v", n = 4, indent = 1, cont = true, text = "With your impure mouths against His greatness." },
  { t = "v", n = 4, indent = 1, cont = true, text = "Oh, ye hard-hearted, ye shall find no peace." },
  { t = "v", n = 5, indent = 1, p = true, text = "Therefore shall ye execrate your days," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And the years of your life shall perish," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And ⌈the years of your destruction⌉ shall be multiplied in eternal execration," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And ye shall find no mercy." },
  { t = "v", n = 6, indent = 1, p = true, text = "*a*. In those days ye shall make your names an eternal execration unto all the righteous," },
  { t = "v", n = 6, indent = 1, cont = true, text = "*b*. And by you shall ⌈all⌉ who curse, curse," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And all the sinners ⌈and godless⌉ shall imprecate by you," },
  { t = "v", n = 7, indent = 1, text = "*c*. And for you the godless there shall be a curse." },
  { t = "v", n = 6, indent = 1, p = true, text = "*d*. And all the . . . shall rejoice," },
  { t = "v", n = 6, indent = 1, cont = true, text = "*e*. And there shall be forgiveness of sins," },
  { t = "v", n = 6, indent = 1, cont = true, text = "*f*. And every mercy and peace and forbearance:" },
  { t = "v", n = 6, indent = 1, p = true, cont = true, text = "*g*. There shall be salvation unto them, a goodly light." },
  { t = "v", n = 6, indent = 1, p = true, cont = true, text = "*i*. And for all of you sinners there shall be no salvation," },
  { t = "v", n = 6, indent = 1, cont = true, text = "*j* But on you all shall abide a curse." },
  { t = "v", n = 7, indent = 1, text = "*a*. But for the elect there shall be light and joy and peace," },
  { t = "v", n = 7, indent = 1, cont = true, text = "*b*. And they shall inherit the earth." },
  { t = "v", n = 8, indent = 1, p = true, text = "And then there shall be bestowed upon the elect wisdom," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And they shall all live and never again sin," },
  { t = "v", n = 8, indent = 1, cont = true, text = "Either through ungodliness or through pride:" },
  { t = "v", n = 8, indent = 1, cont = true, text = "But they who are wise shall be humble." },
  { t = "v", n = 9, indent = 1, p = true, text = "And they shall not again transgress," },
  { t = "v", n = 9, indent = 1, cont = true, text = "Nor shall they sin all the days of their life," },
  { t = "v", n = 9, indent = 1, cont = true, text = "Nor shall they die of (the divine) anger or wrath," },
  { t = "v", n = 9, indent = 1, cont = true, text = "But they shall complete the number of the days of their life." },
  { t = "v", n = 9, indent = 1, p = true, cont = true, text = "And their lives shall be increased in peace," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And the years of their joy shall be multiplied," },
  { t = "v", n = 9, indent = 1, cont = true, text = "In eternal gladness and peace," },
  { t = "v", n = 9, indent = 1, cont = true, text = "All the days of their life." },
  { t = "v", n = 9, p = true, cont = true, text = "VI-XI. *The Fall of the Angels: the Demoralisation of Mankind: the Intercession of the Angels on behalf of Mankind. The Dooms pronounced by God on the Angels: the Messianic Kingdom* (a Noah fragment)." },
]

[[section]]
id = "6"
title = "Chapter 6"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And it came to pass when the children of men had multiplied that in those days were born unto them beautiful and comely daughters." },
  { t = "v", n = 2, text = "And the angels, the children of the heaven, saw and lusted after them, and said to one another: 'Come, let us choose us wives from among the children of men and beget us children.'" },
  { t = "v", n = 3, text = "And Semjâzâ, who was their leader, said unto them: 'I fear ye will not indeed agree to do this deed, and I alone shall have to pay the penalty of a great sin.'" },
  { t = "v", n = 4, text = "And they all answered him and said: 'Let us all swear an oath, and all bind ourselves by mutual imprecations not to abandon this plan but to do this thing.'" },
  { t = "v", n = 5, text = "Then sware they all together and bound themselves by mutual imprecations upon it." },
  { t = "v", n = 6, text = "And they were in all two hundred; who descended ⌈in the days⌉ of **Jared** on the summit of Mount Hermon, and they called it Mount Hermon, because they had sworn and bound themselves by mutual imprecations upon it." },
  { t = "v", n = 7, text = "And these are the names of their leaders: Sêmîazâz, their leader, Arâkîba, Râmêêl, Kôkabîêl, Tâmîêl, Râmîêl, Dânêl, Êzêqêêl, Barâqîjâl, Asâêl, Armârôs, Batârêl, Anânêl, Zaqîêl, Samsâpêêl, Satarêl, Tûrêl, Jômjâêl, Sariêl." },
  { t = "v", n = 8, text = "These are their chiefs of tens." },
]

[[section]]
id = "7"
title = "Chapter 7"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And all the others together with them took unto themselves wives, and each chose for himself one, and they began to go in unto them and to defile themselves with them, and they taught them charms and enchantments, and the cutting of roots, and made them acquainted with plants." },
  { t = "v", n = 2, text = "And they became pregnant, and they bare great giants, whose height was three thousand ells:" },
  { t = "v", n = 3, text = "Who consumed all the acquisitions of men. And when men could no longer sustain them," },
  { t = "v", n = 4, text = "the giants turned against them and devoured mankind." },
  { t = "v", n = 5, text = "And they began to sin against birds, and beasts, and reptiles, and fish, and to devour one another's flesh, and drink the blood." },
  { t = "v", n = 6, text = "Then the earth laid accusation against the lawless ones." },
]

[[section]]
id = "8"
title = "Chapter 8"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And Azâzêl taught men to make swords, and knives, and shields, and breastplates, and made known to them **the metals** 〈of the earth〉 and the art of working them, and bracelets, and ornaments, and the use of antimony, and the beautifying of the eyelids, and all kinds of costly stones, and all colouring tinctures." },
  { t = "v", n = 2, text = "And there arose much godlessness, and they committed fornication, and they were led astray, and became corrupt in all their ways. Semjâzâ taught enchantments, and root-cuttings, Armârôs the resolving of enchantments, Barâqîjâl, (taught) astrology, Kôkabêl the constellations, **Ezêqêêl the knowledge of the clouds**, 〈Araqiêl the signs of the earth, Shamsiêl the signs of the sun〉, and Sariêl the course of the moon. And as men perished, they cried, and their cry went up to heaven . . ." },
]

[[section]]
id = "9"
title = "Chapter 9"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And then Michael, Uriel, Raphael, and Gabriel looked down from heaven and saw much blood being shed upon the earth, and all lawlessness being wrought upon the earth." },
  { t = "v", n = 2, text = "And they said one to another: 'The earth made †without inhabitant cries the voice of their crying† up to the gates of heaven." },
  { t = "v", n = 3, text = "⌈⌈And now to you, the holy ones of heaven⌉⌉, the souls of men make their suit, saying, \"Bring our cause before the Most High.\".'" },
  { t = "v", n = 4, text = "And they said to the Lord **of the ages**: 'Lord of lords, God of gods, King of kings, 〈and God of the ages〉, the throne of Thy glory (standeth) unto all the generations of the ages, and Thy name holy and glorious and blessed unto all the ages!" },
  { t = "v", n = 5, text = "Thou hast made all things, and power over all things hast Thou: and all things are naked and open in Thy sight, and all things Thou seest, and nothing can hide itself from Thee." },
  { t = "v", n = 6, text = "Thou seest what Azâzêl hath done, who hath taught all unrighteousness on earth and revealed the eternal secrets which were (preserved) in heaven, which men were striving to **learn**:" },
  { t = "v", n = 7, text = "And Semjâzâ, to whom Thou hast given authority to bear rule over his associates." },
  { t = "v", n = 8, text = "And they have gone to the daughters of men upon the earth, and have slept with the women, and have defiled themselves, and revealed to them all kinds of sins." },
  { t = "v", n = 9, text = "And the women have borne giants, and the whole earth has thereby been filled with blood and unrighteousness." },
  { t = "v", n = 10, text = "And now, behold, the souls of those who have died are crying and making their suit to the gates of heaven, and their lamentations have ascended: and cannot **cease** because of the lawless deeds which are wrought on the earth." },
  { t = "v", n = 11, text = "And Thou knowest all things before they come to pass, and Thou seest these things and Thou dost suffer them, and Thou dost not say to us what we are to do to them in regard to these.'" },
]

[[section]]
id = "10"
title = "Chapter 10"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Then said the Most High, the Holy and Great One spake, and sent **Uriel** to the son of Lamech, and said to him:" },
  { t = "v", n = 2, text = "'〈Go to Noah〉 and tell him in my name \"Hide thyself!\" and reveal to him the end that is approaching: that the whole earth will be destroyed, and a deluge is about to come upon the whole earth, and will destroy all that is on it." },
  { t = "v", n = 3, text = "And now instruct him that he may escape and his seed may be preserved for all the generations of the world.'" },
  { t = "v", n = 4, text = "And again the Lord said to Raphael: 'Bind Azâzêl hand and foot, and cast him into the darkness: and make an opening in the desert, which is in Dûdâêl, and cast him therein." },
  { t = "v", n = 5, text = "And place upon him rough and jagged rocks, and cover him with darkness, and let him abide there for ever, and cover his face that he may not see light." },
  { t = "v", n = 6, text = "And on the day of the great judgement he shall be cast into the fire." },
  { t = "v", n = 7, text = "And heal the earth which the angels have corrupted, and proclaim the healing of the earth, that they may heal the plague, and that all the children of men may not perish through all the secret things that the Watchers have **disclosed** and have taught their sons." },
  { t = "v", n = 8, text = "And the whole earth has been corrupted through the works that were taught by Azâzêl: to him ascribe all sin.'" },
  { t = "v", n = 9, text = "And to Gabriel said the Lord: 'Proceed against the bastards and the reprobates, and against the children of fornication: and destroy [the children of fornication and] the children of the Watchers from amongst men [and cause them to go forth]: send them one against the other that they may destroy each other in battle: for length of days shall they not have." },
  { t = "v", n = 10, text = "And no request that they *(i.e.* their fathers) make of thee shall be granted unto their fathers on their behalf; for they hope to live an eternal life, and that each one of them will live five hundred years.'" },
  { t = "v", n = 11, text = "And the Lord said unto Michael: 'Go, **bind** Semjâzâ and his associates who have united themselves with women so as to have defiled themselves with them in all their uncleanness." },
  { t = "v", n = 12, text = "And when their sons have slain one another, and they have seen the destruction of their beloved ones, bind them fast for seventy generations in the **valleys** of the earth, till the day of their judgement and of their consummation, till the judgement that is for ever and ever is consummated." },
  { t = "v", n = 13, text = "In those days they shall be led off to the abyss of fire: 〈and〉 to the torment and the prison in which they shall be confined for ever." },
  { t = "v", n = 14, text = "And whosoever shall be **condemned** and destroyed will from thenceforth be bound together with them to the end of all generations." },
  { t = "v", n = 15, text = "And destroy all the spirits of the reprobate and the children of the Watchers, because they have wronged mankind." },
  { t = "v", n = 16, text = "Destroy all wrong from the face of the earth and let every evil work come to an end: and let the plant of righteousness and truth appear: ⌈and it shall prove a blessing; the works of righteousness and truth⌉ shall be planted in truth and joy for evermore." },
  { t = "v", n = 17, indent = 1, p = true, text = "And then shall all the righteous escape," },
  { t = "v", n = 17, indent = 1, cont = true, text = "And shall live till they beget thousands of children," },
  { t = "v", n = 17, indent = 1, cont = true, text = "And all the days of their youth and their **old age**" },
  { t = "v", n = 17, indent = 1, cont = true, text = "Shall they complete in peace." },
  { t = "v", n = 18, p = true, text = "And then shall the whole earth be tilled in righteousness, and shall all be planted with trees and be full of blessing." },
  { t = "v", n = 19, text = "And all desirable trees shall be planted on it, and they shall plant vines on it: and the vine which they plant thereon shall yield wine in abundance, and as for all the seed which is sown thereon each measure (of it) shall bear a thousand, and each measure of olives shall yield ten presses of oil." },
  { t = "v", n = 20, text = "And cleanse thou the earth from all oppression, and from all unrighteousness, and from all sin, and from all godlessness: and all the uncleanness that is wrought upon the earth destroy from off the earth." },
  { t = "v", n = 21, text = "⌈And all the children of men shall become righteous⌉, and all nations shall offer adoration and shall praise Me, and all shall worship Me. And the earth shall be cleansed from all defilement, and from all sin, and from all punishment, and from all torment, and I will never again send (them) upon it from generation to generation and for ever." },
]

[[section]]
id = "11"
title = "Chapter 11"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And in those days I will open the store chambers of blessing which are in the heaven, so as to send them down ⌈upon the earth⌉ over the work and labour of the children of men." },
  { t = "v", n = 2, text = "And truth and peace shall be associated together throughout all the days of the world and throughout all the generations **of men**.'" },
  { t = "v", n = 2, p = true, cont = true, text = "XII-XVI. *Dream Vision of Enoch: his intercession for Azâzêl and the fallen Angels: and his announcement to them of their first and final doom*." },
]

[[section]]
id = "12"
title = "Chapter 12"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Before these things Enoch was hidden, and no one of the children of men knew where he was hidden, and where he abode, and what had become of him." },
  { t = "v", n = 2, text = "And his activities had to do with the Watchers, and his days were with the holy ones." },
  { t = "v", n = 3, p = true, text = "And I, Enoch was blessing the Lord of **majesty** and the King of the ages, and lo! the Watchers called me—Enoch the scribe—and said to me:" },
  { t = "v", n = 4, text = "'Enoch, thou scribe of righteousness, go, †declare† to the Watchers of the heaven who have left the high heaven, the holy eternal place, and have defiled themselves with women, and have done as the children of earth do, and have taken unto themselves wives: \"Ye have wrought great destruction on the earth:" },
  { t = "v", n = 5, text = "And ye shall have no peace nor forgiveness of sin: and inasmuch as †they† delight themselves in †their† children," },
  { t = "v", n = 6, text = "The murder of †their† beloved ones shall †they† see, and over the destruction of †their† children shall †they† lament, and shall make supplication unto eternity, but mercy and peace shall ye not attain.\"'" },
]

[[section]]
id = "13"
title = "Chapter 13"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And Enoch went and said: 'Azâzêl, thou shalt have no peace: a severe sentence has gone forth against thee to put thee in bonds:" },
  { t = "v", n = 2, text = "And thou shalt not have toleration nor †request† granted to thee, because of the unrighteousness which thou hast taught, and because of all the works of godlessness and unrighteousness and sin which thou hast shown to men.'" },
  { t = "v", n = 3, text = "Then I went and spoke to them all together, and they were all afraid, and fear and trembling seized them." },
  { t = "v", n = 4, text = "And they besought me to draw up a petition for them that they might find forgiveness, and to read their petition in the presence of the Lord of heaven." },
  { t = "v", n = 5, text = "For from thenceforward they could not speak (with Him) nor lift up their eyes to heaven for shame of their sins for which they had been condemned." },
  { t = "v", n = 6, text = "Then I wrote out their petition, and the prayer in regard to their spirits and their deeds individually and in regard to their requests that they should have forgiveness and length 〈of days〉†." },
  { t = "v", n = 7, text = "And I went off and sat down at the waters of Dan, in the land of Dan, to the south of the west of Hermon: I read their petition till I fell asleep." },
  { t = "v", n = 8, text = "And behold a dream came to me, and visions fell down upon me, and I saw visions of chastisement, ⌈and a voice came bidding (me)⌉ to tell it to the sons of heaven, and reprimand them." },
  { t = "v", n = 9, text = "And when I awaked, I came unto them, and they were all sitting gathered together, weeping in ’Abelsjâîl, which is between Lebanon and Sênêsêr, with their faces covered." },
  { t = "v", n = 10, text = "And I recounted before them all the visions which I had seen in sleep, and I began to speak the words of righteousness, and to reprimand the heavenly Watchers." },
]

[[section]]
id = "14"
title = "Chapter 14"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "The book of the words of righteousness, and of the reprimand of the eternal Watchers in accordance with the command of the Holy Great One in that vision." },
  { t = "v", n = 2, text = "I saw in my sleep what I will now say with a tongue of flesh and with the breath of my mouth: which the Great One has given to men to converse therewith and understand with the heart." },
  { t = "v", n = 3, text = "As He hath created and given ⌈⌈to man the power of understanding the word of wisdom, so hath He created me also and given⌉⌉ me the power of reprimanding the Watchers, the children of heaven." },
  { t = "v", n = 4, text = "I wrote out your petition, and in my vision it appeared thus, that your petition will not be granted unto you ⌈⌈throughout all the days of eternity, and that judgement has been finally passed upon you: yea (your petition) will not be granted unto you⌉⌉." },
  { t = "v", n = 5, text = "And from henceforth you shall not ascend into heaven unto all eternity, and ⌈in bonds⌉ of the earth the decree has gone forth to bind you for all the days of the world." },
  { t = "v", n = 6, text = "And (that) previously you shall have seen the destruction of your beloved sons and ye shall have no pleasure in them, but they shall fall before you by the sword." },
  { t = "v", n = 7, text = "And your petition on their behalf shall not be granted, nor yet on your own: even though you weep and pray and **speak all the words** contained in the writing which I have written." },
  { t = "v", n = 8, text = "And the vision was shown to me thus: Behold, in the vision clouds invited me and a mist summoned me, and the course of the stars and the lightnings sped and **hastened** me, and the winds in the vision caused me to fly and lifted me upward, and bore me into heaven." },
  { t = "v", n = 9, text = "And I went in till I drew nigh to a wall which is built of crystals and surrounded by tongues of fire: and it began to affright me." },
  { t = "v", n = 10, text = "And I went into the tongues of fire and drew nigh to a large house which was built of crystals: and the walls of the house were like a tesselated floor (made) of crystals, and its groundwork was of crystal." },
  { t = "v", n = 11, text = "Its ceiling was like the path of the stars and the lightnings, and between them were fiery cherubim, and their heaven was (clear as) water." },
  { t = "v", n = 12, text = "A flaming fire surrounded the walls, and its portals blazed with fire." },
  { t = "v", n = 13, text = "And I entered into that house, and it was hot as fire and cold as ice: there were no delights of life therein: fear covered me, and trembling got hold upon me." },
  { t = "v", n = 14, text = "And as I quaked and trembled, I fell upon my face." },
  { t = "v", n = 15, text = "And I beheld a vision, And lo! there was a second house, greater than the former, and the entire portal stood open before me, and it was built of flames of fire." },
  { t = "v", n = 16, text = "And in every respect it so excelled in splendour and magnificence and extent that I cannot describe to you its splendour and its extent." },
  { t = "v", n = 17, text = "And its floor was of fire, and above it were lightnings and the path of the stars, and its ceiling also was flaming fire." },
  { t = "v", n = 18, text = "And I looked and saw ⌈⌈therein⌉⌉ a lofty throne: its appearance was as crystal, and the wheels thereof as the shining sun, and there was the **vision** of cherubim." },
  { t = "v", n = 19, text = "And from underneath the throne came streams of flaming fire so that I could not look thereon." },
  { t = "v", n = 20, text = "And the Great Glory sat thereon, and His raiment shone more brightly than the sun and was whiter than any snow." },
  { t = "v", n = 21, text = "None of the angels could enter and could behold His face by reason of the magnificence and glory and no flesh could behold Him." },
  { t = "v", n = 22, text = "The flaming fire was round about Him, and a great fire stood before Him, and none around could draw nigh Him: ten thousand times ten thousand (stood) before Him, yet He needed no counselor." },
  { t = "v", n = 23, text = "And the most holy ones who were nigh to Him did not leave by night nor depart from Him." },
  { t = "v", n = 24, text = "And until then I had been prostrate on my face, trembling: and the Lord called me with His own mouth, and said to me: 'Come hither, Enoch, and hear my word.'" },
  { t = "v", n = 25, text = "⌈And one of the holy ones came to me and waked me⌉, and He made me rise up and approach the door: and I bowed my face downwards." },
]

[[section]]
id = "15"
title = "Chapter 15"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And He answered and said to me, and I heard His voice: 'Fear not, Enoch, thou righteous man and scribe of righteousness: approach hither and hear my voice." },
  { t = "v", n = 2, text = "And go, say to ⌈⌈the Watchers of heaven⌉⌉, who have sent thee to intercede ⌈⌈for them: \"You should intercede\"⌉⌉ for men, and not men for you:" },
  { t = "v", n = 3, text = "Wherefore have ye left the high, holy, and eternal heaven, and lain with women, and defiled yourselves with the daughters of men and taken to yourselves wives, and done like the children of earth, and begotten giants (as your) sons?" },
  { t = "v", n = 4, text = "And though ye were holy, spiritual, living the eternal life, you have defiled yourselves with the blood of women, and have begotten (children) with the blood of flesh, and, **as the children** of men, have lusted after flesh and blood as those ⌈also⌉ do who die and perish." },
  { t = "v", n = 5, text = "Therefore have I given them wives also that they might impregnate them, and beget children by them, that thus nothing might be wanting to them on earth." },
  { t = "v", n = 6, text = "But you were ⌈formerly⌉ spiritual, living the eternal life, and immortal for all generations of the world." },
  { t = "v", n = 7, text = "And therefore I have not appointed wives for you; for as for the spiritual ones of the heaven, in heaven is their dwelling." },
  { t = "v", n = 8, text = "And now, the giants, who are produced from the spirits and flesh, shall be called evil spirits upon the earth, and on the earth shall be their dwelling." },
  { t = "v", n = 9, text = "Evil spirits have proceeded from their bodies; because they are born from **men**, ⌈⌈and⌉⌉ from the holy Watchers is their beginning and primal origin; ⌈they shall be evil spirits on earth, and⌉ evil spirits shall they be called. [" },
  { t = "v", n = 10, text = "As for the spirits of heaven, in heaven shall be their dwelling, but as for the spirits of the earth which were born upon the earth, on the earth shall be their dwelling.]" },
  { t = "v", n = 11, text = "And the spirits of the giants **afflict**, oppress, destroy, attack, do battle, and work destruction on the earth, and cause trouble: they take no food, ⌈but nevertheless hunger⌉ and thirst, and cause offences. And these spirits shall rise up against the children of men and against the women, because they have proceeded ⌈from them⌉." },
]

[[section]]
id = "16"
title = "Chapter 16"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "From the days of the slaughter and destruction and death ⌈of the giants⌉, from the souls of whose flesh the spirits, having gone forth, shall destroy without incurring judgement—thus shall they destroy until the day of the consummation, the great ⌈judgement⌉ in which the age shall be consummated, over the Watchers and the godless, yea, shall be wholly consummated.\"" },
  { t = "v", n = 2, text = "And now as to the Watchers who have sent thee to intercede for them, who had been ⌈⌈aforetime⌉⌉ in heaven, (say to them): \"" },
  { t = "v", n = 3, text = "You have been in heaven, but ⌈all⌉ the mysteries had not yet been revealed to you, and you knew worthless ones, and these in the hardness of your hearts you have made known to the women, and through these mysteries women and men work much evil on earth.\"" },
  { t = "v", n = 4, text = "Say to them therefore: \"You have no peace.\"'" },
]

[[section]]
id = "17"
title = "Chapter 17"
level = 1
blocks = [
  { t = "h", level = 3, text = "XVII-XXXVII. Enoch's Journeys through the Earth and Sheol." },
  { t = "h", level = 3, text = "XVII-XIX. The First Journey." },
  { t = "v", n = 1, p = true, text = "And they took ⌈and⌉ brought me to a place in which those who were there were like flaming fire, and, when they wished, they appeared as men." },
  { t = "v", n = 2, text = "And they brought me to the place of darkness, and to a mountain the point of whose summit reached to heaven." },
  { t = "v", n = 3, text = "And I saw the places of the luminaries ⌈and the treasuries of the stars⌉ and of the thunder ⌈and⌉ in the **uttermost depths**, where were a fiery bow and arrows and their quiver, and ⌈⌈a fiery sword⌉⌉ and all the lightnings." },
  { t = "v", n = 4, text = "And they took me to the living waters, and to the fire of the west, which receives every setting of the sun." },
  { t = "v", n = 5, text = "And I came to a river of fire in which the fire flows like water and discharges itself into the great sea towards the west." },
  { t = "v", n = 6, text = "I saw the great rivers and came to the great ⌈river and to the great⌉ darkness, and went to the place where no flesh walks." },
  { t = "v", n = 7, text = "I saw the mountains of the darkness of winter and the place whence all the waters of the deep flow." },
  { t = "v", n = 8, text = "I saw the mouths of all the rivers of the earth and the mouth of the deep." },
]

[[section]]
id = "18"
title = "Chapter 18"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "I saw the treasuries of all the winds: I saw how He had furnished with them the whole creation and the firm foundations of the earth." },
  { t = "v", n = 2, text = "And I saw the corner-stone of the earth: I saw the four winds which bear [the earth and] the firmament of the heaven." },
  { t = "v", n = 3, text = "⌈⌈And I saw how the winds stretch out the vaults of heaven⌉⌉, and have their station between heaven and earth: ⌈⌈these are the pillars of the heaven⌉⌉." },
  { t = "v", n = 4, text = "I saw the winds of heaven which turn and bring the circumference of the sun and all the stars to their setting." },
  { t = "v", n = 5, text = "I saw the winds on the earth carrying the clouds: I saw ⌈⌈the paths of the angels. I saw⌉⌉ at the end of the earth the firmament of the heaven above." },
  { t = "v", n = 6, text = "And I proceeded and saw a place which burns day and night, where there are seven mountains of magnificent stones, three towards the east, and three towards the south." },
  { t = "v", n = 7, text = "And as for those towards the east, 〈one〉 was of coloured stone, and one of pearl, and one of **jacinth**, and those towards the south of red stone." },
  { t = "v", n = 8, text = "But the middle one reached to heaven like the throne of God, of alabaster, and the summit of the throne was of sapphire." },
  { t = "v", n = 9, text = "And I saw a flaming fire. And beyond these mountains" },
  { t = "v", n = 10, text = "is a region the end of the great earth: there the heavens were completed." },
  { t = "v", n = 11, text = "And I saw a deep abyss, with columns ⌈⌈of heavenly fire, and among them I saw columns⌉⌉ of fire fall, which were beyond measure alike towards the height and towards the depth." },
  { t = "v", n = 12, text = "And beyond that abyss I saw a place which had no firmament of the heaven above, and no firmly founded earth beneath it: there was no water upon it, and no birds, but it was a waste and horrible place." },
  { t = "v", n = 13, text = "I saw there seven stars like great burning mountains, and to me, when I inquired regarding them," },
  { t = "v", n = 14, text = "The angel said: 'This place is the end of heaven and earth: this has become a prison for the stars and the host of heaven." },
  { t = "v", n = 15, text = "And the stars which roll over the fire are they which have transgressed the commandment of the Lord in the beginning of their rising, because they did not come forth at their appointed times." },
  { t = "v", n = 16, text = "And He was wroth with them, and bound them till the time when their guilt should be consummated (even) ⌈for ten thousand years⌉.'" },
]

[[section]]
id = "19"
title = "Chapter 19"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And Uriel said to me: 'Here shall stand the angels who have connected themselves with women, and their spirits assuming many different forms are defiling mankind and shall lead them astray into sacrificing to demons ⌈⌈as gods⌉⌉, (here shall they stand,) till ⌈⌈the day of⌉⌉ the great judgement in which they shall be judged till they are made an end of." },
  { t = "v", n = 2, text = "And the women also of the angels who went astray shall become sirens.'" },
  { t = "v", n = 3, text = "And I, Enoch, alone saw the vision, the ends of all things: and no man shall see as I have seen." },
]

[[section]]
id = "20"
title = "Chapter 20"
level = 1
blocks = [
  { t = "h", level = 3, text = "XX. Names and Functions of the Seven Archangels." },
  { t = "v", n = 1, p = true, text = "And these are the names of the holy angels who watch." },
  { t = "v", n = 2, text = "Uriel, one of the holy angels, who is over the world and over Tartarus." },
  { t = "v", n = 3, text = "Raphael, one of the holy angels, who is over the spirits of men." },
  { t = "v", n = 4, text = "Raguel, one of the holy angels who †takes vengeance on† the world of the luminaries." },
  { t = "v", n = 5, text = "Michael, one of the holy angels, to wit, he that is set over the best part of mankind ⌈⌈and⌉⌉ over chaos." },
  { t = "v", n = 6, text = "Saraqâêl, one of the holy angels, who is set over the spirits, who sin in the spirit." },
  { t = "v", n = 7, text = "Gabriel, one of the holy angels, who is over Paradise and the serpents and the Cherubim." },
  { t = "v", n = 8, text = "Remiel, one of the holy angels, whom God set over those who rise." },
]

[[section]]
id = "21"
title = "Chapter 21"
level = 1
blocks = [
  { t = "h", level = 3, text = "XXI. Preliminary and final place of punishment of the fallen angels (stars)." },
  { t = "v", n = 1, p = true, text = "And I proceeded to where things were chaotic." },
  { t = "v", n = 2, text = "And I saw there something horrible: I saw neither a heaven above nor a firmly founded earth, but a place chaotic and horrible." },
  { t = "v", n = 3, text = "And there I saw seven stars of the heaven bound together in it, like great mountains and burning with fire." },
  { t = "v", n = 4, text = "Then I said: 'For what sin are they bound, and on what account have they been cast in hither?'" },
  { t = "v", n = 5, text = "Then said Uriel, one of the holy angels, who was with me, and was chief over them, and said: 'Enoch, why dost thou ask, and why art thou eager for the truth?" },
  { t = "v", n = 6, text = "These are of the number of the stars ⌈of heaven⌉, which have transgressed the commandment of the Lord, and are bound here till ten thousand years, the time entailed by their sins, are consummated.'" },
  { t = "v", n = 7, text = "And from thence I went to another place, which was still more horrible than the former, and I saw a horrible thing: a great fire there which burnt and blazed, and the place was cleft as far as the abyss, being full of great descending columns of fire: neither its extent or magnitude could I see, nor could I conjecture." },
  { t = "v", n = 8, text = "Then I said: 'How fearful is the place and how terrible to look upon!'" },
  { t = "v", n = 9, text = "Then Uriel answered me, one of the holy angels who was with me, and said unto me: 'Enoch, why hast thou such fear and affright?' And I answered: 'Because of this fearful place, and because of the spectacle of the pain.'" },
  { t = "v", n = 10, text = "And he said ⌈⌈unto me⌉⌉: 'This place is the prison of the angels, and here they will be imprisoned for ever.'" },
]

[[section]]
id = "22"
title = "Chapter 22"
level = 1
blocks = [
  { t = "h", level = 3, text = "XXII. Sheol, or the Underworld." },
  { t = "v", n = 1, p = true, text = "And thence I went to another place, and he showed me in the west ⌈another⌉ great and high mountain [and] of hard rock." },
  { t = "h", level = 4, text = "E" },
  { t = "v", n = 2, p = true, text = "And there was in it †four† **hollow** places, deep and wide and very smooth. †How† smooth are **the hollow places** and deep and dark to look at." },
  { t = "h", level = 4, text = "Gg" },
  { t = "v", n = 2, p = true, text = "And there were †four† hollow places in it, deep and very smooth: †three† of them were dark and one bright; and there was a fountain of water in its midst. And I said: '†How† smooth are these hollow places, and deep and dark to view.'" },
  { t = "v", n = 3, p = true, text = "Then Raphael answered, one of the holy angels who was with me, and said unto me: 'These hollow places have been created for this very purpose, that the spirits of the souls of the dead should assemble therein, yea that all the souls of the children of men should assemble here." },
  { t = "v", n = 4, text = "And these places **have** **been made** to receive them till the day of their judgement and till their appointed period ⌈till the period appointed⌉, till the great judgement (comes) upon them.'" },
  { t = "h", level = 4, text = "E" },
  { t = "v", n = 5, p = true, text = "I saw the spirits of the children of men who were dead, and their voice went forth to heaven and made suit." },
  { t = "v", n = 6, text = "Then I asked Raphael the angel who was with me, and I said unto him: 'This spirit—whose is it whose voice goeth forth and maketh suit?'" },
  { t = "h", level = 4, text = "Gg" },
  { t = "v", n = 5, p = true, text = "I saw (the spirit of) **a dead man** making suit, and his voice went forth to heaven and made suit." },
  { t = "v", n = 6, text = "And I asked Raphael the angel who was with me, and I said unto him: 'This spirit which maketh suit, whose is it, whose voice goeth forth and maketh suit to heaven?'" },
  { t = "v", n = 7, p = true, text = "And he answered me saying: 'This is the spirit which went forth from Abel, whom his brother Cain slew, and he makes his suit against him till his seed is destroyed from the face of the earth, and his seed is annihilated from amongst the seed of men.'" },
  { t = "h", level = 4, text = "E" },
  { t = "v", n = 8, p = true, text = "Then I asked regarding it, and regarding all the **hollow places**: 'Why is one separated from the other?'" },
  { t = "v", n = 9, p = true, text = "And he answered me and said unto me: 'These three have been made that the spirits of the dead might be separated. And such a division has been made 〈for〉 the spirits of the righteous, in which there is the **bright** spring of **water**." },
  { t = "v", n = 10, text = "**And** such has been made for sinners when they die and are buried in the earth and judgement has not been executed on them in their lifetime." },
  { t = "v", n = 11, text = "Here their spirits shall be set apart in this great pain till the great day of judgement and punishment and torment of those who †curse† for ever, and retribution for their spirits. There He shall bind them for ever." },
  { t = "v", n = 12, text = "And such a division has been made for the spirits of those who make their suit, who make disclosures concerning their destruction, when they were slain in the days of the sinners." },
  { t = "v", n = 13, text = "Such has been made for the spirits of men who were not righteous but sinners, who were complete in transgression, and of the transgressors. they shall be companions: but their spirits shall not be slain in the day of judgement nor shall they be raised from thence." },
  { t = "v", n = 14, text = "Then I blessed the Lord of glory and said: 'Blessed be my Lord, the Lord of righteousness, who ruleth for ever.'" },
  { t = "h", level = 4, text = "Gg" },
  { t = "v", n = 8, p = true, text = "Then I asked regarding all the **hollow places**: 'Why is one separated from the other?'" },
  { t = "v", n = 9, p = true, text = "And he answered me saying: 'These three have been made that the spirits of the dead might be separated. And **this** division has been made for the spirits of the righteous, in which there is the bright spring of water." },
  { t = "v", n = 10, text = "And **this** has been made for sinners when they die and are buried in the earth and judgement has not been executed upon them in their lifetime." },
  { t = "v", n = 11, text = "Here their spirits shall be set apart in this great pain, till the great day of judgement, scourgings, and torments of the accursed for ever, **so that** (there maybe) retribution for their spirits. There He shall bind them for ever." },
  { t = "v", n = 12, text = "And **this** division has been made for the spirits of those who make their suit, who make disclosures concerning their destruction, when they were slain in the days of the sinners." },
  { t = "v", n = 13, text = "And **this** has been made for the spirits of men who shall not be righteous but sinners, who are godless, and of the lawless they shall be companions: but their spirits shall not be punished in the day of judgement nor shall they be raised from thence." },
  { t = "v", n = 14, text = "Then I blessed the Lord of Glory and said: 'Blessed art Thou, Lord of righteousness, who rulest over the world.'" },
]

[[section]]
id = "23"
title = "Chapter 23"
level = 1
blocks = [
  { t = "h", level = 3, text = "XXIII. The Fire that deals with the Luminaries of Heaven." },
  { t = "v", n = 1, p = true, text = "From thence I went to another place to the west of the ends of the earth." },
  { t = "v", n = 2, text = "And I saw a ⌈⌈burning⌉⌉ fire which ran without resting, and paused not from its course day or night but (ran) regularly." },
  { t = "v", n = 3, text = "And I asked saying: 'What is this which rests not?'" },
  { t = "v", n = 4, text = "Then Raguel, one of the holy angels who was with me, answered me ⌈⌈and said unto me⌉⌉: 'This course ⌈of fire⌉ ⌈⌈which thou hast seen⌉⌉ is the fire in the west which †persecutes† all the luminaries of heaven.'" },
]

[[section]]
id = "24"
title = "Chapter 24"
level = 1
blocks = [
  { t = "h", level = 3, text = "XXIV. XXV. The Seven Mountains in the North-West and the Tree of Life." },
  { t = "v", n = 1, p = true, text = "⌈⌈And from thence I went to another place of the earth⌉⌉, and he showed me a mountain range of fire which burnt ⌈⌈day and night⌉⌉." },
  { t = "v", n = 2, text = "And I went beyond it and saw seven magnificent mountains all differing each from the other, and the stones (thereof) were magnificent and beautiful, magnificent as a whole, of glorious appearance and fair exterior: ⌈⌈three towards⌉⌉ the east, ⌈⌈one⌉⌉ founded on the other, and three towards the south, one upon the other, and deep rough ravines, no one of which joined with any other." },
  { t = "v", n = 3, text = "And the seventh mountain was in the midst of these, and it excelled them in height, resembling the seat of a throne: and fragrant trees encircled the throne." },
  { t = "v", n = 4, text = "And amongst them was a tree such as I had never yet smelt, neither was any amongst them nor were others like it: it had a fragrance beyond all fragrance, and its leaves and blooms and wood wither not for ever: and its fruit ⌈⌈is beautiful, and its fruit⌉⌉ resembles the dates of a palm." },
  { t = "v", n = 5, text = "Then I said: '⌈How⌉ beautiful is this tree, and fragrant, and its leaves are fair, and its blooms ⌈⌈very⌉⌉ delightful in appearance.'" },
  { t = "v", n = 6, text = "Then answered Michael, one of the holy ⌈⌈and honoured⌉⌉ angels who was with me, and was their leader." },
]

[[section]]
id = "25"
title = "Chapter 25"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And he said unto me: 'Enoch, why dost thou ask me regarding the fragrance of the tree, and ⌈why⌉ dost thou wish to learn the truth?'" },
  { t = "v", n = 2, text = "Then I answered him ⌈⌈saying⌉⌉: 'I wish to know about everything, but especially about this tree.'" },
  { t = "v", n = 3, text = "And he answered saying: 'This high mountain ⌈⌈which thou hast seen⌉⌉, whose summit is like the throne of God, is His throne, where the Holy Great One, the Lord of Glory, the Eternal King, will sit, when He shall come down to visit the earth with goodness." },
  { t = "v", n = 4, text = "And as for this fragrant tree no mortal is permitted to touch it till the great judgement, when He shall take vengeance on all and bring (everything) to its consummation for ever. It shall then be given to the righteous and holy." },
  { t = "v", n = 5, text = "Its fruit **shall be** for food to the elect: it shall be transplanted to the holy place, to the temple of the Lord, the Eternal King." },
  { t = "v", n = 6, indent = 1, p = true, text = "Then shall they rejoice with joy and be glad," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And into the holy place shall they enter;" },
  { t = "v", n = 6, indent = 1, cont = true, text = "And its fragrance shall be in their bones," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And they shall live a long life on earth," },
  { t = "v", n = 6, indent = 1, cont = true, text = "Such as thy fathers lived:" },
  { t = "v", n = 6, indent = 1, cont = true, text = "And in their days shall no ⌈⌈sorrow or⌉⌉ plague" },
  { t = "v", n = 6, indent = 1, cont = true, text = "Or torment or calamity touch them.'" },
  { t = "v", n = 7, p = true, text = "Then blessed I the God of Glory, the Eternal King, who hath prepared such things for the righteous, and hath created them and promised to give to them." },
]

[[section]]
id = "26"
title = "Chapter 26"
level = 1
blocks = [
  { t = "h", level = 3, text = "Jerusalem and the Mountains, Ravines and Streams." },
  { t = "v", n = 1, p = true, text = "And I went from thence to the middle of the earth, and I saw a blessed place ⌈in which there were trees⌉ with branches abiding and blooming [of a dismembered tree]." },
  { t = "v", n = 2, text = "And there I saw a holy mountain, ⌈⌈and⌉⌉ underneath the mountain to the east there was a stream and it flowed towards the south." },
  { t = "v", n = 3, text = "And I saw towards the east another mountain higher than this, and between them a deep and narrow ravine: in it also ran a stream ⌈underneath⌉ the mountain." },
  { t = "v", n = 4, text = "And to the west thereof there was another mountain, lower than the former and of small elevation, and a ravine ⌈deep and dry⌉ between them: and another deep and dry ravine was at the extremities of the three ⌈mountains⌉." },
  { t = "v", n = 5, text = "And all the ravines were deep ⌈⌈and narrow⌉⌉, (being formed) of hard rock, and trees were not planted upon them." },
  { t = "v", n = 6, text = "And I marvelled ⌈⌈at the rocks, and I marvelled⌉⌉ at the ravine, yea, I marvelled very much." },
]

[[section]]
id = "27"
title = "Chapter 27"
level = 1
blocks = [
  { t = "h", level = 3, text = "XXVII. The Purpose of the Accursed Valley." },
  { t = "v", n = 1, p = true, text = "Then said I: 'For what object is this blessed land, which is entirely filled with trees, and this accursed valley ⌈⌈between⌉⌉?'" },
  { t = "v", n = 2, text = "⌈⌈Then Uriel, one of the holy angels who was with me, answered and said: 'This⌉⌉ accursed valley is for those who are accursed for ever: Here shall all ⌈the accursed⌉ be gathered together who utter with their lips against the Lord unseemly words and of His glory speak hard things." },
  { t = "h", level = 4, text = "E" },
  { t = "v", n = 2, p = true, cont = true, text = "Here shall they be gathered together, and here shall be their place of judgement." },
  { t = "v", n = 3, text = "In the last days there shall be upon them the spectacle of righteous judgement in the presence of the righteous for ever: here shall the merciful bless the Lord of glory, the Eternal King." },
  { t = "h", level = 4, text = "Gg" },
  { t = "v", n = 3, p = true, cont = true, text = "Here shall they be gathered together, and here shall be the place of their habitation." },
  { t = "v", n = 3, text = "In the last times, in the days of the true judgement in the presence of the righteous for ever: here shall the **godly** bless the Lord of Glory, the Eternal Kin." },
  { t = "v", n = 4, p = true, text = "In the days of judgement over the former, they shall bless Him for the mercy in accordance with which He has assigned them (their lot).'" },
  { t = "v", n = 5, text = "Then I blessed the Lord of Glory and set forth His ⌈glory⌉ and lauded Him gloriously." },
]

[[section]]
id = "28"
title = "Chapter 28"
level = 1
blocks = [
  { t = "h", level = 3, text = "XXVIII-XXXIII. Further Journey to the East." },
  { t = "v", n = 1, p = true, text = "And thence I went ⌈⌈towards the east⌉⌉, into the midst ⌈⌈of the mountain range of the desert⌉⌉, and I saw a wilderness and it was solitary, full of trees **and plant**s." },
  { t = "v", n = 2, text = "⌈⌈And⌉⌉ water gushed forth from above." },
  { t = "v", n = 3, text = "Rushing like a copious watercourse [which flowed] towards the north-west it caused clouds and dew to ascend on every side." },
]

[[section]]
id = "29"
title = "Chapter 29"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And thence I went to another place in the desert, and approached to the east of this mountain range." },
  { t = "v", n = 2, text = "And ⌈⌈there⌉⌉ I saw **aromatic** trees exhaling the fragrance of frankincense and myrrh, and the trees also were similar to the almond tree." },
]

[[section]]
id = "30"
title = "Chapter 30"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And beyond these, I went afar to the east, and I saw another place, a valley (full) of water." },
  { t = "v", n = 2, text = "And ⌈therein there was⌉ a tree, the colour (?) of fragrant trees such as the mastic." },
  { t = "v", n = 3, text = "And on the sides of those valleys I saw fragrant cinnamon. And beyond these I proceeded to the east." },
]

[[section]]
id = "31"
title = "Chapter 31"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And I saw other mountains, and amongst them were ⌈groves of⌉ trees, and there flowed forth from them nectar, which is named sarara and galbanum." },
  { t = "v", n = 2, text = "And beyond these mountains I saw another mountain ⌈to the east of the ends of the earth⌉, ⌈⌈whereon were aloe trees⌉⌉, and all the trees were full **of stacte**, being like almond-trees." },
  { t = "v", n = 3, text = "And when one **burnt** it, it smelt sweeter than any fragrant odour." },
]

[[section]]
id = "32"
title = "Chapter 32"
level = 1
blocks = [
  { t = "h", level = 4, text = "E" },
  { t = "v", n = 1, p = true, text = "And after these fragrant odours, as I looked towards the north over the mountains I saw seven mountains full of choice nard and fragrant trees and cinnamon and pepper." },
  { t = "h", level = 4, text = "Gg" },
  { t = "v", n = 1, p = true, text = "To the north-east I beheld seven mountains full of choice nard and mastic and cinnamon and pepper." },
  { t = "v", n = 2, p = true, text = "And thence I went over the summits of ⌈all⌉ these mountains, far towards the east ⌈of the earth⌉, and passed above the Erythraean sea and went far from it, and passed over ⌈⌈the angel⌉⌉ Zotîêl." },
  { t = "h", level = 4, text = "E" },
  { t = "v", n = 3, p = true, text = "And I came to the Garden of Righteousness, and saw beyond those trees many large trees growing there and of goodly fragrance, large, very beautiful and glorious, and the tree of wisdom whereof they eat and know great wisdom." },
  { t = "h", level = 4, text = "Gg" },
  { t = "v", n = 3, p = true, text = "And I came to the Garden of Righteousness, and from afar off trees more numerous than these trees and great—†two† trees there, very great, beautiful, and glorious, and magnificent, and the tree of knowledge, whose holy fruit they eat and know great wisdom." },
  { t = "v", n = 4, p = true, text = "⌈That tree is in height like the fir, and its leaves are⌉ like (those of) the Carob tree: and its fruit is like the clusters of the vine, very beautiful: and the fragrance of the tree penetrates afar." },
  { t = "v", n = 5, text = "Then I said: '⌈How⌉ beautiful is the tree, and how attractive is its look!'" },
  { t = "v", n = 6, text = "Then Raphael the holy angel, who was with me, answered me ⌈⌈and said⌉⌉: 'This is the tree of wisdom, of which thy father old (in years) and thy aged mother, who were before thee, have eaten, and they learnt wisdom and their eyes were opened, and they knew that they were naked and they were driven out of the garden.'" },
]

[[section]]
id = "33"
title = "Chapter 33"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And from thence I went to the ends of the earth and saw there great beasts, and each differed from the other; and (I saw) birds also differing in appearance and beauty and voice, the one differing from the other." },
  { t = "v", n = 2, text = "And to the east of those beasts I saw the ends of the earth whereon the heaven rests, and the portals of the heaven open." },
  { t = "v", n = 3, text = "And I saw how the stars of heaven come forth, and I counted the portals out of which they proceed, and wrote down all their outlets, of each individual star by itself, according to their number and their names, their courses and their positions, and their times and their months, as Uriel the holy angel who was with me showed me." },
  { t = "v", n = 4, text = "He showed all things to me and wrote them down for me: also their names he wrote for me, and their laws and their companies." },
]

[[section]]
id = "34"
title = "Chapter 34"
level = 1
blocks = [
  { t = "h", level = 3, text = "XXXIV. XXXV. Enoch's Journey to the North." },
  { t = "v", n = 1, p = true, text = "And from thence I went towards the north to the ends of the earth, and there I saw a great and glorious device at the ends of the whole earth." },
  { t = "v", n = 2, text = "And here I saw three portals of heaven open in the heaven: through each of them proceed north winds: when they blow there is cold, hail, frost, snow, dew, and rain." },
  { t = "v", n = 3, text = "And out of one portal they blow for good: but when they blow through the other two portals, it is with violence and affliction on the earth, and they blow with violence." },
]

[[section]]
id = "35"
title = "Chapter 35"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And from thence I went towards the west to the ends of the earth, and saw there three portals of the heaven open such as I had seen in the †east†, the same number of portals, and the same number of outlets." },
]

[[section]]
id = "36"
title = "Chapter 36"
level = 1
blocks = [
  { t = "h", level = 3, text = "XXXVI. The Journey to the South." },
  { t = "v", n = 1, p = true, text = "And from thence I went to the south to the ends of the earth, and saw there three open portals of the heaven: and thence there come dew, rain, †and wind†." },
  { t = "v", n = 2, text = "And from thence I went to the east to the ends of the heaven, and saw here the three eastern portals of heaven open and small portals above them." },
  { t = "v", n = 3, text = "Through each of these small portals pass the stars of heaven and run their course to the west on the path which is shown to them." },
  { t = "v", n = 4, text = "And as often as I saw I blessed always the Lord of Glory, and I continued to bless the Lord of Glory who has wrought great and glorious wonders, to show the greatness of His work to the angels and to **spirits** and to men, that they might praise His work and all His creation: that they might see the work of His might and praise the great work of His hands and bless Him for ever." },
]

[[section]]
id = "37"
title = "Chapter 37"
level = 1
blocks = [
  { t = "h", level = 2, text = "The Parables XXXVII-LXXI" },
  { t = "v", n = 1, p = true, text = "The second vision which he saw, the vision of wisdom—which Enoch the son of Jared, the son of Mahalalel, the son of Cainan, the son of Enos, the son of Seth, the son of Adam, saw." },
  { t = "v", n = 2, text = "And this is the beginning of the words of wisdom which I lifted up my voice to speak and say to those which dwell on earth: Hear, ye men of old time, and see, ye that come after, the words of the Holy One which I will speak before the Lord of Spirits." },
  { t = "v", n = 3, text = "It were better to declare (them only) to the men of old time, but even from those that come after we will not withhold the beginning of wisdom." },
  { t = "v", n = 4, text = "Till the present day such wisdom has never been given **by** the Lord of Spirits as I have received according to my insight, according to the good pleasure of the Lord of Spirits by whom the lot of eternal life has been given to me." },
  { t = "v", n = 5, text = "Now three parables were imparted to me, and I lifted up my voice and recounted them to those that dwell on the earth." },
]

[[section]]
id = "38"
title = "Chapter 38"
level = 1
blocks = [
  { t = "h", level = 3, text = "XXXVII-XLIV. The First Parable." },
  { t = "h", level = 3, text = "XXXVIII. The Coming Judgement of the Wicked." },
  { t = "v", n = 1, indent = 1, p = true, text = "The First Parable." },
  { t = "v", n = 1, indent = 1, cont = true, text = "When the congregation of the righteous shall appear," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And sinners shall be judged for their sins," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And shall be driven from the face of the earth:" },
  { t = "v", n = 2, indent = 1, p = true, text = "And when the Righteous One shall appear before the eyes of the righteous," },
  { t = "v", n = 2, indent = 1, cont = true, text = "Whose elect works hang upon the Lord of Spirits," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And light shall appear to the righteous and the elect who dwell on the earth," },
  { t = "v", n = 2, indent = 1, p = true, cont = true, text = "Where then will be the dwelling of the sinners," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And where the resting-place of those who have denied the Lord of Spirits?" },
  { t = "v", n = 2, indent = 1, cont = true, text = "It had been good for them if they had not been born." },
  { t = "v", n = 3, indent = 1, p = true, text = "When the secrets of the righteous shall be revealed and the sinners judged," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And the godless driven from the presence of the righteous and elect," },
  { t = "v", n = 4, indent = 1, text = "From that time those that possess the earth shall no longer be powerful and exalted:" },
  { t = "v", n = 4, indent = 1, p = true, cont = true, text = "And they shall not be able to behold the face of the holy," },
  { t = "v", n = 4, indent = 1, cont = true, text = "For the Lord of Spirits has **caused His light to appear**" },
  { t = "v", n = 4, indent = 1, cont = true, text = "On the face of the holy, righteous, and elect." },
  { t = "v", n = 5, indent = 1, p = true, text = "Then shall the kings and the mighty perish" },
  { t = "v", n = 5, indent = 1, cont = true, text = "And be given into the hands of the righteous and holy." },
  { t = "v", n = 6, indent = 1, text = "And thenceforward none shall seek for themselves mercy from the Lord of Spirits" },
  { t = "v", n = 6, indent = 1, cont = true, text = "For their life is at an end." },
]

[[section]]
id = "39"
title = "Chapter 39"
level = 1
blocks = [
  { t = "h", level = 3, text = "XXXIX. The Abode of the Righteous and of the Elect One: the Praises of the Blessed." },
  { t = "v", n = 1, p = true, text = "[And it †shall come to pass in those days that elect and holy children †will descend from the high heaven, and their seed †will become one with the children of men." },
  { t = "v", n = 2, text = "And in those days Enoch received books of zeal and wrath, and books of disquiet and expulsion.]" },
  { t = "v", n = 2, indent = 1, p = true, cont = true, text = "And mercy shall not be accorded to them, saith the Lord of Spirits." },
  { t = "v", n = 3, indent = 1, text = "And in those days a whirlwind carried me off from the earth," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And set me down at the end of the heavens." },
  { t = "v", n = 4, indent = 1, p = true, text = "And there I saw another vision, the dwelling-places of the holy," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And the resting-places of the righteous." },
  { t = "v", n = 5, indent = 1, p = true, text = "Here mine eyes saw their dwellings with His righteous angels," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And their resting-places with the holy." },
  { t = "v", n = 5, indent = 1, p = true, cont = true, text = "And they petitioned and interceded and prayed for the children of men," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And righteousness flowed before them as water," },
  { t = "v", n = 5, indent = 1, p = true, cont = true, text = "And mercy like dew upon the earth:" },
  { t = "v", n = 5, indent = 1, cont = true, text = "Thus it is amongst them for ever and ever." },
  { t = "v", n = 6, indent = 1, p = true, text = "*a*. And in that place mine eyes saw the Elect One of righteousness and of faith," },
  { t = "v", n = 7, indent = 1, text = "*a*. And I saw his dwelling-place under the wings of the Lord of Spirits." },
  { t = "v", n = 6, indent = 1, text = "*b*. And righteousness shall prevail in his days," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And the righteous and elect shall be without number before Him for ever and ever." },
  { t = "v", n = 7, indent = 1, text = "*b*. And all the righteous and elect before Him shall be †strong† as fiery lights," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And their mouth shall be full of blessing," },
  { t = "v", n = 7, indent = 1, p = true, cont = true, text = "And their lips shall extol the name of the Lord of Spirits," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And righteousness before Him shall never fail," },
  { t = "v", n = 7, indent = 1, cont = true, text = "[And uprightness shall never fail before Him.]" },
  { t = "v", n = 8, indent = 1, text = "There I wished to dwell," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And my spirit longed for that dwelling-place:" },
  { t = "v", n = 8, indent = 1, p = true, cont = true, text = "And there heretofore hath been my portion," },
  { t = "v", n = 8, indent = 1, cont = true, text = "For so hath it been established concerning me before the Lord of Spirits." },
  { t = "v", n = 9, p = true, text = "In those days I praised and extolled the name of the Lord of Spirits with blessings and praises, because He hath destined me for blessing and glory according to the good pleasure of the Lord of Spirits." },
  { t = "v", n = 10, text = "For a long time my eyes regarded that place, and I blessed Him and praised Him, saying: 'Blessed is He, and may He be blessed from the beginning and for evermore." },
  { t = "v", n = 11, text = "And before Him there is no ceasing. He knows before the world was created what is for ever and what will be from generation unto generation." },
  { t = "v", n = 12, text = "Those who sleep not bless Thee: they stand before Thy glory and bless, praise, and extol, saying: \"Holy, holy, holy, is the Lord of Spirits: He filleth the earth with spirits.\"'" },
  { t = "v", n = 13, text = "And here my eyes saw all those who sleep not: they stand before Him and bless and say: 'Blessed be Thou, and blessed be the name of the Lord for ever and ever.'" },
  { t = "v", n = 14, text = "And my face was changed; for I could no longer behold." },
]

[[section]]
id = "40"
title = "Chapter 40"
level = 1
blocks = [
  { t = "h", level = 3, text = "XL. XLI. 2. The Four Archangels." },
  { t = "v", n = 1, p = true, text = "And after that I saw thousands of thousands and ten thousand times ten thousand, I saw a multitude beyond number and reckoning, who stood before the Lord of Spirits." },
  { t = "v", n = 2, text = "And on the four sides of the Lord of Spirits I saw four presences, different from those that sleep not, and I learnt their names: for the angel that went with me made known to me their names, and showed me all the hidden things." },
  { t = "v", n = 3, p = true, text = "And I heard the voices of those four presences as they uttered praises before the Lord of glory." },
  { t = "v", n = 4, text = "The first voice blesses the Lord of Spirits for ever and ever." },
  { t = "v", n = 5, text = "And the second voice I heard blessing the Elect One and the elect ones who hang upon the Lord of Spirits." },
  { t = "v", n = 6, text = "And the third voice I heard **pray and intercede** for those who dwell on the earth and **supplicate** in the name of the Lord of Spirits." },
  { t = "v", n = 7, text = "And I heard the fourth voice fending off the Satans and forbidding them to come before the Lord of Spirits to accuse them who dwell on the earth." },
  { t = "v", n = 8, text = "After that I asked the angel of peace who went with me, who showed me everything that is hidden: 'Who are these four presences which I have seen and whose words I have heard and written down?'" },
  { t = "v", n = 9, text = "And he said to me: 'This first is Michael, the merciful and long-suffering: and the second, who is set over all the diseases and all the wounds of the children of men, is Raphael: and the third, who is set over all the powers, is Gabriel: and the fourth, who is set over the repentance unto hope of those who inherit eternal life, is named Phanuel.' And these are the four angels of the Lord of Spirits and the four voices I heard in those days." },
]

[[section]]
id = "41"
title = "Chapter 41"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And after that I saw all the secrets of the heavens, and how the kingdom is divided, and how the actions of men are weighed in the balance." },
  { t = "v", n = 2, text = "And there I saw the mansions of the elect and the mansions of the holy, and mine eyes saw there all the sinners being driven from thence which deny the name of the Lord of Spirits, and being dragged off: and they could not abide because of the punishment which proceeds from the Lord of Spirits." },
  { t = "h", level = 3, text = "XLI. 3-9. Astronomical Secrets." },
  { t = "v", n = 3, p = true, text = "And there mine eyes saw the secrets of the lightning and of the thunder, and the secrets of the winds, how they are divided to blow over the earth, and the secrets of the clouds and dew, and there I saw from whence they proceed in that place and from whence they saturate the dusty earth." },
  { t = "v", n = 4, text = "And there I saw closed chambers out of which the winds are divided, the chamber of the hail and winds, the chamber of the mist, and of the clouds, and the cloud thereof hovers over the earth from the beginning of the world." },
  { t = "v", n = 5, text = "And I saw the chambers of the sun and moon, whence they proceed and whither they come again, and their glorious return, and how one is superior to the other, and their stately orbit, and how they do not leave their orbit, and they add nothing to their orbit and they take nothing from it, and they keep faith with each other, in accordance with the oath by which they are bound together." },
  { t = "v", n = 6, text = "And first the sun goes forth and traverses his path according to the commandment of the Lord of Spirits, and mighty is His name for ever and ever." },
  { t = "v", n = 7, p = true, text = "And after that I saw the hidden and the visible path of the moon, and she accomplishes the course of her path in that place by day and by night—the one holding a position opposite to the other before the Lord of Spirits." },
  { t = "v", n = 7, indent = 1, p = true, cont = true, text = "And they give thanks and praise and rest not;" },
  { t = "v", n = 7, indent = 1, cont = true, text = "For unto them is their thanksgiving rest." },
  { t = "v", n = 8, indent = 1, text = "For the sun changes oft for a blessing or a curse," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And the course of the path of the moon is light to the righteous" },
  { t = "v", n = 8, indent = 1, cont = true, text = "And darkness to the sinners in the name of the Lord," },
  { t = "v", n = 8, indent = 1, p = true, cont = true, text = "Who made a separation between the light and the darkness," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And divided the spirits of men," },
  { t = "v", n = 8, indent = 1, p = true, cont = true, text = "And strengthened the spirits of the righteous," },
  { t = "v", n = 8, indent = 1, cont = true, text = "In the name of His righteousness." },
  { t = "v", n = 9, p = true, text = "For no angel hinders and no power is able to hinder; for He appoints a judge for them all and He judges them all before Him." },
]

[[section]]
id = "42"
title = "Chapter 42"
level = 1
blocks = [
  { t = "h", level = 3, text = "XLII. The Dwelling-places of Wisdom and of Unrighteousness." },
  { t = "v", n = 1, indent = 1, p = true, text = "Wisdom found no place where she might dwell;" },
  { t = "v", n = 1, indent = 1, cont = true, text = "Then a dwelling-place was assigned her in the heavens." },
  { t = "v", n = 2, indent = 1, p = true, text = "Wisdom went forth to make her dwelling among the children of men," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And found no dwelling-place:" },
  { t = "v", n = 2, indent = 1, p = true, cont = true, text = "Wisdom returned to her place," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And took her seat among the angels." },
  { t = "v", n = 3, indent = 1, p = true, text = "And unrighteousness went forth from her chambers:" },
  { t = "v", n = 3, indent = 1, cont = true, text = "Whom she sought not she found," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And dwelt with them," },
  { t = "v", n = 3, indent = 1, p = true, cont = true, text = "As rain in a desert" },
  { t = "v", n = 3, indent = 1, cont = true, text = "And dew on a thirsty land." },
]

[[section]]
id = "43"
title = "Chapter 43"
level = 1
blocks = [
  { t = "h", level = 3, text = "XLIII. XLIV. Astronomical Secrets." },
  { t = "v", n = 1, p = true, text = "And I saw other lightnings and the stars of heaven, and I saw how He called them all by their names and they hearkened unto Him." },
  { t = "v", n = 2, text = "And I saw how they are weighed in a righteous balance according to their proportions of light: (I saw) the width of their spaces and the day of their appearing, and how their revolution produces lightning: and (I saw) their revolution according to the number of the angels, and (how) they keep faith with each other." },
  { t = "v", n = 3, text = "And I asked the angel who went with me who showed me what was hidden: 'What are these?'" },
  { t = "v", n = 4, text = "And he said to me: 'The Lord of Spirits hath showed thee their parabolic meaning (lit. 'their parable'): these are the names of the holy who dwell on the earth and believe in the name of the Lord of Spirits for ever and ever.'" },
]

[[section]]
id = "44"
title = "Chapter 44"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Also another phenomenon I saw in regard to the lightnings: how some of the stars arise and become lightnings and cannot part with their new form." },
]

[[section]]
id = "45"
title = "Chapter 45"
level = 1
blocks = [
  { t = "h", level = 3, text = "XLV-LVII. The Second Parable." },
  { t = "h", level = 3, text = "The Lot of the Apostates: the New Heaven and the New Earth." },
  { t = "v", n = 1, p = true, text = "And this is the Second Parable concerning those who deny the name of the dwelling of the holy ones and the Lord of Spirits." },
  { t = "v", n = 2, indent = 1, p = true, text = "And into the heaven they shall not ascend," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And on the earth they shall not come:" },
  { t = "v", n = 2, indent = 1, cont = true, text = "Such shall be the lot of the sinners" },
  { t = "v", n = 2, indent = 1, cont = true, text = "Who have denied the name of the Lord of Spirits," },
  { t = "v", n = 2, indent = 1, cont = true, text = "Who are thus preserved for the day of suffering and tribulation." },
  { t = "v", n = 3, indent = 1, p = true, text = "On that day Mine Elect One shall sit on the throne of glory" },
  { t = "v", n = 3, indent = 1, cont = true, text = "And shall **try** their works," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And their places of rest shall be innumerable." },
  { t = "v", n = 3, indent = 1, p = true, cont = true, text = "And their souls shall grow strong within them when they see Mine Elect Ones," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And those who have called upon My glorious name:" },
  { t = "v", n = 4, indent = 1, text = "Then will I cause Mine Elect One to dwell among them." },
  { t = "v", n = 4, indent = 1, p = true, cont = true, text = "And I will transform the heaven and make it an eternal blessing and light" },
  { t = "v", n = 5, indent = 1, text = "And I will transform the earth and make it a blessing:" },
  { t = "v", n = 5, indent = 1, p = true, cont = true, text = "And I will cause Mine elect ones to dwell upon it:" },
  { t = "v", n = 5, indent = 1, cont = true, text = "But the sinners and evil-doers shall not set foot thereon." },
  { t = "v", n = 6, indent = 1, p = true, text = "For I have provided and satisfied with peace My righteous ones" },
  { t = "v", n = 6, indent = 1, cont = true, text = "And have caused them to dwell before Me:" },
  { t = "v", n = 6, indent = 1, p = true, cont = true, text = "But for the sinners there is judgement impending with Me," },
  { t = "v", n = 6, indent = 1, cont = true, text = "So that I shall destroy them from the face of the earth." },
]

[[section]]
id = "46"
title = "Chapter 46"
level = 1
blocks = [
  { t = "h", level = 3, text = "XLVI. The Head of Days and the Son of Man." },
  { t = "v", n = 1, indent = 1, p = true, text = "And there I saw One who had a head of days," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And His head was white like wool," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And with Him was another being whose countenance had the appearance of a man," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And his face was full of graciousness, like one of the holy angels." },
  { t = "v", n = 2, p = true, text = "And I asked the **angel** who went with me and showed me all the hidden things, concerning that Son of Man, who he was, and whence he was, (and) why he went with the Head of Days?" },
  { t = "v", n = 3, text = "And he answered and said unto me:" },
  { t = "v", n = 3, indent = 1, p = true, cont = true, text = "This is the Son of Man who hath righteousness," },
  { t = "v", n = 3, indent = 1, cont = true, text = "With whom dwelleth righteousness," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And who revealeth all the treasures of that which is hidden," },
  { t = "v", n = 3, indent = 1, p = true, cont = true, text = "Because the Lord of Spirits hath chosen him," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And whose lot hath the pre-eminence before the Lord of Spirits in uprightness for ever." },
  { t = "v", n = 4, indent = 1, p = true, text = "And this Son of Man whom thou hast seen" },
  { t = "v", n = 4, indent = 1, cont = true, text = "Shall †raise up† the kings and the mighty from their seats," },
  { t = "v", n = 4, indent = 1, cont = true, text = "[And the strong from their thrones]" },
  { t = "v", n = 4, indent = 1, p = true, cont = true, text = "And shall loosen the reins of the strong," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And break the teeth of the sinners." },
  { t = "v", n = 5, indent = 1, p = true, text = "[And he shall put down the kings from their thrones and kingdoms]" },
  { t = "v", n = 5, indent = 1, cont = true, text = "Because they do not extol and praise Him," },
  { t = "v", n = 5, indent = 1, cont = true, text = "Nor humbly acknowledge whence the kingdom was bestowed upon them." },
  { t = "v", n = 6, indent = 1, text = "And he shall put down the countenance of the strong," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And shall fill them with shame." },
  { t = "v", n = 6, indent = 1, p = true, cont = true, text = "And darkness shall be their dwelling," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And worms shall be their bed," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And they shall have no hope of rising from their beds," },
  { t = "v", n = 6, indent = 1, cont = true, text = "Because they do not extol the name of the Lord of Spirits." },
  { t = "v", n = 7, indent = 1, p = true, text = "And these are they who †judge† the stars of heaven," },
  { t = "v", n = 7, indent = 1, cont = true, text = "[And raise their hands against the Most High]," },
  { t = "v", n = 7, indent = 1, cont = true, text = "†And tread upon the earth and dwell upon it†." },
  { t = "v", n = 7, indent = 1, p = true, cont = true, text = "And all their deeds manifest unrighteousness," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And their power rests upon their riches," },
  { t = "v", n = 7, indent = 1, p = true, cont = true, text = "And their faith is in the †gods† which they have made with their hands," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And they deny the name of the Lord of Spirits," },
  { t = "v", n = 8, indent = 1, p = true, text = "And they persecute the houses of His congregations," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And the faithful who hang upon the name of the Lord of Spirits." },
]

[[section]]
id = "47"
title = "Chapter 47"
level = 1
blocks = [
  { t = "h", level = 3, text = "XLVII. The Prayer of the Righteous for Vengeance and their Joy at its coming." },
  { t = "v", n = 1, indent = 1, p = true, text = "And in those days shall have ascended the prayer of the righteous," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And the blood of the righteous from the earth before the Lord of Spirits." },
  { t = "v", n = 2, indent = 1, text = "In those days the holy ones who dwell above in the heavens" },
  { t = "v", n = 2, indent = 1, cont = true, text = "Shall unite with one voice" },
  { t = "v", n = 2, indent = 1, cont = true, text = "And supplicate and pray [and praise," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And give thanks and bless the name of the Lord of Spirits]" },
  { t = "v", n = 2, indent = 1, cont = true, text = "On behalf of the blood of the righteous which has been shed," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And that the prayer of the righteous may not be in vain before the Lord of Spirits," },
  { t = "v", n = 2, indent = 1, cont = true, text = "That judgement may be done unto them," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And that they may not have to suffer for ever." },
  { t = "v", n = 3, indent = 1, text = "In those days I saw the Head of Days when He seated himself upon the throne of His glory," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And the books of the living were opened before Him:" },
  { t = "v", n = 3, indent = 1, cont = true, text = "And all His host which is in heaven above and His counsellors stood before Him," },
  { t = "v", n = 4, indent = 1, text = "And the hearts of the holy were filled with joy;" },
  { t = "v", n = 4, indent = 1, cont = true, text = "Because the number of the righteous **had been offered**," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And the prayer of the righteous had been heard," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And the blood of the righteous been required before the Lord of Spirits." },
]

[[section]]
id = "48"
title = "Chapter 48"
level = 1
blocks = [
  { t = "h", level = 3, text = "XLVIII. The Fount of Righteousness; the Son of Man—the Stay of the Righteous: Judgement of the Kings and the Mighty." },
  { t = "v", n = 1, indent = 1, p = true, text = "And in that place I saw the fountain of righteousness" },
  { t = "v", n = 1, indent = 1, cont = true, text = "Which was inexhaustible:" },
  { t = "v", n = 1, indent = 1, cont = true, text = "And around it were many fountains of wisdom;" },
  { t = "v", n = 1, indent = 1, p = true, cont = true, text = "And all the thirsty drank of them," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And were filled with wisdom," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And their dwellings were with the righteous and holy and elect." },
  { t = "v", n = 2, indent = 1, text = "And at that hour that Son of Man was named In the presence of the Lord of Spirits," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And his name before the Head of Days." },
  { t = "v", n = 3, indent = 1, p = true, text = "Yea, before the sun and the signs were created," },
  { t = "v", n = 3, indent = 1, cont = true, text = "Before the stars of the heaven were made," },
  { t = "v", n = 3, indent = 1, cont = true, text = "His name was named before the Lord of Spirits." },
  { t = "v", n = 4, indent = 1, p = true, text = "He shall be a staff to the righteous whereon to stay themselves and not fall," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And he shall be the light of the Gentiles," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And the hope of those who are troubled of heart." },
  { t = "v", n = 5, indent = 1, p = true, text = "All who dwell on earth shall fall down and worship before him," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And will praise and bless and celebrate with song the Lord of Spirits." },
  { t = "v", n = 6, indent = 1, p = true, text = "And for this reason hath he been chosen and hidden before Him," },
  { t = "v", n = 6, indent = 1, cont = true, text = "Before the creation of the world and for evermore." },
  { t = "v", n = 7, indent = 1, p = true, text = "And the wisdom of the Lord of Spirits hath revealed him to the holy and righteous;" },
  { t = "v", n = 7, indent = 1, cont = true, text = "For he hath preserved the lot of the righteous," },
  { t = "v", n = 7, indent = 1, cont = true, text = "Because they have hated and despised this world of unrighteousness," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And have hated all its works and ways in the name of the Lord of Spirits:" },
  { t = "v", n = 7, indent = 1, p = true, cont = true, text = "For in his name they are saved," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And according to his good pleasure hath it been in regard to their life." },
  { t = "v", n = 8, indent = 1, p = true, text = "In these days downcast in countenance shall the kings of the earth have become," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And the strong who possess the land because of the works of their hands;" },
  { t = "v", n = 8, indent = 1, p = true, cont = true, text = "For on the day of their anguish and affliction they shall not (be able to) save themselves." },
  { t = "v", n = 9, indent = 1, text = "And I will give them over into the hands of Mine elect:" },
  { t = "v", n = 9, indent = 1, p = true, cont = true, text = "As straw in the fire so shall they burn before the face of the holy:" },
  { t = "v", n = 9, indent = 1, cont = true, text = "As lead in the water shall they sink before the face of the righteous," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And no trace of them shall any more be found." },
  { t = "v", n = 10, indent = 1, p = true, text = "And on the day of their affliction there shall be rest on the earth," },
  { t = "v", n = 10, indent = 1, cont = true, text = "And before them they shall fall and not rise again:" },
  { t = "v", n = 10, indent = 1, p = true, cont = true, text = "And there shall be no one to take them with his hands and raise them:" },
  { t = "v", n = 10, indent = 1, cont = true, text = "For they have denied the Lord of Spirits and His Anointed." },
  { t = "v", n = 10, indent = 1, cont = true, text = "The name of the Lord of Spirits be blessed." },
]

[[section]]
id = "49"
title = "Chapter 49"
level = 1
blocks = [
  { t = "h", level = 3, text = "XLIX. The Power and Wisdom of the Elect One." },
  { t = "v", n = 1, indent = 1, p = true, text = "For wisdom is poured out like water," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And glory faileth not before him for evermore." },
  { t = "v", n = 2, indent = 1, p = true, text = "For he is mighty in all the secrets of righteousness," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And unrighteousness shall disappear as a shadow," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And have no continuance;" },
  { t = "v", n = 2, indent = 1, cont = true, text = "Because the Elect One standeth before the Lord of Spirits," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And his glory is for ever and ever," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And his might unto all generations." },
  { t = "v", n = 3, indent = 1, p = true, text = "And in him dwells the spirit of wisdom," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And the spirit which gives insight," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And the spirit of understanding and of might," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And the spirit of those who have fallen asleep in righteousness." },
  { t = "v", n = 4, indent = 1, p = true, text = "And he shall judge the secret things," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And none shall be able to utter a lying word before him;" },
  { t = "v", n = 4, indent = 1, cont = true, text = "For he is the Elect One before the Lord of Spirits according to His good pleasure." },
]

[[section]]
id = "50"
title = "Chapter 50"
level = 1
blocks = [
  { t = "h", level = 3, text = "L. The Glorification and Victory of the Righteous: the Repentance of the Gentiles." },
  { t = "v", n = 1, indent = 1, p = true, text = "And in those days a change shall take place for the holy and elect," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And the light of days shall abide upon them," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And glory and honour shall turn to the holy," },
  { t = "v", n = 2, indent = 1, text = "On the day of affliction on which evil shall have been treasured up against the sinners." },
  { t = "v", n = 2, indent = 1, p = true, cont = true, text = "And the righteous shall be victorious in the name of the Lord of Spirits:" },
  { t = "v", n = 2, indent = 1, cont = true, text = "And He will cause the others to witness (this)" },
  { t = "v", n = 2, indent = 1, cont = true, text = "That they may repent" },
  { t = "v", n = 2, indent = 1, cont = true, text = "And forgo the works of their hands." },
  { t = "v", n = 3, indent = 1, p = true, text = "They shall have no honour through the name of the Lord of Spirits," },
  { t = "v", n = 3, indent = 1, cont = true, text = "Yet through His name shall they be saved," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And the Lord of Spirits will have compassion on them," },
  { t = "v", n = 3, indent = 1, cont = true, text = "For His compassion is great." },
  { t = "v", n = 4, indent = 1, text = "And He is righteous also in His judgement," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And in the presence of His glory unrighteousness also shall not maintain itself:" },
  { t = "v", n = 4, indent = 1, cont = true, text = "At His judgement the unrepentant shall perish before Him." },
  { t = "v", n = 5, indent = 1, text = "And from henceforth I will have no mercy on them, saith the Lord of Spirits." },
]

[[section]]
id = "51"
title = "Chapter 51"
level = 1
blocks = [
  { t = "h", level = 3, text = "LI. The Resurrection of the Dead, and the Separation by the Judge of the Righteous and the Wicked." },
  { t = "v", n = 1, indent = 1, p = true, text = "And in those days shall the earth also give back that which has been entrusted to it," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And Sheol also shall give back that which it has received," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And hell shall give back that which it owes." },
  { t = "v", n = 5, indent = 1, p = true, text = "*a*. For in those days the Elect One shall arise," },
  { t = "v", n = 2, indent = 1, text = "And he shall choose the righteous and holy from among them:" },
  { t = "v", n = 2, indent = 1, cont = true, text = "For the day has drawn nigh that they should be saved." },
  { t = "v", n = 3, indent = 1, p = true, text = "And the Elect One shall in those days sit on My throne," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And his mouth shall **pour** forth all the secrets of wisdom and counsel:" },
  { t = "v", n = 3, indent = 1, cont = true, text = "For the Lord of Spirits hath given (them) to him and hath glorified him." },
  { t = "v", n = 4, indent = 1, p = true, text = "And in those days shall the mountains leap like rams," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And the hills also shall skip like lambs satisfied with milk," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And the faces of ⌈all⌉ the angels in heaven shall be lighted up with joy." },
  { t = "v", n = 5, indent = 1, p = true, text = "*b*. And the earth shall rejoice," },
  { t = "v", n = 5, indent = 1, cont = true, text = "*c*. And the righteous shall dwell upon it," },
  { t = "v", n = 5, indent = 1, cont = true, text = "*d*. And the elect shall walk thereon." },
]

[[section]]
id = "52"
title = "Chapter 52"
level = 1
blocks = [
  { t = "h", level = 3, text = "LII. The Seven [^1] Metal Mountains and the Elect One." },
  { t = "v", n = 1, p = true, text = "And after those days in that place where I had seen all the visions of that which is hidden—for I had been carried off in a whirlwind and they had borne me towards the west—" },
  { t = "v", n = 2, text = "There mine eyes saw all the secret things of heaven that shall be, a mountain of iron, and a mountain of copper, and a mountain of silver, and a mountain of gold, and a mountain of soft metal, and a mountain of lead." },
  { t = "v", n = 3, p = true, text = "And I asked the angel who went with me, saying, 'What things are these which I have seen in secret?'" },
  { t = "v", n = 4, text = "And he said unto me: 'All these things which thou hast seen shall serve the dominion of His Anointed that he may be potent and mighty on the earth.'" },
  { t = "v", n = 5, p = true, text = "And that angel of peace answered, saying unto me: 'Wait a little, and there shall be revealed unto thee all the secret things which surround the Lord of Spirits." },
  { t = "v", n = 6, indent = 1, p = true, text = "And these mountains which thine eyes have seen," },
  { t = "v", n = 6, indent = 1, cont = true, text = "The mountain of iron, and the mountain of copper, and the mountain of silver," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And the mountain of gold, and the mountain of soft metal, and the mountain of lead," },
  { t = "v", n = 6, indent = 1, cont = true, text = "All these shall be in the presence of the Elect One" },
  { t = "v", n = 6, indent = 1, cont = true, text = "As wax: before the fire," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And like the water which streams down from above [upon those mountains]," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And they shall become powerless before his feet." },
  { t = "v", n = 7, indent = 1, text = "And it shall come to pass in those days that none shall be saved," },
  { t = "v", n = 7, indent = 1, cont = true, text = "Either by gold or by silver," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And none be able to escape." },
  { t = "v", n = 8, indent = 1, text = "And there shall be no iron for war," },
  { t = "v", n = 8, indent = 1, cont = true, text = "Nor shall one clothe oneself with a breastplate." },
  { t = "v", n = 8, indent = 1, cont = true, text = "Bronze shall be of no service," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And tin [shall be of no service and] shall not be esteemed," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And lead shall not be desired." },
  { t = "v", n = 9, indent = 1, text = "And all these things shall be [denied and] destroyed from the surface of the earth," },
  { t = "v", n = 9, indent = 1, cont = true, text = "When the Elect One shall appear before the face of the Lord of Spirits.'" },
  { t = "note", id = "1", text = "[Only six are mentioned; see Charles' note in his large edition—EDD.]" },
]

[[section]]
id = "53"
title = "Chapter 53"
level = 1
blocks = [
  { t = "h", level = 3, text = "LIII. LVI. 6. The Valley of Judgement: the Angels of Punishment: the Communities of the Elect One." },
  { t = "v", n = 1, p = true, text = "There mine eyes saw a deep valley with open mouths, and all who dwell on the earth and sea and islands shall bring to him gifts and presents and tokens of homage, but that deep valley shall not become full." },
  { t = "v", n = 2, indent = 1, p = true, text = "And their hands commit lawless deeds," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And the sinners devour all whom they lawlessly **oppress**:" },
  { t = "v", n = 2, indent = 1, cont = true, text = "Yet the sinners shall be destroyed before the face of the Lord of Spirits," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And they shall be banished from off the face of His earth," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And they shall perish for ever and ever." },
  { t = "v", n = 3, p = true, text = "For I saw all the angels of punishment abiding (there) and preparing all the instruments of Satan." },
  { t = "v", n = 4, text = "And I asked the angel of peace who went with me: 'For whom are they preparing these instruments?'" },
  { t = "v", n = 5, text = "And he said unto me: 'They prepare these for the kings and the mighty of this earth, that they may thereby be destroyed." },
  { t = "v", n = 6, p = true, text = "And after this the Righteous and Elect One shall cause the house of his congregation to appear: henceforth they shall be no more hindered in the name of the Lord of Spirits." },
  { t = "v", n = 7, indent = 1, p = true, text = "And these mountains shall not stand as the earth before his righteousness," },
  { t = "v", n = 7, indent = 1, cont = true, text = "But the hills shall be as a fountain of water," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And the righteous shall have rest from the oppression of sinners.'" },
]

[[section]]
id = "54"
title = "Chapter 54"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And I looked and turned to another part of the earth, and saw there a deep valley with burning fire." },
  { t = "v", n = 2, text = "And they brought the kings and the mighty, and began to cast them into this deep valley." },
  { t = "v", n = 3, text = "And there mine eyes saw how they made these their instruments, iron chains of immeasurable weight." },
  { t = "v", n = 4, text = "And I asked the angel of peace who went with me, saying: 'For whom are these chains being prepared?'" },
  { t = "v", n = 5, p = true, text = "And he said unto me: 'These are being prepared for the hosts of Azâzêl, so that they may take them and cast them into the abyss of complete condemnation, and they shall cover their jaws with rough stones as the Lord of Spirits commanded." },
  { t = "v", n = 6, p = true, text = "And Michael, and Gabriel, and Raphael, and Phanuel shall take hold of them on that great day, and cast them on that day into the burning furnace, that the Lord of Spirits may take vengeance on them for their unrighteousness in becoming subject to Satan and leading astray those who dwell on the earth.'" },
  { t = "h", level = 3, text = "LIV. 7.-LV 2. Noachic Fragment on the first World Judgement." },
  { t = "v", n = 7, p = true, text = "'And in those days shall punishment come from the Lord of Spirits, and he will open all the chambers of waters which are above the heavens, and of the fountains which are beneath the earth." },
  { t = "v", n = 8, text = "And all the waters shall be joined with the waters: that which is above the heavens is the masculine, and the water which is beneath the earth is the feminine." },
  { t = "v", n = 9, text = "And they shall destroy all who dwell on the earth and those who dwell under the ends of the heaven." },
  { t = "v", n = 10, text = "And **when** they have recognized their unrighteousness which they have wrought on the earth, then by these shall they perish." },
]

[[section]]
id = "55"
title = "Chapter 55"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And after that the Head of Days repented and said: 'In vain have I destroyed all who dwell on the earth.'" },
  { t = "v", n = 2, text = "And He sware by His great name: 'Henceforth I will not do so to all who dwell on the earth, and I will set a sign in the heaven: and this shall be a pledge of good faith between Me and them for ever, so long as heaven is above the earth. And this is in accordance with My command.'" },
  { t = "h", level = 3, text = "LV. 3-LVI. 4. Final Judgement of Azâzêl, the Watchers and their children." },
  { t = "v", n = 3, p = true, text = "When I have desired to take hold of them by the hand of the angels on the day of tribulation and pain **because of** this, I will cause My chastisement and My wrath to abide upon them, saith God, the Lord of Spirits." },
  { t = "v", n = 4, text = "Ye †mighty kings† who dwell on the earth, ye shall have to behold Mine Elect One, how he sits on the throne of glory and judges Azâzêl, and all his associates, and all his hosts in the name of the Lord of Spirits.'" },
]

[[section]]
id = "56"
title = "Chapter 56"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And I saw there the hosts of the angels of punishment going, and they held scourges and chains of iron and bronze." },
  { t = "v", n = 2, text = "And I asked the angel of peace who went with me, saying: 'To whom are these who hold the scourges going?'" },
  { t = "v", n = 3, text = "And he said unto me: 'To their elect and beloved ones, that they may be cast into the chasm of the abyss of the valley." },
  { t = "v", n = 4, indent = 1, p = true, text = "And then that valley shall be filled with their elect and beloved," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And the days of their lives shall be at an end," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And the days of their leading astray shall not thenceforward be reckoned." },
  { t = "h", level = 3, text = "LVI. 5-8. Last struggle of heathen Powers against Israel." },
  { t = "v", n = 5, indent = 1, p = true, text = "And in those days the angels shall return" },
  { t = "v", n = 5, indent = 1, cont = true, text = "And hurl themselves to the east upon the Parthians and Medes:" },
  { t = "v", n = 5, indent = 1, cont = true, text = "They shall stir up the kings, so that a spirit of unrest shall come upon them," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And they shall rouse them from their thrones," },
  { t = "v", n = 5, indent = 1, cont = true, text = "That they may break forth as lions from their lairs," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And as hungry wolves among their flocks." },
  { t = "v", n = 6, indent = 1, text = "And they shall go up and tread under foot the land of His elect ones," },
  { t = "v", n = 6, indent = 1, p = true, cont = true, text = "[And the land of His elect ones shall be before them a threshing-floor and a highway:]" },
  { t = "v", n = 7, indent = 1, text = "But the city of my righteous shall be a hindrance to their horses." },
  { t = "v", n = 7, indent = 1, p = true, cont = true, text = "And they shall begin to fight among themselves," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And their right hand shall be strong against themselves," },
  { t = "v", n = 7, indent = 1, p = true, cont = true, text = "And a man shall not know his brother," },
  { t = "v", n = 7, indent = 1, cont = true, text = "Nor a son his father or his mother," },
  { t = "v", n = 7, indent = 1, p = true, cont = true, text = "Till there be no number of the corpses through their slaughter," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And their punishment be not in vain." },
  { t = "v", n = 8, indent = 1, p = true, text = "In those days Sheol shall open its jaws," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And they shall be swallowed up therein" },
  { t = "v", n = 8, indent = 1, p = true, cont = true, text = "And their destruction shall be at an end;" },
  { t = "v", n = 8, indent = 1, cont = true, text = "Sheol shall devour the sinners in the presence of the elect.'" },
]

[[section]]
id = "57"
title = "Chapter 57"
level = 1
blocks = [
  { t = "h", level = 3, text = "LVII. The Return from the Dispersion." },
  { t = "v", n = 1, p = true, text = "And it came to pass after this that I saw another host of wagons, and men riding thereon, and coming on the winds from the east, and from the west to the south." },
  { t = "v", n = 2, text = "And the noise of their wagons was heard, and when this turmoil took place the holy ones from heaven remarked it, and the pillars of the earth were moved from their place, and the sound thereof was heard from the one end of heaven to the other, in one day." },
  { t = "v", n = 3, text = "And they shall all fall down and worship the Lord of Spirits. And this is the end of the second Parable." },
]

[[section]]
id = "58"
title = "Chapter 58"
level = 1
blocks = [
  { t = "h", level = 3, text = "LVIII-LXXI. The Third Parable." },
  { t = "h", level = 3, text = "LVIII. The Blessedness of the Saints." },
  { t = "v", n = 1, indent = 1, p = true, text = "And I began to speak the third Parable concerning the righteous and elect." },
  { t = "v", n = 2, indent = 1, p = true, text = "Blessed are ye, ye righteous and elect," },
  { t = "v", n = 2, indent = 1, cont = true, text = "For glorious shall be your lot." },
  { t = "v", n = 3, indent = 1, p = true, text = "And the righteous shall be in the light of the sun." },
  { t = "v", n = 3, indent = 1, cont = true, text = "And the elect in the light of eternal life:" },
  { t = "v", n = 3, indent = 1, cont = true, text = "The days of their life shall be unending," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And the days of the holy without number." },
  { t = "v", n = 4, indent = 1, p = true, text = "And they shall seek the light and find righteousness with the Lord of Spirits:" },
  { t = "v", n = 4, indent = 1, cont = true, text = "There shall be peace to the righteous in the name of the Eternal Lord." },
  { t = "v", n = 5, indent = 1, p = true, text = "And after this it shall be said to the holy in heaven" },
  { t = "v", n = 5, indent = 1, cont = true, text = "That they should seek out the secrets of righteousness, the heritage of faith:" },
  { t = "v", n = 5, indent = 1, cont = true, text = "For it has become bright as the sun upon earth," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And the darkness is past." },
  { t = "v", n = 6, indent = 1, p = true, text = "And there shall be a light that never **endeth**," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And to a limit (lit. 'number') of days they shall not come," },
  { t = "v", n = 6, indent = 1, cont = true, text = "For the darkness shall first have been destroyed," },
  { t = "v", n = 6, indent = 1, cont = true, text = "[And the light established before the Lord of Spirits]" },
  { t = "v", n = 6, indent = 1, cont = true, text = "And the light of uprightness established for ever before the Lord of Spirits." },
]

[[section]]
id = "59"
title = "Chapter 59"
level = 1
blocks = [
  { t = "h", level = 3, text = "LIX. The Lights and the Thunder." },
  { t = "v", n = 1, p = true, text = "[In those days mine eyes saw the secrets of the lightnings, and of the lights, and the judgements they execute (lit. 'their judgement'): and they lighten for a blessing or a curse as the Lord of Spirits willeth." },
  { t = "v", n = 2, text = "And there I saw the secrets of the thunder, and how when it resounds above in the heaven, the sound thereof is heard, and he caused me to see the judgements executed on the earth, whether they be for well-being and blessing, or for a curse according to the word of the Lord of Spirits." },
  { t = "v", n = 3, text = "And after that all the secrets of the lights and lightnings were shown to me, and they lighten for blessing and for satisfying.]" },
]

[[section]]
id = "60"
title = "Chapter 60"
level = 1
blocks = [
  { t = "h", level = 3, text = "LX. Book of Noah—a Fragment." },
  { t = "h", level = 3, text = "Quaking of Heaven: Behemoth and Leviathan: the Elements." },
  { t = "v", n = 1, p = true, text = "In the year five hundred, in the seventh month, on the fourteenth day of the month in the life of †Enoch†. In that Parable I saw how a mighty quaking made the heaven of heavens to quake, and the host of the Most High, and the angels, a thousand thousands and ten thousand times **ten** thousand, were disquieted with a great disquiet." },
  { t = "v", n = 2, text = "And the Head of Days sat on the throne of His glory, and the angels and the righteous stood around Him." },
  { t = "v", n = 3, indent = 1, p = true, text = "And a great trembling seized me," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And fear took hold of me," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And my loins gave way," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And dissolved were my reins," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And I fell upon my face." },
  { t = "v", n = 4, p = true, text = "And Michael sent another angel from among the holy ones and he raised me up, and when he had raised me up my spirit returned; for I had not been able to endure the look of this host, and the commotion and the quaking of the heaven." },
  { t = "v", n = 5, text = "And Michael said unto me: 'Why art thou disquieted with such a vision? Until this day lasted the day of His mercy; and He hath been merciful and long-suffering towards those who dwell on the earth." },
  { t = "v", n = 6, text = "And when the day, and the power, and the punishment, and the judgement come, which the Lord of Spirits hath prepared for those who worship not the righteous **law**, and for those who deny the righteous judgement, and for those who take His name in vain—that day is prepared, for the elect a covenant, but for sinners an inquisition." },
  { t = "v", n = 25, p = true, text = "When the punishment of the Lord of Spirits shall rest upon them, it shall rest in order that the punishment of the Lord of Spirits may not come, in vain, and it shall slay the children with their mothers and the children with their fathers. Afterwards the judgement shall take place according to His mercy and His patience.'" },
  { t = "v", n = 7, p = true, text = "And on that day were two monsters parted, a female monster named Leviathan, to dwell in the abysses of the ocean over the fountains of the waters." },
  { t = "v", n = 8, text = "But the male is named Behemoth, who occupied with his breast a waste wilderness named †Dûidâin†, on the east of the garden where the elect and righteous dwell, where my grandfather was taken up, the seventh from Adam, the first man whom the Lord of Spirits created." },
  { t = "v", n = 9, text = "And I besought the other angel that he should show me the might of those monsters, how they were parted on one day and cast, the one into the abysses of the sea, and the other unto the dry land of the wilderness." },
  { t = "v", n = 10, text = "And he said to me: 'Thou son of man, herein thou dost seek to know what is hidden.'" },
  { t = "v", n = 11, p = true, text = "And the other angel who went with me and showed me what was hidden told me what is first and last in the heaven in the height, and beneath the earth in the depth, and at the ends of the heaven, and on the foundation of the heaven." },
  { t = "v", n = 12, text = "And the chambers of the winds, and how the winds are divided, and how they are weighed, and (how) the **portals** of the winds are reckoned, each according to the power of the wind, and the power of the lights of the moon, and according to the power that is fitting: and the divisions of the stars according to their names, and how all the divisions are divided." },
  { t = "v", n = 13, text = "And the thunders according to the places where they fall, and all the divisions that are made among the lightnings that it may lighten, and their host that they may at once obey." },
  { t = "v", n = 14, text = "For the thunder has †places of rest† (which) are assigned (to it) while it is waiting for its peal; and the thunder and lightning are inseparable, and although not one and undivided, they both go together through the spirit and separate not." },
  { t = "v", n = 15, text = "For when the lightning lightens, the thunder utters its voice, and the spirit enforces a pause during the peal, and divides equally between them; for the treasury of their peals is like the sand, and each one of them as it peals is held in with a bridle, and turned back by the power of the spirit, and pushed forward according to the many quarters of the earth." },
  { t = "v", n = 16, text = "And the spirit of the sea is masculine and strong, and according to the might of his strength he draws it back with a rein, and in like manner it is driven forward and disperses amid all the mountains of the earth." },
  { t = "v", n = 17, text = "And the spirit of the hoar-frost is his own angel, and the spirit of the hail is a good angel." },
  { t = "v", n = 18, text = "And the spirit of the snow has forsaken his chamber on account of his strength—There is a special spirit therein, and that which ascends from it is like smoke, and its name is frost." },
  { t = "v", n = 19, text = "And the spirit of the mist is not united with them in their chambers, but it has a special chamber; for its course is †glorious† both in light and in darkness, and in winter and in summer, and in its chamber is an angel." },
  { t = "v", n = 20, text = "And the spirit of the dew has its dwelling at the ends of the heaven, and is connected with the chambers of the rain, and its course is in winter and summer: and its clouds and the clouds of the mist are connected, and the one gives to the other." },
  { t = "v", n = 21, text = "And when the spirit of the rain goes forth from its chamber, the angels come and open the chamber and lead it out, and when it is diffused over the whole earth it unites with the water on the earth. And whensoever it unites with the water on the earth . . ." },
  { t = "v", n = 22, text = "For the waters are for those who dwell on the earth; for they are nourishment for the earth from the Most High who is in heaven: therefore there is a measure for the rain, and the angels take it in charge." },
  { t = "v", n = 23, text = "And these things I saw towards the Garden of the Righteous." },
  { t = "v", n = 24, text = "And the angel of peace who was with me said to me: 'These two monsters, prepared conformably to the greatness of God, shall feed . . ." },
]

[[section]]
id = "61"
title = "Chapter 61"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXI. Angels go off to measure Paradise: the Judgement of the Righteous by the Elect One: the Praise of the Elect One and of God." },
  { t = "v", n = 1, p = true, text = "And I saw in those days how long cords were given to those angels, and they took to themselves wings and flew, and they went towards the north." },
  { t = "v", n = 2, p = true, text = "And I asked the angel, saying unto him: 'Why have those (angels) taken these cords and gone off?' And he said unto me: 'They have gone to measure.'" },
  { t = "v", n = 3, indent = 1, p = true, text = "And the angel who went with me said unto me:" },
  { t = "v", n = 3, indent = 1, cont = true, text = "'These shall bring the measures of the righteous," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And the ropes of the righteous to the righteous," },
  { t = "v", n = 3, indent = 1, cont = true, text = "That they may stay themselves on the name of the Lord of Spirits for ever and ever." },
  { t = "v", n = 4, indent = 1, p = true, text = "The elect shall begin to dwell with the elect," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And those are the measures which shall be given to faith" },
  { t = "v", n = 4, indent = 1, cont = true, text = "And which shall strengthen righteousness." },
  { t = "v", n = 5, indent = 1, p = true, text = "And these measures shall reveal all the secrets of the depths of the earth," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And those who have been destroyed by the desert," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And those who have been devoured by the beasts," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And those who have been devoured by the fish of the sea," },
  { t = "v", n = 5, indent = 1, p = true, cont = true, text = "That they may return and stay themselves" },
  { t = "v", n = 5, indent = 1, cont = true, text = "On the day of the Elect One;" },
  { t = "v", n = 5, indent = 1, cont = true, text = "For none shall be destroyed before the Lord of Spirits," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And none can be destroyed." },
  { t = "v", n = 6, p = true, text = "And all who dwell above in the heaven received a command and power and one voice and one light like unto fire." },
  { t = "v", n = 7, indent = 1, p = true, text = "And that One (with) their first words they blessed," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And extolled and lauded with wisdom," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And they were wise in utterance and in the spirit of life." },
  { t = "v", n = 8, indent = 1, p = true, text = "And the Lord of Spirits placed the Elect one on the throne of glory." },
  { t = "v", n = 8, indent = 1, cont = true, text = "And he shall judge all the works of the holy above in the heaven," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And in the balance shall their deeds be weighed" },
  { t = "v", n = 9, indent = 1, p = true, text = "And when he shall lift up his countenance" },
  { t = "v", n = 9, indent = 1, cont = true, text = "To judge their secret ways according to the word of the name of the Lord of Spirits," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And their path according to the way of the righteous judgement of the Lord of Spirits," },
  { t = "v", n = 9, indent = 1, cont = true, text = "Then shall they all with one voice speak and bless," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And glorify and extol and sanctify the name of the Lord of Spirits." },
  { t = "v", n = 10, p = true, text = "And He will summon all the host of the heavens, and all the holy ones above, and the host of God, the Cherubin, Seraphin and Ophannin, and all the angels of power, and all the angels of principalities, and the Elect One, and the other powers on the earth (and) over the water." },
  { t = "v", n = 11, text = "On that day shall they raise one voice, and bless and glorify and exalt in the spirit of faith, and in the spirit of wisdom, and in the spirit of patience, and in the spirit of mercy, and in the spirit of judgement and of peace, and in the spirit of goodness, and shall all say with one voice: \"Blessed is He, and may the name of the Lord of Spirits be blessed for ever and ever.\"" },
  { t = "v", n = 12, indent = 1, p = true, text = "All who sleep not above in heaven shall bless Him:" },
  { t = "v", n = 12, indent = 1, cont = true, text = "All the holy ones who are in heaven shall bless Him," },
  { t = "v", n = 12, indent = 1, cont = true, text = "And all the elect who dwell in the garden of life:" },
  { t = "v", n = 12, indent = 1, p = true, cont = true, text = "And every spirit of light who is able to bless, and glorify, and extol, and hallow Thy blessed name," },
  { t = "v", n = 12, indent = 1, cont = true, text = "And all flesh shall beyond measure glorify and bless Thy name for ever and ever." },
  { t = "v", n = 13, indent = 1, p = true, text = "For great is the mercy of the Lord of Spirits, and He is long-suffering," },
  { t = "v", n = 13, indent = 1, p = true, cont = true, text = "And all His works and all that He has created He has revealed to the righteous and elect" },
  { t = "v", n = 13, indent = 1, cont = true, text = "In the name of the Lord of Spirits." },
]

[[section]]
id = "62"
title = "Chapter 62"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXII. Judgement of the Kings and the Mighty: Blessedness of the Righteous." },
  { t = "v", n = 1, p = true, text = "And thus the Lord commanded the kings and the mighty and the exalted, and those who dwell on the earth, and said: 'Open your eyes and lift up your horns if ye are able to recognize the Elect One.'" },
  { t = "v", n = 2, indent = 1, p = true, text = "And the Lord of Spirits seated him on the throne of His glory," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And the spirit of righteousness was poured out upon him," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And the word of his mouth slays all the sinners," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And all the unrighteous are destroyed from before his face." },
  { t = "v", n = 3, indent = 1, text = "And there shall stand up in that day all the kings and the mighty," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And the exalted and those who hold the earth," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And they shall see and recognize How he sits on the throne of his glory," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And righteousness is judged before him," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And no lying word is spoken before him." },
  { t = "v", n = 4, indent = 1, p = true, text = "Then shall pain come upon them as on a woman in travail," },
  { t = "v", n = 4, indent = 1, cont = true, text = "[And she has pain in bringing forth]" },
  { t = "v", n = 4, indent = 1, cont = true, text = "When her child enters the mouth of the womb," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And she has pain in bringing forth." },
  { t = "v", n = 5, indent = 1, p = true, text = "And one portion of them shall look on the other," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And they shall be terrified," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And they shall be downcast of countenance," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And pain shall seize them," },
  { t = "v", n = 5, indent = 1, cont = true, text = "When they see that Son of Man Sitting on the throne of his glory." },
  { t = "v", n = 6, p = true, text = "And the kings and the mighty and all who possess the earth shall bless and glorify and extol him who rules over all, who was hidden." },
  { t = "v", n = 7, indent = 1, p = true, text = "For from the beginning the Son of Man was hidden," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And the Most High preserved him in the presence of His might," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And revealed him to the elect." },
  { t = "v", n = 8, indent = 1, p = true, text = "And the congregation of the elect and holy shall be sown," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And all the elect shall stand before him on that day." },
  { t = "v", n = 9, indent = 1, p = true, text = "And all the kings and the mighty and the exalted and those who rule the earth" },
  { t = "v", n = 9, indent = 1, cont = true, text = "Shall fall down before him on their faces," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And worship and set their hope upon that Son of Man," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And petition him and supplicate for mercy at his hands." },
  { t = "v", n = 10, indent = 1, p = true, text = "Nevertheless that Lord of Spirits will so press them" },
  { t = "v", n = 10, indent = 1, cont = true, text = "That they shall hastily go forth from His presence," },
  { t = "v", n = 10, indent = 1, cont = true, text = "And their faces shall be filled with shame," },
  { t = "v", n = 10, indent = 1, cont = true, text = "And the darkness shall grow deeper on their faces." },
  { t = "v", n = 11, indent = 1, text = "And **He will deliver** them to the angels for punishment," },
  { t = "v", n = 11, indent = 1, cont = true, text = "To execute vengeance on them because they have oppressed His children and His elect" },
  { t = "v", n = 12, indent = 1, text = "And they shall be a spectacle for the righteous and for His elect:" },
  { t = "v", n = 12, indent = 1, cont = true, text = "They shall rejoice over them," },
  { t = "v", n = 12, indent = 1, cont = true, text = "Because the wrath of the Lord of Spirits resteth upon them," },
  { t = "v", n = 12, indent = 1, cont = true, text = "And His sword is drunk with their blood." },
  { t = "v", n = 13, indent = 1, text = "And the righteous and elect shall be saved on that day," },
  { t = "v", n = 13, indent = 1, cont = true, text = "And they shall never thenceforward see the face of the sinners and unrighteous." },
  { t = "v", n = 14, indent = 1, p = true, text = "And the Lord of Spirits will abide over them," },
  { t = "v", n = 14, indent = 1, cont = true, text = "And with that Son of Man shall they eat" },
  { t = "v", n = 14, indent = 1, cont = true, text = "And lie down and rise up for ever and ever." },
  { t = "v", n = 15, indent = 1, p = true, text = "And the righteous and elect shall have risen from the earth," },
  { t = "v", n = 15, indent = 1, cont = true, text = "And ceased to be of downcast countenance." },
  { t = "v", n = 15, indent = 1, p = true, cont = true, text = "And they shall have been clothed with garments of glory," },
  { t = "v", n = 16, indent = 1, text = "And these shall be the garments of life from the Lord of Spirits:" },
  { t = "v", n = 16, indent = 1, cont = true, text = "And your garments shall not grow old," },
  { t = "v", n = 16, indent = 1, cont = true, text = "Nor your glory pass away before the Lord of Spirits." },
]

[[section]]
id = "63"
title = "Chapter 63"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXIII. The unavailing Repentance of the Kings and the Mighty." },
  { t = "v", n = 1, p = true, text = "In those days shall the mighty and the kings who possess the earth implore (Him) to grant them a little respite from His angels of punishment to whom they were delivered, that they might fall down and worship before the Lord of Spirits, and confess their sins before Him." },
  { t = "v", n = 2, text = "And they shall bless and glorify the Lord of Spirits, and say:" },
  { t = "v", n = 2, indent = 1, p = true, cont = true, text = "'Blessed is the Lord of Spirits and the Lord of kings," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And the Lord of the mighty and the Lord of the rich," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And the Lord of glory and the Lord of wisdom," },
  { t = "v", n = 3, indent = 1, text = "And splendid in every secret thing is Thy power from generation to generation," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And Thy glory for ever and ever:" },
  { t = "v", n = 3, indent = 1, p = true, cont = true, text = "Deep are all Thy secrets and innumerable," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And Thy righteousness is beyond reckoning." },
  { t = "v", n = 4, indent = 1, p = true, text = "We have now learnt that we should glorify" },
  { t = "v", n = 4, indent = 1, cont = true, text = "And bless the Lord of kings and Him who is king over all kings.'" },
  { t = "v", n = 5, indent = 1, p = true, text = "And they shall say:" },
  { t = "v", n = 5, indent = 1, cont = true, text = "'Would that we had rest to glorify and give thanks" },
  { t = "v", n = 5, indent = 1, cont = true, text = "And confess our faith before His glory!" },
  { t = "v", n = 6, indent = 1, p = true, text = "And now we long for a little rest but find it not:" },
  { t = "v", n = 6, indent = 1, cont = true, text = "We follow hard upon (it) and obtain (it) not:" },
  { t = "v", n = 6, indent = 1, p = true, cont = true, text = "And light has vanished from before us," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And darkness is our dwelling-place for ever and ever:" },
  { t = "v", n = 7, indent = 1, p = true, text = "For we have not believed before Him" },
  { t = "v", n = 7, indent = 1, cont = true, text = "Nor glorified the name of the Lord of Spirits, [nor glorified our Lord]" },
  { t = "v", n = 7, indent = 1, p = true, cont = true, text = "But our hope was in the sceptre of our kingdom," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And in our glory." },
  { t = "v", n = 8, indent = 1, p = true, text = "And in the day of our suffering and tribulation He saves us not," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And we find no respite for confession" },
  { t = "v", n = 8, indent = 1, p = true, cont = true, text = "That our Lord is true in all His works, and in His judgements and His justice," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And His judgements have no respect of persons." },
  { t = "v", n = 9, indent = 1, p = true, text = "And we pass away from before His face on account of our works," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And all our sins are reckoned up in righteousness.'" },
  { t = "v", n = 10, p = true, text = "Now they shall say unto themselves: 'Our souls are full of unrighteous gain, but it does not prevent us from descending from the midst thereof into the †burden† of Sheol.'" },
  { t = "v", n = 11, indent = 1, p = true, text = "And after that their faces shall be filled with darkness" },
  { t = "v", n = 11, indent = 1, cont = true, text = "And shame before that Son of Man," },
  { t = "v", n = 11, indent = 1, cont = true, text = "And they shall be driven from his presence," },
  { t = "v", n = 11, indent = 1, cont = true, text = "And the sword shall abide before his face in their midst." },
  { t = "v", n = 12, p = true, text = "Thus spake the Lord of Spirits: 'This is the ordinance and judgement with respect to the mighty and the kings and the exalted and those who possess the earth before the Lord of Spirits.'" },
]

[[section]]
id = "64"
title = "Chapter 64"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXIV. Vision of the fallen Angels in the Place of Punishment." },
  { t = "v", n = 1, p = true, text = "And other forms I saw hidden in that place." },
  { t = "v", n = 2, text = "I heard the voice of the angel saying: 'These are the angels who descended to the earth, and revealed what was hidden to the children of men and seduced the children of men into committing sin.'" },
]

[[section]]
id = "65"
title = "Chapter 65"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXV. Enoch foretells to Noah the Deluge and his own Preservation." },
  { t = "v", n = 1, p = true, text = "And in those days Noah saw the earth that it had sunk down and its destruction was nigh." },
  { t = "v", n = 2, text = "And he arose from thence and went to the ends of the earth, and cried aloud to his grandfather Enoch: and Noah said three times with an embittered voice: Hear me, hear me, hear me.'" },
  { t = "v", n = 3, text = "And I said unto him: 'Tell me what it is that is falling out on the earth that the earth is in such evil plight and shaken, lest perchance I shall perish with it?'" },
  { t = "v", n = 4, text = "And thereupon there was a great commotion, on the earth, and a voice was heard from heaven, and I fell on my face." },
  { t = "v", n = 5, text = "And Enoch my grandfather came and stood by me, and said unto me: 'Why hast thou cried unto me with a bitter cry and weeping?" },
  { t = "v", n = 6, p = true, text = "And a command has gone forth from the presence of the Lord concerning those who dwell on the earth that their ruin is accomplished because they have learnt all the secrets of the angels, and all the violence of the Satans, and all their powers—the most secret ones—and all the power of those who practise sorcery, and the power of witchcraft, and the power of those who make molten images for the whole earth:" },
  { t = "v", n = 7, text = "And how silver is produced from the dust of the earth, and how soft metal originates in the earth." },
  { t = "v", n = 8, text = "For lead and tin are not produced from the earth like the first: it is a fountain that produces them, and an angel stands therein, and that angel is pre-eminent.'" },
  { t = "v", n = 9, text = "And after that my grandfather Enoch took hold of me by my hand and raised me up, and said unto me: 'Go, for I have asked the Lord of Spirits as touching this commotion on the earth." },
  { t = "v", n = 10, text = "And He said unto me: \"Because of their unrighteousness their judgement has been determined upon and shall not be **withheld** by Me for ever. Because of the **sorceries** which they have searched out and learnt, the earth and those who dwell upon it shall be destroyed.\"" },
  { t = "v", n = 11, text = "And these—they have no **place of repentance** for ever, because they have shown them what was hidden, and they are the damned: but as for thee, my son, the Lord of Spirits knows that thou art pure, and guiltless of this reproach concerning the secrets." },
  { t = "v", n = 12, indent = 1, p = true, text = "And He has destined thy name to be among the holy," },
  { t = "v", n = 12, indent = 1, cont = true, text = "And will preserve thee amongst those who dwell on the earth," },
  { t = "v", n = 12, indent = 1, cont = true, text = "And has destined thy righteous seed both for kingship and for great honours," },
  { t = "v", n = 12, indent = 1, cont = true, text = "And from thy seed shall proceed a fountain of the righteous and holy without number for ever." },
]

[[section]]
id = "66"
title = "Chapter 66"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXVI. The Angels of the Waters bidden to hold them in Check." },
  { t = "v", n = 1, p = true, text = "And after that he showed me the angels of punishment who are prepared to come and let loose all the powers of the waters which are beneath in the earth in order to bring judgement and destruction on all who [abide and] dwell on the earth." },
  { t = "v", n = 2, text = "And the Lord of Spirits gave commandment to the angels who were going forth, that they should not cause **the waters** to rise but should hold them in check; for those angels were over the powers of the waters." },
  { t = "v", n = 3, text = "And I went away from the presence of Enoch." },
]

[[section]]
id = "67"
title = "Chapter 67"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXVII. God's Promise to Noah: Places of Punishment of the Angels and of the Kings." },
  { t = "v", n = 1, p = true, text = "And in those days the word of God came unto me, and He said unto me: 'Noah, thy lot has come up before Me, a lot without blame, a lot of love and uprightness." },
  { t = "v", n = 2, text = "And now the angels are making a wooden (building), and when they have completed that task I will place My hand upon it and preserve it, and there shall come forth from it the seed of life, and a change shall set in so that the earth will not remain without inhabitant." },
  { t = "v", n = 3, text = "And I will make fast thy seed before me for ever and ever, and I will spread abroad those who dwell with thee: it shall not **be unfruitful** on the face of the earth, but it shall be blessed and multiply on the earth in the name of the Lord.'" },
  { t = "v", n = 4, p = true, text = "And He will imprison those angels, who have shown unrighteousness, in that burning valley which my grandfather Enoch had formerly shown to me in the west among the mountains of gold and silver and iron and soft metal and tin." },
  { t = "v", n = 5, text = "And I saw that valley in which there was a great convulsion and a convulsion of the waters." },
  { t = "v", n = 6, text = "And when all this took place, from that fiery molten metal and from the convulsion thereof in that place, there was produced a smell of sulphur, and it was connected with those waters, and that valley of the angels who had led astray (mankind) burned beneath that land." },
  { t = "v", n = 7, text = "And through its valleys proceed streams of fire, where these angels are punished who had led astray those who dwell upon the earth." },
  { t = "v", n = 8, p = true, text = "But those waters shall in those days serve for the kings and the mighty and the exalted, and those who dwell on the earth, for the healing of the body, but for the punishment of the spirit; now their spirit is full of lust, that they may be punished in their body, for they have denied the Lord of Spirits and see their punishment daily, and yet believe not in His name." },
  { t = "v", n = 9, text = "And in proportion as the burning of their bodies becomes severe, a corresponding change shall take place in their spirit for ever and ever; for before the Lord of Spirits none shall utter an idle word." },
  { t = "v", n = 10, text = "For the judgement shall come upon them, because they believe in the lust of their body and deny the Spirit of the Lord." },
  { t = "v", n = 11, text = "And those same waters will undergo a change in those days; for when those angels are punished in these waters, these water-springs shall change their temperature, and when the angels ascend, this water of the springs shall change and become cold." },
  { t = "v", n = 12, text = "And I heard Michael answering and saying: 'This judgement wherewith the angels are judged is a testimony for the kings and the mighty who possess the earth.'" },
  { t = "v", n = 13, text = "Because these waters of judgement minister to the healing of the body of the **kings** and the lust of their body; therefore they will not see and will not believe that those waters will change and become a fire which burns for ever." },
]

[[section]]
id = "68"
title = "Chapter 68"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXVIII. Michael and Raphael astonied at the Severity of the Judgement." },
  { t = "v", n = 1, p = true, text = "And after that my grandfather Enoch gave me the teaching of all the secrets in the book and in the Parables which had been given to him, and he put them together for me in the words of the book of the Parables." },
  { t = "v", n = 2, text = "And on that day Michael answered Raphael and said: 'The power of the spirit transports and **makes me to tremble** because of the severity of the judgement of the secrets, the judgement of the angels: who can endure the severe judgement which has been executed, and before which they melt away?'" },
  { t = "v", n = 3, text = "And Michael answered again, and said to Raphael: 'Who is he whose heart is not softened concerning it, and whose reins are not troubled by this word of judgement (that) has gone forth upon them because of those who have thus led them out?'" },
  { t = "v", n = 4, text = "And it came to pass when he stood before the Lord of Spirits, Michael said thus to Raphael: 'I will not take their part under the eye of the Lord; for the Lord of Spirits has been angry with them because they do as if they were the Lord. Therefore all that is hidden shall come upon them for ever and ever; for neither angel nor man shall have his portion (in it), but alone they have received their judgement for ever and ever.'" },
]

[[section]]
id = "69"
title = "Chapter 69"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXIX. The Names and Functions of the (fallen Angels and) Satans: the secret Oath." },
  { t = "v", n = 1, p = true, text = "And after this judgement they shall terrify and **make** them **to tremble** because they have shown this to those who dwell on the earth." },
  { t = "v", n = 2, p = true, text = "And behold the names of those angels [and these are their names: the first of them is Samjâzâ, the second Artâqîfâ, and the third Armên, the fourth Kôkabêl, the fifth †Tûrâêl†, the sixth Rûmjâl, the seventh Dânjâl, the eighth †Nêqâêl†, the ninth Barâqêl, the tenth Azâzêl, the eleventh Armârôs, the twelfth Batarjâl, the thirteenth †Busasêjal†, the fourteenth Hanânêl, the fifteenth †Tûrêl†, and the sixteenth Sîmâpêsîêl, the seventeenth Jetrêl, the eighteenth Tûmâêl, the nineteenth Tûrêl, the twentieth †Rumâêl†, the twenty-first †Azâzêl†." },
  { t = "v", n = 3, text = "And these are the chiefs of their angels and their names, and their chief ones over hundreds and over fifties and over tens]." },
  { t = "v", n = 4, p = true, text = "The name of the first Jeqôn: that is, the one who led astray ⌈all⌉ the sons of **God**, and brought them down to the earth, and led them astray through the daughters of men." },
  { t = "v", n = 5, text = "And the second was named Asbeêl: he imparted to the holy sons of **God** evil counsel, and led them astray so that they defiled their bodies with the daughters of men." },
  { t = "v", n = 6, text = "And the third was named Gâdreêl: he it is who showed the children of men all the blows of death, and he led astray Eve, and showed ⌈the weapons of death to the sons of men⌉ the shield and the coat of mail, and the sword for battle, and all the weapons of death to the children of men." },
  { t = "v", n = 7, text = "And from his hand they have proceeded against those who dwell on the earth from that day and for evermore." },
  { t = "v", n = 8, text = "And the fourth was named Pênêmûe: he taught the children of men the bitter and the sweet, and he taught them all the secrets of their wisdom." },
  { t = "v", n = 9, text = "And he instructed mankind in writing with ink and paper, and thereby many sinned from eternity to eternity and until this day." },
  { t = "v", n = 10, text = "For men were not created for such a purpose, to give confirmation to their good faith with pen and ink." },
  { t = "v", n = 11, text = "For men were created exactly like the angels, to the intent that they should continue pure and righteous, and death, which destroys everything, could not have taken hold of them, but through this their knowledge they are perishing, and through this power it is consuming me†." },
  { t = "v", n = 12, text = "And the fifth was named Kâsdejâ: this is he who showed the children of men all the wicked smitings of spirits and demons, and the smitings of the embryo in the womb, that it may pass away, and [the smitings of the soul] the bites of the serpent, and the smitings which befall through the noontide heat, the son of the serpent named Tabââ‘ĕt." },
  { t = "v", n = 13, text = "And this is the **task** of Kâsbeêl, the chief of the oath which he showed to the holy ones when he dwelt high above in glory, and its name is Bîqâ." },
  { t = "v", n = 14, text = "This (angel) requested Michael to show him the hidden name, that he might enunciate it in the oath, so that those might quake before that name and oath who revealed all that was in secret to the children of men." },
  { t = "v", n = 15, text = "And this is the power of this oath, for it is powerful and strong, and he placed this oath Akâe in the hand of Michael." },
  { t = "v", n = 16, text = "And these are the secrets of this oath . . ." },
  { t = "v", n = 16, indent = 1, p = true, cont = true, text = "And they are strong through his oath:" },
  { t = "v", n = 16, indent = 1, cont = true, text = "And the heaven was suspended before the world was created," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And for ever." },
  { t = "v", n = 17, indent = 1, p = true, text = "And through it the earth was founded upon the water," },
  { t = "v", n = 17, indent = 1, p = true, cont = true, text = "And from the secret recesses of the mountains come beautiful waters," },
  { t = "v", n = 17, indent = 1, cont = true, text = "From the creation of the world and unto eternity." },
  { t = "v", n = 18, indent = 1, p = true, text = "And through that oath the sea was created," },
  { t = "v", n = 18, indent = 1, cont = true, text = "And †as its foundation† He set for it the sand against the time of (its) anger," },
  { t = "v", n = 18, indent = 1, cont = true, text = "And it dare not pass beyond it from the creation of the world unto eternity." },
  { t = "v", n = 19, indent = 1, p = true, text = "And through that oath are the depths made fast," },
  { t = "v", n = 19, indent = 1, cont = true, text = "And abide and stir not from their place from eternity to eternity." },
  { t = "v", n = 20, indent = 1, text = "And through that oath the sun and moon complete their course," },
  { t = "v", n = 20, indent = 1, cont = true, text = "And deviate not from their ordinance from eternity to eternity." },
  { t = "v", n = 21, indent = 1, text = "And through that oath the stars complete their course," },
  { t = "v", n = 21, indent = 1, cont = true, text = "And He calls them by their names," },
  { t = "v", n = 21, indent = 1, cont = true, text = "And they answer Him from eternity to eternity." },
  { t = "v", n = 21, p = true, cont = true, text = "⌈22." },
  { t = "v", n = 22, text = "And in like manner the spirits of the water, and of the winds, and of all zephyrs, and (their) paths from all the quarters of the winds." },
  { t = "v", n = 23, text = "And there are preserved the voices of the thunder and the light of the lightnings: and there are preserved the chambers of the hail and the chambers of the hoarfrost, and the chambers of the mist, and the chambers of the rain and the dew." },
  { t = "v", n = 24, text = "And all these believe and give thanks before the Lord of Spirits, and glorify (Him) with all their power, and their food is in every act of thanksgiving: they thank and glorify and extol the name of the Lord of Spirits for ever and ever.⌉" },
  { t = "v", n = 25, indent = 1, p = true, text = "And this oath is mighty over them" },
  { t = "v", n = 25, indent = 1, cont = true, text = "And through it ⌈they are preserved and⌉ their paths are preserved," },
  { t = "v", n = 25, indent = 1, cont = true, text = "And their course is not destroyed." },
  { t = "h", level = 3, text = "Close of the Third Parable." },
  { t = "v", n = 26, indent = 1, p = true, text = "And there was great joy amongst them," },
  { t = "v", n = 26, indent = 1, cont = true, text = "And they blessed and glorified and extolled" },
  { t = "v", n = 26, indent = 1, cont = true, text = "Because the name of that Son of Man had been revealed unto them." },
  { t = "v", n = 27, indent = 1, text = "And he sat on the throne of his glory," },
  { t = "v", n = 27, indent = 1, cont = true, text = "And the sum of judgement was given unto the Son of Man," },
  { t = "v", n = 27, indent = 1, cont = true, text = "And he caused the sinners to pass away and be destroyed from off the face of the earth," },
  { t = "v", n = 27, indent = 1, cont = true, text = "And those who have led the world astray." },
  { t = "v", n = 28, indent = 1, text = "With chains shall they be bound," },
  { t = "v", n = 28, indent = 1, cont = true, text = "And in their assemblage-place of destruction shall they be imprisoned," },
  { t = "v", n = 28, indent = 1, cont = true, text = "And all their works vanish from the face of the earth." },
  { t = "v", n = 29, indent = 1, text = "And from henceforth there shall be nothing corruptible;" },
  { t = "v", n = 29, indent = 1, cont = true, text = "For that Son of Man has appeared," },
  { t = "v", n = 29, indent = 1, cont = true, text = "And has seated himself on the throne of his glory," },
  { t = "v", n = 29, indent = 1, cont = true, text = "And all evil shall pass away before his face," },
  { t = "v", n = 29, indent = 1, cont = true, text = "And the word of that Son of Man shall go forth" },
  { t = "v", n = 29, indent = 1, cont = true, text = "And be strong before the Lord of Spirits." },
  { t = "v", n = 29, p = true, cont = true, text = "This is the Third Parable of Enoch." },
]

[[section]]
id = "70"
title = "Chapter 70"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXX. The Final Translation of Enoch." },
  { t = "v", n = 1, p = true, text = "And it came to pass after this that his name during his lifetime was raised aloft to that Son of Man and to the Lord of Spirits from amongst those who dwell on the earth." },
  { t = "v", n = 2, text = "And he was raised aloft on the chariots of the spirit and his name vanished among them." },
  { t = "v", n = 3, text = "And from that day I was no longer numbered amongst them: and he set me between the two winds, between the North and the West, where the angels took the cords to measure for me the place for the elect and righteous." },
  { t = "v", n = 4, text = "And there" },
  { t = "v", n = 4, p = true, cont = true, text = "I saw the first fathers and the righteous who from the beginning dwell in that place." },
]

[[section]]
id = "71"
title = "Chapter 71"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXXI. Two earlier visions of Enoch." },
  { t = "v", n = 1, indent = 1, p = true, text = "And it came to pass after this that my spirit was translated" },
  { t = "v", n = 1, indent = 1, cont = true, text = "And it ascended into the heavens:" },
  { t = "v", n = 1, indent = 1, cont = true, text = "And I saw the **holy sons of God**." },
  { t = "v", n = 1, indent = 1, p = true, cont = true, text = "They were stepping on flames of fire:" },
  { t = "v", n = 1, indent = 1, cont = true, text = "Their garments were white [and their raiment]," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And their faces shone like snow." },
  { t = "v", n = 2, indent = 1, p = true, text = "And I saw two streams of fire," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And the light of that fire shone like hyacinth," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And I fell on my face before the Lord of Spirits." },
  { t = "v", n = 3, indent = 1, p = true, text = "And the angel Michael [one of the archangels] seized me by my right hand," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And lifted me up and led me forth into all the secrets," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And he showed me all the secrets of righteousness." },
  { t = "v", n = 4, indent = 1, p = true, text = "And he showed me all the secrets of the ends of the heaven," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And all the chambers of all the stars, and all the luminaries," },
  { t = "v", n = 4, indent = 1, cont = true, text = "Whence they proceed before the face of the holy ones." },
  { t = "v", n = 5, indent = 1, p = true, text = "And he translated my spirit into the heaven of heavens," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And I saw there as it were a structure built of crystals," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And between those crystals tongues of living fire." },
  { t = "v", n = 6, indent = 1, p = true, text = "And my spirit saw the girdle which girt that house of fire," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And on its four sides were streams full of living fire," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And they girt that house." },
  { t = "v", n = 7, indent = 1, p = true, text = "And round about were Seraphin, Cherubin, and Ophannin:" },
  { t = "v", n = 7, indent = 1, cont = true, text = "And these are they who sleep not" },
  { t = "v", n = 7, indent = 1, cont = true, text = "And guard the throne of His glory." },
  { t = "v", n = 8, indent = 1, p = true, text = "And I saw angels who could not be counted," },
  { t = "v", n = 8, indent = 1, cont = true, text = "A thousand thousands, and ten thousand times ten thousand," },
  { t = "v", n = 8, indent = 1, cont = true, text = "Encircling that house." },
  { t = "v", n = 8, indent = 1, p = true, cont = true, text = "And Michael, and Raphael, and Gabriel, and Phanuel," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And the holy angels who are above the heavens," },
  { t = "v", n = 8, indent = 1, cont = true, text = "Go in and out of that house." },
  { t = "v", n = 9, indent = 1, p = true, text = "And they came forth from that house," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And Michael and Gabriel, Raphael and Phanuel," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And many holy angels without number." },
  { t = "v", n = 10, indent = 1, p = true, text = "And with them the Head of Days," },
  { t = "v", n = 10, indent = 1, cont = true, text = "His head white and pure as wool," },
  { t = "v", n = 10, indent = 1, cont = true, text = "And His raiment indescribable." },
  { t = "v", n = 11, indent = 1, p = true, text = "And I fell on my face," },
  { t = "v", n = 11, indent = 1, cont = true, text = "And my whole body became relaxed," },
  { t = "v", n = 11, indent = 1, cont = true, text = "And my spirit was transfigured;" },
  { t = "v", n = 11, indent = 1, p = true, cont = true, text = "And I cried with a loud voice," },
  { t = "v", n = 11, indent = 1, cont = true, text = ". . .with the spirit of power," },
  { t = "v", n = 11, indent = 1, cont = true, text = "And blessed and glorified and extolled." },
  { t = "v", n = 12, p = true, text = "And these blessings which went forth out of my mouth were well pleasing before that Head of Days." },
  { t = "v", n = 13, text = "And that Head of Days came with Michael and Gabriel, Raphael and Phanuel, thousands and ten thousands of angels without number." },
  { t = "v", n = 13, p = true, cont = true, text = "[Lost passage wherein the Son of Man was described as accompanying the Head of Days, and Enoch asked one of the angels (as in 463) concerning the Son of Man as to who he was.]" },
  { t = "v", n = 14, p = true, text = "And he (*i.e.* the angel) came to me and greeted me with His voice, and said unto me:" },
  { t = "v", n = 14, indent = 1, p = true, cont = true, text = "'**This is** the Son of Man who is born unto righteousness;" },
  { t = "v", n = 14, indent = 1, p = true, cont = true, text = "And righteousness abides over him," },
  { t = "v", n = 14, indent = 1, cont = true, text = "And the righteousness of the Head of Days forsakes him not.'" },
  { t = "v", n = 15, indent = 1, text = "And he said unto me:" },
  { t = "v", n = 15, indent = 1, cont = true, text = "'He proclaims unto thee peace in the name of the world to come;" },
  { t = "v", n = 15, indent = 1, cont = true, text = "For from hence has proceeded peace since the creation of the world," },
  { t = "v", n = 15, indent = 1, cont = true, text = "And so shall it be unto thee for ever and for ever and ever." },
  { t = "v", n = 16, indent = 1, p = true, text = "And all shall walk in **his** ways since righteousness never forsakes **him**:" },
  { t = "v", n = 16, indent = 1, cont = true, text = "With **him** will be their dwelling-places, and with **him** their heritage," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And they shall not be separated from him for ever and ever and ever." },
  { t = "v", n = 17, indent = 1, p = true, text = "And so there shall be length of days with that Son of Man," },
  { t = "v", n = 17, indent = 1, cont = true, text = "And the righteous shall have peace and an upright way" },
  { t = "v", n = 17, indent = 1, cont = true, text = "In the name of the Lord of Spirits for ever and ever.'" },
]

[[section]]
id = "72"
title = "Chapter 72"
level = 1
blocks = [
  { t = "h", level = 2, text = "THE BOOK OF THE COURSES OF THE HEAVENLY LUMINARIES (LXXII-LXXXII.)" },
  { t = "h", level = 3, text = "LXXII. The Sun." },
  { t = "v", n = 1, p = true, text = "The book of the courses of the luminaries of the heaven, the relations of each, according to their classes, their dominion and their seasons, according to their names and places of origin, and according to their months, which Uriel, the holy angel, who was with me, who is their guide, showed me; and he showed me all their laws exactly as they are, and how it is with regard to all the years of the world and unto eternity, till the new creation is accomplished which dureth till eternity." },
  { t = "v", n = 2, text = "And this is the first law of the luminaries: the luminary the Sun has its rising in the eastern portals of the heaven, and its setting in the western portals of the heaven." },
  { t = "v", n = 3, text = "And I saw six portals in which the sun rises, and six portals in which the sun sets and the moon rises and sets in these portals, and the leaders of the stars and those whom they lead: six in the east and six in the west, and all following each other in accurately corresponding order: also many windows to the right and left of these portals." },
  { t = "v", n = 4, text = "And first there goes forth the great luminary, named the Sun, and his circumference is like the circumference of the heaven, and he is quite filled with illuminating and heating fire." },
  { t = "v", n = 5, text = "The chariot on which he ascends, the wind drives, and the sun goes down from the heaven and returns through the north in order to reach the east, and is so guided that he comes to the appropriate (lit. 'that') portal and shines in the face of the heaven." },
  { t = "v", n = 6, text = "In this way he rises in the first month in the great portal, which is the fourth ⌈those six portals in the cast⌉." },
  { t = "v", n = 7, text = "And in that fourth portal from which the sun rises in the first month are twelve window-openings, from which proceed a flame when they are opened in their season." },
  { t = "v", n = 8, text = "When the sun rises in the heaven, he comes forth through that fourth portal thirty mornings in succession, and sets accurately in the fourth portal in the west of the heaven." },
  { t = "v", n = 9, text = "And during this period the day becomes daily longer and the night nightly shorter to the thirtieth morning." },
  { t = "v", n = 10, text = "On that day the day is longer than the night by a ninth part, and the day amounts exactly to ten parts and the night to eight parts." },
  { t = "v", n = 11, text = "And the sun rises from that fourth portal, and sets in the fourth and returns to the fifth portal of the east thirty mornings, and rises from it and sets in the fifth portal." },
  { t = "v", n = 12, text = "And then the day becomes longer by †two† parts and amounts to eleven parts, and the night becomes shorter and amounts to seven parts." },
  { t = "v", n = 13, text = "And it returns to the east and enters into the sixth portal, and rises and sets in the sixth portal one-and-thirty mornings on account of its sign." },
  { t = "v", n = 14, text = "On that day the day becomes longer than the night, and the day becomes double the night, and the day becomes twelve parts, and the night is shortened and becomes six parts." },
  { t = "v", n = 15, text = "And the sun mounts up to make the day shorter and the night longer, and the sun returns to the east and enters into the sixth portal, and rises from it and sets thirty mornings." },
  { t = "v", n = 16, text = "And when thirty mornings are accomplished, the day decreases by exactly one part, and becomes eleven parts, and the night seven." },
  { t = "v", n = 17, text = "And the sun goes forth from that sixth portal in the west, and goes to the east and rises in the fifth portal for thirty mornings, and sets in the west again in the fifth western portal." },
  { t = "v", n = 18, text = "On that day the day decreases by †two† parts, and amounts to ten parts and the night to eight parts." },
  { t = "v", n = 19, text = "And the sun goes forth from that fifth portal and sets in the fifth portal of the west, and rises in the fourth portal for one-and-thirty mornings on account of its sign, and sets in the west." },
  { t = "v", n = 20, text = "On that day the day is equalised with the night, [and becomes of equal length], and the night amounts to nine parts and the day to nine parts." },
  { t = "v", n = 21, text = "And the sun rises from that portal and sets in the west, and returns to the east and rises thirty mornings in the third portal and sets in the west in the third portal." },
  { t = "v", n = 22, text = "And on that day the night becomes longer than the day, and night becomes longer than night, and day shorter than day till the thirtieth morning, and the night amounts exactly to ten parts and the day to eight parts." },
  { t = "v", n = 23, text = "And the sun rises from that third portal and sets in the third portal in the west and returns to the east, and for thirty mornings rises in the second portal in the east, and in like manner sets in the second portal in the west of the heaven." },
  { t = "v", n = 24, text = "And on that day the night amounts to eleven parts and the day to seven parts." },
  { t = "v", n = 25, text = "And the sun rises on that day from that second portal and sets in the west in the second portal, and returns to the east into the first portal for one-and-thirty mornings, and sets in the first portal in the west of the heaven." },
  { t = "v", n = 26, text = "And on that day the night becomes longer and amounts to the double of the day: and the night amounts exactly to twelve parts and the day to six." },
  { t = "v", n = 27, text = "And the sun has (therewith) traversed the divisions of his orbit and turns again on those divisions of his orbit, and enters that portal thirty mornings and sets also in the west opposite to it." },
  { t = "v", n = 28, text = "And on that night has the night decreased in length by a †ninth† part, and the night has become eleven parts and the day seven parts." },
  { t = "v", n = 29, text = "And the sun has returned and entered into the second portal in the east, and returns on those his divisions of his orbit for thirty mornings, rising and setting." },
  { t = "v", n = 30, text = "And on that day the night decreases in length, and the night amounts to ten parts and the day to eight." },
  { t = "v", n = 31, text = "And on that day the sun rises from that portal, and sets in the west, and returns to the east, and rises in the third portal for one-and-thirty mornings, and sets in the west of the heaven." },
  { t = "v", n = 32, text = "On that day the night decreases and amounts to nine parts, and the day to nine parts, and the night is equal to the day and the year is exactly as to its days three hundred and sixty-four." },
  { t = "v", n = 33, text = "And the length of the day and of the night, and the shortness of the day and of the night arise—through the course of the sun these distinctions are made (lit. 'they are separated')." },
  { t = "v", n = 34, text = "So it comes that its course becomes daily longer, and its course nightly shorter." },
  { t = "v", n = 35, text = "And this is the law and the course of the sun, and his return as often as he returns sixty times and rises, *i.e.* the great luminary which is named the sun, for ever and ever." },
  { t = "v", n = 36, text = "And that which (thus) rises is the great luminary, and is so named according to its appearance, according as the Lord commanded." },
  { t = "v", n = 37, text = "As he rises, so he sets and decreases not, and rests not, but runs day and night, and his light is sevenfold brighter than that of the moon; but as regards size they are both equal." },
]

[[section]]
id = "73"
title = "Chapter 73"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And after this law I saw another law dealing with the smaller luminary, which is named the Moon." },
  { t = "v", n = 2, text = "And her circumference is like the circumference of the heaven, and her chariot in which she rides is driven by the wind, and light is given to her in (definite) measure." },
  { t = "v", n = 3, text = "And her rising and setting changes every month: and her days are like the days of the sun, and when her light is uniform (*i.e.* full) it amounts to the seventh part of the light of the sun." },
  { t = "v", n = 4, text = "And thus she rises. And her first phase in the east comes forth on the thirtieth morning: and on that day she becomes visible, and constitutes for you the first phase of the moon on the thirtieth day together with the sun in the portal where the sun rises." },
  { t = "v", n = 5, text = "And the one half of her goes forth by a seventh part, and her whole circumference is empty, without light, with the exception of one-seventh part of it, (and) the fourteenth part of her light." },
  { t = "v", n = 6, text = "And when she receives one-seventh part of the half of her light, her light amounts to one-seventh part and the half thereof." },
  { t = "v", n = 7, text = "And she sets with the sun, and when the sun rises the moon rises with him and receives the half of one part of light, and in that night in the beginning of her morning [in the commencement of the lunar day] the moon sets with the sun, and is invisible that night with the fourteen parts and the half of one of them." },
  { t = "v", n = 8, text = "And she rises on that day with exactly a seventh part, and comes forth and recedes from the rising of the sun, and in her remaining days she becomes bright in the (remaining) thirteen parts." },
]

[[section]]
id = "74"
title = "Chapter 74"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And I saw another course, a law for her, (and) how according to that law she performs her monthly revolution." },
  { t = "v", n = 2, text = "And all these Uriel, the holy angel who is the leader of them all, showed to me, and their positions, and I wrote down their positions as he showed them to me, and I wrote down their months as they were, and the appearance of their lights till fifteen days were accomplished." },
  { t = "v", n = 3, text = "In single seventh parts she accomplishes all her light in the east, and in single seventh parts accomplishes all her darkness in the west." },
  { t = "v", n = 4, text = "And in certain months she alters her settings, and in certain months she pursues her own peculiar course." },
  { t = "v", n = 5, text = "In two months the moon sets with the sun: in those two middle portals the third and the fourth." },
  { t = "v", n = 6, text = "She goes forth for seven days, and turns about and returns again through the portal where the sun rises, and accomplishes all her light: and she recedes from the sun, and in eight days enters the sixth portal from which the sun goes forth." },
  { t = "v", n = 7, text = "And when the sun goes forth from the fourth portal she goes forth seven days, until she goes forth from the fifth and turns back again in seven days into the fourth portal and accomplishes all her light: and she recedes and enters into the first portal in eight days." },
  { t = "v", n = 8, text = "And she returns again in seven days into the fourth portal from which the sun goes forth." },
  { t = "v", n = 9, text = "Thus I saw their position—how the moons rose and the sun set in those days." },
  { t = "v", n = 10, text = "And if five years are added together the sun has an overplus of thirty days, and all the days which accrue to it for one of those five years, when they are full, amount to 364 days." },
  { t = "v", n = 11, text = "And the overplus of the sun and of the stars amounts to six days: in 5 years 6 days every year come to 30 days: and the moon falls behind the sun and stars to the number of 30 days." },
  { t = "v", n = 12, text = "And **the sun** and the stars bring in all the years exactly, so that they do not advance or delay their position by a single day unto eternity; but **complete** the years with perfect justice in 364 days." },
  { t = "v", n = 13, text = "In 3 years there are 1092 days, and in 5 years 1820 days, so that in 8 years there are 2912 days." },
  { t = "v", n = 14, text = "For the moon alone the days amount in 3 years to 1062 days, and in 5 years she falls 50 days behind: [*i.e.* to the sum (of 1770) there is to be added (1000 and) 62 days.]" },
  { t = "v", n = 15, text = "And in 5 years there are 1770 days, so that for the moon the days in 8 years amount to 2832 days." },
  { t = "v", n = 16, text = "[For in 8 years she falls behind to the amount of 80 days], all the days she falls behind in 8 years are 80." },
  { t = "v", n = 17, text = "And the year is accurately completed in conformity with their world-stations and the stations of the sun, which rise from the portals through which it (the sun) rises and sets 30 days." },
]

[[section]]
id = "75"
title = "Chapter 75"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And the leaders of the heads of the thousands, who are placed over the whole creation and over all the stars, have also to do with the four intercalary days, being inseparable from their office, according to the reckoning of the year, and these render service on the four days which are not reckoned in the reckoning of the year." },
  { t = "v", n = 2, text = "And owing to them men go wrong therein, for those luminaries truly render service on the world-stations, one in the first portal, one in the third portal of the heaven, one in the fourth portal, and one in the sixth portal, and the exactness of the year is accomplished through its separate three hundred and sixty-four stations." },
  { t = "v", n = 3, text = "For the signs and the times and the years and the days the angel Uriel showed to me, whom the Lord of glory hath set for ever over all the luminaries of the heaven, in the heaven and in the world, that they should rule on the face of the heaven and be seen on the earth, and be leaders for the day and the night, *i.e.* the sun, moon, and stars, and all the ministering creatures which make their revolution in all the chariots of the heaven." },
  { t = "v", n = 4, text = "In like manner twelve doors Uriel showed me, open in the circumference of the sun's chariot in the heaven, through which the rays of the sun break forth: and from them is warmth diffused over the earth, when they are opened at their appointed seasons." },
  { t = "v", n = 5, text = "[And for the winds and the spirit of the dew† when they are opened, standing open in the heavens at the ends.]" },
  { t = "v", n = 6, text = "As for the twelve portals in the heaven, at the ends of the earth, out of which go forth the sun, moon, and stars, and all the works of heaven in the east and in the west." },
  { t = "v", n = 7, text = "There are many windows open to the left and right of them, and one window at its (appointed) season produces warmth, corresponding (as these do) to those doors from which the stars come forth according as He has commanded them, and wherein they set corresponding to their number." },
  { t = "v", n = 8, text = "And I saw chariots in the heaven, running in the world, above those portals in which revolve the stars that never set." },
  { t = "v", n = 9, text = "And one is larger than all the rest, and it is that that makes its course through the entire world." },
]

[[section]]
id = "76"
title = "Chapter 76"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXXVI. The Twelve Winds and their Portals." },
  { t = "v", n = 1, p = true, text = "And at the ends of the earth I saw twelve portals open to all the **quarters** (of the heaven), from which the winds go forth and blow over the earth." },
  { t = "v", n = 2, text = "Three of them are open on the face (*i.e.* the east) of the heavens, and three in the west, and three on the right (*i.e.* the south) of the heaven, and three on the left (*i.e.* the north)." },
  { t = "v", n = 3, text = "And the three first are those of the east, and three are of †the north, and three [after those on the left] of the south†, and three of the west." },
  { t = "v", n = 4, text = "Through four of these come winds of blessing and prosperity, and from those eight come hurtful winds: when they are sent, they bring destruction on all the earth and on the water upon it, and on all who dwell thereon, and on everything which is in the water and on the land." },
  { t = "v", n = 5, p = true, text = "And the first wind from those portals, called the east wind, comes forth through the first portal which is in the east, inclining towards the south: from it come forth desolation, drought, heat, and destruction." },
  { t = "v", n = 6, text = "And through the second portal in the middle comes what is fitting, and from it there come rain and fruitfulness and prosperity and dew; and through the third portal which lies toward the north come cold and drought." },
  { t = "v", n = 7, p = true, text = "And after these come forth the south winds through three portals: through the first portal of them inclining to the east comes forth a hot wind." },
  { t = "v", n = 8, text = "And through the middle portal next to it there come forth fragrant smells, and dew and rain, and prosperity and health." },
  { t = "v", n = 9, text = "And through the third portal lying to the west come forth dew and rain, locusts and desolation." },
  { t = "v", n = 10, p = true, text = "And after these the north winds: from the seventh portal in the east come dew and rain, locusts and desolation." },
  { t = "v", n = 11, text = "And from the middle portal come in a direct direction health and rain and dew and prosperity; and through the third portal in the west come cloud and hoar-frost, and snow and rain, and dew and locusts." },
  { t = "v", n = 12, p = true, text = "And after these [four] are the west winds: through the first portal adjoining the north come forth dew and hoar-frost, and cold and snow and frost." },
  { t = "v", n = 13, text = "And from the middle portal come forth dew and rain, and prosperity and blessing; and through the last portal which adjoins the south come forth drought and desolation, and burning and destruction." },
  { t = "v", n = 14, text = "And the twelve portals of the four **quarters** of the heaven are therewith completed, and all their laws and all their plagues and all their benefactions have I shown to thee, my son Methuselah." },
]

[[section]]
id = "77"
title = "Chapter 77"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXXVII. The Four Quarters of the World: the Seven Mountains, the Seven Rivers, &c." },
  { t = "v", n = 1, p = true, text = "And the first **quarter** is called the east, because it is the first: and the second, the south, because the Most High **will descend** there, yea, there in quite a special sense will He who is blessed for ever **descend**." },
  { t = "v", n = 2, text = "And the west **quarter** is named the diminished, because there all the luminaries of the heaven wane and go down." },
  { t = "v", n = 3, text = "And the fourth **quarter**, named the north, is divided into three parts: the first of them is for the dwelling of men: and the second contains seas of water, and the abysses and forests and rivers, and darkness and clouds; and the third part contains the garden of righteousness." },
  { t = "v", n = 4, p = true, text = "I saw seven high mountains, higher than all the mountains which are on the earth: and thence comes forth hoar-frost, and days, seasons, and years pass away." },
  { t = "v", n = 5, text = "I saw seven rivers on the earth larger than all the rivers: one of them coming from the west pours its waters into the Great Sea." },
  { t = "v", n = 6, text = "And these two come from the north to the sea and pour their waters into the Erythraean Sea in the east." },
  { t = "v", n = 7, text = "And the remaining four come forth on the side of the north to their own sea, 〈two of them〉 to the Erythraean Sea, and two into the Great Sea and discharge themselves there [and some say: into the desert]." },
  { t = "v", n = 8, text = "Seven great islands I saw in the sea and in the mainland: two in the mainland and five in the Great Sea." },
]

[[section]]
id = "78"
title = "Chapter 78"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXXVIII. The Sun and Moon: the Waxing and Waning of the Moon." },
  { t = "v", n = 1, p = true, text = "And the names of the sun are the following: the first Orjârês, and the second Tômâs." },
  { t = "v", n = 2, text = "And the moon has four names: the first name is Asônjâ, the second Eblâ, the third Benâsê, and the fourth Erâe." },
  { t = "v", n = 3, text = "These are the two great luminaries: their circumference is like the circumference of the heaven, and the size of the circumference of both is alike." },
  { t = "v", n = 4, text = "In the circumference of the sun there are seven portions of light which are added to it more than to the moon, and in definite measures it is transferred till the seventh portion of the sun is exhausted." },
  { t = "v", n = 5, text = "And they set and enter the portals of the west, and make their revolution by the north, and come forth through the eastern portals on the face of the heaven." },
  { t = "v", n = 6, text = "And when the moon rises one-fourteenth part appears in the heaven: ⌈the light becomes full in her⌉: on the fourteenth day she accomplishes her light." },
  { t = "v", n = 7, text = "And fifteen parts of light are transferred to her till the fifteenth day (when) her light is accomplished, according to the sign of the year, and she becomes fifteen parts, and the moon grows by (the addition of) fourteenth parts." },
  { t = "v", n = 8, text = "And in her waning (the moon) decreases on the first day to fourteen parts of her light, on the second to thirteen parts of light, on the third to twelve, on the fourth to eleven, on the fifth to ten, on the sixth to nine, on the seventh to eight, on the eighth to seven, on the ninth to six, on the tenth to five, on the eleventh to four, on the twelfth to three, on the thirteenth to two, on the fourteenth to the half of a seventh, and all her remaining light disappears wholly on the fifteenth." },
  { t = "v", n = 9, text = "And in certain months the month has twenty-nine days and once twenty-eight." },
  { t = "v", n = 10, text = "And Uriel showed me another law: when light is transferred to the moon, and on which side it is transferred to her by the sun." },
  { t = "v", n = 11, text = "During all the period during which the moon is growing in her light, she is transferring it to herself when opposite to the sun during fourteen days [her light is accomplished in the heaven], and when she is illumined throughout, her light is accomplished in the heaven." },
  { t = "v", n = 12, text = "And on the first day she is called the new moon, for on that day the light rises upon her." },
  { t = "v", n = 13, text = "She becomes full moon exactly on the day when the sun sets in the west, and from the east she rises at night, and the moon shines the whole night through till the sun rises over against her and the moon is seen over against the sun." },
  { t = "v", n = 14, text = "On the side whence the light of the moon comes forth, there again she wanes till all the light vanishes and all the days of the month are at an end, and her circumference is empty, void of light." },
  { t = "v", n = 15, text = "And three months she makes of thirty days, and at her time she makes three months of twenty-nine days each, in which she accomplishes her waning in the first period of time, and in the first portal for one hundred and seventy-seven days." },
  { t = "v", n = 16, text = "And in the time of her going out she appears for three months (of) thirty days each, and for three months she appears (of) twenty-nine each." },
  { t = "v", n = 17, text = "At night she appears like a man for twenty days each time, and by day she appears like the heaven, and there is nothing else in her save her light." },
]

[[section]]
id = "79"
title = "Chapter 79"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXXIX-LXXX. 1. Recapitulation of several of the Laws." },
  { t = "v", n = 1, p = true, text = "And now, my son, I have shown thee everything, and the law of all the stars of the heaven is completed." },
  { t = "v", n = 2, text = "And he showed me all the laws of these for every day, and for every season of bearing rule, and for every year, and for its going forth, and for the order prescribed to it every month and every week:" },
  { t = "v", n = 3, text = "And the waning of the moon which takes place in the sixth portal: for in this sixth portal her light is accomplished, and after that there is the beginning of the waning:" },
  { t = "v", n = 4, text = "〈And the waning〉 which takes place in the first portal in its season, till one hundred and seventy-seven days are accomplished: reckoned according to weeks, twenty-five (weeks) and two days." },
  { t = "v", n = 5, text = "She falls behind the sun and the order of the stars exactly five days in the course of one period, and when this place which thou seest has been traversed." },
  { t = "v", n = 6, text = "Such is the picture and sketch of every luminary which Uriel the archangel, who is their leader, showed unto me." },
]

[[section]]
id = "80"
title = "Chapter 80"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And in those days the angel Uriel answered and said to me: 'Behold, I have shown thee everything, Enoch, and I have revealed everything to thee that thou shouldest see this sun and this moon, and the leaders of the stars of the heaven and all those who turn them, their tasks and times and departures." },
  { t = "h", level = 3, text = "LXXX. 2-8. Perversion of Nature and the heavenly Bodies owing to the Sin of Men." },
  { t = "v", n = 2, indent = 1, p = true, text = "And in the days of the sinners the years shall be shortened," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And their seed shall be tardy on their lands and fields," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And all things on the earth shall alter," },
  { t = "v", n = 2, indent = 1, p = true, cont = true, text = "And shall not appear in their time:" },
  { t = "v", n = 2, indent = 1, cont = true, text = "And the rain shall be kept back" },
  { t = "v", n = 2, indent = 1, cont = true, text = "And the heaven shall withhold (it)." },
  { t = "v", n = 3, indent = 1, p = true, text = "And in those times the fruits of the earth shall be backward," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And shall not grow in their time," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And the fruits of the trees shall be withheld in their time." },
  { t = "v", n = 4, indent = 1, p = true, text = "And the moon shall alter her order," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And not appear at her time." },
  { t = "v", n = 5, indent = 1, text = "[And in those days the **sun** shall be seen and he shall journey in the **evening** †on the extremity of the great chariot† in the west]" },
  { t = "v", n = 5, indent = 1, cont = true, text = "And shall shine more brightly than accords with the order of light." },
  { t = "v", n = 6, indent = 1, p = true, text = "And many chiefs of the stars shall transgress the order (prescribed)." },
  { t = "v", n = 6, indent = 1, cont = true, text = "And these shall alter their orbits and tasks," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And not appear at the seasons prescribed to them." },
  { t = "v", n = 7, indent = 1, p = true, text = "And the whole order of the stars shall be concealed from the sinners," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And the thoughts of those on the earth shall err concerning them," },
  { t = "v", n = 7, indent = 1, cont = true, text = "[And they shall be altered from all their ways]," },
  { t = "v", n = 7, indent = 1, cont = true, text = "Yea, they shall err and take them to be gods." },
  { t = "v", n = 8, indent = 1, p = true, text = "And evil shall be multiplied upon them," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And punishment shall come upon them So as to destroy all.'" },
]

[[section]]
id = "81"
title = "Chapter 81"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXXXI. The Heavenly Tablets and the Mission of Enoch." },
  { t = "v", n = 1, indent = 1, p = true, text = "And he said unto me:" },
  { t = "v", n = 1, indent = 1, cont = true, text = "'Observe, Enoch, these heavenly tablets," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And read what is written thereon," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And mark every individual fact.'" },
  { t = "v", n = 2, p = true, text = "And I observed the heavenly tablets, and read everything which was written (thereon) and understood everything, and read the book of all the deeds of mankind, and of all the children of flesh that shall be upon the earth to the remotest generations." },
  { t = "v", n = 3, text = "And forthwith I blessed the great Lord the King of glory for ever, in that He has made all the works of the world," },
  { t = "v", n = 3, indent = 1, p = true, cont = true, text = "And I extolled the Lord because of His patience," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And blessed Him because of the children of men." },
  { t = "v", n = 4, indent = 1, p = true, text = "And after that I said:" },
  { t = "v", n = 4, indent = 1, cont = true, text = "'Blessed is the man who dies in righteousness and goodness," },
  { t = "v", n = 4, indent = 1, cont = true, text = "Concerning whom there is no book of unrighteousness written," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And against whom no day of judgement shall be found.'" },
  { t = "v", n = 5, p = true, text = "And those seven holy ones brought me and placed me on the earth before the door of my house, and said to me: 'Declare everything to thy son Methuselah, and show to all thy children that no flesh is righteous in the sight of the Lord, for He is their Creator." },
  { t = "v", n = 6, text = "One year we will leave thee with thy son, till thou givest thy (last) commands, that thou mayest teach thy children and record (it) for them, and testify to all thy children; and in the second year they shall take thee from their midst." },
  { t = "v", n = 7, indent = 1, p = true, text = "Let thy heart be strong," },
  { t = "v", n = 7, indent = 1, cont = true, text = "For the good shall announce righteousness to the good;" },
  { t = "v", n = 7, indent = 1, p = true, cont = true, text = "The righteous with the righteous shall rejoice," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And shall offer congratulation to one another." },
  { t = "v", n = 8, indent = 1, p = true, text = "But the sinners shall die with the sinners," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And the apostate go down with the apostate." },
  { t = "v", n = 9, indent = 1, p = true, text = "And those who practise righteousness shall die on account of the deeds of men," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And be taken away on account of the doings of the godless.'" },
  { t = "v", n = 10, p = true, text = "And in those days they ceased to speak to me, and I came to my people, blessing the Lord of the world." },
]

[[section]]
id = "82"
title = "Chapter 82"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXXXII. Charge given to Enoch: the four Intercalary Days: the Stars which lead the Seasons and the Months." },
  { t = "v", n = 1, p = true, text = "And now, my son Methuselah, all these things I am recounting to thee and writing down for thee, and I have revealed to thee everything, and given thee books concerning all these: so preserve, my son Methuselah, the books from thy father's hand, and (see) that thou deliver them to the generations of the world." },
  { t = "v", n = 2, indent = 1, p = true, text = "I have given Wisdom to thee and to thy children," },
  { t = "v", n = 2, indent = 1, cont = true, text = "[And thy children that shall be to thee]," },
  { t = "v", n = 2, indent = 1, cont = true, text = "That they may give it to their children for generations," },
  { t = "v", n = 2, indent = 1, cont = true, text = "This wisdom (namely) that passeth their thought." },
  { t = "v", n = 3, indent = 1, p = true, text = "And those who understand it shall not sleep," },
  { t = "v", n = 3, indent = 1, cont = true, text = "But shall listen with the ear that they may learn this wisdom," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And it shall please those that eat thereof better than good food." },
  { t = "v", n = 4, p = true, text = "Blessed are all the righteous, blessed are all those who walk in the way of righteousness and sin not as the sinners, in the reckoning of all their days in which the sun traverses the heaven, entering into and departing from the portals for thirty days with the heads of thousands of the order of the stars, together with the four which are intercalated which divide the four portions of the year, which lead them and enter with them four days." },
  { t = "v", n = 5, text = "Owing to them men shall be at fault and not reckon them in the **whole reckoning of the year**: yea, men shall be at fault, and not recognize them accurately." },
  { t = "v", n = 6, text = "For they belong to the reckoning of the year and are truly recorded (thereon) for ever, one in the first portal and one in the third, and one in the fourth and one in the sixth, and the year is completed in three hundred and sixty-four days." },
  { t = "v", n = 7, p = true, text = "And the account thereof is accurate and the recorded reckoning thereof exact; for the luminaries, and months and festivals, and years and days, has Uriel shown and revealed to me, **to whom** the Lord of the whole creation of the world hath **subjected** the host of heaven." },
  { t = "v", n = 8, text = "And he has power over night and day in the heaven to cause the light to give light to men—sun, moon, and stars, and all the powers of the heaven which revolve in their circular chariots." },
  { t = "v", n = 9, text = "And these are the orders of the stars, which set in their places, and in their seasons and festivals and months." },
  { t = "v", n = 10, p = true, text = "And these are the names of those who lead them, who watch that they enter at their times, in their orders, in their seasons, in their months, in their periods of dominion, and in their positions." },
  { t = "v", n = 11, text = "Their four leaders who divide the four parts of the year enter first; and after them the twelve leaders of the orders who divide the months; and for the three hundred and sixty (days) there are heads over thousands who divide the days; and for the four intercalary days there are the leaders which sunder the four parts of the year." },
  { t = "v", n = 12, text = "And these heads over thousands are intercalated between leader and leader, each behind a station, but their leaders make the division." },
  { t = "v", n = 13, text = "And these are the names of the leaders who divide the four parts of the year which are ordained: Mîlkî’êl, Hel’emmêlêk, and Mêl’êjal, and Nârêl." },
  { t = "v", n = 14, text = "And the names of those who lead them: Adnâr’êl, and Îjâsûsa’êl, and ’Elômê’êl—these three follow the leaders of the orders, and there is one that follows the three leaders of the orders which follow those leaders of stations that divide the four parts of the year." },
  { t = "v", n = 15, p = true, text = "In the beginning of the year Melkejâl rises first and rules, who is named †Tam’âinî† and sun, and all the days of his dominion whilst he bears rule are ninety-one days." },
  { t = "v", n = 16, text = "And these are the signs of the days which are to be seen on earth in the days of his dominion: sweat, and heat, and calms; and all the trees bear fruit, and leaves are produced on all the trees, and the harvest of wheat, and the rose-flowers, and all the flowers which come forth in the field, but the trees of the winter season become withered." },
  { t = "v", n = 17, text = "And these are the names of the leaders which are under them: Berka’êl, Zêlebs’êl, and another who is added a head of a thousand, called Hîlûjâsĕph: and the days of the dominion of this (leader) are at an end." },
  { t = "v", n = 18, p = true, text = "The next leader after him is Hêl’emmêlêk, whom one names the shining sun, and all the days of his light are ninety-one days." },
  { t = "v", n = 19, text = "And these are the signs of (his) days on the earth: glowing heat and dryness, and the trees ripen their fruits and produce all their fruits ripe and ready, and the sheep pair and become pregnant, and all the fruits of the earth are gathered in, and everything that is in the fields, and the winepress: these things take place in the days of his dominion." },
  { t = "v", n = 20, text = "These are the names, and the orders, and the leaders of those heads of thousands: Gîdâ’îjal, Kê’êl, and Hê’êl, and the name of the head of a thousand which is added to them, Asfâ’êl’: and the days of his dominion are at an end." },
]

[[section]]
id = "83"
title = "Chapter 83"
level = 1
blocks = [
  { t = "h", level = 2, text = "THE DREAM-VISIONS (LXXXIII-XC.)" },
  { t = "h", level = 3, text = "LXXXIII. LXXXIV. First Dream-Vision on the Deluge." },
  { t = "v", n = 1, p = true, text = "And now, my son Methuselah, I will show thee all my visions which I have seen, recounting them before thee." },
  { t = "v", n = 2, text = "Two visions I saw before I took a wife, and the one was quite unlike the other: the first when I was learning to write: the second before I took thy mother, (when) I saw a terrible vision. And regarding them I prayed to the Lord." },
  { t = "v", n = 3, text = "I had laid me down in the house of my grandfather Mahalalel, (when) I saw in a vision how the heaven collapsed and was borne off and fell to the earth." },
  { t = "v", n = 4, text = "And when it fell to the earth I saw how the earth was swallowed up in a great abyss, and mountains were suspended on mountains, and hills sank down on hills, and high trees were rent from their stems, and hurled down and sunk in the abyss." },
  { t = "v", n = 5, text = "And thereupon a word fell into my mouth, and I lifted up (my voice) to cry aloud, and said: 'The earth is destroyed.'" },
  { t = "v", n = 6, text = "And my grandfather Mahalalel waked me as I lay near him, and said unto me: 'Why dost thou cry so, my son, and why dost thou make such lamentation?'" },
  { t = "v", n = 7, text = "And I recounted to him the whole vision which I had seen, and he said unto me: 'A terrible thing hast thou seen, my son, and of grave moment is thy dream-vision as to the secrets of all the sin of the earth: it must sink into the abyss and be destroyed with a great destruction." },
  { t = "v", n = 8, text = "And now, my son, arise and make petition to the Lord of glory, since thou art a believer, that a remnant may remain on the earth, and that He may not destroy the whole earth." },
  { t = "v", n = 9, text = "My son, from heaven all this will come upon the earth, and upon the earth there will be great destruction." },
  { t = "v", n = 10, text = "After that I arose and prayed and implored and besought, and wrote down my prayer for the generations of the world, and I will show everything to thee, my son Methuselah." },
  { t = "v", n = 11, text = "And when I had gone forth below and seen the heaven, and the sun rising in the east, and the moon setting in the west, and a few stars, and the whole earth, and everything as †He had known† it in the beginning, then I blessed the Lord of judgement and extolled Him because He had made the sun to go forth from the windows of the east, †and he ascended and rose on the face of the heaven, and set out and kept traversing the path shown unto him." },
]

[[section]]
id = "84"
title = "Chapter 84"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And I lifted up my hands in righteousness and blessed the Holy and Great One, and spake with the breath of my mouth, and with the tongue of flesh, which God has made for the children of the flesh of men, that they should speak therewith, and He gave them breath and a tongue and a mouth that they should speak therewith:" },
  { t = "v", n = 2, p = true, text = "'Blessed be Thou, O Lord, King, Great and mighty in Thy greatness, Lord of the whole creation of the heaven, King of kings and God of the whole world." },
  { t = "v", n = 2, p = true, cont = true, text = "And Thy power and kingship and greatness abide for ever and ever, And throughout all generations Thy dominion; And all the heavens are Thy throne for ever, And the whole earth Thy footstool for ever and ever." },
  { t = "v", n = 3, p = true, text = "For Thou hast made and Thou rulest all things, And nothing is too hard for Thee, Wisdom departs not **from the place of Thy throne**, **Nor turns away** from Thy presence. And Thou knowest and seest and hearest everything, And there is nothing hidden from Thee [for Thou seest everything]." },
  { t = "v", n = 4, text = "And now the angels of Thy heavens are guilty of trespass, And upon the flesh of men abideth Thy wrath until the great day of judgement." },
  { t = "v", n = 5, text = "And now, O God and Lord and Great King, I implore and beseech Thee to fulfil my prayer, To leave me a posterity on earth, And not destroy all the flesh of man, And make the earth without inhabitant, So that there should be an eternal destruction." },
  { t = "v", n = 6, text = "And now, my Lord, destroy from the earth the flesh which has aroused Thy wrath, But the flesh of righteousness and uprightness establish as a plant of the eternal seed, And hide not Thy face from the prayer of Thy servant, O Lord.'" },
]

[[section]]
id = "85"
title = "Chapter 85"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXXXV-XC. The Second Dream-Vision of Enoch: the History of the World to the Founding of the Messianic Kingdom." },
  { t = "v", n = 1, p = true, text = "And after this I saw another dream, and I will show the whole dream to thee, my son." },
  { t = "v", n = 2, text = "And Enoch lifted up (his voice) and spake to his son Methuselah: 'To thee, my son, will I speak: hear my words—incline thine ear to the dream-vision of thy father." },
  { t = "v", n = 3, text = "Before I took thy mother Edna, I saw in a vision on my bed, and behold a bull came forth from the earth, and that bull was white; and after it came forth a heifer, and along with this (latter) came forth two bulls, one of them black and the other red." },
  { t = "v", n = 4, text = "And that black bull gored the red one and pursued him over the earth, and thereupon I could no longer see that red bull." },
  { t = "v", n = 5, text = "But that black bull grew and that heifer went with him, and I saw that many oxen proceeded from him which resembled and followed him." },
  { t = "v", n = 6, text = "And that cow, that first one, went from the presence of that first bull in order to seek that red one, but found him not, and lamented with a great lamentation over him and sought him." },
  { t = "v", n = 7, text = "And I looked till that first bull came to her and quieted her, and from that time onward she cried no more." },
  { t = "v", n = 8, text = "And after that she bore another white bull, and after him she bore many bulls and black cows." },
  { t = "v", n = 9, p = true, text = "And I saw in my sleep that white bull likewise grow and become a great white bull, and from Him proceeded many white bulls, and they resembled him. And they began to beget many white bulls, which resembled them, one following the other, (even) many." },
]

[[section]]
id = "86"
title = "Chapter 86"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXXXVI. The Fall of the Angels and the Demoralization of Mankind." },
  { t = "v", n = 1, p = true, text = "And again I saw with mine eyes as I slept, and I saw the heaven above, and behold a star fell from heaven, and it arose and eat and pastured amongst those oxen." },
  { t = "v", n = 2, text = "And after that I saw the large and the black oxen, and behold they all changed their stalls and pastures and their cattle, and began to live with each other." },
  { t = "v", n = 3, text = "And again I saw in the vision, and looked towards the heaven, and behold I saw many stars descend and cast themselves down from heaven to that first star, and they became bulls amongst those cattle and pastured with them ⌈amongst them⌉." },
  { t = "v", n = 4, text = "And I looked at them and saw, and behold they all let out their privy members, like horses, and began to cover the cows of the oxen, and they all became pregnant and bare elephants, camels, and asses." },
  { t = "v", n = 5, text = "And all the oxen feared them and were affrighted at them, and began to bite with their teeth and to devour, and to gore with their horns." },
  { t = "v", n = 6, text = "And they began, moreover, to devour those oxen; and behold all the children of the earth began to tremble and quake before them and to flee from them." },
]

[[section]]
id = "87"
title = "Chapter 87"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXXXVII. The Advent of the Seven Archangels." },
  { t = "v", n = 1, p = true, text = "And again I saw how they began to gore each other and to devour each other, and the earth began to cry aloud." },
  { t = "v", n = 2, text = "And I raised mine eyes again to heaven, and I saw in the vision, and behold there came forth from heaven beings who were like white men: and four went forth from that place and three with them." },
  { t = "v", n = 3, text = "And those three that had last come forth grasped me by my hand and took me up, away from the generations of the earth, and raised me up to a lofty place, and showed me a tower raised high above the earth, and all the hills were lower." },
  { t = "v", n = 4, text = "And one said unto me: 'Remain here till thou seest everything that befalls those elephants, camels, and asses, and the stars and the oxen, and all of them.'" },
]

[[section]]
id = "88"
title = "Chapter 88"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXXXVIII. The Punishment of the Fallen Angels by the Archangels." },
  { t = "v", n = 1, p = true, text = "And I saw one of those four who had come forth first, and he seized that first star which had fallen from the heaven, and bound it hand and foot and cast it into an abyss: now that abyss was narrow and deep, and horrible and dark." },
  { t = "v", n = 2, text = "And one of them drew a sword, and gave it to those elephants and camels and asses: then they began to smite each other, and the whole earth quaked because of them." },
  { t = "v", n = 3, text = "And as I was beholding in the vision, lo, one of those four who had come forth stoned (them) from heaven, and gathered and took all the great stars whose privy members were like those of horses, and bound them all hand and foot, and cast them in an abyss of the earth." },
]

[[section]]
id = "89"
title = "Chapter 89"
level = 1
blocks = [
  { t = "h", level = 3, text = "LXXXIX. 1-9. The Deluge and the Deliverance of Noah." },
  { t = "v", n = 1, p = true, text = "And one of those four went to that white bull and instructed him in a secret, without his being terrified: he was born a bull and became a man, and built for himself a great vessel and dwelt thereon; and three bulls dwelt with him in that vessel and they were covered in." },
  { t = "v", n = 2, text = "And again I raised mine eyes towards heaven and saw a lofty roof, with seven water torrents thereon, and those torrents flowed with much water into an enclosure." },
  { t = "v", n = 3, text = "And I saw again, and behold fountains were opened on the surface of that great enclosure, and that water began to swell and rise upon the surface, and I saw that enclosure till all its surface was covered with water." },
  { t = "v", n = 4, text = "And the water, the darkness, and mist increased upon it; and as I looked at the height of that water, that water had risen above the height of that enclosure, and was streaming over that enclosure, and it stood upon the earth." },
  { t = "v", n = 5, text = "And all the cattle of that enclosure were gathered together until I saw how they sank and were swallowed up and perished in that water." },
  { t = "v", n = 6, text = "But that vessel floated on the water, while all the oxen and elephants and camels and asses sank to the bottom with all the animals, so that I could no longer see them, and they were not able to escape, (but) perished and sank into the depths." },
  { t = "v", n = 7, text = "And again I saw in the vision till those water torrents were removed from that high roof, and the chasms of the earth were levelled up and other abysses were opened." },
  { t = "v", n = 8, text = "Then the water began to run down into these, till the earth became visible; but that vessel settled on the earth, and the darkness retired and light appeared." },
  { t = "v", n = 9, text = "But that white bull which had become a man came out of that vessel, and the three bulls with him, and one of those three was white like that bull, and one of them was red as blood, and one black: and that white bull departed from them." },
  { t = "h", level = 3, text = "LXXXIX. 10-27. From the Death of Noah to the Exodus." },
  { t = "v", n = 10, p = true, text = "And they began to bring forth beasts of the field and birds, so that there arose different genera: lions, tigers, wolves, dogs, hyenas, wild boars, foxes, squirrels, swine, falcons, vultures, kites, eagles, and ravens; and among them was born a white bull." },
  { t = "v", n = 11, text = "And they began to bite one another; but that white bull which was born amongst them begat a wild ass and a white bull with it, and the wild asses multiplied." },
  { t = "v", n = 12, text = "But that bull which was born from him begat a black wild boar and a white sheep; and the former begat many boars, but that sheep begat twelve sheep." },
  { t = "v", n = 13, text = "And when those twelve sheep had grown, they gave up one of them to the asses, and those asses again gave up that sheep to the wolves, and that sheep grew up among the wolves." },
  { t = "v", n = 14, text = "And the Lord brought the eleven sheep to live with it and to pasture with it among the wolves: and they multiplied and became many flocks of sheep." },
  { t = "v", n = 15, text = "And the wolves began to fear them, and they oppressed them until they destroyed their little ones, and they cast their young into a river of much water: but those sheep began to cry aloud on account of their little ones, and to complain unto their Lord." },
  { t = "v", n = 16, text = "And a sheep which had been saved from the wolves fled and escaped to the wild asses; and I saw the sheep how they lamented and cried, and besought their Lord with all their might, till that Lord of the sheep descended at the voice of the sheep from a lofty abode, and came to them and pastured them." },
  { t = "v", n = 17, text = "And He called that sheep which had escaped the wolves, and spake with it concerning the wolves that it should admonish them not to touch the sheep." },
  { t = "v", n = 18, text = "And the sheep went to the wolves according to the word of the Lord, and another sheep met it and went with it, and the two went and entered together into the assembly of those wolves, and spake with them and admonished them not to touch the sheep from henceforth." },
  { t = "v", n = 19, text = "And thereupon I saw the wolves, and how they oppressed the sheep exceedingly with all their power; and the sheep cried aloud." },
  { t = "v", n = 20, text = "And the Lord came to the sheep and they began to smite those wolves: and the wolves began to make lamentation; but the sheep became quiet and forthwith ceased to cry out." },
  { t = "v", n = 21, text = "And I saw the sheep till they departed from amongst the wolves; but the eyes of the wolves were blinded, and those wolves departed in pursuit of the sheep with all their power." },
  { t = "v", n = 22, text = "And the Lord of the sheep went with them, as their leader, and all His sheep followed Him: and his face was dazzling and glorious and terrible to behold." },
  { t = "v", n = 23, text = "But the wolves began to pursue those sheep till they reached a sea of water." },
  { t = "v", n = 24, text = "And that sea was divided, and the water stood on this side and on that before their face, and their Lord led them and placed Himself between them and the wolves." },
  { t = "v", n = 25, text = "And as those wolves did not yet see the sheep, they proceeded into the midst of that sea, and the wolves followed the sheep, and [those wolves] ran after them into that sea." },
  { t = "v", n = 26, text = "And when they saw the Lord of the sheep, they turned to flee before His face, but that sea gathered itself together, and became as it had been created, and the water swelled and rose till it covered those wolves." },
  { t = "v", n = 27, text = "And I saw till all the wolves who pursued those sheep perished and were drowned." },
  { t = "h", level = 3, text = "LXXXIX. 28-40. Israel in the Desert, the Giving of the Law, the Entrance into Palestine." },
  { t = "v", n = 28, p = true, text = "But the sheep escaped from that water and went forth into a wilderness, where there was no water and no grass; and they began to open their eyes and to see; and I saw the Lord of the sheep pasturing them and giving them water and grass, and that sheep going and leading them." },
  { t = "v", n = 29, text = "And that sheep ascended to the summit of that lofty rock, and the Lord of the sheep sent it to them." },
  { t = "v", n = 30, text = "And after that I saw the Lord of the sheep who stood before them, and His appearance was great and terrible and majestic, and all those sheep saw Him and were afraid before His face." },
  { t = "v", n = 31, text = "And they all feared and trembled because of Him, and they cried to that sheep with them [which was amongst them]: \"We are not able to stand before our Lord or to behold Him.\"" },
  { t = "v", n = 32, text = "And that sheep which led them again ascended to the summit of that rock, but the sheep began to be blinded and to wander from the way which he had showed them, but that sheep wot not thereof." },
  { t = "v", n = 33, text = "And the Lord of the sheep was wrathful exceedingly against them, and that sheep discovered it, and went down from the summit of the rock, and came to the sheep, and found the greatest part of them blinded and fallen away." },
  { t = "v", n = 34, text = "And when they saw it they feared and trembled at its presence, and desired to return to their folds." },
  { t = "v", n = 35, text = "And that sheep took other sheep with it, and came to those sheep which had fallen away, and began to slay them; and the sheep feared its presence, and thus that sheep brought back those sheep that had fallen away, and they returned to their folds." },
  { t = "v", n = 36, text = "And I saw in this vision till that sheep became a man and built a house for the Lord of the sheep, and placed all the sheep in that house." },
  { t = "v", n = 37, text = "And I saw till this sheep which had met that sheep which led them fell asleep: and I saw till all the great sheep perished and little ones arose in their place, and they came to a pasture, and approached a stream of water." },
  { t = "v", n = 38, text = "Then that sheep, their leader which had become a man, withdrew from them and fell asleep, and all the sheep sought it and cried over it with a great crying." },
  { t = "v", n = 39, text = "And I saw till they left off crying for that sheep and crossed that stream of water, and there arose the two sheep as leaders in the place of those which had led them and fallen asleep (lit. \"had fallen asleep and led them\")." },
  { t = "v", n = 40, text = "And I saw till the sheep came to a goodly place, and a pleasant and glorious land, and I saw till those sheep were satisfied; and that house stood amongst them in the pleasant land." },
  { t = "h", level = 3, text = "LXXXIX. 41-50. From the Time of the Judges till the Building of the Temple." },
  { t = "v", n = 41, p = true, text = "And sometimes their eyes were opened, and sometimes blinded, till another sheep arose and led them and brought them all back, and their eyes were opened." },
  { t = "v", n = 42, p = true, text = "And the dogs and the foxes and the wild boars began to devour those sheep till the Lord of the sheep raised up [another sheep] a ram from their midst, which led them." },
  { t = "v", n = 43, text = "And that ram began to butt on either side those dogs, foxes, and wild boars till he had destroyed them †all†." },
  { t = "v", n = 44, text = "And that sheep whose eyes were opened saw that ram, which was amongst the sheep, **till** it †forsook its glory† and began to butt those sheep, and trampled upon them, and behaved itself unseemly." },
  { t = "v", n = 45, text = "And the Lord of the sheep sent the **lamb** to another **lamb** and raised it to being a ram and leader of the sheep instead of that ram which had †forsaken its glory†." },
  { t = "v", n = 46, text = "And it went to it and spake to it alone, and raised it to being a ram, and made it the prince and leader of the sheep; but during all these things those dogs oppressed the sheep." },
  { t = "v", n = 47, text = "And the first ram pursued that second ram, and that second ram arose and fled before it; and I saw till those dogs pulled down the first ram." },
  { t = "v", n = 48, text = "And that second ram arose and led the [little] sheep." },
  { t = "v", n = 49, text = "And those sheep grew and multiplied; but all the dogs, and foxes, and wild boars feared and fled before it, and that ram butted and killed the wild beasts, and those wild beasts had no longer any power among the sheep and robbed them no more of aught." },
  { t = "v", n = 48, text = "*b*. And that ram begat many sheep and fell asleep; and a little sheep became ram in its stead, and became prince and leader of those sheep." },
  { t = "v", n = 50, p = true, text = "And that house became great and broad, and it was built for those sheep: (and) a tower lofty and great was built on the house for the Lord of the sheep, and that house was low, but the tower was elevated and lofty, and the Lord of the sheep stood on that tower and they offered a full table before Him." },
  { t = "h", level = 3, text = "LXXXIX. 51-67. The Two Kingdoms of Israel and Judah, to the Destruction of Jerusalem." },
  { t = "v", n = 51, p = true, text = "And again I saw those sheep that they again erred and went many ways, and forsook that their house, and the Lord of the sheep called some from amongst the sheep and sent them to the sheep, but the sheep began to slay them." },
  { t = "v", n = 52, text = "And one of them was saved and was not slain, and it sped away and cried aloud over the sheep; and they sought to slay it, but the Lord of the sheep saved it from the sheep, and brought it up to me, and caused it to dwell there." },
  { t = "v", n = 53, text = "And many other sheep He sent to those sheep to testify unto them and lament over them." },
  { t = "v", n = 54, text = "And after that I saw that when they forsook the house of the Lord and His tower they fell away entirely, and their eyes were blinded; and I saw the Lord of the sheep how He wrought much slaughter amongst them in their herds until those sheep invited that slaughter and betrayed His place." },
  { t = "v", n = 55, text = "And He gave them over into the hands of the lions and tigers, and wolves and hyenas, and into the hand of the foxes, and to all the wild beasts, and those wild beasts began to tear in pieces those sheep." },
  { t = "v", n = 56, text = "And I saw that He forsook that their house and their tower and gave them all into the hand of the lions, to tear and devour them, into the hand of all the wild beasts." },
  { t = "v", n = 57, text = "And I began to cry aloud with all my power, and to appeal to the Lord of the sheep, and to represent to Him in regard to the sheep that they were devoured by all the wild beasts." },
  { t = "v", n = 58, text = "But He remained unmoved, though He saw it, and rejoiced that they were devoured and swallowed and robbed, and left them to be devoured in the hand of all the beasts." },
  { t = "v", n = 59, text = "And He called seventy shepherds, and cast those sheep to them that they might pasture them, and He spake to the shepherds and their companions: \"Let each individual of you pasture the sheep henceforward, and everything that I shall command you that do ye." },
  { t = "v", n = 60, text = "And I will deliver them over unto you duly numbered, and tell you which of them are to be destroyed—and them destroy ye.\" And He gave over unto them those sheep." },
  { t = "v", n = 61, text = "And He called another and spake unto him: \"Observe and mark everything that the shepherds will do to those sheep; for they will destroy more of them than I have commanded them." },
  { t = "v", n = 62, text = "And every excess and the destruction which will be wrought through the shepherds, record (namely) how many they destroy according to my command, and how many according to their own caprice: record against every individual shepherd all the destruction he effects." },
  { t = "v", n = 63, text = "And read out before me by number how many they destroy, and how many they deliver over for destruction, that I may have this as a testimony against them, and know every deed of the shepherds, that I may **comprehend** and see what they do, whether or not they abide by my command which I have commanded them." },
  { t = "v", n = 64, text = "But they shall not know it, and thou shalt not declare it to them, nor admonish them, but only record against each individual all the destruction which the shepherds effect each in his time and lay it all before me.\"" },
  { t = "v", n = 65, text = "And I saw till those shepherds pastured in their season, and they began to slay and to destroy more than they were bidden, and they delivered those sheep into the hand of the lions." },
  { t = "v", n = 66, text = "And the lions and tigers eat and devoured the greater part of those sheep, and the wild boars eat along with them; and they burnt that tower and demolished that house." },
  { t = "v", n = 67, text = "And I became exceedingly sorrowful over that tower because that house of the sheep was demolished, and afterwards I was unable to see if those sheep entered that house." },
  { t = "h", level = 3, text = "LXXXIX. 68-71. First Period of the Angelic Rulers—from the Destruction of Jerusalem to the Return from the Captivity." },
  { t = "v", n = 68, p = true, text = "And the shepherds and their associates delivered over those sheep to all the wild beasts, to devour them, and each one of them received in his time a definite number: it was written by the other in a book how many each one of them destroyed of them." },
  { t = "v", n = 69, text = "And each one slew and destroyed many more than was prescribed; and I began to weep and lament on account of those sheep." },
  { t = "v", n = 70, text = "And thus in the vision I saw that one who wrote, how he wrote down every one that was destroyed by those shepherds, day by day, and carried up and laid down and showed actually the whole book to the Lord of the sheep—(even) everything that they had done, and all that each one of them had made away with, and all that they had given over to destruction." },
  { t = "v", n = 71, text = "And the book was read before the Lord of the sheep, and He took the book from his hand and read it and sealed it and laid it down." },
  { t = "h", level = 3, text = "LXXXIX. 72-77. Second Period—from the time of Cyrus to that of Alexander the Great." },
  { t = "v", n = 72, p = true, text = "And forthwith I saw how the shepherds pastured for twelve hours, and behold three of those sheep turned back and came and entered and began to build up all that had fallen down of that house; but the wild boars tried to hinder them, but they were not able." },
  { t = "v", n = 73, text = "And they began again to build as before, and they reared up that tower, and it was named the high tower; and they began again to place a table before the tower, but all the bread on it was polluted and not pure." },
  { t = "v", n = 74, text = "And as touching all this the eyes of those sheep were blinded so that they saw not, and (the eyes of) their shepherds likewise; and they delivered them in large numbers to their shepherds for destruction, and they trampled the sheep with their feet and devoured them." },
  { t = "v", n = 75, text = "And the Lord of the sheep remained unmoved till all the sheep were dispersed over the field and mingled with them (*i.e.* the beasts), and they (*i.e.* the shepherds) did not save them out of the hand of the beasts." },
  { t = "v", n = 76, text = "And this one who wrote the book carried it up, and showed it and read it before the Lord of the sheep, and implored Him on their account, and besought Him on their account as he showed Him all the doings of the shepherds, and gave testimony before Him against all the shepherds. And he took the actual book and laid it down beside Him and departed." },
]

[[section]]
id = "90"
title = "Chapter 90"
level = 1
blocks = [
  { t = "h", level = 3, text = "XC. 1-5. Third Period—from Alexander the Great to the Graeco-Syrian Domination." },
  { t = "v", n = 1, p = true, text = "And I saw till that in this manner thirty-five shepherds undertook the pasturing (of the sheep), and they severally completed their periods as did the first; and others received them into their hands, to pasture them for their period, each shepherd in his own period." },
  { t = "v", n = 2, text = "And after that I saw in my vision all the birds of heaven coming, the eagles, the vultures, the kites, the ravens; but the eagles led all the birds; and they began to devour those sheep, and to pick out their eyes and to devour their flesh." },
  { t = "v", n = 3, text = "And the sheep cried out because their flesh was being devoured by the birds, and as for me I looked and lamented in my sleep over that shepherd who pastured the sheep." },
  { t = "v", n = 4, text = "And I saw until those sheep were devoured by the dogs and eagles and kites, and they left neither flesh nor skin nor sinew remaining on them till only their bones stood there: and their bones too fell to the earth and the sheep became few." },
  { t = "v", n = 5, text = "And I saw until that twenty-three had undertaken the pasturing and completed in their several periods fifty-eight times." },
  { t = "h", level = 3, text = "XC. 6-12. Fourth Period—from the Graeco-Syrian Domination to the Maccabæan Revolt." },
  { t = "v", n = 6, p = true, text = "But behold lambs were borne by those white sheep, and they began to open their eyes and to see, and to cry to the sheep." },
  { t = "v", n = 7, text = "Yea, they cried to them, but they did not hearken to what they said to them, but were exceedingly deaf, and their eyes were very exceedingly blinded." },
  { t = "v", n = 8, text = "And I saw in the vision how the ravens flew upon those lambs and took one of those lambs, and dashed the sheep in pieces and devoured them." },
  { t = "v", n = 9, text = "And I saw till horns grew upon those lambs, and the ravens cast down their horns; and I saw till there sprouted a great horn of one of those sheep, and their eyes were opened." },
  { t = "v", n = 10, text = "And it †looked at† them [and their eyes opened], and it cried to the sheep, and the rams saw it and all ran to it." },
  { t = "v", n = 11, text = "And notwithstanding all this those eagles and vultures and ravens and kites still kept tearing the sheep and swooping down upon them and devouring them: still the sheep remained silent, but the rams lamented and cried out." },
  { t = "v", n = 12, text = "And those ravens fought and battled with it and sought to lay low its horn, but they had no power over it." },
  { t = "v", n = 12, p = true, cont = true, text = "XC. 13-19. The Last Assault of the Gentiles on the Jews (where vv. 13-15 and 16-18 are doublets)." },
  { t = "v", n = 13, p = true, text = "And I saw till the †shepherds and† eagles and those vultures and kites came, and †they cried to the ravens† that they should break the horn of that ram, and they battled and fought with it, and it battled with them and cried that its help might come." },
  { t = "v", n = 16, p = true, text = "All the eagles and vultures and ravens and kites were gathered together, and there came with them all the sheep of the field, yea, they all came together, and helped each other to break that horn of the ram." },
  { t = "v", n = 19, p = true, text = "And I saw till a great sword was given to the sheep, and the sheep proceeded against all the beasts of the field to slay them, and all the beasts and the birds of the heaven fled before their face." },
  { t = "v", n = 14, p = true, text = "And I saw till that man, who wrote down the names of the shepherds [and] carried up into the presence of the Lord of the sheep [came and helped it and showed it everything: he had come down for the help of that ram]." },
  { t = "v", n = 15, p = true, text = "And I saw till the Lord of the sheep came unto them in wrath, and all who saw Him fled, and they all fell †into His shadow† from before His face." },
  { t = "v", n = 17, p = true, text = "And I saw that man, who wrote the book according to the command of the Lord, till he opened that book concerning the destruction which those twelve last shepherds had wrought, and showed that they had destroyed much more than their predecessors, before the Lord of the sheep." },
  { t = "v", n = 18, p = true, text = "And I saw till the Lord of the sheep came unto them and took in His hand the staff of His wrath, and smote the earth, and the earth clave asunder, and all the beasts and all the birds of the heaven fell from among those sheep, and were swallowed up in the earth and it covered them." },
  { t = "h", level = 3, text = "XC. 20-27. Judgement of the Fallen Angels, the Shepherds, and the Apostates." },
  { t = "v", n = 20, p = true, text = "And I saw till a throne was erected in the pleasant land, and the Lord of the sheep sat Himself thereon, and **the other** took the sealed books and opened those books before the Lord of the sheep." },
  { t = "v", n = 21, text = "And the Lord called those men the seven first white ones, and commanded that they should bring before Him, beginning with the first star which led the way, **all the** stars whose privy members were like those of horses, and they brought them all before Him." },
  { t = "v", n = 22, text = "And He said to that man who wrote before Him, being one of those seven white ones, and said unto him: \"Take those seventy shepherds to whom I delivered the sheep, and who taking them on their own authority slew more than I commanded them.\"" },
  { t = "v", n = 23, text = "And behold they were all bound, I saw, and they all stood before Him." },
  { t = "v", n = 24, text = "And the judgement was held first over the stars, and they were judged and found guilty, and went to the place of condemnation, and they were cast into an abyss, full of fire and flaming, and full of pillars of fire." },
  { t = "v", n = 25, text = "And those seventy shepherds were judged and found guilty, and they were cast into that fiery abyss." },
  { t = "v", n = 26, text = "And I saw at that time how a like abyss was opened in the midst of the earth, full of fire, and they brought those blinded sheep, and they were all judged and found guilty and cast into this fiery abyss, and they burned; now this abyss was to the right of that house." },
  { t = "v", n = 27, text = "And I saw those sheep burning †and their bones burning†." },
  { t = "h", level = 3, text = "XC. 28-38. The New Jerusalem, the Conversion of the surviving Gentiles, the Resurrection of the Righteous, the Messiah." },
  { t = "v", n = 28, p = true, text = "And I stood up to see till they folded up that old house; and carried off all the pillars, and all the beams and ornaments of the house were at the same time folded up with it, and they carried it off and laid it in a place in the south of the land." },
  { t = "v", n = 29, text = "And I saw till the Lord of the sheep brought a new house greater and loftier than that first, and set it up in the place of the first which had been folded up: all its pillars were new, and its ornaments were new and larger than those of the first, the old one which He had taken away, and all the sheep were within it." },
  { t = "v", n = 30, p = true, text = "And I saw all the sheep which had been left, and all the beasts on the earth, and all the birds of the heaven, falling down and doing homage to those sheep and making petition to and obeying them in every **thing**." },
  { t = "v", n = 31, text = "And thereafter those three who were clothed in white and had seized me by my hand [who had taken me up before], and the hand of that ram also seizing hold of me, they took me up and set me down in the midst of those sheep before the judgement took place†." },
  { t = "v", n = 32, text = "And those sheep were all white, and their wool was abundant and clean." },
  { t = "v", n = 33, text = "And all that had been destroyed and dispersed, and all the beasts of the field, and all the birds of the heaven, assembled in that house, and the Lord of the sheep rejoiced with great joy because they were all good and had returned to His house." },
  { t = "v", n = 34, text = "And I saw till they laid down that sword, which had been given to the sheep, and they brought it back into the house, and it was sealed before the presence of the Lord, and all the sheep were invited into that house, but it held them not." },
  { t = "v", n = 35, text = "And the eyes of them all were opened, and they saw the good, and there was not one among them that did not see." },
  { t = "v", n = 36, text = "And I saw that that house was large and broad and very full." },
  { t = "v", n = 37, p = true, text = "And I saw that a white bull was born, with large horns and all the beasts of the field and all the birds of the air feared him and made petition to him all the time." },
  { t = "v", n = 38, text = "And I saw till all their generations were transformed, and they all became white bulls; and the first among them became a **lamb**, and that **lamb** became a great animal and had great black horns on its head; and the Lord of the sheep rejoiced over **it** and over all the oxen." },
  { t = "v", n = 39, text = "And I slept in their midst: and I awoke and saw everything." },
  { t = "v", n = 40, text = "This is the vision which I saw while I slept, and I awoke and blessed the Lord of righteousness and gave Him glory." },
  { t = "v", n = 41, text = "Then I wept with a great weeping and my tears stayed not till I could no longer endure it: when I saw, they flowed on account of what I had seen; for everything shall come and be fulfilled, and all the deeds of men in their order were shown to me." },
  { t = "v", n = 42, text = "On that night I remembered the first dream, and because of it I wept and was troubled—because I had seen that vision.'" },
]

[[section]]
id = "92"
title = "Chapter 92"
level = 1
blocks = [
  { t = "h", level = 2, text = "THE CONCLUDING SECTION OF THE BOOK. (XCII-CV.)" },
  { t = "h", level = 3, text = "XCII. XCI. 1-10. 18-19 Enoch's Book of Admonition for his Children." },
  { t = "v", n = 1, p = true, text = "The book written by Enoch—[Enoch indeed wrote this complete doctrine of wisdom, (which is) praised of all men and a judge of all the earth] for all my children who shall dwell on the earth. And for the future generations who shall observe uprightness and peace." },
  { t = "v", n = 2, indent = 1, p = true, text = "Let not your spirit be troubled on account of the times;" },
  { t = "v", n = 2, indent = 1, cont = true, text = "For the Holy and Great One has appointed days for all things." },
  { t = "v", n = 3, indent = 1, p = true, text = "And the righteous one shall arise from sleep," },
  { t = "v", n = 3, indent = 1, cont = true, text = "[Shall arise] and walk in the paths of righteousness," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And all his path and conversation shall be in eternal goodness and grace." },
  { t = "v", n = 4, indent = 1, p = true, text = "He will be gracious to the righteous and give him eternal uprightness," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And He will give him power so that he shall be (endowed) with goodness and righteousness." },
  { t = "v", n = 4, indent = 1, cont = true, text = "And he shall walk in eternal light." },
  { t = "v", n = 5, indent = 1, p = true, text = "And sin shall perish in darkness for ever," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And shall no more be seen from that day for evermore." },
]

[[section]]
id = "91"
title = "Chapter 91 (1-11, 18-19)"
level = 1
blocks = [
  { t = "h", level = 3, text = "XCI. 1-11. 18-19. Enoch's Admonition to his Children." },
  { t = "v", n = 1, indent = 1, p = true, text = "'And now, my son Methuselah, call to me all thy brothers" },
  { t = "v", n = 1, indent = 1, cont = true, text = "And gather together to me all the sons of thy mother;" },
  { t = "v", n = 1, indent = 1, p = true, cont = true, text = "For the word calls me," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And the spirit is poured out upon me," },
  { t = "v", n = 1, indent = 1, cont = true, text = "That I may show you everything" },
  { t = "v", n = 1, indent = 1, cont = true, text = "That shall befall you for ever.'" },
  { t = "v", n = 2, p = true, text = "And there upon Methuselah went and summoned to him all his brothers and assembled his relatives." },
  { t = "v", n = 3, text = "And he spake unto all the children of righteousness and said:" },
  { t = "v", n = 3, indent = 1, p = true, cont = true, text = "'Hear, ye sons of Enoch, all the words of your father," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And hearken aright to the voice of my mouth;" },
  { t = "v", n = 3, indent = 1, cont = true, text = "For I exhort you and say unto you, beloved:" },
  { t = "v", n = 3, indent = 1, p = true, cont = true, text = "Love uprightness and walk therein." },
  { t = "v", n = 4, indent = 1, text = "And draw not nigh to uprightness with a double heart," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And associate not with those of a double heart," },
  { t = "v", n = 4, indent = 1, cont = true, text = "But walk in righteousness, my sons." },
  { t = "v", n = 4, indent = 1, cont = true, text = "And it shall guide you on good paths," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And righteousness shall be your companion." },
  { t = "v", n = 5, indent = 1, p = true, text = "For I know that violence **must** increase on the earth," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And a great chastisement be executed on the earth," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And all unrighteousness come to an end:" },
  { t = "v", n = 5, indent = 1, p = true, cont = true, text = "Yea, it shall be cut off from its roots," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And its whole structure be destroyed." },
  { t = "v", n = 6, indent = 1, p = true, text = "And unrighteousness shall again be consummated on the earth," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And all the deeds of unrighteousness and of violence" },
  { t = "v", n = 6, indent = 1, cont = true, text = "And transgression shall prevail in a twofold degree." },
  { t = "v", n = 7, indent = 1, p = true, text = "And when sin and unrighteousness and blasphemy" },
  { t = "v", n = 7, indent = 1, cont = true, text = "And violence in all kinds of deeds increase," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And apostasy and transgression and uncleanness increase," },
  { t = "v", n = 7, indent = 1, p = true, cont = true, text = "A great chastisement shall come from heaven upon all these," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And the holy Lord will come forth with wrath and chastisement" },
  { t = "v", n = 7, indent = 1, cont = true, text = "To execute judgement on earth." },
  { t = "v", n = 8, indent = 1, p = true, text = "In those days violence shall be cut off from its roots," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And the roots of unrighteousness together with deceit," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And they shall be destroyed from under heaven." },
  { t = "v", n = 9, indent = 1, p = true, text = "And all the idols of the heathen shall be abandoned," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And the temples burned with fire," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And they shall remove them from the whole earth," },
  { t = "v", n = 9, indent = 1, p = true, cont = true, text = "And they (*i.e.* the heathen) shall be cast into the judgement of fire," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And shall perish in wrath and in grievous judgement for ever." },
  { t = "v", n = 10, indent = 1, p = true, text = "And the righteous shall arise from their sleep," },
  { t = "v", n = 10, indent = 1, cont = true, text = "And wisdom shall arise and be given unto them." },
  { t = "v", n = 11, p = true, text = "[And after that the roots of unrighteousness shall be cut off, and the sinners shall be destroyed by the sword . . . shall be cut off from the blasphemers in every place, and those who plan violence and those who commit blasphemy shall perish by the sword.]" },
  { t = "v", n = 18, indent = 1, p = true, text = "And now I tell you, my sons, and show you" },
  { t = "v", n = 18, indent = 1, cont = true, text = "The paths of righteousness and the paths of violence." },
  { t = "v", n = 18, indent = 1, cont = true, text = "Yea, I will show them to you again" },
  { t = "v", n = 18, indent = 1, cont = true, text = "That ye may know what will come to pass." },
  { t = "v", n = 19, indent = 1, p = true, text = "And now, hearken unto me, my sons," },
  { t = "v", n = 19, indent = 1, cont = true, text = "And walk in the paths of righteousness," },
  { t = "v", n = 19, indent = 1, cont = true, text = "And walk not in the paths of violence;" },
  { t = "v", n = 19, indent = 1, cont = true, text = "For all who walk in the paths of unrighteousness shall perish for ever.'" },
]

[[section]]
id = "93"
title = "Chapter 93"
level = 1
blocks = [
  { t = "h", level = 3, text = "XCIII. XCI. 12-17. The Apocalypse of Weeks." },
  { t = "v", n = 1, p = true, text = "And after that Enoch both †gave† and began to recount from the books." },
  { t = "v", n = 2, text = "And Enoch said:" },
  { t = "v", n = 2, indent = 1, p = true, cont = true, text = "'Concerning the children of righteousness and concerning the elect of the world," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And concerning the plant of uprightness, I will speak these things," },
  { t = "v", n = 2, indent = 1, cont = true, text = "Yea, I Enoch will declare (them) unto you, my sons:" },
  { t = "v", n = 2, indent = 1, p = true, cont = true, text = "According to that which appeared to me in the heavenly vision," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And which I have known through the word of the holy angels," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And have learnt from the heavenly tablets.'" },
  { t = "v", n = 3, indent = 1, p = true, text = "And Enoch began to recount from the books and said:" },
  { t = "v", n = 3, indent = 1, cont = true, text = "'I was born the seventh in the first week," },
  { t = "v", n = 3, indent = 1, cont = true, text = "While judgement and righteousness still endured." },
  { t = "v", n = 4, indent = 1, p = true, text = "And after me there shall arise in the second week great wickedness," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And deceit shall have sprung up;" },
  { t = "v", n = 4, indent = 1, cont = true, text = "And in it there shall be the first end." },
  { t = "v", n = 4, indent = 1, p = true, cont = true, text = "And in it a man shall be saved;" },
  { t = "v", n = 4, indent = 1, cont = true, text = "And after it is ended unrighteousness shall grow up," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And a law shall be made for the sinners." },
  { t = "v", n = 5, indent = 1, p = true, text = "And after that in the third week at its close" },
  { t = "v", n = 5, indent = 1, cont = true, text = "A man shall be elected as the plant of righteous judgement," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And **his posterity** shall become the plant of righteousness for evermore." },
  { t = "v", n = 6, indent = 1, p = true, text = "And after that in the fourth week, at its close," },
  { t = "v", n = 6, indent = 1, cont = true, text = "Visions of the holy and righteous shall be seen," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And a law for all generations and an enclosure shall be made for them." },
  { t = "v", n = 7, indent = 1, p = true, text = "And after that in the fifth week, at its close," },
  { t = "v", n = 7, indent = 1, cont = true, text = "The house of glory and dominion shall be built for ever." },
  { t = "v", n = 8, indent = 1, p = true, text = "And after that in the sixth week all who live in it shall be blinded," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And the hearts of all of them shall godlessly forsake wisdom." },
  { t = "v", n = 8, indent = 1, p = true, cont = true, text = "And in it a man shall ascend;" },
  { t = "v", n = 8, indent = 1, cont = true, text = "And at its close the house of dominion shall be burnt with fire," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And the whole race of the chosen root shall be dispersed." },
  { t = "v", n = 9, indent = 1, p = true, text = "And after that in the seventh week shall an apostate generation arise," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And many shall be its deeds," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And all its deeds shall be apostate." },
  { t = "v", n = 10, indent = 1, p = true, text = "And at its close shall be elected" },
  { t = "v", n = 10, indent = 1, cont = true, text = "The elect righteous of the eternal plant of righteousness," },
  { t = "v", n = 10, indent = 1, cont = true, text = "To receive sevenfold instruction concerning all His creation." },
  { t = "v", n = 11, p = true, text = "[For who is there of all the children of men that is able to hear the voice of the Holy One without being troubled? And who can think His thoughts? and who is there that can behold all the works of heaven?" },
  { t = "v", n = 12, text = "And how should there be one who could behold the heaven, and who is there that could understand the things of heaven and see a soul or a spirit and could tell thereof, or ascend and see all their ends and think them or do like them?" },
  { t = "v", n = 13, text = "And who is there of all men that could know what is the breadth and the length of the earth, and to whom has been shown the measure of all of them?" },
  { t = "v", n = 14, text = "Or is there any one who could discern the length of the heaven and how great is its height, and upon what it is founded, and how great is the number of the stars, and where all the luminaries rest?]" },
]

[[section]]
id = "91-12"
title = "Chapter 91 (12-17)"
level = 1
blocks = [
  { t = "h", level = 3, text = "XCI. 12.-17. The Last Three Weeks." },
  { t = "v", n = 12, indent = 1, p = true, text = "And after that there shall be another, the eighth week, that of righteousness," },
  { t = "v", n = 12, indent = 1, cont = true, text = "And a sword shall be given to it that a righteous judgement may be executed on the oppressors," },
  { t = "v", n = 12, indent = 1, cont = true, text = "And sinners shall be delivered into the hands of the righteous." },
  { t = "v", n = 13, indent = 1, p = true, text = "And at its close they shall acquire houses through their righteousness," },
  { t = "v", n = 13, indent = 1, cont = true, text = "And a house shall be built for the Great King in glory for evermore," },
  { t = "v", n = 14, indent = 1, text = "*d*. And all mankind shall look to the path of uprightness." },
  { t = "v", n = 14, indent = 1, p = true, text = "*a*. And after that, in the ninth week, the righteous judgement shall be revealed to the whole world," },
  { t = "v", n = 14, indent = 1, cont = true, text = "*b*. And all the works of the godless shall vanish from all the earth," },
  { t = "v", n = 14, indent = 1, cont = true, text = "*c*. And the world shall be written down for destruction." },
  { t = "v", n = 15, indent = 1, p = true, text = "And after this, in the tenth week in the seventh part," },
  { t = "v", n = 15, indent = 1, cont = true, text = "There shall be the great eternal judgement," },
  { t = "v", n = 15, indent = 1, cont = true, text = "In which He will execute vengeance amongst the angels." },
  { t = "v", n = 16, indent = 1, p = true, text = "And the first heaven shall depart and pass away," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And a new heaven shall appear," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And all the powers of the heavens shall give sevenfold light." },
  { t = "v", n = 17, indent = 1, p = true, text = "And after that there will be many weeks without number for ever," },
  { t = "v", n = 17, indent = 1, cont = true, text = "And all shall be in goodness and righteousness," },
  { t = "v", n = 17, indent = 1, cont = true, text = "And sin shall no more be mentioned for ever." },
]

[[section]]
id = "94"
title = "Chapter 94"
level = 1
blocks = [
  { t = "h", level = 3, text = "XCIV. 1-5. Admonitions to the Righteous." },
  { t = "v", n = 1, indent = 1, p = true, text = "And now I say unto you, my sons, love righteousness and walk therein;" },
  { t = "v", n = 1, indent = 1, cont = true, text = "For the paths of righteousness are worthy of acceptation," },
  { t = "v", n = 1, indent = 1, cont = true, text = "But the paths of unrighteousness shall suddenly be destroyed and vanish." },
  { t = "v", n = 2, indent = 1, p = true, text = "And to certain men of a generation shall the paths of violence and of death be revealed," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And they shall hold themselves afar from them," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And shall not follow them." },
  { t = "v", n = 3, indent = 1, p = true, text = "And now I say unto you the righteous:" },
  { t = "v", n = 3, indent = 1, cont = true, text = "Walk not in the paths of wickedness, nor on the paths of death," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And draw not nigh to them, lest ye be destroyed." },
  { t = "v", n = 4, indent = 1, p = true, text = "But seek and choose for yourselves righteousness and an elect life," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And walk in the paths of peace," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And ye shall live and prosper." },
  { t = "v", n = 5, indent = 1, p = true, text = "And hold fast my words in the thoughts of your hearts," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And suffer them not to be effaced from your hearts;" },
  { t = "v", n = 5, indent = 1, p = true, cont = true, text = "For I know that sinners will tempt men to **evilly-entreat** wisdom," },
  { t = "v", n = 5, indent = 1, cont = true, text = "So that no place may be found for her," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And no manner of temptation may minish." },
  { t = "h", level = 3, text = "XCIV. 6-11. Woes for the Sinners." },
  { t = "v", n = 6, indent = 1, p = true, text = "Woe to those who build unrighteousness and oppression" },
  { t = "v", n = 6, indent = 1, cont = true, text = "And lay deceit as a foundation;" },
  { t = "v", n = 6, indent = 1, cont = true, text = "For they shall be suddenly overthrown," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And they shall have no peace." },
  { t = "v", n = 7, indent = 1, p = true, text = "Woe to those who build their houses with sin;" },
  { t = "v", n = 7, indent = 1, cont = true, text = "For from all their foundations shall they be overthrown," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And by the sword shall they fall." },
  { t = "v", n = 7, indent = 1, p = true, cont = true, text = "[And those who acquire gold and silver in judgement suddenly shall perish.]" },
  { t = "v", n = 8, indent = 1, p = true, text = "Woe to you, ye rich, for ye have trusted in your riches," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And from your riches shall ye depart," },
  { t = "v", n = 8, indent = 1, cont = true, text = "Because ye have not remembered the Most High in the days of your riches." },
  { t = "v", n = 9, indent = 1, p = true, text = "Ye have committed blasphemy and unrighteousness," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And have become ready for the day of slaughter," },
  { t = "v", n = 9, indent = 1, p = true, cont = true, text = "And the day of darkness and the day of the great judgement." },
  { t = "v", n = 10, indent = 1, p = true, text = "Thus I speak and declare unto you:" },
  { t = "v", n = 10, indent = 1, cont = true, text = "He who hath created you will overthrow you," },
  { t = "v", n = 10, indent = 1, cont = true, text = "And for your fall there shall be no compassion," },
  { t = "v", n = 10, indent = 1, cont = true, text = "And your Creator will rejoice at your destruction." },
  { t = "v", n = 11, indent = 1, p = true, text = "And your righteous ones in those days shall be" },
  { t = "v", n = 11, indent = 1, cont = true, text = "A reproach to the sinners and the godless." },
]

[[section]]
id = "95"
title = "Chapter 95"
level = 1
blocks = [
  { t = "h", level = 3, text = "XCV. Enoch's Grief: fresh Woes against the Sinners." },
  { t = "v", n = 1, indent = 1, p = true, text = "Oh that mine eyes were [a cloud of] waters" },
  { t = "v", n = 1, indent = 1, cont = true, text = "That I might weep over you," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And pour down my tears as a cloud †of† waters:" },
  { t = "v", n = 1, indent = 1, cont = true, text = "That so I might rest from my trouble of heart!" },
  { t = "v", n = 2, indent = 1, p = true, text = "†Who has permitted you to practise reproaches and wickedness?" },
  { t = "v", n = 2, indent = 1, cont = true, text = "And so judgement shall overtake you, sinners. †" },
  { t = "v", n = 3, indent = 1, p = true, text = "Fear not the sinners, ye righteous;" },
  { t = "v", n = 3, indent = 1, cont = true, text = "For again will the Lord deliver them into your hands," },
  { t = "v", n = 3, indent = 1, cont = true, text = "That ye may execute judgement upon them according to your desires." },
  { t = "v", n = 4, indent = 1, p = true, text = "Woe to you who fulminate anathemas which cannot be reversed:" },
  { t = "v", n = 4, indent = 1, cont = true, text = "Healing shall therefore be far from you because of your sins." },
  { t = "v", n = 5, indent = 1, p = true, text = "Woe to you who requite your neighbour with evil;" },
  { t = "v", n = 5, indent = 1, cont = true, text = "For ye shall be requited according to your works." },
  { t = "v", n = 6, indent = 1, p = true, text = "Woe to you, lying witnesses," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And to those who weigh out injustice," },
  { t = "v", n = 6, indent = 1, cont = true, text = "For suddenly shall ye perish." },
  { t = "v", n = 7, indent = 1, p = true, text = "Woe to you, sinners, for ye persecute the righteous;" },
  { t = "v", n = 7, indent = 1, cont = true, text = "For ye shall be delivered up and persecuted because of injustice," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And heavy shall its yoke be upon you." },
]

[[section]]
id = "96"
title = "Chapter 96"
level = 1
blocks = [
  { t = "h", level = 3, text = "XCVI. Grounds of Hopefulness for the Righteous: Woes for the Wicked." },
  { t = "v", n = 1, indent = 1, p = true, text = "Be hopeful, ye righteous; for suddenly shall the sinners perish before you," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And ye shall have lordship over them according to your desires." },
  { t = "v", n = 2, indent = 1, p = true, text = "[And in the day of the tribulation of the sinners," },
  { t = "v", n = 2, indent = 1, cont = true, text = "Your children shall mount and rise as eagles," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And higher than the vultures will be your nest," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And ye shall ascend and enter the crevices of the earth," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And the clefts of the rock for ever as coneys before the unrighteous," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And the sirens shall sigh because of you-and weep.]" },
  { t = "v", n = 3, indent = 1, p = true, text = "Wherefore fear not, ye that have suffered;" },
  { t = "v", n = 3, indent = 1, cont = true, text = "For healing shall be your portion," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And a bright light shall enlighten you," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And the voice of rest ye shall hear from heaven." },
  { t = "v", n = 4, indent = 1, p = true, text = "Woe unto you, ye sinners, for your riches make you appear like the righteous," },
  { t = "v", n = 4, indent = 1, cont = true, text = "But your hearts convict you of being sinners," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And this fact shall be a testimony against you for a memorial of (your) evil deeds." },
  { t = "v", n = 5, indent = 1, p = true, text = "Woe to you who devour the finest of the wheat," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And drink **wine in large bowls**," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And tread under foot the lowly with your might." },
  { t = "v", n = 6, indent = 1, p = true, text = "Woe to you who drink water **from every fountain**," },
  { t = "v", n = 6, indent = 1, cont = true, text = "For suddenly shall ye be consumed and wither away," },
  { t = "v", n = 6, indent = 1, cont = true, text = "Because ye have forsaken the fountain of life." },
  { t = "v", n = 7, indent = 1, p = true, text = "Woe to you who work unrighteousness" },
  { t = "v", n = 7, indent = 1, cont = true, text = "And deceit and blasphemy:" },
  { t = "v", n = 7, indent = 1, cont = true, text = "It shall be a memorial against you for evil." },
  { t = "v", n = 8, indent = 1, p = true, text = "Woe to you, ye mighty," },
  { t = "v", n = 8, indent = 1, cont = true, text = "Who with might oppress the righteous;" },
  { t = "v", n = 8, indent = 1, cont = true, text = "For the day of your destruction is coming." },
  { t = "v", n = 8, indent = 1, p = true, cont = true, text = "In those days many and good days shall come to the righteous—in the day of your judgement." },
]

[[section]]
id = "97"
title = "Chapter 97"
level = 1
blocks = [
  { t = "h", level = 3, text = "XCVII. The Evils in Store for Sinners and the Possessors of unrighteous Wealth." },
  { t = "v", n = 1, indent = 1, p = true, text = "Believe, ye righteous, that the sinners will become a shame" },
  { t = "v", n = 1, indent = 1, cont = true, text = "And perish in the day of unrighteousness." },
  { t = "v", n = 2, indent = 1, text = "Be it known unto you (ye sinners) that the Most High is mindful of your destruction," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And the angels of heaven rejoice over your destruction." },
  { t = "v", n = 3, indent = 1, p = true, text = "What will ye do, ye sinners," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And whither will ye flee on that day of judgement," },
  { t = "v", n = 3, indent = 1, cont = true, text = "When ye hear the voice of the prayer of the righteous?" },
  { t = "v", n = 4, indent = 1, p = true, text = "Yea, ye shall fare like unto them," },
  { t = "v", n = 4, indent = 1, cont = true, text = "Against whom this word shall be a testimony:" },
  { t = "v", n = 4, indent = 1, cont = true, text = "\"Ye have been companions of sinners.\"" },
  { t = "v", n = 5, indent = 1, p = true, text = "And in those days the prayer of the righteous shall reach unto the Lord," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And for you the days of your judgement shall come." },
  { t = "v", n = 6, indent = 1, p = true, text = "And all the words of your unrighteousness shall be read out before the Great Holy One," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And your faces shall be covered with shame," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And He will reject every work which is grounded on unrighteousness." },
  { t = "v", n = 7, indent = 1, p = true, text = "Woe to you, ye sinners, who live on the mid ocean and on the dry land," },
  { t = "v", n = 7, indent = 1, cont = true, text = "Whose remembrance is evil against you." },
  { t = "v", n = 8, indent = 1, p = true, text = "Woe to you who acquire silver and gold in unrighteousness and say:" },
  { t = "v", n = 8, indent = 1, cont = true, text = "\"We have become rich with riches and have possessions;" },
  { t = "v", n = 8, indent = 1, cont = true, text = "And have acquired everything we have desired." },
  { t = "v", n = 9, indent = 1, p = true, text = "And now let us do what we purposed:" },
  { t = "v", n = 9, indent = 1, cont = true, text = "For we have gathered silver," },
  { t = "v", n = 9, indent = 1, text = "*d*. And many are the husbandmen in our houses.\"" },
  { t = "v", n = 9, indent = 1, text = "*e*. And our granaries are (brim) full as with water," },
  { t = "v", n = 10, indent = 1, p = true, text = "Yea and like water your lies shall flow away;" },
  { t = "v", n = 10, indent = 1, cont = true, text = "For your riches shall not abide" },
  { t = "v", n = 10, indent = 1, cont = true, text = "But speedily ascend from you;" },
  { t = "v", n = 10, indent = 1, p = true, cont = true, text = "For ye have acquired it all in unrighteousness," },
  { t = "v", n = 10, indent = 1, cont = true, text = "And ye shall be given over to a great curse." },
]

[[section]]
id = "98"
title = "Chapter 98"
level = 1
blocks = [
  { t = "h", level = 3, text = "XCVIII. Self-indulgence of Sinners: Sin originated by Man: all Sin recorded in Heaven: Woes for the Sinners." },
  { t = "v", n = 1, indent = 1, p = true, text = "And now I swear unto you, to the wise and to the foolish," },
  { t = "v", n = 1, indent = 1, cont = true, text = "For ye shall have manifold experiences on the earth." },
  { t = "v", n = 2, indent = 1, p = true, text = "For ye men shall put on more adornments than a woman," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And coloured garments more than a virgin:" },
  { t = "v", n = 2, indent = 1, cont = true, text = "In royalty and in grandeur and in power," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And in silver and in gold and in purple," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And in splendour and in food they shall be poured out as water." },
  { t = "v", n = 3, indent = 1, p = true, text = "Therefore they shall be wanting in doctrine and wisdom," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And they shall perish thereby together with their possessions;" },
  { t = "v", n = 3, indent = 1, cont = true, text = "And with all their glory and their splendour," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And in shame and in slaughter and in great destitution," },
  { t = "v", n = 3, indent = 1, cont = true, text = "Their spirits shall be cast into the furnace of fire." },
  { t = "v", n = 4, indent = 1, p = true, text = "I have sworn unto you, ye sinners, as a mountain has not become a slave," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And a hill does not become the handmaid of a woman," },
  { t = "v", n = 4, indent = 1, cont = true, text = "Even so sin has not been sent upon the earth," },
  { t = "v", n = 4, indent = 1, cont = true, text = "But man of himself has created it," },
  { t = "v", n = 4, indent = 1, p = true, cont = true, text = "And under a great curse shall they fall who commit it." },
  { t = "v", n = 5, indent = 1, p = true, text = "And barrenness has not been given to the woman," },
  { t = "v", n = 5, indent = 1, cont = true, text = "But on account of the deeds of her own hands she dies without children." },
  { t = "v", n = 6, indent = 1, p = true, text = "I have sworn unto you, ye sinners, by the Holy Great One," },
  { t = "v", n = 6, indent = 1, cont = true, text = "That all your evil deeds are revealed in the heavens," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And that none of your deeds of oppression are covered and hidden." },
  { t = "v", n = 7, p = true, text = "And do not think in your spirit nor say in your heart that ye do not know and that ye do not see that every sin is every day recorded in heaven in the presence of the Most High." },
  { t = "v", n = 8, text = "From henceforth ye know that all your oppression wherewith ye oppress is written down every day till the day of your judgement." },
  { t = "v", n = 9, p = true, text = "Woe to you, ye fools, for through your folly shall ye perish: and ye transgress against the wise, and so good hap shall not be your portion." },
  { t = "v", n = 10, text = "And now, know ye that ye are prepared for the day of destruction: wherefore do not hope to live, ye sinners, but ye shall depart and die; for ye know no ransom; for ye are prepared for the day of the great judgement, for the day of tribulation and great shame for your spirits." },
  { t = "v", n = 11, indent = 1, p = true, text = "Woe to you, ye obstinate of heart, who work wickedness and eat blood:" },
  { t = "v", n = 11, indent = 1, cont = true, text = "Whence have ye good things to eat and to drink and to be filled?" },
  { t = "v", n = 11, p = true, cont = true, text = "From all the good things which the Lord the Most High has placed in abundance on the earth; therefore ye shall have no peace." },
  { t = "v", n = 12, text = "Woe to you who love the deeds of unrighteousness: wherefore do ye hope for good hap unto yourselves? know that ye shall be delivered into the hands of the righteous, and they shall cut off your necks and slay you, and have no mercy upon you." },
  { t = "v", n = 13, text = "Woe to you who rejoice in the tribulation of the righteous; for no grave shall be dug for you." },
  { t = "v", n = 14, text = "Woe to you who set at nought the words of the righteous; for ye shall have no hope of life." },
  { t = "v", n = 15, text = "Woe to you who write down lying and godless words; for they write down their lies that men may hear them and act godlessly towards (their) neighbour." },
  { t = "v", n = 16, text = "Therefore they shall have no peace but die a sudden death." },
]

[[section]]
id = "99"
title = "Chapter 99"
level = 1
blocks = [
  { t = "h", level = 3, text = "XCIX. Woes pronounced on the Godless, the Lawbreakers: evil Plight of Sinners in the last Days: further Woes." },
  { t = "v", n = 1, indent = 1, p = true, text = "Woe to you who work godlessness," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And glory in lying and extol them:" },
  { t = "v", n = 1, indent = 1, cont = true, text = "Ye shall perish, and no happy life shall be yours." },
  { t = "v", n = 2, indent = 1, p = true, text = "Woe to them who pervert the words of uprightness," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And transgress the eternal law," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And transform themselves into what they were not [into sinners]:" },
  { t = "v", n = 2, indent = 1, cont = true, text = "They shall be trodden under foot upon the earth." },
  { t = "v", n = 3, indent = 1, p = true, text = "In those days make ready, ye righteous, to raise your prayers as **a** memorial," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And place them as a testimony before the angels," },
  { t = "v", n = 3, indent = 1, cont = true, text = "That they may place the sin of the sinners for a memorial before the Most High." },
  { t = "v", n = 4, indent = 1, p = true, text = "In those days the nations shall be stirred up," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And the families of the nations shall arise on the day of destruction." },
  { t = "v", n = 5, indent = 1, p = true, text = "And in those days the destitute shall go forth and carry off their children," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And they shall abandon them, so that their children shall perish through them:" },
  { t = "v", n = 5, indent = 1, cont = true, text = "Yea, they shall abandon their children (that are still) sucklings, and not return to them," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And shall have no pity on their beloved ones." },
  { t = "v", n = 6, p = true, text = "And again I swear to you, ye sinners, that sin is prepared for a day of unceasing bloodshed." },
  { t = "v", n = 7, text = "And they who worship stones, and grave images of gold and silver and wood 〈and stone〉 and clay, and those who worship impure spirits and demons, and all kinds of idols not according to knowledge, shall get no manner of help from them." },
  { t = "v", n = 8, indent = 1, p = true, text = "And they shall become godless by reason of the folly of their hearts," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And their eyes shall be blinded through the fear of their hearts" },
  { t = "v", n = 8, indent = 1, cont = true, text = "And through visions in their dreams." },
  { t = "v", n = 9, indent = 1, text = "Through these they shall become godless and fearful;" },
  { t = "v", n = 9, indent = 1, cont = true, text = "For they shall have wrought all their work in a lie," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And shall have worshipped a stone:" },
  { t = "v", n = 9, indent = 1, cont = true, text = "Therefore in an instant shall they perish." },
  { t = "v", n = 10, indent = 1, p = true, text = "But in those days blessed are all they who accept the words of wisdom, and understand them," },
  { t = "v", n = 10, indent = 1, cont = true, text = "And observe the paths of the Most High, and walk in the path of His righteousness," },
  { t = "v", n = 10, indent = 1, cont = true, text = "And become not godless with the godless;" },
  { t = "v", n = 10, indent = 1, cont = true, text = "For they shall be saved." },
  { t = "v", n = 11, indent = 1, p = true, text = "Woe to you who spread evil to your neighbours;" },
  { t = "v", n = 11, indent = 1, cont = true, text = "For you shall be slain in Sheol." },
  { t = "v", n = 12, indent = 1, text = "Woe to you who make deceitful and false measures," },
  { t = "v", n = 12, indent = 1, cont = true, text = "And (to them) who cause bitterness on the earth;" },
  { t = "v", n = 12, indent = 1, cont = true, text = "For they shall thereby be utterly consumed." },
  { t = "v", n = 13, indent = 1, p = true, text = "Woe to you who build your houses through the grievous toil of others," },
  { t = "v", n = 13, indent = 1, cont = true, text = "And all their building materials are the bricks and stones of sin;" },
  { t = "v", n = 13, indent = 1, cont = true, text = "I tell you ye shall have no peace." },
  { t = "v", n = 14, indent = 1, p = true, text = "Woe to them who reject the measure and eternal heritage of their fathers" },
  { t = "v", n = 14, indent = 1, cont = true, text = "And whose souls follow after idols;" },
  { t = "v", n = 14, indent = 1, cont = true, text = "For they shall have no rest." },
  { t = "v", n = 15, indent = 1, p = true, text = "Woe to them who work unrighteousness and help oppression," },
  { t = "v", n = 15, indent = 1, p = true, cont = true, text = "And slay their neighbours until the day of the great judgement." },
  { t = "v", n = 16, indent = 1, p = true, text = "For He shall cast down your glory," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And bring affliction on your hearts," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And shall arouse **His fierce indignation**," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And destroy you all with the sword;" },
  { t = "v", n = 16, indent = 1, cont = true, text = "And all the holy and righteous shall remember your sins." },
]

[[section]]
id = "100"
title = "Chapter 100"
level = 1
blocks = [
  { t = "h", level = 3, text = "C. The Sinners destroy each other: Judgement of the fallen Angels: the Safety of the Righteous: further Woes for the Sinners." },
  { t = "v", n = 1, indent = 1, p = true, text = "And in those days in one place the fathers together with their sons shall be smitten" },
  { t = "v", n = 1, indent = 1, cont = true, text = "And brothers one with another shall fall in death" },
  { t = "v", n = 1, indent = 1, cont = true, text = "Till the streams flow with their blood." },
  { t = "v", n = 2, indent = 1, p = true, text = "For a man shall not withhold his hand from slaying his sons and his sons' sons," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And the sinner shall not withhold his hand from his honoured brother:" },
  { t = "v", n = 2, indent = 1, cont = true, text = "From dawn till sunset they shall slay one another." },
  { t = "v", n = 3, indent = 1, p = true, text = "And the horse shall walk up to the breast in the blood of sinners," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And the chariot shall be submerged to its height." },
  { t = "v", n = 4, indent = 1, p = true, text = "In those days the angels shall descend into the secret places" },
  { t = "v", n = 4, indent = 1, cont = true, text = "And gather together into one place all those who brought down sin" },
  { t = "v", n = 4, indent = 1, cont = true, text = "And the Most High will arise on that day of judgement" },
  { t = "v", n = 4, indent = 1, cont = true, text = "To execute great judgement amongst sinners." },
  { t = "v", n = 5, indent = 1, p = true, text = "And over all the righteous and holy He will appoint guardians from amongst the holy angels" },
  { t = "v", n = 5, indent = 1, cont = true, text = "To guard them as the apple of an eye," },
  { t = "v", n = 5, indent = 1, cont = true, text = "Until He makes an end of all wickedness and all sin," },
  { t = "v", n = 5, indent = 1, p = true, cont = true, text = "And though the righteous sleep a long sleep, they have nought to fear." },
  { t = "v", n = 6, indent = 1, p = true, text = "And (then) the children of the earth shall see the wise **in security**," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And shall understand all the words of this book," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And recognize that their riches shall not be able to save them" },
  { t = "v", n = 6, indent = 1, cont = true, text = "In the overthrow of their sins." },
  { t = "v", n = 7, indent = 1, p = true, text = "Woe to you, Sinners, on the day of strong anguish," },
  { t = "v", n = 7, indent = 1, cont = true, text = "**Ye who afflict** the righteous and burn them with fire:" },
  { t = "v", n = 7, indent = 1, cont = true, text = "Ye shall be requited according to your works." },
  { t = "v", n = 8, indent = 1, p = true, text = "Woe to you, ye obstinate of heart," },
  { t = "v", n = 8, indent = 1, cont = true, text = "Who watch in order to devise wickedness:" },
  { t = "v", n = 8, indent = 1, cont = true, text = "Therefore shall fear come upon you" },
  { t = "v", n = 8, indent = 1, cont = true, text = "And there shall be none to help you." },
  { t = "v", n = 9, indent = 1, p = true, text = "Woe to you, ye sinners, on account of the words of your mouth," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And on account of the deeds of your hands which your godlessness has wrought," },
  { t = "v", n = 9, indent = 1, cont = true, text = "In blazing flames burning worse than fire shall ye burn." },
  { t = "v", n = 10, p = true, text = "And now, know ye that from the angels He will inquire as to your deeds in heaven, from the sun and from the moon and from the stars in reference to your sins because upon the earth ye execute judgement on the righteous." },
  { t = "v", n = 11, text = "And He will summon to testify against you every cloud and mist and dew and rain; for they shall all be withheld because of you from descending upon you, and they shall be mindful of your sins." },
  { t = "v", n = 12, text = "And now give presents to the rain that it be not withheld from descending upon you, nor yet the dew, when it has received gold and silver from you that it may descend." },
  { t = "v", n = 13, text = "When the hoar-frost and snow with their chilliness, and all the snow-storms with all their plagues fall upon you, in those days ye shall not be able to stand before them." },
]

[[section]]
id = "101"
title = "Chapter 101"
level = 1
blocks = [
  { t = "h", level = 3, text = "CI. Exhortation to the Fear of God: all Nature fears Him, but not the Sinners." },
  { t = "v", n = 1, p = true, text = "Observe the heaven, ye children of heaven, and every work of the Most High, and fear ye Him and work no evil in His presence." },
  { t = "v", n = 2, text = "If He closes the windows of heaven, and withholds the rain and the dew from descending on the earth on your account, what will ye do then?" },
  { t = "v", n = 3, text = "And if He sends His anger upon you because of your deeds, ye cannot petition Him; for ye spake proud and insolent words against His righteousness: therefore ye shall have no peace." },
  { t = "v", n = 4, text = "And see ye not the **sailors** of the ships, how their ships are tossed to and fro by the waves, and are shaken by the winds, and are in sore trouble?" },
  { t = "v", n = 5, text = "And therefore do they fear because all their goodly possessions go upon the sea with them, and they have evil forebodings of heart that the sea will swallow them and they will perish therein." },
  { t = "v", n = 6, p = true, text = "Are not the entire sea and all its waters, and all its movements, the work of the Most High, and has He not set limits to its doings, and confined it throughout by the sand?" },
  { t = "v", n = 7, text = "And at His reproof it is afraid and dries up, and all its fish die and all that is in it; But ye sinners that are on the earth fear Him not." },
  { t = "v", n = 8, text = "Has He not made the heaven and the earth, and all that is therein? Who has given understanding and wisdom to everything that moves on the earth and in the sea." },
  { t = "v", n = 9, text = "Do not the **sailors** of the ships fear the sea? Yet sinners fear not the Most High." },
]

[[section]]
id = "102"
title = "Chapter 102"
level = 1
blocks = [
  { t = "h", level = 3, text = "CII. Terrors of the Day of Judgement: the adverse Fortunes of the Righteous on the Earth." },
  { t = "v", n = 1, indent = 1, p = true, text = "In those days when He hath brought a grievous fire upon you," },
  { t = "v", n = 1, indent = 1, cont = true, text = "Whither will ye flee, and where will ye find deliverance?" },
  { t = "v", n = 1, indent = 1, cont = true, text = "And when He launches forth His Word against you Will you not be affrighted and fear?" },
  { t = "v", n = 2, indent = 1, p = true, text = "And all the luminaries shall be affrighted with great fear," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And all the earth shall be affrighted and tremble and be alarmed." },
  { t = "v", n = 3, indent = 1, p = true, text = "And all the †angels shall execute their commands†" },
  { t = "v", n = 3, indent = 1, cont = true, text = "And shall seek to hide themselves from the presence of the Great Glory," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And the children of earth shall tremble and quake;" },
  { t = "v", n = 3, indent = 1, cont = true, text = "And ye sinners shall be accursed for ever," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And ye shall have no peace." },
  { t = "v", n = 4, indent = 1, text = "Fear ye not, ye souls of the righteous," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And be hopeful ye that have died in righteousness." },
  { t = "v", n = 5, indent = 1, p = true, text = "And grieve not if your soul into Sheol has descended in grief," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And that in your life your body fared not according to your goodness," },
  { t = "v", n = 5, indent = 1, cont = true, text = "But **wait for** the day of the **judgement** of sinners" },
  { t = "v", n = 5, indent = 1, cont = true, text = "And for the day of cursing and chastisement." },
  { t = "v", n = 6, indent = 1, p = true, text = "And yet when ye die the sinners speak over you:" },
  { t = "v", n = 6, indent = 1, cont = true, text = "\"As we die, so die the righteous," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And what benefit do they reap for their deeds?" },
  { t = "v", n = 7, indent = 1, p = true, text = "Behold, even as we, so do they die in grief and darkness," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And what have they more than we?" },
  { t = "v", n = 7, indent = 1, cont = true, text = "From henceforth we are equal." },
  { t = "v", n = 8, indent = 1, p = true, text = "And what will they receive and what will they see for ever?" },
  { t = "v", n = 8, indent = 1, cont = true, text = "Behold, they too have died," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And henceforth for ever shall they see no light.\"" },
  { t = "v", n = 9, p = true, text = "I tell you, ye sinners, ye are content to eat and drink, and rob and sin, and strip men naked, and acquire wealth and see good days." },
  { t = "v", n = 10, text = "Have ye seen the righteous how their end falls out, that no manner of violence is found in them till their death?" },
  { t = "v", n = 11, p = true, text = "\"Nevertheless they perished and became as though they had not been, and their spirits descended into Sheol in tribulation.\"" },
]

[[section]]
id = "103"
title = "Chapter 103"
level = 1
blocks = [
  { t = "h", level = 3, text = "CIII. Different Destinies of the Righteous and the Sinners: fresh Objections of the Sinners." },
  { t = "v", n = 1, p = true, text = "Now, therefore, I swear to you, the righteous, by the glory of the Great and Honoured and Mighty One in dominion, and by His greatness I swear to you:" },
  { t = "v", n = 2, indent = 1, p = true, text = "I know a mystery" },
  { t = "v", n = 2, indent = 1, cont = true, text = "And have read the heavenly tablets," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And have seen the holy books," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And have found written therein and inscribed regarding them:" },
  { t = "v", n = 3, indent = 1, text = "That all goodness and joy and glory are prepared for them," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And written down for the spirits of those who have died in righteousness," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And that manifold good shall be given to you in recompense for your labours," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And that your lot is abundantly beyond the lot of the living." },
  { t = "v", n = 4, indent = 1, p = true, text = "And the spirits of you who have died in righteousness shall live and rejoice," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And their spirits shall not perish, nor their memorial from before the face of the Great One" },
  { t = "v", n = 4, indent = 1, cont = true, text = "Unto all the generations of the world: wherefore no longer fear their contumely." },
  { t = "v", n = 5, indent = 1, p = true, text = "Woe to you, ye sinners, when ye have died," },
  { t = "v", n = 5, indent = 1, cont = true, text = "If ye die in the wealth of your sins," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And those who are like you say regarding you:" },
  { t = "v", n = 5, indent = 1, cont = true, text = "'Blessed are the sinners: they have seen all their days." },
  { t = "v", n = 6, indent = 1, text = "And how they have died in prosperity and in wealth," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And have not seen tribulation or murder in their life;" },
  { t = "v", n = 6, indent = 1, p = true, cont = true, text = "And they have died in honour," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And judgement has not been executed on them during their life.\"" },
  { t = "v", n = 7, indent = 1, p = true, text = "Know ye, that their souls will be made to descend into Sheol" },
  { t = "v", n = 7, indent = 1, cont = true, text = "And they shall be wretched in their great tribulation." },
  { t = "v", n = 8, indent = 1, p = true, text = "And into darkness and chains and a burning flame where there is grievous judgement shall your spirits enter;" },
  { t = "v", n = 8, indent = 1, cont = true, text = "And the great judgement shall be for all the generations of the world." },
  { t = "v", n = 8, indent = 1, cont = true, text = "Woe to you, for ye shall have no peace." },
  { t = "v", n = 9, indent = 1, p = true, text = "Say not in regard to the righteous and good who are in life:" },
  { t = "v", n = 9, indent = 1, cont = true, text = "\"In our troubled days we have toiled laboriously and experienced every trouble," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And met with much evil and been consumed," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And have become few and our spirit small." },
  { t = "v", n = 10, indent = 1, p = true, text = "And we have been destroyed and have not found any to help us even with a word:" },
  { t = "v", n = 10, indent = 1, cont = true, text = "We have been tortured ⌈and destroyed⌉, and hoped not to see life from day to day." },
  { t = "v", n = 11, indent = 1, p = true, text = "We hoped to be the head and have become the tail:" },
  { t = "v", n = 11, indent = 1, cont = true, text = "We have toiled laboriously and had no satisfaction in our toil;" },
  { t = "v", n = 11, indent = 1, cont = true, text = "And we have become the food of the sinners and the unrighteous," },
  { t = "v", n = 11, indent = 1, cont = true, text = "And they have laid their yoke heavily upon us." },
  { t = "v", n = 12, indent = 1, p = true, text = "They have had dominion over us that hated us †and smote us;" },
  { t = "v", n = 12, indent = 1, cont = true, text = "And to those that hated us† we have bowed our necks" },
  { t = "v", n = 12, indent = 1, cont = true, text = "But they pitied us not." },
  { t = "v", n = 13, indent = 1, p = true, text = "We desired to get away from them that we might escape and be at rest," },
  { t = "v", n = 13, indent = 1, cont = true, text = "But found no place whereunto we should flee and be safe from them." },
  { t = "v", n = 14, indent = 1, p = true, text = "And are complained to the rulers in our tribulation," },
  { t = "v", n = 14, indent = 1, cont = true, text = "And cried out against those who devoured us," },
  { t = "v", n = 14, indent = 1, cont = true, text = "But they did not attend to our cries" },
  { t = "v", n = 14, indent = 1, cont = true, text = "And would not hearken to our voice." },
  { t = "v", n = 15, p = true, text = "And they helped those who robbed us and devoured us and those who made us few; and they concealed their oppression, and they did not remove from us the yoke of those that devoured us and dispersed us and murdered us, and they concealed their murder, and remembered not that they had lifted up their hands against us." },
]

[[section]]
id = "104"
title = "Chapter 104"
level = 1
blocks = [
  { t = "h", level = 3, text = "CIV. Assurances given to the Righteous: Admonitions to Sinners and the Falsifiers of the Words of Uprightness." },
  { t = "v", n = 1, p = true, text = "I swear unto you, that in heaven the angels remember you for good before the glory of the Great One: and your names are written before the glory of the Great One." },
  { t = "v", n = 2, text = "Be hopeful; for aforetime ye were put to shame through ill and affliction; but now ye shall shine as the lights of heaven, ye shall shine and ye shall be seen, and the portals of heaven shall be opened to you." },
  { t = "v", n = 3, text = "And in your cry, cry for judgement, and it shall appear to you; for all your tribulation shall be visited on the rulers, and on all who helped those who plundered you." },
  { t = "v", n = 4, text = "Be hopeful, and cast not away your hope; for ye shall have great joy as the angels of heaven." },
  { t = "v", n = 5, text = "What shall ye be obliged to do? Ye shall not have to hide on the day of the great judgement and ye shall not be found as sinners, and the eternal judgement shall be far from you for all the generations of the world." },
  { t = "v", n = 6, text = "And now fear not, ye righteous, when ye see the sinners growing strong and prospering in their ways: be not companions with them, but keep afar from their violence; for ye shall become companions of the hosts of heaven." },
  { t = "v", n = 7, text = "And, although ye sinners say: \"All our sins shall not be searched out and written down,\" nevertheless they shall write down all your sins every day." },
  { t = "v", n = 8, p = true, text = "And now I show unto you that light and darkness, day and night, see all your sins." },
  { t = "v", n = 9, text = "Be not godless in your hearts, and lie not and alter not the words of uprightness, nor charge with lying the words of the Holy Great One, nor take account of your idols; for all your lying and all your godlessness issue not in righteousness but in great sin." },
  { t = "v", n = 10, text = "And now I know this mystery, that sinners will alter and pervert the words of righteousness in many ways, and will speak wicked words, and lie, and practise great deceits, and write books concerning their words." },
  { t = "v", n = 11, text = "But when they write down truthfully all my words in their languages, and do not change or minish aught from my words but write them all down truthfully—all that I first testified concerning them." },
  { t = "v", n = 12, text = "Then, I know another mystery, that books will be given to the righteous and the wise to become a cause of joy and uprightness and much wisdom." },
  { t = "v", n = 13, text = "And to them shall the books be given, and they shall believe in them and rejoice over them, and then shall all the righteous who have learnt therefrom all the paths of uprightness be recompensed.'" },
]

[[section]]
id = "105"
title = "Chapter 105"
level = 1
blocks = [
  { t = "h", level = 3, text = "CV. God and the Messiah to dwell with Man." },
  { t = "v", n = 1, p = true, text = "In those days the Lord bade (them) to summon and testify to the children of earth concerning their wisdom: Show (it) unto them; for ye are their guides, and a recompense over the whole earth." },
  { t = "v", n = 2, text = "For I and My son will be united with them for ever in the paths of uprightness in their lives; and ye shall have peace: rejoice, ye children of uprightness. Amen." },
]

[[section]]
id = "106"
title = "Chapter 106"
level = 1
blocks = [
  { t = "h", level = 2, text = "FRAGMENT OF THE BOOK OF NOAH (CVI-CVII.)" },
  { t = "v", n = 1, p = true, text = "And after some days my son Methuselah took a wife for his son Lamech, and she became pregnant by him and bore a son." },
  { t = "v", n = 2, text = "And his body was white as snow and red as the blooming of a rose, and the hair of his head †and his long locks were white as wool, and his eyes beautiful†. And when he opened his eyes, he lighted up the whole house like the sun, and the whole house was very bright." },
  { t = "v", n = 3, text = "And thereupon he arose in the hands of the midwife, opened his mouth, and †conversed with† the Lord of righteousness." },
  { t = "v", n = 4, text = "And his father Lamech was afraid of him and fled, and came to his father Methuselah." },
  { t = "v", n = 5, text = "And he said unto him: 'I have begotten a strange son, diverse from and unlike man, and resembling the sons of the God of heaven; and his nature is different and he is not like us, and his eyes are as the rays of the sun, and his countenance is glorious." },
  { t = "v", n = 6, text = "And it seems to me that he is not sprung from me but from the angels, and I fear that in his days a wonder may be wrought on the earth." },
  { t = "v", n = 7, text = "And now, my father, I am here to petition thee and implore thee that thou mayest go to Enoch, our father, and learn from him the truth, for his dwelling-place is amongst the angels.'" },
  { t = "v", n = 8, text = "And when Methuselah heard the words of his son, he came to me to the ends of the earth; for he had heard that I was there, and he cried aloud, and I heard his voice and I came to him. And 1 said unto him: 'Behold, here am I, my son, **wherefore** hast thou come to me?'" },
  { t = "v", n = 9, text = "And he answered and said: 'Because of a great cause of anxiety have I come to thee, and because of a disturbing vision have I approached." },
  { t = "v", n = 10, text = "And now, my father, hear me: unto Lamech my son there hath been born a son, the like of whom there is none, and his nature is not like man's nature, and the colour of his body is whiter than snow and redder than the bloom of a rose, and the hair of his head is whiter than white wool, and his eyes are like the rays of the sun, and he opened his eyes and thereupon lighted up the whole house." },
  { t = "v", n = 11, text = "And he arose in the hands of the midwife, and opened his mouth and blessed the Lord of heaven." },
  { t = "v", n = 12, text = "And his father Lamech became afraid and fled to me, and did not believe that he was sprung from him, but that he was in the likeness of the angels of heaven; and behold I have come to thee that thou mayest make known to me the truth.'" },
  { t = "v", n = 13, text = "And I, Enoch, answered and said unto him: 'The Lord will do a new thing on the earth, and this I have already seen in a vision, and make known to thee that in the generation of my father Jared some of the **angels** of heaven transgressed the word of the Lord." },
  { t = "v", n = 14, text = "And behold they commit sin and transgress the law, and have united themselves with women and commit sin with them, and have married some of them, and have begotten children by them." },
  { t = "v", n = 17, text = "And they shall produce on the earth giants not according to the spirit, but according to the flesh, and there shall be a great punishment on the earth, and the earth shall be cleansed from all impurity." },
  { t = "v", n = 15, text = "Yea, there shall come a great destruction over the whole earth, and there shall be a deluge and a great destruction for one year." },
  { t = "v", n = 16, text = "And this son who has been born unto you shall be left on the earth, and his three children shall be saved with him: when all mankind that are on the earth shall die [he and his sons shall be saved]." },
  { t = "v", n = 18, text = "And now make known to thy son Lamech that he who has been born is in truth his son, and call his name Noah; for he shall be left to you, and he and his sons shall be saved from the destruction, which shall come upon the earth on account of all the sin and all the unrighteousness, which shall be consummated on the earth in his days." },
  { t = "v", n = 19, text = "And after that there shall be still more unrighteousness than that which was first consummated on the earth; for I know the mysteries of the holy ones; for He, the Lord, has showed me and informed me, and I have read (them) in the heavenly tablets." },
]

[[section]]
id = "107"
title = "Chapter 107"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And I saw written on them that generation upon generation shall transgress, till a generation of righteousness arises, and transgression is destroyed and sin passes away from the earth, and all manner of good comes upon it." },
  { t = "v", n = 2, text = "And now, my son, go and make known to thy son Lamech that this son, which has been born, is in truth his son, and that (this) is no lie.'" },
  { t = "v", n = 3, text = "And when Methuselah had heard the words of his father Enoch—for he had shown to him everything in secret—he returned and showed (them) to him and called the name of that son Noah; for he will comfort the earth after all the destruction." },
]

[[section]]
id = "108"
title = "Chapter 108"
level = 1
blocks = [
  { t = "h", level = 2, text = "CVIII. AN APPENDIX TO THE BOOK OF ENOCH." },
  { t = "v", n = 1, p = true, text = "Another book which Enoch wrote for his son Methuselah and for those who will come after him, and keep the law in the last days." },
  { t = "v", n = 2, text = "Ye who have done good shall wait for those days till an end is made of those who work evil; and an end of the might of the transgressors." },
  { t = "v", n = 3, text = "And wait ye indeed till sin has passed away, for their names shall be blotted out of the book of life and out of the holy books, and their seed shall be destroyed for ever, and their spirits shall be slain, and they shall cry and make lamentation in a place that is a chaotic wilderness, and **in the fire shall they burn**; for there is no earth there." },
  { t = "v", n = 4, text = "And I saw there something like an invisible cloud; for by reason of its depth I could not look over, and I saw a flame of fire blazing brightly, and things like shining mountains circling and sweeping to and fro." },
  { t = "v", n = 5, text = "And I asked one of the holy angels who was with me and said unto him: 'What is this shining thing? for it is not a heaven but only the flame of a blazing fire, and the voice of weeping and crying and lamentation and strong pain.'" },
  { t = "v", n = 6, text = "And he said unto me: 'This place which thou seest—here are cast the spirits of sinners and blasphemers, and of those who work wickedness, and of those who pervert everything that the Lord hath spoken through the mouth of the prophets—(even) the things that shall be." },
  { t = "v", n = 7, text = "For some of them are written and inscribed above in the heaven, in order that the angels may read them and know that which shall befall the sinners, and the spirits of the humble, and of those who have afflicted their bodies, and been recompensed by God; and of those who have been put to shame by wicked men:" },
  { t = "v", n = 8, text = "Who love God and loved neither gold nor silver nor any of the good things which are in the world, but gave over their bodies to torture." },
  { t = "v", n = 9, text = "Who, since they came into being, longed not after earthly food, but regarded everything as a passing breath, and lived accordingly, and the Lord tried them much, and their spirits were found pure so that they should bless His name." },
  { t = "v", n = 10, text = "And all the blessings destined for them I have recounted in the books. And he hath assigned them their recompense, because they have been found to be such as loved heaven more than their life in the world, and though they were trodden under foot of wicked men, and experienced abuse and reviling from them and were put to shame, yet they blessed Me." },
  { t = "v", n = 11, text = "And now I will summon the spirits of the good who belong to the generation of light, and I will transform those who were born in darkness, who in the flesh were not recompensed with such honour as their faithfulness deserved." },
  { t = "v", n = 12, text = "And I will bring forth in shining light those who have loved My holy name, and I will seat each on the throne of his honour." },
  { t = "v", n = 13, text = "And they shall be resplendent for times without number; for righteousness is the judgement of God; for to the faithful He will give faithfulness in the habitation of upright paths." },
  { t = "v", n = 14, text = "And they shall see those who were, born in darkness led into darkness, while the righteous shall be resplendent." },
  { t = "v", n = 15, text = "And the sinners shall cry aloud and see them resplendent, and they indeed shall go where days and seasons are prescribed for them.'" },
]

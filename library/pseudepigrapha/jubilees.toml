[work]
id = "jubilees"
title = "The Book of Jubilees"
short_title = "Jubilees"
author = "pseudepigrapha-anonymous"
collection = "pseudepigrapha"
order = 2
date = "2nd century BC (Charles dates it between 109 and 105 BC)"
language = "Ge'ez (Ethiopic), from a Hebrew original; Latin and Hebrew fragments"
translator = "R. H. Charles"
edition = "The Book of Jubilees, or The Little Genesis, translated by R. H. Charles, with an introduction by G. H. Box (London: SPCK, 1917), Translations of Early Documents, Series I"
source_url = "https://archive.sacred-texts.com/bib/jub/index.htm"
source_sha256 = "342f00f83340fe1b84adcfe5f3c3eca68d7e0e55f8c9c2b2fefd114f2afdd2a7"
retrieved = "2026-11-21"
license = "Public domain"
license_basis = "Published in London by the Society for Promoting Christian Knowledge in 1917; in the public domain in the United States because it was published before 1931. Text checked against the archive.org scan of the 1917 printing (bookofjubileesor01char)."
words = 52490
summary = "A Jewish retelling of Genesis and the first part of Exodus, revealed by an angel to Moses on Sinai and dated by a calendar of jubilees, with stress on the Law, the Sabbath and a solar year of 364 days. It is canonical in the Ethiopian Orthodox Tewahedo Church and is outside the Protestant and Catholic canons. It is not Scripture."

[[section]]
id = "prologue"
title = "Prologue"
level = 1
blocks = [
  { t = "p", text = "THIS is the history of the division of the days of the law and of the testimony, of the events of the years, of their (year) weeks, of their jubilees throughout all the years of the world, as the Lord spake to Moses on Mount Sinai when he went up to receive the tables of the law and of the commandment, according to the voice of God as He said unto him, \"Go up to the top of the Mount.\"" },
]

[[section]]
id = "1"
title = "Chapter 1"
level = 1
blocks = [
  { t = "h", level = 3, text = "God's Revelation to Moses on Mount Sinai (i. 1-26: cf. Ex. xxiv. 15-18)." },
  { t = "v", n = 1, text = "And it came to pass in the first year of the exodus of the children of Israel out of Egypt, in the third month, on the sixteenth day of the month, that God spake to Moses, saying: \"Come up to Me on the Mount, and I will give thee two tables of stone of the law and of the commandment, which I have written, that thou mayst teach them.\"" },
  { t = "v", n = 2, text = "And Moses went up into the mount of God, and the glory of the Lord abode on Mount Sinai, and a cloud overshadowed it six days." },
  { t = "v", n = 3, text = "And He called to Moses on the seventh day out of the midst of the cloud, and the appearance of the glory of the Lord was like a flaming fire on the top of the Mount." },
  { t = "v", n = 4, text = "And Moses was on the Mount forty days and forty nights, and God taught him the earlier and the later history of the division of all the days of the law and of the testimony." },
  { t = "v", n = 5, text = "And He said: \"Incline thine heart to every word which I shall speak to thee on this Mount, and write them in a book in order that their generations may see how I have not forsaken them for all the evil which they have wrought in transgressing the covenant which I establish between Me and thee for their generations this day on Mount Sinai." },
  { t = "v", n = 6, text = "And thus it will come to pass when all these things come upon them, that they will recognize that I am more righteous than they in all their judgments and in all their actions, and they will recognize that I have been truly with them." },
  { t = "v", n = 7, text = "And do thou write for thyself all these words which I declare unto thee this day, for I know their rebellion and their stiff neck, before I bring them into the land of which I sware to their fathers, to Abraham and to Isaac and to Jacob, saying: \"Unto your seed will I give a land flowing with milk and honey." },
  { t = "v", n = 8, text = "And they will eat and be satisfied, and they will turn to strange gods, to (gods) which cannot deliver them from aught of their tribulation: \"and this witness shall be heard for a witness against them." },
  { t = "v", n = 9, text = "For they will forget all My commandments, (even) all that I command them, and they will walk after the Gentiles, and after their uncleanness, and after their shame, and will serve their gods, and these will prove unto them an offence and a tribulation and an affliction and a snare." },
  { t = "v", n = 10, text = "And many will perish and they will be taken captive, and will fall into the hands of the enemy, because they have forsaken My ordinances and My commandments, and the festivals of My covenant, and My sabbaths, and My holy place which I have hallowed for Myself in their midst, and My tabernacle, and My sanctuary, which I have hallowed for Myself in the midst of the land, that I should set My name upon it, and that it should dwell (there)." },
  { t = "v", n = 11, text = "And they will make to themselves high places and groves and graven images, and they will worship, each his own (graven image), so as to go astray, and they will sacrifice their children to demons, and to all the works of the error of their hearts." },
  { t = "v", n = 12, text = "And I will send witnesses unto them, that I may witness against them, but they will not hear, and will slay the witnesses also, and they will persecute those who seek the law, and they will abrogate and change everything so as to work evil before My eyes." },
  { t = "v", n = 13, text = "And I shall hide My face from them, and I shall deliver them into the hand of the Gentiles for captivity, and for a prey, and for devouring, and I shall remove them from the midst of the land, and I shall scatter them amongst the Gentiles." },
  { t = "v", n = 14, text = "And they will forget all My law and all My commandments and all My judgments, and will go astray as to new moons, and sabbaths, and festivals, and jubilees, and ordinances." },
  { t = "v", n = 15, text = "And after this they will turn to Me from amongst the Gentiles with all their heart and with all their soul and with all their strength, and I shall gather them from amongst all the Gentiles, and they will seek Me, so that I shall be found of them, when they seek Me with all their heart and with all their soul." },
  { t = "v", n = 16, text = "And I shall disclose to them abounding peace with righteousness, and I shall †remove them the plant of uprightness†, with all My heart and with all My soul, and they will be for a blessing and not for a curse, and they will be the head and not the tail." },
  { t = "v", n = 17, text = "And I shall build My sanctuary in their midst, and I shall dwell with them, and I shall be their God and they will be My people in truth and righteousness." },
  { t = "v", n = 18, text = "And I shall not forsake them nor fail them; for I am the Lord their God.\"" },
  { t = "v", n = 19, text = "And Moses fell on his face and prayed and said, \"O Lord my God, do not forsake Thy people and Thy inheritance, so that they should wander in the error of their hearts, and do not deliver them into the hands of their enemies, the Gentiles, lest they should rule over them and cause them to sin against Thee." },
  { t = "v", n = 20, text = "Let Thy mercy, O Lord, be lifted up upon Thy people, and create in them an upright spirit, and let not the spirit of Beliar rule over them to accuse them before Thee, and to ensnare them from all the paths of righteousness, so that they may perish from before Thy face." },
  { t = "v", n = 21, text = "But they are Thy people and Thy inheritance, which Thou hast delivered with Thy great power from the hands of the Egyptians: create in them a clean heart and a holy Spirit, and let them not be ensnared in their sins from henceforth until eternity.\"" },
  { t = "v", n = 22, text = "And the Lord said unto Moses: \"I know their contrariness and their thoughts and their stiffneckedness, and they will not be obedient till they confess their own sin and the sin of their fathers." },
  { t = "v", n = 23, text = "And after this they will turn to Me in all uprightness and with all (their) heart and with all (their) soul, and I shall circumcise the foreskin of their heart and the foreskin of the heart of their seed, and I shall create in them a holy spirit, and I shall cleanse them so that they shall not turn away from Me from that day unto eternity." },
  { t = "v", n = 24, text = "And their souls will cleave to Me and to all My commandments, and they will fulfil My commandments, and I shall be their Father and they will be My children." },
  { t = "v", n = 25, text = "And they will all be called children of the living God, and every angel and every spirit will know, yea, they will know that these are My children, and that I am their Father in uprightness and righteousness, and that I love them." },
  { t = "v", n = 26, text = "And do thou write down for thyself all these words which I declare unto thee on this mountain, the first and the last, which shall come to pass in all the divisions of the days in the law and in the testimony and in the weeks and the jubilees unto eternity, until I descend and dwell with them throughout eternity.\"" },
  { t = "h", level = 3, text = "God commands the Angel to write (i. 27-29)." },
  { t = "v", n = 27, text = "And He said to the angel of the presence: \"Write for Moses from the beginning of creation till My sanctuary has been built among them for all eternity." },
  { t = "v", n = 28, text = "And the Lord will appear to the eyes of all, and all will know that I am the God of Israel and the Father of all the children of Jacob, and King on Mount Zion for all eternity. And Zion and Jerusalem will be holy.\"" },
  { t = "v", n = 29, text = "And the angel of the presence who went before the camp of Israel took the tables of the divisions of the years —from the time of the creation—of the law and of the testimony of the weeks, of the jubilees, according to the individual years, according to all the number of the jubilees [according to the individual years], from the day of the [new] creation †when† the heavens and the earth shall be renewed and all their creation according to the powers of the heaven, and according to all the creation of the earth, until the sanctuary of the Lord shall be made in Jerusalem on Mount Zion, and all the luminaries be renewed for healing and for peace and for blessing for all the elect of Israel, and that thus it may be from that day and unto all the days of the earth." },
]

[[section]]
id = "2"
title = "Chapter 2"
level = 1
blocks = [
  { t = "h", level = 3, text = "The Angel dictates to Moses the Primæval History: the Creation of the World and Institution of the Sabbath (ii. 1-33; cf. Gen. i.-ii. 3)." },
  { t = "v", n = 1, text = "And the angel of the presence spake to Moses according to the word of the Lord, saying: Write the complete history of the creation, how in six days the Lord God finished all His works and all that He created, and kept Sabbath on the seventh day and hallowed it for all ages, and appointed it as a sign for all His works." },
  { t = "v", n = 2, text = "For on the first day He created the heavens which are above and the earth and the waters and all the spirits which serve before Him—the angels of the presence, and the angels of sanctification, and the angels [of the spirit of fire and the angels] of the spirit of the winds, and the angels of the spirit of the clouds, and of darkness, and of snow and of hail and of hoar frost, and the angels of the voices and of the thunder and of the lightning, and the angels of the spirits of cold and of heat, and of winter and of spring and of autumn and of summer, and of all the spirits of His creatures which are in the heavens and on the earth, (He created) the abysses and the darkness, eventide (and night), and the light, dawn and day, which He hath prepared in the knowledge of His heart." },
  { t = "v", n = 3, text = "And thereupon we saw His works, and praised Him, and lauded before Him on account of all His works; for seven great works did He create on the first day." },
  { t = "v", n = 4, text = "And on the second day He created the firmament in the midst of the waters, and the waters were divided on that day—half of them went up above and half of them went down below the firmament (that was) in the midst over the face of the whole earth. And this was the only work (God) created on the second day." },
  { t = "v", n = 5, text = "And on the third day He commanded the waters to pass from off the face of the whole earth into one place, and the dry land to appear." },
  { t = "v", n = 6, text = "And the waters did so as He commanded them, and they retired from off the face of the earth into one place outside of this firmament, and the dry land appeared." },
  { t = "v", n = 7, text = "And on that day He created for them all the seas according to their separate gathering-places, and all the rivers, and the gatherings of the waters in the mountains and on all the earth, and all the lakes, and all the dew of the earth, and the seed which is sown, and all sprouting things, and fruit-bearing trees, and trees of the wood, and the garden of Eden, in Eden, and all (plants after their kind). These four great works God created on the third day." },
  { t = "v", n = 8, text = "And on the fourth day He created the sun and the moon and the stars, and set them in the firmament of the heaven, to give light upon all the earth, and to rule over the day and the night, and divide the light from the darkness." },
  { t = "v", n = 9, text = "And God appointed the sun to be a great sign on the earth for days and for sabbaths and for months and for feasts and for years and for sabbaths of years and for jubilees and for all seasons of the years." },
  { t = "v", n = 10, text = "And it divideth the light from the darkness [and] for prosperity, that all things may prosper which shoot and grow on the earth. These three kinds He made on the fourth day." },
  { t = "v", n = 11, text = "And on the fifth day He created great sea monsters in the depths of the waters, for these were the first things of flesh that were created by His hands, the fish and everything that moves in the waters, and everything that flies, the birds and all their kind." },
  { t = "v", n = 12, text = "And the sun rose above them to prosper (them), and above everything that was on the earth, everything that shoots out of the earth, and all fruit-bearing trees, and all flesh. These three kinds He created on the fifth day." },
  { t = "v", n = 13, text = "And on the sixth day He created all the animals of the earth, and all cattle, and everything that moves on the earth." },
  { t = "v", n = 14, text = "And after all this He created man, a man and a woman created He them, and gave him dominion over all that is upon the earth, and in the seas, and over everything that flies, and over beasts and over cattle, and over everything that moves on the earth, and over the whole earth, and over all this He gave him dominion. And these four kinds He created on the sixth day." },
  { t = "v", n = 15, text = "And there were altogether two and twenty kinds." },
  { t = "v", n = 16, text = "And He finished all His work on the sixth day—all that is in the heavens and on the earth, and in the seas and in the abysses, and in the light and in the darkness, and in everything." },
  { t = "v", n = 17, text = "And He gave us a great sign, the Sabbath day, that we should work six days, but keep Sabbath on the seventh day from all work." },
  { t = "v", n = 18, text = "And all the angels of the presence, and all the angels of sanctification, these two great classes—He hath bidden us to keep the Sabbath with Him in heaven and on earth." },
  { t = "v", n = 19, text = "And He said unto us: \"Behold, I will separate unto Myself a people from among all the peoples, and these will keep the Sabbath day, and I will sanctify them unto Myself as My people, and will bless them; as I have sanctified the Sabbath day and do sanctify (it) unto Myself, even so shall I bless them, and they will be My people and I shall be their God." },
  { t = "v", n = 20, text = "And I have chosen the seed of Jacob from amongst all that I have seen, and have written him down as My firstborn son, and have sanctified him unto Myself for ever and ever; and I will teach them the Sabbath day, that they may keep Sabbath thereon from all work.\"" },
  { t = "v", n = 21, text = "And thus He created therein a sign in accordance with which they should keep Sabbath with us on the seventh day, to eat and to drink, and to bless Him who hath created all things as He hath blessed and sanctified unto Himself a peculiar people above all peoples, and that they should keep Sabbath together with us." },
  { t = "v", n = 22, text = "And He caused His commands to ascend as a sweet savour acceptable before Him all the days. . . ." },
  { t = "v", n = 23, text = "There (were) two and twenty heads of mankind from Adam to Jacob, and two and twenty kinds of work were made until the seventh day; this is blessed and holy; and the former also is blessed and holy; and this one serves with that one for sanctification and blessing." },
  { t = "v", n = 24, text = "And to this (Jacob and his seed) it was granted that they should always be the blessed and holy ones of the first testimony and law, even as He had sanctified and blessed the Sabbath day on the seventh day." },
  { t = "v", n = 25, text = "He created heaven and earth and everything that He created in six days, and God made the seventh day holy, for all His works; therefore He commanded on its behalf that, whoever doth any work thereon shall die, and that he who defileth it shall surely die." },
  { t = "v", n = 26, text = "Wherefore do thou command the children of Israel to observe this day that they may keep it holy and not do thereon any work, and not to defile it, as it is holier than all other days." },
  { t = "v", n = 27, text = "And whoever profaneth it shall surely die, and whoever doeth thereon any work shall surely die eternally, that the children of Israel may observe this day throughout their generations, and not be rooted out of the land; for it is a holy day and a blessed day." },
  { t = "v", n = 28, text = "And every one who observeth it and keepeth Sabbath thereon from all his work, will be holy and blessed throughout all days like unto us." },
  { t = "v", n = 29, text = "Declare and say to the children of Israel the law of this day both that they should keep Sabbath thereon, and that they should not forsake it in the error of their hearts; (and) that it is not lawful to do any work thereon which is unseemly, to do thereon their own pleasure, and that they should not prepare thereon anything to be eaten or drunk. †and (that it is not lawful) to draw water, or bring in or take out thereon through their gates any burden,† which they had not prepared for themselves on the sixth day in their dwellings." },
  { t = "v", n = 30, text = "And they shall not bring in nor take out from house to house on that day; for that day is more holy and blessed than any jubilee day of the jubilees: on this we kept Sabbath in the heavens before it was made known to any flesh to keep Sabbath thereon on the earth." },
  { t = "v", n = 31, text = "And the Creator of all things blessed it, but He did not sanctify all peoples and nations to keep Sabbath thereon, but Israel alone: them alone He permitted to eat and drink and to keep Sabbath thereon on the earth." },
  { t = "v", n = 32, text = "And the Creator of all things blessed this day which He had created for a blessing and a sanctification and a glory above all days." },
  { t = "v", n = 33, text = "This law and testimony was given to the children of Israel as a law for ever unto their generations." },
]

[[section]]
id = "3"
title = "Chapter 3"
level = 1
blocks = [
  { t = "h", level = 3, text = "Paradise and the Fall (iii. 1-35; cf. Gen. ii. 4-iii.)." },
  { t = "v", n = 1, text = "And on the six days of the second week we brought, according to the word of God, unto Adam all the beasts, and all the cattle, and all the birds, and everything that moveth on the earth, and everything that moveth in the water, according to their kinds, and according to their types: the beasts on the first day; the cattle on the second day; the birds on the third day; and all that which moveth on the earth on the fourth day; and that which moveth in the water on the fifth day." },
  { t = "v", n = 2, text = "And Adam named them all by their respective names, and as he called them, so was their name." },
  { t = "v", n = 3, text = "And on these five days Adam saw all these, male and female, according to every kind that was on the earth, but he was alone and found no helpmeet for him." },
  { t = "v", n = 4, text = "And the Lord said unto us: \"It is not good that the man should be alone: let us make a helpmeet for him.\"" },
  { t = "v", n = 5, text = "And the Lord our God caused a deep sleep to fall upon him, and he slept, and He took for the woman one rib from amongst his ribs, and this rib was the origin of the woman from amongst his ribs, and He built up the flesh in its stead, and built the woman." },
  { t = "v", n = 6, text = "And He awaked Adam out of his sleep and on awaking he rose on the sixth day, and He brought her to him, and he knew her, and said unto her: \"This is now bone of my bones and flesh of my flesh; she will be called [my] wife; because she was taken from her husband.\"" },
  { t = "v", n = 7, text = "Therefore shall man and wife be one, and therefore shall a man leave his father and his mother, and cleave unto his wife, and they shall be one flesh." },
  { t = "v", n = 8, text = "In the first week was Adam created, and the rib—his wife: in the second week He showed her unto him: and for this reason the commandment was given to keep in their defilement, for a male seven days, and for a female twice seven days." },
  { t = "v", n = 9, text = "And after Adam had completed forty days in the land where he had been created, we brought him into the Garden of Eden to till and keep it, but his wife they brought in on the eightieth day, and after this she entered into the Garden of Eden." },
  { t = "v", n = 10, text = "And for this reason the commandment is written on the heavenly tables in regard to her that giveth birth: \"if she beareth a male, she shall remain in her uncleanness seven days according to the first week of days, and thirty and three days shall she remain in the blood of her purifying, and she shall not touch any hallowed thing, nor enter into the sanctuary, until she accomplisheth these days which (are enjoined) in the case of a male child." },
  { t = "v", n = 11, text = "But in the case of a female child she shall remain in her uncleanness two weeks of days, according to the first two weeks, and sixty-six days in the blood of her purification, and they will be in all eighty days.\"" },
  { t = "v", n = 12, text = "And when she had completed these eighty days we brought her into the Garden of Eden, for it is holier than all the earth besides, and every tree that is planted in it is holy." },
  { t = "v", n = 13, text = "Therefore, there was ordained regarding her who beareth a male or a female child the statute of those days that she should touch no hallowed thing, nor enter into the sanctuary until these days for the male or female child are accomplished." },
  { t = "v", n = 14, text = "This is the law and testimony which was written down for Israel, in order that they should observe (it) all the days." },
  { t = "v", n = 15, text = "And in the first week of the first jubilee, Adam and his wife were in the Garden of Eden for seven years tilling and keeping it, and we gave him work and we instructed him to do everything that is suitable for tillage." },
  { t = "v", n = 16, text = "And he tilled (the garden), and was naked and knew it not, and was not ashamed, and he protected the garden from the birds and beasts and cattle, and gathered its fruit, and ate, and put aside the residue for himself and for his wife [and put aside that which was being kept]." },
  { t = "v", n = 17, text = "And after the completion of the seven years, which he had completed there, seven years exactly, and in the second month, on the seventeenth day (of the month), the serpent came and approached the woman, and the serpent said to the woman, \"Hath God commanded you, saying, Ye shall not eat of every tree of the garden?\"" },
  { t = "v", n = 18, text = "And she said to it, \"Of all the fruit of the trees of the garden God hath said unto us, Eat; but of the fruit of the tree which is in the midst of the garden God hath said unto us, Ye shall not eat thereof, neither shall ye touch it, lest ye die.\"" },
  { t = "v", n = 19, text = "And the serpent said unto the woman, \"Ye shall not surely die: for God doth know that on the day ye shall eat thereof, your eyes will be opened, and ye will be as gods, and ye will know good and evil.\"" },
  { t = "v", n = 20, text = "And the woman saw the tree that it was agreeable and pleasant to the eye, and that its fruit was good for food, and she took thereof and ate." },
  { t = "v", n = 21, text = "And when she had first covered her shame with fig-leaves, she gave thereof to Adam and he ate, and his eyes were opened, and he saw that he was naked." },
  { t = "v", n = 22, text = "And he took fig-leaves and sewed (them) together, and made an apron for himself, and covered his shame." },
  { t = "v", n = 23, text = "And God cursed the serpent, and was wroth with it for ever. . . ." },
  { t = "v", n = 24, text = "And He was wroth with the woman, because she hearkened to the voice of the serpent, and did eat; and He said unto her: I shall greatly multiply thy sorrow and thy pains in sorrow thou shalt bring forth children, and thy return shall be unto thy husband, and he will rule over thee.\"" },
  { t = "v", n = 25, text = "And to Adam also He said, \"Because thou hast hearkened unto the voice of thy wife, and hast eaten of the tree of which I commanded thee that thou shouldst not eat thereof, cursed be the ground for thy sake: thorns and thistles shall it bring forth to thee, and thou shalt eat thy bread in the sweat of thy face, till thou returnest to the earth from whence thou wast taken; for earth thou art, and unto earth shalt thou return.\"" },
  { t = "v", n = 26, text = "And He made for them coats of skin, and clothed them, and sent them forth from the Garden of Eden." },
  { t = "v", n = 27, text = "And on that day on which Adam went forth from the garden, he offered as a sweet savour an offering, frankincense, galbanum, and stacte, and spices in the morning with the rising of the sun from the day when he covered his shame." },
  { t = "v", n = 28, text = "And on that day was closed the mouth of all beasts, and of cattle, and of birds, and of whatever walketh, and of whatever moveth, so that they could no longer speak: for they had all spoken one with another with one lip and with one tongue." },
  { t = "v", n = 29, text = "And He sent out of the Garden of Eden all flesh that was in the Garden of Eden, and all flesh was scattered according to its kinds, and according to its types unto the places which had been created for them." },
  { t = "v", n = 30, text = "And to Adam alone did He give (the wherewithal) to cover his shame, of all the beasts and cattle." },
  { t = "v", n = 31, text = "On this account, it is prescribed on the heavenly tables as touching all those who know the judgment of the law, that they should cover their shame, and should not uncover themselves as the Gentiles uncover themselves." },
  { t = "v", n = 32, text = "And on the new moon of the fourth month, Adam and his wife went forth from the Garden of Eden, and they dwelt in the land of ’Eldâ, in the land of their creation." },
  { t = "v", n = 33, text = "And Adam called the name of his wife Eve." },
  { t = "v", n = 34, text = "And they had no son till the first jubilee, and after this he knew her." },
  { t = "v", n = 35, text = "Now he tilled the land as he had been instructed in the Garden of Eden." },
]

[[section]]
id = "4"
title = "Chapter 4"
level = 1
blocks = [
  { t = "h", level = 3, text = "Cain and Abel (iv. 1-12; cf. Gen. iv.)." },
  { t = "v", n = 1, text = "And in the third week in the second jubilee she gave birth to Cain, and in the fourth she gave birth to Abel, and in the fifth she gave birth to her daughter ’Âwân." },
  { t = "v", n = 2, text = "And in the first (year) of the third jubilee, Cain slew Abel because (God) accepted the sacrifice of Abel, and did not accept the offering of Cain." },
  { t = "v", n = 3, text = "And he slew him in the field: and his blood cried from the ground to heaven, complaining because he had slain him." },
  { t = "v", n = 4, text = "And the Lord reproved Cain because of Abel, because he had slain him, and he made him a fugitive on the earth because of the blood of his brother, and he cursed him upon the earth." },
  { t = "v", n = 5, text = "And on this account it is written on the heavenly tables, \"Cursed is he who smiteth his neighbour treacherously, and let all who have seen and heard say, So be it; and the man who hath seen and not declared (it), let him be accursed as the other.\"." },
  { t = "v", n = 6, text = "And for this reason we announce when we come before the Lord our God all the sin which is committed in heaven and on earth, and in light and in darkness, and everywhere." },
  { t = "v", n = 7, text = "And Adam and his wife mourned for Abel four weeks of years, and in the fourth year of the fifth week they became joyful, and Adam knew his wife again, and she bare him a son, and he called his name Seth; for he said \"God hath raised up a second seed unto us on the earth instead of Abel; for Cain slew him.\"" },
  { t = "v", n = 8, text = "And in the sixth week he begat his daughter ’Azûrâ." },
  { t = "v", n = 9, text = "And Cain took ’Âwân his sister to be his wife and she bare him Enoch at the close of the fourth jubilee. And in the first year of the first week of the fifth jubilee, houses were built on the earth, and Cain built a city, and called its name after the name of his son Enoch." },
  { t = "v", n = 10, text = "And Adam knew Eve his wife and she bare yet nine sons." },
  { t = "v", n = 11, text = "And in the fifth week of the fifth jubilee Seth took ’Azûrâ his sister to be his wife, and in the fourth (year of the sixth week) she bare him Enos." },
  { t = "v", n = 12, text = "He began to call on the name of the Lord on the earth." },
  { t = "h", level = 3, text = "The Patriarchs from Adam to Noah (cf. Gen. v.); Life of Enoch; Death of Adam and Gain (iv. 13-33)." },
  { t = "v", n = 13, text = "And in the seventh jubilee in the third week Enos took Nôâm his sister to be his wife, and she bare him a son in the third year of the fifth week, and he called his name Kenan." },
  { t = "v", n = 14, text = "And at the close of the eighth jubilee Kenan took Mûalêlêth his sister to be his wife, and she bare him a son in the ninth jubilee, in the first week in the third year of this week, and he called his name Mahalalel." },
  { t = "v", n = 15, text = "And in the second week of the tenth jubilee Mahalalel took unto him to wife Dînâh, the daughter of Barâkî’êl the daughter of his father's brother, and she bare him a son in the third week in the sixth year, and he called his name Jared; for in his days the angels of the Lord descended on the earth, those who are named the Watchers, that they should instruct the children of men, and that they should do judgment and uprightness on the earth." },
  { t = "v", n = 16, text = "And in the eleventh jubilee Jared took to himself a wife, and her name was Bâraka, the daughter of Râsûjâl, a daughter of his father's brother, in the fourth week of this jubilee, and she bare him a son in the fifth week, in the fourth year of the jubilee, and he called his name Enoch." },
  { t = "v", n = 17, text = "And he was the first among men that are born on earth who learnt writing and knowledge and wisdom and who wrote down the signs of heaven according to the order of their months in a book, that men might know the seasons of the years according to the order of their separate months." },
  { t = "v", n = 18, text = "And he was the first to write a testimony, and he testified to the sons of men among the generations of the earth, and recounted the weeks of the jubilees, and made known to them the days of the years, and set in order the months and recounted the Sabbaths of the years as we made (them) known to him." },
  { t = "v", n = 19, text = "And what was and what will be he saw in a vision of his sleep, as it will happen to the children of men throughout their generations until the day of judgment; he saw and understood everything, and wrote his testimony, and placed the testimony on earth for all the children of men and for their generations." },
  { t = "v", n = 20, text = "And in the twelfth jubilee, in the seventh week thereof, he took to himself a wife, and her name was Ednî, the daughter of Dânêl, the daughter of his father's brother, and in the sixth year in this week she bare him a son and he called his name Methuselah." },
  { t = "v", n = 21, text = "And he was moreover with the angels of God these six jubilees of years, and they showed him everything which is on earth and in the heavens, the rule of the sun, and he wrote down everything." },
  { t = "v", n = 22, text = "And he testified to the Watchers, who had sinned with the daughters of men; for these had begun to unite themselves, so as to be defiled, with the daughters of men, and Enoch testified against (them) all." },
  { t = "v", n = 23, text = "And he was taken from amongst the children of men, and we conducted him into the Garden of Eden in majesty and honour, and behold there he writeth down the condemnation and judgment of the world, and all the wickedness of the children of men." },
  { t = "v", n = 24, text = "And on account of it (God) brought the waters of the flood upon all the land of Eden; for there he was set as a sign and that he should testify against all the children of men, that he should recount all the deeds of the generations until the day of condemnation." },
  { t = "v", n = 25, text = "And he burnt the incense of the sanctuary, (even) sweet spices, acceptable before the Lord on the Mount." },
  { t = "v", n = 26, text = "For the Lord hath four places on the earth, the Garden of Eden, and the Mount of the East, and this mountain on which thou art this day, Mount Sinai, and Mount Zion (which) will be sanctified in the new creation for a sanctification of the earth; through it will the earth be sanctified from all (its) guilt and its uncleanness throughout the generations of the world." },
  { t = "v", n = 27, text = "And in the fourteenth jubilee Methuselah took unto himself a wife, Ednâ the daughter of ’Âzrîâl, the daughter of his father's brother, in the third week, in the first year of this week, and he begat a son and called his name Lamech." },
  { t = "v", n = 28, text = "And in the fifteenth jubilee in the third week Lamech took to himself a wife, and her name was Bêtênôs the daughter of Bârâkî’îl, the daughter of his father's brother, and in this week she bare him a son and he called his name Noah, saying, \"This one will comfort me for my trouble and all my work, and for the ground which the Lord hath cursed.\"" },
  { t = "v", n = 29, text = "And at the close of the nineteenth jubilee, in the seventh week in the sixth year thereof, Adam died, and all his sons buried him in the land of his creation, and he was the first to be buried in the earth." },
  { t = "v", n = 30, text = "And he lacked seventy years of one thousand years; for one thousand years are as one day in the testimony of the heavens and therefore was it written concerning the tree of knowledge: \"On the day that ye eat thereof ye will die.\" For this reason he did not complete the years of this day; for he died during it." },
  { t = "v", n = 31, text = "At the close of this jubilee Cain was killed after him in the same year; for his house fell upon him and he died in the midst of his house, and he was killed by its stones, for with a stone he had killed Abel, and by a stone was he killed in righteous judgment." },
  { t = "v", n = 32, text = "For this reason it was ordained on the heavenly tables: \"With the instrument with which a man killeth his neighbour with the same shall he be killed; after the manner that he wounded him, in like manner shall they deal with him.\"" },
  { t = "v", n = 33, text = "And in the twenty-fifth jubilee Noah took to himself a wife, and her name was ’Ĕmzârâ, the daughter of Râkê’êl, the daughter of his father's brother, in the first year in the fifth week: and in the third year thereof she bare him Shem, in the fifth year thereof she bare him Ham, and in the first year in the sixth week she bare him Japheth." },
]

[[section]]
id = "5"
title = "Chapter 5"
level = 1
blocks = [
  { t = "h", level = 3, text = "The Fall of the Angels and their Punishment; the Deluge foretold (v. 1-20; cf. Gen. vi. 1-12)." },
  { t = "v", n = 1, text = "And it came to pass when the children of men began to multiply on the face of the earth and daughters were born unto them, that the angels of God saw them on a certain year of this jubilee, that they were beautiful to look upon; and they took themselves wives of all whom they chose, and they bare unto them sons and they were giants." },
  { t = "v", n = 2, text = "And lawlessness increased on the earth and all flesh corrupted its way, alike men and cattle and beasts and birds and everything that walketh on the earth-all of them corrupted their ways and their orders, and they began to devour each other, and lawlessness increased on the earth and every imagination of the thoughts of all men (was) thus evil continually." },
  { t = "v", n = 3, text = "And God looked upon the earth, and behold it was corrupt, and all flesh had corrupted its orders, and all that were upon the earth had wrought all manner of evil before His eyes." },
  { t = "v", n = 4, text = "And He said: \"I shall destroy man and all flesh upon the face of the earth which I have created.\"" },
  { t = "v", n = 5, text = "But Noah found grace before the eyes of the Lord." },
  { t = "v", n = 6, text = "And against the angels whom He had sent upon the earth, He was exceedingly wroth, and He gave commandment to root them out of all their dominion, and He bade us to bind them in the depths of the earth, and behold they are bound in the midst of them, and are (kept) separate." },
  { t = "v", n = 7, text = "And against their sons went forth a command from before His face that they should be smitten with the sword, and be removed from under heaven." },
  { t = "v", n = 8, text = "And He said \"Thy spirit will not always abide on man; for they also are flesh and their days shall be one hundred and twenty years.\"" },
  { t = "v", n = 9, text = "And He sent His sword into their midst that each should slay his neighbour, and they began to slay each other till they all fell by the sword and were destroyed from the earth." },
  { t = "v", n = 10, text = "And their fathers were witnesses (of their destruction), and after this they were bound in the depths of the earth for ever, until the day of the great condemnation when judgment is executed on all those who have corrupted their ways and their works before the Lord." },
  { t = "v", n = 11, text = "And He †destroyed† all from their places, and there †was† not left one of them whom He judged not according to all their wickedness." },
  { t = "v", n = 12, text = "And He †made† for all His works a new and righteous nature, so that they should not sin in their whole nature for ever, but should be all righteous each in his kind alway." },
  { t = "v", n = 13, text = "And the judgment of all is ordained and written on the heavenly tables in righteousness—even (the judgment of) all who depart from the path which is ordained for them to walk in; and if they walk not therein judgment is written down for every creature and for every kind." },
  { t = "v", n = 14, text = "And there is nothing in heaven or on earth, or in light or in darkness, or in Sheol or in the depth, or in the place of darkness (which is not judged); and all their judgments are ordained and written and engraved." },
  { t = "v", n = 15, text = "In regard to all He will judge, the great according to his greatness, and the small according to his smallness, and each according to his way." },
  { t = "v", n = 16, text = "And He is not one who will regard the person (of any), nor is He one who will receive gifts, if He saith that He will execute judgment on each: if one gave everything that is on the earth, He will not regard the gifts or the person (of any), nor accept anything at his hands, for He is a righteous judge. [" },
  { t = "v", n = 17, text = "And of the children of Israel it hath been written and ordained: If they turn to Him in righteousness, He will forgive all their transgressions and pardon all their sins." },
  { t = "v", n = 18, text = "It is written and ordained that He will show mercy to all who turn from all their guilt once each year.]" },
  { t = "v", n = 19, text = "And as for all those who corrupted their ways and their thoughts before the flood, no man's person was accepted save that of Noah alone; for his person was accepted in behalf of his sons, whom (God) saved from the waters of the flood on his account; for his heart was righteous in all his ways, according as it was commanded regarding him, and he had not departed from aught that was ordained for him." },
  { t = "v", n = 20, text = "And the Lord said that He would destroy everything which was upon the earth, both men and cattle, and beasts, and fowls of the air, and that which moveth on the earth." },
  { t = "h", level = 3, text = "The Building of the Ark; the Flood (v. 21-32; cf. Gen. vi. 13-viii. 19)." },
  { t = "v", n = 21, text = "And He commanded Noah to make him an ark, that he might save himself from the waters of the flood." },
  { t = "v", n = 22, text = "And Noah made the ark in all respects as He commanded him, in the twenty-seventh jubilee of years, in the fifth week in the fifth year (on the new moon of the first month)." },
  { t = "v", n = 23, text = "And he entered in the sixth (year) thereof, in the second month, on the new moon of the second month, till the sixteenth; and he entered, and all that we brought to him, into the ark, and the Lord closed it from without on the seventeenth evening." },
  { t = "v", n = 24, indent = 1, text = "And the Lord opened seven flood-gates of heaven," },
  { t = "v", n = 24, indent = 1, cont = true, text = "And the mouths of the fountains of the great deep, seven mouths in number." },
  { t = "v", n = 25, indent = 1, text = "And the flood-gates began to pour down water from the heaven forty days and forty nights," },
  { t = "v", n = 25, indent = 1, cont = true, text = "And the fountains of the deep also sent up waters, until the whole world was full of water." },
  { t = "v", n = 26, indent = 1, text = "And the waters increased upon the earth" },
  { t = "v", n = 26, indent = 1, cont = true, text = "Fifteen cubits did the waters rise above all the high mountains," },
  { t = "v", n = 26, indent = 1, cont = true, text = "And the ark was lift up above the earth," },
  { t = "v", n = 26, indent = 1, cont = true, text = "And it moved upon the face of the waters." },
  { t = "v", n = 27, text = "And the water prevailed on the face of the earth five months-one hundred and fifty days." },
  { t = "v", n = 28, text = "And the ark went and rested on the top of Lûbâr, one of the mountains of Ararat." },
  { t = "v", n = 29, text = "And (on the new moon) in the fourth month the fountains of the great deep were closed and the flood-gates of heaven were restrained; and on the new moon of the seventh month all the mouths of the abysses of the earth were opened, and the water began to descend into the deep below." },
  { t = "v", n = 30, text = "And on the new moon of the tenth month the tops of the mountains were seen, and on the new moon of the first month the earth became visible." },
  { t = "v", n = 31, text = "And the waters disappeared from above the earth in the fifth week in the seventh year thereof, and on the seventeenth day in the second month the earth was dry." },
  { t = "v", n = 32, text = "And on the twenty-seventh thereof he opened the ark, and sent forth from it beasts, and cattle, and birds, and every moving thing." },
]

[[section]]
id = "6"
title = "Chapter 6"
level = 1
blocks = [
  { t = "h", level = 3, text = "Noah's Sacrifice; God's Covenant with him (cf. Gen. viii. 20-ix. 17). Instructions to Moses about eating of Blood, the Feast of Weeks, etc., and Division of the Year (vi. 1-38)." },
  { t = "v", n = 1, text = "And on the new moon of the third month he went forth from the ark, and built an altar on that mountain." },
  { t = "v", n = 2, text = "And he made atonement for the earth, and took a kid and made atonement by its blood for all the guilt of the earth; for everything that had been on it had been destroyed, save those that were in the ark with Noah." },
  { t = "v", n = 3, text = "And he placed the fat thereof on the altar, and he took an ox, and a goat, and a sheep and kids, and salt, and a turtle-dove, and the young of a dove, and placed a burnt sacrifice on the altar, and poured thereon an offering mingled with oil, and sprinkled wine and strewed frankincense over everything, and caused a goodly savour to arise, acceptable before the Lord." },
  { t = "v", n = 4, text = "And the Lord smelt the goodly savour, and He made a covenant with him that there should not be any more a flood to destroy the earth; that all the days of the earth seed-time and harvest should never cease; cold and heat, and summer and winter, and day and night should not change their order, nor cease for ever." },
  { t = "v", n = 5, text = "\"And you, increase ye and multiply upon the earth, and become many upon it, and be a blessing upon it. The fear of you and the dread of you I shall inspire in everything that is on earth and in the sea." },
  { t = "v", n = 6, text = "And behold I have given unto you all beasts, and all winged things, and everything that moveth on the earth, and the fish in the waters, and all things for food; as the green herbs, I have given you all things to eat." },
  { t = "v", n = 7, text = "But flesh, with the life thereof, with the blood, ye shall not eat; for the life of all flesh is in the blood, lest your blood of your lives be required. At the hand of every man, at the hand of every (beast), shall I require the blood of man." },
  { t = "v", n = 8, text = "Whoso sheddeth man's blood by man shall his blood be shed; for in the image of God made He man." },
  { t = "v", n = 9, text = "And you, increase ye, and multiply on the earth.\"" },
  { t = "v", n = 10, text = "And Noah and his sons swore that they would not eat any blood that was in any flesh, and he made a covenant before the Lord God for ever throughout all the generations of the earth in this month." },
  { t = "v", n = 11, text = "On this account He spake to thee that thou shouldst make a covenant with the children of Israel in this month upon the mountain with an oath, and that thou shouldst sprinkle blood upon them because of all the words of the covenant, which the Lord made with them for ever." },
  { t = "v", n = 12, text = "And this testimony is written concerning you that you should observe it continually, so that you should not eat on any day any blood of beasts or birds or cattle during all the days of the earth, and the man who eateth the blood of beast or of cattle or of birds during all the days of the earth, he and his seed shall be rooted out of the land." },
  { t = "v", n = 13, text = "And do thou command the children of Israel to eat no blood, so that their names and their seed may be before the Lord our God continually." },
  { t = "v", n = 14, text = "And for this law there is no limit of days, for it is for ever. They shall observe it throughout their generations, so that they may continue supplicating on your behalf with blood before the altar; every day and at the time of morning and evening they shall seek forgiveness on your behalf perpetually before the Lord that they may keep it and not be rooted out." },
  { t = "v", n = 15, text = "And He gave to Noah and his sons a sign that there should not again be a flood on the earth." },
  { t = "v", n = 16, text = "He set His bow in the cloud for a sign of the eternal covenant that there should not again be a flood on the earth to destroy it all the days of the earth." },
  { t = "v", n = 17, text = "For this reason it is ordained and written on the heavenly tables, that they should celebrate the feast of weeks in this month once a year, to renew the covenant every year." },
  { t = "v", n = 18, text = "And this whole festival was celebrated in heaven from the day of creation till the days of Noah-twenty-six jubilees and five weeks of years: and Noah and his sons observed it for seven jubilees and one week of years, till the day of Noah's death, and from the day of Noah's death his sons did away with (it) until the days of Abraham, and they ate blood." },
  { t = "v", n = 19, text = "But Abraham observed it, and Isaac and Jacob and his children observed it up to thy days, and in thy days the children of Israel forgot it until ye celebrated it anew on this mountain." },
  { t = "v", n = 20, text = "And do thou command the children of Israel to observe this festival in all their generations for a commandment unto them: one day in the year in this month they shall celebrate the festival." },
  { t = "v", n = 21, text = "For it is the feast of weeks and the feast of first-fruits: this feast is twofold and of a double nature: according to what is written and engraven concerning it celebrate it." },
  { t = "v", n = 22, text = "For I have written in the book of the first law, in that which I have written for thee, that thou shouldst celebrate it in its season, one day in the year, and I explained to thee its sacrifices that the children of Israel should remember and should celebrate it throughout their generations in this month, one day in every year." },
  { t = "v", n = 23, text = "And on the new moon of the first month, and on the new moon of the fourth month, and on the new moon of the seventh month, and on the new moon of the tenth month are the days of remembrance, and the days of the seasons in the four divisions of the year. These are written and ordained as a testimony for ever." },
  { t = "v", n = 24, text = "And Noah ordained them for himself as feasts for the generations for ever, so that they have become thereby a memorial unto him." },
  { t = "v", n = 25, text = "And on the new moon of the first month he was bidden to make for himself an ark, and on that (day) the earth became dry and he opened (the ark) and saw the earth." },
  { t = "v", n = 26, text = "And on the new moon of the fourth month the mouths of the depths of the abysses beneath were closed. And on the new moon of the seventh month all the mouths of the abysses of the earth were opened, and the waters began to descend into them." },
  { t = "v", n = 27, text = "And on the new moon of the tenth month the tops of the mountains were seen, and Noah was glad." },
  { t = "v", n = 28, text = "And on this account he ordained them for himself as feasts for a memorial for ever, and thus are they ordained." },
  { t = "v", n = 29, text = "And they placed them on the heavenly tables, each had thirteen weeks; from one to another (passed) their memorial, from the first to the second, and from the second to the third, and from the third to the fourth." },
  { t = "v", n = 30, text = "And all the days of the commandment will be two and fifty weeks of days, and (these will make) the entire year complete." },
  { t = "v", n = 31, text = "Thus it is engraven and ordained on the heavenly tables. And there is no neglecting (this commandment) for a single -year or from year to year." },
  { t = "v", n = 32, text = "And command thou the children of Israel that they observe the years according to this reckoning-three hundred and sixty-four days, and (these) will constitute a complete year, and they will not disturb its time from its days and from its feasts; for everything will fall out in them according to their testimony, and they will not leave out any day nor disturb any feasts." },
  { t = "v", n = 33, text = "But if they do neglect and do not observe them according to His commandment, then they will disturb all their seasons, and the years will be dislodged from this (order), [and they will disturb the seasons and the years will be dislodged] and they will neglect their ordinances." },
  { t = "v", n = 34, text = "And all the children of Israel will forget, and will not find the path of the years, and will forget the new moons, and seasons, and sabbaths, and they will go wrong as to all the order of the years." },
  { t = "v", n = 35, text = "For I know and from henceforth shall I declare it unto thee, and it is not of my own devising; for the book (lieth) written before me, and on the heavenly tables the division of days is ordained, lest they forget the feasts of the covenant and walk according to the feasts of the Gentiles after their error and after their ignorance." },
  { t = "v", n = 36, text = "For there will be those who will assuredly make observations of the moon—now (it) disturbeth the seasons and cometh in from year to year ten days too soon." },
  { t = "v", n = 37, text = "For this reason the years will come upon them when they will disturb (the order), and make an abominable (day) the day of testimony, and an unclean day a feast day, and they will confound all the days, the holy with the unclean, and the unclean day with the holy; for they will go wrong as to the months and sabbaths and feasts and jubilees." },
  { t = "v", n = 38, text = "For this reason I command and testify to thee that thou mayest testify to them; for after thy death thy children will disturb (them), so that they will not make the year three hundred and sixty-four days only, and for this reason they will go wrong as to the new moons and seasons and sabbaths and festivals, and they will eat all kinds of blood with all kinds of flesh." },
]

[[section]]
id = "7"
title = "Chapter 7"
level = 1
blocks = [
  { t = "h", level = 3, text = "Noah offers Sacrifice; the Cursing of Canaan (cf. Gen. ix. 20-28): Noah's Sons and Grandsons (cf. Gen. x.) and their Cities. Noah's Admonitions (vii. 1-39)." },
  { t = "v", n = 1, text = "And in the seventh week in the first year thereof, in this jubilee, Noah planted vines on the mountain on which the ark had rested, named Lûbâr, one of the Ararat Mountains, and they produced fruit in the fourth year, and he guarded their fruit, and gathered it in this year in the seventh month." },
  { t = "v", n = 2, text = "And he made wine therefrom and put it into a vessel, and kept it until the fifth year, until the first day, on the new moon of the first month." },
  { t = "v", n = 3, text = "And he celebrated with joy the day of this feast, and he made a burnt sacrifice unto the Lord, one young ox and one ram, and seven sheep, each a year old, and a kid of the goats, that he might make atonement thereby for himself and his sons." },
  { t = "v", n = 4, text = "And he prepared the kid first, and placed some of its blood on the flesh that was on the altar which he had made, and all the fat he laid on the altar where he made the burnt sacrifice, and the ox and the ram and the sheep, and he laid all their flesh upon the altar." },
  { t = "v", n = 5, text = "And he placed all their offerings mingled with oil upon it, and afterwards he sprinkled wine on the fire which he had previously made on the altar, and he placed incense on the altar and caused a sweet savour to ascend acceptable before the Lord his God." },
  { t = "v", n = 6, text = "And he rejoiced and drank of this wine, he and his children with joy." },
  { t = "v", n = 7, text = "And it was evening, and he went into his tent, and being drunken he lay down and slept, and was uncovered in his tent as he slept." },
  { t = "v", n = 8, text = "And Ham saw Noah his father naked, and went forth and told his two brethren without." },
  { t = "v", n = 9, text = "And Shem took his garment and arose, he and Japheth, and they placed the garment on their shoulders and went backward and covered the shame of their father, and their faces were backward." },
  { t = "v", n = 10, text = "And Noah awoke from his sleep and knew all that his younger son had done unto him, and he cursed his son and said: \"Cursed be Canaan; an enslaved servant shall he be unto his brethren.\"" },
  { t = "v", n = 11, text = "And he blessed Shem, and said: \"Blessed be the Lord God of Shem, and Canaan shall be his servant." },
  { t = "v", n = 12, text = "God shall enlarge Japheth, and God shall dwell in the dwelling of Shem, and Canaan shall be his servant.\"" },
  { t = "v", n = 13, text = "And Ham knew that his father had cursed his younger son, and he was displeased that he had cursed his son, and he parted from his father, he and his sons with him, Cush and Mizraim and Put and Canaan." },
  { t = "v", n = 14, text = "And he built for himself a city and called its name after the name of his wife Nê’êlâtamâ’ûk." },
  { t = "v", n = 15, text = "And Japheth saw it, and became envious of his brother, and he too built for himself a city, and he called its name after the name of his wife ’Adâtanêsês." },
  { t = "v", n = 16, text = "And Shem dwelt with his father Noah, and he built a city close to his father on the mountain, and he too called its name after the name of his wife Sêdêqêtêlĕbâb." },
  { t = "v", n = 17, text = "And behold these three cities are near Mount Lûbâr; Sêdêqêtêlĕbâb fronting the mountain on its east; and Na’êlâtamâ’ûk on the south; ’Adatanêsês towards the west." },
  { t = "v", n = 18, text = "And these are the sons of Shem: Elam, and Asshur, and Arpachshad—this (son) was born two years after the flood—and Lud, and Aram." },
  { t = "v", n = 19, text = "The sons of Japheth: Gomer and Magog and Madai and Javan, Tubal and Meshech and Tiras: these are the sons of Noah." },
  { t = "v", n = 20, text = "And in the twenty-eighth jubilee Noah began to enjoin upon his sons' sons the ordinances and commandments, and all the judgments that he knew, and he exhorted his sons to observe righteousness, and to cover the shame of their flesh, and to bless their Creator, and honour father and mother, and love their neighbour, and guard their souls from fornication and uncleanness and all iniquity." },
  { t = "v", n = 21, text = "For owing to these three things came the flood upon the earth, namely, owing to the fornication wherein the Watchers against the law of their ordinances went a whoring after the daughters of men, and took themselves wives of all which they chose: and they made the beginning of uncleanness." },
  { t = "v", n = 22, text = "And they begat sons the Nâphîdîm, and †they were all unlike†, and they devoured one another: and the Giants slew the Nâphîl, and the Nâphîl slew the Eljô, and the Eljô mankind, and one man another." },
  { t = "v", n = 23, text = "And every one sold himself to work iniquity and to shed much blood, and the earth was filled with iniquity." },
  { t = "v", n = 24, text = "And after this they sinned against the beasts and birds, and all that moveth and walketh on the earth: and much blood was shed on the earth, and every imagination and desire of men imagined vanity and evil continually." },
  { t = "v", n = 25, text = "And the Lord destroyed everything from off the face of the earth; because of the wickedness of their deeds, and because of the blood which they had shed in the midst of the earth He destroyed everything." },
  { t = "v", n = 26, text = "\"And we were left, I and you, my sons, and everything that entered with us into the ark, and behold I see your works before me that ye do not walk in righteousness; for in the path of destruction ye have begun to walk, and ye are parting one from another, and are envious one of another, and (so it cometh) that ye are not in harmony, my sons, each with his brother." },
  { t = "v", n = 27, text = "For I see, and behold the demons have begun (their) seductions against you and against your children, and now I fear on your behalf, that after my death ye will shed the blood of men upon the earth, and that ye, too, will be destroyed from the face of the earth." },
  { t = "v", n = 28, text = "For whoso sheddeth man's blood, and whoso eateth the blood of any flesh, will all be destroyed from the earth." },
  { t = "v", n = 29, indent = 1, text = "And there will not be left any man that eateth blood." },
  { t = "v", n = 29, indent = 1, cont = true, text = "Or that sheddeth the blood of man on the earth," },
  { t = "v", n = 29, indent = 1, cont = true, text = "Nor will there be left to him any seed or descendants living under heaven;" },
  { t = "v", n = 29, indent = 1, cont = true, text = "For into Sheol will they go," },
  { t = "v", n = 29, indent = 1, cont = true, text = "And into the place of condemnation will they descend." },
  { t = "v", n = 29, indent = 1, cont = true, text = "And into the darkness of the deep will they all be removed by a violent death." },
  { t = "v", n = 30, text = "There shall be no blood seen upon you of all the blood there shall be all the days in which ye have killed any beasts or cattle or whatever flieth upon the earth, and work ye a good work to your souls by covering that which hath been shed on the face of the earth." },
  { t = "v", n = 31, text = "And ye shall not be like him who eateth with blood, but guard yourselves that none may eat blood before you: cover the blood, for thus have I been commanded to testify to you and your children, together with all flesh." },
  { t = "v", n = 32, text = "And suffer not the soul to be eaten with the flesh, that your blood, which is your life, may not be required at the hand of any flesh that sheddeth (it) on the earth." },
  { t = "v", n = 33, text = "For the earth will not be clean from the blood which hath been shed upon it; for (only) through the blood of him that shed it will the earth be purified throughout all its generations." },
  { t = "v", n = 34, text = "And now, my children, hearken: work judgment and righteousness that ye may be planted in righteousness over the face of the whole earth, and your glory lifted up before my God, who saved me from the waters of the flood." },
  { t = "v", n = 35, text = "And behold, ye will go and build for yourselves cities, and plant in them all the plants that are upon the earth, and moreover all fruit-bearing trees." },
  { t = "v", n = 36, text = "For three years the fruit of everything that is eaten will not be gathered: and in the fourth year its fruit will be accounted holy [and they will offer the first-fruits], acceptable before the Most High God, who created heaven and earth and all things. Let them offer in abundance the first of the wine and oil (as) first-fruits on the altar of the Lord, who receiveth it, and what is left let the servants of the house of the Lord eat before the altar which receiveth (it)." },
  { t = "v", n = 37, text = "And in the fifth year . . . . . . . make ye the release so that ye release it in righteousness and uprightness, and ye shall be righteous, and all that you plant will prosper." },
  { t = "v", n = 38, text = "For thus did Enoch, the father of your father command Methuselah, his son, and Methuselah his son Lamech, and Lamech commanded me all the things which his fathers commanded him." },
  { t = "v", n = 39, text = "And I also will give you commandment, my sons, as Enoch commanded his son in the first jubilees: whilst still living, the seventh in his generation, he commanded and testified to his son and to his sons' sons until the day of his death.\"" },
]

[[section]]
id = "8"
title = "Chapter 8"
level = 1
blocks = [
  { t = "h", level = 3, text = "Genealogy of the Descendants of Shem: Noah and his Sons divide the Earth (viii. 1-30; cf. Gen. x.)." },
  { t = "v", n = 1, text = "In the twenty-ninth jubilee, in the first week, in the beginning thereof Arpachshad took to himself a wife and her name was Râsû’ĕjâ, [the daughter of Sûsân,] the daughter of Elam, and she bare him a son in the third year in this week, and he called his name Kâinâm." },
  { t = "v", n = 2, text = "And the son grew, and his father taught him writing, and he went to seek for himself a place where he might seize for himself a city." },
  { t = "v", n = 3, text = "And he found a writing which former (generations) had carved on the rock, and he read what was thereon, and he transcribed it and sinned owing to it; for it contained the teaching of the Watchers in accordance with which they used to observe the omens of the sun and moon and stars in all the signs of heaven." },
  { t = "v", n = 4, text = "And he wrote it down and said nothing regarding it; for he was afraid to speak to Noah about it lest he should be angry with him on account of it." },
  { t = "v", n = 5, text = "And in the thirtieth jubilee, in the second week, in the first year thereof, he took to himself a wife, and her name was Mêlkâ, the daughter of Madai, the son of Japheth, and in the fourth year he begat a son, and called his name Shelah; for he said: \"Truly I have been sent.\"" },
  { t = "v", n = 6, text = "[And in the fourth year he was born], and Shelah grew up and took to himself a wife, and her name was Mû’ak, the daughter of Kêsêd, his father's brother, in the one and thirtieth jubilee, in the fifth week, in the first year thereof." },
  { t = "v", n = 7, text = "And she bare him a son in the fifth year thereof, and he called his name Eber: and he took unto himself a wife, and her name was ’Azûrâd the daughter of Nêbrôd, in the thirty-second jubilee, in the seventh week, in the third year thereof." },
  { t = "v", n = 8, text = "And in the sixth year thereof, she bare him a son, and he called his name Peleg; for in the days when he was born the children of Noah began to divide the earth amongst themselves: for this reason he called his name Peleg." },
  { t = "v", n = 9, text = "And they divided (it) secretly amongst themselves, and told it to Noah." },
  { t = "v", n = 10, text = "And it came to pass in the beginning of the thirty-third jubilee that they divided the earth into three parts, for Shem and Ham and Japheth, according to the inheritance of each, in the first year in the first week, when one of us, who had been sent, was with them." },
  { t = "v", n = 11, text = "And he called his sons, and they drew nigh to him, they and their children, and he divided the earth into the lots, which his three sons were to take in possession, and they reached forth their hands, and took the writing out of the bosom of Noah, their father." },
  { t = "v", n = 12, text = "And there came forth on the writing as Shem's lot the middle of the earth which he should take as an inheritance for himself and for his sons for the generations of eternity, from the middle of the mountain range of Râfâ, from the mouth of the water from the river Tînâ. and his portion goeth towards the west through the midst of this river, and it extendeth till it reacheth the water of the abysses, out of which this river goeth forth and poureth its waters into the sea Mê’at, and this river floweth into the great sea. And all that is towards the north is Japheth's, and all that is towards the south belongeth to Shem." },
  { t = "v", n = 13, text = "And it extendeth till it reacheth Kârâsô: this is in the bosom of the tongue which looketh towards the south." },
  { t = "v", n = 14, text = "And his portion extendeth along the great sea, and it extendeth in a straight line till it reacheth the west of the tongue which looketh towards the south; for this sea is named the tongue of the Egyptian Sea." },
  { t = "v", n = 15, text = "And it turneth from here towards the south towards the mouth of the great sea on the shore of (its) waters, and it extendeth to the west to ‘Afrâ and it extendeth till it reacheth the waters of the river Gihon, and to the south of the waters of Gihon, to the banks of this river." },
  { t = "v", n = 16, text = "And it extendeth towards the east, till it reacheth the Garden of Eden, to the south thereof, [to the south] and from the east of the whole land of Eden and of the whole east, it turneth to the †east,† and proceedeth till it reacheth the east of the mountain named Râfâ, and it descendeth to the bank of the mouth of the river Tînâ." },
  { t = "v", n = 17, text = "This portion came forth by lot for Shem and his sons, that they should possess it for ever unto his generations for evermore." },
  { t = "v", n = 18, indent = 1, text = "And Noah rejoiced that this portion came forth for Shem and for his sons, and he remembered all that he had spoken with his mouth in prophecy; for he had said: Blessed be the Lord God of Shem," },
  { t = "v", n = 18, indent = 1, cont = true, text = "And may the Lord dwell in the dwelling of Shem.\"" },
  { t = "v", n = 19, text = "And he knew that the Garden of Eden is the holy of holies, and the dwelling of the Lord, and Mount Sinai the centre of the desert, and Mount Zion—the centre of the navel of the earth: these three were created as holy places facing each other." },
  { t = "v", n = 20, text = "And he blessed the God of gods, who had put the word of the Lord into his mouth, and the Lord for evermore." },
  { t = "v", n = 21, text = "And he knew that a blessed portion and a blessing had come to Shem and his sons unto the generations for ever—the whole land of Eden and the whole land of the Red Sea, and the whole land of the east, and India, and on the Red Sea and the mountains thereof, and all the land of Bashan, and all the land of Lebanon and the islands of Kaftûr, and all the mountains of Sanîr and ’Amânâ, and the mountains of Asshur in the north, and all the land of Elam, Asshur, and Bâbêl, and Sûsân and Mâ‘ĕdâi and all the mountains of Ararat, and all the region beyond the sea, which is beyond the mountains of Asshur towards the north, a blessed and spacious land, and all that is in it is very good." },
  { t = "v", n = 22, text = "And for Ham came forth the second portion, beyond the Gihon towards the south to the right of the Garden, and it extendeth towards the south and it extendeth to all the mountains of fire, and it extendeth towards the west to the sea of ’Atêl and it extendeth towards the west till it reacheth the sea of Mâ’ûk —that (sea) into which †everything which is not destroyed descendeth†." },
  { t = "v", n = 23, text = "And it goeth forth towards the north to the limits of Gâdîr, and it goeth forth to the coast of the waters of the sea to the waters of the great sea till it draweth near to the river Gihon, and goeth along the river Gihon till it reacheth the right of the Garden of Eden." },
  { t = "v", n = 24, text = "And this is the land which came forth for Ham as the portion which he was to occupy for ever for himself and his sons unto their generations for ever." },
  { t = "v", n = 25, text = "And for Japheth came forth the third portion beyond the river Tînâ to the north of the outflow of its waters, and it extendeth north-easterly to the whole region of Gog and to all the country east thereof." },
  { t = "v", n = 26, text = "And it extendeth northerly to the north, and it extendeth to the mountains of Qêlt towards the north, and towards the sea of Mâ’ûk, and it goeth forth to the east of Gâdîr as far as the region of the waters of the sea." },
  { t = "v", n = 27, text = "And it extendeth until it approacheth the west of Fârâ and it returneth towards ’Afêrâg, and it extendeth easterly to the waters of the sea of Mê’at." },
  { t = "v", n = 28, text = "And it extendeth to the region of the river Tînâ in a northeasterly direction until it approacheth the boundary of its waters towards the mountain Râfâ, and it turneth round towards the north." },
  { t = "v", n = 29, text = "This is the land which came forth for Japheth and his sons as the portion of his inheritance which he should possess for himself and his sons, for their generations for ever; five great islands, and a great land in the north." },
  { t = "v", n = 30, text = "But it is cold, and the land of Ham is hot, and the land of Shem is neither hot nor cold, but it is of blended cold and heat." },
]

[[section]]
id = "9"
title = "Chapter 9"
level = 1
blocks = [
  { t = "h", level = 3, text = "Subdivision of the Three Portions amongst the Grandchildren: Oath taken by Noah's Sons (ix. 1-15; cf. Gen. x. partly)." },
  { t = "v", n = 1, text = "And Ham divided amongst his sons, and the first portion came forth for Cush towards the east, and to the west of him for Mizraim, and to the west . of him for Put, and to the west of him [and to the west thereof] on the sea for Canaan." },
  { t = "v", n = 2, text = "And Shem also divided amongst his sons, and the first portion came forth for Elam and his sons, to the east of the river Tigris till it approacheth the east, the whole land of India, and on the Red Sea on its coast, and the waters of Dêdân, and all the mountains of Mebrî and ’Êlâ, and all the land of Sûsân and all that is on the side of Pharnâk to the Red Sea and the river Tînâ." },
  { t = "v", n = 3, text = "And for Asshur came forth the second portion, all the land of Asshur and Nineveh and Shinar and to the border of India, and it ascendeth and skirteth the river." },
  { t = "v", n = 4, text = "And for Arpachshad came forth the third portion, all the land of the region of the Chaldees to the east of the Euphrates, bordering on the Red Sea, and all the waters of the desert close to the tongue of the sea which looketh towards Egypt, all the land of Lebanon and Sanîr and ’Amânâ to the border of the Euphrates." },
  { t = "v", n = 5, text = "And for Aram there came forth the fourth portion, all the land of Mesopotamia between the Tigris and the Euphrates to the north of the Chaldees to the border of the mountains of Asshur and the land of ’Arârâ." },
  { t = "v", n = 6, text = "And there came forth for Lud the fifth portion, the mountains of Asshur and all appertaining to them till it reacheth the Great Sea, and till it reacheth the east of Asshur his brother." },
  { t = "v", n = 7, text = "And Japheth also divided the land of his inheritance amongst his sons." },
  { t = "v", n = 8, text = "And the first portion came forth for Gomer to the east from the north side to the river Tînâ; and in the north there came forth for Magog all the inner portions of the north until it reacheth to the sea of Mê’at." },
  { t = "v", n = 9, text = "And for Madai came forth as his portion that he should possess from the west of his two brothers to the islands, and to the coasts of the islands." },
  { t = "v", n = 10, text = "And for Javan came forth the fourth portion every island and the islands which are towards the border of Lud." },
  { t = "v", n = 11, text = "And for Tubal there came forth the fifth portion in the midst of the tongue which approacheth towards the border of the portion of Lud to the second tongue, to the region beyond the second tongue unto the third tongue." },
  { t = "v", n = 12, text = "And for Meshech came forth the sixth portion, all the region beyond the third tongue till it approacheth the east of Gâdîr." },
  { t = "v", n = 13, text = "And for Tiras there came forth the seventh portion, four great islands in the midst of the sea, which reach to the portion of Ham [and the islands of Kamâtûrî came out by lot for the sons of Arpachshad as his inheritance]." },
  { t = "v", n = 14, text = "And thus the sons of Noah divided unto their sons in the presence of Noah their father, and he bound them all by an oath, imprecating a curse on every one that sought to seize the portion which had not fallen (to him) by his lot." },
  { t = "v", n = 15, text = "And they all said, \"So be it; so be it,\" for themselves and their sons for ever throughout their generations till the day of judgment, on which the Lord God shall judge them with a sword and with fire, for all the unclean wickedness of their errors, wherewith they have filled the earth with transgression and uncleanness and fornication and sin." },
]

[[section]]
id = "10"
title = "Chapter 10"
level = 1
blocks = [
  { t = "h", level = 3, text = "Noah's Sons led astray by Evil Spirits; Noah's Prayer; Mastêmâ; Death of Noah (x. 1-17; cf. Gen. ix. 28)." },
  { t = "v", n = 1, text = "And in the third week of this jubilee the unclean demons began to lead astray †the children of† the sons of Noah; and to make to err and destroy them." },
  { t = "v", n = 2, text = "And the sons of Noah came to Noah their father, and they told him concerning the demons which were, leading astray and blinding and slaying his sons' sons." },
  { t = "v", n = 3, indent = 1, text = "And he prayed before the Lord his God, and said: God of the spirits of all flesh, who hast shown mercy unto me," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And hast saved me and my sons from the waters of the flood," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And hast not caused me to perish as Thou didst the sons of perdition; For Thy grace hath been great towards me," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And great hath been Thy mercy to my soul;" },
  { t = "v", n = 3, indent = 1, cont = true, text = "Let Thy grace be lift up upon my sons," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And let not wicked spirits rule over them" },
  { t = "v", n = 3, indent = 1, cont = true, text = "Lest they should destroy them from the earth." },
  { t = "v", n = 4, text = "But do Thou bless me and my sons, that we may increase and multiply and replenish the earth." },
  { t = "v", n = 5, text = "And Thou knowest how Thy Watchers, the fathers of these spirits, acted in my day: and as for these spirits which are living, imprison them and hold them fast in the place of condemnation, and let them not bring destruction on the sons of thy servant, my God; for these are malignant, and created in order to destroy." },
  { t = "v", n = 6, text = "And let them not rule over the spirits of the living; for Thou alone canst exercise dominion over them. And let them not have power over the sons of the righteous from henceforth and for evermore.\"" },
  { t = "v", n = 7, text = "And the Lord our God bade us to bind all." },
  { t = "v", n = 8, text = "And the chief of the spirits, Mastêmâ, came and said: \"Lord, Creator, let some of them remain before me, and let them hearken to my voice, and do all that I shall say unto them; for if some of them are not left to me, I shall not be able to execute the power of my will on the sons of men; for these are for corruption and leading astray before my judgment, for great is the wickedness of the sons of men.\"" },
  { t = "v", n = 9, text = "And He said: \"Let the tenth part of them remain before him, and let nine parts descend into the place of condemnation.\"" },
  { t = "v", n = 10, text = "And one of us He commanded that we should teach Noah all their medicines; for He knew that they would not walk in uprightness, nor strive in righteousness." },
  { t = "v", n = 11, text = "And we did according to all His words: all the malignant evil ones we bound in the place of condemnation, and a tenth part of them we left that they might be subject before Satan on the earth." },
  { t = "v", n = 12, text = "And we explained to Noah all the medicines of their diseases, together with their seductions, how he might heal them with herbs of the earth." },
  { t = "v", n = 13, text = "And Noah wrote down all things in a book as we instructed him concerning every kind of medicine. Thus the evil spirits were precluded from (hurting) the sons of Noah." },
  { t = "v", n = 14, text = "And he gave all that he had written to Shem, his eldest son; for he loved him exceedingly above all his sons." },
  { t = "v", n = 15, text = "And Noah slept with his fathers, and was buried on Mount Lûbâr in the land of Ararat." },
  { t = "v", n = 16, text = "Nine hundred and fifty years he completed in his life, nineteen jubilees and two weeks and five years." },
  { t = "v", n = 17, text = "And in his life on earth he excelled the children of men save Enoch because of the righteousness, wherein he was perfect. For Enoch's office was ordained for a testimony to the generations of the world, so that he should recount all the deeds of generation unto generation, till the day of judgment." },
  { t = "h", level = 3, text = "The Tower of Babel and the Confusion of Tongues (x. 18-27; cf. Gen. xi. 1-9)." },
  { t = "v", n = 18, text = "And in the three and thirtieth jubilee, in the first year in the second week, Peleg took to himself a wife, whose name was Lômnâ the daughter of Sînâ’ar, and she bare him a son in the fourth year of this week, and he called his name Reu; for he said: \"Behold the children of men have become evil through the wicked purpose of building for themselves a city and a tower in the land of Shinar.\"" },
  { t = "v", n = 19, text = "For they departed from the land of Ararat eastward to Shinar; for in his days they built the city and the tower, saying, \"Go to, let us ascend thereby into heaven.\"" },
  { t = "v", n = 20, text = "And they began to build, and in the fourth week they made brick with fire, and the bricks served them for stone, and the clay with which they cemented them together was asphalt which cometh out of the sea, and out of the fountains of water in the land of Shinar." },
  { t = "v", n = 21, text = "And they built it: forty and three years were they building it; its breadth was 203 bricks, and the height (of a brick) was the third of one; its height amounted to 5433 cubits and 2 palms, and (the extent of one wall was) thirteen stades (and of the other thirty stades)." },
  { t = "v", n = 22, text = "And the Lord our God said unto us: \"Behold, they are one people, and (this) they begin to do, and now nothing will be withholden from them. Go to, let us go down and confound their language, that they may not understand one another's speech, and they may be dispersed into cities and nations, and one purpose will no longer abide with them till the day of judgment.\"" },
  { t = "v", n = 23, text = "And the Lord descended, and we descended with Him to see the city and the tower which the children of men had built." },
  { t = "v", n = 24, text = "And He confounded their language, and they no longer understood one another's speech, and they ceased then to build the city and the tower." },
  { t = "v", n = 25, text = "For this reason the whole land of Shinar is called Babel, because the Lord did there confound all the language of the children of men, and from thence they were dispersed into their cities, each according to his language and his nation." },
  { t = "v", n = 26, text = "And the Lord sent a mighty wind against the tower and overthrew it upon the earth, and behold it was between Asshur and Babylon in the land of Shinar, and they called its name \"Overthrow.\"" },
  { t = "v", n = 27, text = "In the fourth week in the first year in the beginning thereof in the four and thirtieth jubilee, were they dispersed from the land of Shinar." },
  { t = "h", level = 3, text = "The Children of Noah enter their Districts Canaan seizes Palestine wrongfully; Madai receives Media (x. 28-36)" },
  { t = "v", n = 28, text = "And Ham and his sons went into the land which he was to occupy, which he acquired as his portion in the land of the south." },
  { t = "v", n = 29, text = "And Canaan saw the land of Lebanon to the river of Egypt that it was very good, and he went not into the land of his inheritance to the west (that is to) the sea, and he dwelt in the land of Lebanon, eastward and westward from the border of Jordan and from the border of the sea." },
  { t = "v", n = 30, text = "And Ham, his father, and Cush and Mizraim, his brothers, said unto him: \"Thou hast settled in a land which. is not thine, and which did not fall to us by lot: do not do so; for if thou dost do so, thou and thy sons will fall in the land and (be) accursed through sedition; for by sedition ye have settled, and by sedition will thy children fall, and thou shalt be rooted out for ever." },
  { t = "v", n = 31, text = "Dwell not in the dwelling of Shem; for to Shem and to his sons did it come by their lot." },
  { t = "v", n = 32, text = "Cursed art thou, and cursed shalt thou be beyond all the sons of Noah, by the curse by which we bound ourselves by an oath in the presence of the holy judge, and in the presence of Noah our father.\"" },
  { t = "v", n = 33, text = "But he did not hearken unto them, and dwelt in the land of Lebanon from Hamath to the entering of Egypt, he and his sons until this day." },
  { t = "v", n = 34, text = "And for this reason that land is named Canaan." },
  { t = "v", n = 35, text = "And Japheth and his sons went towards the sea and dwelt in the land of their portion, and Madai saw the land of the sea and it did not please him, and he begged a (portion) from Elam and Asshur and Arpachshad, his wife's brother, and he dwelt in the land of Media, near to his wife's brother until this day." },
  { t = "v", n = 36, text = "And he called his dwelling-place, and the dwelling-place of his sons, Media, after the name of their father Madai." },
]

[[section]]
id = "11"
title = "Chapter 11"
level = 1
blocks = [
  { t = "h", level = 3, text = "The History of the Patriarchs from Reu to Abraham (cf. Gen. xi, 20-30); the Corruption of the Human Race (xi. 1-15)." },
  { t = "v", n = 1, text = "And in the thirty-fifth jubilee, in the third week, in the first year thereof, Reu took to himself a wife, and her name was ’Ôrâ, the daughter of ’Ûr, the son of Kêsêd, and she bare him a son, and he called his name Sêrôḫ, in the seventh year of this week in this jubilee." },
  { t = "v", n = 2, text = "And the sons of Noah began to war on each other, to take captive and to slay each other, and to shed the blood of men on the earth, and to eat blood, and to build strong cities, and walls, and towers, and individuals (began) to exalt themselves above the nation, and to found the beginnings of kingdoms, and to go to war people against people, and nation against nation, and city against city, and all (began) to do evil, and to acquire arms, and to teach their sons war, and they began to capture cities, and to sell male and female slaves." },
  { t = "v", n = 3, text = "And ’Ûr, the son of Kêsêd, built the city of ’Arâ of the Chaldees, and called its name after his own name and the name of his father." },
  { t = "v", n = 4, text = "And they made for themselves molten images, and they worshipped each the idol, the molten image which they had made for themselves, and they began to make graven images and unclean simulacra, and malignant spirits assisted and seduced (them) into committing transgression and uncleanness." },
  { t = "v", n = 5, text = "And the prince Mastêmâ exerted himself to do all this, and he sent forth other spirits, those which were put under his hand, to do all manner of wrong and sin, and all manner of transgression, to corrupt and destroy, and to shed blood upon the earth." },
  { t = "v", n = 6, text = "For this reason he called the name of Sêrôḫ, Serug, for every one turned to do all manner of sin and transgression." },
  { t = "v", n = 7, text = "And he grew up, and dwelt in Ur of the Chaldees, near to the father of his wife's mother, and he worshipped idols, and he took to himself a wife in the thirty-sixth jubilee, in the fifth week, in the first year thereof, and her name was Mêlkâ, the daughter of Kâbêr, the daughter of his father's brother." },
  { t = "v", n = 8, text = "And she bare him Nahor, in the first year of this week, and he grew and dwelt in Ur of the Chaldees, and his father taught him the researches of the Chaldees to divine and augur, according to the signs of heaven." },
  { t = "v", n = 9, text = "And in the thirty-seventh jubilee, in the sixth week, in the first year thereof, he took to himself a wife, and her name was ’Îjâskâ, the daughter of Nêstâg of the Chaldees." },
  { t = "v", n = 10, text = "And she bare him Terah in the seventh year of this week." },
  { t = "v", n = 11, text = "And the prince Mastêmâ sent ravens and birds to devour the seed which was sown in the land, in order to destroy the land, and rob the children of men of their labours. Before they could plough in the seed, the ravens picked (it) from the surface of the ground." },
  { t = "v", n = 12, text = "And for this reason he called his name Terah, because the ravens and the birds reduced them to destitution and devoured their seed." },
  { t = "v", n = 13, text = "And the years began to be barren, owing to the birds, and they devoured all the fruit of the trees from the trees: it was only with great effort that they could save a little of all the fruit of the earth in their days." },
  { t = "v", n = 14, text = "And in this thirty-ninth jubilee, in the second week in the first year, Terah took to himself a wife, and her name was ’Êdnâ, the daughter of ’Abrâm the daughter of his father's sister." },
  { t = "v", n = 15, text = "And in the seventh year of this week she bare him a son, and he called his name Abram, by the name of the father of his mother; for he had died before his daughter had conceived a son." },
  { t = "h", level = 3, text = "Abram's Knowledge of God and wonderful Deeds (xi. 16-24)." },
  { t = "v", n = 16, text = "And the child began to understand the errors of the earth that all went astray after graven images and after uncleanness, and his father taught him writing, and he was two weeks of years old, and he separated himself from his father that he might not worship idols with him." },
  { t = "v", n = 17, text = "And he began to pray to the Creator of all things that He might save him from the errors of the children of men, and that his portion should not fall into error after uncleanness and vileness." },
  { t = "v", n = 18, text = "And the seed time came for the sowing of seed upon the land, and they all went forth together to protect their seed against the ravens, and Abram went forth with those that went, and the child was a lad of fourteen years." },
  { t = "v", n = 19, text = "And a cloud of ravens came to devour the seed, and Abram ran to meet them before they settled on the ground, and cried to them before they settled on the ground to devour the seed, and said, \"Descend not: return to the place whence ye came,\" and they proceeded to turn back." },
  { t = "v", n = 20, text = "And he caused the clouds of ravens to turn back that day seventy times, and of all the ravens throughout all the land where Abram was there settled there not so much as one." },
  { t = "v", n = 21, text = "And all who were with him throughout all the land saw him cry out, and all the ravens turn back, and his name became great in all the land of the Chaldees." },
  { t = "v", n = 22, text = "And there came to him this year all those that wished to sow, and he went with them until the time of sowing ceased: and they sowed their land, and that year they brought enough grain home and ate and were satisfied." },
  { t = "v", n = 23, text = "And in the first year of the fifth week Abram taught those who made implements for oxen, the artificers in wood, and they made a vessel above the ground, facing the frame of the plough, in order to put the seed thereon, and the seed fell down therefrom upon the share of the plough, and was hidden in the earth, and they no longer feared the ravens." },
  { t = "v", n = 24, text = "And after this manner they made (vessels) above the ground on all the frames of the ploughs, and they sowed and tilled all the land, according as Abram commanded them, and they no longer feared the birds." },
]

[[section]]
id = "12"
title = "Chapter 12"
level = 1
blocks = [
  { t = "h", level = 3, text = "Abram seeks to convert Terah from Idolatry; the Family of Terah (cf. Gen. xi. 27-30). Abram burns the Idols. Death of Haran (cf. Gen. xi. 28) (xii. 1-14)." },
  { t = "v", n = 1, text = "And it came to pass in the sixth week, in the seventh year thereof, that Abram said to Terah his father, saying, \"Father!\" And he said, \"Behold, here am I, my son.\"" },
  { t = "v", n = 2, indent = 1, text = "And he said, \"What help and profit have we from those idols which thou dost worship," },
  { t = "v", n = 2, indent = 1, cont = true, text = "And before which thou dost bow thyself?" },
  { t = "v", n = 3, indent = 1, text = "For there is no spirit in them," },
  { t = "v", n = 3, indent = 1, cont = true, text = "For they are dumb forms, and a misleading of the heart." },
  { t = "v", n = 3, indent = 1, cont = true, text = "Worship them not:" },
  { t = "v", n = 4, indent = 1, text = "Worship the God of heaven," },
  { t = "v", n = 4, indent = 1, cont = true, text = "Who causeth the rain and the dew to descend on the earth," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And doeth everything upon the earth, And hath created everything by His word," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And all life is from before His face." },
  { t = "v", n = 5, indent = 1, text = "Why do ye worship things that have no spirit in them?" },
  { t = "v", n = 5, indent = 1, cont = true, text = "For they are the work of (men's) hands, And on your shoulders do ye bear them," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And ye have no help from them, But they are a great cause of shame to those who make them," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And a misleading of the heart to those who worship them:" },
  { t = "v", n = 5, indent = 1, cont = true, text = "Worship them not.\"" },
  { t = "v", n = 6, text = "And his father said unto him, \"I also know it, my son, but what shall I do with a people who have made me to serve before them?" },
  { t = "v", n = 7, text = "And if I tell them the truth, they will slay me; for their soul cleaveth to them to worship them and honour them. Keep silent, my son, lest they slay thee.\"" },
  { t = "v", n = 8, text = "And these words he spake to his two brothers, and they were angry with him and he kept silent." },
  { t = "v", n = 9, text = "And in the fortieth jubilee, in the second week, in the seventh year thereof, Abram took to himself a wife, and her name was Sarai, the daughter of his father, and she became his wife." },
  { t = "v", n = 10, text = "And Haran, his brother, took to himself a wife in the third year of the third week, and she bare him a son in the seventh year of this week and he called his name Lot." },
  { t = "v", n = 11, text = "And Nahor, his brother, took to himself a wife." },
  { t = "v", n = 12, text = "And in the sixtieth year of the life of Abram, that is, in the fourth week, in the fourth year thereof, Abram arose by night, and burned the house of the idols, and he burned all that was in the house, and no man knew it." },
  { t = "v", n = 13, text = "And they arose in the night and sought to save their gods from the midst of the fire." },
  { t = "v", n = 14, text = "And Haran hasted to save them, but the fire flamed over him, and he was burnt in the fire, and he died in Ur of the Chaldees before Terah his father, and they buried him in Ur of the Chaldees." },
  { t = "h", level = 3, text = "The Family of Terah in Haran; Abram's Experiences there; his Journey to Canaan (xii. 15-31; cf. Gen. xi, 31-xii. 3)." },
  { t = "v", n = 15, text = "And Terah went forth from Ur of the Chaldees, he and his sons, to go into the land of Lebanon and into the land of Canaan, and he dwelt in the land of Haran, and Abram, dwelt with Terah his father in Haran two weeks of years." },
  { t = "v", n = 16, text = "And in the sixth week, in the fifth year thereof, Abram sat up throughout the night on the new moon of the seventh month to observe the stars from the evening to the morning, in order to see what would be the character of the year with regard to the rains, and he was alone as he sat and observed." },
  { t = "v", n = 17, text = "And a word came into his heart and he said: \"All the signs of the stars, and the signs of the moon and of the sun are all in the hand of the Lord. Why do I search (them) out?" },
  { t = "v", n = 18, indent = 1, text = "If He desireth, He causeth it to rain, morning and evening;" },
  { t = "v", n = 18, indent = 1, cont = true, text = "And if He desireth, He withholdeth it, And all things are in His hand.\"" },
  { t = "v", n = 19, indent = 1, text = "And he prayed that night and said" },
  { t = "v", n = 19, indent = 1, cont = true, text = "\"My God, God Most High, Thou alone art my God," },
  { t = "v", n = 19, indent = 1, cont = true, text = "And Thee and Thy dominion have I chosen." },
  { t = "v", n = 19, indent = 1, cont = true, text = "And Thou hast created all things," },
  { t = "v", n = 19, indent = 1, cont = true, text = "And all things that are are the work of Thy hands." },
  { t = "v", n = 20, indent = 1, text = "Deliver me from the hands of evil spirits who have sway over the thoughts of men's hearts," },
  { t = "v", n = 20, indent = 1, cont = true, text = "And let them not lead me astray from Thee, my God." },
  { t = "v", n = 20, indent = 1, cont = true, text = "And stablish Thou me and my seed for ever" },
  { t = "v", n = 20, indent = 1, cont = true, text = "That we go not astray from henceforth and for evermore.\"" },
  { t = "v", n = 21, text = "And he said Shall I return unto Ur of the Chaldees who seek my face that I may return to them, or am I to remain here in this place? The right path before Thee prosper it in the hands of Thy servant that he may fulfil (it) and that I may not walk in the deceitfulness of my heart, O my God.\"" },
  { t = "v", n = 22, text = "And he made an end of speaking and praying, and behold the word of the Lord was sent to him through me, saying: \"Get thee up from thy country, and from thy kindred and from the house of thy father unto a land which I shall show thee, and I shall make thee a great and numerous nation." },
  { t = "v", n = 23, indent = 1, text = "And I shall bless thee" },
  { t = "v", n = 23, indent = 1, cont = true, text = "And I shall make thy name great, And thou wilt be blessed in the earth," },
  { t = "v", n = 23, indent = 1, cont = true, text = "And in thee will all families of the earth be blessed, And I shall bless them that bless thee," },
  { t = "v", n = 23, indent = 1, cont = true, text = "And curse them that curse thee." },
  { t = "v", n = 24, text = "And I shall be a God to thee and thy son, and to thy son's son, and to all thy seed: fear not, from henceforth and unto all generations of the earth I am thy God.\"" },
  { t = "v", n = 25, text = "And the Lord God said: \"Open his mouth and his ears, that he may hear and speak with his mouth, with the language which hath been revealed\"; for it had ceased from the mouths of all the children of men from the day of the overthrow (of Babel)." },
  { t = "v", n = 26, text = "And I opened his mouth, and his ears and his lips, and I began to speak with him in Hebrew in the tongue of the creation." },
  { t = "v", n = 27, text = "And he took the books of his fathers, and these were written in Hebrew and he transcribed them, and he began from henceforth to study them, and I made known to him that which he could not (understand), and he studied them during the six rainy months." },
  { t = "v", n = 28, text = "And it came to pass in the seventh year of the sixth week that he spoke to his father, and informed him that he would leave Haran to go into the land of Canaan to see it and return to him." },
  { t = "v", n = 29, indent = 1, text = "And Terah his father said unto him; \"Go in peace: May the eternal God make thy path straight," },
  { t = "v", n = 29, indent = 1, cont = true, text = "And the Lord [(be) with thee, and] protect thee from all evil," },
  { t = "v", n = 29, indent = 1, cont = true, text = "And grant unto thee grace, mercy and favour before those who see thee," },
  { t = "v", n = 29, indent = 1, cont = true, text = "And may none of the children of men have power over thee to harm thee;" },
  { t = "v", n = 29, indent = 1, cont = true, text = "Go in peace." },
  { t = "v", n = 30, text = "And if thou seest a land pleasant to thy eyes to dwell in, then arise and take me to thee and take Lot with thee, the son of Haran thy brother, as thine own son: the Lord be with thee." },
  { t = "v", n = 31, text = "And Nahor thy brother leave with me till thou returnest in peace, and we go with thee all together.\"" },
]

[[section]]
id = "13"
title = "Chapter 13"
level = 1
blocks = [
  { t = "h", level = 3, text = "Abram with Lot in Canaan and Egypt (cf. Gen. xii. 4-20). Abram separates from Lot (cf. Gen. xiii. 11-18) (xiii. 1-21)." },
  { t = "v", n = 1, text = "And Abram journeyed from Haran, and he took Sarai, his wife, and Lot his brother Haran's son, to the land of Canaan, and he came into †Asshur†, and proceeded to Shechem, and dwelt near a lofty oak." },
  { t = "v", n = 2, text = "And he saw, and, behold, the land was very pleasant from the entering of Hamath to the lofty oak. ." },
  { t = "v", n = 3, text = "And the Lord said to him: \"To thee and to thy seed will I give this land.\"" },
  { t = "v", n = 4, text = "And he built an altar there, and he offered thereon a burnt sacrifice to the Lord, who had appeared to him." },
  { t = "v", n = 5, text = "And he removed from thence unto the mountain . . . Bethel on the west and Ai on the east, and pitched his tent there." },
  { t = "v", n = 6, text = "And he saw and behold, the land was very wide and good, and everything grew thereon—vines and figs and pomegranates, oaks and ilexes, and terebinths and oil trees, and cedars and cypresses and date trees, and all trees of the field, and there was water on the mountains." },
  { t = "v", n = 7, text = "And he blessed the Lord who had led him out of Ur of the Chaldees, and had brought him to this land." },
  { t = "v", n = 8, text = "And it came to pass in the first year, in the seventh week, on the new moon of the first month, that he built an altar on this mountain, and called on the name of the Lord: \"Thou, the eternal God, art my God.\"" },
  { t = "v", n = 9, text = "And he offered on the altar a burnt sacrifice unto the Lord that He should be with him and not forsake him all the days of his life." },
  { t = "v", n = 10, text = "And he removed from thence and went towards the south, and he came to Hebron, and Hebron was built at, that time, and he dwelt there two years, and he went (thence) into the land of the south, to Bealoth and there was a famine in the land." },
  { t = "v", n = 11, text = "And Abram went into Egypt in the third year of the week, and he dwelt in Egypt five years before his wife was torn away from him." },
  { t = "v", n = 12, text = "NOW Tanais in Egypt was at that time built—seven years after Hebron." },
  { t = "v", n = 13, text = "And it came to pass when Pharaoh seized Sarai, the wife of Abram, that the Lord plagued Pharaoh and his house with great plagues because of Sarai, Abram's wife." },
  { t = "v", n = 14, text = "And Abram was very glorious by reason of possessions in sheep, and cattle, and asses, and horses, and camels, and menservants, and maidservants, and in silver and gold exceedingly. And Lot also, his brother's son, was wealthy." },
  { t = "v", n = 15, text = "And Pharaoh gave back Sarai, the wife of Abram, and he sent him out of the land of Egypt, and he journeyed to the place where he had pitched his tent at the beginning, to the place of the altar, with Ai on the east, and Bethel on the west, and he blessed the Lord his God who had brought him back in peace." },
  { t = "v", n = 16, text = "And it came to pass in the forty-first jubilee, in the third year of the first week, that he returned to this place and offered thereon a burnt sacrifice, and called on the name of the Lord, and said: \"Thou, the most high God, art my God for ever and ever.\"" },
  { t = "v", n = 17, text = "And in the fourth year of this week Lot parted from him, and Lot dwelt in Sodom, and the men of Sodom were sinners exceedingly." },
  { t = "v", n = 18, text = "And it grieved him in his heart that his brother's son had parted from him; for he had no children." },
  { t = "v", n = 19, text = "In that year when Lot was taken captive, the Lord said unto Abram, after that Lot had parted from him, in the fourth year of this week: \"Lift up thine eyes from the place where thou art dwelling, northward and southward, and westward and eastward." },
  { t = "v", n = 20, text = "For all the land which thou seest I shall give to thee and to thy seed for ever, and I shall make thy seed as the sand of the sea: though a man may number the dust of the earth, yet thy seed shall not be numbered." },
  { t = "v", n = 21, text = "Arise, walk (through the land) in the length of it and the breadth of it, and see it all; for to thy seed shall I give it.\" And Abram went to Hebron, and dwelt there." },
  { t = "h", level = 3, text = "The Campaign of Chedorlaomer (xiii. 22-29; cf. Gen. xiv.)." },
  { t = "v", n = 22, text = "And in this year came Chedorlaomer, king of Elam, and Amraphel, king of Shinar, and Arioch, king of Sêllâsar and Têrgâl, king of nations, and slew the king of Gomorrah, and the king of Sodom fled, and many fell through wounds in the vale of Siddim, by the Salt Sea." },
  { t = "v", n = 23, text = "And they took captive Sodom and Adam and Zeboim, and they took captive Lot also, the son of Abram's brother, and all his possessions, and they went to Dan." },
  { t = "v", n = 24, text = "And one who had escaped came and told Abram that his brother's son had been taken captive and (Abram) armed his household servants. 25 . . . . . . . . . . . . . for" },
  { t = "v", n = 25, text = "Abram, and for his seed, a tenth of the first-fruits to the Lord, and the Lord ordained it as an ordinance for ever that they should give it to the priests who served before Him, that they should possess it for ever." },
  { t = "v", n = 26, text = "And to this law there is no limit of days; for He hath ordained it for the generations for ever that they should give to the Lord the tenth of everything, of the seed and of the wine and of the oil and of the cattle and of the sheep." },
  { t = "v", n = 27, text = "And He gave (it) unto His priests to eat and to drink with joy before Him." },
  { t = "v", n = 28, text = "And the king of Sodom came to him and bowed himself before him, and said: \"Our Lord Abram, give unto us the souls which thou hast rescued, but let the booty be thine.\"" },
  { t = "v", n = 29, text = "And Abram said unto him: \"I lift up my hands to the Most High God, that from a thread to a shoe-latchet I shall not take aught that is thine, lest thou shouldst say I have made Abram rich; save only what the young men have eaten, and the portion of the men who went with me—Aner, Eschol, and Mamre. These will take their portion.\"" },
]

[[section]]
id = "14"
title = "Chapter 14"
level = 1
blocks = [
  { t = "h", level = 3, text = "God's Covenant with Abram (xiv. 1-20; cf. Gen. xv.)." },
  { t = "v", n = 1, text = "After these things, in the fourth year of this week, on the new moon of the third month, the word of the Lord came to Abram in a dream, saying: \"Fear not, Abram; I am thy defender, and thy reward will be exceeding great.\"" },
  { t = "v", n = 2, text = "And he said: \"Lord, Lord, what wilt thou give me, seeing I go hence childless, and the son of Mâsêq, the son of my handmaid, is the Dammasek Eliezer: he will be my heir, and to me thou hast given no seed.\"" },
  { t = "v", n = 3, text = "And He said unto him: \"This (man) will not be thy heir, but one that will come out of thine own bowels; he will be thine heir.\"" },
  { t = "v", n = 4, text = "And He brought him forth abroad, and said unto him: \"Look toward heaven and number the stars, if thou art able to number them.\"" },
  { t = "v", n = 5, text = "And he looked toward heaven, and beheld the stars. And He said unto him: \"So shall thy seed be.\"" },
  { t = "v", n = 6, text = "And he believed in the Lord, and it was counted to him for righteousness." },
  { t = "v", n = 7, text = "And He said unto him: \"I am the Lord that brought thee out of Ur of the Chaldees, to give thee the land of the Canaanites to possess it for ever; and I shall be God unto thee and to thy seed after thee.\"" },
  { t = "v", n = 8, text = "And he said: \"Lord, Lord, whereby shall I know that I shall inherit (it)?\"" },
  { t = "v", n = 9, text = "And he said unto him: \"Take Me an heifer of three years, and a goat of three years, and a sheep of three years, and a turtle-dove, and a pigeon.\"" },
  { t = "v", n = 10, text = "And he took all these in the middle of the month; and he dwelt at the oak of Mamre, which is near Hebron." },
  { t = "v", n = 11, text = "And he built there an altar, and sacrificed all these; and he poured their blood upon the altar, and divided them in the midst, and laid them over against each other; but the birds divided he not." },
  { t = "v", n = 12, text = "And birds came down upon the pieces, and Abram drove them away, and did not suffer the birds to touch them." },
  { t = "v", n = 13, text = "And it came to pass, when the sun had set, that an ecstasy fell upon Abram, and lo! an horror of great darkness fell upon him, and it was said unto Abram: \"Know of a surety that thy seed shall be a stranger in a land (that is) not theirs, and they will bring them into bondage, and afflict them four hundred years." },
  { t = "v", n = 14, text = "And the nation also to whom they will be in bondage shall I judge, and after that they will come forth thence with much substance." },
  { t = "v", n = 15, text = "And thou wilt go to thy fathers in peace, and be buried in a good old age." },
  { t = "v", n = 16, text = "But in the fourth generation they will return hither; for the iniquity of the Amorites is not yet full.\"" },
  { t = "v", n = 17, text = "And he awoke from his sleep, and he arose, and the sun had set; and there was a flame, and behold! a furnace was smoking, and a flame of fire passed between the pieces." },
  { t = "v", n = 18, text = "And on that day the Lord made a covenant with Abram, saying: \"To thy seed will I give this land, from the river of Egypt unto the great river, the river Euphrates, the Kenites, the Kenizzites, the Kadmonites, the Perizzites, and the Rephaim, the Phakorites, and the Hivites, and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.\"" },
  { t = "v", n = 19, text = "And the day passed, and Abram offered the pieces, and the birds, and their fruit-offerings, and their drink-offerings, and the fire devoured them." },
  { t = "v", n = 20, text = "And on that day we made a covenant with Abram, according as we had covenanted with Noah in this month; and Abram renewed the festival and ordinance for himself for ever." },
  { t = "h", level = 3, text = "The Birth of Ishmael (xiv. 21-24; cf. Gen. xvi. 1-4. 11)." },
  { t = "v", n = 21, text = "And Abram rejoiced, and made all these things known to Sarai his wife; and he believed that he would have seed, but she did not bear." },
  { t = "v", n = 22, text = "And Sarai advised her husband Abram, and said unto him: \"Go in unto Hagar, my Egyptian maid: it may be that I shall build up seed unto thee by her.\"" },
  { t = "v", n = 23, text = "And Abram hearkened unto the voice of Sarai his wife, and said unto her, \"Do (so).\" And Sarai took Hagar, her maid, the Egyptian, and gave her to Abram, her husband, to be his wife." },
  { t = "v", n = 24, text = "And he went in unto her, and she conceived and bare him a son, and he called his name Ishmael, in the fifth year of this week; and this was the eighty-sixth year in the life of Abram." },
]

[[section]]
id = "15"
title = "Chapter 15"
level = 1
blocks = [
  { t = "h", level = 3, text = "The Feast of First-fruits Circumcision instituted. The Promise of Isaac's Birth. Circumcision ordained for all Israel (xv. 1-34; cf. Gen. xvii.)." },
  { t = "v", n = 1, text = "And in the fifth year of the †fourth† week of this jubilee, in the third month, in the middle of the month, Abram celebrated the feast of the first-fruits of the grain harvest." },
  { t = "v", n = 2, text = "And he offered new offerings on the altar, the first-fruits of the produce, unto the Lord, an heifer and a goat and a sheep on the altar as a burnt sacrifice unto the Lord; their fruit-offerings and their drink-offerings he offered upon the altar with frankincense." },
  { t = "v", n = 3, text = "And the Lord appeared to Abram, and said unto him: \"I am God Almighty; approve thyself before Me and be thou perfect." },
  { t = "v", n = 4, text = "And I will make My covenant between Me and thee, and I will multiply thee exceedingly.\"" },
  { t = "v", n = 5, text = "And Abram fell on his face, and God talked with him, and said:" },
  { t = "v", n = 6, indent = 1, text = "\"Behold My ordinance is with thee," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And thou wilt be the father of many nations." },
  { t = "v", n = 7, indent = 1, text = "Neither will thy name any more be called Abram," },
  { t = "v", n = 7, indent = 1, cont = true, text = "But thy name from henceforth, even for ever, shall be Abraham." },
  { t = "v", n = 7, indent = 1, cont = true, text = "For the father of many nations have I made thee." },
  { t = "v", n = 8, indent = 1, text = "And I shall make thee very great," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And I shall make thee into nations," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And kings will come forth from thee." },
  { t = "v", n = 9, text = "And I shall establish My covenant between Me and thee, and thy seed after thee, throughout their generations, for an eternal covenant, so that I may be a God unto thee, and to thy seed after thee." },
  { t = "v", n = 10, text = "(And I shall give to thee and to thy seed after thee) the land where thou hast been a sojourner, the land of Canaan, that thou mayst possess it for ever, and I shall be their God.\"" },
  { t = "v", n = 11, text = "And the Lord said unto Abraham: \"And as for thee, do thou keep My Covenant, thou and thy seed after thee, and circumcise ye every male among you, and circumcise your foreskins, and it will be a token of an eternal covenant between Me and you." },
  { t = "v", n = 12, text = "And the child on the eighth day ye will circumcise, every male throughout your generations, him that is born in the house, or whom ye have bought with money from any stranger, whom ye have acquired who is not of thy seed." },
  { t = "v", n = 13, text = "He that is born in thy house will surely be circumcised, and those whom thou hast bought with money will be circumcised, and My covenant will be in your flesh for an eternal ordinance." },
  { t = "v", n = 14, text = "And the uncircumcised male who is not circumcised in the flesh of his foreskin on the eighth day, that soul will be cut off from his people, for he hath broken My covenant.\"" },
  { t = "v", n = 15, text = "And God said unto Abraham: \"As for Sarai thy wife, her name will no more be called Sarai, but Sarah will be her name." },
  { t = "v", n = 16, text = "And I shall bless her, and give thee a son by her, and I shall bless him, and he will become a nation, and kings of nations will proceed from him.\"" },
  { t = "v", n = 17, text = "And Abraham fell on his face, and rejoiced, and said in his heart: \"Shall a son be born to him that is a hundred years old, and shall Sarah, who is ninety years old, bring forth?\"" },
  { t = "v", n = 18, text = "And Abraham said unto God: \"O that Ishmael might live before thee!\"" },
  { t = "v", n = 19, text = "And God said: \"Yea, and Sarah also will bear thee a son, and thou wilt call his name Isaac, and I shall establish My covenant with him, an everlasting covenant, and for his seed after him." },
  { t = "v", n = 20, text = "And as for Ishmael also have I heard thee, and behold I shall bless him, and make him great, and multiply him exceedingly, and he will beget twelve princes, and I shall make him a great nation." },
  { t = "v", n = 21, text = "But My covenant shall I establish with Isaac, whom Sarah will bear to thee, in these days, in the next year.\"" },
  { t = "v", n = 22, text = "And He left off speaking with him, and God went up from Abraham." },
  { t = "v", n = 23, text = "And Abraham did according as God had said unto him, and he took Ishmael his son, and all that were born in his house, and whom he had bought with his money, every male in his house, and circumcised the flesh of their foreskin." },
  { t = "v", n = 24, text = "And on the selfsame day was Abraham circumcised, and all the men of his house, (and those born in the house), and all those, whom he had bought with money from the children of the stranger, were circumcised with him." },
  { t = "v", n = 25, text = "This law is for all the generations for ever, and there is no circumcision of the days, and no omission of one day out of the eight days; for it is an eternal ordinance, ordained and written on the heavenly tables." },
  { t = "v", n = 26, text = "And every one that is born, the flesh of whose foreskin is not circumcised on the eighth day, belongeth not to the children of the covenant which the Lord made with Abraham, but to the children of destruction; nor is there, moreover, any sign on him that he is the Lord's, but (he is destined) to be destroyed and slain from the earth, and to be rooted out of the earth, for he hath broken the covenant of the Lord our God." },
  { t = "v", n = 27, text = "For all the angels of the presence and all the angels of sanctification have been so created from the day of their creation, and before the angels of the presence and the angels of sanctification He hath sanctified Israel, that they should be with Him and with His holy angels." },
  { t = "v", n = 28, text = "And do thou command the children of Israel and let them observe the sign of this covenant for their generations as an eternal ordinance, and they will not be rooted out of the land." },
  { t = "v", n = 29, text = "For the command is ordained for a covenant, that they should observe it for ever among all the children of Israel." },
  { t = "v", n = 30, text = "For Ishmael and his sons and his brothers and Esau, the Lord did not cause to approach Him, and he chose them not because they are the children of Abraham, because He knew them, but He chose Israel to be His people." },
  { t = "v", n = 31, text = "And He sanctified it, and gathered it from amongst all the children of men; for there are many nations and many peoples, and all are His, and over all hath He placed spirits in authority to lead them astray from Him." },
  { t = "v", n = 32, text = "But over Israel He did not appoint any angel or spirit, for He alone is their ruler, and He will preserve them and require them at the hand of His angels and His spirits, and at the hand of all His powers in order that He may preserve them and bless them, and that they may be His and He may be theirs from henceforth for ever." },
  { t = "v", n = 33, text = "And now I announce unto thee that the children of Israel will not keep true to this ordinance, and they will not circumcise their sons according to all this law; for in the flesh of their circumcision they will omit this circumcision of their sons, and all of them, sons of Beliar, will leave their sons uncircumcised as they were born." },
  { t = "v", n = 34, text = "And there will be great wrath from the Lord against the children of Israel, because they have forsaken His covenant and turned aside from His word, and provoked and blasphemed, inasmuch as they do not observe the ordinance of this law; for they have treated their members like the Gentiles, so that they may be removed and rooted out of the land. And there will no more be pardon or forgiveness unto them [so that there should be forgiveness and pardon] for all the sin of this eternal error." },
]

[[section]]
id = "16"
title = "Chapter 16"
level = 1
blocks = [
  { t = "h", level = 3, text = "Angelic Visitation of Abraham in Hebron; Promise of Isaac's Birth repeated. The Destruction of Sodom and Lot's Deliverance (xvi. 1-9; cf. Gen. xviii.-xix.)." },
  { t = "v", n = 1, text = "And on the new moon of the fourth month we appeared unto Abraham, at the oak of Mamre, and we talked with him, and we announced to him that a son would be given to him by Sarah his wife." },
  { t = "v", n = 2, text = "And Sarah laughed, for she heard that we had spoken these words with Abraham, and we admonished her, and she became afraid, and denied that she had laughed on account of the words." },
  { t = "v", n = 3, text = "And we told her the name of her son, as his name is ordained and written in the heavenly tables (*i.e.*) Isaac." },
  { t = "v", n = 4, text = "And (that) when we returned to her at a set time, she would have conceived a son." },
  { t = "v", n = 5, text = "And in this month the Lord executed his judgments on Sodom, and Gomorrah, and Zeboim, and all the region of the Jordan, and He burned them with fire and brimstone, and destroyed them until this day, even as [lo] I have declared unto thee all their works, that they are wicked and sinners exceedingly, and that they defile themselves and commit fornication in their flesh, and work uncleanness on the earth." },
  { t = "v", n = 6, text = "And, in like manner, God will execute judgment on the places where they have done according to the uncleanness of the Sodomites, like unto the judgment of Sodom." },
  { t = "v", n = 7, text = "But Lot we saved; for God remembered Abraham, and sent him out from the midst of the overthrow." },
  { t = "v", n = 8, text = "And he and his daughters committed sin upon the earth, such as had not been on the earth since the days of Adam till his time; for the man lay with his daughters." },
  { t = "v", n = 9, text = "And, behold, it was commanded and engraven concerning all his seed, on the heavenly tables, to remove them and root them out, and to execute judgment upon them like the judgment of Sodom, and to leave no seed of the man on earth on the day of condemnation." },
  { t = "h", level = 3, text = "Abraham at Beersheba. Birth and Circumcision of Isaac (cf. Gen. xxi. 1-4). Institution of the Feast of Tabernacles (xvi. 10-31)." },
  { t = "v", n = 10, text = "And in this month Abraham moved from Hebron, and departed and dwelt between Kadesh and Shur in the mountains of Gerar." },
  { t = "v", n = 11, text = "And in the middle of the fifth month he moved from thence, and dwelt at the Well of the Oath." },
  { t = "v", n = 12, text = "And in the middle of the sixth month the Lord visited Sarah and did unto her as He had spoken, and she conceived." },
  { t = "v", n = 13, text = "And she bare a son in the third month, and in the middle of the month, at the time of which the Lord had spoken to Abraham, on the festival of the first-fruits of the harvest, Isaac was born." },
  { t = "v", n = 14, text = "And Abraham circumcised his son on the eighth day: he was the first that was circumcised according to the covenant which is ordained for ever." },
  { t = "v", n = 15, text = "And in the sixth year of the †fourth† week we came to Abraham, to the Well of the Oath, and we appeared unto him [as we had told Sarah that we should return to her, and she would have conceived a son." },
  { t = "v", n = 16, text = "And we returned in the seventh month, and found Sarah with child before us] and we blessed him, and we announced to him all the things which had been decreed concerning him, that he should not die till he should beget six sons more, and should see (them) before he died; but (that) in Isaac should his name and seed be called:" },
  { t = "v", n = 17, text = "And (that) all the seed of his sons should be Gentiles, and be reckoned with the Gentiles; but from the sons of Isaac one should become a holy seed, and should not be reckoned among the Gentiles." },
  { t = "v", n = 18, text = "For he should become the portion of the Most High, and all his seed had fallen into the possession of God, that it should be unto the Lord a people for (His) possession above all nations and that it should become a kingdom and priests and a holy nation." },
  { t = "v", n = 19, text = "And we went our way, and we announced to Sarah all that we had told him, and they both rejoiced with exceeding great joy." },
  { t = "v", n = 20, text = "And he built there an altar to the Lord who had delivered him, and who was making him rejoice in the land of his sojourning, and he celebrated a festival of joy in this month seven days, near the altar which he had built at the Well of the Oath." },
  { t = "v", n = 21, text = "And he built booths for himself and for his servants on this festival, and he was the first to celebrate the feast of tabernacles on the earth." },
  { t = "v", n = 22, text = "And during these seven days he brought each day to the altar a burnt-offering to the Lord, two oxen, two rams, seven sheep, one he-goat, for a sin-offering, that he might atone thereby for himself and for his seed." },
  { t = "v", n = 23, text = "And, as a thank-offering, seven rams, seven kids, seven sheep, and seven he-goats, and their fruit-offerings and their drink-offerings; and he burnt all the fat thereof on the altar, a chosen offering unto the Lord for a sweet smelling savour." },
  { t = "v", n = 24, text = "And morning and evening he burnt fragrant substances, frankincense and galbanum, and stacte, and nard, and myrrh, and spice, and costum; all these seven he offered, crushed, mixed together in equal parts (and) pure." },
  { t = "v", n = 25, text = "And he celebrated this feast during seven days, rejoicing with all his heart and with all his soul, he and all those who were in his house; and there was no stranger with him, nor any that was uncircumcised." },
  { t = "v", n = 26, text = "And he blessed his Creator who had created him in his generation, for He had created him according to His good pleasure; for He knew and perceived that from him would arise the plant of righteousness for the eternal generations, and from him a holy seed, so that it should become like Him who had made all things." },
  { t = "v", n = 27, text = "And he blessed and rejoiced, and he called the name of this festival the festival of the Lord, a joy acceptable to the Most High God." },
  { t = "v", n = 28, text = "And we blessed him for ever, and all his seed after him throughout all the generations of the earth, because he celebrated this festival in its season, according to the testimony of the heavenly tables." },
  { t = "v", n = 29, text = "For this reason it is ordained on the heavenly tables concerning Israel, that they shall celebrate the feast of tabernacles seven days with joy, in the seventh month, acceptable before the Lord—a statute for ever throughout their generations every year." },
  { t = "v", n = 30, text = "And to this there is no limit of days; for it is ordained for ever regarding Israel that they should celebrate it and dwell in booths, and set wreaths upon their heads, and take leafy boughs, and willows from the brook." },
  { t = "v", n = 31, text = "And Abraham took branches of palm trees, and the fruit of goodly trees, and every day going round the altar with the branches seven times [a day] in the morning, he praised and gave thanks to his God for all things in joy." },
]

[[section]]
id = "17"
title = "Chapter 17"
level = 1
blocks = [
  { t = "h", level = 3, text = "The Expulsion of Hagar and Ishmael (xvii. 1-14; cf. Gen. xxi. 8-21)." },
  { t = "v", n = 1, text = "And in the first year of the †fifth† week Isaac was weaned in this jubilee, and Abraham made a great banquet in the third month, on the day his son Isaac was weaned." },
  { t = "v", n = 2, text = "And Ishmael, the son of Hagar, the Egyptian, was before the face of Abraham, his father, in his place, and Abraham rejoiced and blessed God because he had seen his sons" },
  { t = "v", n = 3, text = "and had not died childless. . And he remembered the words which He had spoken to him on the day on which Lot had parted from him, and he rejoiced because the Lord had given him seed upon the earth to inherit the earth, and he blessed with all his mouth the Creator of all things." },
  { t = "v", n = 4, text = "And Sarah saw Ishmael playing and dancing and Abraham rejoicing with great joy, and she became jealous of Ishmael and said to Abraham, \"Cast out this bondwoman and her son; for the son of this bondwoman will not be heir with my son, Isaac.\"" },
  { t = "v", n = 5, text = "And the thing was grievous in Abraham's sight, because of his maidservant and because of his son, that he should drive them from him." },
  { t = "v", n = 6, text = "And God said to Abraham \"Let it not be grievous in thy sight, because of the child and because of the bondwoman; in all that Sarah hath said unto thee, hearken to her words and do (them); for in Isaac shall thy name and seed be called." },
  { t = "v", n = 7, text = "But as for the son of this bondwoman I will make him a great nation, because he is of thy seed.\"" },
  { t = "v", n = 8, text = "And Abraham rose up early in the morning and took bread and a bottle of water, and placed them on the shoulders of Hagar and the child, and sent her away." },
  { t = "v", n = 9, text = "And she departed and wandered in the wilderness of Beersheba, and the water in the bottle was spent, and the child thirsted, and was not able to go on, and fell down." },
  { t = "v", n = 10, text = "And his mother took him and cast him under an olive tree, and went and sat her down over against him, at the distance of a bow-shot; for she said, \"Let me not see the death of my child,\" and as she sat she wept." },
  { t = "v", n = 11, text = "And an angel of God, one of the holy ones, said unto her, \"Why weepest thou, Hagar? Arise, take the child, and hold him in thine hand; for God hath heard thy voice, and hath seen the child.\"" },
  { t = "v", n = 12, text = "And she opened her eyes, and she saw a well of water, and she went and filled her bottle with water, and she gave her child to drink, and she arose and went towards the wilderness of Paran." },
  { t = "v", n = 13, text = "And the child grew and became an archer, and God was with him; and his mother took him a wife from among the daughters of Egypt." },
  { t = "v", n = 14, text = "And she bare him a son, and he called his name Nebaioth; for she said, \"The Lord was nigh to me when I called upon him.\"" },
  { t = "h", level = 3, text = "Mastêmâ proposes to God that Abraham shall be put to the Proof (xvi. 15-18)." },
  { t = "v", n = 15, text = "And it came to pass in the seventh week, in the first year thereof, in the first month in this jubilee, on the twelfth of this month, there were voices in heaven regarding Abraham, that he was faithful in all that He told him, and that he loved the Lord, and that in every affliction he was faithful." },
  { t = "v", n = 16, text = "And the prince Mastêmâ came and said before God, \"Behold, Abraham loveth Isaac his son, and he delighteth in him above all things else; bid him offer him as a burnt-offering on the altar, and Thou wilt see if he will do this command, and Thou wilt know if he is faithful in everything wherein Thou dost try him." },
  { t = "v", n = 17, text = "And the Lord knew that Abraham was faithful in all his afflictions; for He had tried him through his country and with famine, and had tried him with the wealth of kings, and had tried him again through his wife, when she was torn (from him), and with circumcision, and had tried him through Ishmael and Hagar, his maid-servant, when he sent them away." },
  { t = "v", n = 18, text = "And in everything wherein He had tried him, he was found faithful, and his soul was not impatient, and he was not slow to act; for he was faithful and a lover of the Lord." },
]

[[section]]
id = "18"
title = "Chapter 18"
level = 1
blocks = [
  { t = "h", level = 3, text = "The Sacrifice of Isaac: Abraham returns to Beersheba (xviii. 1-19; Cf. Gen. xxii. 1-19)." },
  { t = "v", n = 1, text = "And God said to him, \"Abraham, Abraham\"; and he said, \"Behold, (here) am I.\"." },
  { t = "v", n = 2, text = "And He said, \"Take thy beloved son whom thou lovest, (even) Isaac, and go unto the high country, and offer him on one of the mountains which I will point out unto thee.\"" },
  { t = "v", n = 3, text = "And he rose early in the morning and saddled his ass, and took his two young men with him, and Isaac his son, and clave the wood of the burnt-offering, and he went to the place on the third day, and he saw the place afar off." },
  { t = "v", n = 4, text = "And he came to a well of water, and he said to his young men, \"Abide ye here with the ass, and I and the lad shall go (yonder), and when we have worshipped we shall come again to you.\"" },
  { t = "v", n = 5, text = "And he took the wood of the burnt-offering and laid it on Isaac his son, and he took in his hand the fire and the knife, and they went both of them together to that place." },
  { t = "v", n = 6, text = "And Isaac said to his father, \"Father\"; and he said, \"Here am I, my son.\" And he said unto him, \"Behold the fire, and the knife, and the wood; but where is the sheep for the burnt-offering, father?\"" },
  { t = "v", n = 7, text = "And he said, \"God will provide for himself a sheep for a burnt-offering, my son.\" And he drew near to the place of the mount of God." },
  { t = "v", n = 8, text = "And he built an altar, and he placed the wood on the altar, and bound Isaac his son, and placed him on the wood which was upon the altar, and stretched forth his hand to take the knife to slay Isaac his son." },
  { t = "v", n = 9, text = "And I stood before him, and before the prince of the Mastêmâ, and the Lord said, \"Bid him not to lay his hand on the lad, nor to do anything to him, for I have shown that he feareth the Lord.\"" },
  { t = "v", n = 10, text = "And I called to him from heaven, and said unto him: \"Abraham, Abraham\"; and he was terrified and said: \"Behold, (here) am I.\"" },
  { t = "v", n = 11, text = "And I said unto him: \"Lay not thy hand upon the lad, neither do thou anything to him; for now I have shown that thou fearest the Lord, and hast not withheld thy son, thy first-born son, from me.\"" },
  { t = "v", n = 12, text = "And the prince of the Mastêmâ was put to shame; and Abraham lifted up his eyes and looked, and, behold, a single ram caught . . . by his horns, and Abraham went and took the ram and offered it for a burnt-offering in the stead of his son." },
  { t = "v", n = 13, text = "And Abraham called that place \"The Lord hath seen,\" so that it is said \"(in the mount) the Lord hath seen\": that is Mount Sion." },
  { t = "v", n = 14, text = "And the Lord called Abraham by his name a second time from heaven, as he caused us to appear to speak to him in the name of the Lord." },
  { t = "v", n = 15, indent = 1, text = "And He said: \"By Myself have I sworn, saith the Lord," },
  { t = "v", n = 15, indent = 1, cont = true, text = "Because thou hast done this thing," },
  { t = "v", n = 15, indent = 1, cont = true, text = "And hast not withheld thy son, thy beloved son, from Me, That in blessing I shall bless thee" },
  { t = "v", n = 15, indent = 1, cont = true, text = "And in multiplying I shall multiply thy seed As the stars of heaven," },
  { t = "v", n = 15, indent = 1, cont = true, text = "And as the sand which is on the seashore. And thy seed will inherit the cities of its enemies," },
  { t = "v", n = 16, indent = 1, text = "And in thy seed will all nations of the earth be blessed; Because thou hast obeyed My voice," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And I have shown to all that thou art faithful unto Me in all that I have said unto thee:" },
  { t = "v", n = 16, indent = 1, cont = true, text = "Go in peace.\"" },
  { t = "v", n = 17, text = "And Abraham went to his young men, and they arose and went together to Beersheba, and Abraham dwelt by the Well of the Oath." },
  { t = "v", n = 18, text = "And he celebrated this festival every year, seven days with joy, and he called it the festival of the Lord according to the seven days during which he went and returned in peace." },
  { t = "v", n = 19, text = "And accordingly hath it been ordained and written on the heavenly tables regarding Israel and its seed that they should observe this festival seven days with the joy of festival." },
]

[[section]]
id = "19"
title = "Chapter 19"
level = 1
blocks = [
  { t = "h", level = 3, text = "The Death and Burial of Sarah (xix. 1-9; cf. Gen. xxiii.)." },
  { t = "v", n = 1, text = "And in the first year of the first week in the forty-second jubilee, Abraham returned and dwelt opposite Hebron, that is Kirjath Arba, two weeks of years." },
  { t = "v", n = 2, text = "And in the first year of the †third† week of this jubilee the days of the life of Sarah were accomplished, and she died in Hebron." },
  { t = "v", n = 3, text = "And Abraham went to mourn over her and bury her, and we tried him [to see] if his spirit were patient and he were not indignant in the words of his mouth; and he was found patient in this, and was not disturbed." },
  { t = "v", n = 4, text = "For in patience of spirit he conversed with the children of Heth, to the intent that they should give him a place in which to bury his dead." },
  { t = "v", n = 5, text = "And the Lord gave him grace before all who saw him, and he besought in gentleness the sons of Heth, and they gave him the land of the double cave over against Mamre, that is Hebron, for four hundred pieces of silver." },
  { t = "v", n = 6, text = "And they besought him, saying, \"We shall give it to thee for nothing\"; but he would not take it from their hands for nothing, for he gave the price of the place, the money in full, and he bowed down before them twice; and after this he buried his dead in the double cave." },
  { t = "v", n = 7, text = "And all the days of the life of Sarah were one hundred and twenty-seven years, that is, two jubilees and four weeks and one year: these are the days of the years of the life of Sarah." },
  { t = "v", n = 8, text = "This is the tenth trial wherewith Abraham was tried, and he was found faithful, patient in spirit." },
  { t = "v", n = 9, text = "And he said not a single word regarding the rumour in the land how that God had said that He would give it to him and to his seed after him, and he begged a place there to bury his dead; for he was found faithful, and was recorded on the heavenly tables as the friend of God." },
  { t = "h", level = 3, text = "Marriage of Isaac and second Marriage of Abraham (cf. Gen. xxiv. 15, xxv. 1-4); the Birth of Esau and Jacob (cf. Gen. xxv. 19 ff.) (xix. 10-14)." },
  { t = "v", n = 10, text = "And in the fourth year thereof he took a wife for his son Isaac and her name was Rebecca [the daughter of Bethuel, the son of Nahor, the brother of Abraham] the sister of Laban and daughter of Bethuel; and Bethuel was the son of Mêlcâ, who was the wife of Nahor, the brother of Abraham." },
  { t = "v", n = 11, text = "And Abraham took to himself a third wife, and her name was Keturah, from among the daughters of his household servants, for Hagar had died before Sarah." },
  { t = "v", n = 12, text = "And she bare him six sons, Zimram, and Jokshan, and Medan, and Midian, and Ishbak, and Shuah, in the two weeks of years." },
  { t = "v", n = 13, text = "And in the sixth week, in the second year thereof, Rebecca bare to Isaac two sons, Jacob and Esau, and Jacob was a smooth and upright man, and Esau was fierce, a man of the field, and hairy, and Jacob dwelt in tents." },
  { t = "v", n = 14, text = "And the youths grew, and Jacob learned to write; but Esau did not learn, for he was a man of the field and a hunter, and he learnt war, and all his deeds were fierce." },
  { t = "h", level = 3, text = "Abraham loves Jacob and blesses him (xix. 15-31)." },
  { t = "v", n = 15, text = "And Abraham loved Jacob, but Isaac loved Esau." },
  { t = "v", n = 16, text = "And Abraham saw the deeds of Esau, and he knew that in Jacob should his name and seed be called; and he called Rebecca and gave commandment regarding Jacob, for he knew that she (too) loved Jacob much more than Esau." },
  { t = "v", n = 17, indent = 1, text = "And he said unto her: \"My daughter, watch over my son Jacob, For he shall be in my stead on the earth," },
  { t = "v", n = 17, indent = 1, cont = true, text = "And for a blessing in the midst of the children of men," },
  { t = "v", n = 17, indent = 1, cont = true, text = "And for the glory of the whole seed of Shem." },
  { t = "v", n = 18, text = "For I know that the Lord will choose him to be a people for possession unto Himself, above all peoples that are upon the face of the earth." },
  { t = "v", n = 19, text = "And behold, Isaac my son loveth Esau more than Jacob, but I see that thou truly lovest Jacob." },
  { t = "v", n = 20, indent = 1, text = "Add still further to thy kindness to him," },
  { t = "v", n = 20, indent = 1, cont = true, text = "And let thine eyes be upon him in love;" },
  { t = "v", n = 20, indent = 1, cont = true, text = "For he will be a blessing unto us on the earth from henceforth unto all generations of the earth." },
  { t = "v", n = 21, indent = 1, text = "Let thy hands be strong" },
  { t = "v", n = 21, indent = 1, cont = true, text = "And let thy heart rejoice in thy son Jacob;" },
  { t = "v", n = 21, indent = 1, cont = true, text = "For I have loved him far beyond all my sons. He will be blessed for ever," },
  { t = "v", n = 21, indent = 1, cont = true, text = "And his seed will fill the whole earth." },
  { t = "v", n = 22, indent = 1, text = "If a man can number the sand of the earth," },
  { t = "v", n = 22, indent = 1, cont = true, text = "His seed also will be numbered." },
  { t = "v", n = 23, text = "And all the blessings wherewith the Lord hath blessed me and my seed shall belong to Jacob and his seed alway." },
  { t = "v", n = 24, text = "And in his seed shall my name be blessed, and the name of my fathers, Shem, and Noah, and Enoch, and Mahalalel, and Enos, and Seth, and Adam." },
  { t = "v", n = 25, indent = 1, text = "And these shall serve To lay the foundations of the heaven," },
  { t = "v", n = 25, indent = 1, cont = true, text = "And to strengthen the earth," },
  { t = "v", n = 25, indent = 1, cont = true, text = "And to renew all the luminaries which are in the firmament.\"" },
  { t = "v", n = 26, text = "And he called Jacob before the eyes of Rebecca his mother, and kissed him, and blessed him, and said:" },
  { t = "v", n = 27, text = "\"Jacob, my beloved son, whom my soul loveth, may God bless thee from above the firmament, and may He give thee all the blessings wherewith He blessed Adam, and Enoch, and Noah, and Shem; and all the things of which He told me, and all the things which He promised to give me, may He cause to cleave to thee and to thy seed for ever, according to the days of heaven above the earth." },
  { t = "v", n = 28, text = "And the spirits of Mastêmâ shall not rule over thee or over thy seed to turn thee from the Lord, who is thy God from henceforth for ever." },
  { t = "v", n = 29, text = "And may the Lord God be a father to thee and thou the first-born son, and to the people alway. Go in peace, my son.\"" },
  { t = "v", n = 30, text = "And they both went forth together from Abraham." },
  { t = "v", n = 31, text = "And Rebecca loved Jacob, with all her heart and with all her soul, very much more than Esau; but Isaac loved Esau much more than Jacob." },
]

[[section]]
id = "20"
title = "Chapter 20"
level = 1
blocks = [
  { t = "h", level = 3, text = "Abraham's Last Words to his Children and Grandchildren (xx. i-ii)." },
  { t = "v", n = 1, text = "And in the forty-second jubilee, in the first year of the †seventh† week, Abraham called Ishmael, and his twelve sons, and Isaac and his two sons, and the six sons of Keturah, and their sons." },
  { t = "v", n = 2, text = "And he commanded them that they should observe the way of the Lord; that they should work righteousness, and love each his neighbour, and act on this manner amongst all men; that they should each so walk with regard to them as to do judgment and righteousness on the earth." },
  { t = "v", n = 3, text = "That they should circumcise their sons, according to the covenant which He had made with them, and not deviate to the right hand or the left of all the paths which the Lord had commanded us; and that we should keep ourselves from all fornication and uncleanness, [and renounce from amongst us all fornication and uncleanness]." },
  { t = "v", n = 4, text = "And if any woman or maid commit fornication amongst you, burn her with fire, and let them not commit fornication with her after their eyes and their heart; and let them not take to themselves wives from the daughters of Canaan; for the seed of Canaan will be rooted out of the land." },
  { t = "v", n = 5, text = "And he told them of the judgment of the giants, and the judgment of the Sodomites, how they had been judged on account of their wickedness, and had died on account of their fornication, and uncleanness, and mutual corruption through fornication." },
  { t = "v", n = 6, indent = 1, text = "\"And guard yourselves from all fornication and uncleanness," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And from all pollution of sin," },
  { t = "v", n = 6, indent = 1, cont = true, text = "Lest ye make our name a curse," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And your whole life a hissing," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And all your sons be destroyed by the sword," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And ye become accursed like Sodom," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And all your remnant as the sons of Gomorrah." },
  { t = "v", n = 7, indent = 1, text = "I implore you, my sons, love the God of heaven," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And cleave ye to all His commandments." },
  { t = "v", n = 7, indent = 1, cont = true, text = "And walk not after their idols, and after their uncleannesses," },
  { t = "v", n = 8, indent = 1, text = "And make not for yourselves molten or graven gods;" },
  { t = "v", n = 8, indent = 1, cont = true, text = "For they are vanity," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And there is no spirit in them;" },
  { t = "v", n = 8, indent = 1, cont = true, text = "For they are work of (men's) hands," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And all who trust in them, trust in nothing." },
  { t = "v", n = 8, indent = 1, cont = true, text = "Serve them not, nor worship them," },
  { t = "v", n = 9, indent = 1, text = "But serve ye the Most High God, and worship Him continually:" },
  { t = "v", n = 9, indent = 1, cont = true, text = "And hope for His countenance always," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And work uprightness and righteousness before Him," },
  { t = "v", n = 9, indent = 1, cont = true, text = "That He may have pleasure in you and grant you His mercy," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And send rain upon you morning and evening," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And bless all your works which ye have wrought upon the earth," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And bless thy bread and thy water," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And bless the fruit of thy womb and the fruit of thy land," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And the herds of thy cattle, and the flocks of thy sheep." },
  { t = "v", n = 10, indent = 1, text = "And ye will be for a blessing on the earth," },
  { t = "v", n = 10, indent = 1, cont = true, text = "And all nations of the earth will desire you," },
  { t = "v", n = 10, indent = 1, cont = true, text = "And bless your sons in my name," },
  { t = "v", n = 10, indent = 1, cont = true, text = "That they may be blessed as I am.\"" },
  { t = "v", n = 11, text = "And he gave to Ishmael and to his sons, and to the sons of Keturah, gifts, and sent them away from Isaac his son, and he gave everything to Isaac his son." },
  { t = "h", level = 3, text = "The Dwelling-places of the Ishmaelites and of the Sons of Keturah (xx. 12-13)." },
  { t = "v", n = 12, text = "And Ishmael and his sons, and the sons of Keturah and their sons, went together and dwelt from Paran to the entering in of Babylon in all the land which is towards the East facing the desert." },
  { t = "v", n = 13, text = "And these mingled with each other, and their name was called Arabs, and Ishmaelites." },
]

[[section]]
id = "21"
title = "Chapter 21"
level = 1
blocks = [
  { t = "h", level = 3, text = "Abraham's Last Words to Isaac (xxi. 1-25)." },
  { t = "v", n = 1, text = "And in the sixth year of the †seventh† week of this jubilee Abraham called Isaac his son, and commanded him, saying: \"I am become old, and. know not the day of my death, and am full of my days." },
  { t = "v", n = 2, text = "And behold, I am one hundred and seventy-five years old, and throughout all the days of my life I have remembered the Lord, and sought with all my heart to do His will, and to walk uprightly in all His ways." },
  { t = "v", n = 3, text = "My soul hath hated idols, (and I have despised those that served them, and I have given my heart and spirit) that I might observe to do the will of Him who created me." },
  { t = "v", n = 4, text = "For He is the living God, and He is holy and faithful, and He is righteous beyond all, and there is with Him no accepting of (men's) persons and no accepting of gifts; for God is righteous, and executeth judgment on all those who transgress His commandments and despise His covenant." },
  { t = "v", n = 5, text = "And do thou, my son, observe His commandments and His ordinances and His judgments, and walk not after the abominations and after the graven images and after the molten images." },
  { t = "v", n = 6, text = "And eat no blood at all of animals or cattle, or of any bird which flieth in the heaven." },
  { t = "v", n = 7, text = "And if thou dost slay a victim as an acceptable peace-offering, slay ye it, and pour out its blood upon the altar, and all the fat of the offering offer on the altar with fine flour (and the meat-offering) mingled with oil, with its drink-offering—offer them all together on the altar of burnt-offering; it is a sweet savour before the Lord." },
  { t = "v", n = 8, text = "And thou wilt offer the fat of the sacrifice of thank-offerings on the fire which is upon the altar, and the fat which is on the belly, and all the fat on the inwards and the two kidneys, and all the fat that is upon them, and upon the loins and liver thou shalt remove together with the kidneys." },
  { t = "v", n = 9, text = "And offer all these for a sweet savour acceptable before the Lord, with its meat-offering and with its drink-offering, for a sweet savour, the bread of the offering unto the Lord," },
  { t = "v", n = 10, text = "And eat its meat on that day and on the second day, and let not the sun on the second day go down upon it till it is eaten, and let nothing be left over for the third day; for it is not acceptable [for it is not approved] and let it no longer be eaten, and all who eat thereof will bring sin upon themselves; for thus I have found it written in the books of my forefathers, and in the words of Enoch, and in the words of Noah." },
  { t = "v", n = 11, text = "And on all thy oblations thou shalt strew salt, and let not the salt of the covenant be lacking in all thy oblations before the Lord." },
  { t = "v", n = 12, text = "And as regards the wood of the sacrifices, beware lest thou bring (other) wood for the altar in addition to these: cypress, dêfrân, sagâd, pine, fir, cedar, savin, palm, olive, myrrh, laurel, and citron, juniper, and balsam." },
  { t = "v", n = 13, text = "And of these kinds of wood lay upon the altar under the sacrifice, such as have been tested as to their appearance, and do not lay (thereon) any split or dark wood, (but) hard and clean, without fault, a sound and new growth; and do not lay (thereon) old wood, [for its fragrance is gone] for there is no longer fragrance in it as before." },
  { t = "v", n = 14, text = "Besides these kinds of wood there is none other that thou shalt place (on the altar), for the fragrance is dispersed, and the smell of its fragrance goeth not up to heaven." },
  { t = "v", n = 15, text = "Observe this commandment and do it, my son, that thou mayst be upright in all thy deeds." },
  { t = "v", n = 16, text = "And at all times be clean in thy body, and wash thyself with water before thou approachest to offer on the altar, and wash thy hands and thy feet before thou drawest near to the altar; and when thou art done sacrificing, wash again thy hands and thy feet." },
  { t = "v", n = 17, text = "And let no blood appear upon you nor upon your clothes; be on thy guard, my son, against blood, be on thy guard exceedingly; cover it with dust." },
  { t = "v", n = 18, text = "And do not eat any blood, for it is the soul; eat no blood whatever." },
  { t = "v", n = 19, text = "And take no gifts for the blood of man, lest it be shed with impunity, without judgment; for it is the blood that is shed that causeth the earth to sin, and the earth cannot be cleansed from the blood of man save by the blood of him who shed it." },
  { t = "v", n = 20, text = "And take no present or gift for the blood of man: blood for blood, that thou mayest be accepted before the Lord, the Most High God; for He is the defence of the good: and that thou mayest be preserved from all evil, and that He may save thee from every kind of death.." },
  { t = "v", n = 21, indent = 1, text = "I see, my son," },
  { t = "v", n = 21, indent = 1, cont = true, text = "That all the works of the children of men are sin and wickedness," },
  { t = "v", n = 21, indent = 1, cont = true, text = "And all their deeds are uncleanness and an abomination and a pollution," },
  { t = "v", n = 21, indent = 1, cont = true, text = "And there is no righteousness with them." },
  { t = "v", n = 22, indent = 1, text = "Beware, lest thou shouldest walk in their ways" },
  { t = "v", n = 22, indent = 1, cont = true, text = "And tread in their paths," },
  { t = "v", n = 22, indent = 1, cont = true, text = "And sin a sin unto death before the Most High God." },
  { t = "v", n = 22, indent = 1, cont = true, text = "Else He will [hide His face from thee," },
  { t = "v", n = 22, indent = 1, cont = true, text = "And] give thee back into the hands of thy transgression," },
  { t = "v", n = 22, indent = 1, cont = true, text = "And root thee out of the land, and thy seed likewise from under heaven," },
  { t = "v", n = 22, indent = 1, cont = true, text = "And thy name and thy seed will perish from the whole earth." },
  { t = "v", n = 23, indent = 1, text = "Turn away from all their deeds and all their uncleanness," },
  { t = "v", n = 23, indent = 1, cont = true, text = "And observe the ordinance of the Most High God," },
  { t = "v", n = 23, indent = 1, cont = true, text = "And do His will and be upright in all things." },
  { t = "v", n = 24, indent = 1, text = "And He will bless thee in all thy deeds," },
  { t = "v", n = 24, indent = 1, cont = true, text = "And will raise up from thee the plant of righteousness through all the earth, throughout all generations of the earth," },
  { t = "v", n = 24, indent = 1, cont = true, text = "And my name and thy name will not be forgotten under heaven for ever." },
  { t = "v", n = 25, indent = 1, text = "Go, my son, in peace." },
  { t = "v", n = 25, indent = 1, cont = true, text = "May the Most High God, my God and thy God, strengthen thee to do His will," },
  { t = "v", n = 25, indent = 1, cont = true, text = "And may He bless all thy seed and the residue of thy seed for the generations for ever, with all righteous blessings," },
  { t = "v", n = 25, indent = 1, cont = true, text = "That thou mayest be a blessing on all the earth.\"" },
  { t = "v", n = 26, text = "And he went out from him rejoicing." },
]

[[section]]
id = "22"
title = "Chapter 22"
level = 1
blocks = [
  { t = "h", level = 3, text = "Isaac, Ishmael and Jacob join in Festival with Abraham for the Last Time. Abraham's Prayer (xxii. 1-9)." },
  { t = "v", n = 1, text = "And it came to pass in the †first† week in the †forty-fourth† jubilee, in the †second† year, that is, the year in which Abraham died, that Isaac and Ishmael came from the Well of the Oath to celebrate the feast of weeks—that is, the feast of the first-fruits of the harvest—to Abraham, their father, and Abraham rejoiced because his two sons had come." },
  { t = "v", n = 2, text = "For Isaac had many possessions in Beersheba, and Isaac was wont to go and see his possessions and to return to his father." },
  { t = "v", n = 3, text = "And in those days Ishmael came to see his father, and they both came together, and Isaac offered a sacrifice for a burnt-offering, and presented it on the altar of his father which he had made in Hebron." },
  { t = "v", n = 4, text = "And he offered a thank-offering and made a feast of joy before Ishmael, his brother: and Rebecca made new cakes from the new grain, and gave them to Jacob, her son, to take them to Abraham, his father, from the first-fruits of the land, that he might eat and bless the Creator of all things before he died." },
  { t = "v", n = 5, text = "And Isaac, too, sent by the hand of Jacob to Abraham a best thank-offering, that he might eat and drink." },
  { t = "v", n = 6, indent = 1, text = "And he ate and drank, and blessed the Most High God, Who hath created heaven and earth," },
  { t = "v", n = 6, indent = 1, cont = true, text = "Who hath made all the fat things of the earth," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And given them to the children of men" },
  { t = "v", n = 6, indent = 1, cont = true, text = "That they might eat and drink and bless their Creator." },
  { t = "v", n = 7, text = "\"And now I give thanks unto Thee, my God, because Thou hast caused me to see this day: behold, I am one hundred three score and fifteen years, an old man and full of days, and all my days have been unto me peace." },
  { t = "v", n = 8, text = "The sword of the adversary hath not overcome me in all that Thou hast given me and my children all the days of my life until this day." },
  { t = "v", n = 9, text = "My God, may Thy mercy and Thy peace be upon Thy servant, and upon the seed of his sons, that they may be to Thee a chosen nation and an inheritance from amongst all the nations of the earth from henceforth unto all the days of the generations of the earth, unto all the ages.\"" },
  { t = "h", level = 3, text = "Abraham's Last Words to and Blessings of Jacob (xxii. 10-30)." },
  { t = "v", n = 10, text = "And he called Jacob and said My son Jacob, may the God of all bless thee and strengthen thee to do righteousness, and His will before Him, and may He choose thee and thy seed that ye may become a people for His inheritance according to His will alway. And do thou, my son, Jacob, draw near and kiss me.\"" },
  { t = "v", n = 11, indent = 1, text = "And he drew near and kissed him, and he said: \"Blessed be my son Jacob" },
  { t = "v", n = 11, indent = 1, cont = true, text = "And all the sons of God Most High, unto all the ages:" },
  { t = "v", n = 11, indent = 1, cont = true, text = "May God give unto thee a seed of righteousness;" },
  { t = "v", n = 11, indent = 1, cont = true, text = "And some of thy sons may He sanctify in the midst of the whole earth;" },
  { t = "v", n = 11, indent = 1, cont = true, text = "May nations serve thee, And all the nations bow themselves before thy seed." },
  { t = "v", n = 12, indent = 1, text = "Be strong in the presence of men," },
  { t = "v", n = 12, indent = 1, cont = true, text = "And exercise authority over all the seed of Seth." },
  { t = "v", n = 12, indent = 1, cont = true, text = "Then thy ways and the ways of thy sons will be justified," },
  { t = "v", n = 12, indent = 1, cont = true, text = "So that they shall become a holy nation." },
  { t = "v", n = 13, indent = 1, text = "May the Most High God give thee all the blessings" },
  { t = "v", n = 13, indent = 1, cont = true, text = "Wherewith he hath blessed me" },
  { t = "v", n = 13, indent = 1, cont = true, text = "And wherewith He blessed Noah and Adam;" },
  { t = "v", n = 13, indent = 1, cont = true, text = "May they rest on the sacred head of thy seed from generation to generation for ever." },
  { t = "v", n = 14, indent = 1, text = "And may He cleanse thee from all unrighteousness and impurity," },
  { t = "v", n = 14, indent = 1, cont = true, text = "That thou mayest be forgiven all (thy) transgressions; (and) thy sins of ignorance." },
  { t = "v", n = 14, indent = 1, cont = true, text = "And may He strengthen thee," },
  { t = "v", n = 14, indent = 1, cont = true, text = "And bless thee." },
  { t = "v", n = 14, indent = 1, cont = true, text = "And mayest thou inherit the whole earth," },
  { t = "v", n = 15, indent = 1, text = "And may He renew His covenant with thee," },
  { t = "v", n = 15, indent = 1, cont = true, text = "That thou mayest be to Him a nation for His inheritance for all the ages," },
  { t = "v", n = 15, indent = 1, cont = true, text = "And that He may be to thee and to thy seed a God in truth and righteousness throughout all the days of the earth." },
  { t = "v", n = 16, indent = 1, text = "And do thou, my son Jacob, remember my words," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And observe the commandments of Abraham, thy father:" },
  { t = "v", n = 16, indent = 1, cont = true, text = "Separate thyself from the nations," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And eat not with them:" },
  { t = "v", n = 16, indent = 1, cont = true, text = "And do not according to their works," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And become not their associate;" },
  { t = "v", n = 16, indent = 1, cont = true, text = "For their works are unclean, And all their ways are a pollution and an abomination and uncleanness." },
  { t = "v", n = 17, indent = 1, text = "They offer their sacrifices to the dead" },
  { t = "v", n = 17, indent = 1, cont = true, text = "And they worship evil spirits," },
  { t = "v", n = 17, indent = 1, cont = true, text = "And they eat over the graves," },
  { t = "v", n = 17, indent = 1, cont = true, text = "And all their works are vanity and nothingness." },
  { t = "v", n = 18, indent = 1, text = "They have no heart to understand" },
  { t = "v", n = 18, indent = 1, cont = true, text = "And their eyes do not see what their works are," },
  { t = "v", n = 18, indent = 1, cont = true, text = "And how they err in saying to a piece of wood: 'Thou art my God,'" },
  { t = "v", n = 18, indent = 1, cont = true, text = "And to a stone: 'Thou art my Lord and thou art my deliverer.'" },
  { t = "v", n = 18, indent = 1, cont = true, text = "[And they have no heart.]" },
  { t = "v", n = 19, indent = 1, text = "And as for thee, my son Jacob," },
  { t = "v", n = 19, indent = 1, cont = true, text = "May the Most High God help thee" },
  { t = "v", n = 19, indent = 1, cont = true, text = "And the God of heaven bless thee" },
  { t = "v", n = 19, indent = 1, cont = true, text = "And remove thee from their uncleanness and from all their error." },
  { t = "v", n = 20, indent = 1, text = "Be thou ware, my son Jacob, of taking a wife from any seed of the daughters of Canaan;" },
  { t = "v", n = 20, indent = 1, cont = true, text = "For all his seed is to be rooted out of the earth." },
  { t = "v", n = 21, indent = 1, text = "For, owing to the transgression of Ham, Canaan erred," },
  { t = "v", n = 21, indent = 1, cont = true, text = "And all his seed will be destroyed from off the earth and all the residue thereof," },
  { t = "v", n = 21, indent = 1, cont = true, text = "And none springing from him will be saved on the day of judgment." },
  { t = "v", n = 22, indent = 1, text = "And as for all the worshippers of idols and the profane" },
  { t = "v", n = 22, indent = 1, cont = true, text = "(*b*) There will be no hope for them in the land of the living; (*e*) And there will be no remembrance of them on the earth;" },
  { t = "v", n = 22, indent = 1, cont = true, text = "(*c*) For they will descend into Sheol," },
  { t = "v", n = 22, indent = 1, cont = true, text = "(*d*) And into the place of condemnation will they go," },
  { t = "v", n = 22, indent = 1, cont = true, text = "As the children of Sodom were taken away from the earth" },
  { t = "v", n = 22, indent = 1, cont = true, text = "So will all those who worship idols be taken away." },
  { t = "v", n = 23, indent = 1, text = "Fear not, my son Jacob," },
  { t = "v", n = 23, indent = 1, cont = true, text = "And be not dismayed, O son of Abraham:" },
  { t = "v", n = 23, indent = 1, cont = true, text = "May the Most High God preserve thee from destruction," },
  { t = "v", n = 23, indent = 1, cont = true, text = "And from all the paths of error may He deliver thee." },
  { t = "v", n = 24, text = "This house have I built for myself that I might put my name upon it in the earth: [it is given to thee and to thy seed for ever], and it will be named the house of Abraham; it is given to thee and to thy seed for ever; for thou wilt build my house and establish my name before God for ever: thy seed and thy name will stand throughout all generations of the earth.\"" },
  { t = "v", n = 25, text = "And he ceased commanding him and blessing him." },
  { t = "v", n = 26, text = "And the two lay together on one bed, and Jacob slept in the bosom of Abraham, his father's father and he kissed him seven times, and his affection and his heart rejoiced over him." },
  { t = "v", n = 27, text = "And he blessed him with all his heart and said: \"The Most High God, the God of all, and Creator of all, who brought me forth from Ur of the Chaldees, that He might give me this land to inherit it for ever, and that I might establish a holy seed—blessed be the Most High for ever.\"" },
  { t = "v", n = 28, text = "And he blessed Jacob and said: \"My son, over whom with all my heart and my affection I rejoice, may Thy grace and Thy mercy be lift up upon him and upon his seed alway." },
  { t = "v", n = 29, text = "And do not forsake him, nor set him at nought from henceforth unto the days of eternity, and may Thine eyes be opened upon him and upon his seed, that Thou mayest preserve him, and bless him, and mayest sanctify him as a nation for Thine inheritance;" },
  { t = "v", n = 30, text = "And bless him with all Thy blessings from henceforth unto all the days of eternity, and renew Thy covenant and Thy grace with him and with his seed according to all Thy good pleasure unto all the generations of the earth.\"" },
]

[[section]]
id = "23"
title = "Chapter 23"
level = 1
blocks = [
  { t = "h", level = 3, text = "The Death and Burial of Abraham (xxiii. 1-8; cf. Gen. xxv. 7-10)." },
  { t = "v", n = 1, text = "And he placed two fingers of Jacob on his eyes, and he blessed the God of gods, and he covered his face and stretched out his feet and slept the sleep of eternity, and was gathered to his fathers." },
  { t = "v", n = 2, text = "And notwithstanding all this Jacob was lying in his bosom, and knew not that Abraham, his father's father, was dead." },
  { t = "v", n = 3, text = "And Jacob awoke from his sleep, and behold Abraham was cold as ice, and he said: \"Father, father!\"; but there was none that spake, and he knew that he was dead." },
  { t = "v", n = 4, text = "And he arose from his bosom and ran and told Rebecca, his mother; and Rebecca went to Isaac in the night and told him; and they went together, and Jacob with them, and a lamp was in his hand, and when they had gone in they found Abraham lying dead." },
  { t = "v", n = 5, text = "And Isaac fell on the face of his father, and wept and kissed him." },
  { t = "v", n = 6, text = "And the voices were heard in the house of Abraham, and Ishmael his son arose, and went to Abraham his father, and wept over Abraham his father, he and all the house of Abraham, and they wept with a great weeping." },
  { t = "v", n = 7, text = "And his sons Isaac and Ishmael buried him in the double cave, near Sarah his wife, and they wept for him forty days, all the men of his house, and Isaac and Ishmael, and all their sons, and all the sons of Keturah in their places, and the days of weeping for Abraham were ended." },
  { t = "v", n = 8, text = "And he lived three jubilees and four weeks of years, one hundred and seventy-five years, and completed the days of his life, being old and full of days." },
  { t = "h", level = 3, text = "The decreasing Years and increasing Corruption of Mankind (xxiii. 9-17)." },
  { t = "v", n = 9, text = "For the days of the forefathers, of their life, were nineteen jubilees; and after the Flood they began to grow less than nineteen jubilees, and to decrease in jubilees, and to grow old quickly, and to be full of their days by reason of manifold tribulation and the wickedness of their ways, with the exception of Abraham." },
  { t = "v", n = 10, text = "For Abraham was perfect in all his deeds with the Lord, and well-pleasing in righteousness all the days of his life; and behold, he did not complete four jubilees in his life, when he had grown old by reason of the wickedness and was full of his days." },
  { t = "v", n = 11, text = "And all the generations which will arise from this time until the day of the great judgment will grow old quickly, before they complete two jubilees, and their knowledge will forsake them by reason of their old age [and all their knowledge will vanish away]." },
  { t = "v", n = 12, text = "And in those days, if a man live a jubilee and a half of years, they will say regarding him: \"He hath lived long, and the greater part of his days are pain and sorrow and tribulation, and there is no peace:" },
  { t = "v", n = 13, text = "For calamity followeth on calamity, and wound on wound, and tribulation on tribulation, and evil tidings on evil tidings, and illness on illness, and all evil judgments such as these, one with another, illness and overthrow, and snow and frost and ice, and fever, and chills, and torpor, and famine, and death, and sword, and captivity, and all kinds of calamities and pains.\"" },
  { t = "v", n = 14, text = "And all these will come on an evil generation, which transgresseth on the earth: their works are uncleanness and fornication, and pollution and abominations." },
  { t = "v", n = 15, text = "Then they will say: \"The days of the forefathers were many (even), unto a thousand years, and were good; but, behold, the days of our life, if a man hath lived many, are three score years and ten, and, if he is strong, four score years, and those evil and there is no peace in the days of this evil generation.\"" },
  { t = "v", n = 16, text = "And in that generation the sons will convict their fathers and their elders of sin and unrighteousness, and of the words of their mouth and the great wickednesses which they perpetrate, and concerning their forsaking the covenant which the Lord made between them and Him, that they should observe and do all His commandments and His ordinances and all His laws, without departing either to the right hand or to the left." },
  { t = "v", n = 17, text = "For all have done evil, and every mouth speaketh iniquity and all their works are an uncleanness and an abomination, and all their ways are pollution, uncleanness and destruction." },
  { t = "h", level = 3, text = "The Messianic Woes (xxiii. 18-25). [Eschatological partly.]" },
  { t = "v", n = 18, text = "Behold the earth will be destroyed on account of all their works, and there will be no seed of the vine, and no oil; for their works are altogether faithless, and they will all perish together, beasts and cattle and birds, and all the fish of the sea, on account of the children of men." },
  { t = "v", n = 19, text = "And they will strive one with another, the young with the old, and the old with the young, the poor with the rich, and the lowly with the great, and the beggar with the prince, on account of the law and the covenant; for they have forgotten commandment, and covenant, and feasts, and months, and Sabbaths, and jubilees, and all judgments." },
  { t = "v", n = 20, text = "And they will stand (with bows and) swords and war to turn them back into the way; but they will not return until much blood hath been shed on the earth, one by another." },
  { t = "v", n = 21, text = "And those who have escaped will not return from their wickedness to the way of righteousness, but they will all exalt themselves to deceit and wealth, that they may each take all that is his neighbour's, and they will name the great name, but not in truth and not in righteousness, and they will defile the holy of holies with their uncleanness and the corruption of their pollution." },
  { t = "v", n = 22, text = "And a great punishment will befall the deeds of this generation from the Lord, and He will give them over to the sword and to judgment and to captivity, and to be plundered and devoured." },
  { t = "v", n = 23, indent = 1, text = "And He will wake up against them the sinners of the Gentiles, who have neither mercy nor compassion, and who will respect the person of none, neither old nor young, nor any one, for they are more wicked and strong to do evil than all the children of men. And they will use violence against Israel and transgression against Jacob," },
  { t = "v", n = 23, indent = 1, cont = true, text = "And much blood will be shed upon the earth," },
  { t = "v", n = 23, indent = 1, cont = true, text = "And there will be none to gather and none to bury." },
  { t = "v", n = 24, indent = 1, text = "In those days they will cry aloud," },
  { t = "v", n = 24, indent = 1, cont = true, text = "And call and pray that they may be saved from the hand of the sinners, the Gentiles;" },
  { t = "v", n = 24, indent = 1, cont = true, text = "But none will be saved." },
  { t = "v", n = 25, indent = 1, text = "And the heads of the children will be white with grey hair," },
  { t = "v", n = 25, indent = 1, cont = true, text = "And a child of three weeks will appear old like a man of one hundred years," },
  { t = "v", n = 25, indent = 1, cont = true, text = "And their stature will be destroyed by tribulation and oppression." },
  { t = "h", level = 3, text = "Renewed Study of the Law followed by a Renewal of Mankind. The Messianic Kingdom and the Blessedness of the Righteous (xxiii. 26-32; cf. Isa. lxv. 17 ff. [Eschatological.]" },
  { t = "v", n = 26, indent = 1, text = "And in those days the children will begin to study the laws," },
  { t = "v", n = 26, indent = 1, cont = true, text = "And to seek the commandments," },
  { t = "v", n = 26, indent = 1, cont = true, text = "And to return to the path of righteousness." },
  { t = "v", n = 27, indent = 1, text = "And the days will begin to grow many and increase amongst those children of men," },
  { t = "v", n = 27, indent = 1, cont = true, text = "Till their days draw nigh to one thousand years," },
  { t = "v", n = 27, indent = 1, cont = true, text = "And to a greater number of years than (before) was the number of the days." },
  { t = "v", n = 28, indent = 1, text = "And there will be no old man" },
  { t = "v", n = 28, indent = 1, cont = true, text = "Nor one who is not satisfied with his days," },
  { t = "v", n = 28, indent = 1, cont = true, text = "For all will be (as) children and youths." },
  { t = "v", n = 29, indent = 1, text = "And all their days they will complete and live in peace and in joy," },
  { t = "v", n = 29, indent = 1, cont = true, text = "And there will be no Satan nor any evil destroyer;" },
  { t = "v", n = 29, indent = 1, cont = true, text = "For all their days will be days of blessing and healing," },
  { t = "v", n = 30, indent = 1, text = "And at that time the Lord will heal His servants," },
  { t = "v", n = 30, indent = 1, cont = true, text = "And they will rise up and see great peace," },
  { t = "v", n = 30, indent = 1, cont = true, text = "And drive out their adversaries." },
  { t = "v", n = 30, indent = 1, cont = true, text = "And the righteous will see and be thankful," },
  { t = "v", n = 30, indent = 1, cont = true, text = "And rejoice with joy for ever and ever," },
  { t = "v", n = 30, indent = 1, cont = true, text = "And will see all their judgments and all their curses on their enemies." },
  { t = "v", n = 31, indent = 1, text = "And their bones will rest in the earth," },
  { t = "v", n = 31, indent = 1, cont = true, text = "And their spirits will have much joy," },
  { t = "v", n = 31, indent = 1, cont = true, text = "And they will know that it is the Lord who executeth judgment," },
  { t = "v", n = 31, indent = 1, cont = true, text = "And showeth mercy to hundreds and thousands and to all that love Him." },
  { t = "v", n = 32, text = "And do thou, Moses, write down these words; for thus are they written, and they record (them) on the heavenly tables for a testimony for the generations for ever." },
]

[[section]]
id = "24"
title = "Chapter 24"
level = 1
blocks = [
  { t = "h", level = 3, text = "Isaac at the Well of Vision: Esau sells his Birthright (xxiv. 1-7; cf. Gen. xxv. 11, 29-34)." },
  { t = "v", n = 1, text = "And it came to pass after the death of Abraham, that the Lord blessed Isaac his son, and he arose from Hebron and went and dwelt at the Well of the Vision in the first year of the third week of this jubilee, seven years." },
  { t = "v", n = 2, text = "And in the first year of the fourth week a famine began in the land, besides the first famine, which had been in the days of Abraham." },
  { t = "v", n = 3, text = "And Jacob sod lentil pottage, and Esau came from the field hungry. And he said to Jacob his brother: \"Give me of this red pottage.\" And Jacob said to him: \"Sell to me thy [primogeniture, this] birthright and I will give thee bread, and also some of this lentil pottage.\"" },
  { t = "v", n = 4, text = "And Esau said in his heart: \"I shall die; of what profit to me is this birthright?\" And he said to Jacob: \"I give it to thee.\"" },
  { t = "v", n = 5, text = "And Jacob said \"Swear to me, this day,\" and he sware unto him." },
  { t = "v", n = 6, text = "And Jacob gave his brother Esau bread and pottage, and he ate till he was satisfied, and Esau despised his birthright; for this reason was Esau's name called Edom, on account of the red pottage which Jacob gave him for his birthright." },
  { t = "v", n = 7, text = "And Jacob became the elder, and Esau was brought down from his dignity." },
  { t = "h", level = 3, text = "Isaac's Sojourn in Gerar and Dealings with Abimelech (xxiv. 8-27; cf. Gen. xxvi.)." },
  { t = "v", n = 8, text = "And the famine was over the land, and Isaac departed to go down into Egypt in the second year of this week, and went to the king of the Philistines to Gerar, unto Abimelech." },
  { t = "v", n = 9, text = "And the Lord appeared unto him and said unto him: \"Go not down into Egypt; dwell in the land that I shall tell thee of, and sojourn in this land, and I shall be with thee and bless thee." },
  { t = "v", n = 10, text = "For to thee and to thy seed shall I give all this land, and I shall establish My oath which I sware unto Abraham thy father, and I shall multiply thy seed as the stars of heaven, and shall give unto thy seed all this land." },
  { t = "v", n = 11, text = "And in thy seed will all the nations of the earth be blessed, because thy father obeyed My voice, and kept My charge and My commandments, and My laws, and My ordinances, and My covenant; and now obey My voice and dwell in this land.\"" },
  { t = "v", n = 12, text = "And he dwelt in Gerar three weeks of years." },
  { t = "v", n = 13, text = "And Abimelech charged concerning him, and concerning all that was his, saying: \"Any man that shall touch him or aught that is his shall surely die.\"" },
  { t = "v", n = 14, text = "And Isaac waxed strong among the Philistines, and he got many possessions, oxen and sheep and camels and asses and a great household." },
  { t = "v", n = 15, text = "And he sowed in the land of the Philistines and brought in a hundred-fold, and Isaac became exceedingly great, and the Philistines envied him." },
  { t = "v", n = 16, text = "Now all the wells which the servants of Abraham had dug during the life of Abraham, the Philistines had stopped them after the death of Abraham, and filled them with earth." },
  { t = "v", n = 17, text = "And Abimelech said unto Isaac: \"Go from us, for thou art much mightier than we\"; and Isaac departed thence in the first year of the seventh week, and sojourned in the valleys of Gerar." },
  { t = "v", n = 18, text = "And they digged again the wells of water which the servants of Abraham, his father, had digged, and which the Philistines had closed after the death of Abraham his father, and he called their names as Abraham his father had named them." },
  { t = "v", n = 19, text = "And the servants of Isaac dug a well in the valley, and found living water, and the shepherds of Gerar strove with the shepherds of Isaac, saying: \"The water is ours \"; and Isaac called the name of the well \"Perversity,\" because they had been perverse with us." },
  { t = "v", n = 20, text = "And they dug a second well, and they strove for that also, and he called its name \"Enmity.\" And he arose from thence and they digged another well, and for that they strove not, and he called the name of it \"Room,\" and Isaac said: \"Now the Lord hath made room for us, and we have increased in the land.\"" },
  { t = "v", n = 21, text = "And he went up from thence to the Well of the Oath in the first year of the first week in the forty-fourth jubilee." },
  { t = "v", n = 22, text = "And the Lord appeared to him that night, on the new moon of the first month, and said unto him: \"I am the God of Abraham thy father; fear not, for I am with thee, and shall bless thee and shall surely multiply thy seed as the sand of the earth, for the sake of Abraham my servant.\"" },
  { t = "v", n = 23, text = "And he built an altar there, which Abraham his father had first built, and he called upon the name of the Lord, and he offered sacrifice to the God of Abraham his father." },
  { t = "v", n = 24, text = "And they digged a well and they found living water." },
  { t = "v", n = 25, text = "And the servants of Isaac digged another well and did not find water, and they went and told Isaac that they had not found water, and Isaac said: \"I have sworn this day to the Philistines and this thing hath been announced to us.\"" },
  { t = "v", n = 26, text = "And he called the name of that place the \"Well of the Oath\"; for there he had sworn to Abimelech and Ahuzzath his friend and Phicol the prefect of his host." },
  { t = "v", n = 27, text = "And Isaac knew that day that under constraint he had sworn to them to make peace with them." },
  { t = "h", level = 3, text = "Isaac curses the Philistines (xxiv. 28-33)." },
  { t = "v", n = 28, text = "And Isaac on that day cursed the Philistines and said: \"Cursed be the Philistines unto the day of wrath and indignation from the midst of all nations; may God make them a derision and a curse and an object of wrath and indignation in the hands of the sinners the Gentiles and in the hands of the Kittim." },
  { t = "v", n = 29, text = "And whoever escapeth the sword of the enemy and the Kittim, may the righteous nation root out in judgment from under heaven; for they will be the enemies and foes of my children throughout their generations upon the earth." },
  { t = "v", n = 30, indent = 1, text = "And no remnant will be left to them," },
  { t = "v", n = 30, indent = 1, cont = true, text = "Nor one that will be saved on the day of the wrath of judgment;" },
  { t = "v", n = 30, indent = 1, cont = true, text = "For for destruction and rooting out and expulsion from the earth is the whole seed of the Philistines (reserved)," },
  { t = "v", n = 30, indent = 1, cont = true, text = "And there will no longer be left for these Caphtorim a name or a seed on the earth." },
  { t = "v", n = 31, indent = 1, text = "For though he ascend unto heaven," },
  { t = "v", n = 31, indent = 1, cont = true, text = "Thence will he be brought down," },
  { t = "v", n = 31, indent = 1, cont = true, text = "And though he make himself strong on earth," },
  { t = "v", n = 31, indent = 1, cont = true, text = "Thence will he be dragged forth," },
  { t = "v", n = 31, indent = 1, cont = true, text = "And though he hide himself amongst the nations," },
  { t = "v", n = 31, indent = 1, cont = true, text = "Even from thence will he be rooted out;" },
  { t = "v", n = 31, indent = 1, cont = true, text = "And though he descend into Sheol," },
  { t = "v", n = 31, indent = 1, cont = true, text = "There also will his condemnation be great," },
  { t = "v", n = 31, indent = 1, cont = true, text = "And there also he will have no peace." },
  { t = "v", n = 32, indent = 1, text = "And if he go into captivity," },
  { t = "v", n = 32, indent = 1, cont = true, text = "By the hands of those that seek his life will they slay him on the way," },
  { t = "v", n = 32, indent = 1, cont = true, text = "And neither name nor seed will be left to him on all the earth;" },
  { t = "v", n = 32, indent = 1, cont = true, text = "For into eternal malediction will he depart.\"" },
  { t = "v", n = 33, text = "And thus is it written and engraved concerning him on the heavenly tables, to do unto him on the day of judgment, so that he may be rooted out of the earth." },
]

[[section]]
id = "25"
title = "Chapter 25"
level = 1
blocks = [
  { t = "h", level = 3, text = "Rebecca admonishes Jacob not to marry a Canaanitish Woman. Rebecca's Blessing (xxv. 1-23; cf. Gen. xxviii. 1-4)." },
  { t = "v", n = 1, text = "And in the second year of this week in this jubilee, Rebecca called Jacob her son, and spake unto him, saying: \"My son, do not take thee a wife of the daughters of Canaan, as Esau, thy brother, who took him two wives of the daughters of Canaan, and they have embittered my soul with all their unclean deeds: for all their deeds are fornication and lust, and there is no righteousness with them, for (their deeds) are evil." },
  { t = "v", n = 2, text = "And I, my son, love thee exceedingly, and my heart and my affection bless thee every hour of the day and watch of the night." },
  { t = "v", n = 3, text = "And now, my son, hearken to my voice, and do the will of thy mother, and do not take thee a wife of the daughters of this land, but only of the house of my father, and of my father's kindred. Thou wilt take thee a wife of the house of my father, and the Most High God will bless thee, and thy children will be a righteous generation and a holy seed.\"" },
  { t = "v", n = 4, text = "And then spake Jacob to Rebecca, his mother, and said unto her: \"Behold, mother, I am nine weeks of years old, and I neither know nor have I touched any woman, nor have I betrothed myself to any, nor even think of taking me a wife of the daughters of Canaan." },
  { t = "v", n = 5, text = "For I remember, mother, the words of Abraham, our father, for he commanded me not to take a wife of the daughters of Canaan, but to take me a wife from the seed of my father's house and from my kindred." },
  { t = "v", n = 6, text = "I have heard before that daughters have been born to Laban, thy brother, and I have set my heart on them to take a wife from amongst them." },
  { t = "v", n = 7, text = "And for this reason I have guarded myself in my spirit against sinning or being corrupted in all my ways throughout all the days of my life; for with regard to lust and fornication, Abraham, my father, gave me many commands." },
  { t = "v", n = 8, text = "And, despite all that he hath commanded me, these two and twenty years my brother hath striven with me, and spoken frequently to me and said: 'My brother, take to wife a sister of my two wives'; but I refuse to do as he hath done." },
  { t = "v", n = 9, text = "I swear before thee, mother, that all the days of my life I will not take me a wife from the daughters of the seed of Canaan, and I will not act wickedly as my brother hath done." },
  { t = "v", n = 10, text = "Fear not, mother; be assured that I shall do thy will and walk in uprightness, and not corrupt my ways for ever.\"" },
  { t = "v", n = 11, text = "And thereupon she lifted up her face to heaven and extended the fingers of her hands, and opened her mouth and blessed the Most High God, who had created the heaven and the earth, and she gave Him thanks and praise." },
  { t = "v", n = 12, text = "And she said: \"Blessed be the Lord God, and may His holy name be blessed for ever and ever, who hath given me Jacob as a pure son and a holy seed; for He is Thine, and Thine shall his seed be continually and throughout all the generations for evermore." },
  { t = "v", n = 13, text = "Bless him, O Lord, and place in my mouth the blessing of righteousness, that I may bless him.\"" },
  { t = "v", n = 14, text = "And at that hour, when the spirit of righteousness descended into her mouth, she placed both her hands on the head of Jacob, and said:" },
  { t = "v", n = 15, indent = 1, text = "\"Blessed art thou, Lord of righteousness and God of the ages;" },
  { t = "v", n = 15, indent = 1, cont = true, text = "And may He bless thee beyond all the generations of men." },
  { t = "v", n = 15, indent = 1, cont = true, text = "May He give thee, my son, the path of righteousness," },
  { t = "v", n = 15, indent = 1, cont = true, text = "And reveal righteousness to thy seed." },
  { t = "v", n = 16, indent = 1, text = "And may He make thy sons many during thy life," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And may they arise according to the number of the months of the year." },
  { t = "v", n = 16, indent = 1, cont = true, text = "And may their sons become many and great beyond the stars of heaven," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And their numbers be more than the sand of the sea." },
  { t = "v", n = 17, indent = 1, text = "And may He give them this goodly land—as He said He would give it to Abraham and to his seed after him alway —" },
  { t = "v", n = 17, indent = 1, cont = true, text = "And may they hold it as a possession for ever." },
  { t = "v", n = 18, indent = 1, text = "And may I see (born) unto thee, my son, blessed children during my life," },
  { t = "v", n = 18, indent = 1, cont = true, text = "And a blessed and holy seed may all thy seed be." },
  { t = "v", n = 19, indent = 1, text = "And as thou hast refreshed thy mother's spirit during †my† life," },
  { t = "v", n = 19, indent = 1, cont = true, text = "The womb of her that bare thee blesseth thee," },
  { t = "v", n = 19, indent = 1, cont = true, text = "[My affection] and my breasts bless thee" },
  { t = "v", n = 19, indent = 1, cont = true, text = "And my mouth and my tongue praise thee greatly." },
  { t = "v", n = 20, indent = 1, text = "Increase and spread over the earth," },
  { t = "v", n = 20, indent = 1, cont = true, text = "And may thy seed be perfect in the joy of heaven and earth for ever;" },
  { t = "v", n = 20, indent = 1, cont = true, text = "And may thy seed rejoice," },
  { t = "v", n = 20, indent = 1, cont = true, text = "And on the great day of peace may it have peace." },
  { t = "v", n = 21, indent = 1, text = "And may thy name and thy seed endure to all the ages," },
  { t = "v", n = 21, indent = 1, cont = true, text = "And may the Most High God be their God," },
  { t = "v", n = 21, indent = 1, cont = true, text = "And may the God of righteousness dwell with them," },
  { t = "v", n = 21, indent = 1, cont = true, text = "And by them may His sanctuary be built unto all the ages." },
  { t = "v", n = 22, indent = 1, text = "Blessed be he that blesseth thee," },
  { t = "v", n = 22, indent = 1, cont = true, text = "And all flesh that curseth thee falsely may it be cursed.\"" },
  { t = "v", n = 23, indent = 1, text = "And she kissed him, and said to him" },
  { t = "v", n = 23, indent = 1, cont = true, text = "\"May the Lord of the world love thee" },
  { t = "v", n = 23, indent = 1, cont = true, text = "As the heart of thy mother and her affection rejoice in thee and bless thee.\"" },
  { t = "v", n = 23, indent = 1, cont = true, text = "And she ceased from blessing." },
]

[[section]]
id = "26"
title = "Chapter 26"
level = 1
blocks = [
  { t = "h", level = 3, text = "Jacob obtains the Blessing of the Firstborn (xxvi. 1-35; cf. Gen. xxvii.)." },
  { t = "v", n = 1, text = "And in the seventh year of this week Isaac called Esau, his elder son, and said unto him: \"I am old, my son, and behold my eyes are dim in seeing, and I know not the day of my death." },
  { t = "v", n = 2, text = "And now take thy hunting weapons, thy quiver and thy bow, and go out to the field, and hunt and catch me (venison), my son, and make me savoury meat, such as my soul loveth, and bring it to me that I may eat, and that my soul may bless thee before I die.\"" },
  { t = "v", n = 3, text = "But Rebecca heard Isaac speaking to Esau." },
  { t = "v", n = 4, text = "And Esau went forth early to the field to hunt and catch and bring home to his father." },
  { t = "v", n = 5, text = "And Rebecca called Jacob, her son, and said unto him: \"Behold, I heard Isaac, thy father, speak unto Esau, thy brother, saying: 'Hunt for me, and make me savoury meat, and bring (it) to me that I may eat and bless thee before the Lord before I die.'" },
  { t = "v", n = 6, text = "And now, my son, obey my voice in that which I command thee: Go to thy flock and fetch me two good kids of the goats, and I will make them savoury meat for thy father, such as he loveth, and thou shalt bring (it) to thy father that he may eat and bless thee before the Lord before he die, and that thou mayst be blessed.\"" },
  { t = "v", n = 7, text = "And Jacob said to Rebecca his mother: \"Mother, I shall not withhold anything which my father would eat, and which would please him: only I fear, my mother, that he will recognise my voice and wish to touch me." },
  { t = "v", n = 8, text = "And thou knowest that I am smooth, and Esau, my brother, is hairy, and I shall appear before his eyes as an evildoer, and shall do a deed which he had not commanded me, and he will be wroth with me, and I shall bring upon myself a curse, and not a blessing.\"" },
  { t = "v", n = 9, text = "And Rebecca, his mother, said unto him: \"Upon me be thy curse, my son, only obey my voice.\"" },
  { t = "v", n = 10, text = "And Jacob obeyed the voice of Rebecca, his mother, and went and fetched two good and fat kids of the goats, and brought them to his mother, and his mother made them (savoury meat) such as he loved." },
  { t = "v", n = 11, text = "And Rebecca took the goodly raiment of Esau, her elder son, which was with her in the house, and she clothed Jacob, her younger son, (with them), and she put the skins of the kids upon his hands and on the exposed parts of his neck." },
  { t = "v", n = 12, text = "And she gave the meat and the bread which she had prepared into the hand of her son Jacob." },
  { t = "v", n = 13, text = "And Jacob went in to his father and said: \"I am thy son: I have done according as thou badest me: arise and sit and eat of that which I have caught, father, that thy soul may bless me.\"" },
  { t = "v", n = 14, text = "And Isaac said to his son: \"How hast thou found so quickly, my son?\"" },
  { t = "v", n = 15, text = "And Jacob said: \"Because (the Lord) thy God caused me to find.\"" },
  { t = "v", n = 16, text = "And Isaac said unto him: \"Come near, that I may feel thee, my son, if thou art my son Esau or not.\"" },
  { t = "v", n = 17, text = "And Jacob went near to Isaac, his father, and he felt him and said:" },
  { t = "v", n = 18, text = "\"The voice is Jacob's voice, but the hands are the hands of Esau,\" and he discerned him not, because it was a dispensation from heaven to remove his power of perception and Isaac discerned not, for his hands were hairy as (his brother) Esau's, so that he blessed him." },
  { t = "v", n = 19, text = "And he said: \"Art thou my son Esau?\" and he said: \"I am thy son and he said, \"Bring near to me that I may eat of that which thou hast caught, my son, that my soul may bless thee.\"" },
  { t = "v", n = 20, text = "And he brought near to him, and he did eat, and he brought him wine and he drank." },
  { t = "v", n = 21, text = "And Isaac, his father, said unto him: \"Come near and kiss me, my son.\" And he came near and kissed him." },
  { t = "v", n = 22, text = "And he smelled the smell of his raiment, and he blessed him and said: \"Behold, the smell of my son is as the smell of a (full) field which the Lord hath blessed." },
  { t = "v", n = 23, indent = 1, text = "And may the Lord give thee of the dew of heaven" },
  { t = "v", n = 23, indent = 1, cont = true, text = "And of the dew of the earth, and plenty of corn and oil:" },
  { t = "v", n = 23, indent = 1, cont = true, text = "Let nations serve thee," },
  { t = "v", n = 23, indent = 1, cont = true, text = "And peoples bow down to thee." },
  { t = "v", n = 24, indent = 1, text = "Be lord over thy brethren," },
  { t = "v", n = 24, indent = 1, cont = true, text = "And let thy mother's sons bow down to thee;" },
  { t = "v", n = 24, indent = 1, cont = true, text = "And may all the blessings wherewith the Lord hath blessed me and blessed Abraham, my father," },
  { t = "v", n = 24, indent = 1, cont = true, text = "Be imparted to thee and to thy seed for ever" },
  { t = "v", n = 24, indent = 1, cont = true, text = "Cursed be he that curseth thee," },
  { t = "v", n = 24, indent = 1, cont = true, text = "And blessed be he that blesseth thee.\"" },
  { t = "v", n = 25, text = "And it came to pass as soon as Isaac had made an end of blessing his son Jacob, and Jacob had gone forth from Isaac his father †he hid himself and† Esau, his brother, came in from his hunting." },
  { t = "v", n = 26, text = "And he also made savoury meat, and brought (it) to his father, and said unto his father: \"Let my father arise, and eat of my venison that thy soul may bless me.\"" },
  { t = "v", n = 27, text = "And Isaac, his father, said unto him: \"Who art thou?\" And he said unto him: \"I am thy first born, thy son Esau: I have done as thou hast commanded me.\"" },
  { t = "v", n = 28, text = "And Isaac was very greatly astonished, and said: \"Who is he that hath hunted and caught and brought (it) to me, and I have eaten of all before thou camest, and have blessed him: (and) he shall be blessed, and all his seed for ever.\"" },
  { t = "v", n = 29, text = "And it came to pass when Esau heard the words of his father Isaac that he cried with an exceeding great and bitter cry, and said unto his father: \"Bless me, (even) me also, father.\"" },
  { t = "v", n = 30, text = "And he said unto him: \"Thy brother came with guile, and hath taken away thy blessing.\" And he said: \"Now I know why his name is named Jacob: behold, he hath supplanted me these two times: he took away my birth-right, and now he hath taken away my blessing.\"" },
  { t = "v", n = 31, indent = 1, text = "And he said: \"Hast thou not reserved a blessing for me, father?\" and Isaac answered and said unto Esau: \"Behold, I have made him thy lord," },
  { t = "v", n = 31, indent = 1, cont = true, text = "And all his brethren have I given to him for servants," },
  { t = "v", n = 31, indent = 1, cont = true, text = "And with plenty of com and wine and oil have I strengthened him:" },
  { t = "v", n = 31, indent = 1, cont = true, text = "And what now shall I do for thee, my son?\"" },
  { t = "v", n = 32, indent = 1, text = "And Esau said to Isaac, his father: \"Hast thou but one blessing, O father?" },
  { t = "v", n = 32, indent = 1, cont = true, text = "Bless me, (even) me also, father\": And Esau lifted up his voice and wept." },
  { t = "v", n = 33, indent = 1, text = "And Isaac answered and said unto him: \"Behold, far from the dew of the earth shall be thy dwelling," },
  { t = "v", n = 33, indent = 1, cont = true, text = "And far from the dew of heaven from above." },
  { t = "v", n = 34, indent = 1, text = "And by thy sword wilt thou live," },
  { t = "v", n = 34, indent = 1, cont = true, text = "And thou wilt serve thy brother." },
  { t = "v", n = 34, indent = 1, cont = true, text = "And it shall come to pass when thou becomest great," },
  { t = "v", n = 34, indent = 1, cont = true, text = "And dost shake his yoke from off thy neck," },
  { t = "v", n = 34, indent = 1, cont = true, text = "Thou wilt sin a complete sin unto death," },
  { t = "v", n = 34, indent = 1, cont = true, text = "And thy seed will be rooted out from under heaven.\"" },
  { t = "v", n = 35, text = "And Esau kept threatening Jacob because of the blessing wherewith his father blessed him, and he said in his heart: \"May the days of mourning for my father now come, so that I may slay my brother Jacob.\"" },
]

[[section]]
id = "27"
title = "Chapter 27"
level = 1
blocks = [
  { t = "h", level = 3, text = "Rebecca induces Isaac to send Jacob to Mesopotamia. Jacob's Dream and View at Bethel (xxvii. 1-27; cf. Gen. xxviii.)." },
  { t = "v", n = 1, text = "And the words of Esau, her elder son, were told to Rebecca in a dream, and Rebecca sent and called Jacob her younger son, and said unto him:" },
  { t = "v", n = 2, text = "\"Behold Esau thy brother will take vengeance on thee so as to kill thee." },
  { t = "v", n = 3, text = "Now, therefore, my son, obey my voice, and arise and flee thou to Laban, my brother, to Haran, and tarry with him a few days until thy brother's anger turneth away, and he remove his anger from thee, and forget all that thou hast done; then I will send and fetch thee from thence.\"" },
  { t = "v", n = 4, text = "And Jacob said: \"I am not afraid; if he wisheth to kill me, I will kill him.\"" },
  { t = "v", n = 5, text = "But she said unto him: \"Let me not be bereft of both my sons on one day.\"" },
  { t = "v", n = 6, text = "And Jacob said to Rebecca his mother: \"Behold, thou knowest that my father hath become old, and doth not see because his eyes are dull, and if I leave him it will be evil in his eyes, because I leave him and go away from you, and my father will be angry, and will curse me. I will not go; when he sendeth me, then only will I go.\"" },
  { t = "v", n = 7, text = "And Rebecca said to Jacob: \"I will go in and speak to him, and he will send thee away.\"" },
  { t = "v", n = 8, text = "And Rebecca went in and said to Isaac: \"I loathe my life because of the two daughters of Heth, whom Esau hath taken him as wives; and if Jacob take a wife from among the daughters of the land such as these, for what purpose do I further live; for the daughters of Canaan are evil.\"" },
  { t = "v", n = 9, text = "And Isaac called Jacob and blessed him, and admonished him and said unto him:" },
  { t = "v", n = 10, text = "\"Do not take thee a wife of any of the daughters of Canaan; arise and go to Mesopotamia, to the house of Bethuel, thy mother's father, and take thee a wife from thence of the daughters of Laban, thy mother's brother." },
  { t = "v", n = 11, text = "And God Almighty bless thee and increase and multiply thee that thou mayest become a company of nations, and give thee the blessings of my father Abraham, to thee and to thy seed after thee, that thou mayest inherit the land of thy sojournings and all the land which God gave to Abraham: go, my son, in peace.\"" },
  { t = "v", n = 12, text = "And Isaac sent Jacob away, and he went to Mesopotamia, to Laban the son of Bethuel the Syrian, the brother of Rebecca, Jacob's mother." },
  { t = "v", n = 13, text = "And it came to pass after Jacob had arisen to go to Mesopotamia that the spirit of Rebecca was grieved after her son, and she wept." },
  { t = "v", n = 14, text = "And Isaac said to Rebecca: \"My sister, weep not on account of Jacob, my son; for he goeth in peace, and in peace will he return." },
  { t = "v", n = 15, text = "The Most High God will preserve him from all evil, and will be with him; for He will not forsake him all his days;" },
  { t = "v", n = 16, text = "For I know that his ways will be prospered in all things wherever he goeth, until he return in peace to us, and we see him in peace." },
  { t = "v", n = 17, text = "Fear not on his account my sister, for he is on the upright path and he is a perfect man: and he is faithful and will not perish. Weep not.\"" },
  { t = "v", n = 18, text = "And Isaac comforted Rebecca on account of her son Jacob, and blessed him." },
  { t = "v", n = 19, text = "And Jacob went from the Well of the Oath to go to Haran on the first year of the second week in the forty-fourth Jubilee, and he came to Luz on the mountains, that is, Bethel, on the new moon of the first month of this week, and he came to the place at even and turned from the way to the west of the road that night: and he slept there; for the sun had set." },
  { t = "v", n = 20, text = "And he took one of the stones of that place and laid it (at his head) under the tree, and he was journeying alone, and he slept." },
  { t = "v", n = 21, text = "And he dreamt that night, and behold a ladder set up on the earth, and the top of it reached to heaven, and behold, the angels of the Lord ascended and descended on it: and behold, the Lord stood upon it." },
  { t = "v", n = 22, text = "And He spake to Jacob and said: \"I am the Lord God of Abraham, thy father, and the God of Isaac; the land whereon thou art sleeping, to thee shall I give it, and to thy-seed after thee." },
  { t = "v", n = 23, text = "And thy seed will be as the dust of the earth, and thou wilt increase to the west and to the east, to the north and the south, and in thee and in thy seed will all the families of the nations be blessed." },
  { t = "v", n = 24, text = "And behold, I shall be with thee, and shall keep thee whithersoever thou goest, and I shall bring thee again into this land in peace; for I shall not leave thee until I do everything that I told thee of.\"" },
  { t = "v", n = 25, text = "And Jacob awoke from his sleep, and said, \"Truly this place is the house of the Lord, and I knew it not.\" And he was afraid and said:\" Dreadful is this place which is none other than the house of God, and this is the gate of heaven.\"" },
  { t = "v", n = 26, text = "And Jacob arose early in the morning, and took the stone which he had put under his head and set it up as a pillar for a sign, and he poured oil upon the top of it. And he called the name of that place Bethel; but the name of the place was Luz at the first." },
  { t = "v", n = 27, text = "And Jacob vowed a vow unto the Lord, saying: \"If the Lord will be with me, and will keep me in this way that I go, and give me bread to eat and raiment to put on, so that I come again to my father's house in peace, then shall the Lord be my God, and this stone which I have set up as a pillar for a sign in this place, shall be the Lord's house, and of all that thou givest me, I shall give the tenth to thee, my God.\"" },
]

[[section]]
id = "28"
title = "Chapter 28"
level = 1
blocks = [
  { t = "h", level = 3, text = "Jacob's Marriage to Leah and Rachel; his Children and Riches (xxviii. i-30; cf. Gen. xxix., xxx., xxxi. 1-2)." },
  { t = "v", n = 1, text = "And he went on his journey, and came to the land of the east, to Laban, the brother of Rebecca, and he was with him, and served him for Rachel his daughter one week." },
  { t = "v", n = 2, text = "And in the first year of the third week he said unto him: \"Give me my wife, for whom I have served thee seven years;\" and Laban said unto Jacob. \"I will give thee thy wife.\"" },
  { t = "v", n = 3, text = "And Laban made a feast, and took Leah his elder daughter, and gave (her) to Jacob as a wife, and gave her Zilpah his handmaid for an handmaid; and Jacob did not know, for he thought that she was Rachel." },
  { t = "v", n = 4, text = "And he went in unto her, and behold, she was Leah; and Jacob was angry with Laban, and said unto him: \"Why hast thou dealt thus with me? Did not I serve thee for Rachel and not for Leah? Why hast thou wronged me? Take thy daughter, and I will go; for thou hast done evil to me.\"" },
  { t = "v", n = 5, text = "For Jacob loved Rachel more than Leah; for Leah's eyes were weak, but her form was very handsome; but Rachel had beautiful eyes and a beautiful and very handsome form." },
  { t = "v", n = 6, text = "And Laban said to Jacob: \"It is not so done in our country, to give the younger before the elder.\" And it is not right to do this; for thus it is ordained and written in the heavenly tables, that no one should give his younger daughter before the elder—but the elder one giveth first and after her the younger—and the man who doeth so, they set down guilt against him in heaven, and none is righteous that doeth this thing, for this deed is evil before the Lord." },
  { t = "v", n = 7, text = "And command thou the children of Israel that they do not this thing; let them neither take nor give the younger before they have given the elder, for it is very wicked." },
  { t = "v", n = 8, text = "And Laban said to Jacob: \"Let the seven days of the feast of this one pass by, and I shall give thee Rachel, that thou mayest serve me another seven years, that thou mayest pasture my sheep as thou didst in the former week.\"" },
  { t = "v", n = 9, text = "And on the day when the seven days of the feast of Leah had passed, Laban gave Rachel to Jacob, that he might serve him another seven years, and he gave to Rachel Bilhah, the sister of Zilpah as a handmaid." },
  { t = "v", n = 10, text = "And he served yet other seven years for Rachel, for Leah had been given to him for nothing." },
  { t = "v", n = 11, text = "And the Lord opened the womb of Leah, and she conceived and bare Jacob a son, and he called his name Reuben, on the fourteenth day of the ninth month, in the first year of the third week." },
  { t = "v", n = 12, text = "But the womb of Rachel was closed, for the Lord saw that Leah was hated and Rachel loved." },
  { t = "v", n = 13, text = "And again Jacob went in unto Leah, and she conceived, and bare Jacob a second son, and he called his name Simeon, on the twenty-first of the tenth month, and in the third year of this week." },
  { t = "v", n = 14, text = "And again Jacob went in unto Leah, and she conceived, and bare him a third son, and he called his name Levi, in the new moon of the first month in the sixth year of this week." },
  { t = "v", n = 15, text = "And again Jacob went in unto her, and she conceived, and bare him a fourth son, and he called his name Judah, on the fifteenth of the third month, in the †first† year of the †fourth† week." },
  { t = "v", n = 16, text = "And on account of all this Rachel envied Leah, for she did not bear, and she said to Jacob: \"Give me children \"; and Jacob said: \"Have I withheld from thee the fruits of thy womb? Have I forsaken thee?\"" },
  { t = "v", n = 17, text = "And when Rachel saw that Leah had borne four sons to Jacob, Reuben and Simeon and Levi and Judah, she said unto him: \"Go in unto Bilhah my handmaid, and she will conceive, and bear a son unto me.\"" },
  { t = "v", n = 18, text = "(And she gave (him) Bilhah her handmaid to wife.) And he went in unto her, and she conceived, and bare him a son, and he called his name Dan, on the ninth of the sixth month, in the †sixth† year of the †third† week." },
  { t = "v", n = 19, text = "And Jacob went in again unto Bilhah a second time, and she conceived, and bare Jacob another son, and Rachel called his name Naphtali, on the fifth of the seventh month, in the second year of the fourth week." },
  { t = "v", n = 20, text = "And when Leah saw that she had become sterile and did not bear, she envied (Rachel) and she also gave her handmaid Zilpah to Jacob to wife, and she conceived, and bare a son, and Leah called his name Gad, on the twelfth of the eighth month, in the third year of the fourth week." },
  { t = "v", n = 21, text = "And he went in again unto her, and she conceived, and bare him a second son, and Leah called his name Asher, on the second of the eleventh month, in the †fifth† year of the fourth week." },
  { t = "v", n = 22, text = "And Jacob went in unto Leah, and she conceived, and bare a son, and she called his name Issachar, on the fourth of the fifth month, in the †fourth† year of the fourth week, and she gave him to a nurse." },
  { t = "v", n = 23, text = "And Jacob went in again unto her, and she conceived, and bare two (children), a son and a daughter, and she called the name of the son Zebulon, and the name of the daughter Dinah, in the seventh of the seventh month, in the sixth year of the fourth week." },
  { t = "v", n = 24, text = "And the Lord was gracious to Rachel, and opened her womb, and she conceived, and bare a son, and she called his name Joseph, on the new moon of the fourth month, in the †sixth† year in this fourth week." },
  { t = "v", n = 25, text = "And in the days when Joseph was born, Jacob said to Laban: \"Give me my wives and sons, and let me go to my father Isaac, and let me make me an house; for I have completed the years in which I have served thee for thy two daughters, and I will go to the house of my father.\"" },
  { t = "v", n = 26, text = "And Laban said to Jacob: \"†Tarry with me for thy wages†, and pasture my flock for me again, and take thy wages.\"" },
  { t = "v", n = 27, text = "And they agreed with one another that he should give him as his wages those of the lambs and kids which were born black and spotted and white, (these) were to be his wages." },
  { t = "v", n = 28, text = "And all the sheep brought forth spotted and speckled and black, variously marked, and they brought forth again lambs like themselves, and all that were spotted were Jacob's and those which were not were Laban's." },
  { t = "v", n = 29, text = "And Jacob's possessions multiplied exceedingly, and he possessed oxen and sheep and asses and camels, and menservants and maidservants." },
  { t = "v", n = 30, text = "And Laban and his sons envied Jacob, and Laban took back his sheep from him, and he observed him with evil intent." },
]

[[section]]
id = "29"
title = "Chapter 29"
level = 1
blocks = [
  { t = "h", level = 3, text = "Jacob's Flight with his Family: his Covenant with Laban (xxix. 1-12; cf. Gen, xxxi.)." },
  { t = "v", n = 1, text = "And it came to pass when Rachel had borne Joseph, that Laban went to shear his sheep; for they were distant from him a three days' journey." },
  { t = "v", n = 2, text = "And Jacob saw that Laban was going to shear his sheep, and Jacob called Leah and Rachel, and spake kindly unto them that they should come with him to the land of Canaan." },
  { t = "v", n = 3, text = "For he told them how he had seen everything in a dream, even all that He had spoken unto him that he should return to his father's house; and they said: \"To every place whither thou goest we will go with thee.\"" },
  { t = "v", n = 4, text = "And Jacob blessed the God of Isaac his father, and the God of Abraham his father's father, and he arose and mounted his wives and his children, and took all his possessions and crossed the river, and came to the land of Gilead, and Jacob hid his intention from Laban and told him not." },
  { t = "v", n = 5, text = "And in the seventh year of the fourth week Jacob turned (his face) toward Gilead in the first month, on the twenty-first thereof. And Laban pursued after him and overtook Jacob in the mountain of Gilead in the third month, on the thirteenth thereof." },
  { t = "v", n = 6, text = "And the Lord did not suffer him to injure Jacob; for He appeared to him in a dream by night. And Laban spake to Jacob," },
  { t = "v", n = 7, text = "And on the fifteenth of those days Jacob made a feast for Laban, and for all who came with him, and Jacob sware to Laban that day, and Laban also to Jacob, that neither should cross the mountain of Gilead to the other with evil purpose." },
  { t = "v", n = 8, text = "And he made there a heap for a witness; wherefore the name of that place is called: \"The Heap of Witness,\" after this heap." },
  { t = "v", n = 9, text = "But before they used to call the land of Gilead the land of the Rephaim; for it was the land of the Rephaim, and the Rephaim were born (there), giants whose height was ten, nine, eight down to seven cubits." },
  { t = "v", n = 10, text = "And their habitation was from the land of the children of Ammon to Mount Hermon, and the seats of their kingdom were Karnaim and Ashtaroth, and Edrei, and Mîsûr, and Beon." },
  { t = "v", n = 11, text = "And the Lord destroyed them because of the evil of their deeds; for they were very malignant, and the Amorites dwelt in their stead, wicked and sinful, and there is no people to-day which hath wrought to the full all their sins, and they have no longer length of life on the earth." },
  { t = "v", n = 12, text = "And Jacob sent away Laban, and he departed into Mesopotamia, the land of the East, and Jacob returned to the land of Gilead." },
  { t = "h", level = 3, text = "Jacob, reconciled with Esau, dwells in Canaan and supports his Parents (xxix. 13-20; Cf. Gen. xxxii., xxxiii.)." },
  { t = "v", n = 13, text = "And he passed over the Jabbok in the ninth month, on the eleventh thereof. And on that day Esau, his brother, came to him, and he was reconciled to him, and departed from him unto the land of Seir, but Jacob dwelt in tents." },
  { t = "v", n = 14, text = "And in the first year of the fifth week in this jubilee he crossed the Jordan, and dwelt beyond the Jordan, and he pastured his sheep from the sea †of the heap† unto Bethshan, and unto Dothan and unto the †forest† of Akrabbim." },
  { t = "v", n = 15, text = "And he sent to his father Isaac of all his substance, clothing, and food, and meat, and drink, and milk, and butter, and cheese, and some dates of the valley," },
  { t = "v", n = 16, text = "And to his mother Rebecca also four times a year, between the times of the months, between ploughing and reaping, and between autumn and the rain (season) and between winter and spring, to the tower of Abraham." },
  { t = "v", n = 17, text = "For Isaac had returned from the Well of the Oath and gone up to the tower of his father Abraham, and he dwelt there apart from his son Esau." },
  { t = "v", n = 18, text = "For in the days when Jacob went to Mesopotamia, Esau took to himself a wife Mahalath, the daughter of Ishmael, and he gathered together all the flocks of his father and his wives, and went up and dwelt on Mount Seir, and left Isaac his father at the Well of the Oath alone." },
  { t = "v", n = 19, text = "And Isaac went up from the Well of the Oath and dwelt in the tower of Abraham his father on the mountains of Hebron," },
  { t = "v", n = 20, text = "And thither Jacob sent all that he did send to his father and his mother from time to time, all they needed, and they blessed Jacob with all their heart and with all their soul." },
]

[[section]]
id = "30"
title = "Chapter 30"
level = 1
blocks = [
  { t = "h", level = 3, text = "Dinah ravished. Slaughter of the Shechemites. Laws against Intermarriage between Israel and the Heathen. The Choice of Levi (xxx. 1-26; cf. Gen. xxxiv.)." },
  { t = "v", n = 1, text = "And in the first year of the sixth week he went up to Salem, to the east of Shechem, in peace, in the fourth month." },
  { t = "v", n = 2, text = "And there they carried off Dinah, the daughter of Jacob, into the house of Shechem, the son of Hamor, the Hivite, the prince of the land, and he lay with her and defiled her, and she was a little girl, a child of twelve years." },
  { t = "v", n = 3, text = "And he besought his father and her brothers that she might be given to him to wife. And Jacob and his sons were wroth because of the men of Shechem; for they had defiled Dinah, their sister, and they spake to them with evil intent and dealt deceitfully with them and beguiled them." },
  { t = "v", n = 4, text = "And Simeon and Levi came unexpectedly to Shechem and executed judgment on all the men of Shechem, and slew all the men whom they found in it, and left not a single one remaining in it: they slew all in torments because they had dishonoured their sister Dinah." },
  { t = "v", n = 5, text = "And thus let it not again be done from henceforth that a daughter of Israel be defiled; for judgment is ordained in heaven against them that they should destroy with the sword all the men of the Shechemites because they had wrought shame in Israel." },
  { t = "v", n = 6, text = "And the Lord delivered them into the hands of the sons of Jacob that they might exterminate them with the sword and execute judgment upon them, and that it might not thus again be done in Israel that a virgin of Israel should be defiled." },
  { t = "v", n = 7, text = "And if there is any man who wisheth in Israel to give his daughter or his sister to any man who is of the seed of the Gentiles he shall surely die, and they shall stone him with stones; for he hath wrought shame in Israel; and they shall burn the woman with fire, because she hath dishonoured the name of the house of her father, and she shall be rooted out of Israel." },
  { t = "v", n = 8, text = "And let not an adulteress and no uncleanness be found in Israel throughout all the days of the generations of the earth; for Israel is holy unto the Lord, and every man who hath defiled (it) shall surely die: they shall stone him with stones." },
  { t = "v", n = 9, text = "For thus hath it been ordained and written in the heavenly tables regarding all the seed of Israel: he who defileth (it) shall surely die, and he shall be stoned with stones." },
  { t = "v", n = 10, text = "And to this law there is no limit of days, and no remission, nor any atonement: but the man who hath defiled his daughter shall be rooted out in the midst of all Israel, because he hath given of his seed to Moloch, and wrought impiously so as to defile it." },
  { t = "v", n = 11, text = "And do thou, Moses, command the children of Israel and exhort them not to give their daughters to the Gentiles, and not to take for their sons any of the daughters of the Gentiles, for this is abominable before the Lord." },
  { t = "v", n = 12, text = "For this reason I have written for thee in the words of the Law all the deeds of the Shechemites, which they wrought against Dinah, and how the sons of Jacob spake, saying: \"We shall not give our daughter to a man who is uncircumcised; for that were a reproach unto us.\"" },
  { t = "v", n = 13, text = "And it is a reproach to Israel, to those who give, and to those who take the daughters of the Gentiles; for this is unclean and abominable to Israel." },
  { t = "v", n = 14, text = "And Israel will not be free from this uncleanness if it hath a wife of the daughters of the Gentiles, or hath given any of its daughters to a man who is of any of the Gentiles." },
  { t = "v", n = 15, text = "For there will be plague upon plague, and curse upon curse, and every judgment and plague and curse will come (upon him): if he do this thing, or hide his eyes from those who commit uncleanness, or those who defile the sanctuary of the Lord, or those who profane His holy name, (then) will the whole nation together be judged for all the uncleanness and profanation of this (man)." },
  { t = "v", n = 16, text = "And there will be no respect of persons [and no consideration of persons], and no receiving at his hands of fruits and offerings and burnt-offerings and fat, nor the fragrance of sweet savour, so as to accept it: and so fare every man or woman in Israel who defileth the sanctuary." },
  { t = "v", n = 17, text = "For this reason I have commanded thee, saying: \"Testify this testimony to Israel: see how the Shechemites fared and their sons: how they were delivered into the hands of two sons of Jacob, and they slew them under tortures, and it was (reckoned) unto them for righteousness, and it is written down to them for righteousness." },
  { t = "v", n = 18, text = "And the seed of Levi was chosen for the priesthood, and to be Levites, that they might minister before the Lord, as we, continually, and that Levi and his sons may be blessed for ever; for he was zealous to execute righteousness and judgment and vengeance on all those who arose against Israel." },
  { t = "v", n = 19, text = "And so they inscribe as a testimony in his favour on the heavenly tables blessing and righteousness before the God of all:" },
  { t = "v", n = 20, text = "And we remember the righteousness which the man fulfilled during his life, at all periods of the year; until a thousand generations they will record it, and it will come to him and to his descendants after him, and he hath been recorded on the heavenly tables as a friend and a righteous man." },
  { t = "v", n = 21, text = "All this account I have written for thee, and have commanded thee to say to the children of Israel, that they should not commit sin nor transgress the ordinances nor break the covenant which hath been ordained for them, (but) that they should fulfil it and be recorded as friends." },
  { t = "v", n = 22, text = "But if they transgress and work uncleanness in every way, they will be recorded on the heavenly tables as adversaries, and they will be destroyed out of the book of life, and they will be recorded in the book of those who will be destroyed and with those who will be rooted out of the earth." },
  { t = "v", n = 23, text = "And on the day when the sons of Jacob slew Shechem a writing was recorded in their favour in heaven that they had executed righteousness and uprightness and vengeance on the sinners, and it was written for a blessing." },
  { t = "v", n = 24, text = "And they brought Dinah, their sister, out of the house of Shechem, and they took captive everything that was in Shechem, their sheep and their oxen and their asses, and all their wealth, and all their flocks, and brought them all to Jacob their father." },
  { t = "v", n = 25, text = "And he reproached them because they had put the city to the sword; for he feared those who dwelt in the land, the Canaanites and the Perizzites." },
  { t = "v", n = 26, text = "And the dread of the Lord was upon all the cities which are around about Shechem, and they did not rise to pursue after the sons of Jacob; for terror had fallen upon them." },
]

[[section]]
id = "31"
title = "Chapter 31"
level = 1
blocks = [
  { t = "h", level = 3, text = "Jacob's Journey to Bethel and Hebron. Isaac blesses Levi and Judah (xxxi. 1-25; cf. Gen. xxxv.)." },
  { t = "v", n = 1, text = "And on the new moon of the month Jacob spake to all the people of his house, saying: \"Purify yourselves and change your garments, and let us arise and go up to Bethel, where I vowed a vow to Him on the day when I fled from the face of Esau my brother, because He hath been with me and brought me into this land in peace, and put ye away the strange gods that are among you.\"" },
  { t = "v", n = 2, text = "And they gave up the strange gods and that which was in their ears and which was †on their necks,† and the idols which Rachel stole from Laban her brother she gave wholly to Jacob. And he burnt and brake them to pieces and destroyed them, and hid them under an oak which is in the land of Shechem." },
  { t = "v", n = 3, text = "And he went up on the new moon of the seventh month to Bethel. And he built an altar at the place where he had slept, and he set up a pillar there, and he sent word to his father Isaac to come to him to his sacrifice, and to his mother Rebecca." },
  { t = "v", n = 4, text = "And Isaac said: \"Let my son Jacob come, and let me see him before I die.\"" },
  { t = "v", n = 5, text = "And Jacob went to his father Isaac and to his mother Rebecca, to the house of his father Abraham, and he took two of his sons with him, Levi and Judah, and he came to his father Isaac and to his mother Rebecca." },
  { t = "v", n = 6, text = "And Rebecca came forth from the tower to the front of it to kiss Jacob and embrace him; for her spirit had revived when she heard: \"Behold Jacob thy son hath come\"; and she kissed him." },
  { t = "v", n = 7, text = "And she saw his two sons, and she recognised them, and said unto him: \"Are these thy sons, my son?\" and she embraced them and kissed them, and blessed them, saying: \"In you shall the seed of Abraham become illustrious, and ye will prove a blessing on the earth.\"" },
  { t = "v", n = 8, text = "And Jacob went in to Isaac his father, to the chamber where he lay, and his two sons were with him, and he took the hand of his father, and stooping down he kissed him, and Isaac clung to the neck of Jacob his son, and wept upon his neck." },
  { t = "v", n = 9, text = "And the darkness left the eyes of Isaac, and he saw the two sons of Jacob, Levi and Judah, and he said: \"Are these thy sons, my son? for they are like thee.\"" },
  { t = "v", n = 10, text = "And he said unto him that they were truly his sons: \"And thou hast truly seen that they are truly my sons.\"" },
  { t = "v", n = 11, text = "And they came near to him, and he turned and kissed them and embraced them both together." },
  { t = "v", n = 12, text = "And the spirit of prophecy came down into his mouth, and he took Levi by his right hand and Judah by his left." },
  { t = "v", n = 13, text = "And he turned to Levi first, and began to bless him first, and said unto him:, 'May the God of all, the very Lord of all the ages, bless thee and thy children throughout all the ages." },
  { t = "v", n = 14, text = "And may the Lord give to thee and to thy seed †greatness and great glory†, and cause thee and thy seed, from among all flesh, to approach Him to serve in His sanctuary as the angels of the presence and as the holy ones. (Even) as they, will the seed of thy sons be for glory and greatness and holiness, and may He make them great unto all the ages." },
  { t = "v", n = 15, indent = 1, text = "And they will be princes and judges, and chiefs of all the seed of the sons of Jacob; They will speak the word of the Lord in righteousness," },
  { t = "v", n = 15, indent = 1, cont = true, text = "And they will judge all His judgments in righteousness." },
  { t = "v", n = 15, indent = 1, cont = true, text = "And they will declare My ways to Jacob" },
  { t = "v", n = 15, indent = 1, cont = true, text = "And My paths to Israel." },
  { t = "v", n = 15, indent = 1, cont = true, text = "The blessing of the Lord will be given in their mouths" },
  { t = "v", n = 15, indent = 1, cont = true, text = "To bless all the seed of the beloved." },
  { t = "v", n = 16, indent = 1, text = "Thy mother hath called thy name Levi," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And justly hath she called thy name;" },
  { t = "v", n = 16, indent = 1, cont = true, text = "Thou wilt be joined to the Lord" },
  { t = "v", n = 16, indent = 1, cont = true, text = "And be the companion of all the sons of Jacob;" },
  { t = "v", n = 16, indent = 1, cont = true, text = "Let His table be thine," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And do thou and thy sons eat thereof;" },
  { t = "v", n = 16, indent = 1, cont = true, text = "And may thy table be full unto all generations," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And thy food fail not unto all the ages." },
  { t = "v", n = 17, indent = 1, text = "And let all who hate thee fall down before thee," },
  { t = "v", n = 17, indent = 1, cont = true, text = "And let all thy adversaries be rooted out and perish;" },
  { t = "v", n = 17, indent = 1, cont = true, text = "And blessed be he that blesseth thee," },
  { t = "v", n = 17, indent = 1, cont = true, text = "And cursed be every nation that curseth thee." },
  { t = "v", n = 18, indent = 1, text = "And to Judah he said:" },
  { t = "v", n = 18, indent = 1, cont = true, text = "May the Lord give thee strength and power" },
  { t = "v", n = 18, indent = 1, cont = true, text = "To tread down all that hate thee;" },
  { t = "v", n = 18, indent = 1, cont = true, text = "A prince shalt thou be, thou and one of thy sons, over the sons of Jacob;" },
  { t = "v", n = 18, indent = 1, cont = true, text = "May thy name and the name of thy sons go forth and traverse every land and region." },
  { t = "v", n = 18, indent = 1, cont = true, text = "Then will the Gentiles fear before thy face," },
  { t = "v", n = 18, indent = 1, cont = true, text = "And all the nations will quake" },
  { t = "v", n = 18, indent = 1, cont = true, text = "[And all the peoples will quake]." },
  { t = "v", n = 19, indent = 1, text = "In thee shall be the help of Jacob," },
  { t = "v", n = 19, indent = 1, cont = true, text = "And in thee be found the salvation of Israel." },
  { t = "v", n = 20, indent = 1, text = "And when thou sittest on the throne of the honour of thy righteousness," },
  { t = "v", n = 20, indent = 1, cont = true, text = "There will be great peace for all the seed of the sons of the beloved," },
  { t = "v", n = 20, indent = 1, cont = true, text = "And blessed will he be that blesseth thee;" },
  { t = "v", n = 20, indent = 1, cont = true, text = "And all that hate thee and afflict thee and curse thee" },
  { t = "v", n = 20, indent = 1, cont = true, text = "Shall be rooted out and destroyed from the earth and accursed.\"" },
  { t = "v", n = 21, text = "And turning he kissed him again and embraced him, and rejoiced greatly; for he had seen the sons of Jacob his son in very truth." },
  { t = "v", n = 22, text = "And he went forth from between his feet and fell down and worshipped him. And he blessed them. And (Jacob) rested there with Isaac his father that night, and they ate and drank with joy." },
  { t = "v", n = 23, text = "And he made the two sons of Jacob sleep, the one on his right hand and the other on his left and it was counted to him for righteousness." },
  { t = "v", n = 24, text = "And Jacob told his father everything during the night, how the Lord had shown him great mercy, and how He had prospered (him in) all his ways, and protected him from all evil." },
  { t = "v", n = 25, text = "And Isaac blessed the God of his father Abraham, who had not withdrawn His mercy and His righteousness from the sons of His servant Isaac." },
  { t = "h", level = 3, text = "Rebecca journeys with Jacob to Bethel (xxxi. 26-32)." },
  { t = "v", n = 26, text = "And in the morning Jacob told his father Isaac the vow which he had vowed to the Lord, and the vision which he had seen, and that he had built an altar, and that everything was ready for the sacrifice to be made before the Lord as he had vowed, and that he had come to set him on an ass." },
  { t = "v", n = 27, text = "And Isaac said unto Jacob his son: \"I am not able to go with thee; for I am old, and not able to bear the way: go, my son, in peace; for I am one hundred and sixty-five years this day; I am no longer able to journey, set thy mother (on an ass) and let her go with thee." },
  { t = "v", n = 28, text = "And I know, my son, that thou hast come on my account, and may this day be blessed on which thou hast seen me alive, and I also have seen thee, my son." },
  { t = "v", n = 29, text = "Mayest thou prosper and fulfil the vow which thou hast vowed, and put not off thy vow; for thou wilt be called to account as touching the vow; now therefore make haste to perform it, and may He be pleased who hath made all things, to whom thou hast vowed the vow.\"" },
  { t = "v", n = 30, text = "And he said to Rebecca: \"Go with Jacob thy son\"; and Rebecca went with Jacob her son, and Deborah with her, and they came to Bethel." },
  { t = "v", n = 31, text = "And Jacob remembered the prayer with which his father had blessed him and his two sons, Levi and Judah, and he rejoiced and blessed the God of his fathers, Abraham and Isaac." },
  { t = "v", n = 32, text = "And he said: \"Now I know that I have an eternal hope, and my sons also, before the God of all;\" and thus is it ordained concerning the two; and they record it as an eternal testimony unto them on the heavenly tables how Isaac blessed them." },
]

[[section]]
id = "32"
title = "Chapter 32"
level = 1
blocks = [
  { t = "h", level = 3, text = "Levi's Dream at Bethel; he is appointed to the Priesthood. Jacob celebrates the Feast of Tabernacles and offers Tithes. The Institution of Tithes (xxxii. 1-15; cf. Gen. xxxv.)," },
  { t = "v", n = 1, text = "And he abode that night at Bethel, and Levi dreamed that they had ordained and made him the priest of the Most High God, him and his sons for ever; and he awoke from his sleep and blessed the Lord." },
  { t = "v", n = 2, text = "And Jacob rose early in the morning, on the fourteenth of this month, and he gave a tithe of all that came with him, both of men and cattle, both of gold and every vessel and garment, yea, he gave tithes of all." },
  { t = "v", n = 3, text = "And in those days Rachel became pregnant with her son Benjamin. And Jacob counted his sons from him upwards and Levi fell to the portion of the Lord, and his father clothed him in the garments of the priesthood and filled his hands." },
  { t = "v", n = 4, text = "And on the fifteenth of this month, he brought to the altar fourteen oxen from amongst the cattle, and twenty-eight rams, and forty-nine sheep, and seven lambs, and twenty-one kids of the goats as a burnt-offering on the altar of sacrifice, well pleasing for a sweet savour before God." },
  { t = "v", n = 5, text = "This was his offering, in consequence of the vow which he had vowed that he would give a tenth, with their fruit-offerings and their drink-offerings." },
  { t = "v", n = 6, text = "And when the fire had consumed it, he burnt incense on the fire over the fire, and for a thank-offering two oxen and four rams and four sheep, four he-goats, and two sheep of a year old, and two kids of the goats; and thus he did daily for seven days." },
  { t = "v", n = 7, text = "And he and all his sons and his men were eating (this) with joy there during seven days and blessing and thanking the Lord, who had delivered him out of all his tribulation and had given him his vow." },
  { t = "v", n = 8, text = "And he tithed all the clean animals, and made a burnt sacrifice, but the unclean animals he gave (not) to Levi his son, and he gave him all the souls of the men." },
  { t = "v", n = 9, text = "And Levi discharged the priestly office at Bethel before Jacob his father in preference to his ten brothers, and he was a priest there, and Jacob gave his vow: thus he tithed again the tithe to the Lord and sanctified it, and it became holy unto Him." },
  { t = "v", n = 10, text = "And for this reason it is ordained on the heavenly tables as a law for the tithing again the tithe to eat before the Lord from year to year, in the place where it is chosen that His name should dwell, and to this law there is no limit of days for ever." },
  { t = "v", n = 11, text = "This ordinance is written that it may be fulfilled from year to year in eating the second tithe before the Lord in the place where it hath been chosen, and nothing shall remain over from it from this year to the year following." },
  { t = "v", n = 12, text = "For in its year shall the seed be eaten till the days of the gathering of the seed of the year, and the wine till the days of the wine, and the oil till the days of its season." },
  { t = "v", n = 13, text = "And all that is left thereof and becometh old, let it be regarded as polluted: let it be burnt with fire, for it is unclean." },
  { t = "v", n = 14, text = "And thus let them eat it together in the sanctuary, and let them not suffer it to become old." },
  { t = "v", n = 15, text = "And all the tithes of the oxen and sheep shall be holy unto the Lord, and shall belong to His priests, which they will eat before Him from year to year; for thus is it ordained and engraven regarding the tithe on the heavenly tables." },
  { t = "h", level = 3, text = "Jacob's Visions. He celebrates the eighth day of Tabernacles. The Birth of Benjamin and Death of Rachel (xxxii. 16-34; cf. Gen. xxxv.)." },
  { t = "v", n = 16, text = "And on the following night, on the twenty-second day of this month, Jacob resolved to build that place, and to surround the court with a wall, and to sanctify it and make it holy for ever, for himself and his children after him." },
  { t = "v", n = 17, text = "And the Lord appeared to him by night and blessed him and said unto him: \"Thy name shall not be called Jacob, but Israel shall they name thy name.\"" },
  { t = "v", n = 18, text = "And He said unto him again: \"I am the Lord who created the heaven and the earth, and I shall increase thee and multiply thee exceedingly, and kings will come forth from thee, and they will judge everywhere wherever the foot of the sons of men hath trodden." },
  { t = "v", n = 19, text = "Ana I shall give to thy seed all the earth which is under heaven, and they will judge all the nations according to their desires, and after that they will get possession of the whole earth and inherit it for ever.\"" },
  { t = "v", n = 20, text = "And He finished speaking with him, and He went up from him, and Jacob looked till He had ascended into heaven." },
  { t = "v", n = 21, text = "And he saw in a vision of the night, and behold an angel descended from heaven with seven tablets in his hands, and he gave them to Jacob, and he read them and knew all that was written therein which would befall him and his sons through- out all the ages." },
  { t = "v", n = 22, text = "And he showed him all that was written on the tablets, and said unto him: \"Do not build this place, and do not make it an eternal sanctuary, and do not dwell here; for this is not the place. Go to the house of Abraham thy father and dwell with Isaac thy father until the day of the death of thy father." },
  { t = "v", n = 23, text = "For in Egypt thou wilt die in peace, and in this land thou wilt be buried with honour in the sepulchre of thy fathers, with Abraham and Isaac." },
  { t = "v", n = 24, text = "Fear not, for as thou hast seen and read it, thus will. it all be; and do thou write down everything as thou hast seen and read.\"" },
  { t = "v", n = 25, text = "And Jacob said: \"Lord, how can I remember all that I have read and seen?\" And he said unto him: \"I will bring all things to thy remembrance.\"" },
  { t = "v", n = 26, text = "And he went up from him, and he awoke from his sleep, and he remembered everything which he had read and seen, and he wrote down all the words which he had read and seen." },
  { t = "v", n = 27, text = "And he celebrated there yet another day, and he sacrificed thereon according to all that he sacrificed on the former days, and called its name †\"Addition,\"† for †this day was added,† and the former days he called \"The Feast.\"" },
  { t = "v", n = 28, text = "And thus it was manifested that it should be, and it is written on the heavenly tables: wherefore it was revealed to him that he should celebrate it, and add it to the seven days of the feast." },
  { t = "v", n = 29, text = "And its name was called †\"Addition,\" † †because that† it was recorded amongst the days of the feast days, †according to† the number of the days of the year." },
  { t = "v", n = 30, text = "And in the night, on the twenty-third of this month, Deborah Rebecca's nurse died, and they buried her beneath the city under the oak of the river, and he called the name of this place, \"The river of Deborah,\" and the oak, \"The oak of the mourning of Deborah.\"" },
  { t = "v", n = 31, text = "And Rebecca went and returned to her house to his father Isaac, and Jacob sent by her hand rams and sheep and he-goats that she should prepare a meal for his father such as he desired." },
  { t = "v", n = 32, text = "And he went after his mother till he came to the land of Kabrâtân, and he dwelt there." },
  { t = "v", n = 33, text = "And Rachel bare a son in the night, and called his name \"Son of my sorrow\"; for she suffered in giving him birth: but his father called his name Benjamin, on the eleventh of the eighth month in the first of the sixth week of this jubilee." },
  { t = "v", n = 34, text = "And Rachel died there and she was buried in the land of Ephrath, the same is Bethlehem, and Jacob built a pillar on the grave of Rachel, on the road above her grave." },
]

[[section]]
id = "33"
title = "Chapter 33"
level = 1
blocks = [
  { t = "h", level = 3, text = "Reuben's Sin with Bilhah. Laws regarding Incest. Jacob's Children (xxxiii. 1-23; Cf. Gen. xxxv. 21-27)." },
  { t = "v", n = 1, text = "And Jacob went and dwelt to the south of Magdalâdrâ’êf. And he went to his father Isaac, he and Leah his wife, on the new moon of the tenth month." },
  { t = "v", n = 2, text = "And Reuben saw Bilhah, Rachel's maid, the concubine of his father, bathing in water in a secret place, and he loved her." },
  { t = "v", n = 3, text = "And he hid himself at night, and he entered the house of Bilhah [at night], and he found her sleeping alone on a bed in her house." },
  { t = "v", n = 4, text = "And he lay with her, and she awoke and saw, and behold Reuben was lying with her in the bed, and she uncovered the border of her covering and seized him, and cried out, and discovered that it was Reuben." },
  { t = "v", n = 5, text = "And she was ashamed because of him, and released her hand from him, and he fled." },
  { t = "v", n = 6, text = "And she lamented because of this thing exceedingly, and did not tell it to any one." },
  { t = "v", n = 7, text = "And when Jacob returned and sought her, she said unto him: \"I am not clean for thee, for I have been defiled as regards thee; for Reuben hath defiled me, and hath lain with me in the night, and I was asleep, and did not discover until he uncovered my skirt and slept with me.\"" },
  { t = "v", n = 8, text = "And Jacob was exceedingly wroth with Reuben because he had lain with Bilhah, because he had uncovered his father's skirt." },
  { t = "v", n = 9, text = "And Jacob did not approach her again because Reuben had defiled her. And as for any man who uncovereth his father's skirt his deed is wicked exceedingly, for he is abominable before the Lord." },
  { t = "v", n = 10, text = "For this reason it is written and ordained on the heavenly tables that a man should not lie with his father's wife, and should not uncover his father's skirt, for this is unclean: they shall surely die together, the man who lieth with his father's wife and the woman also, for they have wrought uncleanness on the earth." },
  { t = "v", n = 11, text = "And there shall be nothing unclean before our God in the nation which He hath chosen for Himself as a possession." },
  { t = "v", n = 12, text = "And again, it is written a second time: \"Cursed he be who lieth with the wife of his father, for he hath uncovered his father's shame\"; and all the holy ones of the Lord said \"So be it; so be it.\"" },
  { t = "v", n = 13, text = "And do thou, Moses, command the children of Israel that they observe this word; for it (entaileth) a punishment of death; and it is unclean, and there is no atonement for ever to atone for the man who hath committed this, but he is to be put to death and slain, and stoned with stones, and rooted out from the midst of the people of our God." },
  { t = "v", n = 14, text = "For to no man who doeth so in Israel is it permitted to remain alive a single day on the earth, for he is abominable and unclean." },
  { t = "v", n = 15, text = "And let them not say: to Reuben was granted life and forgiveness after he had lain with his father's concubine, and to her also though she had a husband, and her husband Jacob, his father, was still alive." },
  { t = "v", n = 16, text = "For until that time there had not been revealed the ordinance and judgment and law in its completeness for all, but in thy days (it hath been revealed) as a law of seasons and of days, and an everlasting law for the everlasting generations." },
  { t = "v", n = 17, text = "And for this law there is no consummation of days, and no atonement for it, but they must both be rooted out in the midst of the nation: on the day whereon they committed it they shall slay them." },
  { t = "v", n = 18, text = "And do thou, Moses, write (it) down for Israel that they may observe it, and do according to these words, and not commit a sin unto death; for the Lord our God is judge, who respecteth not persons and accepteth not gifts." },
  { t = "v", n = 19, text = "And tell them these words of the covenant, that they may hear and observe, and be on their guard with respect to them, and not be destroyed and rooted out of the land; for an uncleanness, and an abomination, and a contamination, and a pollution are all they who commit it on the earth before our God." },
  { t = "v", n = 20, text = "And there is no greater sin than the fornication which they commit on earth; for Israel is a holy nation unto the Lord its God, and a nation of inheritance, and a priestly and royal nation and for (His own) possession; and there shall no such uncleanness appear in the midst of the holy nation." },
  { t = "v", n = 21, text = "And in the third year of this sixth week Jacob and all his sons went and dwelt in the house of Abraham, near Isaac his father and Rebecca his mother." },
  { t = "v", n = 22, text = "And these were the names of the sons of Jacob: the first-born Reuben, Simeon, Levi, Judah, Issachar, Zebulon, the sons of Leah; and the sons of Rachel, Joseph and Benjamin; and the sons of Bilhah, Dan and Naphtali, and the sons of Zilpah, Gad and Asher; and Dinah, the daughter of Leah, the only daughter of Jacob." },
  { t = "v", n = 23, text = "And they came and bowed themselves to Isaac and Rebecca, and when they saw them they blessed Jacob and all his sons, and Isaac rejoiced exceedingly, for he saw the sons of Jacob, his younger son, and he blessed them." },
]

[[section]]
id = "34"
title = "Chapter 34"
level = 1
blocks = [
  { t = "h", level = 3, text = "War of the Amorite Kings against Jacob and his Sons. Joseph sold into Egypt (cf. Gen. xxxvii.). The Death of Bilhah and Dinah (xxxiv. 1-19)." },
  { t = "v", n = 1, text = "And in the sixth year of this week of this forty-fourth jubilee Jacob sent his sons to pasture their sheep, and his servants with them, to the pastures of Shechem." },
  { t = "v", n = 2, text = "And the seven kings of the Amorites assembled themselves together against them, to slay them, hiding themselves under the trees, and to take their cattle as a prey." },
  { t = "v", n = 3, text = "And Jacob and Levi and Judah and Joseph were in the house with Isaac their father; for his spirit was sorrowful, and they could not leave him: and Benjamin was the youngest, and for this reason remained with his father." },
  { t = "v", n = 4, text = "And there came the king[s] of Tâphû, and the king[s] of †’Arêsa,† and the king[s] of Sêragân, and the king[s] of Sêlô, and the king[s] of Gâ’as, and the king of Bêthôrôn, and the king of †Ma’anîsâkîr,† and all those who dwell in these mountains (and) who dwell in the woods in the land of Canaan." },
  { t = "v", n = 5, text = "And they announced this to Jacob saying: \"Behold, the kings of the Amorites have surrounded thy sons, and plundered their herds.\"" },
  { t = "v", n = 6, text = "And he arose from his housel he and his three sons and all the servants of his father, and his own servants, and he went against them with six thousand men, who carried swords." },
  { t = "v", n = 7, text = "And he slew them in the pastures of Shechem, and pursued those who fled, and he slew them with the edge of the sword, and he slew †’Arêsa † and Tâphû and Sarêgân and Sêlô and †’Amânîsakîr† and Gâ[gâ]’as, and he recovered his herds." },
  { t = "v", n = 8, text = "And he prevailed over them, and imposed tribute on them that they should pay him tribute, five fruit products of their land, and he built Rôbêl and Tamnâtârês" },
  { t = "v", n = 9, text = "And he returned in peace, and made peace with them, and they became his servants, until the day that he and his sons went down into Egypt." },
  { t = "v", n = 10, text = "And in the seventh year of this week he sent Joseph to learn about the welfare of his brothers from his house to the land of Shechem, and he found them in the land of Dothan." },
  { t = "v", n = 11, text = "And they dealt treacherously with him, and formed a plot against him to slay him, but changing their minds, they sold him to Ishmaelite merchants, and they brought him down into Egypt, and they sold him to Potiphar, the eunuch of Pharaoh, the chief of the cooks, priest of the city of ’Êlêw." },
  { t = "v", n = 12, text = "And the sons of Jacob slaughtered a kid, and dipped the coat of Joseph in the blood, and sent (it) to Jacob their father on the tenth of the seventh month." },
  { t = "v", n = 13, text = "And he mourned all that night, for they had brought it to him in the evening, and he became feverish with mourning for his death, and he said: \"An evil beast hath devoured Joseph\"; and all the members of his house [mourned with him that day, and they] were grieving and mourning with him all that day." },
  { t = "v", n = 14, text = "And his sons and his daughter rose up to comfort him, but he refused to be comforted for his son." },
  { t = "v", n = 15, text = "And on that day Bilhah heard that Joseph had perished, and she died mourning him, and she was living in †Qafrâtêf† and Dinah also, his daughter, died after Joseph had perished. And there came these three mournings upon Israel in one month." },
  { t = "v", n = 16, text = "And they buried Bilhah over against the tomb of Rachel, and Dinah also, his daughter, they buried there." },
  { t = "v", n = 17, text = "And he mourned for Joseph one year, and did not cease, for he said \"Let me go down to the grave mourning for my son.\"" },
  { t = "v", n = 18, text = "For this reason it is ordained for the children of Israel that they should afflict themselves on the tenth of the seventh month—on the day that the news which made him weep for Joseph came to Jacob his father—that they should make atonement for themselves thereon with a young goat on the tenth of the seventh month, once a year, for their sins; for they had grieved the affection of their father regarding Joseph his son." },
  { t = "v", n = 19, text = "And this day hath been ordained that they should grieve thereon for their sins, and for all their transgressions and for all their errors, so that they might cleanse themselves on that day once a year." },
  { t = "h", level = 3, text = "The Wives of Jacob's Sons (xxxiv. 20-21)." },
  { t = "v", n = 20, text = "And after Joseph perished, the sons of Jacob took unto themselves wives. The name of Reuben's wife is ’Adâ and the name of Simeon's wife is ’Adîbâ’a, a Canaanite; and the name of Levi's wife is Mêlkâ, of the daughters of Aram, of the seed of the sons of Terah; and the name of Judah's wife, Bêtasû’êl, a Canaanite; and the name of Issachar's wife, Hêzaqâ; and the name of Zebulon's wife, †Nî’îmân†; and the name of Dan's wife, ’Êglâ; and the name of Naphtali's wife, Rasû’û, of Mesopotamia; and the name of Gad's wife, Mâka; and the name of Asher's wife, ’Îjônâ; and the name of Joseph's wife, Asenath, the Egyptian; and the name of Benjamin's wife, ’Îjasaka." },
  { t = "v", n = 21, text = "And Simeon repented, and took a second wife from Mesopotamia as his brothers." },
]

[[section]]
id = "35"
title = "Chapter 35"
level = 1
blocks = [
  { t = "h", level = 3, text = "Rebecca's Last Admonitions and Death (xxxv. 1-27)." },
  { t = "v", n = 1, text = "And in the first year of the first week of the forty-fifth jubilee Rebecca called Jacob, her son, and commanded him regarding his father and regarding his brother, that he should honour them all the days of his life." },
  { t = "v", n = 2, text = "And Jacob said: \"I will do everything as thou hast commanded me; for this thing will be honour and greatness to me, and righteousness before the Lord, that I should honour them." },
  { t = "v", n = 3, text = "And thou too, mother, knowest from the time I was born until this day, all my deeds and all that is in my heart, that I always think good concerning all." },
  { t = "v", n = 4, text = "And how should I not do this thing which thou hast commanded me, that I should honour my father and my brother!" },
  { t = "v", n = 5, text = "Tell me, mother, what perversity hast thou seen in me and I shall turn away from it, and mercy will be upon me.\"" },
  { t = "v", n = 6, text = "And she said unto him: \"My son, I have not seen in thee all my days any perverse but (only) upright deeds. And yet I shall tell thee the truth, my son: I shall die this, year, and I shall not survive this year in my life; for I have seen in a dream the day of my death, that I should not live beyond a hundred and fifty-five years: and behold I have completed all the days of my life which I am to live.\"" },
  { t = "v", n = 7, text = "And Jacob laughed at the words of his mother, because his mother had said unto him that she should die; and she was sitting opposite to him in possession of her strength, and she was not infirm in her strength; for she went in and out and saw, and her teeth were strong, and no ailment had touched her all the days of her life." },
  { t = "v", n = 8, text = "And Jacob said unto her: \"Blessed am I, mother, if my days approach the days of thy life, and my strength remain with me thus as thy strength: and thou wilt not die, for thou art jesting idly with me regarding thy death.\"" },
  { t = "v", n = 9, text = "And she went in to Isaac and said unto him: \"One petition I make unto thee: make Esau swear that he will not injure Jacob, nor pursue him with enmity; for thou knowest Esau's thoughts that they are perverse from his youth, and there is no goodness in him; for he desireth after thy death to kill him." },
  { t = "v", n = 10, text = "And thou knowest all that he hath done since the day Jacob his brother went to Haran until this day; how he hath forsaken us with his whole heart, and hath done evil to us; thy flocks he hath taken to himself, and carried off all thy possessions from before thy face." },
  { t = "v", n = 11, text = "And when we implored and besought him for what was our own, he did as a man who was taking pity on us." },
  { t = "v", n = 12, text = "And he is bitter against thee because thou didst bless Jacob thy perfect and upright son; for there is no evil but only goodness in him, and since he came from Haran unto this day he hath not robbed us of aught, for he bringeth us everything in its season always, and rejoiceth with all his heart when we take at his hands, and he blesseth us, and hath not parted from us since he came from Haran until this day, and he remaineth with us continually at home honouring us.\"" },
  { t = "v", n = 13, text = "And Isaac said unto her: \"I, too, know and see the deeds of Jacob who is with us, how that with all his heart he honoureth us; but I loved Esau formerly more than Jacob, because he was the first-born; but now I love Jacob more than Esau, for he hath done manifold evil deeds, and there is no righteousness in him, for all his ways are unrighteousness and violence, [and there is no righteousness around him]." },
  { t = "v", n = 14, text = "And now my heart is troubled because of all his deeds, and neither he nor his seed is to be saved, for they are those who will be destroyed from the earth, and who will be rooted out from under heaven, for he hath forsaken the God of Abraham and gone after his wives and after their uncleanness and after their error, he and his children." },
  { t = "v", n = 15, text = "And thou dost bid me make him swear that he will not slay Jacob, his brother; even if he swear he will not abide by his oath, and he will not do good but evil only." },
  { t = "v", n = 16, text = "But if he desireth to slay Jacob, his brother, into Jacob's hands will he be given, and he will not escape from his hands, [for he will descend into his hands.]" },
  { t = "v", n = 17, text = "And fear thou not on account of Jacob; for the guardian of Jacob is great and powerful and honoured, and praised more than the guardian of Esau.\"" },
  { t = "v", n = 18, text = "And Rebecca sent and called Esau, and he came to her, and she said unto him: \"I have a petition, my son, to make unto thee, and do thou promise to do it, my son.\"" },
  { t = "v", n = 19, text = "And he said: \"I will do everything that thou sayest unto me, and I will not refuse thy petition.\"" },
  { t = "v", n = 20, text = "And she said unto him: \"I ask you that the day I die, thou wilt take me in and bury me near Sarah, thy father's mother, and that thou and Jacob will love each other, and that neither will desire evil against the other, but mutual love only, and (so) ye will prosper, my sons, and be honoured in the midst of the land, and no enemy will rejoice over you, and ye will be a blessing and a mercy in the eyes of all those that love you.\"" },
  { t = "v", n = 21, text = "And he said: \"I will do all that thou hast told me, and I shall bury thee on the day thou diest near Sarah, my father's mother, as thou hast desired that her bones may be near thy bones." },
  { t = "v", n = 22, text = "And Jacob, my brother, also, I shall love above all flesh; for I have not a brother in all the earth but him only: and this is no great merit for me if I love him; for he is my brother, and we were sown together in thy body, and together came we forth from thy womb, and if I do not love my brother, whom shall I love?" },
  { t = "v", n = 23, text = "And I, myself, beg thee to exhort Jacob concerning me and concerning my sons, for I know that he will assuredly be king over me and my sons, for on the day my father blessed him he made him the higher and me the lower." },
  { t = "v", n = 24, text = "And I swear unto thee that I shall love him, and not desire evil against him all the days of my life but good only.\" And he sware unto her regarding all this matter." },
  { t = "v", n = 25, text = "And she called Jacob before the eyes of Esau, and gave him commandment according to the words which she had spoken to Esau." },
  { t = "v", n = 26, text = "And he said: \"I shall do thy pleasure; believe me that no evil will proceed from me or from my sons against Esau, and I shall be first in naught save in love only.\"" },
  { t = "v", n = 27, text = "And they ate and drank, she and her sons that night, and she died, three jubilees and one week and one year old, on that night, and her two sons, Esau and Jacob, buried her in the double cave near Sarah, their father's mother." },
]

[[section]]
id = "36"
title = "Chapter 36"
level = 1
blocks = [
  { t = "h", level = 3, text = "Isaac's Last Words and Admonitions: his Death. The Death of Leah (xxxvi. 1-24)." },
  { t = "v", n = 1, text = "And in the sixth year of this week Isaac called his two sons, Esau and Jacob, and they came to him, and he said unto them: \"My sons, I am going the way of my fathers, to the eternal house where my fathers are." },
  { t = "v", n = 2, text = "Wherefore bury me near Abraham my father, in the double cave in the field of Ephron the Hittite, where Abraham purchased a sepulchre to bury in; in the sepulchre which I digged for myself, there bury me." },
  { t = "v", n = 3, text = "And this I command you, my sons, that ye practise righteousness and uprightness on the earth, so that the Lord may bring upon you all that the Lord said that he would do to Abraham and to his seed." },
  { t = "v", n = 4, text = "And love one another, my sons, your brothers as a man who loveth his own soul, and let each seek in what he may benefit his brother, and act together on the earth; and let them love each other as their own souls." },
  { t = "v", n = 5, text = "And concerning the question of idols, I command and admonish you to reject them and hate them, and love them not; for they are full of deception for those that worship them and for those that bow down to them." },
  { t = "v", n = 6, text = "Remember ye, my sons, the Lord God of Abraham your father, and how I too worshipped Him and served Him in righteousness and in joy, that He might multiply you and increase your seed as the stars of heaven in multitude, and establish you on the earth as the plant of righteousness which will not be rooted out unto all the generations for ever." },
  { t = "v", n = 7, text = "And now I shall make you swear a great oath—for there is no oath which is greater than it by the name glorious and honoured and great and splendid and wonderful and mighty, which created the heavens and the earth and all things together—that ye will fear Him and worship Him." },
  { t = "v", n = 8, text = "And that each will love his brother with affection and righteousness, and that neither will desire evil against his brother from henceforth for ever all the days of your life, so that ye may prosper in all your deeds and not be destroyed." },
  { t = "v", n = 9, text = "And if either of you deviseth evil against his brother, know that from henceforth every one that deviseth evil against his brother will fall into his hand, and will be rooted out of the land of the living, and his seed will be destroyed from under heaven." },
  { t = "v", n = 10, text = "But on the day of turbulence and execration and indignation and anger, with flaming devouring fire as He burnt Sodom, so likewise will He burn his land and his city and all that is his, and he will be blotted out of the book of the discipline of the children of men, and not be recorded in the book of life, but in that which is appointed to destruction, and he will depart into eternal execration; so that their condemnation may be always renewed in hate and in execration and in wrath and in torment and in indignation and in plagues and in disease for ever." },
  { t = "v", n = 11, text = "I say and testify to you, my sons, according to the judgment which will come upon the man who wisheth to injure his brother.\"" },
  { t = "v", n = 12, text = "And he divided all his possessions between the two on that day, and he gave the larger portion to him that was the first-born, and the tower and all that was about it, and all that Abraham possessed at the Well of the Oath." },
  { t = "v", n = 13, text = "And he said, \"This larger portion I shall give to the first-born.\"" },
  { t = "v", n = 14, text = "And Esau said, \"I have sold to Jacob and given my birthright to Jacob; to him let it be given, and I have not a single word to say regarding it, for it is his.\"" },
  { t = "v", n = 15, text = "And Isaac said, \"May a blessing rest upon you, my sons, and upon your seed this day, for ye have given me rest, and my heart is not pained concerning the birthright, lest thou shouldest work wickedness on account of it." },
  { t = "v", n = 16, text = "May the Most High God bless the man that worketh righteousness, him and his seed for ever.\"" },
  { t = "v", n = 17, text = "And he ended commanding them and blessing them, and they ate and drank together before him, and he rejoiced because there was one mind between them, and they went forth from him and rested that day and slept." },
  { t = "v", n = 18, text = "And Isaac slept on his bed that day rejoicing; and he slept the eternal sleep, and died one hundred and eighty years old. He completed twenty-five weeks and five years; and his two sons Esau and Jacob buried him." },
  { t = "v", n = 19, text = "And Esau went to the land of Edom, to the mountains of Seir, and dwelt there." },
  { t = "v", n = 20, text = "And Jacob dwelt in the mountains of Hebron, in the tower of the land of the sojournings of his father Abraham, and he worshipped the Lord with all his heart and according to the visible commands according as He had divided the days of his generations." },
  { t = "v", n = 21, text = "And Leah his wife died in the fourth year of the second week of the forty-fifth jubilee, and he buried her in the double cave near Rebecca his mother, to the left of the grave of Sarah, his father's mother." },
  { t = "v", n = 22, text = "And all her sons and his sons came to mourn over Leah his wife with him, and to comfort him regarding her, for he was lamenting her." },
  { t = "v", n = 23, text = "For he loved her exceedingly after Rachel her sister died; for she was perfect and upright in all her ways and honoured Jacob, and all the days that she lived with him he did not hear from her mouth a harsh word, for she was gentle and peaceable and upright and honourable." },
  { t = "v", n = 24, text = "And he remembered all her deeds which she had done during her life, and he lamented her exceedingly; for he loved her with all his heart and with all his soul." },
]

[[section]]
id = "37"
title = "Chapter 37"
level = 1
blocks = [
  { t = "h", level = 3, text = "Esau and his Sons wage War with Jacob (xxxvii. 1-25)." },
  { t = "v", n = 1, text = "And on the day that Isaac the father of Jacob and Esau died, the sons of Esau heard that Isaac had given the portion of the elder to his younger son Jacob and they were very angry." },
  { t = "v", n = 2, text = "And they strove with their father, saying: \"Why hath thy father given Jacob the portion of the elder and passed over thee, although thou art the elder and Jacob the younger?\"" },
  { t = "v", n = 3, text = "And he said unto them \"Because I sold my birthright to Jacob for a small mess of lentils; and on the day my father sent me to hunt and catch and bring him something that he should eat and bless me, he came with guile and brought my father food and drink, and my father blessed him and put me under his hand." },
  { t = "v", n = 4, text = "And now our father hath caused us to swear, me and him, that we shall not mutually devise evil, either against his brother, and that we shall continue in love and in peace each with his brother and not make our ways corrupt.\"" },
  { t = "v", n = 5, text = "And they said unto him, \"We shall not hearken unto thee to make peace with him; for our strength is greater than his strength, and we are more powerful than he; we shall go against him and slay him, and destroy him and his sons. And if thou wilt not go with us, we shall do hurt to thee also." },
  { t = "v", n = 6, text = "And now hearken unto us: Let us send to Aram and Philistia and Moab and Ammon, and let us choose for ourselves chosen men who are ardent for battle, and let us go against him and do battle with him, and let us exterminate him from the earth before he groweth strong.\"" },
  { t = "v", n = 7, text = "And their father said unto them, \"Do not go and do not make war with him lest ye fall before him.\"" },
  { t = "v", n = 8, text = "And they said unto him, \"This too, is exactly thy mode of action from thy youth until this day, and thou art putting thy neck under his yoke. We shall not hearken to these words.\"" },
  { t = "v", n = 9, text = "And they sent to Aram, and to ’Adurâm to the friend of their father, and they hired along with them one thousand fighting men, chosen men of war." },
  { t = "v", n = 10, text = "And there came to them from Moab and from the children of Ammon, those who were hired, one thousand chosen men, and from Philistia, one thousand chosen men of war, and from Edom and from the Horites one thousand chosen fighting men, and from the Kittim mighty men of war." },
  { t = "v", n = 11, text = "And they said unto their father: \"Go forth with them and lead them, else we shall slay thee.\"" },
  { t = "v", n = 12, text = "And he was filled with wrath and indignation on seeing that his sons were forcing him to go before (them) to lead them against Jacob his brother." },
  { t = "v", n = 13, text = "But afterward he remembered all the evil which lay hidden in his heart against Jacob his brother; and he remembered not the oath which he had sworn to his father and to his mother that he would devise no evil all his days against Jacob his brother." },
  { t = "v", n = 14, text = "And notwithstanding all this, Jacob knew not that they were coming against him to battle, and he was mourning for Leah, his wife, until they approached very near to the tower with four thousand warriors and chosen men of war." },
  { t = "v", n = 15, text = "And the men of Hebron sent to him saying, \"Behold thy brother hath come against thee, to fight thee, with four thousand girt with the sword, and they carry shields and weapons\"; for they loved Jacob more than Esau. So they told him; for Jacob was a more liberal and merciful man than Esau." },
  { t = "v", n = 16, text = "But Jacob would not believe until they came very near to the tower." },
  { t = "v", n = 17, text = "And he closed the gates of the tower; and he stood on the battlements and spake to his brother Esau and said, \"Noble is the comfort wherewith thou hast come to comfort me for my wife who hath died. Is this the oath that thou didst swear to thy father and again to thy mother before they died? Thou hast broken the oath, and on the moment that thou didst swear to thy father wast thou condemned.\"" },
  { t = "v", n = 18, text = "And then Esau answered and said unto him, \"Neither the children of men nor the beasts of the earth have any oath of righteousness which in swearing they have sworn (an oath valid) for ever; but every day they devise evil one against another, and how each may slay his adversary and foe." },
  { t = "v", n = 19, text = "And thou dost hate me and my children for ever. And there is no observing the tie of brotherhood with thee." },
  { t = "v", n = 20, indent = 1, text = "Hear these words which I declare unto thee, If the boar can change its skin and make its bristles as soft as wool," },
  { t = "v", n = 20, indent = 1, cont = true, text = "Or if it can cause horns to sprout forth on its head like the horns of a stag or of a sheep," },
  { t = "v", n = 20, indent = 1, cont = true, text = "Then shall I observe the tie of brotherhood with thee." },
  { t = "v", n = 20, indent = 1, cont = true, text = "[And if the breasts separated themselves from their mother; for thou hast not been a brother to me.]" },
  { t = "v", n = 21, indent = 1, text = "And if the wolves make peace with the lambs so as not to devour or do them violence," },
  { t = "v", n = 21, indent = 1, cont = true, text = "And if their hearts are towards them for good," },
  { t = "v", n = 21, indent = 1, cont = true, text = "Then there will be peace in my heart towards thee." },
  { t = "v", n = 22, indent = 1, text = "And if the lion becometh the friend of the ox and maketh peace with him," },
  { t = "v", n = 22, indent = 1, cont = true, text = "And if he is bound under one yoke with him and plougheth with him," },
  { t = "v", n = 22, indent = 1, cont = true, text = "Then shall I make peace with thee." },
  { t = "v", n = 23, indent = 1, text = "And when the raven becometh white as the râzâ," },
  { t = "v", n = 23, indent = 1, cont = true, text = "Then know that -I have loved thee" },
  { t = "v", n = 23, indent = 1, cont = true, text = "And shall make peace with thee." },
  { t = "v", n = 23, indent = 1, cont = true, text = "Thou shalt be rooted out," },
  { t = "v", n = 23, indent = 1, cont = true, text = "And thy sons shall be rooted out," },
  { t = "v", n = 23, indent = 1, cont = true, text = "And there shall be no peace for thee.\"" },
  { t = "v", n = 24, text = "And when Jacob saw that he was (so) evilly disposed towards him with his heart, and with all his soul as to slay him, and that he had come springing like the wild boar which cometh upon the spear that pierceth and killeth it, and recoileth not from it;" },
  { t = "v", n = 25, text = "Then he spake to his own and to his servants that they should attack him and all his companions." },
]

[[section]]
id = "38"
title = "Chapter 38"
level = 1
blocks = [
  { t = "h", level = 3, text = "The War between Jacob and Esau at the Tower of Hebron. The Death of Esau and Overthrow of his Forces (xxxviii. 1-4)." },
  { t = "v", n = 1, text = "And after that Judah spake to Jacob, his father, and said unto him: \"Bend thy bow, father, and send forth thy arrows and cast down the adversary and slay the enemy; and mayest thou have the power, for we shall not slay thy brother, for he is such as thou, and he is like thee: let us give him (this) honour.\"" },
  { t = "v", n = 2, text = "Then Jacob bent his bow and sent forth the arrow and struck Esau, his brother, (on his right breast) and slew him." },
  { t = "v", n = 3, text = "And again he sent forth an arrow and struck ’Adôrân the Aramaean, on the left breast, and drove him backward and slew him." },
  { t = "v", n = 4, text = "And then went forth the sons of Jacob, they and their servants, dividing themselves into companies on the four sides of the tower." },
  { t = "v", n = 5, text = "And Judah went forth in front, and Naphtali and Gad with him and fifty servants with him on the south side of the tower, and they slew all they found before them, and not one individual of them escaped." },
  { t = "v", n = 6, text = "And Levi and Dan and Asher went forth on the east side of the tower, and fifty (men) with them, and they slew the fighting men of Moab and Ammon." },
  { t = "v", n = 7, text = "And Reuben and Issachar and Zebulon went forth on the north side of the tower, and fifty men with them, and they slew the fighting men of the Philistines." },
  { t = "v", n = 8, text = "And Simeon and Benjamin and Enoch, Reuben's son, went forth on the west side of the tower, and fifty (men) with them, and they slew of Edom and of the Horites four hundred men, stout warriors; and six hundred fled, and four of the sons of Esau fled with them, and left their father lying slain, as he had fallen on the hill which is in ’Adûrâm." },
  { t = "v", n = 9, text = "And the sons of Jacob pursued after them to the mountains of Seir. And Jacob buried his brother on the hill which is in ’Adûrâm, and he returned to his house." },
  { t = "v", n = 10, text = "And the sons of Jacob pressed hard upon the sons of Esau in the mountains of Seir, and bowed their necks so that they became servants of the sons of Jacob." },
  { t = "v", n = 11, text = "And they sent to their father (to inquire) whether they should make peace with them or slay them." },
  { t = "v", n = 12, text = "And Jacob sent word to his sons that they should make peace, and they made peace with them, and placed the yoke of servitude upon them, so that they paid tribute to Jacob and to his sons always." },
  { t = "v", n = 13, text = "And they continued to pay tribute to Jacob until the day that he went down into Egypt." },
  { t = "v", n = 14, text = "And the sons of Edom have not got quit of the yoke of servitude which the twelve sons of Jacob had imposed on them until this day." },
  { t = "h", level = 3, text = "The Kings of Edom (xxxviii. 15-24; cf. Gen. xxxvi. 31-39)." },
  { t = "v", n = 15, text = "And these are the kings that reigned in Edom before there reigned any king over the children of Israel [until this day] in the land of Edom." },
  { t = "v", n = 16, text = "And Bâlâq, the son of Beor, reigned in Edom, and the name of his city was Danâbâ." },
  { t = "v", n = 17, text = "And Bâlâq died, and Jobab, the son of Zârâ of Bôsêr, reigned in his stead." },
  { t = "v", n = 18, text = "And Jobab died, and ’Asâm, of the land of Têmân, reigned in his stead." },
  { t = "v", n = 19, text = "And ’Asâm died, and ’Adâth, the son of Barad, who slew Midian in the field of Moab, reigned in his stead, and the name of his city was Avith." },
  { t = "v", n = 20, text = "And ’Adâth died, and Salman, from ’Amâsêqâ, reigned in his stead." },
  { t = "v", n = 21, text = "And Salman died, and Saul of Râ’abôth (by the) river, reigned in his stead." },
  { t = "v", n = 22, text = "And Saul died, and Ba’êlûnân, the son of Achbor, reigned in his stead." },
  { t = "v", n = 23, text = "And Ba’êlûnân, the son of Achbor, died, and ’Adâth reigned in his stead, and the name of his wife was Maiṭabîth, the daughter of Mâṭarat, the daughter of Mêtabêdzâ’ab." },
  { t = "v", n = 24, text = "These are the kings who reigned in the land of Edom." },
]

[[section]]
id = "39"
title = "Chapter 39"
level = 1
blocks = [
  { t = "h", level = 3, text = "Joseph's Service with Potiphar; his Purity and Imprisonment (xxxix. 1-13; cf. Gen. xxxix.)." },
  { t = "v", n = 1, text = "And Jacob dwelt in the land of his father's sojournings in the land of Canaan." },
  { t = "v", n = 2, text = "These are the generations of Jacob. And Joseph was seventeen years old when they took him down into the land of Egypt, and Potiphar, an eunuch of Pharaoh, the chief cook bought him." },
  { t = "v", n = 3, text = "And he set Joseph over all his house, and the blessing of the Lord came upon the house of the Egyptian on account of Joseph, and the Lord prospered him in all that he did." },
  { t = "v", n = 4, text = "And the Egyptian committed everything into the hands of Joseph; for he saw that the Lord was with him, and that the Lord prospered him in all that he did." },
  { t = "v", n = 5, text = "And Joseph's appearance was comely and very beautiful was his appearance, and his master's wife lifted up her eyes and saw Joseph, and she loved him, and besought him to lie with her." },
  { t = "v", n = 6, text = "But he did not surrender his soul, and he remembered the Lord and the words which Jacob, his father, used to read from amongst the words of Abraham, that no man should commit fornication with a woman who hath a husband; that for him the punishment of death hath been ordained in the heavens before the Most High God, and the sin will be recorded against him in the eternal books continually before the Lord." },
  { t = "v", n = 7, text = "And Joseph remembered these words and refused to lie with her." },
  { t = "v", n = 8, text = "And she besought him for a year, but he refused and would not listen." },
  { t = "v", n = 9, text = "But she embraced him and held him fast in the house in order to force him to lie with her, and closed the doors of the house and held him fast; but he left his garment in her hands and broke through the door and fled without from her presence." },
  { t = "v", n = 10, text = "And the woman saw that he would not lie with her, and she calumniated him in the presence of his lord, saying: \"Thy Hebrew servant, whom thou lovest, sought to force me so that he might lie with me; and it came to pass when I lifted up my voice that he fled and left his garment in my hands when I held him, and he brake through the door.\"" },
  { t = "v", n = 11, text = "And the Egyptian saw the garment of Joseph and the broken door, and heard the words of his wife, and cast Joseph into prison into the place where the prisoners were kept whom the king imprisoned." },
  { t = "v", n = 12, text = "And he was there in the prison; and the Lord gave Joseph favour in the sight of the chief of the prison guards and compassion before him, for he saw that the Lord was with him, and that the Lord made all that he did to prosper." },
  { t = "v", n = 13, text = "And he committed all things into his hands, and the chief of -the prison guards knew of nothing that was with him, for Joseph did everything, and the Lord perfected it." },
  { t = "h", level = 3, text = "Joseph interprets the Dreams of the Chief Butler and the Chief Baker (xxxix. 14-18; cf. Gen. xl.).," },
  { t = "v", n = 14, text = "And he remained there two years. And in those days Pharaoh, king of Egypt, was wroth against his two eunuchs, against the chief butler and against the chief baker, and he put them in ward in the house of the chief cook, in the prison where Joseph was kept." },
  { t = "v", n = 15, text = "And the chief of the prison guards appointed Joseph to serve them; and he served before them." },
  { t = "v", n = 16, text = "And they both dreamed a dream, the chief butler and the chief baker, and they told it to Joseph." },
  { t = "v", n = 17, text = "And as he interpreted to them so it befell them, and Pharaoh restored the chief butler to his office, and the (chief) baker he slew, as Joseph had interpreted to them." },
  { t = "v", n = 18, text = "But the chief butler forgot Joseph in the prison, although he had informed him what would befall him, and did not remember to inform Pharaoh how Joseph had told him for he forgot." },
]

[[section]]
id = "40"
title = "Chapter 40"
level = 1
blocks = [
  { t = "h", level = 3, text = "Pharaoh's Dreams and their Interpretation. Joseph's Elevation and Marriage (xl. 1-13; cf. Gen. xli.)." },
  { t = "v", n = 1, text = "And in those days Pharaoh dreamed two dreams in one night concerning a famine which was to be in all the land, and he awoke from his sleep and called all the interpreters of dreams that were in Egypt, and magicians, and told them his two dreams, and they were not able to declare (them)." },
  { t = "v", n = 2, text = "And then the chief butler remembered Joseph and spake of him to the king, and he brought him forth from the prison, and he told his two dreams before him." },
  { t = "v", n = 3, text = "And he said before Pharaoh that his two dreams were one, and he said unto him: \"Seven years will come (in which there will be) plenty over all the land of Egypt, and after that seven years of famine, such a famine as hath not been in all the land." },
  { t = "v", n = 4, text = "And now let Pharaoh appoint overseers in all the land of Egypt, and let them store up food in every city throughout the days of the years of plenty, and there will be food for the seven years of famine, and the land will not perish through the famine, for it will be very severe.\"" },
  { t = "v", n = 5, text = "And the Lord gave Joseph favour and mercy in the eyes of Pharaoh, and Pharaoh said unto his servants: \"We shall not find such a wise and discreet man as this man, for the spirit of the Lord is with him.\"" },
  { t = "v", n = 6, text = "And he appointed him the second in all his kingdom and gave him authority over all Egypt, and caused him to ride in the second chariot of Pharaoh." },
  { t = "v", n = 7, text = "And he clothed him with byssus garments, and he put a gold chain upon his neck, and (a herald) proclaimed before him \"’Êl ’Êl wa’ Abîrĕr,\" and he placed a ring on his hand and made him ruler over all his house, and magnified him, and said unto him: \"Only on the throne shall I be greater than thou.\"" },
  { t = "v", n = 8, text = "And Joseph ruled over all the land of Egypt, and all the princes of Pharaoh, and all his servants, and all who did the king's business loved him, for he walked in uprightness, for he was without pride and arrogance, and he had no respect of persons, and did not accept gifts, but he judged in uprightness all the people of the land." },
  { t = "v", n = 9, text = "And the land of Egypt was at peace before Pharaoh because of Joseph, for the Lord was with him, and gave him favour and mercy for all his generations before all those who knew him and those who heard concerning him, and Pharaoh's kingdom was well ordered, and there was no Satan and no evil person (therein)." },
  { t = "v", n = 10, text = "And the king called Joseph's name Sĕphânṭîphâns, and gave Joseph to wife the daughter of Potiphar, the daughter of the priest of Heliopolis, the chief cook." },
  { t = "v", n = 11, text = "And on the day that Joseph stood before Pharaoh he was thirty years old [when he stood before Pharaoh]." },
  { t = "v", n = 12, text = "And in that year Isaac died. And it came to pass as Joseph had said in the interpretation of his two dreams, according as he had said it, there were seven years of plenty over all the land of Egypt, and the land of Egypt produced abundantly, one measure (producing) eighteen hundred measures." },
  { t = "v", n = 13, text = "And Joseph gathered food into every city until they were full of corn until they could no longer count and measure it for its multitude." },
]

[[section]]
id = "41"
title = "Chapter 41"
level = 1
blocks = [
  { t = "h", level = 3, text = "Judah's Incest with Tamar; his Repentance and Forgiveness (xli. 1-28; Cf. Gen. xxxviii.)." },
  { t = "v", n = 1, text = "And in the forty-fifth jubilee, in the second week, (and) in the second year, Judah took for his first-born Er, a wife from the daughters of Aram, named Tamar." },
  { t = "v", n = 2, text = "But he hated, and did not lie with her, because his mother was of the daughters of Canaan, and he wished to take him a wife of the kinsfolk of his mother, but Judah, his father, would not permit him." },
  { t = "v", n = 3, text = "And this Er, the first-born of Judah, was wicked, and the Lord slew him." },
  { t = "v", n = 4, text = "And Judah said unto Onan, his brother: \"Go in unto thy brother's wife and perform the duty of a husband's brother unto her, and raise up seed unto thy brother.\"" },
  { t = "v", n = 5, text = "And Onan knew that the seed would not be his, (but) his brother's only, and he went into the house of his brother's wife, and spilt the seed on the ground, and he was wicked in the eyes of the Lord, and He slew him." },
  { t = "v", n = 6, text = "And Judah said unto Tamar, his daughter-in-law: \"Remain in thy father's house as a widow till Shelah my son be grown up, and I shall give thee to him to wife.\"" },
  { t = "v", n = 7, text = "And he grew up; but Bêdsû’êl, the wife of Judah, did not permit her son Shelah to marry. And Bêdsû’êl, the wife of Judah, died in the fifth year of this week." },
  { t = "v", n = 8, text = "And in the sixth year Judah went up to shear his sheep at Timnah. And they told Tamar: \"Behold thy father-in-law goeth up to Timnah to shear his sheep.\"" },
  { t = "v", n = 9, text = "And she put off her widow's clothes, and put on a veil, and adorned herself, and sat in the gate adjoining the way to Timnah." },
  { t = "v", n = 10, text = "And as Judah was going along he found her, and thought her to be an harlot, and he said unto her: \"Let me come in unto thee\"; and she said unto him: \"Come in,\" and he went in." },
  { t = "v", n = 11, text = "And she said unto him: \"Give me my hire\"; and he said unto her: \"I have nothing in my hand save my ring that is on my finger, and my necklace, and my staff which is in my hand.\"" },
  { t = "v", n = 12, text = "And she said unto him: \"Give them to me until thou dost send me my hire\"; and he said unto her: \"I will send unto thee a kid of the goats\"; and he gave them to her, (and he went in unto her,) and she conceived by him." },
  { t = "v", n = 13, text = "And Judah went unto his sheep, and she went to her father's house." },
  { t = "v", n = 14, text = "And Judah sent a kid of the goats by the hand of his shepherd, an Adullamite, and he found her not; and he asked the people of the place, saying: \"Where is the harlot who was here?\" And they said unto him: \"There is no harlot here with us.\"" },
  { t = "v", n = 15, text = "And he returned and informed him, and said unto him that he had not found her; \"I asked the people of the place, and they said unto me: 'There is no harlot here.'\" And he said: \"Let her keep (them) lest we become a cause of derision.\"" },
  { t = "v", n = 16, text = "And when she had completed three months, it was manifest that she was with child, and they told Judah, saying: \"Behold Tamar, thy daughter-in-law, is with child by whoredom.\"" },
  { t = "v", n = 17, text = "And Judah went to the house of her father, and said unto her father and her brothers: \"Bring her forth, and let them burn her, for she hath wrought uncleanness in Israel.\"" },
  { t = "v", n = 18, text = "And it came to pass when they brought her forth to bum her that she sent to her father-in-law the ring and the necklace, and the staff, saying: \"Discern whose are these, for by him am I with child.\"" },
  { t = "v", n = 19, text = "And Judah acknowledged, and said: \"Tamar is more righteous than I am. And therefore let them burn her not.\"" },
  { t = "v", n = 20, text = "And for that reason she was not given to Shelah, and he did not again approach her." },
  { t = "v", n = 21, text = "And after that she bare two sons, Perez and Zerah, in the seventh year of this second week." },
  { t = "v", n = 22, text = "And thereupon the seven years of fruitfulness were accomplished, of which Joseph spake to Pharaoh." },
  { t = "v", n = 23, text = "And Judah acknowledged that the deed which he had done was evil, for he had lain with his daughter-in-law, and he esteemed it hateful in his eyes, and he acknowledged that he had transgressed and gone astray; for he had uncovered the skirt of his son, and he began to lament and to supplicate before the Lord because of his transgression." },
  { t = "v", n = 24, text = "And we told him in a dream that it was forgiven him because he supplicated earnestly, and lamented, and did not again commit it." },
  { t = "v", n = 25, text = "And he received forgiveness because he turned from his sin and from his ignorance, for he transgressed greatly before our God; and every one that acteth thus, every one who lieth with his mother-in-law, let them burn him with fire that he may bum therein, for there is uncleanness and pollution upon them; with fire let them bum them." },
  { t = "v", n = 26, text = "And do thou command the children of Israel that there be no uncleanness amongst them, for every one who lieth with his daughter-in-law or with his mother-in-law hath wrought uncleanness; with fire let them bum the man who hath lain with her, and likewise the woman, and He will turn away wrath and punishment from Israel." },
  { t = "v", n = 27, text = "And unto Judah we said that his two sons had not lain with her, and for this reason his seed was established for a second generation, and would not be rooted out." },
  { t = "v", n = 28, text = "For in singleness of eye he had gone and sought for punishment, namely, according to the judgment of Abraham, which he had commanded his sons, Judah had sought to burn her with fire." },
]

[[section]]
id = "42"
title = "Chapter 42"
level = 1
blocks = [
  { t = "h", level = 3, text = "The Two Journeys of the Sons of Jacob to Egypt (xlii. 1-25; cf. Gen. xlii., xliii.)." },
  { t = "v", n = 1, text = "And in the first year of the third week of the forty-fifth jubilee the famine began to come into the land, and the rain refused to be given to the earth, for none whatever fell." },
  { t = "v", n = 2, text = "And the earth grew barren, but in the land of Egypt there was food, for Joseph had gathered the seed of the land in the seven years of plenty and had preserved it." },
  { t = "v", n = 3, text = "And the Egyptians came to Joseph that he might give them food, and he opened the storehouses where was the grain of the first year, and he sold it to the people of the land for gold." },
  { t = "v", n = 4, text = "(Now the famine was very sore in the land of Canaan), and Jacob heard that there was food in Egypt, and he sent his ten sons that they should procure food for him in Egypt; but Benjamin he did not send, and (the ten sons of Jacob) arrived (in Egypt) among those that went (there.)" },
  { t = "v", n = 5, text = "And Joseph recognized them, but they did not recognize him, and he spake unto them and questioned them, and he said unto them: \"Are ye not spies, and have ye not come to explore the approaches of the land?\" And he put them in ward." },
  { t = "v", n = 6, text = "And after that he set them free again, and detained Simeon alone and sent off his nine brothers." },
  { t = "v", n = 7, text = "And he filled their sacks with corn, and he put their gold in their sacks, and they did not know." },
  { t = "v", n = 8, text = "And he commanded them to bring their younger brother, for they had told him their father was living and their younger brother." },
  { t = "v", n = 9, text = "And they went up from the land of Egypt and they came to the land of Canaan; and they told their father all that had befallen them, and how the lord of the country had spoken roughly to them, and had seized Simeon till they should bring Benjamin." },
  { t = "v", n = 10, text = "And Jacob said: \"Me have ye bereaved of my children! Joseph is not and Simeon also is not, and ye will take Benjamin away. On me hath your wickedness come.\"" },
  { t = "v", n = 11, text = "And he said: \"My son will not go down with you lest perchance he fall sick; for their mother gave birth to two sons, and one hath perished, and this one also ye will take from me. If perchance he took a fever on the road, ye would bring down my old age with sorrow unto death.\"" },
  { t = "v", n = 12, text = "For he saw that their money had been returned to every man in his sack, and for this reason he feared to send him." },
  { t = "v", n = 13, text = "And the famine increased and became sore in the land of Canaan, and in all lands save in the land of Egypt, for many of the children of the Egyptians had stored up their seed for food from the time when they saw Joseph gathering seed together and putting it in storehouses and preserving it for the years of famine." },
  { t = "v", n = 14, text = "And the people of Egypt fed themselves thereon during the first year of their famine." },
  { t = "v", n = 15, text = "But when Israel saw that the famine was very sore in the land, and there was no deliverance, he said unto his sons: \"Go again, and procure food for us that we die not.\"" },
  { t = "v", n = 16, text = "And they said: \"We shall not go; unless our youngest brother go with us, we shall not go.\"" },
  { t = "v", n = 17, text = "And Israel saw that if he did not send him with them, they should all perish by reason of the famine." },
  { t = "v", n = 18, text = "And Reuben said: \"Give him into my hand, and if I do not bring him back to thee, slay my two sons instead of his soul.\" And he said unto him He will not go with thee.\"" },
  { t = "v", n = 19, text = "And Judah came near and said: \"Send him with me, and if I do not bring him back to thee, let me bear the blame before thee all the days of my life.\"" },
  { t = "v", n = 20, text = "And he sent him with them in the second year of this week on the first day of the month, and they came to the land of Egypt with all those who went, and (they had) presents in their hands, stacte and almonds and terebinth nuts and pure honey." },
  { t = "v", n = 21, text = "And they went and stood before Joseph, and he saw Benjamin his brother, and he knew him, and said unto them: \"Is this your youngest brother?\" And they said unto him: \"It is he.\" And he said: \"The Lord be gracious to thee, my son!\"" },
  { t = "v", n = 22, text = "And he sent him into his house and he brought forth Simeon unto them and he made a feast for them, and they presented to him the gift which they had brought in their hands." },
  { t = "v", n = 23, text = "And they ate before him and he gave them all a portion, but the portion of Benjamin was seven times larger than that of any of theirs." },
  { t = "v", n = 24, text = "And they ate and drank and arose and remained with their asses." },
  { t = "v", n = 25, text = "And Joseph devised a plan whereby he might learn their thoughts as to whether thoughts of peace prevailed amongst them, and he said to the steward who was over his house: \"Fill all their sacks with food, and return their money unto them into their vessels, and my cup, the silver cup out of which I drink, put it in the sack of the youngest, and send them away.\"" },
]

[[section]]
id = "43"
title = "Chapter 43"
level = 1
blocks = [
  { t = "h", level = 3, text = "Joseph finally tests his Brethren, and then makes himself known to them (xliii. 1-24; cf. Gen. xliv., xlv.)." },
  { t = "v", n = 1, text = "And he did as Joseph had told him, and filled all their sacks for them with food and put their money in their sacks, and put the cup in Benjamin's sack." },
  { t = "v", n = 2, text = "And early in the morning they departed, and it came to pass that, when they had gone from thence, Joseph said unto the steward of his house: \"Pursue them, run and seize them, saying, 'For good ye have requited me with evil; you have stolen from me the silver cup out of which my lord drinks.' And bring back to me their youngest brother, and fetch (him) quickly before I go forth to my seat of judgment.\"" },
  { t = "v", n = 3, text = "And he ran after them and said unto them according to these words." },
  { t = "v", n = 4, text = "And they said unto him: \"God forbid that thy servants should do this thing, and steal from the house of thy lord any utensil, and the money also which we found in our sacks the first time, we thy servants brought back from the land of Canaan." },
  { t = "v", n = 5, text = "How then should we steal any utensil? Behold here are we and our sacks; search, and wherever thou findest the cup in the sack of any man amongst us, let him be slain, and we and our asses will serve thy lord.\"" },
  { t = "v", n = 6, text = "And he said unto them: \"Not so, the man with whom I find, him only shall I take as a servant, and ye will return in peace unto your house.\"" },
  { t = "v", n = 7, text = "And as he was searching in their vessels, beginning with the eldest and ending with the youngest, it was found in Benjamin's sack." },
  { t = "v", n = 8, text = "And they rent their garments, and laded their asses, and returned to the city and came to the house of Joseph, and they all bowed themselves on their faces to the ground before him." },
  { t = "v", n = 9, text = "And Joseph said unto them: \"Ye have done evil.\" And they said: \"What shall we say and how shall we defend ourselves? Our lord hath discovered the transgression of his servants; behold we are the servants of our lord, and our asses also.\"" },
  { t = "v", n = 10, text = "And Joseph said unto them: \"I too fear the Lord; as for you, go ye to your homes and let your brother be my servant, for ye have done evil.. Know ye not that a man delighteth in his cup as I with this cup? And yet ye have stolen it from me.\"" },
  { t = "v", n = 11, text = "And Judah said: \"O my lord, let thy servant, I pray thee, speak a word in my lord's ear; two brothers did thy servant's mother bear to our father; one went away and was lost, and hath not been found, and he alone is left of his mother, and thy servant our father loveth him, and his life also is bound up with the life of this (lad)." },
  { t = "v", n = 12, text = "And it will come to pass, when we go to thy servant our father, and the lad is not with us, that he will die, and we shall bring down our father with sorrow unto death." },
  { t = "v", n = 13, text = "Now rather let me, thy servant, abide instead of the boy as a bondsman unto my lord, and let the lad go with his brethren, for I became surety for him at the hand of thy servant our father, and if I do not bring him back, thy servant will bear the blame to our father for ever.\"" },
  { t = "v", n = 14, text = "And Joseph saw that they were all accordant in goodness one with another, and he could not refrain himself, and he told them that he was Joseph." },
  { t = "v", n = 15, text = "And he conversed with them in the Hebrew tongue and fell on their neck and wept. But they knew him not and they began to weep." },
  { t = "v", n = 16, text = "And he said unto them: \"Weep not over me, but hasten and bring my father to me; and ye see that it is my mouth that speaketh and the eyes of my brother Benjamin see." },
  { t = "v", n = 17, text = "For behold this is the second year of the famine, and there are still five years without harvest or fruit of trees or ploughing." },
  { t = "v", n = 18, text = "Come down quickly ye and your households, so that ye perish not through the famine, and do not be grieved for your possessions, for the Lord sent me before you to set things in order that many people might live." },
  { t = "v", n = 19, text = "And tell my father that I am still alive, and ye, behold, ye see that the Lord hath made me as a father to Pharaoh, and ruler over his house and over all the land of Egypt." },
  { t = "v", n = 20, text = "And tell my father of all my glory, and all the riches and glory that the Lord hath given Me.\"" },
  { t = "v", n = 21, text = "And by the command of the mouth of Pharaoh he gave them chariots and provisions for the way, and he gave them all many-coloured raiment and silver." },
  { t = "v", n = 22, text = "And to their father he sent raiment and silver and ten asses which carried com, and he sent them away." },
  { t = "v", n = 23, text = "And they went up and told their father that Joseph was alive, and was measuring out corn to all the nations of the earth, and that he was ruler over all the land of Egypt." },
  { t = "v", n = 24, text = "And their father did not believe it, for he was beside himself in his mind; but when he saw the wagons which Joseph had sent, the life of his spirit revived, and he said: \"It is enough for me if Joseph liveth; I will go down and see him before I die.\"" },
]

[[section]]
id = "44"
title = "Chapter 44"
level = 1
blocks = [
  { t = "h", level = 3, text = "Jacob, celebrates the Feast of First-fruits and journeys to Egypt. List of his Descendants. (xliv. 1-34; cf. Gen. xlvi. 1-28)." },
  { t = "v", n = 1, text = "And Israel took his journey from †Haran† from his house on the new moon of the third month, and he went on the way of the Well of the Oath, and he offered a sacrifice to the God of his father Isaac on the seventh of this month." },
  { t = "v", n = 2, text = "And Jacob remembered the dream that he had seen at Bethel, and he feared to go down into Egypt." },
  { t = "v", n = 3, text = "And while he was thinking of sending word to Joseph to come to him, and that he would not go down, he remained there seven days, if perchance he should see a vision as to whether he should remain or go down." },
  { t = "v", n = 4, text = "And he celebrated the harvest festival of the first-fruits with old grain, for in all the land of Canaan there was not a handful of seed (in the land), for the famine was over all the beasts and cattle and birds, and also over man." },
  { t = "v", n = 5, text = "And on the sixteenth the Lord appeared unto him, and said unto him, \"Jacob, Jacob\"; and he said, \"Here am I.\" And He said unto him: \"I am the God of thy fathers, the God of Abraham and Isaac; fear not to go down into Egypt, for I will there make of thee a great nation." },
  { t = "v", n = 6, text = "I shall go down with thee, and I shall bring thee up (again), and in this land wilt thou be buried, and Joseph will put his hands upon thy eyes. Fear not; go down into Egypt.\"" },
  { t = "v", n = 7, text = "And his sons rose up, and his sons' sons, and they placed their father and their possessions upon wagons." },
  { t = "v", n = 8, text = "And Israel rose up from the Well of the Oath on the sixteenth of this third month, and he went to the land of Egypt." },
  { t = "v", n = 9, text = "And Israel sent Judah before him to his son Joseph to examine the Land of Goshen, for Joseph had told his brothers that they should come and dwell there that they might be near him." },
  { t = "v", n = 10, text = "And this was the goodliest (land) in the land of Egypt, and near to him, for all (of them) and also for the cattle." },
  { t = "v", n = 11, text = "And these are the names of the sons of Jacob who went into Egypt with Jacob their father." },
  { t = "v", n = 12, text = "Reuben, the first-born of Israel; and these are the names of his sons: Enoch, and Pallu, and Hezron and Carmi—five." },
  { t = "v", n = 13, text = "Simeon and his sons; and these are the names of his sons: Jemuel, and Jamin, and Ohad, and Jachin, and Zohar, and Shaul, the son of the Zephathite woman—seven." },
  { t = "v", n = 14, text = "Levi and his sons; and these are the names of his sons: Gershon, and Kohath, and Merari—four." },
  { t = "v", n = 15, text = "Judah and his sons; and these are the names of his sons: Shela, and Perez, and Zerah—four." },
  { t = "v", n = 16, text = "Issachar and his sons; and these are the names of his sons: Tola, and Phûa, and Jâsûb, and Shimron—five." },
  { t = "v", n = 17, text = "Zebulon and his sons; and these are the names of his sons: Sered, and Elon, and Jahleel—four." },
  { t = "v", n = 18, text = "And these are the sons of Jacob, and their sons, whom Leah bore to Jacob in Mesopotamia, six, and their one sister, Dinah: and all the souls of the sons of Leah, and their sons, who went with Jacob their father into Egypt, were twenty-nine, and Jacob their father being with them, they were thirty." },
  { t = "v", n = 19, text = "And the sons of Zilpah, Leah's handmaid, the wife of Jacob, whom she bore unto Jacob, Gad and Asher." },
  { t = "v", n = 20, text = "And these are the names of their sons who went with him into Egypt: the sons of Gad: Ziphion, and Haggi, and Shuni, and Ezbon, (and Eri) and Areli, and Arodi—eight." },
  { t = "v", n = 21, text = "And the sons of Asher: Imnah, and Ishvah, (and Ishvi), and Beriah, and Serah, their one sister—six." },
  { t = "v", n = 22, text = "All the souls were fourteen, and all those of Leah were forty-four." },
  { t = "v", n = 23, text = "And the sons of Rachel, the wife of Jacob: Joseph and Benjamin." },
  { t = "v", n = 24, text = "And there were born to Joseph in Egypt before his father came into Egypt, those whom Asenath, daughter of Potiphar priest of Heliopolis bare unto him, Manasseh, and Ephraim—three." },
  { t = "v", n = 25, text = "And the sons of Benjamin: Bela and Becher, and Ashbel, Gera, and Naaman, and Ehi, and Rosh, and Muppim, and Huppim, and Ard—eleven." },
  { t = "v", n = 26, text = "And all the souls of Rachel were fourteen." },
  { t = "v", n = 27, text = "And the sons of Bilhah, the handmaid of Rachel, the wife of Jacob, whom she bare to Jacob, were Dan and Naphtali." },
  { t = "v", n = 28, text = "And these are the names of their sons who went with them into Egypt. And the sons of Dan were Hushim, and Sâmôn, and Asûdî, and ’Îjâka, and Salômôn—six." },
  { t = "v", n = 29, text = "And they died the year in which they entered into Egypt, and there was left to Dan Hushim alone." },
  { t = "v", n = 30, text = "And these are the names of the sons of Naphtali: Jahziel, and Guni, and Jezer, and Shallum, and ‘Îv." },
  { t = "v", n = 31, text = "And ‘Îv, who was born after the years of famine, died in Egypt." },
  { t = "v", n = 32, text = "And all the souls of Rachel were twenty-six." },
  { t = "v", n = 33, text = "And all the souls of Jacob which went into Egypt were seventy souls. These are his children and his children's children, in all seventy; but five died in Egypt before Joseph, and had no children." },
  { t = "v", n = 34, text = "And in the land of Canaan two sons of Judah died, Er and Onan, and they had no children, and the children of Israel buried those who perished, and they were reckoned among the seventy Gentile nations." },
]

[[section]]
id = "45"
title = "Chapter 45"
level = 1
blocks = [
  { t = "h", level = 3, text = "Joseph receives Jacob. The Land of Egypt is acquired for Pharaoh. Jacob's Death and Burial (xlv. 1-16; cf. Gen. xlvi. 28 ff., xlvii. 11 ff.)." },
  { t = "v", n = 1, text = "And Israel went into the country of Egypt, into the land of Goshen, on the new moon of the fourth month, in the second year of the third week of the forty-fifth jubilee." },
  { t = "v", n = 2, text = "And Joseph went to meet his father Jacob, to the land of Goshen, and he fell on his father's neck and wept." },
  { t = "v", n = 3, text = "And Israel said unto Joseph: \"Now let me die since I have seen thee, and now may the Lord God of Israel be blessed, the God of Abraham and the God of Isaac who hath not withheld His mercy and His grace from His servant Jacob." },
  { t = "v", n = 4, text = "It is enough for me that I have seen thy face whilst †I am† yet alive; yea, true is the vision which I saw at Bethel. Blessed be the Lord my God for ever and ever, and blessed be His name.\"" },
  { t = "v", n = 5, text = "And Joseph and his brothers ate bread before their father and drank wine, and Jacob rejoiced with exceeding great joy because he saw Joseph eating with his brothers and drinking before him, and he blessed the Creator of all things who had preserved him, and had preserved for him his twelve sons." },
  { t = "v", n = 6, text = "And Joseph had given to his father and to his brothers as a gift the right of dwelling in the land of Goshen and in Rameses and all the region round about, which he ruled over before Pharaoh. And Israel and his sons dwelt in the land of Goshen, the best part of the land of Egypt; and Israel was one hundred and thirty years old when he came into Egypt," },
  { t = "v", n = 7, text = "And Joseph nourished his father and his brethren and also their possessions with bread as much as sufficed them for the seven years of the famine." },
  { t = "v", n = 8, text = "And the land of Egypt suffered by reason of the famine, and Joseph acquired all the land of Egypt for Pharaoh in return for food, and he got possession of the people and their cattle and everything for Pharaoh." },
  { t = "v", n = 9, text = "And the years of the famine were accomplished, and Joseph gave to the people in the land seed and food that they might sow (the land) in the eighth year, for the river had overflowed all the land of Egypt." },
  { t = "v", n = 10, text = "For in the seven years of the famine it had not overflowed and had irrigated only a few places on the banks of the river, but now it overflowed and the Egyptians sowed the land, and it bore much corn that year." },
  { t = "v", n = 11, text = "And this was the first year of the fourth week of the forty-fifth jubilee." },
  { t = "v", n = 12, text = "And Joseph took of the corn of the harvest the fifth part for the king and left four parts for them for food and for seed, and Joseph made it an ordinance for the land of Egypt until this day." },
  { t = "v", n = 13, text = "And Israel lived in the land of Egypt seventeen years, and all the days which he lived were three jubilees, one hundred and forty-seven years, and he died in the fourth year of the fifth week of the forty-fifth jubilee." },
  { t = "v", n = 14, text = "And Israel blessed his sons before he died and told them everything that would befall them in the land of Egypt; and he made known to them what would come upon them in the last days, and blessed them and gave to Joseph two portions in the land." },
  { t = "v", n = 15, text = "And he slept with his fathers, and he was buried in the double cave in the land of Canaan, near Abraham his father in the grave which he dug for himself in the double cave in the land of Hebron." },
  { t = "v", n = 16, text = "And he gave all his books and the books of his fathers to Levi his son that he might preserve them and renew them for his children until this day." },
]

[[section]]
id = "46"
title = "Chapter 46"
level = 1
blocks = [
  { t = "h", level = 3, text = "The Death of Joseph. The Bones of Jacob's Sons (except Joseph) interred at Hebron. The Oppression of Israel by Egypt (xlvi. 1-16; cf. Gen. l.; Exod. i.)." },
  { t = "v", n = 1, text = "And it came to pass that after Jacob died the children of Israel multiplied in the land of Egypt, and they became a great nation, and they were of one accord in heart, so that brother loved brother and every man helped his brother, and they increased abundantly and multiplied exceedingly, ten weeks of years, all the days of the life of Joseph." },
  { t = "v", n = 2, text = "And there was no Satan nor any evil all the days of the life of Joseph which he lived after his father Jacob, for all the Egyptians honoured the children of Israel all the days of the life of Joseph." },
  { t = "v", n = 3, text = "And Joseph died being a hundred and ten years old; seventeen years he lived in the land of Canaan, and ten years he was a servant, and three years in prison, and eighty years he was under the king, ruling all the land of Egypt." },
  { t = "v", n = 4, text = "And he died and all his brethren and all that generation." },
  { t = "v", n = 5, text = "And he commanded the children of Israel before he died that they should carry his bones with them when they went forth from the land of Egypt." },
  { t = "v", n = 6, text = "And he made them swear regarding his bones, for he knew that the Egyptians would not again bring forth and bury him in the land of Canaan, for Mâkamârôn, king of Canaan, while dwelling in the land of Assyria, fought in the valley with the king of Egypt and slew him there, and pursued after the Egyptians to the gates of ’Êrmôn." },
  { t = "v", n = 7, text = "But he was not able to enter, for another, a new king, had become king of Egypt, and he was stronger than he, and he returned to the land of Canaan, and the gates of Egypt were closed, and none went out and none came into Egypt." },
  { t = "v", n = 8, text = "And Joseph died in the forty-sixth jubilee, in the sixth week, in the second year, and they buried him in the land of Egypt, and his brethren died after him." },
  { t = "v", n = 9, text = "And the king of Egypt went forth to war with the king of Canaan in the forty-seventh jubilee, in the second week in the second year, and the children of Israel brought forth all the bones of the children of Jacob save the bones of Joseph, and they buried them in the field in the double cave in the mountain." },
  { t = "v", n = 10, text = "And the most (of them) returned to Egypt, but a few of them remained in the mountains of Hebron, and Amram thy father remained with them." },
  { t = "v", n = 11, text = "And the king of Canaan was victorious over the king of Egypt, and he closed the gates of Egypt." },
  { t = "v", n = 12, text = "And he devised an evil device against the children of Israel of afflicting them; and he said unto the people of Egypt:" },
  { t = "v", n = 13, text = "\"Behold the people of the children of Israel have increased and multiplied more than we. Come and let us deal wisely with them before they become too many, and let us afflict them with slavery before war come upon us and before they too fight against us; else they will join themselves unto our enemies and get them up out of our land, for their hearts and faces are towards the land of Canaan.\"" },
  { t = "v", n = 14, text = "And he set over them taskmasters to afflict them with slavery; and they built strong cities for Pharaoh, Pithom and Raamses, and they built all the walls and all the fortifications which had fallen in the cities of Egypt." },
  { t = "v", n = 15, text = "And they made them serve with rigour, and the more they dealt evilly with them, the more they increased and multiplied." },
  { t = "v", n = 16, text = "And the people of Egypt abominated the children of Israel." },
]

[[section]]
id = "47"
title = "Chapter 47"
level = 1
blocks = [
  { t = "h", level = 3, text = "The Birth and Early Years of Moses (xlvii. 1-12; cf. Exod. ii.)." },
  { t = "v", n = 1, text = "And in the seventh week, in the seventh year, in the forty-seventh jubilee, thy father went forth from the land of Canaan, and thou wast born in the fourth week, in the sixth year thereof, in the forty-eighth jubilee; this was the time of tribulation on the children of Israel." },
  { t = "v", n = 2, text = "And Pharaoh, king of Egypt, issued a command regarding them that they should cast all their male children which were born into the river." },
  { t = "v", n = 3, text = "And they cast them in for seven months until the day that thou wast born. And thy mother hid thee for three months, and they told regarding her." },
  { t = "v", n = 4, text = "And she made an ark for thee, and covered it with pitch and asphalt, and placed it in the flags on the bank of the river, and she placed thee in it seven days, and thy mother came by night and suckled thee, and by day Miriam, thy sister, guarded thee from the birds." },
  { t = "v", n = 5, text = "And in those days Tharmuth, the daughter of Pharaoh, came to bathe in the river, and she heard thy voice crying, and she told her maidens to bring thee forth, and they brought thee unto her." },
  { t = "v", n = 6, text = "And she took thee out of the ark, and she had compassion on thee." },
  { t = "v", n = 7, text = "And thy sister said unto her: \"Shall I go and call unto thee one of the Hebrew women to nurse and suckle this babe for thee?\" And she said (unto her): \"Go.\"" },
  { t = "v", n = 8, text = "And she went and called thy mother Jochebed, and she gave her wages, and she nursed thee." },
  { t = "v", n = 9, text = "And afterwards, when thou wast grown up, they brought thee unto the daughter of Pharaoh, and thou didst become her son, and Amram thy father taught thee writing, and after thou hadst completed three weeks they brought thee into the royal court." },
  { t = "v", n = 10, text = "And thou wast three weeks of years at court until the time when thou didst go forth from the royal court and didst see an Egyptian smiting thy friend who was of the children of Israel, and thou didst slay him and hide him in the sand." },
  { t = "v", n = 11, text = "And on the second day thou didst find two of the children of Israel striving together, and thou didst say to him who was doing the wrong: \"Why dost thou smite thy brother?" },
  { t = "v", n = 12, text = "And he was angry and indignant, and said \"Who made thee a prince and a judge over us? Thinkest thou to kill me as thou killedst the Egyptian yesterday?\" And thou didst fear and flee on account of these words." },
]

[[section]]
id = "48"
title = "Chapter 48"
level = 1
blocks = [
  { t = "h", level = 3, text = "From the Flight of Moses to the Exodus (xlviii. 1-19; cf. Exod. ii. 15 ff., iv. 19-24, vii-xiv.)." },
  { t = "v", n = 1, text = "And in the sixth year of the third week of the forty-ninth jubilee thou didst depart and dwell in the land of Midian five weeks and one year. And thou didst return into Egypt in the second week in the second year in the fiftieth jubilee." },
  { t = "v", n = 2, text = "And thou thyself knowest what He spake unto thee on Mount Sinai, and what prince Mastêmâ desired to do with thee when thou wast returning into Egypt on the way when thou didst meet him at the lodging-place." },
  { t = "v", n = 3, text = "Did he not with all his power seek to slay thee and deliver the Egyptians out of thy hand when he saw that thou wast sent to execute judgment and vengeance on the Egyptians?" },
  { t = "v", n = 4, text = "And I delivered thee out of his hand, and thou didst perform the signs and wonders which thou wast sent to perform in Egypt against Pharaoh, and against all his house, and against his servants and his people." },
  { t = "v", n = 5, text = "And the Lord executed a great vengeance on them for Israel's sake, and smote them through (the plagues of) blood and frogs, lice and dog-flies, and malignant boils breaking forth in blains; and their cattle by death; and by hail-stones, thereby He destroyed everything that grew for them; and by locusts which devoured the residue which had been left by the hail, and by darkness; and (by the death) of the first-born of men and animals, and on all their idols the Lord took vengeance and burned them with fire." },
  { t = "v", n = 6, text = "And everything was sent through thy hand, that thou shouldst declare (these things) before they were done, and thou didst speak with the king of Egypt before all his servants and before his people." },
  { t = "v", n = 7, text = "And everything took place according to thy words; ten great and terrible judgments came on the land of Egypt that thou mightest execute vengeance on it for Israel." },
  { t = "v", n = 8, text = "And the Lord did everything for Israel's sake, and according to His covenant, which He had ordained with Abraham that He would take vengeance on them as they had brought them by force into bondage." },
  { t = "v", n = 9, text = "And the prince of the Mastêmâ stood up against thee, and sought to cast thee into the hands of Pharaoh, and he helped the Egyptian sorcerers, and they stood up and wrought before thee." },
  { t = "v", n = 10, text = "The evils indeed we permitted them to work, but the remedies we did not allow to be wrought by their hands." },
  { t = "v", n = 11, text = "And the Lord smote them with malignant ulcers, and they were not able to stand for we destroyed them so that they could not perform a single sign." },
  { t = "v", n = 12, text = "And notwithstanding all (these) signs and wonders the prince of the Mastêmâ was not put to shame because he took courage and cried to the Egyptians to pursue after thee with all the powers of the Egyptians, with their chariots, and with their horses, and with all the hosts of the peoples of Egypt." },
  { t = "v", n = 13, text = "And I stood between the Egyptians and Israel, and we delivered Israel out of his hand, and out of the hand of his people, and the Lord brought them through the midst of the sea as if it were dry land." },
  { t = "v", n = 14, text = "And all the peoples whom he brought to pursue after Israel, the Lord our God cast them into the midst of the sea, into the depths of the abyss beneath the children of Israel, even as the people of Egypt had cast their children into the river. He took vengeance on 1,000,000 of them, and one thousand strong and energetic men were destroyed on account of one suckling of the children of thy people which they had thrown into the river." },
  { t = "v", n = 15, text = "And on the fourteenth day and on the fifteenth and on the sixteenth and on the seventeenth and on the eighteenth the prince of the Mastêmâ was bound and imprisoned behind the children of Israel that he might not accuse them." },
  { t = "v", n = 16, text = "And on the nineteenth we let them loose that they might help the Egyptians and pursue the children of Israel." },
  { t = "v", n = 17, text = "And he hardened their hearts and made them stubborn, and the device was devised by the Lord our God that He might smite the Egyptians and cast them into the sea." },
  { t = "v", n = 18, text = "And on the fourteenth we bound him that he might not accuse the children of Israel on the day when they asked the Egyptians for vessels and garments, vessels of silver, and vessels of gold, and vessels of bronze, in order to despoil the Egyptians in return for the bondage in which they had forced them to serve." },
  { t = "v", n = 19, text = "And we did not lead forth the children of Israel from Egypt empty handed." },
]

[[section]]
id = "49"
title = "Chapter 49"
level = 1
blocks = [
  { t = "h", level = 3, text = "Regulations regarding the Passover (xlix. 1-23; cf. Exod. xii.)." },
  { t = "v", n = 1, text = "Remember the commandment which the Lord commanded thee concerning the passover, that thou shouldst celebrate it in its season on the fourteenth of the first month, that thou shouldst kill it before it is evening, and that they should eat it by night on the evening of the fifteenth from the time of the setting of the sun." },
  { t = "v", n = 2, text = "For on this night—the beginning of the festival and the beginning of the joy—ye were eating the passover in Egypt, when all the powers of Mastêmâ had been let loose to slay all the first-born in the land of Egypt, from the firstborn of Pharaoh to the first-born of the captive maidservant in the mill, and to the cattle." },
  { t = "v", n = 3, text = "And this is the sign which the Lord gave them: Into every house on the lintels of which they saw the blood of a lamb of the first year, into (that) house they should not enter to slay, but should pass by (it), that all those should be saved that were in the house because the sign of the blood was on its lintels." },
  { t = "v", n = 4, text = "And the powers of the Lord did everything according as the Lord commanded them, and they passed by all the children of Israel, and the plague came not upon them to destroy from amongst them any soul either of cattle, or man, or dog." },
  { t = "v", n = 5, text = "And the plague was very grievous in Egypt, and there was no house in Egypt where there was not one dead, and weeping and lamentation." },
  { t = "v", n = 6, text = "And all Israel was eating the flesh of the paschal lamb, and drinking the wine, and was lauding and blessing, and giving thanks to the Lord God of their fathers, and was ready to go forth from under the yoke of Egypt; and from the evil bondage." },
  { t = "v", n = 7, text = "And remember thou this day all the days of thy life, and observe it from year to year all the days of thy life, once a year, on its day, according to all the law thereof, and do not adjourn (it) from day to day, or from month to month." },
  { t = "v", n = 8, text = "For it is an eternal ordinance, and engraven on the heavenly tables regarding all the children of Israel that they should observe it every year on its day once a year, throughout all their generations; and there is no limit of days, for this is ordained for ever." },
  { t = "v", n = 9, text = "And the man who is free from uncleanness, and doth not come to observe it on occasion of its day, so as to bring an acceptable offering before the Lord, and to eat and to drink before the Lord on the day of its festival, that man who is clean and close at hand will be cut off; because he offered not the oblation of the Lord in its appointed season, he will take the guilt upon himself." },
  { t = "v", n = 10, text = "Let the children of Israel come and observe the passover on the day of its fixed time, on the fourteenth day of the first month, between the evenings, from the third part of the day to the third part of the night, for two portions of the day are given to the light, and a third part to the evening." },
  { t = "v", n = 11, text = "That is that which the Lord commanded thee that thou shouldst observe it between the evenings." },
  { t = "v", n = 12, text = "And it is not permissible to slay it during any period of the light, but during the period bordering on the evening, and let them eat it at the time of the evening until the third part of the night, and whatever is leftover of all its flesh from the third part of the night and onwards, let them burn it with fire." },
  { t = "v", n = 13, text = "And they shall not cook it with water, nor shall they eat it raw, but roast on the fire: they shall eat it with diligence, its head with the inwards thereof and its feet they shall roast with fire, and not break any bone thereof; for †of the children of Israel no bone shall be crushed†." },
  { t = "v", n = 14, text = "For this reason the Lord commanded the children of Israel to observe the passover on the day of its fixed time, and they shall not break a bone thereof; for it is a festival day, and a day commanded, and there may be no passing over from day to day, and month to month, but on the day of its festival let it be observed." },
  { t = "v", n = 15, text = "And do thou command the children of Israel to observe the passover throughout their days, every year, once a year on the day of its fixed time, and it will come for a memorial well pleasing before the Lord, and no plague will come upon them to slay or to smite in that year in which they celebrate the passover in its season in every respect according to His command." },
  { t = "v", n = 16, text = "And they shall not eat it outside the sanctuary of the Lord, but before the sanctuary of the Lord, and all the people of the congregation of Israel shall celebrate it in its appointed season." },
  { t = "v", n = 17, text = "And every man who hath come upon its day shall eat it in the sanctuary of your God before the Lord from twenty years old and upward; for thus is it written and ordained that they should eat it in the sanctuary of the Lord." },
  { t = "v", n = 18, text = "And when the children of Israel come into the land which they are to possess, into the land of Canaan, and set up the tabernacle of the Lord in the midst of the land in one of their tribes until the sanctuary of the Lord hath been built in the land, let them come and celebrate the passover in the midst of the tabernacle of the Lord, and let them slay it before the Lord from year to year." },
  { t = "v", n = 19, text = "And in the days when the house hath been built in the name of the Lord in the land of their inheritance, they shall go there and slay the passover in the evening, at sunset, at the third part of the day." },
  { t = "v", n = 20, text = "And they will offer its blood on the threshold of the altar, and shall place its fat on the fire which is upon the altar, and they shall eat its flesh roasted with fire in the court of the house which hath been sanctified in the name of the Lord." },
  { t = "v", n = 21, text = "And they may not celebrate the passover in their cities, nor in any place save before the tabernacle of the Lord, or before His house where His name hath dwelt; and they will not go astray from the Lord." },
  { t = "v", n = 22, text = "And do thou, Moses, command the children of Israel to observe the ordinances of the passover, as it was commanded unto thee; declare thou unto them every year †and the day of its days, and† the festival of unleavened bread, that they should eat unleavened bread seven days, (and) that they should observe its festival, and that they bring an oblation every day during those seven days of joy before the Lord on the altar of your God." },
  { t = "v", n = 23, text = "For ye celebrated this festival with haste when ye went forth from Egypt till ye entered into the wilderness of Shur; for on the shore of the sea ye completed it." },
]

[[section]]
id = "50"
title = "Chapter 50"
level = 1
blocks = [
  { t = "h", level = 3, text = "Laws regarding the Jubilees and the Sabbath (l. 1-13)." },
  { t = "v", n = 1, text = "And after this law I made known to thee the days of the Sabbaths in the desert of Sin[ai], which is between Elim and Sinai." },
  { t = "v", n = 2, text = "And I told thee of the Sabbaths of the land on Mount Sinai, and I told thee of the jubilee years in the sabbaths of years: but the year thereof have I not told thee till ye enter the land which ye are to possess." },
  { t = "v", n = 3, text = "And the land also will keep its sabbaths while they dwell upon it, and they will know the jubilee year." },
  { t = "v", n = 4, text = "Wherefore I have ordained for thee the year-weeks and the years and the jubilees: there are forty-nine jubilees from the days of Adam until this day, and one week and two years and there are yet forty years to come (lit. \"distant for learning the commandments of the Lord, until they pass over into the land of Canaan, crossing the Jordan to the west." },
  { t = "v", n = 5, text = "And the jubilees will pass by, until Israel is cleansed from all guilt of fornication, and uncleanness, and pollution, and sin, and error, and dwelleth with confidence in all the land, and there will be no more a Satan or any evil one, and the land will be clean from that time for evermore." },
  { t = "v", n = 6, text = "And behold the commandment regarding the Sabbaths—I have written (them) down for thee and all the judgments of its laws." },
  { t = "v", n = 7, text = "Six days wilt thou labour, but on the seventh day is the Sabbath of the Lord your God. In it ye shall do no manner of work, ye and your sons, and your men-servants and your maid-servants, and all your cattle and the sojourner also who is with you." },
  { t = "v", n = 8, text = "And the man that doeth any work on it shall die: whoever desecrateth that day, whoever lieth with (his) wife or whoever saith he will do something on it, that he will set out on a journey thereon in regard to any buying or selling: and whoever draweth water thereon which he had not prepared for himself on the sixth day, and whoever taketh up any burden to carry it out of his tent or out of his house shall die." },
  { t = "v", n = 9, text = "Ye shall do no work whatever on the Sabbath day save that ye have prepared for yourselves on the sixth day, so as to eat, and drink, and rest, and keep Sabbath from all work on that day, and to bless the Lord your God, who has given you a day of festival, and a holy day: and a day of the holy kingdom for all Israel is this day among their days for ever." },
  { t = "v", n = 10, text = "For great is the honour which the Lord hath given to Israel that they should eat and drink and be satisfied on this festival day, and rest thereon from all labour which belongeth to the labour of the children of men, save burning frankincense and bringing oblations and sacrifices before the Lord for days and for Sabbaths." },
  { t = "v", n = 11, text = "This work alone shall be done on the Sabbath-days in the sanctuary of the Lord your God; that they may atone for Israel with sacrifice continually from day to day for a memorial well-pleasing before the Lord, and that He may receive them always from day to day according as thou hast been commanded." },
  { t = "v", n = 12, text = "And every man who doeth any work thereon, or goeth a journey, or tilleth (his) farm, whether in his house or any other place, and whoever lighteth a fire, or rideth on any beast, or travelleth by ship on the sea, and whoever striketh or killeth anything, or slaughtereth a beast or a bird, or whoever catcheth an animal or a bird or a fish, or whoever fasteth or maketh war on the Sabbaths:" },
  { t = "v", n = 13, text = "The man who doeth any of these things on the Sabbath shall die, so that the children of Israel shall observe the Sabbaths according to the commandments regarding the Sabbaths of the land, as it is written in the tables, which He gave into my hands that I should write out for thee the laws of the seasons, and the seasons according to the division of their days. Herewith is completed the account of the division of the days." },
]

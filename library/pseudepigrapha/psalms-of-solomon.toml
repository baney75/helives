[work]
id = "psalms-of-solomon"
title = "The Psalms of Solomon"
short_title = "Psalms of Solomon"
author = "pseudepigrapha-anonymous"
collection = "pseudepigrapha"
order = 4
date = "1st century BC (Gray dates them between 70 and 40 BC)"
language = "Greek and Syriac, from a lost Hebrew original"
translator = "G. Buchanan Gray"
edition = "The Psalms of Solomon, translated by G. Buchanan Gray, in The Apocrypha and Pseudepigrapha of the Old Testament in English, edited by R. H. Charles, vol. 2 (Oxford: Clarendon Press, 1913), pages 625 to 652"
source_url = "https://archive.sacred-texts.com/bib/fbe/index.htm"
source_sha256 = "45c16563756c3e3e6491649a77cc90720c53e88810a22f6c9dad55e4837bc09d"
retrieved = "2026-11-21"
license = "Public domain"
license_basis = "Published in Oxford by the Clarendon Press in 1913; in the public domain in the United States because it was published before 1931. The words follow the 1926 reprint in The Forgotten Books of Eden (New York: Alpha House, 1926), also published before 1931; titles, verse numbers and wording checked against two archive.org scans of the 1913 printing (apocryphapseudep0002unse, apocryphapseudep0002rhch_w1w3)."
words = 6567
summary = "Eighteen Jewish psalms written after Pompey took Jerusalem in 63 BC, lamenting the city's fall, judging the sinners of Israel and, in Psalms 17 and 18, hoping for a son of David as the Lord's Anointed. They stand in some Greek Bible manuscripts but are outside every Jewish and Christian canon and are kept here for history and study. They are not Scripture."

[[section]]
id = "1"
title = "Psalm 1"
level = 1
blocks = [
  { t = "v", n = 1, indent = 1, text = "I cried unto the Lord when I was in distress," },
  { t = "v", n = 1, indent = 1, cont = true, text = "Unto God when sinners assailed." },
  { t = "v", n = 2, indent = 1, text = "Suddenly the alarm of war was heard before me;" },
  { t = "v", n = 2, indent = 1, cont = true, text = "I said, He will hearken to me for I am full of righteousness." },
  { t = "v", n = 3, indent = 1, text = "I thought in my heart that I was full of righteousness," },
  { t = "v", n = 3, indent = 1, cont = true, text = "Because I was well off and had become rich in children." },
  { t = "v", n = 4, indent = 1, text = "Their wealth spread to the whole earth," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And their glory unto the end of the earth." },
  { t = "v", n = 5, indent = 1, text = "They were exalted unto the stars;" },
  { t = "v", n = 5, indent = 1, cont = true, text = "They said they would never fall." },
  { t = "v", n = 6, indent = 1, text = "But they became insolent in their prosperity," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And they were without understanding," },
  { t = "v", n = 7, indent = 1, text = "Their sins were in secret," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And even I had no knowledge of them." },
  { t = "v", n = 8, indent = 1, text = "Their transgressions went beyond those of the heathen before them;" },
  { t = "v", n = 8, indent = 1, cont = true, text = "They utterly polluted the holy things of the Lord." },
]

[[section]]
id = "2"
title = "Psalm 2"
level = 1
blocks = [
  { t = "h", level = 3, text = "A Psalm. Of Solomon. Concerning Jerusalem." },
  { t = "v", n = 1, indent = 1, text = "When the sinner waxed proud, with a battering-ram he cast down fortified walls," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And thou didst not restrain him." },
  { t = "v", n = 2, indent = 1, text = "Alien nations ascended Thine altar," },
  { t = "v", n = 2, indent = 1, cont = true, text = "They trampled it proudly with their sandals;" },
  { t = "v", n = 3, indent = 1, text = "Because the sons of Jerusalem had defiled the holy things of the Lord," },
  { t = "v", n = 3, indent = 1, cont = true, text = "Had profaned with iniquities the offerings of God." },
  { t = "v", n = 4, indent = 1, text = "Therefore He said: Cast them far from Me;" },
  { t = "v", n = 4, indent = 1, cont = true, text = ". . . . . ." },
  { t = "v", n = 5, indent = 1, text = "It was set at naught before God," },
  { t = "v", n = 5, indent = 1, cont = true, text = "It was utterly dishonoured;" },
  { t = "v", n = 6, indent = 1, text = "The sons and the daughters were in grievous captivity," },
  { t = "v", n = 6, indent = 1, cont = true, text = "Sealed was their neck, branded was it among the nations." },
  { t = "v", n = 7, indent = 1, text = "According to their sins hath He done unto them," },
  { t = "v", n = 7, indent = 1, cont = true, text = "For He hath left them in the hands of them that prevailed." },
  { t = "v", n = 8, indent = 1, text = "He hath turned away His face from pitying them," },
  { t = "v", n = 8, indent = 1, cont = true, text = "Young and old and their children together;" },
  { t = "v", n = 9, indent = 1, text = "For they had done evil one and all, in not hearkening." },
  { t = "v", n = 10, indent = 1, text = "And the heavens were angry," },
  { t = "v", n = 10, indent = 1, cont = true, text = "And the earth abhorred them;" },
  { t = "v", n = 11, indent = 1, text = "For no man upon it had done what they did," },
  { t = "v", n = 12, indent = 1, text = "And the earth recognized all" },
  { t = "v", n = 12, indent = 1, cont = true, text = "Thy righteous judgements, O God." },
  { t = "v", n = 13, indent = 1, text = "They set the sons of Jerusalem to be mocked at in return for the harlots in her;" },
  { t = "v", n = 13, indent = 1, cont = true, text = "Every wayfarer entered in in the full light of day." },
  { t = "v", n = 14, indent = 1, text = "They made mock with their transgressions, as they themselves were wont to do;" },
  { t = "v", n = 14, indent = 1, cont = true, text = "In the full light of day they revealed their iniquities." },
  { t = "v", n = 14, indent = 1, cont = true, text = "And the daughters of Jerusalem were defiled in accordance with Thy judgement," },
  { t = "v", n = 15, indent = 1, text = "Because they had defiled themselves with unnatural intercourse." },
  { t = "v", n = 15, indent = 1, cont = true, text = "I am pained in my bowels and my inward parts for these things." },
  { t = "v", n = 16, indent = 1, text = "And yet I will justify Thee, O God, in uprightness of heart," },
  { t = "v", n = 16, indent = 1, cont = true, text = "For in Thy judgements is Thy righteousness displayed, O God." },
  { t = "v", n = 17, indent = 1, text = "For Thou hast rendered to the sinners according to their deeds," },
  { t = "v", n = 17, indent = 1, cont = true, text = "Yea, according to their sins, which were very wicked." },
  { t = "v", n = 18, indent = 1, text = "Thou hast uncovered their sins, that Thy judgement might be manifest;" },
  { t = "v", n = 19, indent = 1, text = "Thou hast wiped out their memorial from the earth." },
  { t = "v", n = 19, indent = 1, cont = true, text = "God is a righteous judge," },
  { t = "v", n = 19, indent = 1, cont = true, text = "And he is no respecter of persons." },
  { t = "v", n = 20, indent = 1, text = "For the nations reproached Jerusalem, trampling it down;" },
  { t = "v", n = 20, indent = 1, cont = true, text = "Her beauty was dragged down from the throne of glory." },
  { t = "v", n = 21, indent = 1, text = "She girded on sackcloth instead of comely raiment," },
  { t = "v", n = 21, indent = 1, cont = true, text = "A rope was about her head instead of a crown." },
  { t = "v", n = 22, indent = 1, text = "She put off the glorious diadem which God had set upon her," },
  { t = "v", n = 23, indent = 1, text = "In dishonour was her beauty cast upon the ground." },
  { t = "v", n = 24, indent = 1, text = "And I saw and entreated the Lord and said," },
  { t = "v", n = 24, indent = 1, cont = true, text = "Long enough, O Lord has Thine hand been heavy on Israel, in bringing the nations upon them." },
  { t = "v", n = 25, indent = 1, text = "For they have made sport unsparingly in wrath and fierce anger;" },
  { t = "v", n = 26, indent = 1, text = "And they will make an utter end, unless Thou, O Lord, rebuke them in Thy wrath." },
  { t = "v", n = 27, indent = 1, text = "For they have done. it not in zeal, but in lust of soul," },
  { t = "v", n = 28, indent = 1, text = "Pouring out their wrath upon us with a view to rapine." },
  { t = "v", n = 29, indent = 1, text = "Delay not, O God, to recompense them on their heads," },
  { t = "v", n = 29, indent = 1, cont = true, text = "To turn the pride of the dragon into dishonour." },
  { t = "v", n = 30, indent = 1, text = "And I had not long to wait before God showed me the insolent one" },
  { t = "v", n = 30, indent = 1, cont = true, text = "Slain on the mountains of Egypt," },
  { t = "v", n = 30, indent = 1, cont = true, text = "Esteemed of less account than the least, on land and sea;" },
  { t = "v", n = 31, indent = 1, text = "His body, too, borne hither and thither on the billows with much insolence," },
  { t = "v", n = 31, indent = 1, cont = true, text = "With none to bury him, because He had rejected him with dishonour." },
  { t = "v", n = 31, indent = 1, cont = true, text = "He reflected not that he was man," },
  { t = "v", n = 32, indent = 1, text = "And reflected not on the latter end;" },
  { t = "v", n = 33, indent = 1, text = "He said: I will be lord of land and sea;" },
  { t = "v", n = 33, indent = 1, cont = true, text = "And he recognized not that it is God who is great," },
  { t = "v", n = 33, indent = 1, cont = true, text = "Mighty in His great strength." },
  { t = "v", n = 34, indent = 1, text = "He is king over the heavens," },
  { t = "v", n = 34, indent = 1, cont = true, text = "And judgeth kings and kingdoms." },
  { t = "v", n = 35, indent = 1, text = "It is He who setteth me up in glory," },
  { t = "v", n = 35, indent = 1, cont = true, text = "And bringeth down the proud to eternal destruction in dishonour," },
  { t = "v", n = 35, indent = 1, cont = true, text = "Because they knew Him not." },
  { t = "v", n = 36, indent = 1, text = "And now behold, ye princes of the earth, the judgement of the Lord," },
  { t = "v", n = 36, indent = 1, cont = true, text = "For a great king and righteous is He, judging all that is under heaven." },
  { t = "v", n = 37, indent = 1, text = "Bless God, ye that fear the Lord with wisdom," },
  { t = "v", n = 37, indent = 1, cont = true, text = "For the mercy of the Lord will be upon them that fear Him, in the Judgement;" },
  { t = "v", n = 38, indent = 1, text = "So that He will distinguish between the righteous and the sinner," },
  { t = "v", n = 38, indent = 1, cont = true, text = "And recompense the sinners for ever according to their deeds;" },
  { t = "v", n = 39, indent = 1, text = "And have mercy on the righteous, delivering him from the affliction of the sinner," },
  { t = "v", n = 39, indent = 1, cont = true, text = "And recompensing the sinner for what he hath done to the righteous." },
  { t = "v", n = 40, indent = 1, text = "For the Lord is good to them that call upon Him in patience," },
  { t = "v", n = 40, indent = 1, cont = true, text = "Doing according to His mercy to His pious ones," },
  { t = "v", n = 40, indent = 1, cont = true, text = "Establishing them at all times before Him in strength." },
  { t = "v", n = 41, indent = 1, text = "Blessed be the Lord for ever before His servants." },
]

[[section]]
id = "3"
title = "Psalm 3"
level = 1
blocks = [
  { t = "h", level = 3, text = "A Psalm. Of Solomon. Concerning the righteous." },
  { t = "v", n = 1, indent = 1, text = "Why sleepest thou, O my soul," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And blessest not the Lord?" },
  { t = "v", n = 2, indent = 1, text = "Sing a new song," },
  { t = "v", n = 2, indent = 1, cont = true, text = "Unto God who is worthy to be praised." },
  { t = "v", n = 2, indent = 1, cont = true, text = "Sing and be wakeful against His awaking," },
  { t = "v", n = 2, indent = 1, cont = true, text = "For good is a psalm sung to God from a glad heart." },
  { t = "v", n = 3, indent = 1, text = "The righteous remember the Lord at all times," },
  { t = "v", n = 3, indent = 1, cont = true, text = "With thanksgiving and declaration of the righteousness of the Lord's judgements." },
  { t = "v", n = 4, indent = 1, text = "The righteous despiseth not the chastening of the Lord;" },
  { t = "v", n = 4, indent = 1, cont = true, text = "His will is always before the Lord." },
  { t = "v", n = 5, indent = 1, text = "The righteous stumbleth and holdeth the Lord righteous:" },
  { t = "v", n = 5, indent = 1, cont = true, text = "He falleth and looketh out for what God will do to him;" },
  { t = "v", n = 6, indent = 1, text = "He seeketh out whence his deliverance will come." },
  { t = "v", n = 7, indent = 1, text = "The steadfastness of the righteous is from God, their deliverer;" },
  { t = "v", n = 7, indent = 1, cont = true, text = "There lodgeth not in the house of the righteous sin upon sin." },
  { t = "v", n = 8, indent = 1, text = "The righteous continually searcheth his house," },
  { t = "v", n = 8, indent = 1, cont = true, text = "To remove utterly all iniquity done by him in error." },
  { t = "v", n = 9, indent = 1, text = "He maketh atonement for sins of ignorance by fasting and afflicting his soul," },
  { t = "v", n = 10, indent = 1, text = "And the Lord counteth guiltless every pious man and his house." },
  { t = "v", n = 11, indent = 1, text = "The sinner stumbleth and curseth his life" },
  { t = "v", n = 11, indent = 1, cont = true, text = "The day when he was begotten, and his mother's travail." },
  { t = "v", n = 12, indent = 1, text = "He addeth sins to sins, while he liveth;" },
  { t = "v", n = 13, indent = 1, text = "He falleth—verily grievous is his fall—and riseth no more." },
  { t = "v", n = 13, indent = 1, cont = true, text = "The destruction of the sinner is for ever," },
  { t = "v", n = 14, indent = 1, text = "And he shall not be remembered, when the righteous is visited." },
  { t = "v", n = 15, indent = 1, text = "This is the portion of sinners for ever." },
  { t = "v", n = 16, indent = 1, text = "But they that fear the Lord shall rise to life eternal," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And their life shall be in the light of the Lord, and shall come to an end no more." },
]

[[section]]
id = "4"
title = "Psalm 4"
level = 1
blocks = [
  { t = "h", level = 3, text = "A Conversation of Solomon with the Men-pleasers." },
  { t = "v", n = 1, indent = 1, text = "Wherefore sittest thou, O profane man, in the council of the pious," },
  { t = "v", n = 1, indent = 1, cont = true, text = "Seeing that thy heart is far removed from the Lord," },
  { t = "v", n = 1, indent = 1, cont = true, text = "Provoking with transgressions the God of Israel?" },
  { t = "v", n = 2, indent = 1, text = "Extravagant in speech, extravagant in outward seeming beyond all men," },
  { t = "v", n = 2, indent = 1, cont = true, text = "Is he that is severe of speech in condemning sinners in judgement." },
  { t = "v", n = 3, indent = 1, text = "And his hand is first upon him as though he acted in zeal," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And yet he is himself guilty in respect of manifold sins and of wantonness." },
  { t = "v", n = 4, indent = 1, text = "His eyes are upon every woman without distinction;" },
  { t = "v", n = 4, indent = 1, cont = true, text = "His tongue lieth when he maketh contract with an oath." },
  { t = "v", n = 5, indent = 1, text = "By night and in secret he sinneth as though unseen," },
  { t = "v", n = 5, indent = 1, cont = true, text = "With his eyes he talketh to every woman of evil compacts." },
  { t = "v", n = 6, indent = 1, text = "He is swift to enter every house with cheerfulness as though guileless." },
  { t = "v", n = 7, indent = 1, text = "Let God remove those that live in hypocrisy in the company of the pious," },
  { t = "v", n = 7, indent = 1, cont = true, text = "Even the life of such an one with corruption of his flesh and penury." },
  { t = "v", n = 8, indent = 1, text = "Let God reveal the deeds of the men-pleasers," },
  { t = "v", n = 8, indent = 1, cont = true, text = "The deeds of such an one with laughter and derision;" },
  { t = "v", n = 9, indent = 1, text = "That the pious may count righteous the judgement of their God," },
  { t = "v", n = 9, indent = 1, cont = true, text = "When sinners are removed from before the righteous," },
  { t = "v", n = 10, indent = 1, text = "Even the man-pleaser who uttereth law guilefully." },
  { t = "v", n = 11, indent = 1, text = "And their eyes are fixed upon any man's house that is still secure," },
  { t = "v", n = 11, indent = 1, cont = true, text = "That they may, like the Serpent, destroy the wisdom of . . . with words of transgressors," },
  { t = "v", n = 12, indent = 1, text = "His words are deceitful that he may accomplish his wicked desire." },
  { t = "v", n = 13, indent = 1, text = "He never ceaseth from scattering families as though they were orphans," },
  { t = "v", n = 13, indent = 1, cont = true, text = "Yea, he layeth waste a house on account of his lawless desire." },
  { t = "v", n = 14, indent = 1, text = "He deceiveth with words, saying, There is none that seeth, or judgeth." },
  { t = "v", n = 15, indent = 1, text = "He fills one house with lawlessness," },
  { t = "v", n = 15, indent = 1, cont = true, text = "And then his eyes are fixed upon the next house," },
  { t = "v", n = 15, indent = 1, cont = true, text = "To destroy it with words that give wing to desire." },
  { t = "v", n = 15, indent = 1, cont = true, text = "Yet with all these his soul like Sheol, is not sated." },
  { t = "v", n = 16, indent = 1, text = "Let his portion, O Lord, be dishonoured before thee;" },
  { t = "v", n = 16, indent = 1, cont = true, text = "Let him go forth groaning, and come home cursed." },
  { t = "v", n = 17, indent = 1, text = "Let his life be spent in anguish, and penury, and want, O Lord;" },
  { t = "v", n = 17, indent = 1, cont = true, text = "Let his sleep be beset with pains and his awaking with perplexities." },
  { t = "v", n = 18, indent = 1, text = "Let sleep be withdrawn from his eyelids at night;" },
  { t = "v", n = 18, indent = 1, cont = true, text = "Let him fail dishonourably in every work of his hands." },
  { t = "v", n = 19, indent = 1, text = "Let him come home empty-handed to his house," },
  { t = "v", n = 19, indent = 1, cont = true, text = "And his house be void of everything wherewith he could sate his appetite." },
  { t = "v", n = 20, indent = 1, text = "Let his old age be spent in childless loneliness until his removal by death." },
  { t = "v", n = 21, indent = 1, text = "Let the flesh of the men-pleasers be rent by wild beasts," },
  { t = "v", n = 21, indent = 1, cont = true, text = "And let the bones of the lawless lie dishonoured in the sight of the sun." },
  { t = "v", n = 22, indent = 1, text = "Let ravens peck out the eyes of the hypocrites." },
  { t = "v", n = 23, indent = 1, text = "For they have laid waste many houses of men, in dishonour," },
  { t = "v", n = 23, indent = 1, cont = true, text = "And scattered them in their lust;" },
  { t = "v", n = 24, indent = 1, text = "And they have not remembered God," },
  { t = "v", n = 24, indent = 1, cont = true, text = "Nor feared God in all these things;" },
  { t = "v", n = 25, indent = 1, text = "But they have provoked God's anger and vexed Him." },
  { t = "v", n = 25, indent = 1, cont = true, text = "May He remove them from off the earth," },
  { t = "v", n = 25, indent = 1, cont = true, text = "Because with deceit they beguiled the souls of the flawless." },
  { t = "v", n = 26, indent = 1, text = "Blessed are they that fear the Lord in their flawlessness;" },
  { t = "v", n = 27, indent = 1, text = "The Lord shall deliver them from guileful men and sinners," },
  { t = "v", n = 27, indent = 1, cont = true, text = "And deliver us from every stumbling-block of the lawless (men)." },
  { t = "v", n = 28, indent = 1, text = "Let God destroy them that insolently work all unrighteousness," },
  { t = "v", n = 28, indent = 1, cont = true, text = "For a great and mighty judge is the Lord our God in righteousness." },
  { t = "v", n = 29, indent = 1, text = "Let Thy mercy, O Lord, be upon all them that love Thee." },
]

[[section]]
id = "5"
title = "Psalm 5"
level = 1
blocks = [
  { t = "h", level = 3, text = "A Psalm. Of Solomon." },
  { t = "v", n = 1, indent = 1, text = "O Lord God, I will praise Thy name with joy," },
  { t = "v", n = 1, indent = 1, cont = true, text = "In the midst of them that know Thy righteous judgements." },
  { t = "v", n = 2, indent = 1, text = "For Thou art good and merciful, the refuge of the poor;" },
  { t = "v", n = 3, indent = 1, text = "When I cry to Thee, do not silently disregard me." },
  { t = "v", n = 4, indent = 1, text = "For no man taketh spoil from a mighty man;" },
  { t = "v", n = 5, indent = 1, text = "Who, then, can take aught of all that Thou hast made, except Thou Thyself givest?" },
  { t = "v", n = 6, indent = 1, text = "For man and his portion lie before Thee in the balance;" },
  { t = "v", n = 6, indent = 1, cont = true, text = "He cannot add to, so as to enlarge, what has been prescribed by Thee." },
  { t = "v", n = 7, indent = 1, text = "O God, when we are in distress we call upon Thee for help," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And Thou dost not turn back our petition, for Thou art our God." },
  { t = "v", n = 8, indent = 1, text = "Cause not Thy hand to be heavy upon us," },
  { t = "v", n = 8, indent = 1, cont = true, text = "Lest through necessity we sin." },
  { t = "v", n = 9, indent = 1, text = "Even though Thou restore us not, we will not keep away;" },
  { t = "v", n = 9, indent = 1, cont = true, text = "But unto Thee will we come." },
  { t = "v", n = 10, indent = 1, text = "For if I hunger, unto Thee will I cry, O God;" },
  { t = "v", n = 10, indent = 1, cont = true, text = "And Thou wilt give to me." },
  { t = "v", n = 11, indent = 1, text = "Birds and fish dost Thou nourish," },
  { t = "v", n = 11, indent = 1, cont = true, text = "In that Thou givest rain to the steppes that green grass may spring up," },
  { t = "v", n = 11, indent = 1, cont = true, text = "So to prepare fodder in the steppe for every living thing;" },
  { t = "v", n = 12, indent = 1, text = "And if they hunger, unto Thee do they lift up their face." },
  { t = "v", n = 13, indent = 1, text = "Kings and rulers and peoples Thou dost nourish, O God;" },
  { t = "v", n = 13, indent = 1, cont = true, text = "And who is the help of the poor and needy, if not Thou, O Lord?" },
  { t = "v", n = 14, indent = 1, text = "And Thou wilt hearken—for who is good and gentle but thou?—" },
  { t = "v", n = 14, indent = 1, cont = true, text = "Making glad the soul of the humble by opening Thine hand in mercy." },
  { t = "v", n = 15, indent = 1, text = "Man's goodness is bestowed grudgingly and ...;" },
  { t = "v", n = 15, indent = 1, cont = true, text = "And if he repeat it without murmuring, even that is marvellous." },
  { t = "v", n = 16, indent = 1, text = "But Thy gift is great in goodness and wealth," },
  { t = "v", n = 16, indent = 1, cont = true, text = "And he whose hope is set on Thee shall have no lack of gifts." },
  { t = "v", n = 17, indent = 1, text = "Upon the whole earth is Thy mercy, O Lord, in goodness." },
  { t = "v", n = 18, indent = 1, text = "Happy is he whom God remembereth in granting to him a due sufficiency;" },
  { t = "v", n = 19, indent = 1, text = "If a man abound overmuch, he sinneth." },
  { t = "v", n = 20, indent = 1, text = "Sufficient are moderate means with righteousness," },
  { t = "v", n = 20, indent = 1, cont = true, text = "And hereby the blessing of the Lord becomes abundance with righteousness." },
  { t = "v", n = 21, indent = 1, text = "They that fear the Lord rejoice in good gifts," },
  { t = "v", n = 21, indent = 1, cont = true, text = "And thy goodness is upon Israel in Thy kingdom." },
  { t = "v", n = 21, indent = 1, cont = true, text = "Blessed is the glory of the Lord, for He is our king." },
]

[[section]]
id = "6"
title = "Psalm 6"
level = 1
blocks = [
  { t = "h", level = 3, text = "In Hope. Of Solomon." },
  { t = "v", n = 1, indent = 1, text = "Happy is the man whose heart is fixed to call upon the name of the Lord;" },
  { t = "v", n = 2, indent = 1, text = "When he remembereth the name of the Lord, he will be saved." },
  { t = "v", n = 3, indent = 1, text = "His ways are made even by the Lord," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And the works of his hands are preserved by the Lord his God." },
  { t = "v", n = 4, indent = 1, text = "At what he sees in his bad dreams, his soul shall not be troubled;" },
  { t = "v", n = 5, indent = 1, text = "When he passes through rivers and the tossing of the seas, he shall not be dismayed." },
  { t = "v", n = 6, indent = 1, text = "He ariseth from his sleep, and blesseth the name of the Lord:" },
  { t = "v", n = 7, indent = 1, text = "When his heart is at peace, he singeth to the name of his God," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And he entreateth the Lord for all his house." },
  { t = "v", n = 8, indent = 1, text = "And the Lord heareth the prayer of every one that feareth God," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And every request of the soul that hopes for Him doth the Lord accomplish." },
  { t = "v", n = 9, indent = 1, text = "Blessed is the Lord, who showeth mercy to those who love Him in sincerity." },
]

[[section]]
id = "7"
title = "Psalm 7"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of Solomon. Of turning." },
  { t = "v", n = 1, indent = 1, text = "Make not Thy dwelling afar from us, O God;" },
  { t = "v", n = 1, indent = 1, cont = true, text = "Lest they assail us that hate us without cause." },
  { t = "v", n = 2, indent = 1, text = "For Thou hast rejected them, O God;" },
  { t = "v", n = 2, indent = 1, cont = true, text = "Let not their foot trample upon Thy holy inheritance." },
  { t = "v", n = 3, indent = 1, text = "Chasten us Thyself in Thy good pleasure;" },
  { t = "v", n = 3, indent = 1, cont = true, text = "But give us not up to the nations;" },
  { t = "v", n = 4, indent = 1, text = "For, if Thou sendest pestilence," },
  { t = "v", n = 4, indent = 1, cont = true, text = "Thou Thyself givest it charge concerning us;" },
  { t = "v", n = 4, indent = 1, cont = true, text = "For Thou art merciful," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And wilt not be angry to the point of consuming us." },
  { t = "v", n = 5, indent = 1, text = "While Thy name dwelleth in our midst, we shall find mercy;" },
  { t = "v", n = 6, indent = 1, text = "And the nations shall not prevail against us." },
  { t = "v", n = 6, indent = 1, cont = true, text = "For Thou art our shield," },
  { t = "v", n = 7, indent = 1, text = "And when we call upon Thee, Thou hearkenest to us;" },
  { t = "v", n = 8, indent = 1, text = "For Thou wilt pity the seed of Israel for ever" },
  { t = "v", n = 8, indent = 1, cont = true, text = "And Thou wilt not reject them:" },
  { t = "v", n = 8, indent = 1, cont = true, text = "But we shall, be under Thy yoke for ever," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And under the rod of Thy chastening." },
  { t = "v", n = 9, indent = 1, text = "Thou wilt establish us in the time that Thou helpest us," },
  { t = "v", n = 9, indent = 1, cont = true, text = "Showing mercy to the house of Jacob on the day wherein Thou didst promise to help them." },
]

[[section]]
id = "8"
title = "Psalm 8"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of Solomon. Of the chief Musician." },
  { t = "v", n = 1, indent = 1, text = "Distress and the sound of war hath my ear heard," },
  { t = "v", n = 1, indent = 1, cont = true, text = "The sound of a trumpet announcing slaughter and calamity," },
  { t = "v", n = 2, indent = 1, text = "The sound of much people as of an exceeding high wind," },
  { t = "v", n = 2, indent = 1, cont = true, text = "As a tempest with mighty fire sweeping through the Negeb." },
  { t = "v", n = 3, indent = 1, text = "And I said in my heart, Surely God judgeth us;" },
  { t = "v", n = 4, indent = 1, text = "A sound I hear moving towards Jerusalem, the holy city" },
  { t = "v", n = 5, indent = 1, text = "My loins were broken at what I heard, my knees tottered;" },
  { t = "v", n = 6, indent = 1, text = "My heart was afraid, my bones were dismayed like flax." },
  { t = "v", n = 7, indent = 1, text = "I said: They establish their ways in righteousness." },
  { t = "v", n = 7, indent = 1, cont = true, text = "I thought upon the judgements of God since the creation of heaven and earth;" },
  { t = "v", n = 7, indent = 1, cont = true, text = "I held God righteous in His judgements which have been from of old." },
  { t = "v", n = 8, indent = 1, text = "God laid bare their sins in the full light of day;" },
  { t = "v", n = 8, indent = 1, cont = true, text = "All the earth came to know the righteous judgements of God." },
  { t = "v", n = 9, indent = 1, text = "In secret places underground their iniquities were committed to provoke Him to anger;" },
  { t = "v", n = 10, indent = 1, text = "They wrought confusion, son with mother and father with daughter;" },
  { t = "v", n = 11, indent = 1, text = "They committed adultery, every man with his neighbour's wife." },
  { t = "v", n = 11, indent = 1, cont = true, text = "They concluded covenants with one another with an oath touching these things;" },
  { t = "v", n = 12, indent = 1, text = "They plundered the sanctuary of God, as though there was no avenger." },
  { t = "v", n = 13, indent = 1, text = "They trode the altar of the Lord, coming straight from all manner of uncleanness;" },
  { t = "v", n = 13, indent = 1, cont = true, text = "And with menstrual blood they defiled the sacrifices, as though these were common flesh." },
  { t = "v", n = 14, indent = 1, text = "They left no sin undone, wherein they surpassed not the heathen." },
  { t = "v", n = 15, indent = 1, text = "Therefore God mingled for them a spirit of wandering;" },
  { t = "v", n = 15, indent = 1, cont = true, text = "And gave them to drink a cup of undiluted wine, that they might become drunken." },
  { t = "v", n = 16, indent = 1, text = "He brought him that is from the end of the earth, that smiteth mightily;" },
  { t = "v", n = 17, indent = 1, text = "He decreed war against Jerusalem, and against her land." },
  { t = "v", n = 18, indent = 1, text = "The princes of the land went to meet him with joy: they said unto him:" },
  { t = "v", n = 18, indent = 1, cont = true, text = "Blessed be thy way! Come ye, enter ye in with peace." },
  { t = "v", n = 19, indent = 1, text = "They made the rough ways even, before his entering in;" },
  { t = "v", n = 19, indent = 1, cont = true, text = "They opened the gates to Jerusalem, they crowned its walls." },
  { t = "v", n = 20, indent = 1, text = "As a father entereth the house of his sons, so he entered Jerusalem in peace;" },
  { t = "v", n = 20, indent = 1, cont = true, text = "He established his feet there in great safety." },
  { t = "v", n = 21, indent = 1, text = "He captured her fortresses and the wall of Jerusalem;" },
  { t = "v", n = 22, indent = 1, text = "For God Himself led him in safety, while they wandered." },
  { t = "v", n = 23, indent = 1, text = "He destroyed their princes and every one wise in counsel;" },
  { t = "v", n = 23, indent = 1, cont = true, text = "He poured out the blood of the inhabitants of Jerusalem, like the water of uncleanness." },
  { t = "v", n = 24, indent = 1, text = "He led away their sons and daughters, whom they had begotten in defilement." },
  { t = "v", n = 25, indent = 1, text = "They did according to their uncleanness, even as their fathers had done:" },
  { t = "v", n = 26, indent = 1, text = "They defiled Jerusalem and the things that had been hallowed to the name of God." },
  { t = "v", n = 27, indent = 1, text = "But God hath shown Himself righteous in His judgements upon the nations of the earth;" },
  { t = "v", n = 28, indent = 1, text = "And the pious servants of God are like innocent lambs in their midst." },
  { t = "v", n = 29, indent = 1, text = "Worthy to be praised is the Lord that judgeth the whole earth in His righteousness." },
  { t = "v", n = 30, indent = 1, text = "Behold, now, O God, Thou hast shown us Thy judgement in Thy righteousness;" },
  { t = "v", n = 31, indent = 1, text = "Our eyes have seen Thy judgements, O God." },
  { t = "v", n = 31, indent = 1, cont = true, text = "We have justified Thy name that is honoured for ever;" },
  { t = "v", n = 32, indent = 1, text = "For Thou art the God of righteousness, judging Israel with chastening." },
  { t = "v", n = 33, indent = 1, text = "Turn, O God, Thy mercy upon us, and have pity upon us;" },
  { t = "v", n = 34, indent = 1, text = "Gather together the dispersed of Israel, with mercy and goodness;" },
  { t = "v", n = 35, indent = 1, text = "For Thy faithfulness is with us," },
  { t = "v", n = 35, indent = 1, cont = true, text = "And though we have stiffened our neck, yet Thou art our chastener;" },
  { t = "v", n = 36, indent = 1, text = "Overlook us not, O our God, lest the nations swallow us up, as though there were none to deliver." },
  { t = "v", n = 37, indent = 1, text = "But Thou art our God from the beginning," },
  { t = "v", n = 37, indent = 1, cont = true, text = "And upon Thee is our hope set, O Lord;" },
  { t = "v", n = 38, indent = 1, text = "And we will not depart from Thee," },
  { t = "v", n = 38, indent = 1, cont = true, text = "For good are Thy judgements upon us." },
  { t = "v", n = 39, indent = 1, text = "Ours and our children's be Thy good pleasure for ever;" },
  { t = "v", n = 39, indent = 1, cont = true, text = "O Lord, our Saviour, we shall never more be moved." },
  { t = "v", n = 40, indent = 1, text = "The Lord is worthy to be praised for His judgements with the mouth of His pious ones;" },
  { t = "v", n = 40, indent = 1, cont = true, text = "And blessed be Israel of the Lord for ever." },
]

[[section]]
id = "9"
title = "Psalm 9"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of Solomon. For rebuke." },
  { t = "v", n = 1, indent = 1, text = "When Israel was led away captive into a strange land," },
  { t = "v", n = 1, indent = 1, cont = true, text = "When they fell away from the Lord who redeemed them," },
  { t = "v", n = 2, indent = 1, text = "They were cast away from the inheritance, which the Lord had given them." },
  { t = "v", n = 2, indent = 1, cont = true, text = "Among every nation were the dispersed of Israel according to the word of God," },
  { t = "v", n = 3, indent = 1, text = "That Thou mightest be justified, O God, in Thy righteousness by reason of our transgressions:" },
  { t = "v", n = 4, indent = 1, text = "For Thou art a just judge over all the peoples of the earth." },
  { t = "v", n = 5, indent = 1, text = "For from Thy knowledge none that doeth unjustly is hidden," },
  { t = "v", n = 6, indent = 1, text = "And the righteous deeds of Thy pious ones are before Thee, O Lord;" },
  { t = "v", n = 6, indent = 1, cont = true, text = "Where, then, can a man hide himself from Thy knowledge, O God?" },
  { t = "v", n = 7, indent = 1, text = "Our works are subject to our own choice and power" },
  { t = "v", n = 7, indent = 1, cont = true, text = "To do right or wrong in the works of our hands;" },
  { t = "v", n = 8, indent = 1, text = "And in Thy righteousness Thou visitest the sons of men." },
  { t = "v", n = 9, indent = 1, text = "He that doeth righteousness layeth up life for himself with the Lord;" },
  { t = "v", n = 9, indent = 1, cont = true, text = "And he that doeth wrongly forfeits his life to destruction;" },
  { t = "v", n = 10, indent = 1, text = "For the judgements of the Lord are given in righteousness to every man and his house." },
  { t = "v", n = 11, indent = 1, text = "Unto whom art Thou good, O God, except to them that call upon the Lord?" },
  { t = "v", n = 12, indent = 1, text = "He cleanseth from sins a soul when it maketh confession, when it maketh acknowledgement;" },
  { t = "v", n = 13, indent = 1, text = "For shame is upon us and upon our faces on account of all these things." },
  { t = "v", n = 14, indent = 1, text = "And to whom doth He forgive sins, except to them that have sinned?" },
  { t = "v", n = 15, indent = 1, text = "Thou blessest the righteous, and dost not reprove them for the sins that they have committed;" },
  { t = "v", n = 15, indent = 1, cont = true, text = "And Thy goodness is upon them that sin, when they repent." },
  { t = "v", n = 16, indent = 1, text = "And, now, Thou art our God, and we the people whom Thou hast loved:" },
  { t = "v", n = 16, indent = 1, cont = true, text = "Behold and show pity, O God of Israel, for we are Thine;" },
  { t = "v", n = 16, indent = 1, cont = true, text = "And remove not Thy mercy from us, lest they assail us." },
  { t = "v", n = 17, indent = 1, text = "For Thou didst choose the seed of Abraham before all the nations," },
  { t = "v", n = 17, indent = 1, cont = true, text = "And didst set Thy name upon us, O Lord," },
  { t = "v", n = 17, indent = 1, cont = true, text = "And Thou wilt not reject us for ever." },
  { t = "v", n = 17, indent = 1, cont = true, text = "Thou madest a covenant with our fathers concerning us;" },
  { t = "v", n = 17, indent = 1, cont = true, text = "And we hope in Thee, when our soul turneth unto Thee." },
  { t = "v", n = 17, indent = 1, cont = true, text = "The mercy of the Lord be upon the house of Israel for ever and ever." },
]

[[section]]
id = "10"
title = "Psalm 10"
level = 1
blocks = [
  { t = "h", level = 3, text = "A Hymn. Of Solomon." },
  { t = "v", n = 1, indent = 1, text = "Happy is the man whom the Lord remembereth with reproving," },
  { t = "v", n = 1, indent = 1, cont = true, text = "And whom He restraineth from the way of evil with strokes" },
  { t = "v", n = 1, indent = 1, cont = true, text = "That he may be cleansed from sin, that it may not be multiplied." },
  { t = "v", n = 2, indent = 1, text = "He that maketh ready his back for strokes shall be cleansed," },
  { t = "v", n = 2, indent = 1, cont = true, text = "For the Lord is good to them that endure chastening." },
  { t = "v", n = 3, indent = 1, text = "For He maketh straight the ways of the righteous," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And doth not pervert them by His chastening." },
  { t = "v", n = 4, indent = 1, text = "And the mercy of the Lord is upon them that love Him in truth," },
  { t = "v", n = 4, indent = 1, cont = true, text = "And the Lord remembereth His servants in mercy." },
  { t = "v", n = 5, indent = 1, text = "For the testimony is in the law of the eternal covenant," },
  { t = "v", n = 5, indent = 1, cont = true, text = "The testimony of the Lord is on the ways of men in His visitation." },
  { t = "v", n = 6, indent = 1, text = "Just and kind is our Lord in His judgements for ever," },
  { t = "v", n = 6, indent = 1, cont = true, text = "And Israel shall praise the name of the Lord in gladness." },
  { t = "v", n = 7, indent = 1, text = "And the pious shall give thanks in the assembly of the people;" },
  { t = "v", n = 7, indent = 1, cont = true, text = "And on the poor shall God have mercy in the gladness of Israel;" },
  { t = "v", n = 8, indent = 1, text = "For good and merciful is God for ever," },
  { t = "v", n = 8, indent = 1, cont = true, text = "And the assemblies of Israel shall glorify the name of the Lord." },
  { t = "v", n = 8, indent = 1, cont = true, text = "The salvation of the Lord be upon the house of Israel unto everlasting gladness!" },
]

[[section]]
id = "11"
title = "Psalm 11"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of Solomon. Unto expectation." },
  { t = "v", n = 1, indent = 1, text = "Blow ye in Zion on the trumpet to summon the saints," },
  { t = "v", n = 2, indent = 1, text = "Cause ye to be heard in Jerusalem the voice of him that bringeth good tidings;" },
  { t = "v", n = 2, indent = 1, cont = true, text = "For God hath had pity on Israel in visiting them." },
  { t = "v", n = 3, indent = 1, text = "Stand on the height, O Jerusalem, and behold thy children," },
  { t = "v", n = 3, indent = 1, cont = true, text = "From the East and the West, gathered together by the Lord;" },
  { t = "v", n = 4, indent = 1, text = "From the North they come in the gladness of their God," },
  { t = "v", n = 4, indent = 1, cont = true, text = "From the isles afar off God hath gathered them." },
  { t = "v", n = 5, indent = 1, text = "High mountains hath He abased into a plain for them;" },
  { t = "v", n = 6, indent = 1, text = "The hills fled at their entrance." },
  { t = "v", n = 6, indent = 1, cont = true, text = "The woods gave them shelter as they passed by;" },
  { t = "v", n = 7, indent = 1, text = "Every sweet-smelling tree God caused to spring up for them," },
  { t = "v", n = 7, indent = 1, cont = true, text = "That Israel might pass by in the visitation of the glory of their God." },
  { t = "v", n = 8, indent = 1, text = "Put on, O Jerusalem, thy glorious garments;" },
  { t = "v", n = 8, indent = 1, cont = true, text = "Make ready thy holy robe;" },
  { t = "v", n = 8, indent = 1, cont = true, text = "For God hath spoken good concerning Israel, for ever and ever." },
  { t = "v", n = 9, indent = 1, text = "Let the Lord do what He hath spoken concerning Israel and Jerusalem;" },
  { t = "v", n = 9, indent = 1, cont = true, text = "Let the Lord raise up Israel by His glorious name." },
  { t = "v", n = 9, indent = 1, cont = true, text = "The mercy of the Lord be upon Israel for ever and ever." },
]

[[section]]
id = "12"
title = "Psalm 12"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of Solomon. Against the tongue of transgressors." },
  { t = "v", n = 1, indent = 1, text = "O Lord, deliver my soul from the lawless and wicked man," },
  { t = "v", n = 1, indent = 1, cont = true, text = "From the tongue that is lawless and slanderous, and speaketh lies and deceit." },
  { t = "v", n = 2, indent = 1, text = "Manifoldly twisted are the words of the tongue of the wicked man," },
  { t = "v", n = 2, indent = 1, cont = true, text = "Even as . . . a fire that burneth up . . ." },
  { t = "v", n = 3, indent = 1, text = ". . . to fill houses with a lying tongue," },
  { t = "v", n = 3, indent = 1, cont = true, text = "To cut down the trees of gladness . . ." },
  { t = "v", n = 4, indent = 1, text = "To involve households in warfare by means of slanderous lips." },
  { t = "v", n = 4, indent = 1, cont = true, text = "May God remove far from the innocent the lips of transgressors by bringing them to want" },
  { t = "v", n = 4, indent = 1, cont = true, text = "And may the bones of slanderers be scattered far away from them that fear the Lord!" },
  { t = "v", n = 5, indent = 1, text = "In flaming fire perish the slanderous tongue far away from the pious!" },
  { t = "v", n = 6, indent = 1, text = "May the Lord preserve the quiet soul that hateth the unrighteous;" },
  { t = "v", n = 6, indent = 1, cont = true, text = "And may the Lord establish the man that followeth peace at home." },
  { t = "v", n = 7, indent = 1, text = "The salvation of the Lord be upon Israel His servant for ever;" },
  { t = "v", n = 7, indent = 1, cont = true, text = "And let the sinners perish together at the presence of the Lord;" },
  { t = "v", n = 7, indent = 1, cont = true, text = "But let the Lord's pious ones inherit the promises of the Lord." },
]

[[section]]
id = "13"
title = "Psalm 13"
level = 1
blocks = [
  { t = "h", level = 3, text = "Of Solomon. A Psalm. Comfort for the righteous." },
  { t = "v", n = 1, indent = 1, text = "The right hand of the Lord hath covered me;" },
  { t = "v", n = 1, indent = 1, cont = true, text = "The right hand of the Lord hath spared us." },
  { t = "v", n = 2, indent = 1, text = "The arm of the Lord hath saved us from the sword that passed through," },
  { t = "v", n = 2, indent = 1, cont = true, text = "From famine and the death of sinners." },
  { t = "v", n = 3, indent = 1, text = "Noisome beasts ran upon them:" },
  { t = "v", n = 3, indent = 1, cont = true, text = "With their teeth they tore their flesh," },
  { t = "v", n = 3, indent = 1, cont = true, text = "And with their molars crushed their bones." },
  { t = "v", n = 3, indent = 1, cont = true, text = "But from all these things the Lord delivered us." },
  { t = "v", n = 4, indent = 1, text = "The righteous was troubled on account of his errors," },
  { t = "v", n = 4, indent = 1, cont = true, text = "Lest he should be taken away along with the sinners;" },
  { t = "v", n = 5, indent = 1, text = "For terrible is the overthrow of the sinner;" },
  { t = "v", n = 5, indent = 1, cont = true, text = "But not one of all these things toucheth the righteous." },
  { t = "v", n = 5, indent = 1, cont = true, text = "For not alike are the chastening of the righteous for sins done in ignorance," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And the overthrow of the sinners." },
  { t = "v", n = 7, indent = 1, text = "Secretly is the righteous chastened," },
  { t = "v", n = 7, indent = 1, cont = true, text = "Lest the sinner rejoice over the righteous." },
  { t = "v", n = 8, indent = 1, text = "For He correcteth the righteous as a beloved son." },
  { t = "v", n = 8, indent = 1, cont = true, text = "And his chastisement is as that of a firstborn." },
  { t = "v", n = 9, indent = 1, text = "For the Lord spareth His pious ones," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And blotteth out their errors by His chastening." },
  { t = "v", n = 9, indent = 1, cont = true, text = "For the life of the righteous shall be for ever;" },
  { t = "v", n = 10, indent = 1, text = "But sinners shall be taken away into destruction,," },
  { t = "v", n = 10, indent = 1, cont = true, text = "And their memorial shall be found no more." },
  { t = "v", n = 11, indent = 1, text = "But upon the pious is the mercy of the Lord," },
  { t = "v", n = 11, indent = 1, cont = true, text = "And upon them that fear Him His mercy." },
]

[[section]]
id = "14"
title = "Psalm 14"
level = 1
blocks = [
  { t = "h", level = 3, text = "A Hymn. Of Solomon." },
  { t = "v", n = 1, indent = 1, text = "Faithful is the Lord to them that love Him in truth," },
  { t = "v", n = 1, indent = 1, cont = true, text = "To them that endure His chastening," },
  { t = "v", n = 1, indent = 1, cont = true, text = "To them that walk in the righteousness of His commandments," },
  { t = "v", n = 1, indent = 1, cont = true, text = "In the law which He commanded us that we might live." },
  { t = "v", n = 2, indent = 1, text = "The pious of the Lord shall live by it for ever;" },
  { t = "v", n = 2, indent = 1, cont = true, text = "The Paradise of the Lord, the trees of life, are His pious ones." },
  { t = "v", n = 3, indent = 1, text = "Their planting is rooted for ever;" },
  { t = "v", n = 3, indent = 1, cont = true, text = "They shall not be plucked up all the days of heaven:" },
  { t = "v", n = 3, indent = 1, cont = true, text = "For the portion and the inheritance of God is Israel." },
  { t = "v", n = 4, indent = 1, text = "But not so are the sinners and transgressors," },
  { t = "v", n = 4, indent = 1, cont = true, text = "Who love the brief day spent in companionship with their sin;" },
  { t = "v", n = 4, indent = 1, cont = true, text = "Their delight is in fleeting corruption," },
  { t = "v", n = 5, indent = 1, text = "And they remember not God." },
  { t = "v", n = 5, indent = 1, cont = true, text = "For the ways of men are known before Him at all times," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And He knoweth the secrets of the heart before they come to pass." },
  { t = "v", n = 6, indent = 1, text = "Therefore their inheritance is Sheol and darkness and destruction" },
  { t = "v", n = 6, indent = 1, cont = true, text = "And they shall not be found in the day when the righteous obtain mercy;" },
  { t = "v", n = 7, indent = 1, text = "But the pious of the Lord shall inherit life in gladness." },
]

[[section]]
id = "15"
title = "Psalm 15"
level = 1
blocks = [
  { t = "h", level = 3, text = "A Psalm. Of Solomon. With a Song." },
  { t = "v", n = 1, indent = 1, text = "When I was in distress I called upon the name of the Lord," },
  { t = "v", n = 1, indent = 1, cont = true, text = "I hoped for the help of the God of Jacob and was saved;" },
  { t = "v", n = 2, indent = 1, text = "For the hope and refuge of the poor art Thou, O God." },
  { t = "v", n = 3, indent = 1, text = "For who, O God, is strong except to give thanks unto Thee in truth?" },
  { t = "v", n = 4, indent = 1, text = "And wherein is a man powerful except in giving thanks to Thy name?" },
  { t = "v", n = 5, indent = 1, text = "A new psalm with song in gladness of heart," },
  { t = "v", n = 5, indent = 1, cont = true, text = "The fruit of the lips with the well-tuned instrument of the tongue," },
  { t = "v", n = 5, indent = 1, cont = true, text = "The firstfruits of the lips from a pious and righteous heart—" },
  { t = "v", n = 6, indent = 1, text = "He that offereth these things shall never be shaken by evil;" },
  { t = "v", n = 6, indent = 1, cont = true, text = "The flame of fire and the wrath against the unrighteous shall not touch him," },
  { t = "v", n = 7, indent = 1, text = "When it goeth forth from the face of the Lord against sinners," },
  { t = "v", n = 7, indent = 1, cont = true, text = "To destroy all the substance of sinners," },
  { t = "v", n = 8, indent = 1, text = "For the mark of God is upon the righteous that they may be saved." },
  { t = "v", n = 8, indent = 1, cont = true, text = "Famine and sword and pestilence shall be far from the righteous," },
  { t = "v", n = 9, indent = 1, text = "For they shall flee away from the pious as men pursued in war;" },
  { t = "v", n = 9, indent = 1, cont = true, text = "But they shall pursue sinners and overtake them," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And they that do lawlessness shall not escape the judgement of God;" },
  { t = "v", n = 9, indent = 1, cont = true, text = "As by enemies experienced in war shall they be overtaken," },
  { t = "v", n = 10, indent = 1, text = "For the mark of destruction is upon their forehead." },
  { t = "v", n = 11, indent = 1, text = "And the inheritance of sinners is destruction and darkness," },
  { t = "v", n = 11, indent = 1, cont = true, text = "And their iniquities shall pursue them unto Sheol beneath." },
  { t = "v", n = 12, indent = 1, text = "Their inheritance shall not be found of their children," },
  { t = "v", n = 13, indent = 1, text = "For sins shall lay waste the houses of sinners." },
  { t = "v", n = 13, indent = 1, cont = true, text = "And sinners shall perish for ever in the day of the Lord's judgement," },
  { t = "v", n = 14, indent = 1, text = "When God visiteth the earth with His judgement." },
  { t = "v", n = 15, indent = 1, text = "But they that fear the Lord shall find mercy therein," },
  { t = "v", n = 15, indent = 1, cont = true, text = "And shall live by the compassion of their God;" },
  { t = "v", n = 15, indent = 1, cont = true, text = "But sinners shall perish for ever." },
]

[[section]]
id = "16"
title = "Psalm 16"
level = 1
blocks = [
  { t = "h", level = 3, text = "A Hymn. Of Solomon. For Help to the Pious." },
  { t = "v", n = 1, indent = 1, text = "When my soul slumbered being afar from the Lord, I had all but slipped down to the pit," },
  { t = "v", n = 2, indent = 1, text = "When I was far from God, my soul had been wellnigh poured out unto death," },
  { t = "v", n = 2, indent = 1, cont = true, text = "I had been nigh unto the gates of Sheol with the sinner," },
  { t = "v", n = 3, indent = 1, text = "When my soul departed from the Lord God of Israel—" },
  { t = "v", n = 3, indent = 1, cont = true, text = "Had not the Lord helped me with His everlasting mercy." },
  { t = "v", n = 4, indent = 1, text = "He pricked me, as a horse is pricked, that I might serve Him," },
  { t = "v", n = 4, indent = 1, cont = true, text = "My saviour and helper at all times saved me." },
  { t = "v", n = 5, indent = 1, text = "I will give thanks unto Thee, O God, for Thou hast helped me to my salvation;" },
  { t = "v", n = 5, indent = 1, cont = true, text = "And hast not counted me with sinners to my destruction." },
  { t = "v", n = 6, indent = 1, text = "Remove not Thy mercy from me, O God," },
  { t = "v", n = 6, indent = 1, cont = true, text = "Nor Thy memorial from my heart until I die." },
  { t = "v", n = 7, indent = 1, text = "Rule me, O God, keeping me back from wicked sin," },
  { t = "v", n = 7, indent = 1, cont = true, text = "And from every wicked woman that causeth the simple to stumble." },
  { t = "v", n = 8, indent = 1, text = "And let not the beauty of a lawless woman beguile me," },
  { t = "v", n = 8, indent = 1, cont = true, text = "Nor any one that is subject to unprofitable sin." },
  { t = "v", n = 9, indent = 1, text = "Establish the works of my hands before Thee," },
  { t = "v", n = 9, indent = 1, cont = true, text = "And preserve my goings in the remembrance of Thee." },
  { t = "v", n = 10, indent = 1, text = "Protect my tongue and my lips with words of truth;" },
  { t = "v", n = 10, indent = 1, cont = true, text = "Anger and unreasoning wrath put far from me." },
  { t = "v", n = 11, indent = 1, text = "Murmuring, and impatience in affliction, remove far from me" },
  { t = "v", n = 11, indent = 1, cont = true, text = "When, if I sin, Thou chastenest me that I may return unto Thee." },
  { t = "v", n = 12, indent = 1, text = "But with goodwill and cheerfulness support my soul;" },
  { t = "v", n = 12, indent = 1, cont = true, text = "When Thou strengthenest my soul, what is given to me will be sufficient for me." },
  { t = "v", n = 13, indent = 1, text = "For if Thou givest not strength," },
  { t = "v", n = 13, indent = 1, cont = true, text = "Who can endure chastisement with poverty?" },
  { t = "v", n = 14, indent = 1, text = "When a man is rebuked by means of his corruption," },
  { t = "v", n = 14, indent = 1, cont = true, text = "Thy testing of him is in his flesh and in the affliction of poverty." },
  { t = "v", n = 15, indent = 1, text = "If the righteous endureth in all these trials, he shall receive mercy from the Lord." },
]

[[section]]
id = "17"
title = "Psalm 17"
level = 1
blocks = [
  { t = "h", level = 3, text = "A Psalm. Of Solomon. With Song. Of the King." },
  { t = "v", n = 1, indent = 1, text = "O Lord, Thou art our King for ever and ever," },
  { t = "v", n = 1, indent = 1, cont = true, text = "For in Thee, O God, doth our soul glory." },
  { t = "v", n = 2, indent = 1, text = "How long are the days of man's life upon the earth?" },
  { t = "v", n = 2, indent = 1, cont = true, text = "As are his days, so is the hope set upon him." },
  { t = "v", n = 3, indent = 1, text = "But we hope in God, our deliverer;" },
  { t = "v", n = 3, indent = 1, cont = true, text = "For the might of our God is for ever with mercy," },
  { t = "v", n = 4, indent = 1, text = "And the kingdom of our God is for ever over the nations in judgement." },
  { t = "v", n = 5, indent = 1, text = "Thou, O Lord, didst choose David to be king over Israel," },
  { t = "v", n = 5, indent = 1, cont = true, text = "And swaredst to him touching his seed that never should his kingdom fail before Thee." },
  { t = "v", n = 6, indent = 1, text = "But, for our sins, sinners rose up against us;" },
  { t = "v", n = 6, indent = 1, cont = true, text = "They assailed us and thrust us out;" },
  { t = "v", n = 6, indent = 1, cont = true, text = "What Thou hadst not promised to them, they took away from us with violence." },
  { t = "v", n = 7, indent = 1, text = "They in no wise glorified Thy honourable name;" },
  { t = "v", n = 7, indent = 1, cont = true, text = "They set a worldly monarchy in place of that which was their excellency;" },
  { t = "v", n = 8, indent = 1, text = "They laid waste the throne of David in tumultuous arrogance." },
  { t = "v", n = 8, indent = 1, cont = true, text = "But Thou, O God, didst cast them down, and remove their seed from the earth," },
  { t = "v", n = 9, indent = 1, text = "In that there rose up against them a man that was alien to our race." },
  { t = "v", n = 10, indent = 1, text = "According to their sins didst Thou recompense them, O God;" },
  { t = "v", n = 10, indent = 1, cont = true, text = "So that it befell them according to their deeds." },
  { t = "v", n = 11, indent = 1, text = "God showed them no pity;" },
  { t = "v", n = 11, indent = 1, cont = true, text = "He sought out their seed and let not one of them go free." },
  { t = "v", n = 12, indent = 1, text = "Faithful is the Lord in all His judgements" },
  { t = "v", n = 12, indent = 1, cont = true, text = "Which He doeth upon the earth." },
  { t = "v", n = 13, indent = 1, text = "The lawless one laid waste our land so that none inhabited it," },
  { t = "v", n = 13, indent = 1, cont = true, text = "They destroyed young and old and their children together." },
  { t = "v", n = 14, indent = 1, text = "In the heat of His anger He sent them away even unto the west," },
  { t = "v", n = 14, indent = 1, cont = true, text = "And He exposed the rulers of the land unsparingly to derision." },
  { t = "v", n = 15, indent = 1, text = "Being an alien the enemy acted proudly," },
  { t = "v", n = 15, indent = 1, cont = true, text = "And his heart was alien from Our God." },
  { t = "v", n = 16, indent = 1, text = "And all things whatsoever he did in Jerusalem," },
  { t = "v", n = 16, indent = 1, cont = true, text = "As also the nations in the cities to their gods." },
  { t = "v", n = 17, indent = 1, text = "And the children of the covenant in the midst of the mingled peoples surpassed them in evil." },
  { t = "v", n = 17, indent = 1, cont = true, text = "There was not among them one that wrought in the midst of Jerusalem mercy and truth." },
  { t = "v", n = 18, indent = 1, text = "They that loved the synagogues of the pious fled from them," },
  { t = "v", n = 18, indent = 1, cont = true, text = "As sparrows that fly from their nest." },
  { t = "v", n = 19, indent = 1, text = "They wandered in deserts that their lives might be saved from harm," },
  { t = "v", n = 19, indent = 1, cont = true, text = "And precious in the eyes of them that lived abroad was any that escaped alive from them." },
  { t = "v", n = 20, indent = 1, text = "Over the whole earth were they scattered by lawless men." },
  { t = "v", n = 21, indent = 1, text = "For the heavens withheld the rain from dropping upon the earth," },
  { t = "v", n = 21, indent = 1, cont = true, text = "Springs were stopped that sprang perennially out of the deeps, that ran down from lofty mountains." },
  { t = "v", n = 21, indent = 1, cont = true, text = "For there was none among them that wrought righteousness and justice;" },
  { t = "v", n = 21, indent = 1, cont = true, text = "From the chief of them to the least of them all were sinful;" },
  { t = "v", n = 22, indent = 1, text = "The king was a transgressor, and the judge disobedient, and the people sinful." },
  { t = "v", n = 23, indent = 1, text = "Behold, O Lord, and raise up unto them their king, the son of David," },
  { t = "v", n = 23, indent = 1, cont = true, text = "At the time in the which Thou seest, O God, that he may reign over Israel Thy servant." },
  { t = "v", n = 24, indent = 1, text = "And gird him with strength, that he may shatter unrighteous rulers," },
  { t = "v", n = 25, indent = 1, text = "And that he may purge Jerusalem from nations that trample her down to destruction." },
  { t = "v", n = 26, indent = 1, text = "Wisely, righteously he shall thrust out sinners from the inheritance," },
  { t = "v", n = 26, indent = 1, cont = true, text = "He shall destroy the pride of the sinner as a potter's vessel." },
  { t = "v", n = 26, indent = 1, cont = true, text = "With a rod of iron he shall break in pieces all their substance," },
  { t = "v", n = 27, indent = 1, text = "He shall destroy the godless nations with the word of his mouth;" },
  { t = "v", n = 27, indent = 1, cont = true, text = "At his rebuke nations shall flee before him," },
  { t = "v", n = 27, indent = 1, cont = true, text = "And he shall reprove sinners for the thoughts of their heart." },
  { t = "v", n = 28, indent = 1, text = "And he shall gather together a holy people, whom he shall lead in righteousness," },
  { t = "v", n = 28, indent = 1, cont = true, text = "And he shall judge the tribes of the people that has been sanctified by the Lord his God." },
  { t = "v", n = 29, indent = 1, text = "And he shall not suffer unrighteousness to lodge any more in their midst," },
  { t = "v", n = 29, indent = 1, cont = true, text = "Nor shall there dwell with them any man that knoweth wickedness," },
  { t = "v", n = 30, indent = 1, text = "For he shall know them, that they are all sons of their God." },
  { t = "v", n = 30, indent = 1, cont = true, text = "And he shall divide them according to their tribes upon the land," },
  { t = "v", n = 31, indent = 1, text = "And neither sojourner nor alien shall sojourn with them any more." },
  { t = "v", n = 31, indent = 1, cont = true, text = "He shall judge peoples and nations in the wisdom of his righteousness. Selah." },
  { t = "v", n = 32, indent = 1, text = "And he shall have the heathen nations to serve him under his yoke;" },
  { t = "v", n = 32, indent = 1, cont = true, text = "And he shall glorify the Lord in a place to be seen of all the earth;" },
  { t = "v", n = 33, indent = 1, text = "And he shall purge Jerusalem, making it holy as of old:" },
  { t = "v", n = 34, indent = 1, text = "So that nations shall come from the ends of the earth to see his glory," },
  { t = "v", n = 34, indent = 1, cont = true, text = "Bringing as gifts her sons who had fainted." },
  { t = "v", n = 35, indent = 1, text = "And to see the glory of the Lord, wherewith God hath glorified her." },
  { t = "v", n = 35, indent = 1, cont = true, text = "And he shall be a righteous king, taught of God, over them," },
  { t = "v", n = 36, indent = 1, text = "And there shall be no unrighteousness in his days in their midst," },
  { t = "v", n = 36, indent = 1, cont = true, text = "For all shall be holy and their king the anointed of the Lord." },
  { t = "v", n = 37, indent = 1, text = "For he shall not put his trust in horse and rider and bow," },
  { t = "v", n = 37, indent = 1, cont = true, text = "Nor shall he multiply for himself gold and silver for war," },
  { t = "v", n = 37, indent = 1, cont = true, text = "Nor shall he gather confidence from a multitude for the day of battle." },
  { t = "v", n = 38, indent = 1, text = "The Lord Himself is his king, the hope of him that is mighty through his hope in God." },
  { t = "v", n = 38, indent = 1, cont = true, text = "All nations shall be in fear before him," },
  { t = "v", n = 39, indent = 1, text = "For he will smite the earth with the word of his mouth for ever." },
  { t = "v", n = 40, indent = 1, text = "He will bless the people of the Lord with wisdom and gladness," },
  { t = "v", n = 41, indent = 1, text = "And he himself will be pure from sin, so that he may rule a great people." },
  { t = "v", n = 41, indent = 1, cont = true, text = "He will rebuke rulers, and remove sinners by the might of his word;" },
  { t = "v", n = 42, indent = 1, text = "And relying upon his God, throughout his days he will not stumble;" },
  { t = "v", n = 42, indent = 1, cont = true, text = "For God will make him mighty by means of His holy spirit," },
  { t = "v", n = 42, indent = 1, cont = true, text = "And wise by means of the spirit of understanding, with strength and righteousness." },
  { t = "v", n = 43, indent = 1, text = "And the blessing of the Lord will be with him: he will be strong and stumble not;" },
  { t = "v", n = 44, indent = 1, text = "His hope will be in the Lord: who then can prevail against him?" },
  { t = "v", n = 44, indent = 1, cont = true, text = "He will, be mighty in his works, and strong in the fear of God," },
  { t = "v", n = 45, indent = 1, text = "He will be shepherding the flock of the Lord faithfully and righteously," },
  { t = "v", n = 45, indent = 1, cont = true, text = "And will suffer none among them to stumble in their pasture." },
  { t = "v", n = 46, indent = 1, text = "He will lead them all aright," },
  { t = "v", n = 46, indent = 1, cont = true, text = "And there will be no pride among them that any among them should be oppressed." },
  { t = "v", n = 47, indent = 1, text = "This will be the majesty of the king of Israel whom God knoweth;" },
  { t = "v", n = 47, indent = 1, cont = true, text = "He will raise him up over the house of Israel to correct him." },
  { t = "v", n = 48, indent = 1, text = "His words shall be more refined than costly gold, the choicest;" },
  { t = "v", n = 48, indent = 1, cont = true, text = "In the assemblies he will judge the peoples, the tribes of the sanctified." },
  { t = "v", n = 49, indent = 1, text = "His words shall be like the words of the holy ones in the midst of sanctified peoples." },
  { t = "v", n = 50, indent = 1, text = "Blessed be they that shall be in those days," },
  { t = "v", n = 50, indent = 1, cont = true, text = "In that they shall see the good fortune of Israel which God shall bring to pass in the gathering together of the tribes." },
  { t = "v", n = 51, indent = 1, text = "May the Lord hasten His mercy upon Israel!" },
  { t = "v", n = 51, indent = 1, cont = true, text = "May He deliver us from the uncleanness of unholy enemies!" },
  { t = "v", n = 51, indent = 1, cont = true, text = "The Lord Himself is our king for ever and ever." },
]

[[section]]
id = "18"
title = "Psalm 18"
level = 1
blocks = [
  { t = "h", level = 3, text = "A Psalm. Of Solomon. Again of the Anointed of the Lord." },
  { t = "v", n = 1, indent = 1, text = "Lord, Thy mercy is over the works of Thy hands for ever;" },
  { t = "v", n = 1, indent = 1, cont = true, text = "Thy goodness is over Israel with a rich gift." },
  { t = "v", n = 2, indent = 1, text = "Thine eyes look upon them, so that none of them suffers want;" },
  { t = "v", n = 3, indent = 1, text = "Thine ears listen to the hopeful prayer of the poor." },
  { t = "v", n = 3, indent = 1, cont = true, text = "Thy judgements are executed upon the whole earth in mercy;" },
  { t = "v", n = 4, indent = 1, text = "And Thy love is toward the seed of Abraham, the children of Israel." },
  { t = "v", n = 4, indent = 1, cont = true, text = "Thy chastisement is upon us as upon a first-born, only-begotten son," },
  { t = "v", n = 5, indent = 1, text = "To turn back the obedient soul from folly that is wrought in ignorance." },
  { t = "v", n = 6, indent = 1, text = "May God cleanse Israel against the day of mercy and blessing," },
  { t = "v", n = 6, indent = 1, cont = true, text = "Against the day of choice when He bringeth back His anointed." },
  { t = "v", n = 7, indent = 1, text = "Blessed shall they be that shall be in those days," },
  { t = "v", n = 7, indent = 1, cont = true, text = "He bringeth back His anointed." },
  { t = "v", n = 7, indent = 1, cont = true, text = "In that they shall see the goodness of the Lord which He shall perform for the generation that is to come," },
  { t = "v", n = 8, indent = 1, text = "Under the rod of chastening of the Lord's anointed in the fear of his God," },
  { t = "v", n = 8, indent = 1, cont = true, text = "In the spirit of wisdom and righteousness and strength;" },
  { t = "v", n = 9, indent = 1, text = "That he may direct every man in the works of righteousness by the fear of God," },
  { t = "v", n = 9, indent = 1, cont = true, text = "That he may establish them all before the Lord," },
  { t = "v", n = 10, indent = 1, text = "A good generation living in the fear of God in the days of mercy. Selah." },
  { t = "v", n = 11, indent = 1, text = "Great is our God and glorious, dwelling in the highest." },
  { t = "v", n = 12, indent = 1, text = "It is He who hath established in their courses the lights of heaven for determining seasons from year to year," },
  { t = "v", n = 12, indent = 1, cont = true, text = "And they have not turned aside from the way which He appointed them." },
  { t = "v", n = 13, indent = 1, text = "In the fear of God they pursue their path every day," },
  { t = "v", n = 13, indent = 1, cont = true, text = "From the day God created them and for evermore." },
  { t = "v", n = 14, indent = 1, text = "And they have erred not since the day He created them." },
  { t = "v", n = 14, indent = 1, cont = true, text = "Since the generations of old they have not withdrawn from their path," },
  { t = "v", n = 14, indent = 1, cont = true, text = "Unless God commanded them so to do by the command of His servants." },
]

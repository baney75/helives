[[section]]
id = "1"
title = "Wisdom 1"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Love righteousness, ye that be judges of the earth: think of the Lord with a good (heart,) and in simplicity of heart seek him." },
  { t = "v", n = 2, p = true, text = "For he will be found of them that tempt him not; and sheweth himself unto such as do not distrust him." },
  { t = "v", n = 3, p = true, text = "For froward thoughts separate from God: and his power, when it is tried, reproveth the unwise." },
  { t = "v", n = 4, p = true, text = "For into a malicious soul wisdom shall not enter; nor dwell in the body that is subject unto sin." },
  { t = "v", n = 5, p = true, text = "For the holy spirit of discipline will flee deceit, and remove from thoughts that are without understanding, and will not abide when unrighteousness cometh in." },
  { t = "v", n = 6, p = true, text = "For wisdom is a loving spirit; and will not acquit a blasphemer of his words: for God is witness of his reins, and a true beholder of his heart, and a hearer of his tongue." },
  { t = "v", n = 7, p = true, text = "For the Spirit of the Lord filleth the world: and that which containeth all things hath knowledge of the voice." },
  { t = "v", n = 8, p = true, text = "Therefore he that speaketh unrighteous things cannot be hid: neither shall vengeance, when it punisheth, pass by him." },
  { t = "v", n = 9, p = true, text = "For inquisition shall be made into the counsels of the ungodly: and the sound of his words shall come unto the Lord for the manifestation of his wicked deeds." },
  { t = "v", n = 10, p = true, text = "For the ear of jealousy heareth all things: and the noise of murmurings is not hid." },
  { t = "v", n = 11, p = true, text = "Therefore beware of murmuring, which is unprofitable; and refrain your tongue from backbiting: for there is no word so secret, that shall go for nought: and the mouth that belieth slayeth the soul." },
  { t = "v", n = 12, p = true, text = "Seek not death in the error of your life: and pull not upon yourselves destruction with the works of your hands." },
  { t = "v", n = 13, p = true, text = "For God made not death: neither hath he pleasure in the destruction of the living." },
  { t = "v", n = 14, p = true, text = "For he created all things, that they might have their being: and the generations of the world were healthful; and there is no poison of destruction in them, nor the kingdom of death upon the earth:" },
  { t = "v", n = 15, p = true, text = "(For righteousness is immortal:)" },
  { t = "v", n = 16, p = true, text = "But ungodly men with their works and words called it to them: for when they thought to have it their friend, they consumed to nought, and made a covenant with it, because they are worthy to take part with it." },
]

[[section]]
id = "2"
title = "Wisdom 2"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "For the ungodly said, reasoning with themselves, but not aright, Our life is short and tedious, and in the death of a man there is no remedy: neither was there any man known to have returned from the grave." },
  { t = "v", n = 2, p = true, text = "For we are born at all adventure: and we shall be hereafter as though we had never been: for the breath in our nostrils is as smoke, and a little spark in the moving of our heart:" },
  { t = "v", n = 3, p = true, text = "Which being extinguished, our body shall be turned into ashes, and our spirit shall vanish as the soft air," },
  { t = "v", n = 4, p = true, text = "And our name shall be forgotten in time, and no man shall have our works in remembrance, and our life shall pass away as the trace of a cloud, and shall be dispersed as a mist, that is driven away with the beams of the sun, and overcome with the heat thereof." },
  { t = "v", n = 5, p = true, text = "For our time is a very shadow that passeth away; and after our end there is no returning: for it is fast sealed, so that no man cometh again." },
  { t = "v", n = 6, p = true, text = "Come on therefore, let us enjoy the good things that are present: and let us speedily use the creatures like as in youth." },
  { t = "v", n = 7, p = true, text = "Let us fill ourselves with costly wine and ointments: and let no flower of the spring pass by us:" },
  { t = "v", n = 8, p = true, text = "Let us crown ourselves with rosebuds, before they be withered:" },
  { t = "v", n = 9, p = true, text = "Let none of us go without his part of our voluptuousness: let us leave tokens of our joyfulness in every place: for this is our portion, and our lot is this." },
  { t = "v", n = 10, p = true, text = "Let us oppress the poor righteous man, let us not spare the widow, nor reverence the ancient gray hairs of the aged." },
  { t = "v", n = 11, p = true, text = "Let our strength be the law of justice: for that which is feeble is found to be nothing worth." },
  { t = "v", n = 12, p = true, text = "Therefore let us lie in wait for the righteous; because he is not for our turn, and he is clean contrary to our doings: he upbraideth us with our offending the law, and objecteth to our infamy the transgressings of our education." },
  { t = "v", n = 13, p = true, text = "He professeth to have the knowledge of God: and he calleth himself the child of the Lord." },
  { t = "v", n = 14, p = true, text = "He was made to reprove our thoughts." },
  { t = "v", n = 15, p = true, text = "He is grievous unto us even to behold: for his life is not like other men’s, his ways are of another fashion." },
  { t = "v", n = 16, p = true, text = "We are esteemed of him as counterfeits: he abstaineth from our ways as from filthiness: he pronounceth the end of the just to be blessed, and maketh his boast that God is his father." },
  { t = "v", n = 17, p = true, text = "Let us see if his words be true: and let us prove what shall happen in the end of him." },
  { t = "v", n = 18, p = true, text = "For if the just man be the son of God, he will help him, and deliver him from the hand of his enemies." },
  { t = "v", n = 19, p = true, text = "Let us examine him with despitefulness and torture, that we may know his meekness, and prove his patience." },
  { t = "v", n = 20, p = true, text = "Let us condemn him with a shameful death: for by his own saying he shall be respected." },
  { t = "v", n = 21, p = true, text = "Such things they did imagine, and were deceived: for their own wickedness hath blinded them." },
  { t = "v", n = 22, p = true, text = "As for the mysteries of God, they knew them not: neither hoped they for the wages of righteousness, nor discerned a reward for blameless souls." },
  { t = "v", n = 23, p = true, text = "For God created man to be immortal, and made him to be an image of his own eternity." },
  { t = "v", n = 24, p = true, text = "Nevertheless through envy of the devil came death into the world: and they that do hold of his side do find it." },
]

[[section]]
id = "3"
title = "Wisdom 3"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "But the souls of the righteous are in the hand of God, and there shall no torment touch them." },
  { t = "v", n = 2, p = true, text = "In the sight of the unwise they seemed to die: and their departure is taken for misery," },
  { t = "v", n = 3, p = true, text = "And their going from us to be utter destruction: but they are in peace." },
  { t = "v", n = 4, p = true, text = "For though they be punished in the sight of men, yet is their hope full of immortality." },
  { t = "v", n = 5, p = true, text = "And having been a little chastised, they shall be greatly rewarded: for God proved them, and found them worthy for himself." },
  { t = "v", n = 6, p = true, text = "As gold in the furnace hath he tried them, and received them as a burnt offering." },
  { t = "v", n = 7, p = true, text = "And in the time of their visitation they shall shine, and run to and fro like sparks among the stubble." },
  { t = "v", n = 8, p = true, text = "They shall judge the nations, and have dominion over the people, and their Lord shall reign for ever." },
  { t = "v", n = 9, p = true, text = "They that put their trust in him shall understand the truth: and such as be faithful in love shall abide with him: for grace and mercy is to his saints, and he hath care for his elect." },
  { t = "v", n = 10, p = true, text = "But the ungodly shall be punished according to their own imaginations, which have neglected the righteous, and forsaken the Lord." },
  { t = "v", n = 11, p = true, text = "For whoso despiseth wisdom and nurture, he is miserable, and their hope is vain, their labours unfruitful, and their works unprofitable:" },
  { t = "v", n = 12, p = true, text = "Their wives are foolish, and their children wicked:" },
  { t = "v", n = 13, p = true, text = "Their offspring is cursed. Wherefore blessed is the barren that is undefiled, which hath not known the sinful bed: she shall have fruit in the visitation of souls." },
  { t = "v", n = 14, p = true, text = "And blessed is the eunuch, which with his hands hath wrought no iniquity, nor imagined wicked things against God: for unto him shall be given the special gift of faith, and an inheritance in the temple of the Lord more acceptable to his mind." },
  { t = "v", n = 15, p = true, text = "For glorious is the fruit of good labours: and the root of wisdom shall never fall away." },
  { t = "v", n = 16, p = true, text = "As for the children of adulterers, they shall not come to their perfection, and the seed of an unrighteous bed shall be rooted out." },
  { t = "v", n = 17, p = true, text = "For though they live long, yet shall they be nothing regarded: and their last age shall be without honour." },
  { t = "v", n = 18, p = true, text = "Or, if they die quickly, they have no hope, neither comfort in the day of trial." },
  { t = "v", n = 19, p = true, text = "For horrible is the end of the unrighteous generation." },
]

[[section]]
id = "4"
title = "Wisdom 4"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Better it is to have no children, and to have virtue: for the memorial thereof is immortal: because it is known with God, and with men." },
  { t = "v", n = 2, p = true, text = "When it is present, men take example at it; and when it is gone, they desire it: it weareth a crown, and triumpheth for ever, having gotten the victory, striving for undefiled rewards." },
  { t = "v", n = 3, p = true, text = "But the multiplying brood of the ungodly shall not thrive, nor take deep rooting from bastard slips, nor lay any fast foundation." },
  { t = "v", n = 4, p = true, text = "For though they flourish in branches for a time; yet standing not last, they shall be shaken with the wind, and through the force of winds they shall be rooted out." },
  { t = "v", n = 5, p = true, text = "The imperfect branches shall be broken off, their fruit unprofitable, not ripe to eat, yea, meet for nothing." },
  { t = "v", n = 6, p = true, text = "For children begotten of unlawful beds are witnesses of wickedness against their parents in their trial." },
  { t = "v", n = 7, p = true, text = "But though the righteous be prevented with death, yet shall he be in rest." },
  { t = "v", n = 8, p = true, text = "For honourable age is not that which standeth in length of time, nor that is measured by number of years." },
  { t = "v", n = 9, p = true, text = "But wisdom is the gray hair unto men, and an unspotted life is old age." },
  { t = "v", n = 10, p = true, text = "He pleased God, and was beloved of him: so that living among sinners he was translated." },
  { t = "v", n = 11, p = true, text = "Yea speedily was he taken away, lest that wickedness should alter his understanding, or deceit beguile his soul." },
  { t = "v", n = 12, p = true, text = "For the bewitching of naughtiness doth obscure things that are honest; and the wandering of concupiscence doth undermine the simple mind." },
  { t = "v", n = 13, p = true, text = "He, being made perfect in a short time, fulfilled a long time:" },
  { t = "v", n = 14, p = true, text = "For his soul pleased the Lord: therefore hasted he to take him away from among the wicked." },
  { t = "v", n = 15, p = true, text = "This the people saw, and understood it not, neither laid they up this in their minds, That his grace and mercy is with his saints, and that he hath respect unto his chosen." },
  { t = "v", n = 16, p = true, text = "Thus the righteous that is dead shall condemn the ungodly which are living; and youth that is soon perfected the many years and old age of the unrighteous." },
  { t = "v", n = 17, p = true, text = "For they shall see the end of the wise, and shall not understand what God in his counsel hath decreed of him, and to what end the Lord hath set him in safety." },
  { t = "v", n = 18, p = true, text = "They shall see him, and despise him; but God shall laugh them to scorn: and they shall hereafter be a vile carcase, and a reproach among the dead for evermore." },
  { t = "v", n = 19, p = true, text = "For he shall rend them, and cast them down headlong, that they shall be speechless; and he shall shake them from the foundation; and they shall be utterly laid waste, and be in sorrow; and their memorial shall perish." },
  { t = "v", n = 20, p = true, text = "And when they cast up the accounts of their sins, they shall come with fear: and their own iniquities shall convince them to their face." },
]

[[section]]
id = "5"
title = "Wisdom 5"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Then shall the righteous man stand in great boldness before the face of such as have afflicted him, and made no account of his labours." },
  { t = "v", n = 2, p = true, text = "When they see it, they shall be troubled with terrible fear, and shall be amazed at the strangeness of his salvation, so far beyond all that they looked for." },
  { t = "v", n = 3, p = true, text = "And they repenting and groaning for anguish of spirit shall say within themselves, This was he, whom we had sometimes in derision, and a proverb of reproach:" },
  { t = "v", n = 4, p = true, text = "We fools accounted his life madness, and his end to be without honour:" },
  { t = "v", n = 5, p = true, text = "How is he numbered among the children of God, and his lot is among the saints!" },
  { t = "v", n = 6, p = true, text = "Therefore have we erred from the way of truth, and the light of righteousness hath not shined unto us, and the sun of righteousness rose not upon us." },
  { t = "v", n = 7, p = true, text = "We wearied ourselves in the way of wickedness and destruction: yea, we have gone through deserts, where there lay no way: but as for the way of the Lord, we have not known it." },
  { t = "v", n = 8, p = true, text = "What hath pride profited us? or what good hath riches with our vaunting brought us?" },
  { t = "v", n = 9, p = true, text = "All those things are passed away like a shadow, and as a post that hasted by;" },
  { t = "v", n = 10, p = true, text = "And as a ship that passeth over the waves of the water, which when it is gone by, the trace thereof cannot be found, neither the pathway of the keel in the waves;" },
  { t = "v", n = 11, p = true, text = "Or as when a bird hath flown through the air, there is no token of her way to be found, but the light air being beaten with the stroke of her wings and parted with the violent noise and motion of them, is passed through, and therein afterwards no sign where she went is to be found;" },
  { t = "v", n = 12, p = true, text = "Or like as when an arrow is shot at a mark, it parteth the air, which immediately cometh together again, so that a man cannot know where it went through:" },
  { t = "v", n = 13, p = true, text = "Even so we in like manner, as soon as we were born, began to draw to our end, and had no sign of virtue to shew; but were consumed in our own wickedness." },
  { t = "v", n = 14, p = true, text = "For the hope of the ungodly is like dust that is blown away with the wind; like a thin froth that is driven away with the storm; like as the smoke which is dispersed here and there with a tempest, and passeth away as the remembrance of a guest that tarrieth but a day." },
  { t = "v", n = 15, p = true, text = "But the righteous live for evermore; their reward also is with the Lord, and the care of them is with the most High." },
  { t = "v", n = 16, p = true, text = "Therefore shall they receive a glorious kingdom, and a beautiful crown from the Lord’s hand: for with his right hand shall he cover them, and with his arm shall he protect them." },
  { t = "v", n = 17, p = true, text = "He shall take to him his jealousy for complete armour, and make the creature his weapon for the revenge of his enemies." },
  { t = "v", n = 18, p = true, text = "He shall put on righteousness as a breastplate, and true judgment instead of an helmet." },
  { t = "v", n = 19, p = true, text = "He shall take holiness for an invincible shield." },
  { t = "v", n = 20, p = true, text = "His severe wrath shall he sharpen for a sword, and the world shall fight with him against the unwise." },
  { t = "v", n = 21, p = true, text = "Then shall the right aiming thunderbolts go abroad; and from the clouds, as from a well drawn bow, shall they fly to the mark." },
  { t = "v", n = 22, p = true, text = "And hailstones full of wrath shall be cast as out of a stone bow, and the water of the sea shall rage against them, and the floods shall cruelly drown them." },
  { t = "v", n = 23, p = true, text = "Yea, a mighty wind shall stand up against them, and like a storm shall blow them away: thus iniquity shall lay waste the whole earth, and ill dealing shall overthrow the thrones of the mighty." },
]

[[section]]
id = "6"
title = "Wisdom 6"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Hear therefore, O ye kings, and understand; learn, ye that be judges of the ends of the earth." },
  { t = "v", n = 2, p = true, text = "Give ear, ye that rule the people, and glory in the multitude of nations." },
  { t = "v", n = 3, p = true, text = "For power is given you of the Lord, and sovereignty from the Highest, who shall try your works, and search out your counsels." },
  { t = "v", n = 4, p = true, text = "Because, being ministers of his kingdom, ye have not judged aright, nor kept the law, nor walked after the counsel of God;" },
  { t = "v", n = 5, p = true, text = "Horribly and speedily shall he come upon you: for a sharp judgment shall be to them that be in high places." },
  { t = "v", n = 6, p = true, text = "For mercy will soon pardon the meanest: but mighty men shall be mightily tormented." },
  { t = "v", n = 7, p = true, text = "For he which is Lord over all shall fear no man’s person, neither shall he stand in awe of any man’s greatness: for he hath made the small and great, and careth for all alike." },
  { t = "v", n = 8, p = true, text = "But a sore trial shall come upon the mighty." },
  { t = "v", n = 9, p = true, text = "Unto you therefore, O kings, do I speak, that ye may learn wisdom, and not fall away." },
  { t = "v", n = 10, p = true, text = "For they that keep holiness holily shall be judged holy: and they that have learned such things shall find what to answer." },
  { t = "v", n = 11, p = true, text = "Wherefore set your affection upon my words; desire them, and ye shall be instructed." },
  { t = "v", n = 12, p = true, text = "Wisdom is glorious, and never fadeth away: yea, she is easily seen of them that love her, and found of such as seek her." },
  { t = "v", n = 13, p = true, text = "She preventeth them that desire her, in making herself first known unto them." },
  { t = "v", n = 14, p = true, text = "Whoso seeketh her early shall have no great travail: for he shall find her sitting at his doors." },
  { t = "v", n = 15, p = true, text = "To think therefore upon her is perfection of wisdom: and whoso watcheth for her shall quickly be without care." },
  { t = "v", n = 16, p = true, text = "For she goeth about seeking such as are worthy of her, sheweth herself favourably unto them in the ways, and meeteth them in every thought." },
  { t = "v", n = 17, p = true, text = "For the very true beginning of her is the desire of discipline; and the care of discipline is love;" },
  { t = "v", n = 18, p = true, text = "And love is the keeping of her laws; and the giving heed unto her laws is the assurance of incorruption;" },
  { t = "v", n = 19, p = true, text = "And incorruption maketh us near unto God:" },
  { t = "v", n = 20, p = true, text = "Therefore the desire of wisdom bringeth to a kingdom." },
  { t = "v", n = 21, p = true, text = "If your delight be then in thrones and sceptres, O ye kings of the people, honour wisdom, that ye may reign for evermore." },
  { t = "v", n = 22, p = true, text = "As for wisdom, what she is, and how she came up, I will tell you, and will not hide mysteries from you: but will seek her out from the beginning of her nativity, and bring the knowledge of her into light, and will not pass over the truth." },
  { t = "v", n = 23, p = true, text = "Neither will I go with consuming envy; for such a man shall have no fellowship with wisdom." },
  { t = "v", n = 24, p = true, text = "But the multitude of the wise is the welfare of the world: and a wise king is the upholding of the people." },
  { t = "v", n = 25, p = true, text = "Receive therefore instruction through my words, and it shall do you good." },
]

[[section]]
id = "7"
title = "Wisdom 7"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "I myself also am a mortal man, like to all, and the offspring of him that was first made of the earth," },
  { t = "v", n = 2, p = true, text = "And in my mother’s womb was fashioned to be flesh in the time of ten months, being compacted in blood, of the seed of man, and the pleasure that came with sleep." },
  { t = "v", n = 3, p = true, text = "And when I was born, I drew in the common air, and fell upon the earth, which is of like nature, and the first voice which I uttered was crying, as all others do." },
  { t = "v", n = 4, p = true, text = "I was nursed in swaddling clothes, and that with cares." },
  { t = "v", n = 5, p = true, text = "For there is no king that had any other beginning of birth." },
  { t = "v", n = 6, p = true, text = "For all men have one entrance into life, and the like going out." },
  { t = "v", n = 7, p = true, text = "Wherefore I prayed, and understanding was given me: I called upon God, and the spirit of wisdom came to me." },
  { t = "v", n = 8, p = true, text = "I preferred her before sceptres and thrones, and esteemed riches nothing in comparison of her." },
  { t = "v", n = 9, p = true, text = "Neither compared I unto her any precious stone, because all gold in respect of her is as a little sand, and silver shall be counted as clay before her." },
  { t = "v", n = 10, p = true, text = "I loved her above health and beauty, and chose to have her instead of light: for the light that cometh from her never goeth out." },
  { t = "v", n = 11, p = true, text = "All good things together came to me with her, and innumerable riches in her hands." },
  { t = "v", n = 12, p = true, text = "And I rejoiced in them all, because wisdom goeth before them: and I knew not that she was the mother of them." },
  { t = "v", n = 13, p = true, text = "I learned diligently, and do communicate her liberally: I do not hide her riches." },
  { t = "v", n = 14, p = true, text = "For she is a treasure unto men that never faileth: which they that use become the friends of God, being commended for the gifts that come from learning." },
  { t = "v", n = 15, p = true, text = "God hath granted me to speak as I would, and to conceive as is meet for the things that are given me: because it is he that leadeth unto wisdom, and directeth the wise." },
  { t = "v", n = 16, p = true, text = "For in his hand are both we and our words; all wisdom also, and knowledge of workmanship." },
  { t = "v", n = 17, p = true, text = "For he hath given me certain knowledge of the things that are, namely, to know how the world was made, and the operation of the elements:" },
  { t = "v", n = 18, p = true, text = "The beginning, ending, and midst of the times: the alterations of the turning of the sun, and the change of seasons:" },
  { t = "v", n = 19, p = true, text = "The circuits of years, and the positions of stars:" },
  { t = "v", n = 20, p = true, text = "The natures of living creatures, and the furies of wild beasts: the violence of winds, and the reasonings of men: the diversities of plants and the virtues of roots:" },
  { t = "v", n = 21, p = true, text = "And all such things as are either secret or manifest, them I know." },
  { t = "v", n = 22, p = true, text = "For wisdom, which is the worker of all things, taught me: for in her is an understanding spirit holy, one only, manifold, subtil, lively, clear, undefiled, plain, not subject to hurt, loving the thing that is good quick, which cannot be letted, ready to do good," },
  { t = "v", n = 23, p = true, text = "Kind to man, steadfast, sure, free from care, having all power, overseeing all things, and going through all understanding, pure, and most subtil, spirits." },
  { t = "v", n = 24, p = true, text = "For wisdom is more moving than any motion: she passeth and goeth through all things by reason of her pureness." },
  { t = "v", n = 25, p = true, text = "For she is the breath of the power of God, and a pure influence flowing from the glory of the Almighty: therefore can no defiled thing fall into her." },
  { t = "v", n = 26, p = true, text = "For she is the brightness of the everlasting light, the unspotted mirror of the power of God, and the image of his goodness." },
  { t = "v", n = 27, p = true, text = "And being but one, she can do all things: and remaining in herself, she maketh all things new: and in all ages entering into holy souls, she maketh them friends of God, and prophets." },
  { t = "v", n = 28, p = true, text = "For God loveth none but him that dwelleth with wisdom." },
  { t = "v", n = 29, p = true, text = "For she is more beautiful than the sun, and above all the order of stars: being compared with the light, she is found before it." },
  { t = "v", n = 30, p = true, text = "For after this cometh night: but vice shall not prevail against wisdom." },
]

[[section]]
id = "8"
title = "Wisdom 8"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Wisdom reacheth from one end to another mightily: and sweetly doth she order all things." },
  { t = "v", n = 2, p = true, text = "I loved her, and sought her out from my youth, I desired to make her my spouse, and I was a lover of her beauty." },
  { t = "v", n = 3, p = true, text = "In that she is conversant with God, she magnifieth her nobility: yea, the Lord of all things himself loved her." },
  { t = "v", n = 4, p = true, text = "For she is privy to the mysteries of the knowledge of God, and a lover of his works." },
  { t = "v", n = 5, p = true, text = "If riches be a possession to be desired in this life; what is richer than wisdom, that worketh all things?" },
  { t = "v", n = 6, p = true, text = "And if prudence work; who of all that are is a more cunning workman than she?" },
  { t = "v", n = 7, p = true, text = "And if a man love righteousness her labours are virtues: for she teacheth temperance and prudence, justice and fortitude: which are such things, as men can have nothing more profitable in their life." },
  { t = "v", n = 8, p = true, text = "If a man desire much experience, she knoweth things of old, and conjectureth aright what is to come: she knoweth the subtilties of speeches, and can expound dark sentences: she foreseeth signs and wonders, and the events of seasons and times." },
  { t = "v", n = 9, p = true, text = "Therefore I purposed to take her to me to live with me, knowing that she would be a counsellor of good things, and a comfort in cares and grief." },
  { t = "v", n = 10, p = true, text = "For her sake I shall have estimation among the multitude, and honour with the elders, though I be young." },
  { t = "v", n = 11, p = true, text = "I shall be found of a quick conceit in judgment, and shall be admired in the sight of great men." },
  { t = "v", n = 12, p = true, text = "When I hold my tongue, they shall bide my leisure, and when I speak, they shall give good ear unto me: if I talk much, they shall lay their hands upon their mouth." },
  { t = "v", n = 13, p = true, text = "Moreover by the means of her I shall obtain immortality, and leave behind me an everlasting memorial to them that come after me." },
  { t = "v", n = 14, p = true, text = "I shall set the people in order, and the nations shall be subject unto me." },
  { t = "v", n = 15, p = true, text = "Horrible tyrants shall be afraid, when they do but hear of me; I shall be found good among the multitude, and valiant in war." },
  { t = "v", n = 16, p = true, text = "After I am come into mine house, I will repose myself with her: for her conversation hath no bitterness; and to live with her hath no sorrow, but mirth and joy." },
  { t = "v", n = 17, p = true, text = "Now when I considered these things in myself, and pondered them in my heart, how that to be allied unto wisdom is immortality;" },
  { t = "v", n = 18, p = true, text = "And great pleasure it is to have her friendship; and in the works of her hands are infinite riches; and in the exercise of conference with her, prudence; and in talking with her, a good report; I went about seeking how to take her to me." },
  { t = "v", n = 19, p = true, text = "For I was a witty child, and had a good spirit." },
  { t = "v", n = 20, p = true, text = "Yea rather, being good, I came into a body undefiled." },
  { t = "v", n = 21, p = true, text = "Nevertheless, when I perceived that I could not otherwise obtain her, except God gave her me; and that was a point of wisdom also to know whose gift she was; I prayed unto the Lord, and besought him, and with my whole heart I said," },
]

[[section]]
id = "9"
title = "Wisdom 9"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "O God of my fathers, and Lord of mercy, who hast made all things with thy word," },
  { t = "v", n = 2, p = true, text = "And ordained man through thy wisdom, that he should have dominion over the creatures which thou hast made," },
  { t = "v", n = 3, p = true, text = "And order the world according to equity and righteousness, and execute judgment with an upright heart:" },
  { t = "v", n = 4, p = true, text = "Give me wisdom, that sitteth by thy throne; and reject me not from among thy children:" },
  { t = "v", n = 5, p = true, text = "For I thy servant and son of thine handmaid am a feeble person, and of a short time, and too young for the understanding of judgment and laws." },
  { t = "v", n = 6, p = true, text = "For though a man be never so perfect among the children of men, yet if thy wisdom be not with him, he shall be nothing regarded." },
  { t = "v", n = 7, p = true, text = "Thou hast chosen me to be a king of thy people, and a judge of thy sons and daughters:" },
  { t = "v", n = 8, p = true, text = "Thou hast commanded me to build a temple upon thy holy mount, and an altar in the city wherein thou dwellest, a resemblance of the holy tabernacle, which thou hast prepared from the beginning." },
  { t = "v", n = 9, p = true, text = "And wisdom was with thee: which knoweth thy works, and was present when thou madest the world, and knew what was acceptable in thy sight, and right in thy commandments." },
  { t = "v", n = 10, p = true, text = "O send her out of thy holy heavens, and from the throne of thy glory, that being present she may labour with me, that I may know what is pleasing unto thee." },
  { t = "v", n = 11, p = true, text = "For she knoweth and understandeth all things, and she shall lead me soberly in my doings, and preserve me in her power." },
  { t = "v", n = 12, p = true, text = "So shall my works be acceptable, and then shall I judge thy people righteously, and be worthy to sit in my father’s seat." },
  { t = "v", n = 13, p = true, text = "For what man is he that can know the counsel of God? or who can think what the will of the Lord is?" },
  { t = "v", n = 14, p = true, text = "For the thoughts of mortal men are miserable, and our devices are but uncertain." },
  { t = "v", n = 15, p = true, text = "For the corruptible body presseth down the soul, and the earthy tabernacle weigheth down the mind that museth upon many things." },
  { t = "v", n = 16, p = true, text = "And hardly do we guess aright at things that are upon earth, and with labour do we find the things that are before us: but the things that are in heaven who hath searched out?" },
  { t = "v", n = 17, p = true, text = "And thy counsel who hath known, except thou give wisdom, and send thy Holy Spirit from above?" },
  { t = "v", n = 18, p = true, text = "For so the ways of them which lived on the earth were reformed, and men were taught the things that are pleasing unto thee, and were saved through wisdom." },
]

[[section]]
id = "10"
title = "Wisdom 10"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "She preserved the first formed father of the world, that was created alone, and brought him out of his fall," },
  { t = "v", n = 2, p = true, text = "And gave him power to rule all things." },
  { t = "v", n = 3, p = true, text = "But when the unrighteous went away from her in his anger, he perished also in the fury wherewith he murdered his brother." },
  { t = "v", n = 4, p = true, text = "For whose cause the earth being drowned with the flood, wisdom again preserved it, and directed the course of the righteous in a piece of wood of small value." },
  { t = "v", n = 5, p = true, text = "Moreover, the nations in their wicked conspiracy being confounded, she found out the righteous, and preserved him blameless unto God, and kept him strong against his tender compassion toward his son." },
  { t = "v", n = 6, p = true, text = "When the ungodly perished, she delivered the righteous man, who fled from the fire which fell down upon the five cities." },
  { t = "v", n = 7, p = true, text = "Of whose wickedness even to this day the waste land that smoketh is a testimony, and plants bearing fruit that never come to ripeness: and a standing pillar of salt is a monument of an unbelieving soul." },
  { t = "v", n = 8, p = true, text = "For regarding not wisdom, they gat not only this hurt, that they knew not the things which were good; but also left behind them to the world a memorial of their foolishness: so that in the things wherein they offended they could not so much as be hid." },
  { t = "v", n = 9, p = true, text = "But wisdom delivered from pain those that attended upon her." },
  { t = "v", n = 10, p = true, text = "When the righteous fled from his brother’s wrath she guided him in right paths, shewed him the kingdom of God, and gave him knowledge of holy things, made him rich in his travels, and multiplied the fruit of his labours." },
  { t = "v", n = 11, p = true, text = "In the covetousness of such as oppressed him she stood by him, and made him rich." },
  { t = "v", n = 12, p = true, text = "She defended him from his enemies, and kept him safe from those that lay in wait, and in a sore conflict she gave him the victory; that he might know that goodness is stronger than all." },
  { t = "v", n = 13, p = true, text = "When the righteous was sold, she forsook him not, but delivered him from sin: she went down with him into the pit," },
  { t = "v", n = 14, p = true, text = "And left him not in bonds, till she brought him the sceptre of the kingdom, and power against those that oppressed him: as for them that had accused him, she shewed them to be liars, and gave him perpetual glory." },
  { t = "v", n = 15, p = true, text = "She delivered the righteous people and blameless seed from the nation that oppressed them." },
  { t = "v", n = 16, p = true, text = "She entered into the soul of the servant of the Lord, and withstood dreadful kings in wonders and signs;" },
  { t = "v", n = 17, p = true, text = "Rendered to the righteous a reward of their labours, guided them in a marvellous way, and was unto them for a cover by day, and a light of stars in the night season;" },
  { t = "v", n = 18, p = true, text = "Brought them through the Red sea, and led them through much water:" },
  { t = "v", n = 19, p = true, text = "But she drowned their enemies, and cast them up out of the bottom of the deep." },
  { t = "v", n = 20, p = true, text = "Therefore the righteous spoiled the ungodly, and praised thy holy name, O Lord, and magnified with one accord thine hand, that fought for them." },
  { t = "v", n = 21, p = true, text = "For wisdom opened the mouth of the dumb, and made the tongues of them that cannot speak eloquent." },
]

[[section]]
id = "11"
title = "Wisdom 11"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "She prospered their works in the hand of the holy prophet." },
  { t = "v", n = 2, p = true, text = "They went through the wilderness that was not inhabited, and pitched tents in places where there lay no way." },
  { t = "v", n = 3, p = true, text = "They stood against their enemies, and were avenged of their adversaries." },
  { t = "v", n = 4, p = true, text = "When they were thirsty, they called upon thee, and water was given them out of the flinty rock, and their thirst was quenched out of the hard stone." },
  { t = "v", n = 5, p = true, text = "For by what things their enemies were punished, by the same they in their need were benefited." },
  { t = "v", n = 6, p = true, text = "For instead of a perpetual running river troubled with foul blood," },
  { t = "v", n = 7, p = true, text = "For a manifest reproof of that commandment, whereby the infants were slain, thou gavest unto them abundance of water by a means which they hoped not for:" },
  { t = "v", n = 8, p = true, text = "Declaring by that thirst then how thou hadst punished their adversaries." },
  { t = "v", n = 9, p = true, text = "For when they were tried albeit but in mercy chastised, they knew how the ungodly were judged in wrath and tormented, thirsting in another manner than the just." },
  { t = "v", n = 10, p = true, text = "For these thou didst admonish and try, as a father: but the other, as a severe king, thou didst condemn and punish." },
  { t = "v", n = 11, p = true, text = "Whether they were absent or present, they were vexed alike." },
  { t = "v", n = 12, p = true, text = "For a double grief came upon them, and a groaning for the remembrance of things past." },
  { t = "v", n = 13, p = true, text = "For when they heard by their own punishments the other to be benefited, they had some feeling of the Lord." },
  { t = "v", n = 14, p = true, text = "For whom they respected with scorn, when he was long before thrown out at the casting forth of the infants, him in the end, when they saw what came to pass, they admired." },
  { t = "v", n = 15, p = true, text = "But for the foolish devices of their wickedness, wherewith being deceived they worshipped serpents void of reason, and vile beasts, thou didst send a multitude of unreasonable beasts upon them for vengeance;" },
  { t = "v", n = 16, p = true, text = "That they might know, that wherewithal a man sinneth, by the same also shall he be punished." },
  { t = "v", n = 17, p = true, text = "For thy Almighty hand, that made the world of matter without form, wanted not means to send among them a multitude of bears or fierce lions," },
  { t = "v", n = 18, p = true, text = "Or unknown wild beasts, full of rage, newly created, breathing out either a fiery vapour, or filthy scents of scattered smoke, or shooting horrible sparkles out of their eyes:" },
  { t = "v", n = 19, p = true, text = "Whereof not only the harm might dispatch them at once, but also the terrible sight utterly destroy them." },
  { t = "v", n = 20, p = true, text = "Yea, and without these might they have fallen down with one blast, being persecuted of vengeance, and scattered abroad through the breath of thy power: but thou hast ordered all things in measure and number and weight." },
  { t = "v", n = 21, p = true, text = "For thou canst shew thy great strength at all times when thou wilt; and who may withstand the power of thine arm?" },
  { t = "v", n = 22, p = true, text = "For the whole world before thee is as a little grain of the balance, yea, as a drop of the morning dew that falleth down upon the earth." },
  { t = "v", n = 23, p = true, text = "But thou hast mercy upon all; for thou canst do all things, and winkest at the sins of men, because they should amend." },
  { t = "v", n = 24, p = true, text = "For thou lovest all the things that are, and abhorrest nothing which thou hast made: for never wouldest thou have made any thing, if thou hadst hated it." },
  { t = "v", n = 25, p = true, text = "And how could any thing have endured, if it had not been thy will? or been preserved, if not called by thee?" },
  { t = "v", n = 26, p = true, text = "But thou sparest all: for they are thine, O Lord, thou lover of souls." },
]

[[section]]
id = "12"
title = "Wisdom 12"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "For thine incorruptible Spirit is in all things." },
  { t = "v", n = 2, p = true, text = "Therefore chastenest thou them by little and little that offend, and warnest them by putting them in remembrance wherein they have offended, that leaving their wickedness they may believe on thee, O Lord." },
  { t = "v", n = 3, p = true, text = "For it was thy will to destroy by the hands of our fathers both those old inhabitants of thy holy land," },
  { t = "v", n = 4, p = true, text = "Whom thou hatedst for doing most odious works of witchcrafts, and wicked sacrifices;" },
  { t = "v", n = 5, p = true, text = "And also those merciless murderers of children, and devourers of man’s flesh, and the feasts of blood," },
  { t = "v", n = 6, p = true, text = "With their priests out of the midst of their idolatrous crew, and the parents, that killed with their own hands souls destitute of help:" },
  { t = "v", n = 7, p = true, text = "That the land, which thou esteemedst above all other, might receive a worthy colony of God’s children." },
  { t = "v", n = 8, p = true, text = "Nevertheless even those thou sparedst as men, and didst send wasps, forerunners of thine host, to destroy them by little and little." },
  { t = "v", n = 9, p = true, text = "Not that thou wast unable to bring the ungodly under the hand of the righteous in battle, or to destroy them at once with cruel beasts, or with one rough word:" },
  { t = "v", n = 10, p = true, text = "But executing thy judgments upon them by little and little, thou gavest them place of repentance, not being ignorant that they were a naughty generation, and that their malice was bred in them, and that their cogitation would never be changed." },
  { t = "v", n = 11, p = true, text = "For it was a cursed seed from the beginning; neither didst thou for fear of any man give them pardon for those things wherein they sinned." },
  { t = "v", n = 12, p = true, text = "For who shall say, What hast thou done? or who shall withstand thy judgment? or who shall accuse thee for the nations that perish, whom thou made? or who shall come to stand against thee, to be revenged for the unrighteous men?" },
  { t = "v", n = 13, p = true, text = "For neither is there any God but thou that careth for all, to whom thou mightest shew that thy judgment is not unright." },
  { t = "v", n = 14, p = true, text = "Neither shall king or tyrant be able to set his face against thee for any whom thou hast punished." },
  { t = "v", n = 15, p = true, text = "Forsomuch then as thou art righteous thyself, thou orderest all things righteously: thinking it not agreeable with thy power to condemn him that hath not deserved to be punished." },
  { t = "v", n = 16, p = true, text = "For thy power is the beginning of righteousness, and because thou art the Lord of all, it maketh thee to be gracious unto all." },
  { t = "v", n = 17, p = true, text = "For when men will not believe that thou art of a full power, thou shewest thy strength, and among them that know it thou makest their boldness manifest." },
  { t = "v", n = 18, p = true, text = "But thou, mastering thy power, judgest with equity, and orderest us with great favour: for thou mayest use power when thou wilt." },
  { t = "v", n = 19, p = true, text = "But by such works hast thou taught thy people that the just man should be merciful, and hast made thy children to be of a good hope that thou givest repentance for sins." },
  { t = "v", n = 20, p = true, text = "For if thou didst punish the enemies of thy children, and the condemned to death, with such deliberation, giving them time and place, whereby they might be delivered from their malice:" },
  { t = "v", n = 21, p = true, text = "With how great circumspection didst thou judge thine own sons, unto whose fathers thou hast sworn, and made covenants of good promises?" },
  { t = "v", n = 22, p = true, text = "Therefore, whereas thou dost chasten us, thou scourgest our enemies a thousand times more, to the intent that, when we judge, we should carefully think of thy goodness, and when we ourselves are judged, we should look for mercy." },
  { t = "v", n = 23, p = true, text = "Wherefore, whereas men have lived dissolutely and unrighteously, thou hast tormented them with their own abominations." },
  { t = "v", n = 24, p = true, text = "For they went astray very far in the ways of error, and held them for gods, which even among the beasts of their enemies were despised, being deceived, as children of no understanding." },
  { t = "v", n = 25, p = true, text = "Therefore unto them, as to children without the use of reason, thou didst send a judgment to mock them." },
  { t = "v", n = 26, p = true, text = "But they that would not be reformed by that correction, wherein he dallied with them, shall feel a judgment worthy of God." },
  { t = "v", n = 27, p = true, text = "For, look, for what things they grudged, when they were punished, that is, for them whom they thought to be gods; *now* being punished in them, when they saw it, they acknowledged him to be the true God, whom before they denied to know: and therefore came extreme damnation upon them." },
]

[[section]]
id = "13"
title = "Wisdom 13"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Surely vain are all men by nature, who are ignorant of God, and could not out of the good things that are seen know him that is: neither by considering the works did they acknowledge the workmaster;" },
  { t = "v", n = 2, p = true, text = "But deemed either fire, or wind, or the swift air, or the circle of the stars, or the violent water, or the lights of heaven, to be the gods which govern the world." },
  { t = "v", n = 3, p = true, text = "With whose beauty if they being delighted took them to be gods; let them know how much better the Lord of them is: for the first author of beauty hath created them." },
  { t = "v", n = 4, p = true, text = "But if they were astonished at their power and virtue, let them understand by them, how much mightier he is that made them." },
  { t = "v", n = 5, p = true, text = "For by the greatness and beauty of the creatures proportionably the maker of them is seen." },
  { t = "v", n = 6, p = true, text = "But yet for this they are the less to be blamed: for they peradventure err, seeking God, and desirous to find him." },
  { t = "v", n = 7, p = true, text = "For being conversant in his works they search him diligently, and believe their sight: because the things are beautiful that are seen." },
  { t = "v", n = 8, p = true, text = "Howbeit neither are they to be pardoned." },
  { t = "v", n = 9, p = true, text = "For if they were able to know so much, that they could aim at the world; how did they not sooner find out the Lord thereof?" },
  { t = "v", n = 10, p = true, text = "But miserable are they, and in dead things is their hope, who call them gods, which are the works of men’s hands, gold and silver, to shew art in, and resemblances of beasts, or a stone good for nothing, the work of an ancient hand." },
  { t = "v", n = 11, p = true, text = "Now a carpenter that felleth timber, after he hath sawn down a tree meet for the purpose, and taken off all the bark skilfully round about, and hath wrought it handsomely, and made a vessel thereof fit for the service of man’s life;" },
  { t = "v", n = 12, p = true, text = "And after spending the refuse of his work to dress his meat, hath filled himself;" },
  { t = "v", n = 13, p = true, text = "And taking the very refuse among those which served to no use, being a crooked piece of wood, and full of knots, hath carved it diligently, when he had nothing else to do, and formed it by the skill of his understanding, and fashioned it to the image of a man;" },
  { t = "v", n = 14, p = true, text = "Or made it like some vile beast, laying it over with vermilion, and with paint colouring it red, and covering every spot therein;" },
  { t = "v", n = 15, p = true, text = "And when he had made a convenient room for it, set it in a wall, and made it fast with iron:" },
  { t = "v", n = 16, p = true, text = "For he provided for it that it might not fall, knowing that it was unable to help itself; for it is an image, and hath need of help:" },
  { t = "v", n = 17, p = true, text = "Then maketh he prayer for his goods, for his wife and children, and is not ashamed to speak to that which hath no life." },
  { t = "v", n = 18, p = true, text = "For health he calleth upon that which is weak: for life prayeth to that which is dead; for aid humbly beseecheth that which hath least means to help: and for a good journey he asketh of that which cannot set a foot forward:" },
  { t = "v", n = 19, p = true, text = "And for gaining and getting, and for good success of his hands, asketh ability to do of him, that is most unable to do any thing." },
]

[[section]]
id = "14"
title = "Wisdom 14"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Again, one preparing himself to sail, and about to pass through the raging waves, calleth upon a piece of wood more rotten than the vessel that carrieth him." },
  { t = "v", n = 2, p = true, text = "For verily desire of gain devised that, and the workman built it by his skill." },
  { t = "v", n = 3, p = true, text = "But thy providence, O Father, governeth it: for thou hast made a way in the sea, and a safe path in the waves;" },
  { t = "v", n = 4, p = true, text = "Shewing that thou canst save from all danger: yea, though a man went to sea without art." },
  { t = "v", n = 5, p = true, text = "Nevertheless thou wouldest not that the works of thy wisdom should be idle, and therefore do men commit their lives to a small piece of wood, and passing the rough sea in a weak vessel are saved." },
  { t = "v", n = 6, p = true, text = "For in the old time also, when the proud giants perished, the hope of the world governed by thy hand escaped in a weak vessel, and left to all ages a seed of generation." },
  { t = "v", n = 7, p = true, text = "For blessed is the wood whereby righteousness cometh." },
  { t = "v", n = 8, p = true, text = "But that which is made with hands is cursed, as well it, as he that made it: he, because he made it; and it, because, being corruptible, it was called god." },
  { t = "v", n = 9, p = true, text = "For the ungodly and his ungodliness are both alike hateful unto God." },
  { t = "v", n = 10, p = true, text = "For that which is made shall be punished together with him that made it." },
  { t = "v", n = 11, p = true, text = "Therefore even upon the idols of the Gentiles shall there be a visitation: because in the creature of God they are become an abomination, and stumblingblocks to the souls of men, and a snare to the feet of the unwise." },
  { t = "v", n = 12, p = true, text = "For the devising of idols was the beginning of spiritual fornication, and the invention of them the corruption of life." },
  { t = "v", n = 13, p = true, text = "For neither were they from the beginning, neither shall they be for ever." },
  { t = "v", n = 14, p = true, text = "For by the vain glory of men they entered into the world, and therefore shall they come shortly to an end." },
  { t = "v", n = 15, p = true, text = "For a father afflicted with untimely mourning, when he hath made an image of his child soon taken away, now honoured him as a god, which was then a dead man, and delivered to those that were under him ceremonies and sacrifices." },
  { t = "v", n = 16, p = true, text = "Thus in process of time an ungodly custom grown strong was kept as a law, and graven images were worshipped by the commandments of kings." },
  { t = "v", n = 17, p = true, text = "Whom men could not honour in presence, because they dwelt far off, they took the counterfeit of his visage from far, and made an express image of a king whom they honoured, to the end that by this their forwardness they might flatter him that was absent, as if he were present." },
  { t = "v", n = 18, p = true, text = "Also the singular diligence of the artificer did help to set forward the ignorant to more superstition." },
  { t = "v", n = 19, p = true, text = "For he, peradventure willing to please one in authority, forced all his skill to make the resemblance of the best fashion." },
  { t = "v", n = 20, p = true, text = "And so the multitude, allured by the grace of the work, took him now for a god, which a little before was but honoured." },
  { t = "v", n = 21, p = true, text = "And this was an occasion to deceive the world: for men, serving either calamity or tyranny, did ascribe unto stones and stocks the incommunicable name." },
  { t = "v", n = 22, p = true, text = "Moreover this was not enough for them, that they erred in the knowledge of God; but whereas they lived in the great war of ignorance, those so great plagues called they peace." },
  { t = "v", n = 23, p = true, text = "For whilst they slew their children in sacrifices, or used secret ceremonies, or made revellings of strange rites;" },
  { t = "v", n = 24, p = true, text = "They kept neither lives nor marriages any longer undefiled: but either one slew another traiterously, or grieved him by adultery." },
  { t = "v", n = 25, p = true, text = "So that there reigned in all men without exception blood, manslaughter, theft, and dissimulation, corruption, unfaithfulness, tumults, perjury," },
  { t = "v", n = 26, p = true, text = "Disquieting of good men, forgetfulness of good turns, defiling of souls, changing of kind, disorder in marriages, adultery, and shameless uncleanness." },
  { t = "v", n = 27, p = true, text = "For the worshipping of idols not to be named is the beginning, the cause, and the end, of all evil." },
  { t = "v", n = 28, p = true, text = "For either they are mad when they be merry, or prophesy lies, or live unjustly, or else lightly forswear themselves." },
  { t = "v", n = 29, p = true, text = "For insomuch as their trust is in idols, which have no life; though they swear falsely, yet they look not to be hurt." },
  { t = "v", n = 30, p = true, text = "Howbeit for both causes shall they be justly punished: both because they thought not well of God, giving heed unto idols, and also unjustly swore in deceit, despising holiness." },
  { t = "v", n = 31, p = true, text = "For it is not the power of them by whom they swear: but it is the just vengeance of sinners, that punisheth always the offence of the ungodly." },
]

[[section]]
id = "15"
title = "Wisdom 15"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "But thou, O God, art gracious and true, longsuffering, and in mercy ordering all things," },
  { t = "v", n = 2, p = true, text = "For if we sin, we are thine, knowing thy power: but we will not sin, knowing that we are counted thine." },
  { t = "v", n = 3, p = true, text = "For to know thee is perfect righteousness: yea, to know thy power is the root of immortality." },
  { t = "v", n = 4, p = true, text = "For neither did the mischievous invention of men deceive us, nor an image spotted with divers colours, the painter’s fruitless labour;" },
  { t = "v", n = 5, p = true, text = "The sight whereof enticeth fools to lust after it, and so they desire the form of a dead image, that hath no breath." },
  { t = "v", n = 6, p = true, text = "Both they that make them, they that desire them, and they that worship them, are lovers of evil things, and are worthy to have such things to trust upon." },
  { t = "v", n = 7, p = true, text = "For the potter, tempering soft earth, fashioneth every vessel with much labour for our service: yea, of the same clay he maketh both the vessels that serve for clean uses, and likewise also all such as serve to the contrary: but what is the use of either sort, the potter himself is the judge." },
  { t = "v", n = 8, p = true, text = "And employing his labours lewdly, he maketh a vain god of the same clay, even he which a little before was made of earth himself, and within a little while after returneth to the same, out when his life which was lent him shall be demanded." },
  { t = "v", n = 9, p = true, text = "Notwithstanding his care is, not that he shall have much labour, nor that his life is short: but striveth to excel goldsmiths and silversmiths, and endeavoureth to do like the workers in brass, and counteth it his glory to make counterfeit things." },
  { t = "v", n = 10, p = true, text = "His heart is ashes, his hope is more vile than earth, and his life of less value than clay:" },
  { t = "v", n = 11, p = true, text = "Forasmuch as he knew not his Maker, and him that inspired into him an active soul, and breathed in a living spirit." },
  { t = "v", n = 12, p = true, text = "But they counted our life a pastime, and our time here a market for gain: for, say they, we must be getting every way, though it be by evil means." },
  { t = "v", n = 13, p = true, text = "For this man, that of earthly matter maketh brittle vessels and graven images, knoweth himself to offend above all others." },
  { t = "v", n = 14, p = true, text = "And all the enemies of thy people, that hold them in subjection, are most foolish, and are more miserable than very babes." },
  { t = "v", n = 15, p = true, text = "For they counted all the idols of the heathen to be gods: which neither have the use of eyes to see, nor noses to draw breath, nor ears to hear, nor fingers of hands to handle; and as for their feet, they are slow to go." },
  { t = "v", n = 16, p = true, text = "For man made them, and he that borrowed his own spirit fashioned them: but no man can make a god like unto himself." },
  { t = "v", n = 17, p = true, text = "For being mortal, he worketh a dead thing with wicked hands: for he himself is better than the things which he worshippeth: whereas he lived once, but they never." },
  { t = "v", n = 18, p = true, text = "Yea, they worshipped those beasts also that are most hateful: for being compared together, some are worse than others." },
  { t = "v", n = 19, p = true, text = "Neither are they beautiful, so much as to be desired in respect of beasts: but they went without the praise of God and his blessing." },
]

[[section]]
id = "16"
title = "Wisdom 16"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Therefore by the like were they punished worthily, and by the multitude of beasts tormented." },
  { t = "v", n = 2, p = true, text = "Instead of which punishment, dealing graciously with thine own people, thou preparedst for them meat of a strange taste, even quails to stir up their appetite:" },
  { t = "v", n = 3, p = true, text = "To the end that they, desiring food, might for the ugly sight of the beasts sent among them lothe even that, which they must needs desire; but these, suffering penury for a short space, might be made partakers of a strange taste." },
  { t = "v", n = 4, p = true, text = "For it was requisite, that upon them exercising tyranny should come penury, which they could not avoid: but to these it should only be shewed how their enemies were tormented." },
  { t = "v", n = 5, p = true, text = "For when the horrible fierceness of beasts came upon these, and they perished with the stings of crooked serpents, thy wrath endured not for ever:" },
  { t = "v", n = 6, p = true, text = "But they were troubled for a small season, that they might be admonished, having a sign of salvation, to put them in remembrance of the commandment of thy law." },
  { t = "v", n = 7, p = true, text = "For he that turned himself toward it was not saved by the thing that he saw, but by thee, that art the Saviour of all." },
  { t = "v", n = 8, p = true, text = "And in this thou madest thine enemies confess, that it is thou who deliverest from all evil:" },
  { t = "v", n = 9, p = true, text = "For them the bitings of grasshoppers and flies killed, neither was there found any remedy for their life: for they were worthy to be punished by such." },
  { t = "v", n = 10, p = true, text = "But thy sons not the very teeth of venomous dragons overcame: for thy mercy was ever by them, and healed them." },
  { t = "v", n = 11, p = true, text = "For they were pricked, that they should remember thy words; and were quickly saved, that not falling into deep forgetfulness, they might be continually mindful of thy goodness." },
  { t = "v", n = 12, p = true, text = "For it was neither herb, nor mollifying plaister, that restored them to health: but thy word, O Lord, which healeth all things." },
  { t = "v", n = 13, p = true, text = "For thou hast power of life and death: thou leadest to the gates of hell, and bringest up again." },
  { t = "v", n = 14, p = true, text = "A man indeed killeth through his malice: and the spirit, when it is gone forth, returneth not; neither the soul received up cometh again." },
  { t = "v", n = 15, p = true, text = "But it is not possible to escape thine hand." },
  { t = "v", n = 16, p = true, text = "For the ungodly, that denied to know thee, were scourged by the strength of thine arm: with strange rains, hails, and showers, were they persecuted, that they could not avoid, and through fire were they consumed." },
  { t = "v", n = 17, p = true, text = "For, which is most to be wondered at, the fire had more force in the water, that quencheth all things: for the world fighteth for the righteous." },
  { t = "v", n = 18, p = true, text = "For sometime the flame was mitigated, that it might not burn up the beasts that were sent against the ungodly; but themselves might see and perceive that they were persecuted with the judgment of God." },
  { t = "v", n = 19, p = true, text = "And at another time it burneth even in the midst of water above the power of fire, that it might destroy the fruits of an unjust land." },
  { t = "v", n = 20, p = true, text = "Instead whereof thou feddest thine own people with angels’ food, and didst send them from heaven bread prepared without their labour, able to content every man’s delight, and agreeing to every taste." },
  { t = "v", n = 21, p = true, text = "For thy sustenance declared thy sweetness unto thy children, and serving to the appetite of the eater, tempered itself to every man’s liking." },
  { t = "v", n = 22, p = true, text = "But snow and ice endured the fire, and melted not, that they might know that fire burning in the hail, and sparkling in the rain, did destroy the fruits of the enemies." },
  { t = "v", n = 23, p = true, text = "But this again did even forget his own strength, that the righteous might be nourished." },
  { t = "v", n = 24, p = true, text = "For the creature that serveth thee, who art the Maker increaseth his strength against the unrighteous for their punishment, and abateth his strength for the benefit of such as put their trust in thee." },
  { t = "v", n = 25, p = true, text = "Therefore even then was it altered into all fashions, and was obedient to thy grace, that nourisheth all things, according to the desire of them that had need:" },
  { t = "v", n = 26, p = true, text = "That thy children, O Lord, whom thou lovest, might know, that it is not the growing of fruits that nourisheth man: but that it is thy word, which preserveth them that put their trust in thee." },
  { t = "v", n = 27, p = true, text = "For that which was not destroyed of the fire, being warmed with a little sunbeam, soon melted away:" },
  { t = "v", n = 28, p = true, text = "That it might be known, that we must prevent the sun to give thee thanks, and at the dayspring pray unto thee." },
  { t = "v", n = 29, p = true, text = "For the hope of the unthankful shall melt away as the winter’s hoar frost, and shall run away as unprofitable water." },
]

[[section]]
id = "17"
title = "Wisdom 17"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "For great are thy judgments, and cannot be expressed: therefore unnurtured souls have erred." },
  { t = "v", n = 2, p = true, text = "For when unrighteous men thought to oppress the holy nation; they being shut up in their houses, the prisoners of darkness, and fettered with the bonds of a long night, lay *there* exiled from the eternal providence." },
  { t = "v", n = 3, p = true, text = "For while they supposed to lie hid in their secret sins, they were scattered under a dark veil of forgetfulness, being horribly astonished, and troubled with *strange* apparitions." },
  { t = "v", n = 4, p = true, text = "For neither might the corner that held them keep them from fear: but noises *as of waters* falling down sounded about them, and sad visions appeared unto them with heavy countenances." },
  { t = "v", n = 5, p = true, text = "No power of the fire might give them light: neither could the bright flames of the stars endure to lighten that horrible night." },
  { t = "v", n = 6, p = true, text = "Only there appeared unto them a fire kindled of itself, very dreadful: for being much terrified, they thought the things which they saw to be worse than the sight they saw not." },
  { t = "v", n = 7, p = true, text = "As for the illusions of art magick, they were put down, and their vaunting in wisdom was reproved with disgrace." },
  { t = "v", n = 8, p = true, text = "For they, that promised to drive away terrors and troubles from a sick soul, were sick themselves of fear, worthy to be laughed at." },
  { t = "v", n = 9, p = true, text = "For though no terrible thing did fear them; yet being scared with beasts that passed by, and hissing of serpents," },
  { t = "v", n = 10, p = true, text = "They died for fear, denying that they saw the air, which could of no side be avoided." },
  { t = "v", n = 11, p = true, text = "For wickedness, condemned by her own witness, is very timorous, and being pressed with conscience, always forecasteth grievous things." },
  { t = "v", n = 12, p = true, text = "For fear is nothing else but a betraying of the succours which reason offereth." },
  { t = "v", n = 13, p = true, text = "And the expectation from within, being less, counteth the ignorance more than the cause which bringeth the torment." },
  { t = "v", n = 14, p = true, text = "But they sleeping the same sleep that night, which was indeed intolerable, and which came upon them out of the bottoms of inevitable hell," },
  { t = "v", n = 15, p = true, text = "Were partly vexed with monstrous apparitions, and partly fainted, their heart failing them: for a sudden fear, and not looked for, came upon them." },
  { t = "v", n = 16, p = true, text = "So then whosoever there fell down was straitly kept, shut up in a prison without iron bars," },
  { t = "v", n = 17, p = true, text = "For whether he were husbandman, or shepherd, or a labourer in the field, he was overtaken, and endured that necessity, which could not be avoided: for they were all bound with one chain of darkness." },
  { t = "v", n = 18, p = true, text = "Whether it were a whistling wind, or a melodious noise of birds among the spreading branches, or a pleasing fall of water running violently," },
  { t = "v", n = 19, p = true, text = "Or a terrible sound of stones cast down, or a running that could not be seen of skipping beasts, or a roaring voice of most savage wild beasts, or a rebounding echo from the hollow mountains; these things made them to swoon for fear." },
  { t = "v", n = 20, p = true, text = "For the whole world shined with clear light, and none were hindered in their labour:" },
  { t = "v", n = 21, p = true, text = "Over them only was spread an heavy night, an image of that darkness which should afterward receive them: but yet were they unto themselves more grievous than the darkness." },
]

[[section]]
id = "18"
title = "Wisdom 18"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Nevertheless thy saints had a very great light, whose voice they hearing, and not seeing their shape, because they also had not suffered the same things, they counted them happy." },
  { t = "v", n = 2, p = true, text = "But for that they did not hurt them now, of whom they had been wronged before, they thanked them, and besought them pardon for that they had been enemies." },
  { t = "v", n = 3, p = true, text = "Instead whereof thou gavest them a burning pillar of fire, both to be a guide of the unknown journey, and an harmless sun to entertain them honourably." },
  { t = "v", n = 4, p = true, text = "For they were worthy to be deprived of light and imprisoned in darkness, who had kept thy sons shut up, by whom the uncorrupt light of the law was to be given unto the world." },
  { t = "v", n = 5, p = true, text = "And when they had determined to slay the babes of the saints, one child being cast forth, and saved, to reprove them, thou tookest away the multitude of their children, and destroyedst them altogether in a mighty water." },
  { t = "v", n = 6, p = true, text = "Of that night were our fathers certified afore, that assuredly knowing unto what oaths they had given credence, they might afterwards be of good cheer." },
  { t = "v", n = 7, p = true, text = "So of thy people was accepted both the salvation of the righteous, and destruction of the enemies." },
  { t = "v", n = 8, p = true, text = "For wherewith thou didst punish our adversaries, by the same thou didst glorify us, whom thou hadst called." },
  { t = "v", n = 9, p = true, text = "For the righteous children of good men did sacrifice secretly, and with one consent made a holy law, that the saints should be like partakers of the same good and evil, the fathers now singing out the songs of praise." },
  { t = "v", n = 10, p = true, text = "But on the other side there sounded an ill according cry of the enemies, and a lamentable noise was carried abroad for children that were bewailed." },
  { t = "v", n = 11, p = true, text = "The master and the servant were punished after one manner; and like as the king, so suffered the common person." },
  { t = "v", n = 12, p = true, text = "So they all together had innumerable dead with one kind of death; neither were the living sufficient to bury them: for in one moment the noblest offspring of them was destroyed." },
  { t = "v", n = 13, p = true, text = "For whereas they would not believe any thing by reason of the enchantments; upon the destruction of the firstborn, they acknowledged this people to be the sons of God." },
  { t = "v", n = 14, p = true, text = "For while all things were in quiet silence, and that night was in the midst of her swift course," },
  { t = "v", n = 15, p = true, text = "Thine Almighty word leaped down from heaven out of thy royal throne, as a fierce man of war into the midst of a land of destruction," },
  { t = "v", n = 16, p = true, text = "And brought thine unfeigned commandment as a sharp sword, and standing up filled all things with death; and it touched the heaven, but it stood upon the earth." },
  { t = "v", n = 17, p = true, text = "Then suddenly visions of horrible dreams troubled them sore, and terrors came upon them unlooked for." },
  { t = "v", n = 18, p = true, text = "And one thrown here, and another there, half dead, shewed the cause of his death." },
  { t = "v", n = 19, p = true, text = "For the dreams that troubled them did foreshew this, lest they should perish, and not know why they were afflicted." },
  { t = "v", n = 20, p = true, text = "Yea, the tasting of death touched the righteous also, and there was a destruction of the multitude in the wilderness: but the wrath endured not long." },
  { t = "v", n = 21, p = true, text = "For then the blameless man made haste, and stood forth to defend them; and bringing the shield of his proper ministry, even prayer, and the propitiation of incense, set himself against the wrath, and so brought the calamity to an end, declaring that he was thy servant." },
  { t = "v", n = 22, p = true, text = "So he overcame the destroyer, not with strength of body, nor force of arms, but with a word subdued him that punished, alleging the oaths and covenants made with the fathers." },
  { t = "v", n = 23, p = true, text = "For when the dead were now fallen down by heaps one upon another, standing between, he stayed the wrath, and parted the way to the living." },
  { t = "v", n = 24, p = true, text = "For in the long garment was the whole world, and in the four rows of the stones was the glory of the fathers graven, and thy Majesty upon the diadem of his head." },
  { t = "v", n = 25, p = true, text = "Unto these the destroyer gave place, and was afraid of them: for it was enough that they only tasted of the wrath." },
]

[[section]]
id = "19"
title = "Wisdom 19"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "As for the ungodly, wrath came upon them without mercy unto the end: for he knew before what they would do;" },
  { t = "v", n = 2, p = true, text = "How that having given them leave to depart, and sent them hastily away, they would repent and pursue them." },
  { t = "v", n = 3, p = true, text = "For whilst they were yet mourning and making lamentation at the graves of the dead, they added another foolish device, and pursued them as fugitives, whom they had intreated to be gone." },
  { t = "v", n = 4, p = true, text = "For the destiny, whereof they were worthy, drew them unto this end, and made them forget the things that had already happened, that they might fulfil the punishment which was wanting to their torments:" },
  { t = "v", n = 5, p = true, text = "And that thy people might pass a wonderful way: but they might find a strange death." },
  { t = "v", n = 6, p = true, text = "For the whole creature in his proper kind was fashioned again anew, serving the peculiar commandments that were given unto them, that thy children might be kept without hurt:" },
  { t = "v", n = 7, p = true, text = "As namely, a cloud shadowing the camp; and where water stood before, dry land appeared; and out of the Red sea a way without impediment; and out of the violent stream a green field:" },
  { t = "v", n = 8, p = true, text = "Wherethrough all the people went that were defended with thy hand, seeing thy marvellous strange wonders." },
  { t = "v", n = 9, p = true, text = "For they went at large like horses, and leaped like lambs, praising thee, O Lord, who hadst delivered them." },
  { t = "v", n = 10, p = true, text = "For they were yet mindful of the things that were done while they sojourned in the strange land, how the ground brought forth flies instead of cattle, and how the river cast up a multitude of frogs instead of fishes." },
  { t = "v", n = 11, p = true, text = "But afterwards they saw a new generation of fowls, when, being led with their appetite, they asked delicate meats." },
  { t = "v", n = 12, p = true, text = "For quails came up unto them from the sea for their contentment." },
  { t = "v", n = 13, p = true, text = "And punishments came upon the sinners not without former signs by the force of thunders: for they suffered justly according to their own wickedness, insomuch as they used a more hard and hateful behaviour toward strangers." },
  { t = "v", n = 14, p = true, text = "For the Sodomites did not receive those, whom they knew not when they came: but these brought friends into bondage, that had well deserved of them." },
  { t = "v", n = 15, p = true, text = "And not only so, but peradventure some respect shall be had of those, because they used strangers not friendly:" },
  { t = "v", n = 16, p = true, text = "But these very grievously afflicted them, whom they had received with feastings, and were already made partakers of the same laws with them." },
  { t = "v", n = 17, p = true, text = "Therefore even with blindness were these stricken, as those were at the doors of the righteous man: when, being compassed about with horrible great darkness, every one sought the passage of his own doors." },
  { t = "v", n = 18, p = true, text = "For the elements were changed in themselves by a kind of harmony, like as in a psaltery notes change the name of the tune, and yet are always sounds; which may well be perceived by the sight of the things that have been done." },
  { t = "v", n = 19, p = true, text = "For earthly things were turned into watery, and the things, that before swam in the water, now went upon the ground." },
  { t = "v", n = 20, p = true, text = "The fire had power in the water, forgetting his own virtue: and the water forgat his own quenching nature." },
  { t = "v", n = 21, p = true, text = "On the other side, the flames wasted not the flesh of the corruptible living things, though they walked therein; neither melted they the icy kind of heavenly meat that was of nature apt to melt." },
  { t = "v", n = 22, p = true, text = "For in all things, O Lord, thou didst magnify thy people, and glorify them, neither didst thou lightly regard them: but didst assist them in every time and place." },
]

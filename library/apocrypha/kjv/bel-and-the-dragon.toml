summary = "Two stories, added to Daniel in the Greek text, in which Daniel exposes the priests of the idol Bel and slays the dragon worshipped in Babylon. It is received as deuterocanonical by the Catholic and Orthodox churches and is outside the Protestant canon. It is kept here for reading and study, not presented as Scripture."

[[section]]
id = "1"
title = "Bel and the Dragon 1"
level = 1
blocks = [
  { t = "h", level = 3, text = "The History of the Destruction of Bel and the Dragon, Cut off from the end of Daniel." },
  { t = "v", n = 1, p = true, text = "And king Astyages was gathered to his fathers, and Cyrus of Persia received his kingdom." },
  { t = "v", n = 2, p = true, text = "And Daniel conversed with the king, and was honoured above all his friends." },
  { t = "v", n = 3, p = true, text = "Now the Babylons had an idol, called Bel, and there were spent upon him every day twelve great measures of fine flour, and forty sheep, and six vessels of wine." },
  { t = "v", n = 4, p = true, text = "And the king worshipped it and went daily to adore it: but Daniel worshipped his own God. And the king said unto him, Why dost not thou worship Bel?" },
  { t = "v", n = 5, p = true, text = "Who answered and said, Because I may not worship idols made with hands, but the living God, who hath created the heaven and the earth, and hath sovereignty over all flesh." },
  { t = "v", n = 6, p = true, text = "Then said the king unto him, Thinkest thou not that Bel is a living God? seest thou not how much he eateth and drinketh every day?" },
  { t = "v", n = 7, p = true, text = "Then Daniel smiled, and said, O king, be not deceived: for this is but clay within, and brass without, and did never eat or drink any thing." },
  { t = "v", n = 8, p = true, text = "So the king was wroth, and called for his priests, and said unto them, If ye tell me not who this is that devoureth these expences, ye shall die." },
  { t = "v", n = 9, p = true, text = "But if ye can certify me that Bel devoureth them, then Daniel shall die: for he hath spoken blasphemy against Bel. And Daniel said unto the king, Let it be according to thy word." },
  { t = "v", n = 10, p = true, text = "Now the priests of Bel were threescore and ten, beside their wives and children. And the king went with Daniel into the temple of Bel." },
  { t = "v", n = 11, p = true, text = "So Bel’s priests said, Lo, we go out: but thou, O king, set on the meat, and make ready the wine, and shut the door fast and seal it with thine own signet;" },
  { t = "v", n = 12, p = true, text = "And to morrow when thou comest in, if thou findest not that Bel hath eaten up all, we will suffer death: or else Daniel, that speaketh falsely against us." },
  { t = "v", n = 13, p = true, text = "And they little regarded it: for under the table they had made a privy entrance, whereby they entered in continually, and consumed those things." },
  { t = "v", n = 14, p = true, text = "So when they were gone forth, the king set meats before Bel. Now Daniel had commanded his servants to bring ashes, and those they strewed throughout all the temple in the presence of the king alone: then went they out, and shut the door, and sealed it with the king’s signet, and so departed." },
  { t = "v", n = 15, p = true, text = "Now in the night came the priests with their wives and children, as they were wont to do, and did eat and drink up all." },
  { t = "v", n = 16, p = true, text = "In the morning betime the king arose, and Daniel with him." },
  { t = "v", n = 17, p = true, text = "And the king said, Daniel, are the seals whole? And he said, Yea, O king, they be whole." },
  { t = "v", n = 18, p = true, text = "And as soon as he had opened the door, the king looked upon the table, and cried with a loud voice, Great art thou, O Bel, and with thee is no deceit at all." },
  { t = "v", n = 19, p = true, text = "Then laughed Daniel, and held the king that he should not go in, and said, Behold now the pavement, and mark well whose footsteps are these." },
  { t = "v", n = 20, p = true, text = "And the king said, I see the footsteps of men, women, and children. And then the king was angry," },
  { t = "v", n = 21, p = true, text = "And took the priests with their wives and children, who shewed him the privy doors, where they came in, and consumed such things as were upon the table." },
  { t = "v", n = 22, p = true, text = "Therefore the king slew them, and delivered Bel into Daniel’s power, who destroyed him and his temple." },
  { t = "v", n = 23, p = true, text = "And in that same place there was a great dragon, which they of Babylon worshipped." },
  { t = "v", n = 24, p = true, text = "And the king said unto Daniel, Wilt thou also say that this is of brass? lo, he liveth, he eateth and drinketh; thou canst not say that he is no living god: therefore worship him." },
  { t = "v", n = 25, p = true, text = "Then said Daniel unto the king, I will worship the Lord my God: for he is the living God." },
  { t = "v", n = 26, p = true, text = "But give me leave, O king, and I shall slay this dragon without sword or staff. The king said, I give thee leave." },
  { t = "v", n = 27, p = true, text = "Then Daniel took pitch, and fat, and hair, and did seethe them together, and made lumps thereof: this he put in the dragon’s mouth, and so the dragon burst in sunder: and Daniel said, Lo, these are the gods ye worship." },
  { t = "v", n = 28, p = true, text = "When they of Babylon heard that, they took great indignation, and conspired against the king, saying, The king is become a Jew, and he hath destroyed Bel, he hath slain the dragon, and put the priests to death." },
  { t = "v", n = 29, p = true, text = "So they came to the king, and said, Deliver us Daniel, or else we will destroy thee and thine house." },
  { t = "v", n = 30, p = true, text = "Now when the king saw that they pressed him sore, being constrained, he delivered Daniel unto them:" },
  { t = "v", n = 31, p = true, text = "Who cast him into the lions’ den: where he was six days." },
  { t = "v", n = 32, p = true, text = "And in the den there were seven lions, and they had given them every day two carcases, and two sheep: which then were not given to them, to the intent they might devour Daniel." },
  { t = "v", n = 33, p = true, text = "Now there was in Jewry a prophet, called Habbacuc, who had made pottage, and had broken bread in a bowl, and was going into the field, for to bring it to the reapers." },
  { t = "v", n = 34, p = true, text = "But the angel of the Lord said unto Habbacuc, Go, carry the dinner that thou hast into Babylon unto Daniel, who is in the lions’ den." },
  { t = "v", n = 35, p = true, text = "And Habbacuc said, Lord, I never saw Babylon; neither do I know where the den is." },
  { t = "v", n = 36, p = true, text = "Then the angel of the Lord took him by the crown, and bare him by the hair of his head, and through the vehemency of his spirit set him in Babylon over the den." },
  { t = "v", n = 37, p = true, text = "And Habbacuc cried, saying, O Daniel, Daniel, take the dinner which God hath sent thee." },
  { t = "v", n = 38, p = true, text = "And Daniel said, Thou hast remembered me, O God: neither hast thou forsaken them that seek thee and love thee." },
  { t = "v", n = 39, p = true, text = "So Daniel arose, and did eat: and the angel of the Lord set Habbacuc in his own place again immediately." },
  { t = "v", n = 40, p = true, text = "Upon the seventh day the king went to bewail Daniel: and when he came to the den, he looked in, and behold, Daniel was sitting." },
  { t = "v", n = 41, p = true, text = "Then cried the king with a loud voice, saying, Great art thou, O Lord God of Daniel, and there is none other beside thee." },
  { t = "v", n = 42, p = true, text = "And he drew him out, and cast those that were the cause of his destruction into the den: and they were devoured in a moment before his face." },
]

[work]
id = "kjv-rest-of-esther"
title = "The Rest of the Chapters of the Book of Esther"
short_title = "Rest of Esther"
author = "apocrypha-anonymous"
collection = "apocrypha"
order = 5
date = "2nd or 1st century BC"
language = "Greek"
translator = "The King James translators (1611), standard text of 1769"
edition = "The Holy Bible, King James Version, with the Apocrypha: the Oxford standard text of 1769 (Benjamin Blayney), from the eBible.org USFM edition (eng-kjv, source dated 15 November 2026)"
source_url = "https://ebible.org/Scriptures/eng-kjv_usfm.zip"
source_sha256 = "9d37aa78180ceefd5e4aeeaedceccf16f21484e5eb17d5662e8beff31bc3d8a5"
retrieved = "2026-11-21"
license = "Public domain"
license_basis = "The King James Version was published in London by Robert Barker in 1611 and the standard text by the Oxford University Press in 1769; it is in the public domain in the United States because it was published before 1931. (The Crown's letters patent restrict printing only inside the United Kingdom.)"
chapters = 7
verses = 105
words = 2758
summary = "Additions found in the Greek text of Esther but not in the Hebrew, including Mardocheus' dream, the king's letters and the prayers of Mardocheus and Esther; the KJV prints them together as chapters 10:4 to 16. They are received as deuterocanonical by the Catholic and Orthodox churches and are outside the Protestant canon. It is kept here for reading and study, not presented as Scripture."

[[section]]
id = "10"
title = "Rest of Esther 10"
level = 1
blocks = [
  { t = "h", level = 3, text = "PART OF THE TENTH CHAPTER AFTER THE GREEK" },
  { t = "v", n = 4, p = true, text = "Then Mardocheus said, God hath done these things." },
  { t = "v", n = 5, p = true, text = "For I remember a dream which I saw concerning these matters, and nothing thereof hath failed." },
  { t = "v", n = 6, p = true, text = "A little fountain became a river, and there was light, and the sun, and much water: this river is Esther, whom the king married, and made queen:" },
  { t = "v", n = 7, p = true, text = "And the two dragons are I and Aman." },
  { t = "v", n = 8, p = true, text = "And the nations were those that were assembled to destroy the name of the Jews:" },
  { t = "v", n = 9, p = true, text = "And my nation is this Israel, which cried to God, and were saved: for the Lord hath saved his people, and the Lord hath delivered us from all those evils, and God hath wrought signs and great wonders, which have not been done among the Gentiles." },
  { t = "v", n = 10, p = true, text = "Therefore hath he made two lots, one for the people of God, and another for all the Gentiles." },
  { t = "v", n = 11, p = true, text = "And these two lots came at the hour, and time, and day of judgment, before God among all nations." },
  { t = "v", n = 12, p = true, text = "So God remembered his people, and justified his inheritance." },
  { t = "v", n = 13, p = true, text = "Therefore those days shall be unto them in the month Adar, the fourteenth and fifteenth day of the same month, with an assembly, and joy, and with gladness before God, according to the generations for ever among his people." },
]

[[section]]
id = "11"
title = "Rest of Esther 11"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "In the fourth year of the reign of Ptolemeus and Cleopatra, Dositheus, who said he was a priest and Levite, and Ptolemeus his son, brought this epistle of Phurim, which they said was the same, and that Lysimachus the son of Ptolemeus, that was in Jerusalem, had interpreted it." },
  { t = "h", level = 3, text = "[PLACED IN THE GREEK BEFORE CHAP. 1.1 OF THE HEBREW]" },
  { t = "v", n = 2, p = true, text = "In the second year of the reign of Artexerxes the great, in the first day of the month Nisan, Mardocheus the son of Jairus, the son of Semei, the son of Cisai, of the tribe of Benjamin, had a dream;" },
  { t = "v", n = 3, p = true, text = "Who was a Jew, and dwelt in the city of Susa, a great man, being a servitor in the king’s court." },
  { t = "v", n = 4, p = true, text = "He was also one of the captives, which Nabuchodonosor the king of Babylon carried from Jerusalem with Jechonias king of Judea; and this was his dream:" },
  { t = "v", n = 5, p = true, text = "Behold a noise of a tumult, with thunder, and earthquakes, and uproar in the land:" },
  { t = "v", n = 6, p = true, text = "And, behold, two great dragons came forth ready to fight, and their cry was great." },
  { t = "v", n = 7, p = true, text = "And at their cry all nations were prepared to battle, that they might fight against the righteous people." },
  { t = "v", n = 8, p = true, text = "And lo a day of darkness and obscurity, tribulation and anguish, affliction and great uproar, upon earth." },
  { t = "v", n = 9, p = true, text = "And the whole righteous nation was troubled, fearing their own evils, and were ready to perish." },
  { t = "v", n = 10, p = true, text = "Then they cried unto God, and upon their cry, as it were from a little fountain, was made a great flood, even much water." },
  { t = "v", n = 11, p = true, text = "The light and the sun rose up, and the lowly were exalted, and devoured the glorious." },
  { t = "v", n = 12, p = true, text = "Now when Mardocheus, who had seen this dream, and what God had determined to do, was awake, he bare this dream in mind, and until night by all means was desirous to know it." },
]

[[section]]
id = "12"
title = "Rest of Esther 12"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And Mardocheus took his rest in the court with Gabatha and Tharra, the two eunuchs of the king, and keepers of the palace." },
  { t = "v", n = 2, p = true, text = "And he heard their devices, and searched out their purposes, and learned that they were about to lay hands upon Artexerxes the king; and so he certified the king of them." },
  { t = "v", n = 3, p = true, text = "Then the king examined the two eunuchs, and after that they had confessed it, they were strangled." },
  { t = "v", n = 4, p = true, text = "And the king made a record of these things, and Mardocheus also wrote thereof." },
  { t = "v", n = 5, p = true, text = "So the king commanded, Mardocheus to serve in the court, and for this he rewarded him." },
  { t = "v", n = 6, p = true, text = "Howbeit Aman the son of Amadathus the Agagite, who was in great honour with the king, sought to molest Mardocheus and his people because of the two eunuchs of the king." },
]

[[section]]
id = "13"
title = "Rest of Esther 13"
level = 1
blocks = [
  { t = "h", level = 3, text = "[PLACED IN THE GREEK AFTER CHAP. 3.13 OF THE HEBREW]" },
  { t = "v", n = 1, p = true, text = "The copy of the letters was this: The great king Artexerxes writeth these things to the princes and governours that are under him from India unto Ethiopia in an hundred and seven and twenty provinces." },
  { t = "v", n = 2, p = true, text = "After that I became lord over many nations and had dominion over the whole world, not lifted up with presumption of my authority, but carrying myself always with equity and mildness, I purposed to settle my subjects continually in a quiet life, and making my kingdom peaceable, and open for passage to the utmost coasts, to renew peace, which is desired of all men." },
  { t = "v", n = 3, p = true, text = "Now when I asked my counsellors how this might be brought to pass, Aman, that excelled in wisdom among us, and was approved for his constant good will and steadfast fidelity, and had the honour of the second place in the kingdom," },
  { t = "v", n = 4, p = true, text = "Declared unto us, that in all nations throughout the world there was scattered a certain malicious people, that had laws contrary to all nations, and continually despised the commandments of kings, so as the uniting of our kingdoms, honourably intended by us cannot go forward." },
  { t = "v", n = 5, p = true, text = "Seeing then we understand that this people alone is continually in opposition unto all men, differing in the strange manner of their laws, and evil affected to our state, working all the mischief they can that our kingdom may not be firmly established:" },
  { t = "v", n = 6, p = true, text = "Therefore have we commanded, that all they that are signified in writing unto you by Aman, who is ordained over the affairs, and is next unto us, shall all, with their wives and children, be utterly destroyed by the sword of their enemies, without all mercy and pity, the fourteenth day of the twelfth month Adar of this present year:" },
  { t = "v", n = 7, p = true, text = "That they, who of old and now also are malicious, may in one day with violence go into the grave, and so ever hereafter cause our affairs to be well settled, and without trouble." },
  { t = "h", level = 3, text = "[PLACED IN THE GREEK AFTER CHAP. 4.17 OF THE HEBREW]" },
  { t = "v", n = 8, p = true, text = "Then Mardocheus thought upon all the works of the Lord, and made his prayer unto him," },
  { t = "v", n = 9, p = true, text = "Saying, O Lord, Lord, the King Almighty: for the whole world is in thy power, and if thou hast appointed to save Israel, there is no man that can gainsay thee:" },
  { t = "v", n = 10, p = true, text = "For thou hast made heaven and earth, and all the wondrous things under the heaven." },
  { t = "v", n = 11, p = true, text = "Thou art Lord of all things, and there is no man that can resist thee, which art the Lord." },
  { t = "v", n = 12, p = true, text = "Thou knowest all things, and thou knowest, Lord, that it was neither in contempt nor pride, nor for any desire of glory, that I did not bow down to proud Aman." },
  { t = "v", n = 13, p = true, text = "For I could have been content with good will for the salvation of Israel to kiss the soles of his feet." },
  { t = "v", n = 14, p = true, text = "But I did this, that I might not prefer the glory of man above the glory of God: neither will I worship any but thee, O God, neither will I do it in pride." },
  { t = "v", n = 15, p = true, text = "And now, O Lord God and King, spare thy people: for their eyes are upon us to bring us to nought; yea, they desire to destroy the inheritance, that hath been thine from the beginning." },
  { t = "v", n = 16, p = true, text = "Despise not the portion, which thou hast delivered out of Egypt for thine own self." },
  { t = "v", n = 17, p = true, text = "Hear my prayer, and be merciful unto thine inheritance: turn our sorrow into joy, that we may live, O Lord, and praise thy name: and destroy not the mouths of them that praise thee, O Lord." },
  { t = "v", n = 18, p = true, text = "All Israel in like manner cried most earnestly unto the Lord, because their death was before their eyes." },
]

[[section]]
id = "14"
title = "Rest of Esther 14"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Queen Esther also, being in fear of death, resorted unto the Lord:" },
  { t = "v", n = 2, p = true, text = "And laid away her glorious apparel, and put on the garments of anguish and mourning: and instead of precious ointments, she covered her head with ashes and dung, and she humbled her body greatly, and all the places of her joy she filled with her torn hair." },
  { t = "v", n = 3, p = true, text = "And she prayed unto the Lord God of Israel, saying, O my Lord, thou only art our King: help me, desolate woman, which have no helper but thee:" },
  { t = "v", n = 4, p = true, text = "For my danger is in mine hand." },
  { t = "v", n = 5, p = true, text = "From my youth up I have heard in the tribe of my family that thou, O Lord, tookest Israel from among all people, and our fathers from all their predecessors, for a perpetual inheritance, and thou hast performed whatsoever thou didst promise them." },
  { t = "v", n = 6, p = true, text = "And now we have sinned before thee: therefore hast thou given us into the hands of our enemies," },
  { t = "v", n = 7, p = true, text = "Because we worshipped their gods: O Lord, thou art righteous." },
  { t = "v", n = 8, p = true, text = "Nevertheless it satisfieth them not, that we are in bitter captivity: but they have stricken hands with their idols," },
  { t = "v", n = 9, p = true, text = "That they will abolish the thing that thou with thy mouth hast ordained, and destroy thine inheritance, and stop the mouth of them that praise thee, and quench the glory of thy house, and of thine altar," },
  { t = "v", n = 10, p = true, text = "And open the mouths of the heathen to set forth the praises of the idols, and to magnify a fleshly king for ever." },
  { t = "v", n = 11, p = true, text = "O Lord, give not thy sceptre unto them that be nothing, and let them not laugh at our fall; but turn their device upon themselves, and make him an example, that hath begun this against us." },
  { t = "v", n = 12, p = true, text = "Remember, O Lord, make thyself known in time of our affliction, and give me boldness, O King of the nations, and Lord of all power." },
  { t = "v", n = 13, p = true, text = "Give me eloquent speech in my mouth before the lion: turn his heart to hate him that fighteth against us, that there may be an end of him, and of all that are likeminded to him:" },
  { t = "v", n = 14, p = true, text = "But deliver us with thine hand, and help me that am desolate, and which have no other help but thee." },
  { t = "v", n = 15, p = true, text = "Thou knowest all things, O Lord; thou knowest that I hate the glory of the unrighteous, and abhor the bed of the uncircumcised, and of all the heathen." },
  { t = "v", n = 16, p = true, text = "Thou knowest my necessity: for I abhor the sign of my high estate, which is upon mine head in the days wherein I shew myself, and that I abhor it as a menstruous rag, and that I wear it not when I am private by myself." },
  { t = "v", n = 17, p = true, text = "And that thine handmaid hath not eaten at Aman’s table, and that I have not greatly esteemed the king’s feast, nor drunk the wine of the drink offerings." },
  { t = "v", n = 18, p = true, text = "Neither had thine handmaid any joy since the day that I was brought hither to this present, but in thee, O Lord God of Abraham." },
  { t = "v", n = 19, p = true, text = "O thou mighty God above all, hear the voice of the forlorn and deliver us out of the hands of the mischievous, and deliver me out of my fear." },
]

[[section]]
id = "15"
title = "Rest of Esther 15"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And upon the third day, when she had ended her prayers, she laid away her mourning garments, and put on her glorious apparel." },
  { t = "v", n = 2, p = true, text = "And being gloriously adorned, after she had called upon God, who is the beholder and saviour of all things, she took two maids with her:" },
  { t = "v", n = 3, p = true, text = "And upon the one she leaned, as carrying herself daintily;" },
  { t = "v", n = 4, p = true, text = "And the other followed, bearing up her train." },
  { t = "v", n = 5, p = true, text = "And she was ruddy through the perfection of her beauty, and her countenance was cheerful and very amiable: but her heart was in anguish for fear." },
  { t = "v", n = 6, p = true, text = "Then having passed through all the doors, she stood before the king, who sat upon his royal throne, and was clothed with all his robes of majesty, all glittering with gold and precious stones; and he was very dreadful." },
  { t = "v", n = 7, p = true, text = "Then lifting up his countenance that shone with majesty, he looked very fiercely upon her: and the queen fell down, and was pale, and fainted, and bowed herself upon the head of the maid that went before her." },
  { t = "v", n = 8, p = true, text = "Then God changed the spirit of the king into mildness, who in a fear leaped from his throne, and took her in his arms, till she came to herself again, and comforted her with loving words and said unto her," },
  { t = "v", n = 9, p = true, text = "Esther, what is the matter? I am thy brother, be of good cheer:" },
  { t = "v", n = 10, p = true, text = "Thou shalt not die, though our commandment be general: come near." },
  { t = "v", n = 11, p = true, text = "And so he held up his golden sceptre, and laid it upon her neck," },
  { t = "v", n = 12, p = true, text = "And embraced her, and said, Speak unto me." },
  { t = "v", n = 13, p = true, text = "Then said she unto him, I saw thee, my lord, as an angel of God, and my heart was troubled for fear of thy majesty." },
  { t = "v", n = 14, p = true, text = "For wonderful art thou, lord, and thy countenance is full of grace." },
  { t = "v", n = 15, p = true, text = "And as she was speaking, she fell down for faintness." },
  { t = "v", n = 16, p = true, text = "Then the king was troubled, and all his servants comforted her." },
]

[[section]]
id = "16"
title = "Rest of Esther 16"
level = 1
blocks = [
  { t = "h", level = 3, text = "[PLACED IN THE GREEK AFTER CHAP. 8.12 OF THE HEBREW]" },
  { t = "v", n = 1, p = true, text = "The great king Artexerxes unto the princes and governors of an hundred and seven and twenty provinces from India unto Ethiopia, and unto all our faithful subjects, greeting." },
  { t = "v", n = 2, p = true, text = "Many, the more often they are honoured with the great bounty of their gracious princes, the more proud they are waxen," },
  { t = "v", n = 3, p = true, text = "And endeavour to hurt not our subjects only, but not being able to bear abundance, do take in hand to practise also against those that do them good:" },
  { t = "v", n = 4, p = true, text = "And take not only thankfulness away from among men, but also lifted up with the glorious words of lewd persons, that were never good, they think to escape the justice of God, that seeth all things and hateth evil." },
  { t = "v", n = 5, p = true, text = "Oftentimes also fair speech of those, that are put in trust to manage their friends’ affairs, hath caused many that are in authority to be partakers of innocent blood, and hath enwrapped them in remediless calamities:" },
  { t = "v", n = 6, p = true, text = "Beguiling with the falsehood and deceit of their lewd disposition the innocency and goodness of princes." },
  { t = "v", n = 7, p = true, text = "Now ye may see this, as we have declared, not so much by ancient histories, as ye may, if ye search what hath been wickedly done of late through the pestilent behaviour of them that are unworthily placed in authority." },
  { t = "v", n = 8, p = true, text = "And we must take care for the time to come, that our kingdom may be quiet and peaceable for all men," },
  { t = "v", n = 9, p = true, text = "Both by changing our purposes, and always judging things that are evident with more equal proceeding." },
  { t = "v", n = 10, p = true, text = "For Aman, a Macedonian, the son of Amadatha, being indeed a stranger from the Persian blood, and far distant from our goodness, and as a stranger received of us," },
  { t = "v", n = 11, p = true, text = "Had so far forth obtained the favour that we shew toward every nation, as that he was called our father, and was continually honoured of all the next person unto the king." },
  { t = "v", n = 12, p = true, text = "But he, not bearing his great dignity, went about to deprive us of our kingdom and life:" },
  { t = "v", n = 13, p = true, text = "Having by manifold and cunning deceits sought of us the destruction, as well of Mardocheus, who saved our life, and continually procured our good, as also of blameless Esther, partaker of our kingdom, with their whole nation." },
  { t = "v", n = 14, p = true, text = "For by these means he thought, finding us destitute of friends, to have translated the kingdom of the Persians to the Macedonians." },
  { t = "v", n = 15, p = true, text = "But we find that the Jews, whom this wicked wretch hath delivered to utter destruction, are no evildoers, but live by most just laws:" },
  { t = "v", n = 16, p = true, text = "And that they be children of the most high and most mighty, living God, who hath ordered the kingdom both unto us and to our progenitors in the most excellent manner." },
  { t = "v", n = 17, p = true, text = "Wherefore ye shall do well not to put in execution the letters sent unto you by Aman the son of Amadatha." },
  { t = "v", n = 18, p = true, text = "For he that was the worker of these things, is hanged at the gates of Susa with all his family: God, who ruleth all things, speedily rendering vengeance to him according to his deserts." },
  { t = "v", n = 19, p = true, text = "Therefore ye shall publish the copy of this letter in all places, that the Jews may freely live after their own laws." },
  { t = "v", n = 20, p = true, text = "And ye shall aid them, that even the same day, being the thirteenth day of the twelfth month Adar, they may be avenged on them, who in the time of their affliction shall set upon them." },
  { t = "v", n = 21, p = true, text = "For Almighty God hath turned to joy unto them the day, wherein the chosen people should have perished." },
  { t = "v", n = 22, p = true, text = "Ye shall therefore among your solemn feasts keep it an high day with all feasting:" },
  { t = "v", n = 23, p = true, text = "That both now and hereafter there may be safety to us and the well affected Persians; but to those which do conspire against us a memorial of destruction." },
  { t = "v", n = 24, p = true, text = "Therefore every city and country whatsoever, which shall not do according to these things, shall be destroyed without mercy with fire and sword, and shall be made not only unpassable for men, but also most hateful to wild beasts and fowls for ever." },
]

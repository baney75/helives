summary = "A Greek retelling of the history from Josiah's Passover to Ezra's reading of the Law, parallel to 2 Chronicles 35 and 36, Ezra and part of Nehemiah, with the added story of the three guardsmen. It is canonical in the Eastern Orthodox churches but not in the Catholic canon, where it stands in an appendix to the Vulgate, and it is outside the Protestant canon. It is kept here for reading and study, not presented as Scripture."

[[section]]
id = "1"
title = "1 Esdras 1"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And Josias held the feast of the passover in Jerusalem unto his Lord, and offered the passover the fourteenth day of the first month;" },
  { t = "v", n = 2, p = true, text = "Having set the priests according to their daily courses, being arrayed in long garments, in the temple of the Lord." },
  { t = "v", n = 3, p = true, text = "And he spake unto the Levites, the holy ministers of Israel, that they should hallow themselves unto the Lord, to set the holy ark of the Lord in the house that king Solomon the son of David had built:" },
  { t = "v", n = 4, p = true, text = "And said, Ye shall no more bear the ark upon your shoulders: now therefore serve the Lord your God, and minister unto his people Israel, and prepare you after your families and kindreds," },
  { t = "v", n = 5, p = true, text = "According as David the king of Israel prescribed, and according to the magnificence of Solomon his son: and standing in the temple according to the several dignity of the families of you the Levites, who minister in the presence of your brethren the children of Israel," },
  { t = "v", n = 6, p = true, text = "Offer the passover in order, and make ready the sacrifices for your brethren, and keep the passover according to the commandment of the Lord, which was given unto Moses." },
  { t = "v", n = 7, p = true, text = "And unto the people that was found there Josias gave thirty thousand lambs and kids, and three thousand calves: these things were given of the king’s allowance, according as he promised, to the people, to the priests, and to the Levites." },
  { t = "v", n = 8, p = true, text = "And Helkias, Zacharias, and Syelus, the governors of the temple, gave to the priests for the passover two thousand and six hundred sheep, and three hundred calves." },
  { t = "v", n = 9, p = true, text = "And Jeconias, and Samaias, and Nathanael his brother, and Assabias, and Ochiel, and Joram, captains over thousands, gave to the Levites for the passover five thousand sheep, and seven hundred calves." },
  { t = "v", n = 10, p = true, text = "And when these things were done, the priests and Levites, having the unleavened bread, stood in very comely order according to the kindreds," },
  { t = "v", n = 11, p = true, text = "And according to the several dignities of the fathers, before the people, to offer to the Lord, as it is written in the book of Moses: and thus did they in the morning." },
  { t = "v", n = 12, p = true, text = "And they roasted the passover with fire, as appertaineth: as for the sacrifices, they sod them in brass pots and pans with a good savour," },
  { t = "v", n = 13, p = true, text = "And set them before all the people: and afterward they prepared for themselves, and for the priests their brethren, the sons of Aaron." },
  { t = "v", n = 14, p = true, text = "For the priests offered the fat until night: and the Levites prepared for themselves, and the priests their brethren, the sons of Aaron." },
  { t = "v", n = 15, p = true, text = "The holy singers also, the sons of Asaph, were in their order, according to the appointment of David, to wit, Asaph, Zacharias, and Jeduthun, who was of the king’s retinue." },
  { t = "v", n = 16, p = true, text = "Moreover the porters were at every gate; it was not lawful for any to go from his ordinary service: for their brethren the Levites prepared for them." },
  { t = "v", n = 17, p = true, text = "Thus were the things that belonged to the sacrifices of the Lord accomplished in that day, that they might hold the passover," },
  { t = "v", n = 18, p = true, text = "And offer sacrifices upon the altar of the Lord, according to the commandment of king Josias." },
  { t = "v", n = 19, p = true, text = "So the children of Israel which were present held the passover at that time, and the feast of sweet bread seven days." },
  { t = "v", n = 20, p = true, text = "And such a passover was not kept in Israel since the time of the prophet Samuel." },
  { t = "v", n = 21, p = true, text = "Yea, all the kings of Israel held not such a passover as Josias, and the priests, and the Levites, and the Jews, held with all Israel that were found dwelling at Jerusalem." },
  { t = "v", n = 22, p = true, text = "In the eighteenth year of the reign of Josias was this passover kept." },
  { t = "v", n = 23, p = true, text = "And the works or Josias were upright before his Lord with an heart full of godliness." },
  { t = "v", n = 24, p = true, text = "As for the things that came to pass in his time, they were written in former times, concerning those that sinned, and did wickedly against the Lord above all people and kingdoms, and how they grieved him exceedingly, so that the words of the Lord rose up against Israel." },
  { t = "v", n = 25, p = true, text = "Now after all these acts of Josias it came to pass, that Pharaoh the king of Egypt came to raise war at Carchamis upon Euphrates: and Josias went out against him." },
  { t = "v", n = 26, p = true, text = "But the king of Egypt sent to him, saying, What have I to do with thee, O king of Judea?" },
  { t = "v", n = 27, p = true, text = "I am not sent out from the Lord God against thee; for my war is upon Euphrates: and now the Lord is with me, yea, the Lord is with me hasting me forward: depart from me, and be not against the Lord." },
  { t = "v", n = 28, p = true, text = "Howbeit Josias did not turn back his chariot from him, but undertook to fight with him, not regarding the words of the prophet Jeremy spoken by the mouth of the Lord:" },
  { t = "v", n = 29, p = true, text = "But joined battle with him in the plain of Magiddo, and the princes came against king Josias." },
  { t = "v", n = 30, p = true, text = "Then said the king unto his servants, Carry me away out of the battle; for I am very weak. And immediately his servants took him away out of the battle." },
  { t = "v", n = 31, p = true, text = "Then gat he up upon his second chariot; and being brought back to Jerusalem died, and was buried in his father’s sepulchre." },
  { t = "v", n = 32, p = true, text = "And in all Jewry they mourned for Josias, yea, Jeremy the prophet lamented for Josias, and the chief men with the women made lamentation for him unto this day: and this was given out for an ordinance to be done continually in all the nation of Israel." },
  { t = "v", n = 33, p = true, text = "These things are written in the book of the stories of the kings of Judah, and every one of the acts that Josias did, and his glory, and his understanding in the law of the Lord, and the things that he had done before, and the things now recited, are reported in the book of the kings of Israel and Judea." },
  { t = "v", n = 34, p = true, text = "And the people took Joachaz the son of Josias, and made him king instead of Josias his father, when he was twenty and three years old." },
  { t = "v", n = 35, p = true, text = "And he reigned in Judea and in Jerusalem three months: and then the king of Egypt deposed him from reigning in Jerusalem." },
  { t = "v", n = 36, p = true, text = "And he set a tax upon the land of an hundred talents of silver and one talent of gold." },
  { t = "v", n = 37, p = true, text = "The king of Egypt also made king Joacim his brother king of Judea and Jerusalem." },
  { t = "v", n = 38, p = true, text = "And he bound Joacim and the nobles: but Zaraces his brother he apprehended, and brought him out of Egypt." },
  { t = "v", n = 39, p = true, text = "Five and twenty years old was Joacim when he was made king in the land of Judea and Jerusalem; and he did evil before the Lord." },
  { t = "v", n = 40, p = true, text = "Wherefore against him Nabuchodonosor the king of Babylon came up, and bound him with a chain of brass, and carried him into Babylon." },
  { t = "v", n = 41, p = true, text = "Nabuchodonosor also took of the holy vessels of the Lord, and carried them away, and set them in his own temple at Babylon." },
  { t = "v", n = 42, p = true, text = "But those things that are recorded of him, and of his uncleaness and impiety, are written in the chronicles of the kings." },
  { t = "v", n = 43, p = true, text = "And Joacim his son reigned in his stead: he was made king being eighteen years old;" },
  { t = "v", n = 44, p = true, text = "And reigned but three months and ten days in Jerusalem; and did evil before the Lord." },
  { t = "v", n = 45, p = true, text = "So after a year Nabuchodonosor sent and caused him to be brought into Babylon with the holy vessels of the Lord;" },
  { t = "v", n = 46, p = true, text = "And made Zedechias king of Judea and Jerusalem, when he was one and twenty years old; and he reigned eleven years:" },
  { t = "v", n = 47, p = true, text = "And he did evil also in the sight of the Lord, and cared not for the words that were spoken unto him by the prophet Jeremy from the mouth of the Lord." },
  { t = "v", n = 48, p = true, text = "And after that king Nabuchodonosor had made him to swear by the name of the Lord, he forswore himself, and rebelled; and hardening his neck, his heart, he transgressed the laws of the Lord God of Israel." },
  { t = "v", n = 49, p = true, text = "The governors also of the people and of the priests did many things against the laws, and passed all the pollutions of all nations, and defiled the temple of the Lord, which was sanctified in Jerusalem." },
  { t = "v", n = 50, p = true, text = "Nevertheless the God of their fathers sent by his messenger to call them back, because he spared them and his tabernacle also." },
  { t = "v", n = 51, p = true, text = "But they had his messengers in derision; and, look, when the Lord spake unto them, they made a sport of his prophets:" },
  { t = "v", n = 52, p = true, text = "So far forth, that he, being wroth with his people for their great ungodliness, commanded the kings of the Chaldees to come up against them;" },
  { t = "v", n = 53, p = true, text = "Who slew their young men with the sword, yea, even within the compass of their holy temple, and spared neither young man nor maid, old man nor child, among them; for he delivered all into their hands." },
  { t = "v", n = 54, p = true, text = "And they took all the holy vessels of the Lord, both great and small, with the vessels of the ark of God, and the king’s treasures, and carried them away into Babylon." },
  { t = "v", n = 55, p = true, text = "As for the house of the Lord, they burnt it, and brake down the walls of Jerusalem, and set fire upon her towers:" },
  { t = "v", n = 56, p = true, text = "And as for her glorious things, they never ceased till they had consumed and brought them all to nought: and the people that were not slain with the sword he carried unto Babylon:" },
  { t = "v", n = 57, p = true, text = "Who became servants to him and his children, till the Persians reigned, to fulfil the word of the Lord spoken by the mouth of Jeremy:" },
  { t = "v", n = 58, p = true, text = "Until the land had enjoyed her sabbaths, the whole time of her desolation shall she rest, until the full term of seventy years." },
]

[[section]]
id = "2"
title = "1 Esdras 2"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "In the first year of Cyrus king of the Persians, that the word of the Lord might be accomplished, that he had promised by the mouth of Jeremy;" },
  { t = "v", n = 2, p = true, text = "The Lord raised up the spirit of Cyrus the king of the Persians, and he made proclamation through all his kingdom, and also by writing," },
  { t = "v", n = 3, p = true, text = "Saying, Thus saith Cyrus king of the Persians; The Lord of Israel, the most high Lord, hath made me king of the whole world," },
  { t = "v", n = 4, p = true, text = "And commanded me to build him an house at Jerusalem in Jewry." },
  { t = "v", n = 5, p = true, text = "If therefore there be any of you that are of his people, let the Lord, even his Lord, be with him, and let him go up to Jerusalem that is in Judea, and build the house of the Lord of Israel: for he is the Lord that dwelleth in Jerusalem." },
  { t = "v", n = 6, p = true, text = "Whosoever then dwell in the places about, let them help him, those, I say, that are his neighbours, with gold, and with silver," },
  { t = "v", n = 7, p = true, text = "With gifts, with horses, and with cattle, and other things, which have been set forth by vow, for the temple of the Lord at Jerusalem." },
  { t = "v", n = 8, p = true, text = "Then the chief of the families of Judea and of the tribe of Benjamin stood up; the priests also, and the Levites, and all they whose mind the Lord had moved to go up, and to build an house for the Lord at Jerusalem," },
  { t = "v", n = 9, p = true, text = "And they that dwelt round about them, and helped them in all things with silver and gold, with horses and cattle, and with very many free gifts of a great number whose minds were stirred up thereto." },
  { t = "v", n = 10, p = true, text = "King Cyrus also brought forth the holy vessels, which Nabuchodonosor had carried away from Jerusalem, and had set up in his temple of idols." },
  { t = "v", n = 11, p = true, text = "Now when Cyrus king of the Persians had brought them forth, he delivered them to Mithridates his treasurer:" },
  { t = "v", n = 12, p = true, text = "And by him they were delivered to Sanabassar the governor of Judea." },
  { t = "v", n = 13, p = true, text = "And this was the number of them; A thousand golden cups, and a thousand of silver, censers of silver twenty nine, vials of gold thirty, and of silver two thousand four hundred and ten, and a thousand other vessels." },
  { t = "v", n = 14, p = true, text = "So all the vessels of gold and of silver, which were carried away, were five thousand four hundred threescore and nine." },
  { t = "v", n = 15, p = true, text = "These were brought back by Sanabassar, together with them of the captivity, from Babylon to Jerusalem." },
  { t = "v", n = 16, p = true, text = "But in the time of Artexerxes king of the Persians Belemus, and Mithridates, and Tabellius, and Rathumus, and Beeltethmus, and Semellius the secretary, with others that were in commission with them, dwelling in Samaria and other places, wrote unto him against them that dwelt in Judea and Jerusalem these letters following;" },
  { t = "v", n = 17, p = true, text = "To king Artexerxes our lord, Thy servants, Rathumus the storywriter, and Semellius the scribe, and the rest of their council, and the judges that are in Celosyria and Phenice." },
  { t = "v", n = 18, p = true, text = "Be it now known to the lord king, that the Jews that are up from you to us, being come into Jerusalem, that rebellious and wicked city, do build the marketplaces, and repair the walls of it and do lay the foundation of the temple." },
  { t = "v", n = 19, p = true, text = "Now if this city and the walls thereof be made up again, they will not only refuse to give tribute, but also rebel against kings." },
  { t = "v", n = 20, p = true, text = "And forasmuch as the things pertaining to the temple are now in hand, we think it meet not to neglect such a matter," },
  { t = "v", n = 21, p = true, text = "But to speak unto our lord the king, to the intent that, if it be thy pleasure it may be sought out in the books of thy fathers:" },
  { t = "v", n = 22, p = true, text = "And thou shalt find in the chronicles what is written concerning these things, and shalt understand that that city was rebellious, troubling both kings and cities:" },
  { t = "v", n = 23, p = true, text = "And that the Jews were rebellious, and raised always wars therein; for the which cause even this city was made desolate." },
  { t = "v", n = 24, p = true, text = "Wherefore now we do declare unto thee, O lord the king, that if this city be built again, and the walls thereof set up anew, thou shalt from henceforth have no passage into Celosyria and Phenice." },
  { t = "v", n = 25, p = true, text = "Then the king wrote back again to Rathumus the storywriter, to Beeltethmus, to Semellius the scribe, and to the rest that were in commission, and dwellers in Samaria and Syria and Phenice, after this manner;" },
  { t = "v", n = 26, p = true, text = "I have read the epistle which ye have sent unto me: therefore I commanded to make diligent search, and it hath been found that that city was from the beginning practising against kings;" },
  { t = "v", n = 27, p = true, text = "And the men therein were given to rebellion and war: and that mighty kings and fierce were in Jerusalem, who reigned and exacted tributes in Celosyria and Phenice." },
  { t = "v", n = 28, p = true, text = "Now therefore I have commanded to hinder those men from building the city, and heed to be taken that there be no more done in it;" },
  { t = "v", n = 29, p = true, text = "And that those wicked workers proceed no further to the annoyance of kings," },
  { t = "v", n = 30, p = true, text = "Then king Artexerxes his letters being read, Rathumus, and Semellius the scribe, and the rest that were in commission with them, removing in haste toward Jerusalem with a troop of horsemen and a multitude of people in battle array, began to hinder the builders; and the building of the temple in Jerusalem ceased until the second year of the reign of Darius king of the Persians." },
]

[[section]]
id = "3"
title = "1 Esdras 3"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Now when Darius reigned, he made a great feast unto all his subjects, and unto all his household, and unto all the princes of Media and Persia," },
  { t = "v", n = 2, p = true, text = "And to all the governors and captains and lieutenants that were under him, from India unto Ethiopia, of an hundred twenty and seven provinces." },
  { t = "v", n = 3, p = true, text = "And when they had eaten and drunken, and being satisfied were gone home, then Darius the king went into his bedchamber, and slept, and soon after awaked." },
  { t = "v", n = 4, p = true, text = "Then three young men, that were of the guard that kept the king’s body, spake one to another;" },
  { t = "v", n = 5, p = true, text = "Let every one of us speak a sentence: he that shall overcome, and whose sentence shall seem wiser than the others, unto him shall the king Darius give great gifts, and great things in token of victory:" },
  { t = "v", n = 6, p = true, text = "As, to be clothed in purple, to drink in gold, and to sleep upon gold, and a chariot with bridles of gold, and an headtire of fine linen, and a chain about his neck:" },
  { t = "v", n = 7, p = true, text = "And he shall sit next to Darius because of his wisdom, and shall be called Darius his cousin." },
  { t = "v", n = 8, p = true, text = "And then every one wrote his sentence, sealed it, and laid it under king Darius his pillow;" },
  { t = "v", n = 9, p = true, text = "And said that, when the king is risen, some will give him the writings; and of whose side the king and the three princes of Persia shall judge that his sentence is the wisest, to him shall the victory be given, as was appointed." },
  { t = "v", n = 10, p = true, text = "The first wrote, Wine is the strongest." },
  { t = "v", n = 11, p = true, text = "The second wrote, The king is strongest." },
  { t = "v", n = 12, p = true, text = "The third wrote, Women are strongest: but above all things Truth beareth away the victory." },
  { t = "v", n = 13, p = true, text = "Now when the king was risen up, they took their writings, and delivered them unto him, and so he read them:" },
  { t = "v", n = 14, p = true, text = "And sending forth he called all the princes of Persia and Media, and the governors, and the captains, and the lieutenants, and the chief officers;" },
  { t = "v", n = 15, p = true, text = "And sat him down in the royal seat of judgment; and the writings were read before them." },
  { t = "v", n = 16, p = true, text = "And he said, Call the young men, and they shall declare their own sentences. So they were called, and came in." },
  { t = "v", n = 17, p = true, text = "And he said unto them, Declare unto us your mind concerning the writings. Then began the first, who had spoken of the strength of wine;" },
  { t = "v", n = 18, p = true, text = "And he said thus, O ye men, how exceeding strong is wine! it causeth all men to err that drink it:" },
  { t = "v", n = 19, p = true, text = "It maketh the mind of the king and of the fatherless child to be all one; of the bondman and of the freeman, of the poor man and of the rich:" },
  { t = "v", n = 20, p = true, text = "It turneth also every thought into jollity and mirth, so that a man remembereth neither sorrow nor debt:" },
  { t = "v", n = 21, p = true, text = "And it maketh every heart rich, so that a man remembereth neither king nor governor; and it maketh to speak all things by talents:" },
  { t = "v", n = 22, p = true, text = "And when they are in their cups, they forget their love both to friends and brethren, and a little after draw out swords:" },
  { t = "v", n = 23, p = true, text = "But when they are from the wine, they remember not what they have done." },
  { t = "v", n = 24, p = true, text = "O ye men, is not wine the strongest, that enforceth to do thus? And when he had so spoken, he held his peace." },
]

[[section]]
id = "4"
title = "1 Esdras 4"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Then the second, that had spoken of the strength of the king, began to say," },
  { t = "v", n = 2, p = true, text = "O ye men, do not men excel in strength that bear rule over sea and land and all things in them?" },
  { t = "v", n = 3, p = true, text = "But yet the king is more mighty: for he is lord of all these things, and hath dominion over them; and whatsoever he commandeth them they do." },
  { t = "v", n = 4, p = true, text = "If he bid them make war the one against the other, they do it: if he send them out against the enemies, they go, and break down mountains walls and towers." },
  { t = "v", n = 5, p = true, text = "They slay and are slain, and transgress not the king’s commandment: if they get the victory, they bring all to the king, as well the spoil, as all things else." },
  { t = "v", n = 6, p = true, text = "Likewise for those that are no soldiers, and have not to do with wars, but use husbundry, when they have reaped again that which they had sown, they bring it to the king, and compel one another to pay tribute unto the king." },
  { t = "v", n = 7, p = true, text = "And yet he is but one man: if he command to kill, they kill; if he command to spare, they spare;" },
  { t = "v", n = 8, p = true, text = "If he command to smite, they smite; if he command to make desolate, they make desolate; if he command to build, they build;" },
  { t = "v", n = 9, p = true, text = "If he command to cut down, they cut down; if he command to plant, they plant." },
  { t = "v", n = 10, p = true, text = "So all his people and his armies obey him: furthermore he lieth down, he eateth and drinketh, and taketh his rest:" },
  { t = "v", n = 11, p = true, text = "And these keep watch round about him, neither may any one depart, and do his own business, neither disobey they him in any thing." },
  { t = "v", n = 12, p = true, text = "O ye men, how should not the king be mightiest, when in such sort he is obeyed? And he held his tongue." },
  { t = "v", n = 13, p = true, text = "Then the third, who had spoken of women, and of the truth, (this was Zorobabel) began to speak." },
  { t = "v", n = 14, p = true, text = "O ye men, it is not the great king, nor the multitude of men, neither is it wine, that excelleth; who is it then that ruleth them, or hath the lordship over them? are they not women?" },
  { t = "v", n = 15, p = true, text = "Women have borne the king and all the people that bear rule by sea and land." },
  { t = "v", n = 16, p = true, text = "Even of them came they: and they nourished them up that planted the vineyards, from whence the wine cometh." },
  { t = "v", n = 17, p = true, text = "These also make garments for men; these bring glory unto men; and without women cannot men be." },
  { t = "v", n = 18, p = true, text = "Yea, and if men have gathered together gold and silver, or any other goodly thing, do they not love a woman which is comely in favour and beauty?" },
  { t = "v", n = 19, p = true, text = "And letting all those things go, do they not gape, and even with open mouth fix their eyes fast on her; and have not all men more desire unto her than unto silver or gold, or any goodly thing whatsoever?" },
  { t = "v", n = 20, p = true, text = "A man leaveth his own father that brought him up, and his own country, and cleaveth unto his wife." },
  { t = "v", n = 21, p = true, text = "He sticketh not to spend his life with his wife. and remembereth neither father, nor mother, nor country." },
  { t = "v", n = 22, p = true, text = "By this also ye must know that women have dominion over you: do ye not labour and toil, and give and bring all to the woman?" },
  { t = "v", n = 23, p = true, text = "Yea, a man taketh his sword, and goeth his way to rob and to steal, to sail upon the sea and upon rivers;" },
  { t = "v", n = 24, p = true, text = "And looketh upon a lion, and goeth in the darkness; and when he hath stolen, spoiled, and robbed, he bringeth it to his love." },
  { t = "v", n = 25, p = true, text = "Wherefore a man loveth his wife better than father or mother." },
  { t = "v", n = 26, p = true, text = "Yea, many there be that have run out of their wits for women, and become servants for their sakes." },
  { t = "v", n = 27, p = true, text = "Many also have perished, have erred, and sinned, for women." },
  { t = "v", n = 28, p = true, text = "And now do ye not believe me? is not the king great in his power? do not all regions fear to touch him?" },
  { t = "v", n = 29, p = true, text = "Yet did I see him and Apame the king’s concubine, the daughter of the admirable Bartacus, sitting at the right hand of the king," },
  { t = "v", n = 30, p = true, text = "And taking the crown from the king’s head, and setting it upon her own head; she also struck the king with her left hand." },
  { t = "v", n = 31, p = true, text = "And yet for all this the king gaped and gazed upon her with open mouth: if she laughed upon him, he laughed also: but if she took any displeasure at him, the king was fain to flatter, that she might be reconciled to him again." },
  { t = "v", n = 32, p = true, text = "O ye men, how can it be but women should be strong, seeing they do thus?" },
  { t = "v", n = 33, p = true, text = "Then the king and the princes looked one upon another: so he began to speak of the truth." },
  { t = "v", n = 34, p = true, text = "O ye men, are not women strong? great is the earth, high is the heaven, swift is the sun in his course, for he compasseth the heavens round about, and fetcheth his course again to his own place in one day." },
  { t = "v", n = 35, p = true, text = "Is he not great that maketh these things? therefore great is the truth, and stronger than all things." },
  { t = "v", n = 36, p = true, text = "All the earth crieth upon the truth, and the heaven blesseth it: all works shake and tremble at it, and with it is no unrighteous thing." },
  { t = "v", n = 37, p = true, text = "Wine is wicked, the king is wicked, women are wicked, all the children of men are wicked, and such are all their wicked works; and there is no truth in them; in their unrighteousness also they shall perish." },
  { t = "v", n = 38, p = true, text = "As for the truth, it endureth, and is always strong; it liveth and conquereth for evermore." },
  { t = "v", n = 39, p = true, text = "With her there is no accepting of persons or rewards; but she doeth the things that are just, and refraineth from all unjust and wicked things; and all men do well like of her works." },
  { t = "v", n = 40, p = true, text = "Neither in her judgment is any unrighteousness; and she is the strength, kingdom, power, and majesty, of all ages. Blessed be the God of truth." },
  { t = "v", n = 41, p = true, text = "And with that he held his peace. And all the people then shouted, and said, Great is Truth, and mighty above all things." },
  { t = "v", n = 42, p = true, text = "Then said the king unto him, Ask what thou wilt more than is appointed in the writing, and we will give it thee, because thou art found wisest; and thou shalt sit next me, and shalt be called my cousin." },
  { t = "v", n = 43, p = true, text = "Then said he unto the king, Remember thy vow, which thou hast vowed to build Jerusalem, in the day when thou camest to thy kingdom," },
  { t = "v", n = 44, p = true, text = "And to send away all the vessels that were taken away out of Jerusalem, which Cyrus set apart, when he vowed to destroy Babylon, and to send them again thither." },
  { t = "v", n = 45, p = true, text = "Thou also hast vowed to build up the temple, which the Edomites burned when Judea was made desolate by the Chaldees." },
  { t = "v", n = 46, p = true, text = "And now, O lord the king, this is that which I require, and which I desire of thee, and this is the princely liberality proceeding from thyself: I desire therefore that thou make good the vow, the performance whereof with thine own mouth thou hast vowed to the King of heaven." },
  { t = "v", n = 47, p = true, text = "Then Darius the king stood up, and kissed him, and wrote letters for him unto all the treasurers and lieutenants and captains and governors, that they should safely convey on their way both him, and all those that go up with him to build Jerusalem." },
  { t = "v", n = 48, p = true, text = "He wrote letters also unto the lieutenants that were in Celosyria and Phenice, and unto them in Libanus, that they should bring cedar wood from Libanus unto Jerusalem, and that they should build the city with him." },
  { t = "v", n = 49, p = true, text = "Moreover he wrote for all the Jews that went out of his realm up into Jewry, concerning their freedom, that no officer, no ruler, no lieutenant, nor treasurer, should forcibly enter into their doors;" },
  { t = "v", n = 50, p = true, text = "And that all the country which they hold should be free without tribute; and that the Edomites should give over the villages of the Jews which then they held:" },
  { t = "v", n = 51, p = true, text = "Yea, that there should be yearly given twenty talents to the building of the temple, until the time that it were built;" },
  { t = "v", n = 52, p = true, text = "And other ten talents yearly, to maintain the burnt offerings upon the altar every day, as they had a commandment to offer seventeen:" },
  { t = "v", n = 53, p = true, text = "And that all they that went from Babylon to build the city should have free liberty, as well they as their posterity, and all the priests that went away." },
  { t = "v", n = 54, p = true, text = "He wrote also concerning. the charges, and the priests’ vestments wherein they minister;" },
  { t = "v", n = 55, p = true, text = "And likewise for the charges of the Levites, to be given them until the day that the house were finished, and Jerusalem builded up." },
  { t = "v", n = 56, p = true, text = "And he commanded to give to all that kept the city pensions and wages." },
  { t = "v", n = 57, p = true, text = "He sent away also all the vessels from Babylon, that Cyrus had set apart; and all that Cyrus had given in commandment, the same charged he also to be done, and sent unto Jerusalem." },
  { t = "v", n = 58, p = true, text = "Now when this young man was gone forth, he lifted up his face to heaven toward Jerusalem, and praised the King of heaven," },
  { t = "v", n = 59, p = true, text = "And said, From thee cometh victory, from thee cometh wisdom, and thine is the glory, and I am thy servant." },
  { t = "v", n = 60, p = true, text = "Blessed art thou, who hast given me wisdom: for to thee I give thanks, O Lord of our fathers." },
  { t = "v", n = 61, p = true, text = "And so he took the letters, and went out, and came unto Babylon, and told it all his brethren." },
  { t = "v", n = 62, p = true, text = "And they praised the God of their fathers, because he had given them freedom and liberty" },
  { t = "v", n = 63, p = true, text = "To go up, and to build Jerusalem, and the temple which is called by his name: and they feasted with instruments of musick and gladness seven days." },
]

[[section]]
id = "5"
title = "1 Esdras 5"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "After this were the principal men of the families chosen according to their tribes, to go up with their wives and sons and daughters, with their menservants and maidservants, and their cattle." },
  { t = "v", n = 2, p = true, text = "And Darius sent with them a thousand horsemen, till they had brought them back to Jerusalem safely, and with musical *instruments* tabrets and flutes." },
  { t = "v", n = 3, p = true, text = "And all their brethren played, and he made them go up together with them." },
  { t = "v", n = 4, p = true, text = "And these are the names of the men which went up, according to their families among their tribes, after their several heads." },
  { t = "v", n = 5, p = true, text = "The priests, the sons of Phinees the son of Aaron: Jesus the son of Josedec, the son of Saraias, and Joacim the son of Zorobabel, the son of Salathiel, of the house of David, out of the kindred of Phares, of the tribe of Judah;" },
  { t = "v", n = 6, p = true, text = "Who spake wise sentences before Darius the king of Persia in the second year of his reign, in the month Nisan, which is the first month." },
  { t = "v", n = 7, p = true, text = "And these are they of Jewry that came up from the captivity, where they dwelt as strangers, whom Nabuchodonosor the king of Babylon had carried away unto Babylon." },
  { t = "v", n = 8, p = true, text = "And they returned unto Jerusalem, and to the other parts of Jewry, every man to his own city, who came with Zorobabel, with Jesus, Nehemias, and Zacharias, and Reesaias, Enenius, Mardocheus. Beelsarus, Aspharasus, Reelius, Roimus, and Baana, their guides." },
  { t = "v", n = 9, p = true, text = "The number of them of the nation, and their governors, sons of Phoros, two thousand an hundred seventy and two; the sons of Saphat, four hundred seventy and two:" },
  { t = "v", n = 10, p = true, text = "The sons of Ares, seven hundred fifty and six:" },
  { t = "v", n = 11, p = true, text = "The sons of Phaath Moab, two thousand eight hundred and twelve:" },
  { t = "v", n = 12, p = true, text = "The sons of Elam, a thousand two hundred fifty and four: the sons of Zathul, nine hundred forty and five: the sons of Corbe, seven hundred and five: the sons of Bani, six hundred forty and eight:" },
  { t = "v", n = 13, p = true, text = "The sons of Bebai, six hundred twenty and three: the sons of Sadas, three thousand two hundred twenty and two:" },
  { t = "v", n = 14, p = true, text = "The sons of Adonikam, six hundred sixty and seven: the sons of Bagoi, two thousand sixty and six: the sons of Adin, four hundred fifty and four:" },
  { t = "v", n = 15, p = true, text = "The sons of Aterezias, ninety and two: the sons of Ceilan and Azetas threescore and seven: the sons of Azuran, four hundred thirty and two:" },
  { t = "v", n = 16, p = true, text = "The sons of Ananias, an hundred and one: the sons of Arom, thirty two: and the sons of Bassa, three hundred twenty and three: the sons of Azephurith, an hundred and two:" },
  { t = "v", n = 17, p = true, text = "The sons of Meterus, three thousand and five: the sons of Bethlomon, an hundred twenty and three:" },
  { t = "v", n = 18, p = true, text = "They of Netophah, fifty and five: they of Anathoth, an hundred fifty and eight: they of Bethsamos, forty and two:" },
  { t = "v", n = 19, p = true, text = "They of Kiriathiarius, twenty and five: they of Caphira and Beroth, seven hundred forty and three: they of Pira, seven hundred:" },
  { t = "v", n = 20, p = true, text = "They of Chadias and Ammidoi, four hundred twenty and two: they of Cirama and Gabdes, six hundred twenty and one:" },
  { t = "v", n = 21, p = true, text = "They of Macalon, an hundred twenty and two: they of Betolius, fifty and two: the sons of Nephis, an hundred fifty and six:" },
  { t = "v", n = 22, p = true, text = "The sons of Calamolalus and Onus, seven hundred twenty and five: the sons of Jerechus, two hundred forty and five:" },
  { t = "v", n = 23, p = true, text = "The sons of Annas, three thousand three hundred and thirty." },
  { t = "v", n = 24, p = true, text = "The priests: the sons of Jeddu, the son of Jesus among the sons of Sanasib, nine hundred seventy and two: the sons of Meruth, a thousand fifty and two:" },
  { t = "v", n = 25, p = true, text = "The sons of Phassaron, a thousand forty and seven: the sons of Carme, a thousand and seventeen." },
  { t = "v", n = 26, p = true, text = "The Levites: the sons of Jessue, and Cadmiel, and Banuas, and Sudias, seventy and four." },
  { t = "v", n = 27, p = true, text = "The holy singers: the sons of Asaph, an hundred twenty and eight." },
  { t = "v", n = 28, p = true, text = "The porters: the sons of Salum, the sons of Jatal, the sons of Talmon, the sons of Dacobi, the sons of Teta, the sons of Sami, in all an hundred thirty and nine." },
  { t = "v", n = 29, p = true, text = "The servants of the temple: the sons of Esau, the sons of Asipha, the sons of Tabaoth, the sons of Ceras, the sons of Sud, the sons of Phaleas, the sons of Labana, the sons of Graba," },
  { t = "v", n = 30, p = true, text = "The sons of Acua, the sons of Uta, the sons of Cetab, the sons of Agaba, the sons of Subai, the sons of Anan, the sons of Cathua, the sons of Geddur," },
  { t = "v", n = 31, p = true, text = "The sons of Airus, the sons of Daisan, the sons of Noeba, the sons of Chaseba, the sons of Gazera, the sons of Azia, the sons of Phinees, the sons of Azare, the sons of Bastai, the sons of Asana, the sons of Meani, the sons of Naphisi, the sons of Acub, the sons of Acipha, the sons of Assur, the sons of Pharacim, the sons of Basaloth," },
  { t = "v", n = 32, p = true, text = "The sons of Meeda, the sons of Coutha, the sons of Charea, the sons of Charcus, the sons of Aserer, the sons of Thomoi, the sons of Nasith, the sons of Atipha." },
  { t = "v", n = 33, p = true, text = "The sons of the servants of Solomon: the sons of Azaphion, the sons of Pharira, the sons of Jeeli, the sons of Lozon, the sons of Israel, the sons of Sapheth," },
  { t = "v", n = 34, p = true, text = "The sons of Hagia, the sons of Pharacareth, the sons of Sabi, the sons of Sarothie, the sons of Masias, the sons of Gar, the sons of Addus, the sons of Suba, the sons of Apherra, the sons of Barodis, the sons of Sabat, the sons of Allom." },
  { t = "v", n = 35, p = true, text = "All the ministers of the temple, and the sons of the servants of Solomon, were three hundred seventy and two." },
  { t = "v", n = 36, p = true, text = "These came up from Thermeleth and Thelersas, Charaathalar leading them, and Aalar;" },
  { t = "v", n = 37, p = true, text = "Neither could they shew their families, nor their stock, how they were of Israel: the sons of Ladan, the son of Ban, the sons of Necodan, six hundred fifty and two." },
  { t = "v", n = 38, p = true, text = "And of the priests that usurped the office of the priesthood, and were not found: the sons of Obdia, the sons of Accoz, the sons of Addus, who married Augia one of the daughters of Barzelus, and was named after his name." },
  { t = "v", n = 39, p = true, text = "And when the description of the kindred of these men was sought in the register, and was not found, they were removed from executing the office of the priesthood:" },
  { t = "v", n = 40, p = true, text = "For unto them said Nehemias and Atharias, that they should not be partakers of the holy things, till there arose up an high priest clothed with doctrine and truth." },
  { t = "v", n = 41, p = true, text = "So of Israel, from them of twelve years old and upward, they were all in number forty thousand, beside menservants and womenservants two thousand three hundred and sixty." },
  { t = "v", n = 42, p = true, text = "Their menservants and handmaids were seven thousand three hundred forty and seven: the singing men and singing women, two hundred forty and five:" },
  { t = "v", n = 43, p = true, text = "Four hundred thirty and five camels, seven thousand thirty and six horses, two hundred forty and five mules, five thousand five hundred twenty and five beasts used to the yoke." },
  { t = "v", n = 44, p = true, text = "And certain of the chief of their families, when they came to the temple of God that is in Jerusalem, vowed to set up the house again in his own place according to their ability," },
  { t = "v", n = 45, p = true, text = "And to give into the holy treasury of the works a thousand pounds of gold, five thousand of silver, and an hundred priestly vestments." },
  { t = "v", n = 46, p = true, text = "And so dwelt the priests and the Levites and the people in Jerusalem, and in the country, the singers also and the porters; and all Israel in their villages." },
  { t = "v", n = 47, p = true, text = "But when the seventh month was at hand, and when the children of Israel were every man in his own place, they came all together with one consent into the open place of the first gate which is toward the east." },
  { t = "v", n = 48, p = true, text = "Then stood up Jesus the son of Josedec, and his brethren the priests and Zorobabel the son of Salathiel, and his brethren, and made ready the altar of the God of Israel," },
  { t = "v", n = 49, p = true, text = "To offer burnt sacrifices upon it, according as it is expressly commanded in the book of Moses the man of God." },
  { t = "v", n = 50, p = true, text = "And there were gathered unto them out of the other nations of the land, and they erected the altar upon his own place, because all the nations of the land were at enmity with them, and oppressed them; and they offered sacrifices according to the time, and burnt offerings to the Lord both morning and evening." },
  { t = "v", n = 51, p = true, text = "Also they held the feast of tabernacles, as it is commanded in the law, and offered sacrifices daily, as was meet:" },
  { t = "v", n = 52, p = true, text = "And after that, the continual oblations, and the sacrifice of the sabbaths, and of the new moons, and of all holy feasts." },
  { t = "v", n = 53, p = true, text = "And all they that had made any vow to God began to offer sacrifices to God from the first day of the seventh month, although the temple of the Lord was not yet built." },
  { t = "v", n = 54, p = true, text = "And they gave unto the masons and carpenters money, meat, and drink, with cheerfulness." },
  { t = "v", n = 55, p = true, text = "Unto them of Zidon also and Tyre they gave carrs, that they should bring cedar trees from Libanus, which should be brought by floats to the haven of Joppa, according as it was commanded them by Cyrus king of the Persians." },
  { t = "v", n = 56, p = true, text = "And in the second year and second month after his coming to the temple of God at Jerusalem began Zorobabel the son of Salathiel, and Jesus the son of Josedec, and their brethren, and the priests, and the Levites, and all they that were come unto Jerusalem out of the captivity:" },
  { t = "v", n = 57, p = true, text = "And they laid the foundation of the house of God in the first day of the second month, in the second year after they were come to Jewry and Jerusalem." },
  { t = "v", n = 58, p = true, text = "And they appointed the Levites from twenty years old over the works of the Lord. Then stood up Jesus, and his sons and brethren, and Cadmiel his brother, and the sons of Madiabun, with the sons of Joda the son of Eliadun, with their sons and brethren, all Levites, with one accord setters forward of the business, labouring to advance the works in the house of God. So the workmen built the temple of the Lord." },
  { t = "v", n = 59, p = true, text = "And the priests stood arrayed in their vestments with musical instruments and trumpets; and the Levites the sons of Asaph had cymbals," },
  { t = "v", n = 60, p = true, text = "Singing songs of thanksgiving, and praising the Lord, according as David the king of Israel had ordained." },
  { t = "v", n = 61, p = true, text = "And they sung with loud voices songs to the praise of the Lord, because his mercy and glory is for ever in all Israel." },
  { t = "v", n = 62, p = true, text = "And all the people sounded trumpets, and shouted with a loud voice, singing songs of thanksgiving unto the Lord for the rearing up of the house of the Lord." },
  { t = "v", n = 63, p = true, text = "Also of the priests and Levites, and of the chief of their families, the ancients who had seen the former house came to the building of this with weeping and great crying." },
  { t = "v", n = 64, p = true, text = "But many with trumpets and joy shouted with loud voice," },
  { t = "v", n = 65, p = true, text = "Insomuch that the trumpets might not be heard for the weeping of the people: yet the multitude sounded marvellously, so that it was heard afar off." },
  { t = "v", n = 66, p = true, text = "Wherefore when the enemies of the tribe of Judah and Benjamin heard it, they came to know what that noise of trumpets should mean." },
  { t = "v", n = 67, p = true, text = "And they perceived that they that were of the captivity did build the temple unto the Lord God of Israel." },
  { t = "v", n = 68, p = true, text = "So they went to Zorobabel and Jesus, and to the chief of the families, and said unto them, We will build together with you." },
  { t = "v", n = 69, p = true, text = "For we likewise, as ye, do obey your Lord, and do sacrifice unto him from the days of Azbazareth the king of the Assyrians, who brought us hither." },
  { t = "v", n = 70, p = true, text = "Then Zorobabel and Jesus and the chief of the families of Israel said unto them, It is not for us and you to build together an house unto the Lord our God." },
  { t = "v", n = 71, p = true, text = "We ourselves alone will build unto the Lord of Israel, according as Cyrus the king of the Persians hath commanded us." },
  { t = "v", n = 72, p = true, text = "But the heathen of the land lying heavy upon the inhabitants of Judea, and holding them strait, hindered their building;" },
  { t = "v", n = 73, p = true, text = "And by their secret plots, and popular persuasions and commotions, they hindered the finishing of the building all the time that king Cyrus lived: so they were hindered from building for the space of two years, until the reign of Darius." },
]

[[section]]
id = "6"
title = "1 Esdras 6"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Now in the second year of the reign of Darius Aggeus and Zacharias the son of Addo, the prophets, prophesied unto the Jews in Jewry and Jerusalem in the name of the Lord God of Israel, which was upon them." },
  { t = "v", n = 2, p = true, text = "Then stood up Zorobabel the son of Salatiel, and Jesus the son of Josedec, and began to build the house of the Lord at Jerusalem, the prophets of the Lord being with them, and helping them." },
  { t = "v", n = 3, p = true, text = "At the same time came unto them Sisinnes the governor of Syria and Phenice, with Sathrabuzanes and his companions, and said unto them," },
  { t = "v", n = 4, p = true, text = "By whose appointment do ye build this house and this roof, and perform all the other things? and who are the workmen that perform these things?" },
  { t = "v", n = 5, p = true, text = "Nevertheless the elders of the Jews obtained favour, because the Lord had visited the captivity;" },
  { t = "v", n = 6, p = true, text = "And they were not hindered from building, until such time as signification was given unto Darius concerning them, and an answer received." },
  { t = "v", n = 7, p = true, text = "The copy of the letters which Sisinnes, governor of Syria and Phenice, and Sathrabuzanes, with their companions, rulers in Syria and Phenice, wrote and sent unto Darius; To king Darius, greeting:" },
  { t = "v", n = 8, p = true, text = "Let all things be known unto our lord the king, that being come into the country of Judea, and entered into the city of Jerusalem we found in the city of Jerusalem the ancients of the Jews that were of the captivity" },
  { t = "v", n = 9, p = true, text = "Building an house unto the Lord, great and new, of hewn and costly stones, and the timber already laid upon the walls." },
  { t = "v", n = 10, p = true, text = "And those works are done with great speed, and the work goeth on prosperously in their hands, and with all glory and diligence is it made." },
  { t = "v", n = 11, p = true, text = "Then asked we these elders, saying, By whose commandment build ye this house, and lay the foundations of these works?" },
  { t = "v", n = 12, p = true, text = "Therefore to the intent that we might give knowledge unto thee by writing, we demanded of them who were the chief doers, and we required of them the names in writing of their principal men." },
  { t = "v", n = 13, p = true, text = "So they gave us this answer, We are the servants of the Lord which made heaven and earth." },
  { t = "v", n = 14, p = true, text = "And as for this house, it was builded many years ago by a king of Israel great and strong, and was finished." },
  { t = "v", n = 15, p = true, text = "But when our fathers provoked God unto wrath, and sinned against the Lord of Israel which is in heaven, he gave them over into the power of Nabuchodonosor king of Babylon, of the Chaldees;" },
  { t = "v", n = 16, p = true, text = "Who pulled down the house, and burned it, and carried away the people captives unto Babylon." },
  { t = "v", n = 17, p = true, text = "But in the first year that king Cyrus reigned over the country of Babylon Cyrus the king wrote to build up this house." },
  { t = "v", n = 18, p = true, text = "And the holy vessels of gold and of silver, that Nabuchodonosor had carried away out of the house at Jerusalem, and had set them in his own temple those Cyrus the king brought forth again out of the temple at Babylon, and they were delivered to Zorobabel and to Sanabassarus the ruler," },
  { t = "v", n = 19, p = true, text = "With commandment that he should carry away the same vessels, and put them in the temple at Jerusalem; and that the temple of the Lord should be built in his place." },
  { t = "v", n = 20, p = true, text = "Then the same Sanabassarus, being come hither, laid the foundations of the house of the Lord at Jerusalem; and from that time to this being still a building, it is not yet fully ended." },
  { t = "v", n = 21, p = true, text = "Now therefore, if it seem good unto the king, let search be made among the records of king Cyrus:" },
  { t = "v", n = 22, p = true, text = "And if it be found that the building of the house of the Lord at Jerusalem hath been done with the consent of king Cyrus, and if our lord the king be so minded, let him signify unto us thereof." },
  { t = "v", n = 23, p = true, text = "Then commanded king Darius to seek among the records at Babylon: and so at Ecbatane the palace, which is in the country of Media, there was found a roll wherein these things were recorded." },
  { t = "v", n = 24, p = true, text = "In the first year of the reign of Cyrus king Cyrus commanded that the house of the Lord at Jerusalem should be built again, where they do sacrifice with continual fire:" },
  { t = "v", n = 25, p = true, text = "Whose height shall be sixty cubits and the breadth sixty cubits, with three rows of hewn stones, and one row of new wood of that country; and the expences thereof to be given out of the house of king Cyrus:" },
  { t = "v", n = 26, p = true, text = "And that the holy vessels of the house of the Lord, both of gold and silver, that Nabuchodonosor took out of the house at Jerusalem, and brought to Babylon, should be restored to the house at Jerusalem, and be set in the place where they were before." },
  { t = "v", n = 27, p = true, text = "And also he commanded that Sisinnes the governor of Syria and Phenice, and Sathrabuzanes, and their companions, and those which were appointed rulers in Syria and Phenice, should be careful not to meddle with the place, but suffer Zorobabel, the servant of the Lord, and governor of Judea, and the elders of the Jews, to build the house of the Lord in that place." },
  { t = "v", n = 28, p = true, text = "I have commanded also to have it built up whole again; and that they look diligently to help those that be of the captivity of the Jews, till the house of the Lord be finished:" },
  { t = "v", n = 29, p = true, text = "And out of the tribute of Celosyria and Phenice a portion carefully to be given these men for the sacrifices of the Lord, that is, to Zorobabel the governor, for bullocks, and rams, and lambs;" },
  { t = "v", n = 30, p = true, text = "And also corn, salt, wine, and oil, and that continually every year without further question, according as the priests that be in Jerusalem shall signify to be daily spent:" },
  { t = "v", n = 31, p = true, text = "That offerings may be made to the most high God for the king and for his children, and that they may pray for their lives." },
  { t = "v", n = 32, p = true, text = "And he commanded that whosoever should transgress, yea, or make light of any thing afore spoken or written, out of his own house should a tree be taken, and he thereon be hanged, and all his goods seized for the king." },
  { t = "v", n = 33, p = true, text = "The Lord therefore, whose name is there called upon, utterly destroy every king and nation, that stretcheth out his hand to hinder or endamage that house of the Lord in Jerusalem." },
  { t = "v", n = 34, p = true, text = "I Darius the king have ordained that according unto these things it be done with diligence." },
]

[[section]]
id = "7"
title = "1 Esdras 7"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Then Sisinnes the governor of Celosyria and Phenice, and Sathrabuzanes, with their companions following the commandments of king Darius," },
  { t = "v", n = 2, p = true, text = "Did very carefully oversee the holy works, assisting the ancients of the Jews and governors of the temple." },
  { t = "v", n = 3, p = true, text = "And so the holy works prospered, when Aggeus and Zacharias the prophets prophesied." },
  { t = "v", n = 4, p = true, text = "And they finished these things by the commandment of the Lord God of Israel, and with the consent of Cyrus, Darius, and Artexerxes, kings of Persia." },
  { t = "v", n = 5, p = true, text = "And thus was the holy house finished in the three and twentieth day of the month Adar, in the sixth year of Darius king of the Persians" },
  { t = "v", n = 6, p = true, text = "And the children of Israel, the priests, and the Levites, and others that were of the captivity, that were added unto them, did according to the things written in the book of Moses." },
  { t = "v", n = 7, p = true, text = "And to the dedication of the temple of the Lord they offered an hundred bullocks two hundred rams, four hundred lambs;" },
  { t = "v", n = 8, p = true, text = "And twelve goats for the sin of all Israel, according to the number of the chief of the tribes of Israel." },
  { t = "v", n = 9, p = true, text = "The priests also and the Levites stood arrayed in their vestments, according to their kindreds, in the service of the Lord God of Israel, according to the book of Moses: and the porters at every gate." },
  { t = "v", n = 10, p = true, text = "And the children of Israel that were of the captivity held the passover the fourteenth day of the first month, after that the priests and the Levites were sanctified." },
  { t = "v", n = 11, p = true, text = "They that were of the captivity were not all sanctified together: but the Levites were all sanctified together." },
  { t = "v", n = 12, p = true, text = "And so they offered the passover for all them of the captivity, and for their brethren the priests, and for themselves." },
  { t = "v", n = 13, p = true, text = "And the children of Israel that came out of the captivity did eat, even all they that had separated themselves from the abominations of the people of the land, and sought the Lord." },
  { t = "v", n = 14, p = true, text = "And they kept the feast of unleavened bread seven days, making merry before the Lord," },
  { t = "v", n = 15, p = true, text = "For that he had turned the counsel of the king of Assyria toward them, to strengthen their hands in the works of the Lord God of Israel." },
]

[[section]]
id = "8"
title = "1 Esdras 8"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "And after these things, when Artexerxes the king of the Persians reigned came Esdras the son of Saraias, the son of Ezerias, the son of Helchiah, the son of Salum," },
  { t = "v", n = 2, p = true, text = "The son of Sadduc, the son of Achitob, the son of Amarias, the son of Ezias, the son of Meremoth, the son of Zaraias, the son of Savias, the son of Boccas, the son of Abisum, the son of Phinees, the son of Eleazar, the son of Aaron the chief priest." },
  { t = "v", n = 3, p = true, text = "This Esdras went up from Babylon, as a scribe, being very ready in the law of Moses, that was given by the God of Israel." },
  { t = "v", n = 4, p = true, text = "And the king did him honour: for he found grace in his sight in all his requests." },
  { t = "v", n = 5, p = true, text = "There went up with him also certain of the children of Israel, of the priest of the Levites, of the holy singers, porters, and ministers of the temple, unto Jerusalem," },
  { t = "v", n = 6, p = true, text = "In the seventh year of the reign of Artexerxes, in the fifth month, this was the king’s seventh year; for they went from Babylon in the first day of the first month, and came to Jerusalem, according to the prosperous journey which the Lord gave them." },
  { t = "v", n = 7, p = true, text = "For Esdras had very great skill, so that he omitted nothing of the law and commandments of the Lord, but taught all Israel the ordinances and judgments." },
  { t = "v", n = 8, p = true, text = "Now the copy of the commission, which was written from Artexerxes the king, and came to Esdras the priest and reader of the law of the Lord, is this that followeth;" },
  { t = "v", n = 9, p = true, text = "King Artexerxes unto Esdras the priest and reader of the law of the Lord sendeth greeting:" },
  { t = "v", n = 10, p = true, text = "Having determined to deal graciously, I have given order, that such of the nation of the Jews, and of the priests and Levites being within our realm, as are willing and desirous should go with thee unto Jerusalem." },
  { t = "v", n = 11, p = true, text = "As many therefore as have a mind thereunto, let them depart with thee, as it hath seemed good both to me and my seven friends the counsellors;" },
  { t = "v", n = 12, p = true, text = "That they may look unto the affairs of Judea and Jerusalem, agreeably to that which is in the law of the Lord;" },
  { t = "v", n = 13, p = true, text = "And carry the gifts unto the Lord of Israel to Jerusalem, which I and my friends have vowed, and all the gold and silver that in the country of Babylon can be found, to the Lord in Jerusalem," },
  { t = "v", n = 14, p = true, text = "With that also which is given of the people for the temple of the Lord their God at Jerusalem: and that silver and gold may be collected for bullocks, rams, and lambs, and things thereunto appertaining;" },
  { t = "v", n = 15, p = true, text = "To the end that they may offer sacrifices unto the Lord upon the altar of the Lord their God, which is in Jerusalem." },
  { t = "v", n = 16, p = true, text = "And whatsoever thou and thy brethren will do with the silver and gold, that do, according to the will of thy God." },
  { t = "v", n = 17, p = true, text = "And the holy vessels of the Lord, which are given thee for the use of the temple of thy God, which is in Jerusalem, thou shalt set before thy God in Jerusalem." },
  { t = "v", n = 18, p = true, text = "And whatsoever thing else thou shalt remember for the use of the temple of thy God, thou shalt give it out of the king’s treasury." },
  { t = "v", n = 19, p = true, text = "And I king Artexerxes have also commanded the keepers of the treasures in Syria and Phenice, that whatsoever Esdras the priest and the reader of the law of the most high God shall send for, they should give it him with speed," },
  { t = "v", n = 20, p = true, text = "To the sum of an hundred talents of silver, likewise also of wheat even to an hundred cors, and an hundred pieces of wine, and other things in abundance." },
  { t = "v", n = 21, p = true, text = "Let all things be performed after the law of God diligently unto the most high God, that wrath come not upon the kingdom of the king and his sons." },
  { t = "v", n = 22, p = true, text = "I command you also, that ye require no tax, nor any other imposition, of any of the priests, or Levites, or holy singers, or porters, or ministers of the temple, or of any that have doings in this temple, and that no man have authority to impose any thing upon them." },
  { t = "v", n = 23, p = true, text = "And thou, Esdras, according to the wisdom of God ordain judges and justices, that they may judge in all Syria and Phenice all those that know the law of thy God; and those that know it not thou shalt teach." },
  { t = "v", n = 24, p = true, text = "And whosoever shall transgress the law of thy God, and of the king, shall be punished diligently, whether it be by death, or other punishment, by penalty of money, or by imprisonment." },
  { t = "v", n = 25, p = true, text = "Then said Esdras the scribe, Blessed be the only Lord God of my fathers, who hath put these things into the heart of the king, to glorify his house that is in Jerusalem:" },
  { t = "v", n = 26, p = true, text = "And hath honoured me in the sight of the king, and his counsellors, and all his friends and nobles." },
  { t = "v", n = 27, p = true, text = "Therefore was I encouraged by the help of the Lord my God, and gathered together men of Israel to go up with me." },
  { t = "v", n = 28, p = true, text = "And these are the chief according to their families and several dignities, that went up with me from Babylon in the reign of king Artexerxes:" },
  { t = "v", n = 29, p = true, text = "Of the sons of Phinees, Gerson: of the sons of Ithamar, Gamael: of the sons of David, Lettus the son of Sechenias:" },
  { t = "v", n = 30, p = true, text = "Of the sons of Pharez, Zacharias; and with him were counted an hundred and fifty men:" },
  { t = "v", n = 31, p = true, text = "Of the sons of Pahath Moab, Eliaonias, the son of Zaraias, and with him two hundred men:" },
  { t = "v", n = 32, p = true, text = "Of the sons of Zathoe, Sechenias the son of Jezelus, and with him three hundred men: of the sons of Adin, Obeth the son of Jonathan, and with him two hundred and fifty men:" },
  { t = "v", n = 33, p = true, text = "Of the sons of Elam, Josias son of Gotholias, and with him seventy men:" },
  { t = "v", n = 34, p = true, text = "Of the sons of Saphatias, Zaraias son of Michael, and with him threescore and ten men:" },
  { t = "v", n = 35, p = true, text = "Of the sons of Joab, Abadias son of Jezelus, and with him two hundred and twelve men:" },
  { t = "v", n = 36, p = true, text = "Of the sons of Banid, Assalimoth son of Josaphias, and with him an hundred and threescore men:" },
  { t = "v", n = 37, p = true, text = "Of the sons of Babi, Zacharias son of Bebai, and with him twenty and eight men:" },
  { t = "v", n = 38, p = true, text = "Of the sons of Astath, Johannes son of Acatan, and with him an hundred and ten men:" },
  { t = "v", n = 39, p = true, text = "Of the sons of Adonikam the last, and these are the names of them, Eliphalet, Jewel, and Samaias, and with them seventy men:" },
  { t = "v", n = 40, p = true, text = "Of the sons of Bago, Uthi the son of Istalcurus, and with him seventy men." },
  { t = "v", n = 41, p = true, text = "And these I gathered together to the river called Theras, where we pitched our tents three days: and then I surveyed them." },
  { t = "v", n = 42, p = true, text = "But when I had found there none of the priests and Levites," },
  { t = "v", n = 43, p = true, text = "Then sent I unto Eleazar, and Iduel, and Masman," },
  { t = "v", n = 44, p = true, text = "And Alnathan, and Mamaias, and Joribas, and Nathan, Eunatan, Zacharias, and Mosollamon, principal men and learned." },
  { t = "v", n = 45, p = true, text = "And I bade them that they should go unto Saddeus the captain, who was in the place of the treasury:" },
  { t = "v", n = 46, p = true, text = "And commanded them that they should speak unto Daddeus, and to his brethren, and to the treasurers in that place, to send us such men as might execute the priests’ office in the house of the Lord." },
  { t = "v", n = 47, p = true, text = "And by the mighty hand of our Lord they brought unto us skilful men of the sons of Moli the son of Levi, the son of Israel, Asebebia, and his sons, and his brethren, who were eighteen." },
  { t = "v", n = 48, p = true, text = "And Asebia, and Annus, and Osaias his brother, of the sons of Channuneus, and their sons, were twenty men." },
  { t = "v", n = 49, p = true, text = "And of the servants of the temple whom David had ordained, and the principal men for the service of the Levites to wit, the servants of the temple two hundred and twenty, the catalogue of whose names were shewed." },
  { t = "v", n = 50, p = true, text = "And there I vowed a fast unto the young men before our Lord, to desire of him a prosperous journey both for us and them that were with us, for our children, and for the cattle:" },
  { t = "v", n = 51, p = true, text = "For I was ashamed to ask the king footmen, and horsemen, and conduct for safeguard against our adversaries." },
  { t = "v", n = 52, p = true, text = "For we had said unto the king, that the power of the Lord our God should be with them that seek him, to support them in all ways." },
  { t = "v", n = 53, p = true, text = "And again we besought our Lord as touching these things, and found him favourable unto us." },
  { t = "v", n = 54, p = true, text = "Then I separated twelve of the chief of the priests, Esebrias, and Assanias, and ten men of their brethren with them:" },
  { t = "v", n = 55, p = true, text = "And I weighed them the gold, and the silver, and the holy vessels of the house of our Lord, which the king, and his council, and the princes, and all Israel, had given." },
  { t = "v", n = 56, p = true, text = "And when I had weighed it, I delivered unto them six hundred and fifty talents of silver, and silver vessels of an hundred talents, and an hundred talents of gold," },
  { t = "v", n = 57, p = true, text = "And twenty golden vessels, and twelve vessels of brass, even of fine brass, glittering like gold." },
  { t = "v", n = 58, p = true, text = "And I said unto them, Both ye are holy unto the Lord, and the vessels are holy, and the gold and the silver is a vow unto the Lord, the Lord of our fathers." },
  { t = "v", n = 59, p = true, text = "Watch ye, and keep them till ye deliver them to the chief of the priests and Levites, and to the principal men of the families of Israel, in Jerusalem, into the chambers of the house of our God." },
  { t = "v", n = 60, p = true, text = "So the priests and the Levites, who had received the silver and the gold and the vessels, brought them unto Jerusalem, into the temple of the Lord." },
  { t = "v", n = 61, p = true, text = "And from the river Theras we departed the twelfth day of the first month, and came to Jerusalem by the mighty hand of our Lord, which was with us: and from the beginning of our journey the Lord delivered us from every enemy, and so we came to Jerusalem." },
  { t = "v", n = 62, p = true, text = "And when we had been there three days, the gold and silver that was weighed was delivered in the house of our Lord on the fourth day unto Marmoth the priest the son of Iri." },
  { t = "v", n = 63, p = true, text = "And with him was Eleazar the son of Phinees, and with them were Josabad the son of Jesu and Moeth the son of Sabban, Levites: all was delivered them by number and weight." },
  { t = "v", n = 64, p = true, text = "And all the weight of them was written up the same hour." },
  { t = "v", n = 65, p = true, text = "Moreover they that were come out of the captivity offered sacrifice unto the Lord God of Israel, even twelve bullocks for all Israel, fourscore and sixteen rams," },
  { t = "v", n = 66, p = true, text = "Threescore and twelve lambs, goats for a peace offering, twelve; all of them a sacrifice to the Lord." },
  { t = "v", n = 67, p = true, text = "And they delivered the king’s commandments unto the king’s stewards’ and to the governors of Celosyria and Phenice; and they honoured the people and the temple of God." },
  { t = "v", n = 68, p = true, text = "Now when these things were done, the rulers came unto me, and said," },
  { t = "v", n = 69, p = true, text = "The nation of Israel, the princes, the priests and Levites, have not put away from them the strange people of the land, nor the pollutions of the Gentiles to wit, of the Canaanites, Hittites, Pheresites, Jebusites, and the Moabites, Egyptians, and Edomites." },
  { t = "v", n = 70, p = true, text = "For both they and their sons have married with their daughters, and the holy seed is mixed with the strange people of the land; and from the beginning of this matter the rulers and the great men have been partakers of this iniquity." },
  { t = "v", n = 71, p = true, text = "And as soon as I had heard these things, I rent my clothes, and the holy garment, and pulled off the hair from off my head and beard, and sat me down sad and very heavy." },
  { t = "v", n = 72, p = true, text = "So all they that were then moved at the word of the Lord God of Israel assembled unto me, whilst I mourned for the iniquity: but I sat still full of heaviness until the evening sacrifice." },
  { t = "v", n = 73, p = true, text = "Then rising up from the fast with my clothes and the holy garment rent, and bowing my knees, and stretching forth my hands unto the Lord," },
  { t = "v", n = 74, p = true, text = "I said, O Lord, I am confounded and ashamed before thy face;" },
  { t = "v", n = 75, p = true, text = "For our sins are multiplied above our heads, and our ignorances have reached up unto heaven." },
  { t = "v", n = 76, p = true, text = "For ever since the time of our fathers we have been and are in great sin, even unto this day." },
  { t = "v", n = 77, p = true, text = "And for our sins and our fathers’ we with our brethren and our kings and our priests were given up unto the kings of the earth, to the sword, and to captivity, and for a prey with shame, unto this day." },
  { t = "v", n = 78, p = true, text = "And now in some measure hath mercy been shewed unto us from thee, O Lord, that there should be left us a root and a name in the place of thy sanctuary;" },
  { t = "v", n = 79, p = true, text = "And to discover unto us a light in the house of the Lord our God, and to give us food in the time of our servitude." },
  { t = "v", n = 80, p = true, text = "Yea, when we were in bondage, we were not forsaken of our Lord; but he made us gracious before the kings of Persia, so that they gave us food;" },
  { t = "v", n = 81, p = true, text = "Yea, and honoured the temple of our Lord, and raised up the desolate Sion, that they have given us a sure abiding in Jewry and Jerusalem." },
  { t = "v", n = 82, p = true, text = "And now, O Lord, what shall we say, having these things? for we have transgressed thy commandments, which thou gavest by the hand of thy servants the prophets, saying," },
  { t = "v", n = 83, p = true, text = "That the land, which ye enter into to possess as an heritage, is a land polluted with the pollutions of the strangers of the land, and they have filled it with their uncleanness." },
  { t = "v", n = 84, p = true, text = "Therefore now shall ye not join your daughters unto their sons, neither shall ye take their daughters unto your sons." },
  { t = "v", n = 85, p = true, text = "Moreover ye shall never seek to have peace with them, that ye may be strong, and eat the good things of the land, and that ye may leave the inheritance of the land unto your children for evermore." },
  { t = "v", n = 86, p = true, text = "And all that is befallen is done unto us for our wicked works and great sins; for thou, O Lord, didst make our sins light," },
  { t = "v", n = 87, p = true, text = "And didst give unto us such a root: but we have turned back again to transgress thy law, and to mingle ourselves with the uncleanness of the nations of the land." },
  { t = "v", n = 88, p = true, text = "Mightest not thou be angry with us to destroy us, till thou hadst left us neither root, seed, nor name?" },
  { t = "v", n = 89, p = true, text = "O Lord of Israel, thou art true: for we are left a root this day." },
  { t = "v", n = 90, p = true, text = "Behold, now are we before thee in our iniquities, for we cannot stand any longer by reason of these things before thee." },
  { t = "v", n = 91, p = true, text = "And as Esdras in his prayer made his confession, weeping, and lying flat upon the ground before the temple, there gathered unto him from Jerusalem a very great multitude of men and women and children: for there was great weeping among the multitude." },
  { t = "v", n = 92, p = true, text = "Then Jechonias the son of Jeelus, one of the sons of Israel, called out, and said, O Esdras, we have sinned against the Lord God, we have married strange women of the nations of the land, and now is all Israel aloft." },
  { t = "v", n = 93, p = true, text = "Let us make an oath to the Lord, that we will put away all our wives, which we have taken of the heathen, with their children," },
  { t = "v", n = 94, p = true, text = "Like as thou hast decreed, and as many as do obey the law of the Lord." },
  { t = "v", n = 95, p = true, text = "Arise and put in execution: for to thee doth this matter appertain, and we will be with thee: do valiantly." },
  { t = "v", n = 96, p = true, text = "So Esdras arose, and took an oath of the chief of the priests and Levites of all Israel to do after these things; and so they sware." },
]

[[section]]
id = "9"
title = "1 Esdras 9"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "Then Esdras rising from the court of the temple went to the chamber of Joanan the son of Eliasib," },
  { t = "v", n = 2, p = true, text = "And remained there, and did eat no meat nor drink water, mourning for the great iniquities of the multitude." },
  { t = "v", n = 3, p = true, text = "And there was a proclamation in all Jewry and Jerusalem to all them that were of the captivity, that they should be gathered together at Jerusalem:" },
  { t = "v", n = 4, p = true, text = "And that whosoever met not there within two or three days according as the elders that bare rule appointed, their cattle should be seized to the use of the temple, and himself cast out from them that were of the captivity." },
  { t = "v", n = 5, p = true, text = "And in three days were all they of the tribe of Judah and Benjamin gathered together at Jerusalem the twentieth day of the ninth month." },
  { t = "v", n = 6, p = true, text = "And all the multitude sat trembling in the broad court of the temple because of the present foul weather." },
  { t = "v", n = 7, p = true, text = "So Esdras arose up, and said unto them, Ye have transgressed the law in marrying strange wives, thereby to increase the sins of Israel." },
  { t = "v", n = 8, p = true, text = "And now by confessing give glory unto the Lord God of our fathers," },
  { t = "v", n = 9, p = true, text = "And do his will, and separate yourselves from the heathen of the land, and from the strange women." },
  { t = "v", n = 10, p = true, text = "Then cried the whole multitude, and said with a loud voice, Like as thou hast spoken, so will we do." },
  { t = "v", n = 11, p = true, text = "But forasmuch as the people are many, and it is foul weather, so that we cannot stand without, and this is not a work of a day or two, seeing our sin in these things is spread far:" },
  { t = "v", n = 12, p = true, text = "Therefore let the rulers of the multitude stay, and let all them of our habitations that have strange wives come at the time appointed," },
  { t = "v", n = 13, p = true, text = "And with them the rulers and judges of every place, till we turn away the wrath of the Lord from us for this matter." },
  { t = "v", n = 14, p = true, text = "Then Jonathan the son of Azael and Ezechias the son of Theocanus accordingly took this matter upon them: and Mosollam and Levis and Sabbatheus helped them." },
  { t = "v", n = 15, p = true, text = "And they that were of the captivity did according to all these things." },
  { t = "v", n = 16, p = true, text = "And Esdras the priest chose unto him the principal men of their families, all by name: and in the first day of the tenth month they sat together to examine the matter." },
  { t = "v", n = 17, p = true, text = "So their cause that held strange wives was brought to an end in the first day of the first month." },
  { t = "v", n = 18, p = true, text = "And of the priests that were come together, and had strange wives, there were found:" },
  { t = "v", n = 19, p = true, text = "Of the sons of Jesus the son of Josedec, and his brethren; Matthelas and Eleazar, and Joribus and Joadanus." },
  { t = "v", n = 20, p = true, text = "And they gave their hands to put away their wives and to offer rams to make reconcilement for their errors." },
  { t = "v", n = 21, p = true, text = "And of the sons of Emmer; Ananias, and Zabdeus, and Eanes, and Sameius, and Hiereel, and Azarias." },
  { t = "v", n = 22, p = true, text = "And of the sons of Phaisur; Elionas, Massias Israel, and Nathanael, and Ocidelus and Talsas." },
  { t = "v", n = 23, p = true, text = "And of the Levites; Jozabad, and Semis, and Colius, who was called Calitas, and Patheus, and Judas, and Jonas." },
  { t = "v", n = 24, p = true, text = "Of the holy singers; Eleazurus, Bacchurus." },
  { t = "v", n = 25, p = true, text = "Of the porters; Sallumus, and Tolbanes." },
  { t = "v", n = 26, p = true, text = "Of them of Israel, of the sons of Phoros; Hiermas, and Eddias, and Melchias, and Maelus, and Eleazar, and Asibias, and Baanias." },
  { t = "v", n = 27, p = true, text = "Of the sons of Ela; Matthanias, Zacharias, and Hierielus, and Hieremoth, and Aedias." },
  { t = "v", n = 28, p = true, text = "And of the sons of Zamoth; Eliadas, Elisimus, Othonias, Jarimoth, and Sabatus, and Sardeus." },
  { t = "v", n = 29, p = true, text = "Of the sons of Babai; Johannes, and Ananias and Josabad, and Amatheis." },
  { t = "v", n = 30, p = true, text = "Of the sons of Mani; Olamus, Mamuchus, Jedeus, Jasubus, Jasael, and Hieremoth." },
  { t = "v", n = 31, p = true, text = "And of the sons of Addi; Naathus, and Moosias, Lacunus, and Naidus, and Mathanias, and Sesthel, Balnuus, and Manasseas." },
  { t = "v", n = 32, p = true, text = "And of the sons of Annas; Elionas and Aseas, and Melchias, and Sabbeus, and Simon Chosameus." },
  { t = "v", n = 33, p = true, text = "And of the sons of Asom; Altaneus, and Matthias, and Baanaia, Eliphalet, and Manasses, and Semei." },
  { t = "v", n = 34, p = true, text = "And of the sons of Maani; Jeremias, Momdis, Omaerus, Juel, Mabdai, and Pelias, and Anos, Carabasion, and Enasibus, and Mamnitanaimus, Eliasis, Bannus, Eliali, Samis, Selemias, Nathanias: and of the sons of Ozora; Sesis, Esril, Azaelus, Samatus, Zambis, Josephus." },
  { t = "v", n = 35, p = true, text = "And of the sons of Ethma; Mazitias, Zabadaias, Edes, Juel, Banaias." },
  { t = "v", n = 36, p = true, text = "All these had taken strange wives, and they put them away with their children." },
  { t = "v", n = 37, p = true, text = "And the priests and Levites, and they that were of Israel, dwelt in Jerusalem, and in the country, in the first day of the seventh month: so the children of Israel were in their habitations." },
  { t = "v", n = 38, p = true, text = "And the whole multitude came together with one accord into the broad place of the holy porch toward the east:" },
  { t = "v", n = 39, p = true, text = "And they spake unto Esdras the priest and reader, that he would bring the law of Moses, that was given of the Lord God of Israel." },
  { t = "v", n = 40, p = true, text = "So Esdras the chief priest brought the law unto the whole multitude from man to woman, and to all the priests, to hear law in the first day of the seventh month." },
  { t = "v", n = 41, p = true, text = "And he read in the broad court before the holy porch from morning unto midday, before both men and women; and the multitude gave heed unto the law." },
  { t = "v", n = 42, p = true, text = "And Esdras the priest and reader of the law stood up upon a pulpit of wood, which was made for that purpose." },
  { t = "v", n = 43, p = true, text = "And there stood up by him Mattathias, Sammus, Ananias, Azarias, Urias, Ezecias, Balasamus, upon the right hand:" },
  { t = "v", n = 44, p = true, text = "And upon his left hand stood Phaldaius, Misael, Melchias, Lothasubus, and Nabarias." },
  { t = "v", n = 45, p = true, text = "Then took Esdras the book of the law before the multitude: for he sat honourably in the first place in the sight of them all." },
  { t = "v", n = 46, p = true, text = "And when he opened the law, they stood all straight up. So Esdras blessed the Lord God most High, the God of hosts, Almighty." },
  { t = "v", n = 47, p = true, text = "And all the people answered, Amen; and lifting up their hands they fell to the ground, and worshipped the Lord." },
  { t = "v", n = 48, p = true, text = "Also Jesus, Anus, Sarabias, Adinus, Jacubus, Sabateas, Auteas, Maianeas, and Calitas, Asrias, and Joazabdus, and Ananias, Biatas, the Levites, taught the law of the Lord, making them withal to understand it." },
  { t = "v", n = 49, p = true, text = "Then spake Attharates unto Esdras the chief priest. and reader, and to the Levites that taught the multitude, even to all, saying," },
  { t = "v", n = 50, p = true, text = "This day is holy unto the Lord; (for they all wept when they heard the law:)" },
  { t = "v", n = 51, p = true, text = "Go then, and eat the fat, and drink the sweet, and send part to them that have nothing;" },
  { t = "v", n = 52, p = true, text = "For this day is holy unto the Lord: and be not sorrowful; for the Lord will bring you to honour." },
  { t = "v", n = 53, p = true, text = "So the Levites published all things to the people, saying, This day is holy to the Lord; be not sorrowful." },
  { t = "v", n = 54, p = true, text = "Then went they their way, every one to eat and drink, and make merry, and to give part to them that had nothing, and to make great cheer;" },
  { t = "v", n = 55, p = true, text = "Because they understood the words wherein they were instructed, and for the which they had been assembled." },
]

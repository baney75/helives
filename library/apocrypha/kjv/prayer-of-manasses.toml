summary = "A prayer of repentance in the name of King Manasseh of Judah, written to fit 2 Chronicles 33:12 and 13. It is canonical in the Eastern Orthodox churches but not in the Catholic canon (it stands in an appendix to the Vulgate), and it is outside the Protestant canon. It is kept here for reading and study, not presented as Scripture."

[[section]]
id = "1"
title = "Prayer of Manasses 1"
level = 1
blocks = [
  { t = "v", n = 1, p = true, text = "O Lord, Almighty God of our fathers, Abraham, Isaac, and Jacob, and of their righteous seed;" },
  { t = "v", n = 2, text = "who hast made heaven and earth, with all the ornament thereof;" },
  { t = "v", n = 3, text = "who hast bound the sea by the word of thy commandment; who hast shut up the deep, and sealed it by thy terrible and glorious name;" },
  { t = "v", n = 4, text = "whom all men fear, and tremble before thy power;" },
  { t = "v", n = 5, text = "for the majesty of thy glory cannot be borne, and thine angry threatening toward sinners is importable:" },
  { t = "v", n = 6, text = "but thy merciful promise is unmeasurable and unsearchable;" },
  { t = "v", n = 7, text = "for thou art the most high Lord, of great compassion, longsuffering, very merciful, and repentest of the evils of men. Thou, O Lord, according to thy great goodness hast promised repentance and forgiveness to them that have sinned against thee: and of thine infinite mercies hast appointed repentance unto sinners, that they may be saved." },
  { t = "v", n = 8, text = "Thou therefore, O Lord, that art the God of the just, hast not appointed repentance to the just, as to Abraham, and Isaac, and Jacob, which have not sinned against thee; but thou hast appointed repentance unto me that am a sinner:" },
  { t = "v", n = 9, text = "for I have sinned above the number of the sands of the sea. My transgressions, O Lord, are multiplied: my transgressions are multiplied, and I am not worthy to behold and see the height of heaven for the multitude of mine iniquities." },
  { t = "v", n = 10, text = "I am bowed down with many iron bands, that I cannot lift up mine head, neither have any release: for I have provoked thy wrath, and done evil before thee: I did not thy will, neither kept I thy commandments: I have set up abominations, and have multiplied offences." },
  { t = "v", n = 11, text = "Now therefore I bow the knee of mine heart, beseeching thee of grace." },
  { t = "v", n = 12, text = "I have sinned, O Lord, I have sinned, and I acknowledge mine iniquities:" },
  { t = "v", n = 13, text = "wherefore, I humbly beseech thee, forgive me, O Lord, forgive me, and destroy me not with mine iniquites. Be not angry with me for ever, by reserving evil for me; neither condemn me to the lower parts of the earth. For thou art the God, even the God of them that repent;" },
  { t = "v", n = 14, text = "and in me thou wilt shew all thy goodness: for thou wilt save me, that am unworthy, according to thy great mercy." },
  { t = "v", n = 15, text = "Therefore I will praise thee for ever all the days of my life: for all the powers of the heavens do praise thee, and thine is the glory for ever and ever. Amen." },
]

[[section]]
id = "chapter-i-of-the-holy-scripture"
title = "Chapter I. Of the Holy Scripture"
level = 1
blocks = [
  { t = "p", text = "I. Although the light of nature, and the works of creation and providence, do so far manifest the goodness, wisdom, and power of God, as to leave men inexcusable;[^846] yet are they not sufficient to give that knowledge of God, and of his will, which is necessary unto salvation;[^847] therefore it pleased the Lord, at sundry times, and in divers manners, to reveal himself, and to declare that his will unto his Church;[^848] and afterwards, for the better preserving and propagating of the truth, and for the more sure establishment and comfort of the Church against the corruption of the flesh, and the malice of Satan and of the world, to commit the same wholly unto writing;[^852] which maketh the holy Scripture to be most necessary;[^853] those former ways of God's revealing his will unto his people being now ceased.[^854]" },
  { t = "note", id = "846", text = "Rom. ii. 14, 15; i. 19, 20; Psa. xix. 1–3; Rom. i. 32; ii. 1." },
  { t = "note", id = "847", text = "1 Cor. i. 21; ii. 13, 14." },
  { t = "note", id = "848", text = "Hebrews 1:1." },
  { t = "note", id = "852", text = "Prov. xxii. 19–21; Luke i. 3, 4; Rom. xv. 4; Matt. iv. 4, 7, 10; Isa. viii. 19, 20." },
  { t = "note", id = "853", text = "2 Tim. iii. 15; 2 Pet. i. 19." },
  { t = "note", id = "854", text = "Heb. i. 1, 2." },
  { t = "p", text = "II. Under the name of holy Scripture, or the Word of God written, are now contained all the Books of the Old and New Testament, which are these:" },
  { t = "h", text = "*Of the Old Testament.*" },
  { t = "p", text = "Genesis." },
  { t = "p", text = "Ecclesiastes." },
  { t = "p", text = "Exodus." },
  { t = "p", text = "The Song of Songs." },
  { t = "p", text = "Leviticus." },
  { t = "p", text = "Isaiah." },
  { t = "p", text = "Numbers." },
  { t = "p", text = "Jeremiah." },
  { t = "p", text = "Deuteronomy." },
  { t = "p", text = "Lamentations." },
  { t = "p", text = "Joshua." },
  { t = "p", text = "Ezekiel." },
  { t = "p", text = "Judges." },
  { t = "p", text = "Daniel." },
  { t = "p", text = "Ruth." },
  { t = "p", text = "Hosea." },
  { t = "p", text = "I. Samuel." },
  { t = "p", text = "Joel." },
  { t = "p", text = "II. Samuel." },
  { t = "p", text = "Amos." },
  { t = "p", text = "I. Kings." },
  { t = "p", text = "Obadiah." },
  { t = "p", text = "II. Kings." },
  { t = "p", text = "Jonah." },
  { t = "p", text = "I. Chronicles." },
  { t = "p", text = "Micah." },
  { t = "p", text = "II. Chronicles." },
  { t = "p", text = "Nahum." },
  { t = "p", text = "Ezra." },
  { t = "p", text = "Habakkuk." },
  { t = "p", text = "Nehemiah." },
  { t = "p", text = "Zephaniah." },
  { t = "p", text = "Esther." },
  { t = "p", text = "Haggai." },
  { t = "p", text = "Job." },
  { t = "p", text = "Zechariah." },
  { t = "p", text = "Psalms." },
  { t = "p", text = "Malachi." },
  { t = "p", text = "Proverbs." },
  { t = "h", text = "*Of the New Testament.*" },
  { t = "p", text = "The Gospels according to Matthew, Luke, Mark, John." },
  { t = "p", text = "The Acts of the To Timothy II." },
  { t = "p", text = "Apostles." },
  { t = "p", text = "To Titus." },
  { t = "p", text = "Paul's Epistles to the To Philemon." },
  { t = "p", text = "Romans." },
  { t = "p", text = "The Epistle to the Corinthians I." },
  { t = "p", text = "Hebrews." },
  { t = "p", text = "Corinthians II." },
  { t = "p", text = "The Epistle of James." },
  { t = "p", text = "Galatians." },
  { t = "p", text = "The First and Second Ephesians." },
  { t = "p", text = "Epistles of Peter." },
  { t = "p", text = "Philippians." },
  { t = "p", text = "The First, Second, and Colossians." },
  { t = "p", text = "Third Epistles of Thessalonians I." },
  { t = "p", text = "John." },
  { t = "p", text = "Thessalonians II." },
  { t = "p", text = "The Epistle of Jude." },
  { t = "p", text = "To Timothy I." },
  { t = "p", text = "The Revelation." },
  { t = "p", text = "All which are given by inspiration of God, to be the rule of faith and life.[^859]" },
  { t = "note", id = "859", text = "Luke xvi. 29, 31; Eph. ii. 20; Rev. xxii. 18, 19; 2 Tim. iii. 16." },
  { t = "p", text = "III. The books commonly called Apocrypha, not being of divine inspiration, are no part of the Canon of the Scripture; and therefore are of no authority in the Church of God, nor to be any otherwise approved, or made use of, than other human writings.[^861]" },
  { t = "note", id = "861", text = "Luke xxiv. 27, 44; Rom. iii. 2; 2 Pet. i. 21." },
  { t = "p", text = "IV. The authority of the holy Scripture, for which it ought to be believed and obeyed, dependeth not upon the testimony of any man or church, but wholly upon God (who is truth itself), the Author thereof; and therefore it is to be received, because it is the Word of God.[^863]" },
  { t = "note", id = "863", text = "2 Pet. i. 19, 21; 2 Tim. iii. 16; 1 John v. 9; 1 Thess. ii. 13." },
  { t = "p", text = "V. We may be moved and induced by the testimony of the Church to an high and reverent esteem of[^865] the holy Scripture;[^866] and the heavenliness of the matter, the efficacy of the doctrine, the majesty of the style, the consent of all the parts, the scope of the whole (which is to give all glory to God), the full discovery it makes of the only way of man's salvation, the many other incomparable excellencies, and the entire perfection thereof, are arguments whereby it doth abundantly evidence itself to be the Word of God; yet, notwithstanding, our full persuasion and assurance of the infallible truth, and divine authority thereof, is from the inward work of the Holy Spirit, bearing witness by and with the Word in our hearts.[^867]" },
  { t = "note", id = "865", text = "[Am. ed. *for.*]" },
  { t = "note", id = "866", text = "1 Tim. iii. 15." },
  { t = "note", id = "867", text = "1 John ii. 20, 27; John xvi. 13, 14; 1 Cor. ii. 10–12; Isa. lix. 21." },
  { t = "p", text = "VI. The whole counsel of God, concerning all things necessary for his own glory, man's salvation, faith, and life, is either expressly set down in Scripture, or by good and necessary consequence may be deduced from Scripture: unto which nothing at any time is to be added, whether by new revelations of the Spirit, or traditions of men.[^870] Nevertheless we acknowledge the inward illumination of the Spirit of God to be necessary for the saving understanding of such things as are revealed in the Word;[^872] and that there are some circumstances concerning the worship of God, and government of the Church, common to human actions and societies, which are to be ordered by the light of nature and Christian prudence, according to the general rules of the Word, which are always to be observed.[^873]" },
  { t = "note", id = "870", text = "2 Tim. iii. 15–17; Gal. i. 8, 9; 2 Thess. ii. 2." },
  { t = "note", id = "872", text = "John vi. 45; 1 Cor. ii. 9, 10, 12." },
  { t = "note", id = "873", text = "1 Cor. xi. 13, 14; xiv. 26, 40." },
  { t = "p", text = "VII. All things in Scripture are not alike plain in themselves, nor alike clear unto all;[^876] yet those things which are necessary to be known, believed, and observed, for salvation, are so clearly propounded and opened in some place of Scripture or other, that not only the learned, but the unlearned, in a due use of the ordinary means, may attain unto a sufficient understanding of them.[^877]" },
  { t = "note", id = "876", text = "2 Pet. iii. 16." },
  { t = "note", id = "877", text = "Psa. cxix. 105, 130." },
  { t = "p", text = "VIII. The Old Testament in Hebrew (which was the native language of the people of God of old), and the New Testament in Greek (which at the time of the writing of it was most generally known to the nations), being immediately inspired by God, and by his singular care and providence kept pure in all ages, are therefore authentical;[^880] so as in all controversies of religion the Church is finally to appeal unto them.[^882] But because these original tongues are not known to all the people of God who have right unto, and interest in the Scriptures, and are commanded, in the fear of God, to read and search them,[^883] therefore they are to be translated into the vulgar language of every nation unto which they come,[^884] that the Word of God dwelling plentifully in all, they may worship him in an acceptable manner,[^885] and, through patience and comfort of the Scriptures, may have hope.[^886]" },
  { t = "note", id = "880", text = "Matt. v. 18." },
  { t = "note", id = "882", text = "Isa. viii. 20; Acts xv. 15; John v. 39, 46." },
  { t = "note", id = "883", text = "John v. 39." },
  { t = "note", id = "884", text = "1 Cor. xiv. 6, 9,11, 12, 24, 27, 28." },
  { t = "note", id = "885", text = "Col. iii. 16." },
  { t = "note", id = "886", text = "Rom. xv. 4." },
  { t = "p", text = "IX. The infallible rule of interpretation of Scripture is the Scripture itself; and therefore, when there is a question about the true and full sense of any Scripture (which is not manifold, but one), it must[^892] be searched and known by other places that speak more clearly.[^893]" },
  { t = "note", id = "892", text = "[Am. ed. may.]" },
  { t = "note", id = "893", text = "2 Pet. i. 20, 21; Acts xv. 15; [Am. John v. 46.]" },
  { t = "p", text = "X. The Supreme Judge, by which all controversies of religion are to be determined, and all decrees of councils, opinions of ancient writers, doctrines of men, and private spirits, are to be examined, and in whose sentence we are to rest, can be no other but the Holy Spirit speaking in the Scripture.[^895]" },
  { t = "note", id = "895", text = "Matt. xxii. 29, 31; Eph. ii. 20; Acts xxviii. 25." },
]

[[section]]
id = "chapter-ii-of-god-and-of-the-holy-trinity"
title = "Chapter II. Of God, and of the Holy Trinity"
level = 1
blocks = [
  { t = "p", text = "I. There is but one only[^897] living and true God,[^898] who is infinite in being and perfection,[^899] a most pure spirit,[^900] invisible,[^901] without body, parts,[^902] or passions,[^903] immutable,[^904] immense,[^905] eternal,[^906] incomprehensible,[^907] almighty,[^908] most wise,[^909] most holy,[^910] most free,[^911] most absolute,[^912] working all things according to the counsel of his own immutable and most righteous will,[^913] for his own glory;[^914] most loving,[^915] gracious, merciful, longsuffering, abundant in goodness and truth, forgiving iniquity, transgression, and sin;[^916] the rewarder of them that diligently seek him;[^917] and withal most just and terrible in his judgments;[^918] hating all sin,[^941] and who will by no means clear the guilty. .[^942]" },
  { t = "note", id = "897", text = "Deut. vi. 4; 1 Cor. viii. 4, 6." },
  { t = "note", id = "898", text = "1 Thess. i. 9; Jer. x. 10." },
  { t = "note", id = "899", text = "Job xi. 7, 8, 9; xxvi. 14." },
  { t = "note", id = "900", text = "John iv. 24." },
  { t = "note", id = "901", text = "1 Tim. i. 17." },
  { t = "note", id = "902", text = "Deut. iv. 15, 16; John iv. 24; Luke xxiv. 39." },
  { t = "note", id = "903", text = "Acts xiv. 11, 15." },
  { t = "note", id = "904", text = "James i. 17; Mal. iii. 6." },
  { t = "note", id = "905", text = "1 Kings viii. 27; Jer. xxiii. 23, 24." },
  { t = "note", id = "906", text = "Psa. xc. 2; 1 Tim. i. 17." },
  { t = "note", id = "907", text = "Psa. cxlv. 3." },
  { t = "note", id = "908", text = "Gen. xvii. 1; Rev. iv. 8." },
  { t = "note", id = "909", text = "Rom. xvi. 27." },
  { t = "note", id = "910", text = "Isa. vi. 3; Rev. iv. 8." },
  { t = "note", id = "911", text = "Psa. cxv. 3." },
  { t = "note", id = "912", text = "Exod. iii. 14." },
  { t = "note", id = "913", text = "Eph. i. 11." },
  { t = "note", id = "914", text = "Prov. xvi. 4; Rom. xi. 36; [Am. ed. Rev. iv. 11] ." },
  { t = "note", id = "915", text = "1 John iv. 8, 16." },
  { t = "note", id = "916", text = "Exod. xxxiv. 6, 7." },
  { t = "note", id = "917", text = "Heb. xi. 6." },
  { t = "note", id = "918", text = "Neh. ix. 32, 33." },
  { t = "note", id = "941", text = "Psa. v. 5, 6." },
  { t = "note", id = "942", text = "Nahum i. 2, 3; Exod. xxxiv. 7." },
  { t = "p", text = "II. God hath all life,[^945] glory,[^946] goodness,[^947] blessedness,[^948] in and of himself; and is alone in and unto himself allsufficient, not standing in need of any creatures which he hath made,[^949] nor deriving any glory from them,[^950] but only manifesting his own glory in, by, unto, and upon them: he is the alone foundation of all being, of whom, through whom, and to whom are all things;[^951] and hath most sovereign dominion over them, to do by them, for them, or upon them whatsoever himself pleaseth.[^952] In his sight all things are open and manifest;[^953] his knowledge is infinite, infallible, and independent upon the creature;[^954] so as nothing is to him contingent or uncertain.[^955] He is most holy in all his counsels, in all his works, and in all his commands.[^956] To him is due from angels and men, and every other creature, whatsoever worship, service, or obedience, he is pleased to require of them.[^957]" },
  { t = "note", id = "945", text = "John v. 26." },
  { t = "note", id = "946", text = "Acts vii. 2." },
  { t = "note", id = "947", text = "Psa. cxix. 68." },
  { t = "note", id = "948", text = "1 Tim. vi. 15; Rom. ix. 5." },
  { t = "note", id = "949", text = "Acts xvii. 24, 25." },
  { t = "note", id = "950", text = "Job xxii. 2, 23." },
  { t = "note", id = "951", text = "Rom. xi. 36." },
  { t = "note", id = "952", text = "Rev. iv. 11; 1 Tim. vi. 15; Dan. iv. 25, 35." },
  { t = "note", id = "953", text = "Heb. iv. 13." },
  { t = "note", id = "954", text = "Rom. xi. 33, 34; Psa. cxlvii. 5." },
  { t = "note", id = "955", text = "Acts 15:18; Ezeck. xi. 5." },
  { t = "note", id = "956", text = "Psa. cxlv. 17; Rom. vii. 12." },
  { t = "note", id = "957", text = "Rev. v. 12–14." },
  { t = "p", text = "III. In the unity of the Godhead head there be three persons, of one substance, power, and eternity: God the Father, God the Son, and God the Holy Ghost.[^971] The Father is of none, neither begotten nor proceeding; the Son is eternally begotten of the Father;[^972] the Holy Ghost eternally proceeding from the Father and the Son.[^973]" },
  { t = "note", id = "971", text = "1 John v. 7; Matt. iii. 16, 17; xxviii. 19; 2 Cor. xiii. 14." },
  { t = "note", id = "972", text = "John i. 14, 18." },
  { t = "note", id = "973", text = "John xv. 26; Gal. iv. 6." },
]

[[section]]
id = "chapter-iii-of-god-s-eternal-decree"
title = "Chapter III. Of God's Eternal Decree"
level = 1
blocks = [
  { t = "h", text = "Chapter III. *Of God's Eternal Decree.*[^977]" },
  { t = "note", id = "977", text = "[Am. ed. *decrees*.]" },
  { t = "p", text = "I. God from all eternity did, by the most wise and holy counsel of his own will, freely and unchangeably ordain whatsoever comes to pass;[^978] yet so as thereby neither is God the author of sin,[^979] nor is violence offered to the will of the creatures, nor is the liberty or contingency of second causes taken away, but rather established.[^980]" },
  { t = "note", id = "978", text = "Eph. i. 11; Rom. xi. 33; Heb. vi. 17; Rom. ix. 15,18." },
  { t = "note", id = "979", text = "James i. 13,17; 1 John i. 5; [Am. ed. Eccl. vii. 29]." },
  { t = "note", id = "980", text = "Acts ii. 23; Matt. xvii. 12; Acts iv. 27, 28; John xix. 11; Prov. xvi. 33." },
  { t = "p", text = "II. Although God knows whatsoever may or can come to pass upon all supposed conditions,[^984] yet hath he not decreed any thing because he foresaw it as future, or as that which would come to pass upon such conditions.[^985]" },
  { t = "note", id = "984", text = "Acts xv. 18; 1 Sam. xxiii. 11, 12; Matt. xi. 21, 23." },
  { t = "note", id = "985", text = "Rom. ix. 11,13,16,18." },
  { t = "p", text = "III. By the decree of God, for the manifestation of his glory, some men and angels[^988] are predestinated unto everlasting life, and others foreordained to everlasting death.[^989]" },
  { t = "note", id = "988", text = "1 Tim. v. 21; Matt. xxv. 41." },
  { t = "note", id = "989", text = "Rom. ix. 22, 23; Eph. i. 5, 6; Prov. xvi. 4." },
  { t = "p", text = "IV. These angels and men, thus predestinated and foreordained, are particularly and unchangeably designed; and their number is so certain and definite that it can not be either increased or diminished.[^992]" },
  { t = "note", id = "992", text = "2 Tim. ii. 19; John xiii. 18." },
  { t = "p", text = "V. Those of mankind that are predestinated unto life, God, before the foundation of the world was laid, according to his eternal and immutable purpose, and the secret counsel and good pleasure of his will, hath chosen in Christ, unto everlasting glory,[^994] out of his mere free grace and love, without any foresight of faith or good works, or perseverance in either of them, or any other thing in the creature, as conditions, or causes moving him thereunto;[^995] and all to the praise of his glorious grace.[^996]" },
  { t = "note", id = "994", text = "Eph. i. 4, 9, 11; Rom. viii. 30; 2 Tim. i. 9; 1 Thess. v. 9." },
  { t = "note", id = "995", text = "Rom. ix. 11, 13, 16; Eph. i, 4, 9." },
  { t = "note", id = "996", text = "Eph. i. 6, 12." },
  { t = "p", text = "VI. As God hath appointed the elect unto glory, so hath he, by the eternal and most free purpose of his will, foreordained all the means thereunto.[^1000] Wherefore they who are elected, being fallen in Adam, are redeemed by Christ,[^1002] are effectually called unto faith in Christ by his Spirit working in due season; are justified, adopted, sanctified,[^1003] and kept by his power through faith unto salvation.[^1004] Neither are any other redeemed by Christ, effectually called, justified, adopted, sanctified, and saved, but the elect only.[^1005]" },
  { t = "note", id = "1000", text = "1 Pet. i. 2; Eph. i. 4, 5; ii. 10; 2 Thess. ii. 13." },
  { t = "note", id = "1002", text = "1 Thess. v. 9, 10; Tit. ii. 14." },
  { t = "note", id = "1003", text = "Rom. viii. 30; Eph. i. 5; 2 Thess. ii. 13." },
  { t = "note", id = "1004", text = "1 Pet. i. 5." },
  { t = "note", id = "1005", text = "John xvii. 9; Rom. viii. 28 to the end; John vi. 64, 65; viii. 47; x. 26; 1 John ii. 19." },
  { t = "p", text = "VII. The rest of mankind God was pleased, according to the unsearchable counsel of his own will, whereby he extendeth or withholdeth mercy as he pleaseth, for the glory of his sovereign power over his creatures, to pass by, and to ordain them to dishonor and wrath for their sin, to the praise of his glorious justice.[^1010]" },
  { t = "note", id = "1010", text = "Matt. xi. 25, 26; Rom. ix. 17, 18, 21, 22; 2 Tim. ii. 19, 20; Jude 4; 1 Pet. ii. 8." },
  { t = "p", text = "VIII. The doctrine of this high mystery of predestination is to be handled with special prudence and care,[^1012] that men attending the will of God revealed in his Word, and yielding obedience thereunto, may, from the certainty of their effectual vocation, be assured of their eternal election.[^1013] So shall this doctrine afford matter of praise, reverence, and admiration of God;[^1014] and of humility, diligence, and abundant consolation to all that sincerely obey the gospel.[^1018]" },
  { t = "note", id = "1012", text = "Rom. ix. 20; xi. 33; Deut. xxix. 29." },
  { t = "note", id = "1013", text = "2 Pet. i. 10." },
  { t = "note", id = "1014", text = "Eph. i. 6; Rom. xi. 33." },
  { t = "note", id = "1018", text = "Rom. xi. 5, 6, 20; 2 Pet. i. 10; Rom. viii. 33; Luke x. 20." },
]

[[section]]
id = "chapter-iv-of-creation"
title = "Chapter IV. Of Creation"
level = 1
blocks = [
  { t = "p", text = "I. It pleased God the Father, Son, and Holy Ghost,[^1020] for the manifestation of the glory of his eternal power, wisdom, and goodness,[^1021] in the beginning, to create or make of nothing the world, and all things therein, whether visible or invisible, in the space of six days, and all very good.[^1022]" },
  { t = "note", id = "1020", text = "Heb. i. 2; John i. 2, 3; Gen. i. 2; Job xxvi. 13; xxxiii. 4." },
  { t = "note", id = "1021", text = "Rom. i. 20; Jer. x. 12; Psa. civ. 24; xxxiii. 5, 6." },
  { t = "note", id = "1022", text = "Gen. ch. i.; Heb. xi. 3; Col. i. 16; Acts xvii. 24." },
  { t = "p", text = "II. After God had made all other creatures, he created man, male and female,[^1026] with reasonable and immortal souls,[^1027] endued with knowledge, righteousness, and true holiness, after his own image,[^1028] having the law of God written in their hearts,[^1029] and power to fulfill it;[^1030] and yet under a possibility of transgressing, being left to the liberty of their own will, which was subject unto change.[^1031] Beside this law written in their hearts, they received a command not to eat of the tree of the knowledge of good and evil; which while they kept they were happy in their communion with God,[^1038] and had dominion over the creatures.[^1039]" },
  { t = "note", id = "1026", text = "Gen. i. 27." },
  { t = "note", id = "1027", text = "Gen. ii. 7; Eccles. xii. 7; Luke xxiii. 43; Matt. x. 28." },
  { t = "note", id = "1028", text = "Gen. i. 26; Col. iii. 10; Eph. iv. 24." },
  { t = "note", id = "1029", text = "Rom. ii. 14, 15." },
  { t = "note", id = "1030", text = "Eccles. vii. 29." },
  { t = "note", id = "1031", text = "Gen. iii. 6; Eccles. vii. 29." },
  { t = "note", id = "1038", text = "Gen. ii. 27; iii. 8–11, 23." },
  { t = "note", id = "1039", text = "Gen. i. 26, 28; [Am. ed. Psa. viii. 6–8]." },
]

[[section]]
id = "chapter-v-of-providence"
title = "Chapter V. Of Providence"
level = 1
blocks = [
  { t = "p", text = "God, the great Creator of all things, doth uphold,[^1042] direct, dispose, and govern all creatures, actions, and things,[^1043] from the greatest even to the least,[^1044] by his most wise and holy providence,[^1045] according to his infallible foreknowledge[^1046] and the free and immutable counsel of his own will,[^1047] to the praise of the glory of his wisdom, power, justice, goodness, and mercy.[^1048]" },
  { t = "note", id = "1042", text = "Heb. i. 3." },
  { t = "note", id = "1043", text = "Dan. iv. 34, 35; Psa. cxxxv. 6; Acts xvii. 25, 26, 28; Job, chaps. xxxviii. xxxix. xl. xli." },
  { t = "note", id = "1044", text = "Matt. x. 29–31; [Am. ed. Matt. vi. 26, 30]." },
  { t = "note", id = "1045", text = "Prov. xv. 3; [Am. ed. 2 Chron. xvi. 9]; Psa. civ. 24; cxlv. 17." },
  { t = "note", id = "1046", text = "Acts xv. 18; Psa. xciv. 8–11." },
  { t = "note", id = "1047", text = "Eph. i. 11; Psa. xxxiii. 10, 11." },
  { t = "note", id = "1048", text = "Isa. lxiii. 14; Eph. iii. 10; Rom. ix. 17; Gen. xlv. 7; Psa. cxlv. 7." },
  { t = "p", text = "II. Although in relation to the foreknowledge and decree of God, the first cause, all things come to pass immutably and infallibly,[^1056] yet by the same providence he ordereth them to fall out, according to the nature of second causes, either necessarily, freely, or contingently.[^1057]" },
  { t = "note", id = "1056", text = "Acts ii. 23." },
  { t = "note", id = "1057", text = "Gen. viii. 22; Jer. xxxi. 35; Exod. xxi. 13; Deut. xix. 5; 1 Kings xxii. 28, 34; Isa. x. 6, 7." },
  { t = "p", text = "III. God, in his ordinary providence, maketh use of means,[^1060] yet is free to work without,[^1061] above,[^1064] and against them, at his pleasure.[^1065]" },
  { t = "note", id = "1060", text = "Acts xxvii. 31, 44; Isa. lv. 10, 11; Hos. ii. 21, 22." },
  { t = "note", id = "1061", text = "Hos. i. 7; Matt. iv. 4; Job xxxiv. 10." },
  { t = "note", id = "1064", text = "Rom. iv. 19–21." },
  { t = "note", id = "1065", text = "2 Kings vi. 6; Dan. iii. 27." },
  { t = "p", text = "IV. The almighty power, unsearchable wisdom, and infinite goodness of God so far manifest themselves in his providence that it extendeth itself even to the first fall, and all other sins of angels and men,[^1068] and that not by a bare permission,[^1069] but such as hath joined with it a most wise and powerful bounding,[^1070] and otherwise ordering and governing of them, in a manifold dispensation, to his own holy ends;[^1071] yet so as the sinfulness thereof proceedeth only from the creature, and not from God; who, being most holy and righteous, neither is nor can be the author or approver of sin.[^1072]" },
  { t = "note", id = "1068", text = "Rom. xi. 32–34; 2 Sam. xxiv. 1; 1 Chron. xxi. 1; 1 Kings xxii. 22, 23; 1 Chron. x. 4, 13, 14; 2 Sam. xvi. 10; Acts ii. 23; iv. 27, 28." },
  { t = "note", id = "1069", text = "Acts xiv. 16." },
  { t = "note", id = "1070", text = "Psa. lxxvi. 10; 2 Kings xix. 28." },
  { t = "note", id = "1071", text = "Gen. l. 20; Isa. x. 6, 7, 12." },
  { t = "note", id = "1072", text = "1 James i. 13, 14, 17; 1 John. ii. 16; Psa. l. 21." },
  { t = "p", text = "V. The most wise, righteous, and gracious God doth oftentimes leave for a season his own children to manifold temptations and the corruption of their own hearts, to chastise them for their former sins, or to discover unto them the hidden strength of corruption and deceitfulness of their hearts, that they may be humbled;[^1078] and to raise them to a more close and constant dependence for their support unto[^1080] himself, and to make them more watchful against all future occasions of sin, and for sundry other just and holy ends.[^1081]" },
  { t = "note", id = "1078", text = "2 Chron. xxxii. 25, 26, 31; 2 Sam. xxiv. 1." },
  { t = "note", id = "1080", text = "[Am. ed. *upon*.]" },
  { t = "note", id = "1081", text = "2 Cor. xii. 7–9; Psa. lxxiii. throughout; lxxvii. 1–10, 12; Mark xiv. 66 to the end; John xxi. 15–17." },
  { t = "p", text = "VI. As for those wicked and ungodly men whom God, as a righteous judge, for former sins, doth blind and harden,[^1083] from them he not only withholdeth his grace, whereby they might have been enlightened in their understandings and wrought upon in their hearts,[^1084] but sometimes also withdraweth the gifts which they had,[^1085] and exposeth them to such objects as their corruption makes occasion of sin;[^1086] and withal, gives them over to their own lusts, the temptations of the world, and the power of Satan;[^1087] whereby it comes to pass that they harden themselves, even under those means which God useth for the softening of others.[^1088]" },
  { t = "note", id = "1083", text = "Rom. i. 24, 26, 28; xi. 7, 8." },
  { t = "note", id = "1084", text = "Deut. xxix. 4." },
  { t = "note", id = "1085", text = "Matt. xiii. 12; xxv. 29." },
  { t = "note", id = "1086", text = "Deut. ii. 30; 2 Kings viii. 12, 13." },
  { t = "note", id = "1087", text = "Psa. lxxxi. 11, 12; 2 Thess. ii. 10–12." },
  { t = "note", id = "1088", text = "Exod. vii. 3; viii. 15, 32; 2 Cor. ii. 15, 16; Isa. viii. 14; 1 Pet. ii. 7, 8; Isa. vi. 9, 10; Acts xxviii. 26, 27." },
  { t = "p", text = "VII. As the providence of God doth, in general, reach to all creatures, so, after a most special manner, it taketh care of his Church, and disposeth all things to the good thereof.[^1095]" },
  { t = "note", id = "1095", text = "1 Tim. iv. 10; Amos ix. 8, 9; Rom. viii 28; Isa. xliii. 3–5,14." },
]

[[section]]
id = "chapter-vi-of-the-fall-of-man-of-sin-and-of-the-punishment-t"
title = "Chapter VI. Of the Fall of Man, of Sin, and of the Punishment thereof"
level = 1
blocks = [
  { t = "p", text = "I. Our first parents, being seduced by the subtilty and temptation of Satan, sinned in eating the forbidden fruit.[^1097] This their sin God was pleased, according to his wise and holy counsel, to permit, having purposed to order it to his own glory.[^1098]" },
  { t = "note", id = "1097", text = "Gen. iii. 13; 2 Cor. xi. 3." },
  { t = "note", id = "1098", text = "Rom. xi. 32." },
  { t = "p", text = "II. By this sin they fell from their original righteousness and communion with God,[^1101] and so became dead in sin,[^1102] and wholly defiled in all the faculties and parts of soul and body.[^1103]" },
  { t = "note", id = "1101", text = "Gen. iii. 6–8; Eccles. vii. 29; Rom. iii. 23." },
  { t = "note", id = "1102", text = "Gen. ii. 17; Eph. ii. 1; [Am. ed. Rom. v. 12]." },
  { t = "note", id = "1103", text = "Tit. i. 15; Gen. vi. 5; Jer. xvii. 9; Rom. iii. 10–19." },
  { t = "p", text = "III. They being the root of all mankind,[^1107] the guilt of this sin was imputed, and the same death in sin and corrupted nature conveyed to all their posterity descending from them by ordinary generation.[^1108]" },
  { t = "note", id = "1107", text = "Gen. i. 27, 28; ii. 16, 17; Acts xvii. 26; Rom. v. 12, 15–19; 1 Cor. xv. 21, 22, 45, 49." },
  { t = "note", id = "1108", text = "Psa. li. 5; Gen. v. 3; Job xiv. 4; xv. 14." },
  { t = "p", text = "IV. From this original corruption, whereby we are utterly indisposed, disabled, and made opposite to all good,[^1111] and wholly inclined to all evil,[^1112] do proceed all actual transgressions.[^1113]" },
  { t = "note", id = "1111", text = "Rom. v. 6; vii. 18; viii. 7; Col. i. 21; [Am. ed. John iii. 6]." },
  { t = "note", id = "1112", text = "Gen. vi. 5; viii. 21; Rom. iii. 10–12." },
  { t = "note", id = "1113", text = "James i. 14, 15; Eph. ii. 2, 3; Matt. xv. 19." },
  { t = "p", text = "V. This corruption of nature, during this life, doth remain in those that are regenerated;[^1117] and although it be through Christ pardoned and mortified, yet both itself and all the motions thereof are truly and properly sin.[^1118]" },
  { t = "note", id = "1117", text = "1 John i. 8, 10; Rom. vii. 14, 17, 18, 23; James iii. 2; Prov. xx. 9; Eccles. vii. 20." },
  { t = "note", id = "1118", text = "Rom. vii. 5, 7, 8, 25; Gal. v. 17." },
  { t = "p", text = "VI. Every sin, both original and actual, being a transgression of the righteous law of God, and contrary thereunto,[^1121] doth, in its own nature, bring guilt upon the sinner,[^1122] whereby he is bound over to the wrath of God[^1123] and curse of the law,[^1124] and so made subject to death,[^1125] with all miseries spiritual,[^1126] temporal,[^1127] and eternal.[^1128]" },
  { t = "note", id = "1121", text = "1 John iii. 4." },
  { t = "note", id = "1122", text = "Rom. ii. 15; iii. 9, 19." },
  { t = "note", id = "1123", text = "Eph. ii. 3." },
  { t = "note", id = "1124", text = "Gal. iii. 10." },
  { t = "note", id = "1125", text = "Rom. vi. 23." },
  { t = "note", id = "1126", text = "Eph. iv. 18." },
  { t = "note", id = "1127", text = "Rom. viii. 20; Lam. iii. 39." },
  { t = "note", id = "1128", text = "Matt. xxv. 41; 2 Thess. i. 9." },
]

[[section]]
id = "chapter-vii-of-god-s-covenant-with-man"
title = "Chapter VII. Of God's Covenant with Man"
level = 1
blocks = [
  { t = "p", text = "I. The distance between God and the creature is so great that although reasonable creatures do owe obedience unto him as their Creator, yet they could never have any fruition of him as their blessedness and reward but by some voluntary condescension on God's part, which he hath been pleased to express by way of covenant.[^1137]" },
  { t = "note", id = "1137", text = "Isa. xl. 13–17; Job ix. 32, 33; 1 Sam. ii. 25; Psa. c. 2, 3; cxiii. 5, 6; Job xxii. 2, 3; xxxv. 7, 8; Luke xvii. 10; Acts xvii. 24, 25." },
  { t = "p", text = "II. The first covenant made with man was a covenant of works,[^1139] wherein life was promised to Adam, and in him to his posterity,[^1140] upon condition of perfect and personal obedience.[^1141]" },
  { t = "note", id = "1139", text = "Gal. iii. 12; [Am. ed. Hos. vi. 7; Gen. ii. 16, 17]." },
  { t = "note", id = "1140", text = "Rom. v. 12–20; x. 5." },
  { t = "note", id = "1141", text = "Gen. ii. 17; Gal. iii. 10." },
  { t = "p", text = "III. Man by his fall having made himself incapable of life by that covenant, the Lord was pleased to make a second,[^1145] commonly called the covenant of grace: wherein he freely offered unto sinners life and salvation by Jesus Christ, requiring of them faith in him that they may be saved,[^1146] and promising to give unto all those that are ordained unto life his Holy Spirit, to make them willing and able to believe.[^1147]" },
  { t = "note", id = "1145", text = "Gal. iii. 21; Rom. iii. 20, 21; viii. 3; Gen. iii. 15; Isa. xlii. 6." },
  { t = "note", id = "1146", text = "5 Mark xvi. 15, 16; John iii. 16; Rom. x. 6, 9; Gal. iii. 11." },
  { t = "note", id = "1147", text = "Ezek. xxxvi. 26, 27; John vi. 44, 45; [Am. ed. v. 37]." },
  { t = "p", text = "IV. This covenant of grace is frequently set forth in the Scripture by the name of a testament, in reference to the death of Jesus Christ the testator, and to the everlasting inheritance, with all things belonging to it, therein bequeathed.[^1151]" },
  { t = "note", id = "1151", text = "Heb. ix. 15–17; vii. 22; Luke xxii. 20; 1 Cor. xi. 25." },
  { t = "p", text = "V. This covenant was differently administered in the time of the law and in the time of the gospel:[^1153] under the law it was administered by promises, prophecies, sacrifices, circumcision, the paschal lamb, and other types and ordinances delivered to the people of the Jews, all fore-signifying Christ to come,[^1155] which were for that time sufficient and efficacious, through the operation of the Spirit, to instruct and build up the elect in faith in the promised Messiah,[^1156] by whom they had full remission of sins and eternal salvation; and is called the Old Testament.[^1157]" },
  { t = "note", id = "1153", text = "2 Cor. iii. 6–9." },
  { t = "note", id = "1155", text = "Heb., chaps. viii. ix. x.; Rom. iv. 11; Col. ii. 11,12; 1 Cor. v. 7; [Am. ed. Col. ii. 17]." },
  { t = "note", id = "1156", text = "1 Cor. x. 1–4; Heb. xi. 13; John viii. 56." },
  { t = "note", id = "1157", text = ";Gal. iii. 7–9, 14." },
  { t = "p", text = "VI. Under the gospel, when Christ the substance[^1161] was exhibited, the ordinances in which this covenant is dispensed are the preaching of the word and the administration of the sacraments of Baptism and the Lord's Supper;[^1162] which, though fewer in number, and administered with more simplicity aud less outward glory, yet in them it is held forth in more fullness, evidence, and spiritual efficacy,[^1163] to all nations, both Jews and Gentiles;[^1164] and is called the New Testament.[^1165] There are not, therefore, two covenants of grace differing in substance, but one and the same under various dispensations.[^1166]" },
  { t = "note", id = "1161", text = "Gal. ii. 17; [Am. ed. Col. ii. 17]." },
  { t = "note", id = "1162", text = "Matt. xxviii. 19, 20; 1 Cor. xi. 23–25; [Am. ed. 2 Cor. iii. 7–11]." },
  { t = "note", id = "1163", text = "Heb. xii. 22–28; Jer. xxxi. 33, 34." },
  { t = "note", id = "1164", text = "Matt. xxviii. 19; Eph. ii. 15–19." },
  { t = "note", id = "1165", text = "Luke xxii. 20; [Am. ed. Heb. viii. 7–9]." },
  { t = "note", id = "1166", text = "Gal. iii. 14, 16; Acts xv. 11; Rom. iii. 21–23, 30; Psa. xxxii. 1; Rom. iv. 3, 6, 16, 17, 23, 24; Heb. xiii. 8." },
]

[[section]]
id = "chapter-viii-of-christ-the-mediator"
title = "Chapter VIII. Of Christ the Mediator"
level = 1
blocks = [
  { t = "p", text = "I. It pleased God, in his eternal purpose, to choose and ordain the Lord Jesus, his only-begotten Son, to be the Mediator between God and man,[^1173] the Prophet,[^1174] Priest,[^1175] and King;[^1176] the Head and Saviour of his Church,[^1177] the Heir of all things,[^1178] and Judge of the world;[^1179] whom he did, from all eternity, give a people to be his seed,[^1180] and to be by him in time redeemed, called, justified, sanctified, and glorified.[^1181]" },
  { t = "note", id = "1173", text = "Isa. xlii. 1; 1 Pet. i. 19, 20; John iii. 16; 2 Tim. ii. 5." },
  { t = "note", id = "1174", text = "Acts iii. 22; [Am. ed. Deut. xviii. 15]." },
  { t = "note", id = "1175", text = "Heb. v. 5, 6." },
  { t = "note", id = "1176", text = "Psa. ii. 6; Luke i. 33." },
  { t = "note", id = "1177", text = "Eph. v. 23." },
  { t = "note", id = "1178", text = "Heb. i. 2." },
  { t = "note", id = "1179", text = "Acts xvii. 31." },
  { t = "note", id = "1180", text = "John xvii. 6; Psa. xxii. 30; Isa. liii. 10." },
  { t = "note", id = "1181", text = "1 Tim. ii. 6; Isa. lv. 4, 5; 1 Cor. i. 30." },
  { t = "p", text = "II. The Son of God, the second person in the Trinity, being very and eternal God, of one substance, and equal with the Father did, when the fullness of time was come, fake upon him man's nature,[^1191] with all the essential properties and common infirmities thereof, yet without sin:[^1192] being conceived by the power of the Holy Ghost in the womb of the Virgin Mary, of her substance.[^1193] So that two whole, perfect, and distinct natures, the Godhead and the manhood, were inseparably joined together in one person, without conversion, composition, or confusion.[^1197] Which person is very God and very man, yet one Christ, the only mediator between God and man.[^1198]" },
  { t = "note", id = "1191", text = "John i. 1, 14; 1 John v. 20; Phil. ii. 6; Gal. iv. 4." },
  { t = "note", id = "1192", text = "Heb. ii. 14, 16, 17; iv. 15." },
  { t = "note", id = "1193", text = "Luke i. 27, 31, 35; Gal. iv. 4." },
  { t = "note", id = "1197", text = "Luke i. 35; Col. ii. 9; Rom. ix. 5; 1 Pet. iii. 18; 1 Tim. iii. 16." },
  { t = "note", id = "1198", text = "Rom. i. 3, 4; 1 Tim. ii. 5." },
  { t = "p", text = "III. The Lord Jesus, in his human nature thus united to the divine, was sanctified and anointed with the Holy Spirit above measure;[^1201] having in him all the treasures of wisdom and knowledge,[^1202] in whom it pleased the Father that all fullness should dwell;[^1203] to the end that, being holy, harmless, undefiled, and full of grace and truth,[^1204] he might be thoroughly furnished to execute the office of a mediator and surety.[^1205] Which office he took not unto himself, but was thereunto called by his Father,[^1206] who put all power and judgment into his hand, and gave him commandment to execute the same.[^1207]" },
  { t = "note", id = "1201", text = "Psa. xlv. 7; John iii. 34." },
  { t = "note", id = "1202", text = "Col. ii. 3." },
  { t = "note", id = "1203", text = "Col. i. 19." },
  { t = "note", id = "1204", text = "Heb. vii. 26; John i. 14." },
  { t = "note", id = "1205", text = "Acts x. 38; Heb. xii. 24; vii. 22." },
  { t = "note", id = "1206", text = "Heb. v. 4, 5." },
  { t = "note", id = "1207", text = "John v. 22, 27; Matt. xxviii. 18; Acts ii. 36." },
  { t = "p", text = "IV. This office the Lord Jesus did most willingly undertake,[^1215] which, that he might discharge, he was made under the law,[^1216] and did perfectly fulfill it;[^1217] endured most grievous torments immediately in his soul,[^1218] and most painful sufferings in his body;[^1224] was crucified, and died;[^1226] was buried, and remained under the power of death, yet saw no corruption.[^1227] On the third day he arose from the dead,[^1228] with the same body in which he suffered;[^1229] with which also he ascended into heaven, and there sitteth at the right hand of his Father,[^1230] making intercession;[^1231] and shall return to judge men and angels at the end of the world.[^1232]" },
  { t = "note", id = "1215", text = "Psa. xl. 7, 8; Heb. x. 5–10; John x. 18; Phil. ii. 8." },
  { t = "note", id = "1216", text = "Gal. iv. 4." },
  { t = "note", id = "1217", text = "Matt. iii. 15; v. 17." },
  { t = "note", id = "1218", text = "Matt. xxvi. 37, 38; Luke xxii. 44; Matt. xxvii. 46." },
  { t = "note", id = "1224", text = "[Matt., chaps. xxvi. xxvii.]" },
  { t = "note", id = "1226", text = "Phil. ii. 8." },
  { t = "note", id = "1227", text = "Acts ii. 23, 24, 27; xiii. 37; Rom. vi. 9." },
  { t = "note", id = "1228", text = "1 Cor. xv. 3, 4." },
  { t = "note", id = "1229", text = "John xx. 25, 27." },
  { t = "note", id = "1230", text = "Mark xvi. 19." },
  { t = "note", id = "1231", text = "Rom. viii. 34; Heb. ix. 24; vii. 25." },
  { t = "note", id = "1232", text = "Rom. xiv. 9, 10; Acts i. 11; x. 42; Matt. xiii. 40–42; Jude 6; 2 Pet. ii. 4." },
  { t = "p", text = "V. The Lord Jesus, by his perfect obedience and sacrifice of himself, which he through the eternal Spirit once offered up unto God, hath fully satisfied the justice of his Father,[^1240] and purchased not only reconciliation, but an everlasting inheritance in the kingdom of heaven, for all those whom the Father hath given unto him.[^1241]" },
  { t = "note", id = "1240", text = "Rom. v. 19; Heb. ix. 14, 16; x. 14; Eph. v. 2; Rom. iii. 25, 26." },
  { t = "note", id = "1241", text = "Dan. ix. 24, 26; Col. i. 19, 20; Eph. i. 11, 14; John xvii. 2; Heb. ix. 12, 15." },
  { t = "p", text = "VI. Although the work of redemption was not actually wrought by Christ till after his incarnation, yet the virtue, efficacy, and benefits thereof were communicated unto the elect, in all ages successively from the beginning of the world, in and by those promises, types, and sacrifices, wherein he was revealed, and signified to be the seed of the woman which should bruise the serpent's head, and the lamb slain from the beginning of the world, being yesterday and today the same and forever.[^1244]" },
  { t = "note", id = "1244", text = "Gal. iv. 4, 5; Gen. iii. 15; Rev. xiii. 8; Heb. xiii. 8." },
  { t = "p", text = "VII. Christ, in the work of mediation, acteth according to both natures; by each nature doing that which is proper to itself;[^1246] yet, by reason of the unity of the person, that which is proper to one nature is sometimes, in Scripture, attributed to the person denominated by the other nature.[^1247]" },
  { t = "note", id = "1246", text = "Heb. ix. 14; 1 Pet. iii. 18." },
  { t = "note", id = "1247", text = "Acts xx. 28; John iii. 13; 1 John iii. 16." },
  { t = "p", text = "VIII. To all those for whom Christ hath purchased redemption he doth certainly and effectually apply and communicate the same;[^1250] making intercession for them,[^1251] and revealing unto them, in and by the Word, the mysteries of salvation;[^1252] effectually persuading them by his Spirit to believe and obey; and governing their hearts by his Word and Spirit;[^1253] overcoming all their enemies by his almighty power and wisdom, in such manner and ways as are most consonant to his wonderful and unsearchable dispensation.[^1254]" },
  { t = "note", id = "1250", text = "John vi. 37, 39; x. 15, 16." },
  { t = "note", id = "1251", text = "1 John ii. 1, 2; Rom. viii. 34." },
  { t = "note", id = "1252", text = "John xv. 13, 15; Eph. i. 7–9; John xvii. 6." },
  { t = "note", id = "1253", text = "John xiv. 16; Heb. xii. 2; 2 Cor. iv. 13; Rom. viii. 9, 14; xv. 18, 19; John xvii. 17." },
  { t = "note", id = "1254", text = "Psa. cx. 1; 1 Cor. xv. 25, 26; Mal. iv. 2, 3; Col. ii. 15." },
]

[[section]]
id = "chapter-ix-of-free-will"
title = "Chapter IX. Of Free-will"
level = 1
blocks = [
  { t = "p", text = "I. God hath endued the will of man with that natural liberty, that[^1260]is neither forced nor by any absolute necessity of nature determined to good or evil.[^1261]" },
  { t = "note", id = "1260", text = "[Am. ed. inserts *it*.]" },
  { t = "note", id = "1261", text = "Matt. xvii. 12; James i. 14; Deut. xxx. 19; [Am. ed. John v. 40]." },
  { t = "p", text = "II. Man, in his state of innocency, had freedom and power to will and to do that which is good and well-pleasing to God, but yet mutably, so that he might fall from it.[^1263]" },
  { t = "note", id = "1263", text = "Gen. ii. 16, 17; iii. 6." },
  { t = "p", text = "III. Man, by his fall into a state of sin, hath wholly lost all ability of will to any spiritual good accompanying salvation;[^1266] so as a natural man, being altogether averse from that good,[^1267] and dead in sin,[^1268] is not able, by his own strength, to convert himself, or to prepare himself thereunto.[^1269]" },
  { t = "note", id = "1266", text = "Rom. v. 6; viii. 7; John xv. 5." },
  { t = "note", id = "1267", text = "Rom. iii. 10, 12." },
  { t = "note", id = "1268", text = "Eph. ii. 1, 5; Col. ii. 13." },
  { t = "note", id = "1269", text = "John vi. 44, 65; 1 Cor. ii. 14; Eph. ii. 2–5; Titus iii. 3–5." },
  { t = "p", text = "IV. When God converts a sinner, and translates him into the state of grace, he freeth him from his natural bondage under sin,[^1274] and by his grace alone enables him freely to will and to do that which is spiritually good;[^1275] yet so as that, by reason of his remaining corruption, he doth not perfectly, nor only, will that which is good, but doth also will that which is evil.[^1278]" },
  { t = "note", id = "1274", text = "Col. i. 13; John viii. 34, 36." },
  { t = "note", id = "1275", text = "Phil. ii. 13; Rom. vi. 18, 22." },
  { t = "note", id = "1278", text = "Gal. v. 17; Rom. vii. 15, 18, 19, 21, 23." },
  { t = "p", text = "V. The will of man is made perfectly and immutably free to good alone, in the state of glory only.[^1280]" },
  { t = "note", id = "1280", text = "Eph. iv. 13; Heb. xii. 23; 1 John iii. 2; Jude 24." },
]

[[section]]
id = "chapter-x-of-effectual-calling"
title = "Chapter X. Of Effectual Calling"
level = 1
blocks = [
  { t = "p", text = "I. All those whom God hath predestinated unto life, and those only, he is pleased, in his appointed and accepted time, effectually to call,[^1282] by his Word and Spirit,[^1283] out of that state of sin and death, in which they are by nature, to grace and salvation by Jesus Christ;[^1284] enlightening their minds, spiritually and savingly, to understand the things of God;[^1285] taking away their heart of stone, and giving unto them an heart of flesh;[^1286] renewing their wills, and by his almighty power determining them to that which is good,[^1287] and effectually drawing them to Jesus Christ;[^1288] yet so as they come most freely, being made willing by his grace.[^1289]" },
  { t = "note", id = "1282", text = "Rom. viii. 30; xi. 7; Eph. i. 10, 11." },
  { t = "note", id = "1283", text = "2 Thess. ii. 13, 14; 2 Cor. iii. 3, 6." },
  { t = "note", id = "1284", text = "Rom. viii. 2; Eph. ii. 1–5; 2 Tim. i. 9, 10." },
  { t = "note", id = "1285", text = "Acts xxvi. 18; 1 Cor. ii. 10, 12; Eph. i. 17, 18." },
  { t = "note", id = "1286", text = "Ezek. xxxvi. 26." },
  { t = "note", id = "1287", text = "Ezek. xi. 19; Phil. ii. 13; Deut. xxx. 6; Ezek. xxxvi. 27." },
  { t = "note", id = "1288", text = "Eph. i. 19; John vi. 44, 45." },
  { t = "note", id = "1289", text = "Cant. i. 4; Psa. cx. 3; John vi. 37; Rom. vi. 16–18." },
  { t = "p", text = "II. This effectual call is of God's free and special grace alone, not from any thing at all foreseen in man;[^1298] who is altogether passive therein, until, being quickened and renewed by the Holy Spirit,[^1299] he is thereby enabled to answer this call, and to embrace the grace offered and conveyed in it.[^1300]" },
  { t = "note", id = "1298", text = "2 Tim. i. 9; Titus iii. 4, 5; Eph. ii. 4, 5, 8, 9; Rom. ix. 11." },
  { t = "note", id = "1299", text = "1 Cor. ii. 14; Rom. viii. 7; Eph. ii. 5." },
  { t = "note", id = "1300", text = "John vi. 37; Ezek. xxxvi. 27; John v. 25." },
  { t = "p", text = "III. Elect infants, dying in infancy, are regenerated and saved by Christ through the Spirit,[^1304] who worketh when, and where, and how he pleaseth.[^1305] So also are all other elect persons, who are incapable of being outwardly called by the ministry of the Word.[^1306]" },
  { t = "note", id = "1304", text = "Luke xviii. 15, 16 and Acts ii. 38, 39, and John iii. 3, 5, and 1 John v. 12, and Rom. viii. 9, compared." },
  { t = "note", id = "1305", text = "John iii. 8." },
  { t = "note", id = "1306", text = "1 John v. 12; Acts iv. 12." },
  { t = "p", text = "IV. Others, not elected, although they may be called by the ministry of the Word,[^1310] and may have some common operations of the Spirit,[^1311] yet they never truly come unto[^1312] Christ, and therefore can not be saved:[^1313] much less can men, not professing the Christian religion, be saved in any other way whatsoever, be they never so diligent to frame their lives according to the light of nature and the law of that religion they do profess;[^1314] and to assert and maintain that they may is very pernicious, and to be detested.[^1319]" },
  { t = "note", id = "1310", text = "Matt. xxii. 14." },
  { t = "note", id = "1311", text = "Matt. vii. 22; xiii. 20, 21; Heb. vi. 4, 5." },
  { t = "note", id = "1312", text = "[Am. ed. *to.*]" },
  { t = "note", id = "1313", text = "John vi. 64–66; viii. 24." },
  { t = "note", id = "1314", text = "Acts iv. 12; John xiv. 6; Eph. ii. 12; John iv. 22; xvii. 3." },
  { t = "note", id = "1319", text = "2 John 9–11; 1 Cor. xvi. 22; Gal. i. 6–8." },
]

[[section]]
id = "chapter-xi-of-justification"
title = "Chapter XI. Of Justification"
level = 1
blocks = [
  { t = "p", text = "I. Those whom God effectually calleth he also freely justifieth;[^1321] not by infusing righteousness into them, but by pardoning their sins, and by accounting and accepting their persons as righteous: not for any thing wrought in them, or done by them, but for Christ's sake alone; nor[^1322] by imputing faith itself, the act of believing, or any other evangelical obedience to them, as their righteousness; but by imputing the obedience and satisfaction of Christ unto them,[^1323] they receiving and resting on him and his righteousness by faith; which faith they have not of themselves, it is the gift of God.[^1324]" },
  { t = "note", id = "1321", text = "Rom. viii. 30; iii. 24." },
  { t = "note", id = "1322", text = "[Am. ed. *not.*]" },
  { t = "note", id = "1323", text = "Rom. iv. 5–8; 2 Cor. v. 19, 21; Rom. iii. 22, 24, 25, 27, 28; Titus iii. 5, 7; Eph. i. 7; Jer. xxiii. 6; 1 Cor. i. 30, 31; Rom. v. 17–19." },
  { t = "note", id = "1324", text = "Acts x. 44; Gal. ii. 16; Phil. iii. 9; Acts xiii. 38, 39; Eph. ii. 7, 8." },
  { t = "p", text = "II. Faith, thus receiving and resting on Christ and his righteousness, is the alone instrument of justification;[^1328] yet is it not alone in the person justified, but is ever accompanied with all other saving graces, and is no dead faith, but worketh by love.[^1329]" },
  { t = "note", id = "1328", text = "John i. 12; Rom. iii. 28; v. 1." },
  { t = "note", id = "1329", text = "James ii. 17, 22, 26; Gal. v. 6." },
  { t = "p", text = "III. Christ, by his obedience and death, did fully discharge the debt of all those that are thus justified, and did make a proper, real, and full satisfaction to his Father's justice in their behalf.[^1332] Yet inasmuch as he was given by the Father for them,[^1333] and his obedience and satisfaction accepted in their stead,[^1334] and both freely, not for any thing in them, their justification is only of free grace;[^1335] that both the exact justice and rich grace of God might be glorified in the justification of sinners.[^1336]" },
  { t = "note", id = "1332", text = "Rom. v. 8–10, 19; 1 Tim. ii. 5, 6; Heb. x. 10, 14; Dan. ix. 24, 26; Isa. liii. 4–6, 10–12." },
  { t = "note", id = "1333", text = "Rom. viii. 32." },
  { t = "note", id = "1334", text = "2 Cor. v. 21; Matt. iii. 17; Eph. v. 2." },
  { t = "note", id = "1335", text = "Rom. iii. 24; Eph. i. 7." },
  { t = "note", id = "1336", text = "Rom. iii. 26; Eph. ii. 7." },
  { t = "p", text = "IV. God did, from all eternity, decree to justify all the elect,[^1342] and Christ did, in the fullness of time, die for their sins, and rise again for their justification:[^1343] nevertheless, they are not justified until the Holy Spirit doth, in due time, actually apply Christ unto them.[^1344]" },
  { t = "note", id = "1342", text = "Gal. iii. 8; 1 Pet. i. 2, 19, 20; Rom. viii. 30." },
  { t = "note", id = "1343", text = "Gal. iv. 4; 1 Tim. ii. 6; Rom. iv. 25." },
  { t = "note", id = "1344", text = "Col. i. 21, 22; Gal. ii. 16; Titus iii. 4–7." },
  { t = "p", text = "V. God doth continue to forgive the sins of those that are justified;[^1348] and although they can never fall from the state of justification,[^1349] yet they may by their sins fall under God's fatherly displeasure, and not have the light of his countenance restored unto them, until they humble themselves, confess their sins, beg pardon, and renew their faith and repentance.[^1352]" },
  { t = "note", id = "1348", text = "Matt. vi. 12; 1 John i. 7, 9; ii. 1, 2." },
  { t = "note", id = "1349", text = "Luke xxii. 32; John x. 28; Heb. x. 14." },
  { t = "note", id = "1352", text = "Psa. lxxxix. 31–33; li. 7–12; xxxii. 5; Matt. xxvi. 75; 1 Cor. xi. 30, 32; Luke i. 20." },
  { t = "p", text = "VI. The justification of believers under the Old Testament was, in all these respects, one and the same with the justification of believers under the New Testament.[^1354]" },
  { t = "note", id = "1354", text = "Gal. iii. 9, 13, 14; Rom. iv. 22–24; Heb.xiii. 8." },
]

[[section]]
id = "chapter-xii-of-adoption"
title = "Chapter XII. Of Adoption"
level = 1
blocks = [
  { t = "p", text = "All those that are justified God vouchsafeth, in and for his only Son Jesus Christ, to make partakers of the grace of adoption;[^1357] by which they are taken into the number, and enjoy the liberties and privileges of the children of God;[^1358] have his name put upon them;[^1359] receive the Spirit of adoption;[^1360] have access to the throne of grace with boldness;[^1361] are enabled to cry, Abba, Father;[^1362] are pitied,[^1363] protected,[^1364] provided for,[^1365] and chastened by him as by a father;[^1366] yet never cast off,[^1367] but sealed to the day of redemption,[^1368] and inherit the promises,[^1369] as heirs of everlasting salvation.[^1370]" },
  { t = "note", id = "1357", text = "Eph. i. 5; Gal. iv. 4, 5." },
  { t = "note", id = "1358", text = "Rom. viii. 17; John i. 12." },
  { t = "note", id = "1359", text = "Jer. xiv. 9; 2 Cor. vi. 18; Rev. iii. 12." },
  { t = "note", id = "1360", text = "Rom. viii. 15." },
  { t = "note", id = "1361", text = "Eph. iii. 12; Rom. v. 2." },
  { t = "note", id = "1362", text = "Gal. iv. 6." },
  { t = "note", id = "1363", text = "Psa. ciii. 13." },
  { t = "note", id = "1364", text = "Prov. xiv. 26." },
  { t = "note", id = "1365", text = "Matt. vi. 30, 32; 1 Pet. v. 7." },
  { t = "note", id = "1366", text = "Heb. xii. 6." },
  { t = "note", id = "1367", text = "Lam. iii. 31." },
  { t = "note", id = "1368", text = "Eph. iv. 30." },
  { t = "note", id = "1369", text = "Heb. vi. 12." },
  { t = "note", id = "1370", text = "l Pet. i. 3, 4; Heb. i. 14." },
]

[[section]]
id = "chapter-xiii-of-sanctification"
title = "Chapter XIII. Of Sanctification"
level = 1
blocks = [
  { t = "p", text = "I. They who are effectually called and regenerated, having a new heart and a new spirit created in them, are further sanctified, really and personally, through the virtue of Christ's death and resurrection,[^1385] by his Word and Spirit dwelling in them;[^1386] the dominion of the whole body of sin is destroyed,[^1387] and the several lusts thereof are more and more weakened and mortified,[^1388]and they more and more quickened and strengthened, in all saving graces,[^1389] to the practice of true holiness, without which no man shall see the Lord.[^1390]" },
  { t = "note", id = "1385", text = "1 Cor. vi. 11; Acts xx. 32; Phil. iii. 10; Rom. vi. 5, 6." },
  { t = "note", id = "1386", text = "John xvii. 17; Eph. v. 26; 2 Thess. ii. 13." },
  { t = "note", id = "1387", text = "Rom. vi. 6, 14." },
  { t = "note", id = "1388", text = "Gal. v. 24; Rom. viii. 13." },
  { t = "note", id = "1389", text = "Col. i. 11; Eph. iii. 16–19." },
  { t = "note", id = "1390", text = "2 Cor. vii. 1; Heb. xii. 14." },
  { t = "p", text = "II. This sanctification is throughout in the whole man,[^1397] yet imperfect in this life; there abideth still some remnants of corruption in every part,[^1398] whence ariseth a continual and irreconcilable war, the flesh lusting against the spirit, and the spirit against the flesh.[^1399]" },
  { t = "note", id = "1397", text = "1 Thess. v. 23." },
  { t = "note", id = "1398", text = "1 John i. 10; Rom. vii. 18, 23; Phil. iii. 12." },
  { t = "note", id = "1399", text = "Gal. v. 17; 1 Pet. ii. 11." },
  { t = "p", text = "III. In which war, although the remaining corruption for a time may much prevail,[^1403] yet, through the continual supply of strength from the sanctifying Spirit of Christ, the regenerate part doth overcome;[^1405] and so the saints grow in grace,[^1406] perfecting holiness in the fear of God.[^1407]" },
  { t = "note", id = "1403", text = "Rom. vii. 23." },
  { t = "note", id = "1405", text = "Rom. vi. 14; 1 John v. 4; Eph. iv. 15, 16." },
  { t = "note", id = "1406", text = "2 Pet. iii. 18; 2 Cor. iii. 18." },
  { t = "note", id = "1407", text = "2 Cor. vii. 1." },
]

[[section]]
id = "chapter-xiv-of-saving-faith"
title = "Chapter XIV. Of Saving Faith"
level = 1
blocks = [
  { t = "p", text = "I. The grace of faith, whereby the elect are enabled to believe to the saving of their souls,[^1411] is the work of the Spirit of Christ in their hearts,[^1412] and is ordinarily wrought by the ministry of the Word;[^1413] by which also, and by the administration of the sacraments and prayer, it is increased and strengthened.[^1414]" },
  { t = "note", id = "1411", text = "Heb. x. 39." },
  { t = "note", id = "1412", text = "2 Cor. iv. 13; Eph. i. 17–19; ii. 8." },
  { t = "note", id = "1413", text = "Rom. x. 14, 17." },
  { t = "note", id = "1414", text = "1 Pet. ii. 2; Acts xx. 32; Rom. iv. 11; Luke xvii. 5; Rom. i. 16, 17." },
  { t = "p", text = "II. By this faith a Christian believeth to be true whatsoever is revealed in the Word, for the authority of God himself speaking therein;[^1419] and acteth differently upon that which each particular passage thereof containeth; yielding obedience to the commands,[^1420] trembling at the threatenings,[^1421] and embracing the promises of God for this life and that which is to come.[^1422] But the principal acts of saving faith are accepting, receiving, and resting upon Christ alone for justification, sanctification, and eternal life, by virtue of the covenant of grace.[^1427]" },
  { t = "note", id = "1419", text = "John iv. 42; 1 Thess. ii. 13; 1 John v. 10; Acts xxiv. 14." },
  { t = "note", id = "1420", text = "Rom. xvi. 26." },
  { t = "note", id = "1421", text = "Isa. lxvi. 2." },
  { t = "note", id = "1422", text = "Heb. xi. 13; 1 Tim. iv. 8." },
  { t = "note", id = "1427", text = "John i. 12; Acts xvi. 31; Gal. ii. 20; Acts xv. 11." },
  { t = "p", text = "III. This faith is different in degrees, weak or strong;[^1429] may be often and many ways assailed and weakened, but gets the victory;[^1430] growing up in many to the attainment of a full assurance through Christ,[^1431] who is both the author and finisher of our faith.[^1432]" },
  { t = "note", id = "1429", text = "Heb. v. 13, 14; Rom. iv. 19, 20; Matt. vi. 30; viii. 10." },
  { t = "note", id = "1430", text = "Luke xxii. 31, 32; Eph. vi. 16; 1 John v. 4, 5." },
  { t = "note", id = "1431", text = "Heb. vi. 11, 12; x. 22; Col. ii. 2." },
  { t = "note", id = "1432", text = "Heb. xii. 2." },
]

[[section]]
id = "chapter-xv-of-repentance-unto-life"
title = "Chapter XV. Of Repentance unto Life"
level = 1
blocks = [
  { t = "p", text = "I. Repentance unto life is an evangelical grace,[^1437] the doctrine whereof is to be preached by every minister of the gospel, as well as that of faith in Christ.[^1438]" },
  { t = "note", id = "1437", text = "Zech. xii. 10; Acts xi. 18." },
  { t = "note", id = "1438", text = "Luke xxiv. 47; Mark i. 15; Acts xx. 21." },
  { t = "p", text = "II. By it a sinner, out of the sight and sense, not only of the danger, but also of the filthiness and odiousness of his sins, as contrary to the holy nature and righteous law of God, and upon the apprehension of his mercy in Christ to such as are penitent, so grieves for and hates his sins as to turn from them all unto God,[^1440] purposing and endeavoring to walk with him in all the ways of his commandments.[^1443]" },
  { t = "note", id = "1440", text = "Ezek. xviii. 30, 31; xxxvi. 31; Isa. xxx. 22; Psa. li. 4; Jer. xxxi. 18, 19; Joel ii. 12, 13; Amos v. 15; Psa. cxix. 128; 2 Cor. vii. 11." },
  { t = "note", id = "1443", text = "Psa. cxix. 6, 59, 106; Luke i. 6; 2 Kings xxiii. 25." },
  { t = "p", text = "III. Although repentance be not to be rested in as any satisfaction for sin, or any cause of the pardon thereof,[^1445] which is the act of God's free grace in Christ;[^1446] yet is it of such necessity to all sinners that none may expect pardon without it.[^1447]" },
  { t = "note", id = "1445", text = "Ezek. xxxvi. 31, 32; xvi. 61–63." },
  { t = "note", id = "1446", text = "Hos. xiv. 2, 4; Rom. iii. 24; Eph. i. 7." },
  { t = "note", id = "1447", text = "Luke xiii. 3, 5; Acts xvii. 30, 31." },
  { t = "p", text = "IV. As there is no sin so small but it deserves damnation,[^1451] so there is no sin so great that it can bring damnation upon those who truly repent.[^1452]" },
  { t = "note", id = "1451", text = "Rom. vi. 23; v. 12; Matt. xii. 36." },
  { t = "note", id = "1452", text = "Isa. lv. 7; Rom. viii. 1; Isa. i. 16, 18." },
  { t = "p", text = "V. Men ought not to content themselves with a general repentance, but it is every man's duty to endeavor to repent of his particular sins particularly.[^1455]" },
  { t = "note", id = "1455", text = "Psa. xix. 13; Luke xix. 8; 1 Tim. i. 13, 15." },
  { t = "p", text = "VI. As every man is bound to make private confession of his sins to God, praying for the pardon thereof,[^1457] upon which, and the forsaking of them, he shall find mercy;[^1458] so he that scandalizeth his brother, or the Church of Christ, ought to be willing, by a private or public confession and sorrow for his sin, to declare his repentance to those that are offended,[^1461] who are thereupon to be reconciled to him, and in love to receive him.[^1462]" },
  { t = "note", id = "1457", text = "Psa. li. 4, 5, 7, 9, 14; xxxii. 5, 6." },
  { t = "note", id = "1458", text = "Prov. xxviii. 13; 1 John i. 9." },
  { t = "note", id = "1461", text = "James v. 16; Luke xvii. 3, 4; Josh. vii. 19; Psa. li. throughout." },
  { t = "note", id = "1462", text = "2 Cor. ii. 8; [Amer. ed. Gal. vi. 1, 2]." },
]

[[section]]
id = "chapter-xvi-of-good-works"
title = "Chapter XVI. Of Good Works"
level = 1
blocks = [
  { t = "p", text = "I. Good works are only such as God hath commanded in his holy Word,[^1465] and not such as, without the warrant thereof, are devised by men out of blind zeal, or upon any pretense of good intention.[^1466]" },
  { t = "note", id = "1465", text = "Micah vi. 8; Rom. xii. 2; Heb. xiii. 21." },
  { t = "note", id = "1466", text = "Matt. xv. 9; Isa. xxix. 13; 1 Pet. i. 18; Rom. x. 2; John xvi. 2; 1 Sam. xv. 21–23." },
  { t = "p", text = "II. These good works, done in obedience to God's commandments, are the fruits and evidences of a true and lively faith;[^1469] and by them believers manifest their thankfulness,[^1470] strengthen their assurance,[^1471] edify their brethren,[^1472] adorn the profession of the gospel,[^1473] stop the mouths of the adversaries,[^1474] and glorify God,[^1475] whose workmanship they are, created in Christ Jesus thereunto,[^1476] that, having their fruit unto holiness, they may have the end, eternal life.[^1477]" },
  { t = "note", id = "1469", text = "James ii. 18, 22." },
  { t = "note", id = "1470", text = "Psa. cxvi. 12, 13; 1 Pet. ii. 9." },
  { t = "note", id = "1471", text = "1 John ii. 3, 5; 2 Pet i. 5–10." },
  { t = "note", id = "1472", text = "2 Cor. ix. 2; Matt. v. 16." },
  { t = "note", id = "1473", text = "Tit. ii. 5, 9–12; 1 Tim. vi. 1." },
  { t = "note", id = "1474", text = "1 Pet. ii. 15." },
  { t = "note", id = "1475", text = "1 Pet. ii. 12; Phil. i. 11; John xv. 8." },
  { t = "note", id = "1476", text = "Eph. ii. 10." },
  { t = "note", id = "1477", text = "Rom. vi. 22." },
  { t = "p", text = "III. Their ability to do good works is not at all of themselves, but wholly from the Spirit of Christ.[^1487] And that they may be enabled thereunto, besides the graces they have already received, there is required an actual influence of the same Holy Spirit to work in them to will and to do of his good pleasure;[^1488] yet are they not hereupon to grow negligent, as if they were not bound to perform any duty unless upon a special motion of the Spirit; but they ought to be diligent in stirring up the grace of God that is in them.[^1489]" },
  { t = "note", id = "1487", text = "John xv. 4–6; Ezek. xxxvi. 26, 27." },
  { t = "note", id = "1488", text = "Phil. ii. 13; iv. 13; 2 Cor. iii. 5." },
  { t = "note", id = "1489", text = "Phil. ii. 12; Heb. vi. 11, 12; 2 Pet. i. 3, 5, 10, 11; Isa. lxiv. 7; 2 Tim. i. 6; Acts xxvi. 6, 7; Jude 20, 21." },
  { t = "p", text = "IV. They who in their obedience attain to the greatest height which is possible in this life, are so far from being able to supererogate and to do more than God requires, as[^1493] that they fall short of much which in duty they are bound to do.[^1494]" },
  { t = "note", id = "1493", text = "[Amer. ed. omits *as.*]" },
  { t = "note", id = "1494", text = "Luke xvii. 10; Neh. xiii. 22; Job ix. 2, 3; Gal. v. 17." },
  { t = "p", text = "V. We can not, by our best works, merit pardon of sin, or eternal life at the hand of God, by reason of the great disproportion that is between them and the glory to come, and the infinite distance that is between us and God, whom by them we can neither profit nor satisfy for the debt of our former sins;[^1496] but when we have done all we can, we have done but our duty, and are unprofitable servants;[^1497] and because, as they are good, they proceed from his Spirit;[^1498] and as they are wrought by us, they are defiled and mixed with so much weakness and imperfection that they can not endure the severity of God's judgment.[^1499]" },
  { t = "note", id = "1496", text = "Rom. iii. 20; iv. 2, 4, 6; Eph. ii. 8, 9; Titus iii. 5–7; Rom. viii. 18; Psa. xvi. 2; Job xxii. 2, 3; xxxv. 7, 8." },
  { t = "note", id = "1497", text = "Luke xvii. 10." },
  { t = "note", id = "1498", text = "Gal. v. 22, 23." },
  { t = "note", id = "1499", text = "Isa. lxiv. 6; Gal. v. 17; Rom. vii. 15, 18; Psa. cxliii. 2; cxxx. 3." },
  { t = "p", text = "VI. Yet notwithstanding, the persons of believers being accepted through Christ, their good works also are accepted in him,[^1504] not as though they were in this life wholly unblamable and unreprovable in God's sight;[^1505] but that he, looking upon them in his Son, is pleased to accept and reward that which is sincere, although accompanied with many weaknesses and imperfections.[^1506]" },
  { t = "note", id = "1504", text = "Eph. i. 6; 1 Pet. ii. 5; Exod. xxviii. 38; Gen. iv. 4 with Heb. xi. 4." },
  { t = "note", id = "1505", text = "Job ix. 20; Psa. cxliii. 2." },
  { t = "note", id = "1506", text = "Heb. xiii. 20, 21; 2 Cor. viii. 12; Heb. vi. 10; Matt. xxv. 21, 23." },
  { t = "p", text = "VII. Works done by unregenerate men, although for the matter of them they may be things which God commands, and of good use both to themselves and others;[^1510] yet because they proceed not from a heart purified by faith,[^1512] nor are done in a right manner, according to the Word,[^1513] nor to a right end, the glory of God;[^1514] they are therefore sinful, and can not please God, or make a man meet to receive grace from God.[^1515] And yet their neglect of them is more sinful and displeasing unto God.[^1516]" },
  { t = "note", id = "1510", text = "2 Kings x. 30, 31; 1 Kings xxi. 27, 29; Phil. i. 15, 16, 18." },
  { t = "note", id = "1512", text = "Gen. iv. 3–5 with Heb. xi. 4, 6." },
  { t = "note", id = "1513", text = "1 Cor. xiii. 3; Isa. i. 12." },
  { t = "note", id = "1514", text = "Matt. vi. 2, 5, 16." },
  { t = "note", id = "1515", text = "Hag. ii. 14; Titus i. 15; Amos v. 21, 22; Hos. i. 4; Rom. ix. 16; Titus iii. 5." },
  { t = "note", id = "1516", text = "Psa. xiv. 4; xxxvi. 3; Job xxi. 14, 15; Matt. xxv. 41–45; xxiii. 23." },
]

[[section]]
id = "chapter-xvii-of-the-perseverance-of-the-saints"
title = "Chapter XVII. Of the Perseverance of the Saints"
level = 1
blocks = [
  { t = "p", text = "I. They whom God hath accepted in his Beloved, effectually called and sanctified by his Spirit, can neither totally nor finally fall away from the state of grace; but shall certainly persevere therein to the end, and be eternally saved.[^1522]" },
  { t = "note", id = "1522", text = "Phil. i. 6; 2 Pet. i. 10; John x. 28, 29; 1 John iii. 9; 1 Pet. i. 5, 9; [Am. ed. Job xvii. 9]." },
  { t = "p", text = "II. This perseverance of the saints depends, not upon their own freewill, but upon the immutability of the decree of election, flowing from the free and unchangeable love of God the Father;[^1524] upon the efficacy of the merit and intercession of Jesus Christ;[^1525] the abiding of the Spirit and of the seed of God within them;[^1529] and the nature of the covenant of grace:[^1530] from all which ariseth also the certainty and infallibility thereof.[^1531]" },
  { t = "note", id = "1524", text = "2 Tim. ii. 18, 19; Jer. xxxi. 3." },
  { t = "note", id = "1525", text = "Heb. x. 10, 14; xiii. 20, 21; ix. 12–15; Rom. viii. 33, to the end; John xvii. 11, 24; Luke xxii. 32; Heb. vii. 25." },
  { t = "note", id = "1529", text = "John xiv. 16, 17; 1 John ii. 27; iii. 9." },
  { t = "note", id = "1530", text = "Jer. xxxii. 40; [Am. ed. Heb. viii. 10–12]." },
  { t = "note", id = "1531", text = "John x. 28; 2 Thess. iii. 3; 1 John ii. 19; [Am. ed. 1 Thess. v. 23, 24]." },
  { t = "p", text = "III. Nevertheless they may, through the temptations of Satan and of the world, the prevalency of corruption remaining in them, and the neglect of the means of their preservation, fall into grievous sins;[^1534] and for a time continue therein:[^1535] whereby they incur God's displeasure,[^1536] and grieve his Holy Spirit;[^1537] come to be deprived of some measure of their graces and comforts;[^1538] have their hearts hardened,[^1539] and their consciences wounded;[^1540] hurt and scandalize others,[^1541] and bring temporal judgments upon themselves.[^1542]" },
  { t = "note", id = "1534", text = "Matt. xxvi. 70, 72, 74." },
  { t = "note", id = "1535", text = "Psa. li. title and verse 14; [Am. ed. 2 Sam. xii. 9, 13]." },
  { t = "note", id = "1536", text = "Isa. lxiv. 5, 7, 9; 2 Sam. xi. 27." },
  { t = "note", id = "1537", text = "Eph. iv. 30." },
  { t = "note", id = "1538", text = "Psa. li. 8, 10, 12; Rev. ii. 4; Cant. v. 2, 3, 4, 6." },
  { t = "note", id = "1539", text = "Isa. xxxvi. 17; Mark vi. 52; xvi. 14; [Am. ed. Psa. xcv. 8]." },
  { t = "note", id = "1540", text = "Psa. xxxii. 3, 4; li. 8." },
  { t = "note", id = "1541", text = "2 Sam. xii. 14." },
  { t = "note", id = "1542", text = "Psa. lxxxix. 31, 32; 1 Cor. xi. 32." },
]

[[section]]
id = "chapter-xviii-of-the-assurance-of-grace-and-salvation"
title = "Chapter XVIII. Of the Assurance of Grace and Salvation"
level = 1
blocks = [
  { t = "p", text = "I. Although hypocrites and other unregenerate men may vainly deceive themselves with false hopes and carnal presumptions of being in the favor of God and estate of salvation,[^1552] which hope of theirs shall perish:[^1554] yet such as truly believe in the Lord Jesus, and love him in sincerity, endeavoring to walk in all good conscience before him, may in this life be certainly assured that they are in a state of grace,[^1555] and may rejoice in the hope of the glory of God, which hope shall never make them ashamed.[^1556]" },
  { t = "note", id = "1552", text = "Job viii. 13, 14; Micah iii. 11; Deut. xxix. 19; John viii. 41." },
  { t = "note", id = "1554", text = "Matt. vii. 22, 23; [Am. ed. Job viii. 13]." },
  { t = "note", id = "1555", text = "1 John ii. 3; iii. 14, 18, 19, 21, 24; v. 13." },
  { t = "note", id = "1556", text = "Rom. v. 2, 5." },
  { t = "p", text = "II. This certainty is not a bare conjectural and probable persuasion, grounded upon a fallible hope;[^1560] but an infallible assurance of faith, founded upon the divine truth of the promises of salvation,[^1561] the inward evidence of those graces unto which these promises are made,[^1562] the testimony of the Spirit of adoption witnessing with our spirits that we are the children of God:[^1563] which Spirit is the earnest of our inheritance, whereby we are sealed to the day of redemption.[^1564]" },
  { t = "note", id = "1560", text = "Heb. vi. 11, 19." },
  { t = "note", id = "1561", text = "Heb. vi. 17, 18." },
  { t = "note", id = "1562", text = "2 Pet. i. 4, 5, 10, 11; 1 John ii. 3; iii. 14; 2 Cor. i. 12." },
  { t = "note", id = "1563", text = "Rom. viii. 15, 16." },
  { t = "note", id = "1564", text = "Eph. i. 13, 14; iv. 30; 2 Cor. i. 21, 22." },
  { t = "p", text = "III. This infallible assurance doth not so belong to the essence of faith, but that a true believer may wait long, and conflict with many difficulties before he be partaker of it:[^1570] yet, being enabled by the Spirit to know the things which are freely given him of God, he may, without extraordinary revelation, in the right use of ordinary means, attain thereunto.[^1572] And therefore it is the duty of every one to give all diligence to make his calling and election sure;[^1573] that thereby his heart may be enlarged in peace and joy in the Holy Ghost, in love and thankfulness to God, and in strength and cheerfulness in the duties of obedience, the proper fruits of this assurance:[^1574] so far is it from inclining men to looseness.[^1575]" },
  { t = "note", id = "1570", text = "1 John v. 13; Isa. l. 10; Mark ix. 24; Psa. lxxxviii. throughout; lxxvii. to ver. 12." },
  { t = "note", id = "1572", text = "1 Cor. ii. 12; 1 John iv. 13; Heb. vi. 11, 12; Eph. iii. 17–19." },
  { t = "note", id = "1573", text = "2 Pet. i. 10." },
  { t = "note", id = "1574", text = "Rom. v. 1, 2, 5; Rom. xiv. 17; xv. 13; Eph. i. 3, 4; Psa. iv. 6, 7; cxix. 32." },
  { t = "note", id = "1575", text = "1 John ii. 1, 2; Rom. vi. 1, 2; Titus ii. 11, 12, 14; 2 Cor. vii. 1; Rom. viii. 1, 12; 1 John iii. 2, 3; Psa. cxxx. 4; 1 John i. 6, 7." },
  { t = "p", text = "IV. True believers may have the assurance of their salvation divers ways shaken, diminished, and intermitted; as, by negligence in preserving of it; by falling into some special sin, which woundeth, the conscience, and grieveth the Spirit; by some sudden or vehement temptation; by God's withdrawing the light of his countenance, and suffering even such as fear him to walk in darkness and to have no light:[^1580] yet are they never utterly destitute of that seed of God, and life of faith, that love of Christ and the brethren, that sincerity of heart and conscience of duty, out of which, by the operation of the Spirit, this assurance may in due time be revived,[^1582] and by the which, in the mean time, they are supported from utter despair.[^1583]" },
  { t = "note", id = "1580", text = "Cant. v. 2, 3, 6; Psa. li. 8, 12, 14; Eph. iv. 30, 31; Psa. lxxvii. 1–10; Matt. xxvi. 69–72; Psa. xxxi. 22; lxxxviii. throughout; Isa. l. 10." },
  { t = "note", id = "1582", text = "1 John iii. 9; Luke xxii. 32; Job xiii. 15; Psa. lxxiii. 15; li. 8, 12; Isa. 1. 10." },
  { t = "note", id = "1583", text = "Micah vii. 7–9; Jer. lii. 40; Isa. liv. 7–10; Psa. xxii. 1; lxxxviii. throughout." },
]

[[section]]
id = "chapter-xix-of-the-law-of-god"
title = "Chapter XIX. Of the Law of God"
level = 1
blocks = [
  { t = "p", text = "I. God gave to Adam a law, as a covenant of works, by which he bound him and all his posterity to personal, entire, exact, and perpetual obedience; promised life upon the fulfilling, and threatened death upon the breach of it; and endued him with power and ability to keep it.[^1586]" },
  { t = "note", id = "1586", text = "Gen. i. 26, 27, with Gen. ii. 17; Rom. ii. 14, 15; x. 5; v. 12, 19; Gal. iii. 10, 12; Eccles. vii. 29; Job xxviii. 28." },
  { t = "p", text = "II. This law, after his fall, continued to be a perfect rule of righteousness; and, as such, was delivered by God upon mount Sinai in ten commandments, and written in two tables;[^1588] the first four commandments containing our duty towards God, and the other six our duty to man.[^1589]" },
  { t = "note", id = "1588", text = "James i. 25; ii. 8, 10–12; Rom. xiii. 8, 9; Deut. v. 32; x. 4; Exod. xxxiv. 1; [Am. ed. Rom. iii. 19]." },
  { t = "note", id = "1589", text = "Matt. xxii. 37–40; [Am. ed. Exod. xx. 3–18]." },
  { t = "p", text = "III. Beside this law, commonly called moral, God was pleased to give to the people of Israel, as a Church under age, ceremonial laws, containing several typical ordinances, partly of worship, prefiguring Christ, his graces, actions, sufferings, and benefits;[^1592] and partly holding forth divers instructions of moral duties.[^1593] All which ceremonial laws are now abrogated under the New Testament.[^1594]" },
  { t = "note", id = "1592", text = "Heb. ix.; x. 1; Gal. iv. 1–3; Col. ii. 17." },
  { t = "note", id = "1593", text = "1 Cor. v. 7; 2 Cor. vi. 17; Jude 23." },
  { t = "note", id = "1594", text = "Col. ii. 14, 16, 17; Dan. ix. 27; Eph. ii. 15, 16." },
  { t = "p", text = "IV. To them also, as a body politic, he gave sundry judicial laws, which expired together with the state of that people, not obliging any other, now, further than the general equity thereof may require.[^1598]" },
  { t = "note", id = "1598", text = "Exod. xxi.; xxii. 1–29; Gen. xlix. 10, with 1 Pet. ii. 13, 14; Matt. v. 17, with vers. 38, 39; 1 Cor. ix. 8–10." },
  { t = "p", text = "V. The moral law doth forever bind all, as well justified persons as others, to the obedience thereof;[^1600] and that not only in regard of the matter contained in it, but also in respect of the authority of God the Creator who gave it.[^1601] Neither doth Christ in the gospel any way dissolve, but much strengthen, this obligation.[^1602]" },
  { t = "note", id = "1600", text = "Rom. xiii. 8–10; Eph. vi. 2; 1 John ii. 3, 4, 7, 8; [Am. ed. Rom. iii. 31, and vi. 15]." },
  { t = "note", id = "1601", text = "James ii. 10, 11." },
  { t = "note", id = "1602", text = "Matt. v. 17–19; James ii. 8; Rom. iii. 31." },
  { t = "p", text = "VI. Although true believers be not under the law as a covenant of works, to be thereby justified or condemned;[^1606] yet is it of great use to them, as well as to others; in that, as a rule of life, informing them of the will of God and their duty, it directs and binds them to walk accordingly;[^1608] discovering also the sinful pollutions of their nature, hearts, and lives;[^1609] so as, examining themselves thereby, they may come to further conviction of, humiliation for, and hatred against sin;[^1610] together with a clearer sight of the need they have of Christ, and the perfection of his obedience.[^1611] It is likewise of use to the regenerate, to restrain their corruptions, in that it forbids sin;[^1612] and the threatenings of it serve to show what even their sins deserve, and what afflictions in this life they may expect for them, although freed from the curse thereof threatened in the law.[^1613] The promises of it, in like manner, show them God's approbation of obedience, and what blessings they may expect upon the performance thereof;[^1614] although not as due to them by the law as a covenant of words:[^1615] so as a man's doing good, and refraining from evil, because the law encourageth to the one, and deterreth from the other, is no evidence of his being under the law, and not under grace.[^1616]" },
  { t = "note", id = "1606", text = "Rom. vi. 14; Gal. ii. 16; iii. 13; iv. 4, 5; Acts xiii. 39; Rom. viii. 1." },
  { t = "note", id = "1608", text = "Rom. vii. 12, 22, 25; Psa. cxix. 4–6; 1 Cor. vii. 19; Gal. v. 14, 16, 18–23." },
  { t = "note", id = "1609", text = "Rom. vii. 7; iii. 20." },
  { t = "note", id = "1610", text = "James i. 23–25; Rom. vii. 9, 14, 24." },
  { t = "note", id = "1611", text = "Gal. iii. 24; Rom. vii. 24, 25; viii. 3, 4." },
  { t = "note", id = "1612", text = "James ii. 11; Psa. cxix. 101, 104, 128." },
  { t = "note", id = "1613", text = "Ezra ix. 13, 14; Psa. lxxxix. 30–34." },
  { t = "note", id = "1614", text = "Lev. xxvi. 1, 10, 14, with 2 Cor. vi. 16, Eph. vi. 2, 3; Psa. xxxvii. 11 with Matt. v. 5; Psa. xix. 11." },
  { t = "note", id = "1615", text = "Gal. ii. 16; Luke xvii. 10." },
  { t = "note", id = "1616", text = "Rom. vi. 12, 14; 1 Pet. iii. 8–12 with Psa.xxxiv. 12–16; Heb. xii. 28, 29." },
  { t = "p", text = "VII. Neither are the forementioned uses of the law contrary to the grace of the gospel, but do sweetly comply with it:[^1626] the Spirit of Christ subduing and enabling the will of man to do that freely and cheerfully which the will of God, revealed in the law, requireth to be done.[^1627]" },
  { t = "note", id = "1626", text = "Gal. iii. 21; [Am. ed. Titus ii. 11–14]." },
  { t = "note", id = "1627", text = "Ezek. xxxvi. 27; Heb. viii. 10 with Jer. xxxi. 33." },
]

[[section]]
id = "chapter-xx-of-christian-liberty-and-liberty-of-conscience"
title = "Chapter XX. Of Christian Liberty, and Liberty of Conscience"
level = 1
blocks = [
  { t = "p", text = "I. The liberty which Christ hath purchased for believers under the gospel consists in their freedom from the guilt of sin, the condemning wrath of God, the curse of the moral law;[^1630] and in their being delivered from this present evil world, bondage to Satan, and dominion of sin,[^1631] from the evil of afflictions, the sting of death, the victory of the grave, and everlasting damnation;[^1632] as also in their free access to God,[^1633] and their yielding obedience unto him, not out of slavish fear, but a childlike love and[^1634] willing mind.[^1635] All which were common also to believers under the law;[^1636] but under the New Testament the liberty of Christians is further enlarged in their freedom from the yoke of the ceremonial law, to which the Jewish Church was subjected;[^1643] and in greater boldness of access to the throne of grace,[^1644] and in fuller communications of the free Spirit of God, than believers under the law did ordinarily partake of.[^1645]" },
  { t = "note", id = "1630", text = "Titus ii. 14; 1 Thess. i. 10; Gal. iii. 13." },
  { t = "note", id = "1631", text = "Gal. i. 4; Col. i. 13; Acts xxvi. 18; Rom. vi. 14." },
  { t = "note", id = "1632", text = "Rom. viii. 28; Psa. cxix. 71; 1 Cor. xv. 54–57; Rom. viii. 1." },
  { t = "note", id = "1633", text = "Rom. v. 1, 2." },
  { t = "note", id = "1634", text = "[Am. ed. inserts *a* after *and*.]" },
  { t = "note", id = "1635", text = "Rom. viii. 14, 15; 1 John iv. 18." },
  { t = "note", id = "1636", text = "Gal. iii. 9, 14." },
  { t = "note", id = "1643", text = "Gal. iv. 1–3, 6, 7; v. 1; Acts xv. 10, 11." },
  { t = "note", id = "1644", text = "Heb. iv. 14, 16; x. 19–22." },
  { t = "note", id = "1645", text = "John vii. 38, 39; 2 Cor. iii. 13, 17, 18." },
  { t = "p", text = "II. God alone is Lord of the conscience,[^1649] and hath left it free from the doctrines and commandments of men which are in any thing contrary to his Word, or beside it in matters of faith or worship.[^1650] So that to believe such doctrines, or to obey such commands[^1651] out of conscience, is to betray true liberty of conscience;[^1652] and the requiring of[^1653] an implicit faith, and an absolute and blind obedience, is to destroy liberty of conscience, and reason also.[^1654]" },
  { t = "note", id = "1649", text = "James iv. 12; Rom. xiv. 4." },
  { t = "note", id = "1650", text = "Acts iv. 19; v. 29; 1 Cor. vii. 23; Matt. xxiii. 8–10; 2 Cor. i. 24; Matt. xv. 9." },
  { t = "note", id = "1651", text = "[Am. ed. *commandments*.]" },
  { t = "note", id = "1652", text = "Col. ii. 20–23; Gal. i. 10; v. 1; ii. 4, 5; Psa. v. l." },
  { t = "note", id = "1653", text = "[Am. ed. omits *of*.]" },
  { t = "note", id = "1654", text = "Rom. x. 17; xiv. 23; Isa. viii. 20; Acts xvii. 11; John iv. 22; Hos. v. 11; Rev. xiii. 12, 16, 17; Jer. viii. 9." },
  { t = "p", text = "III. They who, upon pretense of Christian liberty, do practice any sin, or cherish any lust, do thereby destroy the end of Christian liberty; which is, that, being delivered out of the hands of our enemies, we might serve the Lord without fear, in holiness and righteousness before him, all the days of our life.[^1659]" },
  { t = "note", id = "1659", text = "Gal. v. 13; 1 Pet. ii. 16; 2 Pet. ii. 19; John viii. 34; Luke i. 74, 75." },
  { t = "p", text = "IV. And because the power[^1661] which God hath ordained, and the liberty which Christ hath purchased, are not intended by God to destroy, but mutually to uphold and preserve one another; they who, upon pretense of Christian liberty, shall oppose any lawful power, or the lawful exercise of it, whether it be civil or ecclesiastical, resist the ordinance of God.[^1662] And for their publishing of such opinions, or maintaining of such practices, as are contrary to the light of nature, or to the known principles of Christianity, whether concerning faith, worship, or conversation; or to the power of godliness; or such erroneous opinions or practices, as, either in their own nature, or in the manner of publishing or maintaining them, are destructive to the external peace and order which Christ hath established in the Church; they may lawfully be called to account, and proceeded against by the censures of the Church,[^1663] and by the power of the Civil Magistrate.[^1664][^1665]" },
  { t = "note", id = "1661", text = "[Am. ed. *powers*.]" },
  { t = "note", id = "1662", text = "Matt. xii. 25; 1 Pet. ii. 13, 14, 16; Rom. xiii. 1–8; Heb. xiii. 17." },
  { t = "note", id = "1663", text = "Rom. i. 32 with 1 Cor. v. 1, 5, 11, 13; 2 John v. 10, 11; and 2 Thess. iii. 14, and 1 Tim. vi. 3–5, and Titus i. 10, 11, 13 and iii. 10, with Matt. xviii. 15–17; 1 Tim. i. 19, 20; Rev. ii. 2, 14, 15, 20; iii. 9." },
  { t = "note", id = "1664", text = "Deut. xiii. 6–12; Rom. xiii. 3, 4, with 2 John v. 10, 11; Ezra vii. 23–28; Rev. xvii. 12, 16, 17; Neh. xiii. 15, 17, 21, 22, 25, 30; 2 Kings xxiii. 5, 6, 9, 20, 21; 2 Chron. xxxiv. 33; xv. 12, 13, 16; Dan. iii. 29; 1 Tim. ii. 2; Isa. xlix. 23; Zech. xiii. 2, 3." },
  { t = "note", id = "1665", text = "[Am. ed. omits *and by the power of the Civil Magistrate*, also the prooftexts.]" },
]

[[section]]
id = "chapter-xxi-of-religious-worship-and-the-sabbath-day"
title = "Chapter XXI. Of Religious Worship and the Sabbath-day"
level = 1
blocks = [
  { t = "p", text = "I. The light of nature showeth that there is a God, who hath lordship and sovereignty over all; is good, and doeth good unto all; and is therefore to be feared, loved, praised, called upon, trusted in, and served with all the heart, and with all the soul, and with all the might.[^1669] But the acceptable way of worshiping the true God is instituted by himself, and so limited to[^1670] his own revealed will, that he may not be worshiped according to the imaginations and devices of men, or the suggestions of Satan, under any visible representations[^1671] or any other way not prescribed in the Holy Scripture.[^1672]" },
  { t = "note", id = "1669", text = "Rom. i. 20; Acts xvii. 24; Psa. cxix. 68; Jer. x. 7; Psa. xxxi. 23; xviii. 3; Rom. x. 12; Psa. lxii. 8; Josh. xxiv. 14; Mark xii. 33." },
  { t = "note", id = "1670", text = "[Am. ed. *by*.]" },
  { t = "note", id = "1671", text = "[Am. ed. *representation*.]" },
  { t = "note", id = "1672", text = "Deut. xii. 32; Matt. xv. 9; Acts xvii. 25; Matt. iv. 9, 10; Deut. iv. 15–20; Exod. xx. 4–6; Col. ii. 23." },
  { t = "p", text = "II. Religious worship is to be given to God, the Father, Son, and Holy Ghost; and to him alone:[^1675] not to angels, saints, or any other creature:[^1676] and since the fall, not without a Mediator; nor in the mediation of any other but of Christ alone.[^1677]" },
  { t = "note", id = "1675", text = "Matt. iv. 10 with John v. 23 and 2 Cor. xiii. 14; [Am. ed. Rev. v. 11–13]." },
  { t = "note", id = "1676", text = "Col. ii. 18; Rev. xix. 10; Rom. i. 25." },
  { t = "note", id = "1677", text = "John xiv. 6; 1 Tim. ii. 5; Eph. ii. 18; Col. iii. 17." },
  { t = "p", text = "III. Prayer with thanksgiving, being one special part of religious worship,[^1681] is by God required of all men;[^1683] and that it may be accepted, it is to be made in the name of the Son,[^1684] by the help of his Spirit,[^1685] according to his will,[^1686] with understanding, reverence, humility, fervency, faith, love, and perseverance;[^1687] and, if vocal, in a known tongue.[^1688]" },
  { t = "note", id = "1681", text = "Phil. iv. 6." },
  { t = "note", id = "1683", text = "Psa. lxv. 2." },
  { t = "note", id = "1684", text = "John xiv. 13, 14; 1 Pet. ii. 5." },
  { t = "note", id = "1685", text = "Rom. viii. 26." },
  { t = "note", id = "1686", text = "1 John v. 14." },
  { t = "note", id = "1687", text = "Psa. xlvii. 7; Eccles. v. 1, 2; Heb. xii. 28; Gen. xviii. 27; James v. 16; i. 6, 7; Mark xi. 24; Matt. vi. 12, 14, 15; Col. iv. 2; Eph. vi. 18." },
  { t = "note", id = "1688", text = "1 Cor. xiv. 14." },
  { t = "p", text = "IV. Prayer is to be made for things lawful,[^1695] and for all sorts of men living, or that shall live hereafter;[^1696] but not for the dead,[^1697] nor for those of whom it may be known that they have sinned the sin unto death.[^1698]" },
  { t = "note", id = "1695", text = "1 John v. 14." },
  { t = "note", id = "1696", text = "1 Tim. ii. 1, 2; John xvii. 20; 2 Sam. vii. 29; Ruth iv. 12." },
  { t = "note", id = "1697", text = "2 Sam. xii. 21–23 with Luke xvi. 25, 26; Rev. xiv. 13." },
  { t = "note", id = "1698", text = "1 John v. 16." },
  { t = "p", text = "V. The reading of the Scriptures with godly fear;[^1703] the sound preaching;[^1704] and conscionable hearing of the Word, in obedience unto God with understanding, faith, and reverence;[^1705] singing of psalms with grace in the heart;[^1706] as, also, the dne administration and worthy receiving of the sacraments instituted by Christ; are all parts of the ordinary religious worship of God:[^1707] besides religious oaths,[^1708] vows,[^1709] solemn fastings,[^1718] and thanksgivings upon several[^1719] occasions;[^1720] which are, in their several times and seasons, to be used in an holy and religious manner.[^1721]" },
  { t = "note", id = "1703", text = "Acts xv. 21; Rev. i. 3." },
  { t = "note", id = "1704", text = "2 Tim. iv. 2." },
  { t = "note", id = "1705", text = "James i. 22; Acts x. 33; Matt. xiii. 19; Heb. iv. 2; Isa. lxvi. 2." },
  { t = "note", id = "1706", text = "Col. iii. 16; Eph. v. 19; James v. 13." },
  { t = "note", id = "1707", text = "Matt. xxviii. 19; 1 Cor. xi. 23–29; Acts ii. 42." },
  { t = "note", id = "1708", text = "Deut. vi. 13 with Neh. x. 29." },
  { t = "note", id = "1709", text = "Isa. xix. 21 with Eccles. v. 4, 5; [Am. ed. Acts xviii. 18.—Am. ed. reads *and vows*]." },
  { t = "note", id = "1718", text = "Joel ii. 12; Esth. iv. 16; Matt. ix. 15; 1 Cor. vii. 5." },
  { t = "note", id = "1719", text = "[Amer. ed. has *special*]" },
  { t = "note", id = "1720", text = "Psalm cvii. throughout; Esth. ix. 22." },
  { t = "note", id = "1721", text = "Heb. xii. 28." },
  { t = "p", text = "VI. Neither prayer, nor any other part of religious worship, is now, under the gospel, either tied unto, or made more acceptable by any place in which it is performed, or towards which it is directed:[^1724] but God is to be worshiped every where[^1725] in spirit and[^1726] truth;[^1727] as in private families[^1728] daily,[^1729] and in secret each one by himself,[^1730] so more solemnly in the public assemblies, which are not carelessly or willfully to be neglected or forsaken, when God, by his Word or providence, calleth thereunto.[^1731]" },
  { t = "note", id = "1724", text = "John iv. 21." },
  { t = "note", id = "1725", text = "Mal. i. 11; 1 Tim. ii. 8." },
  { t = "note", id = "1726", text = "[Am. ed. inserts *in*.]" },
  { t = "note", id = "1727", text = "John iv. 23, 24." },
  { t = "note", id = "1728", text = "Jer. x. 25; Deut. vi. 6, 7; Job i. 5; 2 Sam. vi. 18, 20; 1 Pet. iii. 7; Acts x. 2." },
  { t = "note", id = "1729", text = "Matt. vi. 11; [Am. ed. Josh. xxiv. 15]." },
  { t = "note", id = "1730", text = "Matt. vi. 6; Eph. vi. 18." },
  { t = "note", id = "1731", text = "Isa. lvi. 7; Heb. x. 25; Prov. i. 20, 21, 24; viii. 34; Acts xiii. 42; Luke iv. 16; Acts ii. 42." },
  { t = "p", text = "VII. As it is of the law of nature, that, in general, a due proportion of time be set apart for the worship of God; so, in his Word, by a positive, moral, and perpetual commandment, binding all men in all ages, he hath particularly appointed one day in seven for a Sabbath, to be kept holy unto him:[^1739] which, from the beginning of the world to the resurrection of Christ, was the last day of the week; and, from the resurrection of Christ, was changed into the first day of the week,[^1741] which in Scripture is called the Lord's day,[^1742] and is to be continued to the end of the world, as the Christian Sabbath.[^1743]" },
  { t = "note", id = "1739", text = "Exod. xx. 8, 10, 11; Isa. lvi. 2, 4, 6, 7; [Am. ed. Isa. lvi. 6]." },
  { t = "note", id = "1741", text = "Gen. ii. 2, 3; 1 Cor. xvi. 1, 2; Acts xx. 7." },
  { t = "note", id = "1742", text = "Rev. i. 10." },
  { t = "note", id = "1743", text = "Exod. xx. 8, 10, with Matt. v. 17, 18." },
  { t = "p", text = "VIII. This Sabbath is then kept holy unto the Lord, when men, after a due preparing of their hearts, and ordering of their common affairs beforehand, do not only observe an holy rest all the day from their own works, words, and thoughts, about their worldly employments and recreations;[^1747] but also are taken up the whole time in the public and private exercises of his worship, and in the duties of necessity and mercy.[^1748]" },
  { t = "note", id = "1747", text = "Exod. xx. 8; xvi. 23, 25, 26, 29, 30; xxxi. 15–17; Isa. lviii. 13; Neh. xiii. 15–22." },
  { t = "note", id = "1748", text = "Isa. lviii. 13; Matt. xii. 1–13." },
]

[[section]]
id = "chapter-xxii-of-lawful-oaths-and-vows"
title = "Chapter XXII. Of Lawful Oaths and Vows"
level = 1
blocks = [
  { t = "p", text = "I. A lawful oath is a part of religious worship,[^1751] wherein, upon just occasion, the person swearing solemnly calleth God to witness what he asserteth or promiseth; and to judge him according to the truth or falsehood of what he sweareth.[^1752]" },
  { t = "note", id = "1751", text = "Deut. x. 20." },
  { t = "note", id = "1752", text = "Exod. xx. 7; Lev. xix. 12; 2 Cor. i. 23; 2 Chron. vi. 22, 23." },
  { t = "p", text = "II. The name of God only is that by which, men ought to swear, and therein it is to be used with all holy fear and reverence;[^1755] therefore to swear vainly or rashly by that glorious and dreadful name, or to swear at all by any other thing, is sinful, and to be abhorred.[^1756] Yet as, in matters of weight and moment, an oath is warranted by the Word of God, under the New Testament, as well as under the Old,[^1757] so a lawful oath, being imposed by lawful authority, in such matters ought to be taken.[^1758]" },
  { t = "note", id = "1755", text = "Deut. vi. 13." },
  { t = "note", id = "1756", text = "Exod. xx. 7; Jer. v. 7; Matt. v. 34, 37; James v. 12." },
  { t = "note", id = "1757", text = "Heb. vi. 16; 2 Cor. i. 23; Isa. lxv. 16." },
  { t = "note", id = "1758", text = "1 Kings viii. 31; Neh. xiii. 25; Ezra x. 25." },
  { t = "p", text = "III. Whosoever taketh an oath ought duly to consider the weightiness of so solemn an act, and therein to avouch nothing but what he is fully persuaded is the truth.[^1763] Neither may any man bind himself by oath to any thing but what is good and just, and what he believeth so to be, and what he is able and resolved to perform.[^1764] Yet it is a sin to refuse an oath touching any thing that is good and just, being imposed by lawful authority.[^1765]" },
  { t = "note", id = "1763", text = "Exod. xx. 7; Jer. iv. 2." },
  { t = "note", id = "1764", text = "Gen. xxiv. 2, 3, 5, 6, 8, 9." },
  { t = "note", id = "1765", text = "Numb. v. 19, 21; Neh. v. 12; Exod. xxii. 7–11." },
  { t = "p", text = "IV. An oath is to be taken in the plain and common sense of the words, without equivocation or mental reservation.[^1769] It can not oblige to sin; but in any thing not sinful, being taken, it binds to performance, although to a man's own hurt:[^1770] nor is it to be violated, although made to heretics or infidels.[^1771]" },
  { t = "note", id = "1769", text = "Jer. iv. 2; Psa. xxiv. 4." },
  { t = "note", id = "1770", text = "1 Sam. xxv. 22, 32–34; Psa. xv. 4." },
  { t = "note", id = "1771", text = "Ezek. xvii. 16, 18, 19; Josh. ix. 18, 19, with 2 Sam. xxi. 1." },
  { t = "p", text = "V. A vow is of the like nature with a promissory oath, and ought to be made with the like religious care, and to be performed with the like faithfulness.[^1775]" },
  { t = "note", id = "1775", text = "Isa. xix. 21; Eccles. v. 4–6; Psa. lxi. 8; lxvi. 13, 14." },
  { t = "p", text = "VI. It is not to be made to any creature, but to God alone:[^1777] and that it may be accepted, it is to be made voluntarily, out of faith and conscience of duty, in way of thankfulness for mercy received, or for the[^1778] obtaining of what we want; whereby we more strictly bind ourselves to necessary duties, or to other things, so far and so long as they may fitly conduce thereunto.[^1779]" },
  { t = "note", id = "1777", text = "Psa. lxxvi. 11; Jer. xliv. 25, 26." },
  { t = "note", id = "1778", text = "[Am. ed. omits *the.*]" },
  { t = "note", id = "1779", text = "Deut. xxiii. 21, 23; Psa. 1. 14; Gen. xxviii. 20–22; 1 Sam. i. 11; Psa. lxvi. 13, 14; cxxxii. 2—5." },
  { t = "p", text = "VII. No man may vow to do any thing forbidden in the Word of God, or what would hinder any duty therein commanded, or which is not in his own power, and for the performance whereof he hath no promise or ability from God.[^1783] In which respect,[^1784] popish monastical vows of perpetual single life, professed poverty, and regular obedience, are so far from being degrees of higher perfection, that they are superstitions and sinful snares, in which no Christian may entangle himself.[^1785]" },
  { t = "note", id = "1783", text = "Acts xxiii. 12, 14; Mark vi. 26; Numb. xxx. 5, 8, 12, 13." },
  { t = "note", id = "1784", text = "[Am. ed. has *respects.*]" },
  { t = "note", id = "1785", text = "Matt. xix. 11, 12; 1 Cor. vii. 2, 9; Eph. iv. 28; 1 Pet. iv. 2; 1 Cor. vii. 23." },
]

[[section]]
id = "chapter-xxiii-of-the-civil-magistrate"
title = "Chapter XXIII. Of the Civil Magistrate"
level = 1
blocks = [
  { t = "p", text = "I. God, the Supreme Lord and King of all the world, hath ordained civil magistrates to be under him, over the people, for his own glory and the public good, and to this end hath armed them with the power of the sword, for the defense and encouragement of them that are good, and for the punishment of evil-doers.[^1787]" },
  { t = "note", id = "1787", text = "Rom. xiii. 1–4; 1 Pet. ii. 13, 14." },
  { t = "p", text = "II. It is lawful for Christians to accept and execute the office of a magistrate when called thereunto;[^1789] in the managing whereof, as they ought especially to maintain piety, justice, and peace, according to the wholesome laws of each commonwealth,[^1790] so, for that end, they may lawfully, now under the New Testament, wage war upon just and necessary occasion.[^1791]&[^1792]" },
  { t = "note", id = "1789", text = "Prov. viii. 15, 16; Rom. xiii. 1, 2, 4." },
  { t = "note", id = "1790", text = "Psa. ii. 10–12; 1 Tim. ii. 2; Psa. lxxxii. 3, 4; 2 Sam. xxiii. 3; 1 Pet. ii. 13." },
  { t = "note", id = "1791", text = "Luke iii. 14; Rom. xiii. 4; Matt. viii. 9, 10; Acts x. 1, 2; Rev. xvii. 14, 16." },
  { t = "note", id = "1792", text = "[Am. ed. has *occasions*.]" },
  { t = "p", text = "III. The civil magistrate may not assume to himself the administration of the Word and Sacraments, or the power of the keys of the kingdom of heaven:[^1796] yet he hath authority, and it is his duty to take order, that unity and peace be preserved in the Church, that the truth of God be kept pure and entire, that all blasphemies and heresies be suppressed, all corruptions and abuses in worship and discipline prevented or reformed, and all the ordinances of God duly settled, administered, and observed.[^1797] For the better effecting whereof he hath power to call synods, to be present at them, and to provide that whatsoever is transacted in them be according to the mind of God.[^1798]" },
  { t = "note", id = "1796", text = "2 Chron. xxvi. 18 with Matt. xviii. 17 and xvi. 19; 1 Cor. xii. 28, 29; Eph. iv. 11, 12; 1 Cor. iv. 1, 2; Rom. x. 15; Heb. v. 4." },
  { t = "note", id = "1797", text = "Isa. xlix. 23; Psa. cxxii. 9; Ezra vii. 23–28; Lev. xxiv. 16; Deut. xiii. 5, 6, 12; 2 Kings xviii. 4; 1 Chron. xiii. 1–9; 2 Kings xxiii. 1–26; 2 Chron. xxxiv. 33; 2 Chron. xv. 12, 13." },
  { t = "note", id = "1798", text = "2 Chron. xix. 8–11; chaps. xxix. and xxx.; Matt. ii. 4, 5." },
  { t = "p", text = "The above section is changed in the American revision, and adapted to the separation of Church and State, as follows:" },
  { t = "p", text = "[III. *Civil magistrates may not assume to themselves the administration of the Word and Sacraments* (2 Chron. xxvi. 18)*; or the power of the keys of the kingdom of heaven* (Matt. xvi. 19; 1 Cor. iv. 1, 2)*; or, in the least, interfere in matters of faith* (John xviii. 36; Mal. ii. 7; Acts v. 29)*. Yet as nursing fathers, it is the duty of civil magistrates to protect the Church of our common Lord, without giving the preference to any denomination of Christians above the rest, in such a manner that all ecclesiastical persons whatever* *shall enjoy the full, free, and unquestioned liberty of discharging every part of their sacred functions, without violence or danger* (Isa. xlix. 23)*. And, as Jesus Christ hath appointed a regular government and discipline in his Church, no law of any commonwealth should interfere with, let, or hinder, the due exercise thereof, among the voluntary members of any denomination of Christians, according to their own profession and belief* (Psa. cv. 15; Acts xviii. 14–16)*. It is the duty of civil magistrates to protect the person and good name of all their people, in such an effectual manner as that no person be suffered, either upon pretence of religion or infidelity, to offer any indignity, violence, abuse, or injury to any other person whatsoever: and to take order, that all religious and ecclesiastical assemblies be held without molestation or disturbance* (2 Sam. xxiii. 3; 1 Tim. ii. 1; Rom. xiii. 4).]" },
  { t = "p", text = "IV. It is the duty of people[^1802] to pray for magistrates,[^1803] to honor their persons,[^1804] to pay them tribute and other dues,[^1805] to obey their lawful commands, and to be subject to their authority, for conscience' sake.[^1806] Infidelity or difference in religion doth not make void the magistrate's just and legal authority, nor free the people from their due obedience to him:[^1807] from which ecclesiastical persons are not exempted;[^1808] much less hath the Pope any power or jurisdiction over them in their dominions, or over any of their people; and least of all to deprive them of their dominions or lives, if he shall judge them to be heretics, or upon any other pretense whatsoever.[^1815]" },
  { t = "note", id = "1802", text = "[Am. ed. reads *of the people*.]" },
  { t = "note", id = "1803", text = "1 Tim. ii. 1, 2." },
  { t = "note", id = "1804", text = "1 Pet. ii. 17." },
  { t = "note", id = "1805", text = "Rom. xiii. 6, 7." },
  { t = "note", id = "1806", text = "Rom. xiii. 5; Tit. i. 3." },
  { t = "note", id = "1807", text = "1 Pet. ii. 13, 14, 16." },
  { t = "note", id = "1808", text = "Rom. xiii. 1; 1 Kings ii. 35; Acts xxv. 9–11; 2 Pet. ii. 1, 10, 11; Jude 8–11." },
  { t = "note", id = "1815", text = "2 Thess. ii. 4; Rev. xiii. 15–17." },
]

[[section]]
id = "chapter-xxiv-of-marriage-and-divorce"
title = "Chapter XXIV. Of Marriage and Divorce"
level = 1
blocks = [
  { t = "p", text = "I. Marriage is to be between one man and one woman: neither is it lawful for any man to have more than one wife, nor for any woman to have more than one husband at the same time.[^1817]" },
  { t = "note", id = "1817", text = "Gen. ii. 24; Matt. xix. 5, 6; Prov. ii. 17; [Am. ed. 1 Cor. vii. 2; Mark x. 6–9]." },
  { t = "p", text = "II. Marriage was ordained for the mutual help of husband and wife;[^1819] for the increase of mankind with a legitimate issue, and of the Church with an holy seed;[^1820] and for preventing of uncleanness.[^1821]" },
  { t = "note", id = "1819", text = "Gen. ii. 18." },
  { t = "note", id = "1820", text = "Mal. ii. 15." },
  { t = "note", id = "1821", text = "1 Cor. vii. 2, 9." },
  { t = "p", text = "III. It is lawful for all sorts of people to marry who are able with judgment to give their consent.[^1825] Yet it is the duty of Christians to marry only in the Lord.[^1826] And, therefore, such as profess the true reformed religion should not marry with infidels, Papists, or other idolaters: neither should such as are godly be unequally yoked, by marrying with such as are notoriously wicked in their life, or maintain damnable heresies.[^1827]" },
  { t = "note", id = "1825", text = "Heb. xiii. 4; 1 Tim. iv. 3; 1 Cor. vii. 36–38; Gen. xxiv. 57, 58." },
  { t = "note", id = "1826", text = "1 Cor. vii. 39." },
  { t = "note", id = "1827", text = "Gen. xxxiv. 14; Exod. xxxiv. 16; Deut. vii. 3, 4; 1 Kings xi. 4; Neh. xiii. 25–27; Mal. ii. 11, 12; 2 Cor. vi. 14." },
  { t = "p", text = "IV. Marriage ought not to be within the degrees of consanguinity or affinity forbidden in the Word;[^1831] nor can such incestuous marriages ever be made lawful by any law of man, or consent of parties, so as those persons may live together, as man and wife.[^1832] The man may not marry any of his wife's kindred nearer in blood than he may of his own, nor the woman of her husband's kindred nearer in blood than of her own.[^1833]" },
  { t = "note", id = "1831", text = "Lev. chap. xviii.; 1 Cor. v. 1; Amos ii. 7." },
  { t = "note", id = "1832", text = "Mark vi. 18; Lev. xviii. 24–28." },
  { t = "note", id = "1833", text = "Lev. xx. 19–21." },
  { t = "p", text = "V. Adultery or fornication, committed after a contract, being detected before marriage, giveth just occasion to the innocent party to dissolve that contract.[^1837] In the case of adultery after marriage, it is lawful for the innocent party to sue out a divorce,[^1838] and after the divorce to marry another, as if the offending party were dead.[^1839]" },
  { t = "note", id = "1837", text = "Matt. i. 18–20." },
  { t = "note", id = "1838", text = "Matt. v. 31, 32." },
  { t = "note", id = "1839", text = "Matt. xix. 9; Rom. vii. 2, 3." },
  { t = "p", text = "VI. Although the corruption of man be such as is apt to study arguments, unduly to put asunder those whom God hath joined together in marriage; yet nothing but adultery, or such willful desertion as can no way be remedied by the Church or civil magistrate, is cause sufficient of dissolving the bond of marriage;[^1843] wherein a public and orderly course of proceeding is to be observed; and the persons concerned in it, not left to their own wills and discretion in their own case.[^1844]" },
  { t = "note", id = "1843", text = "Matt. xix. 8, 9; 1 Cor. vii. 15; Matt. xix. 6." },
  { t = "note", id = "1844", text = "Deut. xxiv. 1–4; [Am. ed. Ezra x. 3]." },
]

[[section]]
id = "chapter-xxv-of-the-church"
title = "Chapter XXV. Of the Church"
level = 1
blocks = [
  { t = "p", text = "I. The catholic or universal Church, which is invisible, consists of the whole number of the elect, that have been, are, or shall be gathered into one, under Christ the head thereof; and is the spouse, the body, the fullness of him that filleth all in all.[^1847]" },
  { t = "note", id = "1847", text = "Eph. i. 10, 22, 23; v. 23, 27, 32; Col. i. 18." },
  { t = "p", text = "II. The visible Church, which is also catholic or universal under the gospel (not confined to one nation as before under the law) consists of all those, throughout the world, that profess the true religion,[^1849] and of[^1850] their children;[^1851] and is the kingdom of the Lord Jesus Christ,[^1852] the house and family of God,[^1853] out of which there is no ordinary possibility of salvation.[^1854]" },
  { t = "note", id = "1849", text = "1 Cor. i. 2; xii. 12, 13; Psa. ii. 8; Rev. vii. 9; Rom. xv. 9–12." },
  { t = "note", id = "1850", text = "[Am. ed. *together with*, instead of *and of*.]" },
  { t = "note", id = "1851", text = "1 Cor. vii. 14; Acts ii. 39; Ezek. xvi. 20, 21; Rom. xi. 16; Gen. iii. 15; xvii. 7; [Am. ed. Gal. iii. 7, 9, 14; Rom. iv. throughout]." },
  { t = "note", id = "1852", text = "Matt. xiii. 47; Isa. ix. 7." },
  { t = "note", id = "1853", text = "Eph. ii. 19; iii. 15; [Am. ed. Prov. xxix. 18]." },
  { t = "note", id = "1854", text = "Acts ii. 47." },
  { t = "p", text = "III. Unto this catholic visible Church Christ hath given the ministry, oracles, and ordinances of God, for the gathering and perfecting of the saints, in this life, to the end of the world: and doth by his own presence and Spirit, according to his promise, make them effectual thereunto.[^1860]" },
  { t = "note", id = "1860", text = "1 Cor. xii. 23; Eph. iv. 11–13; Matt. xxviii. 19, 20; Isa. lix. 21." },
  { t = "p", text = "IV. This catholic Church hath been sometimes more, sometimes less visible.[^1862] And particular churches, which are members thereof, are more or less pure, according as the doctrine of the gospel is taught and embraced, ordinances administered, and public worship performed more or less purely in them.[^1863]" },
  { t = "note", id = "1862", text = "Rom. xi. 3, 4; Rev. xii. 6, 14; [Am. ed. Acts ix. 31]." },
  { t = "note", id = "1863", text = "Rev. chaps. ii. and iii.; 1 Cor. v. 6, 7." },
  { t = "p", text = "V. The purest churches under heaven are subject both to mixture and error;[^1866] and some have so degenerated as to become no churches of Christ, but synagogues of Satan.[^1867] Nevertheless, there shall be always a Church on earth to worship God according to his will.[^1868]" },
  { t = "note", id = "1866", text = "1 Cor. xiii. 12; Rev. chaps. ii. and iii.; Matt. xiii. 24–30, 47." },
  { t = "note", id = "1867", text = "Rev. xviii. 2; Rom. xi. 18–22." },
  { t = "note", id = "1868", text = "Matt. xvi. 18; Psa. lxxii. 17; cii. 28; Matt. xxviii. 19, 20." },
  { t = "p", text = "VI. There is no other head of the Church but the Lord Jesus Christ:[^1872] nor can the Pope of Rome, in any sense be head thereof; but is that Antichrist, that man of sin and son of perdition, that exalteth himself in the Church against Christ, and all that is called God.[^1874]" },
  { t = "note", id = "1872", text = "Col. i. 18; Eph. i. 22." },
  { t = "note", id = "1874", text = "Matt. xxiii. 8–10; 2 Thess. ii. 3, 4, 8, 9; Rev. xiii. 6." },
]

[[section]]
id = "chapter-xxvi-of-the-communion-of-saints"
title = "Chapter XXVI. Of the Communion of Saints"
level = 1
blocks = [
  { t = "p", text = "I. All saints that are united to Jesus Christ their head, by his Spirit and by faith, have fellowship with him in his graces, sufferings, death, resurrection, and glory:[^1876] and being united to one another in love, they have communion in each other's gifts and graces,[^1877] and are obliged to the performance of such duties, public and private, as do conduce to their mutual good, both in the inward and outward man.[^1878]" },
  { t = "note", id = "1876", text = "1 John i. 3; Eph. iii. 16–19; John i. 16; Eph. ii. 5, 6; Phil. iii. 10; Rom. vi. 5, 6; 2 Tim. ii. 12." },
  { t = "note", id = "1877", text = "Eph. iv. 15, 16; 1 Cor. xii. 7; iii. 21–23; Col. ii. 19." },
  { t = "note", id = "1878", text = "1 Thess. v. 11, 14; Rom. i. 11, 12, 14; 1 John iii. 16–18; Gal. vi. 10." },
  { t = "p", text = "II. Saints, by profession, are bound to maintain an holy fellowship and communion in the worship of God, and in performing such other spiritual services as tend to their mutual edification;[^1882] as also in relieving each other in outward things, according to their several abilities and necessities." },
  { t = "note", id = "1882", text = "Heb. x. 24, 25; Acts ii. 42, 46; Isa. ii. 3; 1 Cor. xi. 20." },
  { t = "p", text = "Which communion, as God offereth opportunity, is to be extended unto all those who, in every place, call upon the name of the Lord Jesus.[^1884]" },
  { t = "note", id = "1884", text = "Acts ii. 44, 45; 1 John iii. 17; 2 Cor. chaps. viii. and ix.; Acts xi. 29, 30." },
  { t = "p", text = "III. This communion which the saints have with Christ, doth not make them in anywise partakers of the substance of his Godhead, or to be equal with Christ in any respect: either of which to affirm is impious and blasphemous.[^1886] Nor doth their communion one with another, as saints, take away or infringe the title or propriety[^1887] which each man hath in his goods and possessions.[^1888]" },
  { t = "note", id = "1886", text = "Col. i. 18, 19; 1 Cor. viii. 6; Isa. xlii. 8; 1 Tim. vi. 15, 16; Psa. xlv. 7 with Heb. i. 8, 9." },
  { t = "note", id = "1887", text = "[Am. ed. *property*.]" },
  { t = "note", id = "1888", text = "Exod. xx. 15; Eph. iv. 28; Acts v. 4." },
]

[[section]]
id = "chapter-xxvii-of-the-sacraments"
title = "Chapter XXVII. Of the Sacraments"
level = 1
blocks = [
  { t = "p", text = "I. Sacraments are holy signs and seals of the covenant of grace,[^1891] immediately instituted by God,[^1892] to represent Christ and his benefits, and to confirm our interest in him:[^1893] as also to put a visible difference between those that belong unto the Church and the rest of the world;[^1894] and solemnly to engage them to the service of God in Christ, according to his Word.[^1895]" },
  { t = "note", id = "1891", text = "Rom. iv. 11; Gen. xvii. 7, 10." },
  { t = "note", id = "1892", text = "Matt. xxviii. 19; 1 Cor. xi. 23." },
  { t = "note", id = "1893", text = "1 Cor. x. 16; xi. 25, 26; Gal. iii. 27." },
  { t = "note", id = "1894", text = "Rom. xv. 8; Exod. xii. 48; Gen. xxxiv. 14; [Am. ed. 1 Cor. x. 21]." },
  { t = "note", id = "1895", text = "Rom. vi. 3, 4; 1 Cor. x. 16, 21." },
  { t = "p", text = "II. There is in every sacrament a spiritual relation or sacramental union, between the sign and the thing signified; whence it comes to pass that the names and the[^1901] effects of the one are attributed to the other.[^1902]" },
  { t = "note", id = "1901", text = "Am. ed. omits *the.*" },
  { t = "note", id = "1902", text = "Gen. xvii. 10; Matt. xxvi. 27, 28; Tit. iii. 5." },
  { t = "p", text = "III. The grace which is exhibited in or by the sacraments, rightly used, is not conferred by any power in them; neither doth the efficacy of a sacrament depend upon the piety or intention of him that doth administer it,[^1904] but upon the work of the Spirit,[^1905] and the word of institution, which contains, together with a precept authorizing the use thereof, a promise of benefit to worthy receivers.[^1906]" },
  { t = "note", id = "1904", text = "Rom. ii. 28, 29; 1 Pet. iii. 21." },
  { t = "note", id = "1905", text = "Matt. iii. 11; 1 Cor. xii. 13." },
  { t = "note", id = "1906", text = "Matt. xxvi. 27, 28; xxviii. 19, 20." },
  { t = "p", text = "IV. There be only two sacraments ordained by Christ our Lord in the gospel, that is to say, Baptism and the Supper of the Lord: neither of which may be dispensed by any but by a minister of the Word lawfully ordained.[^1910]" },
  { t = "note", id = "1910", text = "Matt. xxviii. 19; 1 Cor. xi. 20, 23; iv. 1; Heb. v. 4." },
  { t = "p", text = "V. The sacraments of the Old Testament, in regard of the spiritual things thereby signified and exhibited, were, for substance, the same with those of the New.[^1912]" },
  { t = "note", id = "1912", text = "1 Cor. x. 1–4; [Am. ed. 1 Cor. v. 7, 8]." },
]

[[section]]
id = "chapter-xxviii-of-baptism"
title = "Chapter XXVIII. Of Baptism"
level = 1
blocks = [
  { t = "p", text = "I. Baptism is a sacrament of the New Testament, ordained by Jesus Christ,[^1914] not only for the solemn admission of the party baptized into the visible Church,[^1915] but also to be unto him a sign and seal of the covenant of grace[^1916], of his ingrafting into Christ,[^1917] of regeneration,[^1918] of remission of sins,[^1919] and of his giving up unto God, through Jesus Christ, to walk in newness of life:[^1920] which sacrament is, by Christ's own appointment, to be continued in his Church until the end of the world.[^1921]" },
  { t = "note", id = "1914", text = "Matt. xxviii. 19; [Am. ed. Mark xvi. 16]." },
  { t = "note", id = "1915", text = "1 Cor. xii. 13; [Am. ed. Gal. iii. 27, 28]." },
  { t = "note", id = "1916", text = "Rom. iv. 11 with Col. ii. 11, 12." },
  { t = "note", id = "1917", text = "Gal. iii. 27; Rom. vi. 5." },
  { t = "note", id = "1918", text = "Tit. iii. 5." },
  { t = "note", id = "1919", text = "Mark i. 4; [Am. ed. Acts ii. 38; xxii. 16]." },
  { t = "note", id = "1920", text = "Rom. vi. 3, 4." },
  { t = "note", id = "1921", text = "Matt. xxviii. 19, 20." },
  { t = "p", text = "II. The outward element to be used in this sacrament is water, wherewith the party is to be baptized in the name of the Father, and of the Son, and of the Holy Ghost, by a minister of the gospel lawfully called thereunto.[^1930]" },
  { t = "note", id = "1930", text = "Matt. iii. 11; John i. 33; Matt. xxviii. 19, 20; [Am. ed. Acts x. 47; viii. 36, 38]." },
  { t = "p", text = "III. Dipping of the person into the water is not necessary; but baptism is rightly administered by pouring or sprinkling water upon the person.[^1932]" },
  { t = "note", id = "1932", text = "Heb. ix. 10, 19–22; Acts ii. 41; xvi. 33; Mark vii. 4." },
  { t = "p", text = "IV. Not only those that do actually profess faith in and obedience unto Christ,[^1934] but also the infants of one or both believing parents are to be baptized.[^1936]" },
  { t = "note", id = "1934", text = "Mark xvi. 15, 16; Acts viii. 37, 38." },
  { t = "note", id = "1936", text = "Gen. xvii. 7, 9, with Gal. iii. 9, 14, and Col. ii. 11, 12, and Acts ii. 38, 39, and Rom. iv. 11, 12; 1 Cor. vii. 14; Matt. xxviii. 19; Mark x. 13–16; Luke xviii. 15; [Am. ed. Acts xvi. 14, 15, 33]." },
  { t = "p", text = "V. Although it be a great sin to contemn or neglect this ordinance,[^1938] yet grace and salvation are not so inseparably annexed unto it, as that no person can be regenerated or saved without it,[^1939] or that all that are baptized are undoubtedly regenerated.[^1940]" },
  { t = "note", id = "1938", text = "Luke vii. 30 with Exod. iv. 24–26." },
  { t = "note", id = "1939", text = "Rom. iv. 11; Acts x. 2, 4, 22, 31, 45, 47." },
  { t = "note", id = "1940", text = "Acts viii. 13, 23." },
  { t = "p", text = "VI. The efficacy of baptism is not tied to that moment of time wherein it is administered;[^1944] yet, notwithstanding, by the right use of this ordinance the grace promised is not only offered, but really exhibited and conferred by the Holy Ghost, to such (whether of age or infants) as that grace belongeth unto, according to the counsel of God's own will, in his appointed time.[^1945]" },
  { t = "note", id = "1944", text = "John iii. 5, 8." },
  { t = "note", id = "1945", text = "Gal. iii. 27; Tit. iii. 5; Eph. v. 25, 26; Acts ii. 38, 41." },
  { t = "p", text = "VII. The sacrament of baptism is but once to be administered to any person.[^1948]" },
  { t = "note", id = "1948", text = "Tit. iii. 5." },
]

[[section]]
id = "chapter-xxix-of-the-lord-s-supper"
title = "Chapter XXIX. Of the Lord's Supper"
level = 1
blocks = [
  { t = "p", text = "I. Our Lord Jesus, in the night wherein he was betrayed, instituted the sacrament of his body and blood, called the Lord's Supper, to be observed in his Church, unto the end of the world, for the perpetual remembrance of the sacrifice of himself in his death, the sealing all benefits thereof unto true believers, their spiritual nourishment and growth in him, their further engagement in, and to all duties which they owe unto him; and to be a bond and pledge of their communion with him, and with each other, as members of his mystical body.[^1950]" },
  { t = "note", id = "1950", text = "1 Cor. xi. 23–26; x. 16, 17, 21; xii. 13." },
  { t = "p", text = "II. In this sacrament Christ is not offered up to his Father, nor any real sacrifice made at all for remission of sins of the quick or dead,[^1952] but only a commemoration of that one offering up of himself, by himself, upon the cross, once for all, and a spiritual oblation of all possible praise unto God for the same;[^1953] so that the Popish sacrifice of the mass, as they call it, is most abominably injurious to Christ's one only sacrifice, the alone propitiation for all the sins of the elect.[^1954]" },
  { t = "note", id = "1952", text = "Heb. ix. 22, 25, 26, 28." },
  { t = "note", id = "1953", text = "1 Cor. xi. 24–26; Matt. xxvi. 26, 27; [Am. ed. Luke xxii. 19, 20]." },
  { t = "note", id = "1954", text = "Heb. vii. 23, 24, 27; x. 11, 12, 14, 18." },
  { t = "p", text = "III. The Lord Jesus hath, in this ordinance, appointed his ministers to declare his word of institution to the people, to pray, and bless the elements of bread and wine, and thereby to set them apart from a common to an holy use; and to take and break the bread, to take the cup, and (they communicating also themselves) to give both to the communicants;[^1958] but to none who are not then present in the congregation.[^1959]" },
  { t = "note", id = "1958", text = "Matt. xxvi. 26–28, and Mark xiv. 22–24, and Luke xxii. 19, 20, with 1 Cor. xi. 23–27." },
  { t = "note", id = "1959", text = "Acts xx. 7; 1 Cor. xi. 20." },
  { t = "p", text = "IV. Private masses, or receiving this sacrament by a priest, or any other, alone;[^1962] as likewise the denial of the cup to the people;[^1963] worshiping the elements, the lifting them up, or carrying them about for adoration, and the reserving them for any pretended religious use, are all contrary to the nature of this sacrament, and to the institution of Christ.[^1964]" },
  { t = "note", id = "1962", text = "1 Cor. x. 6." },
  { t = "note", id = "1963", text = "Mark iv. 23; 1 Cor. xi. 25–29." },
  { t = "note", id = "1964", text = "Matt. xv. 9." },
  { t = "p", text = "V. The outward elements in this sacrament, duly set apart to the uses ordained by Christ, have such relation to him crucified, as that truly, yet sacramentally only, they are sometimes called by the name of the things they represent, to wit, the body and blood of Christ;[^1968] albeit, in substance and nature, they still remain truly, and only, bread and wine, as they were before.[^1970]" },
  { t = "note", id = "1968", text = "Matt. xxvi. 26–28." },
  { t = "note", id = "1970", text = "1 Cor. xi. 26–28; Matt. xxvi. 29." },
  { t = "p", text = "VI. That doctrine which maintains a change of the substance of bread and wine, into the substance of Christ's body and blood (commonly called transubstantiation) by consecration of a priest, or by any other way, is repugnant, not to Scripture alone, but even to common-sense and reason; overthroweth the nature of the sacrament; and hath been, and is the cause of manifold superstitions, yea, of gross idolatries.[^1972]" },
  { t = "note", id = "1972", text = "Acts iii. 21 with 1 Cor. xi. 24–26; Luke xxiv. 6, 39." },
  { t = "p", text = "VII. Worthy receivers, outwardly partaking of the visible elements in this sacrament,[^1974] do then also inwardly by faith, really and indeed, yet not carnally and corporally, but spiritually, receive and feed upon Christ crucified, and all benefits of his death: the body and blood of Christ being then not corporally or carnally in, with, or under the bread and wine; yet as really, but spiritually, present to the faith of believers in that ordinance, as the elements themselves are, to their outward senses.[^1975]" },
  { t = "note", id = "1974", text = "1 Cor. xi. 28; [Am. ed. 1 Cor. v. 7, 8]." },
  { t = "note", id = "1975", text = "1 Cor. x. 16; [Am. ed. 1 Cor. x. 3, 4]." },
  { t = "p", text = "VIII. Although ignorant and wicked men receive the outward elements in this sacrament, yet they receive not the thing signified thereby; but by their unworthy coming thereunto are guilty of the body andj blood of the Lord, to their own damnation. Wherefore all ignorant and ungodly persons, as they are unfit to enjoy communion with him, so are they unworthy of the Lord's table, and can not, without great sin against Christ, while they remain such, partake of these holy mysteries,[^1978] or be admitted thereunto.[^1979]" },
  { t = "note", id = "1978", text = "1 Cor. xi. 27–29; 2 Cor. vi. 14–16; [Am. ed. 1 Cor. x. 21]." },
  { t = "note", id = "1979", text = "1 Cor. v. 6, 7, 13; 2 Thess. iii. 6, 14, 15; Matt. vii. 6." },
]

[[section]]
id = "chapter-xxx-of-church-censures"
title = "Chapter XXX. Of Church Censures"
level = 1
blocks = [
  { t = "p", text = "I. The Lord Jesus, as king and head of his Church, hath therein appointed a government in the hand of Church officers, distinct from the civil magistrate.[^1982]" },
  { t = "note", id = "1982", text = "Isa. ix. 6, 7; 1 Tim. v. 17; 1 Thess. v. 12; Acts xx. 17, 28; Heb. xiii. 7, 17, 24; 1 Cor. xii. 28; Matt. xxviii. 18–20; [Am. ed. Psa. ii. 6–9; John xviii. 36]." },
  { t = "p", text = "II. To these officers the keys of the kingdom of heaven are committed, by virtue whereof they have power respectively to retain and remit sins, to shut that kingdom against the impenitent, both by the Word and censures; and to open it unto penitent sinners, by the ministry of the gospel, and by absolution from censures, as occasion shall require.[^1984]" },
  { t = "note", id = "1984", text = "Matt. xvi. 19; xviii. 17, 18; John xx. 21–23; 2 Cor. ii. 6–8." },
  { t = "p", text = "III. Church censures are necessary for the reclaiming and gaining of offending brethren; for deterring of others from the[^1986] like offenses; for purging out of that leaven which might infect the whole lump; for vindicating the honor of Christ, and the holy profession of the gospel; and for preventing the wrath of God, which might justly fall upon the Church, if they should suffer his covenant, and the seals thereof, to be profaned by notorious and obstinate offenders.[^1987]" },
  { t = "note", id = "1986", text = "[Am. ed. omits *the*.]" },
  { t = "note", id = "1987", text = "1 Cor. chap. v.; 1 Tim. v. 20; Matt. vii. 6; 1 Tim. i. 20; 1 Cor. xi. 27 to the end, with Jude 23." },
  { t = "p", text = "IV. For the better attaining of these ends, the officers of the Church are to proceed by admonition, suspension from the Sacrament of the Lord's Supper for a season, and by excommunication from the Church, according to the nature of the crime and demerit of the person.[^1989]" },
  { t = "note", id = "1989", text = "1 Thess. v. 12; 2 Thess. iii. 6, 14, 15; 1 Cor. v. 4, 5, 13; Matt. xviii. 17; Tit. iii. 10." },
]

[[section]]
id = "chapter-xxxi-of-synods-and-councils"
title = "Chapter XXXI. Of Synods and Councils"
level = 1
blocks = [
  { t = "p", text = "I. For the better government and further edification of the Church, there ought to be such assemblies as are commonly called synods or councils.[^1991]" },
  { t = "note", id = "1991", text = "Acts xv. 2, 4, 6." },
  { t = "p", text = "The American edition here adds the following:" },
  { t = "p", text = "[*And it belongeth to the overseers and other rulers of the particular churches, by virtue of their office, and the power which Christ hath given them for edification, and not for destruction, to appoint such assemblies* (Acts xv.)*; and to convene together in them, as often as they shall judge it expedient for the good of the Church* (Acts xv. 22, 23, 25).]" },
  { t = "p", text = "II. As magistrates may lawfully call a synod of ministers and other fit persons to consult and advise with about matters of religion;[^1993] so, if magistrates be open enemies to the Church, the ministers of Christ, of themselves, by virtue of their office, or they, with other fit persons, upon delegation from their churches, may meet together in such assemblies.[^1994]&[^1995]" },
  { t = "note", id = "1993", text = "Isa. xlix. 23; 1 Tim. ii. 1, 2; 2 Chron. xix. 8–11; chaps. xxix., xxx.; Matt. ii. 4, 5; Prov. xi. 14." },
  { t = "note", id = "1994", text = "Acts xv. 2, 4, 22, 23, 25." },
  { t = "note", id = "1995", text = "[Am. ed. omits this whole section.]" },
  { t = "p", text = "III. [II.] It belongeth to synods and councils, ministerially, to determine controversies of faith, and cases of conscience; to set down rules and directions for the better ordering of the public worship of God, and government of his Church; to receive complaints in cases of maladministration, and authoritatively to determine the same: which decrees and determinations, if consonant to the Word of God, are to be received with reverence and submission, not only for their agreement with the Word, but also for the power whereby they are made, as being an ordinance of God, appointed thereunto in his Word.[^1998]" },
  { t = "note", id = "1998", text = "Acts xv. 15, 19, 24, 27–31; xvi. 4; Matt. xviii. 17–20." },
  { t = "p", text = "IV. [III.] All synods or councils since the apostles' times, whether general or particular, may err, and many have erred; therefore they are not to be made the rule of faith or practice, but to be used as a help in both.[^2000]" },
  { t = "note", id = "2000", text = "Eph. ii. 20; Acts xvii. 11; 1 Cor. ii. 5; 2 Cor. i. 24." },
  { t = "p", text = "V. [IV.] Synods and councils are to handle or conclude nothing but that which is ecclesiastical: and are not to intermeddle with civil affairs which concern the commonwealth, unless by way of humble petition in cases extraordinary; or by way of advice for satisfaction of conscience, if they be thereunto required by the civil magistrate.[^2002]" },
  { t = "note", id = "2002", text = "Luke xii. 13, 14; John xviii. 36." },
]

[[section]]
id = "chapter-xxxii-of-the-state-of-men-after-death-and-of-the-res"
title = "Chapter XXXII. Of the State of Men after Death, and of the Resurrection of the Dead"
level = 1
blocks = [
  { t = "h", text = "Chapter XXXII. *Of the State of Men*[^2004] *after Death, and of the Resurrection of the Dead*." },
  { t = "note", id = "2004", text = "[Am. ed. has *Man*.]" },
  { t = "p", text = "I. The bodies of men, after death, return to dust, and see corruption;[^2005] but their souls (which neither die nor sleep), having an immortal subsistence, immediately return to God who gave them.[^2006] The souls of the righteous, being then made perfect in holiness, are received into the highest heavens, where they behold the face of God in light and glory, waiting for the full redemption of their bodies:[^2009] and the souls of the wicked are cast into hell, where they remain in torments and utter darkness, reserved to the judgment of the great day.[^2010] Besides these two places for souls separated from their bodies, the Scripture acknowledgeth none." },
  { t = "note", id = "2005", text = "Gen. iii. 19; Acts xiii. 36." },
  { t = "note", id = "2006", text = "Luke xxiii. 43; Eccles. xii. 7." },
  { t = "note", id = "2009", text = "Heb. xii. 23; 2 Cor. v. 1, 6, 8; Phil. i. 23, with Acts iii. 21 and Eph. iv. 10; [Am. ed. 1 John iii. 2]." },
  { t = "note", id = "2010", text = "Luke xvi. 23, 24; Acts i. 25; Jude 6, 7; 1 Pet. iii. 19." },
  { t = "p", text = "II. At the last day, such as are found alive shall not die, but be changed;[^2013] and all the dead shall be raised up with the self-same bodies, and none other, although with different qualities, which shall be united again to their souls forever.[^2014]" },
  { t = "note", id = "2013", text = "1 Thess. iv. 17; 1 Cor. xv. 51, 52." },
  { t = "note", id = "2014", text = "Job xix. 26, 27; 1 Cor. xv. 42–44." },
  { t = "p", text = "III. The bodies of the unjust shall, by the power of Christ, be raised to dishonor; the bodies of the just, by his Spirit, unto honor, and be made conformable to his own glorious body.[^2017]" },
  { t = "note", id = "2017", text = "Acts xxiv. 15; John v. 28, 29; 1 Cor. xv. 42; Phil. iii. 21." },
]

[[section]]
id = "chapter-xxxiii-of-the-last-judgment"
title = "Chapter XXXIII. Of the Last Judgment"
level = 1
blocks = [
  { t = "p", text = "I. God hath appointed a day wherein he will judge the world in righteousness by Jesus Christ,[^2019] to whom all power and judgment is given of the Father.[^2021] In which day, not only the apostate angels shall be judged,[^2022] but likewise all persons, that have lived upon earth, shall appear before the tribunal of Christ, to give an account of their thoughts, words, and deeds; and to receive according to what they have done in the body, whether good or evil.[^2023]" },
  { t = "note", id = "2019", text = "Acts xvii. 31." },
  { t = "note", id = "2021", text = "John v. 22, 27." },
  { t = "note", id = "2022", text = "1 Cor. vi. 3; Jude 6; 2 Pet. ii. 4." },
  { t = "note", id = "2023", text = "2 Cor. v. 10; Eccles. xii. 14; Rom. ii. 16; xiv. 10, 12; Matt. xii. 36, 37." },
  { t = "p", text = "II. The end of God's appointing this day, is for the manifestation of the glory of his mercy in the eternal salvation of the elect;[^2027] and of his justice in the damnation of the reprobate, who are wicked and disobedient.[^2028] For then shall the righteous go into everlasting life, and receive that fullness of joy and refreshing which shall come from the presence of the Lord:[^2029] but the wicked, who know not God, and obey not the gospel of Jesus Christ, shall be cast into eternal torments, and be punished with everlasting destruction from the presence of the Lord, and from the glory of his power.[^2030]" },
  { t = "note", id = "2027", text = "Rom. ix. 23; Matt. xxv. 21." },
  { t = "note", id = "2028", text = "Rom. ii. 5, 6; 2 Thess. i. 7, 8; Rom. ix. 22." },
  { t = "note", id = "2029", text = "Matt. xxv. 31–34; Acts iii. 19; 2 Thess. i. 7." },
  { t = "note", id = "2030", text = "Matt. xxv. 41, 46; 2 Thess. i. 9; [Am. ed. Isa. lxvi. 24]." },
  { t = "p", text = "III. As Christ would have us to be certainly persuaded that there shall be a day of judgment, both to deter all men from sin, and for the greater consolation of the godly in their adversity:[^2032] so will he have that day unknown to men, that they may shake off all carnal security, and be always watchful, because they know not at what hour the Lord will come; and may be ever prepared to say, Come, Lord Jesus, come quickly.[^2033] Amen." },
  { t = "note", id = "2032", text = "2 Pet. iii. 11, 14; 2 Cor. v. 10, 11; 2 Thess. i. 5–7; Luke xxi. 27, 28; Rom. viii. 23–25." },
  { t = "note", id = "2033", text = "Matt. xxiv. 36, 42–44; Mark xiii. 35–37; Luke xii. 35, 36; Rev. xxii. 20." },
  { t = "p", text = "Charles Herle, *Prolocutor*." },
  { t = "p", text = "Cornelius Burges, *Assessor*." },
  { t = "p", text = "Herbert Palmer, *Assessor.*" },
  { t = "p", text = "Henry Robroughe, *Scriba*." },
  { t = "p", text = "Adoniram Byfield, *Scriba*." },
]

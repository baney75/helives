[[section]]
id = "introductory-letter"
title = "Introductory Letter"
level = 1
blocks = [
  { t = "p", text = "To the most Reverend Father in Christ and most illustrious Lord, Albert, Archbishop and Primate of the Churches of Magdeburg and Mentz, Marquis of Brandenburg, etc., his lord and pastor in Christ, most gracious and worthy of all fear and reverence—" },
  { t = "h", text = "Jesus." },
  { t = "p", text = "The grace of God be with you, and whatsoever it is and can do." },
  { t = "p", text = "Spare me, most reverend Father in Christ, most illustrious Prince, if I, the very dregs of humanity, have dared to think of addressing a letter to the eminence of your sublimity. The Lord Jesus is my witness that, in the consciousness of my own pettiness and baseness, I have long put off the doing of that which I have now hardened my forehead to perform, moved thereto most especially by the sense of that faithful duty which I feel that I owe to your most reverend Fatherhood in Christ. May your Highness then in the meanwhile deign to cast your eyes upon one grain of dust, and, in your pontifical clemency, to understand my prayer." },
  { t = "p", text = "Papal indulgences are being carried about, under your most distinguished authority, for the building of St. Peter’s. In respect of these I do not so much accuse the extravagant sayings of the preachers, which I have not heard, but I grieve at the very false ideas which the people conceive from them, and which are spread abroad in common talk on every side—namely, that unhappy souls believe that, if they buy letters of indulgences, they are sure of their salvation; also, that, as soon as they have thrown their contribution into the chest, souls forthwith fly out of purgatory; and furthermore, that so great is the grace thus conferred, that there is no sin so great—even, as they say, if, by an impossibility, any one had violated the Mother of God—but that it may be pardoned; and again, that by these indulgences a man is freed from all punishment and guilt." },
  { t = "p", text = "O gracious God! it is thus that the souls committed to your care, most excellent Father, are being taught unto their death, and a most severe account, which you will have to render for all of them, is growing and increasing. Hence I have not been able to keep silence any longer on this subject, for by no function of a bishop’s office can a man become sure of salvation, since he does not even become sure through the grace of God infused into him, but the Apostle bids us to be ever working out our salvation in fear and trembling. (Phil. ii. 12.) Even the righteous man—says Peter—shall scarcely be saved. (1 Pet. iv. 18.) In fine, so narrow is the way which leads unto life, that the Lord, speaking by the prophets Amos and Zachariah, calls those who are to be saved brands snatched from the burning, and our Lord everywhere declares the difficulty of salvation." },
  { t = "p", text = "Why then, by these false stories and promises of pardon, do the preachers of them make the people to feel secure and without fear? since indulgences confer absolutely no good on souls as regards salvation or holiness, but only take away the outward penalty which was wont of old to be canonically imposed." },
  { t = "p", text = "Lastly, works of piety and charity are infinitely better than indulgences, and yet they do not preach these with such display or so much zeal; nay, they keep silence about them for the sake of preaching pardons. And yet it is the first and sole duty of all bishops, that the people should learn the Gospel and Christian charity: for Christ nowhere commands that indulgences should be preached. What a dreadful thing it is then, what peril to a bishop, if, while the Gospel is passed over in silence, he permits nothing but the noisy outcry of indulgences to be spread among his people, and bestows more care on these than on the Gospel! Will not Christ say to them: “Straining at a gnat, and swallowing a camel”?" },
  { t = "p", text = "Besides all this, most reverend Father in the Lord, in that instruction to the commissaries which has been put forth under the name of your most reverend Fatherhood it is stated—doubtless without the knowledge and consent of your most reverend Fatherhood—that one of the principal graces conveyed by indulgences is that inestimable gift of God, by which man is reconciled to God, and all the pains of purgatory are done away with; and further, that contrition is not necessary for those who thus redeem souls or buy confessional licences." },
  { t = "p", text = "But what can I do, excellent Primate and most illustrious Prince, save to entreat your reverend Fatherhood, through the Lord Jesus Christ, to deign to turn on us the eye of fatherly care, and to suppress that advertisement altogether and impose on the preachers of pardons another form of preaching, lest perchance some one should at length arise who will put forth writings in confutation of them and of their advertisements, to the deepest reproach of your most illustrious Highness. It is intensely abhorrent to me that this should be done, and yet I fear that it will happen, unless the evil be speedily remedied." },
  { t = "p", text = "This faithful discharge of my humble duty I entreat that your most illustrious Grace will deign to receive in a princely and bishoplike spirit—that is, with all clemency—even as I offer it with a most faithful heart, and one most devoted to your most reverend Fatherhood, since I too am part of your flock. May the Lord Jesus keep your most reverend Fatherhood for ever and ever. Amen." },
  { t = "p", text = "From Wittemberg, on the eve of All Saints, in the year 1517." },
  { t = "p", text = "If it so please your most reverend Fatherhood, you may look at these Disputations, that you may perceive how dubious a matter is that opinion about indulgences, which they disseminate as if it were most certain." },
  { t = "p", text = "To your most reverend Fatherhood." },
  { t = "p", text = "Martin Luther." },
]

[[section]]
id = "disputation-of-dr-martin-luther-concerning-penitence-and-ind"
title = "Disputation of Dr. Martin Luther Concerning Penitence and Indulgences"
level = 1
blocks = [
  { t = "p", text = "In the desire and with the purpose of elucidating the truth, a disputation will be held on the underwritten propositions at Wittemberg, under the presidency of the Reverend Father Martin Luther, Monk of the Order of St. Augustine, Master of Arts and of Sacred Theology, and ordinary Reader of the same in that place. He therefore asks those who cannot be present and discuss the subject with us orally, to do so by letter in their absence. In the name of our Lord Jesus Christ. Amen." },
  { t = "p", text = "1. Our Lord and Master Jesus Christ in saying: “Repent ye,”[^12] etc., intended that the whole life of believers should be penitence." },
  { t = "note", id = "12", text = "In the Latin, from the Vulgate, “*agite pœnitentiam,*” sometimes translated “Do penance.” The effect of the following theses depends to some extent on the double meaning of “*pœnitentia*”—penitence and penance." },
  { t = "p", text = "2. This word cannot be understood of sacramental penance, that is, of the confession and satisfaction which are performed under the ministry of priests." },
  { t = "p", text = "3. It does not, however, refer solely to inward penitence; nay such inward penitence is naught, unless it outwardly produces various mortifications of the flesh." },
  { t = "p", text = "4. The penalty[^13] thus continues as long as the hatred of self—that is, true inward penitence—continues; namely, till our entrance into the kingdom of heaven." },
  { t = "note", id = "13", text = "I.e. “*Pœna,*” the connection between “*pœna*” and “*pœnitentia*” being again suggestive." },
  { t = "p", text = "5. The Pope has neither the will nor the power to remit any penalties, except those which he has imposed by his own authority, or by that of the canons." },
  { t = "p", text = "6. The Pope has no power to remit any guilt, except by declaring and warranting it to have been remitted by God; or at most by remitting cases reserved for himself; in which cases, if his power were despised, guilt would certainly remain." },
  { t = "p", text = "7. God never remits any man’s guilt, without at the same time subjecting him, humbled in all things, to the authority of his representative the priest." },
  { t = "p", text = "8. The penitential canons are imposed only on the living, and no burden ought to be imposed on the dying, according to them." },
  { t = "p", text = "9. Hence the Holy Spirit acting in the Pope does well for us, in that, in his decrees, he always makes exception of the article of death and of necessity." },
  { t = "p", text = "10. Those priests act wrongly and unlearnedly, who, in the case of the dying, reserve the canonical penances for purgatory." },
  { t = "p", text = "11. Those tares about changing of the canonical penalty into the penalty of purgatory seem surely to have been sown while the bishops were asleep." },
  { t = "p", text = "12. Formerly the canonical penalties were imposed not after, but before absolution, as tests of true contrition." },
  { t = "p", text = "13. The dying pay all penalties by death, and are already dead to the canon laws, and are by right relieved from them." },
  { t = "p", text = "14. The imperfect soundness or charity of a dying person necessarily brings with it great fear, and the less it is, the greater the fear it brings." },
  { t = "p", text = "15. This fear and horror is sufficient by itself, to say nothing of other things, to constitute the pains of purgatory, since it is very near to the horror of despair." },
  { t = "p", text = "16. Hell, purgatory, and heaven appear to differ as despair, almost despair, and peace of mind differ." },
  { t = "p", text = "17. With souls in purgatory it seems that it must needs be that, as horror diminishes, so charity increases." },
  { t = "p", text = "18. Nor does it seem to be proved by any reasoning or any scriptures, that they are outside of the state of merit or of the increase of charity." },
  { t = "p", text = "19. Nor does this appear to be proved, that they are sure and confident of their own blessedness, at least all of them, though we may be very sure of it." },
  { t = "p", text = "20. Therefore the Pope, when he speaks of the plenary remission of all penalties, does not mean simply of all, but only of those imposed by himself." },
  { t = "p", text = "21. Thus those preachers of indulgences are in error who say that, by the indulgences of the Pope, a man is loosed and saved from all punishment." },
  { t = "p", text = "22. For in fact he remits to souls in purgatory no penalty which they would have had to pay in this life according to the canons." },
  { t = "p", text = "23. If any entire remission of all penalties can be granted to any one, it is certain that it is granted to none but the most perfect, that is, to very few." },
  { t = "p", text = "24. Hence the greater part of the people must needs be deceived by this indiscriminate and high-sounding promise of release from penalties." },
  { t = "p", text = "25. Such power as the Pope has over purgatory in general, such has every bishop in his own diocese, and every curate in his own parish, in particular." },
  { t = "p", text = "26. The Pope acts most rightly in granting remission to souls, not by the power of the keys (which is of no avail in this case) but by the way of suffrage." },
  { t = "p", text = "27. They preach man, who say that the soul flies out of purgatory as soon as the money thrown into the chest rattles." },
  { t = "p", text = "28. It is certain that, when the money rattles in the chest, avarice and gain may be increased, but the suffrage of the Church depends on the will of God alone." },
  { t = "p", text = "29. Who knows whether all the souls in purgatory desire to be redeemed from it, according to the story told of Saints Severinus and Paschal." },
  { t = "p", text = "30. No man is sure of the reality of his own contrition, much less of the attainment of plenary remission." },
  { t = "p", text = "31. Rare as is a true penitent, so rare is one who truly buys indulgences—that is to say, most rare." },
  { t = "p", text = "32. Those who believe that, through letters of pardon, they are made sure of their own salvation, will be eternally damned along with their teachers." },
  { t = "p", text = "33. We must especially beware of those who say that these pardons from the Pope are that inestimable gift of God by which man is reconciled to God." },
  { t = "p", text = "34. For the grace conveyed by these pardons has respect only to the penalties of sacramental satisfaction, which are of human appointment." },
  { t = "p", text = "35. They preach no Christian doctrine, who teach that contrition is not necessary for those who buy souls out of purgatory or buy confessional licences." },
  { t = "p", text = "36. Every Christian who feels true compunction has of right plenary remission of pain and guilt, even without letters of pardon." },
  { t = "p", text = "37. Every true Christian, whether living or dead, has a share in all the benefits of Christ and of the Church, given him by God, even without letters of pardon." },
  { t = "p", text = "38. The remission, however, imparted by the Pope is by no means to be despised, since it is, as I have said, a declaration of the Divine remission." },
  { t = "p", text = "39. It is a most difficult thing, even for the most learned theologians, to exalt at the same time in the eyes of the people the ample effect of pardons and the necessity of true contrition." },
  { t = "p", text = "40. True contrition seeks and loves punishment; while the ampleness of pardons relaxes it, and causes men to hate it, or at least gives occasion for them to do so." },
  { t = "p", text = "41. Apostolical pardons ought to be proclaimed with caution, lest the people should falsely suppose that they are placed before other good works of charity." },
  { t = "p", text = "42. Christians should be taught that it is not the mind of the Pope that the buying of pardons is to be in any way compared to works of mercy." },
  { t = "p", text = "43. Christians should be taught that he who gives to a poor man, or lends to a needy man, does better than if he bought pardons." },
  { t = "p", text = "44. Because, by a work of charity, charity increases, and the man becomes better; while, by means of pardons, he does not become better, but only freer from punishment." },
  { t = "p", text = "45. Christians should be taught that he who sees any one in need, and, passing him by, gives money for pardons, is not purchasing for himself the indulgences of the Pope, but the anger of God." },
  { t = "p", text = "46. Christians should be taught that, unless they have superfluous wealth, they are bound to keep what is necessary for the use of their own households, and by no means to lavish it on pardons." },
  { t = "p", text = "47. Christians should be taught that, while they are free to buy pardons, they are not commanded to do so." },
  { t = "p", text = "48. Christians should be taught that the Pope, in granting pardons, has both more need and more desire that devout prayer should be made for him, than that money should be readily paid." },
  { t = "p", text = "49. Christians should be taught that the Pope’s pardons are useful, if they do not put their trust in them, but most hurtful, if through them they lose the fear of God." },
  { t = "p", text = "50. Christians should be taught that, if the Pope were acquainted with the exactions of the preachers of pardons, he would prefer that the Basilica of St. Peter should be burnt to ashes, than that it should be built up with the skin, flesh, and bones of his sheep." },
  { t = "p", text = "51. Christians should be taught that, as it would be the duty, so it would be the wish of the Pope, even to sell, if necessary, the Basilica of St. Peter, and to give of his own money to very many of those from whom the preachers of pardons extract money." },
  { t = "p", text = "52. Vain is the hope of salvation through letters of pardon, even if a commissary—nay, the Pope himself—were to pledge his own soul for them." },
  { t = "p", text = "53. They are enemies of Christ and of the Pope, who, in order that pardons may be preached, condemn the word of God to utter silence in other churches." },
  { t = "p", text = "54. Wrong is done to the word of God when, in the same sermon, an equal or longer time is spent on pardons than on it." },
  { t = "p", text = "55. The mind of the Pope necessarily is that, if pardons, which are a very small matter, are celebrated with single bells, single processions, and single ceremonies, the Gospel, which is a very great matter, should be preached with a hundred bells, a hundred processions, and a hundred ceremonies." },
  { t = "p", text = "56. The treasures of the Church, whence the Pope grants indulgences, are neither sufficiently named nor known among the people of Christ." },
  { t = "p", text = "57. It is clear that they are at least not temporal treasures, for these are not so readily lavished, but only accumulated, by many of the preachers." },
  { t = "p", text = "58. Nor are they the merits of Christ and of the saints, for these, independently of the Pope, are always working grace to the inner man, and the cross, death, and hell to the outer man." },
  { t = "p", text = "59. St. Lawrence said that the treasures of the Church are the poor of the Church, but he spoke according to the use of the word in his time." },
  { t = "p", text = "60. We are not speaking rashly when we say that the keys of the Church, bestowed through the merits of Christ, are that treasure." },
  { t = "p", text = "61. For it is clear that the power of the Pope is alone sufficient for the remission of penalties and of reserved cases." },
  { t = "p", text = "62. The true treasure of the Church is the Holy Gospel of the glory and grace of God." },
  { t = "p", text = "63. This treasure, however, is deservedly most hateful, because it makes the first to be last." },
  { t = "p", text = "64. While the treasure of indulgences is deservedly most acceptable, because it makes the last to be first." },
  { t = "p", text = "65. Hence the treasures of the Gospel are nets, wherewith of old they fished for the men of riches." },
  { t = "p", text = "66. The treasures of indulgences are nets, wherewith they now fish for the riches of men." },
  { t = "p", text = "67. Those indulgences, which the preachers loudly proclaim to be the greatest graces, are seen to be truly such as regards the promotion of gain." },
  { t = "p", text = "68. Yet they are in reality in no degree to be compared to the grace of God and the piety of the cross." },
  { t = "p", text = "69. Bishops and curates are bound to receive the commissaries of apostolical pardons with all reverence." },
  { t = "p", text = "70. But they are still more bound to see to it with all their eyes, and take heed with all their ears, that these men do not preach their own dreams in place of the Pope’s commission." },
  { t = "p", text = "71. He who speaks against the truth of apostolical pardons, let him be anathema and accursed." },
  { t = "p", text = "72. But he, on the other hand, who exerts himself against the wantonness and licence of speech of the preachers of pardons, let him be blessed." },
  { t = "p", text = "73. As the Pope justly thunders against those who use any kind of contrivance to the injury of the traffic in pardons," },
  { t = "p", text = "74. Much more is it his intention to thunder against those who, under the pretext of pardons, use contrivances to the injury of holy charity and of truth." },
  { t = "p", text = "75. To think that Papal pardons have such power that they could absolve a man even if—by an impossibility—he had violated the Mother of God, is madness." },
  { t = "p", text = "76. We affirm on the contrary that Papal pardons cannot take away even the least of venial sins, as regards its guilt." },
  { t = "p", text = "77. The saying that, even if St. Peter were now Pope, he could grant no greater graces, is blasphemy against St. Peter and the Pope." },
  { t = "p", text = "78. We affirm on the contrary that both he and any other Pope has greater graces to grant, namely, the Gospel, powers, gifts of healing, etc. (1 Cor. xii. 9.)" },
  { t = "p", text = "79. To say that the cross set up among the insignia of the Papal arms is of equal power with the cross of Christ, is blasphemy." },
  { t = "p", text = "80. Those bishops, curates, and theologians who allow such discourses to have currency among the people, will have to render an account." },
  { t = "p", text = "81. This licence in the preaching of pardons makes it no easy thing, even for learned men, to protect the reverence due to the Pope against the calumnies, or, at all events, the keen questionings of the laity." },
  { t = "p", text = "82. As for instance:—Why does not the Pope empty purgatory for the sake of most holy charity and of the supreme necessity of souls—this being the most just of all reasons—if he redeems an infinite number of souls for the sake of that most fatal thing money, to be spent on building a basilica—this being a very slight reason?" },
  { t = "p", text = "83. Again; why do funeral masses and anniversary masses for the deceased continue, and why does not the Pope return, or permit the withdrawal of the funds bequeathed for this purpose, since it is a wrong to pray for those who are already redeemed?" },
  { t = "p", text = "84. Again; what is this new kindness of God and the Pope, in that, for money’s sake, they permit an impious man and an enemy of God to redeem a pious soul which loves God, and yet do not redeem that same pious and beloved soul, out of free charity, on account of its own need?" },
  { t = "p", text = "85. Again; why is it that the penitential canons, long since abrogated and dead in themselves in very fact and not only by usage, are yet still redeemed with money, through the granting of indulgences, as if they were full of life?" },
  { t = "p", text = "86. Again; why does not the Pope, whose riches are at this day more ample than those of the wealthiest of the wealthy, build the one Basilica of St. Peter with his own money, rather than with that of poor believers?" },
  { t = "p", text = "87. Again; what does the Pope remit or impart to those who, through perfect contrition, have a right to plenary remission and participation?" },
  { t = "p", text = "88. Again; what greater good would the Church receive if the Pope, instead of once, as he does now, were to bestow these remissions and participations a hundred times a day on any one of the faithful?" },
  { t = "p", text = "89. Since it is the salvation of souls, rather than money, that the Pope seeks by his pardons, why does he suspend the letters and pardons granted long ago, since they are equally efficacious." },
  { t = "p", text = "90. To repress these scruples and arguments of the laity by force alone, and not to solve them by giving reasons, is to expose the Church and the Pope to the ridicule of their enemies, and to make Christian men unhappy." },
  { t = "p", text = "91. If then pardons were preached according to the spirit and mind of the Pope, all these questions would be resolved with ease; nay, would not exist." },
  { t = "p", text = "92. Away then with all those prophets who say to the people of Christ: “Peace, peace,” and there is no peace." },
  { t = "p", text = "93. Blessed be all those prophets, who say to the people of Christ: “The cross, the cross,” and there is no cross." },
  { t = "p", text = "94. Christians should be exhorted to strive to follow Christ their head through pains, deaths, and hells." },
  { t = "p", text = "95. And thus trust to enter heaven through many tribulations, rather than in the security of peace." },
]

[[section]]
id = "protestation"
title = "Protestation"
level = 1
blocks = [
  { t = "p", text = "I, Martin Luther, Doctor, of the Order of Monks at Wittemberg, desire to testify publicly that certain propositions against pontifical indulgences, as they call them, have been put forth by me. Now although, up to the present time, neither this most celebrated and renowned school of ours, nor any civil or ecclesiastical power has condemned me, yet there are, as I hear, some men of headlong and audacious spirit, who dare to pronounce me a heretic, as though the matter had been thoroughly looked into and studied. But on my part, as I have often done before, so now too I implore all men, by the faith of Christ, either to point out to me a better way, if such a way has been divinely revealed to any, or at least to submit their opinion to the judgment of God and of the Church. For I am neither so rash as to wish that my sole opinion should be preferred to that of all other men, nor so senseless as to be willing that the word of God should be made to give place to fables, devised by human reason." },
]

[[section]]
id = "questions-1-and-2"
title = "Questions 1 and 2"
level = 1
blocks = [
  { t = "p", text = "**Question 1.** What is thy only comfort in life and in death?" },
  { t = "p", text = "**Answer.** That I, with body and soul, both in life and in death, am not my own, but belong to my faithful Saviour Jesus Christ, who with his precious blood has fully satisfied for all my sins, and redeemed me from all the power of the devil; and so preserves me that without the will of my Father in heaven not a hair can fall from my head; yea, that all things must work together for my salvation. Wherefore, by his Holy Spirit, he also assures me of eternal life, and makes me heartily willing and ready henceforth to live unto him." },
  { t = "p", text = "**Question 2.** How many things are necessary for thee to know, that thou in this comfort mayest live and die happily?" },
  { t = "p", text = "**Answer.** Three things: First, the greatness of my *sin* and *misery*. Second, how I am *redeemed* from all my sins and misery. Third, how I am to be *thankful* to God for such redemption." },
]

[[section]]
id = "the-first-part-of-man-s-misery"
title = "The First Part. Of Man's Misery"
level = 1
blocks = [
  { t = "p", text = "**Question 3.** Whence knowest thou thy misery?" },
  { t = "p", text = "**Answer.** Out of the Law of God." },
  { t = "p", text = "**Question 4.** What does the Law of God require of us?" },
  { t = "p", text = "**Answer.** This Christ teaches us in sum, Matt 22: *Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind, and with all thy strength. This is the first and great commandmen; and the second is like unto it: Thou shalt love thy neighbor as thyself.—On these two commandments hang all the law and the prophets.*" },
  { t = "p", text = "**Question 5.** Canst thou keep all this perfectly?" },
  { t = "p", text = "**Answer.** No; for I am by nature prone to hate God and my neighbor." },
  { t = "p", text = "**Question 6.** Did God create man thus wicked and perverse?" },
  { t = "p", text = "**Answer.** No; but God created man good, and after his own image—that is, in righteousness and true holiness; that he might rightly know God his Creator, heartily love him, and live with him in eternal blessedness, to praise and glorify him." },
  { t = "p", text = "**Question 7.** Whence, then, comes this depraved nature of man?" },
  { t = "p", text = "**Answer.** From the fall and disobedience of our first parents, Adam and Eve, in Paradise, whereby our nature became so corrupt that we are all conceived and born in sin." },
  { t = "p", text = "**Question 8.** But are we so far depraved that we are wholly unapt to any good, and prone to all evil?" },
  { t = "p", text = "**Answer.** Yes; unless we are born again by the Spirit of God." },
  { t = "p", text = "**Question 9.** Does not God, then, wrong man by requiring of him in his law that which he can not perform?" },
  { t = "p", text = "**Answer.** No; for God so made man that he could perform it; but man, through the instigation of the devil, by willful disobedience deprived himself and all his posterity of this power." },
  { t = "p", text = "**Question 10.** Will God suffer such disobedience and apostasy to go unpunished?" },
  { t = "p", text = "**Answer.** By no means; but he is terribly displeased with our inborn as well as actual sins, and will punish them in just judgment in time and eternity, as he has declared: *Cursed is every one that continueth not in all things which are written in the book of the law, to do them.*" },
  { t = "p", text = "**Question 11.** Is, then, God not also merciful?" },
  { t = "p", text = "**Answer.** God is indeed merciful, but he is likewise just; wherefore his justice requires that sin, which is committed against the most high majesty of God, be also punished with extreme, that is, with everlasting punishment both of body and soul." },
]

[[section]]
id = "the-second-part-of-man-s-redemption"
title = "The Second Part. Of Man's Redemption"
level = 1
blocks = [
  { t = "p", text = "**Question 12.** Since, then, by the righteous judgment of God we deserve temporal and eternal punishment, what is required that we may escape this punishment and be again received into favor?" },
  { t = "p", text = "**Answer.** God wills that his justice be satisfied; therefore must we make full satisfaction to the same, either by ourselves or by another." },
  { t = "p", text = "**Question 13.** Can we ourselves make this satisfaction?" },
  { t = "p", text = "**Answer.** By no means; on the contrary, we daily increase our guilt." },
  { t = "p", text = "**Question 14.** Can any mere creature make satisfaction for us?" },
  { t = "p", text = "**Answer.** None; for, first, God will not punish, in any other creature, that of which man has made himself guilty; and, further, no mere creature can sustain the burden of God's eternal wrath against sin, and redeem others therefrom." },
  { t = "p", text = "**Question 15.** What manner of mediator and redeemer, then, must we seek?" },
  { t = "p", text = "**Answer.** One who is a true and sinless man, and yet more powerful than all creatures; that is, one who is at the same time true God." },
  { t = "p", text = "**Question 16.** Why must he be a true and sinless man?" },
  { t = "p", text = "**Answer.** Because the justice of God requires that the same human nature which has sinned should make satisfaction for sin; but no man, being himself a sinner, could satisfy for others." },
  { t = "p", text = "**Question 17.** Why must he be at the same time true God?" },
  { t = "p", text = "**Answer.** That by the power of his Godhead he might bear, in his manhood, the burden of God's wrath, and so obtain for and restore to us righteousness and life." },
  { t = "p", text = "**Question 18.** But who, now, is that mediator, who is at the same time true God and a true, sinless man?" },
  { t = "p", text = "**Answer.** Our Lord *Jesus Christ,* who is freely given unto ns for complete redemption and righteousness." },
  { t = "p", text = "**Question 19.** Whence knowest thou this?" },
  { t = "p", text = "**Answer.** From the Holy Gospel, which God himself first revealed in Paradise, afterwards proclaimed by the holy Patriarchs and Prophets, and foreshadowed by the sacrifices and other ceremonies of the law, and finally fulfilled by his well-beloved Son." },
  { t = "p", text = "**Question 20.** Are all men, then, saved by Christ, as they have perished by Adam?" },
  { t = "p", text = "**Answer.** No; only such as by true faith are ingrafted into him, and receive all his benefits." },
  { t = "p", text = "**Question 21.** What is true faith?" },
  { t = "p", text = "**Answer.** It is not only a certain knowledge whereby I hold for truth all that God has revealed to us in his Word, but also a hearty trust which the Holy Ghost works in me by the Gospel, that not only to others, but to me also, forgiveness of sins, everlasting righteousness and salvation, are freely given by God, merely of grace, only for the sake of Christ's merits." },
  { t = "p", text = "**Question 22.** What is it, then, necessary for a Christian to believe?" },
  { t = "p", text = "**Answer.** All that is promised us in the Gospel, which the articles of our catholic, undoubted Christian faith teach us in sum." },
  { t = "p", text = "**Question 23.** What are these Articles?" },
  { t = "p", text = "**Answer.** *I believe in God the Father Almighty, Maker of heaven and earth.*" },
  { t = "p", text = "*And in Jesus Christ, his only-begotten Son, our Lord: who was conceived by the Holy Ghost, born of the Virgin Mary; suffered under Pontius Pilate, was crucified, dead, and buried; he descended into Hades; the third day he rose from the dead; he ascended into Heaven, and sitteth at the right hand of God the Father Almighty; from, thence he shall come to judge the quick and the dead.*" },
  { t = "p", text = "*I believe in the Holy Ghost; the holy Catholic Church; the communion of saints; the forgiveness of sins; the resurrection of the body, and the life everlasting.*" },
  { t = "p", text = "**Question 24.** How are these Articles divided?" },
  { t = "p", text = "**Answer.** Into three parts: The first is of *God the Father* and our *creation*; the second, of *God the Son* and our *redemption*; the third, of *God the Holy Ghost* and our *sanctification.*" },
  { t = "p", text = "**Question 25.** Since there is but one Divine Being, why speakest thou of three, Father, Son, and Holy Ghost?" },
  { t = "p", text = "**Answer.** Because God has so revealed himself in his Word that these three distinct Persons are the one, true, eternal God." },
  { t = "h", text = "OF GOD THE FATHER." },
  { t = "p", text = "**Question 26.** What dost thon believe when thou sayest: *I believe in God the Father Almighty, Maker of Heaven and Earth?*" },
  { t = "p", text = "**Answer.** That the eternal Father of our Lord Jesus Christ, who of nothing made heaven and earth, with all that in them is, who likewise upholds and governs the same by his eternal counsel and providence, is for the sake of Christ his Son my God and my Father, in whom I so trust as to have no doubt that he will provide me with all things necessary for body and soul; and further, that whatever evil he sends upon me in this vale of tears, he will turn to my good; for he is able to do it, being Almighty God, and willing also, being a faithful Father." },
  { t = "p", text = "**Question 27.** What dost thou understand by the Providence of God?" },
  { t = "p", text = "**Answer.** The almighty and every where present power of God, whereby, as it were by his hand, he still upholds heaven and earth, with all creatures, and so governs them that herbs and grass, rain and drought, fruitful and barren years, meat and drink, health and sickness, riches and poverty, yea, all things, come not by chance, but by his fatherly hand." },
  { t = "p", text = "**Question 28.** What does it profit us to know that God has created, and by his providence still upholds all things?" },
  { t = "p", text = "**Answer.** That we may be patient in adversity, thankful in prosperity, and for what is future have good confidence in our faithful God and Father that no creature shall separate us from his love, since all creatures are so in his hand that without his will they can not so much as move." },
  { t = "h", text = "OF GOD THE SON." },
  { t = "p", text = "**Question 29.** Why is the Son of God called *Jesus*, that is, *Saviour*?" },
  { t = "p", text = "**Answer.** Because he saves us from our sins; and no salvation is to be either sought or found in any other." },
  { t = "p", text = "**Question 30.** Do such, then, believe in the only Saviour Jesus who seek their salvation and welfare of saints, of themselves, or any where else?" },
  { t = "p", text = "**Answer.** No; although they may make their boast of him, yet in act they deny the only Saviour Jesus. For either Jesus is not a complete Saviour, or they who by true faith receive this Saviour must have in him all that is necessary to their salvation." },
  { t = "p", text = "**Question 31.** Why is he called *Christ*, that is, *Anointed*?" },
  { t = "p", text = "**Answer.** Because he is ordained of God the Father, and anointed with the Holy Ghost, to be our chief Prophet and Teacher, who fully reveals to us the secret counsel and will of God concerning our redemption; and our only High Priest, who by the one sacrifice of his body has redeemed us, and ever liveth to make intercession for us with the Father; and our eternal King, who governs us by his Word and Spirit, and defends and preserves us in the redemption obtained for us." },
  { t = "p", text = "**Question 32.** But why art *thou* called a Christian?" },
  { t = "p", text = "**Answer.** Because by faith I am a member of Christ, and thus a partaker of his anointing; in order that I also may confess his name, may present myself a living sacrifice of thankfulness to him, and may with free conscience fight against sin and the devil in this life, and hereafter, in eternity, reign with him over all creatures." },
  { t = "h", text = "Question33." },
  { t = "p", text = "Why is he called God's *only-begotten Son,* since we also are the children of God?" },
  { t = "p", text = "**Answer.** Because Christ alone is the eternal natural Son of God; but we are children of God by adoption through grace for his sake." },
  { t = "p", text = "**Question 34.** Why callest thou him *our Lord*?" },
  { t = "p", text = "**Answer.** Because, not with silver or gold, but with his precious blood, he has redeemed and purchased us, body and soul, from sin and from all the power of the devil, to be his own." },
  { t = "p", text = "**Question 35.** What is the meaning of *Conceived by the Holy Ghost, born of the Virgin Mary*?" },
  { t = "p", text = "**Answer.** That the eternal Son of God, who is and continues true and eternal God, took upon him the very nature of man, of the flesh and blood of the Virgin Mary, by the operation of the Holy Ghost, so that he also might be the true seed of David, like unto his brethren in all things, sin excepted." },
  { t = "p", text = "**Question 36.** What benefit dost thou receive from the holy conception and birth of Christ?" },
  { t = "p", text = "**Answer.** That he is our Mediator, and with his innocence and perfect holiness covers, in the sight of God, my sin wherein I was conceived." },
  { t = "p", text = "**Question 37.** What dost thou understand by the word *Suffered*?" },
  { t = "p", text = "**Answer.** That all the time he lived on earth, but especially at the end of his life, he bore, in body and soul, the wrath of God against the sin of the whole human race, in order that by his passion, as the only atoning sacrifice, he might redeem our body and soul from everlasting damnation, and obtain for us the grace of God, righteousness, and eternal life." },
  { t = "p", text = "**Question 38.** Why did he suffer under *Pontius Pilate*, as judge?" },
  { t = "p", text = "**Answer.** That he, being innocent, might be condemned by the temporal judge, and thereby deliver us from the severe judgment of God to which we were exposed." },
  { t = "p", text = "**Question 39.** Is there any thing more in his having been crucified than if he had died some other death?" },
  { t = "p", text = "**Answer.** Yes; for thereby I am assured that he took on himself the curse which lay upon me, because the death of the cross was accursed of God." },
  { t = "p", text = "**Question 40.** Why was it necessary for Christ to suffer death?" },
  { t = "p", text = "**Answer.** Because, by reason of the justice and truth of God, satisfaction for our sins could be made no other wise than by the death of the Son of God." },
  { t = "p", text = "**Question 41.** Why was he buried?" },
  { t = "p", text = "**Answer.** To show thereby that he was really dead." },
  { t = "p", text = "**Question 42.** Since, then, Christ died for us, why must we also die?" },
  { t = "p", text = "**Answer.** Our death is not a satisfaction for our sin, but only a dying to sins and entering into eternal life." },
  { t = "p", text = "**Question 43.** What further benefit do we receive from the sacrifice and death of Christ on the cross?" },
  { t = "p", text = "**Answer.** That by his power our old man is with him crucified, slain, and buried; that so the evil lusts of the flesh may no more reign in us, but that we may offer ourselves unto him a sacrifice of thanksgiving." },
  { t = "p", text = "**Question 44.** Why is it added: *He descended into Hades?*[^182]" },
  { t = "note", id = "182", text = "In the Apostles' Creed, *Hell* has the meaning of *Hades,* or the state and place of departed spirits; but the Heidelberg Catechism explains the descent figuratively of the vicarious sufferings on the cross." },
  { t = "p", text = "**Answer.** That in my greatest temptations I may be assured that Christ, my Lord, by his inexpressible anguish, pains, and terrors which he suffered in his soul on the cross and before, has redeemed me from the anguish and torment of hell." },
  { t = "p", text = "**Question 45.** What benefit do we receive from the resurrection of Christ?" },
  { t = "p", text = "**Answer.** First, by his resurrection he has overcome death, that he might make us partakers of the righteousness which by his death he has obtained for us. Secondly, we also are now by his power raised up to a new life. Thirdly the resurrection of Christ is to us a sure pledge of our blessed resurrection." },
  { t = "p", text = "**Question 46.** How dost thon understand the words, *He ascended into Heaven?*" },
  { t = "p", text = "**Answer.** That Christ, in sight of his disciples, was taken up from the earth into heaven, and in our behalf there continues, until he shall come again to judge the living and the dead." },
  { t = "p", text = "**Question 47.** Is not, then, Christ with us even unto the end of the world, as he has promised?" },
  { t = "p", text = "**Answer.** Christ is true Man and true God: according to his human nature, he is now not upon earth; but according to his Godhead, majesty, grace, and Spirit, he is at no time absent from us." },
  { t = "p", text = "**Question 48.** But are not, in this way, the two natures in Christ separated from one another, if the Manhood be not wherever the Godhead is?" },
  { t = "p", text = "**Answer.** By no means; for since the Godhead is incomprehensible and every where present, it must follow that it is indeed beyond the bounds of the Manhood which it has assumed, but is yet none the less in the same also, and remains personally united to it." },
  { t = "p", text = "**Question 49.** What benefit do we receive from Christi ascension into heaven?" },
  { t = "p", text = "**Answer.** First, that he is our Advocate in the presence of his Father in heaven. Secondly, that we have our flesh in heaven, as a sure pledge that he, as the Head, will also take us, his members, up to himself. Thirdly, that he sends us his Spirit, as an earnest, by whose power we seek those things which are above, where Christ sitteth on the right hand of God, and not things on the earth." },
  { t = "p", text = "**Question 50.** Why is it added, *And sitteth at the right hand of God?*" },
  { t = "p", text = "**Answer.** Because Christ ascended into heaven for this end, that he might there appear as Head of his Church, by whom the Father governs all things." },
  { t = "p", text = "**Question 51.** What benefit do we receive from this glory of our Head, Christ?" },
  { t = "p", text = "**Answer.** First, that by his Holy Spirit he sheds forth heavenly gifts in us, his members; then, that by his power he defends and preserves us against all enemies." },
  { t = "p", text = "**Question 52.** What comfort is it to thee that Christ *shall come again to judge the quick and the dead?*" },
  { t = "p", text = "**Answer.** That in all my sorrows and persecutions, with uplifted head, I look for the self-same One who has before offered himself for me to the judgment of God, and removed from me all curse, to come again as Judge from heaven; who shall cast all his and my enemies into everlasting condemnation, but shall take me, with all his chosen ones, to himself, into heavenly joy and glory." },
  { t = "h", text = "OF GOD THE HOLY GHOST." },
  { t = "p", text = "**Question 53.** What dost thou believe concerning the *Holy Ghost?*" },
  { t = "p", text = "**Answer.** First, that he is co-eternal God with the Father and the Son. Secondly, that he is also given unto me, makes me by a true faith partaker of Christ and all his benefits, comforts me, and shall abide with me forever." },
  { t = "p", text = "**Question 54.** What dost thou believe concerning the *Holy Catholic Church?*" },
  { t = "p", text = "**Answer.** That out of the whole human race, from the beginning to the end of the world, the Son of God, by his Spirit and Word, gathers, defends, and preserves for himself unto everlasting life, a chosen communion in the unity of the true faith; and that I am, and forever shall remain, a living member of the same." },
  { t = "p", text = "**Question 55.** What dost thou understand by the *communion of saints?*" },
  { t = "p", text = "**Answer.** First, that believers, all and every one, as members of Christ, have part in him and in all his treasures and gifts. Secondly, that each one must feel himself bound to use his gifts, readily and cheerfully, for the advantage and welfare of other members." },
  { t = "p", text = "**Question 56.** What dost thou believe concerning the *forgiveness of sins?*" },
  { t = "p", text = "**Answer.** That God, for the sake of Christ's satisfaction, will no more remember my sins, neither the sinful nature with which I have to struggle all my life long; but graciously imparts to me the righteousness of Christ, that I may nevermore come into condemnation." },
  { t = "p", text = "**Question 57.** What comfort does the *resurrection of the body afford thee?*" },
  { t = "p", text = "**Answer.** That not only my soul, after this life, shall be immediately taken up to Christ its Head, but also that this my body, raised by the power of Christ, shall again be united with my soul, and made like unto the glorious body of Christ." },
  { t = "p", text = "**Question 58.** What comfort hast thou from the article of the life everlasting?" },
  { t = "p", text = "**Answer.** That, inasmuch as I now feel in my heart the beginning of eternal joy, I shall after this life possess complete bliss, such as eye hath not seen, nor ear heard, neither hath entered into the heart of man, therein to praise God forever." },
  { t = "p", text = "**Question 59.** But what does it help thee now that thou believest all this?" },
  { t = "p", text = "**Answer.** That I am righteous in Christ before God, and an heir of eternal life." },
  { t = "p", text = "**Question 60.** How art thou righteous before God?" },
  { t = "p", text = "**Answer.** Only by true faith in Jesus Christ; that is, although my conscience accuse me that I have grievously sinned against all the commandments of God, and have never kept any of them, and that I am still prone always to all evil, yet God, without any merit of mine, of mere grace, grants and imputes to me the perfect satisfaction, righteousness, and holiness of Christ, as if I had never committed nor had any sin, and had myself accomplished all the obedience which Christ has fulfilled for me, if only I accept such benefit with a believing heart." },
  { t = "p", text = "**Question 61.** Why sayest thou that thou art righteous only by faith?" },
  { t = "p", text = "**Answer.** Not that I am acceptable to God on account of the worthiness of my faith; but because only the satisfaction, righteousness, and holiness of Christ is my righteousness before trod, and I can receive the same and make it my own in no other way than by faith only." },
  { t = "p", text = "**Question 62.** But why can not our good works be the whole or part of oar righteousness before God?" },
  { t = "p", text = "**Answer.** Because the righteousness which can stand before the judgment-seat of God must be perfect throughout, and wholly conformable to the divine law; whereas even our best works in this life are all imperfect and defiled with sin." },
  { t = "p", text = "**Question 63.** How is it that our good works merit nothing, while yet it is God's will to reward them in this life and in that which is to come?" },
  { t = "p", text = "**Answer.** The reward comes not of merit, but of grace." },
  { t = "p", text = "**Question 64.** But does not this doctrine make men careless and profane?" },
  { t = "p", text = "**Answer.** No; for it is impossible that those who are implanted into Christ by true faith should not bring forth fruits of righteousness." },
  { t = "h", text = "OF THE HOLY SACRAMENTS." },
  { t = "p", text = "**Question 65.** Since, then, we are made partakers of Christ and all his benefits by faith only, whence comes this faith?" },
  { t = "p", text = "**Answer.** The Holy Ghost works it in our hearts by the preaching of the holy Gospel, and confirms it by the use of the holy Sacraments." },
  { t = "p", text = "**Question 66.** What are the Sacraments?" },
  { t = "p", text = "**Answer.** The Sacraments are visible, holy signs and seals, appointed of God for this end, that by the use thereof he may the more fully declare and seal to us the promise of the Gospel; namely, that he grants us out of free grace the forgiveness of sins and everlasting life, for the sake of the one sacrifice of Christ accomplished on the cross." },
  { t = "p", text = "**Question 67.** Are both these, then, the Word and the sacraments, designed to direct our faith to the sacrifice of Jesus Christ on the cross as the only ground of our salvation?" },
  { t = "p", text = "**Answer.** Yes, truly; for the Holy Ghost teaches in the Gospel, and by the holy Sacraments assures us, that our whole salvation stands in the one sacrifice of Christ made for us on the cross." },
  { t = "p", text = "**Question 68.** How many Sacraments has Christ appointed in the New Testament?" },
  { t = "p", text = "**Answer.** Two: holy Baptism and the holy Supper." },
  { t = "h", text = "OF HOLY BAPTISM." },
  { t = "p", text = "**Question 69.** How is it signified and sealed unto thee in holy Baptism that thou hast part in the one sacrifice of Christ on the cross?" },
  { t = "p", text = "**Answer.** Thus: that Christ has appointed this outward washing with water, and has joined therewith this promise, that I am washed with his blood and Spirit from the pollution of my soul, that is, from all my sins, as certainly as I am washed outwardly with water whereby commonly the filthiness of the body is taken away." },
  { t = "p", text = "**Question 70.** What is it to be washed with the blood and Spirit of Christ?" },
  { t = "p", text = "**Answer.** It is to have the forgiveness of sins from God, through grace, for the sake of Christ's blood, which he shed for us in his sacrifice on the cross; and also to be renewed by the Holy Ghost, and sanctified to be members of Christ, that so we may more and more die unto sin, and lead holy and unblamable lives." },
  { t = "p", text = "**Question 71.** Where has Christ promised that we are as certainly washed with his blood and Spirit as with the water of Baptism?" },
  { t = "p", text = "**Answer.** In the institution of Baptism, which runs thus: *Go ye, therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost. He. that believeth and is baptized, shall be saved y but he that believeth not, shall be damned.* This promise is also repeated where the Scripture calls Baptism the washing of regeneration and the washing away of sins." },
  { t = "p", text = "**Question 72.** Is, then, the outward washing of water itself the washing away of sins?" },
  { t = "p", text = "**Answer.** No; for only the blood of Jesus Christ and the Holy Spirit cleanse us from all sin." },
  { t = "p", text = "**Question 73.** Why, then, doth the Holy Ghost call Baptism the washing of regeneration and the washing away of sins?" },
  { t = "p", text = "**Answer.** God speaks thus not without great cause: namely, not only to teach us thereby that like as the filthiness of the body is taken away by water, so our sins also are taken away by the blood and Spirit of Christ; but much more, that by this divine pledge and token he may assure us that we are as really washed from our sins spiritually as our bodies are washed with water." },
  { t = "p", text = "**Question 74.** Are infants also to be baptized?" },
  { t = "p", text = "**Answer.** Yes; for since they, as well as their parents, belong to the covenant and people of God, and both redemption from sin and the Holy Ghost, who works faith, are through the blood of Christ promised to them no less than to their parents, they are also by Baptism, as a sign of the covenant, to be ingrafted into the Christian Church, and distinguished from the children of unbelievers, as was done in the Old Testament by Circumcision, in place of which in the New Testament Baptism is appointed." },
  { t = "h", text = "OF THE HOLY SUPPER OF THE LORD." },
  { t = "p", text = "**Question 75.** How is it signified and sealed unto thee in the Holy Supper that thon dost partake of the one sacrifice of Christ on the cross and all his benefits?" },
  { t = "p", text = "**Answer.** Thus, that Christ has commanded me and all believers to eat of this broken bread, and to drink of this cup, and has joined therewith these promises: First, that his body was offered and broken on the cross for me, and his blood shed for me, as certainly as I see with my eyes the bread of the *Lord* broken for me, and the cup communicated to me; and, further, that with his crucified body and shed blood he himself feeds and nourishes my soul to everlasting life, as certainly as I receive from the hand of the minister, and taste with my mouth, the bread and cup of the *Lord*, which are given me as certain tokens of the body and blood of Christ." },
  { t = "p", text = "**Question 76.** What is it to eat the crucified body and drink the shed blood of Christ?" },
  { t = "p", text = "**Answer.** It is not only to embrace with a believing heart all the sufferings and death of Christ, and thereby to obtain the forgiveness of sins and life eternal, but moreover, also, to be so united more and more to his sacred body by the Holy Ghost, who dwells both in Christ and in us, that although he is in heaven, and we on the earth, we are nevertheless flesh of his flesh and bone of his bones, and live and are governed forever by one Spirit, as members of the same body are by one soul." },
  { t = "p", text = "**Question 77.** Where has Christ promised that he will thus feed and nourish believers with his body and blood, as certainly as they eat of this broken bread and drink of this cup?" },
  { t = "p", text = "**Answer.** In the institution of the Supper, which runs thus: *The Lord Jesus, the same night in which he was betrayed, took bread; and when he had given thanks, he brake it and said: 'Take, eat, this is my body, which is broken for you; this do in remembrance of me' After the same manner also he took the cup, when he had supped, saying: 'This cup is the New Testament in my blood; this do ye as often as ye drink it, in remembrance of me. For as often as ye eat this bread, and drink this cup, ye do show the Lord's death till he come.'* And this promise is repeated also by St. Paul, where he says: *The cup of* *blessing which we bless, is it not the communion of the blood of Christ? The bread which we break, is it not the communion of the body of Christ? For we, being many, are one bread, and one body; for we are all partakers of that one bread.*" },
  { t = "p", text = "**Question 78.** Do, then, the bread and wine become the real body and blood of Christ?" },
  { t = "p", text = "**Answer.** No; but as the water in Baptism is not changed into the blood of Christ, nor becomes the washing away of sins itself, being only the divine token and assurance thereof, so also in the Lord's Supper the sacred bread does not become the body of Christ itself, though agreeably to the nature and usage of sacraments it is called the body of Christ." },
  { t = "p", text = "**Question 79.** Why, then, doth Christ call the bread his body, and the cup his blood, or the New Testament in his blood; and St. Paul, the communion of the body and blood of Christ?" },
  { t = "p", text = "**Answer.** Christ speaks thus not without great cause: namely, not only to teach us thereby that like as bread and wine sustain this temporal life, so also his crucified body and shed blood are the true meat and drink of our souls unto life eternal; but much more, by this visible sign and pledge to assure us that we are as really partakers of his true body and blood, through the working of the Holy Ghost, as we receive by the mouth of the body these holy tokens in remembrance of him; and that all his sufferings and obedience are as certainly our own as if we had ourselves suffered and done all in our own persons." },
  { t = "h", text = "(Question 80." },
  { t = "p", text = "What difference is there between the Lord's Supper and the Popish Mass?" },
  { t = "p", text = "**Answer.** The Lord's Supper testifies to us that we have full forgiveness of all our sins by the one sacrifice of Jesus Christ, which he himself has once accomplished on the cross; [and that by the Holy Ghost we are ingrafted into Christ, who with his true body is now in heaven at the right hand of the Father, and is to be there worshiped]. But the Mass teaches that the living and the dead have not forgiveness of sins through the sufferings of Christ unless Christ is still daily offered for them by the priests; [and that Christ is bodily under the form of bread and wine, and is therefore to be worshiped in them]. And thus the Mass at bottom is nothing else than a denial of the one sacrifice and passion of Jesus Christ [and an accursed idolatry].)[^184]" },
  { t = "note", id = "184", text = "This 80th Question, as is now ascertained beyond controversy, is no part of the original Heidelberg Catechism, and was inserted by express order of the Elector Frederick III., as a counterblast to the anathemas of the Council of Trent (which closed December 4, 1563). It appeared in part in the second edition, and the passages in brackets were added in the third, with the remark at the close: 'What in the first edition was overlooked, especially on p. 55 [the place for the 80th Question in the first edition], has now been added by command of his Electoral Grace.' For further information on this famous Question, which caused even a temporary prohibition of the Catechism in the German Empire, see Vol. I., and my German edition of the Heidelberg Catechism." },
  { t = "p", text = "**Question 81.** Who are to come unto the table of the Lord?" },
  { t = "p", text = "**Answer.** Those who are displeased with themselves for their sins, yet trust that these are forgiven them, and that their remaining infirmity is covered by the passion and death of Christ; who also desire more and more to strengthen their faith and amend their life. But the impenitent and hypocrites eat and drink judgment to themselves." },
  { t = "p", text = "**Question 82.** Are they, then, also to be admitted to this Supper who show themselves to be, by their confession and life, unbelieving and ungodly?" },
  { t = "p", text = "**Answer.** No; for by this the covenant of God is profaned, and his wrath provoked against the whole congregation; wherefore the Christian Church is bound, according to the order of Christ and his Apostles, by the office of the keys to exclude such person until they amend their life." },
  { t = "p", text = "**Question 83.** What is the Office of the Keys?" },
  { t = "p", text = "**Answer.** The preaching of the holy Gospel and Church discipline; by which two things the kingdom of heaven is opened to believers and shut against unbelievers." },
  { t = "p", text = "**Question 84.** How is the kingdom of heaven opened and shut by the preaching of the holy Gospel?" },
  { t = "p", text = "**Answer.** In this way: that, according to the command of Christ, it is proclaimed and openly witnessed to believers, one and all, that as often as they accept with true faith the promise of the Gospel, all their sins are really forgiven them of God for the sake of Christ's merits; and on the contrary, to all unbelievers and hypocrites, that the wrath of God and eternal condemnation abide on them so long as they are not converted: according to which witness of the Gospel will be the judgment of God, both in this life and in that which is to come." },
  { t = "p", text = "**Question 85.** How is the kingdom of heaven shut and opened by Church discipline?" },
  { t = "p", text = "**Answer.** In this way: that, according to the command of Christ, if any under the Christian name show themselves unsound either in doctrine or life, and after repeated brotherly admonition refuse to turn from their errors or evil ways, they are complained of to the Church or to its proper officers, and, if they neglect to hear them also, are by them excluded from the holy Sacraments and the Christian communion, and by God himself from the kingdom of Christ; and if they promise and show real amendment, they are again received as members of Christ and his Church." },
]

[[section]]
id = "the-third-part-of-thankfulness"
title = "The Third Part. Of Thankfulness"
level = 1
blocks = [
  { t = "p", text = "**Question 86.** Since, then, we are redeemed from our misery by grace through Christ, without any merit of ours, why must we do good works?" },
  { t = "p", text = "**Answer.** Because Christ, having redeemed us by his blood, renews us also by his holy Spirit after his own image, that with our whole life we may show ourselves thankful to God for his blessing, and that he may be glorified through us; then, also, that we ourselves may be assured of our faith by the fruits thereof, and by our godly walk may win our neighbors also to Christ." },
  { t = "p", text = "**Question 87.** Can they, then, not be saved who do not turn to God from their unthankful, impenitent life?" },
  { t = "p", text = "**Answer.** By no means; for, as the Scripture saith, no unchaste person, idolater, adulterer, thief, covetous man, drunkard, slanderer, robber, or any such like, shall inherit the kingdom of God." },
  { t = "p", text = "**Question 88.** In how many things does true repentance or conversion consist?" },
  { t = "p", text = "**Answer.** In two things: the dying of the old man, and the quickening of the new." },
  { t = "p", text = "**Question 89.** What is the dying of the old man?" },
  { t = "p", text = "**Answer.** Heartfelt sorrow for sin; causing us to hate and turn from it always more and more." },
  { t = "p", text = "**Question 90.** What is the quickening of the new man?" },
  { t = "p", text = "**Answer.** Heartfelt joy in God; causing us to take delight in living according to the will of God in all good works." },
  { t = "p", text = "**Question 91.** But what are good works?" },
  { t = "p", text = "**Answer.** Those only which are done from true faith, according to the law of God, for his glory; and not such as rest on our own opinion or the commandments of men." },
  { t = "p", text = "**Question 92.** What is the law of God?" },
  { t = "p", text = "**Answer.** God spake all these words, saying:" },
  { t = "h", text = "FIRST COMMANDMENT." },
  { t = "p", text = "*I am the Lord thy God, which have brought thee out of the land of Egypt, out of the house of bondage. Thou shalt have no other gods before me.*" },
  { t = "h", text = "SECOND COMMANDMENT." },
  { t = "p", text = "*Thou shalt not make unto thee any graven image, or any likeness of any thing that is in heaven above, or that is in the earth beneath, or that is in the water under the earth; thou shalt not bow down thyself to them, nor serve them. For I the Lord thy God am a jealous God, visiting the iniquity of the fathers upon the children unto the third and fourth generation of them that hate me; and showing mercy unto thousands of them that love me and keep my commandments.*" },
  { t = "h", text = "THIRD COMMANDMENT." },
  { t = "p", text = "*Thou shalt not take the name of the Lord thy God in vain; for the Lord will not hold him guiltless that taketh his name in vain.*" },
  { t = "h", text = "FOURTH COMMANDMENT." },
  { t = "p", text = "*Remember the Sabbath day to keep it holy. Six days shalt thon labor, and do all thy work: but the seventh day is the Sabbath of the Lord thy God; in it thou shalt not do any work, thou, nor thy son, nor thy daughter, thy man-servant, nor thy maid-servant, nor thy cattle, nor the stranger that is within thy gates. For in six days the Lord made heaven and earth, the sea, and all that in them is, and rested the seventh day; wherefore the Lord blessed the Sabbath day, and hallowed it.*" },
  { t = "h", text = "FIFTH COMMANDMENT." },
  { t = "p", text = "*Honor thy father and thy mother; that thy days may be long upon the land which the Lord thy God giveth thee.*" },
  { t = "h", text = "SIXTH COMMANDMENT." },
  { t = "p", text = "*Thou shalt not kill.*" },
  { t = "h", text = "SEVENTH COMMANDMENT." },
  { t = "p", text = "*Thou shalt not commit adultery.*" },
  { t = "h", text = "EIGHTH COMMANDMENT." },
  { t = "p", text = "*Thou shalt not steal.*" },
  { t = "h", text = "NINTH COMMANDMENT." },
  { t = "p", text = "*Thou shalt not bear false witness against thy neighbor.*" },
  { t = "h", text = "TENTH COMMANDMENT." },
  { t = "p", text = "*Thou shalt not covet thy neighbor's house; thou shalt not covet thy neighbor's wife, nor his man-servant,* *nor his maidservant, nor his ox, nor his ass, nor any thing that is thy neighbor's.*" },
  { t = "p", text = "**Question 93.** How are these Commandments divided?" },
  { t = "p", text = "**Answer.** Into two tables: the first of which teaches us, in four commandments, what duties we owe to God; the second, in six, what duties we owe to our neighbor." },
  { t = "p", text = "**Question 94.** What does God require in the first commandment?" },
  { t = "p", text = "**Answer.** That, on peril of my soul's salvation, I avoid and flee all idolatry, sorcery, enchantments, invocation of saints or of other creatures; and that I rightly acknowledge the only true God, trust in him alone, with all humility and patience expect all good from him only, and love, fear, and honor him with my whole heart; so as rather to renounce all creatures than do the least thing against his will." },
  { t = "p", text = "**Question 95.** What is idolatry?" },
  { t = "p", text = "**Answer.** It is, instead of the one true God who has revealed himself in his Word, or along with the same, to conceive or have something else on which to place our trust." },
  { t = "p", text = "**Question 96.** What does God require in the second commandment?" },
  { t = "p", text = "**Answer.** That we in nowise make any image of God, nor worship him in any other way than he has commanded in his Word." },
  { t = "p", text = "**Question 97.** Must we, then, not make any image at all?" },
  { t = "p", text = "**Answer.** God may not and can not be imaged in any way; as for creatures, though they may indeed be imaged, yet God forbids the making or keeping any likeness of them, either to worship them, or by them to serve himself." },
  { t = "p", text = "**Question 98.** But may not pictures be tolerated in churches as books for the laity?" },
  { t = "p", text = "**Answer.** No; for we should not be wiser than God, who will not have his people taught by dumb idols, but by the lively preaching of his Word." },
  { t = "p", text = "**Question 99.** What is required in the third commandment?" },
  { t = "p", text = "**Answer.** That we must not by cursing, or by false swearing, nor yet by unnecessary oaths, profane or abuse the name of God; nor even by our silence and connivance be partakers of these horrible sins in others; and in sum, that we use the holy name of God no otherwise than with fear and reverence, so that he may be rightly confessed and worshiped by us, and be glorified in all our words and works." },
  { t = "p", text = "**Question 100.** Is, then, the profaning of God's name, by swearing and cursing, so grievous a sin that his wrath is kindled against those also who seek not, as much as in them lies, to hinder and forbid the same?" },
  { t = "p", text = "**Answer.** Yes, truly; for no sin is greater or more provoking to God than the profaning of his name. Wherefore he even commanded it to be punished with death." },
  { t = "p", text = "**Question 101.** But may we not swear by the name of God in a religious manner?" },
  { t = "p", text = "**Answer.** Yes; when the magistrate requires it, or it may be needful otherwise to maintain arid promote fidelity and truth, to the glory of God and our neighbor's good. For such swearing is grounded in God's Word, and therefore was rightly used by the saints in the Old and New Testament." },
  { t = "p", text = "**Question 102.** May we swear by the saints or any other creatures?" },
  { t = "p", text = "**Answer.** No; for a lawful oath is a calling upon God, as the only searcher of hearts, to bear witness to the truth, and to punish me if I swear falsely; which honor is due to no creature." },
  { t = "p", text = "**Question 103.** What does God require in the fourth commandment?" },
  { t = "p", text = "**Answer.** In the first place, that the ministry of the Gospel and schools be maintained; and that I, especially on the day. of rest, diligently attend church, to learn the Word of God, to use the holy Sacraments, to call publicly upon the Lord, and to give Christian alms. In the second place, that all the days of my life I rest from my evil works, allow the Lord to work in me by his Spirit, and thus begin in this life the everlasting Sabbath." },
  { t = "p", text = "**Question 104.** What does God require in the fifth commandment?" },
  { t = "p", text = "**Answer.** That I show all honor, love, and faithfulness to my father and mother, and to all in authority over me; submit myself with due obedience to all their good instruction and correction, and also bear patiently with their infirmities, since it is God's will to govern us by their hand." },
  { t = "p", text = "**Question 105.** What does God require in the sixth commandment?" },
  { t = "p", text = "**Answer.** That I neither in thought, nor in word or look, much less in deed, revile, hate, insult, or kill my neighbor, whether by myself or by another; but lay aside all desire of revenge: moreover, that I harm not myself, nor willfully run into any danger. Wherefore, also, to restrain murder, the magistrate is armed with the sword." },
  { t = "p", text = "**Question 106.** But this commandment speaks only of killing." },
  { t = "p", text = "**Answer.** In forbidding this, however, God means to teach ns that he abhors the root of murder—namely, envy, hatred, anger, and desire of revenge; and that all these are in his sight hidden murder." },
  { t = "p", text = "**Question 107.** Is it, then, enough that we do not kill our neighbor in any such way?" },
  { t = "p", text = "**Answer.** No; for in condemning envy, hatred, and anger, God requires us to love our neighbor as ourselves, to show patience, peace, meekness, mercy, and kindness towards him, and, so far as we have power, to prevent his hurt; also, to do good even unto our enemies." },
  { t = "p", text = "**Question 108.** What does the seventh commandment teach us?" },
  { t = "p", text = "**Answer.** That all unchastity is accursed of God; and that we should therefore loathe it from the heart, and live chastely and modestly, whether in holy wedlock or single life." },
  { t = "p", text = "**Question 109.** Does God in this commandment forbid nothing more than adultery, and such like gross sins?" },
  { t = "p", text = "**Answer.** Since our body and soul are both temples of the Holy Ghost, it is his will that we keep both pure and holy; for which reason he forbids all unchaste actions, gestures, words, thoughts, desires, and whatever may entice thereto." },
  { t = "p", text = "**Question 110.** What does God forbid in the eighth commandment." },
  { t = "p", text = "**Answer.** Not only such theft and robbery as are punished by the magistrate, but God views as theft also all wicked tricks and devices whereby we seek to draw to ourselves our neighbor's goods, whether by force or with show of right, such as unjust weights, ells, measures, wares, coins, usury, or any means forbidden of God; so, moreover, all covetousness, and all useless waste of his gifts." },
  { t = "p", text = "**Question 111.** But what does God require of thee in this commandment?" },
  { t = "p", text = "**Answer.** That I further my neighbor's good where I can and may, deal with him as I would have others deal with me, and labor faithfully that I may be able to help the poor in their need." },
  { t = "p", text = "**Question 112.** What is required in the ninth commandment?" },
  { t = "p", text = "**Answer.** That I bear false witness against no one; wrest no one's words; be no backbiter or slanderer; join in condemning no one unheard and rashly: but that I avoid, on pain of God's heavy wrath, all lying and deceit, as being the proper works of the devil; in matters of judgment and justice, and in all other affairs, love, honestly speak and confess the truth; and, so far as I can, defend and promote my neighbor's good name." },
  { t = "p", text = "**Question 113.** What is required in the tenth commandment?" },
  { t = "p", text = "**Answer.** That not even the least inclination or thought against any of God's commandments ever enter into our heart; but that, with our whole heart, we continually hate all sin, and take pleasure in all righteousness." },
  { t = "p", text = "**Question 114.** Can those who are converted to God keep these commandments perfectly?" },
  { t = "p", text = "**Answer.** No; but even the holiest men, while in this life, have only a small beginning of this obedience, yet so that with earnest purpose they begin to live, not only according to some, but according to all the commandments of God." },
  { t = "p", text = "**Question 115.** Why, then, doth God sp strictly enjoin upon us the ten commandments, since in this life no one can keep them?" },
  { t = "p", text = "**Answer.** First, that all our life long we may learn more and more to know our sinful nature, and so the more earnestly seek forgiveness of sins and righteousness in Christ; secondly, that we may continually strive and beg from God the grace of the Holy Ghost, so as to become more and more changed into the image of God, till we attain finally to full perfection after this life." },
  { t = "h", text = "OF PRAYER." },
  { t = "p", text = "**Question 116.** Why is prayer necessary for Christians?" },
  { t = "p", text = "**Answer.** Because it is the chief part of the thankfulness which God requires of us, and because God will give his grace and Holy Spirit only to such as earnestly and without ceasing beg them from him and render thanks unto him for them." },
  { t = "p", text = "**Question 117.** What belongs to such prayer as God is pleased with and will hear?" },
  { t = "p", text = "**Answer.** First, that from the heart we call only upon the one true God, who has revealed himself to us in his Word, for all that he has commanded us to ask of him; secondly, that we thoroughly know our need and misery, so as to humble ourselves before the face of his divine majesty; thirdly, that we be firmly assured that, notwithstanding our unworthiness, he will, for the sake of Christ our Lord, certainly hear our prayer, as he has promised us in his Word." },
  { t = "p", text = "**Question 118.** What has God commanded us to ask of him?" },
  { t = "p", text = "**Answer.** All things necessary for soul and body, which Christ our Lord has comprised in the prayer taught us by himself." },
  { t = "p", text = "**Question 119.** What is the *Lord's Prayer?*" },
  { t = "p", text = "**Answer.** *Our Father who art in heaven: Hallowed be thy name. Thy kingdom come. Thy will be done in earth, as it is in heaven. Give us this day our daily bread. And forgive us our debts, as we forgive our debtors. And lead us not into temptation, but deliver us from evil: For thine is the kingdom, and the power, and the glory, forever. Amen.*" },
  { t = "p", text = "**Question 120.** Why has Christ commanded us to address God thus: *Our Father?*" },
  { t = "p", text = "**Answer.** To awaken in us, at the very beginning of our prayer, that filial reverence and trust toward God which are to be the ground of our prayer; namely, that God has become our Father through Christ, and will much less deny us what we ask of him in faith than our parents refuse us earthly things." },
  { t = "p", text = "**Question 121.** Why is it added: *Who art in heaven?*" },
  { t = "p", text = "**Answer.** That we may have eo earthly thought of the heavenly majesty of God, and may expect from his almighty power all things necessary for body and soul." },
  { t = "p", text = "**Question 122.** What is the first petition?" },
  { t = "p", text = "**Answer.** *Hallowed be thy name.* That is: Enable us rightly to know thee, and to hallow, magnify, and praise thee in all thy works, in which shine forth thy power, wisdom, goodness, justice, mercy, and truth; and likewise so to order our whole life, in thought, word, and work, that thy name may not be blasphemed, but honored and praised on our account." },
  { t = "p", text = "**Question 123.** What is the second petition?" },
  { t = "p", text = "**Answer.** *Thy kingdom come.* That is: So govern us by thy Word and Spirit that we may submit ourselves unto thee always more and more; preserve and increase thy Church; destroy the works of the devil, every power that exalteth itself against thee, and all wicked devices formed against thy holy Word, until the full coming of thy kingdom, wherein thou shalt be all in all." },
  { t = "p", text = "**Question 124.** What is the third petition?" },
  { t = "p", text = "**Answer.** *Thy will be done in earth as it is in heaven.* That is: Grant that we and all men may renounce our own will, and yield ourselves, without gainsaying, to thy will, which alone is good; that so every one may fulfill his office and calling as willingly and truly as the angels do in heaven." },
  { t = "p", text = "**Question 125.** What is the fourth petition?" },
  { t = "p", text = "**Answer.** *Give us this day our daily bread.* That is: Be pleased to provide for all our bodily need, that we may thereby know that thou art the only fountain of all good, and that without thy blessing neither our care and labor nor thy gifts can profit us, and may therefore withdraw our trust from all creatures, and place it alone in thee." },
  { t = "p", text = "**Question 126.** What is the fifth petition?" },
  { t = "p", text = "**Answer.** *And forgive us our debts as we forgive our debtors.* That is: Be pleased, for the sake of Christ's blood, not to impute to us, miserable sinners, our manifold transgressions, nor the evil which still always cleaves to us; as we also find this witness of thy grace in us, that it is our full purpose heartily to forgive our neighbor." },
  { t = "p", text = "**Question 127.** What is the sixth petition?" },
  { t = "p", text = "**Answer.** *And lead us not into temptation, but deliver us from evil.* That is: Since we are so weak in ourselves that we can not stand a moment, while our deadly enemies—the devil, the world, and our own flesh—assail us without ceasing, be pleased to preserve and strengthen us by the power of thy Holy Spirit, that we may make firm stand against them, and not sink in this spiritual war, until we come off at last with complete victory." },
  { t = "p", text = "**Question 128.** How do you close this Prayer?" },
  { t = "p", text = "**Answer.** *For thine is the kingdom, and the power, and the glory, forever.* That is: All this we ask of thee, because as our King, having power over all things, thou art both willing and able to give us all good, and that thereby not we but thy holy name may be glorified forever." },
  { t = "p", text = "**Question 129.** What is the meaning of the word *Amen?*" },
  { t = "p", text = "**Answer.** *Amen* means: So shall it truly and surely be. For my prayer is much more certainly heard of God than I feel in my heart that I desire these things of him." },
]

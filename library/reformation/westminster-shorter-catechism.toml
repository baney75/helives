[[section]]
id = "questions-1-34"
title = "Questions 1-34"
level = 1
blocks = [
  { t = "p", text = "Question. 1. What is the chief end of man?" },
  { t = "p", text = "*Answer.* Man's chief end is to glorify God, and to enjoy him forever." },
  { t = "p", text = "Ques. 2. What rule hath God given to direct us how we may glorify and enjoy him?" },
  { t = "p", text = "*Ans.* The Word of God, which is contained in the Scriptures of the Old and New Testaments,[^2036] is the only rule to direct us how we may glorify and enjoy him." },
  { t = "note", id = "2036", text = "The London edition of 1658, Dunlop's Collection of 1719, and other editions read *Testament.*" },
  { t = "p", text = "Ques. 3. What do the Scriptures principally teach?" },
  { t = "p", text = "*Ans.* The Scriptures principally teach what man is to believe concerning God, and what duty God requires of man." },
  { t = "p", text = "Ques.4. What is GOD?" },
  { t = "p", text = "*Ans.* God is a Spirit, infinite, eternal, and unchangeable, in his being, wisdom, power, holiness, justice, goodness, and truth." },
  { t = "p", text = "*Ques.* 5. *Are there more Gods than one?*" },
  { t = "p", text = "*Ans.* There is but one only, the living and true God." },
  { t = "p", text = "*Ques.* 6. *How many persons are there in the Godhead?*" },
  { t = "p", text = "*Ans.* There are three persons in the Godhead: the Father, the Son, and the Holy Ghost; and these three are one God, the same in substance, equal in power and glory." },
  { t = "p", text = "*Ques.* 7. *What are the decrees of God?*" },
  { t = "p", text = "*Ans.* The decrees of God are his eternal purpose according to the counsel of his will, whereby, for his own glory, he hath fore-ordained whatsoever comes to pass." },
  { t = "p", text = "*Ques.* 8. *How doth God execute his decrees?*" },
  { t = "p", text = "*Ans.* God executeth his decrees in the works of creation and providence." },
  { t = "p", text = "*Ques.* 9. *What is the work of creation?*" },
  { t = "p", text = "*Ans.* The work of creation is God's making all things of nothing, by the word of his power, in the space of six days, and all very good." },
  { t = "p", text = "*Ques.* 10. *How did God create man?*" },
  { t = "p", text = "*Ans.* God created man, male and female, after his own image, in knowledge, righteousness, and holiness, with dominion over the creatures." },
  { t = "p", text = "*Ques.* 11. *What are God's works of providence?*" },
  { t = "p", text = "*Ans.* God's works of providence are his most holy, wise, and powerful preserving and governing all his creatures, and all their actions." },
  { t = "p", text = "*Ques.* 12. *What special act of providence did God exercise towards man, in the estate wherein he was created?*" },
  { t = "p", text = "*Ans.* When God had created man, he entered into a covenant of life with him, upon condition of perfect obedience; forbidding him to eat of the tree of knowledge of good and evil, upon pain of death." },
  { t = "p", text = "*Ques.* 13. *Did our first parents continue in the estate wherein they were created?*" },
  { t = "p", text = "*Ans.* Our first parents, being left to the freedom of their own will, fell from the estate wherein they were created, by sinning against God." },
  { t = "p", text = "*Ques.* 14. *What is sin?*" },
  { t = "p", text = "*Ans.* Sin is any want of conformity unto, or transgression of, the law of God." },
  { t = "p", text = "*Ques.* 15. What was the sin whereby our first parents fell from the estate wherein they were created?" },
  { t = "p", text = "*Ans.* The sin whereby our first parents fell from the estate wherein they were created, was their eating the forbidden fruit." },
  { t = "p", text = "*Ques.* 16. *Did all mankind fall in Adam's first transgression?*" },
  { t = "p", text = "*Ans.* The covenant being made with Adam, not only for himself, but for his posterity, all mankind descending from him by ordinary generation, sinned in him, and fell with him, in his first transgression." },
  { t = "p", text = "*Ques.* 17. *Into what estate did the fall bring mankind?*" },
  { t = "p", text = "*Ans.* The fall brought mankind into an estate of sin and misery." },
  { t = "p", text = "*Ques.* 18. *Wherein consists the sinfulness of that estate whereinto man fell?*" },
  { t = "p", text = "*Ans.* The sinfulness of that estate whereinto man fell, consists in the guilt of Adam's first sin, the want of original righteousness, and the corruption of his whole nature, which is commonly called original sin; together with all actual transgressions which proceed from it." },
  { t = "p", text = "*Ques.* 19. *What is the misery of that estate whereinto man fell?*" },
  { t = "p", text = "*Ans.* All mankind by their fall lost communion with God, are under his wrath and curse, and so made liable to all the[^2037] miseries in this life, to death itself, and to the pains of hell forever." },
  { t = "note", id = "2037", text = "Older editions omit *the*." },
  { t = "p", text = "*Ques.* 20. *Did God leave all mankind, to perish in the estate of sin and misery?*" },
  { t = "p", text = "*Ans.* God, having out of his mere good pleasure, from all eternity, elected some to everlasting life, did enter into a covenant of grace, to deliver them out of the estate of sin and misery, and to bring them into an estate of salvation by a Redeemer." },
  { t = "p", text = "*Ques.* 21. *Who is the Redeemer of God's elect?*" },
  { t = "p", text = "*Ans.* The only Redeemer of God's elect is the Lord Jesus Christ, who being the eternal Son of God became man, and so was, and continueth to be, God and man, in two distinct natures, and one person forever." },
  { t = "p", text = "*Ques.* 22. *How did Christ, being the Son of God, become man?*" },
  { t = "p", text = "*Ans.* Christ, the Son of God, became man, by taking to himself a true body, and a reasonable soul, being conceived by the power of the Holy Ghost, in the womb of the Virgin Mary, and born of her, yet without sin." },
  { t = "p", text = "*Ques.* 23. *What offices doth Christ execute as our Redeemer?*" },
  { t = "p", text = "*Ans.* Christ, as our Redeemer, executeth the offices of a Prophet, of a Priest, and of a King, both in his estate of humiliation and exaltation." },
  { t = "p", text = "*Ques.* 24. *How doth Christ execute the office of a Prophet?*" },
  { t = "p", text = "*Ans.* Christ executeth the office of a Prophet, in revealing to us by his Word and Spirit, the will of God for our salvation." },
  { t = "p", text = "*Ques.* 25. *How doth Christ execute the office of a Priest?*" },
  { t = "p", text = "*Ans.* Christ executeth the office of a Priest, in his once offering up of himself a sacrifice to satisfy divine justice, and reconcile us to God, and in[^2038] making continual intercession for us." },
  { t = "note", id = "2038", text = "Older editions omit in." },
  { t = "p", text = "*Ques.* 26. *How doth Christ execute the office of a King?*" },
  { t = "p", text = "*Ans.* Christ executeth the office of a King, in subduing us to himself, in ruling and defending us, and in[^2039] restraining and conquering all his and our enemies." },
  { t = "note", id = "2039", text = "Older editions omit in." },
  { t = "p", text = "*Ques.* 27. Wherein did Christ's humiliation consist?" },
  { t = "p", text = "*Ans.* Christ's humiliation consisted in his being born, and that in a low condition, made under the law, undergoing the miseries of this life, the wrath of God, and the cursed death of the cross; in being buried, and continuing under the power of death for a time." },
  { t = "p", text = "*Ques.* 28. *Wherein consisteth Christ's exaltation?*" },
  { t = "p", text = "*Ans.* Christ's exaltation consisteth in his rising again from the dead on the third day, in ascending up into heaven, in sitting at the right hand of God the Father, and in coming to judge the world at the last day." },
  { t = "p", text = "*Ques.* 29. *How are we made partakers of the redemption purchased by Christ?*" },
  { t = "p", text = "*Ans.* We are made partakers of the redemption purchased by Christ, by the effectual application of it to us by his Holy Spirit." },
  { t = "p", text = "*Ques.* 30. *How doth the Spirit apply to us the redemption purchased by Christ?*" },
  { t = "p", text = "*Ans.* The Spirit applieth to us the redemption purchased by Christ, by working faith in us, and thereby uniting us to Christ in our effectual calling." },
  { t = "p", text = "*Ques.* 31. *What is effectual calling?*" },
  { t = "p", text = "*Ans.* Effectual calling is the work of God's Spirit, whereby, convincing us of our sin and misery, enlightening our minds in the knowledge of Christ, and renewing our wills, he doth persuade and enable us to embrace Jesus Christ, freely offered to us in the gospel." },
  { t = "p", text = "*Ques.* 32. *What benefits do they* that are effectually called partake of in this life?" },
  { t = "p", text = "*Ans.* They that are effectually called do in this life partake of justification, adoption, sanctification, and the several benefits which, in this life, do either accompany or flow from them." },
  { t = "p", text = "*Ques.* 33. *What is justification?*" },
  { t = "p", text = "*Ans.* Justification is an act of God's free grace, wherein he pardoneth all our sins, and accepteth us as righteous in his sight, only for the righteousness of Christ imputed to us, and received by faith alone." },
  { t = "p", text = "*Ques.* 34. *What is adoption?*" },
  { t = "p", text = "*Ans.* Adoption is an act of God's free grace, whereby we are received into the number, and have a right to all the privileges, of the sons of God." },
]

[[section]]
id = "questions-35-64"
title = "Questions 35-64"
level = 1
blocks = [
  { t = "p", text = "*Ques.* 35. *What is sanctification?*" },
  { t = "p", text = "*Ans.* Sanctification is the work of God's free grace, whereby we are renewed in the whole man after the image of God, and are enabled more and more to die unto sin, and live unto righteousness." },
  { t = "p", text = "*Ques.* 36. *What are the benefits which in this life do accompany or flow from justification, adoption, and sanctification?*" },
  { t = "p", text = "*Ans.* The benefits which in this life do accompany or flow from justification, adoption, and sanctification, are, assurance of God's love, peace of conscience, joy in the Holy Ghost, increase of grace, and perseverance therein to the end." },
  { t = "p", text = "*Ques.* 37. *What benefits do believers receive from Christ at death?*" },
  { t = "p", text = "*Ans.* The souls of believers are, at their death, made perfect in holiness, and do immediately pass into glory; and their bodies, being still united to Christ, do rest in their graves till the resurrection." },
  { t = "p", text = "*Ques.* 38. *What benefits do believers receive from Christ at the resurrection?*" },
  { t = "p", text = "*Ans.* At the resurrection, believers being raised up in glory, shall be openly acknowledged and acquitted in the day of judgment, and made perfectly blessed in the full enjoying of God to all eternity." },
  { t = "p", text = "*Ques.* 39. *What is the duty which God requireth of man?*" },
  { t = "p", text = "*Ans.* The duty which God requireth of man is obedience to his revealed will." },
  { t = "p", text = "*Ques.* 40. *What did God at first reveal to man for the rule of his obedience?*" },
  { t = "p", text = "*Ans.* The rule which God at first revealed to man, for his obedience, was the moral law." },
  { t = "p", text = "*Ques.* 41. *Wherein is the moral law summarily comprehended?*" },
  { t = "p", text = "*Ans.* The moral law is summarily comprehended in the ten commandments." },
  { t = "p", text = "*Ques.* 42. *What is the sum of the ten commandments?*" },
  { t = "p", text = "*Ans.* The sum of the ten commandments is, to love the Lord our God with all our heart, with all our soul, with all our strength, and with all our mind; and our neighbor as ourselves." },
  { t = "p", text = "*Ques.* 43. *What is the preface to the ten commandments?*" },
  { t = "p", text = "*Ans.* The preface to the ten commandments is in these words: *I am the Lord thy God, which brought thee out of the land of Egypt, out of the house of bondage.*" },
  { t = "p", text = "*Ques.* 44. *What doth the preface to the ten commandments teach us?*" },
  { t = "p", text = "*Ans.* The preface to the ten commandments teacheth us, that because God is the Lord, and our God and Redeemer, therefore we are bound to keep all his commandments." },
  { t = "p", text = "*Ques.* 45. *Which is the first commandment?*" },
  { t = "p", text = "*Ans.* The first commandment is, *Thou shalt have no other gods before me.*" },
  { t = "p", text = "*Ques.* 46. *What is required in the first commandment?*" },
  { t = "p", text = "*Ans.* The first commandment requireth us to know and acknowledge God, to be the only true God, and our God; and to worship and glorify him accordingly." },
  { t = "p", text = "*Ques.* 47. *What is forbidden in the first commandment?*" },
  { t = "p", text = "*Ans.* The first commandment forbiddeth the denying, or not worshiping and glorifying the true God, as God, and our God; and the giving that worship and glory to any other which is due to him alone." },
  { t = "p", text = "*Ques.* 48. *What are we specially taught by these words,* \"before me,\" *in the first commandment?*" },
  { t = "p", text = "*Ans.* These words, \"*before me*\" in the first commandment, teach us that God, who seeth all things, taketh notice of, and is much displeased with, the sin of having any other God." },
  { t = "p", text = "*Ques.* 49. *Which is the second commandment?*" },
  { t = "p", text = "*Ans.* The second commandment is, *Thou shalt not make unto thee any graven image, or any likeness of any thing that is in heaven above, or that is in the earth beneath, or that is in the water under the earth; thou shalt not bow down thyself to them, nor serve them; for I the Lord thy God am a jealous God, visiting the iniquity of the fathers upon the children, unto the third and fourth generation of them that hate me, and showing mercy unto thousands of them that love me and Jceep my commandments.*" },
  { t = "p", text = "*Ques.* 50. *What is required in the second commandment?*" },
  { t = "p", text = "*Ans.* The second commandment requireth the receiving, observing, and keeping pure and entire, all such religious worship and ordinances as God hath appointed in his Word." },
  { t = "p", text = "*Ques.* 51. *What is forbidden in the second commandment?*" },
  { t = "p", text = "*Ans.* The second commandment forbiddeth the worshiping of God by images, or any other way not appointed in his Word." },
  { t = "p", text = "*Ques.* 52. *What are the reasons annexed to the second commandment?*" },
  { t = "p", text = "*Ans.* The reasons annexed to the second commandment are, God's sovereignty over us, his propriety[^2040] in us, and the[^2041] zeal he hath to his own worship." },
  { t = "note", id = "2040", text = "London ed. of 1658 reads *property*, and *his* zeal." },
  { t = "note", id = "2041", text = "London ed. of 1658 reads *property*, and *his* zeal." },
  { t = "p", text = "*Ques.* 53. *Which is the third commandment?*" },
  { t = "p", text = "*Ans.* The third commandment is, *Thou shalt not take the name of the Lord thy God in vain: for the Lord will not hold him guiltless that taketh his name in vain.*" },
  { t = "p", text = "*Ques.* 54. *What is required in the third commandment?*" },
  { t = "p", text = "*Ans.* The third commandment requireth the holy and reverent use of God's names, titles, attributes, ordinances, word, and works." },
  { t = "p", text = "*Ques.* 55. *What is forbidden in the third commandment?*" },
  { t = "p", text = "*Ans.* The third commandment forbiddeth all profaning or abusing of any thing whereby God maketh himself known." },
  { t = "p", text = "*Ques.* 56. *What is the reason annexed to the third commandment?*" },
  { t = "p", text = "*Ans.* The reason annexed to the third commandment is, that however the breakers of this commandment may escape punishment from men, yet the Lord our God will not suffer them to escape his righteous judgment." },
  { t = "p", text = "*Ques.* 57. *Which is the fourth commandment?*" },
  { t = "p", text = "*Ans.* The fourth commandment is, *Remember the Sabbath-day to keep it holy. Six days shalt thou labor, and do all thy work: but the seventh day is the Sabbath of the Lord thy God: in it thou shalt not do any work, thou, nor thy son, nor thy daughter, thy man-servant, nor thy maid-servant, nor thy cattle, nor thy stranger that is within thy gates; for in six days the Lord made heaven and earth, the sea, and all that in them is, and rested the seventh day: wherefore the Lord blessed the Sabbath-day and hallowed it.*" },
  { t = "p", text = "*Ques.* 58. *What is required in the fourth commandment?*" },
  { t = "p", text = "*Ans.* The fourth commandment requireth the keeping holy to God such set times as he hath appointed in his Word; expressly one whole day in seven, to be a holy Sabbath to himself.[^2042]" },
  { t = "note", id = "2042", text = "1 London ed. of 1658: *unto the Lord.*" },
  { t = "p", text = "*Ques.* 59. *Which day of the seven hath God appointed to be the weekly Sabbath?*" },
  { t = "p", text = "*Ans.* From the beginning of the world to the resurrection of Christ, God[^2043] appointed the seventh day of the week to be the weekly Sabbath; and the first day of the week, ever since, to continue to the end of the world, which is the Christian Sabbath." },
  { t = "note", id = "2043", text = "London ed. of 1658 inserts *hath*." },
  { t = "p", text = "*Ques.* 60. *How is the Sabbath to be sanctified?*" },
  { t = "p", text = "*Ans.* The Sabbath is to be sanctified by a holy resting all that day, even from such worldly employments and recreations as are lawful on other days; and spending the whole time in the public and private exercises of God's worship, except so much as is to be taken up in the works of necessity and mercy." },
  { t = "p", text = "*Ques.* 61. *What is*[^2044] *forbidden in the fourth commandment?*" },
  { t = "note", id = "2044", text = "London ed. of 1658: *what are the sins*." },
  { t = "p", text = "*Ans.* The fourth commandment forbiddeth the omission,[^2045] or careless performance, of the duties required, and the profaning the day by idleness, or doing that which is in itself sinful, or by unnecessary thoughts, words, or works about our worldly employments and[^2046] recreations." },
  { t = "note", id = "2045", text = "London ed. of 1658: *the omission of careful*." },
  { t = "note", id = "2046", text = "London ed. of 1658 reads, *or*." },
  { t = "p", text = "*Ques.* 62. *What are the reasons annexed to the fourth commandment?*" },
  { t = "p", text = "*Ans.* The reasons annexed to the fourth commandment are, God's allowing us six days of the week for our own employments,[^2047] his challenging a special propriety[^2048] in the seventh, his own example, and his blessing the Sabbath-day." },
  { t = "note", id = "2047", text = "London ed. of 1658: *employment*." },
  { t = "note", id = "2048", text = "London ed. of 1658: *property*." },
  { t = "p", text = "*Ques.* 63. *Which*[^2049] *is the fifth commandment?*" },
  { t = "note", id = "2049", text = "London ed. of 1658: *what*." },
  { t = "p", text = "*Ans.* The fifth commandment is, *Honor thy father and thy mother: that thy days may be long upon the land which the Lord thy God giveth thee.*" },
  { t = "p", text = "*Ques.* 64. *What is required in the fifth commandment?*" },
  { t = "p", text = "*Ans.* The fifth commandment requireth the preserving the honor of,[^2050] and performing the duties belonging to, every one in their several places and relations, as superiors, inferiors, or equals." },
  { t = "note", id = "2050", text = "London ed. of 1658 omits *of*." },
]

[[section]]
id = "questions-65-99"
title = "Questions 65-99"
level = 1
blocks = [
  { t = "p", text = "*Ques.* 65. *What is forbidden in the fifth commandment?*" },
  { t = "p", text = "*Ans.* The fifth commandment forbiddeth the neglecting of, or doing any thing against, the honor and duty which belongeth to every one in their several places and relations." },
  { t = "p", text = "*Ques.* 66. *What is the reason annexed to the fifth commandment?*" },
  { t = "p", text = "*Ans.* The reason annexed to the fifth commandment is, a promise of long life and prosperity (as far as it shall serve for God's glory, and their own good) to all such as keep this commandment." },
  { t = "p", text = "*Ques.* 67. *Which is the sixth commandment?*" },
  { t = "p", text = "*Ans.* The sixth commandment is, *Thou shalt not kill.*" },
  { t = "p", text = "*Ques.* 68. *What is required in the sixth commandment?*" },
  { t = "p", text = "*Ans.* The sixth commandment requireth all lawful endeavors to preserve our own life, and the life of others." },
  { t = "p", text = "*Ques.* 69. *What is forbidden in the sixth commandment?*" },
  { t = "p", text = "*Ans.* The sixth commandment forbiddeth the taking away of our own life, or the life of our neighbor unjustly, or whatsoever tendeth thereunto." },
  { t = "p", text = "*Ques.* 70. *Which is the seventh commandment?*" },
  { t = "p", text = "*Ans.* The seventh commandment is, *Thou shalt not commit adultery.*" },
  { t = "p", text = "*Ques.* 71. *What is required in the seventh commandment?*" },
  { t = "p", text = "*Ans.* The seventh commandment requireth the preservation of our own and our neighbor's chastity, in heart, speech, and behavior." },
  { t = "p", text = "*Ques.* 72. *What is forbidden in the seventh commandment?*" },
  { t = "p", text = "*Ans.* The seventh commandment forbiddeth all unchaste thoughts, words, and actions." },
  { t = "p", text = "*Ques.* 73. *Which is the eighth commandment?*" },
  { t = "p", text = "*Ans.* The eighth commandment is, *Thou shalt not steal.*" },
  { t = "p", text = "*Ques.* 74 *What is required in the eighth commandment?*" },
  { t = "p", text = "*Ans.* The eighth commandment requireth the lawful procuring and furthering the wealth and outward estate of ourselves and others." },
  { t = "p", text = "*Ques.* 75. *What is forbidden in the eighth commandment?*" },
  { t = "p", text = "*Ans.* The eighth commandment forbiddeth whatsoever doth, or may, unjustly hinder our own, or our neighbor's wealth or outward estate." },
  { t = "p", text = "*Ques.* 76. *Which*[^2051] *is the ninth commandment?*" },
  { t = "note", id = "2051", text = "London ed. of 1658: *what*." },
  { t = "p", text = "*Ans.* The ninth commandment is, *Thou shalt not hear false witness against thy neighbor?*" },
  { t = "p", text = "*Ques.* 77. *What is required in the ninth commandment?*" },
  { t = "p", text = "*Ans.* The ninth commandment requireth the maintaining and promoting of truth between man and man, and of our own and our neighbor's good name, especially in witness-bearing." },
  { t = "p", text = "*Ques.* 78. *What is forbidden in the ninth commandment?*" },
  { t = "p", text = "*Ans.* The ninth commandment forbiddeth whatsoever is prejudicial to truth, or injurious to our own or our neighbor's good name." },
  { t = "p", text = "*Ques.* 79. *Which*[^2052] *is the tenth commandment?*" },
  { t = "note", id = "2052", text = "London ed. of 1658: *what*." },
  { t = "p", text = "*Ans.* The tenth commandment is, Thou shalt not covet thy neighbor's house, thou shalt not covet thy neighbor's wife, nor his man-servant, nor his maid-servant, nor his ox, nor his ass, nor any thing that is thy neighbor's." },
  { t = "p", text = "*Ques.* 80. *What is required in the tenth commandment?*" },
  { t = "p", text = "*Ans.* The tenth commandment requireth full contentment with our own condition, with a right and charitable frame of spirit toward our neighbor, and all that is his." },
  { t = "p", text = "*Ques.* 81. *What is forbidden in the tenth commandment?*" },
  { t = "p", text = "*Ans.* The tenth commandment forbiddeth all discontentment with our own estate, envying or grieving at the good of our neighbor, and all inordinate motions or[^2053] affections to any thing that is his." },
  { t = "note", id = "2053", text = "London ed. of 1658: *and*." },
  { t = "p", text = "*Ques.* 82. *Is any man able perfectly to keep the commandments of God?*" },
  { t = "p", text = "*Ans.* No mere man, since the fall, is able, in this life, perfectly to keep the commandments of God; but doth daily break them, in thought, word, and deed." },
  { t = "p", text = "*Ques.* 83. *Are all transgressions of the law equally heinous?*" },
  { t = "p", text = "*Ans.* Some sins in themselves, and by reason of several aggravations, are more heinous in the sight of God than others." },
  { t = "p", text = "*Ques.* 84. *What doth every sin deserve?*" },
  { t = "p", text = "*Ans.* Every sin deserveth God's wrath and curse, both in this life and that which is to come." },
  { t = "p", text = "*Ques.* 85. *What doth God require of us, that we may escape his wrath and curse, due to us for sin?*" },
  { t = "p", text = "*Ans.* To escape the wrath and curse of God, due to us for sin, God requireth of us faith in Jesus Christ, repentance unto life, with the diligent use of all the outward means whereby Christ communicateth to us the benefits of redemption." },
  { t = "p", text = "*Ques.* 86. *What is faith in Jesus Christ?*" },
  { t = "p", text = "*Ans.* Faith in Jesus Christ is a saving grace, whereby we receive and rest upon him alone for salvation, as he is offered to us in the gospel." },
  { t = "p", text = "*Ques.* 87. *What is repentance unto life?*" },
  { t = "p", text = "*Ans.* Repentance unto life is a saving grace, whereby a sinner, out of a[^2054] true sense of his sin, and apprehension of the mercy of God in Christ, doth, with grief and hatred of his sin, turn from it unto God, with full purpose of, and endeavor after, new obedience." },
  { t = "note", id = "2054", text = "London ed. of 1658 omits *a*." },
  { t = "p", text = "*Ques.* 88. *What are the outward and ordinary means whereby Christ communicateth to us the benefits of redemption?*" },
  { t = "p", text = "*Ans.* The outward and ordinary means whereby Christ communicateth to us the benefits of redemption, are his ordinances, especially the word, sacraments, and prayer; all which are made effectual to the elect for salvation." },
  { t = "p", text = "*Ques.* 89. *How is the word made effectual to salvation?*" },
  { t = "p", text = "*Ans.* The Spirit of God maketh the reading, but especially the preaching of the word, an effectual means of convincing and converting sinners, and of building them up in holiness and comfort through faith unto salvation." },
  { t = "p", text = "*Ques.* 90. *How is the Word to be read and heard, that it may become effectual to salvation?*" },
  { t = "p", text = "*Ans.* That the Word may become effectual to salvation, we must attend thereunto with diligence, preparation, and prayer; receive it with faith and love, lay it up in our hearts, and practice it in our lives." },
  { t = "p", text = "*Ques.* 91. *How do the sacraments become effectual means of salvation?*" },
  { t = "p", text = "*Ans.* The sacraments become effectual means of salvation, not from any virtue in them, or in him that doth administer them, but only by the blessing of Christ, and the working of his Spirit in them that by faith receive them." },
  { t = "p", text = "*Ques.* 92. *What is a sacrament?*" },
  { t = "p", text = "*Ans.* A sacrament is a holy ordinance instituted by Christ; wherein, by sensible signs, Christ and the benefits of the new covenant are represented, sealed, and applied to believers." },
  { t = "p", text = "*Ques.* 93. *Which are the sacraments of the New Testament?*" },
  { t = "p", text = "*Ans.* The sacraments of the New Testament are Baptism and the Lord's Supper." },
  { t = "p", text = "*Ques.* 94. *What is Baptism?*" },
  { t = "p", text = "*Ans.* Baptism is a sacrament, wherein the washing with water, in the name of the Father, and of the Son, and of the Holy Ghost, doth signify and seal our ingrafting into Christ and partaking of the benefits of the covenant of grace, and our engagement to be the Lord's." },
  { t = "p", text = "*Ques.* 95. *To whom is Baptism to be administered?*" },
  { t = "p", text = "*Ans.* Baptism is not to be administered to any that are out of the visible Church, till they profess their faith in Christ, and obedience to him; but the infants of such as are members of the visible church, are to be baptized." },
  { t = "p", text = "*Ques.* 96. *What is the Lord's Supper?*" },
  { t = "p", text = "*Ans.* The Lord's Supper is a sacrament, wherein, by giving and receiving bread and wine, according to Christ's appointment, his death is showed forth, and the worthy receivers are, not after a corporal and carnal manner, but by faith, made partakers of his body and blood, with all his benefits, to their spiritual nourishment and growth in grace." },
  { t = "p", text = "*Ques.* 97. *What is required to the worthy receiving of the Lord's Supper?*" },
  { t = "p", text = "*Ans.* It is required of them that would worthily partake of the Lord's Supper, that they examine *themselves of their knowledge to discern the Lord's body, of their faith to feed upon him, of their repentance, love, and new obedience; lest coming unworthily, they eat and drink judgment to themselves.*" },
  { t = "p", text = "*Ques.* 98. *What is prayer?*" },
  { t = "p", text = "*Ans.* Prayer is an offering up of our desires unto God, for things agreeable to his will, in the name of Christ, with confession of our sins, and thankful acknowledgment of his mercies." },
  { t = "p", text = "*Ques.* 99. *What rule hath God given for our direction in prayer?*" },
  { t = "p", text = "*Ans.* The whole Word of God is of use to direct us in prayer, but the special rule of direction is that form of prayer which Christ taught his disciples, commonly called, *The Lord's Prayer.*" },
]

[[section]]
id = "questions-100-107"
title = "Questions 100-107"
level = 1
blocks = [
  { t = "p", text = "*Ques.* 100. *What doth the preface of the Lord's Prayer teach us?*" },
  { t = "p", text = "*Ans.* The preface of the Lord's Prayer, which is, '*Our Father which art in heaven,*' teacheth us to draw near to God with all holy reverence and confidence, as children to a father, able[^2055] and ready to help us; and that we should pray with and for others." },
  { t = "note", id = "2055", text = "London ed. of 1658 omits *able and*." },
  { t = "p", text = "*Ques.* 101. *What do we pray for in the first petition?*" },
  { t = "p", text = "*Ans.* In the first petition, which is, '*Hallowed be thy name,*' we pray that God would enable us and others to glorify him in all that whereby he maketh himself known, and that he would dispose all things to his own glory." },
  { t = "p", text = "*Ques.* 102. *What do we pray for in the second petition?*" },
  { t = "p", text = "*Ans.* In the second petition, which is, '*Thy kingdom, come*,' we pray that Satan's kingdom may be destroyed, and that the kingdom of grace may[^2056] be advanced, ourselves and others brought into it, and kept in it, and that the kingdom of glory may be hastened." },
  { t = "note", id = "2056", text = "London ed. of 1658: *might*." },
  { t = "p", text = "*Ques.* 103. *What do we pray for in the third petition?*" },
  { t = "p", text = "*Ans.* In the third petition, which is, '*Thy will be done on earth as it is in heaven*,' we pray that God by his grace would make us able and willing to know, obey, and submit to his will in all things, as the angels do in heaven." },
  { t = "p", text = "*Ques.* 104. *What do we pray for in the fourth petition?*" },
  { t = "p", text = "*Ans.* In the fourth petition, which is, ',' we pray that of God's free gift we may receive a competent portion of the good things of this life, and enjoy his blessing with them." },
  { t = "p", text = "*Ques.* 105. *What do we pray for in the fifth petition?*" },
  { t = "p", text = "*Ans.* In the fifth petition, which is, '*And forgive us our debts as we forgive our debtors*,' we pray that God, for Christ's sake, would freely pardon all our sins; which we are the rather encouraged to ask, because by his grace we are enabled from the heart to forgive others." },
  { t = "p", text = "*Ques.* 106. *What do we pray for in the sixth petition?*" },
  { t = "p", text = "*Ans.* In the sixth petition, which is, '*And lead us not into temptation, but deliver us from evil*,' we pray that God would either keep us from being tempted to sin, or support and deliver us when we are tempted." },
  { t = "p", text = "*Ques.* 107. *What doth the conclusion of the Lord's Prayer teach us?*" },
  { t = "p", text = "*Ans.* The conclusion of the Lord's Prayer, which is, '*For thine is the kingdom, and the power and the glory forever, Amen,*' teacheth us to take our encouragement in prayer from God only, and in our prayers to praise him; ascribing kingdom, power, and glory to him; and in testimony of our desire and assurance to be heard, we say, *Amen*." },
]

[[section]]
id = "the-ten-commandments-the-lord-s-prayer-and-the-creed"
title = "The Ten Commandments, the Lord's Prayer and the Creed"
level = 1
blocks = [
  { t = "h", text = "Exodus xx." },
  { t = "p", text = "God spake all these words, saying, I am the Lord thy God, which have brought thee out of the land of Egypt, out of the house of bondage." },
  { t = "p", text = "I. Thou shalt have no other gods before me." },
  { t = "p", text = "II. Thou shalt not make unto thee any graven image, or any likeness of any thing that is in heaven above, or that is in the earth beneath, or that is in the water under the earth: thou shalt not bow down thyself to them, nor serve them: for I the Lord thy God am a jealous God, visiting the iniquity of the fathers upon the children unto the third and fourth generation of them that hate me; and showing mercy unto thousands of them that love me and keep my commandments." },
  { t = "p", text = "III. Thou shalt not take the name of the Lord thy God in vain: for the Lord will not hold him guiltless that taketh his name in vain." },
  { t = "p", text = "IV. Remember the Sabbath-day to keep it holy. Six days shalt thou labor, and do all thy work; but the seventh day is the Sabbath of the Lord thy God; in it thou shalt not do any work, thon, nor thy son: nor thy daughter, thy man-servant, nor thy maid-servant, nor thy cattle, nor thy stranger that is within thy gates; for in six days the Lord made heaven and earth, the sea, and all that in them is, and rested the seventh day; wherefore the Lord blessed the Sabbath-day, and hallowed it." },
  { t = "p", text = "V. Honor thy father and thy mother; that thy days may be long upon the land which the Lord thy God giveth thee." },
  { t = "p", text = "VI. Thou shalt not kill." },
  { t = "p", text = "VII. Thou shalt not commit adultery." },
  { t = "p", text = "VIII. Thou shalt not steal." },
  { t = "p", text = "IX. Thou shalt not bear false witness against thy neighbor." },
  { t = "p", text = "X. Thou shalt not covet thy neighbor's house, thou shalt not covet thy neighbor's wife, nor his man-servant, nor his maid-servant, nor his ox, nor his ass, nor any thing that is thy neighbor's." },
  { t = "h", text = "The Lord's Prayer." },
  { t = "h", text = "Matt. vi." },
  { t = "p", text = "Our Father which art in heaven, hallowed be thy name. Thy kingdom come. Thy will be done in earth as it is in heaven. Give us this day our daily bread. And forgive us our debts, as we forgive our debtors. And lead us not into temptation, but deliver us from evil. For thine is the kingdom, and the power, and the glory, forever. Amen." },
  { t = "h", text = "The Creed." },
  { t = "p", text = "I believe in God the Father almighty, maker of heaven and earth; and in Jesus Christ his only Son, our Lord; who[^2057] was conceived by the Holy Ghost, born of the Virgin Mary; suffered under Pontius Pilate, was crucified, dead, and buried; he descended into hell:[^2058] the third day he rose again from the dead; he ascended into heaven, and sitteth on the right hand of God the Father almighty; from thence he shall come to judge the quick and the dead. I believe in the Holy Ghost; the holy catholic church; the communion of saints; the forgiveness of sins; the resurrection of the body; and the life everlasting. Amen." },
  { t = "note", id = "2057", text = "London ed. of 1658: *which.*" },
  { t = "note", id = "2058", text = "*i. e.*, Continued in the state of the dead, and under the power of death, until the third day." },
  { t = "p", text = "The oldest editions of the Westminster Shorter Catechism have the following addendum:" },
  { t = "p", text = "So much of every Question both in the Larger and Shorter Catechism, is repeated in the Answer, as maketh every Answer an entire Proposition, or sentence in itself: to the end the Learner may further improve it upon all occasions, for his increase in knowledge and piety, even out of the course of catechising, as well as in it." },
  { t = "p", text = "And albeit the substance of the doctrine comprised in that Abridgment commonly called, *The Apostles' Creed*, be fully set forth in each of the Catechisms, so as there is no necessity of inserting the Creed itself, yet it is here annexed, not as though it were composed by the Apostles, or ought to be esteemed Canonical Scripture, as the Ten Commandments, and the Lord's Prayer (much less a Prayer, as ignorant people have been apt to make both it and the Decalogue), but because it is a brief sum of the Christian faith, agreeable to the Word of God, and anciently received in the Churches of Christ." },
  { t = "p", text = "Cornelius Burges, *Prolocutor pro tempore*." },
  { t = "p", text = "Henry Roborough, *Scriba.*" },
  { t = "p", text = "Adoniram Byfield, *Scriba.*" },
]

[[section]]
id = "text"
title = "The Nicene Creed of 325"
level = 1
blocks = [
  { t = "p", text = "We believe in one God, the Father Almighty, Maker of all things visible and invisible." },
  { t = "p", text = "And in one Lord Jesus Christ, the Son of God, begotten of the Father [^b][the only-begotten; that is, of the essence of the Father, God of God], Light of Light, very God of very God, begotten, not made, being of one substance (ὁμοούσιον) with the Father; by whom all things were made [both in heaven and on earth]; who for us men, and for our salvation, came down and was incarnate and was made man; he suffered, and the third day he rose again, ascended into heaven; from thence he shall come to judge the quick and the dead." },
  { t = "p", text = "And in the Holy Ghost." },
  { t = "p", text = "[But those who say: 'There was a time when he was not;' and 'He was not before he was made;' and 'He was made out of nothing,' or 'He is of another substance' or 'essence,' or 'The Son of God is created,' or 'changeable,' or 'alterable'—they are condemned by the holy catholic and apostolic Church.]" },
  { t = "note", id = "b", text = "Brackets as printed by Schaff, who encloses in brackets the words of the Creed of 325 that the received text of 381 omits (Vol. I, p. 28)." },
]

[[section]]
id = "greek"
title = "Greek Text"
level = 1
blocks = [
  { t = "p", text = "Πιστεύομεν εἰς ἕνα ΘΕΟΝ ΠΑΤΕΡΑ παντοκράτορα, πάντων ὁρατῶν τε καὶ ἀοράτων ποιητὴν." },
  { t = "p", text = "Καὶ εἰς ἕνα κύριον ἸΗΣΟΥΝ ΧΡΙΣΤΟΝ, τὸν υἱὸν τοῦ θεοῦ, γεννηθέντα ἐκ τοῦ πατρὸς μονογενῆ, τουτέστιν ἐκ τῆς οὐσίας τοῦ πατρός, θεὸν ἐκ θεοῦ, φῶς ἐκ φωτός, θεὸν ἀληθινὸν ἐκ θεοῦ ἀληθινοῦ, γεννηθέντα, οὐ ποιηθέντα, ὁμοούσιον τῷ πατρί· δἰ οὗ τὰ πάντα ἐγένετο, τὰ τε ἐν τῷ οὐρανῷ καὶ τὰ ἐπὶ τῆς γῆς· τὸν δἰ ἡμᾶς τοὺς ἀνθρώπους καὶ διὰ τὴν ἡμετέραν σωτηρίαν κατελθόντα καὶ σαρκωθέντα καὶ ἐνανθρωπήσαντα, παθόντα, καὶ ἀναστάντα τῇ τρίτῃ ἡμέρᾳ, καὶ ἀνελθόντα εἰς τοὺς οὐρανούς, καὶ ἐρχόμενον κρῖναι ζῶντας καὶ νεκρούς." },
  { t = "p", text = "Καὶ εἰς τὸ ἍΓΙΟΝ ΠΝΕΥΜΑ." },
  { t = "p", text = "Τοὺς δὲ λέγοντας, ὅτι ἦν ποτε ὅτε οὐκ ἦν, καὶ πρὶν γεννηθῆναι οὐκ ἦν, καὶ ὅτι ἐξ οὐκ ὄντων ἐγένετο, ἢ ἐξ ἑτέρας ὑποστάσεως ἢ οὐσίας φάσκοντας εἶναι, [ἢ κτιστόν,] τρεπτὸν ἢ ἀλλοιωτὸν τὸν υἱὸν τοῦ θεοῦ, [τούτους] ἀναθεματίζει ἡ καθολικὴ [καὶ ἀποστολικὴ] ἐκκλησία." },
]

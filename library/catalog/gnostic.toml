[[collection]]
id = "gnostic"
title = "Gnostic Texts"
order = 8
summary = "Historical documents of the Gnostic movements, which the early church examined and rejected as heresy. They are kept here so readers can see what the church answered. For the church's answer, read Irenaeus, Against Heresies (irenaeus-against-heresies). The Nag Hammadi texts have no public domain English translation and are linked, not hosted."

[authors.gnostic-anonymous]
name = "Anonymous Gnostic authors"
dates = "2nd to 4th century"
role = "Unknown writers of the Gnostic movements"
summary = "The writers of these texts are unknown. The works survive in Coptic and Syriac manuscripts and were translated into English by G. R. S. Mead in the early twentieth century."
portrait = ""
source = "https://archive.org/details/pistissophiagnos1921mead"


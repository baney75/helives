[[collection]]
id = "jewish"
title = "Josephus and Philo"
order = 4
summary = "First century Jewish writers whose histories and commentary shed light on the world of the Bible: Flavius Josephus in William Whiston's translation, and Philo of Alexandria in C. D. Yonge's translation: On the Creation, Allegorical Interpretation (Books 1 to 3), On the Cherubim, That the Worse Is Wont to Attack the Better, On the Posterity of Cain and His Exile, On the Giants, On the Unchangeableness of God, On Husbandry, Concerning Noah's Work as a Planter, On Drunkenness, On Sobriety, On the Confusion of Tongues, On the Migration of Abraham, Who Is the Heir of Divine Things, On Mating with the Preliminary Studies, On Flight and Finding, On the Change of Names, On Dreams (Books 1 and 2), On Abraham, On Joseph, On the Life of Moses (Book 1), On the Decalogue, On the Special Laws (Book 3), Every Good Man Is Free, Flaccus, Hypothetica, On Providence (Fragments 1 and 2) and On the Embassy to Gaius. They are historical sources, not Scripture."

[authors.josephus]
name = "Flavius Josephus"
dates = "37-c. 100"
role = "Jewish priest, commander in Galilee in the revolt of 66, and historian at Rome"
summary = "Born Joseph son of Matthias to a priestly family in Jerusalem, he commanded Jewish forces in Galilee, surrendered to Vespasian in 67 and wrote his histories in Greek at Rome under Flavian patronage."
portrait = ""
source = "https://gutenberg.pglaf.org/2/8/4/2846/2846-h/2846-h.htm"

[authors.philo]
name = "Philo of Alexandria"
dates = "c. 20 BC-c. AD 50"
role = "Jewish philosopher and biblical interpreter at Alexandria"
summary = "A leader of the Jewish community of Alexandria who wrote in Greek, interpreting the books of Moses through allegory and Greek philosophy. In 39 or 40 he led the Jewish embassy to the emperor Gaius."
portrait = ""
source = "https://www.ccel.org/ccel/philo/works"

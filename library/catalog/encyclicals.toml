[[collection]]
id = "encyclicals"
title = "Papal Encyclicals"
order = 9
summary = "The encyclical letters of the popes from Benedict XIV (1740) to the present, indexed in data/encyclicals.toml. Most are linked to their pages on the Vatican's website, which holds the copyright in its modern translations. A subset is hosted here in full from public domain English translations printed before 1931."

